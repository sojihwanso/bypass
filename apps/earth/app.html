<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>기후 3D 모델</title>
<link rel="icon" href="data:,">
<meta name="description" content="바다가 일으키는 기후 연쇄 작용을 3D 지구본으로 살펴보는 교육용 웹앱">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --abyss:#030A17;
  --glass:rgba(12,26,46,.56);
  --glass-strong:rgba(14,30,54,.78);
  --line:rgba(170,205,235,.16);
  --ink:#EAF2F8;
  --mist:#9DB1C6;
  --faint:#6F86A0;
  --shallow:#5CC6CC;
  --ember:#F2A04E;
  --alarm:#EC5B4F;
  --radius-l:18px;
  --radius-m:12px;
  --radius-s:9px;
  --fs-xs:12px; --fs-s:13.5px; --fs-m:15px; --fs-l:18px; --fs-xl:24px; --fs-xxl:36px;
  --dock-h:132px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--abyss);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  -webkit-font-smoothing:antialiased;word-break:keep-all;line-height:1.55}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--shallow);outline-offset:2px;border-radius:var(--radius-s)}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}

.glass{background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
  border-radius:var(--radius-l)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:var(--radius-m);
  background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:var(--fs-s);font-weight:600;
  transition:background .2s,border-color .2s}
.btn:hover{background:rgba(255,255,255,.12)}
.label-short{display:none}
.btn.primary{background:rgba(92,198,204,.16);border-color:rgba(92,198,204,.5)}
.btn.primary:hover{background:rgba(92,198,204,.26)}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn .swatch{width:9px;height:9px;border-radius:3px;background:var(--c,#fff)}

/* 상단 바 */
#topbar{position:fixed;top:14px;left:14px;right:14px;display:flex;align-items:center;gap:10px;z-index:20;pointer-events:none}
#topbar>*{pointer-events:auto}
.brand{padding:9px 16px;display:flex;flex-direction:column;line-height:1.25}
.brand b{font-size:var(--fs-m);font-weight:700;letter-spacing:-.01em}
.brand span{font-size:var(--fs-xs);color:var(--mist)}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;padding:6px}
.version{font-size:var(--fs-xs);color:var(--mist);padding:0 10px;min-height:38px;border-radius:var(--radius-m);font-variant-numeric:tabular-nums}
.version:hover{color:var(--ink)}
.bp-link{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:var(--radius-m);transition:background .2s}
.bp-link:hover{background:rgba(255,255,255,.1)}
.bp-link:focus-visible{outline:2px solid var(--shallow);outline-offset:2px}

/* 좌측 시나리오 */
#scenarios{position:fixed;left:14px;top:96px;width:250px;padding:16px;z-index:10;transition:transform .35s ease,opacity .35s;display:flex;flex-direction:column;max-height:calc(100vh - 96px - var(--dock-h) - 48px)}
#scenarios .scn-list{overflow:auto;min-height:0;scrollbar-width:thin}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.panel-head h2{font-size:var(--fs-m);font-weight:700;letter-spacing:-.01em}
.collapse{width:30px;height:30px;border-radius:var(--radius-s);display:grid;place-items:center;color:var(--mist);font-size:16px}
.collapse:hover{background:rgba(255,255,255,.08);color:var(--ink)}
.scn-list{display:flex;flex-direction:column;gap:8px}
.scn{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:11px 12px;border-radius:var(--radius-m);
  border:1px solid transparent;background:rgba(255,255,255,.035);transition:background .2s,border-color .2s}
.scn:hover{background:rgba(255,255,255,.08)}
.scn[aria-pressed="true"]{border-color:color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent)}
.scn .swatch{flex:none;width:10px;height:28px;border-radius:4px;background:var(--c);margin-top:2px}
.scn b{display:block;font-size:var(--fs-s);font-weight:650;line-height:1.35}
.scn small{display:block;font-size:var(--fs-xs);color:var(--mist);margin-top:2px;line-height:1.4}

/* 우측 설명 */
#explain{position:fixed;right:14px;top:96px;width:340px;max-height:calc(100vh - 96px - var(--dock-h) - 40px);
  display:flex;flex-direction:column;padding:16px;z-index:10;transition:transform .35s ease,opacity .35s}
.level{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:var(--radius-m);background:rgba(0,0,0,.25);border:1px solid var(--line);margin-bottom:16px}
.level button{min-height:40px;border-radius:var(--radius-s);font-size:var(--fs-s);font-weight:600;color:var(--mist);line-height:1.2;padding:4px 6px}
.level button small{display:block;font-size:11px;font-weight:500;opacity:.8}
.level button[aria-checked="true"]{background:rgba(234,242,248,.14);color:var(--ink)}
.explain-body{overflow:auto;padding-right:4px;scrollbar-width:thin}
.explain-body h3{font-size:var(--fs-l);font-weight:700;letter-spacing:-.015em;line-height:1.35;margin-bottom:8px}
.explain-body p{font-size:var(--fs-m);color:#D3DEE9;margin-bottom:12px;max-width:34em}
.explain-body .note{font-size:var(--fs-s);color:var(--mist);padding:10px 12px;border-radius:var(--radius-m);background:rgba(255,255,255,.04);border:1px solid var(--line)}
.chain{list-style:none;counter-reset:c;margin:4px 0 14px;display:flex;flex-direction:column;gap:6px}
.chain li{counter-increment:c;position:relative;padding:8px 10px 8px 38px;border-radius:var(--radius-s);background:rgba(255,255,255,.04);font-size:var(--fs-s);color:#D3DEE9}
.chain li::before{content:counter(c);position:absolute;left:10px;top:8px;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;background:color-mix(in srgb,var(--c,#5CC6CC) 30%,transparent);color:var(--ink)}
.temp-now{margin-top:6px;padding-top:14px;border-top:1px solid var(--line)}
.temp-now h4{font-size:var(--fs-s);font-weight:700;color:var(--mist);margin-bottom:6px}
.temp-now p{font-size:var(--fs-s)}

/* 하단 온도 리본 */
#dock{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);width:min(1180px,calc(100vw - 28px));
  padding:16px 20px 14px;display:grid;grid-template-columns:150px 1fr;gap:6px 26px;align-items:center;z-index:15}
.readout b{display:block;font-size:var(--fs-xxl);font-weight:750;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;color:var(--tcol,#EAF2F8);transition:color .3s}
.readout span{display:block;font-size:var(--fs-xs);color:var(--mist);margin-top:6px}
.ribbon-wrap{position:relative;padding:20px 0 26px}
.ribbon{position:absolute;left:0;right:0;top:20px;height:12px;border-radius:7px;
  background:linear-gradient(90deg,#3E86C9 0%,#5CC6CC 33%,#E6C66A 50%,#F2A04E 66.6%,#EC5B4F 83.3%,#B9343F 100%)}
.ribbon-dim{position:absolute;top:0;right:0;bottom:0;border-radius:0 7px 7px 0;background:rgba(3,10,23,.68);transition:width .08s}
.tick{position:absolute;top:0;transform:translateX(-50%);font-size:11px;color:var(--mist);white-space:nowrap;text-align:center;line-height:1.2;pointer-events:none}
.tick::before{content:"";display:block;width:1px;height:18px;margin:16px auto 4px;background:rgba(234,242,248,.55)}
.tick.th::before{height:20px;width:2px;background:rgba(234,242,248,.85)}
.tick.now{top:-6px;display:flex;flex-direction:column;align-items:center;color:var(--shallow);font-weight:600}
.tick.now::before{order:2;margin:2px auto 0;height:14px;background:var(--shallow)}
input[type=range]{position:relative;z-index:2;-webkit-appearance:none;appearance:none;width:100%;height:12px;background:transparent;margin:0;display:block;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:12px;background:transparent}
input[type=range]::-moz-range-track{height:12px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-6px;border-radius:8px;background:#F4F8FB;border:3px solid var(--tcol,#5CC6CC);box-shadow:0 2px 10px rgba(0,0,0,.45)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:8px;background:#F4F8FB;border:3px solid var(--tcol,#5CC6CC)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid var(--shallow);outline-offset:2px}
.indicators{grid-column:1/-1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;padding-top:4px;border-top:1px solid var(--line)}
.imp{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:8px 6px 7px;border-radius:var(--radius-m);background:rgba(255,255,255,.035);cursor:help;outline-offset:1px}
.imp:hover,.imp:focus-visible{background:rgba(255,255,255,.08)}
.imp .art{width:46px;height:46px;flex:none}
.imp .art svg{width:100%;height:100%;display:block;overflow:visible}
.imp .art svg *{transition:transform .35s ease,opacity .35s ease,fill .35s ease}
.imp .txt span{display:block;font-size:11px;color:var(--mist);line-height:1.3;min-height:2.6em}
.imp .txt b{display:block;font-size:var(--fs-s);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.imp .txt small{display:block;font-size:10.5px;color:var(--faint);line-height:1.3}
.imp .tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,4px);width:220px;padding:10px 12px;border-radius:var(--radius-m);background:var(--glass-strong);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:12.5px;line-height:1.5;color:#D3DEE9;text-align:left;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:5}
.imp .tip b{display:block;font-size:12.5px;color:var(--ink);margin-bottom:2px}
.imp:hover .tip,.imp:focus .tip{opacity:1;transform:translate(-50%,0)}
.imp:first-child .tip{left:0;transform:translate(0,4px)}.imp:first-child:hover .tip,.imp:first-child:focus .tip{transform:translate(0,0)}
.imp:nth-child(8) .tip{left:auto;right:0;transform:translate(0,4px)}.imp:nth-child(8):hover .tip,.imp:nth-child(8):focus .tip{transform:translate(0,0)}
.src{grid-column:1/-1;font-size:11px;color:var(--faint);text-align:right}
@media (max-width:1180px){.indicators{grid-template-columns:repeat(4,minmax(0,1fr))}.imp{flex-direction:row;text-align:left;gap:8px}.imp .txt span{min-height:0}.imp:nth-child(4) .tip{left:auto;right:0;transform:translate(0,4px)}.imp:nth-child(5) .tip{left:0;transform:translate(0,4px)}}
#footver{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:15;font-size:11.5px;color:var(--faint);min-height:22px;padding:0 10px;border-radius:var(--radius-s)}
#footver:hover{color:var(--mist)}

/* 한반도 핀 */
#pin{position:fixed;left:0;top:0;z-index:8;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;transition:opacity .25s}
#pin .tag{padding:6px 11px;border-radius:var(--radius-m);background:var(--glass-strong);border:1px solid rgba(92,198,204,.55);font-size:var(--fs-s);font-weight:650;white-space:nowrap;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#pin .stem{width:2px;height:16px;background:linear-gradient(var(--shallow),transparent)}
#pin.hidden{opacity:0;pointer-events:none}
#pin:hover .tag{background:rgba(92,198,204,.3)}

/* 안내 배지, 토스트 */
#hint{position:fixed;left:50%;bottom:calc(var(--dock-h) + 52px);transform:translateX(-50%);z-index:12;padding:11px 18px;font-size:var(--fs-s);font-weight:550;
  text-align:center;max-width:calc(100vw - 32px);transition:opacity .6s, transform .6s}
#hint.gone{opacity:0;transform:translate(-50%,8px);pointer-events:none}
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-12px);z-index:30;width:min(520px,calc(100vw - 28px));padding:14px 18px 14px 16px;
  display:flex;gap:14px;align-items:flex-start;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;
  background:rgba(40,16,14,.72);border-color:rgba(236,91,79,.5)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast .deg{flex:none;font-size:var(--fs-xl);font-weight:750;color:var(--tc,#EC5B4F);line-height:1.1;font-variant-numeric:tabular-nums}
#toast b{display:block;font-size:var(--fs-m);font-weight:700;margin-bottom:2px}
#toast p{font-size:var(--fs-s);color:#E8D6D2}
#toast .x{margin-left:auto;flex:none;width:28px;height:28px;border-radius:var(--radius-s);color:#E8D6D2}

/* 모달 */
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(2,6,14,.55);padding:16px}
.modal.open{display:grid}
.modal .box{width:min(460px,100%);max-height:80vh;overflow:auto;padding:22px;background:var(--glass-strong)}
.modal h3{font-size:var(--fs-l);margin-bottom:6px}
.modal p{font-size:var(--fs-s);color:#D3DEE9;margin-bottom:14px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#egg-main{text-align:center}
#egg-main .row{justify-content:center;margin-top:16px}
.egg-art{width:100%;max-width:280px;height:auto;display:block;margin:0 auto 10px;border-radius:10px}
.egg-ver{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:600}
.modal h3.egg-made{font-size:20px;font-weight:800;margin:4px 0 0}
.notes{list-style:none;margin:6px 0 16px;display:flex;flex-direction:column;gap:12px}
.notes li b{display:block;font-size:var(--fs-s)}
.notes li span{display:block;font-size:var(--fs-xs);color:var(--mist);margin-bottom:4px}
.notes li ul{padding-left:18px;font-size:var(--fs-s);color:#D3DEE9}

/* 로딩·오류 */
#loading{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--abyss);transition:opacity .8s}
#loading.done{opacity:0;pointer-events:none}
#loading div{text-align:center}
#loading b{display:block;font-size:var(--fs-l);font-weight:650}
#loading span{display:block;font-size:var(--fs-s);color:var(--mist);margin-top:6px}

.reopen{position:fixed;z-index:9;top:96px;display:none}
.reopen.show{display:inline-flex}
#reopen-left{left:14px}
#reopen-right{right:14px}
#scenarios.closed{transform:translateX(calc(-100% - 20px));opacity:0;pointer-events:none}
#explain.closed{transform:translateX(calc(100% + 20px));opacity:0;pointer-events:none}

/* ── 2단계: 단계 추적기·단면도·라벨·인사이트 ── */
.mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px;border-radius:var(--radius-m);background:rgba(0,0,0,.22);border:1px solid var(--line);margin:2px 0 12px}
.mode-switch button{min-height:32px;border-radius:var(--radius-s);font-size:var(--fs-s);font-weight:600;color:var(--mist)}
.mode-switch button[aria-pressed="true"]{background:rgba(234,242,248,.14);color:var(--ink)}
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 8px}
.stepper button{position:relative;min-height:52px;padding:6px 6px 8px;border-radius:var(--radius-m);background:rgba(255,255,255,.045);border:1px solid var(--line);text-align:left;line-height:1.25;overflow:hidden}
.stepper button b{display:block;font-size:var(--fs-s);font-weight:700}
.stepper button small{display:block;font-size:11px;color:var(--mist)}
.stepper button[aria-pressed="true"]{border-color:color-mix(in srgb,var(--c) 75%,transparent);background:color-mix(in srgb,var(--c) 16%,transparent)}
.stepper button .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--c)}
.stepper button.playing .bar{animation:stepbar var(--step-ms,7000ms) linear forwards}
@keyframes stepbar{to{width:100%}}
.step-tools{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.step-tools .btn{min-height:32px;font-size:12.5px}
.step-text{padding:10px 12px;border-radius:var(--radius-m);background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:12px}
.step-text h4{font-size:var(--fs-s);font-weight:700;margin-bottom:4px}
.step-text p{font-size:var(--fs-s);margin:0;color:#D3DEE9}
.section{margin:0 0 6px;padding:8px;border-radius:var(--radius-m);background:rgba(4,12,26,.55);border:1px solid var(--line)}
.section svg{display:block;width:100%;height:auto}
.section-cap{font-size:12px;color:var(--mist);margin:0 0 12px}
.topics{display:flex;flex-direction:column;gap:8px;margin:4px 0 12px}
.topic{padding:10px 12px;border-radius:var(--radius-m);background:rgba(255,255,255,.04);border-left:3px solid var(--c,#5CC6CC)}
.topic h4{font-size:var(--fs-s);font-weight:700;margin-bottom:3px}
.topic p{font-size:var(--fs-s);margin:0;color:#D3DEE9}
.link-btn{display:inline-flex;margin-top:12px;font-size:var(--fs-s);font-weight:600;color:var(--shallow);text-decoration:underline;text-underline-offset:3px}
#labels{position:fixed;inset:0;pointer-events:none;z-index:7}
.fx-label{position:absolute;left:0;top:0;padding:4px 9px 4px 8px;border-radius:8px;background:rgba(10,22,40,.78);border:1px solid var(--line);border-left:3px solid var(--c,#5CC6CC);font-size:12px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity .4s;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.fx-label.show{opacity:1}
.insight-box{width:min(620px,100%)!important;max-height:86vh!important}
.insight-box .key{font-size:var(--fs-l);font-weight:700;line-height:1.5;margin:6px 0 14px;letter-spacing:-.01em}
.insight-box h4{font-size:var(--fs-s);font-weight:700;color:var(--mist);margin:14px 0 6px}
.insight-box ul{padding-left:18px;font-size:var(--fs-s);color:#D3DEE9;display:flex;flex-direction:column;gap:5px}
.insight-box .cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.insight-box .close-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}
.insight-box .close-row p{margin:0;font-size:var(--fs-s);color:var(--mist)}
@media (max-width:600px){.insight-box .cols{grid-template-columns:1fr}.brand{display:none!important}}
@media (prefers-reduced-motion:reduce){.stepper button.playing .bar{animation:none;width:100%}}

/* ── v3: 탭, 지역 목록 카드, 현상 패널 ── */
.left-tabs{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;border-radius:var(--radius-m);background:rgba(0,0,0,.22);border:1px solid var(--line);flex:1}
.left-tab{min-height:32px;border-radius:var(--radius-s);font-size:12.5px;font-weight:650;color:var(--mist)}
.left-tab[aria-selected="true"]{background:rgba(234,242,248,.14);color:var(--ink)}
.scn-list[hidden]{display:none!important}
.phen-list{overflow:auto;scrollbar-width:thin}
.ph-row{align-items:center}
.ph-ic{flex:none;display:inline-block;width:28px;height:28px}
.ph-ic svg{width:100%;height:100%;display:block}
#region-pop{position:fixed;z-index:25;width:min(300px,calc(100vw - 24px));max-height:min(440px,calc(100vh - 100px));overflow:auto;padding:12px;display:none;background:var(--glass-strong)}
#region-pop.show{display:block}
.pop-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.pop-head b{display:block;font-size:var(--fs-m)}
.pop-head small{display:block;font-size:12px;color:var(--mist);line-height:1.4}
.pop-list{display:flex;flex-direction:column;gap:4px}
.pop-item{display:flex;gap:10px;align-items:center;text-align:left;padding:7px 8px;border-radius:var(--radius-m);background:rgba(255,255,255,.04)}
.pop-item:hover,.pop-item:focus-visible{background:rgba(242,160,78,.16)}
.pop-item b{display:block;font-size:var(--fs-s)}
.pop-item small{display:block;font-size:11.5px;color:var(--mist);line-height:1.35}
.ph-title{display:flex;align-items:center;gap:10px}
.ph-title .ph-ic{width:34px;height:34px}
.ph-sub{font-size:var(--fs-s);font-weight:700;color:var(--mist);margin:14px 0 6px}
.ph-chips{display:flex;flex-wrap:wrap;gap:6px}
.ph-chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:3px 10px 3px 4px;border-radius:var(--radius-m);background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12.5px;font-weight:600}
.ph-chip .ph-ic{width:24px;height:24px}
.ph-chip[aria-pressed="true"]{border-color:rgba(242,160,78,.7);background:rgba(242,160,78,.14)}

/* ── 세로가 짧은 데스크톱 화면 (16:9 노트북·모니터의 실제 브라우저 높이) ── */
@media (min-width:901px) and (max-height:900px){
  #dock{padding:12px 18px 10px;gap:4px 22px}
  .readout b{font-size:30px}
  .ribbon-wrap{padding:16px 0 22px}
  .ribbon{top:16px}
  .imp{padding:6px 6px 6px}
  .imp .art{width:38px;height:38px}
  .imp .txt small{display:none}
}
@media (min-width:901px) and (max-height:760px){
  #topbar{top:10px}
  #scenarios,#explain{top:80px}
  .reopen{top:80px}
  #scenarios{padding:12px;max-height:calc(100vh - 80px - var(--dock-h) - 44px)}
  #explain{padding:12px;max-height:calc(100vh - 80px - var(--dock-h) - 44px)}
  #dock{bottom:30px;padding:10px 16px 8px}
  #footver{bottom:5px;min-height:20px}
  .readout b{font-size:26px}
  .readout span{margin-top:3px}
  .indicators{display:flex!important;overflow-x:auto;scrollbar-width:thin;scrollbar-color:rgba(170,205,235,.25) transparent;gap:6px;padding-top:6px;padding-bottom:4px}
  .indicators::-webkit-scrollbar{height:4px}
  .indicators::-webkit-scrollbar-thumb{background:rgba(170,205,235,.25);border-radius:4px}
  .indicators::-webkit-scrollbar-track{background:transparent}
  .indicators .src{flex:0 0 auto;align-self:center;white-space:nowrap;padding:0 6px}
  .imp{align-self:flex-start}
  .imp{flex:0 0 154px;flex-direction:row!important;text-align:left!important;align-items:center;gap:8px!important;padding:5px 8px}
  .imp .art{width:30px;height:30px}
  .imp .txt span{min-height:0!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:104px}
  .imp .txt b{font-size:12.5px}
  .imp .tip{position:fixed;left:50%!important;right:auto!important;bottom:calc(100% + 8px);top:auto;transform:translate(-50%,0)!important;width:300px}
  .scn{padding:8px 10px}
  .scn small{display:none}
  .level{margin-bottom:10px}
  .level button{min-height:34px}
}
@media (min-width:901px) and (max-height:640px){
  .src{display:none}
  .brand span{display:none}
  .left-tab,.btn{min-height:32px}
}

/* 좁은 화면 */
@media (max-width:900px){
  :root{--dock-h:250px}
  .brand span{display:none}
  .top-actions .label-long{display:none}
  .top-actions .label-short{display:inline}
  .brand{padding:8px 12px}
  .brand b{font-size:var(--fs-s);white-space:nowrap}
  .top-actions{padding:4px;gap:4px}
  .top-actions .btn{padding:0 10px}
  .version{padding:0 6px}
  .bp-link{width:32px;height:32px}
  .bp-link svg{width:20px;height:20px}
  #scenarios{top:auto;left:14px;right:14px;width:auto;bottom:calc(var(--dock-h) + 40px);padding:8px;max-height:none}
  #scenarios .panel-head{margin-bottom:6px}
  #scenarios .collapse{display:none}
  .left-tab{min-height:28px}
  .scn-list{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .scn{flex:none;width:200px;padding:9px 10px}
  .scn small{display:none}
  #explain{top:76px;left:14px;right:14px;width:auto;max-height:36vh;padding:12px}
  #explain.closed{transform:translateY(calc(-100% - 90px))}
  #reopen-right{top:76px}
  #reopen-left{display:none!important}
  #dock{grid-template-columns:1fr;gap:6px;padding:12px 14px 10px;bottom:30px}
  .readout{display:flex;align-items:baseline;gap:10px}
  .readout b{font-size:28px}
  .readout span{margin:0}
  .indicators{display:flex;overflow-x:auto;scrollbar-width:none;gap:6px;padding-bottom:2px}
  .imp{flex:none;width:150px;padding:6px 8px}
  .imp .art{width:38px;height:38px}
  .imp .tip{position:fixed;left:14px!important;right:14px!important;bottom:calc(var(--dock-h) + 40px);width:auto;transform:none!important}
  #hint{bottom:calc(var(--dock-h) + 110px)}
}
@media (max-width:900px) and (max-height:760px){
  .src{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="stage" aria-label="3D 지구본. 끌어서 돌리고, 휠이나 두 손가락으로 확대할 수 있습니다." role="img"></div>

<div id="loading" role="status"><div><b>지구를 그리는 중</b><span id="loading-step">대륙 윤곽을 불러오고 있어요</span></div></div>

<header id="topbar">
  <div class="brand glass"><b>기후 3D 모델</b><span>바다에서 시작되는 기후의 연결고리</span></div>
  <div class="top-actions glass">
    <button class="btn primary" id="btn-korea" type="button"><span class="swatch" style="--c:#5CC6CC"></span><span class="label-long">한반도 체감 영향 보기</span><span class="label-short">한반도</span></button>
    <button class="btn" id="btn-reset" type="button"><span class="label-long">전체 보기</span><span class="label-short">전체</span></button>
    <button class="btn" id="btn-insight" type="button"><span class="label-long">기후 인사이트</span><span class="label-short">인사이트</span></button>
    <button class="btn" id="btn-sound" type="button" aria-pressed="false"><span class="label-long">사운드 꺼짐</span><span class="label-short">소리 꺼짐</span></button>
    <button class="version" id="ver-top" type="button" aria-label="버전 3.2.2">v3.2.2</button>
    <a class="bp-link" href="https://teambypass.vercel.app/" target="_top" rel="noopener" aria-label="BYPASS 사이트로 가기" title="BYPASS 사이트로 가기"><svg width="24" height="24" viewBox="1 1 130 130" aria-hidden="true"><path d="M66 4 L128 66 L66 128 L4 66 Z" fill="#EE6A1F" stroke="#1C211E" stroke-width="5" stroke-linejoin="round"/><path d="M66 15 L117 66 L66 117 L15 66 Z" fill="none" stroke="#1C211E" stroke-width="5" stroke-linejoin="round"/><g transform="translate(34 32) scale(0.64)" fill="#1C211E"><ellipse cx="44" cy="60" rx="27" ry="23"/><path d="M51 45 C55 37 58 31 61 25 L72 30 C68 36 66 44 64 53 Z"/><circle cx="66" cy="26" r="10"/><path d="M72 20 C83 19 93 24 95 32 C96 38 91 41 88 37 C86 34 82 33 74 33 Z"/><path d="M19 52 C10 47 7 40 11 34 C14 43 20 46 23 46 Z"/><path d="M37 80 L35 92 L27 95 L41 95 L42 81 Z"/><path d="M51 80 L51 92 L44 95 L58 95 L56 81 Z"/></g></svg></a>
  </div>
</header>

<button class="btn reopen glass" id="reopen-left" type="button">시나리오 열기</button>
<button class="btn reopen glass" id="reopen-right" type="button">설명 열기</button>

<nav id="scenarios" class="glass" aria-label="시나리오">
  <div class="panel-head"><div class="left-tabs" role="tablist" aria-label="왼쪽 메뉴"><button class="left-tab" type="button" role="tab" data-tab="scn" aria-selected="true">바다 이야기</button><button class="left-tab" type="button" role="tab" data-tab="phen" aria-selected="false">기상현상 도감</button></div><button class="collapse" id="close-left" type="button" aria-label="왼쪽 패널 접기">‹</button></div>
  <div class="scn-list" id="scn-list"></div>
  <div class="scn-list phen-list" id="phen-list" hidden></div>
</nav>

<aside id="explain" class="glass" aria-label="설명">
  <div class="panel-head" style="margin-bottom:10px"><h2>설명</h2><button class="collapse" id="close-right" type="button" aria-label="설명 패널 접기">›</button></div>
  <div class="level" role="radiogroup" aria-label="설명 난이도">
    <button type="button" role="radio" data-level="easy" aria-checked="true">쉬운 설명<small>초·중등</small></button>
    <button type="button" role="radio" data-level="deep" aria-checked="false">심화 설명<small>일반·고등</small></button>
  </div>
  <div class="explain-body" id="explain-body" aria-live="polite"></div>
</aside>

<section id="dock" class="glass" aria-label="지구 온도 상승 시뮬레이션">
  <div class="readout"><b id="t-read">+1.3°C</b><span id="t-sub">산업화 이전보다 오른 온도</span></div>
  <div class="ribbon-wrap" id="ribbon-wrap">
    <div class="ribbon"><div class="ribbon-dim" id="ribbon-dim"></div></div>
    <input id="temp" type="range" min="0" max="3" step="0.1" value="1.3" aria-label="산업화 이전 대비 지구 평균 기온 상승폭" aria-valuetext="+1.3도">
    <div id="ticks"></div>
  </div>
  <div class="indicators" id="indicators"></div>
</section>
<button id="footver" type="button" aria-label="버전 3.2.2">v3.2.2</button>

<button id="pin" type="button" class="hidden" aria-label="한반도 체감 영향 보기"><span class="tag">한반도</span><span class="stem"></span></button>
<div id="hint" class="glass" role="note">지구를 돌리거나 아래 시나리오를 눌러 바다와 기후의 연결고리를 확인하세요. 지구의 바다나 땅을 누르면 그곳의 기상현상을 볼 수 있어요</div>

<div id="toast" class="glass" role="alert" aria-live="assertive">
  <div class="deg" id="toast-deg">+1.5°C</div>
  <div><b id="toast-title"></b><p id="toast-body"></p></div>
  <button class="x" id="toast-x" type="button" aria-label="경고 닫기">✕</button>
</div>

<div class="modal" id="insight" role="dialog" aria-modal="true" aria-labelledby="insight-title">
  <div class="box glass insight-box" id="insight-box"></div>
</div>

<div id="labels" aria-hidden="true"></div>
<div id="region-pop" class="glass" role="dialog" aria-label="이 지역의 기상현상"></div>

/* 지표 (IPCC AR6 / SR1.5 기준 추정) */
function lerpTable(tab, t){ // tab: [[t, v...], ...]
  if (t <= tab[0][0]) return tab[0].slice(1);
  for (let i=1;i<tab.length;i++){ if (t <= tab[i][0]){ const a=tab[i-1], b=tab[i], k=(t-a[0])/(b[0]-a[0]); return a.slice(1).map((v,j)=>v+(b[j+1]-v)*k); } }
  return tab[tab.length-1].slice(1);
}

function latLonToVec3(lat, lon, r=1){
  const phi = (lon + 180) * Math.PI/180, theta = (90 - lat) * Math.PI/180;
  return new THREE.Vector3(-r*Math.cos(phi)*Math.sin(theta), r*Math.cos(theta), r*Math.sin(phi)*Math.sin(theta));
}

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function periodicNoise(w, h, octaves, seed, baseX=6, baseY=3){
  const out = new Float32Array(w*h), rnd = mulberry32(seed);
  let amp = 1, total = 0;
  for (let o=0;o<octaves;o++){
    const gx = baseX<<o, gy = baseY<<o, grid = new Float32Array(gx*(gy+1));
    for (let i=0;i<grid.length;i++) grid[i] = rnd();
    for (let y=0;y<h;y++){
      const fy = y/h*gy, y0 = fy|0, ty0 = fy-y0, ty = ty0*ty0*(3-2*ty0), y1 = Math.min(y0+1, gy);
      const r0 = y0*gx, r1 = y1*gx, row = y*w;
      for (let x=0;x<w;x++){
        const fx = x/w*gx, x0 = fx|0, tx0 = fx-x0, tx = tx0*tx0*(3-2*tx0), x1 = (x0+1)%gx;
        const a = grid[r0+x0]+(grid[r0+x1]-grid[r0+x0])*tx, b = grid[r1+x0]+(grid[r1+x1]-grid[r1+x0])*tx;
        out[row+x] += (a+(b-a)*ty)*amp;
      }
    }
    total += amp; amp *= 0.52;
  }
  for (let i=0;i<out.length;i++) out[i] /= total;
  return out;
}

function blurField(src, factor, outW, outH){
  let cur = src, w = src.width, h = src.height;
  while (w/2 >= src.width/factor){ const c = canvas(Math.max(1,w/2|0), Math.max(1,h/2|0)); const g=c.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(cur,0,0,c.width,c.height); cur=c; w=c.width; h=c.height; }
  while (w*2 <= outW){ const c = canvas(w*2, h*2); const g=c.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(cur,0,0,c.width,c.height); cur=c; w=c.width; h=c.height; }
  const c = canvas(outW,outH), g=c.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(cur,0,0,outW,outH);
  const d = g.getImageData(0,0,outW,outH).data, f = new Float32Array(outW*outH);
  for (let i=0;i<f.length;i++) f[i] = d[i*4]/255;

async function buildTextures(W, step){
  const H = W/2, w2 = W/2, h2 = H/2;
  step('대륙 윤곽을 그리는 중'); console.debug('[tex]', '대륙 윤곽을 그리는 중', Math.round(performance.now()));
  // 1) 육지 마스크
  const mc = canvas(W,H), mg = mc.getContext('2d');
  mg.fillStyle='#000'; mg.fillRect(0,0,W,H); mg.fillStyle='#fff'; mg.beginPath();
  // 경도 180°를 넘는 링은 경도를 이어 붙인 뒤(언랩) -360/0/+360 세 번 그린다.
  // 극을 감싸는 링(남극)은 극까지 내려가 닫는다.
  // 해안선 윤곽 캔버스 (안티그래비티 버전에서 가져온 또렷한 해안선)
  const cc = canvas(W,H), cg = cc.getContext('2d');
  cg.fillStyle='#000'; cg.fillRect(0,0,W,H); cg.beginPath();
  for (const r of window.LAND_RINGS){
    const pts = []; let off = 0, prev = r[0], latSum = 0;
    for (let i=0;i<r.length;i+=2){ let lon = r[i]; if (i){ const d = lon - prev; if (d > 180) off -= 360; else if (d < -180) off += 360; } prev = lon; pts.push(lon+off, r[i+1]); latSum += r[i+1]; }
    const span = pts[pts.length-2] - pts[0], polar = Math.abs(span) > 300, coastN = pts.length;
    if (polar){ const pole = latSum < 0 ? -90 : 90; pts.push(pts[pts.length-2], pole, pts[0], pole); }
    for (const shift of [-360, 0, 360]){
      for (let i=0;i<pts.length;i+=2){ const x=(pts[i]+shift+180)/360*W, y=(90-pts[i+1])/180*H; i?mg.lineTo(x,y):mg.moveTo(x,y); }
      mg.closePath();
      // 윤곽선은 실제 해안만 (극으로 닫는 보조선 제외)
      for (let i=0;i<coastN;i+=2){ const x=(pts[i]+shift+180)/360*W, y=(90-pts[i+1])/180*H; i?cg.lineTo(x,y):cg.moveTo(x,y); }
      if (!polar) cg.closePath();
    }
  }
  mg.fill('evenodd');
  cg.strokeStyle='#fff'; cg.lineJoin='round'; cg.lineWidth = Math.max(1.4, W/4096*2.4); cg.stroke();
  // 은은한 번짐 한 겹
  { const s = canvas(W/4|0, H/4|0), g = s.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(cc,0,0,s.width,s.height);
    cg.globalCompositeOperation='lighter'; cg.globalAlpha=0.28; cg.imageSmoothingQuality='high'; cg.drawImage(s,0,0,W,H); cg.globalAlpha=1; cg.globalCompositeOperation='source-over'; }
  const maskFull = mg.getImageData(0,0,W,H).data;
  await nextFrame();
  step('바다 깊이를 계산하는 중'); console.debug('[tex]', '바다 깊이를 계산하는 중', Math.round(performance.now()));
  const near = blurField(mc, 24, w2, h2);    // 해안 근처(대륙붕)
  const far  = blurField(mc, 96, w2, h2);    // 넓은 영역
  const fine = blurField(mc, 6, w2, h2);     // 아주 가까운 해안선
  await nextFrame();
  step('땅과 구름의 무늬를 만드는 중'); console.debug('[tex]', '땅과 구름의 무늬를 만드는 중', Math.round(performance.now()));
  const noise = periodicNoise(w2, h2, 7, 11, 8, 4);
  const noise2 = periodicNoise(w2, h2, 5, 29, 6, 3);
  await nextFrame();
  // 2) 사막·산맥 가중치 (저해상도)
  const qW = W/8, qH = H/8, desertQ = new Float32Array(qW*qH), mountQ = new Float32Array(qW*qH);
  for (let y=0;y<qH;y++){ const lat = 90-(y+.5)/qH*180;
    for (let x=0;x<qW;x++){ const lon=(x+.5)/qW*360-180; let d=0, m=0;
      for (const [la,lo,sa,so,wt] of DESERTS){ const dl=(lat-la)/sa, dn=(lon-lo)/so; d=Math.max(d, wt*Math.exp(-(dl*dl+dn*dn)/2)); }
      for (const [a1,o1,a2,o2,wd] of MOUNTAINS){ const vx=o2-o1, vy=a2-a1, px=lon-o1, py=lat-a1; const k=Math.max(0,Math.min(1,(px*vx+py*vy)/(vx*vx+vy*vy))); const dx=px-k*vx, dy=py-k*vy; m=Math.max(m, Math.exp(-(dx*dx+dy*dy)/(2*wd*wd))); }
      desertQ[y*qW+x]=d; mountQ[y*qW+x]=m; } }
  // 저해상도 가중치는 쌍선형 보간으로 읽는다 (그대로 늘리면 8×8 블록이 보였음)
  const bq = (arr, fx, fy) => {
    fx = Math.max(0, Math.min(qW-1.001, fx)); fy = Math.max(0, Math.min(qH-1.001, fy));
    const x0 = fx|0, y0 = fy|0, tx = fx-x0, ty = fy-y0, i = y0*qW+x0;
    const a = arr[i]+(arr[i+1]-arr[i])*tx, b = arr[i+qW]+(arr[i+qW+1]-arr[i+qW])*tx; return a+(b-a)*ty;
  };
  step('지구 표면을 칠하는 중'); console.debug('[tex]', '지구 표면을 칠하는 중', Math.round(performance.now()));
  await nextFrame();
  // 3) 색상 맵 (W×H, 알파 = 노이즈)
  const day = new Uint8Array(W*H*4);
  const lerp=(a,b,k)=>a+(b-a)*k, sm=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};
  const C = { deep:[6,22,58], mid:[12,52,104], shelf:[30,118,150], shallow:[56,168,176],
    trop:[38,82,44], sav:[112,112,64], temp:[74,100,54], bor:[40,64,44], tun:[118,116,100], des:[198,170,122], rock:[120,104,86] };
  // 위도별 육지 기본색은 행마다 한 번만 계산
  const out = [0,0,0], mixIn = (r,g,b,k)=>{ out[0]+=(r-out[0])*k; out[1]+=(g-out[1])*k; out[2]+=(b-out[2])*k; };
  for (let y=0;y<H;y++){
    const lat = 90-(y+.5)/H*180, alat=Math.abs(lat), y2=Math.min(h2-1,y>>1), yq=Math.min(qH-1,(y>>3));
    const rowOut = (H-1-y)*W; // DataTexture: 0행 = 남쪽
    out[0]=C.trop[0]; out[1]=C.trop[1]; out[2]=C.trop[2];
    mixIn(...C.sav, sm(9,20,alat)); mixIn(...C.temp, sm(28,40,alat)); mixIn(...C.bor, sm(48,58,alat)); mixIn(...C.tun, sm(62,70,alat));
    const lr=out[0], lgc=out[1], lb=out[2];
    const polarK = alat>55 ? sm(55,75,alat)*.35 : 0;
    for (let x=0;x<W;x++){
      const i2 = y2*w2+(x>>1), m = maskFull[(y*W+x)*4]/255, n=noise[i2], n2=noise2[i2];
      // 바다
      const sh = sm(.04,.42,near[i2]), br = sm(0,.32,far[i2]), fc = sm(.15,.5,fine[i2]);
      out[0]=C.deep[0]; out[1]=C.deep[1]; out[2]=C.deep[2];
      mixIn(C.mid[0],C.mid[1],C.mid[2], br*.85);
      mixIn(C.shelf[0],C.shelf[1],C.shelf[2], sh*.9);
      mixIn(C.shallow[0],C.shallow[1],C.shallow[2], fc*.55);
      if (polarK) mixIn(30,46,66,polarK);
      const ov = .92+.16*n2;
      const oR=out[0]*ov, oG=out[1]*ov, oB=out[2]*ov;
      let R=oR, G=oG, B=oB;
      if (m>0){
        out[0]=lr; out[1]=lgc; out[2]=lb;
        const fxq = (x+0.5)/8-0.5, fyq = (y+0.5)/8-0.5, dw = bq(desertQ,fxq,fyq)*(0.75+0.5*n2), mt = bq(mountQ,fxq,fyq);
        mixIn(C.des[0],C.des[1],C.des[2], sm(.35,.75,dw));
        if (mt>.02) mixIn(C.rock[0],C.rock[1],C.rock[2], mt*sm(.45,.75,n)*.8);
        if (mt>.5 && n>.62) mixIn(226,230,234, sm(.62,.75,n)*mt*.7);
        const v = .78+.42*n;
        R = oR+(out[0]*v-oR)*m; G = oG+(out[1]*v-oG)*m; B = oB+(out[2]*v-oB)*m;
      }
      const o = (rowOut+x)*4;
      day[o]=R>255?255:R; day[o+1]=G>255?255:G; day[o+2]=B>255?255:B; day[o+3]=n*255;
    }
    if ((y & 255) === 255) await nextFrame();
  }
  step('높낮이와 얼음을 정리하는 중'); console.debug('[tex]', '높낮이와 얼음을 정리하는 중', Math.round(performance.now()));
  // 4) 데이터 맵 (w2×h2): R=육지, G=흐림 필드, B=빙상 영역, A=침수 위험
  const data = new Uint8Array(w2*h2*4), bump = new Uint8Array(w2*h2*4), hgt = new Float32Array(w2*h2);
  for (let y=0;y<h2;y++){
    const lat = 90-(y+.5)/h2*180, yq=Math.min(qH-1,y>>2), rowOut=(h2-1-y)*w2;
    for (let x=0;x<w2;x++){
      const lon=(x+.5)/w2*360-180, i=y*w2+x, m = maskFull[((y*2)*W+x*2)*4]/255;
      const green = (lat>59 && lon<-11 && ((lat<75 && lon>-60) || (lat>=75 && lon>-73.5))) ? 1 : 0, ant = lat < -60 ? 1 : 0;
      let fl = 0; if (m>0) for (const [la,lo,r] of FLOODS){ const dl=lat-la, dn=(lon-lo)*Math.cos(la*Math.PI/180); fl=Math.max(fl, gauss(dl*dl+dn*dn, r*.6)); }
      fl *= sm(.85,.55,fine[i]); // 해안에 가까울수록
      const o=(rowOut+x)*4;
      data[o]=m*255; data[o+1]=near[i]*255; data[o+2]=Math.max(green,ant)*m*255; data[o+3]=Math.min(1,fl*1.3)*255;
      const mt = bq(mountQ, (x+0.5)/4-0.5, (y+0.5)/4-0.5);
      hgt[i] = Math.min(1, m*(0.18 + 0.32*noise[i]*sm(.3,.9,near[i]) + 0.55*mt*(0.5+noise[i])));
    }
  }
  // 지형 기울기를 CPU에서 미리 계산해 노멀 맵(R=동서, G=남북)으로 저장
  // (셰이더에서 1텍셀 차분을 하면 텍셀 경계마다 격자무늬가 보였음)
  for (let y=0;y<h2;y++){
    const yu = Math.max(0,y-1), yd = Math.min(h2-1,y+1), rowOut=(h2-1-y)*w2;
    for (let x=0;x<w2;x++){
      const xl = (x-1+w2)%w2, xr = (x+1)%w2;
      const gx = hgt[y*w2+xr]-hgt[y*w2+xl], gy = hgt[yu*w2+x]-hgt[yd*w2+x], o=(rowOut+x)*4;
      bump[o] = Math.max(0, Math.min(255, 128 + gx*508)); bump[o+1] = Math.max(0, Math.min(255, 128 + gy*508)); bump[o+2] = 128; bump[o+3] = 255;
    }
  }
  await nextFrame();
  step('밤의 도시 불빛을 켜는 중'); console.debug('[tex]', '밤의 도시 불빛을 켜는 중', Math.round(performance.now()));
  // 5) 도시 불빛 (Canvas, 불투명)
  const lc = canvas(W,H), lg = lc.getContext('2d');
  lg.fillStyle='#000'; lg.fillRect(0,0,W,H); lg.globalCompositeOperation='lighter';
  const rnd = mulberry32(5), sc = W/4096;
  const onLand = (x,y)=> x>=0&&x<W&&y>=0&&y<H && maskFull[((y|0)*W+(x|0))*4]>127;
  const gx = ()=>{ let u=0; for(let k=0;k<3;k++) u+=rnd(); return (u-1.5)/0.5; };
  for (const [la,lo,wt,sp] of METROS){
    const cx=(lo+180)/360*W, cy=(90-la)/180*H, cosl=Math.max(.3,Math.cos(la*Math.PI/180));
    const count = Math.round(1400*wt*sp*sc);
    for (let k=0;k<count;k++){
      const r = Math.pow(rnd(),1.6)*sp*2.2, a=rnd()*Math.PI*2;
      const x = cx + Math.cos(a)*r/cosl/360*W, y = cy + Math.sin(a)*r/180*H;
      if (!onLand(x,y)) continue;
      const b = (1-r/(sp*2.2))*wt;
      // 은은한 작은 점만 (중심이 하얗게 타지 않도록 불투명도를 낮게)
      lg.fillStyle = `rgba(255,${185+rnd()*30|0},${100+rnd()*40|0},${(0.06+0.16*b).toFixed(3)})`;
      const s = Math.max(1, sc*1.1);
      lg.fillRect(x,y,s,s);
    }
  }
  // 흩어진 작은 마을 불빛
  for (let k=0;k<Math.round(26000*sc);k++){
    const lat = Math.asin(rnd()*1.5-0.6)*180/Math.PI, lon = rnd()*360-180;
    const x=(lon+180)/360*W, y=(90-lat)/180*H;
    if (!onLand(x,y) || lat<-45 || lat>66) continue;
    let p=0; for (const [la,lo,wt,sp] of METROS){ const dl=lat-la, dn=(lon-lo)*Math.cos(la*Math.PI/180); p+=wt*gauss(dl*dl+dn*dn, sp*5); }
    if (rnd() > Math.min(.9,p*.7)) continue;
    lg.fillStyle=`rgba(255,196,110,${(.06+rnd()*.14).toFixed(3)})`; lg.fillRect(x,y,Math.max(1,sc),Math.max(1,sc));
  }
  await nextFrame();
  step('구름을 띄우는 중'); console.debug('[tex]', '구름을 띄우는 중', Math.round(performance.now()));
  // 6) 구름 (w2×h2 단일 채널을 RGBA에)
  const cn = periodicNoise(w2, h2, 7, 77, 10, 5);
  const cn2 = periodicNoise(w2, h2, 4, 91, 4, 2);
  const cloud = new Uint8Array(w2*h2*4);
  for (let y=0;y<h2;y++){
    const lat = 90-(y+.5)/h2*180, al=Math.abs(lat), rowOut=(h2-1-y)*w2;
    const g1=(lat-6)/7, g2=(al-24)/7, g3=(al-55)/10;
    const band = .13*Math.exp(-g1*g1/2) - .11*Math.exp(-g2*g2/2) + .1*Math.exp(-g3*g3/2) - .32*sm(58,78,al);
    for (let x=0;x<w2;x++){
      const i=y*w2+x, v = cn[i]*.78 + cn2[i]*.35 + band - .1;
      const c = sm(.52,.74,v), o=(rowOut+x)*4;
      cloud[o]=cloud[o+1]=cloud[o+2]=255; cloud[o+3]=c*235;
    }
  }
  const mk = (arr,w,h)=>{ const t=new THREE.DataTexture(arr,w,h,THREE.RGBAFormat); t.generateMipmaps=true; t.minFilter=THREE.LinearMipmapLinearFilter; t.magFilter=THREE.LinearFilter; t.wrapS=THREE.RepeatWrapping; t.needsUpdate=true; return t; };
  const lightsTex = new THREE.CanvasTexture(lc); lightsTex.wrapS=THREE.RepeatWrapping;
  const coastTex = new THREE.CanvasTexture(cc); coastTex.wrapS=THREE.RepeatWrapping;
  return { day:mk(day,W,H), data:mk(data,w2,h2), bump:mk(bump,w2,h2), cloud:mk(cloud,w2,h2), lights:lightsTex, coast:coastTex, texel:new THREE.Vector2(1/w2,1/h2) };
}

/* ───────── 셰이더 ───────── */
const EARTH_VS = `
varying vec2 vUv; varying vec3 vN; varying vec3 vE; varying vec3 vNo; varying vec3 vWP;
void main(){
  vUv = uv;
  vec3 n = normalize(position);
  vec3 e = vec3(n.z, 0.0, -n.x); e = length(e) < 1e-4 ? vec3(0.0,0.0,-1.0) : normalize(e);
  vec3 no = cross(n, e);
  mat3 m = mat3(modelMatrix);
  vN = normalize(m*n); vE = normalize(m*e); vNo = normalize(m*no);
  vec4 wp = modelMatrix*vec4(position,1.0); vWP = wp.xyz;
  gl_Position = projectionMatrix*viewMatrix*wp;
}`;
const EARTH_FS = `
uniform sampler2D dayMap, dataMap, bumpMap, lightsMap, coastMap;
uniform vec3 sunDir; uniform vec2 texel;
uniform float uTime, uTemp, uPulse, uTurb, uIceShift;
varying vec2 vUv; varying vec3 vN; varying vec3 vE; varying vec3 vNo; varying vec3 vWP;
void main(){
  float lat = (vUv.y-0.5)*180.0; float alat = abs(lat);
  vec4 day = texture2D(dayMap, vUv);
  vec4 dat = texture2D(dataMap, vUv);
  float land = dat.r, field = dat.g, sheetZone = dat.b, flood = dat.a;
  float wob = (day.a-0.5)*5.0*(1.0-smoothstep(78.0,88.0,alat));
  // 범프
  // 미리 계산한 기울기(노멀 맵): 쌍선형 보간된 기울기라 격자무늬가 생기지 않음
  vec2 grad = (texture2D(bumpMap, vUv).rg - 0.5) * (255.0/508.0);
  vec3 N0 = normalize(vN);
  vec3 N = normalize(N0 - 1.6*(grad.x*vE + grad.y*vNo));
  vec3 L = normalize(sunDir);
  vec3 V = normalize(cameraPosition - vWP);
  float ndl = dot(N, L), ndlG = dot(N0, L);
  float dayF = smoothstep(-0.10, 0.25, ndlG);
  float t = uTemp;
  vec3 col = day.rgb;
  // 빙상(그린란드·남극): 온도가 오를수록 가장자리부터 후퇴
  float sheetEdge = 0.56 + t*0.07 + wob*0.015;
  float sheet = sheetZone * smoothstep(sheetEdge-0.04, sheetEdge+0.04, field);
  col = mix(col, vec3(0.92,0.95,0.98), sheet);
  // 해빙
  float nEdge = 70.5 + t*6.0 + wob + uIceShift;
  float sEdge = 62.0 + t*2.4 + wob;
  float seaIce = (1.0-land) * (lat > 0.0 ? smoothstep(nEdge-1.2, nEdge+1.2, lat) : smoothstep(sEdge-1.2, sEdge+1.2, -lat));
  // 해수면 열기 (열대부터 고위도로 확산)
  float heatEdge = 8.0 + t*15.0;
  float heat = smoothstep(0.4, 3.0, t) * (1.0-land) * (1.0-seaIce) * smoothstep(heatEdge+12.0, heatEdge-6.0, alat);
  heat *= 0.78 + 0.22*sin(uTime*0.7 + vUv.x*38.0 + wob*1.5);
  float lum = dot(col, vec3(0.3,0.5,0.2));
  col = mix(col, vec3(0.95,0.45,0.16)*(0.55+0.9*lum), heat*0.78);
  col = mix(col, vec3(0.88,0.93,0.97), seaIce*0.94);
  // 조명
  float diff = smoothstep(-0.08, 1.0, ndl);
  vec3 lit = col * (0.11 + 1.02*diff);
  vec3 H = normalize(L + V);
  float water = (1.0-land)*(1.0-seaIce);
  // 바다 태양 반사광(스페큘러)은 제거: 태양이 카메라에 고정돼 있어 늘 같은 자리에 번진 빛 덩어리로 보였음
  // 밤 도시 불빛
  vec3 lights = texture2D(lightsMap, vUv).rgb;
  float hsh = fract(sin(dot(floor(vUv*vec2(1024.0,512.0)), vec2(12.9898,78.233)))*43758.5453);
  float tw = 0.8 + 0.2*sin(uTime*(1.2+hsh*2.0) + hsh*6.2831);
  lit += lights * (1.0-dayF) * tw * 0.9;
  // 해안선 윤곽: 낮에는 밝은 하늘색, 밤에도 은은하게 보여 대륙 모양이 읽힘
  float coast = texture2D(coastMap, vUv).r;
  lit = mix(lit, vec3(0.80,0.93,1.0)*(0.42+0.7*dayF), clamp(coast,0.0,1.0)*0.62);
  // 저지대 침수 위험
  float fr = flood * smoothstep(0.6, 3.0, t) * (0.55 + 0.45*sin(uTime*3.0));
  lit = mix(lit, vec3(1.0,0.42,0.22)*(0.45+0.6*dayF), clamp(fr,0.0,1.0)*0.85);
  // 대기 산란 테두리 + 탁도
  float fres = pow(1.0 - max(dot(N0, V), 0.0), 2.6);
  vec3 atm = mix(vec3(0.36,0.64,1.0), vec3(0.78,0.64,0.52), uTurb);
  atm = mix(atm, vec3(1.0,0.38,0.2), uPulse);
  lit = mix(lit, atm*(0.3+0.7*dayF), uTurb*0.10*dayF);
  lit += atm * fres * (0.18 + 0.85*dayF) * (1.0 + uPulse*1.5);
  gl_FragColor = vec4(lit, 1.0);
}`;
const CLOUD_FS = `
uniform sampler2D cloudMap; uniform vec3 sunDir; uniform float uOpacity;
varying vec2 vUv; varying vec3 vN;
void main(){
  float a = texture2D(cloudMap, vUv).a * uOpacity;
  float d = dot(normalize(vN), normalize(sunDir));
  float lightK = smoothstep(-0.15, 0.6, d);
  vec3 c = mix(vec3(0.05,0.07,0.1), vec3(1.0), lightK);
  gl_FragColor = vec4(c, a*(0.25+0.75*smoothstep(-0.2,0.2,d)));
}`;
const SIMPLE_VS = `varying vec2 vUv; varying vec3 vN; void main(){ vUv=uv; vN=normalize(mat3(modelMatrix)*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
const ATMO_VS = `varying vec3 vVN; varying vec3 vWN; void main(){ vVN=normalize(normalMatrix*normal); vWN=normalize(mat3(modelMatrix)*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
const ATMO_FS = `
uniform vec3 sunDir; uniform float uPulse, uTurb, uTime;
varying vec3 vVN; varying vec3 vWN;
void main(){
  float k = pow(max(0.0, 0.74 - dot(vVN, vec3(0.0,0.0,1.0))), 3.2);
  float sun = smoothstep(-0.45, 0.6, dot(vWN, normalize(sunDir)));
  vec3 base = mix(vec3(0.30,0.60,1.0), vec3(0.72,0.62,0.55), uTurb);
  vec3 col = mix(base, vec3(1.0,0.42,0.18), uPulse);
  float inten = k * (0.25 + 1.1*sun) * (1.0 + uPulse*2.2);
  gl_FragColor = vec4(col*inten*2.2, inten);
}`;

/* ───────── 장면 ───────── */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });

  $('#loading').innerHTML = '<div><b>3D 지구를 표시할 수 없어요</b><span>이 브라우저나 기기에서 WebGL이 꺼져 있어요. 최신 Chrome·Edge·Safari에서 다시 열어 주세요.</span></div>';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, isLow ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
$('#stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.05, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07; controls.enablePan = false;
controls.minDistance = 1.35; controls.maxDistance = 8; controls.rotateSpeed = 0.55; controls.zoomSpeed = 0.7;

const earthGroup = new THREE.Group(); scene.add(earthGroup);
earthGroup.rotation.z = 0; // 지축 기울기는 화면 가독성을 위해 생략

// 별
function makeStars(n){
  const g = new THREE.BufferGeometry(), pos = new Float32Array(n*3), ph = new Float32Array(n), sz = new Float32Array(n), col = new Float32Array(n*3);
  const rnd = mulberry32(3);
  for (let i=0;i<n;i++){
    let u = rnd()*2-1, a = rnd()*Math.PI*2;
    if (i < n*0.35){ u = (rnd()-0.5)*0.32; } // 은하수 띠
    const s = Math.sqrt(1-u*u), r = 120+rnd()*60;
    const v = new THREE.Vector3(s*Math.cos(a), u, s*Math.sin(a)).applyAxisAngle(new THREE.Vector3(1,0,0.3).normalize(), 1.05).multiplyScalar(r);
    pos.set([v.x,v.y,v.z], i*3); ph[i]=rnd()*6.28; sz[i]= rnd()<.04 ? 3.2 : 0.9+rnd()*1.5;
    const warm = rnd(); col.set(warm<.15?[1,.85,.7]:warm>.85?[.75,.85,1]:[1,1,1], i*3);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3)); g.setAttribute('phase', new THREE.BufferAttribute(ph,1)); g.setAttribute('size', new THREE.BufferAttribute(sz,1)); g.setAttribute('color', new THREE.BufferAttribute(col,3));
  const m = new THREE.ShaderMaterial({ transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, uniforms:{ uTime:{value:0}, uDpr:{value:renderer.getPixelRatio()} },
    vertexShader:`attribute float phase; attribute float size; attribute vec3 color; uniform float uTime; uniform float uDpr; varying float vA; varying vec3 vC;
      void main(){ vC=color; vA = 0.45 + 0.55*sin(uTime*(0.6+fract(phase)*1.4) + phase); gl_PointSize = size*uDpr; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`varying float vA; varying vec3 vC; void main(){ vec2 d=gl_PointCoord-0.5; float r=length(d); float a=smoothstep(0.5,0.0,r); gl_FragColor=vec4(vC, a*vA*0.85); }` });
  return new THREE.Points(g, m);
}
const stars = makeStars(isLow ? 2200 : 5000); scene.add(stars);

const sunDir = new THREE.Vector3(1,0.3,0.6).normalize();
const uniforms = { uTime:{value:0}, uTemp:{value:state.temp}, uPulse:{value:0}, uTurb:{value:0}, uIceShift:{value:0}, sunDir:{value:sunDir} };

// 기류 파티클
const AIR_N = isLow ? 700 : 1600;
const air = { lat:new Float32Array(AIR_N), lon:new Float32Array(AIR_N), age:new Float32Array(AIR_N), life:new Float32Array(AIR_N) };
// 입자마다 머리·꼬리 두 점으로 된 짧은 선분 (흐르는 바람 자국)
const airGeo = new THREE.BufferGeometry();
const airPos = new Float32Array(AIR_N*6), airAlpha = new Float32Array(AIR_N*2);
airGeo.setAttribute('position', new THREE.BufferAttribute(airPos,3));
airGeo.setAttribute('alpha', new THREE.BufferAttribute(airAlpha,1));
const airMat = new THREE.ShaderMaterial({ transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{ uColor:{value:new THREE.Color('#BFE6F0')}, sunDir:uniforms.sunDir },
  vertexShader:`attribute float alpha; varying float vA; varying float vDay; uniform vec3 sunDir;
    void main(){ vec3 wn = normalize(mat3(modelMatrix)*position); vDay = 0.3+0.7*smoothstep(-0.3,0.4,dot(wn,normalize(sunDir)));
      vA=alpha; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`uniform vec3 uColor; varying float vA; varying float vDay; void main(){ gl_FragColor=vec4(uColor, vA*vDay*0.42); }` });
const airPoints = new THREE.LineSegments(airGeo, airMat); airPoints.renderOrder = 3; earthGroup.add(airPoints);
const airRnd = mulberry32(17);
function seedAir(i){ air.lat[i] = Math.asin(airRnd()*2-1)*180/Math.PI*0.92; air.lon[i] = airRnd()*360-180; air.age[i]=0; air.life[i]=3+airRnd()*5; }
for (let i=0;i<AIR_N;i++){ seedAir(i); air.age[i]=airRnd()*air.life[i]; }
function windAt(lat){ // 경도 방향(도/초), 위도 방향(도/초) — 이상화한 대기 대순환
  const a = Math.abs(lat), s = Math.sign(lat)||1;
  if (a < 30) return [-5.5*(0.4+0.6*Math.sin(a/30*Math.PI)), -s*0.9*Math.sin(a/30*Math.PI)];
  if (a < 60) return [8.5*Math.sin((a-30)/30*Math.PI)+1.2, s*0.5*Math.sin((a-30)/30*Math.PI)];
  return [-4.0*Math.sin((a-60)/30*Math.PI), -s*0.3];
}
function updateAir(dt){
  const speed = 1 + state.temp*0.55;
  for (let i=0;i<AIR_N;i++){
    air.age[i] += dt;
    if (air.age[i] > air.life[i]) seedAir(i);
    const [u,v] = windAt(air.lat[i]);
    air.lon[i] += u*speed*dt/Math.max(.25,Math.cos(air.lat[i]*Math.PI/180));
    air.lat[i] = Math.max(-85, Math.min(85, air.lat[i] + v*speed*dt));
    if (air.lon[i] > 180) air.lon[i] -= 360; if (air.lon[i] < -180) air.lon[i] += 360;
    const p = latLonToVec3(air.lat[i], air.lon[i], 1.018);
    const tl = 0.32; // 꼬리 길이(초 단위 이동량)
    const q = latLonToVec3(air.lat[i] - v*speed*tl, air.lon[i] - u*speed*tl/Math.max(.25,Math.cos(air.lat[i]*Math.PI/180)), 1.018);
    const j = i*6;
    airPos[j]=p.x; airPos[j+1]=p.y; airPos[j+2]=p.z; airPos[j+3]=q.x; airPos[j+4]=q.y; airPos[j+5]=q.z;
    const k = air.age[i]/air.life[i]; airAlpha[i*2] = Math.sin(k*Math.PI); airAlpha[i*2+1] = 0;
  }
  airGeo.attributes.position.needsUpdate = true; airGeo.attributes.alpha.needsUpdate = true;
}

// 한반도 링 마커
const pinRing = new THREE.Mesh(new THREE.RingGeometry(0.009, 0.0135, 48), new THREE.MeshBasicMaterial({ color:0x5CC6CC, transparent:true, opacity:.9, side:THREE.DoubleSide, depthWrite:false }));
const pinDot = new THREE.Mesh(new THREE.CircleGeometry(0.0045, 24), new THREE.MeshBasicMaterial({ color:0xEAF2F8, depthWrite:false }));
const pinLocal = latLonToVec3(KOREA.lat, KOREA.lon, 1.004);
for (const m of [pinRing, pinDot]){ m.position.copy(pinLocal); m.lookAt(pinLocal.clone().multiplyScalar(2)); m.renderOrder = 4; earthGroup.add(m); }

let earth, clouds, atmo;
async function buildEarth(){
  const maxTex = renderer.capabilities.maxTextureSize;
  const W = Math.min(isLow ? 2048 : 4096, maxTex);
  const tex = await buildTextures(W, s => { $('#loading-step').textContent = s; });
  const aniso = renderer.capabilities.getMaxAnisotropy();
  for (const k of ['day','data','bump','lights','cloud','coast']) tex[k].anisotropy = Math.min(8, aniso);
  const seg = isLow ? 96 : 160;
  earth = new THREE.Mesh(new THREE.SphereGeometry(1, seg, seg/2), new THREE.ShaderMaterial({
    uniforms:{ ...uniforms, dayMap:{value:tex.day}, dataMap:{value:tex.data}, bumpMap:{value:tex.bump}, lightsMap:{value:tex.lights}, coastMap:{value:tex.coast}, texel:{value:tex.texel} },
    vertexShader:EARTH_VS, fragmentShader:EARTH_FS }));
  earthGroup.add(earth);
  clouds = new THREE.Mesh(new THREE.SphereGeometry(1.012, seg, seg/2), new THREE.ShaderMaterial({
    uniforms:{ cloudMap:{value:tex.cloud}, sunDir:uniforms.sunDir, uOpacity:{value:0.72} },
    vertexShader:SIMPLE_VS, fragmentShader:CLOUD_FS, transparent:true, depthWrite:false }));
  clouds.renderOrder = 2; earthGroup.add(clouds);
  atmo = new THREE.Mesh(new THREE.SphereGeometry(1.16, 96, 48), new THREE.ShaderMaterial({
    uniforms:{ sunDir:uniforms.sunDir, uPulse:uniforms.uPulse, uTurb:uniforms.uTurb, uTime:uniforms.uTime },
    vertexShader:ATMO_VS, fragmentShader:ATMO_FS, side:THREE.BackSide, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending }));
  scene.add(atmo);
}

/* ───────── 카메라 이동 ───────── */
const portrait = () => innerWidth/innerHeight < 0.8;
const START = { lat:22, lon:150, get dist(){ return portrait() ? 5.6 : innerWidth < 900 ? 3.9 : 3.65; } };
let spinOn = !reduceMotion, spinPauseUntil = 0, tween = null;
function viewDir(lat, lon){ return latLonToVec3(lat, lon, 1).applyQuaternion(earthGroup.quaternion).normalize(); }
function flyTo(lat, lon, dist, dur=1900){
  spinOn = false;
  const fromDir = camera.position.clone().normalize(), fromLen = camera.position.length();
  const toDir = viewDir(lat, lon);
  const angle = fromDir.angleTo(toDir);
  tween = { t0:performance.now(), dur: reduceMotion ? 1 : dur, fromDir, toDir, fromLen, toLen:dist, lift: Math.min(0.9, angle*0.45), q:new THREE.Quaternion().setFromUnitVectors(fromDir, toDir) };

}
const ease = k => k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
const qI = new THREE.Quaternion();
function stepTween(now){
  if (!tween) return;
  const k = Math.min(1, (now - tween.t0)/tween.dur), e = ease(k);
  const q = qI.clone().slerp(tween.q, e);
  const dir = tween.fromDir.clone().applyQuaternion(q);
  const len = tween.fromLen + (tween.toLen - tween.fromLen)*e + Math.sin(Math.PI*e)*tween.lift;
  camera.position.copy(dir.multiplyScalar(len)); camera.lookAt(0,0,0);
  if (k >= 1){ tween = null; controls.enabled = true; controls.update(); }
}

/* ───────── 태양 방향 (항상 화면 오른쪽 위에서 비춰 밤이 왼쪽 가장자리에 보이게) ───────── */
const tmpV = new THREE.Vector3(), upV = new THREE.Vector3(0,1,0);
let sunAng = 1.05, sunAngTarget = 1.05; // 오로라 시연 때는 밤 쪽을 보여 준다
function updateSun(){
  const c = camera.position.clone().normalize();
  const right = tmpV.crossVectors(upV, c).normalize().negate(); // 카메라 기준 오른쪽
  sunAng += (sunAngTarget - sunAng)*0.04;
  sunDir.copy(c).multiplyScalar(Math.cos(sunAng)).addScaledVector(right, -Math.sin(sunAng)).addScaledVector(upV, 0.28).normalize();
}

function tempColor(t){
  const stops = [[0,[62,134,201]],[1,[92,198,204]],[1.5,[230,198,106]],[2,[242,160,78]],[2.5,[236,91,79]],[3,[185,52,63]]];
  let a=stops[0], b=stops[stops.length-1];
  for (let i=1;i<stops.length;i++){ if (t<=stops[i][0]){ a=stops[i-1]; b=stops[i]; break; } }
  const k = (t-a[0])/((b[0]-a[0])||1), c = a[1].map((v,j)=>Math.round(v+(b[1][j]-v)*k));
  return `rgb(${c.join(',')})`;
}
function setTemperature(t, fromUser=true){
  t = Math.round(Math.max(0, Math.min(3, t))*10)/10;
  const prev = state.temp; state.temp = t;
  uniforms.uTemp.value = t;
  uniforms.uTurb.value = Math.pow(t/3, 1.3)*0.8;
  airMat.uniforms.uColor.value.set(t < 1.5 ? '#BFE6F0' : t < 2.2 ? '#E8DDC4' : '#F2C6A8');
  $('#temp').value = t;
  $('#temp').setAttribute('aria-valuetext', `+${t.toFixed(1)}도`);
  const col = tempColor(t);
  document.documentElement.style.setProperty('--tcol', col);
  $('#t-read').textContent = `+${t.toFixed(1)}°C`;
  $('#ribbon-dim').style.width = `${(1-t/3)*100}%`;
  renderIndicators(); renderExplain();
  audio.setTension(t);
  if (activeScn === 'typhoon') setPatch(0, 14,138, 11, '#EC5B4F', 0.55 + 0.35*Math.min(1, t/3));
  if (state.focus === 'korea') KOREA_FX.apply();
  // 티핑 포인트: 올라가며 넘을 때만, 0.1 이상 내려가면 다시 준비
  const crossed = TIPS.filter(tp => armed[tp.at] && prev < tp.at && t >= tp.at);
  for (const tp of TIPS) if (t < tp.at - 0.05) armed[tp.at] = true;
  if (crossed.length && fromUser){
    const top = crossed[crossed.length-1];
    for (const tp of crossed) armed[tp.at] = false;

}

  if (spinOn && !tween && now > spinPauseUntil) earthGroup.rotation.y += dt*0.045;

  if (!tween) controls.update();
  updateSun();
  pulse = Math.max(0, pulse - dt*0.7); uniforms.uPulse.value = Math.sin(Math.min(1,pulse)*Math.PI*0.5) * (pulse>0?1:0);
  updateAir(dt);

  earthGroup.updateMatrixWorld();
  updateStage2(dt);
  updatePin();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

const fx = new THREE.Group(); earthGroup.add(fx);
const toRad = Math.PI/180;
const lerpN = (a,b,k)=>a+(b-a)*k;

// 해수 반점 레이어 (가우시안 반점 최대 8개)
const PATCH_N = 8;
const patchU = { uC:{value:[...Array(PATCH_N)].map(()=>new THREE.Vector3(1,0,0))}, uR:{value:new Array(PATCH_N).fill(0.1)},
  uCol:{value:[...Array(PATCH_N)].map(()=>new THREE.Vector3(1,1,1))}, uA:{value:new Array(PATCH_N).fill(0)}, uTime:uniforms.uTime };
const patchTarget = [...Array(PATCH_N)].map(()=>({a:0, r:0.1}));
const patchMesh = new THREE.Mesh(new THREE.SphereGeometry(1.0045, 128, 64), new THREE.ShaderMaterial({
  uniforms:patchU, transparent:true, depthWrite:false,
  vertexShader:`varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`uniform vec3 uC[${PATCH_N}]; uniform float uR[${PATCH_N}]; uniform vec3 uCol[${PATCH_N}]; uniform float uA[${PATCH_N}]; uniform float uTime; varying vec3 vP;
    void main(){ vec3 col=vec3(0.0); float ws=0.0;
      for(int i=0;i<${PATCH_N};i++){ if(uA[i]<0.003) continue; float d=acos(clamp(dot(vP,uC[i]),-1.0,1.0)); float r=uR[i];
        float w=exp(-d*d/(2.0*r*r))*uA[i]; w*=0.82+0.18*sin(uTime*1.5-d*36.0+float(i)*1.7); col+=uCol[i]*w; ws+=w; }
      if(ws<0.004) discard; gl_FragColor=vec4(col/ws, clamp(ws,0.0,1.0)*0.72); }` }));
patchMesh.renderOrder = 1; fx.add(patchMesh);
function setPatch(i, lat, lon, rDeg, hex, a){
  patchU.uC.value[i].copy(latLonToVec3(lat, lon, 1));
  const c = new THREE.Color(hex); patchU.uCol.value[i].set(c.r, c.g, c.b);
  patchTarget[i].a = a; patchTarget[i].r = rDeg*toRad;
  if (patchU.uA.value[i] < 0.01) patchU.uR.value[i] = rDeg*toRad*0.4;
}
function clearPatches(){ for (const t of patchTarget) t.a = 0; }
function updatePatches(dt){ const k = Math.min(1, dt*1.6); for (let i=0;i<PATCH_N;i++){ patchU.uA.value[i] = lerpN(patchU.uA.value[i], patchTarget[i].a, k); patchU.uR.value[i] = lerpN(patchU.uR.value[i], patchTarget[i].r, k*0.8); } }

// 흐름 경로 (위경도 경로를 따라 흐르는 점 + 옅은 경로선)
function makeFlow(path, {color='#F2A04E', count=110, r=1.012, size=3.4, speed=0.05, line=0.22}={}){
  const curve = new THREE.CatmullRomCurve3(path.map(([a,o])=>latLonToVec3(a,o,r)), false, 'centripetal');
  const S = curve.getSpacedPoints(480).map(p=>p.normalize().multiplyScalar(r));
  const obj = new THREE.Group();
  const lineGeo = new THREE.BufferGeometry().setFromPoints(S);
  const lineMat = new THREE.LineBasicMaterial({ color, transparent:true, opacity:line, depthWrite:false });
  obj.add(new THREE.Line(lineGeo, lineMat));
  const pos = new Float32Array(count*3), fade = new Float32Array(count), off = new Float32Array(count);
  for (let i=0;i<count;i++) off[i] = i/count + Math.random()*0.004;
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos,3)); g.setAttribute('fade', new THREE.BufferAttribute(fade,1));
  const m = new THREE.ShaderMaterial({ transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{ uColor:{value:new THREE.Color(color)}, uDpr:{value:renderer.getPixelRatio()}, uSize:{value:size}, uOp:{value:1} },
    vertexShader:`attribute float fade; uniform float uDpr, uSize; varying float vF; void main(){ vF=fade; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=uSize*uDpr*(3.0/-mv.z); gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`uniform vec3 uColor; uniform float uOp; varying float vF; void main(){ float r=length(gl_PointCoord-0.5); gl_FragColor=vec4(uColor, smoothstep(0.5,0.05,r)*vF*uOp); }` });
  const pts = new THREE.Points(g, m); pts.renderOrder = 3; obj.add(pts);
  const f = { obj, target:speed, cur:speed, phase:0, op:1, opT:1,
    update(dt){
      this.cur = lerpN(this.cur, this.target, Math.min(1, dt*1.5)); this.phase += dt*this.cur;
      this.op = lerpN(this.op, this.opT, Math.min(1, dt*2)); m.uniforms.uOp.value = this.op; lineMat.opacity = line*this.op;
      for (let i=0;i<count;i++){ const u = (off[i]+this.phase)%1, p = S[Math.min(479, u*480|0)]; pos[i*3]=p.x; pos[i*3+1]=p.y; pos[i*3+2]=p.z; fade[i] = Math.sin(u*Math.PI)*(0.5+0.5*(i%3===0)); }
      g.attributes.position.needsUpdate = true; g.attributes.fade.needsUpdate = true;
    } };
  return f;
}

// 대륙 간 영향 아크 (튜브, 진행 애니메이션)
function slerpUnit(A, B, s){ const q = new THREE.Quaternion().setFromUnitVectors(A, B); return A.clone().applyQuaternion(new THREE.Quaternion().slerp(q, s)); }
function makeArc(a, b, color, h=0.16){
  const A = latLonToVec3(a[0],a[1],1).normalize(), B = latLonToVec3(b[0],b[1],1).normalize();
  const lift = h*Math.min(1, A.angleTo(B)/0.9);
  const pts = []; for (let i=0;i<=64;i++){ const s=i/64; pts.push(slerpUnit(A,B,s).multiplyScalar(1.006 + lift*Math.sin(Math.PI*s))); }
  const geo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 96, 0.0042, 6, false);
  const m = new THREE.ShaderMaterial({ transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{ uColor:{value:new THREE.Color(color)}, uProg:{value:0}, uTime:uniforms.uTime },
    vertexShader:`varying float vA; void main(){ vA=uv.x; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`uniform vec3 uColor; uniform float uProg, uTime; varying float vA; void main(){ if(vA>uProg) discard; float head=fract(uTime*0.45); float p=exp(-pow((vA-head)*10.0,2.0)); gl_FragColor=vec4(uColor, 0.5+0.5*p); }` });
  const mesh = new THREE.Mesh(geo, m); mesh.renderOrder = 4;
  const dot = new THREE.Mesh(new THREE.CircleGeometry(0.012, 24), new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0, depthWrite:false }));
  const bp = latLonToVec3(b[0],b[1],1.004); dot.position.copy(bp); dot.lookAt(bp.clone().multiplyScalar(2)); dot.renderOrder = 4;
  const obj = new THREE.Group(); obj.add(mesh, dot);
  return { obj, target:0, update(dt){ const p = m.uniforms.uProg.value; m.uniforms.uProg.value = this.target ? Math.min(1, p + dt*0.55) : Math.max(0, p - dt*1.5); dot.material.opacity = Math.max(0, (m.uniforms.uProg.value-0.9)*10)*0.9; obj.visible = m.uniforms.uProg.value > 0.001; } };
}

// 태풍 소용돌이
function spiralTexture(){
  const c = canvas(256,256), g = c.getContext('2d'); g.translate(128,128);
  for (let arm=0; arm<4; arm++) for (let t=0; t<1; t+=0.004){
    const ang = arm*Math.PI/2 + t*5.8, rad = 12 + t*112, s = (1-t)*15+3;
    g.fillStyle = `rgba(255,255,255,${(0.05+(1-t)*0.09).toFixed(3)})`; g.beginPath(); g.arc(Math.cos(ang)*rad, Math.sin(ang)*rad, s, 0, Math.PI*2); g.fill();
  }
  g.globalCompositeOperation = 'destination-out'; const e = g.createRadialGradient(0,0,0,0,0,16); e.addColorStop(0,'rgba(0,0,0,1)'); e.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=e; g.beginPath(); g.arc(0,0,16,0,Math.PI*2); g.fill();
  return new THREE.CanvasTexture(c);
}

  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const pm = new THREE.PointsMaterial({ color:0xBFE6F0, size:0.006, transparent:true, opacity:0.0, depthWrite:false, blending:THREE.AdditiveBlending });
  const vapor = new THREE.Points(g, pm); vapor.renderOrder = 5; obj.add(vapor);
  const v = { obj, strength:0, sTarget:0, vapor:0, vTarget:0, lat:16, lon:136, path:null, pathT:0,
    place(lat, lon){ this.lat=lat; this.lon=lon; const p = latLonToVec3(lat, lon, 1.016); obj.position.copy(p); obj.lookAt(p.clone().multiplyScalar(2)); },
    update(dt){
      this.strength = lerpN(this.strength, this.sTarget, Math.min(1, dt*0.9)); this.vapor = lerpN(this.vapor, this.vTarget, Math.min(1, dt*1.5));
      const sc = 0.05 + 0.17*this.strength; spin.scale.setScalar(sc); disc.material.opacity = Math.min(0.95, this.strength*1.3);
      spin.rotation.z += dt*(0.8 + 2.6*this.strength)*(this.dir||1);
      if (this.path){ this.pathT = (this.pathT + dt/9) % 1; const P = this.path, f = this.pathT*(P.length-1), i = Math.floor(f), k = f-i, A = P[i], B = P[Math.min(P.length-1,i+1)]; this.place(lerpN(A[0],B[0],k), lerpN(A[1],B[1],k)); }
      pm.opacity = 0.75*this.vapor;
      for (let i=0;i<N;i++){ const s = seed[i]; s.h = (s.h + dt*(0.25+0.5*this.vapor)) % 1; const rr = s.r*sc*(1-s.h*0.5); pos[i*3]=Math.cos(s.a+s.h*2)*rr; pos[i*3+1]=Math.sin(s.a+s.h*2)*rr; pos[i*3+2]=s.h*0.07; }
      g.attributes.position.needsUpdate = true;
      obj.visible = this.strength > 0.02 || this.vapor > 0.02;
    } };
  v.place(16,136); return v;
}

// 햇빛 광선 (반사·흡수)
function makeBeam(points, color){
  const geo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.01), 48, 0.0035, 5, false);
  const m = new THREE.ShaderMaterial({ transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{ uColor:{value:new THREE.Color(color)}, uOp:{value:0}, uTime:uniforms.uTime },
    vertexShader:`varying float vA; void main(){ vA=uv.x; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`uniform vec3 uColor; uniform float uOp, uTime; varying float vA; void main(){ float p=0.35+0.65*smoothstep(0.75,1.0,sin((vA*3.0-uTime*1.4)*6.2831)*0.5+0.5); gl_FragColor=vec4(uColor, p*uOp); }` });
  const mesh = new THREE.Mesh(geo, m); mesh.renderOrder = 4;
  return { obj:mesh, target:0, update(dt){ m.uniforms.uOp.value = lerpN(m.uniforms.uOp.value, this.target, Math.min(1, dt*2)); mesh.visible = m.uniforms.uOp.value > 0.01; } };
}
function tangentAt(lat, lon){ const n = latLonToVec3(lat,lon,1).normalize(); const e = new THREE.Vector3(n.z,0,-n.x).normalize(); return { n, e, no:new THREE.Vector3().crossVectors(n,e) }; }

// 바다로 녹아드는 CO₂ 입자
function makeCO2(){
  const BOX = [[-40,40,150,-110],[-40,40,-70,-15],[-35,20,50,100],[-60,-45,-180,180]];
  const N = isLow ? 260 : 520, pos = new Float32Array(N*3), seeds = [];
  for (let i=0;i<N;i++){ const b = BOX[i%BOX.length]; let lo = b[2] + Math.random()*(((b[3]-b[2])+360)%360||360); if (lo>180) lo-=360; seeds.push({ lat:b[0]+Math.random()*(b[1]-b[0]), lon:lo, h:Math.random() }); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const m = new THREE.PointsMaterial({ color:0xD7ECF7, size:0.0075, transparent:true, opacity:0, depthWrite:false });
  const pts = new THREE.Points(g, m); pts.renderOrder = 3;
  return { obj:pts, target:0, update(dt){
    m.opacity = lerpN(m.opacity, this.target*0.8, Math.min(1, dt*2)); pts.visible = m.opacity > 0.01; if (!pts.visible) return;
    for (let i=0;i<N;i++){ const s = seeds[i]; s.h -= dt*0.12; if (s.h < 0) s.h += 1; const p = latLonToVec3(s.lat, s.lon, 1.004 + s.h*0.08); pos[i*3]=p.x; pos[i*3+1]=p.y; pos[i*3+2]=p.z; }
    g.attributes.position.needsUpdate = true; } };
}

}

const lw = new THREE.Vector3();

    if (vis){ lw.copy(r.local).applyMatrix4(earthGroup.matrixWorld); const f = lw.clone().normalize().dot(camera.position.clone().sub(lw).normalize()); vis = f > 0.2;

// 기본값은 꺼짐. 사용자가 [사운드] 버튼으로 켜면 그 선택을 기억한다.
// 노트북 내장 스피커는 200Hz 아래를 거의 못 내므로, 들려야 하는 소리는 모두 220Hz 이상에 둔다.
const audio = {
  ctx:null, master:null, droneGain:null, droneFilter:null, tremolo:null, waveTimer:0,
  muted:(() => { try { return localStorage.getItem('ecc-sound') !== 'on'; } catch(e){ return true; } })(),
  start(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = this.ctx = new AC(), now = ctx.currentTime;
    const master = this.master = ctx.createGain(); master.gain.setValueAtTime(0, now); master.connect(ctx.destination);
    // 앰비언트 패드: 한 옥타브 올린 맑은 화음(A3·E4·A4·B4), 음마다 살짝 어긋난 쌍으로 코러스 느낌
    const padF = ctx.createBiquadFilter(); padF.type = 'lowpass'; padF.frequency.value = 2000; padF.Q.value = 0.4;
    const padG = ctx.createGain(); padG.gain.value = 0.8; padF.connect(padG); padG.connect(master);
    const lfo = ctx.createOscillator(), lfoG = ctx.createGain(); lfo.frequency.value = 0.04; lfoG.gain.value = 700; lfo.connect(lfoG); lfoG.connect(padF.frequency); lfo.start();
    const swell = ctx.createOscillator(), swellG = ctx.createGain(); swell.frequency.value = 0.07; swellG.gain.value = 0.25; swell.connect(swellG); swellG.connect(padG.gain); swell.start();
    [[220,0.026],[329.63,0.022],[440,0.018],[493.88,0.012]].forEach(([f,v]) => {
      for (const det of [-5, 5]){ const o = ctx.createOscillator(), gn = ctx.createGain(); o.type = 'sine'; o.frequency.value = f; o.detune.value = det; gn.gain.value = v; o.connect(gn); gn.connect(padF); o.start(); }
    });
    // 파도: 계속 깔리는 잡음 대신 몇 초에 한 번 밀려왔다 빠지는 너울
    const buf = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate), d = buf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    const noise = ctx.createBufferSource(); noise.buffer = buf; noise.loop = true;
    const nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 500; nf.Q.value = 0.8;
    const ng = ctx.createGain(); ng.gain.value = 0.0001;
    noise.connect(nf); nf.connect(ng); ng.connect(master); noise.start();
    const wave = () => {
      if (!this.ctx || this.ctx.state !== 'running'){ this.waveTimer = setTimeout(wave, 3000); return; }
      const t = this.ctx.currentTime, up = 2.2 + Math.random()*1.2, down = 3.5 + Math.random()*2;
      ng.gain.cancelScheduledValues(t); ng.gain.setValueAtTime(0.0001, t);
      ng.gain.exponentialRampToValueAtTime(0.012 + Math.random()*0.006, t + up); ng.gain.exponentialRampToValueAtTime(0.0001, t + up + down);
      nf.frequency.cancelScheduledValues(t); nf.frequency.setValueAtTime(350, t); nf.frequency.linearRampToValueAtTime(1100, t + up); nf.frequency.linearRampToValueAtTime(400, t + up + down);
      this.waveTimer = setTimeout(wave, (up + down + 2 + Math.random()*5)*1000);
    };
    this.waveTimer = setTimeout(wave, 1500);
    // 긴장 드론: 110Hz 톱니파 + 배음(220·330Hz)을 필터로 서서히 열어 작은 스피커에서도 들리게
    const df = this.droneFilter = ctx.createBiquadFilter(); df.type = 'lowpass'; df.frequency.value = 300; df.Q.value = 2.5;
    const dg = this.droneGain = ctx.createGain(); dg.gain.value = 0;
    const trem = this.tremolo = ctx.createOscillator(), tg = ctx.createGain(); trem.frequency.value = 0.5; tg.gain.value = 0.3; trem.connect(tg);
    const amp = ctx.createGain(); amp.gain.value = 0.7; tg.connect(amp.gain); trem.start();
    [[110,'sawtooth'],[110.8,'sawtooth'],[164.8,'sawtooth'],[220,'triangle']].forEach(([f,type]) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.connect(df); o.start(); });
    df.connect(amp); amp.connect(dg); dg.connect(master);
    master.gain.linearRampToValueAtTime(this.muted ? 0 : 0.6, now + 2.0);
    this.setTension(state.temp); updateSoundBtn();
  },
  setMuted(b){ this.muted = b; try { localStorage.setItem('ecc-sound', b ? 'off' : 'on'); } catch(e){}
    if (this.ctx){
      const t = this.ctx.currentTime; this.master.gain.cancelScheduledValues(t); this.master.gain.setValueAtTime(this.master.gain.value, t);
      if (b){ this.master.gain.linearRampToValueAtTime(0, t + 0.4); setTimeout(() => { if (this.muted && this.ctx.state === 'running') this.ctx.suspend(); }, 500); }
      else { if (this.ctx.state === 'suspended') this.ctx.resume(); this.master.gain.linearRampToValueAtTime(0.6, t + 0.8); }
    }
    updateSoundBtn(); },
  blip(freq, dur, type='sine', vol=0.06, to=null, delay=0){
    if (!this.ctx || this.muted) return; const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t+dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.012); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.05); },
  click(){ this.blip(880, 0.09, 'sine', 0.05, 640); },
  thunder(delay=0){
    if (!this.ctx || this.muted) return; const c = this.ctx, t = c.currentTime + delay, len = 2.4;
    const buf = c.createBuffer(1, c.sampleRate*len, c.sampleRate), d = buf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    const src = c.createBufferSource(); src.buffer = buf;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(2400, t); lp.frequency.exponentialRampToValueAtTime(260, t+1.4);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t+0.03); g.gain.exponentialRampToValueAtTime(0.07, t+0.45); g.gain.exponentialRampToValueAtTime(0.0001, t+len);
    src.connect(lp); lp.connect(g); g.connect(this.master); src.start(t); src.stop(t+len);
  },
  chime(){ this.blip(659.25, 0.5, 'triangle', 0.06); this.blip(987.77, 0.7, 'triangle', 0.05, null, 0.12); },
  alarm(){ this.blip(523.25, 0.45, 'sine', 0.09, 440); this.blip(392, 0.6, 'sine', 0.08, 330, 0.28); },
  setTension(t){
    if (!this.ctx) return; const c = this.ctx.currentTime;
    const ten = Math.max(0, Math.min(1, (t-1.0)/2.0)); let prox = 0; for (const th of [1.5,2.0,2.5]) prox = Math.max(prox, Math.exp(-Math.pow((t-th)/0.12,2)));
    this.droneGain.gain.setTargetAtTime(0.004 + 0.055*Math.pow(ten,1.4) + 0.02*prox, c, 0.4);
    this.droneFilter.frequency.setTargetAtTime(300 + 1500*ten, c, 0.4);
    this.tremolo.frequency.setTargetAtTime(0.4 + 3.2*ten, c, 0.6);
  }
};
function updateSoundBtn(){
  const on = !!audio.ctx && !audio.muted, b = $('#btn-sound');
  b.querySelector('.label-long').textContent = on ? '사운드 켜짐' : '사운드 꺼짐';
  b.querySelector('.label-short').textContent = on ? '소리 켜짐' : '소리 꺼짐';

}
