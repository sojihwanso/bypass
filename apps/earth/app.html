renderer.domElement.addEventListener('pointerdown', e => { downAt = { x:e.clientX, y:e.clientY, t:performance.now(), b:e.button }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || downAt.b !== 0) return; const moved = Math.hypot(e.clientX-downAt.x, e.clientY-downAt.y), dt = performance.now()-downAt.t; downAt = null;
  if (moved > 6 || dt > 500 || !earth || tween) return;
  ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(earth, false)[0]; if (!hit){ hidePop(); return; }
  const p = earthGroup.worldToLocal(hit.point.clone()).normalize();
  const lat = Math.asin(p.y)*180/Math.PI; let lon = Math.atan2(p.z, -p.x)*180/Math.PI - 180; if (lon < -180) lon += 360;
  pickRing.position.copy(p.clone().multiplyScalar(1.006)); pickRing.lookAt(p.clone().multiplyScalar(2)); pickRing.material.opacity = 0.95;
  popAt = [lat, lon]; showPop(regionAt(lat, lon), e.clientX, e.clientY);
});
function showPop(region, x, y){
  popRegion = region; const icons = window.PHEN_ICONS || {}, pop = $('#region-pop');
  pop.innerHTML = `<div class="pop-head"><div><b>${L(region.name)}</b><small>${state.level==='easy'?'여기서 생길 수 있는 현상이에요. 눌러서 보세요.':'발생 가능한 기상현상·재해 (눌러서 시연)'}</small></div><button class="collapse" type="button" data-close-pop aria-label="목록 닫기">✕</button></div>
    <div class="pop-list">${region.list.map(id => { const k = region.over && region.over[id] && region.over[id].kind; return `<button type="button" class="pop-item" data-phen="${id}"><span class="ph-ic" aria-hidden="true">${icons[id]||''}</span><span><b>${k ? L(KIND[k]) : L(PHEN[id].name)}</b><small>${L(PHEN[id].short)}</small></span></button>`; }).join('')}</div>`;
  pop.classList.add('show');
  const w = pop.offsetWidth, h = pop.offsetHeight, m = 12;
  let left = x + 16, top = y - h/2;
  if (left + w > innerWidth - m) left = x - w - 16;
  left = Math.max(m, Math.min(innerWidth - w - m, left)); top = Math.max(72, Math.min(innerHeight - h - m, top));
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
  pop.querySelector('.pop-item').focus({ preventScroll:true });
}
function hidePop(){ $('#region-pop').classList.remove('show'); popRegion = null; }
$('#region-pop').addEventListener('click', e => {
  if (e.target.closest('[data-close-pop]')){ hidePop(); pickRing.material.opacity = 0; return; }
  const it = e.target.closest('[data-phen]'); if (it) startDemo(it.dataset.phen, popRegion, popAt);
});
addEventListener('keydown', e => { if (e.key === 'Escape') hidePop(); });
controls.addEventListener('start', hidePop);
// 설명 패널 안의 현상 칩·시연 끄기
$('#explain-body').addEventListener('click', e => {
  const c = e.target.closest('.ph-chip'); if (c){ startDemo(c.dataset.phen, demo && demo.region, demo && demo.clickAt); return; }
  if (e.target.closest('[data-stop-demo]')){ resetView(); }
});
// 왼쪽 패널 탭: 바다 이야기 / 기상현상 도감
function renderCatalog(){
  const icons = window.PHEN_ICONS || {};
  $('#phen-list').innerHTML = Object.keys(PHEN).map(id => `<button class="scn ph-row" type="button" data-cat="${id}" aria-pressed="${!!demo && demo.id===id}"><span class="ph-ic" aria-hidden="true">${icons[id]||''}</span><span><b>${L(PHEN[id].name)}</b><small>${L(PHEN[id].short)}</small></span></button>`).join('');
}
$('#phen-list').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (b){ const id = b.dataset.cat, at = PHEN[id].at; startDemo(id, (id === 'aurora' || id === 'jet') ? REGIONS.find(r => r.id === 'arctic') : regionAt(at[0], at[1])); renderCatalog(); } });
document.querySelectorAll('.left-tab').forEach(t => t.addEventListener('click', () => {
  const which = t.dataset.tab; document.querySelectorAll('.left-tab').forEach(x => x.setAttribute('aria-selected', String(x === t)));
  $('#scn-list').hidden = which !== 'scn'; $('#phen-list').hidden = which !== 'phen'; if (which === 'phen') renderCatalog();
}));
function updatePick(dt){ if (pickRing.material.opacity > 0){ const s = 1 + 0.25*Math.sin(performance.now()/300); pickRing.scale.setScalar(s); if (!$('#region-pop').classList.contains('show') && !demo) pickRing.material.opacity = Math.max(0, pickRing.material.opacity - dt*1.5); } }

/* ───────── 시작 ───────── */
camera.position.copy(latLonToVec3(START.lat, START.lon, START.dist));
camera.lookAt(0,0,0);
renderScenarios(); buildTicks(); setTemperature(state.temp, false);
if (innerWidth < 900) closePanel('right');
window.__app = { setTemperature, flyTo, setLevel, state, goKorea, resetView, activateScenario, setStage, audio, openInsight, labels, startDemo, regionAt, REGIONS, getDemo:()=>demo };
try {
  await buildEarth();
  $('#loading').classList.add('done');
  window.__loadMs = Math.round(performance.now());
  requestAnimationFrame(frame);
  setTimeout(hideHint, 6500);
} catch (err){
  console.error(err);
  $('#loading').innerHTML = '<div><b>지구를 그리지 못했어요</b><span>페이지를 새로 고치거나 다른 브라우저에서 열어 주세요.</span></div>';
}
</script>
