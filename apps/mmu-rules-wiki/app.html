<style>

:root[data-theme="dark"]{--bg:#0e1424;--card:#172038;--tx:#e6eaf5;--mu:#9aa6c4;--ac:#8fb0ff;--bd:#2a3556;--hl:#6b5a10;--chip:#222d4b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}

.sub{font-weight:700;color:var(--ac);margin-top:10px}
mark{background:var(--hl);color:inherit;border-radius:3px}

:root{--navy:#0b1f4d;--gold:#c9a24a}

.hero{border-bottom:3px solid var(--gold)}

.hero h1{background:linear-gradient(90deg,#fff 20%,#f3d98f 50%,#fff 80%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
#th{position:absolute;top:14px;right:14px;z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font-size:16px;backdrop-filter:blur(6px)}
#pg{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:0;background:linear-gradient(90deg,var(--gold),#fff);z-index:20;transition:width .1s}
header{backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);background:color-mix(in srgb,var(--bg) 80%,transparent)}
.card{animation:up .55s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i)*45ms);transition:transform .25s,box-shadow .25s;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:60px;background:linear-gradient(180deg,color-mix(in srgb,var(--k) 12%,transparent),transparent);pointer-events:none}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.98)}}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px -12px var(--k)}.chip:hover{border-color:var(--gold)}}
.card h2{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative}
.card h2::after{content:"⌄";color:var(--mu);transition:transform .3s}

.bd{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s ease}

.card.shut h2{border-bottom-color:transparent;margin-bottom:0;padding-bottom:0}
#up{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:0;background:var(--gold);color:#0b1f4d;font-size:20px;font-weight:700;box-shadow:0 8px 20px -6px rgba(0,0,0,.45);opacity:0;transform:translateY(20px);pointer-events:none;transition:.3s;z-index:15}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const D=[
{c:"두발·복장",t:"남학생 두발",l:["파마·염색 불가","정모·통상모 착모 시 앞머리·옆머리가 모자 밖으로 튀어나오지 않을 것","앞머리는 탈모 시 눈썹을 넘지 않을 것","뒷머리는 옷깃에, 옆머리는 귀에 닿지 않을 것"]},
{c:"두발·복장",t:"여학생 두발",l:["파마·염색 불가","긴 머리, 단발, 쇼트커트, 레이어드 커트 가능. 앞머리는 시야를 가리지 않는 선까지","단발: 어깨선을 넘지 않게, 양쪽 머리카락을 귀 뒤로 넘겨 귀가 보이게 정리","쇼트커트: 뒷머리가 옷깃에 닿지 않게 단정히 정리, 다운펌 가능","# 머리망·핀","단발·쇼트커트 이상 길이는 검은색 머리망 사용, 머리핀 좌측 1개·우측 1개 이상으로 단정히 정리","애교머리도 머리핀으로 단정히 정리","생활관 동층에 한해 머리망 없이 하나로 묶는 것 가능","잔머리 정리용 머리핀 외 액세서리·머리띠 불가. 머리망·머리핀·머리끈은 모두 무지 검은색"]},
{c:"두발·복장",t:"액세서리 규정",l:["시계: 제복 착용 시 어두운 계통·메탈·스마트시계 가능. 원색 계통 불가","반지: 좌측 손에 하나만 가능","귀걸이·피어싱: 여학생은 0.7cm 이하의 큐빅·진주·금색·은색 가능, 남학생은 불가","안경: 금색·은색·검은색 테만 가능. 알 없는 안경, 패션안경, 원색 계열 밝은 색, 투명 테 불가","팔찌: 제복 착용 시 불가","목걸이: 제복 착용 시 불가"]},
{c:"두발·복장",t:"복장 공통·생활 지시사항",l:["# 공통사항","인검전달사항 미 준수 시 “지시사항 불이행”으로 과실 지적 예정","상륙 08:00~21:00 / 귀관 08:00~21:45","상륙금지 일과 중 허가 없이 상륙 시 과실 지적. 과실 30점 이상 학생은 매주 월요일 상륙금지 대상자 게시 확인","상륙금지자가 수업 등으로 불참 허가를 받으면 시간표·증빙서류 지참, 불참 보고 시간 전·후로 지도관실 방문","미래융복합관·글로벌창의융합관 이용 시 신규 보행통로 이용","특별상륙 허가 후 보통상륙을 나갈 시 당직실 경유","통상모·정모 착용 제대로. 생활관 외 공간에서 슬리퍼 포함 허가되지 않은 신발 착용 금지","승선생활관 카드키·지문 등록: 세계로관 행정실, 13:00~13:30 / 16:30~17:00","동잠바 착용 시 윗 단추 밑까지 지퍼 올릴 것. 제복 착용 중 입수보행 금지","복장점검·위생점검·생활교육 시 음주 불가","차량 승·하차는 택시승강장에서. 새누리관 뒷길 이용 금지","호실 앞 인원 점검 시 복장 확실히 갖춰 나올 것. 복장변경 신청 후 목적에 맞지 않게 사복 착용 금지","통상가방(노트북 가방 등): 교내에서 사전 공지된 어깨끈 이용 가능, 교외에서는 어깨끈 불가","# 생활사항","종류 다른 생활복 혼용, 하통상복 내의로 검은티 착용, 실습선에서 지급받은 세계로·새누리 티셔츠 착용, 머리망 미착용, 통상모 미착용 등 규정 외 복장 시 “지시사항 불이행” 지적","에어컨 설정 온도 24℃. 임의 조작 시 승선생활관 지침 제41조 위반으로 과실 40점","호실 문 개방 시 외력 이용 강제 개방 금지. 적발 시 과실 지적 및 문 훼손 변상 청구","호실 비품·생활관 청결하게 사용. 야간 소란 행위 절대 금지","호실 문 앞에 카드키·슬리퍼 두지 말 것. 문 상부 도어락에 테이프 등 임의 개조 금지","유달관·태평관 쓰레기, 음식물 투기 금지. 교내 통행 시 도보로 이동","제복 착용 시 이륜차·사륜차 등(바퀴수 무관), 덮개 없는 이동 수단(전동킥보드, 오토바이 등) 탑승 불가. 동아리 운동 목적으로 생활복 착용 후 자전거 탑승은 가능(사전에 지도관실 허가 득할 것)","교외 상륙 시 위 항목에 해당하는 경우 외 복장과 관계없이 탑승·주행 가능","새누리관·태평관·유달관 샤워실 청소 시간 10:00~11:00 피해서 샤워","전기자동차·전동킥보드 등 충전을 위해 승선생활관 전기 사용 금지(적발 시 에너지 관리 위반, 과실 40점)","복학생은 복학한 기수에 맞는 색의 생활복 착용","출입금지 구역(새누리관 비상계단 3·4호관 방향, 유달관 4호관 비상계단): 비상상황 제외 출입 불가(24시간). 허가 없이 출입·협조 시 “출입금지 구역 출입 또는 협조” 과실 지적","승선생활관 식당에 외부인(공대생, 타 학교 재학생 등) 허가 없이 출입 금지","아침조별과업 열외: 3회 과실 10점(승규 33조 별표 4 D(4) 기타 10점 과실에 상응하는 학생 포함), 6회 생활관 면담","생활관 내 파자마(잠옷류) 착용, 상의 미착용·속옷만 착용한 채 배회 금지","제복·생활복 착용 시 이어폰 불가. 체력단련실 운동, 정독실·도서관 학습 목적, 이동수단 탑승 시에 한해 허용","운동 시 복장 혼용 금지(생활복 상의+사복 바지 등)","화장실 휴지 과도한 사용·대변기 내 물티슈 투척으로 변기 고장 지속 발생 → 학생 총원 유의","경례는 상급자와 하급자의 상호 존중 표시. 상급자는 하급자의 경례에 규정에 맞는 경례로 답례","위 사항 미준수 시 과실 지적"]},
{c:"인사·경례",t:"인사법",l:["1순위: 총장님, 승선생활관장님, 지도관님, 교수님 등께는 가까운 거리 내에서 구두인사","2순위: 선후배 간에는 거수경례","1·2순위가 같이 있으면 1순위에게 인사하고 지나간 다음 2순위 간 경례","1순위와 동행 이동 시 2순위 경례는 생략","경례 생략 상황에서는 구두인사","인사 생략 상황에서는 경례·구두인사 모두 생략"]},
{c:"인사·경례",t:"경례법",l:["경례는 우측 손으로(왼손잡이 신입생도 우측 손)","우측 어깨와 팔꿈치가 수평, 팔꿈치·손목·손가락 일직선","손등·손바닥·엄지손가락이 보이면 안 됨","착모하지 않은 경우 우측 손 중지 끝이 우측 눈썹 끝에, 안경 착용 시 안경테 우측 끝에","착모한 경우 우측 챙 끝에 우측 손 중지 끝","우측 손에 짐이 있으면 좌측 손으로 옮긴 후 경례","학년 구분 없이 본인과 가장 가까운 상급자께 경례","좌측 팔은 흔들지 않고 보행하면서 경례. 상급자의 눈을 바라보며 경례","상급자가 받아주시기 전, 완전히 지나치기 전에는 먼저 내리지 않음","가장 가까운 상급자 뒤로 다른 상급자가 보이면, 가까운 상급자가 완전히 지나간 뒤 다시 경례"]},
{c:"인사·경례",t:"경례 생략구역·상황",l:["# 경례 생략구역","모든 실내 / 식당 앞 로비 / 식당 입식로·퇴식로 / 모든 계단 및 계단과 같은 재질의 연석 / 택시승강장 / 미래융복합관·글로벌창의융합관으로 가는 차도 / 모든 산책로 / 기관공학관 앞 공원 / 해사과학관 옆 분수대 / 역과 터미널","# 경례 생략상황","본인이 사복을 착용한 경우","상급자 또는 본인 중 한 사람이라도 경례 생략구역에 있는 경우","상급자 또는 본인이 우산을 사용 중인 경우","상급자 또는 본인 중 한 명이라도 양손에 짐이 있어 한 손으로 옮길 수 없는 경우"]},
{c:"인사·경례",t:"인사 생략구역·상황",l:["# 인사 생략구역","화장실 / 샤워실 / 식당 내부 / 카페테리아 / 그라지에 / 매점 / 운동장 / 체육관 / 도서관 / 강의실","# 인사 생략상황","상급자가 사복을 착용한 경우","상급자와 본인 중 한 사람이라도 인사 생략구역에 있는 경우","청소 및 인원 점검과 같은 일과 시","상급자 또는 본인 중 한 사람이라도 대열을 맞추어 대기 중이거나 이동 중인 경우","착석하고 있는 경우","상급자가 학군단 체육복·전투복·실습복을 착용한 경우","상급자와 본인 모두 실습복을 착용한 경우"]},
{c:"보고",t:"지도관실·당직실 방문 유의사항",l:["# 지도관실","정모·통상모는 문 앞 걸이에 걸고, 짐은 지도관실 앞 소파에 두고 방문","# 당직실","겉옷은 탈의 후 로비나 세계로관 체력단련실 앞(또는 안)에 정리해 둘 것","# 공통","출입 전 거울을 보고 용모·제복 상태 단정히","통상복 이상의 복장으로만 방문. 복장변경을 허가받은 경우 사복 착용 방문 가능","지도관실에 한해 환자 등 긴급 상황 시 생활복 착용 가능"]},
{c:"보고",t:"보고 요령 (당직실·지도관실)",l:["# 1인 보고","정모·통상모 탈모 후 파지한 채(당직실) 보고 대기열에 차렷자세로 대기","3번 노크 후 “들어가도 좋습니까?” → 허가받으면 문 열고 입장","선두 자리에서 차렷, 당직사관님(지도관님)께 경례 → 받아주시면 손 내리고 관등성명 뒤에 “당직사관님(지도관님)께 용무 있어 왔습니다.”","용무 후 경례 → 받아주시면 “용무 마치고 돌아갑니다.” 하고 퇴장","# 2인 이상 보고","선두가 3번 노크하고 “들어가도 좋습니까?” 후 입장","선두부터 1번에 차례로 서며, 마지막 들어온 사람이 발을 구르면 선두가 차렷 후 경례 (당직실은 마지막 사람이 발을 구르며 차렷 후 경례)","경례를 받아주시면 손 내리고 “관등성명 외 n명 당직사관님(지도관님)께 용무 있어 왔습니다.”","용무 후 선두가 “차렷” 후 경례 → 받아주시면 “용무 마치고 돌아갑니다.”, “뒤로 돌아.”, “앞으로 가.” 후 들어온 순서의 역순으로 퇴장"]},
{c:"식당",t:"식당 예절",l:["출입 시 모든 모자는 탈모해 식당 앞 선반에 보관, 개인 물품은 모두 두고 입장","식당 내 동잠바 탈의 불가. 탈의하려면 식당 앞 선반·카페테리아에 두고 입장","조식 시간에 한해 정복 제외 통상복·생활복·사복 착용 시 착모하고 식사 가능","식당 앞 통로 대기는 1열 종대, 입식로 대기는 2열 종대. 대기 중 잡담 금지, 차렷자세","식판은 두 손으로 잡고, 먹을 만큼만 덜어 잔반 최소화","다리를 꼬거나 떠는 행위 금지, 두 발은 바닥에","잡담·양손식사 금지. 부득이하게 양손 사용 시 식탁에 팔을 올리지 않고 쓰지 않는 손은 무릎 위에","식사 후 퇴식로 직원분들께 “잘 먹었습니다.” 인사 후 퇴장","물은 식수대 앞에서 마시되 뒤로 4보 이상 물러나 퇴식로를 가리지 않고, 차렷 자세 유지. 식사 시 물컵 가져오지 않기","깁스 등 제복 착용 불가 사유를 제외하고는 복장변경 결재를 받아도 사복 착용 식당 출입 금지","보통·주말·특별상륙 상륙 후에는 식당 이용·출입 불가"]},
{c:"생활관",t:"호실 반입 음식·물품",l:["# 가능","샌드위치, 케이크, 훈제란, 과자·사탕·젤리, 카페 음료, 과일, 비조리된 빵류, 승선생활관 식당 음식, 시험기간 제공 부식·간식, 컵라면, 햄버거","# 불가","조리가 필요한 음식(컵라면 제외), 배달 및 조리된 음식 (반입 시 과실 30점, 상륙금지 1주)","# 반입 불가 물품","취사도구(라면포트, 커피포트, 에어프라이어)","헤어드라이기를 제외한 전열기구(선풍기, 고데기, 전기장판) → 에너지 관리 위반 시 과실 40점(상륙금지 2주)"]},
{c:"생활관",t:"호실 복장·청소·정리",l:["호실 내 복장: 자율복장 / 호실 외 복장: 완전 복장 상태","생활관 내 규정: 동층 이동, 타층 이동, 공용 구역 규정이 있음. 용모·복장 불량 시 과실 10점","# 청소 (22:00~22:15)","호실·창문 개방, 커튼 묶기, 창틀 먼지 제거, 바닥 쓸기·걸레질, 옷장·정리 규정 준수, 쓰레기통 비우기","책상 위 정리 가능 물품: 노트북, 공유기, 멀티탭, 스탠드"]},
{c:"생활관",t:"옷장·신발장·침구 정리",l:["# 옷장","상의-하의 순으로 정리. 제복 상의는 교표가 보이게","제복 하의는 밑단을 집어 엉덩이 부분이 보이게","생활복 상의는 우측 주머니가 보이게, 하의는 허리 부분을 집어 우측 주머니가 보이게","모자는 챙이 보이게 보관. 동정복 와이셔츠는 동정복 상의 안에 넣어 정리","넥타이·넥타이핀·벨트 등 부속장구는 옷장 문 안쪽에 정리","# 신발장","앞코가 보이게. 손이 닿는 선에서 윗칸부터 채우기","호실 문 기준 흑구두, 백구두, 운동화 순. 가장 아래칸에 슬리퍼. 나머지는 여분 신발장에","# 침구류","까는 이불, 덮는 이불, 베개 순으로 쌓기. 이불은 뭉툭한 부분이 바깥쪽으로"]},
{c:"상륙",t:"상륙 절차·종류",l:["주말상륙: 금요일 08시 이후 상륙해 일요일 21시 45분까지 귀관(당일귀관 X). 정복","특별상륙: 주말상륙이 허용되지 않는 주중에 사용. 1학기 7일만 가능(최소 하루 전 결재). 정복","상륙 금지: 과실 30점 이상 시 정해진 기간만큼 금지, 하루 3번 정해진 시간에 상륙금지 보고","# 스마트 상륙 절차","① 지문 인식 전 학사행정시스템 상륙 신청","② 보통/주말상륙 확인 (특별상륙은 지도관실 결재→당직실 상륙/귀관 수기 작성)","③ 상륙(F1)/귀관(F2) 알맞은 버튼 클릭","④ 지문 인식 후 학사행정시스템에서 상륙/귀관 시간 확인","⑤ 학사행정시스템 화면 스크린샷(과실방지)","⑥ 오류 시 지도관실 또는 행정실 방문"]},
{c:"생활관",t:"흡연 관련",l:["저녁인원점검 이후 03시까지 흡연일지 작성 후 흡연 가능(미작성 시 무단상륙 간주)","흡연구역: 세계로관 뒤편, 새누리관-세계로관 사이, 태평·유달관 앞, 학생회관 옆(총 4개소)","호관·호실 내 꽁초 반입 금지, 꽁초나 냄새 적발 시 호관 내 흡연으로 간주","궐련형 담배도 꽁초는 반드시 흡연부스에서 처리","새누리관 8·9층 테라스 및 옥상 출입 금지","생활관 내 흡연 적발 시 과실 지적 및 과태료 신고 예정"]},
{c:"과실점",t:"과실점 10점·20점",l:["# 10점","침실 정리정돈·청소상태 불량","용모·복장상태 불량","지정된 기간 내 해당 서류(증빙서류 등) 미제출","기타 10점 과실에 상응하는 과실","# 20점","일과에 늦은 학생","모임·단체 가입을 강요한 학생","공지사항 훼손 또는 허가되지 않은 게시물 부착","고의로 학교 시설물을 이동","기타 20점 과실에 상응하는 과실"]},
{c:"과실점",t:"과실점 30점 (상륙금지 1주)",l:["생활관장·지도교수·행정실장·지도관·승선사관부의 정당한 지시 위반 또는 위계질서 침해","허위보고, 대리인검, 사적방송 등 기만행위","일과 불참","허가 없이 지정 침실 변경 또는 지정되지 않은 침실 사용","허가되지 않은 음식물(배달, 조리된 음식) 생활관 반입","호실 외 장소에서 허가 없이 지급 피복 외의 복장 착용","생활관 내 소란행위 또는 타 학생에게 명백한 피해","당직근무 태만","학생·학교의 품위를 손상하거나 이를 유포","문신이 있는 학생","스마트상륙시스템 절차를 일부 누락하고 상륙·귀관","기타 30점 과실에 상응하는 과실"]},
{c:"과실점",t:"과실점 40점 (상륙금지 2주)",l:["귀관시간에 늦은 학생(천재지변·불가항력 제외)","생활관 출입이 금지된 학생의 무단 출입","허가받지 않은 냉난방·취사기구 소지 또는 사용","고의로 학교 시설물 개조","승선생활관 지침 제41조 에너지 관리 위반","무단 당직(학생당직, 야간안전당직) 근무지 이탈","지정 구역 외 쓰레기 무단 투기"]},
{c:"과실점",t:"과실점 50점 (상륙금지 2주 / 징계상신)",l:["# 50점 (상륙금지 2주)","외부인을 허가 없이 생활관으로 인도","허가 없이 학생을 집합시키거나 훈련","학내 음주·술 반입(필요시 생활관장 허가 가능)","음주로 단체생활에 피해","무단 상륙 또는 귀관","무단으로 귀관하지 않음(기간 동안 점수 중복 가능, 상륙금지는 최대 2주)","지정 흡연구역 외 흡연","문서 위조·변조","교직원에게 불손한 언행 또는 폭행","기타 50점 과실에 상응하는 과실","# 50점 (징계상신 대상)","학내 절도","폭행·폭언 등 가혹행위","도박(화투·카드 등 사행성 오락도구 소지 포함), 사기 등","이성의 생활구역 출입 또는 방조","성적인 언어·행동으로 타 학생에게 피해","고의로 학교 시설물 훼손","출입금지 구역을 허가 없이 출입 또는 협조"]},
{c:"과실점",t:"지시사항 불이행 과실 기준",l:["지시사항 불이행으로 지적 시 학기당 1회 과실 10점, 2회 20점","3회 이상부터 과실 30점 및 상륙금지 1주"]},
