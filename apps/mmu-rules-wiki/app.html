{c:"인사·경례",t:"인사법",l:["1순위: 총장님, 승선생활관장님, 지도관님, 교수님 등께는 가까운 거리 내에서 구두인사","2순위: 선후배 간에는 거수경례","1·2순위가 같이 있으면 1순위에게 인사하고 지나간 다음 2순위 간 경례","1순위와 동행 이동 시 2순위 경례는 생략","경례 생략 상황에서는 구두인사","인사 생략 상황에서는 경례·구두인사 모두 생략"]},
{c:"인사·경례",t:"경례법",l:["경례는 우측 손으로(왼손잡이 신입생도 우측 손)","우측 어깨와 팔꿈치가 수평, 팔꿈치·손목·손가락 일직선","손등·손바닥·엄지손가락이 보이면 안 됨","착모하지 않은 경우 우측 손 중지 끝이 우측 눈썹 끝에, 안경 착용 시 안경테 우측 끝에","착모한 경우 우측 챙 끝에 우측 손 중지 끝","우측 손에 짐이 있으면 좌측 손으로 옮긴 후 경례","학년 구분 없이 본인과 가장 가까운 상급자께 경례","좌측 팔은 흔들지 않고 보행하면서 경례. 상급자의 눈을 바라보며 경례","상급자가 받아주시기 전, 완전히 지나치기 전에는 먼저 내리지 않음","가장 가까운 상급자 뒤로 다른 상급자가 보이면, 가까운 상급자가 완전히 지나간 뒤 다시 경례"]},
{c:"인사·경례",t:"경례 생략구역·상황",l:["# 경례 생략구역","모든 실내 / 식당 앞 로비 / 식당 입식로·퇴식로 / 모든 계단 및 계단과 같은 재질의 연석 / 택시승강장 / 미래융복합관·글로벌창의융합관으로 가는 차도 / 모든 산책로 / 기관공학관 앞 공원 / 해사과학관 옆 분수대 / 역과 터미널","# 경례 생략상황","본인이 사복을 착용한 경우","상급자 또는 본인 중 한 사람이라도 경례 생략구역에 있는 경우","상급자 또는 본인이 우산을 사용 중인 경우","상급자 또는 본인 중 한 명이라도 양손에 짐이 있어 한 손으로 옮길 수 없는 경우"]},
{c:"인사·경례",t:"인사 생략구역·상황",l:["# 인사 생략구역","화장실 / 샤워실 / 식당 내부 / 카페테리아 / 그라지에 / 매점 / 운동장 / 체육관 / 도서관 / 강의실","# 인사 생략상황","상급자가 사복을 착용한 경우","상급자와 본인 중 한 사람이라도 인사 생략구역에 있는 경우","청소 및 인원 점검과 같은 일과 시","상급자 또는 본인 중 한 사람이라도 대열을 맞추어 대기 중이거나 이동 중인 경우","착석하고 있는 경우","상급자가 학군단 체육복·전투복·실습복을 착용한 경우","상급자와 본인 모두 실습복을 착용한 경우"]},
{c:"보고",t:"지도관실·당직실 방문 유의사항",l:["# 지도관실","정모·통상모는 문 앞 걸이에 걸고, 짐은 지도관실 앞 소파에 두고 방문","# 당직실","겉옷은 탈의 후 로비나 세계로관 체력단련실 앞(또는 안)에 정리해 둘 것","# 공통","출입 전 거울을 보고 용모·제복 상태 단정히","통상복 이상의 복장으로만 방문. 복장변경을 허가받은 경우 사복 착용 방문 가능","지도관실에 한해 환자 등 긴급 상황 시 생활복 착용 가능"]},
{c:"보고",t:"보고 요령 (당직실·지도관실)",l:["# 1인 보고","정모·통상모 탈모 후 파지한 채(당직실) 보고 대기열에 차렷자세로 대기","3번 노크 후 “들어가도 좋습니까?” → 허가받으면 문 열고 입장","선두 자리에서 차렷, 당직사관님(지도관님)께 경례 → 받아주시면 손 내리고 관등성명 뒤에 “당직사관님(지도관님)께 용무 있어 왔습니다.”","용무 후 경례 → 받아주시면 “용무 마치고 돌아갑니다.” 하고 퇴장","# 2인 이상 보고","선두가 3번 노크하고 “들어가도 좋습니까?” 후 입장","선두부터 1번에 차례로 서며, 마지막 들어온 사람이 발을 구르면 선두가 차렷 후 경례 (당직실은 마지막 사람이 발을 구르며 차렷 후 경례)","경례를 받아주시면 손 내리고 “관등성명 외 n명 당직사관님(지도관님)께 용무 있어 왔습니다.”","용무 후 선두가 “차렷” 후 경례 → 받아주시면 “용무 마치고 돌아갑니다.”, “뒤로 돌아.”, “앞으로 가.” 후 들어온 순서의 역순으로 퇴장"]},
{c:"식당",t:"식당 예절",l:["출입 시 모든 모자는 탈모해 식당 앞 선반에 보관, 개인 물품은 모두 두고 입장","식당 내 동잠바 탈의 불가. 탈의하려면 식당 앞 선반·카페테리아에 두고 입장","조식 시간에 한해 정복 제외 통상복·생활복·사복 착용 시 착모하고 식사 가능","식당 앞 통로 대기는 1열 종대, 입식로 대기는 2열 종대. 대기 중 잡담 금지, 차렷자세","식판은 두 손으로 잡고, 먹을 만큼만 덜어 잔반 최소화","다리를 꼬거나 떠는 행위 금지, 두 발은 바닥에","잡담·양손식사 금지. 부득이하게 양손 사용 시 식탁에 팔을 올리지 않고 쓰지 않는 손은 무릎 위에","식사 후 퇴식로 직원분들께 “잘 먹었습니다.” 인사 후 퇴장","물은 식수대 앞에서 마시되 뒤로 4보 이상 물러나 퇴식로를 가리지 않고, 차렷 자세 유지. 식사 시 물컵 가져오지 않기","깁스 등 제복 착용 불가 사유를 제외하고는 복장변경 결재를 받아도 사복 착용 식당 출입 금지","보통·주말·특별상륙 상륙 후에는 식당 이용·출입 불가"]},
{c:"생활관",t:"호실 반입 음식·물품",l:["# 가능","샌드위치, 케이크, 훈제란, 과자·사탕·젤리, 카페 음료, 과일, 비조리된 빵류, 승선생활관 식당 음식, 시험기간 제공 부식·간식, 컵라면, 햄버거","# 불가","조리가 필요한 음식(컵라면 제외), 배달 및 조리된 음식 (반입 시 과실 30점, 상륙금지 1주)","# 반입 불가 물품","취사도구(라면포트, 커피포트, 에어프라이어)","헤어드라이기를 제외한 전열기구(선풍기, 고데기, 전기장판) → 에너지 관리 위반 시 과실 40점(상륙금지 2주)"]},
{c:"생활관",t:"호실 복장·청소·정리",l:["호실 내 복장: 자율복장 / 호실 외 복장: 완전 복장 상태","생활관 내 규정: 동층 이동, 타층 이동, 공용 구역 규정이 있음. 용모·복장 불량 시 과실 10점","# 청소 (22:00~22:15)","호실·창문 개방, 커튼 묶기, 창틀 먼지 제거, 바닥 쓸기·걸레질, 옷장·정리 규정 준수, 쓰레기통 비우기","책상 위 정리 가능 물품: 노트북, 공유기, 멀티탭, 스탠드"]},
{c:"생활관",t:"옷장·신발장·침구 정리",l:["# 옷장","상의-하의 순으로 정리. 제복 상의는 교표가 보이게","제복 하의는 밑단을 집어 엉덩이 부분이 보이게","생활복 상의는 우측 주머니가 보이게, 하의는 허리 부분을 집어 우측 주머니가 보이게","모자는 챙이 보이게 보관. 동정복 와이셔츠는 동정복 상의 안에 넣어 정리","넥타이·넥타이핀·벨트 등 부속장구는 옷장 문 안쪽에 정리","# 신발장","앞코가 보이게. 손이 닿는 선에서 윗칸부터 채우기","호실 문 기준 흑구두, 백구두, 운동화 순. 가장 아래칸에 슬리퍼. 나머지는 여분 신발장에","# 침구류","까는 이불, 덮는 이불, 베개 순으로 쌓기. 이불은 뭉툭한 부분이 바깥쪽으로"]},
{c:"상륙",t:"상륙 절차·종류",l:["주말상륙: 금요일 08시 이후 상륙해 일요일 21시 45분까지 귀관(당일귀관 X). 정복","특별상륙: 주말상륙이 허용되지 않는 주중에 사용. 1학기 7일만 가능(최소 하루 전 결재). 정복","상륙 금지: 과실 30점 이상 시 정해진 기간만큼 금지, 하루 3번 정해진 시간에 상륙금지 보고","# 스마트 상륙 절차","① 지문 인식 전 학사행정시스템 상륙 신청","② 보통/주말상륙 확인 (특별상륙은 지도관실 결재→당직실 상륙/귀관 수기 작성)","③ 상륙(F1)/귀관(F2) 알맞은 버튼 클릭","④ 지문 인식 후 학사행정시스템에서 상륙/귀관 시간 확인","⑤ 학사행정시스템 화면 스크린샷(과실방지)","⑥ 오류 시 지도관실 또는 행정실 방문"]},
{c:"생활관",t:"흡연 관련",l:["저녁인원점검 이후 03시까지 흡연일지 작성 후 흡연 가능(미작성 시 무단상륙 간주)","흡연구역: 세계로관 뒤편, 새누리관-세계로관 사이, 태평·유달관 앞, 학생회관 옆(총 4개소)","호관·호실 내 꽁초 반입 금지, 꽁초나 냄새 적발 시 호관 내 흡연으로 간주","궐련형 담배도 꽁초는 반드시 흡연부스에서 처리","새누리관 8·9층 테라스 및 옥상 출입 금지","생활관 내 흡연 적발 시 과실 지적 및 과태료 신고 예정"]},
{c:"과실점",t:"과실점 10점·20점",l:["# 10점","침실 정리정돈·청소상태 불량","용모·복장상태 불량","지정된 기간 내 해당 서류(증빙서류 등) 미제출","기타 10점 과실에 상응하는 과실","# 20점","일과에 늦은 학생","모임·단체 가입을 강요한 학생","공지사항 훼손 또는 허가되지 않은 게시물 부착","고의로 학교 시설물을 이동","기타 20점 과실에 상응하는 과실"]},
{c:"과실점",t:"과실점 30점 (상륙금지 1주)",l:["생활관장·지도교수·행정실장·지도관·승선사관부의 정당한 지시 위반 또는 위계질서 침해","허위보고, 대리인검, 사적방송 등 기만행위","일과 불참","허가 없이 지정 침실 변경 또는 지정되지 않은 침실 사용","허가되지 않은 음식물(배달, 조리된 음식) 생활관 반입","호실 외 장소에서 허가 없이 지급 피복 외의 복장 착용","생활관 내 소란행위 또는 타 학생에게 명백한 피해","당직근무 태만","학생·학교의 품위를 손상하거나 이를 유포","문신이 있는 학생","스마트상륙시스템 절차를 일부 누락하고 상륙·귀관","기타 30점 과실에 상응하는 과실"]},
{c:"과실점",t:"과실점 40점 (상륙금지 2주)",l:["귀관시간에 늦은 학생(천재지변·불가항력 제외)","생활관 출입이 금지된 학생의 무단 출입","허가받지 않은 냉난방·취사기구 소지 또는 사용","고의로 학교 시설물 개조","승선생활관 지침 제41조 에너지 관리 위반","무단 당직(학생당직, 야간안전당직) 근무지 이탈","지정 구역 외 쓰레기 무단 투기"]},
{c:"과실점",t:"과실점 50점 (상륙금지 2주 / 징계상신)",l:["# 50점 (상륙금지 2주)","외부인을 허가 없이 생활관으로 인도","허가 없이 학생을 집합시키거나 훈련","학내 음주·술 반입(필요시 생활관장 허가 가능)","음주로 단체생활에 피해","무단 상륙 또는 귀관","무단으로 귀관하지 않음(기간 동안 점수 중복 가능, 상륙금지는 최대 2주)","지정 흡연구역 외 흡연","문서 위조·변조","교직원에게 불손한 언행 또는 폭행","기타 50점 과실에 상응하는 과실","# 50점 (징계상신 대상)","학내 절도","폭행·폭언 등 가혹행위","도박(화투·카드 등 사행성 오락도구 소지 포함), 사기 등","이성의 생활구역 출입 또는 방조","성적인 언어·행동으로 타 학생에게 피해","고의로 학교 시설물 훼손","출입금지 구역을 허가 없이 출입 또는 협조"]},
{c:"과실점",t:"지시사항 불이행 과실 기준",l:["지시사항 불이행으로 지적 시 학기당 1회 과실 10점, 2회 20점","3회 이상부터 과실 30점 및 상륙금지 1주"]},

const HAK=[{"c":"제1장 총칙","t":"제1조(목적)","l":["이 학칙은 국립목포해양대학교의 교육목적을 설정하고 이를 달성하기 위한 조직 및 학사운영 등에 관한 사항을 규정함을 목적으로 한다."]},{"c":"제1장 총칙","t":"제2조(교육목적 및 목표)","l":["① 국립목포해양대학교(이하 “본교”라 한다)는 대한민국의 교육이념에 입각하여 해사·해양분야의 인재 양성에 필요한 학술 이론과 그 응용방법을 가르치고 연구하며, 국가와 인류 사회에 이바지함을 목적으로 한다.","② 본교의 교육목표는 다음과 같다.","1. 해사·해양분야의 국제적 통용성과 소통 능력을 갖춘 인재 양성","2. 해사·해양분야의 실용적 가치와 전문지식을 갖춘 현장 중심형 인재 양성","3. 리더십 공동체 의식을 바탕으로 사회에 봉사하는 공익 인재 양성"]},{"c":"제2장 조직","t":"제3조(총장)","l":["# 제1절 교직원","① 총장은 학교업무를 통할하고 본교를 대표한다.","② 총장이 부득이한 사유로 직무를 수행할 수 없을 때에는 교무처장, 입학학생처장, 기획조정처장의 순서로 그 직무를 대행한다.","③ 총장후보자는 총장임용추천위원회에서 선정하되, 총장후보자 선정에 관한 세부사항은 「국립목포해양대학교 총장임용후보자 선정에 관한 규정」으로 정한다."]},{"c":"제2장 조직","t":"제4조(전임교원)","l":["① 전임교원은 학생을 교육·지도하고 학문을 연구한다. 다만, 총장이 인정하는 경우 학문연구 또는 산학협력만을 전담할 수 있다.","② 전임교원은 학부 및 학과(이하 “학부(과)”라 한다), 교양교직부, 승선실습과정부에 소속되는 것을 원칙으로 한다. <개정 2025.12.31.>","교무처 / (061)240-7011","③ 총장이 필요하다고 인정하는 경우 해당 학부(과) 교수회의 동의를 받아 소속을 변경하거나 겸임을 명할 수 있다.","④ 전임교원의 교수시간은 매 학년도 30주(매 학기 15주)를 기준으로 주당 9시간을 원칙으로 한다. 다만, 총장이 교수시간을 달리 정할 필요가 있다고 인정하는 교원의 교수시간은 「국립목포해양대학교 교학규정」으로 정한다.","·","교무처 교무팀 / (061)240-7011","⑤ 전임교원에 대하여 교육·연구·봉사·산학협력분야 등의 업적을 평가할 수 있으며, 교원업적평가의 범위와 절차 및 방법 등에 관한 세부사항은 「국립목포해양대학교 교수업적평가규정」으로 정한다."]},{"c":"제2장 조직","t":"제5조(비전임교원)","l":["① 「고등교육법」 제17조에 따라 본교에 석좌교수·초빙교원·객원교원·겸임교원·산학협력중점교원·명예교수·연구교수·특임교수 및 강사 등을 임용하여 교육 및 연구를 담당하게 할 수 있다.","② 비전임교원의 인사에 관한 세부사항은 「국립목포해양대학교 비전임교원 등 임용에 관한 규정」으로 정한다."]},{"c":"제2장 조직","t":"제6조(직원 및 조교)","l":["① 본교의 행정사무를 담당하는 직원으로 국가공무원과 대학회계 직원 및 그 밖의 직원을 둘 수 있다.","② 본교의 교육·연구 및 학사에 관한 사무를 보조하는 조교로 교육공무원 조교와 대학회계 조교를 둘 수 있다."]},{"c":"제2장 조직","t":"제7조(단과대학)","l":["# 제2절 교육조직","본교에는 단과대학으로 해사대학과 해양공과대학을 둔다."]},{"c":"제2장 조직","t":"제8조(학부·학과)","l":["본교에 두는 학부(과), 전공 및 입학정원은 별표 1과 같다."]},{"c":"제2장 조직","t":"제9조(대학원)","l":["① 본교에 일반대학원으로 대학원과 특수대학원으로 해양산업대학원을 둔다.","② 대학원에 두는 학과, 학과에 두는 전공 및 학위과정별 입학정원은 별표 2와 같다.","③ 해양산업대학원에 두는 학과, 학과에 두는 전공 및 입학정원은 별표 3과 같다."]},{"c":"제2장 조직","t":"제10조(학장·대학원장)","l":["① 단과대학에는 학장을, 대학원 및 해양산업대학원에는 원장을 둔다.","② 학장과 원장은 해당 단과대학이나 대학원의 행정을 통할하고, 소속 학생의 교육과 소관시설의 운영을 담당한다."]},{"c":"제2장 조직","t":"제11조(학부(과)","l":["장) ① 학부(과)에는 학부(과)장을 두며, 전임교원 중에서 총장이 임명한다.","② 대학원 및 해양산업대학원의 학과장은 단과대학의 학부(과)장이 겸직한다.","③ 학부(과)장은 소속 학부(과) 및 전공의 운영을 담당한다."]},{"c":"제2장 조직","t":"제12조(교양교직부)","l":["교양 및 교원양성 교육을 위하여 본교에 교양교직부를 두며, 교양교직부장은 전임교원 중에서 총장이 임명한다. <개정 2025.12.31.>"]},{"c":"제2장 조직","t":"제13조(승선실습과정부)","l":["승선실습 교육을 위하여 본교에 승선실습과정부를 두며, 승선실습과정부장은 전임교원 중에서 총장이 임명한다."]},{"c":"제2장 조직","t":"제14조(처·국·본부 설치)","l":["# 제3절 행정조직 및 시설","① 본교에 교무처, 입학학생처, 기획조정처, 사무국, 취업실습본부, 국제교류본부, GPS교육혁신본부를 두며, 처장 및 본부장은 교수 또는 부교수로 겸보하고, 사무국장은 고위공무원단에 속하는 별정직공무원, 3급 상당 또는 4급 상당 별정직공무원으로 보하거나 교수 또는 부교수 중에서 겸보한다.","② 교무처, 입학학생처, 기획조정처에 부처장을 둘 수 있으며, 부처장은 조교수 이상으로 겸보한다.","③ 사무국에 총무과를 두며, 총무과장은 5급 이상의 일반직 공무원으로 보한다."]},{"c":"제2장 조직","t":"제15조(총장 직속 기구 등)","l":["① 국책사업, 정부·지자체 등이 지원하는 재정사업, 연구과제 등을 효율적으로 수행하기 위하여 총장 직속 기구, 사업단 및 위원회 등을 둘 수 있다.","② 총장 직속 기구로 창업지원단, 인권센터 등을 둘 수 있다."]},{"c":"제2장 조직","t":"제16조(교육기본시설 등)","l":["① 본교의 교사시설은 교육기본시설, 지원시설, 연구시설, 부속시설로 구분한다.","② 교육기본시설로 강의실, 실험·실습실, 교수연구실, 행정지원실, 도서관, 정보전산원, 체육관, 학생회관 등을 둔다.","③ 지원시설로 승선생활관, 공대생활관, 마린시뮬레이션센터, 기관공장 등을 둔다.","④ 연구시설로 해양산업연구소, 기계전자기술연구소 등을 둔다.","⑤ 부속시설로 실습선, 교원양성지원센터, 선원정책연구센터, 학생상담센터, 평생교육원, 해양레포츠센터, 지역소통센터, 해기품질관리센터, 현장실습지원센터, 공용장비센터, 박물관, 학생군사교육단을 두며, 필요에 따라 그 밖의 다른 부속시설을 둘 수 있다.","⑥ 제2항부터 5항까지의 교육기본시설 등에는 업무를 총괄하기 위한 장을 둘 수 있다."]},{"c":"제2장 조직","t":"제17조(대학·대학원 행정지원실)","l":["① 대학(원)에 행정지원실을 두되, 2개 이상의 대학(원)의 행정지원실을 통합하여 둘 수 있다.","② 제1항에 따른 행정지원실에는 행정지원실장을 두며, 6급 이하 일반직 공무원으로 보한다."]},{"c":"제2장 조직","t":"제18조(행정조직 등의 운영 및 사무분장)","l":["① 제14조부터 17조까지에 두는 행정조직, 교육기본시설 등의 운영과 사무분장에 관한 세부사항은 규정으로 정한다.","② 제1항의 행정조직, 교육기본시설 등에는 팀을 설치할 수 있으며, 이에 관한 세부사항은 「국립목포해양대학교 팀 운영지침」으로 정한다."]},{"c":"제2장 조직","t":"제19조(자체평가)","l":["① 총장은 교육여건 개선 및 교육·연구의 질적 향상을 위하여 본교의 교육·연구, 조직·운영, 시설·설비 등에 대하여 2년마다 1회 이상 자체평가를 실시하고 그 결과를 공시하여야 한다. 다만, 교육부장관으로부터 인정받은 기관이 학교의 운영 전반에 대하여 종합적으로 평가를 한 경우 이를 해당 연도 자체평가로 대신할 수 있다.","② 총장은 「대학설립·운영규정」제4조제1항의 규정에 따른 연구시설, 부속시설(공통시설은 제외한다) 및 필요하다고 인정하는 시설에 대하여 3년마다 해당 시설의 운영실적을 평가하여 존속 또는 폐지 여부를 결정하여야 한다.","③ 제1항 및 2항의 규정에 따른 자체평가의 기준, 절차 및 방법 등에 관한 세부사항은 「국립목포해양대학교 자체평가 등에 관한 규정」으로 정한다."]},{"c":"제2장 조직","t":"제20조(산학협력단)","l":["① 본교에「산업교육진흥 및 산학연협력촉진에 관한 법률」제25조제1항의 규정에 따라 산학연협력에 관한 업무를 관장하기 위하여 산학협력단을 두고, 단장은 교수 또는 부교수 중에서 겸보한다.","② 산학협력단은 법인으로 한다.","③ 산학협력단은「산업교육진흥 및 산학연협력촉진에 관한 법률」제27조제1항 각 호의 업무를 수행한다.","④ 총장은 본교 소속 교직원으로 하여금 산학협력단의 사무를 수행하게 할 수 있다.","⑤ 총장은 산학협력단장과 협의하여 산학협력단 소속 직원을 본교의 연구지원 등의 사무를 수행하게 할 수 있다.","⑥ 산학협력단의 조직 및 운영 등에 관한 세부사항은 「국립목포해양대학교 산학협력단 정관」으로 정한다."]},{"c":"제2장 조직","t":"제21조(학교기업)","l":["①「산업교육진흥 및 산학연협력 촉진에 관한 법률」제36조제1항의 규정에 따라 별표 4의 학교기업을 둔다.","② 학교기업의 장은 산학협력단장의 추천으로 총장이 임명한다.","③ 학교기업의 설치 및 운영에 관한 세부사항은 「국립목포해양대학교 학교기업 설치 및 운영에 관한 규정」으로 정한다."]},{"c":"제2장 조직","t":"제22조(교수회)","l":["# 제4절 교수회·교무회·대학평의원회 및 각종 위원회","① 본교의 운영에 관한 중요 사항을 심의하기 위해 교수회를 둔다.","② 교수회는 본교 전임교원으로 구성하며, 총장이 의장이 된다.","③ 교수회의 회의는 의장이 필요하다고 인정할 때 또는 재적 교원 3분의 1이상의 요구가 있을 때 소집해야 한다.","④ 교수회의 운영에 관한 세부사항은 「국립목포해양대학교 교수회 규정」으로 정한다."]},{"c":"제2장 조직","t":"제23조(단과대학 교수회)","l":["① 단과대학의 운영에 관한 중요사항을 심의하기 위해 단과대학 교수회를 둔다.","② 단과대학 교수회는 단과대학 소속 전임교원으로 구성하며, 학장이 의장이 된다.","③ 단과대학 교수회의 회의는 의장이 필요하다고 인정할 때 또는 재적 교원 3분의1 이상의 요구가 있을 때에는 단과대학 교수회를 소집해야 한다.","④ 단과대학 교수회는 재적 전임교원 과반수의 출석으로 개회하고 출석 전임교원 과반수의 찬성으로 의결한다.","⑤ 단과대학 교수회는 다음 사항을 심의한다.","1. 단과대학 소속 학부(과) 설치, 변경 및 폐지에 관한 사항","2. 학생 제적에 관한 사항","3. 기타 학장이 필요하다고 인정하는 사항"]},{"c":"제2장 조직","t":"제24조(학부(과)","l":["교수회) ① 학부(과)(교양교직부, 승선실습과정부를 포함한다. 이하 이 조에서 같다)의 운영에 관한 중요사항을 심의하기 위해 학부(과) 교수회를 둔다.","② 학부(과) 교수회는 학부(과) 소속 전임교원으로 구성하며, 학부(과)장(교양교직부장, 승선실습과정부장을 포함한다. 이하 이 조에서 같다)이 의장이 된다.<개정 2025.12.31.>","③ 학부(과) 교수회의 회의는 의장이 필요하다고 인정할 때 또는 재적 교원 3분의1 이상의 요구가 있을 때에는 학부(과) 교수회를 소집해야 한다.","④ 학부(과) 교수회는 재적 전임교원 과반수의 출석으로 개회하고 출석 전임교원 과반수의 찬성으로 의결한다.","⑤ 학부(과) 교수회는 다음 사항을 심의한다.","1. 교육과정 개편에 관한 사항","2. 전임교원, 비전임교원 및 조교 채용에 관한 사항","3. 학사운영 및 학생 지도에 관한 사항","4. 기타 학부(과)장이 필요하다고 인정하는 사항"]},{"c":"제2장 조직","t":"제25조(교무회)","l":["① 본교의 운영에 관한 중요 사항을 심의하기 위하여 교무회를 둔다.","② 교무회는 총장, 대학원장, 학장, 교무처장, 입학학생처장, 기획조정처장, 사무국장, 취업실습본부장, 국제교류본부장, GPS교육혁신본부장, 산학협력단장과 총장이 임명하는 보직교원 등 15명 이내의 위원으로 구성한다.","③ 교무회의 회의는 총장이 소집하고, 그 의장이 된다.","④ 교무회의 운영에 관한 세부사항은 「국립목포해양대학교 교무회 규정」으로 정한다."]},{"c":"제2장 조직","t":"제26조(단과대학 학무회)","l":["① 단과대학의 학사운영에 관한 중요 사항을 심의하기 위하여 단과대학에 학무회를 둔다.","② 학무회의 운영에 관한 세부사항은 「국립목포해양대학교 단과대학 학무회 규정」으로 정한다."]},{"c":"제2장 조직","t":"제27조(대학평의원회)","l":["① 본교에 「고등교육법」 제19조의2제1항의 규정에 따라 대학평의원회를 둔다.","② 대학평의원회의 구성 및 운영에 관한 세부사항은 「국립목포해양대학교 대학평의원회 규정」으로 정한다."]},{"c":"제2장 조직","t":"제28조(교수평의회)","l":["① 본교의 발전과 교육에 관한 중요 사항을 심의하기 위하여 교수평의회를 둔다.","② 교수평의회의 구성 및 운영에 관한 세부사항은 「국립목포해양대학교 교수평의회 규정」으로 정한다."]},{"c":"제2장 조직","t":"제29조(대학원위원회)","l":["①「고등교육법시행령」 제24조제1항의 규정에 따라 본교에 두는 대학원위원회는 대학원장, 해양산업대학원장, 교무처장, 입학학생처장, 대학원의 각 학과장, 해양산업대학원의 각 학과장 및 총장이 임명하는 부교수 이상의 전임교원 등 15명 이내의 위원으로 구성한다.","② 대학원위원회의 위원장은 대학원장이 된다.","③ 대학원위원회의 회의는 위원장이 소집하며, 재적위원 과반수의 출석으로 개회하고, 출석위원 과반수의 찬성으로 의결한다.","④ 대학원위원회는 대학원 및 해양산업대학원에 관한 다음 사항을 심의한다.","1. 입학·수료 및 학위수여에 관한 사항","2. 학과 또는 전공의 설치·폐지와 학생정원에 관한 사항","3. 교육과정에 관한 사항","4. 대학원 및 해양산업대학원 관련 규정의 제·개정에 관한 사항","5. 기타 대학원 및 해양산업대학원의 운영에 관한 중요사항"]},{"c":"제2장 조직","t":"제30조(교원인사위원회)","l":["①「교육공무원법」제5조제1항의 규정에 따라 본교에 교원인사위원회를 둔다.","② 교원인사위원회의 구성 및 운영에 관한 세부사항은 「국립목포해양대학교 교원인사위원회 규정」으로 정한다."]},{"c":"제2장 조직","t":"제31조(기획위원회)","l":["① 본교의 중·장기 발전계획 및 교육계획 등에 관한 총장의 자문에 응하기 위하여 기획위원회를 둔다.","② 기획위원회의 구성 및 운영에 관한 세부사항은 「국립목포해양대학교 기획위원회 규정」으로 정한다."]},{"c":"제2장 조직","t":"제32조(재정위원회)","l":["①「국립대학의 회계 설치 및 재정 운영에 관한 법률」 제8조제1항의 규정에 따라 본교의 운영에 필요한 재원의 확보와 재정운용에 관한 기본사항을 심의하기 위하여 재정위원회를 둔다.","② 재정위원회의 구성 및 운영에 관한 세부사항은 「국립목포해양대학교 재정 및 회계의 운영에 관한 규정」으로 정한다."]},{"c":"제2장 조직","t":"제33조(등록금심의위원회)","l":["① 「고등교육법」 제11조제3항의 규정에 따라 대학 등록금 책정에 관한 사항을 심의하기 위하여  등록금심의위원회를 둔다.","② 등록금 심의위원회의 구성 및 운영에 관한 세부사항은 「국립목포해양대학교 등록금 심의위원회 규정」으로 정한다."]},{"c":"제2장 조직","t":"제34조(교육과정위원회)","l":["① 대학 교육과정에 관한 중요한 사항을 심의하기 위하여 교육과정위원회를 둔다.","② 교육과정위원회의 구성 및 운영에 관한 세부사항은 「국립목포해양대학교 교육과정위원회 규정」으로 정한다."]},{"c":"제2장 조직","t":"제35조(대학입학전형관리위원회)","l":["① 대학 입학전형의 중요한 사항을 심의하기 위하여 대학입학전형관리위원회를 둔다.","② 대학입학전형관리위원회의 구성 운영에 관한 세부사항은 「국립목포해양대학교 대학입학전형관리위원회 규정」으로 정한다."]},{"c":"제2장 조직","t":"제36조(대학입학전형 공정관리대책위원회)","l":["① 대학 입학전형의 공정한 관리를 위하여 대학입학전형 공정관리대책위원회를 둔다.","② 대학입학전형 공정관리대책위원회의 구성 및 운영에 관한 세부사항은 「국립목포해양대학교 대학입학전형 공정관리대책위원회 규정」으로 정한다."]},{"c":"제2장 조직","t":"제37조(교원양성위원회)","l":["① 「교원자격검정령」 제17조의2제1항의 규정에 따라 교원자격 검정실시 및 교직교육과정 운영 등의 관한 사항을 심의하기 위하여 교원양성위원회를 둔다.","② 교원양성위원회의 구성 및 운영에 관한 세부사항은 「국립목포해양대학교 교원양성위원회 규정」으로 정한다."]},{"c":"제2장 조직","t":"제38조(그 밖의 위원회)","l":["① 본교의 학사 운영을 위하여 다음 각 호의 위원회를 둔다.","1. 규정심의위원회","2. 대학교육혁신위원회","3. 구성원 참여·소통위원회","4. 입학전형 선행학습 영향평가위원회","5. 정보화심의위원회","6. 학점인정심의위원회","② 제1항의 위원회 이외에 본교의 민주적이고 효율적인 대학운영을 위하여 교육, 연구 및 행정 등에 관한 위원회를 둘 수 있다.","③ 제1항 및 제2항에 따른 위원회의 구성 및 운영에 관한 세부사항은 규정으로 정한다."]},{"c":"제3장 학사운영","t":"제39조(학위과정)","l":["# 제1절 학사운영 일반","① 본교의 대학에 학사학위과정, 대학원에 석사학위과정, 박사학위과정 및 석·박사학위통합과정을 두며, 해양산업대학원에 석사과정을 둔다.","② 학사학위과정과 대학원 석사학위과정을 상호 연계하여 운영하는 학·석사연계과정을 둘 수 있으며, 학·석사연계과정 운영에 관한 세부사항은 규정으로 정한다."]},{"c":"제3장 학사운영","t":"제40조(학년도, 학기)","l":["① 학년도는 3월 1일부터 다음해 2월 말일까지로 한다.","② 학기는 다음과 같이 구분하며, 교육상 필요에 따라 전공, 학년 또는 학위과정별로 달리 정할 수 있다.","1. 제1학기: 3월 1일부터 8월 말일까지","2. 제2학기: 9월 1일부터 다음해 2월 말일까지","3. 계절학기: 여름 및 겨울 휴가 중 각 3주 이상","4. 특별학기: 제1학기, 제2학기, 여름 및 겨울 휴가 중 15시간 이상","③ 계절학기 및 특별학기의 운영에 관한 세부사항은 「국립목포해양대학교 계절학기 운영에 관한 규정」과 「국립목포해양대학교 교학규정」으로 정한다.","④ 교육과정 운영에 필요한 경우 집중수업을 운영할 수 있다.","⑤ 제2학기의 경우 2주를 초과하지 않는 범위 안에서 학기 개시일 전에 개강할 수 있다."]},{"c":"제3장 학사운영","t":"제41조(수업일수)","l":["① 수업일수는 학교의 수업일수와 교과별 수업일수로 구분한다.","② 학교의 수업일수는 매 학년도 30주 이상(매 학기 15주 이상)으로 한다.","③ 천재지변 또는 기타 교육과정의 운영상 부득이한 사유로 제2항의 수업일수를 충족할 수 없을 경우 매 학년도 2주 이내의 범위에서 수업일수를 감축할 수 있다.","④ 교과별 수업일수는 학교의 수업일수 이내로 정하되, 제65조제3항의 학점당 필요한 이수시간의 이수에 지장이 없도록 정하여야 한다.","⑤ 계절학기와 특별학기의 수업일수는 제2항의 수업일수에 포함하지 않는다."]},{"c":"제3장 학사운영","t":"제42조(휴업일)","l":["① 정기 휴업일은 다음 각 호와 같다.","1. 관공서의 공휴일","2. 여름휴가 및 겨울휴가 기간","3. 개교기념일(4월 5일)","② 총장은 필요한 경우 제1항의 휴업일을 변경하거나 임시휴업을 할 수 있다.","③ 총장은 휴업일이라도 필요하면 수업을 하게 할 수 있다."]},{"c":"제3장 학사운영","t":"제43조(수업연한)","l":["① 학사학위과정의 수업연한은 4년으로 하되, 1년 범위 안에서 단축할 수 있다.","② 석사 및 박사학위과정의 수업연한은 다음 각 호와 같다.","1. 대학원: 석사학위과정 2년(학·석사연계과정은 1년 6개월), 박사학위과정 2년, 석·박사학위통합과정 4년","2. 해양산업대학원: 석사학위과정 2년 6개월","③ 제2항제1호에도 불구하고 석·박사학위통합과정의 경우 학위취득에 필요한 학점 이상을 취득한 학생에게는 수업연한을 6개월 단축할 수 있으며, 수업연한 단축에 관한 세부사항은 「국립목포해양대학교 대학원 학위수여 규정」으로 정한다."]},{"c":"제3장 학사운영","t":"제44조(재학연한)","l":["① 학사학위과정의 재학연한은 수업연한(편입학생 및 재입학생의 경우 편입학･재입학일 기준 잔여 수업연한)의 2배로 한다. 다만, 해양산업융합학과의 재학연한은 제한하지 아니한다.","② 석사 및 박사학위과정의 재학연한은 다음 각 호와 같다.","1. 대학원: 석사학위과정 3년, 박사학위과정 5년, 석·박사학위통합과정 8년","2. 해양산업대학원: 4년","③ 휴학기간은 재학연한에 산입하지 않는다."]},{"c":"제3장 학사운영","t":"제45조(교학규정 등)","l":["교학행정에 대한 세부적인 사항은 「국립목포해양대학교 교학규정」 및 관련 규정으로 정한다."]},{"c":"제3장 학사운영","t":"제46조(입학 시기)","l":["# 제2절 입학 및 등록","입학 시기는 학기개시일로부터 3주 이내로 한다."]},{"c":"제3장 학사운영","t":"제47조(입학자격)","l":["① 학사학위과정에 입학할 수 있는 사람은 고등학교를 졸업한 사람 또는 법령에 의하여 이와 동등 이상의 학력이 있다고 인정된 사람으로 한다.","② 석사학위과정 또는 석·박사학위통합과정에 입학할 수 있는 사람은 학사학위를 가지고 있는 사람(취득예정자를 포함한다.) 또는 법령에 의하여 이와 동등 이상의 학력이 있다고 인정된 사람으로 한다.","③ 박사학위과정에 입학할 수 있는 사람은 석사학위를 가지고 있는 사람(취득예정자를 포함한다.) 또는 법령에 의하여 이와 동등 이상의 학력이 있다고 인정된 사람으로 한다."]},{"c":"제3장 학사운영","t":"제48조(입학 전형유형)","l":["입학 전형유형 및 선발 절차 등에 관한 세부사항은 매 학년도 모집요강으로 정한다."]},{"c":"제3장 학사운영","t":"제49조(편입학)","l":["① 학사학위과정의 일반편입학은 대학의 정원에 결원이 있을 경우 입학정원의 범위 안에서 전문대학을 졸업한 사람 또는 법령에 의하여 이와 동등 이상의 학력이 있다고 인정되는 사람에 대하여 3학년으로 편입학을 허가할 수 있다.","② 석사 및 박사학위과정의 일반편입학은 대학원 및 해양산업대학원의 정원에 결원이 있을 경우 해당 학년도 입학정원에서 재학생수를 뺀 범위 안에서 대학원위원회의 심의를 거쳐 편입학을 허가할 수 있다.","③ 징계에 의하여 제적된 사람에 대하여는 편입학을 허가할 수 없다.","④ 편입학의 전형 방법과 절차 등은 편입학 모집요강으로 정한다."]},{"c":"제3장 학사운영","t":"제50조(재입학)","l":["① 자퇴나 제적된 사람이 재입학을 원할 때에는 정원에 여석이 있는 경우 매 학기 정해진 기일 내에 1회에 한하여 재입학을 허가할 수 있다.","② 학사학위과정의 재입학은 자퇴 또는 제적 당시의 학년 이하로 재입학을 허가한다. 다만, 재입학하기 이전에 취득한 학점을 심사하여 제83조의 수료 기준을 충족하였을 경우 자퇴 또는 제적 당시의 학년 이상으로 재입학을 허가할 수 있다.","③ 다음 각 호의 어느 하나에 해당하는 사람에 대하여는 재입학을 허가할 수 없다.","1. 징계로 제적된 사람","2. 징계 기간 중 자퇴한 사람","3. 재학연한 초과로 제적된 사람","④ 재입학을 신청한 학생의 자퇴나 제적 당시 모집단위가 폐지된 경우 해당 모집단위의 교육과정과 유사한 교육과정을 운영하는 모집단위로 재입학을 허가할 수 있다."]},{"c":"제3장 학사운영","t":"제51조(정원 외 입학)","l":["총장은 ｢고등교육법 시행령｣ 제29조제2항과 제30조제8항에서 정한 범위 안에서 전형을 거쳐 정원 외로 입학(편입학 포함)을 허가할 수 있다."]},{"c":"제3장 학사운영","t":"제52조(대학입학전형의 선행학습 영향평가)","l":["① 대학입학전형 시 자체고사(논술 등 필답고사, 면접·구술고사 등)를 실시하는 경우 선행학습을 유발하는지에 대한 영향평가를 실시하고 다음 연도 입학전형에 반영하여야 한다.","② 선행학습 영향평가에 관한 세부사항은 「국립목포해양대학교 입학전형 선행학습 영향평가위원회 규정」으로 정한다."]},{"c":"제3장 학사운영","t":"제53조(입학의 취소 및 무효)","l":["① 입학이 허가된 학생이 다음 각 호의 어느 하나에 해당하는 부정행위를 한 경우 그 입학의 허가를 취소한다.","1. 입학전형에 위조 또는 변조 등 거짓 자료를 제출한 경우","2. 입학전형에 다른 사람을 대리 응시하게 한 경우","3. 입학전형에 다른 응시자의 답안지를 보거나 다른 응시자에게 자신의 답안지를 보여주는 행위를 한 경우","4. 그 밖에 입학전형을 공정하게 시행·관리하는 데에 부당한 영향을 미치는 행위로써 관련 규정 또는 모집요강 등에서 정한 입학 취소 사유에 해당하는 경우","② 「고등교육법 시행령」제42조의 입학지원방법을 위반하여 대학에 입학한 경우 그의 입학을 무효로 한다."]},{"c":"제3장 학사운영","t":"제54조(대학원 연구생)","l":["① 대학원 및 해양산업대학원에 학위과정 외에 학위를 수여하지 않은 연구생을 둘 수 있다.","② 대학원 연구생 선발 및 학사운영 등에 관한 세부사항은 「국립목포해양대학교 대학원 연구생에 관한 규정」으로 정한다."]},{"c":"제3장 학사운영","t":"제55조(시간제등록생)","l":["① 학사학위과정에 고등학교를 졸업한 사람이나 법령에 따라 이와 같은 수준 이상의 학력이 있다고 인정된 사람을 시간제로 등록하여 수업을 받게 할 수 있다.","② 시간제등록생의 선발인원은 해당 연도 입학정원의 10%이내에서 모집요강으로 정한다.","③ 시간제등록생이 매 학기 취득할 수 있는 학점은 제66조제1항에서 규정한 매 학기 수강신청 기준학점의 2분의 1 이내로 한다.","④ 시간제등록생의 교육과정 및 학사운영 등에 관한 세부사항은 「국립목포해양대학교 시간제등록생 학사운영규정」으로 정한다."]},{"c":"제3장 학사운영","t":"제56조(공개강좌)","l":["① 본교에 직무, 교양 또는 연구에 필요한 학술적 이론과 기술의 습득을 희망하는 사람을 지도하기 위하여 공개강좌를 둘 수 있다.","② 공개강좌 수강생에 대하여 등록금 또는 수강비를 징수할 수 있다.","③ 공개강좌의 운영에 관한 세부사항은 규정으로 정한다."]},{"c":"제3장 학사운영","t":"제57조(등록금 납부)","l":["① 학생은 매 학기 총장이 정한 기간에 등록금을 납부하여야 한다.","② 석사 및 박사학위과정을 수료한 사람은 논문 준비를 위해 등록을 할 수 있다."]},{"c":"제3장 학사운영","t":"제58조(등록금 징수방법)","l":["① 등록금은 학점별·학기별로 징수할 수 있으며, 분할납부를 신청한 학생에게는 분할하여 징수 할 수 있다.","② 입학금(석사 및 박사학위과정 학생에 한정한다. 이하 같다)은 학생이 입학할 때 전액을 징수한다. 다만 학·석사연계과정은 입학금을 면제한다.","③ 해양산업융합학과 학생, 장애학생 및 시간제등록생의 등록금은 제66조제1항의 학기당 수강신청 기준학점을 등록금의 상한액으로 하고, 상한액을 수강신청 기준학점으로 나눈 금액에 신청학점을 곱한 금액으로 산정하여 징수한다.","④ 학기가 개시되기 전(학기가 시작된 이후 총장이 따로 정하는 미등록 휴학기간이 있는 경우에는 그 기간을 포함한다.)에 휴학하고자 하는 학생에게는 등록금을 징수하지 않는다.","⑤ 제43조의 수업연한이 지났으나 졸업에 필요한 학점을 취득하지 못하여 등록을 하는 학생에 대한 등록금은 다음 각 호의 기준에 따라 징수한다.","1. 학사학위과정","가. 1학점부터 17학점까지는 학점 당 등록금은 해당 학기 등록금의 18분의 1 해당액","나. 18학점 이상은 해당 학기 등록금","2. 석사학위과정, 박사학위과정, 석·박사학위통합과정","가. 1학점부터 5학점까지의 학점 당 등록금은 해당 학기 등록금의 6분의 1 해당액","나. 6학점 이상은 해당 학기 등록금","⑥ 등록금은 결석, 출석정지, 정학 및 기준학점 이하 수강신청을 이유로 감액 또는 면제되지 않는다."]},{"c":"제3장 학사운영","t":"제59조(등록금의 반환)","l":["① 등록금이 과오납된 경우 그 금액을 전액 반환한다.","② 다음 각 호의 어느 하나에 해당하는 경우 ｢대학등록금에 관한 규칙｣ 별표의 기준에 따라 이미 납부한 등록금을 반환한다.","1. 법령에 따라 입학(재입학 및 편입학을 포함한다. 이하 이 조에서 같다)을 할 수 없거나 학업을 계속할 수 없는 경우","2. 입학허가를 받은 사람이 입학포기의 의사를 표시한 경우","3. 재학 또는 휴학 중인 학생이 자퇴의 의사를 표시한 경우","4. 휴학 중인 학생이 복학하지 않아 제적된 경우","5. 본인의 질병·사망 또는 천재지변이나 그 밖에 부득이한 사유로 입학을 하지 않게 되거나 학업을 계속하지 않게 된 경우","6. 등록금을 납부한 후 휴학한 학생이 등록금 반환신청을 한 경우","③ 등록금을 납부한 후 휴학한 학생이 등록금 반환신청을 하지 않은 경우 납부한 등록금은 복학하는 학기의 등록금으로 이월된다."]},{"c":"제3장 학사운영","t":"제60조(교육과정 편성 방향)","l":["# 제3절 교육과정 이수","① 교육과정은 본교의 교육목표와 각 학부(과)별 인재상을 달성할 수 있도록 편성한다.","② 교육과정은 교과와 비교과로 구분하고, 교과는 학위과정에 따라 학부, 학과 그리고 전공단위로 편성한다.","③ 학사학위과정 교과 교육과정은 교양교육과정과 전공교육과정으로 구분하여 편성·운영한다.","④ 학사학위과정의 교과목은 교양과목, 전공과목, 교직과목 및 일반선택과목으로 구분하고, 전공과목, 교양과목 및 교직과목은 필수와 선택으로 각각 구분한다.","⑤ 대학원 석사 및 박사학위과정의 교과목은 전공선택과목으로 하고, 해양산업대학원 석사학위과정의 교과목은 전공공통과목과 전공선택과목으로 구분한다.","⑥ 교원양성과정을 승인받은 학부에는 교직과목을 개설할 수 있으며, 교직과정 운영에 관한 세부사항은 「국립목포해양대학교 교직과정 운영 지침」으로 정한다.","⑦ 국내·외 대학과의 교류협정에 따라 교육과정을 공동으로 운영할 수 있으며, 이에 관한 세부사항은 규정으로 정한다.","⑧ 교육과정의 편성 및 운영에 관한 세부사항은 「국립목포해양대학교 교학규정」으로 정한다."]},{"c":"제3장 학사운영","t":"제61조(전공 이수)","l":["① 학사학위과정의 전공은 다음 각 호와 같이 구분한다.","1. 기본전공: 학부(과)에서 정한 전공 분야의 기본 교육과정을 이수하는 전공","2. 복수전공: 학생 모집단위에 설치된 학부(과)의 기본전공으로, 본인이 소속된 학부(과) 이외의 다른 학부(과)의 기본전공을 추가로 이수하는 과정","3. 부전공: 복수전공, 연계전공, 융합전공, 융합트랙에서 정해진 학점 이상의 전공과목을 이수하는 과정","4. 연계전공: 모집단위에 설치되지 않은 전공 교육과정으로 1개 이상의 학부(과)가 주관하여 학내외의 다른 학부(과, 전공)나 기관(연구소, 기업체 등)과 연계하여 운영하는 전공","5. 융합전공: 모집단위에 설치되지 않은 전공 교육과정으로 2개 이상의 학부(과)가 융합하여 운영하는 전공","6. 융합트랙: 전공 교육과정과는 별도로 교육과정을 재구성하여 이수하는 전공","7. 모듈형 과정: 창의적 사고능력의 함양과 시대요구에 부응하는 전공 능력의 심화를 달성하기 위해 운영하는 소단위 전공","② 학사학위과정의 학생은 다음 각 호의 구분에 따른 전공을 이수하여야 한다.","1. 해사대학: 기본전공, 모듈형 과정(마이크로디그리, 나노디그리)","2. 해양공과대학: 기본전공","3. 해양산업융합학과 및 첨단해양모빌리티학과: 기본전공","③ 제2항에도 불구하고 해사대학 학사학위과정의 학생이 다음 각 호의 어느 하나를 이수할 경우 모듈형 과정을 이수하지 않을 수 있다.","1. 복수전공","2. 부전공","3. 연계전공","4. 융합전공","5. 융합트랙","6. 교직과정","④ 전공 이수에 관한 세부사항은 「국립목포해양대학교 전공이수에 관한 규정」으로 정한다."]},{"c":"제3장 학사운영","t":"제62조(전공 이수학점)","l":["학사학위과정의 전공 이수에 필요한 전공과목 최소 이수학점은 다음 각 호와 같다.","1. 기본전공","가. 해사대학 항해학 전공: 83학점","나. 해사대학 기관공학 전공: 80학점","다. 해양공과대학: 70학점. 다만, 해양스포츠학과는 50학점으로 한다.","라. 해양산업융합학과 및 첨단해양모빌리티학과: 50학점","2. 부전공: 21학점","3. 연계전공: 36학점","4. 융합전공: 42학점","5. 융합트랙: 21학점","6. 모듈형 과정(마이크로디그리): 12학점","7. 모듈형 과정(나노디그리): 6학점"]},{"c":"제3장 학사운영","t":"제63조(교양 이수학점)","l":["학사학위과정의 교양 이수에 필요한 교양과목 최소 이수 학점은 다음 각 호와 같다.","1. 해사대학: 30학점","2. 해양공과대학: 35학점. 다만, 해양스포츠학과는 30학점으로 한다.","3. 해양산업융합학과 및 첨단해양모빌리티학과: 30학점"]},{"c":"제3장 학사운영","t":"제64조(수강신청)","l":["① 총장은 매 학기 수업시간표를 편성하여 공고하여야 한다.","② 학생은 매학기 수업시간표에 따라 수강하고자 하는 교과목을 총장이 정한 기간에 수강신청 하여야 한다.","③ 제57조제2항 및 제89조제2항에 따라 등록하는 사람과 본교와 교류협정이 체결된 대학에서 총장의 승인을 받아 수학하는 학생은 수강신청을 하지 않을 수 있다."]},{"c":"제3장 학사운영","t":"제65조(수업 및 교과 이수)","l":["① 수업은 주간수업, 야간수업, 계절수업, 방송·통신 매체 등을 활용한 원격수업(이하 “원격수업”이라 한다.), 현장실습수업, 집중수업, 이동수업 등으로 할 수 있다.","② 학사학위과정 및 대학원 수업은 주간에, 해양산업대학원 수업은 야간에 실시함을 원칙으로 하며, 교과목 또는 학부(과) 운영 상 필요한 경우 주간이나 야간, 공휴일에도 실시할 수 있다.","③ 교과 이수단위는 학점단위로 하고, 한 학기 15시간 이상을 1학점으로 하되, 실험·실습, 실기, 체육 교과목은 한 학기 30시간 이상을 1학점으로 한다. 다만, 승선실습 교과의 학점 당 이수시간과 이수 방법 및 절차에 관한 세부사항은 「국립목포해양대학교 승선실습학사 운영규정」으로 정한다.","④ 계절수업, 원격수업, 현장실습 수업, 집중수업, 이동수업에 관한 세부사항은 규정으로 정한다."]},{"c":"제3장 학사운영","t":"제66조(학기당 수강학점)","l":["① 학사학위과정의 매 학기 수강신청 기준학점은 다음 각 호와 같다. 다만, 해사대학 학생의 승선실습 학기 기준학점은 15학점으로 한다.","1. 졸업학점이 120학점인 학부(과): 15학점","2. 졸업학점이 130학점인 학부(과): 17학점","3. 졸업학점이 140학점인 학부(과): 19학점","② 매 학기 최대 수강신청 할 수 있는 학점은 다음 각 호와 같다. 이 경우 계절학기 및 특별학기 수강신청 학점은 포함하지 않는다.","1. 학사학위과정","가. 졸업학점이 120학점인 학부(과): 18학점","나. 졸업학점이 130학점인 학부(과): 20학점","다. 졸업학점이 140학점인 학부(과): 22학점","2. 석사학위과정","가. 대학원: 10학점 이내","나. 해양산업대학원: 6학점 이내","3. 석·박사학위통합과정: 10학점 이내","4. 박사학위과정: 10학점  이내","③ 제2항의 규정에도 불구하고 제61조제1항제2호부터 제6호까지의 전공, 학·석사연계과정 및 교직과정을 이수 중인 학사학위과정의 학생은 학기당 6학점까지 추가로 수강신청 할 수 있다.","④ 제69조제1항의 규정에 따른 보충과목의 수강신청 학점은 제2항제2호부터 제4호까지의 매 학기 수강신청 할 수 있는 학점에 포함하지 않는다.","⑤ 매 계절학기에 수강신청 할 수 있는 학점은 6학점 이내로 한다. 다만, 복수전공, 융합전공, 융합트랙 이수 교과목을 계절학기에 수강 신청한 학생은 해당 교과목을 포함하여 9학점까지 수강할 수 있다.","⑥ 제2항의 규정에도 불구하고 해당 학기 학사경고자의 다음 학기 수강신청 학점은 제1항의 기준학점을 초과할 수 없다."]},{"c":"제3장 학사운영","t":"제67조(승선실습)","l":["① 해사대학 학생은 재학 중 1년 이상 총장이 지정하는 곳에서 승선실습을 받아야하며, 선박(함정을 포함한다)의 운항 또는 기관의 운전에 관한 훈련을 실시할 수 있는 시설을 갖추었다고 해양수산부장관이 인정하는 조선소 등의 육상실습장에서 계속하여 실습을 한 6개월 이내의 기간은 승선실습기간에 포함한다.","② 해사대학 학생에게는 선박에 대한 기초지식을 습득하게 하고, 선상생활에 적응할 수 있는 능력을 기르기 위한 선박친숙훈련을 실시한다.","③ 제1항의 규정에 따라 승선실습을 하여야 하는 학생은 승선실습을 시작하기 전에 기초안전교육 및 선박보안교육 교과목과 제2항에 따른 선박친숙훈련을 이수하여야 한다.","④ 승선실습의 학사운영에 관한 세부사항은「국립목포해양대학교 승선실습학사 운영규정」으로 정한다."]},{"c":"제3장 학사운영","t":"제68조(승선생활훈련)","l":["① 해사대학 학생은 수업연한(편입학생의 경우 본교에서 수업연수 3년) 범위 안에서 재학 중 승선생활관에 입관하여 승선생활훈련을 받아야 한다. 다만, 본교와 교류협정이 체결된 대학에서 총장의 승인을 받아 수학하는 기간은 승선생활훈련을 면제한다.","② 제1항의 규정에 따라 승선생활관에 입관한 학생이 우수 해기사 양성 대상자로 부적격하다고 인정되는 때에는 승선생활관에서 일정 기간 동안 퇴관시킬 수 있다."]},{"c":"제3장 학사운영","t":"제69조(보충과목이수)","l":["① 대학원 석사학위과정, 석·박사학위통합과정 또는 박사학위과정에 입학한 학생의 전공분야가 하위학위과정에서 이수한 전공분야와 다를 경우 하위 학위과정의 전공과목에서 보충과목으로 석사학위과정과 석·박사학위통합과정은 각각 9학점 이상, 박사학위과정은 6학점 이상을 이수하여야 한다. 다만, 하위과정에서 취득한 학점 중 입학한 학과에서 정하는 선수과목과 유사하거나 전공분야와 유사한 업무를 하고 있는 경력자로 인정될 경우 대학원위원회 심의를 거쳐 감면할 수 있다.","② 제1항의 규정에 따라 보충과목을 이수하여 취득한 학점은 제84조제2항의 졸업학점에 넣어 포함하지 않는다."]},{"c":"제3장 학사운영","t":"제70조(공학교육인증제)","l":["① 해양공과대학의 학과는 공학교육인증제를 시행할 수 있다.","② 공학교육인증 프로그램의 운영에 관한 세부사항은 규정으로 정한다."]},{"c":"제3장 학사운영","t":"제71조(해기품질관리체제)","l":["총장은 대학의 해기품질관리체제를 구축·운영하며, 주기적으로 교육, 학생, 교원, 시설·설비, 재정·경영 등 세부 영역에 대하여 평가 및 환류를 통해 양질의 해기품질을 지속적으로 유지하여야 한다."]},{"c":"제3장 학사운영","t":"제72조(학생군사교육단 사관후보생과정)","l":["① 학생군사교육단 사관후보생의 군사교육을 실시하기 위하여 학생군사교육단 사관후보생과정을 둘 수 있다.","② 학생군사교육단 사관후보생과정 운영에 관한 세부사항은 「국립목포해양대학교 학생군사교육단 운영규정」으로 정한다."]},{"c":"제3장 학사운영","t":"제73조(시험)","l":["① 시험은 정기시험, 임시시험, 추가시험으로 구분한다.","② 정기시험은 중간시험과 학기말시험으로 구분한다.","③ 임시시험은 필요에 따라 수시로 실시할 수 있다.","④ 추가시험은 질병, 공무, 기타 부득이한 사유로 정기시험에 응하지 못한 학생을 대상으로 총장의 승인을 받아 시행한다."]},{"c":"제3장 학사운영","t":"제74조(성적평가)","l":["① 학업성적은 각 교과목별로 시험성적, 출결, 학습태도, 면담, 발표 및 과제 등으로 종합 평가한다. 다만, 교과 특성상 평가 방법을 달리할 필요가 있는 교과목에 대하여는 평가 방법을 따로 정할 수 있다.","② 학위과정별 학업성적 평가등급과 평점은 다음과 같다.","실점","학사학위과정","석사학위과정","석·박사/박사학위과정","평가등급","평점","평가등급","평점","평가등급","평점","95이상 ~ 100","A+","4.5","A+","4.5","A+","4.5","90이상 ~ 95미만","A0","4.0","A0","4.0","A0","4.0","85이상 ~ 90미만","B+","3.5","B+","3.5","B+","3.5","80이상 ~ 85미만","B0","3.0","B0","3.0","B0","3.0","75이상 ~ 80미만","C+","2.5","C+","2.5","C+","2.5","70이상 ~ 75미만","C0","2.0","C0","2.0","F","0","65이상 ~ 70미만","D+","1.5","F","0","60이상 ~ 65미만","D0","1.0","60미만","F","0.0","③ 성적을 평가하여 실점, 등급 등을 부여하는 것이 적합하지 않은 교과목에 대하여는 급제는 ‘S’로, 낙제는 ‘U’로 급락만 구분한다.","④ 수강신청을 하고 해당 교과목 총 수업시수의 4분의 1을 초과하여 결석한 경우 그 교과목의 평가등급을‘F’로 한다.","⑤ 추가시험 성적은 평가등급을 A0 이하로 한다. 다만, 감염병에 따른 입원 또는 격리 수용 및 공무로 인한 경우 평가등급을 제한하지 않는다.","⑥ 재학 중 졸업학기에 조기 취업한 학생의 성적인정 및 수업일수 4분의 3이 경과한 후 휴학한 학생의 성적처리에 관한 세부사항은 「국립목포해양대학교 교학규정」으로 정한다."]},{"c":"제3장 학사운영","t":"제75조(재이수)","l":["① 이수한 교과목을 재이수하고자 하는 경우에는 학기당 6학점까지 재이수할 수 있으며, 선택교과목의 재이수 횟수는 2회를 초과할 수 없다. 다만, 성적이 F등급 또는 U등급인 경우에는 학점 및 횟수 제한에 포함하지 않는다.","② 교과목을 재이수하는 경우에는 재이수 교과목의 성적을 해당 교과목의 성적으로 한다.","③ 학사학위과정의 재이수 교과목의 평가등급은 A0 이하로 하고, 석사 및 박사학위과정의 재이수 교과목의 평가등급은 제한하지 않는다."]},{"c":"제3장 학사운영","t":"제76조(학사경고)","l":["① 학사학위과정의 학생으로서 수강신청을 하지 않거나 7학점 이상 수강신청하고 해당 학기 학업성적이 평점평균 1.75미만인 학생에게는 학사경고를 한다. 다만, 졸업에 필요한 모든 학점을 이수한 학생 및 수업연한을 초과한 학생은 제외한다.","② 제1항에 따라 학사경고를 한 경우 교무처장은 이 사실을 성적 확정 후 10일 이내에 본인 및 보호자와 소속 학부(과)장에게 통보하여야 한다.","③ 총장은 학사경고자 및 학사경고 위험군 관리를 위해 심리상담 및 진로상담 등을 지원할 수 있다."]},{"c":"제3장 학사운영","t":"제77조(취득학점 인정)","l":["# 제4절 학점인정 및 취소","교과목의 성적 등급이 다음 각 호에 해당하는 경우 또는 등급이 ‘S’인 경우 그 교과목의 이수를 인정하고, 학점을 인정한다.","1. 학사학위과정 : D0 이상","2. 석사학위과정 : C0 이상","3. 석·박사학위통합과정 : C+ 이상","4. 박사학위과정 : C+ 이상"]},{"c":"제3장 학사운영","t":"제78조(재입학자의 학점인정)","l":["재입학한 학생이 재입학 전 취득한 학점은 다시 심사하여 인정한다."]},{"c":"제3장 학사운영","t":"제79조(편입학자의 학점인정)","l":["편입학한 학생이 전적 학교에서 취득한 학점은 이를 심사하여 본교의 학점으로 인정할 수 있다."]},{"c":"제3장 학사운영","t":"제80조(타 대학(원)","l":["등 취득학점 인정) ① 학사학위과정의 학생은 다음 각 호의 어느 하나에 해당하는 경우 일정 학점을 인정받을 수 있다.","1. 재학 중 본교와 학술교류협정이 체결된 국내외 타 대학에서 취득한 학점","2. 신입학 전에 국내외의 고등학교와 국내의「고등교육법」제2조의 규정에 따른 각 호의 학교(다른 법률에 따라 설립된 고등교육기관을 포함하고 본교는 제외한다.)에서 본교의 교육과정에 상당하는 교과목을 이수한 경우 9학점 이내","3. 신입학 전에 본교 교양교육과정의 교과목을 이수한 학점","4.「병역법」에 따른 입영이나 복무로 휴학 중인 학생이 다음 각 목의 어느 하나에 해당하는 경우","가. 「학점인정 등에 관한 법률」 제3조의 규정에 따라 평가인정을 받은 ‘군의 교육·훈련시설에서 설치·운영하는 학습과정’을 이수하여 인정받은 3학점 이내","나. 본교에서 제공하는 교과목을 정보통신망을 활용한 원격수업으로 수강하여 취득한 학점은 학기당 6학점 이내, 최대 12학점","5. 학생이 입학 전 해당 전공분야 교육과정과 관련이 있는 국내외의 다른 학교·연구기관 또는 산업체 등에서 학습·연구·실습·근무한 사실이 인정되는 경우 학점인정심의위원회의 심의를 거쳐 인정받은 졸업학점의 4분의 1이내의 학점","6. 「국립목포해양대학교 교학규정」에서 정하는 타 기관에서 본교 교육과정에 상당하는 교과목을 이수한 경우","② 학사학위과정의 학생이 제1항 각 호의 규정에 따라 취득한 학점은 합산하여 졸업학점의 2분의 1을 초과할 수 없다.","③ 학점인정심의위원회의 구성 및 운영에 필요한 사항과 학점 인정의 절차와 방법에 관한 세부사항은 규정으로 정한다.","④ 석사학위과정, 박사학위과정 또는 석·박사학위통합과정의 학생이 입학하기 전 교내외 타 대학원에서 취득한 학점 중 학문내용이 유사한 교과목에 한하여 석사학위과정은 9학점, 박사학위과정은 12학점, 석·박사학위통합과정은 21학점의 범위 안에서 대학원위원회 심의를 거쳐 총장의 승인을 받아 인정할 수 있다."]},{"c":"제3장 학사운영","t":"제81조(특별학점)","l":["① 학사학위과정의 학생이 다음 각 호의 어느 하나에 해당하는 경우 특별학점의 취득을 인정할 수 있다.","1. 대학생활설계와 관련된 교육을 이수한 경우","2. 본교 평생교육원에서 개설된 교과목을 이수한 경우","3. 본교 국제교류본부에서 주관하는 해외어학연수 프로그램에 참가하여 수료한 경우","4. 제80조제1항제4호 가목 및 제6호에 해당되어 학점을 인정받은 경우","② 제1항의 규정에 따라 취득하는 특별 학점은 제66조제2항의 매 학기 수강신청 할 수 있는 학점에 포함하지 않는다."]},{"c":"제3장 학사운영","t":"제82조(학점의 취소)","l":["학점인정에 착오가 있거나 또는 학점을 부정한 방법으로 인정받은 경우 이를 정정하거나 취소하여야 한다."]},{"c":"제3장 학사운영","t":"제83조(학사학위과정의 수료 기준)","l":["# 제5절 수료 및 학위수여","학사학위과정의 각 학년 수료에 필요한 학점은 다음과 같다.","학년","졸업학점","1학년","2학년","3학년","4학년","120","30","60","90","120","130","33","65","98","130","140","35","70","105","140"]},{"c":"제3장 학사운영","t":"제84조(졸업 학점)","l":["① 학사학위과정의 졸업에 필요한 학점은 다음 각 호와 같다.","1. 해사대학: 140학점","2. 해양공과대학: 130학점. 다만, 해양스포츠학과는  120학점으로 한다.","3. 해양산업융합학과 및 첨단해양모빌리티학과: 120학점","② 석사 및 박사학위과정의 졸업에 필요한 학점은 다음 각 호와 같다.","1. 석사학위과정","가. 대학원: 24학점","나. 해양산업대학원: 24학점(학위논문을 제출하지 않고 학위를 취득하는 경우에는 30학점)","2. 석·박사학위통합과정: 60학점","3. 박사학위과정: 36학점"]},{"c":"제3장 학사운영","t":"제85조(학사학위과정 졸업논문)","l":["① 학사학위과정 졸업예정자는 총장이 정하는 기간에 졸업논문을 제출하여야 한다.","② 졸업논문은 실험실습보고서, 실기발표 또는 졸업종합시험 등으로 갈음할 수 있다.","③ 졸업논문, 실험실습보고서, 실기발표의 심사 또는 졸업종합시험에 불합격한 학생은 재학연한의 범위 안에서 2회까지 재심사 또는 재시험의 기회를 부여한다.","④ 졸업논문의 제출, 지도, 심사 및 평가에 관한 세부사항은 「국립목포해양대학교 졸업논문 등에 관한 규정」으로 정한다."]},{"c":"제3장 학사운영","t":"제86조(학사학위과정 졸업자격 인증)","l":["① 학사학위과정 졸업예정자에 대하여는 전공영역, 외국어영역 및 정보화영역에 대한 졸업자격 인증을 실시할 수 있다.","② 졸업자격 인증의 범위, 절차 및 방법 등에 관한 세부사항은 「국립목포해양대학교 졸업자격 인증 규정」으로 정한다."]},{"c":"제3장 학사운영","t":"제87조(학사학위과정의 수료와 학위수여)","l":["① 학사학위 소정의 전 과정을 모두 이수하고 성적 평점평균이 1.75 이상인 학생이 졸업자격 인증 심사와 졸업논문 심사에 합격한 경우 졸업을 인정하고 별지 제1호 서식의 학위증을 수여한다. 다만, 복수전공, 연계전공, 융합전공을 이수한 학생에게는 기본전공의 학위증서에 복수전공, 연계전공, 융합전공의 학위명을 병기한 별지 제2호 서식의 학위증을 수여한다.","② 학사학위 소정의 전 과정을 6학기 또는 7학기에 모두 이수하고 성적 평점평균이 4.0 이상(학·석사연계과정은 3.5)인 학생이 졸업자격 인증 심사와 졸업논문 심사에 합격한 경우 조기졸업을 인정하고 학위증을 수여할 수 있다. 다만, 다음 각 호의 어느 하나에 해당 되는 경우 조기졸업을 할 수 없다.","1. 편입학생","2. 1회 이상 학사경고를 받은 학생","3. 유기정학 이상의 징계 처분을 받은 학생","③ 학사학위 소정의 전 과정을 모두 이수한 학생이 제85조와 제86조의 졸업요건을 충족하지 못한 경우 수료를 인정하고 별지 제7호 서식의 수료증명서를 발급할 수 있으며, 수료한 사람이 졸업요건을 충족할 경우 졸업을 인정하고 제1항의 학위증을 수여한다. 다만, 수업연한을 단축하여 학사학위 소정의 전 과정을 모두 이수한 경우 수료를 인정하지 않는다.","④ 제1항부터 제3항까지의 학위를 수여받은 외국인 학생에게는 제1항의 학위증 외에 별지 제1-2호 서식 또는 제2-2호 서식의 영문 학위증을 발급한다."]},{"c":"제3장 학사운영","t":"제88조(학점인정 등에 의한 학위 수여)","l":["①「학점인정 등에 관한 법률」 및 같은 법 시행령에 따라 학점인정을 받아 학위수여 요건을 갖추고 본교에서 취득한 학점이 84학점 이상인 학생에 대하여는 학사학위를 수여할 수 있다.","② 제1항의 규정에 따라 수여하는 학사학위의 종별은 「학점인정 등에 관한 법률 시행규칙」에 따라 정해진 표준교육과정의 학위를 따른다.","③ 제1항의 규정에 따른 학위수여 절차와 방법 등에 관한 세부사항은 「국립목포해양대학교 학점은행제 운영 규정」으로 정한다."]},{"c":"제3장 학사운영","t":"제89조(학사학위 취득 유예)","l":["① 학사학위과정의 학생이 소정의 전 과정을 모두 이수하고 졸업자격 인증 심사와 졸업논문 심사에 합격하였어도 학생이 신청하는 경우 1년 이내의 범위 안에서 학사학위 취득을 유예할 수 있다. 다만, 학사학위과정의 재학기간과 학사학위 취득 유예기간을 합하여 재학연한을 초과할 수 없다.","② 학사학위 취득을 유예하고자하는 학생은 등록을 하여야 하고, 등록금을 납부하지 않은 경우 학위취득 유예를 직권 취소하고 총장이 정한 날에 학위를 수여한다.","③ 학사학위 취득 유예에 관한 세부사항은 「국립목포해양대학교 교학규정」으로 정한다."]},{"c":"제3장 학사운영","t":"제90조(대학원 학위청구논문의 제출 및 심사)","l":["① 석사학위 또는 박사학위를 취득하려는 학생은 다음 각 호의 요건을 모두 갖추어 지도교수 추천을 받아 학위논문을 제출하여야 한다. 다만, 해양산업대학원의 경우 이수학점이 30학점 이상인 학생에게는 학위논문의 제출을 면제한다.","1. 제84조제2항의 해당 학위 졸업학점 취득(해당 학기에 취득 예정인 경우를 포함한다)","2. 외국어시험 합격(대학원에만 해당한다)","3. 종합시험 합격","4. 석사학위과정의 경우 본교 해당 학위과정 중 전공과 관련된 논문 1편 이상을 전국단위 이상 학술대회에 발표하거나 학술지에 게재(논문 원본 또는 원본임을 입증할 수 있는 서류를 제출하여야 한다)","5. 박사학위과정 또는 석·박사학위통합과정의 경우 본교 해당 학위과정 중 등재후보학술지 이상의 학술지에 전공과 관련된 논문 1편 이상 게재(논문 원본 또는 원본임을 입증할 수 있는 서류를 제출하여야 한다)","② 석사학위 및 박사학위 청구논문의 심사는 본교 교원 또는 학계의 권위자 중에서 대학원위원회의 심의를 거쳐 선정된 심사위원이 실시하되, 심사위원회는 석사학위는 3명 이상, 박사학위는 5명 이상으로 구성한다.","③ 외국어시험 및 종합시험과 학위논문의 심사에 관한 세부사항은 「국립목포해양대학교 대학원 학위수여 규정」으로 정한다."]},{"c":"제3장 학사운영","t":"제91조(석·박사과정의 수료와 학위수여)","l":["① 석사학위과정, 박사학위과정 또는 석·박사학위통합과정의 전 과정을 모두 이수하고 다음 각 호의 모두에 해당하는 학생에게는 대학원위원회의 심의를 거쳐 별지 제3호 서식부터 별지 제6호 서식까지의 해당 학위기를 수여한다.","1. 제84조제2항 각 호의 졸업학점을 취득한 학생","2. 해당 학위과정의 성적 평점평균이 3.0이상인 학생","3. 학위논문 심사에 합격한 학생(제90조제1항의 단서에 따라 학위논문의 제출을 면제 받은 경우 종합시험에 합격한 학생으로 한다.)","② 석·박사학위통합과정을 중도에 포기한 학생이 석사학위과정의 졸업학점을 취득하고 제1항의 요건을 충족할 경우 석사학위를 수여한다.","③ 학위과정별 제84조제2항 각 호의 졸업학점을 취득한 학생에게는 해당 학위과정을 수료한 것으로 인정하고, 별지 제8호 서식의 수료증서를 발급할 수 있다.","④ 석·박사학위통합과정을 중도에 포기한 학생이 제84조제2항제1호가목의 졸업학점을 취득한 경우 석사학위과정을 수료한 것으로 인정한다.","⑤ 제1항 및 제2항에 따라 학위를 수여받은 외국인 학생에게는 별지 제3호 서식부터 별지 제6호 서식까지의 해당 학위기 외에 별지 제3-2호 서식의 해당 영문 학위기를 발급한다.","⑥ 대학원 학위수여에 관한 세부사항은 「국립목포해양대학교 대학원 학위수여 규정」으로 정한다."]},{"c":"제3장 학사운영","t":"제92조(석·박사학위통합과정 재학 중인 자의 박사과정 인정)","l":["석·박사학위통합과정에 재학 중인 학생이 3개 학기 이상을 이수하고 24학점 이상을 취득한 경우 박사학위과정에 재학 중인 것으로 본다."]},{"c":"제3장 학사운영","t":"제93조(공동학위ㆍ복수학위 수여)","l":["① 국내외 타 대학과의 교류협정에 따라 교육과정을 공동으로 운영한 경우 공동학위 또는 복수학위를 수여할 수 있다.","② 공동학위나 복수학위 운영에 관한 세부사항은 규정으로 정한다."]},{"c":"제3장 학사운영","t":"제94조(명예박사학위 등의 수여)","l":["① 다음 각 호에 해당하는 사람에게는 대학원위원회의 심의를 거쳐 별지 제9호 서식의 명예박사학위를 수여할 수 있다.","1. 학술발전에 특별한 공헌을 하였거나 문화의 향상에 유의미한 행적이 있는 사람","2. 관련 분야 업적이 탁월하고 국가와 지역사회, 대학 등의 발전에 기여한 업적이 지대한 사람","② 다음 각 호에 해당하는 사람에게는 교무회의 심의를 거쳐 별지 제10호 서식의 명예졸업증서를 수여할 수 있다.","1. 본교 발전에 크게 공헌하였거나 명예를 높인 사람","2. 국가 수호와 국민을 위하여 희생하였거나 공헌한 사람","3. 그 밖에 명예졸업증서를 수여할 자격이 갖추었다고 인정한 사람","③ 명예박사학위 및 명예졸업증서 수여에 관한 세부사항은 「국립목포해양대학교 교학규정」으로 정한다."]},{"c":"제3장 학사운영","t":"제95조(학위의 종류)","l":["① 학사, 석사 및 박사의 학위종류는 학생의 학부(과)나 전공에 따라 별표 5부터 별표 7까지와 같이 구별한다. 다만, 학사학위과정의 연계전공, 융합전공  등 전공별 학위종류는 「국립목포해양대학교 전공이수에 관한 규정」으로 정한다.","② 명예박사학위의 종류는 제1항의 학위 종류에 따르되 이를 받을 사람의 공헌 또는 공적의 성질에 따라 달리할 수도 있다."]},{"c":"제3장 학사운영","t":"제96조(학위수여의 취소)","l":["① 본교에서 학위를 받은 사람이 다음 각 호에 해당하는 경우 해당 학위를 취소한다.","1. 학사, 석사, 박사학위를 부정한 방법으로 받은 경우","2. 명예졸업증서를 부정한 방법으로 받거나 대학의 명예를 손상하는 경우","3. 명예박사학위를 받은 사람이 대학의 명예를 손상한 경우","② 학사학위와 명예졸업증서는 교무회 심의를, 석사·박사·명예박사학위는 대학원위원회 심의를 거쳐 그 학위를 취소한다."]},{"c":"제4장 학적관리","t":"제97조(학부(과)","l":["이동) ① 모집단위별 입학정원에 결원이 있을 경우 그 결원의 범위 안에서 학생이 다른 학부(과)로 이동하는 것을 허가할 수 있다. 다만, 해양산업융합학과에 입학한 학생은 학부(과) 이동을 허가하지 않는다.","② 학부(과) 이동에 관한 세부사항은 「국립목포해양대학교 교학규정」으로 정한다."]},{"c":"제4장 학적관리","t":"제98조(휴학)","l":["① 학생은 수업개시일로부터 총 수업일수의 4분의 3이 경과하기 전에 휴학할 수 있다. 다만, 학사학위과정에 입학한 학생은 다음 각 호의 경우를 제외하고 신입학년도 제1학기에 휴학할 수 없다.","1. 질병","2. 병역의무","3. 임신·출산·육아","4. 창업","5. 감염병 등으로 국내 입국이 어려운 해외 체류","② 휴학은 학기 단위로 허가한다. 다만, 제67조제1항의 규정에 따라 승선실습을 하여야 하는 해사대학 학생이 승선실습 전에 휴학하는 경우 두 학기 단위로 휴학을 허가한다.","③ 1회 휴학기간은 다음 각 호의 기간 이내로 한다. 다만, 휴학 기간이 끝난 후에도 부득이한 사정으로 복학할 수 없는 경우 총장의 허가 받아 휴학기간을 연장할 수 있다.","1. 일반휴학: 2학기","2. 질병휴학: 4학기","3. 병역의무 이행으로 인한 휴학: 병역의무 이행에 필요한 기간","4. 임신·출산·육아휴학: 4학기","5. 창업휴학 : 4학기","④ 휴학기간은 병역의무의 이행, 임신(1년 이내), 출산·육아(2년 이내) 및 창업(2년 이내)을 위한 휴학기간을 제외하고 통산하여 다음 각 호의 기간을 초과할 수 없다.","1. 학사학위과정: 6학기","2. 석사학위과정: 4학기","3. 석·박사학위통합과정: 8학기","4. 박사학위과정:  6학기","⑤ 제1항에도 불구하고 다음 각 호의 사유로 수업을 감당할 수 없다고 인정되는 경우 수업일수의 4분의 3이 경과한 이후에도 휴학을 허가할 수 있다.","1. 질병","2. 병역의무","3. 임신·출산·육아"]},{"c":"제4장 학적관리","t":"제99조(복학)","l":["① 휴학생은 휴학기간이 만료되거나 휴학사유가 소멸된 경우 복학기간에 복학하여야 한다.","② 휴학기간 만료 전에 복학을 원하는 휴학생은 총장의 허가를 받아 복학할 수 있다.","③ 군복무로 휴학한 학생이 복학기간이 지나 전역하는 경우 학기 개시일로부터 3주가 경과하기 전까지 복학을 허가할 수 있다."]},{"c":"제4장 학적관리","t":"제100조(자퇴)","l":["자퇴하고자 하는 학생은 총장의 허가를 받아야 한다."]},{"c":"제4장 학적관리","t":"제101조(제적)","l":["다음 각 호의 어느 하나에 해당하는 학생은 제적한다.","1. 휴학기간이 경과한 후에도 정당한 사유 없이 복학하지 아니한 학생","2. 소정의 등록기간 내에 등록금을 납부하지 아니한 학생","3. 학사학위과정 이수 중 학사경고를 연속 3회 또는 통산 4회 받은 학생.","4. 「고등교육법」 제2조1호부터 제3호까지와 제6호, 제7호의 학사학위과정에 이중으로 재적중인 학생. 다만, 공동학위과정의 학생은 제외한다.","5. 재학연한 내 소정의 전 과정을 이수하지 못한 학생","6. 제109조의 규정에 따라 징계제적을 받은 학생","7. 본인의 사망ㆍ질병 등으로 인하여 학업을 계속할 수 없다고 인정된 학생"]},{"c":"제5장 학생","t":"제102조(학생자치기구)","l":["# 제1절 학생자치활동","① 학생의 자유롭고 민주적인 자치활동을 위하여 학생회 등 자치기구를 둘 수 있다.","② 학생자치활동과 학업 및 학교생활을 지도하기 위하여 지도교수를 둘 수 있다.","③ 학생자치기구의 조직과 운영에 관한 세부사항은 「국립목포해양대학교 학생생활규정」으로 정한다."]},{"c":"제5장 학생","t":"제103조(학생의 권리와 의무)","l":["① 학생은 「국립목포해양대학교 학칙」 등 제 규정이 정하는 바에 따라 교육을 받을 권리와 학교시설을 이용할 권리를 가진다.","② 학생은 「국립목포해양대학교 학칙」 등 제 규정을 준수하여야 하며. 수업·연구 등 학교의 기능수행을 방해하는 개인 또는 집단적 행위와 본교의 교육목적에 위배되는 행위를 할 수 없다.","③ 학생생활에 관한 세부사항은 「국립목포해양대학교 학생생활규정」으로 정한다."]},{"c":"제5장 학생","t":"제104조(학생 활동의 사전 승인)","l":["학생단체 또는 학생이 다음 각 호의 어느 하나에 해당하는 행위를 하고자 할 때에는 사전에 총장의 승인을 받아야 한다.","1. 교내외의 광고, 유인물의 게시 또는 배부","2. 각 기관 또는 개인에 대한 학생 활동 후원 요청 또는 시상 의뢰","3. 외부 인사의 학내 초청","4. 교내 시설물의 사용"]},{"c":"제5장 학생","t":"제105조(간행물 발행 및 방송)","l":["학생의 간행물 발간 및 배포와 교내 방송에 관한 세부사항은 「국립목포해양대학교 학생생활규정」으로 정한다."]},{"c":"제5장 학생","t":"제106조(장애학생)","l":["# 제2절 장애학생 지원","「장애인 복지법」제32조제1항의 규정에 따라 장애인등록증을 교부 받은 학생(이하 ‘장애학생’이라 한다)에 대하여는 재학연한과 휴학기간을 제한하지 아니한다."]},{"c":"제5장 학생","t":"제107조(장애학생의 학습권 보장)","l":["① 총장은 장애학생에게 편의제공 및 학습권을 보장하는 필요한 조치를 하여야 한다.","② 장애학생의 지원을 위하여 특별지원위원회 및 장애학생지원센터를 설치·운영한다.","③ 제2항의 특별지원위원회 및 장애학생지원센터 운영에 관한 세부사항은 「국립목포해양대학교 장애학생 특별지원위원회 규정」 및 「국립목포해양대학교 장애학생지원센터 규정」으로 정한다."]},{"c":"제5장 학생","t":"제108조(포상)","l":["# 제3절 포상·징계 및 복장","① 학업성적이 우수하거나 행실이 바르고 학교의 명예를 드높이는 등   타의 모범이 되는 학생에게는 포상할 수 있다.","② 포상의 종류 및 학생공적심의위원회 구성 등에 관한 세부사항은 「국립목포해양대학교 학생 상벌에 관한 규정」으로 정한다."]},{"c":"제5장 학생","t":"제109조(징계)","l":["① 학생이 다음 각 호의 어느 하나에 해당하는 경우 학생징계위원회를 거쳐 총장이 징계한다.","1. 본교 학칙, 규정 및 지침을 위반한 경우","2. 학생의 본분에 어긋난 행위를 한 경우","3. 품행이 불량하고 반성의 여지가 없는 경우","4. 인권침해행위를 한 경우","5. 성비위 또는 음주운전을 한 경우","② 징계는 그 정상에 따라 근신, 유기정학, 무기정학 및 징계제적으로 구분한다.","③ 학생을 징계하고자 하는 경우 해당 학생에게 소명할 수 있는 기회를 주어야 한다.","④ 학생징계위원회 구성·운영 및 학생 징계 등에 관한 세부사항은 「국립목포해양대학교 학생 상벌에 관한 규정」으로 정한다."]},{"c":"제5장 학생","t":"제110조(복장)","l":["해사대학 학생은 「국립목포해양대학교 해사대학 학생복장규정」에서 정하는 복제에 따라 복장을 착용하여야 한다."]},{"c":"제5장 학생","t":"제111조(장학금)","l":["# 제4절 장학금 및 학비보조","① 다음 각 호의 어느 하나에 해당하는 학생에게는 장학금을 지급할 수 있다.","1. 학업성적이 우수하고 품행이 단정한 학생","2. 가정형편이 어려운 학생","3. 본교 발전에 공헌한 학생","4. 「국가유공자 등 예우 및 지원에 관한 법률」이나 그 밖의 법령의 규정에 따라 수업료와 입학금이 면제되는 학생","5. 기타 총장이 장학금 지급이 필요하다고 인정하는 학생","② 장학에 관한 세부사항은 「국립목포해양대학교 장학규정」 및 「국립목포해양대학교 대학원 장학금 지급 규정」으로 정한다."]},{"c":"제5장 학생","t":"제112조(학비보조)","l":["해사대학 학생(외국인은 제외)에게는 승선생활관비, 피복비, 그 밖의 학비를 국고에서 지급한다. 다만, 다음 각 호의 경우 학비보조금의 지급을 정지 한다.","1. 학생이 휴학한 기간","2. 징계처분에 따라 정학을 당한 기간","3. 제43조의 규정에서 정한 수업연한을 초과한 경우. 다만, 「선박직원법 시행령」 제16조제1항제1호의 규정에 따라 편입학생이 본교에서 수업연수가 2년을 초과한 경우 1년 범위 안에서는 예외로 한다."]},{"c":"제6장 학칙·규정 및 지침 등 제·개정","t":"제113조(학칙개정)","l":["① 「국립목포해양대학교 학칙」의 개정은 대학 구성원의 의견이 있거나 학교 운영상 필요하다고 인정할 때 총장이 발의한다.","② 대학(원)장, 부속시설 등 기관의 장, 학부(과)장, 전임교원 20명 이상은 학교 운영상 「국립목포해양대학교 학칙」의 개정이 필요한 경우 개정안을 총장에게 제출할 수 있다.","③ 「국립목포해양대학교 학칙」을 개정하고자 할 때는 개정안을 제안이유 및 주요 골자와 함께 대학평의원회 심의 전에 7일 이상 공고하여야 한다.","④ 「국립목포해양대학교 학칙」 개정안은 대학평의원회의 심의를 거쳐 총장이 확정·공포한다."]},{"c":"제6장 학칙·규정 및 지침 등 제·개정","t":"제114조(규정 제·개정)","l":["① 총장은 「국립목포해양대학교 학칙」에서 위임된 사항이나 「국립목포해양대학교 학칙」 시행에 필요한 경우 정하는 절차에 따라 규정을 제·개정할 수 있다.","② 대학(원)장, 부속시설 등 기관의 장, 학부(과)장, 전임교원 10명 이상은 규정의 제·개정이 필요한 경우 제·개정안을 총장에게 제출할 수 있다.","③ 규정을 제·개정하고자 할 때는 제·개정안을 제안이유 및 주요 골자와 함께 7일 이상 공고하여야 한다.","④ 규정 제·개정안은 교수평의회의 심의를 거쳐 총장이 확정ㆍ공포한다."]},{"c":"제6장 학칙·규정 및 지침 등 제·개정","t":"제115조(지침 및 세칙 제·개정)","l":["총장은 「국립목포해양대학교 학칙」과 규정에서 위임된 사항과 학사행정의 운영에 필요한 사항에 대하여 교무회 심의를 거쳐 지침 및 세칙을 제·개정할 수 있다.","부 칙"]},{"c":"제6장 학칙·규정 및 지침 등 제·개정","t":"제1조(시행일)","l":["이 학칙은 2025년 3월 1일 부터 시행한다."]},{"c":"제6장 학칙·규정 및 지침 등 제·개정","t":"제2조(졸업학점 변경에 따른 경과조치)","l":["① 제84조제1항의 규정에도 불구하고 이 학칙 시행 당시 재적 중인 학생, 2025학년도와 2026학년도에 편입학하는 학생 및 2024년 이전에 신입학한 학생과 같은 학년으로 재입학하는 학생의 졸업학점은 다음과 같다.","학부(과)","졸업학점","해양스포츠학과, 해양산업융합학과, 첨단해양모빌리티학과","120","해양스포츠학과를 제외한 해양공과대학 소속 학과","140","해사대학 소속 학부","150","② 제1항에도 불구하고 2024학년도 이전에 입학한 학생이 휴학한 후 2025학년도 이후 신입학한 학생과 같은 학년으로 복학하는 경우 졸업학점은 제84조제1항을 적용한다. 이 경우 2024학년도 이전에 입학한 학생에는 2025학년도와 2026학년도에 편입학하는 학생 및 2024년 이전에 신입학한 학생과 같은 학년으로 재입학하는 학생을 포함한다.","③ 제2항에도 불구하고 복학한 학생이 휴학 전에 이수하던 2024학년도 이전의 교과 교육과정을 이수하는 경우 제1항을 적용한다."]},{"c":"제6장 학칙·규정 및 지침 등 제·개정","t":"제3조(수료학점 변경에 따른 경과조치)","l":["① 제83조의 규정에도 불구하고 이 학칙 시행 당시 재적 중인 학생, 2025학년도와 2026학년도에 편입학하는 학생 및 2024년 이전에 신입학한 학생과 같은 학년으로 재입학한 학생의 학사학위과정 각 학년 수료에 필요한 학점은 다음과 같다.","학년","졸업학점","1학년","2학년","3학년","4학년","120","30","60","90","120","140","35","70","105","140","150","38","75","113","150","② 제1항에도 불구하고 2024학년도 이전에 입학한 학생이 휴학한 후 2025학년도 이후 신입학한 학생과 같은 학년으로 복학하는 경우 학사학위과정의 각 학년 수료에 필요한 학점은 제83조를 적용한다. 이 경우 2024학년도 이전에 입학한 학생에는 2025학년도와 2026학년도에 편입학하는 학생 및 2024년 이전에 신입학한 학생과 같은 학년으로 재입학하는 학생을 포함한다.","③ 제2항에도 불구하고 복학한 학생이 휴학 전에 이수하던 2024학년도 이전의 교과 교육과정을 이수하는 경우 제1항을 적용한다."]},{"c":"제6장 학칙·규정 및 지침 등 제·개정","t":"제4조(전공 이수학점 변경에 따른 경과조치)","l":["① 제62조의 규정에도 불구하고 이 학칙 시행 당시 재적 중인 학생, 2025학년도와 2026학년도에 편입학하는 학생 및 2024년 이전에 신입학한 학생과 같은 학년으로 재입학한 학생의 전공 이수학점은 다음 각 호와 같다.","1. 해사대학: 기본전공 80학점, 심화전공 28학점","2. 해양공과대학: 기본전공 70학점. 다만, 해양스포츠학과는 기본전공 50학점으로 한다.","3. 해양산업융합학과 및 첨단해양모빌리티학과: 기본전공 50학점","② 제1항에도 불구하고 2024학년도 이전에 입학한 학생이 휴학한 후 2025학년도 이후 신입학한 학생과 같은 학년으로 복학하는 경우 학사학위과정의 전공 이수학점은 제62조를 적용한다. 이 경우 2024학년도 이전에 입학한 학생에는 2025학년도와 2026학년도에 편입학하는 학생 및 2024년 이전에 신입학한 학생과 같은 학년으로 재입학하는 학생을 포함한다.","③ 제2항에도 불구하고 복학한 학생이 휴학 전에 이수하던 2024학년도 이전의 교과 교육과정을 이수하는 경우 제1항을 적용한다."]},{"c":"제6장 학칙·규정 및 지침 등 제·개정","t":"제5조(학기당 수강학점 변경에 따른 경과조치)","l":["① 제66조의 규정에도 불구하고 이 학칙 시행 당시 재적 중인 학생, 2025학년도와 2026학년도에 편입학하는 학생 및 2024년 이전에 신입학한 학생과 같은 학년으로 재입학한 학생의 학사학위과정 매 학기 수강신청 기준학점 및 매 학기 최대 수강신청 학점은 다음 각 호와 같다.","1. 매 학기 수강신청 기준학점","학부(과)","기준학점","해양스포츠학과, 해양산업융합학과, 첨단해양모빌리티학과","15","해양스포츠학과를 제외한 해양공과대학 소속 학과","18","해사대학 소속 학부","20","2. 매 학기(계절학기 및 특별학기는 제외한다.) 최대 수강신청 학점","학부(과)","수강신청 학점","해양스포츠학과, 해양산업융합학과, 첨단해양모빌리티학과","18","해양스포츠학과를 제외한 해양공과대학 소속 학과","21","해사대학 소속 학부","24","② 제1항에도 불구하고 2024학년도 이전에 입학한 학생이 휴학한 후 2025학년도 이후 신입학한 학생과 같은 학년으로 복학하는 경우 학사학위과정의 학기당 수강학점은 제66조를 적용한다. 이 경우 2024학년도 이전에 입학한 학생에는 2025학년도와 2026학년도에 편입학하는 학생 및 2024년 이전에 신입학한 학생과 같은 학년으로 재입학하는 학생을 포함한다.","③ 제2항에도 불구하고 복학한 학생이 휴학 전에 이수하던 2024학년도 이전의 교과 교육과정을 이수하는 경우 제1항을 적용한다."]},{"c":"제6장 학칙·규정 및 지침 등 제·개정","t":"제6조(이수 전공 변경에 따른 경과조치)","l":["① 제61조의 규정에도 불구하고 이 학칙 시행 당시 재적 중인 학생, 2025학년도와 2026학년도에 편입학하는 학생 및 2024년 이전에 신입학한 학생과 같은 학년으로 재입학한 학생의 이수 전공은 다음 각 호와 같다.","1. 해사대학: 기본전공, 심화전공","2. 해양공과대학: 기본전공","3. 해양산업융합학과 및 첨단해양모빌리티학과: 기본전공","② 제1항에도 불구하고 2024학년도 이전에 입학한 학생이 휴학한 후 2025학년도 이후 신입학한 학생과 같은 학년으로 복학하는 경우 학사학위과정의 이수 전공은 제61조를 적용한다. 이 경우 2024학년도 이전에 입학한 학생에는 2025학년도와 2026학년도에 편입학하는 학생 및 2024년 이전에 신입학한 학생과 같은 학년으로 재입학하는 학생을 포함한다.","③ 제2항에도 불구하고 복학한 학생이 휴학 전에 이수하던 2024학년도 이전의 교과 교육과정을 이수하는 경우 제1항을 적용한다."]},{"c":"제6장 학칙·규정 및 지침 등 제·개정","t":"제7조(교육조직 개편에 따른 특례)","l":["① 교육조직 개편에 따라 개편된 해사대학의 기관·해양경찰학부, 해양공과대학의 해양·플랜트건설공학과 및 해양컴퓨터공학과는 재적생이 존재할 때까지 존속한 것으로 보며, 2024학년도에 입학한 해양공과대학의 해양스포츠·레저융합학과의 재적생은 해양스포츠학과 재적생으로 본다.","② 기관·해양경찰학부의 2019년 이전 입학생이 휴학 후 2020학년도 이후 입학생과 같은 학년으로 복학하는 경우 해양경찰학부로 복학한다.","③ 해양·플랜트건설공학과의 2018년 이전 입학생이 휴학 후 2019학년도 이후 입학생과 같은 학년으로 복학하는 경우 해양건설공학과로 복학한다.","④ 해양컴퓨터공학과의 2022년 이전 입학생이 휴학 후 2023학년도 이후 입학생과 같은 학년으로 복학하는 경우 컴퓨터공학과로 복학한다.","⑤ 자퇴 또는 제적 당시 학부(과)가 폐지된 경우 재입학하고자 하는 학생은 다음 각 호의 학부(과)로 재입학 한다.","1. 해상운송시스템학부: 항해학부","2. 국제해사수송과학부: 해상운송학부","3. 2014학년도 이전의 기관시스템공학부: 기관시스템공학부","4. 오션파워·해양안전학부: 해양경찰학부","5. 기관·해양경찰학부: 해양경찰학부","6. 해양전자통신공학부: 컴퓨터공학과","7. 해양시스템공학부","가. 전공이 정해지지 않은 학생: 조선해양공학과, 환경·생명공학과, 해양건설공학과 중 학생이 선택","나. 전공이 정해진 학생","전공","재입학 학과","조선해양공학전공","조선해양공학과","해양환경공학전공","환경·생명공학과","해양건설시스템공학전공","해양건설공학과","8. 해양정보통신공학과: 컴퓨터공학과","9. 전자공학과: 컴퓨터공학과","10. 해양컴퓨터공학과: 컴퓨터공학과(2023학년도 이후 입학생과 같은 학년으로 재입학하는 경우)","11. 해양·플랜트건설공학과: 해양건설공학과"]},{"c":"제6장 학칙·규정 및 지침 등 제·개정","t":"제8조(다른 규정의 개정)","l":["① 국립목포해양대학교 강사료 지급규정 일부를 다음과 같이 개정한다. 제2조제4항 중 “학칙 제15조제2항 및 교학규정 제41조의 책임교수시간”을 “「국립목포해양대학교 학칙」 제4조제4항의 교수시간”으로 한다.","② 국립목포해양대학교 공용장비센터 운영규정 일부를 다음과 같이 개정한다.","제1조 중 “국립목포해양대학교 학칙 제6조에 따라”를 “「국립목포해양대학교 학칙」 제16조제5항의 규정에 따라 설치된”으로 한다.","③ 국립목포해양대학교와 교류대학간 학생교류 및 학점 상호인정에 관한 규정 일부를 다음과 같이 개정한다.","제1조 중 “학칙 제52조의 규정에 의한 본교”를 “「국립목포해양대학교 학칙」 제80조제1항제1호의 규정 따라 국립목포해양대학교”로 한 인원점검 및 운동)","l":["① 아침인원점검은 06:30에 실시하며, 아침인원점검 5분 전까지 집합장소로 집합한다.","② 아침인원점검의 집합시간과 장소는 날씨 및 생활관 운영에 따라 지도관이 변경할 수 있다.","③ 아침 운동은 일출시간이 07시 이전일 경우 뜀걸음, 07시 이후일 경우 체조 등으로 한다.(단, 기상상태에 따라 지도관이 아침 운동 여부를 변경할 수 있다.)"]},{"c":"제2장 일과 및 복장 등","t":"제5조(저녁인원점검)","l":["➀ 저녁인원점검은 일과 규정에 따라서 실시한다.","② 저녁인원점검 시에는 침실문을 개방하며, 인원점검 시간 종료 시까지 정숙해야 한다.","③ 저녁인원점검 이후부터 익일 아침인원점검 전까지 생활관을 이탈할 수 없다.","④ 당직계통은 인원점검 후 인원점검표를 당직사관에게 제출한다.","⑤ 당직사관은 저녁인원보고서를 작성하여 지도관실에 제출한다.","⑥ 지도관은 수령한 인원보고서를 기초로 학사행정시스템과 비교 확인한다."]},{"c":"제2장 일과 및 복장 등","t":"제6조(복장 및 용모)","l":["① 해사대학 학생(이하 “학생”이라 한다)의 복장은 동정복, 춘추정복, 하정복, 동통상복, 하통상복, 동잠바, 실습복 및 학년별 지정된 생활복으로 한다.","② 학생으로서 품위를 유지하기 위해 생활관장은 복장 및 용모를 점검할 수 있으며 점검절차는 [별표 2]에 따른다.","③ 1,2학년의 복장점검은 승선사관부가 실시하고 4학년은 지도관이 실시한다.","④ 복장점검 시 학년별 점검시간 및 집합장소를 사전에 공지한다.","⑤ 복장 규정 미 준수 시 점검을 다시 실시할 수 있다.","⑥ 복장 점검 미 참석자는 특별 복장 점검을 실시한다."]},{"c":"제2장 일과 및 복장 등","t":"제7조(사복 착용)","l":["① 사복을 착용할 수 있는 기준은 다음과 같다.","1. 즉시 시정 불가한 제복의 오염 및 손상의 경우","2. 상해·질병 등의 치료 목적으로 제복 착용이 불가 한 경우","3. 우리 대학 행사, 교과·비교과 프로그램 등의 운영상 사복착용이 필요한 경우","4. 기타 생활관장 및 지도관이 필요하다고 인정하는 경우","② 사복을 착용하고자 할 경우 학사행정시스템을 통하여 신청 후 지도관실 허가를 득하여야 한다.","③ 사복착용 완료일 이후 일주일 이내에 증빙서류를 제출 하여야 한다."]},{"c":"제2장 일과 및 복장 등","t":"제8조(상륙복장)","l":["① 상륙 복장은 주중은 통상복 이상, 주말은 정복을 원칙으로 하며, 생활관장은 필요에 따라 상륙 복장을 따로 지정할 수 있다.","② 사복 착용 시 복장변경허가를 증빙하여야 한다.","③ 사복 착용 시 한 학기에 10일을 초과한 일수를 승선생활교육 학점에 반영한다.","④ 제복과 사복을 겸하여 착용할 수 없다.","⑤ 복장에 관한 기타사항은「국립목포해양대학교 해사대학 학생복장규정」에 따른다."]},{"c":"제2장 일과 및 복장 등","t":"제9조(지도관실 출입)","l":["① 지도관실 출입은 지정된 시간에 한한다. 단, 긴급한 업무나 생활 상담이 필요한 경우에는 결재시간 외에도 출입할 수 있으며 본인 수업시간에 지장이 없도록 하여야 한다.","② 결재시간은 다음 각 호와 같다.","1. 07:50 ~ 08:50","2. 13:00 ~ 14:00","3. 18:00 ~ 19:00","③ 출입 시 복장은 통상복 또는 정복으로 한다."]},{"c":"제3장 상륙","t":"제10조(상륙)","l":["① 보통상륙은 08:00 이후에 상륙하여 당일 21:45 전까지 귀관하는 상륙을 말한다.","② 주말상륙은 금요일 08:00 이후에 상륙하여 일요일 21:45전까지 귀관하는 상륙을 말한다. 단, 수업이 있는 경우 수업 종료 후 상륙에 임한다.","③ 특별상륙은 보통상륙과 주말상륙 외의 상륙을 말하며, 일반 특별상륙과 공가 특별상륙으로 구분한다.","④ 생활관장은 다음 각 호의 어느 하나에 해당하는 학생에게 공가 특별상륙을 허가할 수 있다. 해당 학생은 귀관 후 1주일 이내에 증빙자료를 제출하여야 한다.","1. 본인 및 직계가족의 경조사(단, 기간은 교학규정의 경조사로 인한 출석인정 일수와 동일하게 적용한다.)","2. 학부 현장학습 및 견학","3. 모교 방문","4. 기타 생활관장이 필요하다고 인정하는 학생","⑤ 일반 특별상륙은 한 학기에 7일을 초과한 결관일수를 승선생활교육 학점에 반영한다.","⑥ 모든 상륙은 08:00 ~ 21:00 안에 이루어져야 하며 그 외의 시간에는 지도관의 허가를 받아 상륙할 수 있다.","⑦ 모든 귀관은 08:00 ~ 21:45 안에 이루어져야 하며 그 외의 시간에는 지도관의 허가를 받아 귀관할 수 있다.","⑧ 자세한 상륙 절차는 [별표3]에 따른다."]},{"c":"제4장 상벌사항","t":"제11조(상벌사항)","l":["① 과실을 지적받은 학생은 24시간 이내에 지도관실로 보고한다.","② 해당 학기 기준으로 선행점과 과실점은 동등한 비율로 상계가 가능하다.","③ 선행점과 과실점의 부과기준은 [별표 4]와 같다."]},{"c":"제4장 상벌사항","t":"제12조(퇴관)","l":["① 지도관은 퇴관 처분 학생 및 퇴관 일정을 사전에 공고한다.","② 퇴관 대상 및 기간은 다음 각 호와 같다.","1. 국립목포해양대학교 학생 상벌에 관한 규정 제3장에 의한 징계처분을 받은 학생: 징계기간(퇴관 중에 징계처분을 받은 학생은 징계 기간만큼 추가로 퇴관일수를 적용한다.)","2. 1회 50점의 과실을 범한 학생 중 지도위원회에서 퇴관을 명받은 학생 : 1주 이상 또는 해당 과실의 행정 처분 완료시까지로 한다.","3. 한 학기를 초과하는 퇴관과 기타의 퇴관이 필요하다고 판단되는 경우는 지도위원회의 심의를 거친다.","4. 인권센터의 격리 요청이 있을 경우 퇴관을 명할 수 있다.","5. 7일 이내 선과실 누계점수가 과실 150점 이상인 학생 중 지도위원회에서 퇴관을 명받은 학생 : 1주 이상","③ 퇴관기간으로 인한 결관일수는 승선생활교육 학점에 반영된다.","④ 방학기간은 제2항의 퇴관기간에 산입하지 아니하며, 방학으로 퇴관기간의 잔여일이 발생한 경우 잔여기간에 대하여 다음 학기에 시행하거나 특별교육으로 대체할 수 있다.","⑤ 퇴관 명령을 받은 학생에 대하여는 퇴관기간 중 승선생활관비의 지급을 정지하고, 이미 지급한 피복 등 관급품을 회수할 수 있다.","⑥ 퇴관 명령을 받은 학생은 퇴관 전 1주간 상륙 제한 및 특별교육을 할 수 있다.","⑦ 퇴관 명령을 받은 학생은 퇴관기간 중 생활관에 출입할 수 없다.","⑧ 생활관장은 [별표 4]과실점 기준에 따라 퇴관심의 대상에 해당하는 과실을 범했다고 인정되는 학생에 대하여 지도위원회에 해당 안건을 상정하기 전 상륙을 제한할 수 있다. 단, 상륙 제한기간은 일주일을 초과할 수 없다."]},{"c":"제4장 상벌사항","t":"제13조(상륙금지)","l":["① 과실점이 부가된 학생에 대하여 승선생활훈련 교육의 일환으로 상륙금지를 명할 수 있다.","② 상륙금지 대상 및 기간은 다음 각 호와 같다.","1. 과실점 30점 : 상륙금지 1주","2. 과실점 40점 이상 : 상륙금지 2주","3. 기타 상륙금지가 필요하다고 판단되는 경우","③ 상륙금지 대상자들은 해당 기간 동안 상륙에 임할 수 없으며 부득이한 경우 지도관의 허가를 득하여야 한다.","④ 상륙금지 기간 동안 하루 3회의 상륙금지 점검을 받아야 하며 점검 불참 시 회당 30점의 과실이 부여된다.","⑤ 방학기간은 제2항의 상륙금지 기간에 산입하지 아니하며, 방학으로 상륙금지 기간의 잔여일이 발생한 경우 잔여기간에 대하여 다음 학기에 시행하거나 특별교육으로 대체할 수 있다.","⑥ 상륙금지 기간 중 주1회에 한해 특별교육을 실시 할 수 있다."]},{"c":"제4장 상벌사항","t":"제14조(특별교육)","l":["① 생활관장은 학생들의 체력, 협동심 및 정신력을 강화하고 리더십을 향상시키기 위해 특별교육과 GPS 인재 양성을 위한 비교과 프로그램을 실시할 수 있다.","② 저체력자(체력평가 하위 5%)대상으로 특별교육 또는 비교과 프로그램을 실시할 수 있다.","③ 특별교육을 실시할 경우 대상자, 집합시간 및 장소에 대하여 사전에 공지해야 한다.","④ 특별교육은 생활관장의 허가를 받아 지도관 또는 승선사관부에서 시행한다.","⑤ 특별교육의 종류는 다음 각 호와 같다.","1. 기초체력증진활동","2. 인성교육 및 인내력 함양 교육","3. 봉사 및 환경정화 활동","4. 비상대피훈련","5. 특별과제","⑥ 부득이한 사정으로 특별교육 참여가 불가능한 학생은 사전에 지도관의 허가를 받아 연기하거나 교내봉사 2회 이상으로 대체할 수 있다."]},{"c":"제4장 상벌사항","t":"제15조(이의제기 절차)","l":["① 과실점 지적사항에 대하여 이의가 있는 학생은 공고한 날로부터 4일 이내에 그 사유를 기재하여 지도관실에 이의제기를 신청할 수 있다.","② 이의제기는 해당 학생이 불복사유를 기재하여 지도관실을 통해 제기하고 1회 50점 이상 과실점에 대한 이의제기는 권익상담위원회에서 논의하고 1회 50점 미만 과실점은 승선생활관장이 결정한다.","③ 지도관은 결정사항을 해당 학생에게 통보해야 한다.","④ 동일한 과실 지적사항에 대하여 최대 1회의 이의제기 신청이 가능하다."]},{"c":"제5장 학생당직제도","t":"제16조(구성)","l":["① 학생당직제도는 다음 각 호로 구분한다.","1. 학생당직","2. 야간안전당직","② 학생당직은 당직사관 1인, 수석부직사관 1인, 부직사관 1인, 당직사 2인 및 당직원 2인으로 구성한다.","③ 당직사관, 수석부직사관 및 부직사관은 최고학년으로 하고, 당직사는 2학년, 당직원은 1학년으로 한다.","④ 야간안전당직은 세계로관 및 새누리관 1조, 유달관 및 태평관 1조로 나누어지며 각 조는 안전당직사관 1인, 안전당직사 1인, 안전당직원 1인으로 구성된다.","⑤ 안전당직사관은 4학년, 안전당직사는 2학년, 안전당직원은 1학년으로 한다."]},{"c":"제5장 학생당직제도","t":"제17조(당직기간)","l":["① 당직기간은 다음 각 호와 같다.","1. 당직사관 : 1일","2. 수석부직사관 : 1일","3. 부직사관 : 1일","4. 당직사 : 2일","5. 당직원 : 2일","② 당직근무는 당직명령에 따른다.","③ 특별한 사유로 당직수행에 어려움이 있을 경우 당직지도관의 승인을 받아 당직을 변경할 수 있다."]},{"c":"제5장 학생당직제도","t":"제18조(당직사관의 임무)","l":["① 당직사관의 임무는 다음 각 호와 같다.","1. 당직지도관의 지시를 받아 학생당직을 총괄한다.","2. [별표 1]에 따라 일과 및 방송을 진행하고 관내를 수시로 순찰한다.","3. 학생인원을 점검하고, 근무일지를 정리한다.","4. 비상사태나 생활관 질서에 해가 되는 사건의 발생 시 필요한 응급조치를 취함과 동시에 당직지도관에게 즉시 보고하여야 하며, 이 경우 응급조치나 질서유지를 위하여 당직지도관의 허가를 받은 자는 호실에 출입할 수 있다.","5. 생활관 안에서의 질서를 유지한다.","6. 택배보관실 정리 및 수상한 물건 발견 시 지도관실 보고","② 당직사관은 생활관장 및 당직지도관의 지시나 허가 없이 학생을 동원하거나 집합시켜서는 아니 된다."]},{"c":"제5장 학생당직제도","t":"제19조(수석부직사관의 임무)","l":["수석부직사관은 당직사관을 보좌하고, 당직사관 부재 시 당직사관의 업무를 대행한다."]},{"c":"제5장 학생당직제도","t":"제20조(부직사관의 임무)","l":["부직사관은 당직사관 및 수석부직사관을 보좌한다."]},{"c":"제5장 학생당직제도","t":"제21조(당직사 및 당직원의 임무)","l":["당직사와 당직원은 학생당직실의 행정적인 업무를 수행하며 당직사관, 수석부직사관 및 부직사관의 업무를 보좌한다."]},{"c":"제5장 학생당직제도","t":"제22조(야간안전당직자의 임무)","l":["① 야간안전당직자의 임무는 다음 각 호와 같다.","1. 야간에 생활관 재산 보호 및 사고를 예방하고, 비상사태나 생활관 질서에 해가 되는 사건의 발생 시 필요한 응급조치를 취함과 동시에 당직지도관에게 즉시 보고하여야 하며, 이 경우 응급조치나 질서유지를 위하여 당직지도관의 허가를 받은 자는 호실에 출입할 수 있다.","2. 야간안전당직 중 학생 민원대응을 하며 비상상황 시 당직지도관에게 즉시 연락한다.","3. 야간안전당직 중 승선생활관 출입 내역을 확인하여 수상한 기록이 있을 시 즉시 당직지도관에게 보고한다.","② 안전당직자는 조별로 2시간 단위로 근무한다."]},{"c":"제5장 학생당직제도","t":"제23조(근무시간 및 교대)","l":["① 당직근무는 매일 24시간 수행되며 당직 시간 배정은 다음 각 호와 같다.","1. 학생당직 : 06:00 ~ 24:00","2. 야간안전당직 : 00:00 ~ 06:00","② 생활관 폐쇄, 방학 및 기타 생활관장이 인정한 기간에는 당직근무를 해제할 수 있다.","③ 생활관장은 필요에 따라 당직근무 시간을 변경할 수 있다.","④ 당직교대는 다음 각 호와 같다.","1. 당직사관은  08:30에 지도관실에서 당직 교대를 한다.","2. 학생당직과 안전당직은 24:00, 06:00에 학생당직실에서 당직 교대를 한다.","3. 안전당직은 02:00, 04:00에 조별로 당직 교대를 한다."]},{"c":"제5장 학생당직제도","t":"제24조(복장)","l":["당직근무에 임하는 학생의 복장은 다음 각 호와 같다.","1. 당직사관은 정복을 착용한다.","2. 부직사관과 당직사 및 당직원은 통상복을 착용한다.   3. 안전당직자는 통상복에 안전모, 운동화를 착용한다."]},{"c":"제6장 승선생활교육 학점이수","t":"제25조(적용범위)","l":["① 승선생활관에 입관하여 승선생활교육을 받는 학생에게 적용한다.","② 실습학기를 제외한 두 학기당 1학점씩 부여하여 총 3학점의 승선생활교육 학점을 이수하여야 한다.","③ 복학자, 재입학자, 편입학자, 학부변경자, 재수강자 및 교환학생은 입관한 학기부터 승선생활교육 학점을 이수하여야 하며, 승선생활관에 입관한 학기가 두 학기 중 한 학기일 경우 입관한 학기의 점수로 학점을 부여한다."]},{"c":"제6장 승선생활교육 학점이수","t":"제26조(교육과정)","l":["① 교육과정은 생활교육, 체력평가로 편성한다.","② 생활교육에 대한 항목 및 내용은 [별표 5]와 같다.","③ 체력평가에 대한 평가종목 및 배점은 [별표 6]과 같다."]},{"c":"제6장 승선생활교육 학점이수","t":"제27조(성적평가)","l":["① 성적평가는 국립목포해양대학교 교학규정의 평균성적환산표에 따른다.","② 성적 평가 방법은 동일 학년의 두 학기 점수 평균값으로 평가함을 원칙으로 한다.","③ 정규 체력증진활동에 3/4 이상 참여하여야 한다.","④ 법정전염병, 국가적 재난사태 등의 사유로 재학생들이 승선생활관 입관이 제한되어 승선생활교육을 받지 못한 경우 성적평가를 위한 항목 및 배점을 따로 정할 수 있다. 항목 및 배점은 지도위원회에서 따로 정한다.","⑤ 재수강시 최대 A0까지 받을 수 있으며, 재수강자의 재관점수는 특별교육으로 대체 가능하다."]},{"c":"제6장 승선생활교육 학점이수","t":"제28조(평가위원회)","l":["① 승선생활교육 학점을 평가하기 위하여 평가위원회를 둔다.","② 평가위원회의 위원장은 생활관장이 되고, 위원은 지도관으로 구성한다.","③ 평가위원회의 회의는 재적위원 과반수의 출석으로 개의하고, 출석위원 과반수의 찬성으로 의결한다."]},{"c":"제6장 승선생활교육 학점이수","t":"제29조(성적 미달자에 대한 조치)","l":["① 평가된 성적이 30점이상 60점 미만인 학생의 경우 제14조에 따른 특별교육을 실시할 수 있다.","② 특별교육을 이수할 경우 학점은 최대 D0까지 부여할 수 있다."]},{"c":"제7장 신입생 적응교육","t":"제30조(목적)","l":["적응교육은 국립목포해양대학교 해사대학 입학 예정자(이하“적응교육생”으로 한다)를 대상으로, 해사대학과 승선생활관에 대한 이해를 넓히고 기본 소양을 배양하기 위하여 승선생활관에 입관 전에 실시하는 필수교육을 말한다."]},{"c":"제7장 신입생 적응교육","t":"제31조(적응교육생)","l":["적응교육생은 다음에 해당하는 경우 재학생과 동일한 권한 및 의무를 갖는다.","1. 응급진료 및 입원 등 의료 관련 사항","2. 급식, 피복류의 지급에 관한 사항","3. 기타 지도위원회에서 결정한 사항"]},{"c":"제7장 신입생 적응교육","t":"제32조(교육운영)","l":["① 적응교육은 학내에서 실시함을 원칙으로 하며, 기간은 10일 이내로 승선생활관장이 정한다.","② 교육의 효율 및 집중도를 높이기 위하여 교육기간 중 외부와의 접촉을 제한할 수 있다.","③ 교육의 내용은 다음과 같다.","1. 승선생활교육의 이해 및 제반사항 숙지","2. 기본인성교육 및 학사관리에 관한 지식","3. 기본 제식 동작, 보행자세, 태도에 대한 교육","4. 비상 및 소화훈련","5. 기초체력증진활동","6. 승선생활관 규정에 대한 사항","7. 기타 학생으로서 필요한 기본 소양 교육"]},{"c":"제7장 신입생 적응교육","t":"제33조(교육수료)","l":["① 적응교육생은 모든 교육과정에 참여하여야 한다. 단, 입원·추가합격 등 불가피한 사유로 교육기간을 충족하지 못한 경우 입학 후에 별도 교육을 실시할 수 있다.","② 교육 기간 중 교육 태도가 성실하고 모범적인 적응교육생에 대하여 선행점을 부여할 수 있다."]},{"c":"제8장 승선사관부","t":"제34조(조직)","l":["① 승선사관부(이하 “사관부”라 한다)는 사관장, 부사관장, 각 부장, 사관 및 부관으로 구성한다.","② 사관장과 부사관장은 학생들이 직접 선출한 학생을 생활관장이 임명한다.","③ 사관부는 원활한 운영을 위하여 교육지도부, 복지부, 기획부, 학생권익부 (항해부, 기관부, 여학생부)로 구성한다.","④ 조직도는 다음과 같다."]},{"c":"제8장 승선사관부","t":"제35조(지원 자격)","l":["사관부의 지원 자격은 다음을 모두 충족하는 자로 한다.","1. 승선생활관 규정에 의거하여 50점 이상의 처벌을 받지 아니한 학생","2. 전학기까지 평점 평균이 2.75이상인 학생","3. 평소 품행이 단정하고 타의 모범이 되는 학생"]},{"c":"제8장 승선사관부","t":"제36조(선출 및 임기)","l":["① 사관부의 선거는 승선사관부 선거시행규칙에 따른다.","② 사관부의 후보 등록 방법 및 선출 시기는 생활관장이 정하는 바에 따른다.","③ 후보 등록은 사관장, 부사관장 및 각 부장으로 구성하여 등록한다.","④ 임기는 일 년으로 한다."]},{"c":"제8장 승선사관부","t":"제37조(임무)","l":["① 승선사관부는 생활관 규정을 준수하여야한다.","② 사관부는 승선생활관장 및 지도관의 승선생활교육을 지원하며 [별표 7]의 업무를 수행한다.","③ 사관부는 승선생활규정에 위반되는 내용에 대하여 현장에서 지도할 수 있으며 해당 내용은 지도관실로 보고한다.","④ 사관부는 생활관 내 학생에 대한 선행을 지도관실로 건의할 수 있다."]},{"c":"제8장 승선사관부","t":"제38조(회의)","l":["① 사관부는 저녁 인원점검 전 정기회의를 갖는다.","② 다음 각 호의 경우에는 임시회의를 가질 수 있다.","1. 생활관장, 지도관 또는 사관장의 요청이 있을 경우","2. 사관부 학생 중 과반수의 요청이 있을 경우","③ 의결은 사관부 학생 과반수의 출석, 출석자의 2/3 이상 찬성이 있을 경우 가결된 것으로 한다."]},{"c":"제8장 승선사관부","t":"제39조(업무정지 및 직위해제)","l":["다음 각 호에 해당하는 경우 생활관장은 업무정지를 지시할 수 있으며, 지도위원회의 심의를 거쳐 사관부로부터 해임될 수 있다. 그로 인한 결원은 충원할 수 있다.","1. 주어진 임무의 범위를 벗어난 행위를 한 학생","2. 기타의 사유로 승선사관부로서의 활동에 적합하지 않다고 판단되는 학생"]},{"c":"제9장 시설물 사용 관리","t":"제40조(시설 관리)","l":["① 시설이라 함은 건물과 부대시설(부대설비), 구조물 및 조경을 위한 식·재물 등을 말한다.","② 시설의 유지․관리․운용․보수 등의 업무는 행정실에서 담당한다.","③ 생활관장은 효율적 시설관리를 위하여 적절한 조치를 취할 수 있다."]},{"c":"제9장 시설물 사용 관리","t":"제41조(에너지 관리)","l":["① 승선생활관의 효율적 에너지관리를 위하여 다음 각 호의 사항을 따로 정할 수 있다.","1. 냉·난방기의 사용에 관한 사항","2. 전기기기의 사용에 관한 사항","3. 개인 침실의 소등에 관한 사항","4. 수도사용에 관한 사항","5. 기타 생활관장이 결정한 사항","② 생활관의 에너지 관리를 위하여 장비 임의조작 등 부적절한 에너지 사용 시 생활관규정에 따라 과실점을 부여할 수 있다."]},{"c":"제9장 시설물 사용 관리","t":"제42조(시설 사용)","l":["① 생활관 사용에 있어서 학생들은 다음 각 호와 같은 권리를 가진다.","1. 침실비품 사용","2. 공공시설 이용","3. 시설의 보수 요구","4. 화재, 도난으로부터의 시설 보호 및 예방","② 학생은 시설 사용에 있어서 다음과 같은 의무를 가진다.","1. 시설의 원형유지","2. 시설의 점검 및 이상 유무 보고","3. 에너지 절약"]},{"c":"제9장 시설물 사용 관리","t":"제43조(사용자 책임)","l":["승선생활관규정에 의거하여 학생들은 사용자로서의 주의의무를 다하여야 하며, 고의 또는 과실로 인하여 시설의 훼손, 분실, 파괴 등 손실을 초래하였을 경우에는 원상복구를 하여야 한다. 다만, 시설의 원상복구가 불가능한 경우에는 시설가액 또는 원상복구에 상당하는 금액으로 변상할 수 있다."]},{"c":"제10장 보건 및 위생관리","t":"제44조(환자)","l":["① 환자라 함은 신체 및 정신적 이상으로 정상적인 생활관 일과에 참석이 어렵거나 불가능하다고 인정받은 학생을 말한다.","② 환자는 열외신청서를 지도관에게 제출 및 허가를 득하여 아침인원점검 및 각종 생활관 일과 열외를 허가받을 수 있다. 단, 긴급을 요하는 경우에는 보고 후 일과를 열외한 후 증빙서류를 익일 조식 결재시간까지 제출하여야 한다.","③ 환자는 자신의 행선지를 반대표 또는 담당사관에게 알리고 활동한다."]},{"c":"제10장 보건 및 위생관리","t":"제45조(위생 점검)","l":["① 위생 점검의 목적은 승선생활에서 필요한 위생관련 제반사항을 익힘과 동시에 거주구역을 청결하게 유지하는 것이다.","② 1,2학년의 위생 점검은 승선사관부가 실시하고 4학년은 지도관이 실시한다.","③ 위생 점검 시 학년별 점검 시간 및 장소를 사전에 공지한다.","④ 위생 점검 시의 복장은 생활복으로 한다."]},{"c":"제10장 보건 및 위생관리","t":"제46조(건강검진서의 제출)","l":["① 생활관에 입관하는 학생은 입관 전 6개월 이내에 발급받은 건강검진서를 제출하여야 한다.","② 건강검진서에는 폐결핵 검사가 포함되어야 한다.","③ 생활관장은 지정한 기간까지 건강검진서를 제출하지 않거나, 제출을 거부하는 학생에 대하여 관외통학 등을 명령할 수 있다."]},{"c":"제11장 지도관 당직","t":"제47조(당직의 구분)","l":["① 당직은 일직과 숙직으로 구분한다.","② 일직은 주말(토요일 및 일요일), 공휴일, 임시공휴일, 그 밖 이에 준하는 사유가 있는 날에 편성한다."]},{"c":"제11장 지도관 당직","t":"제48조(당직명령 및 변경)","l":["① 당직명령은 업무담당 지도관이 매월 작성한 당직근무명령표에 따라 시행하며, 사전에 승선생활관장에게 보고하여 승인을 받는다.","② 당직명령을 부여받은 자가 출장·휴가 등 부득이한 사유로 근무가 불가하여 당직 변경이 필요한 경우, 그 변경 사항을 승선생활관장에게 보고하여야 한다."]},{"c":"제11장 지도관 당직","t":"제49조(당직편성 및 근무시간)","l":["① 당직근무는 2인 1조로 편성하며, 총 3개 팀으로 운영한다. 근무 인원은 국가직 지도관 4인과 회계직 지도관 2인으로 구성하며, 필요 시 팀의 구성 인원을 조정하여 근무할 수 있다.","② 국가직 지도관 2개 팀은 교대로 일직 및 숙직 업무를 수행한다.","③ 근무시간은 다음 각 호와 같다.","1. 국가직 지도관","가. 평일 : 당직일 16:00 ~ 익일 10:00","나. 주말 및 공휴일 : 24시간 유연 근무","2. 대학회계직 지도관 : 평일 09:00 ~ 18:00 근무"]},{"c":"부칙","t":"부칙(2024.8.30.)","l":["이 지침은 총장 결재일부터 시행한다."]},{"c":"별표·서식","t":"[별표 1] 일과 및 방송(제2조, 제18조)","l":["<일과표>","시","분","월","화","수","목","금","토","일","6","30","총원기상 : 인원점검 및 체력증진활동 실시","7","30","아침식사","09:00","~","18:00","수업시간","자율시간","17","30","저녁식사","19","00","자율시간","22","00","청소 시작","15","인검 5분전(인원점검 장소 대기)","20","저녁 인원점검","30","취침 준비","24","00","취침 (관외통행금지)","<표준 방송 문구>","구분","표준 방송 문구","일과 방송","1. 총원 기상 15분전 (2회 반복), 오늘 아침인원 점검 장소 [운동장/지정장소], 1, 2, 4학년 총원은 06시 25분 까지 집합할 것","2. 식사 시작 15분전 (2회 반복)","3. 식사 시작 5분전 (2회 반복)","4. 식사 시작 식사 시작 [O학년/생활관] 총원 식사 시작 (2회 반복)","5. 식사 끝 식사 끝 더 이상 식당에 내려오는 학생이 없도록 할 것","6. 청소 시작 15분전 (2회 반복)","7. 청소 시작 5분전 (2회 반복)","8. 청소 시작 청소 시작","9. 인검 5분 전","10. 전 호관 소등 5분 전","11. 전 호관 소등","방송","준수 사항","1. 표준 방송 문구를 임의로 변경하지 않도록 한다.","2. 지정된 방송 이외의 모든 방송은 지도관실의 허락을 득하도록 한다.(단, 긴급한 상황은 예외로 한다.)","3. 방송 시 발음 및 속도에 유의하도록 한다.","4. 일과 이외의 개인적인 방송은 하지 않도록 한다.","5. 승선생활관 방송 시에는 경어를 사용 하지 않는다."]},{"c":"별표·서식","t":"[별표 2] 복장 및 용모 점검절차(제6조)","l":["점검 항목","결과","비고","1","제복은 주름과 얼룩이 없이 깨끗한가?","2","명찰은 제복에 알맞게 잘 부착되어 있는가?","3","앵커, 학년, 학부 뱃지는 제복에 맞게 잘 부착되었는가?","4","견장은 적절하게 부착되어 있는가?","5","넥타이 및 넥타이 핀은 잘 착용하였는가?","6","양말 길이는 적절하며 구두는 청결한가?","7","(남학생) 두발상태는 단정하고 깔끔하며, 제복 모자를 착용했을 시 앞, 옆머리가 모자 밖으로 튀어 나오지 않고 뒷머리는 옷깃에 닿지 않으며 옆머리는 귀에 닿지 않는가?","8","(여학생) 두발상태는 단정하고 깔끔하며, 어깨를 넘는 길이의 머리카락은 묶어 머리망을 하고 잔머리 없이 정리 되어 있는가?"]},{"c":"별표·서식","t":"[별표 3] 상륙 및 귀관 절차(제10조)","l":["<상륙절차>","상륙종류","절    차","비  고","특별상륙","1. 학사행정 시스템 신청","2. 지도관실 결재","3. 학생당직실 경유 하여 상륙","정복착용","외박가능","주말상륙","1. 학사행정 시스템 신청","2. 스마트상륙 시스템 인증 후 상륙","정복착용","외박가능","보통상륙","1. 학사행정 시스템 신청","2. 스마트상륙 시스템 인증 후 상륙","통상복착용(주중)","정복착용(주말)","외박불가","<귀관절차>","상륙종류","절    차","비  고","특별상륙 귀관","학생당직실 경유 하여 귀관 후 입실","주말상륙 귀관","스마트상륙 시스템 인증 후 입실","보통상륙 귀관","스마트상륙 시스템 인증 후 입실"]},{"c":"별표·서식","t":"[별표 4] 선행점․과실점 부과기준(제11조, 제12조)","l":["<선행점 기준>","점수","부과 기준","생활관 활동","교내외 활동","50점","1. 생활관의 질서유지 및 발전에 지대한 공헌을 한 학생으로 지도위원회에서 의결한 학생","1. 다른 학생의 모범이 될 만한 선행으로 총장 및 교외 기관장 등이 추천한 학생","30점","1. 다른 학생의 모범이 될 만한 선행으로 지도위원회에서 의결한 학생","1. 다른 학생의 모범이 될 만한 선행으로 해사대학장, 대학본부 및 부속시설의 장이 추천한 학생","2. 학술대회 및 체육대회 등의 교내외 행사에서 입상한 학생","20점","1. 다른 학생의 모범이 될 만한 선행으로 지도관회의에서 의결한 학생","1. 다른 학생의 모범이 될 만한 선행으로 학부장이 추천한 학생","2. 학술대회 및 체육대회 등의 교내외 행사에 공헌한 학생","3. 헌혈증 제출자(전혈헌혈)","10점","1. 지도관실 및 행정실 업무에 협조한 학생","2. 태도, 복장, 위생 상태가 다른 학생의 모범이 된 학생","3. 기타 다른 학생의 모범이 될 만한 선행으로 지도관, 사관장, 당직사관이 추천한 학생","1. 학부사무실, 대학본부 및 부속시설의 사무실 업무에 협조한 학생 (단, 동일한 사유로 최대 2회까지 부여가능)","2. 사회봉사 활동이 인정되는 공공기관 및 단체(VMS, 1365 및 두볼 자원봉사포털 등록 단체)에서 봉사활동을 한 학생(한학기 최대 100점)","3. 헌혈증 제출자(성분헌혈 포함)","4. 기타 다른 학생의 모범이 될 만한 선행으로 학부사무실, 대학본부 및 부속시설의 사무실에서 추천한 학생","※ 명시되지 않은 선행점은 지도위원회에서 결정한다.","선행과 관련한 활동의 시간 등을 고려하여 기준 점수 이상을 부여할 수 있다.","<과실점 기준>","점수","부과 기준","50점","(징계","상신","대상)","1. 학내에서 절도를 한 학생","2. 폭행, 폭언등을 한 학생","3. 도박(화투, 카드 등 사행성 오락도구 소지 포함), 사기 등 단체생활에 부적합한 행위를 한 학생","4. 이성의 생활구역에 출입 또는 방조한 학생","5. 성적인 언어나 행동으로 다른 학생에게 피해를 준 학생","6. 고의적으로 학교의 시설물을 훼손한 학생","7. 출입금지 구역을 허가 없이 출입 또는 협조한 학생","50점","(상륙","금지","2주)","1. 외부인을 허가 없이 생활관으로 인도한 학생","2. 허가 없이 학생을 집합시키거나 훈련을 시킨 학생","3. 학내에서 술을 마시거나 반입한 학생(단, 필요시 생활관장이 허가할 수 있다.)","4. 음주로 인한 행위로 단체 생활에 피해를 준 학생","5. 무단으로 상륙 또는 귀관을 한 학생","6. 무단으로 귀관하지 않은 학생(단, 해당기간 동안 점수는 중복부여 가능하나 상륙금지는 최대 2주로 한다.)","7. 지정된 흡연구역 외에서 흡연한 학생","8. 문서를 위조 또는 변조한 학생","9. 교직원에게 언어 및 행동이 불손하거나 폭행을 가한 학생","10. 기타 50점 과실에 상응하다고 판단되는 과실을 범한 학생","40점","(상륙","금지 2주)","1. 귀관시간에 늦은 학생(단, 천재지변과 불가항력으로 인한 경우는 제외한다.)","2. 생활관 출입이 금지된 학생으로서 무단으로 생활관에 출입한 학생","3. 생활관에서 허가 받지 않은 냉난방 및 취사기구 등을 소지하거나 사용한 학생","4. 고의적으로 학교의 시설물을 개조한 학생","5. 승선생활관 지침 제41조 에너지 관리에 관한 사항을 위반한 학생","6. 무단으로 당직(학생당직, 야간안전당직) 근무지를 이탈한 학생","7. 지정된 구역 외에 쓰레기를 무단 투기한 학생","8. 기타 40점 과실에 상응하다고 판단되는 과실을 범한 학생","30점","(상륙금지 1주)","1. 생활관장, 지도교수, 행정실장, 지도관 및 승선사관부의 정당한 지시사항을 위반하거나","승선생활관 위계질서를 침해한 학생(학기당 과실 누적 3회 이상)","2. 허위보고, 대리인검 또는 사
