<style>
/* Layout: 굵은 프레임으로 나눈 계기판형 화면. 홈은 대형 제목과 과정 목록, 레슨은 읽는 칸과 고정 실습 시트. */
:root{
  --brand:#EE6A1F; /* 대표색 */

  --accent:var(--brand); --accent-text:#B4470E; --accent-soft:rgba(238,106,31,.10); --on-accent:#1A1B1C; --mark-cell:#FEF0E6;
  --inv-bg:#FFFFFF; --inv-ink:#201F1D; --inv-muted:#66635E; --inv-line:#E3E1DC;
  --badge-bg:var(--brand); --badge-ink:#1A1B1C; --badge-sub:#1A1B1C; --tick-bg:#EFEEEB; --tick-ink:#201F1D; --card-head:#EFEEEB; --code-bg:#201F1D; --code-ink:#F7F7F5;

  --r0:rgba(238,106,31,.26); --r1:rgba(36,88,214,.2); --r2:rgba(11,122,83,.22); --r3:rgba(148,84,200,.22);

  --display:"Schibsted Grotesk","Gothic A1","Malgun Gothic",sans-serif; --body:"IBM Plex Sans KR","Malgun Gothic",sans-serif; --mono:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --good:#58D2A5; --good-soft:#143A2E; --bad:#FF8F98; --bad-soft:#47202A;

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.7 var(--body);word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}

h1,h2,p,ul,ol{margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;align-items:stretch;height:var(--bar);background:var(--paper);border-bottom:2px solid var(--frame);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.brand{font:800 19px/1 var(--display);letter-spacing:-.02em;background:none;border:0;padding:0;margin-right:auto;white-space:nowrap}
.seg{background:none;border:0;border-left:2px solid var(--frame);padding:0 20px;font:700 13.5px/1 var(--display);white-space:nowrap}

.seg.go{background:var(--accent);color:var(--on-accent)}

.os{display:flex;align-items:center;gap:0;padding:0 12px;border-left:2px solid var(--frame)}
.os button{background:none;border:1px solid var(--line);padding:6px 9px;font:700 12px/1 var(--display);color:inherit;white-space:nowrap}
.os button+button{border-left:0}
.os button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.only-mac,.mac-note{display:none}

.meter{display:flex;align-items:center;gap:10px;padding:0 20px;border-left:2px solid var(--frame);font:500 13px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.meter b{display:block;height:100%;background:var(--accent)}
.btn{background:var(--surface);border:1px solid var(--line);padding:6px 13px;font-size:13px;line-height:1.5;border-radius:0;white-space:nowrap}
.btn:hover{border-color:var(--frame)}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.main:hover{border-color:var(--accent);filter:brightness(1.07)}
.btn:disabled{opacity:.4;cursor:default}
.lesson{display:grid;grid-template-columns:minmax(320px,430px) minmax(0,1fr);align-items:start}
.read{padding-block:22px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:grid;gap:14px;min-width:0}
.head{display:flex;gap:16px;align-items:center}
.coord{flex:none;align-self:flex-start;min-width:74px;height:40px;padding:0 8px;display:grid;place-items:center;background:var(--accent);font:600 16px/1 var(--mono);color:var(--on-accent)}
.eyebrow{font-size:13px;color:var(--muted)}
h1{font:800 27px/1.28 var(--display);letter-spacing:-.02em;text-wrap:balance}
.sec{border:2px solid var(--frame);background:var(--surface);min-width:0}

.sec>header span{font:600 13px/1 var(--mono);color:var(--accent-text)}
.sec>header h2{font:800 15px/1.3 var(--display)}
.sec-b{padding:14px;display:grid;gap:10px;min-width:0}
.sec-b.scene{background:var(--mark-cell)}
.sec.how .sec-b{padding:0;gap:0}
.blk{padding:14px;display:grid;gap:10px;min-width:0}

.blk h3::before{content:"";display:inline-block;width:8px;height:8px;background:var(--accent);margin-right:8px;vertical-align:1px}
.read ul{padding-left:18px;display:grid;gap:6px}
code{font:400 13.5px/1.5 var(--mono);background:var(--sunken);padding:1px 5px;border-radius:2px;overflow-wrap:anywhere}
kbd{font:600 12px/1 var(--mono);background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;padding:2px 6px;border-radius:3px;white-space:nowrap}
.mini-wrap{overflow-x:auto}
.mini{border-collapse:collapse;font:400 13px/1.45 var(--body);background:var(--surface);min-width:100%}

.mini .hl{background:var(--mark-cell)}
.nav{display:flex;gap:8px}
.lab{position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));height:calc(100dvh - var(--bar));min-height:720px;display:flex;flex-direction:column;background:var(--surface);border-left:2px solid var(--frame);min-width:0}
.task{padding:14px 18px;border-bottom:1px solid var(--line);display:grid;gap:7px}
.task-top{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px}
.dots span{width:18px;height:6px;background:var(--sunken)}

.dots .c{background:var(--accent)}
.task-text{font-size:16px;font-weight:500;line-height:1.55}
.task-act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.reveal{font-size:14px;background:var(--sunken);padding:7px 11px}

#task{min-height:176px;flex:none}
.donebox{display:grid;gap:9px}

.xbar{display:flex;align-items:center;gap:2px;height:26px;padding:0 8px;background:var(--accent);color:var(--on-accent);font-size:12.5px}

.xbar button:hover{background:rgba(0,0,0,.14)}
.xbar span{margin-left:8px;font-weight:600}
.rib{background:var(--paper);border-bottom:1px solid var(--line);flex:none}
.rtabs{display:flex;gap:1px;padding:3px 6px 0;overflow-x:auto;scrollbar-width:none}
.rtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:4px 11px;font:500 13px/1.3 var(--body);white-space:nowrap}
.rtabs button:hover{background:var(--sunken)}
.rtabs button.on{border-bottom-color:var(--accent);font-weight:700}
.rbody{display:flex;align-items:stretch;padding:5px 4px 2px;overflow-x:auto;scrollbar-width:thin;border-top:1px solid var(--line);min-height:76px}
.rg{display:flex;flex-direction:column;justify-content:space-between;padding:0 7px;border-right:1px solid var(--line);flex:none}
.rg-b{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);gap:2px;align-items:center;justify-content:start}
.rg-l{text-align:center;font-size:11px;line-height:1.3;color:var(--muted);padding-top:3px}
.rb{background:none;border:1px solid transparent;border-radius:2px;padding:2px 7px;font-size:12.5px;line-height:1.5;white-space:nowrap;min-height:24px}
.rb:hover:not(:disabled){background:var(--mark-cell);border-color:var(--accent)}
.rb:disabled{opacity:.4;cursor:default}
.rb.big{grid-row:span 2;align-self:stretch;min-height:50px;min-width:50px;white-space:normal;max-width:74px;font-weight:600;line-height:1.25}
.rb.wide{min-width:88px;text-align:left;border-color:var(--line);background:var(--surface)}
.rmenu{position:fixed;z-index:40;display:grid;min-width:130px;background:var(--surface);border:1px solid var(--frame);box-shadow:0 3px 10px rgba(0,0,0,.25);padding:3px;max-height:70vh;overflow:auto}
.rmenu.tall{grid-template-columns:repeat(3,auto)}
.rmenu button{background:none;border:0;text-align:left;padding:4px 12px;font-size:13px;white-space:nowrap}
.rmenu button:hover{background:var(--mark-cell)}
.rmenu hr{margin:3px 0;border:0;border-top:1px solid var(--line)}
.fxb{flex:none;width:24px;background:none;border:0;border-right:1px solid var(--line);color:var(--muted);font-size:12px}
.fxb:hover{background:var(--sunken)}
.area{position:relative;flex:1;display:flex;min-height:200px;min-width:0;overflow:hidden}
.stabs{flex:none;display:flex;align-items:stretch;height:25px;background:var(--paper);border-top:1px solid var(--line);padding-left:44px;overflow-x:auto;scrollbar-width:none}
.stab{background:none;border:0;border-right:1px solid var(--line);padding:0 16px;font-size:12.5px;white-space:nowrap}
.stab:hover{background:var(--sunken)}
.stab.on{background:var(--surface);font-weight:700;color:var(--accent-text);box-shadow:inset 0 -2px 0 var(--accent)}
.sadd{background:none;border:0;width:28px;font-size:16px;line-height:1;color:var(--muted)}
.srn{width:92px;font-size:12.5px;border:1px solid var(--accent);padding:0 4px;background:var(--surface);color:var(--ink)}
.ready{margin-right:auto}
.zoom{display:flex;align-items:center;gap:4px;margin-left:10px}
.zoom button{background:none;border:0;width:20px;font-size:14px;line-height:1;color:inherit}
.dock{position:absolute;inset:0;pointer-events:none;z-index:6}
.card{position:absolute;pointer-events:auto;max-width:calc(100% - 16px);max-height:calc(100% - 16px);overflow:auto;background:var(--surface);border:1px solid var(--frame);box-shadow:0 4px 14px rgba(0,0,0,.28)}
.card>header{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:var(--card-head);color:var(--ink);font:700 13px/1.3 var(--display);cursor:move;touch-action:none}
.card>header button{background:none;border:0;color:inherit;font-size:17px;line-height:1;padding:0 3px}
.cb{padding:10px;display:grid;gap:8px;font-size:13px;min-width:0}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.hint{color:var(--muted);font-size:12.5px;line-height:1.5}
.chks{display:flex;flex-wrap:wrap;gap:4px 12px}
.chks label{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{background:var(--surface);border:1px solid var(--frame);padding:3px 11px;font-size:12.5px}
.chips button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.chips .clr{border-style:dashed}
.steps{margin:0;padding-left:18px;font-size:12.5px;display:grid;gap:2px}
.sm{font-size:12.5px}
.pages{display:flex;flex-wrap:wrap;gap:5px}
.pages i{width:26px;height:36px;border:1px solid var(--frame);background:var(--surface);display:grid;place-items:center;font:400 11px/1 var(--mono)}
.pages.l i{width:36px;height:26px}
.chart svg{display:block;width:100%;max-height:190px}
.chart .ax{font:400 11px var(--body);fill:var(--muted)}
.ct{font:800 14px/1.3 var(--display);margin-bottom:3px}
.lg{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;margin-bottom:3px}
.lg span{display:flex;align-items:center;gap:5px}
.lg i{width:10px;height:10px;display:block}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px}
.qt{overflow-x:auto}
.pv2{border-collapse:collapse;font-size:12.5px;white-space:nowrap}
.pv2 th,.pv2 td{border:1px solid var(--line);padding:3px 7px;text-align:left}
.pv2 th{padding:0;background:var(--sunken)}
.pv2 th button{background:none;border:0;padding:4px 7px;font:600 12.5px/1.2 var(--body)}
.pv2 th button.on{background:var(--accent);color:var(--on-accent)}
.vba{margin:0;padding:7px 9px;background:var(--code-bg);color:var(--code-ink);font:400 12px/1.5 var(--mono);overflow-x:auto}
.ddbtn{position:absolute;z-index:3;width:18px;height:21px;padding:0;background:var(--surface);border:1px solid var(--frame);font-size:11px;line-height:1}
.ddl{position:absolute;z-index:6;display:grid;background:var(--surface);border:1px solid var(--frame);min-width:90px}
.ddl button{background:none;border:0;padding:4px 9px;text-align:left;font-size:13px}
.ddl button:hover{background:var(--mark-cell)}
.grid td.ms{background:var(--r0)}
.grid td.band{background:var(--paper)}
.grid td.fh{position:relative;padding-right:16px}
.grid td.fh::after{content:"▾";position:absolute;right:3px;top:4px;font-size:11px;color:var(--accent-text)}
.clock{margin-left:auto;font:600 13px/1 var(--mono);color:var(--accent-text)}
.fbar{display:flex;align-items:stretch;border-bottom:1px solid var(--line);height:27px;flex:none}
.fbar input{border:0;background:var(--surface);color:var(--ink);font:400 14px/1 var(--mono);padding:0 9px;min-width:0;outline-offset:-2px}
.namebox{width:92px;flex:none;border-right:1px solid var(--line)!important;text-align:center}

.finput{flex:1}

.sig:empty{display:none}
.wrap{position:relative;flex:1;overflow:auto;min-width:0;background:var(--surface);user-select:none;-webkit-user-select:none}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;font:400 13.5px/1 "Malgun Gothic","맑은 고딕",var(--body)}
.grid th{position:sticky;background:var(--paper);color:var(--muted);font:400 11.5px/1 var(--body);border-right:1px solid var(--line);border-bottom:1px solid var(--line);z-index:4;height:21px;cursor:pointer}
.rz{position:absolute;top:0;right:-3px;bottom:0;width:6px;cursor:col-resize;z-index:1}

.grid.fzc tbody td:nth-child(2){position:sticky;left:44px;z-index:1;background:var(--surface);border-right:2px solid var(--muted)}
.grid.nogrid td{border-color:transparent}

.grid td.bd{box-shadow:inset 0 0 0 1px var(--ink)}

.mgc.b{font-weight:600}.mgc.it{font-style:italic}
.xbar .sv{width:auto;padding:0 8px;font-size:12px;font-weight:700}
.rb.armed{background:var(--accent);color:var(--on-accent)}
.dtabs{display:flex;gap:1px;border-bottom:1px solid var(--line)}
.dtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:3px 10px;font-size:12.5px}
.dtabs button.on{border-bottom-color:var(--accent);font-weight:700}
.hits{display:grid;max-height:130px;overflow:auto;border:1px solid var(--line)}
.hits button{background:none;border:0;border-bottom:1px solid var(--line);text-align:left;padding:3px 7px;font-size:12.5px}
.hits button:hover{background:var(--mark-cell)}
.grid td.it{font-style:italic}.grid td.un{text-decoration:underline}.grid td.all{text-align:left}.grid td.alc{text-align:center}.grid td.alr{text-align:right}

B4:{title:'조건부 서식',pts:2,topic:'수식으로 행 전체 칠하기',

 +B('여러 조건',`<p>둘 다 만족해야 하면 ${C('=AND(조건1,조건2)')}, 하나만 만족해도 되면 ${C('=OR(조건1,조건2)')}을 써요.</p>`)
 +B('이 화면과 시험의 차이',`<p>실제 시험은 글꼴 스타일, 글꼴 색, 채우기 색을 서식 대화상자에서 고르라고 나와요. 이 화면은 서식 목록에서 고르는 것으로 연습해요.</p>`),

 +B('실행',`<p><b>데이터 › 고급</b>을 누르고 목록 범위, 조건 범위, 복사 위치를 입력해요. 시험은 거의 <b>다른 장소에 복사</b>로 나와요.</p>`)
 +B('함수가 들어간 조건',`<p>"성이 김씨인" 같은 조건은 수식으로 써요. 이때 조건표의 머리글은 원본 머리글과 <b>다르게</b> 써야 해요. (예: ${C('조건')})</p><p>수식은 첫 데이터 행 기준으로 ${C('=AND(LEFT(B4,1)="김",F4=0)')}처럼 써요. 셀에 TRUE나 FALSE가 보이면 정상이에요.</p>`),

D5:{title:'시나리오',pts:3,topic:'조건이 바뀔 때 결과 비교하기',
goal:'셀 이름을 정의하고, 시나리오를 추가한 뒤 요약 보고서를 만듭니다.',
exam:'"[시나리오 관리자] 기능을 이용하여 할인율[B6]이 다음과 같이 변하는 경우 순이익[B9]의 변동 시나리오를 작성하시오. [B6] 셀은 \'할인율\', [B9] 셀은 \'순이익\'으로 이름을 정의하시오. 시나리오1은 \'할인율인상\', 할인율 10%, 시나리오2는 \'할인율인하\', 할인율 3%로 설정하시오."',
how:B('순서',`<ol><li>B6, B9에 이름을 정의해요 (이름 상자)</li><li><b>데이터 › 가상 분석 › 시나리오 관리자</b>에서 시나리오 두 개를 추가해요</li><li><b>요약</b>을 누르고 결과 셀에 B9를 입력해요</li></ol>`)
 +B('이름을 먼저 정의하는 이유',`<p>요약 보고서에 ${C('$B$6')} 대신 <b>할인율</b>, <b>순이익</b>이 표시돼요. 이름 정의를 빠뜨리면 감점이에요.</p>`)
 +B('요약 시트',`<p>요약을 실행하면 <b>시나리오 요약</b> 시트가 현재 시트 앞에 새로 생겨요.</p>`),

D6:{title:'통합과 데이터 표',pts:3,topic:'여러 표 합치기와 값 바꿔 보기',

exam:'"[통합] 기능을 이용하여 1월과 2월 판매 표의 지점별 수량과 금액의 합계를 [K2:M6] 영역에 계산하시오."',
how:B('통합',`<ol><li>결과 위치 <b>K2:M6</b>을 선택해요 (머리글과 지점 이름 포함)</li><li><b>데이터 › 통합</b>에서 함수 <b>합계</b></li><li>참조에 A2:C6을 추가, F2:H6을 추가</li><li><b>첫 행</b>, <b>왼쪽 열</b>을 체크하고 확인</li></ol><p>지점 순서가 표마다 달라도 이름표를 기준으로 합쳐 줘요.</p>`)
 +B('데이터 표',`<p>입력값 하나를 여러 값으로 바꿔 가며 결과를 한 번에 보는 표예요. 수식 ${C('=B12')}가 표 위쪽에, 바꿀 값이 왼쪽 열에 있으면 <b>열 입력 셀</b>에 원래 입력 칸(B11)을 지정해요.</p>`+mini([['바꿀 값 위치','지정할 칸'],['왼쪽 열에 세로로','열 입력 셀'],['위쪽 행에 가로로','행 입력 셀']])),
traps:['통합에서 첫 행·왼쪽 열 체크를 빼면 이름표 없이 위치로만 더해져 틀려요.','데이터 표의 입력 셀은 표 안이 아니라 원래 수식이 참조하는 칸이에요.'],

E1:{title:'매크로',pts:10,topic:'기록하고 단추에 연결하기',
goal:'작업을 매크로로 기록하고, 단추를 만들어 매크로를 연결합니다.',
exam:'"[D4:D8] 영역에 1분기와 2분기의 합계를 계산하는 \'합계\' 매크로를 생성하시오. 도형을 생성한 뒤 텍스트를 \'합계\'로 입력하고, 도형을 클릭하면 \'합계\' 매크로가 실행되도록 지정하시오." 매크로는 보통 두 개가 나와요.',
how:B('기록 순서',`<ol><li><b>개발 도구 › 매크로 기록</b>을 누르고 이름을 입력해요</li><li>지시한 작업만 정확히 해요</li><li><b>기록 중지</b>를 눌러요</li><li>도형(단추)을 만들고 매크로를 지정해요</li></ol>`)
 +B('이 화면에서는',`<p>매크로 창에서 이름을 쓰고 <b>기록 시작</b>, 시트에서 작업, <b>기록 중지</b>를 눌러요. 그다음 <b>단추 만들기</b>로 단추를 만들고 매크로를 연결해요. 만든 단추는 수식 입력줄 아래에 나타나요.</p>`)
 +B('실제 엑셀에서는',`<p>개발 도구 탭이 안 보이면 <b>파일 › 옵션 › 리본 사용자 지정</b>에서 켜요. 도형은 <b>삽입 › 도형</b>으로 그리고 마우스 오른쪽 버튼 › <b>매크로 지정</b>을 골라요. 단추는 <b>개발 도구 › 삽입 › 단추(양식 컨트롤)</b>예요.</p>`),
traps:['기록 중에 다른 칸을 건드리면 그 작업도 매크로에 들어가요. 실수했다면 지우고 다시 기록하세요.','매크로 이름에는 공백을 넣을 수 없어요.','도형의 글자와 연결한 매크로 이름이 지시와 다르면 감점이에요.'],

M('<b>합계</b>라는 글자의 단추를 만들고 <b>합계</b> 매크로를 연결하세요.',st(s=>s.buttons().some(b=>b.label==='합계'&&b.macro==='합계'),s=>s.addButton('합계','합계'),'매크로 창 → 단추 텍스트 합계, 매크로 합계 → 단추 만들기'),'매크로 창 아래의 단추 만들기를 쓰세요.'),

M('<b>서식</b>이라는 글자의 단추를 만들고 <b>서식</b> 매크로를 연결하세요.',st(s=>s.buttons().some(b=>b.label==='서식'&&b.macro==='서식'),s=>s.addButton('서식','서식'),'단추 텍스트 서식, 매크로 서식 → 단추 만들기'),'연결할 매크로에서 서식을 고르세요.')],
recap:['기록 시작 → 지시한 작업만 → 기록 중지','단추 글자와 매크로 이름을 지시대로','실수하면 다시 기록']},

const PIL=[
{id:'p1',sub:1,title:'윈도우 바로 가기 키',points:['<b>Win+E</b> 파일 탐색기, <b>Win+D</b> 바탕 화면 보기, <b>Win+L</b> 잠금, <b>Win+R</b> 실행, <b>Win+I</b> 설정','<b>Alt+Tab</b> 창 전환, <b>Alt+F4</b> 창 닫기, <b>Ctrl+Shift+Esc</b> 작업 관리자','<b>Shift+Delete</b> 휴지통을 거치지 않고 삭제, <b>F2</b> 이름 바꾸기, <b>F5</b> 새로 고침','바로 가기 아이콘은 원본을 가리키는 연결이라 지워도 원본은 그대로예요. 확장자는 .lnk'],
 q:['휴지통을 거치지 않고 파일을 바로 삭제하는 키는?',['Ctrl+Delete','Shift+Delete','Alt+Delete','Win+Delete'],1,'Shift+Delete로 지운 파일은 휴지통에 남지 않아 복원할 수 없어요.']},
{id:'p2',sub:1,title:'윈도우 관리 도구',points:['<b>작업 관리자</b>: 실행 중인 프로세스 확인, 응답 없는 앱 끝내기, 시작 프로그램 관리','<b>디스크 정리</b>: 임시 파일 같은 불필요한 파일을 지워 공간 확보','<b>드라이브 조각 모음 및 최적화</b>: 흩어진 파일을 모아 읽는 속도를 높임','<b>장치 관리자</b>: 하드웨어와 드라이버 확인, 업데이트','휴지통에 남지 않는 경우: USB·네트워크 드라이브에서 삭제, Shift+Delete, 휴지통 크기보다 큰 파일'],
 q:['디스크의 흩어진 파일을 모아 접근 속도를 높이는 도구는?',['디스크 정리','드라이브 조각 모음 및 최적화','장치 관리자','시스템 복원'],1,'디스크 정리는 공간을 비우는 도구이고, 속도를 높이는 것은 조각 모음 및 최적화예요.']},
{id:'p3',sub:1,title:'CPU와 처리 속도',points:['CPU는 <b>제어 장치</b>, <b>연산 장치(ALU)</b>, <b>레지스터</b>로 이뤄져요','레지스터는 CPU 안의 가장 빠른 임시 기억 장소예요. 프로그램 카운터(PC)는 다음에 실행할 명령의 주소를 가져요','처리 속도 단위: ms(10⁻³) › μs(10⁻⁶) › ns(10⁻⁹) › ps(10⁻¹²) › fs(10⁻¹⁵). 뒤로 갈수록 짧아요','인터럽트: 실행 중 급한 일이 생기면 잠시 멈추고 처리한 뒤 원래 작업으로 돌아와요'],
 q:['다음 중 가장 짧은 시간 단위는?',['ms','μs','ns','ps'],3,'ps(피코초)는 10의 -12제곱 초로 보기 중 가장 짧아요.']},
{id:'p4',sub:1,title:'기억 장치',points:['<b>ROM</b>은 전원이 꺼져도 내용이 남고 바이오스 같은 펌웨어를 저장해요. <b>RAM</b>은 전원이 꺼지면 지워져요','<b>DRAM</b>은 주기적으로 재충전해야 하고 주기억 장치로 써요. <b>SRAM</b>은 재충전이 필요 없고 더 빨라 캐시 메모리로 써요','<b>캐시 메모리</b>: CPU와 주기억 장치 사이의 속도 차이를 줄여요','<b>가상 메모리</b>: 보조 기억 장치 일부를 주기억 장치처럼 써요','속도: 레지스터 › 캐시 › 주기억 › 보조 기억. 용량: KB ‹ MB ‹ GB ‹ TB ‹ PB'],
 q:['캐시 메모리로 주로 쓰이는 것은?',['DRAM','SRAM','ROM','플래시 메모리'],1,'SRAM은 재충전이 필요 없어 빠르기 때문에 캐시 메모리로 써요.']},
{id:'p5',sub:1,title:'소프트웨어 구분',points:['시스템 소프트웨어: 운영체제, 언어 번역기, 유틸리티. 응용 소프트웨어: 워드, 엑셀 같은 프로그램','운영체제 성능 평가: 처리 능력과 사용 가능도, 신뢰도는 높을수록, 응답 시간은 짧을수록 좋아요','<b>셰어웨어</b>: 기능이나 기간을 제한해 무료로 써 보게 함. <b>프리웨어</b>: 완전 무료. <b>데모</b>: 홍보용으로 일부 기능만','<b>알파 버전</b>: 개발사 내부 테스트. <b>베타 버전</b>: 정식 출시 전 사용자 테스트. <b>패치</b>: 오류 수정','<b>컴파일러</b>는 전체를 번역한 뒤 실행하고, <b>인터프리터</b>는 한 줄씩 번역하며 실행해요'],
 q:['정식 출시 전에 일반 사용자에게 공개해 테스트하는 버전은?',['알파 버전','베타 버전','데모 버전','패치 버전'],1,'알파는 내부 테스트, 베타는 사용자 대상 테스트예요.']},
{id:'p6',sub:1,title:'자료 표현과 코드',points:['비트(0과 1) › 니블(4비트) › 바이트(8비트) › 워드','<b>BCD</b> 6비트(64가지), <b>ASCII</b> 7비트(128가지), <b>EBCDIC</b> 8비트(256가지), <b>유니코드</b> 16비트로 전 세계 문자를 표현','<b>패리티 비트</b>는 오류를 검출만 하고, <b>해밍 코드</b>는 검출과 정정까지 해요','진법: 2진수 1010은 10진수 10, 16진수 A는 10, F는 15'],
 q:['오류를 검출하고 정정까지 할 수 있는 코드는?',['패리티 비트','해밍 코드','ASCII 코드','BCD 코드'],1,'해밍 코드는 오류 위치를 찾아 스스로 고칠 수 있어요.']},
{id:'p7',sub:1,title:'네트워크와 인터넷',points:['<b>IPv4</b>는 32비트(8비트씩 4부분), <b>IPv6</b>는 128비트(16비트씩 8부분, 콜론으로 구분)','<b>DNS</b>: 도메인 이름을 IP 주소로 바꿔 줘요','프로토콜: HTTP(웹), FTP(파일 전송), SMTP(메일 보내기), POP3·IMAP(메일 받기)','장비: 허브(여러 기기 연결), 스위치(목적지로 전달), <b>라우터</b>(최적 경로 결정), 게이트웨이(다른 네트워크 연결), 리피터(신호 증폭)','망 형태: 스타형(중앙 집중), 버스형, 링형, 메시형'],
 q:['데이터가 목적지까지 가는 최적 경로를 정하는 장비는?',['허브','리피터','라우터','브리지'],2,'라우터는 네트워크 사이에서 가장 좋은 경로를 골라 데이터를 보내요.']},
{id:'p8',sub:1,title:'멀티미디어',points:['<b>비트맵</b>은 픽셀로 표현해 확대하면 계단 현상이 생겨요 (BMP, JPG, GIF, PNG). <b>벡터</b>는 선과 도형으로 표현해 확대해도 깨끗해요 (AI, SVG, WMF)','JPG는 사진용 손실 압축, GIF는 256색과 애니메이션, PNG는 무손실 압축과 투명 배경','오디오: WAV(원음 그대로라 용량 큼), MIDI(악기 연주 정보라 용량 작음), MP3(압축)','동영상: MPEG(압축 표준), AVI, MP4, MOV','<b>샘플링</b>: 아날로그 소리를 일정 간격으로 잘라 디지털 값으로 바꾸는 것'],
 q:['확대해도 계단 현상이 생기지 않는 그래픽 방식은?',['비트맵','벡터','래스터','JPG'],1,'벡터는 좌표와 수식으로 그리기 때문에 확대해도 선이 깨지지 않아요.']},
{id:'p9',sub:1,title:'정보 보안',points:['<b>바이러스</b>는 다른 파일에 붙어 퍼지고, <b>웜</b>은 스스로 복제해 네트워크로 퍼져요. <b>트로이 목마</b>는 정상 프로그램으로 위장하고, <b>랜섬웨어</b>는 파일을 암호화한 뒤 돈을 요구해요','공격: DoS·DDoS(서비스 마비), 스니핑(엿보기), 스푸핑(위장), 피싱(가짜 메일·사이트로 정보 탈취), 파밍(정상 주소를 가짜 사이트로 연결)','<b>비밀키(대칭키)</b>: 암호화와 복호화에 같은 키 (DES). <b>공개키(비대칭키)</b>: 공개키와 개인키를 따로 씀 (RSA)','<b>방화벽</b>: 외부에서 들어오는 허가되지 않은 접근을 막아요. 내부에서 일어나는 공격은 막기 어려워요'],
 q:['암호화와 복호화에 서로 다른 키를 쓰는 방식은?',['비밀키 암호화','대칭키 암호화','공개키 암호화','DES'],2,'공개키 암호화는 공개키로 암호화하고 개인키로 복호화해요. RSA가 대표적이에요.']},
{id:'p10',sub:1,title:'최신 기술 용어',points:['<b>IoT</b>: 사물에 센서와 통신을 붙여 연결. <b>클라우드</b>: 인터넷으로 컴퓨팅 자원을 빌려 씀. <b>빅데이터</b>: 대량의 데이터를 분석','<b>RFID</b>: 전파로 태그를 인식. <b>NFC</b>: 10cm 안팎의 가까운 거리 무선 통신으로 모바일 결제에 쓰임','<b>블록체인</b>: 거래 기록을 여러 컴퓨터에 나눠 저장해 위조를 막음','<b>텔레매틱스</b>: 자동차와 통신의 결합. <b>핀테크</b>: 금융과 기술의 결합','컴퓨터 분류: 디지털(숫자·논리 연산, 범용), 아날로그(연속값, 특수 목적), 하이브리드(둘을 결합)'],
 q:['가까운 거리에서 무선으로 데이터를 주고받으며 모바일 결제에 쓰이는 기술은?',['RFID','NFC','블루투스','와이파이'],1,'NFC는 약 10cm 이내에서 동작해 교통 카드와 모바일 결제에 쓰여요.']},
{id:'p11',sub:2,title:'스프레드시트 핵심 정리',points:['입력: <b>Ctrl+Enter</b> 선택한 칸에 동시 입력, <b>Alt+Enter</b> 칸 안 줄 바꿈, 숫자 앞 0 유지는 작은따옴표','오류 값: #DIV/0!(0으로 나눔), #N/A(찾는 값 없음), #NAME?(함수 이름 오류), #REF!(참조한 셀 없어짐), #VALUE!(잘못된 형식의 값)','표시 형식: 0은 자릿수만큼 0을 채우고 #은 유효한 숫자만 표시, 쉼표는 천 단위, "원"처럼 글자 붙이기, aaa는 요일 한 글자','오름차순 정렬: 숫자 › 문자 › 논리값 › 오류 값 › 빈 셀. 빈 셀은 내림차순에서도 맨 뒤예요','부분합은 그룹 열로 먼저 정렬해야 하고, 새로운 값으로 대치를 해제하면 중첩 부분합이 돼요'],
 q:['셀에 #N/A 오류가 나타나는 이유는?',['0으로 나눔','찾는 값이 없음','함수 이름 오타','참조한 셀 삭제'],1,'VLOOKUP이나 MATCH가 찾는 값을 못 찾으면 #N/A가 나와요.']},
{id:'p12',sub:2,title:'차트·피벗·인쇄·매크로',points:['원형 차트는 계열을 하나만 표시해요. 원본 데이터가 바뀌면 차트도 자동으로 바뀌어요','<b>Alt+F1</b>은 현재 시트에 기본 차트를, <b>F11</b>은 새 차트 시트를 만들어요','피벗 테이블은 원본이 바뀌어도 자동으로 바뀌지 않아요. <b>새로 고침</b>을 눌러야 해요','인쇄: 인쇄 제목으로 반복할 행과 열을 지정하고, 페이지 나누기 미리 보기로 쪽 경계를 조절해요','매크로 이름은 문자로 시작하고 공백을 쓸 수 없어요. 바로 가기 키는 Ctrl과 영문자 조합이에요'],
 q:['현재 시트에 기본 차트를 바로 만드는 바로 가기 키는?',['F11','Alt+F1','Ctrl+F1','Shift+F11'],1,'F11은 새 차트 시트를 만들고, Alt+F1은 같은 시트에 차트를 만들어요.']},
];

/* ===== 화면 ===== */
const STAGES=[
 {name:'시작하기',ids:['X1']},
 {name:'기본작업',max:20,ids:['B1','B2','B3','B4','B5','B6']},
 {name:'계산작업',max:40,ids:['C1','C2','C3','C4','C5','C6','C7','C8','C9','C10','C11']},
 {name:'분석작업',max:20,ids:['D1','D2','D3','D4','D5','D6']},
 {name:'기타작업',max:20,ids:['E1','E2','E3','E4']},
 {name:'실전 한 판',ids:['M1']},
];
STAGES.forEach((S,si)=>S.ids.forEach((id,i)=>{if(L[id]){L[id].stage=si;L[id].idx=i}}));
const ORDER=STAGES.flatMap(S=>S.ids).filter(id=>L[id]);
const TOTAL=ORDER.length;
const stageOf=id=>STAGES[L[id].stage];
const codeOf=id=>`${L[id].stage}-${String(L[id].idx+1).padStart(2,'0')}`;
const app=document.getElementById('app');
const store={get(){try{return JSON.parse(localStorage.getItem('xlx.done')||'[]')}catch(e){return[]}},set(a){try{localStorage.setItem('xlx.done',JSON.stringify(a))}catch(e){}}};
let done=new Set(store.get().filter(id=>L[id]));
let LAB=null,VIEW='home';
const score=()=>ORDER.reduce((p,id)=>p+(done.has(id)?(L[id].pts||0):0),0);
const typeScore=S=>S.ids.reduce((p,id)=>p+(done.has(id)?(L[id].pts||0):0),0);
function updateMeter(){const sc=score();document.getElementById('count').textContent=`${sc}점`;document.getElementById('bar').style.width=sc+'%'}
const nextId=()=>ORDER.find(id=>!done.has(id))||ORDER[0];
const progOf=id=>{try{const o=JSON.parse(localStorage.getItem('xlx.lab.'+id)||'null');return o&&!o.finished&&o.i>0?o.i:0}catch(e){return 0}};
function route(id){try{if(location.hash.slice(1)!==id)history.replaceState(null,'','#'+id)}catch(e){}}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function leave(){if(LAB&&LAB.flush)LAB.flush();LAB=null}
const pilRead=()=>{try{return new Set(JSON.parse(localStorage.getItem('xlx.pil')||'[]'))}catch(e){return new Set()}};

function renderHome(toCourse){
  leave();VIEW='home';route('home');
  const nx=nextId(),n=L[nx],sc=score(),finished=ORDER.every(id=>done.has(id));
  const big=ORDER.filter(id=>!done.has(id)&&L[id].pts).sort((a,b)=>L[b].pts-L[a].pts||ORDER.indexOf(a)-ORDER.indexOf(b)).slice(0,3);
  const words='기본작업 / 계산작업 / 분석작업 / 기타작업 / DSUM / VLOOKUP / HLOOKUP / RANK.EQ / 고급 필터 / 부분합 / 목표값 찾기 / 시나리오 / 매크로 / 차트 / ';
  const stages=STAGES.map((S,si)=>{const ids=S.ids.filter(id=>L[id]),dn=ids.filter(id=>done.has(id)).length,stt=dn===ids.length?'완료':dn?'진행 중':'시작 전';
    return `<details class="stage"${si===n.stage?' open':''}><summary class="gut"><span class="s-no">${String(si).padStart(2,'0')}</span><span class="s-name">${S.name}</span><span class="s-meta">${S.max?`실기 ${S.max}점 · `:''}미션 ${ids.length}개</span><span class="s-bar"><b style="width:${dn/ids.length*100}%"></b></span><span class="s-st">${stt}</span><span class="s-x" aria-hidden="true">+</span></summary>
    <div class="lessons gut">${ids.map(id=>{const les=L[id],d=done.has(id),up=id===nx&&!d,pg=d?0:progOf(id);return `<button type="button" class="ls ${d?'done':''} ${up?'up':''} ${pg?'prog':''}" data-id="${id}"><span class="c">${codeOf(id)}</span><span class="t">${les.title}${les.pts?`<small>${les.pts}점</small>`:''}</span><span class="d">${les.topic}</span><span class="s">${d?'완료':pg?`진행 ${pg}/${les.tasks.length}`:up?'다음':'시작'}</span><span class="a" aria-hidden="true">→</span></button>`}).join('')}</div></details>`}).join('');
  const tb=STAGES.filter(S=>S.max).map(S=>{const v=typeScore(S);return `<div class="tbar"><span>${S.name}</span><u><b style="width:${v/S.max*100}%"></b></u><em>${v} / ${S.max}</em></div>`}).join('');
  app.innerHTML=`<section class="hero gut">
    <div class="h-meta"><span>컴퓨터활용능력 2급 실기 대비</span><span>미션 ${TOTAL}개 · 필기 요약 ${PIL.length}장</span><span>시험지 대신 짧은 미션으로</span></div>
    <div class="h-mid">
      <div class="badge"><b>${sc}</b><span>예상 실기<br>점수</span></div>
      <div class="h-flow">유형 → 지시문 → 바로 풀기<span>시험에 나오는 작업을 3~5분짜리 미션으로 나눴어요. 시간 제한은 없어요.</span></div>
      <div class="h-pitch"><p>미션을 끝낼 때마다 예상 점수가 올라가요. 70점 합격선을 넘을 때까지 약한 유형부터 채우세요.</p><button class="cta" type="button" id="heroGo">${done.size?'이어서 풀기':'첫 미션 시작'} <i>→</i></button></div>
    </div>
    <h1 class="mega sm">엑셀훈련소 실전</h1>
  </section>
  <div class="tick" aria-hidden="true"><div>${words.repeat(3)}</div><div>${words.repeat(3)}</div></div>
  <section class="board">
    <div class="next"><div class="next-tag">${finished?'복습':'다음 미션'}</div><div class="next-in">
      <div class="next-copy"><small>${codeOf(nx)} · ${stageOf(nx).name}${n.pts?` · ${n.pts}점 분량`:''}</small><h2>${n.topic}</h2><p>${n.goal}</p><button class="cta" type="button" id="nextGo">미션 시작 · 실습 ${n.tasks.length}개 <i>→</i></button></div>
      <div><div class="pv-cap">시험에서는 이렇게 나와요</div><div class="exam-inv">${n.exam}</div></div>
    </div></div>
    <div class="stat gut"><h2>예상 점수 ${sc}점</h2>
      <div class="goalbar" role="img" aria-label="예상 점수 ${sc}점, 합격선 70점"><b style="width:${sc}%"></b><i></i><span>70</span></div>
      <div>${tb}</div>
      ${big.length?`<div class="big3"><b class="sm">점수가 큰 미션</b>${big.map(id=>`<button type="button" data-id="${id}"><span>${L[id].title}</span><span class="pts">+${L[id].pts}점</span></button>`).join('')}</div>`:''}
      <p class="hint">끝낸 미션의 배점을 더한 추정치예요. 실제 점수는 시험장에서 실수 없이 푸느냐에 달려 있어요.</p>
    </div>
  </section>
  <section class="course" id="course">
    <div class="c-head gut"><h2>실기 미션</h2><p>순서대로 풀어도 되고, 약한 유형부터 골라도 돼요. 풀던 시트는 이 브라우저에 자동으로 저장돼요.</p></div>
    <div class="stages">${stages}</div>
  </section>
  <section class="gut pil-cta"><div><h2 class="s-name">필기 요약 ${PIL.length}장</h2><p>1과목은 쉬운 내용이 많아서 읽고 한 문제만 풀면 돼요. 점수는 기록하지 않아요.</p></div><button class="cta" type="button" id="pilGo">필기 요약 보기 <i>→</i></button></section>`;
  applyKeys(app);
  if(toCourse)document.getElementById('course').scrollIntoView();else window.scrollTo(0,0);
  document.getElementById('heroGo').onclick=()=>open(nx);document.getElementById('nextGo').onclick=()=>open(nx);document.getElementById('pilGo').onclick=renderPil;
  app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(b.dataset.id));
}

function renderPil(){
  leave();VIEW='pil';route('pil');
  const rd=pilRead();
  const card=p=>`<details class="pc ${rd.has(p.id)?'read':''}" data-p="${p.id}"><summary><span>${p.title}</span><small>${rd.has(p.id)?'읽음':'핵심 '+p.points.length+'개'}</small></summary><div class="pc-b"><ul>${p.points.map(x=>`<li>${x}</li>`).join('')}</ul><div class="quiz"><p>${p.q[0]}</p><div class="opts">${p.q[1].map((o,i)=>`<button type="button" data-i="${i}">${i+1}. ${o}</button>`).join('')}</div><p class="exp" hidden></p></div></div></details>`;
  app.innerHTML=`<section class="pil gut">
    <div class="pil-head"><p class="eyebrow">필기 요약</p><h1>읽고 한 문제만</h1><p>필기는 과목마다 40점 이상, 평균 60점 이상이면 합격이에요. 필기에 붙어야 실기를 볼 수 있으니 1과목도 버리지 마세요. 카드를 열어 핵심을 읽고 아래 한 문제를 풀어 보세요. 맞혀도 틀려도 기록되지 않아요.</p></div>
    <h2>1과목 컴퓨터 일반</h2><div class="pgrid">${PIL.filter(p=>p.sub===1).map(card).join('')}</div>
    <h2>2과목 스프레드시트 일반</h2><p class="hint">2과목은 실기 미션과 겹치는 내용이 많아요. 실기를 풀면서 같이 익혀져요.</p><div class="pgrid">${PIL.filter(p=>p.sub===2).map(card).join('')}</div>
    <div class="pil-cta"><p>필기 내용은 기출 문제집으로 한 번 더 확인하세요. 실기 미션으로 돌아가려면 아래를 누르세요.</p><button class="cta" type="button" id="toCourse2">실기 미션으로 <i>→</i></button></div>
  </section>`;
  window.scrollTo(0,0);
  document.getElementById('toCourse2').onclick=()=>renderHome(true);
  app.querySelectorAll('.pc').forEach(d=>d.addEventListener('toggle',()=>{if(!d.open)return;const s=pilRead();s.add(d.dataset.p);try{localStorage.setItem('xlx.pil',JSON.stringify([...s]))}catch(e){}d.classList.add('read');d.querySelector('summary small').textContent='읽음'}));
  app.querySelectorAll('.quiz').forEach(qz=>{const p=PIL.find(x=>x.id===qz.closest('.pc').dataset.p);qz.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;qz.querySelectorAll('[data-i]').forEach(x=>x.classList.remove('ok','no'));b.classList.add(i===p.q[2]?'ok':'no');if(i!==p.q[2])qz.querySelector(`[data-i="${p.q[2]}"]`).classList.add('ok');const e=qz.querySelector('.exp');e.hidden=false;e.textContent=(i===p.q[2]?'맞았어요. ':'정답은 '+(p.q[2]+1)+'번이에요. ')+p.q[3]})});
}

function open(id){
  const les=L[id];if(!les)return renderHome();
  leave();VIEW='lesson';route(id);
  const idx=ORDER.indexOf(id),prev=ORDER[idx-1],next=ORDER[idx+1],S=stageOf(id);
  const hasKeys=/class="kk"|Ctrl/.test(les.how+les.tasks.map(t=>t.text+t.hint).join(''));
  app.innerHTML=`<div class="lesson">
   <article class="read">
    <div class="head"><div class="coord">${codeOf(id)}</div><div><p class="eyebrow">${S.name}${les.pts?` · ${les.pts}점 분량`:''} · ${les.title}</p><h1>${les.topic}</h1></div></div>
    ${hasKeys?'<p class="mac-note">맥 키보드 기준으로 표시합니다. Enter는 return 키이고, 맥북의 F키는 fn과 함께 누르세요. 실제 시험장은 윈도우 PC예요.</p>':''}
    ${secBox('1','이번 미션',`<p>${les.goal}</p>`)}
    ${secBox('2','시험에서는 이렇게 나와요',`<div class="exam">${les.exam}</div>`)}
    <section class="sec how"><header><span>3</span><h2>푸는 순서</h2></header><div class="sec-b">${les.how}</div></section>
    ${secBox('4','감점 포인트',`<ul>${les.traps.map(x=>`<li>${x}</li>`).join('')}</ul>`)}
    <div class="nav"><button class="btn" id="prev" type="button" ${prev?'':'disabled'}>이전 미션</button><button class="btn" id="next" type="button" ${next?'':'disabled'}>다음 미션</button></div>
   </article>
   <section class="lab" aria-label="실습"><div id="task"></div><div id="sheet" style="display:contents"></div></section>
  </div>`;
  window.scrollTo(0,0);
  document.getElementById('prev').onclick=()=>open(prev);document.getElementById('next').onclick=()=>open(next);
  const taskEl=document.getElementById('task');
  const lab={id,i:0,hint:false,answer:false,fb:'',sheet:null,finished:false};LAB=lab;
  const cur=()=>les.tasks[Math.min(lab.i,les.tasks.length-1)];
  let startAt=Date.now();
  const SK='xlx.lab.'+id,sig=les.sheet.data.length+':'+les.tasks.length+':1';
  let saveT=null;
  const saveNow=()=>{clearTimeout(saveT);saveT=null;if(!lab.sheet)return;try{localStorage.setItem(SK,JSON.stringify({sig,i:lab.i,finished:lab.finished,sheet:lab.sheet.dump()}))}catch(e){}};
  const schedule=()=>{if(LAB!==lab)return;clearTimeout(saveT);saveT=setTimeout(saveNow,400)};
  lab.flush=()=>{if(saveT)saveNow()};
  const clockText=()=>{const left=Math.max(0,les.timer*60-Math.floor((Date.now()-startAt)/1000));return `남은 시간 ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`};
  if(les.timer){const tm=setInterval(()=>{if(LAB!==lab||lab.finished){clearInterval(tm);return}const c=document.getElementById('clock');if(c)c.textContent=clockText()},1000)}
  function draw(){
    if(lab.finished){
      const nx=ORDER[idx+1];
      taskEl.innerHTML=`<div class="task donebox"><h2>미션 완료${les.pts?` · +${les.pts}점`:''}</h2><ul>${les.recap.map(x=>`<li>${x}</li>`).join('')}</ul><div class="task-act">${nx?`<button class="btn main" id="go" type="button">다음: ${L[nx].title}</button>`:`<button class="btn main" id="go" type="button">미션 목록으로</button>`}<button class="btn" id="again" type="button">처음부터 다시</button></div></div>`;
      document.getElementById('go').onclick=()=>nx?open(nx):renderHome(true);
      document.getElementById('again').onclick=reset;
      applyKeys(taskEl);
      return;
    }
    const t=cur();
    taskEl.innerHTML=`<div class="task"><div class="task-top"><span>실습 ${lab.i+1} / ${les.tasks.length}</span><span class="dots">${les.tasks.map((_,k)=>`<span class="${k<lab.i?'d':k===lab.i?'c':''}"></span>`).join('')}</span>${les.timer?`<span class="clock" id="clock">${clockText()}</span>`:''}</div>
     <div class="task-text">${t.text}</div>
     <div class="fb ${lab.fbOk?'ok':''} ${lab.fb?'':'blank'}" role="status">${lab.fb||'작업하면 바로 채점됩니다.'}</div>
     ${lab.hint?`<div class="reveal">${t.hint}</div>`:''}
     ${lab.answer?`<div class="reveal">정답: <code>${esc(t.spec.ans)}</code></div>`:''}
     <div class="task-act"><button class="btn" id="h" type="button">힌트</button><button class="btn" id="a" type="button">정답 보기</button><button class="btn" id="rs" type="button">시트 초기화</button></div></div>`;
    for(const[b,fn]of[['h',()=>{lab.hint=true;draw()}],['a',()=>{lab.answer=true;draw()}],['rs',reset]]){const n=document.getElementById(b);n.addEventListener('pointerdown',e=>e.preventDefault());n.onclick=fn}
    applyKeys(taskEl);
  }
  function mark(){if(lab.sheet)lab.sheet.setMark(lab.finished?null:cur().spec.mark)}
  let checking=false;
  function check(){
    if(!lab.sheet||lab.finished||checking)return;checking=true;
    let adv=false;
    try{
      const r=cur().spec.bad(lab.sheet);
      if(r!==null){const f=r||'';if(lab.stick&&!f){lab.stick=false}else if(f?(f!==lab.fb||lab.fbOk):(lab.fb&&!lab.fbOk)){lab.fb=f;lab.fbOk=false;lab.stick=false;draw()}}
      else{adv=true;lab.i++;lab.hint=false;lab.answer=false;lab.fb='좋아요, 맞았어요.';lab.fbOk=true;
        if(lab.i>=les.tasks.length){lab.finished=true;done.add(id);store.set([...done]);updateMeter()}}
    }catch(e){}
    if(adv){draw();mark();schedule()}
    checking=false;
  }
  function reset(){try{localStorage.removeItem(SK)}catch(e){}lab.i=0;lab.finished=false;lab.hint=false;lab.answer=false;lab.fb='';lab.fbOk=false;startAt=Date.now();lab.sheet.seed();draw();mark();lab.sheet.focus()}
  draw();
  lab.sheet=createSheet(document.getElementById('sheet'),les.sheet,{change:()=>{check();schedule()},flush:()=>saveNow(),msg:m=>{lab.fb=m;lab.fbOk=false;lab.stick=true;draw()}});
  try{const o=JSON.parse(localStorage.getItem(SK)||'null');if(o&&o.sig===sig&&o.sheet&&lab.sheet.load(o.sheet)){lab.i=Math.max(0,Math.min(o.i||0,les.tasks.length));lab.finished=!!o.finished||lab.i>=les.tasks.length;if(!lab.finished){lab.fb='저장된 곳부터 이어서 풀어요.';lab.fbOk=true}draw()}}catch(e){}
  mark();
  LAB.check=check;
  check();
  applyCurrentKeys();
}
function applyCurrentKeys(){if(VIEW==='pil')return;for(const r of LAB?[...document.querySelectorAll('.read,#task,.xbar,#rib')]:[document.getElementById('app')])applyKeys(r)}
function setOS(o,save){
  OS=o;document.documentElement.dataset.os=o;
  document.querySelectorAll('#osPick button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.os===o)));
  if(save)try{localStorage.setItem('xl8w.os',o)}catch(e){}
  applyCurrentKeys();
}
document.querySelectorAll('#osPick button').forEach(b=>{b.addEventListener('pointerdown',e=>e.preventDefault());b.onclick=()=>{setOS(b.dataset.os,true);if(LAB&&LAB.sheet)LAB.sheet.focus()}});
setOS(OS);
document.getElementById('brand').onclick=()=>renderHome();
document.getElementById('tohome').onclick=()=>renderHome();
document.getElementById('tocourse').onclick=()=>renderHome(true);
document.getElementById('topil').onclick=()=>renderPil();
document.getElementById('resume').onclick=()=>open(nextId());
window.addEventListener('pagehide',()=>{if(LAB&&LAB.flush)LAB.flush()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&LAB&&LAB.flush)LAB.flush()});
updateMeter();
function boot(){const h=location.hash.slice(1);if(L[h])open(h);else if(h==='pil')renderPil();else renderHome()}
window.addEventListener('hashchange',boot);
boot();
</script>
