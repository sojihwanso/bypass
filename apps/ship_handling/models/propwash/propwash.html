    // 정지를 누르면 다음 조작까지 자동 투어를 다시 켜지 않는다
    if (target === 0) { run(); return; }
    idleTimer = setTimeout(() => { touring = !still.matches; clock = 0; run(); }, 12000);
    run();
  }
}
rpmIn.addEventListener("input", () => setTarget(Number(rpmIn.value)));
document.querySelectorAll("[data-rpm]").forEach((b) => b.addEventListener("click", () => setTarget(Number(b.dataset.rpm))));
document.querySelectorAll("[data-level]").forEach((b) => b.addEventListener("click", () => {
  level = b.dataset.level;
  document.querySelectorAll("[data-level]").forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
  if (svgEl) svgEl.dataset.level = level;
  run(); redraw();
}));
new IntersectionObserver((en) => { visible = en[en.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
if (still.matches) touring = false;
startViewer();
if (still.matches) run();

</script></body></html>
