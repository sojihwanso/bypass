</div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>내연기관(디젤): 크랭크 → 커넥팅 로드 → 크로스헤드 → 피스톤. 외연기관(증기 터빈): 증기 → 고압·저압 터빈 → 감속 기어 → 프로펠러</span><span class="iso-key"><svg class="iso-swatch" data-mark="dotted" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>공기: 과급기 압축기 → 공기 냉각기 → 소기 집합관 → 소기구. 배기: 배기 밸브 → 배기 집합관 → 과급기 터빈 → 굴뚝. 화살촉이 흐르는 방향, 밝은 점이 실린더마다 나가는 배기</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>실린더 단면의 색: 파랑 차가운 공기 → 주황 불꽃. 아래 원형도의 번호 점이 실린더마다 지금 크랭크각</span></span><span class="iso-caption">실험용 절개 모형이다. 크랭크 한 바퀴에 실린더마다 한 번 폭발하는 2행정 사이클이고, 4기통이라 크랭크를 90° 간격으로 두어 90°마다 한 실린더가 폭발한다(점화 순서 1-4-3-2는 가정값). 시기와 압력은 선박 조종 앱 5-1 장면과 같은 가정값(배기 밸브 110~250°, 소기구 140~220°, 연료 분사 −4~18°, 압축비 18)이다. 화면은 실제보다 12배 느리게 돌고, Critical RPM 띠(52~62 rpm)는 가정값이다. 후진을 누르면 연료를 끊어 회전을 줄이고, 멈추면 캠을 바꿔 시동 공기로 반대 방향으로 돌린 뒤 연료를 분사한다(전환 시간은 줄여 보였다). 프로펠러는 크랭크축과 같은 회전수로 돈다. 증기 터빈은 대표값(주증기 6 MPa·515 °C, 복수기 진공 722 mmHg, HP 약 6,000 rpm, LP 약 4,000 rpm, 프로펠러 85 rpm, 후진 출력 약 40%)이고, 감속 기어 크기는 단순화했다. 후진을 누르면 전진 밸브를 닫아 로터가 관성으로 천천히 줄어든 뒤 후진 밸브를 열어 저압 터빈 끝의 후진 날개로 거꾸로 돌린다.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
