<svg class="pv-chart" id="pv-chart" viewBox="0 0 520 170" role="img" aria-label="타각에 따른 직압력 계수: 모델 곡선은 35° 근처에서 가장 크고 그 뒤 줄어든다. Beaufoy 식은 계속 오른다"></svg></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>타: 타각만큼 돌고, 위쪽 틸러 바늘이 눈금판에서 타각을 읽는다</span><span class="iso-key"><svg class="iso-swatch" data-mark="dotted" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>염료 흐름선: 대시가 빨리 움직일수록 빠른 흐름. 실속하면 흡입면 뒤에 소용돌이</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>타 윗면 막대: 빨강 압력면(느림·고압) · 파랑 흡입면(빠름·저압). 화살표: 빨강 직압력 N · 파랑 양력 L · 노랑 항력 D</span></span><span class="iso-caption">실험용 모형이다. 직압력은 선박 조종 앱 3-2와 같은 모델 값(대상선 타 면적 70 m², 직압력 계수가 35° 근처에서 가장 크고 그 뒤 실속으로 줄어듦)으로 계산하고, 압력 중심은 Joessel 식을 따른다. 흐름선과 압력 막대는 날개 둘레의 이상 흐름으로 그린 그림이고, 실속 때의 박리와 소용돌이는 모양만 흉내 냈다. 수치의 크기는 실선 기준이지만 한계각은 타의 모양, 종횡비, 배출류에 따라 다르다.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {

  fin: (x, y, z) => z > FIN.z0 && z < FIN.z1 + 20 && Math.abs(y) < (z > FIN.z1 ? (x > 56 && x < 70 ? 2.6 : -1) : finHalf(x)),
  rud: (x, y, z) => z > RUD_Z0 && z < RUD_Z1 && x * x + y * y < 1600 && inPoly(x, y, RPOLY),

function slotOf(x, y, z) {

    const qx = x + VDIR[0] * t, qy = y + VDIR[1] * t, qz = z + VDIR[2] * t;
    for (let i = 0; i < best; i++) if (BODY[ORD[i]](qx, qy, qz)) { best = i; break; }

// ── 흐름선: 타각이 바뀔 때만 다시 적분 ─────────────────────────────────
function rebuildFlow() {
  flowDeg = deg; sideS = suctionSide(deg) || 1;
  RPOLY = foilWorld(deg, 40);
  const st = forces(deg, kn).stall;
  LINES = SEEDS.map((y0) => {
    const pts = streamline(y0, deg);
    return pts.map(([x, y]) => ({ x, y, wake: inWake(x, y, deg, st, sideS), slot: slotOf(x, y, FLOW_Z) }));

}
function onBind(svg, key) {
  const c = CAMS[key];
  PV = { origin: c.o, scale: c.s, azimuth: c.a, elevation: c.e };
  ORD = c.ord;
  const a = (c.a * Math.PI) / 180, e = (c.e * Math.PI) / 180;
  VDIR = [Math.cos(a) * Math.cos(e), Math.sin(a) * Math.cos(e), Math.sin(e)];
  const q = (s) => svg.querySelector(s);
  el = {
    rudder: q("[data-rudder]"), blades: q('[data-part="blades"]'), tiller: q('[data-part="tiller"]'), speed: q('[data-part="speed"]'), tacho: q('[data-part="tacho"]'),
    slots: [...svg.querySelectorAll("[data-slot]")].map((g) => ({ stream: g.querySelector(".pv-stream"), guide: g.querySelector(".pv-guide"), vort: g.querySelector(".pv-vort") })),
    press: { hi: q('[data-p="hi"]'), lo: q('[data-p="lo"]') }, aoa: q(".pv-aoa"), chord: q(".pv-chord"), cp: q(".pv-cp"),
    ov: q("[data-overlay]"),
    force: { N: q('[data-f="N"]'), L: q('[data-f="L"]'), D: q('[data-f="D"]') },
  };
  RPOLY = foilWorld(deg, 40);
  drawnDeg = null; flowDeg = null;
}

// ── 타: 회전한 날개 단면을 다시 밀어 올린다 ─────────────────────────────
function rudderSvg(d) {
  const ring = foilWorld(d, 40);
  // 거의 바로 위에서 볼 때는 옆면 이음선이 한 줄로 몰려 빗금처럼 보이므로 뺀다
  const seams = PV.elevation > 80 ? "" : [40, 60, 80].map((z) => lineSvg(ringSeam(ring, z, PV), { tone: "faint" })).join("");
  return solidSvg(extrude(ring, RUD_Z0, RUD_Z1 - RUD_Z0, PV, { convex: true, bevel: 0.4 }), { tone: "mid", inner: seams, className: "pv-c-rudder" });
}
// 수평면(z)의 화살표: 줄기 + 채운 머리
function arrow(from, dir, len, z) {
  if (len < 0.6) return "";
  const [dx, dy] = dir, nx = -dy, ny = dx, h = Math.min(3, len * 0.4), w = h * 0.5;
  const tip = [from[0] + dx * len, from[1] + dy * len], b = [tip[0] - dx * h, tip[1] - dy * h];
  return "M" + pt([from[0], from[1], z]) + "L" + pt([b[0], b[1], z]) + "M" + pt([tip[0], tip[1], z]) + "L" + pt([b[0] + nx * w, b[1] + ny * w, z]) + "L" + pt([b[0] - nx * w, b[1] - ny * w, z]) + "Z";
}
// 압력 막대: 타 윗면 높이에서, 날개 둘레 이상 흐름의 압력 계수 Cp = 1 − (v/U)²
const STATIONS = [0.07, 0.15, 0.24, 0.34, 0.45, 0.56, 0.67, 0.78, 0.89];
function pressureBars(d, scale, st) {
  const ax = axesOf(d), out = { hi: "", lo: "" }, n = 160, ring = [];
  for (let i = 0; i < n; i++) { const th = (i / n) * 2 * Math.PI, z = mapZ([ZC + R0 * Math.cos(th), R0 * Math.sin(th)]), zo = mapZ([ZC + R0 * 1.06 * Math.cos(th), R0 * 1.06 * Math.sin(th)]); ring.push({ X: z[0] - X_PIV, Y: z[1], Xo: zo[0] - X_PIV, Yo: zo[1] }); }
  for (const sgn of [1, -1]) for (const s of STATIONS) {
    const X = X_LE - X_PIV + s * CHORD;
    let best = null, bd = 1e9;
    for (const r of ring) if (Math.sign(r.Y) === sgn) { const dd = Math.abs(r.X - X); if (dd < bd) { bd = dd; best = r; } }
    if (!best) continue;
    const w = toWorld([best.X, best.Y], ax), wo = toWorld([best.Xo, best.Yo], ax);
    const v = velocity(wo[0], wo[1], d);
    if (!v) continue;
    let cp = Math.max(-2.4, Math.min(1, 1 - (v[0] * v[0] + v[1] * v[1])));
    if (sgn === sideS && cp < 0 && st > 0 && s > 0.62 - 0.4 * st) cp *= 1 - 0.85 * Math.min(1, st * 1.4);
    let nx = wo[0] - w[0], ny = wo[1] - w[1]; const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
    const len = Math.min(20, 7 * Math.abs(cp) * scale);
    if (len < 0.5) continue;
    const base = [w[0] + nx * 0.8, w[1] + ny * 0.8];
    if (cp > 0) out.hi += arrow([base[0] + nx * len, base[1] + ny * len], [-nx, -ny], len, CAP_Z);
    else out.lo += arrow(base, [nx, ny], len, CAP_Z);
  }
  return out;
}
function vortexPaths(d, st) {
  if (st <= 0) return [];
  const ax = axesOf(d), out = [], count = 4, span = 70;
  for (let i = 0; i < count; i++) {
    const f = ((flowT * 0.35 + i * span / count) % span) / span;              // 0..1 along the wake
    const X = X_LE - X_PIV + (0.62 - 0.4 * st) * CHORD + f * (CHORD * 0.6 + 40);
    const Y = sideS * (5 + 13 * st * Math.min(1, f * 1.6));
    const [cx, cy] = toWorld([X, Y], ax), r = (2.2 + 3.4 * Math.sin(Math.PI * Math.min(1, f + 0.1))) * Math.min(1, st * 2);
    let d2 = "";
    for (let j = 0; j <= 22; j++) { const a = -sideS * (flowT * 2.4 + i) + (j / 22) * Math.PI * 3.2, rr = r * (0.25 + 0.75 * j / 22); d2 += (j ? "L" : "M") + pt([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, FLOW_Z]); }
    out.push({ d: d2, slot: slotOf(cx, cy, FLOW_Z), o: Math.sin(Math.PI * f) });

}
function redraw() {
  if (!PV) return;
  const F = forces(deg, kn), scale = (kn / 12) ** 2;
  if (drawnDeg === null || Math.abs(deg - drawnDeg) > 0.05) {
    drawnDeg = deg;
    el.rudder.innerHTML = rudderSvg(deg);
    el.tiller.setAttribute("transform", "rotate(" + (-deg).toFixed(2) + ")");
  }
  if (flowDeg === null || Math.abs(deg - flowDeg) > 0.3 || (deg === target && deg !== flowDeg)) rebuildFlow();
  // 흐름선: 같은 시간 간격 점이라 인덱스를 고르게 옮기면 빠른 곳의 대시가 빨리 간다
  const dash = {}, guide = {};

  for (const L of LINES) {
    let prev = null;
    L.forEach((p, i) => {
      if (p.wake) { prev = null; return; }
      guide[p.slot] = (guide[p.slot] || "") + (prev === p.slot ? "L" : "M") + pt([p.x, p.y, FLOW_Z]);
      prev = p.slot;
    });
    // 대시 끝은 표본 사이를 보간해 매 프레임 조금씩 미끄러지게 한다(정수 표본에 붙으면 초당 몇 번만 뛴다)
    const lerp = (u) => { const i = Math.floor(u), f = u - i, p = L[i], q = L[Math.min(L.length - 1, i + 1)]; return [p.x + (q.x - p.x) * f, p.y + (q.y - p.y) * f]; };

      const sl = L[Math.round(s + len / 2)].slot;

      dash[sl] = (dash[sl] || "") + "M" + [lerp(s), ...mid, lerp(s + len)].map(([x, y]) => pt([x, y, FLOW_Z])).join("L");

    S.guide.setAttribute("d", guide[i] || "");

  });

  el.press.hi.setAttribute("d", bars.hi); el.press.lo.setAttribute("d", bars.lo);
  const ax = axesOf(deg), le = toWorld([X_LE - X_PIV, 0], ax), te = toWorld([X_TE - X_PIV, 0], ax);
  el.chord.setAttribute("d", deg < 0.3 ? "" : "M" + pt([le[0] - ax.e1[0] * 14, le[1] - ax.e1[1] * 14, CAP_Z]) + "L" + pt([te[0], te[1], CAP_Z]) + "M" + pt([le[0], le[1], CAP_Z]) + "L" + pt([le[0] + 22, le[1], CAP_Z]));
  let arc = "";
  if (deg > 0.8) { const R = 18; for (let j = 0; j <= 16; j++) { const a = (j / 16) * deg * DEG; arc += (j ? "L" : "M") + pt([le[0] + R * Math.cos(a), le[1] - R * Math.sin(a), CAP_Z]); } }
  el.aoa.setAttribute("d", arc);
  const cpP = toWorld([X_LE - X_PIV + F.xcp * CHORD, 0], ax), nDir = [ax.e2[0] * sideS, ax.e2[1] * sideS];
  const Nlen = Math.min(70, (44 * F.N) / NREF);
  el.force.N.setAttribute("d", arrow(cpP, nDir, Nlen, CAP_Z + 0.4));
  el.force.L.setAttribute("d", arrow(cpP, [0, Math.sign(nDir[1]) || -1], Nlen * Math.cos(deg * DEG), CAP_Z + 0.2));
  el.force.D.setAttribute("d", arrow(cpP, [-1, 0], Nlen * Math.sin(deg * DEG), CAP_Z + 0.2));
  const c0 = P3([cpP[0], cpP[1], CAP_Z + 0.4]);
  el.cp.setAttribute("cx", f1(c0[0])); el.cp.setAttribute("cy", f1(c0[1])); el.cp.setAttribute("r", deg < 0.3 ? 0 : 1.2);
  // 상태 색(붙음·한계·실속)은 모서리 타각계와 계수 곡선 점에 쓴다
  const stt = stateOf(deg);
  el.ov.dataset.state = stt; gauge.root.dataset.state = stt; chartEl.dataset.state = stt;
  gauge.set(deg, stt);
  // 다이얼·프로펠러
  const rpm = 5 * kn;
  el.blades.setAttribute("transform", "rotate(" + angle.toFixed(2) + ")");
  el.speed.setAttribute("transform", "rotate(" + (-225 + (kn / 20) * 270).toFixed(1) + ")");
  el.tacho.setAttribute("transform", "rotate(" + (-225 + (rpm / 120) * 270).toFixed(1) + ")");
  // 판독
  const state = deg > 37 ? "실속 · 흐름 박리" : deg > 31 ? "한계 타각 근처" : deg > 0.5 ? "흐름이 붙어 있음" : "타 중앙";
  const text = "타각 " + deg.toFixed(0) + "° · 유속 " + kn + " kn · 직압력 " + F.N.toFixed(0) + " tf · " + state;
  if (readout.textContent !== text) readout.textContent = text;
  degOut.textContent = deg.toFixed(0) + "°";
  if (document.activeElement !== degIn && Number(degIn.value) !== Math.round(target)) degIn.value = String(Math.round(target));
  const vals = '<span>직압력 N <b class="n">' + F.N.toFixed(0) + ' tf</b></span><span>양력 L = N·cosδ <b class="l">' + F.L.toFixed(0) + ' tf</b></span><span>항력 D = N·sinδ <b class="d">' + F.D.toFixed(0) + ' tf</b></span><span>Beaufoy 식 <b>' + F.NB.toFixed(0) + ' tf</b></span><span>압력 중심 <b>앞날에서 ' + Math.round(F.xcp * 100) + '%</b></span>';
  if (valsEl.innerHTML !== vals) valsEl.innerHTML = vals;

}
// ── 계수 곡선 ─────────────────────────────────────────────────────────────
const CH = { x0: 46, x1: 500, y0: 140, y1: 18 };
const cx = (d) => CH.x0 + (d / 45) * (CH.x1 - CH.x0), cy = (v) => CH.y0 + (v / 1.2) * (CH.y1 - CH.y0);
function drawChart() {
  let model = "", beau = "";
  for (let d = 0; d <= 45; d += 0.5) { model += (d ? "L" : "M") + cx(d).toFixed(1) + " " + cy(cnModel(d)).toFixed(1); beau += (d ? "L" : "M") + cx(d).toFixed(1) + " " + cy(1.125 * Math.sin(d * DEG)).toFixed(1); }
  const xt = [0, 15, 35, 45].map((d) => '<text x="' + cx(d) + '" y="' + (CH.y0 + 14) + '" text-anchor="middle">' + d + '°</text>').join("");
  const yt = [0, 0.5, 1].map((v) => '<path class="grid" d="M' + CH.x0 + " " + cy(v) + "H" + CH.x1 + '"/><text x="' + (CH.x0 - 6) + '" y="' + (cy(v) + 3) + '" text-anchor="end">' + v + "</text>").join("");
  chartEl.innerHTML = '<rect class="stall" x="' + cx(STALL) + '" y="' + CH.y1 + '" width="' + (cx(45) - cx(STALL)) + '" height="' + (CH.y0 - CH.y1) + '"/>' + yt + '<path class="ax" d="M' + CH.x0 + " " + CH.y1 + "V" + CH.y0 + "H" + CH.x1 + '"/>' + xt +
    '<path class="beau" d="' + beau + '"/><path class="model" d="' + model + '"/><text x="' + (CH.x0 + 6) + '" y="' + (CH.y1 + 4) + '">직압력 계수</text><text x="' + (cx(STALL) + 4) + '" y="' + (CH.y1 + 12) + '">실속</text>' +
    '<text x="' + (CH.x1 - 2) + '" y="' + (cy(1.125 * Math.sin(45 * DEG)) - 6) + '" text-anchor="end">Beaufoy 식</text><text x="' + cx(28) + '" y="' + (cy(cnModel(28)) - 8) + '" text-anchor="middle">모델</text><circle class="mark" r="4"/>';
}
function chartMark() { const m = chartEl.querySelector(".mark"); if (m) { m.setAttribute("cx", cx(deg).toFixed(1)); m.setAttribute("cy", cy(cnModel(deg)).toFixed(1)); } }

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now; clock += dt; flowT += dt * 6;
  if (touring) { let t = clock % TOUR_LEN; for (const [v, len] of TOUR) { if (t < len) { setTarget(v, true); break; } t -= len; } }
  const step = SLEW * dt;
  deg = Math.abs(target - deg) <= step ? target : deg + Math.sign(target - deg) * step;
  angle = (angle + ((5 * kn) / 60) * 360 * dt) % 360;
  redraw();
  frame = visible && !paused ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (still.matches || paused) { deg = target; redraw(); return; } if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
function setTarget(v, fromTour) {
  target = Math.max(0, Math.min(45, v));
  document.querySelectorAll("[data-deg]").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.deg) === Math.round(target))));
  if (!fromTour) {
    touring = false;
    clearTimeout(idleTimer);
    // 타 중앙을 고르면 다음 조작까지 자동 시연을 다시 켜지 않는다
    if (target !== 0 && !paused) idleTimer = setTimeout(() => { touring = !still.matches; clock = 0; run(); }, 12000);
    run();
  }
}
const userTouch = () => { if (touring || idleTimer) { touring = false; clearTimeout(idleTimer); if (target !== 0) idleTimer = setTimeout(() => { touring = !still.matches; clock = 0; run(); }, 12000); } };
// 정지: 타·흐름·프로펠러를 그 자리에 멈춘다. 멈춘 동안 고른 타각은 바로 그린다
const pauseBtn = document.querySelector("#pv-pause");
pauseBtn.addEventListener("click", () => {
  paused = !paused;
  pauseBtn.setAttribute("aria-pressed", String(paused));
  pauseBtn.textContent = paused ? "▶ 재생" : "⏸ 정지";
  touring = false; clearTimeout(idleTimer); idleTimer = 0;
  if (paused) { cancelAnimationFrame(frame); frame = 0; target = deg; } else run();
});
degIn.addEventListener("input", () => setTarget(Number(degIn.value)));
document.querySelectorAll("[data-deg]").forEach((b) => b.addEventListener("click", () => setTarget(Number(b.dataset.deg))));
knIn.addEventListener("input", () => { kn = Number(knIn.value); knOut.textContent = kn + " kn"; flowDeg = null; userTouch(); run(); redraw(); });
new IntersectionObserver((en) => { visible = en[en.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
if (still.matches) touring = false;
drawChart();

if (still.matches) { target = 35; run(); }
