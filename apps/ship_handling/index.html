<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>선박 조종 3D 모델</title>
<meta name="description" content="6,000TEU 컨테이너선으로 보는 선박조종학. 선체 운동, 복원성, 타와 프로펠러, 천수, 변침, 묘박을 3D로 돌려 보고 재생바로 멈춰 보며 공부한다.">
<meta name="theme-color" content="#0F2A3F">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BYPASS">
<meta property="og:url" content="https://teambypass.vercel.app/apps/ship_handling/">
<meta property="og:title" content="선박 조종 3D 모델 | BYPASS">
<meta property="og:description" content="6,000TEU 컨테이너선 한 척으로 선박조종학 42개 단원을 3D로 돌려 보고 멈춰 보며 공부해요.">
<meta property="og:image" content="https://teambypass.vercel.app/apps/ship_handling/assets/photo/day-bow.jpg">
<meta property="og:image:alt" content="선교에서 내려다본 컨테이너선 선수와 갑판">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem('shs-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/room.css">
</head>
<body>
<div class="loader" id="loader" role="status" aria-live="polite"><div class="morph" aria-hidden="true"></div><p>불러오는 중</p></div>
<div class="swap" id="swap" aria-hidden="true">
  <svg class="prop-morph" viewBox="0 0 100 100" aria-hidden="true"><g fill="currentColor">
    <path d="M50 50 C 52 34, 64 24, 74 26 C 66 32, 60 40, 50 50 Z"/>
    <path d="M50 50 C 52 34, 64 24, 74 26 C 66 32, 60 40, 50 50 Z" transform="rotate(72 50 50)"/>
    <path d="M50 50 C 52 34, 64 24, 74 26 C 66 32, 60 40, 50 50 Z" transform="rotate(144 50 50)"/>
    <path d="M50 50 C 52 34, 64 24, 74 26 C 66 32, 60 40, 50 50 Z" transform="rotate(216 50 50)"/>
    <path d="M50 50 C 52 34, 64 24, 74 26 C 66 32, 60 40, 50 50 Z" transform="rotate(288 50 50)"/>
    <circle cx="50" cy="50" r="6"/></g></svg>
</div>

<div class="corner" id="corner">
  <button class="theme help" id="helpBtn" type="button" aria-label="도움말: 기능과 단추 설명" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.6"/><path d="M12 17.2h.01"/></svg></button>
  <button class="theme" id="themeBtn" type="button" aria-label="밝은 화면과 어두운 화면 바꾸기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <button class="mver" id="verTop" type="button" title="버전" aria-label="버전 정보">v. 1.0.1</button>
  <a class="home-logo" href="https://teambypass.vercel.app/" target="_top" title="Team Bypass 메인 페이지" aria-label="Team Bypass 메인 페이지"><img src="/assets/favicon.svg" alt="" width="30" height="30"></a>
</div>

<main id="app"></main>

<button class="toc-btn" id="tocBtn" type="button" aria-haspopup="dialog" aria-controls="toc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>목차<span class="cnt" id="tocCnt"></span></button>
<div class="progress" id="progress" aria-live="polite"></div>

<div class="toc" id="toc" role="dialog" aria-modal="true" aria-label="전체 목차">
  <div class="scrim" data-close></div>
  <nav class="sheet" id="tocSheet"></nav>
</div>
<div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="scrim" data-close></div>
  <div class="box"><button class="close-x" type="button" data-close aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="dlgBody"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
