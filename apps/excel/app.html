}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}

body{background:var(--paper);color:var(--ink);font:400 15px/1.7 var(--body);word-break:keep-all;overflow-wrap:break-word}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;align-items:stretch;height:var(--bar);background:var(--paper);border-bottom:2px solid var(--frame);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}

.head{display:flex;gap:16px;align-items:center}

.read ul{padding-left:18px;display:grid;gap:6px}
code{font:400 13.5px/1.5 var(--mono);background:var(--sunken);padding:1px 5px;border-radius:2px;overflow-wrap:anywhere}

#task{min-height:176px;flex:none}

.rbody{display:flex;align-items:stretch;padding:5px 4px 2px;overflow-x:auto;scrollbar-width:thin;border-top:1px solid var(--line);min-height:76px}

.rb:disabled{opacity:.4;cursor:default}
.rb.big{grid-row:span 2;align-self:stretch;min-height:50px;min-width:50px;white-space:normal;max-width:74px;font-weight:600;line-height:1.25}

.rmenu{position:fixed;z-index:40;display:grid;min-width:130px;background:var(--surface);border:1px solid var(--frame);box-shadow:0 3px 10px rgba(0,0,0,.25);padding:3px;max-height:70vh;overflow:auto}

.sadd{background:none;border:0;width:28px;font-size:16px;line-height:1;color:var(--muted)}

.ready{margin-right:auto}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}

.sm{font-size:12.5px}

.qt{overflow-x:auto}

.grid td.it{font-style:italic}.grid td.un{text-decoration:underline}.grid td.all{text-align:left}.grid td.alc{text-align:center}.grid td.alr{text-align:right}

.handle{position:absolute;width:10px;height:10px;background:var(--accent);border:1px solid var(--surface);cursor:crosshair;z-index:2;touch-action:none}

.clipbox{position:absolute;border:2px dashed var(--good);pointer-events:none;z-index:2}
.editor{position:absolute;z-index:3;height:23px;resize:none;overflow:hidden;white-space:pre;border:2px solid var(--accent);background:var(--surface);color:var(--ink);font:400 14px/1 var(--body);padding:0 4px;opacity:0;pointer-events:none;outline:0;user-select:text;-webkit-user-select:text}

.gut{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

.h-mid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px;align-items:start}
.badge{grid-column:1 / 3;width:136px;height:136px;border-radius:50%;background:var(--badge-bg);color:var(--badge-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center}

  .next{grid-template-columns:minmax(0,1fr)}

  .hero{background-size:50% 100%}
}

const eachRef=(rs,fn)=>{const g=parseRange(rs);for(let r=g.r1;r<=g.r2;r++)for(let c=g.c1;c<=g.c2;c++)if(fn(addr(c,r),c-g.c1,r-g.r1)===false)return};
const same=(a,b)=>{if(a instanceof XErr||b instanceof XErr)return a instanceof XErr&&b instanceof XErr&&a.code===b.code;if(typeof a==='number'&&typeof b==='number')return Math.abs(a-b)<1e-6;if(a===null)a='';if(b===null)b='';return a===b};

const ERRS={'#DIV/0!':'0으로 나누었다는 뜻이에요.','#NAME?':'함수 이름에 오타가 있거나 문자에 따옴표가 빠졌다는 뜻이에요.','#VALUE!':'계산할 수 없는 값이 섞였다는 뜻이에요.','#REF!':'참조한 셀이 없어졌다는 뜻이에요.','#N/A':'찾는 값이 없다는 뜻이에요.','#순환!':'수식이 자기 자신을 참조하고 있어요.'};

      filledCount++;

A4:{topic:'조건 여러 개를 함께 판단하기',
 goal:'AND, OR, IFS, IFERROR를 IF와 조합합니다.',
 why:'포상 기준이 "근속 3년 이상이고 실적 90 이상"처럼 복합 조건이에요. 인사와 영업 업무의 판정 대부분이 이런 모양입니다.',
 how:`${mini([['함수','결과'],[C('AND(조건1, 조건2)'),'<b>모두</b> 참이면 TRUE'],[C('OR(조건1, 조건2)'),'<b>하나라도</b> 참이면 TRUE'],[C('IFS(조건1, 값1, 조건2, 값2, …)'),'처음 참이 되는 조건의 값'],[C('IFERROR(수식, 대체값)'),'오류일 때만 대체값']])}
 <p>AND와 OR은 IF의 조건 자리에 넣습니다. ${C('=IF(AND(B2>=3,C2>=90),"대상","-")')}</p>
 <p><b>IFS는 위에서부터 차례로 검사</b>하고 처음 맞는 곳에서 멈춥니다. 그래서 높은 기준부터 써야 해요. 마지막에 ${C('TRUE')}를 조건으로 두면 "그 외 전부"라는 뜻이 됩니다.</p>

B4:{topic:'조건에 맞는 것만 더하고 세기',

 how:`<p style="text-align:center">${C('=XLOOKUP(찾을 값, 찾을 범위, 가져올 범위, [없을 때 값])')}</p>

 <p style="text-align:center">${C('=VLOOKUP(찾을 값, 표 전체, 몇 번째 열, FALSE)')}</p>
 <p>오래된 파일에서 계속 만나게 되는 함수입니다. 표의 <b>맨 왼쪽 열</b>에서만 찾을 수 있고, 정확히 찾으려면 끝에 ${C('FALSE')}를 꼭 넣어야 합니다.</p>

A7:{topic:'수식 하나가 여러 칸으로 흘러요',goal:'UNIQUE, SORT, FILTER로 목록과 추출 결과를 수식 하나로 만듭니다.',why:'지점 목록을 복사해서 중복을 지우고, 조건에 맞는 행만 옮겨 붙이던 작업을 수식 하나로 끝낼 수 있습니다. 원본이 바뀌면 결과도 따라 바뀌어요.',
how:B('스필',`<p>한 칸에 쓴 수식의 결과가 옆과 아래 칸으로 넘쳐흐르는 것을 스필이라고 합니다. 결과 칸들은 직접 고칠 수 없어요.</p>`+mini([['함수','결과'],[C('UNIQUE(범위)'),'중복 없는 목록'],[C('SORT(범위)'),'정렬된 목록'],[C('FILTER(범위, 조건)'),'조건에 맞는 행']]))+B('조건 두 개는 곱하기',`<p>${C('(B2:B21="강남")*(E2:E21>=100000)')}처럼 조건을 괄호로 묶어 곱하면 <b>둘 다 참</b>인 행만 남습니다. 더하면 또는이에요.</p>`)+B('#SPILL! 오류',`<p>결과가 흘러갈 자리에 다른 값이 있으면 납니다. 막고 있는 칸을 비우면 바로 풀려요. Excel 2021 이상과 365에서 쓸 수 있습니다.</p>`),
traps:['스필 결과 범위 안에 값을 입력하면 #SPILL!이 납니다.','조건 범위와 결과 범위의 행 수는 같아야 합니다.'],

B7:{topic:'매달 하던 정리를 한 번만',goal:'파워 쿼리로 정리 단계를 기록하고 시트로 불러옵니다.',why:'매달 같은 파일을 받아 같은 순서로 정리하고 있다면, 그 순서를 저장해 두고 다음 달엔 새로 고침만 하면 됩니다.',

      <div class="h-pitch"><p>엑셀을 처음 여는 사람이 지저분한 데이터를 받아 보고서로 넘길 수 있을 때까지 훈련합니다.</p><button class="cta" type="button" id="heroGo">${done.size?'이어서 훈련하기':'첫 훈련 시작'} <i>→</i></button></div>
    </div>
    <h1 class="mega">엑셀 훈련소</h1>
  </section>
  <div class="tick" aria-hidden="true"><div>${words.repeat(3)}</div><div>${words.repeat(3)}</div></div>
  <section class="board">
    <div class="next"><div class="next-tag">${finished?'복습':'다음 훈련'}</div><div class="next-in">
      <div class="next-copy"><small>${codeOf(nx)} · ${n.week}주차 ${WEEKS[n.week-1][0]}</small><h2>${n.topic}</h2><p>${n.goal}</p><button class="cta" type="button" id="nextGo">훈련 시작 · 실습 ${n.tasks.length}개 <i>→</i></button></div>
      <div><div class="pv-cap">오늘 다룰 데이터</div><div class="pv-wrap">${pv}</div></div>
    </div></div>
    <div class="stat gut"><h2>훈련 현황</h2><dl>
      <div><dt>완료한 레슨</dt><dd>${done.size} / ${TOTAL}</dd></div>
      <div><dt>전체 진행률</dt><dd>${Math.round(done.size/TOTAL*100)}%</dd></div>
      <div><dt>현재 단계</dt><dd>${n.week}주차</dd></div>
      <div><dt>남은 실습 가능 레슨</dt><dd>${ORDER.filter(id=>!done.has(id)).length}개</dd></div>
    </dl></div>
  </section>
  <section class="course" id="course">
    <div class="c-head gut"><h2>훈련 과정</h2><p>단계를 눌러 레슨을 펼치세요. 순서대로 진행하는 것을 권장하지만, 원하는 레슨부터 바로 열 수도 있습니다.</p></div>
    <div class="stages">${stages}</div>
  </section>`;
  applyKeys(app);
  if(toCourse)document.getElementById('course').scrollIntoView();else window.scrollTo(0,0);
  document.getElementById('heroGo').onclick=()=>open(nx);document.getElementById('nextGo').onclick=()=>open(nx);
  app.querySelectorAll('.ls:not(:disabled)').forEach(b=>b.onclick=()=>open(b.dataset.id));
}
const RB=[['<b>[수식 추적]</b>에서 <b>[참조되는 셀]</b>','<b>[수식 › 참조되는 셀 추적]</b>'],['[참조되는 셀]','[수식 › 참조되는 셀 추적]'],['[수식 추적]','[수식 › 참조되는 셀 추적]'],['[천 단위]','[홈 › 쉼표]'],['[원]','[홈 › 통화]'],['[%]','[홈 › %]'],['[날짜]','[홈 › 표시 형식 › 날짜]'],['[일반]','[홈 › 표시 형식 › 일반]'],['[굵게]','[홈 › B]'],['[값만 붙여넣기]','[홈 › 붙여넣기 › 값만 붙여넣기]'],['[조건부 서식]','[홈 › 조건부 서식]'],['[오름차순]','[데이터 › 오름차순]'],['[내림차순]','[데이터 › 내림차순]'],['[필터]','[데이터 › 필터]'],['[표로 만들기]','[삽입 › 표]'],['[인쇄 설정]','[페이지 레이아웃 › 페이지 설정]'],['[텍스트 나누기]','[데이터 › 텍스트 나누기]'],['[빠른 채우기]','[데이터 › 빠른 채우기]'],['[중복 제거]','[데이터 › 중복된 항목 제거]'],['[숫자로 변환]','[데이터 › 숫자로 변환]'],['[찾아 바꾸기]','[홈 › 찾기 및 선택 › 바꾸기]'],['[빈 셀 선택]','[홈 › 찾기 및 선택 › 이동 옵션]'],['[유효성 검사]','[데이터 › 데이터 유효성 검사]'],['[피벗]','[삽입 › 피벗 테이블]'],['[차트]','[삽입 › 차트]'],['[쿼리 편집기]','[데이터 › 데이터 가져오기]'],['[매크로]','[보기 › 매크로]'],['[시트 보호]','[검토 › 시트 보호]'],['시트 위쪽의 ','리본의 '],['표시 줄의 ','리본의 '],['도구 줄의 ','리본의 '],['도구 줄','리본'],['시트 아래에 설정 창이','화면에 설정 창이'],['시트 아래에 창이','화면에 창이'],['아래 창에','열린 창에']];
const rz=s=>RB.reduce((t,[a,b])=>t.split(a).join(b),s);
const secBox=(n,t,b,cls='')=>`<section class="sec"><header><span>${n}</span><h2>${t}</h2></header><div class="sec-b ${cls}">${b}</div></section>`;
const HOW_CUTS={A1:[[0,'칸 이름 읽기'],[3,'범위 쓰기'],[4,'입력과 수정']],B1:[[0,'값의 세 종류'],[2,'날짜의 정체'],[3,'단위와 전화번호']],C1:[[0,'채우기 핸들'],[2,'규칙을 알려 주는 법'],[3,'더블클릭으로 끝까지']],D1:[[0,'붙여넣기 두 가지'],[2,'값만 붙여넣기'],[3,'실수했을 때']],E1:[[0,'외울 단축키'],[1,'Ctrl의 원리'],[2,'상태 표시줄']],A3:[[0,'수식의 시작'],[2,'주소를 쓰는 이유'],[3,'클릭과 채우기']],B3:[[0,'주소가 움직이는 문제'],[2,'$로 고정하기'],[4,'F4와 혼합 참조']],C3:[[0,'함수의 형태'],[2,'빈칸과 문자 처리'],[3,'범위 입력']],D3:[[0,'자릿수 처리'],[3,'오류 코드'],[4,'서식과 ROUND의 차이']],E3:[[0,'IF의 형태'],[2,'비교 기호'],[3,'문자와 빈칸'],[4,'단계 나누기']],A4:[[0,'네 가지 함수'],[1,'IF 안에 넣기'],[2,'IFS의 순서'],[3,'IFERROR 주의']],B4:[[0,'SUMIFS의 형태'],[2,'조건 쓰는 법'],[4,'채울 때 고정']],C4:[[0,'XLOOKUP'],[2,'VLOOKUP'],[4,'세 방법 비교']],D4:[[0,'글자 꺼내기'],[1,'공백과 글자 바꾸기'],[3,'결과는 문자']],E4:[[0,'주요 날짜 함수'],[1,'날짜 빼기'],[2,'기준일과 표시 형식']]};
function howBlocks(id,how){
  if(how.includes('class="blk"'))return how;
  const cuts=HOW_CUTS[id];if(!cuts)return`<div class="blk">${how}</div>`;
  const t=document.createElement('div');t.innerHTML=how;const kids=[...t.children];
  return cuts.map(([st,title],i)=>`<div class="blk"><h3>${title}</h3>${kids.slice(st,cuts[i+1]?cuts[i+1][0]:kids.length).map(n=>n.outerHTML).join('')}</div>`).join('');
}
function open(id){
  const les=L[id];if(!les)return renderHome();
  route(id);
  const idx=ORDER.indexOf(id),prev=ORDER[idx-1],next=ORDER[idx+1];
  app.innerHTML=`<div class="lesson">
   <article class="read">
    <div class="head"><div class="coord">${codeOf(id)}</div><div><p class="eyebrow">${les.week}주차 ${WEEKS[les.week-1][0]} · ${les.title}</p><h1>${les.topic}</h1></div></div>
    ${/class="kk"|Ctrl/.test(les.how+les.tasks.map(t=>t.text+t.hint).join(''))?'<p class="mac-note">맥 키보드 기준으로 표시합니다. Enter는 return 키이고, 맥북의 F키는 fn과 함께 누르세요.</p>':''}
    ${secBox('1','오늘 배울 것',`<p>${les.goal}</p>`)}
    ${secBox('2','이런 상황에서 씁니다',`<p>${les.why}</p>`,'scene')}
    <section class="sec how"><header><span>3</span><h2>원리</h2></header><div class="sec-b">${rz(howBlocks(id,les.how))}</div></section>
    ${secBox('4','자주 하는 실수',`<ul>${les.traps.map(x=>`<li>${rz(x)}</li>`).join('')}</ul>`)}
    <div class="nav"><button class="btn" id="prev" type="button" ${prev?'':'disabled'}>이전 레슨</button><button class="btn" id="next" type="button" ${next?'':'disabled'}>다음 레슨</button></div>
   </article>
   <section class="lab" aria-label="실습"><div id="task"></div><div id="sheet" style="display:contents"></div></section>
  </div>`;
  window.scrollTo(0,0);
  document.getElementById('prev').onclick=()=>open(prev);document.getElementById('next').onclick=()=>open(next);
  const taskEl=document.getElementById('task');
  const lab={id,i:0,hint:false,answer:false,fb:'',sheet:null,finished:false};LAB=lab;
  const cur=()=>les.tasks[lab.i];
  const startAt=Date.now();
  const clockText=()=>{const left=Math.max(0,les.timer*60-Math.floor((Date.now()-startAt)/1000));return `남은 시간 ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`};
  if(les.timer){const tm=setInterval(()=>{if(LAB!==lab||lab.finished){clearInterval(tm);return}const c=document.getElementById('clock');if(c)c.textContent=clockText()},1000)}
  function draw(){
    if(lab.finished){
      const nx=ORDER[idx+1];
      taskEl.innerHTML=`<div class="task donebox"><h2>오늘 레슨 완료</h2><ul>${les.recap.map(x=>`<li>${x}</li>`).join('')}</ul><div class="task-act">${nx?`<button class="btn main" id="go" type="button">다음: ${L[nx].title}</button>`:`<button class="btn main" id="go" type="button">훈련 과정으로</button>`}<button class="btn" id="again" type="button">처음부터 다시</button></div></div>`;
      document.getElementById('go').onclick=()=>nx?open(nx):renderHome(true);
      document.getElementById('again').onclick=reset;
      applyKeys(taskEl);
      return;
    }
    const t=cur();
    taskEl.innerHTML=`<div class="task"><div class="task-top"><span>실습 ${lab.i+1} / ${les.tasks.length}</span><span class="dots">${les.tasks.map((_,k)=>`<span class="${k<lab.i?'d':k===lab.i?'c':''}"></span>`).join('')}</span>${les.timer?`<span class="clock" id="clock">${clockText()}</span>`:''}</div>
     <div class="task-text">${rz(t.text)}</div>
     <div class="fb ${lab.fbOk?'ok':''} ${lab.fb?'':'blank'}" role="status">${lab.fb||'입력하면 바로 채점됩니다.'}</div>
     ${lab.hint?`<div class="reveal">${rz(t.hint)}</div>`:''}
     ${lab.answer?`<div class="reveal">정답: <code>${rz(t.spec.ans).replace(/</g,'&lt;')}</code></div>`:''}
     <div class="task-act"><button class="btn" id="h" type="button">힌트</button><button class="btn" id="a" type="button">정답 보기</button><button class="btn" id="rs" type="button">시트 초기화</button></div></div>`;
    for(const[b,fn]of[['h',()=>{lab.hint=true;draw()}],['a',()=>{lab.answer=true;draw()}],['rs',reset]]){const n=document.getElementById(b);n.addEventListener('pointerdown',e=>e.preventDefault());n.onclick=fn}
    applyKeys(taskEl);
  }
  function mark(){if(lab.sheet)lab.sheet.setMark(lab.finished?null:cur().spec.mark)}
  let checking=false;
  function check(){
    if(!lab.sheet||lab.finished||checking)return;checking=true;
    let adv=false;
    for(;;){
      const r=cur().spec.bad(lab.sheet);
      if(r!==null){const f=r||'';if(lab.stick&&!f){lab.stick=false}else if(f?(f!==lab.fb||lab.fbOk):(lab.fb&&!lab.fbOk)){lab.fb=f;lab.fbOk=false;lab.stick=false;draw()}break}
      adv=true;lab.i++;lab.hint=false;lab.answer=false;lab.fb='좋아요, 맞았어요.';lab.fbOk=true;
      if(lab.i>=les.tasks.length){lab.finished=true;done.add(id);store.set([...done]);updateMeter();break}
      break;
    }
    if(adv){draw();mark()}
    checking=false;
  }
  function reset(){lab.i=0;lab.finished=false;lab.hint=false;lab.answer=false;lab.fb='';lab.fbOk=false;lab.sheet.seed();draw();mark();lab.sheet.focus()}
  draw();
  lab.sheet=createSheet(document.getElementById('sheet'),les.sheet,{change:check,msg:m=>{lab.fb=m;lab.fbOk=false;lab.stick=true;draw()}});
  mark();
  LAB.check=check;
  applyCurrentKeys();
}
function applyCurrentKeys(){for(const r of LAB?[...document.querySelectorAll('.read,#task,.xbar,#rib')]:[document.getElementById('app')])applyKeys(r)}
function setOS(o,save){
  OS=o;document.documentElement.dataset.os=o;
  document.querySelectorAll('#osPick button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.os===o)));
  if(save)try{localStorage.setItem('xl8w.os',o)}catch(e){}
  applyCurrentKeys();
}
document.querySelectorAll('#osPick button').forEach(b=>{b.addEventListener('pointerdown',e=>e.preventDefault());b.onclick=()=>{setOS(b.dataset.os,true);if(LAB&&LAB.sheet)LAB.sheet.focus()}});
setOS(OS);
document.getElementById('brand').onclick=()=>renderHome();
document.getElementById('tohome').onclick=()=>renderHome();
document.getElementById('tocourse').onclick=()=>renderHome(true);
document.getElementById('resume').onclick=()=>open(nextId());
updateMeter();
function boot(){const h=location.hash.slice(1);if(L[h])open(h);else renderHome()}
window.addEventListener('hashchange',boot);
boot();
</script>
