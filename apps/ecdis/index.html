function dlgGoto(){
  const c=S.cursor.valid?S.cursor:{x:S.own.x,y:S.own.y};
  openDlg(t("gotoT"),`<div class="form"><label>LAT (°)</label><input type="number" id="gLat" step="0.0001" value="${toLat(c.y).toFixed(4)}"><label>LON (°)</label><input type="number" id="gLon" step="0.0001" value="${toLon(c.x).toFixed(4)}"></div><p style="font-size:12.5px;color:var(--muted)">${t("gotoNote")}</p>`,{foot:`<button class="btn" data-x>${t("cancel")}</button><button class="btn pri" id="gGo">Go To</button>`,onMount:(d,close)=>{d.querySelector("#gGo").onclick=()=>{const[x,y]=fromLL(+d.querySelector("#gLat").value,+d.querySelector("#gLon").value);if(isFinite(x)&&isFinite(y)){S.view.free=true;S.view.cx=x;S.view.cy=y;close()}}}});
}
function dlgMonInfo(){const r=S.rinfo;if(!r){toast(t("needRoute"));return}const rt=S.routes[S.monRoute],eta=new Date(S.time+r.remainTot/Math.max(.1,S.own.sog)*36e5);
  openDlg(t("monInfo"),`<table class="tbl">${[["Route",rt.name],["WPT",rt.wps.length],["To WPT",r.i+1],[t("remain"),r.remainTot.toFixed(1)+" NM"],["ETA (UTC)",eta.toISOString().slice(0,16).replace("T"," ")],["XTD",(r.xtd*1852).toFixed(0)+" m"],["Helm",S.helm]].map(x=>`<tr><td>${x[0]}</td><td class="m">${esc(x[1])}</td></tr>`).join("")}</table>`)}
function legTable(w){let tot=0;const sp=Math.max(.1,S.own.sog||12);let eta=S.time;return w.map((p,i)=>{let crs="—",dist="—";if(i){const a=w[i-1];const d=Math.hypot(p.x-a.x,p.y-a.y);tot+=d;eta+=d/(p.spd||sp)*36e5;crs=fmtB(brgTo(a.x,a.y,p.x,p.y));dist=d.toFixed(2)}return`<tr><td class="m">${i+1}</td><td class="m">${fmtLat(p.y)}</td><td class="m">${fmtLon(p.x)}</td><td class="m">${crs}</td><td class="m">${dist}</td><td class="m">${tot.toFixed(2)}</td><td class="m">${p.xtd.toFixed(2)}</td><td class="m">${p.rad.toFixed(2)}</td><td class="m">${(p.spd||12).toFixed(1)}</td><td class="m">${i?new Date(eta).toISOString().slice(5,16).replace("T"," "):"—"}</td></tr>`}).join("")}
function dlgReport(ri){const w=ri==null?S.plan.wps:(S.routes[ri]||{}).wps;const nm=ri==null?S.plan.name:(S.routes[ri]||{}).name;if(!w||!w.length){toast(t("noRoute"));return}
  openDlg(t("report")+" · "+nm,`<div class="tw"><table class="tbl"><tr><th>WPT</th><th>LAT</th><th>LON</th><th>CRS</th><th>DIST</th><th>TOTAL</th><th>XTD</th><th>RAD</th><th>SPD</th><th>ETA(UTC)</th></tr>${legTable(w)}</table></div>`,{wide:true,sub:"Route report"})}
function dlgCheck(){
  const w=S.plan.editing?S.plan.wps:(S.routes[S.plan.ri??S.monRoute??0]||{}).wps;if(!w||w.length<2){toast(t("need2"));return}
  const{res,marks}=routeCheck(w);S.checkMarks=marks;
  const ng=res.filter(r=>r.lv==="ng").length;
  openDlg(t("rcheck"),`<p style="margin:0">${t("chkHead",[safetyLevel(S.set.safetyContour)])}</p><div class="chk">${res.map(r=>`<div class="${r.lv}">${r.lv==="ok"?"✓":r.lv==="ng"?"✕":"!"} ${esc(r.txt)}</div>`).join("")}</div><p style="margin:10px 0 0;font-weight:600;color:${ng?"var(--bad)":"var(--ok)"}">${ng?t("chkNg",[ng]):t("chkAllOk")}</p>`,{sub:"Route check",onClose:()=>{setTimeout(()=>{S.checkMarks=null},4000)}});
}
function dlgWp(i){const p=S.plan.wps[i];openDlg("WPT "+(i+1),`<div class="form"><label>XTD (NM)</label><input type="number" id="wX" value="${p.xtd}" step=".05" min=".05" max="2"><label>Turn RAD (NM)</label><input type="number" id="wR" value="${p.rad}" step=".1" min=".1" max="3"><label>Speed (kn)</label><input type="number" id="wS" value="${p.spd}" step=".5" min="1" max="25"></div>`,{foot:`<button class="btn pri" id="wOk">${t("ok")}</button>`,onMount:(d,close)=>{d.querySelector("#wOk").onclick=()=>{p.xtd=clamp(+d.querySelector("#wX").value,.05,2);p.rad=clamp(+d.querySelector("#wR").value,.1,3);p.spd=clamp(+d.querySelector("#wS").value,1,25);close()}}})}
function dlgRoutes(){
  const render=()=>`<div class="tw"><table class="tbl"><tr><th>${t("name")}</th><th>WPT</th><th>NM</th><th></th></tr>${S.routes.map((r,i)=>{const L=r.wps.reduce((s,p,j,a)=>j?s+Math.hypot(p.x-a[j-1].x,p.y-a[j-1].y):0,0);return`<tr${S.monRoute===i?' class="sel"':""}><td>${esc(r.name)}${S.monRoute===i?' <span class="tg b">MON</span>':""}</td><td class="m">${r.wps.length}</td><td class="m">${L.toFixed(1)}</td><td style="display:flex;gap:4px"><button class="btn sm" data-r="mon" data-i="${i}">${t("monitor")}</button><button class="btn sm" data-r="edit" data-i="${i}">${t("edit")}</button><button class="btn sm" data-r="rep" data-i="${i}">${t("report")}</button><button class="btn sm bad" data-r="del" data-i="${i}">${t("del")}</button></td></tr>`}).join("")}</table></div>`;
  openDlg(t("manage"),`<div id="rtBody">${render()}</div>`,{wide:true,sub:"Manage Data · Route",foot:`<button class="btn pri" id="rtNew">${t("newRoute")}</button>`,onMount:(d,close)=>{
    d.addEventListener("click",e=>{const b=e.target.closest("[data-r]");if(!b)return;const i=+b.dataset.i,a=b.dataset.r;
      if(a==="mon"){selectRoute(i);close();setMode("NAVI")}else if(a==="edit"){close();startEdit(i)}else if(a==="rep"){dlgReport(i)}
      else if(a==="del"){if(S.monRoute===i)stopMon();else if(S.monRoute>i)S.monRoute--;S.routes.splice(i,1);S.plan.ri=null;d.querySelector("#rtBody").innerHTML=render()}});
    d.querySelector("#rtNew").onclick=()=>{close();startEdit(-1)}}});
}
function dlgCharts(k){
  const cells=S.sc.cells,dt=d=>d.toISOString().slice(0,10);
  if(k==="auto"){toast(t("cmAuto"));return}
  if(k==="key"){openDlg(t("ia_key").replace("<br>"," "),`<p class="mono" style="font-size:12px;word-break:break-all">SIM-PK-${S.seed.toString(16).toUpperCase()}-${(S.seed*2654435761>>>0).toString(16).toUpperCase()}</p><p style="font-size:12.5px;color:var(--muted)">${t("keyNote")}</p>`);return}
  const head={manage:["Cell","Band","Scale","Edition","Update","Issue"],status:["Cell","Edition","Update",t("state")],license:["Cell","Permit","Expiry",t("state")]}[k];
  const rows=cells.map(c=>{const exp=(c.exp-S.time)/864e5;
    if(k==="manage")return[c.name,c.band===4?"Approach":"Coastal","1:"+c.scale.toLocaleString("en-US"),c.ed,c.upd,dt(c.issue)];
    if(k==="status")return[c.name,c.ed,c.upd,c.upd%5===0?"Update available":"Up to date"];
    return[c.name,"SIM-"+c.name.slice(-4)+"-"+c.ed,dt(c.exp),exp<60?"Expires soon":"Valid"]});
  openDlg({manage:t("ia_mch"),status:t("ia_cell"),license:t("ia_lic")}[k].replace("<br>"," "),`<div class="tw"><table class="tbl"><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(v=>`<td class="m">${esc(v)}</td>`).join("")}</tr>`).join("")}</table></div><p class="note">${t("cmNote")}</p>`,{wide:true,sub:"Chart maintenance"});
}

/* ---------- 언어/테마 ---------- */
function themeBtn(){const d=document.documentElement.dataset.theme==="dark";$("#themeBtn").innerHTML=(d?IC.moon:IC.sun)+`<span>${d?t("dark"):t("light")}</span>`}
function applyBrill(){$("#cvChart").style.filter=S.set.brill<100?`brightness(${S.set.brill/100})`:"";$("#cvOver").style.filter=$("#cvChart").style.filter}
function applyLang(){
  document.documentElement.lang=LANG;document.title=t("brand");
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll('[data-act="lang"]').forEach(b=>b.classList.toggle("on",b.dataset.v===LANG));
  $("#footTxt").innerHTML=t("foot");$("#footBook").innerHTML=t("footBook");$("#footDisc").innerHTML=`<b>⚠ ${t("notice")}</b>${t("disc")}`;
  $("#rotT").textContent=t("rotT");$("#rotP").textContent=t("rotP");$("#rotBtn").textContent=t("rotBtn");
  themeBtn();
  if(S.own){buildSB();buildIA();buildRP();buildChartBoxes();chartDirty=true;$("#abox")._k="";upd()}
}

/* ---------- 이스터 에그 (위키 공통) ---------- */
let eggN=0,eggT=null;
document.querySelectorAll(".ver").forEach(b=>b.addEventListener("click",()=>{eggN++;clearTimeout(eggT);eggT=setTimeout(()=>eggN=0,1500);if(eggN>=5){eggN=0;showEgg()}}));
function showEgg(){
  if(document.querySelector(".egg"))return;
  const o=document.createElement("div");o.className="egg";o.setAttribute("role","dialog");o.setAttribute("aria-label","Made by Bypass");
  o.innerHTML=`<div class="egg-card">${window.EGG_IMG?`<img src="${window.EGG_IMG}" alt="${esc(t("eggAlt"))}">`:""}<div class="ev">Ver.${VERSION}</div><div class="eb">Made by Bypass</div><small>${t("eggClose")}</small></div>`;
  const close=()=>{o.remove();document.removeEventListener("keydown",k)};const k=e=>{if(e.key==="Escape")close()};
  o.addEventListener("click",close);document.addEventListener("keydown",k);document.body.appendChild(o);
}

/* ---------- 키보드 ---------- */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(popEl){closePop();return}if(dlgStack.length){closeTopDlg();return}if(S.sel){S.sel=null;return}}
  if(dlgStack.length||e.target.closest("input,select,textarea"))return;
  const o=S.own;if(!o)return;let h=true;
  switch(e.key){
    case"ArrowLeft":adjust("hdg",e.shiftKey?-10:-1);break;
    case"ArrowRight":adjust("hdg",e.shiftKey?10:1);break;
    case"ArrowUp":adjust("spd",.5);break;
    case"ArrowDown":adjust("spd",-.5);break;
    case"+":case"=":zoomStep(1);break;
    case"-":case"_":zoomStep(-1);break;
    case" ":S.paused=!S.paused;updateHelmStatic();break;
    case"a":case"A":ackAlert(topAlert());break;
    case"m":case"M":doMOB();break;
    case"c":case"C":ACT.tmr();break;
    default:h=false;
  }
  if(h){e.preventDefault();upd()}
});

/* ---------- 메인 루프 ---------- */
let cvC,cvO,ctxC,ctxO,cw=0,chh=0,dpr=1;
function resize(){
  const el=$("#chart"),r=el.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);
  cw=Math.max(1,Math.round(r.width));chh=Math.max(1,Math.round(r.height));
  for(const c of[cvC,cvO]){c.width=Math.round(cw*dpr);c.height=Math.round(chh*dpr)}
  chartDirty=true;
}
function updateView(){
  const v=S.view,o=S.own,[up,mot]=v.pres.split("-");
  v.rot=up==="NU"?0:up==="CU"?v.cuAng:up==="HU"?o.hdg:(S.rinfo?S.rinfo.plan:v.cuAng);
  if(up==="RU"&&S.monRoute==null){v.pres="CU-RM";v.cuAng=o.cog}
  if(v.free)return updateVM(cw,chh);
  if(mot==="RM"){let cx=o.x,cy=o.y;if(v.offset){const d=Math.min(cw,chh)*.3/v.k,a=v.rot*D2R;cx+=Math.sin(a)*d;cy+=Math.cos(a)*d}v.cx=cx;v.cy=cy;updateVM(cw,chh)}
  else{updateVM(cw,chh);const[sx,sy]=w2s(o.x,o.y);if(Math.abs(sx-cw/2)>cw*.4||Math.abs(sy-chh/2)>chh*.4){const d=Math.min(cw,chh)*.3/v.k;v.cx=o.x+Math.sin(o.cog*D2R)*d;v.cy=o.y+Math.cos(o.cog*D2R)*d;updateVM(cw,chh)}}
}
let lastT=0,acc=0,uiT=0,chkT=0,navT=0,frameT=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!S.own){return}
  const dt=Math.min(.25,(ts-(lastT||ts))/1000);lastT=ts;
  if(!S.paused&&!S.standby&&!dlgBlocking()){
    let simDt=dt*S.simSpeed;
    while(simDt>0){const h=Math.min(1,simDt);step(h);simDt-=h;chkT+=h;if(chkT>=1){chkT=0;routeMon();targetsCPA();lookAhead()}}
    if(S.time-navT>=360000){navT=S.time;const o=S.own;S.navlog.unshift({t:S.time,lat:fmtLat(o.y),lon:fmtLon(o.x),hdg:o.hdg.toFixed(1),cog:o.cog.toFixed(1),sog:o.sog.toFixed(1)});if(S.navlog.length>200)S.navlog.pop()}
  }
  // 경보음 반복
  const ta=topAlert();if(ta&&ta.pri==="A"&&!ta.ack&&ta.active&&ts-lastBuzz>2600){lastBuzz=ts;buzz("A")}
  if(ts-frameT<28)return;frameT=ts;
  updateView();
  const v=S.view,key=[Math.round(v.cx*v.k*2),Math.round(v.cy*v.k*2),v.k.toFixed(4),v.rot.toFixed(1),cw,chh,S.set.palette,S.mode,LANG].join("|");
  if(chartDirty||key!==lastChartKey){chartDirty=false;lastChartKey=key;renderChart(ctxC,cw,chh,dpr)}
  renderOverlay(ctxO,cw,chh,dpr,ts);
  if(ts-uiT>250){uiT=ts;upd()}
}
function dlgBlocking(){return false}
function restart(seed){
  $("#loading").hidden=false;
  setTimeout(()=>{
    const keepMode=S.mode;newScenario(seed);S.mode="NAVI";S.navlog=[];S.paused=false;S.standby=false;$("#standby").hidden=true;S.sel=null;
    if(keepMode!=="NAVI")setMode("NAVI");
    buildSB();buildIA();buildRP();buildChartBoxes();routeMon();targetsCPA();lookAhead();
    $("#loading").hidden=true;$("#abox")._k="";upd();
    toast(t("scReady",[seed]));
  },30);
}
function init(){
  document.documentElement.dataset.theme="light";
  try{const l=localStorage.getItem("ecdis-sim-lang");if(l)LANG=l;const th=localStorage.getItem("ecdis-sim-theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
  S={set:loadSet(),mode:"NAVI",simSpeed:1,paused:false,standby:false,clearRadar:false,chartOnly:false,cursor:{x:0,y:0,valid:false},touchCursor:false,navlog:[],routes:[],plan:{editing:false,ri:null,wps:[],undo:[]},tgts:[],alerts:[]};
  cvC=$("#cvChart");cvO=$("#cvOver");ctxC=cvC.getContext("2d");ctxO=cvO.getContext("2d");
  applyLang();applyBrill();
  try{if(!sessionStorage.getItem("rotok"))$("#rotHint").classList.add("need")}catch(e){$("#rotHint").classList.add("need")}
  new ResizeObserver(resize).observe($("#chart"));resize();
  initChartInput();
  const seed=Math.floor(Math.random()*1e9);
  setTimeout(()=>{newScenario(seed);S.navlog=[];buildSB();buildIA();buildRP();buildChartBoxes();routeMon();targetsCPA();lookAhead();$("#loading").hidden=true;upd();requestAnimationFrame(loop)},30);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{chartDirty=true});
}
init();

</script>
