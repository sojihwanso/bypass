<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ECDIS 시뮬레이터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Gothic:wght@700;800&display=swap">
<style>
/* Layout: 위키 공통 네이비 상단 바 + 전체 화면 ECDIS 콘솔(상태바 / 퀵 액세스 바 / 해도 / 우측 정보창) + 아래 푸터 */
:root{
  --paper:#F3F6F7; --surface:#FFFFFF; --ink:#12202A; --muted:#566571; --rule:#D3DBE0; --soft:#E8EEF1;
  --navy:#173B57; --navy-ink:#FFFFFF;
  --oil:#93530F; --oil-bg:#FBF1E4; --sew:#17705F; --sew-bg:#E3F3EF; --gar:#4752A0; --gar-bg:#EAECF8; --ov:#4A5864; --ov-bg:#EBEFF2;
  --ok:#1E7A3C; --ok-bg:#E3F4E8; --bad:#B3261E; --bad-bg:#FBE7E5; --warn:#8A5A00; --warn-bg:#FBF0D9; --kr:#1F5E8C; --kr-bg:#E8F0F7;
  --f-disp:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --hdr:50px; --rpw:272px; --iaw:60px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#0D1419; --surface:#141E25; --ink:#E3EAEE; --muted:#93A2AD; --rule:#25333D; --soft:#1A262E;
  --navy:#0F2A3F; --navy-ink:#E3EAEE;
  --oil:#E3A55C; --oil-bg:#2A1F12; --sew:#5BC4AE; --sew-bg:#10261F; --gar:#9EA8F2; --gar-bg:#1A1D33; --ov:#A9B6C0; --ov-bg:#1B252C;
  --ok:#6BD18A; --ok-bg:#12291A; --bad:#F2867E; --bad-bg:#2E1513; --warn:#E8BC5E; --warn-bg:#2B2210; --kr:#86BCE6; --kr-bg:#122230;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:clip;max-width:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gar);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- 상단 바 (위키 공통) ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink);height:var(--hdr)}
header.top .bar{height:100%;display:flex;align-items:center;gap:14px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;flex:0 0 auto;min-width:0}
.brand b{font-family:var(--f-disp);font-size:19px;font-weight:800;letter-spacing:.01em;white-space:nowrap}
.brand span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;opacity:.75;white-space:nowrap}
.htools{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}
.hbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:inherit;border-radius:6px;height:28px;padding:0 9px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.1)}
.hbtn svg{width:15px;height:15px}
.seg2{display:inline-flex;border:1px solid rgba(255,255,255,.28);border-radius:6px;overflow:hidden;height:28px}
.seg2 button{border:0;background:transparent;color:inherit;padding:0 9px;font-size:12px;font-weight:600;opacity:.7}
.seg2 button.on{background:rgba(255,255,255,.18);opacity:1}
.ver{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;background:none;border:0;padding:4px 6px;border-radius:4px;cursor:pointer;color:inherit;opacity:.75;user-select:none;-webkit-user-select:none}
.ver:hover{opacity:1}
.tb-home{flex:0 0 auto;display:flex;align-items:center;border-radius:6px;transition:transform .15s}
.tb-home:hover{transform:scale(1.08)}
.tb-home svg{display:block}

/* ---------- ECDIS 콘솔 ---------- */
.ecdis{height:calc(100vh - var(--hdr) - env(safe-area-inset-top,0px));height:calc(100dvh - var(--hdr) - env(safe-area-inset-top,0px));min-height:300px;display:flex;flex-direction:column;border-bottom:1px solid var(--rule);background:var(--paper);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.sb{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:5px 6px;background:var(--surface);border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.sb::-webkit-scrollbar{display:none}
.sbb{flex:0 0 auto;height:30px;padding:0 10px;border:1px solid var(--rule);background:var(--soft);border-radius:5px;font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.04em;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;position:relative;color:var(--ink)}
.sbb:hover{border-color:var(--muted)}
.sbb.on{background:var(--kr);border-color:var(--kr);color:#fff}
:root[data-theme="dark"] .sbb.on{color:#0D1419}
.sbb.dd{padding-right:16px}
.sbb.dd::after,.iab.dd::after{content:"";position:absolute;right:3px;bottom:3px;border:4px solid transparent;border-right-color:currentColor;border-bottom-color:currentColor;opacity:.6}
.sbb.ic{padding:0 8px;min-width:30px;justify-content:center}
.sbb.ic svg{width:15px;height:15px}
.sbg{display:inline-flex;gap:2px;flex:0 0 auto}
.sb-sp{flex:1 1 0;min-width:4px}
.clk{flex-direction:column;align-items:flex-end;gap:0;line-height:1.05;padding:0 8px;font-weight:500}
.clk small{font-size:9.5px;opacity:.75}
.clk b{font-size:12px;font-weight:600}
.wk{flex:0 0 auto;width:30px;height:30px;position:relative;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--kr);border:0;background:none;padding:0}
.wk i{position:absolute;inset:4px;border-radius:50%;border:2.5px solid var(--rule);border-top-color:var(--kr);animation:spin 1.2s linear infinite}
.wk.stop i{animation:none;border-top-color:var(--bad)}
@keyframes spin{to{transform:rotate(360deg)}}

.ecd-body{flex:1 1 0;min-height:0;display:grid;grid-template-columns:var(--iaw) minmax(0,1fr) var(--rpw)}
.ecdis.rp-off .ecd-body{grid-template-columns:var(--iaw) minmax(0,1fr) 0}
.ecdis.rp-off .rp{display:none}
.ecdis.ia-min{--iaw:16px}

/* Quick access bar */
.ia{background:var(--surface);border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:3px;padding:4px;overflow-y:auto;scrollbar-width:none;min-height:0}
.ia::-webkit-scrollbar{display:none}
.iab{position:relative;flex:0 0 auto;width:100%;min-height:44px;border:1px solid var(--rule);background:var(--soft);border-radius:5px;padding:3px 2px;font-size:10.5px;font-weight:600;line-height:1.15;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink);word-break:break-all}
.iab:hover{border-color:var(--muted)}
.iab.on{background:var(--kr-bg);border-color:var(--kr);color:var(--kr)}
.iab svg{width:18px;height:18px;flex:0 0 auto}
.iab small{font-family:var(--f-mono);font-size:9.5px;font-weight:500;opacity:.8}
.iab.mob{color:var(--bad);border-color:var(--bad);background:var(--bad-bg);font-family:var(--f-mono);font-weight:700}
.ia-sp{flex:1 1 auto;min-height:6px}
.ia-min .ia{padding:0;cursor:pointer;align-items:center;justify-content:center}
.ia-min .ia > *{display:none}
.ia-min .ia::after{content:"›";font-size:18px;color:var(--muted)}

/* chart */
.chart{position:relative;overflow:hidden;min-width:0;touch-action:none;background:#C9D0D5}
.chart canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#cvOver{cursor:crosshair}
.chart.plan #cvOver{cursor:copy}
.ovl{position:absolute;z-index:3;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--rule);border-radius:6px;font-size:11.5px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.scbox{left:8px;top:8px;display:flex;flex-direction:column;gap:3px;padding:5px 6px}
.scrow{display:flex;align-items:center;gap:4px}
.scrow b{font-family:var(--f-mono);font-size:12.5px;font-weight:600;min-width:84px;text-align:center}
.mini{height:24px;min-width:24px;padding:0 6px;border:1px solid var(--rule);background:var(--soft);border-radius:4px;font-family:var(--f-mono);font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--ink);white-space:nowrap}
.mini:hover{border-color:var(--muted)}
.mini.on{background:var(--kr);border-color:var(--kr);color:#fff}
:root[data-theme="dark"] .mini.on{color:#0D1419}
.mini.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.mini[disabled]{opacity:.4;cursor:default}
.tags{display:flex;gap:3px;flex-wrap:wrap}
.tg{font-family:var(--f-mono);font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;background:var(--warn-bg);color:var(--warn);white-space:nowrap}
.tg.b{background:var(--kr-bg);color:var(--kr)}
.tg.clk{cursor:pointer;text-decoration:underline dotted}
.north{position:absolute;z-index:3;width:30px;height:30px;left:12px;pointer-events:none}
.north svg{width:100%;height:100%;transition:transform .2s}
.curbox{right:8px;top:8px;padding:5px 8px;font-family:var(--f-mono);font-size:11px;line-height:1.45;min-width:150px;cursor:pointer}
.curbox .h{font-family:var(--f-body);font-size:10px;color:var(--muted);letter-spacing:.06em}
.tcard{right:8px;padding:7px 9px;width:214px;font-size:11.5px;max-height:calc(100% - 120px);overflow:auto}
.tcard h4{margin:0 0 4px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.tcard .x{border:0;background:none;font-size:16px;line-height:1;padding:0 2px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;font-size:11px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv dd.bad{color:var(--bad);font-weight:600}
.tcard .acts{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.bot{position:absolute;z-index:3;bottom:8px;display:flex;gap:4px}
.bot.l{left:8px}.bot.r{right:8px}
.ev{display:flex;flex-direction:column;padding:3px 6px;min-width:96px;font-family:var(--f-mono);font-size:11px;line-height:1.3;cursor:pointer;position:relative;border-left:3px solid var(--rule)}
.ev.on{border-left-color:#C46F00}
.ev .t{font-family:var(--f-body);font-size:9.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.ev b{font-size:12.5px;font-weight:600}
.ev.off b{opacity:.45}
.ev .st{display:flex;gap:2px;margin-top:2px}
.ev .st button{flex:1;height:20px;border:1px solid var(--rule);background:var(--soft);border-radius:3px;font-size:11px;padding:0;color:var(--ink)}
.pwarn{left:50%;transform:translateX(-50%);bottom:8px;max-width:min(360px,40%);padding:4px 26px 4px 8px;font-size:10.5px;line-height:1.4;background:color-mix(in srgb,var(--kr-bg) 94%,transparent);border-color:color-mix(in srgb,var(--kr) 40%,transparent);cursor:pointer}
.pwarn b{display:block;font-family:var(--f-mono);font-size:10px;color:var(--kr)}
.pwarn .a{position:absolute;right:6px;top:4px;font-size:10px;color:var(--kr)}
.pwarn.min div{display:none}
.planbar{left:50%;top:8px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:5px 6px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 340px);border-color:var(--oil);border-top:3px solid var(--oil)}
.planbar b{font-size:12px;padding:0 4px}
.planbar .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:0 4px}
.conning{position:absolute;inset:0;z-index:4;background:var(--paper);overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-content:start}
.cn{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;border-top:3px solid var(--ac,var(--kr))}
.cn .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted)}
.cn .v{font-family:var(--f-mono);font-size:30px;font-weight:600;line-height:1.15;color:var(--ok)}
.cn .v small{font-size:13px;color:var(--muted);margin-left:4px}
.cn .s{font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.cn.big{grid-column:span 2;display:flex;gap:14px;align-items:center}
.cn svg{display:block}
.rotbar{height:12px;background:var(--soft);border-radius:6px;position:relative;margin-top:6px}
.rotbar i{position:absolute;top:0;bottom:0;background:var(--kr);border-radius:6px}
.rotbar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.standby{position:absolute;inset:0;z-index:6;background:rgba(10,18,24,.72);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
.standby b{font-family:var(--f-mono);font-size:22px;letter-spacing:.2em}
.loading{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;background:var(--paper);font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}

/* right panel */
.rp{background:var(--paper);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;min-width:0}
.rp-scroll{flex:1 1 0;min-height:0;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
.box{background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--ac,var(--kr));border-radius:6px;padding:6px 8px 7px}
.box.sens{--ac:var(--kr)} .box.helm{--ac:var(--oil)} .box.osf{--ac:var(--ov)} .box.rinfo{--ac:var(--gar)} .box.nav{--ac:var(--sew)}
.bh{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}
.bh b{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--ac);font-weight:600;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bh .ko{font-family:var(--f-body);letter-spacing:0;color:var(--muted);font-weight:500;margin-left:4px;text-transform:none}
.bh .fold{border:0;background:none;color:var(--muted);font-size:12px;padding:0 2px;line-height:1}
.box.folded .bb{display:none}
.box.folded .bh{margin-bottom:0}
.sr{display:grid;grid-template-columns:40px 1fr auto;align-items:baseline;gap:6px;padding:1px 2px;border-radius:4px;cursor:pointer}
.sr:hover{background:var(--soft)}
.sr .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:600}
.sr .v{font-family:var(--f-mono);font-size:17px;font-weight:600;color:var(--ok);text-align:right;white-space:nowrap;line-height:1.25}
.sr .v.dr{color:var(--warn)}
.sr .v.na{color:var(--muted)}
.sr .v small{font-size:11px;font-weight:500;margin-left:1px}
.sr .src{font-family:var(--f-mono);font-size:10px;color:var(--muted);min-width:30px}
.sr .src.dr{color:var(--warn);font-weight:600}
.sr.pos .v{font-size:13.5px;line-height:1.3}
.hr{display:grid;grid-template-columns:auto 1fr;gap:4px 6px;align-items:center}
.hr .lb{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-weight:600}
.stp{display:grid;grid-template-columns:28px 28px minmax(56px,1fr) 28px 28px;gap:3px;align-items:center}
.stp button{height:28px;border:1px solid var(--rule);background:var(--soft);border-radius:4px;font-family:var(--f-mono);font-size:11px;font-weight:600;padding:0;color:var(--ink);touch-action:manipulation}
.stp button:active{background:var(--kr-bg)}
.stp .val{height:28px;border:1px solid var(--oil);background:var(--oil-bg);color:var(--oil);border-radius:4px;font-family:var(--f-mono);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:ns-resize;white-space:nowrap;touch-action:none}
.tele{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin-top:3px}
.tele button{height:24px;border:1px solid var(--rule);background:var(--surface);border-radius:3px;font-size:9.5px;font-weight:600;padding:0;line-height:1;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center}
.tele button span{white-space:nowrap;letter-spacing:-.02em}
.tele button small{font-family:var(--f-mono);font-size:9px;font-weight:500;color:var(--muted)}
.tele button.on{background:var(--oil);color:#fff;border-color:var(--oil)}
.tele button.on small{color:#fff}
.hmode{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.hmode button{white-space:nowrap;border:0;background:var(--surface);font-family:var(--f-mono);font-size:10px;font-weight:600;padding:2px 7px;color:var(--ink)}
.hmode button.on{background:var(--oil);color:#fff}
.hmode button[disabled]{opacity:.4}
.simrow{display:flex;gap:2px;margin-top:5px;align-items:center}
.simrow .lb{font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-right:2px}
.simrow button{flex:1;height:24px;border:1px solid var(--rule);background:var(--surface);border-radius:3px;font-family:var(--f-mono);font-size:10.5px;font-weight:600;padding:0;color:var(--ink)}
.simrow button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ri{display:grid;grid-template-columns:1fr auto;gap:0 6px;font-size:11px;line-height:1.55}
.ri dt{color:var(--muted)}
.ri dd{margin:0;font-family:var(--f-mono);text-align:right;white-space:nowrap}
.ri dd.bad{color:var(--bad);font-weight:700}
.ri .sep{grid-column:1/-1;border-top:1px dashed var(--rule);margin:2px 0}
.osrow{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.pgnav{display:flex;align-items:center;gap:3px}
.pgnav button{height:22px;width:22px;border:1px solid var(--rule);background:var(--soft);border-radius:3px;font-size:11px;padding:0;color:var(--ink)}
.pgname{font-size:11.5px;font-weight:600;min-width:0;flex:1;text-align:center}
.fr{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11.5px;padding:2px 0}
.fr label{color:var(--muted)}
.fr select,.fr input[type=number]{height:24px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);padding:0 4px;font-family:var(--f-mono);font-size:11.5px;max-width:96px}
.sw{position:relative;width:34px;height:19px;border-radius:10px;background:var(--rule);border:0;padding:0;flex:0 0 auto}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.on{background:var(--sew)}
.sw.on::after{left:17px}
.tlist{max-height:180px;overflow:auto;font-size:11px;margin-top:4px;border-top:1px solid var(--soft)}
.tlist div{display:grid;grid-template-columns:1fr auto auto;gap:6px;padding:2px 2px;border-bottom:1px solid var(--soft);cursor:pointer;font-family:var(--f-mono)}
.tlist div:hover{background:var(--soft)}
.tlist div.bad{color:var(--bad);font-weight:600}
.tlist div.sel{background:var(--sew-bg)}

/* alert box */
.abox{flex:0 0 auto;margin:0 6px 6px;border-radius:6px;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:6px;align-items:center;padding:5px 6px;min-height:46px;background:var(--surface);border:1px solid var(--rule);cursor:pointer}
.abox .ic{width:30px;height:30px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-weight:700;font-size:13px;background:var(--soft);color:var(--muted)}
.abox .tx{min-width:0;font-size:11.5px;line-height:1.3}
.abox .tx b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:12.5px;overflow:hidden;line-height:1.25}
.abox .tx small{font-family:var(--f-mono);font-size:10px;opacity:.8}
.abox .rt{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.abox .cnt{font-family:var(--f-mono);font-size:11px;font-weight:600}
.abox .ack{height:24px;padding:0 8px;border-radius:4px;border:1px solid currentColor;background:transparent;font-family:var(--f-mono);font-size:10.5px;font-weight:700;color:inherit}
.abox.A{background:var(--bad);color:#fff;border-color:var(--bad)}
.abox.A .ic{background:rgba(255,255,255,.2);color:#fff}
.abox.A.blink{animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{background:color-mix(in srgb,var(--bad) 55%,var(--surface));}}
.abox.W{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.abox.W .ic{background:var(--warn);color:var(--surface)}
.abox.C{background:var(--warn-bg);color:var(--ink);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.abox.C .ic{background:#E8C83A;color:#12202A}
:root[data-theme="dark"] .abox.A{color:#0D1419}

/* popover / context / dialog */
.pop{position:fixed;z-index:40;min-width:170px;max-width:280px;background:var(--surface);border:1px solid var(--rule);border-radius:7px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;max-height:70vh;overflow:auto}
.pop button,.pop .pi{display:flex;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:5px;font-size:13px;gap:8px;align-items:center;color:var(--ink)}
.pop button:hover{background:var(--soft)}
.pop button.on{font-weight:700;color:var(--kr)}
.pop button.on::before{content:"●";font-size:8px}
.pop button[disabled]{opacity:.4;cursor:default}
.pop .hd{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);padding:6px 10px 2px;text-transform:uppercase}
.pop hr{border:0;border-top:1px solid var(--rule);margin:4px 2px}
.pop input[type=range]{width:100%;accent-color:var(--navy)}

.dlg{background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.dlg.wide{width:min(860px,100%)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--navy);color:var(--navy-ink)}
.dlg-h b{font-family:var(--f-disp);font-size:16px;font-weight:800}
.dlg-h small{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;opacity:.75;margin-left:8px}
.dlg-h button{border:0;background:none;color:inherit;font-size:20px;line-height:1;padding:0 4px}
.dlg-b{padding:12px 14px;overflow:auto;font-size:13.5px;flex:1 1 auto;min-height:0}
.dlg-h,.dlg-f{flex:0 0 auto}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--rule);flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);padding:7px 13px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
:root[data-theme="dark"] .btn.pri{background:#2B5A80;border-color:#2B5A80}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin:-4px 0 10px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:7px 10px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--kr)}
.form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center}
.form label{font-size:13px}
.form label small{display:block;font-size:11.5px;color:var(--muted)}
.form select,.form input[type=number],.form input[type=text]{height:32px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);padding:0 8px;font-family:var(--f-mono);font-size:13px;min-width:110px}
.form .seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.form .seg button{border:0;border-right:1px solid var(--rule);background:var(--paper);padding:6px 10px;font-size:12.5px}
.form .seg button:last-child{border-right:0}
.form .seg button.on{background:var(--ink);color:var(--paper);font-weight:600}
.form h5{grid-column:1/-1;margin:8px 0 0;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--kr);font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:5px 8px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap}
.tbl th{background:var(--soft);font-size:11.5px;font-weight:600;position:sticky;top:0}
.tbl td.m{font-family:var(--f-mono)}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--soft)}
.tbl tr.bad td{color:var(--bad)}
.tbl tr.sel td{background:var(--sew-bg)}
.tw{overflow:auto;border:1px solid var(--rule);border-radius:7px;max-height:56vh}
.prb{display:inline-block;width:18px;height:18px;border-radius:4px;text-align:center;font-family:var(--f-mono);font-size:11px;font-weight:700;line-height:18px}
.prb.A{background:var(--bad);color:#fff}.prb.W{background:var(--warn);color:var(--surface)}.prb.C{background:#E8C83A;color:#12202A}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.legend div{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:7px;padding:4px 8px 4px 4px;font-size:12.5px;line-height:1.35}
.legend canvas{width:68px;height:52px;flex:0 0 auto;border-radius:4px}
.legend small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.pick{display:grid;gap:8px}
.pick .it{border:1px solid var(--rule);border-radius:7px;padding:8px 10px;border-left:3px solid var(--gar)}
.pick .it b{font-size:13.5px}
.pick .it code{font-family:var(--f-mono);font-size:11px;color:var(--gar);margin-left:6px}
.pick .it dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:1px 12px;font-size:12.5px}
.pick .it dt{color:var(--muted)}
.pick .it dd{margin:0;font-family:var(--f-mono)}
.note{border-left:3px solid var(--warn);background:var(--warn-bg);padding:8px 12px;border-radius:0 6px 6px 0;font-size:12.5px;margin:10px 0}
.tbl.hm th{position:static;white-space:normal;vertical-align:top;width:30%;min-width:110px;font-size:12.5px;text-align:left}
.tbl.hm th small{display:block;font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:var(--muted)}
.tbl.hm td{white-space:normal;font-size:12.5px;line-height:1.55}
.help h4{margin:14px 0 6px;font-size:14px}
.help h4:first-child{margin-top:0}
.help ul{margin:0;padding-left:1.2em;font-size:13px}
.help li{margin:3px 0}
.help kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--soft)}
.chk{display:grid;gap:4px;margin-top:8px}
.chk div{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:6px 8px;border-radius:6px}
.chk .ok{background:var(--ok-bg);color:var(--ok)}
.chk .ng{background:var(--bad-bg);color:var(--bad)}
.chk .wn{background:var(--warn-bg);color:var(--warn)}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:90vw;text-align:center;animation:pop .2s ease-out}
.numin{display:flex;gap:8px;align-items:center}
.numin input{height:40px;font-size:20px;font-family:var(--f-mono);width:140px;text-align:center;border:1px solid var(--rule);border-radius:7px;background:var(--paper)}
.rotate-hint{position:fixed;inset:0;z-index:60;background:var(--navy);color:var(--navy-ink);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.rotate-hint svg{width:72px;height:72px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
.rotate-hint b{font-family:var(--f-disp);font-size:20px;font-weight:800}
.rotate-hint p{margin:0;font-size:14px;opacity:.85;max-width:20em}

/* footer (위키 공통) */
footer{padding-block:20px;font-size:12.5px;color:var(--muted)}
footer .ver-row{display:flex;justify-content:center;margin-top:12px}
footer .disclaimer{margin:12px 0 0;padding:10px 14px;border:1px solid var(--warn);background:var(--warn-bg);color:var(--ink);border-radius:7px;font-size:12.5px;line-height:1.6}
footer .disclaimer b{color:var(--warn);margin-right:6px}
footer .book{margin:10px 0 0;font-size:12.5px;line-height:1.7}
footer .book b{margin-right:8px}
.egg{position:fixed;inset:0;z-index:70;background:rgba(10,18,24,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.egg-card{background:#FFFFFF;color:#12202A;border-radius:14px;padding:26px 30px 24px;text-align:center;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .35s ease-out}
.egg-card img{width:100%;max-width:260px;display:block;margin:0 auto 10px}
.egg-card .ev{font-family:var(--f-mono);font-size:15px;font-weight:600}
.egg-card .eb{font-family:var(--f-disp);font-size:20px;font-weight:800;margin-top:4px}
.egg-card small{display:block;margin-top:14px;font-size:12px;color:#6B7A86}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
.toast{animation:none}

helpBody:`<h4>화면 구성</h4><ul><li><b>상태바(위)</b>: 표시 모드(전자해도/컨닝), 운용 모드 항해·해도관리·항로계획, 기타(새 시나리오·대기), 레이더 지우기, 해도만(누르고 있기), 표준 화면, 표시 기준(기본/표준/전체), 도움말, 설정, 시각(UTC/LT).</li><li><b>퀵 액세스 바(왼쪽)</b>: 모드별 기능 버튼과 공통 버튼(해도 정보, 표시, 기록, 주간/박명/야간 팔레트, 밝기, MOB, 캡처).</li><li><b>해도 영역</b>: 축척·표시 모드 상자(왼쪽 위), 커서 위치 상자(오른쪽 위), EBL·VRM 상자(아래), 영구 경고(아래 가운데).</li><li><b>오른쪽 정보창</b>: 센서 정보, 자선 조종(침로·속력), 자선 기능, 항로 정보, Overlay/NAV Tools, 경보 상자.</li></ul>
<h4>마우스 · 터치 조작</h4><ul><li>해도 끌기: 화면 이동 ('TM 리셋 꺼짐' 표시를 누르면 자선 기준으로 복귀)</li><li>휠 / 두 손가락 벌리기: 축척 변경</li><li>물표 누르기: 선택·활성화, 정보 카드 표시</li><li>오른쪽 클릭 / 길게 누르기: 상황 메뉴 (픽 리포트, 범례, 중앙 이동, EBL/VRM 지정)</li><li>EBL 선·VRM 원을 끌어 직접 조절, 아래 상자의 ◀ ▶ 또는 휠로 미세 조절, 상자를 눌러 켜고 끄기</li><li>설정 침로·속력 값: 누르면 숫자 입력, 위아래로 끌거나 휠로 조절, ± 버튼은 누르고 있으면 연속 변경</li></ul>
<h4>키보드</h4><ul><li><kbd>←</kbd><kbd>→</kbd> 침로 ±1° (<kbd>Shift</kbd> ±10°) · <kbd>↑</kbd><kbd>↓</kbd> 속력 ±0.5 kn</li><li><kbd>+</kbd><kbd>−</kbd> 축척 · <kbd>Space</kbd> 일시정지 · <kbd>A</kbd> 경보 확인(ACK) · <kbd>M</kbd> MOB · <kbd>C</kbd> 자선 중심 복귀 · <kbd>Esc</kbd> 닫기</li></ul>
<h4>연습 과제 예시</h4><ul><li>우현에서 접근하는 횡단선(CPA/TCPA 경보)을 찾아 피항하고 원래 항로로 복귀하기 (COLREG 제15·16조)</li><li>안전 등심선을 흘수에 맞게 바꾸고 Look-ahead 경보가 어떻게 달라지는지 확인하기</li><li>PLAN 모드에서 새 항로를 만들고 Route check로 위험을 찾은 뒤 NAVI에서 감시하기</li><li>표시 기준 BASE/STD/ALL과 Day/Dusk/Night 팔레트를 바꿔 보며 표시 차이 익히기</li></ul>
<h4>약어</h4><ul><li><b>CPA/TCPA</b> 최근접점 거리/도달시간 · <b>BCR/BCT</b> 선수 횡단 거리/시간 · <b>XTD</b> 항로 이탈 거리 · <b>WOP</b> 전타 시작점 · <b>CTS</b> 조타 침로 · <b>STW/SOG</b> 대수/대지 속력 · <b>TM/RM</b> 진운동/상대운동 · <b>EBL/VRM</b> 전자방위선/가변거리환</li></ul>`,

helpBody:`<h4>Screen layout</h4><ul><li><b>Status bar (top)</b>: display mode (ECDIS/CONNING), operating modes NAVI · CHARTS · PLAN, OTHERS (new scenario, SILENT), CLEAR RADAR, CHART ONLY (hold), STD DISP, display base (IMO BASE/STD/ALL), help, settings, time (UTC/LT).</li><li><b>Quick access bar (left)</b>: mode-specific buttons and common buttons (Chart INFO, DISP, Log, palette Day/Dusk/Night, brilliance, MOB, capture).</li><li><b>Chart area</b>: scale/presentation box (top left), cursor box (top right), EBL and VRM boxes (bottom), permanent warning (bottom centre).</li><li><b>Right panel</b>: sensors, own-ship helm (heading and speed), own-ship functions, route information, Overlay/NAV Tools, alert box.</li></ul>
<h4>Mouse & touch</h4><ul><li>Drag the chart to pan (tap “TM Reset off” to return to own ship)</li><li>Wheel / pinch: change scale</li><li>Tap a target: select and activate, shows the data card</li><li>Right-click / long-press: context menu (pick report, legend, centre, set EBL/VRM)</li><li>Drag the EBL line or VRM ring directly; fine-tune with ◀ ▶ or the wheel on the boxes below; tap a box to toggle it</li><li>Set heading/speed values: tap to type, drag up/down or use the wheel; hold ± buttons to repeat</li></ul>
<h4>Keyboard</h4><ul><li><kbd>←</kbd><kbd>→</kbd> heading ±1° (<kbd>Shift</kbd> ±10°) · <kbd>↑</kbd><kbd>↓</kbd> speed ±0.5 kn</li><li><kbd>+</kbd><kbd>−</kbd> scale · <kbd>Space</kbd> pause · <kbd>A</kbd> acknowledge · <kbd>M</kbd> MOB · <kbd>C</kbd> back to own ship · <kbd>Esc</kbd> close</li></ul>
<h4>Practice ideas</h4><ul><li>Find the crossing vessel from starboard (CPA/TCPA alarm), give way and return to the route (COLREG Rules 15 & 16)</li><li>Set the safety contour for your draught and watch how look-ahead alerts change</li><li>Build a new route in PLAN, find dangers with Route check, then monitor it in NAVI</li><li>Switch display base BASE/STD/ALL and Day/Dusk/Night palettes to learn the differences</li></ul>
<h4>Abbreviations</h4><ul><li><b>CPA/TCPA</b> closest point of approach / time to CPA · <b>BCR/BCT</b> bow crossing range/time · <b>XTD</b> cross-track distance · <b>WOP</b> wheel-over point · <b>CTS</b> course to steer · <b>STW/SOG</b> speed through water / over ground · <b>TM/RM</b> true/relative motion · <b>EBL/VRM</b> electronic bearing line / variable range marker</li></ul>`,

["표준 표시 ▾","IMO STD ▾","해도 표시 범위: 기본(해안선·안전등심선·고립장애물), 표준(+항로표지·구역), 전체(+수심 숫자·등심선·지명·등질).","Display base: BASE (coastline, safety contour, isolated dangers), STD (+ aids and areas), ALL (+ soundings, contours, names, light descriptions)."],
["? · ⚙","? · ⚙","도움말·시스템 정보와 설정(일반·자선·해도 표시·경보).","Help/system information and settings (general, own ship, chart display, alerts)."],
["날짜·시각","Date · time","누르면 UTC와 현지시(LT)를 바꿉니다. 시간은 시뮬레이션 배속에 따라 흐릅니다.","Tap to switch UTC and local time. Time runs at the simulation rate."],
["E (작동 표시기)","E (working indicator)","돌고 있으면 시스템이 정상 동작 중입니다. 일시정지·대기 중에는 멈춥니다.","Spins while the system runs; stops when paused or in standby."],
["정보창 버튼","Panel button","오른쪽 정보창을 숨기거나 보여 줍니다. 좁은 화면에서 해도를 넓게 볼 때 씁니다.","Hides or shows the right panel to give the chart more room."]]},
{ko:"퀵 액세스 바 (왼쪽) · 항해 모드",en:"Quick access bar (left) · NAVI",rows:[
["◀","◀","바를 좁게 접습니다. 접힌 바를 누르면 다시 펼칩니다.","Minimises the bar; tap the narrow bar to restore it."],
["항해·항로","Voyage","감시할 항로 선택, 항로 감시 중지, 감시 정보(남은 거리·ETA), 항로 계획으로 이동.","Select a route to monitor, stop monitoring, Monitor INFO (distance to go, ETA), go to planning."],
["물표","AIS/TT","모든 물표의 방위·거리·COG·SOG·CPA·TCPA 목록. 행을 누르면 그 물표를 선택합니다.","List of all targets with bearing, range, COG, SOG, CPA and TCPA; tap a row to select."],
["컨닝","Conning","선수방위 나침반, 속력, 선회율, 해류, 바람, 선저 여유수심, XTD를 큰 숫자로 보여 줍니다.","Large readouts: heading compass, speeds, rate of turn, current, wind, under-keel clearance, XTD."]]},
{ko:"퀵 액세스 바 · 항로계획 모드",en:"Quick access bar · PLAN",rows:[
["항로 계획","Planning","새 항로 만들기 또는 기존 항로 편집. 해도를 눌러 WPT 추가, 끌어서 이동, 길게 눌러 삭제·삽입·속성.","New route or edit an existing one. Tap to add WPTs, drag to move, long-press to delete, insert or edit properties."],
["보고서","Report","WPT별 위경도, 침로, 거리, 누적 거리, XTD, 선회 반경, 속력, ETA 표.","Table of WPT positions, courses, distances, totals, XTD, turn radius, speed and ETA."],
["항로 점검","Route Check","XTD 채널 안에 안전 등심선보다 얕은 곳, 육지, 위험물, 제한구역이 있는지 검사하고 해도에 빨간 원으로 표시합니다.","Checks each XTD channel for water shallower than the safety contour, land, hazards and restricted areas, and circles problems in red."],
["항로 관리","Manage Data","저장된 항로 목록. 감시 시작, 편집, 보고서, 삭제.","Saved routes: monitor, edit, report, delete."],
["되돌리기","Undo","항로 편집에서 마지막 작업을 취소합니다.","Undoes the last route edit."]]},
{ko:"퀵 액세스 바 · 해도관리 모드",en:"Quick access bar · CHARTS",rows:[
["자동 설치","AUTO Import","해도 셀 자동 설치 (시뮬레이터에는 가상 셀이 이미 설치됨).","Automatic chart installation (synthetic cells are pre-installed)."],
["해도 관리","Manage Charts","설치된 셀의 이름, 사용 대역, 편집 축척, 판·수정 번호, 발행일.","Installed cells: name, usage band, compilation scale, edition, update, issue date."],
["셀 상태","Cell Status","셀별 최신 여부.","Whether each cell is up to date."],
["라이선스 · 공개키","License · Public Key","셀 사용 허가(퍼밋)와 만료일, 가상 공개키.","Cell permits with expiry dates, and the synthetic public key."]]},
{ko:"퀵 액세스 바 · 공통",en:"Quick access bar · common",rows:[
["해도 정보","Chart INFO","자선 위치의 해도 범례(축척·측지계·안전등심선·셀 이름)와 Chart 1 기호 범례.","Chart legend at own ship (scale, datum, safety contour, cell) and the Chart 1 symbol legend."],
["표시","DISP","해도 표시 설정, 경보 설정, 거리환·자선 항적 켜고 끄기.","Chart display settings, alert settings, range rings and own track on/off."],
["기록","Log","이벤트 로그, 경보 로그, 6분 간격 항해 기록(위치·침로·속력).","Event log, alert log and 6-minute NAV log (position, course, speed)."],
["주간·박명·야간","Day · Dusk · Night","해도 색 팔레트를 바꿉니다. 화면 테마(라이트/다크)와 따로 설정됩니다.","Chart colour palette, independent of the light/dark page theme."],
["밝기","Brilliance","해도 밝기를 30~100%로 조절합니다.","Chart brightness, 30–100%."],
["MOB","MOB","현재 자선 위치에 익수자(MOB) 표시를 남기고 자선과 잇는 선을 그립니다.","Marks the man-overboard position and draws a line to own ship."],
["캡처","Capture","현재 해도 화면을 이미지로 만듭니다.","Captures the chart display as an image."]]},
{ko:"해도 영역",en:"Chart area",rows:[
["축척 상자","Scale box","− / + 로 축척 변경, 축척 숫자를 누르면 목록. 표시 모드 버튼은 누를 때마다 북쪽위·침로위·선수위·항로위와 진운동(TM)·상대운동(RM)을 바꾸고, ▾는 목록을 엽니다. R은 화면 반경(NM).","− / + changes scale; tap the scale for a list. The mode button cycles north/course/head/route up and true/relative motion; ▾ opens the list. R is the display radius in NM."],
["상태 표시","Status tags","축척 초과(편집 축척보다 크게 확대), TM 리셋 꺼짐/상대운동 해제(해도를 끌어 이동한 상태, 누르면 자선 기준으로 복귀).","Overscale (zoomed beyond compilation scale); TM Reset off / RM(OFF) after panning — tap to return to own ship."],
["축척 막대 · 격자","Scale bar · grid","왼쪽 세로 막대는 S-52 축척 막대(흑백 칸). 위경도 격자는 WGS84 기준이며 오른쪽·아래에 눈금이 붙습니다.","The left vertical bar is the S-52 scale bar. The lat/lon grid is WGS84 with labels on the right and bottom."],
["커서 상자","Cursor box","커서 위경도, 자선 기준 방위·거리(항정선), 도달 시간(TTG). 누르면 진방위(T)와 상대방위(R)를 바꿉니다.","Cursor position, rhumb-line bearing and range from own ship, TTG. Tap to switch true (T) and relative (R) bearing."],
["물표 카드","Target card","선택한 물표의 MMSI, 방위·거리, COG/SOG, CPA/TCPA, BCR/BCT, 항해 상태, 목적지. 활성·휴면 전환, 경보 확인, EBL/VRM을 물표에 맞추기.","Selected target: MMSI, bearing/range, COG/SOG, CPA/TCPA, BCR/BCT, status, destination. Activate/sleep, acknowledge, put EBL/VRM on it."],
["EBL · VRM","EBL · VRM","상자를 눌러 켜고 끔. ◀ ▶ 또는 휠로 미세 조절, 해도에서 선·원을 직접 끌어 조절.","Tap a box to toggle; fine-tune with ◀ ▶ or the wheel; drag the line or ring on the chart."],
["영구 경고","Permanent warning","해도 관련 상시 경고(비공식 해도). 누르면 접고 펼칩니다.","Standing chart warnings (non-official chart). Tap to collapse or expand."]]},
{ko:"오른쪽 정보창",en:"Right panel",rows:[
["센서 정보","Sensors","HDG(자이로), SPD(대수속력), COG·SOG·POSN(GPS). 위치 행을 누르면 GPS1·GPS2·추측항법(DR, 노란색)을 고릅니다.","HDG (gyro), SPD (STW), COG/SOG/POSN (GPS). Tap a position row to choose GPS1, GPS2 or DR (shown in yellow)."],
["자선 조종","Helm & engine","수동/자동(항로 추종), 설정 선수방위·속력, 기관 단계(정지~항해), 시뮬레이션 배속(×1~×32)과 일시정지.","Manual/auto (route following), set heading and speed, engine steps (stop to nav full), simulation rate ×1–×32 and pause."],
["자선 기능","Functions","오프셋(자선을 화면 아래쪽에 두어 전방을 넓게), WGS84(위경도로 이동), 자선 제원, TM 리셋 상태.","Offset (own ship lower on screen for a longer view ahead), WGS84 go-to, own ship data, TM reset status."],
["항로 정보","Route","감시 항로의 계획 속력·침로, 조타 침로, XTD와 한계, 목표 WPT, 전타점까지 거리·시간, 선회 반경·선회율, 다음 WPT·침로.","Monitored route: planned speed and course, course to steer, XTD and limit, To WPT, distance and time to WOP, turn radius and rate, next WPT and course."],
["오버레이·항해 도구","Overlay/NAV Tools","◀ ▶로 페이지 전환: TT•AIS(벡터 시간, CPA/TCPA 한계, 물표 목록), 거리환, 예측 위치, 자선 항적, Look-ahead(전방 검사 영역·안전 등심선).","Pages via ◀ ▶: TT•AIS (vector time, CPA/TCPA limits, list), range rings, predictor, past track, look-ahead (check area and safety contour)."],
["경보 상자","Alert box","가장 중요한 경보(알람 빨강·경고 주황·주의 노랑). 확인 버튼으로 승인, 상자를 누르면 경보 목록.","Highest-priority alert (alarm red, warning orange, caution yellow). ACK acknowledges; tap the box for the alert list."]]},
{ko:"상황 메뉴 (오른쪽 클릭 · 길게 누르기)",en:"Context menu (right-click · long-press)",rows:[
["물표 정보 · 활성","Target data · activate","커서 아래 물표를 선택하거나 활성·휴면으로 바꿉니다.","Selects the target under the cursor or toggles activate/sleep."],
["자선/커서를 중앙으로","Own ship / cursor to centre","화면 중앙을 자선 또는 누른 위치로 옮깁니다.","Centres the display on own ship or on the pressed position."],
["픽 리포트","Pick report","누른 위치의 해도 객체(S-57 코드와 속성), 수심구역, 수심, 물표 정보.","Chart objects at that point (S-57 class and attributes), depth area, sounding and targets."],
["해도 범례","Chart legend","그 위치의 축척·측지계·안전등심선·셀 이름·수심구역.","Scale, datum, safety contour, cell and depth area at that point."],
["EBL1/VRM1을 이 위치로","Set EBL1/VRM1 here","자선에서 그 위치까지 방위·거리에 EBL1·VRM1을 맞춥니다.","Puts EBL1 and VRM1 on the bearing and range to that point."]]}

/* ---- 실제 해안선 (Natural Earth 1:10m) ---- */
let COAST=null;
function decodeCoast(){
  if(COAST)return COAST;
  const bin=atob(COAST_B64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  let p=0;const rv=()=>{let v=0,s=0,b;do{b=u[p++];v+=(b&127)*Math.pow(2,s);s+=7}while(b&128);return v};
  const zz=v=>v%2?-(v+1)/2:v/2;
  const n=rv(),rings=[];
  for(let r=0;r<n;r++){const h=rv(),hole=h%2===1,cnt=(h-(hole?1:0))/2;let x=0,y=0;const pts=new Float64Array(cnt*2);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    for(let i=0;i<cnt;i++){x+=zz(rv());y+=zz(rv());const lo=x/500,la=y/500;pts[i*2]=lo;pts[i*2+1]=la;if(lo<x0)x0=lo;if(lo>x1)x1=lo;if(la<y0)y0=la;if(la>y1)y1=la}
    rings.push({hole,pts,x0,x1,y0,y1})}

  const polys=[];for(const r of rings){if(!r.hole||!polys.length)polys.push({rings:[r],x0:r.x0,x1:r.x1,y0:r.y0,y1:r.y1});else polys[polys.length-1].rings.push(r)}

/* 격자 노드의 육지 면적비(0~1)를 캔버스 래스터화로 구함. map(lon,lat)->[px,py] (노드 중심 = 픽셀 중심) */
function landCover(nx,ny,map,bb){
  const c=document.createElement("canvas");c.width=nx;c.height=ny;const g=c.getContext("2d",{willReadFrequently:true});
  g.fillStyle="#000";g.fillRect(0,0,nx,ny);g.fillStyle="#fff";
  for(const P of decodeCoast()){if(P.x1<bb.x0||P.x0>bb.x1||P.y1<bb.y0||P.y0>bb.y1)continue;
    g.beginPath();for(const r of P.rings){const a=r.pts;for(let i=0;i<a.length;i+=2){const[px,py]=map(a[i],a[i+1]);i?g.lineTo(px,py):g.moveTo(px,py)}g.closePath()}g.fill("evenodd")}
  const d=g.getImageData(0,0,nx,ny).data,out=new Float32Array(nx*ny);
  for(let r=0;r<ny;r++)for(let i=0;i<nx;i++)out[(ny-1-r)*nx+i]=d[(r*nx+i)*4]/255; // 행 0 = 남쪽

/* 대륙붕이 넓은 해역 (황해·동중국해, 순다 대륙붕, 통킹만, 대만해협) — 수심 근사용 */
const SHELF=[[23.2,41.5,116,127.3],[0,6.5,100,117.5],[6,13.8,100,110.5],[16.5,22.2,105.3,110.2],[21.5,26.5,116.5,121]];
function shelfW(lat,lon){let w=0;const ss=(e0,e1,v)=>{const t=clamp((v-e0)/(e1-e0),0,1);return t*t*(3-2*t)};
  for(const[a,b,c,d]of SHELF){const v=ss(a-1.2,a+.6,lat)*(1-ss(b-.6,b+1.2,lat))*ss(c-1.2,c+.6,lon)*(1-ss(d-.6,d+1.2,lon));if(v>w)w=v}return w}
function makeDepth(seed){
  const R=mulberry32(seed^0xA5A5),n1=makeNoise(R),n2=makeNoise(R);
  return(dist,lat,lon)=>{
    const w=shelfW(lat,lon),sw=14+240*w,sh=135-60*w,u=(lon-100)*55,v=lat*60;
    const nz=.82+.36*fbm(n1,u/40+3,v/40+7,4),bank=1-.35*Math.max(0,fbm(n2,u/9,v/9,3)-.55)*2.5;

/* 이방성 거리변환 (노드 간격 dx[j], dy) */
function chamferXY(land,nx,ny,dxRow,dy){
  const INF=1e9,d=new Float32Array(nx*ny);for(let k=0;k<d.length;k++)d[k]=land[k]?0:INF;
  for(let j=0;j<ny;j++){const dx=dxRow(j),dg=Math.hypot(dx,dy);for(let i=0;i<nx;i++){const k=j*nx+i;let v=d[k];if(!v)continue;if(i>0)v=Math.min(v,d[k-1]+dx);if(j>0){v=Math.min(v,d[k-nx]+dy);if(i>0)v=Math.min(v,d[k-nx-1]+dg);if(i<nx-1)v=Math.min(v,d[k-nx+1]+dg)}d[k]=v}}
  for(let j=ny-1;j>=0;j--){const dx=dxRow(j),dg=Math.hypot(dx,dy);for(let i=nx-1;i>=0;i--){const k=j*nx+i;let v=d[k];if(!v)continue;if(i<nx-1)v=Math.min(v,d[k+1]+dx);if(j<ny-1){v=Math.min(v,d[k+nx]+dy);if(i<nx-1)v=Math.min(v,d[k+nx+1]+dg);if(i>0)v=Math.min(v,d[k+nx-1]+dg)}d[k]=v}}

const depthFrom=(c,z)=>c>=.5?-1.2-(c-.5)*36:c>0?-1.2+(.5-c)*2*(z+1.2):z;
function genWorld(seed){

  {const a=route[0],b=route[1],L=Math.hypot(b[0]-a[0],b[1]-a[1]),ux=(b[0]-a[0])/L,uy=(b[1]-a[1])/L;

            if(depthAtW(W,qx,qy)>12&&latPos.every(p=>Math.hypot(p[0]-qx,p[1]-qy)>1.6)&&latPos.length<14){latPos.push([qx,qy]);

    const vs=+(d-rnd(R,2,9)).toFixed(1);add({cls:"WRECKS",x,y,valsou:Math.max(1.5,vs),cat:"STD"});c++}

  // 정박지

    for(let a=0;a<8;a++){const x=cx+Math.sin(a*TAU/8+.39)*rr,y=cy+Math.cos(a*TAU/8+.39)*rr;poly.push([x,y]);if(!(depthAtW(W,x,y)>14))ok=false}

    for(let i=1;i<=st.ringN;i++){const r=i*st.ringInt*k;if(r>Math.hypot(w,h))break;ctx.beginPath();ctx.arc(ox,oy,r,0,TAU);ctx.stroke();ctx.fillText((i*st.ringInt).toFixed(st.ringInt<1?1:0),ox+3,oy-r-6)}ctx.setLineDash([])}

function drawRoutes(ctx,P){
  const draw=(wps,col,plan,active,toWp)=>{
    if(!wps.length)return;const k=VM.k;const pts=wps.map(p=>w2s(p.x,p.y));
    // XTD 채널
    if(!plan||S.mode==="PLAN"){ctx.save();ctx.strokeStyle=col;ctx.globalAlpha=.55;ctx.lineWidth=1;ctx.setLineDash([3,4]);
      for(let i=1;i<wps.length;i++){const A=wps[i-1],B=wps[i],L=Math.hypot(B.x-A.x,B.y-A.y)||1,nx=-(B.y-A.y)/L,ny=(B.x-A.x)/L,xt=B.xtd;
        for(const sg of[-1,1]){const p0=w2s(A.x+nx*xt*sg,A.y+ny*xt*sg),p1=w2s(B.x+nx*xt*sg,B.y+ny*xt*sg);ctx.beginPath();ctx.moveTo(...p0);ctx.lineTo(...p1);ctx.stroke()}}ctx.restore()}
    ctx.strokeStyle=col;ctx.lineWidth=active?2.4:2;ctx.setLineDash(plan?[10,6]:[]);ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ctx.setLineDash([]);
    ctx.font=`10.5px ${FONT_M}`;
    pts.forEach((p,i)=>{ctx.beginPath();ctx.arc(p[0],p[1],5.5,0,TAU);ctx.lineWidth=active&&i===toWp?2.6:1.6;ctx.fillStyle=PAL[S.set.palette].depdw;ctx.fill();ctx.stroke();
      if(VM.k>4){ctx.fillStyle=col;ctx.textAlign="left";ctx.fillText(String(i+1),p[0]+8,p[1]-8)}
      if(i>0&&VM.k>15){const A=wps[i-1],B=wps[i];const brg=norm360(Math.atan2(B.x-A.x,B.y-A.y)*R2D);const m=[(pts[i-1][0]+p[0])/2,(pts[i-1][1]+p[1])/2];const L=Math.hypot(p[0]-pts[i-1][0],p[1]-pts[i-1][1]);if(L>90){ctx.save();ctx.translate(m[0],m[1]);let an=Math.atan2(p[1]-pts[i-1][1],p[0]-pts[i-1][0]);if(an>Math.PI/2||an<-Math.PI/2)an+=Math.PI;ctx.rotate(an);ctx.textAlign="center";ctx.fillStyle=col;ctx.fillText(brg.toFixed(1)+"°",0,-7);ctx.restore()}}});
    // WOP 표시
    if(active&&toWp<wps.length-1){const A=wps[toWp-1],B=wps[toWp],C=wps[toWp+1];const b1=Math.atan2(B.x-A.x,B.y-A.y),b2=Math.atan2(C.x-B.x,C.y-B.y);const dc=Math.abs(angDiff(b2*R2D,b1*R2D));const dw=B.rad*Math.tan(dc/2*D2R);const x=B.x-Math.sin(b1)*dw,y=B.y-Math.cos(b1)*dw;const[sx,sy]=w2s(x,y);const an=scrAng(b1*R2D);ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx-Math.cos(an)*9,sy-Math.sin(an)*9);ctx.lineTo(sx+Math.cos(an)*9,sy+Math.sin(an)*9);ctx.stroke()}
  };
  S.routes.forEach((r,ri)=>{
    const mon=S.monRoute===ri,edit=S.plan.editing&&S.plan.ri===ri;
    if(edit)return;
    if(mon)draw(r.wps,PAL[S.set.palette].route,false,true,S.toWp);
    else if(S.mode==="PLAN"&&S.plan.ri===ri)draw(r.wps,PAL[S.set.palette].routePlan,true,false,-1);
  });
  if(S.plan.editing)draw(S.plan.wps,PAL[S.set.palette].routePlan,true,false,-1);
}
function drawOwn(ctx,P){
  const o=S.own,k=VM.k,st=S.set;const[x,y]=w2s(o.x,o.y);
  ctx.strokeStyle=P.own;ctx.fillStyle=P.own;
  // 예측
  if(st.predictor){let px=o.x,py=o.y,hd=o.hdg;const dt=10/3600;const n=st.predTime*6;ctx.save();ctx.globalAlpha=.55;ctx.lineWidth=1;
    for(let i=1;i<=n;i++){hd+=o.rot*10;const v=o.stw;px+=(v*Math.sin(hd*D2R)+S.cur.vx)*dt;py+=(v*Math.cos(hd*D2R)+S.cur.vy)*dt;if(i%6===0){const[sx,sy]=w2s(px,py);drawShipOutline(ctx,sx,sy,hd,Math.max(14,o.L/1852*k),Math.max(5,o.B/1852*k),false)}}ctx.restore()}
  // 벡터 (대지)
  const vl=o.sog*st.vecTime/60;const ang=scrAng(o.cog);const vx=x+Math.sin(ang)*vl*k,vy=y-Math.cos(ang)*vl*k;
  ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(vx,vy);ctx.stroke();
  for(let m=1;m<st.vecTime;m++){const d=o.sog*m/60*k;const tx=x+Math.sin(ang)*d,ty=y-Math.cos(ang)*d;ctx.beginPath();ctx.moveTo(tx-Math.cos(ang)*4,ty-Math.sin(ang)*4);ctx.lineTo(tx+Math.cos(ang)*4,ty+Math.sin(ang)*4);ctx.stroke()}
  if(vl*k>12)for(const off of[0,6]){ctx.save();ctx.translate(vx-Math.sin(ang)*off,vy+Math.cos(ang)*off);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(-4,6);ctx.lineTo(0,0);ctx.lineTo(4,6);ctx.stroke();ctx.restore()}
  // 선수선
  const ha=scrAng(o.hdg);const hl=Math.max(40,o.L/1852*k*1.4);
  const Lp=o.L/1852*k,Bp=o.B/1852*k;
  ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.sin(ha)*hl,y-Math.cos(ha)*hl);ctx.stroke();
  if(Lp>=22){drawShipOutline(ctx,x,y,o.hdg,Lp,Bp,true);ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,2.5,0,TAU);ctx.stroke()}
  else{ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(x,y,5.5,0,TAU);ctx.stroke();ctx.beginPath();ctx.arc(x,y,10,0,TAU);ctx.stroke();
    ctx.save();ctx.translate(x,y);ctx.rotate(ha);ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(10,0);ctx.stroke();ctx.restore()}
}
function drawShipOutline(ctx,x,y,hdg,L,B,fill){
  ctx.save();ctx.translate(x,y);ctx.rotate(scrAng(hdg));ctx.beginPath();
  ctx.moveTo(0,-L/2);ctx.quadraticCurveTo(B/2,-L/2+L*.18,B/2,-L/2+L*.32);ctx.lineTo(B/2,L/2);ctx.lineTo(-B/2,L/2);ctx.lineTo(-B/2,-L/2+L*.32);ctx.quadraticCurveTo(-B/2,-L/2+L*.18,0,-L/2);ctx.closePath();
  ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
}
function drawAIS(ctx,t,P,flash){
  const[x,y]=w2s(t.x,t.y);if(!onScr(x,y,60))return;
  const dang=t.dang&&!t.lost,col=dang?P.danger:P.ais;
  if(dang&&!t.dangAck&&!flash)return;
  ctx.strokeStyle=col;ctx.fillStyle=col;
  const act=t.act||dang,hd=t.sog<.3&&t.nav===1?t.hdg:t.hdg,ang=scrAng(hd);
  const k=VM.k,Lp=t.L/1852*k;
  // 과거 위치
  if(act&&S.set.tgtPast){ctx.fillStyle=col;for(const p of t.hist){const[px,py]=w2s(p[0],p[1]);ctx.beginPath();ctx.arc(px,py,1.8,0,TAU);ctx.fill()}}
  // 벡터
  if(act&&!t.lost){const vl=t.sog*S.set.vecTime/60*k,ca=scrAng(t.cog);ctx.lineWidth=dang?2:1.4;ctx.setLineDash([5,3]);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.sin(ca)*vl,y-Math.cos(ca)*vl);ctx.stroke();ctx.setLineDash([])}

  if(act&&Lp>=22){ctx.restore();drawShipOutline(ctx,x,y,hd,Lp,t.B/1852*k);ctx.save();ctx.translate(x,y);ctx.rotate(ang)}
  const s=act?1.25:.9;
  ctx.beginPath();ctx.moveTo(0,-11*s);ctx.lineTo(5.5*s,7*s);ctx.lineTo(-5.5*s,7*s);ctx.closePath();
  if(t.nav===1&&!act){ctx.globalAlpha=.25;ctx.fill();ctx.globalAlpha=1}
  ctx.stroke();
  if(act&&!t.lost){ctx.beginPath();ctx.moveTo(0,-11*s);ctx.lineTo(0,-30);ctx.stroke();
    if(Math.abs(t.rot)>.05){ctx.beginPath();ctx.moveTo(0,-30);ctx.lineTo(t.rot>0?7:-7,-30);ctx.stroke()}}

  ctx.restore();

  if(act&&S.set.tgtLabel){ctx.font=`10px ${FONT_M}`;ctx.fillStyle=col;ctx.textAlign="left";ctx.fillText(t.name,x+12,y+14)}
}

function genTraffic(R){
  const o=S.own,W=S.sc.W;S.tgts=[];S.ttN=1;TID=1;

    const crs=norm360(o.hdg+crossAng+rnd(R,-15,15));const tv=[sp*Math.sin(crs*D2R),sp*Math.cos(crs*D2R)];
    const meet=[o.x+ov[0]*T,o.y+ov[1]*T];const off=rnd(R,-cpaOff,cpaOff);const px=meet[0]-tv[0]*T+Math.cos(crs*D2R)*off,py=meet[1]-tv[1]*T-Math.sin(crs*D2R)*off;

  // TSS 통항선

    addTarget(R,{type:"fishing",kind:R()<.55?"TT":"AIS",x,y,cog:rnd(R,0,360),sog:rnd(R,2,6),beh:"fish"});i++}

}

function rhumb(x1,y1,x2,y2){const P=S.sc.W.P,la1=P.lat(y1)*D2R,la2=P.lat(y2)*D2R,dl=(P.lon(x2)-P.lon(x1))*D2R,dp=la2-la1,dq=mercM(la2*R2D)-mercM(la1*R2D);

function fmtLat(y){const v=toLat(y),a=Math.abs(v),d=Math.floor(a),m=(a-d)*60;return`${String(d).padStart(2,"0")}°${m.toFixed(3).padStart(6,"0")}'${v>=0?"N":"S"}`}
function fmtLon(x){const v=toLon(x),a=Math.abs(v),d=Math.floor(a),m=(a-d)*60;return`${String(d).padStart(3,"0")}°${m.toFixed(3).padStart(6,"0")}'${v>=0?"E":"W"}`}

/* ---------- CPA/TCPA ---------- */
function cpaCalc(t){
  const o=S.own,ovx=o.sog*Math.sin(o.cog*D2R),ovy=o.sog*Math.cos(o.cog*D2R);
  const tvx=t.sog*Math.sin(t.cog*D2R),tvy=t.sog*Math.cos(t.cog*D2R);
  const rx=t.x-o.x,ry=t.y-o.y,vx=tvx-ovx,vy=tvy-ovy,v2=vx*vx+vy*vy;
  let tc=v2<1e-6?Infinity:-(rx*vx+ry*vy)/v2;const T=isFinite(tc)?tc:0;
  const cpa=Math.hypot(rx+vx*T,ry+vy*T);
  // BCR/BCT
  const ux=Math.sin(o.cog*D2R),uy=Math.cos(o.cog*D2R),rn=rx*uy-ry*ux,vn=vx*uy-vy*ux;let bcr=null,bct=null;
  if(Math.abs(vn)>1e-6){const tb=-rn/vn;if(tb>0){const ra=(rx+vx*tb)*ux+(ry+vy*tb)*uy;if(ra>0){bcr=ra;bct=tb}}}
  return{cpa,tcpa:isFinite(tc)?tc*60:null,rng:Math.hypot(rx,ry),brg:brgTo(o.x,o.y,t.x,t.y),bcr,bct:bct!=null?bct*60:null};
}

/* ---------- 경보 ---------- */
const PRI={A:3,W:2,C:1};
function setAlert(id,on,pri,key,args){

  if(on){
    if(!a){a={id,pri,key,args:args||[],t:S.time,ack:false,active:true};S.alerts.push(a);S.alog.unshift({t:S.time,pri,key,args:a.args,ev:"on"});if(S.alog.length>200)S.alog.pop();if(pri!=="C")buzz(pri,true);uiAlertChanged=true}
    else{a.args=args||a.args;if(!a.active){a.active=true;a.ack=false;a.t=S.time;S.alog.unshift({t:S.time,pri,key,args:a.args,ev:"on"});if(pri!=="C")buzz(pri,true);uiAlertChanged=true}}
  }else if(a&&a.active){a.active=false;S.alog.unshift({t:S.time,pri:a.pri,key:a.key,args:a.args,ev:"off"});if(a.ack)S.alerts=S.alerts.filter(x=>x!==a);uiAlertChanged=true}
}
function ackAlert(a){if(!a)return;a.ack=true;if(a.id==="cpa")S.tgts.forEach(t=>{if(t.dang)t.dangAck=true});if(!a.active)S.alerts=S.alerts.filter(x=>x!==a);uiAlertChanged=true}
function topAlert(){return S.alerts.slice().sort((a,b)=>(a.ack-b.ack)||(PRI[b.pri]-PRI[a.pri])||(b.t-a.t))[0]||null}
function logEv(key,args){S.evlog.unshift({t:S.time,key,args:args||[]});if(S.evlog.length>300)S.evlog.pop()}

/* ---------- 항로 감시 ---------- */
function routeMon(){
  const r=S.routes[S.monRoute];if(!r||r.wps.length<2){S.rinfo=null;return}
  const o=S.own,w=r.wps;
  if(S.toWp<1)S.toWp=1;if(S.toWp>w.length-1)S.toWp=w.length-1;
  let i=S.toWp,A=w[i-1],B=w[i];
  let L=Math.hypot(B.x-A.x,B.y-A.y),ux=(B.x-A.x)/L,uy=(B.y-A.y)/L;
  let dx=o.x-A.x,dy=o.y-A.y,along=dx*ux+dy*uy,xtd=dx*uy-dy*ux,remain=L-along;
  const legBrg=brgTo(A.x,A.y,B.x,B.y);
  let next=null,wopD=0;
  if(i<w.length-1){const C=w[i+1];const nb=brgTo(B.x,B.y,C.x,C.y);const dc=Math.abs(angDiff(nb,legBrg));wopD=B.rad*Math.tan(dc/2*D2R);next={i:i+1,brg:nb,dc}}
  let distWop=remain-wopD;
  if(next&&distWop<=0){S.toWp++;logEv("evWpt",[i+1]);return routeMon()}
  const ttg=o.sog>.1?distWop/o.sog:Infinity;
  if(!next&&remain<.15){logEv("evEor",[r.name]);setAlert("eor",true,"C","alEor",[r.name]);S.monRoute=null;S.rinfo=null;if(S.helm==="AUTO")S.helm="MAN";return}
  // course to steer
  const gc=norm360(legBrg-clamp(Math.atan2(xtd,.7)*R2D,-40,40));
  let cts=gc;if(o.stw>1){const nx=Math.cos(gc*D2R),ny=-Math.sin(gc*D2R),cn=S.cur.vx*nx+S.cur.vy*ny;cts=norm360(gc+Math.asin(clamp(-cn/o.stw,-.7,.7))*R2D)}
  const turnRate=o.sog>0?o.sog/B.rad*R2D/60:0;
  S.rinfo={name:r.name,i,plan:legBrg,spd:B.spd,cts,xtdLim:B.xtd,xtd,distWop,ttg,rad:B.rad,turnRate,next,remainTot:remain+w.slice(i).reduce((s,p,j,arr)=>j?s+Math.hypot(p.x-arr[j-1].x,p.y-arr[j-1].y):s,0)};
  setAlert("offtrack",Math.abs(xtd)>B.xtd,"A","alOff",[]);
  setAlert("wop",!!next&&ttg*3600<60&&ttg>=0,"W","alWop",[i+1]);

/* ---------- look-ahead / 해도 경보 ---------- */
function pip(x,y,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[xi,yi]=poly[i],[xj,yj]=poly[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}

function lookAhead(){
  const o=S.own,W=S.sc.W,st=S.set,L=Math.max(.15,o.sog*st.lookTime/60),wd=st.lookWidth+o.B/1852/2;
  const ux=Math.sin(o.cog*D2R),uy=Math.cos(o.cog*D2R),nx=uy,ny=-ux;
  S.lookPoly=[[o.x-nx*wd,o.y-ny*wd],[o.x+ux*L-nx*wd,o.y+uy*L-ny*wd],[o.x+ux*L+nx*wd,o.y+uy*L+ny*wd],[o.x+nx*wd,o.y+ny*wd]];
  const sc=safetyLevel(st.safetyContour);let cross=false,minD=1e9;
  const nA=Math.max(4,Math.ceil(L/.04));
  for(let a=0;a<=nA;a++)for(const s of[-1,-.5,0,.5,1]){const x=o.x+ux*L*a/nA+nx*wd*s,y=o.y+uy*L*a/nA+ny*wd*s,d=depthAtW(W,x,y);if(d<minD)minD=d;if(d<sc)cross=true}
  S.lookAlarm=cross;

  const hz=[];for(const ob of S.sc.objs){if(ob.valsou!=null&&ob.valsou<sc&&pip(ob.x,ob.y,S.lookPoly))hz.push(ob)}
  S.hazHits=hz;setAlert("hazard",hz.length>0,"W","alHaz",[hz.length]);
  let area=null;for(const ob of S.sc.objs){if(ob.poly&&(pip(ob.poly[0][0],ob.poly[0][1],S.lookPoly)||S.lookPoly.some(p=>pip(p[0],p[1],ob.poly))||pip(o.x,o.y,ob.poly))){area=ob;break}}
  if(!area&&S.sc.tss){const tp=tssPoly(S.sc.tss);if(S.lookPoly.some(p=>pip(p[0],p[1],tp)))area={cls:"TSSLPT"}}
  setAlert("area",!!area,"C","alArea",[area?area.cls:""]);
  // 좌초
  const dHere=depthAtW(W,o.x,o.y);
  if(!(dHere>o.draft)&&!o.grounded){o.grounded=true;o.stw=0;o.setSpd=0;o.rot=0;setAlert("ground",true,"A","alGround",[]);logEv("evGround",[]);onGround()}
}

/* ---------- 메인 스텝 ---------- */
function step(dt){ // dt: 초(모의시간)
  const o=S.own,dh=dt/3600;
  S.time+=dt*1000;
  if(!o.grounded){
    if(S.helm==="AUTO"&&S.rinfo){o.setHdg=S.rinfo.cts}
    const err=angDiff(o.setHdg,o.hdg),sp=Math.abs(o.stw);
    const maxRot=(.05+.5*clamp(sp/10,0,1))*(o.L>220?.8:1);
    const want=clamp(err*.1,-maxRot,maxRot);
    o.rot+=(want-o.rot)*Math.min(1,dt/7);
    o.hdg=norm360(o.hdg+o.rot*dt);
    const dv=o.setSpd-o.stw;o.stw+=clamp(dv,-.035*dt,.045*dt);
  }else{o.stw=0;o.rot=0}
  const vx=o.stw*Math.sin(o.hdg*D2R)+(o.grounded?0:S.cur.vx),vy=o.stw*Math.cos(o.hdg*D2R)+(o.grounded?0:S.cur.vy);
  o.x+=vx*dh;o.y+=vy*dh;o.sog=Math.hypot(vx,vy);o.cog=o.sog>.05?norm360(Math.atan2(vx,vy)*R2D):o.hdg;o.odo+=o.sog*dh;
  // 항적
  if(S.time-S.lastTrack>=10000){S.lastTrack=S.time;const m=(Math.floor(S.time/60000)!==Math.floor((S.time-10000)/60000));o.track.push({x:o.x,y:o.y,m});const max=S.set.pastLen*6;while(o.track.length>max)o.track.shift();
    if(!o.grounded&&depthAtW(S.sc.W,o.x,o.y)>o.draft+3)o.lastSafe={x:o.x,y:o.y,hdg:o.hdg}}
  // 물표
  for(const t of S.tgts)stepTarget(t,dt);
  // 상실 이벤트
  if(S.time>S.nextLost){S.nextLost=S.time+rint(S.R,300,720)*1000;const c=S.tgts.filter(t=>t.kind==="AIS"&&!t.lost&&t.id!==S.sel&&Math.hypot(t.x-o.x,t.y-o.y)<9);if(c.length&&S.R()<.6){const t=pick(S.R,c);t.lost=true;t.lostT=S.time;t.act=true;logEv("evLost",[t.name])}}
  S.tgts=S.tgts.filter(t=>{if(t.lost&&S.time-t.lostT>240000){if(S.sel===t.id)S.sel=null;return false}const d=Math.hypot(t.x-o.x,t.y-o.y);if(d>19||!(depthAtW(S.sc.W,t.x,t.y)>1)){if(S.sel===t.id)S.sel=null;return false}return true});
  if(S.tgts.length<15&&S.R()<dt/40)respawn();
}
function stepTarget(t,dt){
  const R=S.R,dh=dt/3600;
  if(t.lost)return;
  t.chk-=dt;
  if(t.chk<=0){t.chk=10+R()*10;
    if(t.beh==="transit"){if(!pathClear(t.x,t.y,t.want,Math.max(1.5,t.sog*.12))){const c=clearCourse(t.x,t.y,t.want+(R()<.5?30:-30));if(c!=null)t.want=c}}
    else if(t.beh==="fish"){t.want=norm360(t.want+rnd(R,-40,40));t.sog=clamp(t.sog+rnd(R,-1,1),1.5,7);if(!pathClear(t.x,t.y,t.want,.6)){const c=clearCourse(t.x,t.y,t.want+180);if(c!=null)t.want=c}}
    else if(t.beh==="anchor"){t.want=norm360(t.want+rnd(R,-8,8))}
    else if(t.beh==="tss"){/* 차선 유지 */}
    if(t.act||Math.hypot(t.x-S.own.x,t.y-S.own.y)<12){t.hist.push([t.x,t.y]);if(t.hist.length>10)t.hist.shift()}
  }
  const err=angDiff(t.want,t.hdg),mr=t.beh==="anchor"?.05:t.type==="fishing"?1.5:.5;
  t.rot=clamp(err*.08,-mr,mr);t.hdg=norm360(t.hdg+t.rot*dt);
  t.cog=t.beh==="anchor"?t.hdg:norm360(t.hdg+(t.beh==="fish"?0:1.2));
  const sp=t.beh==="anchor"?.05:t.sog;if(t.beh==="anchor")t.sog=.05;
  t.x+=sp*Math.sin(t.cog*D2R)*dh;t.y+=sp*Math.cos(t.cog*D2R)*dh;
}
function respawn(){
  const R=S.R,o=S.own;
  for(let tries=0;tries<40;tries++){const a=R()*TAU,r=rnd(R,11,15),x=o.x+Math.sin(a)*r,y=o.y+Math.cos(a)*r;if(!waterOK(x,y,22,1))continue;
    const toward=brgTo(x,y,o.x,o.y)+rnd(R,-70,70);const c=clearCourse(x,y,toward);if(c==null)continue;
    addTarget(R,{type:pick(R,["cargo","tanker","container","passenger"]),kind:R()<.1?"TT":"AIS",x,y,cog:c,beh:"transit"});return}
}
function targetsCPA(){
  const st=S.set,now=new Set();let nearest=null;
  for(const t of S.tgts){
    if(t.kind==="TT"&&Math.hypot(t.x-S.own.x,t.y-S.own.y)>st.ttRange){t.dang=false;continue}
    const c=cpaCalc(t);t.c=c;
    const d=!t.lost&&c.cpa<st.cpa&&c.tcpa!=null&&c.tcpa>=0&&c.tcpa<st.tcpa;
    if(d){now.add(t.id);if(!t.dang){t.dangAck=false;if(st.autoAct)t.act=true}if(!nearest||c.tcpa<nearest.c.tcpa)nearest=t}
    t.dang=d;
  }
  const newOnes=[...now].some(id=>!S.dangSet.has(id));
  S.dangSet=now;
  const a=S.alerts.find(x=>x.id==="cpa");
  if(a&&newOnes&&a.ack){a.ack=false;a.t=S.time;buzz("A",true);uiAlertChanged=true}
  setAlert("cpa",now.size>0,"A","alCpa",nearest?[nearest.name,now.size]:[]);
  const lost=S.tgts.filter(t=>t.lost);
  setAlert("lost",lost.length>0,"W","alLost",lost.length?[lost[0].name]:[]);
}

let popEl=null;

function openPop(anchor,items,opt={}){
  closePop();const p=document.createElement("div");p.className="pop";
  p.innerHTML=items.map((it,i)=>it==="-"?"<hr>":it.hd?`<div class="hd">${esc(it.hd)}</div>`:it.html?`<div class="pi">${it.html}</div>`:`<button data-i="${i}"${it.on?' class="on"':""}${it.dis?" disabled":""}>${esc(it.label)}</button>`).join("");
  document.body.appendChild(p);popEl=p;
  let x,y;if(anchor&&!anchor.getBoundingClientRect&&!(isFinite(anchor.x)&&isFinite(anchor.y)))anchor={x:innerWidth/2,y:innerHeight/3};if(anchor&&anchor.getBoundingClientRect){const r=anchor.getBoundingClientRect();x=opt.side?r.right+4:r.left;y=opt.side?r.top:r.bottom+4}else{x=anchor.x;y=anchor.y}
  const pw=p.offsetWidth,ph=p.offsetHeight;x=clamp(x,6,innerWidth-pw-6);if(y+ph>innerHeight-6)y=Math.max(6,innerHeight-ph-6);p.style.left=x+"px";p.style.top=y+"px";
  p.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(!b)return;const it=items[+b.dataset.i];if(!it.keep)closePop();it.fn&&it.fn()});
  p.addEventListener("pointerdown",e=>e.stopPropagation());
  if(opt.onMount)opt.onMount(p);

}

let AC=null;
function buzz(pri,force){
  if(!S.set||!S.set.buzzer||S.standby)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
    const n=pri==="A"?3:1;for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain();o.type="square";o.frequency.value=pri==="A"?1900:1300;g.gain.value=.0001;o.connect(g);g.connect(AC.destination);const t0=AC.currentTime+i*.22;g.gain.setValueAtTime(.05,t0);g.gain.setValueAtTime(.0001,t0+.12);o.start(t0);o.stop(t0+.14)}}catch(e){}
}

function adjust(k,d){

  else if(k==="spd")o.setSpd=clamp(Math.round((o.setSpd+d)*10)/10,-6,25);
  else if(k.startsWith("ebl")){const E=S.ebl[+k[3]];E.on=true;E.brg=norm360(Math.round((E.brg+d*.5)*10)/10)}
  else if(k.startsWith("vrm")){const V=S.vrm[+k[3]];V.on=true;const st=V.r<1?.01:V.r<5?.05:.1;V.r=clamp(Math.round((V.r+d*st)*1000)/1000,.01,48)}
  upd();return true;
}

/* ---------- 해도 포인터 조작 ---------- */
function initChartInput(){
  const cv=$("#cvOver"),ptr=new Map();let g=null,lp=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  const hitTarget=(x,y)=>{let best=null,bd=22;for(const tg of S.tgts){if(S.clearRadar)break;if(tg.kind==="TT"&&Math.hypot(tg.x-S.own.x,tg.y-S.own.y)>S.set.ttRange)continue;const[sx,sy]=w2s(tg.x,tg.y);const d=Math.hypot(sx-x,sy-y);if(d<bd){bd=d;best=tg}}return best};
  const hitWp=(x,y)=>{if(!S.plan.editing)return -1;let bi=-1,bd=16;S.plan.wps.forEach((p,i)=>{const[sx,sy]=w2s(p.x,p.y);const d=Math.hypot(sx-x,sy-y);if(d<bd){bd=d;bi=i}});return bi};
  const hitEV=(x,y)=>{const o=S.own,[ox,oy]=w2s(o.x,o.y),r=Math.hypot(x-ox,y-oy);
    for(let i=0;i<2;i++){const V=S.vrm[i];if(V.on&&Math.abs(r-V.r*VM.k)<10)return{k:"vrm",i}}
    for(let i=0;i<2;i++){const E=S.ebl[i];if(!E.on||r<25)continue;const b=E.ref==="H"?o.hdg+E.brg:E.brg,a=scrAng(b);const px=Math.sin(a),py=-Math.cos(a);const along=(x-ox)*px+(y-oy)*py,perp=Math.abs((x-ox)*py-(y-oy)*px);if(along>0&&perp<9)return{k:"ebl",i}}
    return null};
  cv.addEventListener("contextmenu",e=>{e.preventDefault();const[x,y]=pos(e);ctxMenu(x,y,e.clientX,e.clientY)});
  cv.addEventListener("pointerdown",e=>{
    try{cv.setPointerCapture(e.pointerId)}catch(er){}const p=pos(e);ptr.set(e.pointerId,p);
    if(AC&&AC.state==="suspended")AC.resume();
    if(ptr.size===2){clearTimeout(lp);const[a,b]=[...ptr.values()];g={type:"pinch",d0:Math.hypot(a[0]-b[0],a[1]-b[1]),k0:S.view.k,mid:[(a[0]+b[0])/2,(a[1]+b[1])/2]};return}
    if(e.button===2)return;
    const wi=hitWp(...p),ev=hitEV(...p);
    if(wi>=0){S.plan.undo.push(S.plan.wps.map(w=>({...w})));g={type:"wp",i:wi,p0:p,moved:false}}
    else if(ev)g={type:"ev",ev,p0:p,moved:false};
    else g={type:"pan",p0:p,last:p,moved:false};
    const touch=e.pointerType!=="mouse";
    clearTimeout(lp);lp=setTimeout(()=>{if(g&&!g.moved&&ptr.size===1){g.lp=true;if(g.type==="wp")S.plan.undo.pop();ctxMenu(p[0],p[1],e.clientX,e.clientY,wi)}},touch?520:700);
  });
  cv.addEventListener("pointermove",e=>{
    const p=pos(e);
    if(e.pointerType==="mouse"&&!ptr.size){const[wx,wy]=s2w(...p);S.cursor={x:wx,y:wy,valid:true};S.touchCursor=false}
    if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,p);
    if(!g)return;
    if(g.type==="pinch"&&ptr.size>=2){const[a,b]=[...ptr.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);setK(g.k0*d/g.d0,g.mid);return}
    if(!g.moved&&Math.hypot(p[0]-g.p0[0],p[1]-g.p0[1])>7){g.moved=true;clearTimeout(lp)}
    if(!g.moved)return;
    if(g.type==="pan"){const[a,b]=s2w(...g.last),[c,d]=s2w(...p);S.view.cx-=c-a;S.view.cy-=d-b;S.view.free=true;g.last=p}
    else if(g.type==="wp"){const[wx,wy]=s2w(...p);const w=S.plan.wps[g.i];w.x=wx;w.y=wy}
    else if(g.type==="ev"){const o=S.own,[wx,wy]=s2w(...p);if(g.ev.k==="vrm")S.vrm[g.ev.i].r=Math.max(.01,Math.hypot(wx-o.x,wy-o.y));else{const E=S.ebl[g.ev.i];const b=brgTo(o.x,o.y,wx,wy);E.brg=E.ref==="H"?norm360(b-o.hdg):b}}
  });
  const end=e=>{
    const had=ptr.has(e.pointerId);ptr.delete(e.pointerId);clearTimeout(lp);
    if(!had||!g)return;
    if(g.type==="pinch"){if(ptr.size===0)g=null;else g={type:"none"};return}
    if(e.type==="pointerup"&&!g.moved&&!g.lp&&e.button!==2)tap(...pos(e),e.pointerType);
    if(g.type==="wp"&&!g.moved)S.plan.undo.pop();
    g=null;
  };
  cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
  cv.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse"&&!ptr.size)S.cursor.valid=S.touchCursor;});
  cv.addEventListener("wheel",e=>{e.preventDefault();zoomStep(e.deltaY<0?1:-1,pos(e))},{passive:false});
  const tap=(x,y,pt)=>{
    const[wx,wy]=s2w(x,y);S.cursor={x:wx,y:wy,valid:true};S.touchCursor=pt!=="mouse";
    if(S.plan.editing&&S.mode==="PLAN"){S.plan.undo.push(S.plan.wps.map(w=>({...w})));S.plan.wps.push({x:wx,y:wy,xtd:.3,rad:.6,spd:12});return}
    const tg=hitTarget(x,y);
    if(tg){S.sel=tg.id;if(tg.kind==="AIS")tg.act=true}else S.sel=null;
  };
}
function ctxMenu(x,y,cx,cy,wi=-1){

  const tg=(()=>{let best=null,bd=22;for(const t_ of S.tgts){const[sx,sy]=w2s(t_.x,t_.y);const d=Math.hypot(sx-x,sy-y);if(d<bd){bd=d;best=t_}}return best})();
  if(tg){items.push({hd:tg.name},{label:t("tgtData"),fn:()=>{S.sel=tg.id;tg.act=true}},tg.kind==="AIS"?{label:tg.act?t("sleep"):t("activate"),fn:()=>{tg.act=!tg.act}}:null,"-");}
  items.push({label:t("ownCenter"),fn:()=>{S.view.free=false;S.view.cx=S.own.x;S.view.cy=S.own.y}},
    {label:t("curCenter"),fn:()=>{S.view.free=true;S.view.cx=wx;S.view.cy=wy}},

    {label:t("legendHere"),fn:()=>dlgPick(x,y,true)},
    {label:t("eblvrmHere"),fn:()=>{const o=S.own;S.ebl[0].on=true;S.ebl[0].ref="T";S.ebl[0].brg=brgTo(o.x,o.y,wx,wy);S.vrm[0].on=true;S.vrm[0].r=Math.hypot(wx-o.x,wy-o.y)}});

  if(S.mode==="PLAN"&&!S.plan.editing)items.push("-",{label:t("newRoute"),fn:()=>startEdit(-1)});
  openPop({x:cx,y:cy},items.filter(Boolean));

function routeCheck(wps){
  const res=[],marks=[],W=S.sc.W,sc=safetyLevel(S.set.safetyContour);
  for(let i=1;i<wps.length;i++){
    const A=wps[i-1],B=wps[i],L=Math.hypot(B.x-A.x,B.y-A.y),ux=(B.x-A.x)/L,uy=(B.y-A.y)/L,nx=uy,ny=-ux,xt=B.xtd;
    let bad=null,land=false,n=Math.max(4,Math.ceil(L/.04));
    for(let a=0;a<=n&&!land;a++)for(const s of[-1,-.5,0,.5,1]){const x=A.x+ux*L*a/n+nx*xt*s,y=A.y+uy*L*a/n+ny*xt*s,d=depthAtW(W,x,y);if(!(d>=sc)){if(!bad)bad={x,y,d};if(d<0||isNaN(d)){land=true;bad={x,y,d};break}}}
    const hz=S.sc.objs.filter(o=>o.valsou!=null&&o.valsou<sc&&distSeg(o.x,o.y,[A.x,A.y],[B.x,B.y])<=xt);
    const ar=S.sc.objs.filter(o=>o.poly&&o.cls==="RESARE"&&[0,.25,.5,.75,1].some(f=>pip(A.x+(B.x-A.x)*f,A.y+(B.y-A.y)*f,o.poly)));
    if(bad){res.push({lv:"ng",txt:t(land?"chkLand":"chkSafe",[i,i+1,sc])});marks.push(bad)}
    hz.forEach(h=>{res.push({lv:"ng",txt:t("chkHaz",[i,i+1,clsName(h.cls),h.valsou])});marks.push(h)});
    ar.forEach(a=>{res.push({lv:"wn",txt:t("chkArea",[i,i+1,LANG==="ko"?a.name:a.nameEn])})});
    if(!bad&&!hz.length&&!ar.length)res.push({lv:"ok",txt:t("chkOk",[i,i+1])});
    if(i<wps.length-1){const C=wps[i+1],dc=Math.abs(angDiff(brgTo(B.x,B.y,C.x,C.y),brgTo(A.x,A.y,B.x,B.y))),wd=B.rad*Math.tan(dc/2*D2R);if(wd>L*.5)res.push({lv:"wn",txt:t("chkTurn",[i+1])})}
  }
  return{res,marks};
}
