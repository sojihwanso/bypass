<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>항해계기학 폭탄문제</title>
<meta name="description" content="항해계기학 시험범위 300문항을 퀴즈로 풀고 랭킹으로 경쟁하는 사이트">
<link rel="canonical" href="https://teambypass.vercel.app/tools/ra006">
<meta property="og:type" content="website">
<meta property="og:url" content="https://teambypass.vercel.app/tools/ra006">
<meta property="og:title" content="항해계기학 폭탄문제">
<meta property="og:description" content="자기컴퍼스 · 자이로컴퍼스 · 레이더 300문항 퀴즈, 10초 폭탄 모드와 닉네임 랭킹">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Gothic:wght@700;800&display=swap">
<style>
/* Layout: navy chart-room bar on top, one centered 640px column (toast → setup → question → result → ranking), chapter colors tag each question. */
:root{
  --paper:#F3F6F7; --surface:#FFFFFF; --ink:#12202A; --muted:#566571; --rule:#D3DBE0; --soft:#E8EEF1;
  --navy:#173B57; --navy-ink:#FFFFFF; --pri:#173B57; --pri-ink:#FFFFFF;
  --c2:#93530F; --c2-bg:#FBF1E4;   /* 2강 자기컴퍼스 */
  --c3:#17705F; --c3-bg:#E3F3EF;   /* 3강 자이로컴퍼스 */
  --r1:#4752A0; --r1-bg:#EAECF8;   /* 레이더의 이해 */
  --r2:#4A5864; --r2-bg:#EBEFF2;   /* 레이더 실제 활용 */
  --ok:#1E7A3C; --ok-bg:#E3F4E8; --bad:#B3261E; --bad-bg:#FBE7E5; --warn:#8A5A00; --warn-bg:#FBF0D9;
  --kr:#1F5E8C; --kr-bg:#E8F0F7;
  --f-disp:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1419; --surface:#141E25; --ink:#E3EAEE; --muted:#93A2AD; --rule:#25333D; --soft:#1A262E;
  --navy:#0F2A3F; --navy-ink:#E3EAEE; --pri:#2B5A80; --pri-ink:#FFFFFF;
  --c2:#E3A55C; --c2-bg:#2A1F12; --c3:#5BC4AE; --c3-bg:#10261F; --r1:#9EA8F2; --r1-bg:#1A1D33; --r2:#A9B6C0; --r2-bg:#1B252C;
  --ok:#6BD18A; --ok-bg:#12291A; --bad:#F2867E; --bad-bg:#2E1513; --warn:#E8BC5E; --warn-bg:#2B2210; --kr:#86BCE6; --kr-bg:#122230; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1419; --surface:#141E25; --ink:#E3EAEE; --muted:#93A2AD; --rule:#25333D; --soft:#1A262E;
  --navy:#0F2A3F; --navy-ink:#E3EAEE; --pri:#2B5A80; --pri-ink:#FFFFFF;
  --c2:#E3A55C; --c2-bg:#2A1F12; --c3:#5BC4AE; --c3-bg:#10261F; --r1:#9EA8F2; --r1-bg:#1A1D33; --r2:#A9B6C0; --r2-bg:#1B252C;
  --ok:#6BD18A; --ok-bg:#12291A; --bad:#F2867E; --bad-bg:#2E1513; --warn:#E8BC5E; --warn-bg:#2B2210; --kr:#86BCE6; --kr-bg:#122230; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--r1);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.disp{font-family:var(--f-disp);font-weight:800;letter-spacing:-.01em}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--navy);color:var(--navy-ink)}
header.top .bar{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:11px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand b{font-family:var(--f-disp);font-size:19px;font-weight:800;white-space:nowrap}
.brand span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;opacity:.7;white-space:nowrap}
.ver{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;opacity:.8;white-space:nowrap;border:0;background:none;color:inherit;cursor:pointer;user-select:none;padding:4px 6px;border-radius:5px}
.ver:hover{opacity:1}
header .ver{margin-left:auto;background:rgba(255,255,255,.12);padding:3px 9px;border-radius:5px}
.navlink{background:none;border:0;color:inherit;font-size:13.5px;opacity:.85;cursor:pointer;padding:5px 9px;border-radius:6px;white-space:nowrap}
.navlink:hover{opacity:1;background:rgba(255,255,255,.1)}
@media (max-width:420px){.brand span{display:none}}

main{padding-block:24px 40px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--rule);background:var(--surface);padding:10px 16px;border-radius:8px;cursor:pointer;font-size:15px;font-weight:500;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:600}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}

/* setup */
.hero h1{font-size:clamp(28px,7vw,38px);line-height:1.2}
.hero p{margin:8px 0 0;color:var(--muted);font-size:14.5px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:4px;white-space:nowrap}
.tL2{color:var(--c2);background:var(--c2-bg)} .tL3{color:var(--c3);background:var(--c3-bg)} .tR1{color:var(--r1);background:var(--r1-bg)} .tR2{color:var(--r2);background:var(--r2-bg)}
.tStar{color:var(--warn);background:var(--warn-bg)}
.grp{display:grid;gap:8px}
.grp + .grp{margin-top:18px}
.grp label.h{font-size:13px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--rule);background:var(--paper);padding:12px 6px;cursor:pointer;font-size:14.5px;line-height:1.3;min-height:52px}
.seg button:last-child{border-right:0}
.seg button small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.seg button.on{background:var(--ink);color:var(--paper);font-weight:600}
.seg button.on small{color:var(--paper);opacity:.75}
.summary{margin-top:18px;padding:12px 14px;border-radius:8px;background:var(--soft);font-size:14px}
.summary b{font-weight:600}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.clock{font-family:var(--f-mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--soft);padding:5px 11px;border-radius:7px}
.clock.idle{color:var(--muted);font-weight:500;font-size:12.5px}
.prog{height:4px;background:var(--soft);border-radius:2px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--pri);transition:width .25s}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.qtext{font-size:18px;font-weight:600;line-height:1.55;margin:14px 0 16px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:9px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;line-height:1.5;min-height:48px;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt i{font-style:normal;font-family:var(--f-mono);font-size:12px;width:24px;height:24px;flex:none;border-radius:50%;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;margin-top:0}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right i{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong i{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.explain{margin-top:14px;padding:12px 14px;border-radius:8px;font-size:14.5px}
.explain.ok{background:var(--ok-bg)} .explain.no{background:var(--bad-bg)}
.explain b{display:block;margin-bottom:2px}
.explain.ok b{color:var(--ok)} .explain.no b{color:var(--bad)}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;align-items:center}
.score-line{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}

/* 10s fuse */
.fuse{margin-top:14px;display:flex;align-items:center;gap:10px}
.fuse-track{position:relative;flex:1;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.fuse-track i{position:absolute;inset:0 auto 0 0;background:var(--warn);border-radius:4px}
.fuse.hot .fuse-track i{background:var(--bad)}
.fuse-n{font-family:var(--f-mono);font-weight:600;font-size:15px;width:36px;text-align:right;font-variant-numeric:tabular-nums}
.fuse.hot .fuse-n{color:var(--bad)}
.bomb{width:34px;height:34px;flex:none}
.fuse.hot .bomb{animation:jitter .12s infinite}
.fuse.wait .fuse-track i{width:100%!important;background:var(--rule)}
@keyframes jitter{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-1px,1px) rotate(-4deg)}50%{transform:translate(1px,-1px) rotate(3deg)}75%{transform:translate(-1px,0) rotate(-2deg)}100%{transform:translate(0,0)}}

/* explosion */
.boom{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(10,8,6,.62);cursor:pointer;overflow:hidden}
.boom canvas{position:absolute;inset:0;width:100%;height:100%}
.boom .flash{position:absolute;left:50%;top:45%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:radial-gradient(circle,#FFF6D6 0%,#FFC34D 35%,#E8571E 65%,rgba(232,87,30,0) 72%);animation:flash .7s ease-out forwards}
@keyframes flash{0%{transform:scale(1);opacity:1}60%{opacity:1}100%{transform:scale(60);opacity:0}}
.boom-card{position:relative;text-align:center;color:#FFFFFF;max-width:360px;animation:pop .45s .15s cubic-bezier(.2,1.6,.4,1) both}
.boom-card .pung{font-family:var(--f-disp);font-weight:800;font-size:76px;line-height:1;color:#FFC34D;text-shadow:0 4px 0 #B3261E,0 0 30px rgba(255,140,40,.6)}
.boom-card .fail{font-family:var(--f-mono);font-size:12px;letter-spacing:.18em;margin-top:14px;opacity:.85}
.boom-card .taunt{font-family:var(--f-disp);font-weight:800;font-size:21px;line-height:1.45;margin-top:6px}
.boom-card small{display:block;margin-top:14px;font-size:12px;opacity:.7}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-8px,4px)}30%{transform:translate(7px,-5px)}45%{transform:translate(-6px,-3px)}60%{transform:translate(5px,4px)}75%{transform:translate(-3px,2px)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* toast */
.veil{position:fixed;inset:0;z-index:30;background:rgba(10,18,24,.45);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.toast{background:#FFFFFF;color:#12202A;border-radius:14px;padding:24px 24px 20px;max-width:360px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.28);animation:pop .35s ease-out;display:grid;gap:4px}
.toast .t1{font-family:var(--f-disp);font-weight:800;font-size:22px;color:#173B57}
.toast .t2{font-size:15px;line-height:1.6;color:#3E4C57}
.toast .btn{margin-top:16px;background:#173B57;color:#FFFFFF;border-color:#173B57;font-weight:600}
.toast .compass{width:40px;height:40px;margin-bottom:6px}

/* result */
.big{font-family:var(--f-disp);font-size:56px;font-weight:800;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.stat{background:var(--soft);border-radius:8px;padding:10px 12px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-size:17px;font-variant-numeric:tabular-nums}
.nick{display:flex;gap:8px;margin-top:16px}
.nick input{flex:1;min-width:0;padding:11px 13px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);font-size:15px}
.note{font-size:13px;margin-top:8px}
.note.ok{color:var(--ok)} .note.bad{color:var(--bad)}
.review{display:grid;gap:8px;margin-top:12px}
.rv{border:1px solid var(--rule);border-radius:8px;padding:11px 13px;font-size:14px;background:var(--paper)}
.rv .q{font-weight:600}
.rv .y{color:var(--bad)} .rv .c{color:var(--ok)}
details.fold summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
details.fold[open] summary::after{transform:rotate(-135deg)}

/* ranking */
.rk-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer;min-height:34px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rk{margin-top:12px;display:grid}
.rk-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--soft);font-size:14.5px}
.rk-row:last-child{border-bottom:0}
.rk-row .n{font-family:var(--f-mono);font-weight:600;color:var(--muted);text-align:center}
.rk-row.top1 .n{color:var(--warn)} .rk-row.top2 .n,.rk-row.top3 .n{color:var(--ink)}
.rk-row .who{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-row .who small{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
.rk-row .sc,.rk-row .tm{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13.5px}
.rk-row .tm{color:var(--muted);min-width:64px;text-align:right}
.rk-row.me{background:var(--kr-bg);border-radius:6px}
.empty{padding:22px 12px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--rule);border-radius:8px;margin-top:12px}

footer{padding-block:12px 28px;text-align:center}
footer .ver{color:var(--muted)}
footer p{margin:0 0 6px;font-size:12px;color:var(--muted)}
.egg{position:fixed;inset:0;z-index:50;background:rgba(10,18,24,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:pointer}
.egg-card{background:#FFFFFF;color:#12202A;border-radius:14px;padding:26px 30px 24px;text-align:center;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .35s ease-out}
.egg-card img{width:100%;max-width:280px;display:block;margin:0 auto 10px}
.egg-card .ev{font-family:var(--f-mono);font-size:15px;font-weight:600}
.egg-card .eb{font-family:var(--f-disp);font-size:20px;font-weight:800;margin-top:4px}
.egg-card small{display:block;margin-top:14px;font-size:12px;color:#6B7A86}
.boom-card img{width:150px;max-width:100%;display:block;margin:0 auto 6px;border-radius:50%;background:#FFFFFF;padding:6px;box-shadow:0 0 0 4px rgba(255,195,77,.5)}
.dl{display:grid;gap:8px;margin-top:12px}
.dl-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--rule);border-radius:9px;background:var(--paper)}
.dl-row .ext{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-align:center;padding:9px 0;border-radius:6px}
.dl-row .ext.pdf{color:var(--bad);background:var(--bad-bg)} .dl-row .ext.json{color:var(--kr);background:var(--kr-bg)}
.dl-row b{display:block;font-size:14.5px}
.dl-row small{display:block;font-size:12.5px;color:var(--muted);line-height:1.45}
.dl-row .btn{min-height:38px;padding:7px 13px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="bar">
  <button class="brand" id="home" type="button" aria-label="처음 화면"><b>항해계기학 폭탄문제</b><span>COMPASS · GYRO · RADAR</span></button>
  <button class="navlink" id="toRank" type="button">랭킹</button>
  <button class="ver" type="button" aria-label="버전 1.1.1">v. 1.1.1</button>
</div></header>

<main class="wrap" id="app"></main>

<footer class="wrap"><p>2강 자기컴퍼스 · 3강 자이로컴퍼스 · 레이더 · 300문항</p><button class="ver" type="button" aria-label="버전 1.1.1">v. 1.1.1</button></footer>

<div class="veil" id="toast" role="dialog" aria-modal="true" aria-labelledby="toastT">
  <div class="toast">
    <svg class="compass" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="#173B57" stroke-width="2"/><path d="M20 5 L24 20 L20 35 L16 20 Z" fill="#E8EEF1" stroke="#173B57" stroke-width="1.2"/><path d="M20 5 L24 20 L16 20 Z" fill="#B3261E"/><circle cx="20" cy="20" r="2" fill="#173B57"/></svg>
    <div class="t1" id="toastT">항해계기학 퀴즈</div>
    <div class="t2">항해계기학 시험범위 공부를 퀴즈로 신나게 풀어보세요.</div>
    <button class="btn block" id="toastGo" type="button">시작</button>
  </div>
</div>

<script>

async function sbFetch(path,opt={}){

    const better=!old||rec.c>old.c||(rec.c===old.c&&rec.ms<old.ms);
    if(better)best[key]=rec;
    await ref.set({nick,best});
    return better?"랭킹에 등록했습니다.":"닉네임을 바꿨습니다. 이전 기록이 더 좋아 기록은 그대로 둡니다.";
  }
  if(SB.on){
    const better=await sbFetch("rpc/ra006_submit",{method:"POST",body:JSON.stringify({p_player:playerId(),p_nick:nick,p_mode:key,p_correct:rec.c,p_total:rec.n,p_ms:rec.ms})});
    await sbLoad();
    return better?"랭킹에 등록했습니다.":"닉네임을 바꿨습니다. 이전 기록이 더 좋아 기록은 그대로 둡니다.";
  }
  RK.local.push({k:key,nick,...rec});RK.local=RK.local.sort((a,b)=>b.c-a.c||a.ms-b.ms).slice(0,200);store.set("localRank",RK.local);
  return "이 기기에 기록했습니다.";
}

/* ---------- explosion ---------- */
let boomTimer=null;
function explode(){
  if(S.locked)return; S.locked=true; S.ans[S.i]=-1; S.qStart=null; S.timeouts++;
  if(S.i===S.list.length-1)S.tEnd=Date.now();

  o.innerHTML=`<canvas></canvas><div class="flash"></div><div class="boom-card"><div class="pung">펑!</div><div class="fail">TIME OVER · 실패</div><div class="taunt">${TAUNTS[Math.floor(Math.random()*TAUNTS.length)]}</div><small>화면을 누르면 계속합니다</small></div>`;
  document.body.appendChild(o);
  document.getElementById("app").classList.add("shake");
  burst(o.querySelector("canvas"));
  o.onclick=closeBoom;
  boomTimer=setTimeout(closeBoom,2600);
}
function closeBoom(){
  clearTimeout(boomTimer);
  const o=document.querySelector(".boom"); if(o)o.remove();
  document.getElementById("app").classList.remove("shake");
  if(!S)return; S.locked=false; showAnswered();
}
function burst(cv){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const dpr=Math.min(2,devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;
  const g=cv.getContext("2d");g.scale(dpr,dpr);
  const cx=W/2,cy=H*.45,cols=["#FFC34D","#FF8A2B","#E8571E","#B3261E","#FFF2C2","#5A4A3A"];
  const P=Array.from({length:110},()=>{const a=Math.random()*Math.PI*2,s=3+Math.random()*11;return{x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,r:2+Math.random()*5,c:cols[Math.floor(Math.random()*cols.length)],life:1}});
  const t0=performance.now();
  (function f(t){
    const dt=(t-t0)/1000; if(dt>2||!cv.isConnected)return;
    g.clearRect(0,0,W,H);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.vx*=.985;p.life-=.012;if(p.life<=0)return;g.globalAlpha=Math.max(0,p.life);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r*p.life+.5,0,Math.PI*2);g.fill()});
    g.globalAlpha=1;requestAnimationFrame(f);
  })(t0);
}

let dlApi;const dlReady=(async()=>{try{dlApi=window.claude?.use?await claude.use("downloads"):null}catch(e){dlApi=null}})();
function bindDl(){app.querySelectorAll("[data-dl]").forEach(b=>b.onclick=async()=>{

    note.className="note ok";note.textContent=name+" 저장을 요청했습니다.";
  }catch(e){
    note.className="note bad";note.textContent=e&&e.code==="declined"?"저장을 취소했습니다.":"내려받지 못했습니다. 잠시 뒤 다시 눌러 보세요.";
  }finally{b.disabled=false}
})}

/* ---------- easter egg ---------- */
const VERSION="1.1.1";
let eggN=0,eggT=null;
document.querySelectorAll(".ver").forEach(b=>b.addEventListener("click",()=>{eggN++;clearTimeout(eggT);eggT=setTimeout(()=>eggN=0,1500);if(eggN>=5){eggN=0;showEgg()}}));
function showEgg(){
  if(document.querySelector(".egg"))return;
  const o=document.createElement("div");o.className="egg";o.setAttribute("role","dialog");o.setAttribute("aria-label","Made by \"Bypass\"");
  o.innerHTML=`<div class="egg-card"><img src="${MASCOT}" alt="폭탄을 보고 놀라 뛰는 주황색 새 캐릭터"><div class="ev">Ver.${VERSION}</div><div class="eb">Made by &quot;Bypass&quot;</div><small>아무 곳이나 누르면 닫힙니다</small></div>`;
  const close=()=>{o.remove();document.removeEventListener("keydown",k)};const k=e=>{if(e.key==="Escape")close()};
  o.addEventListener("click",close);document.addEventListener("keydown",k);document.body.appendChild(o);
}

/* ---------- boot ---------- */
document.getElementById("home").onclick=()=>{if(S&&!S.tEnd&&S.ans.some(a=>a!==null)){if(document.getElementById("quitAsk"))return askQuit()}S=null;vSetup()};
document.getElementById("toRank").onclick=()=>{if(S&&document.getElementById("quitAsk")&&S.ans.some(a=>a!==null))return askQuit();S=null;vSetup();setTimeout(()=>document.getElementById("rankCard")?.scrollIntoView({behavior:"smooth"}),50)};
vSetup();
document.getElementById("toastGo").onclick=()=>{document.getElementById("toast").remove();document.getElementById("go")?.focus()};
