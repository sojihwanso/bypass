      <h1 id="page-title">계정 만들기</h1>
      <p>칸 네 개면 끝. 만들고 나면 커뮤니티로 바로 가요.</p>

        <input class="in" id="f-id" name="username" type="text" required maxlength="20"
               autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"
               aria-describedby="f-id-hint">
        <p class="hint" id="f-id-hint">영문 소문자, 숫자, 밑줄(_)로 4~20자. 나중에 못 바꿔요.</p>

        <label class="field-label" for="f-pw">비밀번호</label>
        <div class="pw">
          <input class="in" id="f-pw" name="password" type="password" required minlength="8"
                 autocomplete="new-password" aria-describedby="f-pw-hint">
          <button type="button" class="pw-toggle" data-pw-toggle aria-controls="f-pw" aria-pressed="false">보기</button>
        </div>
        <p class="hint" id="f-pw-hint">8자 이상. 잊어버리면 <a href="https://open.kakao.com/o/snJ3HuTi" target="_blank" rel="noopener">카카오톡 문의 창구</a>로 알려 주세요.</p>

        <label class="field-label" for="f-pw2">비밀번호 확인</label>
        <div class="pw">
          <input class="in" id="f-pw2" name="password_confirm" type="password" required minlength="8"
                 autocomplete="new-password" aria-describedby="f-pw2-hint">
          <button type="button" class="pw-toggle" data-pw-toggle aria-controls="f-pw2" aria-pressed="false">보기</button>
        </div>
        <p class="hint" id="f-pw2-hint" data-pw-match aria-live="polite">같은 비밀번호를 한 번 더 적어 주세요.</p>

        <label class="field-label" for="f-name">이름 또는 별명</label>
        <input class="in" id="f-name" name="display_name" type="text" required maxlength="20"
               autocomplete="nickname" aria-describedby="f-name-hint">
        <p class="hint" id="f-name-hint">커뮤니티에서 이 이름으로 보여요. 20자 이내.</p>

        <label class="crew-check">
          <input type="checkbox" id="f-crew" aria-controls="crew-fields" aria-expanded="false">
          <span><b>크루 합류 신청도 같이 할게요</b><small>국원이 되면 회의실·안건에 참여하고 같이 만들어요. 운영진이 보고 연락드려요.</small></span>

          <input class="in" id="f-contact" maxlength="100" type="text" autocomplete="email" placeholder="이메일 또는 전화번호" aria-describedby="f-contact-hint">
          <p class="hint" id="f-contact-hint">합류 안내할 때만 써요.</p>
          <label class="field-label" for="f-major">학과 <span class="opt">(선택)</span></label>
          <input class="in" id="f-major" maxlength="60" type="text" autocomplete="organization-title">
          <label class="field-label" for="f-want">만들어 보고 싶은 것</label>

<script>
(async function () {
  const B = window.BYPASS;
  const form = document.getElementById('join-form');
  const idInput = document.getElementById('f-id');
  const pwInput = document.getElementById('f-pw');
  const pw2Input = document.getElementById('f-pw2');
  const matchHint = form.querySelector('[data-pw-match]');
  const nameInput = document.getElementById('f-name');
  const errorBox = form.querySelector('.form-error');
  // 크루 합류 신청 (체크하면 가입 뒤 submit_application 을 계정과 이어서 냄: supabase/001)
  const crew = document.getElementById('f-crew'), crewBox = document.getElementById('crew-fields');
  const contactInput = document.getElementById('f-contact'), majorInput = document.getElementById('f-major'), wantInput = document.getElementById('f-want');
  const wantCrew = new URLSearchParams(location.search).get('crew') === '1';
  function syncCrew() {
    crewBox.hidden = !crew.checked; crew.setAttribute('aria-expanded', String(crew.checked));
    submit.textContent = crew.checked ? '가입하고 합류 신청하기' : '가입하기';
  }
  crew.addEventListener('change', () => { syncCrew(); if (crew.checked) contactInput.focus(); });
  const submit = form.querySelector('[type="submit"]');

  B.bindPasswordToggles(form);

  // 비밀번호 확인: 입력하는 동안 일치 여부를 바로 알려 준다
  function paintMatch() {
    const a = pwInput.value, b = pw2Input.value;
    matchHint.classList.remove('is-ok', 'is-bad');
    if (!b) { matchHint.textContent = '같은 비밀번호를 한 번 더 적어 주세요.'; return; }
    if (a === b) { matchHint.textContent = '두 비밀번호가 같아요.'; matchHint.classList.add('is-ok'); }
    else { matchHint.textContent = '아직 두 비밀번호가 달라요.'; matchHint.classList.add('is-bad'); }
  }
  pwInput.addEventListener('input', paintMatch);
  pw2Input.addEventListener('input', paintMatch);

  function showError(text, field) {
    errorBox.textContent = text;
    errorBox.hidden = false;
    if (field) { field.setAttribute('aria-invalid', 'true'); field.focus(); }
  }

  if (!B.sb) { showError(B.unavailableText); submit.disabled = true; return; }

  // 이미 로그인한 사람은 커뮤니티로
  const { data: { session } } = await B.sb.auth.getSession();
  if (session) { location.replace(wantCrew ? '/?join=1&intro' : '/community/'); return; }   // 이미 회원이면 합류 신청만
  crew.checked = wantCrew; syncCrew();

  // 아이디는 소문자로만
  idInput.addEventListener('input', () => {
    const lower = idInput.value.toLowerCase();
    if (lower !== idInput.value) {
      const pos = idInput.selectionStart;
      idInput.value = lower;
      idInput.setSelectionRange(pos, pos);
    }
  });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errorBox.hidden = true;
    [idInput, pwInput, pw2Input, nameInput, contactInput, wantInput].forEach(f => f.removeAttribute('aria-invalid'));

    const id = B.normalizeId(idInput.value);
    const pw = pwInput.value;
    const name = nameInput.value.trim();

    const problems = [];
    if (!id) problems.push({ field: idInput, empty: true, text: '아이디를 적어 주세요.' });
    else if (!B.ID_RULE.test(id)) problems.push({ field: idInput, text: '아이디는 영문 소문자, 숫자, 밑줄(_)로 4~20자여야 해요.' });
    if (!pw) problems.push({ field: pwInput, empty: true, text: '비밀번호를 적어 주세요.' });
    else if (pw.length < B.PW_MIN) problems.push({ field: pwInput, text: `비밀번호는 ${B.PW_MIN}자 이상이어야 해요.` });
    if (!pw2Input.value) problems.push({ field: pw2Input, empty: true, text: '비밀번호 확인 칸을 적어 주세요.' });
    else if (pw && pw2Input.value !== pw) problems.push({ field: pw2Input, text: '두 비밀번호가 달라요. 같은 걸 두 번 적어 주세요.' });
    if (!name) problems.push({ field: nameInput, empty: true, text: '이름이나 별명을 적어 주세요.' });
    if (crew.checked && !contactInput.value.trim()) problems.push({ field: contactInput, empty: true, text: '합류 안내를 받을 연락처를 적어 주세요.' });
    if (crew.checked && !wantInput.value.trim()) problems.push({ field: wantInput, empty: true, text: '만들어 보고 싶은 것을 적어 주세요. 아직 모르면 "아직 몰라요" 도 괜찮아요.' });

    if (problems.length) {
      problems.forEach(p => p.field.setAttribute('aria-invalid', 'true'));
      const text = problems.length > 1 && problems.every(p => p.empty)
        ? '빈칸이 있어요. 표시된 칸을 채워 주세요.'
        : problems[0].text;
      showError(text, problems[0].field);
      return;
    }

    B.setBusy(submit, true, '가입 처리 중…');
    let result;
    try {
      result = await B.sb.auth.signUp({
        email: B.idToEmail(id),
        password: pw,
        options: { data: { username: id, display_name: name } }
      });
    } catch (err) {
      result = { error: err };
    }
    const { data, error } = result;

    if (error) {
      B.setBusy(submit, false);
      const code = error.code || '';
      const field = (code === 'user_already_exists' || code === 'email_exists' || code === 'email_address_invalid') ? idInput
        : code === 'weak_password' ? pwInput : null;
      const settingsIssue = /confirmation email/i.test(error.message || '');
      showError(settingsIssue ? '가입 설정이 아직 안 끝났어요. 운영진에게 알려 주세요. (메일 확인 설정)' : B.errorText(error, 'signup'), field);
      return;
    }
    if (!data.session) {
      B.setBusy(submit, false);
      showError('계정은 만들어졌는데 바로 로그인이 안 됐어요. 운영진에게 알려 주세요. (메일 확인 설정)');
      return;
    }
    // 합류 신청: 방금 만든 계정으로 로그인된 채라 신청이 계정과 이어진다. 실패해도 가입은 된 상태라 안내만
    let crewQ = '';
    if (crew.checked) {
      B.setBusy(submit, true, '합류 신청 보내는 중…');
      try {
        const r = await B.sb.rpc('submit_application', { p_name: name, p_contact: contactInput.value.trim(), p_want: wantInput.value.trim(), p_major: majorInput.value.trim() || null });
        crewQ = r.error ? '&crew=fail' : '&crew=1';
      } catch (x) { crewQ = '&crew=fail'; }
    }
    location.replace('/community/?welcome=1' + crewQ);
  });
})();
</script>
