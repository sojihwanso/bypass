<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BYPASS 커뮤니티로 옮겼습니다</title>
<meta name="robots" content="noindex">
<script>
  /* 예전 '공사장'(/site/)은 커뮤니티(/community/)로 합쳤다. 예전 주소·즐겨찾기는 같은 자리로 보낸다.
     #home·#내공사장 → 내 정보, #meeting·#회의실·#inbox·#접수함 → 회의실, #admin·#관리실 → HQ 회원, ?welcome=1 은 그대로 */
  (function () {
    const h = decodeURIComponent(location.hash.slice(1));
    const map = { home: 'me', '내공사장': 'me', meeting: 'meeting', '회의실': 'meeting', inbox: 'meeting', '접수함': 'meeting' };
    if (h === 'admin' || h === '관리실') { location.replace('/hq/#members'); return; }
    const welcome = new URLSearchParams(location.search).get('welcome') === '1' ? '?welcome=1' : '';
    location.replace('/community/' + welcome + (map[h] ? '#' + map[h] : ''));
  })();
</script>
<meta property="og:type" content="website">
<meta property="og:site_name" content="BYPASS">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="https://teambypass.vercel.app/site/">
<meta property="og:title" content="BYPASS 커뮤니티로 옮겼습니다">

</head>
