<title>해기사 시험 문제 풀이</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="한국해양수산연수원 공개 해기사 시험 기출문제(항해·기관 필기)를 회차·과목별로 풀어보는 교육용 사이트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Gothic:wght@700;800&display=swap">
<style>
/* Layout: navy masthead + route strip; wide 1120px sheet. Picking = tile grid. Solving = exam sheet (left) + sticky OMR answer card (right, bottom drawer on phones). */
:root{
  --paper:#FBF5EC; --surface:#FFFCF7; --ink:#2B1B12; --muted:#6B5546; --rule:#E7D7C3; --soft:#F5EADB;
  --navy:#FFFCF7; --navy-ink:#2B1B12; --pri:#164E68; --pri-ink:#FFFFFF;
  --acc:#C4561F; --acc-bg:#FCE8D8; --org:#FF7A26;
  --kr:#1A6585; --kr-bg:#E3EFF4;
  --oil:#9A4E12; --oil-bg:#FBEBDC; --sew:#17705F; --sew-bg:#E2F2EC; --gar:#4A529E; --gar-bg:#ECEBF8; --ov:#5F4B3E; --ov-bg:#F2E9DF;
  --ok:#1E7A3C; --ok-bg:#E4F3E6; --bad:#B3261E; --bad-bg:#FBE6E1; --warn:#8A5A00; --warn-bg:#FCF0D6;
  --scrim:rgba(58,36,20,.38); --shadow:0 1px 2px rgba(70,40,15,.06),0 10px 28px rgba(70,40,15,.10); --sheet:#FFFFFF;
  --f-disp:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-btn:16px; --r-card:18px;
}
:root[data-theme="dark"]{
  --paper:#17120F; --surface:#211A15; --ink:#F2E8DC; --muted:#B7A291; --rule:#3B2F26; --soft:#2A211B;
  --navy:#211A15; --navy-ink:#F2E8DC; --pri:#8ACBE4; --pri-ink:#0F1F28;
  --acc:#FF9A5C; --acc-bg:#3A2316; --org:#FF8A3D;
  --kr:#8ACBE4; --kr-bg:#15262D;
  --oil:#F0A866; --oil-bg:#2E2014; --sew:#5BC4AE; --sew-bg:#10261F; --gar:#AEB4F2; --gar-bg:#1D1D33; --ov:#CDBBAA; --ov-bg:#2A221C;
  --ok:#6BD18A; --ok-bg:#12291A; --bad:#F2867E; --bad-bg:#2E1513; --warn:#E8BC5E; --warn-bg:#2B2210;
  --scrim:rgba(0,0,0,.58); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4); --sheet:#F6F1EA;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-anchor:none}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--kr);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-disp);font-weight:800;letter-spacing:-.01em}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink)}
.mast .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:inherit;text-align:left;min-width:0}
.brand .mk{width:32px;height:32px;display:grid;place-items:center;flex:none;opacity:1;--mk-acc:#F2B544}
.brand .mk svg{width:32px;height:32px;overflow:visible}
.brand b{font-family:var(--f-disp);font-size:18px;font-weight:800;white-space:nowrap}
.brand span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;opacity:.7;white-space:nowrap}
.mast .sp{flex:1}
.iconbtn{background:transparent;border:1px solid rgba(255,255,255,.28);color:inherit;border-radius:8px;height:34px;min-width:34px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.iconbtn svg{width:16px;height:16px}
.route{background:var(--surface);border-bottom:1px solid var(--rule)}
.route .wrap{display:flex;align-items:center;gap:6px;padding-block:9px;overflow-x:auto;scrollbar-width:none}
.route .wrap::-webkit-scrollbar{display:none}
.crumb{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap;padding:3px 9px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
button.crumb:hover{border-color:var(--kr);color:var(--kr)}
.crumb.now{background:var(--kr-bg);border-color:transparent;color:var(--kr);font-weight:600}
.route .arw{color:var(--muted);font-size:12px}

main{padding-block:28px 64px}
.view-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;margin-bottom:20px}
.view-h h2{font-family:var(--f-disp);font-weight:800;font-size:clamp(22px,3.2vw,30px);line-height:1.25}
.view-h p{color:var(--muted);font-size:14px;margin-top:4px}
.back{background:none;border:1px solid var(--rule);border-radius:8px;padding:6px 12px;font-size:13.5px;color:var(--muted)}
.back:hover{color:var(--ink);border-color:var(--muted)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center;padding-block:18px 34px}
.hero h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(34px,5.6vw,58px);line-height:1.12;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--kr)}
.hero .lede{margin-top:16px;font-size:16.5px;color:var(--muted);max-width:34em}
.hero .cta{margin-top:26px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{border:0;border-radius:10px;padding:12px 22px;font-weight:600;font-size:15.5px;display:inline-flex;align-items:center;gap:8px}
.btn-pri{background:var(--pri);color:var(--pri-ink)}
.btn-pri:hover{filter:brightness(1.08)}
.btn-big{padding:19px 56px;font-size:21px;border-radius:14px;letter-spacing:.02em}
.btn-ghost{background:var(--surface);border:1px solid var(--rule);color:var(--ink)}
.btn-ghost:hover{border-color:var(--muted)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hero .note{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.hero-art{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero-art .note{text-align:right}
@media (max-width:900px){.hero-art .note{text-align:left}}
.omr-art{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px 18px 14px;box-shadow:var(--shadow);transform:rotate(-1.2deg)}
.omr-art .t{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:10px}
.omr-art .t b{font-family:var(--f-disp);font-size:15px}
.omr-art .t span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.art-rows{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px}
.art-row{display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:11.5px}
.art-row i{font-style:normal;width:20px;color:var(--muted);text-align:right}
.art-row s{text-decoration:none;width:19px;height:19px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;font-size:9.5px;color:var(--muted);font-family:var(--f-body)}
.art-row s.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}

.cover{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:6px}
.cv{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px 18px}
.cv .y{font-family:var(--f-mono);font-size:22px;font-weight:600}
.cv .d{font-size:13.5px;color:var(--muted);margin-top:2px}
.cv .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{font-family:var(--f-mono);font-size:11.5px;padding:2px 8px;border-radius:5px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.k{background:var(--kr-bg);color:var(--kr)}
.sec-t{display:flex;align-items:baseline;gap:12px;margin:40px 0 14px}
.sec-t h3{font-family:var(--f-disp);font-size:19px;font-weight:800}
.sec-t span{flex:1;border-top:1px solid var(--rule);transform:translateY(-4px)}

.src{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.src-row{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:baseline;gap:14px;padding:13px 18px;border-top:1px solid var(--rule);font-size:14px}
.src-row:first-child{border-top:0}
.src-row dt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.src-row dd{margin:0}.src-row .lq{margin-left:-.5em}
.src-row a{color:var(--kr);font-family:var(--f-mono);font-size:13.5px;text-underline-offset:3px}
.src-row ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}.src-row li{position:relative;padding-left:12px}.src-row li::before{position:absolute;left:0;top:0}.src-sub{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}.src-row dd,.src-row li{word-break:keep-all;text-wrap:pretty}.src-row li::before{content:"·";margin-right:6px;color:var(--muted)}
.caution{margin-top:22px;display:flex;gap:14px;align-items:flex-start;background:var(--warn-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:12px;padding:16px 18px}
.caution svg{flex:none;width:26px;height:26px;color:var(--warn);margin-top:1px}
.caution b{color:var(--warn);font-weight:700}
.caution p{font-size:14.5px}
.caution small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}

/* tiles */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{position:relative;text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px;min-height:118px;transition:border-color .15s,transform .15s,box-shadow .15s}
.tile:hover{border-color:var(--kr);box-shadow:var(--shadow);transform:translateY(-1px)}
.tile .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.tile .nm{font-family:var(--f-disp);font-weight:800;font-size:22px;line-height:1.2}
.tile .ds{font-size:13.5px;color:var(--muted)}
.tile .ft{margin-top:auto;padding-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tile.big{min-height:170px}
.tile.big .nm{font-size:30px}
.tile.dim{background:var(--soft);border-style:dashed}
.tile.dim .nm{color:var(--muted)}
.tile.dim:hover{border-color:var(--muted);transform:none;box-shadow:none}
.tile .badge{position:absolute;top:14px;right:14px;font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-weight:600}
.tile .badge.ok{background:var(--kr-bg);color:var(--kr)}
.tile.subj{border-top:4px solid var(--c)}
.tile.subj .nm{color:var(--c)}
.tile[disabled]{cursor:not-allowed}
.tiles.grades{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tile.grade .ds{font-weight:600;color:var(--kr)}
.duty{margin:6px 0 0;padding-top:10px;border-top:1px dashed var(--rule);display:grid;gap:7px}
.duty div{display:grid;gap:1px}
.duty dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;color:var(--muted)}
.duty dd{margin:0;font-size:13px;line-height:1.5;color:var(--ink)}
.lawnote{margin-top:16px;font-size:12.5px;color:var(--muted);line-height:1.6;max-width:62em}
.lawnote b{color:var(--ink);margin-right:6px}
.rule-box{margin-top:16px;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6}
.rule-box b{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--muted);display:block;margin-bottom:4px}
.rule-box ul{margin:0;padding-left:18px}
.rule-box em{font-style:normal;color:var(--oil);font-weight:700}
.reasons{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--bad)}
.ver{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;opacity:.8;white-space:nowrap;border:0;background:none;color:inherit;user-select:none;padding:4px 6px;border-radius:5px;cursor:default}
.ver:hover{opacity:1}
.mast .ver{background:rgba(255,255,255,.12);padding:3px 9px}
.home-logo{display:inline-flex;flex:none;border-radius:6px;padding:2px}
.home-logo img{display:block;width:30px;height:30px;transition:transform .15s}
.home-logo:hover img{transform:scale(1.08)}
footer.foot{padding-block:12px 28px;text-align:center}
footer.foot p{margin:0 0 6px;font-size:12px;color:var(--muted)}
footer.foot .ver{color:var(--muted)}
.groupl{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.groupl::after{content:"";flex:1;border-top:1px dashed var(--rule)}
.loading{color:var(--muted);font-family:var(--f-mono);font-size:13px;padding:30px 0}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--scrim);backdrop-filter:blur(3px);animation:fade .18s ease}
.dlg{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:24px 24px 20px;animation:rise .2s ease}
.dlg h3{font-family:var(--f-disp);font-weight:800;font-size:22px}
.dlg .sub{color:var(--muted);font-size:14px;margin-top:6px}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px}
.dlg .soon{display:flex;gap:14px;align-items:center}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--kr-bg);color:var(--kr);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.timer svg{width:14px;height:14px}
.timer.low{background:var(--warn-bg);color:var(--warn)}
.timer.out{background:var(--bad-bg);color:var(--bad)}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.picks button{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.picks button i{font-style:normal;width:16px;height:16px;border-radius:4px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:11px;line-height:1}
.picks button.on{border-color:var(--kr);background:var(--kr-bg);color:var(--kr);font-weight:600}
.picks button.on i{background:var(--kr);border-color:var(--kr);color:var(--surface)}
.picks button[disabled]{opacity:.4;cursor:not-allowed}
.fld .hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.dlg .soon .ic{width:48px;height:48px;border-radius:12px;background:var(--warn-bg);color:var(--warn);display:grid;place-items:center;flex:none}
.dlg .soon .ic svg{width:26px;height:26px}
.modes{display:grid;gap:10px;margin-top:18px}
.mode{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:14px}
.mode:hover,.mode.on{border-color:var(--kr);background:var(--kr-bg)}
.mode .no{width:44px;height:44px;border-radius:10px;background:var(--surface);border:1px solid var(--rule);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:17px;color:var(--kr)}
.mode b{display:block;font-size:15.5px}
.mode span{font-size:13px;color:var(--muted);line-height:1.5;display:block;margin-top:2px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.seg button{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:7px 13px;font-size:14px}
.seg button.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);font-weight:600}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.fld{margin-top:16px}
.fld > .eyebrow{display:block}

/* quiz */
.quiz{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.qbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:14px}
.qbar .ttl{font-family:var(--f-disp);font-weight:800;font-size:20px}
.qbar .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.qbar .sp{flex:1}
.prog{height:4px;background:var(--soft);border-radius:4px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--kr);transition:width .25s}
.sheet{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:22px 24px 20px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.qno{font-family:var(--f-mono);font-weight:600;font-size:15px;background:var(--ink);color:var(--surface);border-radius:7px;padding:2px 9px}
.stag{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--cb);color:var(--c)}
.repc{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--gar-bg);color:var(--gar);cursor:help;white-space:nowrap}
.qsrc{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.qtext{font-size:17px;line-height:1.75;white-space:pre-wrap}
.qtext .box{display:block;margin:10px 0 2px;padding:10px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);font-size:15.5px}
.figs{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.spr{width:100%;background-repeat:no-repeat;background-color:#fff;border-radius:8px}
.scan{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.scan .spr{border-radius:0}
.figs .spr{border:1px solid var(--rule)}
.scan-note{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:6px}
.opts{display:grid;gap:9px;margin-top:18px}
.opts.compact{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--paper);border:1.5px solid var(--rule);border-radius:11px;padding:11px 14px;font-size:15.5px;line-height:1.55;transition:border-color .12s,background .12s}
.opts.compact .opt{justify-content:center;align-items:center;padding:12px 6px}
.opt:hover{border-color:var(--kr)}
.opt .lt{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:-1px}
.opt.sel{border-color:var(--kr);background:var(--kr-bg)}
.opt.sel .lt{background:var(--kr);border-color:var(--kr);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .lt{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .lt{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px;padding-top:14px;border-top:1px dashed var(--rule)}
.qfoot .sp{flex:1}
.tri{border:1.5px solid var(--rule);background:var(--surface);border-radius:9px;padding:8px 13px;font-size:14px;display:inline-flex;gap:7px;align-items:center}

.tri svg{width:15px;height:15px}
.navb{border:1px solid var(--rule);background:var(--surface);border-radius:9px;padding:8px 14px;font-size:14px}
.navb:hover{border-color:var(--muted)}
.ansline{margin-top:14px;padding:10px 14px;border-radius:10px;font-size:14.5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ansline.ok{background:var(--ok-bg);color:var(--ok)}
.ansline.bad{background:var(--bad-bg);color:var(--bad)}
.ansline.none{background:var(--soft);color:var(--muted)}
.expl{margin-top:12px;background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--kr);border-radius:10px;padding:12px 14px}
.expl .lb{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--kr);font-weight:600}
.expl p{margin-top:4px;font-size:14.5px;line-height:1.65}
.expl small{display:block;margin-top:6px;font-size:11.5px;color:var(--muted)}
.expl.none{border-left-color:var(--rule)}
.expl.none .lb{color:var(--muted)}
.expl.none p{color:var(--muted);font-size:13.5px}
.jexp{margin-top:14px;text-align:left;background:var(--paper);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.6;max-height:9.5em;overflow:auto}
.jexp b{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--kr);margin-bottom:2px}
.kbd{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:10px}

/* OMR card */
.omr{position:sticky;top:calc(env(safe-area-inset-top,0px) + 124px);background:var(--surface);border:1px solid var(--rule);border-radius:14px;display:flex;flex-direction:column;max-height:calc(100vh - 144px)}
.omr-h{padding:14px 16px 10px;border-bottom:2px solid var(--ink)}
.omr-h b{font-family:var(--f-disp);font-size:16px}
.omr-h .st{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:2px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.omr-b{overflow:auto;padding:6px 8px 10px;flex:1}
.omr-sec{font-size:12px;font-weight:700;padding:10px 8px 4px;color:var(--c)}
.orow{display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;border-radius:7px;padding:3px 6px;font-family:var(--f-mono);font-size:12px}
.orow:hover{background:var(--soft)}
.orow.cur{background:var(--kr-bg);box-shadow:inset 3px 0 0 var(--kr)}
.orow .n{width:24px;text-align:right;color:var(--muted)}
.orow .tm{width:14px;color:var(--warn);font-size:12px;text-align:center}
.bub{width:21px;height:21px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;font-family:var(--f-body);font-size:10px;color:var(--muted);flex:none}
.bub.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.bub.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.bub.bad{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.bub.ans{border:2px solid var(--ok);color:var(--ok);font-weight:700}
.omr-f{padding:12px 14px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.omr-f .btn{justify-content:center}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:12px 14px}
.stats div{background:var(--paper);border-radius:8px;padding:8px;text-align:center}
.stats b{display:block;font-family:var(--f-mono);font-size:19px}
.stats span{font-size:11.5px;color:var(--muted)}
.omr-toggle{display:none}

/* judge overlay */
.judge{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-left,0px));background:var(--scrim);backdrop-filter:blur(2px);animation:fade .22s ease}
.jcard{width:min(420px,100%);background:var(--surface);border:1px solid var(--rule);border-radius:18px;box-shadow:var(--shadow);padding:28px 24px 22px;text-align:center;animation:rise .25s ease}
.mark{width:110px;height:110px;margin:0 auto 12px;position:relative}
.mark.o::before{content:"";position:absolute;inset:8px;border-radius:50%;border:12px solid var(--ok);animation:pop .32s cubic-bezier(.3,1.5,.5,1)}
.mark.x::before,.mark.x::after{content:"";position:absolute;left:50%;top:6px;width:13px;height:98px;margin-left:-6.5px;border-radius:7px;background:var(--bad);animation:pop .32s cubic-bezier(.3,1.5,.5,1)}
.mark.x::before{transform:rotate(45deg)}
.mark.x::after{transform:rotate(-45deg)}
.jcard h3{font-family:var(--f-disp);font-size:26px;font-weight:800}
.jcard h3.o{color:var(--ok)}
.jcard h3.x{color:var(--bad)}
.jline{display:flex;justify-content:center;gap:16px;margin-top:12px;font-size:15px}
.jline > span{display:inline-flex;align-items:center;gap:6px}
.jline .bub{display:inline-grid;place-items:center;width:28px;height:28px;font-size:13.5px;font-weight:700;line-height:1;padding:0}
.jcard .btn{margin-top:20px;width:100%;justify-content:center}
.jcard .hint{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:8px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{opacity:1}}
.mark.x::before{animation-name:popx1}.mark.x::after{animation-name:popx2}
@keyframes popx1{from{transform:rotate(45deg) scale(.3);opacity:0}to{transform:rotate(45deg);opacity:1}}
@keyframes popx2{from{transform:rotate(-45deg) scale(.3);opacity:0}to{transform:rotate(-45deg);opacity:1}}

/* results */
.res-top{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:20px;align-items:stretch}
.score{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:22px}

.verdict{display:inline-block;margin-top:12px;font-weight:700;padding:4px 12px;border-radius:999px}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict.na{background:var(--soft);color:var(--muted)}
.score p{font-size:13px;color:var(--muted);margin-top:10px}
.stbl{background:var(--surface);border:1px solid var(--rule);border-radius:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 14px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap}
th{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;color:var(--muted);font-weight:500}
td.num{font-family:var(--f-mono);text-align:right}

/* ===== v1.1 redesign: warm ivory · teal-navy buttons · terracotta accents ===== */

.nb ul{list-style:none;margin:0;padding:0;display:grid;gap:0}
.nb li{display:flex;align-items:center;gap:12px;height:44px;font-size:15px;border-bottom:1px solid #EADCC8}
.nb li i{width:18px;height:18px;border:2px solid #5E301F;border-radius:4px;flex:none;display:grid;place-items:center;font-style:normal;color:#C4561F;font-weight:800;font-size:15px;line-height:1}
.nb li.done span{text-decoration:line-through;text-decoration-color:#C4561F;text-decoration-thickness:2px;color:#6B5546}
.nb .pen{position:absolute;right:-16px;bottom:10px;width:150px;height:auto;transform:rotate(-34deg);transform-origin:center;filter:drop-shadow(0 4px 4px rgba(60,35,15,.22))}
.hero-art .note{font-family:var(--f-body);font-size:13px;line-height:1.7}
.entry{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:4px}
.ecard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-card);padding:20px 18px 20px 20px;transition:border-color .15s,box-shadow .15s,transform .15s}
.ecard:hover{border-color:var(--acc);box-shadow:var(--shadow);transform:translateY(-2px)}
.ecard .ic{width:60px;height:60px;border-radius:16px;background:var(--c-bg,var(--acc-bg));color:var(--c,var(--acc));display:grid;place-items:center}
.ecard .ic svg{width:32px;height:32px}
.ecard b{display:block;font-family:var(--f-disp);font-weight:800;font-size:21px;line-height:1.25}
.ecard small{display:block;color:var(--muted);font-size:13.5px;line-height:1.55;margin-top:4px}
.ecard .chev{color:var(--muted);font-size:22px}
.ecard .cnt{font-family:var(--f-mono);font-size:11.5px;background:var(--acc);color:#fff;border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:3px;font-weight:600}
.sec-h{display:flex;align-items:center;gap:10px;margin:36px 0 12px}
.sec-h h3{font-family:var(--f-disp);font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px}
.sec-h h3 svg{width:22px;height:22px;color:var(--acc)}
.sec-h .sp{flex:1}
.sec-h .lnk{background:none;border:0;color:var(--kr);font-weight:600;font-size:14px;padding:4px 2px}
.sec-h .lnk:hover{text-decoration:underline;text-underline-offset:3px}
.recent{display:grid;gap:10px}
.rrow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto auto;gap:6px 18px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-card);padding:13px 18px;font-size:14px}
.rrow .k{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--kr-bg);color:var(--kr);white-space:nowrap}
.rrow .k.iv{background:var(--gar-bg);color:var(--gar)}
.rrow .k.ex{background:var(--acc-bg);color:var(--acc)}
.rrow .ic{color:var(--muted);display:grid}
.rrow .ic svg{width:22px;height:22px}
.rrow .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .t small{font-weight:400;color:var(--muted);margin-left:6px}
.rrow .d,.rrow .n{color:var(--muted);font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.rrow .p{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.rempty{background:var(--surface);border:1px dashed var(--rule);border-radius:var(--r-card);padding:18px;color:var(--muted);font-size:14px;text-align:center}
.covl{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-card);overflow:hidden}
.covl li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:15px 20px;border-top:1px solid var(--rule)}
.covl li:first-child{border-top:0}
.covl svg{width:22px;height:22px;color:var(--acc)}
.covl b{font-size:17px;font-weight:700}
.covl small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:1px}
.covl .n{font-family:var(--f-mono);font-size:18px;font-weight:600;white-space:nowrap}
.covl .n span{font-family:var(--f-body);font-size:14px;font-weight:500;margin-left:2px}
.covd{margin-top:12px}
.covd summary{cursor:pointer;color:var(--kr);font-weight:600;font-size:14px;list-style:none;display:inline-flex;align-items:center;gap:6px;padding:4px 0}
.covd summary::-webkit-details-marker{display:none}
.covd summary::after{content:"›";transform:rotate(90deg);transition:transform .15s}
.covd[open] summary::after{transform:rotate(-90deg)}
.covd .cover{margin-top:10px}
@media (max-width:900px){.entry{grid-template-columns:1fr}.nb{transform:none;max-width:460px}.rrow{grid-template-columns:auto minmax(0,1fr) auto;}.rrow .ic,.rrow .d{display:none}.rrow .n{grid-column:2}.rrow .k{grid-row:1/span 2}.rrow .p{grid-column:3;grid-row:1/span 2}}
@media (max-width:520px){.hero-art{display:none}.mast .ver{display:none}.ecard{padding:16px}.ecard .ic{width:52px;height:52px;border-radius:14px}.ecard b{font-size:19px}.covl li{padding:13px 16px}.covl .n{font-size:16px}}

/* modal (E-2 tone) */
.dlg{border-radius:24px;padding:26px 26px 22px;background:var(--surface)}
.dlg h3{font-size:23px}
.dlg .acts .btn{min-width:112px;justify-content:center}
.mode{border-radius:16px;background:var(--surface);border-width:1.5px}
.mode:hover,.mode.on{border-color:var(--acc);background:var(--acc-bg)}
.mode .no{border-radius:14px;color:var(--acc);background:var(--acc-bg);border-color:transparent}
.mode.on .no{background:var(--acc);color:#fff}
.dlg .soon .ic{border-radius:16px}
.mico{width:64px;height:64px;border-radius:18px;background:var(--soft);color:var(--ink);display:grid;place-items:center;margin:0 auto 12px}
.mico svg{width:34px;height:34px}

/* 문제 풀기 설정 (D) */
.dlg.wide{width:min(860px,100%);padding:28px 28px 22px}
.setup-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:end;margin-bottom:16px}
.setup-h .hic{width:56px;height:56px;border-radius:16px;background:var(--acc-bg);color:var(--acc);display:grid;place-items:center;align-self:center}
.setup-h .hic svg{width:32px;height:32px}
.setup-h h3{font-size:clamp(22px,3.4vw,30px);display:inline;background:linear-gradient(transparent 70%,color-mix(in srgb,var(--org) 32%,transparent) 70% 94%,transparent 94%)}
.setup-h .sub{margin-top:8px}
.setup-h .hart{width:118px;height:auto;align-self:end;margin-bottom:-16px}
.setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.pane{border:1px solid var(--rule);border-radius:20px;padding:16px 18px;background:var(--paper)}
.pane h4{margin:0 0 10px;font-family:var(--f-disp);font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.pane h4 svg{width:22px;height:22px;color:var(--acc)}
.pane.blue{background:var(--kr-bg);border-color:color-mix(in srgb,var(--kr) 22%,transparent)}
.pane.blue h4 svg{color:var(--kr)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center;font-size:14.5px}
.kv dt{background:var(--acc-bg);color:var(--acc);font-weight:700;font-size:13px;padding:6px 12px;border-radius:12px;white-space:nowrap}
.kv dd{margin:0;font-weight:600}
.setup .modes{margin-top:0}
.setup .rule-box{background:var(--surface);border-radius:14px}
.setup .fld{margin-top:12px}
.setup-f{display:flex;justify-content:center;gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid var(--rule)}
.setup-f .btn{min-width:150px;justify-content:center;padding:14px 26px;font-size:16.5px}
@media (max-width:720px){.setup{grid-template-columns:1fr}.setup-h{grid-template-columns:auto minmax(0,1fr)}.setup-h .hart{display:none}.dlg.wide{padding:22px 18px 18px}.setup-f .btn{min-width:0;flex:1}}

/* 오답노트 (D) */
.wn-hero{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.25fr);gap:20px;align-items:center;margin:4px 0 20px}
.wn-hero .tagl{display:inline-block;font-family:var(--f-disp);font-weight:800;font-size:13.5px;color:var(--acc);background:var(--acc-bg);padding:2px 5px;border-radius:6px}
.wn-hero h2{font-family:var(--f-disp);font-weight:800;font-size:clamp(32px,5vw,50px);line-height:1.15;margin-top:8px}
.wn-hero p{color:var(--muted);font-size:14.5px;margin-top:6px}
.wn-hero .hart{height:94px;width:auto;overflow:visible;justify-self:end;margin-right:8px}
.wn-kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.wn-kpi div{border-radius:var(--r-card);padding:14px 16px;border:1px solid transparent}
.wn-kpi .r{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 18%,transparent)}
.wn-kpi .b{background:var(--kr-bg);border-color:color-mix(in srgb,var(--kr) 18%,transparent)}
.wn-kpi .g{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 18%,transparent)}
.wn-kpi span{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700}
.wn-kpi .r span{color:var(--bad)}.wn-kpi .b span{color:var(--kr)}.wn-kpi .g span{color:var(--ok)}
.wn-kpi svg{width:20px;height:20px}
.wn-kpi b{display:block;font-family:var(--f-mono);font-size:30px;font-weight:600;line-height:1.2;margin-top:6px}
.wn-kpi b small{font-family:var(--f-body);font-size:15px;font-weight:600;margin-left:3px}
@media (max-width:900px){.wn-hero{grid-template-columns:minmax(0,1fr) auto}.wn-kpi{grid-column:1/-1}}
@media (max-width:520px){.wn-hero .hart{height:72px;margin-right:0}.wn-kpi{gap:8px}.wn-kpi div{padding:10px}.wn-kpi b{font-size:22px}.wn-kpi span{font-size:12px}}
.wn-tabs{border-bottom:0;background:var(--soft);border-radius:16px;padding:5px;display:inline-flex;gap:4px;margin:4px 0 16px}
.wn-tabs button{border:0;border-radius:12px;margin:0;padding:8px 16px;font-size:14.5px}
.wn-tabs button.on{background:var(--acc);color:#fff}
.wn-tabs button.on b{color:#fff;opacity:.85}
.wn-sub div{border-radius:14px}
.wn-del{border-radius:10px}
.wn-empty{border-radius:var(--r-card)}

/* quiz (F-1) */
.sheet{border-radius:var(--r-card)}
.qno{background:var(--acc);color:#fff;border-radius:10px;padding:3px 12px}
.opt{border-radius:14px;background:var(--surface);gap:14px}
.opt .lt{border-radius:10px;border:0;background:var(--soft);color:var(--ink);width:32px;height:32px}
.opt:hover{border-color:var(--kr)}
.opt.sel .lt{background:var(--kr)}
.tri,.navb{border-radius:12px;border-width:1.5px}
.tri.on{border-color:var(--acc);background:var(--acc-bg);color:var(--acc)}
.prog i{background:var(--acc)}
.omr{border-radius:var(--r-card)}
.omr-h{border-bottom-color:var(--rule)}
.orow{border-radius:10px}
.orow.cur{background:var(--acc-bg);box-shadow:inset 3px 0 0 var(--acc)}
.bub.on{background:var(--pri);border-color:var(--pri)}
.timer{background:var(--kr-bg);color:var(--kr)}
.jcard{border-radius:24px}
.omr-toggle{border-radius:16px}
.expl{border-left-color:var(--acc);border-radius:14px}
.expl .lb{color:var(--acc)}
.ansline{border-radius:12px}
.toast{border-radius:14px}
.srch input{border-radius:14px;border-width:1.5px}
.srch input:focus{outline-color:color-mix(in srgb,var(--acc) 40%,transparent);border-color:var(--acc)}


.fold{margin-top:30px}
.fold > summary{list-style:none;cursor:pointer;margin:0;padding:12px 16px;border-radius:var(--r-card);border:1px solid var(--rule);background:var(--surface);user-select:none}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary:hover{border-color:var(--acc)}
.fold[open] > summary{margin-bottom:12px}
.fold-i{width:30px;height:30px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex:none}
.fold-i::before{content:"";width:8px;height:8px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-2px) rotate(45deg);transition:transform .15s}
.fold[open] .fold-i::before{transform:translateY(2px) rotate(-135deg)}
.covl > li{grid-template-columns:minmax(0,1fr) auto}
.covl > li > div{min-width:0}
.covl ul.hy{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:1px}
.covl ul.hy li{display:block;padding:0 0 0 14px;border:0;position:relative;color:var(--muted);font-size:13.5px;font-weight:400;line-height:1.55}
.covl ul.hy li::before{content:"-";position:absolute;left:2px;color:var(--muted)}

/* 상단 막대: 고정하지 않고 맨 위에서만 보이게 (모바일 크롬·iOS에서 새로고침/탭 닫기 동작과 겹치지 않도록) */
.mast{position:relative}
.omr{top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px)}
@media (min-width:760px){.iv-ans{top:calc(env(safe-area-inset-top,0px) + 16px)}}
/* PC(넓은 화면 + 마우스)에서는 상단 막대 고정 */
@media (min-width:900px) and (hover:hover) and (pointer:fine){
  .mast{position:sticky;top:env(safe-area-inset-top,0px)}
  .omr{top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 92px)}
  .iv-ans{top:calc(env(safe-area-inset-top,0px) + 76px)}
}
/* 최근 학습 내역 제목 아이콘을 아래 줄 아이콘과 맞춤 */
.sec-h:not(summary){padding-inline:17px}
.rrow{padding-left:16px;padding-right:16px}
/* help badges follow new header */
.hb-nav,.hb-ver,.hb-brand{background:var(--surface);color:var(--ink);border:1px solid var(--rule)}
.hb-pri,.hb-omr{border-radius:10px}

function randomSetup(){
  let g = 1, el = isEng() ? 'E' : '상선전문';
  const draw = () => {
    modal(`<h3>무작위 풀이 설정</h3><p class="sub">${yearsNow().slice().reverse().join(' · ')}년 전 회차의 문제가 섞여 나옵니다.</p>

    ${isEng() ? '' : `<div class="fld"><span class="eyebrow">선택과목</span><div class="seg" id="se">${['상선전문','어선전문'].map(n => '<button type="button" data-e="' + n + '" class="' + (n === el ? 'on' : '') + '">' + n + '</button>').join('')}</div></div>`}
    <div class="acts"><button class="btn btn-ghost" data-close>취소</button><button class="btn btn-pri" id="rGo">무작위 풀이 시작</button></div>`, m => {
      m.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { g = +b.dataset.g; draw(); });
      m.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { el = b.dataset.e; draw(); });
      document.getElementById('rGo').onclick = () => startRandom(g, el);
    });
  };
  draw();
}

/* ---------- sessions ---------- */
function mkItem(y, r, g, p, sub, q){ return { y, r, g, p, sub, q }; }
let timerId = null;
function stopTimer(){ if (timerId){ clearInterval(timerId); timerId = null; } }
function fmtTime(sec){ sec = Math.max(0, Math.ceil(sec)); const m = Math.floor(sec / 60), x = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (x < 10 ? '0' : '') + x; }
const ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>';
function timerHTML(){
  const S = session;
  if (!S || !S.limit || S.done) return '';
  const left = (S.endAt - Date.now()) / 1000;
  return `<span class="timer ${left <= 0 ? 'out' : left <= 300 ? 'low' : ''}" data-timer>${ICON_CLOCK}<span>${fmtTime(left)}</span><small style="font-weight:500;opacity:.75">/ ${S.limit / 60}분</small></span>`;
}
function tick(){
  const S = session;
  if (!S || !S.limit || S.done){ stopTimer(); return; }
  const left = (S.endAt - Date.now()) / 1000;
  document.querySelectorAll('[data-timer]').forEach(t => {
    t.classList.toggle('low', left <= 300 && left > 0); t.classList.toggle('out', left <= 0);
    t.querySelector('span').textContent = fmtTime(left);
  });
  if (left <= 0){
    stopTimer();
    S.done = true; S.timeUp = true; S.used = S.limit;
    renderResult();
    modal(`<div class="soon"><div class="ic">${ICON_CLOCK}</div><div><h3>시간이 끝났습니다</h3><p class="sub">제한시간 ${S.limit / 60}분이 지나 답안을 자동으로 제출하고 채점했습니다. 미응답 문항은 오답으로 처리됩니다.</p></div></div><div class="acts"><button class="btn btn-pri" id="toRes2">결과 보기</button></div>`);
    document.getElementById('toRes2').onclick = () => { closeLayer(); askBlank(S); };
  }
}
function startExam(mode, elective, subs){
  const items = [], sections = [];
  for (const s of subs){
    const got = pick(st.year, st.round, st.grade, s, elective);
    if (!got) continue;
    sections.push({ sub: s, start: items.length, n: got.qs.length });
    for (const q of got.qs) items.push(mkItem(st.year, st.round, st.grade, got.p, s, q));
  }
  const multi = sections.length > 1;
  session = {
    mode, items, sections, cur: 0, ans: items.map(() => null), tri: items.map(() => false), done: false,
    title: mode === 3 ? `제${st.round}회 전 과목` : multi ? `${sections.length}과목 모의고사` : subs[0],
    meta: `${st.year}년 제${st.round}회 · ${st.grade}급 ${JOB()}` + (elective !== 'E' && (mode === 3 || (multi && subs.some(x => x.endsWith('전문')))) ? ' · ' + elective : '') + (multi && mode === 2 ? ' · ' + sections.map(x => x.sub).join('·') : ''),
    limit: mode === 2 || mode === 3 ? sections.length * 25 * 60 : 0,
  };
  if (session.limit){ session.startAt = Date.now(); session.endAt = session.startAt + session.limit * 1000; stopTimer(); timerId = setInterval(tick, 1000); }
  renderQuiz();
}
async function startRandom(g, el){
  closeLayer();
  st.grade = g; st.year = st.round = st.subject = null;
  app.innerHTML = '<p class="loading">전 회차 문제를 불러오는 중…</p>';
  try { await Promise.all(yearsNow().map(loadYear)); } catch(e) { app.innerHTML = '<p class="loading">문제 파일을 불러오지 못했습니다.</p>'; return; }
  const all = [];
  for (const y of yearsNow().slice().reverse()) for (let r = 4; r >= 1; r--){
    for (const s of (el === 'E' ? SUBS_E : ['항해','운용','법규','영어', el])){
      const got = pick(y, r, g, s, el);
      if (got) for (const q of got.qs) all.push(mkItem(y, r, g, got.p, s, q));
    }
  }
  /* 같은 문제가 여러 회차에 출제된 경우 가장 최근 회차 하나만 남김 */
  const seen = new Set(), pool = [];
  for (const it of all){ const k = it.q.k || (it.y + '-' + it.r + '-' + it.g + '-' + it.sub + '-' + it.q.n); if (seen.has(k)) continue; seen.add(k); pool.push(it); }
  const dupN = all.length - pool.length;
  for (let i = pool.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  session = { mode: 4, pool, items: [pool[0]], sections: [], cur: 0, ans: [null], tri: [false], done: false,
    title: '전 회차 무작위', meta: `${g}급 ${el === 'E' ? '기관사' : '항해사 · ' + el} · 중복 ${dupN}문항 제외 · ${pool.length}문항 중 무작위` };
  renderQuiz();
}

}
function stemHTML(t){
  const i = t.indexOf('\n<보기>\n');

function drawQ(){

  let body = '';

  if (rows.length > 300){
    const go = await new Promise(res => {
      modal(`<h3>${rows.length.toLocaleString()}문항을 출력할까요?</h3><p class="sub">문항이 많으면 인쇄 창이 열리기까지 시간이 걸리고 PDF가 커집니다. 과목이나 검색어로 범위를 줄이면 더 빠릅니다.</p><div class="acts"><button class="btn btn-ghost" id="pNo">취소</button><button class="btn btn-pri" id="pYes">출력</button></div>`);
      document.getElementById('pNo').onclick = () => { closeLayer(); res(false); };
      document.getElementById('pYes').onclick = () => { closeLayer(); res(true); };
    });
    if (!go) return;
  }
  toast('출력할 문제를 준비하는 중…');
  const urls = new Set();
  for (const r of rows) for (const rf of [...(r.it.q.img || []), ...(r.it.q.fig || [])]) urls.add('data/img/' + rf.s);
  await Promise.all([...urls].map(u => new Promise(res => { const im = new Image(); im.onload = im.onerror = res; im.src = u; setTimeout(res, 10000); })));
  const now = new Date(), z = x => (x < 10 ? '0' : '') + x;
  const items = rows.map((r, i) => {
    const { it } = r, q = it.q;
    const body = q.img ? q.img.map(rf => spriteHTML(rf, 'img')).join('')
      : '<div class="pq-q">' + stemHTML(q.q) + '</div>' + (q.fig ? q.fig.map(rf => spriteHTML(rf, 'fig')).join('') : '');
    const good = r.ok != null ? r.ok : (r.a != null && q.a.includes(r.a));
    const opts = q.img ? '<div class="pq-bub">' + LET.map((L, j) => { const right = q.a.includes(j), mine = r.a === j; return `<span class="${right ? 'r' : mine ? 'w' : ''}">${L}</span>`; }).join('') + '</div>' : '<ol class="pq-o">' + LET.map((L, j) => { const right = q.a.includes(j), mine = r.a === j; return `<li class="${right ? 'r' : mine ? 'w' : ''}"><span class="pq-l">${L}</span><span>${esc(q.o[j])}</span>${right ? '<i class="ok">정답</i>' : ''}${mine ? `<i class="${right ? 'ok' : 'bad'}">내 답</i>` : ''}</li>`; }).join('') + '</ol>';
    const pc = { 항해:'#1F5E8C', 운용:'#17705F', 법규:'#93530F', 영어:'#4752A0' }[it.sub] || '#4A5864';
    return `<section class="pq" style="--pc:${pc}"><div class="pq-h"><span class="pq-n">${i + 1}</span><span class="pq-s">${esc(it.sub)}</span><span class="pq-src">${esc(srcLabel(it))}</span>${r.ok != null ? `<span class="pq-r ${r.ok ? 'ok' : 'bad'}">${r.ok ? '맞힘' : '틀림'}</span>` : r.a == null ? '<span class="pq-r none">미응답</span>' : ''}</div>${body}${opts}
      <p class="pq-a ${r.a == null ? 'none' : good ? 'ok' : 'bad'}">정답 <b>${ansLetters(it)}</b> · 내 답 <b>${r.a == null ? '미응답' : LET[r.a]}</b></p>
      ${q.e ? `<p class="pq-e"><b>AI 요약 해설</b> ${esc(q.e)}</p>` : ''}<p class="pq-m">${esc(r.line || '')}</p></section>`;
  }).join('');
  const area = document.createElement('div'); area.id = 'printArea';
  area.innerHTML = `<header class="pa-h"><h1>${esc(title)}</h1><p>${esc(filt)} · ${rows.length.toLocaleString()}문항 · ${now.getFullYear()}.${z(now.getMonth() + 1)}.${z(now.getDate())} 출력</p><p class="pa-n">해기사 시험 문제 풀이 · 정답은 공식 정답표 기준, 해설은 AI 요약(학습 참고용)입니다.</p></header>${items}`;
  document.getElementById('printArea')?.remove();
  document.body.appendChild(area); document.body.classList.add('printing');
  const oldTitle = document.title;
  document.title = `해기사_${title.replace(/\s+/g, '')}_${now.getFullYear()}${z(now.getMonth() + 1)}${z(now.getDate())}`;
  const done = () => { document.body.classList.remove('printing'); area.remove(); document.title = oldTitle; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 60);
}

/* ----- 채점 ----- */
function ivNormK(s){ return String(s || '').toLowerCase().replace(/[\s ]+/g, '').replace(/[‘’`´]/g, "'"); }
function ivKwHit(text, kw){ return kw.split('|').some(k => { const n = ivNormK(k); return n && text.includes(n); }); }
function ivNormE(s){
  return String(s || '').toLowerCase().replace(/[‘’`´]/g, "'").replace(/[“”]/g, '"')
    .replace(/^\s*[-–•]\s*/gm, '').replace(/[.,!?;:"]/g, ' ').replace(/\s*'\s*/g, "'").replace(/\s*\/\s*/g, '/').replace(/\s+/g, ' ').trim();
}
function ivVariants(model){
  // word(alt) / (선택어) 표기를 모두 펼쳐 허용 답안 목록 생성
  let outs = [model];
  for (let guard = 0; guard < 6; guard++){
    const next = [];
    let changed = false;
    for (const s of outs){
      const m = s.match(/([A-Za-z0-9]+)\(([^()]+)\)|\(([^()]+)\)/);
      if (!m){ next.push(s); continue; }
      changed = true;
      const pre = s.slice(0, m.index), post = s.slice(m.index + m[0].length);
      if (m[1] != null){
        const w = m[1], alt = m[2];
        const opts = /^(s|es)$/i.test(alt) ? [w, w + alt] : [w, alt, w + ' ' + alt];
        opts.forEach(o => next.push(pre + o + post));
      } else { next.push(pre + m[3] + post); next.push(pre + post); }
    }
    outs = next.slice(0, 256);
    if (!changed) break;
  }
  return outs;
}
function ivEnMatch(user, model){
  const u = ivNormE(user);
  if (!u) return false;
  return ivVariants(model).some(v => {
    const n = ivNormE(v);
    if (n.includes('○')){
      const re = new RegExp('^' + n.split(/○+/).map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('.+') + '$');
      return re.test(u);
    }
    return n === u;
  });
}
function ivGradePart(p, ans){
  if (p.en){
    const ok = p.mode === 'alt' ? p.items.some(it => ivEnMatch(ans, it)) : ivEnMatch(ans, p.items.join(' '));
    return { ok, en: true };
  }
  const t = ivNormK(ans);
  const items = p.items.map((it, i) => {
    const kws = (p.kw && p.kw[i]) || [];
    const hit = kws.filter(k => ivKwHit(t, k));
    const need = Math.ceil(kws.length * 0.5);
    return { kws, hit, cov: kws.length ? hit.length >= need : null };
  });
  const scored = items.filter(x => x.cov !== null);
  const covered = scored.filter(x => x.cov).length;
  const need = p.need ? Math.min(p.need, scored.length) : Math.ceil(scored.length * 0.6);
  return { ok: !!t && scored.length > 0 && covered >= need, items, covered, need, total: scored.length };
}
function ivSubmit(auto, exiting, why){
  const S = ivSess; if (!S || S.phase !== 'q') return;
  const q = S.cur, f = document.getElementById('ivForm');

  if (!auto && ans.every(a => !a.trim())){ toast('답안을 입력하세요'); return; }
  if (exiting && ans.every(a => !a.trim())){ ivFinish('exit'); return; }
  S.phase = 'judge';
  const res = q.parts.map((p, i) => ivGradePart(p, ans[i]));
  const ok = res.every(r => r.ok);
  S.recs.push({ q, ans, res, ok, why: why || '', sec: Math.round((Date.now() - S.qStart) / 1000) });
  if (exiting){ ivFinish('exit'); return; }
  ivJudge(ok, why);
}

  // 끊기면 어색한 말 묶음: 화면이 좁아도 한 줄에 함께 놓이게 한다
  const NW = ['기록 백업','과목합격·유효기간','같은 크기','앞 단계','풀이 중이면','상선·어선전문','제출한 뒤','결과 화면','결과 보기','실제 시험','볼 수','풀 수','쓸 수','고를 수','다시 풀어 맞힘','PDF로 저장','PDF로 출력','PDF 파일','인쇄 창','배경 그래픽','응시 기록','오답 풀이기록','서버 백업','파일 백업','복구 코드','어두운 화면','밝은 화면','다시 풀기','최근 2,000건까지','파일에 저장','한 줄에','선택과목(상선·어선전문)만','핵심 키워드','프린터 선택','공유 메뉴','△ 문제만','분류 버튼','지울 수','전체(15분/20분/없음,','3·5문제 모드','가로 화면','같은 직종·등급','답안 카드','맞힘·틀림','푼 일시','문제 다시 보기','다음 문제'];
  const nwRe = new RegExp('(' + NW.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + '|[가-힣]{1,3} 수 있습니다)', 'g');
  const glue = root => {
    const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
    while (walk.nextNode()) nodes.push(walk.currentNode);
    for (const tn of nodes){
      if (tn.parentElement.closest('.nw,.hb,svg,h4') || !nwRe.test(tn.data)) continue;
      nwRe.lastIndex = 0;
      const sp = document.createElement('span'); sp.innerHTML = esc(tn.data).replace(nwRe, '<span class="nw">$1</span>');
      tn.replaceWith(...sp.childNodes);
    }
  };
  const TABS = [['b','버튼 안내'],['w','필기'],['i','면접'],['s','오답노트·설정']];
  // 검색: 탭마다 항목(설명 줄·목록 한 줄)을 뽑아, 검색어를 모두 포함한 것만 '탭 › 소제목' 아래에 모아 보여 준다
  const search = (m, raw) => {
    const box = m.querySelector('.help-body');
    const ws = raw.toLowerCase().split(/\s+/).filter(Boolean);
    m.querySelectorAll('[data-h]').forEach(b => b.classList.toggle('on', !ws.length && b.dataset.h === helpTab));
    if (!ws.length){ box.innerHTML = T[helpTab]; glue(box); return; }
    const norm = s => s.toLowerCase().replace(/\s+/g, '');
    let out = '', n = 0;
    for (const [k, name] of TABS){
      const d = document.createElement('div'); d.innerHTML = T[k];
      let sec = '', groups = [];
      const units = [];
      for (const el of d.children){
        if (el.tagName === 'H4'){ sec = el.textContent; continue; }
        if (el.matches('ul,ol')) for (const li of el.querySelectorAll('li')){ if (!li.querySelector('ul,ol')) units.push([sec, li, true]); else { const c = li.cloneNode(true); c.querySelectorAll('ul,ol').forEach(x => x.remove()); units.push([sec, c, true]); } }
        else units.push([sec, el, false]);
      }
      for (const [s, el, isLi] of units){
        const t = norm(el.textContent);
        if (!ws.every(w => t.includes(norm(w)))) continue;
        n++;
        let g = groups.find(x => x.s === s); if (!g){ g = { s, h: [] }; groups.push(g); }
        g.h.push(isLi ? '<ul><li>' + el.innerHTML + '</li></ul>' : el.outerHTML);
      }
      for (const g of groups) out += `<h4><span class="hs-tab">${name}</span>${g.s ? ' › ' + esc(g.s) : ''}</h4>` + g.h.join('');
    }
    box.innerHTML = n ? `<p class="hnote">검색 결과 ${n}개</p>` + out : '<p class="help-none">검색어와 맞는 설명이 없습니다.<br>다른 낱말로 찾아보세요. (예: PDF, 동기화, 단축키, 과락)</p>';
    glue(box);
    // 일치한 글자에 표시
    const walk = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
    const nodes = []; while (walk.nextNode()) nodes.push(walk.currentNode);
    const re = new RegExp('(' + ws.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
    for (const tn of nodes){
      if (tn.parentElement.closest('svg,.hb,.hnote,.help-none') || !re.test(tn.data)) continue;
      re.lastIndex = 0;
      const sp = document.createElement('span'); sp.innerHTML = esc(tn.data).replace(re, '<mark>$1</mark>');
      tn.replaceWith(...sp.childNodes);
    }
  };
  const draw = () => modal(`<h3>도움말</h3><p class="sub">버튼 모양과 필기·면접 풀이 방법을 안내합니다.</p>
    <div class="seg help-seg" role="tablist">${TABS.map(([k, t]) => `<button type="button" role="tab" data-h="${k}" class="${helpTab === k ? 'on' : ''}" aria-selected="${helpTab === k}">${t}</button>`).join('')}</div>
    <div class="srch help-srch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="helpQ" placeholder="도움말 검색 (예: PDF, 동기화, 단축키)" autocomplete="off" aria-label="도움말 검색"></div>
    <div class="help-body">${T[helpTab]}</div>
    <div class="acts"><button class="btn btn-pri" data-close>닫기</button></div>`, m => {
      m.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { helpTab = b.dataset.h; draw(); });
      glue(m.querySelector('.help-body'));
      const q = m.querySelector('#helpQ');
      q.oninput = () => search(m, q.value);
    });
  draw();
}
document.getElementById('helpBtn').onclick = helpOpen;

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  const jd = document.getElementById('jd');
  if (jd){ if (e.key === 'Enter'){ e.preventDefault(); document.getElementById('jNext').click(); } else if (e.key === 'Escape') closeLayer(); return; }
  if (document.getElementById('mdl')){ if (e.key === 'Escape') closeLayer(); return; }
  if (!session || !document.getElementById('qMain')) return;
  if (['1','2','3','4'].includes(e.key)) { choose(+e.key - 1); }
  else if (e.key === 'ArrowRight') { if (session.mode === 4) nextRandom(); else go(session.cur + 1); }
  else if (e.key === 'ArrowLeft') go(session.cur - 1);
  else if (e.key === 't' || e.key === 'T') toggleTri();
});
/* 상단 메뉴: 사이트 이름이 실제로 잘릴 때만 홈·필기시험·면접시험을 숨김 */
const mastEl = document.querySelector('.mast'), brandB = document.querySelector('.brand b');
function fitNav(){ mastEl.classList.remove('tight'); if (brandB.scrollWidth > brandB.clientWidth + 1) mastEl.classList.add('tight'); }
window.addEventListener('resize', fitNav); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNav); fitNav();
const leaveTo = fn => () => (session && !session.done ? confirmLeave(fn)() : fn());
document.getElementById('navHome').onclick = leaveTo(home);
document.getElementById('navW').onclick = leaveTo(() => { stopIv(); st.kind = '필기'; stepBranch(); });
document.getElementById('navI').onclick = leaveTo(() => { ivBranch(); });
document.getElementById('brand').onclick = () => (session && !session.done ? confirmLeave(home)() : home());

updWnCnt();
home();
})();
</script>
