<style>
  /* 처리 현황: 안내판(dockets.css, HQ와 같이 씀)을 이 페이지에서만 커뮤니티 카드 모양으로 덮는다 */
  .dk-hero .wrap { padding-top: 48px; padding-bottom: 8px; }
  .dk-hero .kick { display: inline-flex; margin: 0 0 12px; padding: 4px 12px; border-radius: 999px; background: var(--accent-tint); color: var(--accent-ink); font-size: 13px; font-weight: 700; box-shadow: inset 0 0 0 1px var(--accent-ring); }
  .dk-hero h1 { margin: 0; font-size: clamp(30px, 5vw, 40px); font-weight: 800; letter-spacing: -.035em; line-height: 1.2; }
  .dk-hero .lead { margin: 10px 0 0; font-size: 16.5px; color: var(--sub); max-width: 34em; }

  .finder { position: sticky; top: 60px; z-index: 5; background: color-mix(in srgb, var(--dash) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  body.has-mnav .finder { top: 56px; }
  .finder .wrap { padding-top: 14px; padding-bottom: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--panel); color: var(--mid); font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: var(--ring); transition: background-color 150ms ease-out, color 150ms ease-out; }
  .chip:hover { color: var(--ink); background: var(--hover2); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); box-shadow: none; }
  .chip span { margin-left: 5px; opacity: .7; font-variant-numeric: tabular-nums; }

  .dk-list { padding: 18px 0 72px; }
  .dk-state { padding: 40px 0; color: var(--sub); font-weight: 600; text-align: center; }
  .dk-note { margin: 30px 0 0; font-size: 13.5px; line-height: 1.75; color: var(--faint); }
  .dk-cta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }

  /* 안내판 → 카드 */
  .dk-list .boards.boards-all { grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; border: 0; }
  .dk-list .board-unit { border: 0 !important; padding: 0 !important; animation: cardIn .45s var(--ease) both; animation-delay: calc(var(--n, 0) * 50ms); }
  .dk-list .board { border: 0; border-radius: 22px; background: var(--panel); box-shadow: var(--ring); overflow: hidden; transition: transform 240ms var(--ease), box-shadow 240ms var(--ease); }
  .dk-list .board:hover { transform: translateY(-3px); box-shadow: var(--ring), var(--lift); }
  .dk-list .board-head, .dk-list .board-rejected .board-head { margin: 0; padding: 22px 22px 6px; border: 0; border-radius: 0; background: none; color: var(--ink); }
  .dk-list .board-rejected .board-head::before { display: none; }
  .dk-list .board-no { padding-right: 96px; color: var(--sub); font-size: 12.5px; font-weight: 600; }
  .dk-list .board-head h3 { margin-top: 4px; font-size: 19px; font-weight: 750; letter-spacing: -.02em; }
  .dk-list .board > .badge { top: 20px; right: 18px; transform: none !important; border: 0; border-radius: 999px; box-shadow: none; font-size: 12.5px; font-weight: 700; letter-spacing: 0; line-height: 1; padding: 7px 11px; }
  .dk-list .board > .badge-done { background: var(--green-tint); color: var(--green); box-shadow: inset 0 0 0 1px var(--green-ring); }
  .dk-list .board > .badge-new { background: var(--accent-tint); color: var(--accent-ink); box-shadow: inset 0 0 0 1px var(--accent-ring); }
  .dk-list .board > .badge-building { background: var(--c-app-bg); color: var(--c-app-fg); box-shadow: inset 0 0 0 1px var(--c-app-ring); }
  .dk-list .board > .badge-rejected { background: var(--c-gray-bg); color: var(--c-gray-fg); border: 0; box-shadow: inset 0 0 0 1px var(--c-gray-ring); }
  .dk-list .board-building { border-style: none; }
  .dk-list .specimen { position: static; display: inline-block; align-self: flex-start; margin: 4px 22px 0; transform: none; border: 0; border-radius: 6px; background: var(--c-tool-bg); color: var(--c-tool-fg); box-shadow: none; font-size: 12px; font-weight: 700; letter-spacing: 0; padding: 2px 8px; }
  .dk-list .board dl { padding: 8px 22px 0; }
  .dk-list .board dl div { padding: 10px 0; border-bottom: 0; box-shadow: 0 -1px 0 var(--line2); }
  .dk-list .board dt { color: var(--sub); font-size: 12.5px; font-weight: 600; }
  .dk-list .board dd { color: var(--text-body); font-size: 14.5px; }
  .dk-list .board-foot { min-height: 0; padding: 14px 22px 22px; }
  .dk-list .board-foot:empty { padding-bottom: 8px; }
  .dk-list .board-go { height: 40px; padding: 0 14px; border-radius: 10px; background: var(--primary); color: var(--primary-fg); box-shadow: var(--sh-btn); font-size: 14px; font-weight: 650; }
  .dk-list .board-go:hover { background: var(--primary-hover); box-shadow: var(--sh-btn); }
  .dk-list .go-text span:first-child { display: none; }
  .dk-list .board-tape { margin: 0; padding: 0; background: none; text-align: left; }
  .dk-list .board-tape span { padding: 6px 10px; border-radius: 8px; background: var(--soft); color: var(--sub); font-size: 13px; font-weight: 600; letter-spacing: 0; }
  .dk-list .done-seal, .dk-list .open-seal, .dk-list .legs { display: none; }
  @media (max-width: 640px) { .dk-list .boards.boards-all { grid-template-columns: minmax(0, 1fr); } }

<script>
(async function () {
  const D = window.BYPASS_DOCKETS;
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const listBox = document.querySelector('[data-list]');

  // 로그인 기록이 있으면 '로그인' 대신 '커뮤니티'
  try {
    const saved = JSON.parse(localStorage.getItem('sb-itzdjdgjqcpmxdfssfel-auth-token') || 'null');
    if (saved && saved.refresh_token) { const a = document.getElementById('nav-account'); a.textContent = '커뮤니티'; a.href = '/community/'; }
  } catch (e) { /* 저장소를 못 쓰면 그대로 */ }

  /* 안건은 Supabase(dockets)에서 읽는다. 운영진이 HQ › 처리 현황에서 고치면 바로 반영된다. */
  const SB_URL = 'https://itzdjdgjqcpmxdfssfel.supabase.co';
  const SB_KEY = 'sb_publishable_L2FP31VpA_dZfwqH4u6H0Q_UWJlCS6G';
  let all;
  try {
    const r = await fetch(`${SB_URL}/rest/v1/dockets?select=${D.SELECT}&hidden=is.false&order=sort.asc,id.asc`, { headers: { apikey: SB_KEY } });
    if (!r.ok) throw new Error(r.status);
    all = await r.json();
  } catch (e) {
    listBox.replaceChildren(el('p', 'dk-state', '처리 현황을 불러오지 못했어요. 잠깐 뒤에 새로고침해 주세요.'));
    return;
  }
  if (!all.length) { listBox.replaceChildren(el('p', 'dk-state', '아직 올라온 게 없어요.')); return; }

  const sampleNote = D.sampleNote(all);
  if (sampleNote) document.querySelector('[data-sample-note]').append(`※ ${sampleNote}`, el('br'));

  /* 상태로 거르기: 준공 = 완료 + 신설 준공 */
  const GROUPS = [
    ['all', '전체', () => true],
    ['open', '준공', d => d.status === 'done' || d.status === 'new'],
    ['building', '공사 중', d => d.status === 'building'],
    ['rejected', '반려', d => d.status === 'rejected']
  ];

  let current = 'all';
  const chips = document.querySelector('[data-chips]');
  GROUPS.forEach(([key, name, f]) => {
    const n = all.filter(f).length;
    if (key !== 'all' && !n) return;
    const b = el('button', 'chip', name); b.type = 'button'; b.dataset.key = key;
    b.append(el('span', null, String(n)));
    b.setAttribute('aria-pressed', String(key === current));
    b.addEventListener('click', () => { current = key; render(); });
    chips.append(b);
  });
  document.querySelector('[data-finder]').hidden = chips.children.length < 3;

  function render() {
    const f = GROUPS.find(g => g[0] === current)[2];
    const shown = all.filter(f);
    const grid = el('div', 'boards boards-all');
    shown.forEach((d, i) => { const u = D.board(d, { index: i }); u.style.setProperty('--n', Math.min(i, 12)); grid.append(u); });
    listBox.replaceChildren(grid);
    [...chips.children].forEach(c => c.setAttribute('aria-pressed', String(c.dataset.key === current)));
  }
  render();
})();
</script>
