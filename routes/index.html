<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>준공 현황은 결과물로 옮겼습니다 | BYPASS</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://teambypass.vercel.app/community/">
<script>
  /* 2026-11-10: 준공 현황(/routes/)은 커뮤니티 '결과물'로 합쳤다. 예전 주소·즐겨찾기는 결과물로 보낸다.
     ?q=… 로 찾던 주소는 커뮤니티 찾기로 넘긴다. 예전 페이지는 /archive/routes/ 에 보관. */
  (function () {
    var q = new URLSearchParams(location.search).get('q');
    location.replace('/community/' + (q ? '?q=' + encodeURIComponent(q) + '#search' : '#showcase'));
  })();
</script>
</head>
<body>
<p>준공 현황은 <a href="/community/#showcase">BYPASS 커뮤니티 결과물</a>로 옮겼습니다. 예전 모습은 <a href="/archive/routes/">보관 페이지</a>에서 볼 수 있습니다.</p>
</body>
</html>
