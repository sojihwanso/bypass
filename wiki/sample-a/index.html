        K.curve((s) => M(0, -180 + 360 * s, u, 0.02), 0, 1, 180, { color: COLORS.equator, opacity: 0.85 }, g);
        K.curve((s) => M(-90 + 180 * s, 0, u, 0.025), 0, 1, 90, { color: COLORS.greenwich, tube: 0.035 }, g);
        if (u < 0.02) {
          api.label('Pn', sph(90, 0, RE * 1.1), { cls: 'small' }, g);
          api.label('그리니치 자오선', sph(52, 0, RE * 1.03), { color: COLORS.greenwich, cls: 'small', dx: 54 }, g);
          api.label('적도', sph(0, 28, RE * 1.05), { color: COLORS.equator, cls: 'small' }, g);
        }
        if (u > 0.98) {
          const fr = [Wc(-XMAX, -YMAX, 0.03), Wc(XMAX, -YMAX, 0.03), Wc(XMAX, YMAX, 0.03), Wc(-XMAX, YMAX, 0.03), Wc(-XMAX, -YMAX, 0.03)];
          K.poly(fr, { color: 0xdbe6f5, opacity: 0.6 }, g);
          [60, 30, 0, -30, -60].forEach((la) => api.label(la === 0 ? '0°' : Math.abs(la) + '°' + (la > 0 ? 'N' : 'S'), Wc(-XMAX + 1.0, RE * merc(la), 0.1), { cls: 'small', color: C.grid, fade: false }, g));
          [-120, -60, 0, 60, 120].forEach((lo) => api.label(lo === 0 ? '0°' : Math.abs(lo) + '°' + (lo > 0 ? 'E' : 'W'), Wc(RE * lo * D2R, -YMAX, 0.1), { cls: 'small', color: lo === 0 ? COLORS.greenwich : C.grid, dy: 12, fade: false }, g));
          api.label('점장도 (메르카토르 도법) · 위도 75°까지', Wc(0, YMAX, 0.1), { cls: 'small', dy: -14, fade: false }, g);
        }
      });

      // 천체와 지구 중심을 잇는 직선 (지구본일 때만)
      K.dyn('body', W, (g, p) => {
        if (p.u > 0.01) return;
        const B = sph(p.dec, -p.gha, RC), G = sph(p.dec, -p.gha, RE * 1.01);
        K.dot(B, { color: COLORS.star, size: 0.5 }, g);
        api.label('천체 M (예: 태양)', B, { color: COLORS.star, dx: 24, dy: -20 }, g);
        K.line(B, G, { color: COLORS.star, opacity: 0.9 }, g);
        K.line(G, V(0, 0, 0), { color: COLORS.star, dashed: true, xray: true, opacity: 0.7 }, g);
      });
      // 지위 GP
      K.dyn('gp', W, (g, p) => {
        const gp = gpOf(p), P = M(gp.lat, gp.lon, p.u, 0.06);
        K.dot(P, { color: COLORS.star, size: 0.17 }, g);
        api.label('GP (지위)', P, { color: COLORS.star, dy: -16, dx: -10, doc: '천체의 지위' }, g);
      });
      // 지구 중심 C (첫 단계에서만 이름 표시)
      const cen = api.group('cen', W);
      api.dot(V(0, 0, 0), { color: 0xffffff, size: 0.12 }, cen);
      api.label('지구 중심 C', V(0, 0, 0), { cls: 'small', dx: 8, dy: 24, fade: false }, cen);
      // 천의 적도 (천체가 있는 큰 구)
      const celeq = api.group('celeq', W);
      api.curve((s) => sph(0, 360 * s, RC), 0, 1, 180, { color: COLORS.equator, opacity: 0.55 }, celeq);
      p._lab = api.label('천의 적도', sph(0, 40, RC), { color: COLORS.equator, cls: 'small', doc: '천의 적도' }, celeq);   // 라벨 자르기용 기준(이 장면의 라벨 층)

      // 1. 위도 = 적위
      K.dyn('lat', W, (g, p) => {
        if (p.u > 0.01) return;
        const lg = -p.gha, d = p.dec;
        K.curve((s) => sph(d * s, lg, RC), 0, 1, 40, { color: COLORS.star, tube: 0.07 }, g);
        K.curve((s) => sph(d * s, lg, RE * 1.012), 0, 1, 30, { color: COLORS.star, tube: 0.05 }, g);
        K.line(V(0, 0, 0), sph(0, lg, RC), { color: COLORS.equator, dashed: true, xray: true, opacity: 0.6 }, g);
        api.label('d = ' + (d >= 0 ? 'N' : 'S') + fm(Math.abs(d)) + ' (적위)', sph(d / 2, lg, RC * 1.03), { color: COLORS.star, cls: 'val', doc: '적위', dx: 70 }, g);
        api.label('GP 위도 = d', sph(d / 2, lg, RE * 1.06), { color: COLORS.star, cls: 'small val', dx: 52 }, g);
      });
      // 2. 경도 = GHA
      K.dyn('lon', W, (g, p) => {
        if (p.u > 0.01) return;
        const gha = p.gha, west = gha <= 180, lonArc = west ? -gha : 360 - gha;
        K.curve((s) => sph(-22 + 44 * s, 0, RC), 0, 1, 30, { color: COLORS.greenwich, opacity: 0.9 }, g);
        K.line(V(0, 0, 0), sph(0, 0, RC), { color: COLORS.greenwich, dashed: true, xray: true, opacity: 0.6 }, g);
        api.label('G 그리니치 천의 자오선', sph(24, 0, RC), { color: COLORS.greenwich, cls: 'small' }, g);
        K.curve((s) => sph(0, -gha * s, RC * 1.02), 0, 1, Math.max(12, Math.ceil(gha / 2)), { color: COLORS.greenwich, tube: 0.07 }, g);
        api.label('GHA ' + fm(gha), sph(0, -gha / 2, RC * 1.09), { color: COLORS.greenwich, cls: 'val', doc: '본초시각' }, g);
        K.curve((s) => sph(0, lonArc * s, RE * 1.015), 0, 1, Math.max(12, Math.ceil(Math.abs(lonArc) / 2)), { color: COLORS.greenwich, tube: 0.05 }, g);
        api.label('GP 경도 ' + fLon(lonArc), sph(-9, lonArc / 2, RE * 1.04), { color: COLORS.greenwich, cls: 'small val', doc: '지위 구하기' }, g);
      });

      // 3. 위치권 (현재 고도)
      K.dyn('circle', W, (g, p) => {
        const gp = gpOf(p), r = 90 - p.h;
        pieces(circlePts(gp, r, 180), p.u).forEach((pc) => K.poly(pc.map((q) => M(q.lat, q.lon, p.u, 0.05)), { color: C.circle, tube: 0.055 }, g));
        // 지구본에서는 O 옆, 점장도에서는 O 반대쪽(확대경과 겹치지 않게)에 이름을 단다
        let q = dest(gp.lat, gp.lon, p.u < 0.5 ? p.oz - 40 : p.oz + 180, r);
        if (p.u >= 0.5 && Math.abs(q.lat) > LATMAX - 3) q = dest(gp.lat, gp.lon, p.oz + 90, r);
        api.label('위치권 h = ' + (+p.h.toFixed(1)) + '°', M(q.lat, q.lon, p.u, 0.08), { color: C.circle, doc: '위치권', dx: p.u < 0.5 ? 46 : 0, dy: p.u < 0.5 ? 0 : -14 }, g);
      });
      // 4. 다른 고도의 위치권 (그림 8.5)
      K.dyn('rings', W, (g, p) => {
        const gp = gpOf(p);
        RINGS.forEach((hh) => {
          if (Math.abs(hh - p.h) < 0.6) return;
          const still = p.u === 0 || p.u === 1;   // 펼치는 동안은 가는 선으로만
          pieces(circlePts(gp, 90 - hh, 144), p.u).forEach((pc) => K.poly(pc.map((q) => M(q.lat, q.lon, p.u, 0.04)), { color: C.circle, opacity: 0.4, tube: still ? 0.022 : 0 }, g));
        });
      });
      // 관측자 O: 천정·수평면·고도 h·천체 방향(평행), GP 까지의 반지름
      K.dyn('obs', W, (g, p) => {
        const gp = gpOf(p), o = obsOf(p), r = 90 - p.h;
        const O = M(o.lat, o.lon, p.u, 0.07);
        K.dot(O, { color: 0xffffff, size: 0.15 }, g);
        api.label('관측자 O', O, { cls: 'small', dy: 14, dx: 20 }, g);
        if (p.u > 0.01) return;
        const n = sph(o.lat, o.lon, 1), gv = sph(gp.lat, gp.lon, 1), Os = sph(o.lat, o.lon, RE);
        const hv = gv.clone().sub(n.clone().multiplyScalar(gv.dot(n))).normalize();
        const GPs = sph(gp.lat, gp.lon, RE);
        K.arc(GPs, Os, { r: RE * 1.014, color: C.radius, tube: 0.03 }, g);
        const mid = GPs.clone().add(Os).normalize().multiplyScalar(RE * 1.02);
        api.label('90° − h = ' + (+r.toFixed(1)) + '°', mid, { color: C.radius, cls: 'small val', doc: '정거', dx: 58 }, g);
        K.line(GPs, GPs.clone().addScaledVector(gv, 1.6), { color: COLORS.star, opacity: 0.85 }, g);
        K.disk(n, { r: 1.3, center: Os.clone().addScaledVector(n, 0.02), color: COLORS.horizon, opacity: 0.32 }, g);
        K.line(Os, Os.clone().addScaledVector(n, 2.3), { color: COLORS.meridian }, g);
        api.label('천정', Os.clone().addScaledVector(n, 2.5), { cls: 'small' }, g);
        K.line(Os, Os.clone().addScaledVector(gv, 3.2), { color: COLORS.star }, g);
        api.label('천체 방향', Os.clone().addScaledVector(gv, 2.4), { color: COLORS.star, cls: 'small', dy: -12 }, g);
        const hr = p.h * D2R;
        K.curve((s) => Os.clone().addScaledVector(hv, 1.1 * Math.cos(hr * s)).addScaledVector(n, 1.1 * Math.sin(hr * s)), 0, 1, 24, { color: COLORS.horizon, tube: 0.035 }, g);
        api.label('h', Os.clone().addScaledVector(hv, 1.75 * Math.cos(hr / 2)).addScaledVector(n, 1.75 * Math.sin(hr / 2)), { color: COLORS.horizon, cls: 'val' }, g);
      });

      // 6. 확대경: O 둘레 ±40해리 — 위치권과 위치선, Sumner 의 세 점
      K.dyn('zoom', W, (g, p) => {
        if (p.u < 0.98) return;
        const gp = gpOf(p), o = obsOf(p), r = 90 - p.h, zn = brgTo(o, gp);
        const oc = chartXY(o.lat, o.lon);
        const HS = 5.2, NM = 40, k = HS / NM;
        const cx = oc.x + (oc.x < 0 ? 1 : -1) * 9.6, cy = clamp(oc.y, -YMAX + HS + 0.3, YMAX - HS - 0.3);
        const L = (e, nn, dep) => Wc(cx + e * k, cy + nn * k, dep);
        const cosO = Math.cos(o.lat * D2R);
        const loc = (q) => ({ e: w180(q.lon - o.lon) * 60 * cosO, n: (q.lat - o.lat) * 60 });
        const lens = K.disk(V(1, 0, 0), { r: HS, center: Wc(cx, cy, 0.3), color: 0x0b1526, opacity: 0.94 }, g);
        lens.renderOrder = 5;
        K.curve((s) => L(NM * Math.cos(2 * Math.PI * s), NM * Math.sin(2 * Math.PI * s), 0.36), 0, 1, 96, { color: 0xdbe6f5, opacity: 0.75, order: 6 }, g);
        const Oc = Wc(oc.x, oc.y, 0.32);
        K.curve((s) => Wc(oc.x + 0.28 * Math.cos(2 * Math.PI * s), oc.y + 0.28 * Math.sin(2 * Math.PI * s), 0.32), 0, 1, 32, { color: 0xdbe6f5, order: 6 }, g);
        [NM, -NM].forEach((nn) => K.line(Oc, L(0, nn, 0.36), { color: 0xdbe6f5, opacity: 0.45, dashed: true, order: 6 }, g));
        const inside = (q) => q.e * q.e + q.n * q.n <= 38 * 38;
        // 위도 10′ 간격의 거등권 세 개와 그 위의 위치권 점 (Sumner)
        const sp = [];
        [-1, 0, 1].forEach((kk) => {
          const la = o.lat + kk * 10 / 60, nn = kk * 10, half = Math.sqrt(38 * 38 - nn * nn);
          K.line(L(-half, nn, 0.38), L(half, nn, 0.38), { color: C.grid, opacity: 0.35, order: 6 }, g);
          const c = (Math.cos(r * D2R) - Math.sin(la * D2R) * Math.sin(gp.lat * D2R)) / (Math.cos(la * D2R) * Math.cos(gp.lat * D2R));
          if (Math.abs(c) > 1) return;
          const sgn = w180(o.lon - gp.lon) >= 0 ? 1 : -1;
          const q = loc({ lat: la, lon: gp.lon + sgn * Math.acos(c) * R2D });
          if (inside(q)) sp.push(q);
        });
        // 위치권(실제 소권) — O 근처를 촘촘히
        const dd = 1.2 / Math.max(0.02, Math.sin(r * D2R));
        const arcPts = [];
        for (let i = 0; i <= 120; i++) arcPts.push(loc(dest(gp.lat, gp.lon, p.oz - dd + 2 * dd * i / 120, r)));
        let cur = []; const segs = [];
        arcPts.forEach((q) => { if (inside(q)) cur.push(q); else { if (cur.length > 1) segs.push(cur); cur = []; } });
        if (cur.length > 1) segs.push(cur);
        segs.forEach((sg) => K.poly(sg.map((q) => L(q.e, q.n, 0.42)), { color: C.circle, tube: 0.06, order: 7 }, g));
        // 위치선: O 에서 방위선에 수직
        const ue = Math.cos(zn * D2R), un = -Math.sin(zn * D2R);
        K.line(L(-37 * ue, -37 * un, 0.46), L(37 * ue, 37 * un, 0.46), { color: C.lop, order: 8 }, g);
        K.poly([L(-37 * ue, -37 * un, 0.45), L(37 * ue, 37 * un, 0.45)], { color: C.lop, tube: 0.025, order: 8 }, g);
        // 천체 방향
        const ae = Math.sin(zn * D2R), an = Math.cos(zn * D2R);
        K.poly([L(0, 0, 0.44), L(24 * ae, 24 * an, 0.44)], { color: CN3D.COLORS.star, tube: 0.03, order: 8 }, g);
        sp.forEach((q) => K.dot(L(q.e, q.n, 0.5), { color: 0xffffff, size: 0.11 }, g));
        K.dot(L(0, 0, 0.5), { color: 0xffffff, size: 0.15 }, g);
        const lab = (t, v, o2) => api.label(t, v, Object.assign({ fade: false }, o2), g);
        lab('O 둘레 ±40해리 확대', L(0, -NM, 0.5), { cls: 'small', dy: 14 });
        const endA = ue >= 0 ? 1 : -1;
        lab('위치선', L(endA * 30 * ue, endA * 30 * un, 0.5), { doc: '위치선', dy: endA * un >= 0 ? -14 : 14 });
        lab('위치권', L(-endA * 30 * ue, -endA * 30 * un, 0.5), { color: C.circle, doc: '위치권', dy: -endA * un >= 0 ? -14 : 14 });
        lab('천체 Zn ' + pad3(zn) + '°', L(26 * ae, 26 * an, 0.5), { color: CN3D.COLORS.star, cls: 'small', dy: an >= 0 ? -10 : 10 });
        if (sp.length) lab('흰 점: 위도 10′ 간격의 세 위치 (Sumner)', L(0, -NM, 0.5), { cls: 'small', dy: 34 });
      });
    },
    readout(p, api) {
      const gp = gpOf(p), west = p.gha <= 180, lonV = west ? p.gha : 360 - p.gha;
      const z = 90 - p.h, o = obsOf(p);
      const aa = api.altAz(o.lat, p.dec, api.norm360(p.gha + o.lon));
      const gap = 40 * 40 / (2 * NMR * Math.tan(z * D2R));
      return [
        ['GHA', fm(p.gha)], ['Dec', (p.dec >= 0 ? 'N' : 'S') + fm(Math.abs(p.dec))],
        ['GP 위도 L_GP', fLat(gp.lat)], ['GP 경도 λ_GP', fm(lonV) + (west ? 'W' : 'E')],
        ['관측고도 h', fm(p.h)], ['위치권 반지름 90° − h', fm(z) + ' = ' + fNM(z * 60) + '해리'],
        ['관측자 O', fLat(o.lat) + ' ' + fLon(o.lon)], ['O에서 계산한 고도', fm(aa.h)],
        ['40해리 지점 위치선–위치권 간격', gap.toFixed(2) + '해리'],
        'L_GP = d = ' + fLat(p.dec) + '   (식 8.1)',
        west ? 'λ_GP = GHA = ' + fm(p.gha) + 'W   (식 8.2)' : 'λ_GP = 360° − GHA = 360° − ' + fm(p.gha) + ' = ' + fm(lonV) + 'E',
        '반지름 = (90° − ' + fm(p.h) + ') × 60 = ' + fNM(z * 60) + '해리'
      ];
    },
    tick(dt, p) {
      clipLabels(p._lab && p._lab.element.parentNode);
      const target = p.merc ? 1 : 0;
      if (p.u === target) return false;
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const st = reduce ? 1 : dt / 1.2;
      p.u = p.u < target ? Math.min(target, p.u + st) : Math.max(target, p.u - st);
      return true;
    }
  });
})();

/* 장면 11 — 고도차법 작도: 두 위치권과 고도차, 방위선, T·A, 위치선, 위치기입도(Sun Sighting·Star Sighting), 위치선의 전위와 교점 */
(function () {
  const D2R = Math.PI / 180, R2D = 180 / Math.PI;
  const RG = 6;                                   // 지구 반지름(장면 단위)
  const AP = { lat: -35, lon: 132 + 20.4 / 60 };  // Sun Sighting 의 가정위치 (교재 163쪽) — 개념 단계에서도 쓴다
  const C = { hc: 0x9be7d8, ho: 0xff5d8f, lop: 0xffffff, sheet: 0x112338, frame: 0xdbe6f5, g10: 0x2c4566, g60: 0x6f8fb8 };
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const n360 = (x) => ((x % 360) + 360) % 360;
  const w180 = (x) => ((x + 180) % 360 + 360) % 360 - 180;
  const fm = (v) => CN3D.fmtDM(v);
  const fLat = (v) => { const t = fm(Math.abs(v)); return (Math.abs(v) < 9.99995 ? '0' : '') + t + (v >= 0 ? 'N' : 'S'); };
  const fLon = (v, pad) => CN3D.fmtDM(Math.abs(v), { pad3: pad }) + (v >= 0 ? 'E' : 'W');
  // 033°.2 형식
  const fZn = (v) => { let r = Math.round(n360(v) * 10) / 10, d = Math.floor(r), t = Math.round((r - d) * 10); if (t === 10) { d += 1; t = 0; } return String(d % 360).padStart(3, '0') + '°.' + t; };
  const fZi = (v) => String(Math.round(n360(v)) % 360).padStart(3, '0') + '°';
  // 분 단위 15′.3 형식 (부호 없음)
  const fMin = (m) => { const s = (Math.round(Math.abs(m) * 10) / 10).toFixed(1).split('.'); return s[0] + '′.' + s[1]; };
  // 화면(무대) 밖으로 나간 라벨은 숨긴다 — CSS2D 라벨은 화면 밖에서도 그려져 옆 패널을 덮을 수 있다
  function clipLabels(root) {
    if (!root) return;
    const W = root.clientWidth, H = root.clientHeight;
    root.querySelectorAll('.lb').forEach((el) => {
      const m = /translate\(([-\d.e]+)px,\s*([-\d.e]+)px\)/.exec(el.style.transform);
      if (!m) return;
      const x = +m[1] + (parseFloat(el.style.marginLeft) || 0), y = +m[2] + (parseFloat(el.style.marginTop) || 0);
      const hw = el.offsetWidth / 2, hh = el.offsetHeight / 2, out = x - hw < -2 || x + hw > W + 2 || y - hh < -2 || y + hh > H + 2;
      el.style.visibility = out ? 'hidden' : '';
    });
  }

  // ---------- 구면 ----------
  function sph(phi, lam, r) {   // 그리니치 = +x, 북극 = +y, 서경 쪽 = +z
    const f = phi * D2R, l = lam * D2R;
    return V(r * Math.cos(f) * Math.cos(l), r * Math.sin(f), -r * Math.cos(f) * Math.sin(l));
  }
  const north = (phi, lam) => { const f = phi * D2R, l = lam * D2R; return V(-Math.sin(f) * Math.cos(l), Math.cos(f), Math.sin(f) * Math.sin(l)); };
  const east = (phi, lam) => { const l = lam * D2R; return V(-Math.sin(l), 0, -Math.cos(l)); };
  function dest(phi, lam, brg, r) {
    const f = phi * D2R, b = brg * D2R, d = r * D2R;
    const f2 = Math.asin(clamp(Math.sin(f) * Math.cos(d) + Math.cos(f) * Math.sin(d) * Math.cos(b), -1, 1));
    const l2 = lam * D2R + Math.atan2(Math.sin(b) * Math.sin(d) * Math.cos(f), Math.cos(d) - Math.sin(f) * Math.sin(f2));
    return { lat: f2 * R2D, lon: w180(l2 * R2D) };
  }
  function brgTo(a, b) {
    const f1 = a.lat * D2R, f2 = b.lat * D2R, dl = (b.lon - a.lon) * D2R;
    return n360(Math.atan2(Math.sin(dl) * Math.cos(f2), Math.cos(f1) * Math.sin(f2) - Math.sin(f1) * Math.cos(f2) * Math.cos(dl)) * R2D);
  }
  // 개념 단계의 점들: GP, 수정점 E, 실제 선위 O
  function concept(p) {
    const gp = dest(AP.lat, AP.lon, p.zn, 90 - p.hc), a = p.ho - p.hc;
    const E = dest(AP.lat, AP.lon, a >= 0 ? p.zn : p.zn + 180, Math.abs(a));
    const O = dest(gp.lat, gp.lon, brgTo(gp, E) + 8, 90 - p.ho);
    return { gp, a, E, O };
  }

  // ---------- 교재 예제 (평면 위치기입도, 해리 단위: 위도 1′ = 1해리, 동서거리 = Δλ·cos L) ----------
  // Sun Sighting (교재 162–164쪽)
  const SUN = { aL: -35, al: 132 + 20.4 / 60, hc: 35 + 51.4 / 60, ho: 36 + 6.7 / 60, zn: 33.2, ht: 36 + 29.3 / 60, dd: -37.9, z0: 146.5, zc: 0.3,
    dr: { lat: -(34 + 45 / 60), lon: 132 + 12 / 60 } };
  SUN.cos = Math.cos(35 * D2R);
  SUN.E = (lon) => (lon - SUN.al) * 60 * SUN.cos; SUN.N = (lat) => (lat - SUN.aL) * 60;
  SUN.a = Math.round((SUN.ho - SUN.hc) * 600) / 10;                         // 15′.3
  SUN.ip = { e: SUN.a * Math.sin(SUN.zn * D2R), n: SUN.a * Math.cos(SUN.zn * D2R) };
  // Star Sighting (교재 165–168쪽): ZT, 가정경도, Hc, Ho, Zn
  const STARS = [
    { name: 'Regulus', zt: '1806', sec: 18 * 3600 + 6 * 60 + 15, al: 81 + 51.8 / 60, ghaA: 28 + 8.2 / 60, lha: 110, hc: 47 + 48 / 60, ho: 47 + 54 / 60, zn: 79, col: 0x7fe3ff },
    { name: 'Canopus', zt: '1808', sec: 18 * 3600 + 8 * 60, al: 81 + 25.5 / 60, ghaA: 28 + 34.5 / 60, lha: 110, hc: 30 + 7 / 60, ho: 29 + 58.5 / 60, zn: 190, col: 0xffa55a },
    { name: 'Capella', zt: '1820', sec: 18 * 3600 + 20 * 60, al: 81 + 25 / 60, ghaA: 31 + 35 / 60, lha: 113, hc: 40 + 39 / 60, ho: 40 + 29.1 / 60, zn: 330, col: 0xe0b0ff }
  ];
  const ST = { aL: 6, lon0: 81.5, cos: Math.cos(6 * D2R), course: 70, speed: 20, tfix: 18 * 3600 + 20 * 60, dr: { lat: 5 + 53 / 60, lon: 80 + 43 / 60 } };
  ST.E = (lon) => (lon - ST.lon0) * 60 * ST.cos; ST.N = (lat) => (lat - ST.aL) * 60;
  const cE = Math.sin(ST.course * D2R), cN = Math.cos(ST.course * D2R);
  STARS.forEach((s) => {
    s.a = Math.round((s.ho - s.hc) * 600) / 10;                               // +6.0, −8.5, −9.9
    s.ap = { e: ST.E(s.al), n: 0 };
    s.ip = { e: s.ap.e + s.a * Math.sin(s.zn * D2R), n: s.a * Math.cos(s.zn * D2R) };
    s.dt = ST.tfix - s.sec; s.adv = ST.speed * s.dt / 3600;                    // 전위 거리(해리)
    s.ip2 = { e: s.ip.e + s.adv * cE, n: s.ip.n + s.adv * cN };
    s.u = { e: Math.cos(s.zn * D2R), n: -Math.sin(s.zn * D2R) };              // 위치선 방향(방위선에 수직)
  });
  function meet(s1, s2) {   // 두 (전위한) 위치선의 교점: 법선 (sin Zn, cos Zn)
    const a1 = Math.sin(s1.zn * D2R), b1 = Math.cos(s1.zn * D2R), c1 = a1 * s1.ip2.e + b1 * s1.ip2.n;
    const a2 = Math.sin(s2.zn * D2R), b2 = Math.cos(s2.zn * D2R), c2 = a2 * s2.ip2.e + b2 * s2.ip2.n;
    const det = a1 * b2 - a2 * b1;
    return { e: (c1 * b2 - c2 * b1) / det, n: (a1 * c2 - a2 * c1) / det };
  }
  const TRI = [meet(STARS[0], STARS[1]), meet(STARS[0], STARS[2]), meet(STARS[1], STARS[2])];
  const FIX = { e: (TRI[0].e + TRI[1].e + TRI[2].e) / 3, n: (TRI[0].n + TRI[1].n + TRI[2].n) / 3 };
  FIX.lat = ST.aL + FIX.n / 60; FIX.lon = ST.lon0 + FIX.e / ST.cos / 60;
  const triSide = Math.max(...[[0, 1], [1, 2], [0, 2]].map(([i, j]) => Math.hypot(TRI[i].e - TRI[j].e, TRI[i].n - TRI[j].n)));

  // ---------- 위치기입도 배치 ----------
  // 두 용지는 지구본 아래 멀리(y = −300) 놓아 지구본 시점에는 보이지 않게 한다
  const SY = -300;
  const SS = { X: 0, k: 0.4, e0: -22, e1: 36, n0: -22, n1: 32 };    // Sun 용지
  const TS = { X: 60, k: 0.45, e0: -14, e1: 38, n0: -14, n1: 16 };  // Star 용지
  [SS, TS].forEach((S) => { S.ec = (S.e0 + S.e1) / 2; S.nc = (S.n0 + S.n1) / 2; S.P = (e, n, z) => V(S.X + (e - S.ec) * S.k, SY + (n - S.nc) * S.k, z || 0); });

  // ---------- 시점 ----------
  const cams = (() => {
    const p0 = { hc: 45, ho: 51, zn: 33.2 }, c = concept(p0);
    const mid = sph(AP.lat, AP.lon, 1).add(sph(c.gp.lat, c.gp.lon, 1)).normalize();
    const t = dest(AP.lat, AP.lon, p0.zn, 3), T = sph(t.lat, t.lon, RG), n = T.clone().normalize();
    return {
      globe: { pos: mid.clone().multiplyScalar(23).toArray(), target: [0, 0, 0], label: '지구본' },
      near: { pos: T.clone().addScaledVector(n, 4.6).addScaledVector(north(t.lat, t.lon), -0.9).toArray(), target: T.toArray(), up: north(t.lat, t.lon).toArray(), label: 'AP 근처' },
      sun: { pos: [SS.X, SY, 60], target: [SS.X, SY, 0], ortho: true, label: 'Sun 작도' },
      star: { pos: [TS.X, SY, 60], target: [TS.X, SY, 0], ortho: true, label: 'Star 작도' }
    };
  })();

  // dyn 그룹용 그리기 도구: 다시 그릴 때마다 이전 기하·재질을 해제한다(슬라이더로 메모리가 쌓이지 않게)
  function kit(api) {
    const ball = new THREE.SphereGeometry(1, 16, 12);
    const own = (o, parent) => { o.userData.own = true; parent.add(o); return o; };
    const K = {
      dyn(name, parent, fn) {
        return api.dyn(name, parent, (g, p) => {
          (g.userData.prev || []).forEach((o) => o.traverse((c) => {
            if (!c.userData.own) return;
            if (c.geometry && !c.userData.shared) c.geometry.dispose();
            if (c.material) c.material.dispose();
          }));
          fn(g, p);
          g.userData.prev = g.children.slice();
        });
      },
      poly(pts, o, parent) {
        o = o || {}; const op = o.opacity == null ? 1 : o.opacity;
        let obj;
        if (o.tube) {
          const geo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, false, 'centripetal'), Math.max(8, Math.min(400, pts.length * 2)), o.tube, 8, false);
          obj = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: o.color, transparent: true, opacity: op }));
          obj.userData.drawCount = geo.index.count;
        } else {
          const mat = o.dashed ? new THREE.LineDashedMaterial({ color: o.color, dashSize: o.dash || 0.3, gapSize: (o.dash || 0.3) * 0.7, transparent: true, opacity: op })
            : new THREE.LineBasicMaterial({ color: o.color, transparent: true, opacity: op });
          obj = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat);
          if (o.dashed) obj.computeLineDistances();
          obj.userData.drawCount = pts.length;
        }
        obj.renderOrder = o.order || 0;
        return own(obj, parent);
      },
      curve(f, s0, s1, n, o, parent) { const pts = []; for (let i = 0; i <= n; i++) pts.push(f(s0 + (s1 - s0) * i / n)); return K.poly(pts, o, parent); },
      line(a, b, o, parent) { return K.poly([a, b], o, parent); },
      dot(v, o, parent) {
        const m = new THREE.Mesh(ball, new THREE.MeshBasicMaterial({ color: o.color, transparent: true, opacity: 1 }));
        m.scale.setScalar(o.size || 0.2); m.position.copy(v); m.userData.shared = true;
        return own(m, parent);
      },
      // 구 위 대권 호 (반지름 r)
      gc(a, b, o, parent) {
        const ua = sph(a.lat, a.lon, 1), ub = sph(b.lat, b.lon, 1), ang = ua.angleTo(ub);
        if (ang < 1e-6) return null;
        const ax = V(0, 0, 0).crossVectors(ua, ub).normalize();
        return K.curve((s) => ua.clone().applyAxisAngle(ax, ang * s).multiplyScalar(o.r), 0, 1, Math.max(8, Math.ceil(ang * R2D)), o, parent);
      }
    };
    return K;
  }

  // 위치기입도 바탕: 용지·테두리·경위선(10′ 간격)·눈금 이름
  function sheetBase(api, g, S, mer, par) {
    const w = (S.e1 - S.e0) * S.k, h = (S.n1 - S.n0) * S.k;
    const bg = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: C.sheet, transparent: true, opacity: 0.97 }));
    bg.position.copy(S.P(S.ec, S.nc, -0.03)); g.add(bg);
    mer.forEach((m) => {
      api.line(S.P(m.e, S.n0, 0), S.P(m.e, S.n1, 0), { color: m.label ? C.g60 : C.g10, opacity: m.label ? 0.9 : 0.8 }, g);
      if (m.label) api.label(m.label, S.P(m.e, S.n1, 0), { cls: 'small', color: 0xb9cbe2, dy: -11, fade: false }, g);
    });
    par.forEach((q) => {
      api.line(S.P(S.e0, q.n, 0), S.P(S.e1, q.n, 0), { color: q.label ? C.g60 : C.g10, opacity: q.label ? 0.9 : 0.8 }, g);
      if (q.label) api.label(q.label, S.P(S.e0, q.n, 0), { cls: 'small', color: 0xb9cbe2, dx: 30, dy: -9, fade: false }, g);
    });
    api.poly([S.P(S.e0, S.n0, 0.01), S.P(S.e1, S.n0, 0.01), S.P(S.e1, S.n1, 0.01), S.P(S.e0, S.n1, 0.01), S.P(S.e0, S.n0, 0.01)], { color: C.frame, opacity: 0.75 }, g);
  }
  // 직선 (점 c 를 지나고 방향 u)을 용지 안으로 자른 선분
  function clipLine(S, c, u, pad) {
    pad = pad || 0.5;
    let t0 = -1e9, t1 = 1e9;
    [['e', S.e0 + pad, S.e1 - pad], ['n', S.n0 + pad, S.n1 - pad]].forEach(([k, lo, hi]) => {
      if (Math.abs(u[k]) < 1e-9) return;
      const a = (lo - c[k]) / u[k], b = (hi - c[k]) / u[k];
      t0 = Math.max(t0, Math.min(a, b)); t1 = Math.min(t1, Math.max(a, b));
    });
    return [{ e: c.e + u.e * t0, n: c.n + u.n * t0 }, { e: c.e + u.e * t1, n: c.n + u.n * t1 }];
  }

  CN3D.register({
    id: 11,
    name: '고도차법 작도',
    concepts: ['고도차법', '가정위치', '계산고도·계산방위각', '고도차 부호 T·A', '위치선', '위치기입도 작도', '△d 개정법', 'Sun Sighting', 'Star Sighting', '위치선의 교점과 전위'],
    params: [
      { key: 'hc', label: '계산고도 Hc', min: 10, max: 80, step: 'any', value: 45, fmt: (v) => CN3D.fmtDM(v), onChange: (p) => { p.stage = 0; } },
      { key: 'ho', label: '관측고도 Ho', min: 10, max: 80, step: 'any', value: 51, fmt: (v) => CN3D.fmtDM(v), onChange: (p) => { p.stage = 0; } },
      { key: 'zn', label: '방위 Zn', min: 0, max: 359.9, step: 0.1, value: 33.2, fmt: (v) => fZn(v), onChange: (p) => { p.stage = 0; } },
      { key: 'stage', label: '', min: 0, max: 3, value: 0, hidden: true },
      { key: 'nz', label: '', min: 0, max: 1, value: 1, hidden: true }
    ],
    cams,
    camButtons: ['globe', 'near', 'sun', 'star'],
    startCam: 'globe',
    orthoSize: 14.5,
    steps: [
      { title: '두 위치권과 고도차', text: 'GP를 중심으로 계산고도 Hc의 위치권은 가정위치 <b>AP</b>를, 관측고도 Ho의 위치권은 실제 선위 <b>O</b>를 지난다. 두 원은 동심원이므로 GP를 향한 반지름 위에서 잰 간격이 <b>고도차 a = Ho − Hc</b>다(그림 8.7). 잘 보이도록 고도차를 6°로 크게 잡았다.', add: ['earth', 'circ', 'farL'], set: { stage: 0, nz: 0 }, cam: 'globe' },
      { title: '방위선 긋기', text: 'AP에서 계산방위 <b>Zn</b> 쪽으로, 곧 GP를 향하는 대권을 긋는다. Zn은 진북에서 시계방향으로 잰 방위다.', add: ['azi', 'nearL'], remove: ['farL'], set: { stage: 0, nz: 1 }, cam: 'near' },
      { title: '고도차 부호 T·A', text: 'Ho > Hc이면 선박이 AP보다 GP에 가깝다. 그래서 AP에서 방위 쪽으로 a만큼 간다(<b>T, Toward</b>). Ho < Hc이면 반대 방위 쪽이다(<b>A, Away</b>). HoMoTo(호모토)로 기억한다. Ho 슬라이더를 Hc보다 작게 해 보자.', add: ['icpt'], set: { stage: 0, nz: 1 }, cam: 'near' },
      { title: '수정점에서 수직선: 위치선', text: '방위선 위로 a만큼 간 점이 <b>수정점</b>이다. 여기서 방위선에 수직인 선, 곧 Ho 위치권의 접선을 그으면 <b>위치선</b>이다. 선박 O는 이 선 가까이에 있다.', add: ['lop'], set: { stage: 0, nz: 1 }, cam: 'near' },
      { title: '위치기입도에 옮기기', text: 'Sun Sighting 예제(교재 162–164쪽)를 위치기입도에 작도한다. △d 개정법으로 정한 가정위치 aL 35°00′.0S(정수 위도), aλ 132°20′.4E(LHA가 333°00′.0으로 정수 도)를 먼저 기입한다. 경도 눈금 간격은 위도 눈금의 cos 35°배다.', add: ['sun0'], remove: ['earth', 'circ', 'nearL', 'azi', 'icpt', 'lop'], set: { stage: 1 }, cam: 'sun' },
      { title: 'Sun Sighting 작도', text: 'AP에서 Zn 033°.2 쪽으로 방위선을 긋는다. Ho 36°06′.7이 Hc 35°51′.4보다 크므로 15′.3을 방위 쪽(Toward)으로 가서 수정점을 잡고, 방위선에 수직으로 그으면 1020의 태양 위치선이다.', add: ['sun1'], set: { stage: 1 }, cam: 'sun' },
      { title: 'Star Sighting: 세 위치선', text: '박명시에 Regulus(1806), Canopus(1808), Capella(1820)를 관측했다. 가정위도는 모두 6°N이고 가정경도는 LHA♈가 정수 도가 되도록 별마다 따로 정했다. 6′.0 T, 8′.5 A, 9′.9 A로 세 위치선을 작도한다.', add: ['star0', 'starL'], remove: ['sun0', 'sun1'], set: { stage: 2 }, cam: 'star' },
      { title: '전위와 교점: 1820 선위', text: '먼저 잰 위치선을 침로 070° 쪽으로 그동안 항주한 거리만큼 평행이동(<b>전위</b>)한다. Regulus는 13분 45초 × 20노트 = 4.6해리, Canopus는 12분 × 20노트 = 4.0해리다. 세 선이 이루는 작은 삼각형의 중심을 1820의 선위로 잡는다.', add: ['star1'], set: { stage: 3 }, cam: 'star' }
    ],
    focus: { '고도차법': 0, '가정위치': 0, '고도차 부호 T·A': 2, '위치선': 3, '위치기입도 작도': 4, '△d 개정법': 4, 'Sun Sighting': 5, 'Star Sighting': 6, '위치선의 교점과 전위': 7 },
    explore: { show: ['earth', 'circ', 'nearL', 'azi', 'icpt', 'lop', 'sun0', 'sun1', 'star0', 'starL', 'star1'], cam: 'near' },
    build(api, p) {
      const { COLORS } = api;
      const W = api.world, K = kit(api);
      const S3 = (q, r) => sph(q.lat, q.lon, r || RG * 1.006);

      // ===== 개념: 지구 위의 두 위치권 =====
      // nz = 1 이면 AP 근처를 가까이서 보는 단계 — 선 굵기·점 크기를 줄인다
      const th = (p) => (p.nz ? 0.42 : 1);
      const at = (q, brg, d) => S3(dest(q.lat, q.lon, brg, d));   // q 에서 방위 brg 로 d° 떨어진 지점(라벨 자리)
      const earth = api.group('earth', W);
      api.earth(RG, { opacity: 0.95 }, earth);

      K.dyn('circ', W, (g, p) => {
        const c = concept(p), r1 = 90 - p.hc, r2 = 90 - p.ho, k = th(p);
        const ring = (r, col) => K.curve((s) => S3(dest(c.gp.lat, c.gp.lon, 360 * s, r)), 0, 1, 240, { color: col, tube: 0.035 * k }, g);
        ring(r1, C.hc); ring(r2, C.ho);
        K.gc(c.gp, AP, { r: RG * 1.008, color: C.hc, dashed: true, dash: 0.18 * k }, g);
        K.gc(c.gp, c.O, { r: RG * 1.008, color: C.ho, dashed: true, dash: 0.18 * k }, g);
        const G = S3(c.gp), gn = G.clone().normalize();
        K.dot(G, { color: COLORS.star, size: 0.17 }, g);
        K.line(G, G.clone().addScaledVector(gn, 1.4), { color: COLORS.star }, g);
        api.label('GP', G, { color: COLORS.star, doc: '천체의 지위', dy: -14 }, g);
        K.dot(S3(AP, RG * 1.012), { color: 0xffffff, size: 0.12 * k }, g);
        api.label('AP 가정위치', S3(AP), { doc: '가정위치', dx: -50, dy: 12 }, g);
        K.dot(S3(c.O, RG * 1.012), { color: C.ho, size: 0.11 * k }, g);
        api.label('O 실제 선위', S3(c.O), { color: C.ho, cls: 'small', dx: -44, dy: -8 }, g);
      });
      // 지구본 전체를 볼 때의 이름표: 두 위치권과 두 정거
      K.dyn('farL', W, (g, p) => {
        const c = concept(p), r1 = 90 - p.hc, r2 = 90 - p.ho;
        api.label('90° − Hc', at(c.gp, brgTo(c.gp, AP), r1 * 0.7), { color: C.hc, cls: 'small val', dx: 40 }, g);
        api.label('90° − Ho', at(c.gp, brgTo(c.gp, c.O), r2 * 0.3), { color: C.ho, cls: 'small val', dx: 40 }, g);
        api.label('Hc의 위치권', at(c.gp, brgTo(c.gp, AP) - 28, r1), { color: C.hc, cls: 'small', doc: '계산고도·계산방위각' }, g);
        api.label('Ho의 위치권', at(c.gp, brgTo(c.gp, c.O) + 30, r2), { color: C.ho, cls: 'small' }, g);
      });
      // AP 근처를 볼 때의 이름표 (위치권을 따라 조금 떨어진 곳)
      K.dyn('nearL', W, (g, p) => {
        const c = concept(p), r1 = 90 - p.hc, r2 = 90 - p.ho;
        const b1 = brgTo(c.gp, AP), b2 = brgTo(c.gp, c.E);
        api.label('Hc 위치권 (AP를 지남)', at(c.gp, b1 - 8 / Math.sin(r1 * D2R), r1), { color: C.hc, cls: 'small', doc: '계산고도·계산방위각', dy: 13 }, g);
        api.label('Ho 위치권 (O를 지남)', at(c.gp, b2 + 9.5 / Math.sin(r2 * D2R), r2), { color: C.ho, cls: 'small', dy: -13 }, g);
      });
      // 방위선: AP 에서 Zn 쪽(GP 를 향하는 대권), 진북 기준과 Zn 각
      K.dyn('azi', W, (g, p) => {
        const c = concept(p), k = th(p), A = S3(AP, RG * 1.012);
        K.gc(AP, c.gp, { r: RG * 1.012, color: COLORS.star, tube: 0.022 * k }, g);
        const nTop = { lat: AP.lat + 3, lon: AP.lon };
        K.gc(AP, nTop, { r: RG * 1.012, color: COLORS.meridian, tube: 0.02 * k }, g);
        api.label('N', S3(nTop, RG * 1.02), { cls: 'small', dy: -9 }, g);
        const tn = north(AP.lat, AP.lon), te = east(AP.lat, AP.lon), z = p.zn * D2R, rr = 0.2;
        K.curve((s) => A.clone().addScaledVector(tn, rr * Math.cos(z * s)).addScaledVector(te, rr * Math.sin(z * s)), 0, 1, 30, { color: COLORS.star, tube: 0.012 * k }, g);

        api.label('a = ' + fMin(c.a * 60) + ' ' + (T ? 'T' : 'A'), at(AP, dir, Math.abs(c.a) / 2), { color: C.ho, cls: 'val', doc: '고도차 부호 T·A', dx: 60, dy: 22 }, g);
      });

      K.dyn('lop', W, (g, p) => {

        const E = e.clone().multiplyScalar(r);
        K.poly([E.clone().addScaledVector(t, q), E.clone().addScaledVector(t, q).addScaledVector(w, q), E.clone().addScaledVector(w, q)], { color: C.lop }, g);
        const end = (sg) => e.clone().multiplyScalar(Math.cos(sg * L)).addScaledVector(w, Math.sin(sg * L)).multiplyScalar(r);
        api.label('위치선', end(-1), { doc: '위치선', dx: 30 }, g);   // 방위선의 오른쪽(Zn + 90°) 끝
      });

      // ===== Sun Sighting 위치기입도 =====
      const sunMer = []; for (let m = 0; m <= 60; m += 10) sunMer.push({ e: SUN.E(132 + m / 60), label: m === 0 ? '132°E' : m === 60 ? '133°E' : m === 30 ? '132°30′' : '' });
      const sunPar = []; for (let m = -20; m <= 30; m += 10) { const lat = -35 + m / 60; sunPar.push({ n: m, label: fm(Math.abs(lat)).replace(/′\.0$/, '′') + 'S' }); }
      const sun0 = api.group('sun0', W);
      sheetBase(api, sun0, SS, sunMer, sunPar);
      api.label('PLOTTING SHEET · 축척: 위도 1′ = 1해리, 경도 1′ = cos 35° 해리', SS.P(SS.ec, SS.n0, 0), { cls: 'small', dy: 14, fade: false }, sun0);
      api.dot(SS.P(0, 0, 0.05), { color: 0xffffff, size: 0.2 }, sun0);

      api.label('1020 DR', SS.P(drS.e, drS.n, 0), { cls: 'small', dx: -30, dy: -12, fade: false }, sun0);

      const sun1 = api.group('sun1', W);
      const zr = SUN.zn * D2R, az = { e: Math.sin(zr), n: Math.cos(zr) };
      api.line(SS.P(0, 0, 0.04), SS.P(0, 9, 0.04), { color: COLORS.meridian, opacity: 0.8 }, sun1);
      api.label('N', SS.P(0, 9, 0), { cls: 'small', dy: -9, fade: false }, sun1);
      api.curve((s) => SS.P(4 * Math.sin(zr * s), 4 * Math.cos(zr * s), 0.05), 0, 1, 24, { color: COLORS.star, tube: 0.04 }, sun1);
      api.label('Zn ' + fZn(SUN.zn), SS.P(0, 4, 0), { color: COLORS.star, cls: 'small val', dx: -40, fade: false }, sun1);
      const azEnd = clipLine(SS, { e: 0, n: 0 }, az, 0.5)[1];
      api.line(SS.P(0, 0, 0.04), SS.P(azEnd.e, azEnd.n, 0.04), { color: COLORS.star, opacity: 0.9 }, sun1);
      api.poly([SS.P(0, 0, 0.07), SS.P(SUN.ip.e, SUN.ip.n, 0.07)], { color: C.ho, tube: 0.1 }, sun1);
      api.label(fMin(SUN.a) + ' Toward', SS.P(SUN.ip.e / 2, SUN.ip.n / 2, 0), { color: C.ho, cls: 'val', doc: '고도차 부호 T·A', dx: 54, dy: 4, fade: false }, sun1);
      const lu = { e: Math.cos(zr), n: -Math.sin(zr) }, lseg = clipLine(SS, SUN.ip, lu, 0.8);
      api.poly([SS.P(lseg[0].e, lseg[0].n, 0.09), SS.P(lseg[1].e, lseg[1].n, 0.09)], { color: C.lop, tube: 0.07 }, sun1);
      api.dot(SS.P(SUN.ip.e, SUN.ip.n, 0.12), { color: 0xffffff, size: 0.2 }, sun1);
      api.label('수정점', SS.P(SUN.ip.e, SUN.ip.n, 0), { cls: 'small', doc: '위치선', dx: 4, dy: -22, fade: false }, sun1);
      const q = 1.1, ip = SUN.ip;
      api.poly([SS.P(ip.e - az.e * q, ip.n - az.n * q, 0.1), SS.P(ip.e - az.e * q + lu.e * q, ip.n - az.n * q + lu.n * q, 0.1), SS.P(ip.e + lu.e * q, ip.n + lu.n * q, 0.1)], { color: C.lop, opacity: 0.8 }, sun1);
      const lab1 = { e: ip.e - lu.e * 15, n: ip.n - lu.n * 15 };
      api.label('1020 Sun 위치선', SS.P(lab1.e, lab1.n, 0), { doc: '위치선', dy: -14, fade: false }, sun1);

      // ===== Star Sighting 위치기입도 =====
      const stMer = []; for (let m = 20; m <= 60; m += 10) { const lon = 81 + m / 60; stMer.push({ e: ST.E(lon), label: m === 60 ? '82°E' : m === 30 ? '81°30′E' : '' }); }
      const stPar = [-10, 0, 10].map((n) => ({ n, label: n === 0 ? '6°N' : n < 0 ? '5°50′N' : '6°10′N' }));
      const star0 = api.group('star0', W);
      sheetBase(api, star0, TS, stMer, stPar);
      api.label('PLOTTING SHEET · aL 6°N · 침로 070° · 20노트', TS.P(TS.ec, TS.n0, 0), { cls: 'small', dy: 14, fade: false }, star0);
      api.label('AP', TS.P(STARS[0].ap.e, 0, 0), { cls: 'small', doc: '가정위치', dx: -4, dy: 14, fade: false }, star0);
      api.label('AP', TS.P(STARS[1].ap.e, 0, 0), { cls: 'small', doc: '가정위치', dx: -20, dy: 12, fade: false }, star0);
      // 세 별의 방위선·고도차·위치선 (전위 단계에서는 흐리게)
      K.dyn('starL', W, (g, p) => {
        const S = TS;

          const ext = clipLine(S, s.ap, az, 0.3);
          K.line(S.P(ext[0].e, ext[0].n, 0.03), S.P(ext[1].e, ext[1].n, 0.03), { color: s.col, opacity: faded ? 0.15 : 0.3, dashed: true, dash: 0.25 }, g);
          K.poly([S.P(s.ap.e, s.ap.n, 0.06), S.P(s.ip.e, s.ip.n, 0.06)], { color: s.col, tube: 0.075, opacity: faded ? 0.45 : 1 }, g);
          const seg = clipLine(S, s.ip, s.u, 0.3);
          K.poly([S.P(seg[0].e, seg[0].n, 0.08), S.P(seg[1].e, seg[1].n, 0.08)], { color: s.col, tube: 0.05, opacity: faded ? 0.35 : 1 }, g);
          K.dot(S.P(s.ip.e, s.ip.n, 0.1), { color: s.col, size: 0.12 }, g);
          if (!faded) {
            api.label(fMin(s.a) + ' ' + (T ? 'T' : 'A'), S.P((s.ap.e + s.ip.e) / 2, (s.ap.n + s.ip.n) / 2, 0), { color: s.col, cls: 'small val', dx: [60, -30, 30][i], dy: [12, 0, 8][i], fade: false }, g);
            const endPt = seg[[1, 0, 1][i]];
            api.label(s.zt + ' ' + s.name, S.P(endPt.e, endPt.n, 0), { color: s.col, cls: 'small', dx: [0, -46, -40][i], dy: [-12, -11, 12][i], fade: false }, g);
          }
        });
      });
      // 전위한 위치선, 교점 삼각형, 1820 FIX
      const star1 = api.group('star1', W);
      STARS.forEach((s, i) => {
        if (s.adv < 1e-6) return;
        const S = TS;
        api.poly([S.P(s.ip.e, s.ip.n, 0.12), S.P(s.ip2.e, s.ip2.n, 0.12)], { color: 0xffffff, tube: 0.05 }, star1);
        const hd = 0.9, back = { e: -cE, n: -cN }, sideV = { e: cN, n: -cE };
        api.poly([S.P(s.ip2.e + (back.e + sideV.e * 0.5) * hd, s.ip2.n + (back.n + sideV.n * 0.5) * hd, 0.12), S.P(s.ip2.e, s.ip2.n, 0.12), S.P(s.ip2.e + (back.e - sideV.e * 0.5) * hd, s.ip2.n + (back.n - sideV.n * 0.5) * hd, 0.12)], { color: 0xffffff }, star1);
        const seg = clipLine(S, s.ip2, s.u, 0.3);
        api.poly([S.P(seg[0].e, seg[0].n, 0.1), S.P(seg[1].e, seg[1].n, 0.1)], { color: s.col, tube: 0.06 }, star1);
        const mm = Math.floor(s.dt / 60), ss = s.dt % 60;
        api.label(mm + '분' + (ss ? ' ' + ss + '초' : '') + ' → ' + s.adv.toFixed(1) + '해리 전위', S.P((s.ip.e + s.ip2.e) / 2, (s.ip.n + s.ip2.n) / 2, 0), { cls: 'small', dx: [-84, 0][i], dy: [-4, 15][i], fade: false }, star1);
        const endPt = i === 0 ? seg[1] : { e: seg[1].e + (seg[0].e - seg[1].e) * 0.3, n: seg[1].n + (seg[0].n - seg[1].n) * 0.3 };
        api.label(s.zt + '→1820 ' + s.name, S.P(endPt.e, endPt.n, 0), { color: s.col, cls: 'small', dx: 0, dy: -12, fade: false }, star1);
      });
      const tri = new THREE.Shape(TRI.map((t) => new THREE.Vector2(TS.P(t.e, t.n).x, TS.P(t.e, t.n).y)));
      const triM = new THREE.Mesh(new THREE.ShapeGeometry(tri), new THREE.MeshBasicMaterial({ color: 0xffe28a, transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false }));
      triM.position.z = 0.04; star1.add(triM);
      const F = TS.P(FIX.e, FIX.n, 0.14);
      api.curve((s) => F.clone().add(V(0.32 * Math.cos(2 * Math.PI * s), 0.32 * Math.sin(2 * Math.PI * s), 0)), 0, 1, 32, { color: 0xffffff, tube: 0.03 }, star1);
      api.dot(F, { color: 0xffffff, size: 0.09 }, star1);
      api.label('1820 FIX', F, { cls: 'big', doc: '위치선의 교점과 전위', dx: 40, dy: -16, fade: false }, star1);
    },
    tick(dt, p) {
      clipLabels(p._lab && p._lab.element.parentNode);
      return false;
    },
    readout(p, api) {
      if (p.stage === 1) {
        return [
          ['가정위치 aL · aλ', fLat(SUN.aL) + ' · ' + fLon(SUN.al)], ['계산고도 Hc', fm(SUN.hc)], ['관측고도 Ho', fm(SUN.ho)],
          ['고도차 a', fMin(SUN.a) + ' T'], ['방위 Zn', fZn(SUN.zn)],
          ['수정점 (AP 기준)', 'N ' + SUN.ip.n.toFixed(1) + '해리 · E ' + SUN.ip.e.toFixed(1) + '해리'],
          ['수정점 위치', fLat(SUN.aL + SUN.ip.n / 60) + ' ' + fLon(SUN.al + SUN.ip.e / SUN.cos / 60)],
          'Δd = −53′.2 / 60′ × 42′.8 = −37′.9',
          'Hc = ht + 개정 = ' + fm(SUN.ht) + ' − 37′.9 = ' + fm(SUN.hc),
          'Z = 146°.5 + 0°.3 = S146°.8E → Zn = 180° − 146°.8 = ' + fZn(SUN.zn),
          'a = Ho − Hc = ' + fm(SUN.ho) + ' − ' + fm(SUN.hc) + ' = ' + fMin(SUN.a) + ' T'
        ];
      }
      if (p.stage === 2) {
        return STARS.map((s) => [s.name + ' ' + s.zt + ' (aλ ' + fLon(s.al) + ')', fMin(s.a) + ' ' + (s.a > 0 ? 'T' : 'A') + ' · Zn ' + fZi(s.zn)])
          .concat([['가정위도 aL', fLat(ST.aL)]])
          .concat(STARS.map((s) => s.name + ': a = ' + fm(s.ho) + ' − ' + fm(s.hc) + ' = ' + (s.a > 0 ? '+' : '−') + fMin(s.a) + ' → ' + (s.a > 0 ? 'T' : 'A')))
          .concat(['LHA♈ = GHA♈ + aλ = ' + fm(STARS[0].ghaA) + ' + ' + fm(STARS[0].al) + ' = ' + fm(STARS[0].lha) + ' (Regulus)']);
      }
      if (p.stage === 3) {
        return [
          ['Regulus 전위 (1806-15 → 1820)', STARS[0].adv.toFixed(2) + '해리'], ['Canopus 전위 (1808 → 1820)', STARS[1].adv.toFixed(2) + '해리'],
          ['Capella (1820 관측)', '전위 없음'], ['교점 삼각형의 가장 긴 변', triSide.toFixed(1) + '해리'],
          ['1820 FIX (삼각형 중심)', fLat(FIX.lat) + ' ' + fLon(FIX.lon, true)],
          '전위 거리 = 속력 × 경과 시간 = 20노트 × 13분 45초 = ' + STARS[0].adv.toFixed(2) + '해리',
          '전위 방향 = 침로 070° (위치선을 평행이동)'
        ];
      }
      const c = concept(p), am = c.a * 60, T = am >= 0;
      const dN = am * Math.cos(p.zn * D2R), dep = am * Math.sin(p.zn * D2R), dl = dep / Math.cos(AP.lat * D2R);
      return [
        ['계산고도 Hc', fm(p.hc)], ['관측고도 Ho', fm(p.ho)],
        ['고도차 a', fMin(am) + ' ' + (T ? 'T (Toward)' : 'A (Away)')], ['방위 Zn', fZn(p.zn)],
        ['수정점 (AP 기준)', (dN >= 0 ? 'N ' : 'S ') + Math.abs(dN).toFixed(1) + '해리 · ' + (dep >= 0 ? 'E ' : 'W ') + Math.abs(dep).toFixed(1) + '해리'],
        'a = Ho − Hc = ' + fm(p.ho) + ' − ' + fm(p.hc) + ' = ' + (T ? '' : '−') + fMin(am) + ' → ' + (T ? 'Ho > Hc 이므로 T' : 'Ho < Hc 이므로 A'),
        'ΔL = a·cos Zn = ' + fMin(dN) + (dN >= 0 ? 'N' : 'S') + ',  dep = a·sin Zn = ' + Math.abs(dep).toFixed(1) + '해리 ' + (dep >= 0 ? 'E' : 'W'),
        'Δλ = dep ÷ cos aL = ' + fMin(dl) + (dl >= 0 ? 'E' : 'W') + '  (aL ' + fLat(AP.lat) + ')'
      ];
    }
  });
})();

<script>
/* 천문항해 학습 위키 — 화면 로직 */
(function () {
  'use strict';
  const RAW = JSON.parse(document.getElementById('wiki-data').textContent);
  const CATS = RAW.categories;               // {1:'천구 기초', ...}
  const CAT_DESC = {
    1: '천구, 천의 극과 적도, 황도와 분점·지점', 2: '적위·적경·SHA 같은 천체의 주소', 3: '천정, 수평, 방위, 고도, LHA·GHA',
    4: '극·천정·천체를 잇는 구면삼각형', 5: '좌표계 넷과 자오선평면도·시각도', 6: '관측 시각의 GHA와 Dec 구하기',
    7: '구조, 이중반사 원리, 도수 읽기', 8: '기차·안고차·시차·반지름·광삼', 9: '태양·항성·행성·달의 고도개정',
    10: '지위, 위치권, 고도차법의 원리', 11: '천측계산과 위치기입도 작도'
  };
  const CH = { 1: '1장', 2: '1장', 3: '1장', 4: '1장', 5: '1장', 6: '1장', 7: '2장', 8: '2장', 9: '2장', 10: '8장', 11: '8장' };
  const DISAMB = {
    '기차': { items: [['육분의 오차·기차개정', 'Sextant 기차(Index error) — 동경과 수평경이 평행일 때 눈금이 0이 아닌 오차와 그 개정(IC)'], ['천문기차·평균기차', '대기 기차(Refraction) — 빛이 대기를 지나며 굽어 천체가 높아 보이는 현상'], ['지상기차', '지상기차 — 지표 가까운 물체의 빛이 굽는 현상'], ['굴절·Snell의 법칙', '굴절의 원리']] },
    '시차': { items: [['시차·수평시차', '視差 (Parallax) — 관측자와 지구 중심에서 본 천체 방향의 차이'], ['주표', '時差 (Equation of time) — 천측력 주표 오른쪽 아래에 실린 값']] }
  };

  // ---------- 모델 ----------
  const docs = RAW.registry.map((r) => Object.assign({}, r));
  const byTitle = {};
  docs.forEach((d) => { byTitle[d.title] = d; });
  RAW.content.forEach((c) => { const d = byTitle[c.title]; if (d) Object.assign(d, { content: c }); });
  docs.forEach((d, i) => { d.idx = i; d.token = 'd' + d.order; d.has = !!d.content; });
  const byToken = {}; docs.forEach((d) => { byToken[d.token] = d; });

  const LINK = /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g;
  function stringsOf(c) {
    if (!c) return [];
    const out = [c.definition, c.why, c.confusions].concat(Array.isArray(c.easy) ? c.easy : [c.easy], c.key || [], (c.terms || []).map((t) => (t.ko || '') + ' ' + (t.plain || '')));
    (c.body || []).forEach((b) => {
      if (typeof b === 'string') out.push(b);
      else if (b.formula) out.push(b.formula);
      else if (b.list || b.steps) (b.list || b.steps).forEach((x) => out.push(x));
      else if (b.table) { (b.table.rows || []).forEach((r) => r.forEach((x) => out.push(String(x)))); out.push(b.caption || ''); }
    });
    return out.filter(Boolean);
  }
  // 링크 그래프
  docs.forEach((d) => { d.out = new Set(); d.back = new Set(); });
  docs.forEach((d) => {
    stringsOf(d.content).forEach((s) => { s.replace(LINK, (m, t) => { t = t.trim(); if (byTitle[t] && t !== d.title) d.out.add(t); return m; }); });
  });
  docs.forEach((d) => d.out.forEach((t) => byTitle[t].back.add(d.title)));
  // 검토 표시
  const FLAGS = [];
  docs.forEach((d) => ((d.content && d.content.flags) || []).forEach((f) => FLAGS.push(Object.assign({ doc: d.title }, f))));
  const KIND_ORDER = ['교재 정정', '판독 불확실', '해석', '교재 밖', '계산 확인'];
  // 공식
  const FORMULAS = [], fmap = {};
  const fnorm = (f) => String(f).replace(/\s*\(.*\)\s*$/, '').replace(/\s+/g, '');

  const labelKey = (l) => { const m = /\((\d+)\.(\d+)\)/.exec(l || ''); return m ? (+m[1]) * 1000 + (+m[2]) : 1e9; };

  const vcount = (t) => (visits[t] && visits[t].c) || 0;

  function countVisit(t) {

  const normQ = (s) => String(s).toLowerCase().replace(/[\s·.()\-–]/g, '');

  // 문서

      (trail.length ? '<div class="trail">최근: ' + trail.map((t) => '<button type="button" data-doc="' + esc(t) + '">' + esc(tx(t)) + '</button>').join(' › ') + ' › <b>' + esc(tx(d.title)) + '</b></div>' : '') +

  function block(b, ctx) {
    if (typeof b === 'string') return '<p>' + inline(b, ctx) + '</p>';
    if (b.formula) return '<div class="formula"><span class="f">' + inline(b.formula, ctx) + '</span>' + (b.label ? '<span class="lbl">' + esc(b.label) + '</span>' : '') + '</div>';
    if (b.list) return '<ul>' + b.list.map((x) => '<li>' + inline(x, ctx) + '</li>').join('') + '</ul>';
    if (b.steps) return '<ol>' + b.steps.map((x) => '<li>' + inline(x, ctx) + '</li>').join('') + '</ol>';
    if (b.table) {
      const t = b.table;
      return '<div class="tbl"><table>' + (b.caption ? '<caption>' + inline(b.caption, ctx) + '</caption>' : '') +
        (t.head ? '<thead><tr>' + t.head.map((h) => '<th>' + inline(h, ctx) + '</th>').join('') + '</tr></thead>' : '') +
        '<tbody>' + (t.rows || []).map((row) => '<tr>' + row.map((x) => '<td>' + inline(String(x), ctx) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
    }
    return '';
  }
  function linksHtml(d) {
    const chip = (t) => '<button type="button" class="chip" data-doc="' + esc(t) + '">' + esc(tx(t)) + ' <span class="vc">' + vcount(t) + '</span></button>';
    const back = Array.from(d.back), out = Array.from(d.out);
    return '<div class="links"><div><h3>이 문서를 가리키는 문서 ' + back.length + '</h3><div class="chips">' + (back.map(chip).join('') || '<span class="empty">없음</span>') + '</div></div>' +
      '<div><h3>이 문서가 가리키는 문서 ' + out.length + '</h3><div class="chips">' + (out.map(chip).join('') || '<span class="empty">없음</span>') + '</div></div></div>' + graphSvg(d, back, out);
  }
  function graphSvg(d, back, out) {
    const nodes = Array.from(new Set(out.concat(back))).slice(0, 14);
    if (!nodes.length) return '';
    const W = 520, H = 300, cx = W / 2, cy = H / 2, rx = 200, ry = 112;
    let lines = '', gs = '';
    nodes.forEach((t, i) => {
      const a = -Math.PI / 2 + i * 2 * Math.PI / nodes.length, x = cx + rx * Math.cos(a), y = cy + ry * Math.sin(a);
      lines += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '"' + (d.out.has(t) && d.back.has(t) ? ' style="stroke:var(--ink-3)"' : '') + '/>';
      gs += '<g class="n" data-doc="' + esc(t) + '" role="button" tabindex="0"><circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="5"/><text x="' + x.toFixed(1) + '" y="' + (y + (y > cy ? 18 : -10)).toFixed(1) + '" text-anchor="middle">' + esc(tx(t)) + '</text></g>';
    });
    return '<svg class="graph" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="연결 지도">' + lines + gs + '<g class="center"><circle cx="' + cx + '" cy="' + cy + '" r="7"/><text x="' + cx + '" y="' + (cy + 22) + '" text-anchor="middle">' + esc(tx(d.title)) + '</text></g></svg>';
  }

      '<div id="ls-out"></div>' +
      '<section class="backup" aria-label="방문 기록 백업"><b>방문 기록 옮기기</b><span>방문 기록은 이 브라우저에만 저장된다. 다른 기기로 옮기려면 기록을 복사해 그 기기의 이 칸에 붙여 넣는다.</span>' +
      '<div class="row-btns"><button type="button" class="btn ghost" id="bk-copy">기록 복사</button><button type="button" class="btn ghost" id="bk-load">붙여 넣은 기록 불러오기</button><button type="button" class="btn ghost" id="bk-clear">기록 지우기</button><span class="note" id="bk-msg" role="status"></span></div>' +
      '<label for="bk-text" class="note">기록 붙여 넣기</label><textarea id="bk-text" placeholder="{&quot;천구&quot;:{&quot;c&quot;:3,…}}"></textarea></section></div>';
    const draw = () => {

      list.sort(SORTS[sortKey][1]);

    document.title = '검토 목록 · 천문항해 학습 위키';
    const groups = KIND_ORDER.map((k) => [k, FLAGS.filter((f) => f.kind === k)]).filter((g) => g[1].length);
    const desc = { '교재 정정': '교재의 오자·잘못된 값을 위키에서 바로잡은 곳', '판독 불확실': '스캔이 흐려 값을 확정하지 못한 곳', '해석': '교재가 모호해 한쪽으로 풀어 쓴 곳', '교재 밖': '교재에 없는 사실·수치를 덧붙인 곳', '계산 확인': '교재 예제를 다시 계산해 본 결과' };
    const nCalc = FLAGS.filter((f) => f.kind === '계산 확인').length;
    view.innerHTML = '<div class="page read"><div class="eyebrow">검토 목록</div><h1 class="page-title">직접 확인해 볼 곳 ' + (FLAGS.length - nCalc) + '개</h1>' +
      '<p class="lead">문서를 쓰면서 교재 스캔과 대조하고 예제를 다시 계산했다. 그 과정에서 교재와 다르게 쓰거나 교재 밖 내용을 더한 곳을 모았다. 각 문서 위쪽의 ⚑ 상자와 본문의 노란 각주 번호도 같은 곳을 가리킨다.' + (nCalc ? ' 맨 아래에는 교재 예제를 다시 계산해 맞는지 본 기록 ' + nCalc + '개가 따로 있다.' : '') + '</p>' +
      groups.map((g) => '<section class="rv-group"><h2><span class="kind" data-k="' + esc(g[0]) + '">' + esc(g[0]) + '</span> ' + g[1].length + '개</h2><p class="note">' + desc[g[0]] + '</p><ul class="rv">' +
        g[1].map((f) => '<li><button type="button" class="chip" data-doc="' + esc(f.doc) + '"' + (f.fn ? ' data-anchor="fn-' + f.fn + '"' : '') + '>' + esc(tx(f.doc)) + '</button><span>' + inline(f.text, {}) + '</span></li>').join('') + '</ul></section>').join('') + '</div>';
  }
  function renderFormulas() {
    document.title = '공식 모음 · 천문항해 학습 위키';
    view.innerHTML = '<div class="page read"><div class="eyebrow">공식 모음</div><h1 class="page-title">공식 ' + FORMULAS.length + '개</h1><p class="lead">교재 식 번호 순서로 모았다. 식 번호가 없는 공식은 뒤쪽에 있다. 문서 이름을 누르면 설명으로 간다.</p>' +
      '<div class="tbl"><table class="ftable"><thead><tr><th>식</th><th>공식</th><th>문서</th></tr></thead><tbody>' +
      FORMULAS.map((f) => '<tr><td>' + esc(f.label || '—') + '</td><td>' + inline(f.f, {}) + '</td><td>' + f.docs.map((t) => '<a class="wl" href="#' + byTitle[t].token + '" data-doc="' + esc(t) + '">' + esc(tx(t)) + '</a>').join('<br>') + '</td></tr>').join('') + '</tbody></table></div></div>';
  }

  // ---------- 검색 ----------
  const INDEX = docs.map((d) => {
    const keys = [d.title, d.en].concat(d.aliases);
    return { d, keys: keys.map(normQ), cho: keys.map((k) => chosung(normQ(k))) };
  });
  const isCho = (q) => /^[ㄱ-ㅎ]+$/.test(q);
  function search(q) {
    const n = normQ(q); if (!n) return [];
    const res = [];
    INDEX.forEach((it) => {
      let s = 0;
      it.keys.forEach((k, i) => {
        if (k === n) s = Math.max(s, i === 0 ? 100 : 80);
        else if (k.startsWith(n)) s = Math.max(s, i === 0 ? 60 : 45);
        else if (k.includes(n)) s = Math.max(s, i === 0 ? 40 : 25);
        if (isCho(n) && it.cho[i].includes(n)) s = Math.max(s, it.cho[i].startsWith(n) ? 35 : 20);
      });
      if (s) res.push({ d: it.d, s });
    });
    Object.keys(DISAMB).forEach((k) => { if (normQ(k) === n || normQ(k).startsWith(n)) res.push({ dis: k, s: 90 }); });
    res.sort((a, b) => b.s - a.s || (a.d && b.d ? a.d.order - b.d.order : 0));
    return res;
  }
  function renderSearch(r) {
    const res = search(r.a);
    document.title = '‘' + r.a + '’ 검색 · 천문항해 학습 위키';
    view.innerHTML = '<div class="page read"><div class="eyebrow">검색</div><h1 class="page-title">‘' + esc(r.a) + '’ 검색 결과 ' + res.length + '개</h1>' +
      (res.length ? '<ul class="dlist">' + res.map((x) => x.dis ? '<li><button type="button" class="row" data-dis="' + esc(x.dis) + '"><span class="r1"><span class="tt">' + esc(x.dis) + '</span><span class="en">동음이의 문서</span></span></button></li>'
        : '<li><button type="button" class="row" data-doc="' + esc(x.d.title) + '"><span class="r1"><span class="tt">' + esc(tx(x.d.title)) + '</span>' + vcHtml(x.d.title) + '<span class="en">' + esc(x.d.en) + '</span></span><span class="def1">' + esc(tx(x.d.content ? firstSentence(x.d.content.definition) : '')) + '</span></button></li>').join('') + '</ul>'
        : '<p class="empty">찾는 문서가 없다. 한글 제목, 영문, 기호(LHA, GHA, Dip), 초성(ㅈㅂㅅㄱ)으로 찾아보자.</p>') + '</div>';
  }
  const sIn = $('#q'), sBox = $('#sugg');
  let sSel = -1, sItems = [];
  function suggest() {
    const q = sIn.value.trim(); sItems = q ? search(q).slice(0, 8) : []; sSel = -1;
    if (!sItems.length) { sBox.hidden = true; sIn.setAttribute('aria-expanded', 'false'); return; }
    sBox.innerHTML = sItems.map((x, i) => '<button type="button" role="option" id="sg-' + i + '" data-i="' + i + '">' + (x.dis ? esc(x.dis) + '<small>동음이의</small>' : esc(tx(x.d.title)) + '<small>' + esc(x.d.en) + '</small>') + '</button>').join('');
    sBox.hidden = false; sIn.setAttribute('aria-expanded', 'true');
  }
  function pick(i) {
    const x = sItems[i]; sBox.hidden = true; sIn.value = ''; sIn.blur();
    if (!x) return; if (x.dis) go({ v: 'dis', a: x.dis }); else goDoc(x.d.title);
  }
  sIn.addEventListener('input', suggest);
  sIn.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (!sItems.length) return;
      sSel = (sSel + (e.key === 'ArrowDown' ? 1 : -1) + sItems.length) % sItems.length;
      sBox.querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-selected', i === sSel));
      sIn.setAttribute('aria-activedescendant', 'sg-' + sSel);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (sSel >= 0) pick(sSel); else if (sIn.value.trim()) { const q = sIn.value.trim(); sBox.hidden = true; sIn.value = ''; go({ v: 'search', a: q }); }
    } else if (e.key === 'Escape') { sBox.hidden = true; }
  });
  sBox.addEventListener('mousedown', (e) => { const b = e.target.closest('button'); if (b) { e.preventDefault(); pick(+b.dataset.i); } });
  sIn.addEventListener('blur', () => setTimeout(() => { sBox.hidden = true; }, 150));
  document.addEventListener('keydown', (e) => { if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') { e.preventDefault(); sIn.focus(); } });

  // ---------- 미리보기·각주 팝업 ----------
  const pop = $('#pop'); let popTimer = 0, popFor = null;
  function showPop(target, html) {
    pop.innerHTML = html; pop.hidden = false;
    const r = target.getBoundingClientRect(), pw = Math.min(380, window.innerWidth - 32);
    let x = r.left + window.scrollX - 10; x = Math.max(16 + window.scrollX, Math.min(x, window.scrollX + window.innerWidth - pw - 16));
    pop.style.left = x + 'px'; pop.style.top = (r.bottom + window.scrollY + 8) + 'px'; popFor = target;
  }
  function hidePop() { if (pop) pop.hidden = true; popFor = null; clearTimeout(popTimer); }
  const fine = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  document.addEventListener('mouseover', (e) => {
    if (!fine) return;
    const a = e.target.closest('a.wl[data-doc]');
    if (!a || a === popFor) return;
    clearTimeout(popTimer);
    popTimer = setTimeout(() => {
      const d = byTitle[a.dataset.doc]; if (!d || !d.content) return;
      showPop(a, '<div class="pt">' + esc(tx(d.title)) + '</div><div>' + esc(tx(plain(d.content.definition))) + '</div><div class="pk">' + esc(CATS[d.cat]) + ' · 교재 ' + esc(d.pages) + '쪽 · 방문 ' + vcount(d.title) + '</div>');
    }, 350);
  });
  document.addEventListener('mouseout', (e) => { const a = e.target.closest('a.wl[data-doc]'); if (a && popFor === a && !a.contains(e.relatedTarget)) hidePop(); else clearTimeout(popTimer); });

  // ---------- 클릭 위임 ----------
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-doc],[data-go],[data-cat],[data-lab],[data-dis],[data-random],[data-fn],[data-anchor]');
    if (!t) { if (!e.target.closest('#pop')) hidePop(); return; }
    if (t.dataset.fn) {
      e.preventDefault();
      const r = currentRoute(); const d = r && r.v === 'doc' && byTitle[r.a];
      if (!d) return;
      const k = +t.dataset.fn, txt = d.content.footnotes[k - 1];
      const flags = (d.content.flags || []).filter((f) => +f.fn === k);
      if (popFor === t) { hidePop(); return; }
      showPop(t, '<div class="pk">각주 ' + k + '</div><div>' + inline(txt, {}) + '</div>' + flags.map((f) => '<div style="margin-top:6px"><span class="kind" data-k="' + esc(f.kind) + '">' + esc(f.kind) + '</span> ' + inline(f.text, {}) + '</div>').join(''));
      return;
    }
    if (t.dataset.doc && t.closest('.s3d')) return;
    e.preventDefault();
    if (t.dataset.doc) { goDoc(t.dataset.doc, t.dataset.anchor ? { anchor: t.dataset.anchor } : undefined); return; }
    if (t.dataset.anchor) { const el = document.getElementById(t.dataset.anchor); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (t.dataset.go) { go({ v: t.dataset.go }); return; }
    if (t.dataset.cat) { go({ v: 'cat', a: +t.dataset.cat }); return; }
    if (t.dataset.lab) { go({ v: 'lab', a: +t.dataset.lab }); return; }
    if (t.dataset.dis) { go({ v: 'dis', a: t.dataset.dis }); return; }
    if (t.dataset.random) { const pool = docs.filter((d) => d.has); goDoc(pool[Math.floor(Math.random() * pool.length)].title); }
  });
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('svg [role="button"]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
    if (e.key === 'Escape') { hidePop(); closeRail(); }
  });
  const currentRoute = () => hist[hi];

  // 상단 버튼
  $('#back').addEventListener('click', () => { if (hi > 0) { hi--; render(hist[hi]); } });
  $('#fwd').addEventListener('click', () => { if (hi < hist.length - 1) { hi++; render(hist[hi]); } });
  $('#brand').addEventListener('click', (e) => { e.preventDefault(); go({ v: 'home' }); });
  const rail = $('#rail'); let scrim = null;
  function openRail() { rail.classList.add('open'); scrim = document.createElement('div'); scrim.className = 'scrim'; scrim.addEventListener('click', closeRail); document.body.appendChild(scrim); $('#menu').setAttribute('aria-expanded', 'true'); }
  function closeRail() { rail.classList.remove('open'); if (scrim) { scrim.remove(); scrim = null; } const m = $('#menu'); if (m) m.setAttribute('aria-expanded', 'false'); }
  $('#menu').addEventListener('click', () => (rail.classList.contains('open') ? closeRail() : openRail()));

  // 목록 위치 막대(넓은 화면): 기본 스크롤바를 숨기고 구분선 위에 얇게 그린다
  const railThumbReq = (function railThumb() {
    const th = document.createElement('div');
    th.className = 'rail-thumb'; th.setAttribute('aria-hidden', 'true'); th.innerHTML = '<i></i>';
    document.body.appendChild(th);
    let raf = 0, liveT = 0, hover = false, drag = null;
    const GAP = 6;
    function place() {
      raf = 0;
      const sh = rail.scrollHeight, ch = rail.clientHeight;
      if (window.innerWidth <= 900 || sh <= ch + 1) { th.style.display = 'none'; return; }
      const r = rail.getBoundingClientRect(), h = Math.max(32, (ch * ch) / sh);
      th.style.display = '';
      th.style.left = r.right + 'px';
      th.style.top = r.top + GAP + (rail.scrollTop / (sh - ch)) * (ch - 2 * GAP - h) + 'px';
      th.style.height = h + 'px';
    }
    const req = () => { if (!raf) raf = requestAnimationFrame(place); };
    const live = (on) => th.classList.toggle('live', on);
    rail.addEventListener('scroll', () => {
      req(); live(true); clearTimeout(liveT);
      liveT = setTimeout(() => { if (!hover && !drag) live(false); }, 900);
    }, { passive: true });
    rail.addEventListener('mouseenter', () => { hover = true; live(true); });
    rail.addEventListener('mouseleave', () => { hover = false; if (!drag) live(false); });
    window.addEventListener('resize', req);
    window.addEventListener('scroll', req, { passive: true });
    new MutationObserver(req).observe(rail, { childList: true, subtree: true });
    th.addEventListener('wheel', (e) => { rail.scrollTop += e.deltaY; e.preventDefault(); }, { passive: false });
    th.addEventListener('pointerdown', (e) => {
      drag = { y: e.clientY, s: rail.scrollTop }; th.classList.add('drag');
      try { th.setPointerCapture(e.pointerId); } catch (err) { /* */ }
      e.preventDefault();
    });
    th.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const sh = rail.scrollHeight, ch = rail.clientHeight, room = Math.max(1, ch - 2 * GAP - th.offsetHeight);
      rail.scrollTop = drag.s + ((e.clientY - drag.y) * (sh - ch)) / room;
    });
    const end = () => { drag = null; th.classList.remove('drag'); if (!hover) live(false); };
    th.addEventListener('pointerup', end); th.addEventListener('pointercancel', end);
    req();
    return req;
  })();

  // 분류 접기·펴기: 제목을 누르면 목록이 접히고, 다시 누르면 펼쳐진다
  rail.addEventListener('click', (e) => {
    if (e.target.closest('[data-foldall]')) {
      const keys = Object.keys(CATS), shut = railFold.size < keys.length;
      keys.forEach((c) => setFold(c, shut));
      foldAllLabel(); railThumbReq(); return;
    }
    const b = e.target.closest('[data-fold]'); if (!b) return;
    setFold(b.dataset.fold, !railFold.has(b.dataset.fold));
    foldAllLabel(); railThumbReq();
  });
  rail.addEventListener('transitionend', (e) => { if (e.target.classList && e.target.classList.contains('rail-grp')) railThumbReq(); });
  $('#review-count').textContent = FLAGS.filter((f) => f.kind !== '계산 확인').length;

  go(parseHash());
  // 해시만 바뀐 경우(href="#d30" 같은 링크)도 같은 화면 전환으로 처리
  window.addEventListener('hashchange', () => {
    const r = parseHash(), c = currentRoute();
    if (!c || routeToken(r) !== routeToken(c)) go(r);
  });
  window.__wiki = { docs, byTitle, FLAGS, FORMULAS, go, search };
})();

</script>

</body></html>
