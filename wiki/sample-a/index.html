<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>천문항해 학습 위키</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="천문항해 교재 1·2·8장 개념 위키와 3D 실험실">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 배치: 상단 항해 바 + 왼쪽 문서 레일 + 본문 한 단(65자 내외). 해도 종이 같은 차가운 흰색 위에 남색 잉크, 해도의 자홍색을 강조색으로 아껴 쓴다. */
:root {
  --bg: #f4f7f8; --surface: #ffffff; --panel: #eaf0f3; --ink: #14213a; --ink-2: #44546b; --ink-3: #74829a;
  --rule: #d3dce3; --link: #1b5d93; --chart: #a3246f; --chart-soft: #f6e6ef; --warn: #9a5a00; --warn-bg: #fff3d6; --warn-rule: #e9c46a;
  --key-bg: #e8f0f8; --key-rule: #9db8d6; --red: #b3261e; --ok: #2e7d4f; --shadow: 0 6px 24px rgba(20, 33, 58, 0.12);
  --font-display: "Hahmlet", "Noto Serif KR", "Apple SD Gothic Neo", serif;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --rail: 272px; --measure: 46rem; --scroll: #b7c3cd;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1520; --surface: #131e2c; --panel: #172536; --ink: #e2e9f2; --ink-2: #a8b6c8; --ink-3: #7b8aa0;
  --rule: #273649; --link: #7db6ea; --chart: #e570b4; --chart-soft: #3a1d30; --warn: #f2bd60; --warn-bg: #2c2312; --warn-rule: #6d5420;
  --key-bg: #16263a; --key-rule: #33557c; --red: #f08a80; --ok: #6fcf97; --shadow: 0 8px 28px rgba(0, 0, 0, 0.45); --scroll: #3a4d64; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1520; --surface: #131e2c; --panel: #172536; --ink: #e2e9f2; --ink-2: #a8b6c8; --ink-3: #7b8aa0;
  --rule: #273649; --link: #7db6ea; --chart: #e570b4; --chart-soft: #3a1d30; --warn: #f2bd60; --warn-bg: #2c2312; --warn-rule: #6d5420;
  --key-bg: #16263a; --key-rule: #33557c; --red: #f08a80; --ok: #6fcf97; --shadow: 0 8px 28px rgba(0, 0, 0, 0.45); --scroll: #3a4d64; color-scheme: dark; }

* { box-sizing: border-box; scrollbar-width: thin; }
/* 스크롤바: 화살표·트랙 없이 가는 막대 하나. 오른쪽 끝(창)에만 보이고, 왼쪽 목록은 구분선 위의 얇은 막대로 대신한다 */
html { scrollbar-color: var(--scroll) transparent; }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.75 var(--font-ui); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--link); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--chart); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { text-wrap: balance; }

/* 상단 바 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--rule); }
.top-in { display: flex; align-items: center; gap: 10px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font: 600 17px var(--font-display); color: var(--ink); text-decoration: none; white-space: nowrap; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 6px; }
.brand small { font: 500 11px var(--font-mono); color: var(--ink-3); letter-spacing: 0.04em; }
.iconbtn { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; height: 34px; min-width: 34px; padding: 0 9px; cursor: pointer; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-size: 13px; }
.iconbtn:hover { color: var(--ink); border-color: var(--ink-3); }
.iconbtn:disabled { opacity: .4; cursor: default; }
.search { position: relative; flex: 1 1 260px; max-width: 420px; min-width: 0; }
.search input { width: 100%; height: 36px; border: 1px solid var(--rule); border-radius: 18px; padding: 0 14px 0 34px; background: var(--bg); color: var(--ink); font-size: 14px; }
.search::before { content: ""; position: absolute; left: 13px; top: 11px; width: 10px; height: 10px; border: 2px solid var(--ink-3); border-radius: 50%; }
.search::after { content: ""; position: absolute; left: 24px; top: 23px; width: 6px; height: 2px; background: var(--ink-3); transform: rotate(45deg); }
.sugg { position: absolute; left: 0; right: 0; top: 40px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; display: grid; gap: 2px; z-index: 30; }
.sugg button { text-align: left; border: 0; background: transparent; border-radius: 6px; padding: 6px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.sugg button[aria-selected="true"], .sugg button:hover { background: var(--panel); }
.sugg small { color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav { display: flex; gap: 2px; margin-left: auto; }
.nav button { border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; cursor: pointer; color: var(--ink-2); font-size: 13.5px; white-space: nowrap; }
.nav button:hover { background: var(--panel); color: var(--ink); }
.nav button[aria-current="page"] { color: var(--ink); background: var(--panel); font-weight: 600; }
.nav .cnt { font: 500 11px var(--font-mono); color: var(--warn); margin-left: 2px; }
.menu-btn { display: none; }
@media (max-width: 1080px) { .nav .wide { display: none; } }
@media (max-width: 900px) { .menu-btn { display: inline-flex; } }
@media (max-width: 640px) { .nav { display: none; } .brand small { display: none; } .hist { display: none; } }

/* 본체 */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: calc(100vh - 52px); }
@media (max-width: 900px) { .shell { grid-template-columns: minmax(0, 1fr); } }
.rail { border-right: 1px solid var(--rule); background: var(--surface); position: sticky; top: calc(52px + env(safe-area-inset-top, 0px)); height: calc(100vh - 52px - env(safe-area-inset-top, 0px)); overflow: auto; overscroll-behavior: contain; scrollbar-color: var(--scroll) transparent; padding: 14px 12px 24px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 901px) { .rail { scrollbar-width: none; } .rail::-webkit-scrollbar { display: none; } }
/* 목록 위치 표시: 구분선 위에 겹친 얇은 막대. 평소엔 흐리게, 목록에 마우스를 올리거나 굴리면 진하게. 끌어서 옮길 수 있다 */
.rail-thumb { position: fixed; z-index: 15; width: 13px; margin-left: -7px; display: flex; justify-content: center; cursor: default; touch-action: none; }
.rail-thumb i { display: block; width: 2px; height: 100%; border-radius: 2px; background: var(--ink-3); opacity: .28; transition: width .15s ease, opacity .2s ease; }
.rail-thumb.live i { opacity: .55; width: 4px; }
.rail-thumb:hover i, .rail-thumb.drag i { opacity: .75; width: 5px; }
@media (max-width: 900px) { .rail-thumb { display: none; } }
@media (max-width: 900px) {
  .rail { position: fixed; z-index: 40; left: 0; top: 0; bottom: 0; height: auto; width: min(86vw, 320px); transform: translateX(-104%); transition: transform .25s ease; box-shadow: var(--shadow); padding-top: calc(14px + env(safe-area-inset-top, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .rail.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgba(10, 18, 30, .4); z-index: 35; }
}
.rail-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.rail-head h2 { font: 600 13px var(--font-ui); margin: 0; color: var(--ink-2); letter-spacing: .04em; }
.rail select { font-size: 12.5px; border: 1px solid var(--rule); border-radius: 6px; padding: 3px 6px; background: var(--bg); color: var(--ink); max-width: 150px; }
.progress { display: grid; gap: 4px; margin: 6px 0 12px; font-size: 12px; color: var(--ink-3); }
.bar { height: 5px; background: var(--panel); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--chart); border-radius: 3px; }
/* 분류 제목 = 접기 버튼. 펼침 ▾ / 접힘 ▸, 오른쪽 숫자는 그 분류의 문서 수 */
.rail-cat { width: 100%; display: flex; align-items: center; gap: 7px; border: 0; background: transparent; cursor: pointer; text-align: left; font: 600 11.5px/1.4 var(--font-ui); color: var(--ink-3); letter-spacing: .05em; margin: 10px 0 2px; padding: 5px 6px; border-radius: 6px; }
.rail-cat:hover { color: var(--ink); background: var(--panel); }
.rail-cat .ct { flex: 1; min-width: 0; }
.rail-cat .n { font: 500 10.5px var(--font-mono); letter-spacing: 0; opacity: .7; font-variant-numeric: tabular-nums; }
.rail-cat .chev { width: 6px; height: 6px; flex: none; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(-2px) rotate(45deg); transition: transform .2s ease; }
.rail-cat[aria-expanded="false"] .chev { transform: translateX(-1px) rotate(-45deg); }
.rail-cat.has-cur[aria-expanded="false"] { color: var(--chart); }
.rail-tools { display: flex; justify-content: flex-end; margin: -4px 0 -6px; }
.rail-foldall { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; cursor: pointer; font: 500 12px var(--font-ui); color: var(--ink-3); padding: 3px 6px; border-radius: 6px; }
.rail-foldall:hover { color: var(--ink); background: var(--panel); }
.rail-foldall:focus-visible { outline-offset: -2px; }
/* 겹친 두 꺾쇠: 접기 = 위로 모으는 모양, 펴기 = 아래로 여는 모양 */
.chev2 { position: relative; width: 8px; height: 10px; flex: none; }
.chev2::before, .chev2::after { content: ""; position: absolute; left: 1px; width: 5px; height: 5px; border-left: 1.5px solid currentColor; border-top: 1.5px solid currentColor; transform: rotate(45deg); }
.chev2::before { top: 1px; } .chev2::after { top: 5px; }
.chev2.down::before, .chev2.down::after { transform: rotate(225deg); }
.chev2.down::before { top: 0; } .chev2.down::after { top: 4px; }
.rail-grp { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .22s ease; }
.rail-grp.shut { grid-template-rows: 0fr; }
.rail-grp-in { overflow: hidden; min-height: 0; }
.rail li button:focus-visible, .rail-cat:focus-visible { outline-offset: -2px; }
@media (prefers-reduced-motion: reduce) { .rail-grp, .rail-cat .chev { transition: none; } }
.rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.rail li button { width: 100%; display: flex; align-items: baseline; gap: 6px; text-align: left; border: 0; background: transparent; padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 13.5px; line-height: 1.45; color: var(--ink); }
.rail li button:hover { background: var(--panel); }
.rail li button[aria-current="page"] { background: var(--chart-soft); color: var(--ink); font-weight: 600; }
.rail .t { flex: 1; min-width: 0; }
.vc { font: 500 10.5px var(--font-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: right; }
.vc.zero { opacity: .45; }
.vc.hot { color: var(--chart); }

main { min-width: 0; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 62rem; margin: 0 auto; }
.read { max-width: var(--measure); }
.eyebrow { font: 600 11.5px var(--font-ui); letter-spacing: .08em; color: var(--ink-3); }

/* 문서 */
.crumbs { font-size: 12.5px; color: var(--ink-3); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.crumbs button { border: 0; background: none; padding: 0; color: var(--link); cursor: pointer; font-size: inherit; }
.trail { font-size: 12px; color: var(--ink-3); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.trail button { border: 0; background: none; color: var(--ink-2); cursor: pointer; padding: 0; font-size: 12px; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.doc-head { margin: 10px 0 18px; }
.doc-head h1 { font: 600 clamp(26px, 4vw, 34px)/1.25 var(--font-display); margin: 0; letter-spacing: -0.015em; display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.visits { font: 500 12px var(--font-mono); color: var(--ink-3); border: 1px solid var(--rule); border-radius: 999px; padding: 1px 8px; margin-top: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.doc-head .en { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; font-style: italic; }
.doc-grid { display: grid; grid-template-columns: minmax(0, 1fr) 15.5rem; gap: 28px; align-items: start; }
@media (max-width: 1180px) { .doc-grid { grid-template-columns: minmax(0, 1fr); } }
.side { display: grid; gap: 14px; position: sticky; top: calc(70px + env(safe-area-inset-top, 0px)); }
@media (max-width: 1180px) { .side { position: static; } .side .toc { display: none; } }
.infobox { border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); font-size: 13px; overflow: hidden; }
.infobox h3 { margin: 0; padding: 8px 12px; font: 600 13px var(--font-ui); background: var(--panel); border-bottom: 1px solid var(--rule); }
.infobox dl { margin: 0; padding: 8px 12px 10px; display: grid; grid-template-columns: 4.6em minmax(0, 1fr); gap: 4px 10px; }
.infobox dt { color: var(--ink-3); }
.infobox dd { margin: 0; overflow-wrap: anywhere; }
.infobox .scene-btn { margin: 0 12px 12px; width: calc(100% - 24px); }
.toc { border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px; font-size: 13px; background: var(--surface); }
.toc b { display: block; font-size: 12px; color: var(--ink-3); letter-spacing: .05em; margin-bottom: 4px; }
.toc ol { margin: 0; padding-left: 1.4em; }
.toc a { color: var(--ink-2); text-decoration: none; }
.toc a:hover { color: var(--link); text-decoration: underline; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 13.5px; font-weight: 500; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn.ghost:hover { border-color: var(--ink-3); }
.sec { margin-top: 30px; }
.sec h2 { font: 600 19px var(--font-display); margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.sec h2 .n { font: 500 13px var(--font-mono); color: var(--chart); }
.def { font-size: 17px; line-height: 1.75; margin: 0; }
.easy { background: var(--panel); border-radius: 10px; padding: 14px 18px; display: grid; gap: 10px; }
.easy p { margin: 0; }
.why { margin: 0; padding-left: 14px; border-left: 3px solid var(--key-rule); }
.terms { margin: 14px 0 4px; }
.terms table { font-family: var(--font-ui); width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.55; }
.terms caption { text-align: left; font: 600 12px var(--font-ui); color: var(--ink-3); letter-spacing: .04em; padding: 8px 12px 2px; }
.terms th { text-align: left; font: 600 12px var(--font-ui); color: var(--ink-3); padding: 6px 12px; border-bottom: 1px solid var(--rule); }
.terms td { font-family: var(--font-ui); padding: 7px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.terms tr:last-child td { border-bottom: 0; }
.terms td:first-child { white-space: nowrap; }
.terms td:nth-child(2) { color: var(--ink-2); }
.terms .abbr { font: 600 12px var(--font-mono); color: var(--chart); margin-left: 2px; }
@media (max-width: 560px) { .terms td:first-child { white-space: normal; } .terms th, .terms td { font-family: var(--font-ui); padding: 6px 8px; } }
a.ext::after { content: "↗"; font-size: .8em; margin-left: 1px; }
.prose p { margin: 0 0 12px; }
.prose ul, .prose ol { margin: 0 0 12px; padding-left: 1.3em; }
.prose li { margin: 3px 0; }
.formula { display: flex; align-items: baseline; justify-content: center; gap: 18px; flex-wrap: wrap; margin: 6px 0 16px; padding: 12px 16px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); background: var(--surface); }
.formula .f { font: 500 17px var(--font-mono); letter-spacing: .01em; }
.formula .lbl { font: 500 12px var(--font-mono); color: var(--ink-3); }
.tbl { overflow-x: auto; margin: 4px 0 16px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
.tbl table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.tbl th, .tbl td { padding: 6px 12px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; font-variant-numeric: tabular-nums; }
.tbl th { background: var(--panel); font-weight: 600; font-size: 12.5px; color: var(--ink-2); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td:not(:first-child) { font-family: var(--font-mono); font-size: 13px; }
.tbl caption { caption-side: top; text-align: left; padding: 8px 12px; font-size: 12.5px; color: var(--ink-3); }
.key { border: 1px solid var(--key-rule); background: var(--key-bg); border-radius: 10px; padding: 12px 16px 12px 16px; margin-top: 16px; }
.key b { font: 600 12px var(--font-ui); letter-spacing: .06em; color: var(--ink-2); display: block; margin-bottom: 4px; }
.key ul { margin: 0; padding-left: 1.2em; }
.key li { margin: 2px 0; font-weight: 500; }
.confuse { border-left: 3px solid var(--ink-3); padding: 2px 0 2px 14px; margin: 0; color: var(--ink-2); }
.flags { border: 1px solid var(--warn-rule); background: var(--warn-bg); border-radius: 10px; padding: 10px 14px; margin-bottom: 18px; }
.flags summary { cursor: pointer; font-weight: 600; color: var(--warn); font-size: 14px; list-style: none; display: flex; align-items: center; gap: 8px; }
.flags summary::-webkit-details-marker { display: none; }
.flags summary::before { content: "⚑"; }
.flags ul { margin: 8px 0 2px; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13.5px; }
.flags li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: baseline; }
.kind { font: 600 11px var(--font-ui); padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.kind[data-k="교재 정정"] { color: var(--red); }
.kind[data-k="교재 밖"] { color: var(--link); }
.kind[data-k="판독 불확실"] { color: var(--warn); }
.kind[data-k="계산 확인"] { color: var(--ok); }
.kind[data-k="해석"] { color: var(--chart); }
.wl { color: var(--link); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--link) 35%, transparent); text-underline-offset: 3px; cursor: pointer; }
.wl:hover { text-decoration-color: var(--link); }
.wl.red { color: var(--red); }
.fnref { font: 600 11px var(--font-mono); vertical-align: super; line-height: 0; margin-left: 1px; }
.fnref button { border: 0; background: none; color: var(--link); cursor: pointer; padding: 0 1px; font: inherit; }
.fnref.flag button { color: var(--warn); }
.fnref.flag button::after { content: "⚑"; font-size: 9px; margin-left: 1px; }
.pop { position: absolute; z-index: 50; max-width: min(380px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); padding: 10px 14px; font-size: 13.5px; line-height: 1.6; color: var(--ink); }
.pop .pt { font-weight: 600; margin-bottom: 2px; }
.pop .pk { font-size: 11.5px; color: var(--ink-3); }
.fnlist { margin: 0; padding-left: 1.6em; font-size: 13.5px; color: var(--ink-2); }
.fnlist li { margin: 4px 0; }

:[11]},{"order":86,"title":"천측계산","en":"Sight reduction","aliases":[],"cat":11,"catName":"위치선 결정","section":"8.2","pages":"160","figures":"","scenes":[]},{"order":87,"title":"천측계산표","en":"Sight reduction tables","aliases":["Pub. 229","Pub. 249"],"cat":11,"catName":"위치선 결정","section":"8.2","pages":"160–161","figures":"","scenes":[]},{"order":88,"title":"가정위치법과 추측위치법","en":"Assumed and dead-reckoning position methods","aliases":["위치선의 요소","삼중보간"],"cat":11,"catName":"위치선 결정","section":"8.2.1","pages":"161","figures":"","scenes":[]},{"order":89,"title":"△d 개정법","en":"Δd correction method","aliases":["Dec. diff.","ht","Interpolation Table"],"cat":11,"catName":"위치선 결정","section":"8.2.1 [1]","pages":"161–164","figures":"","scenes":[11]},{"order":90,"title":"고도차 부호 T·A","en":"Toward, Away","aliases":["Toward","Away","HoMoTo"],"cat":11,"catName":"위치선 결정","section":"8.2.1 [1]","pages":"162–164","figures":"","scenes":[11]},{"order":91,"title":"위치기입도 작도","en":"Plotting sheet","aliases":["Plotting sheet","위치기입도"],"cat":11,"catName":"위치선 결정","section":"8.2.1 [1]","pages":"162–164","figures":"그림 8.3(작도 예)","scenes":[11]},{"order":92,"title":"Sun Sighting","en":"Sun sight example","aliases":[],"cat":11,"catName":"위치선 결정","section":"8.2.1 [1]","pages":"162–164","figures":"","scenes":[11]},{"order":93,"title":"Star Sighting","en":"Star sight example","aliases":["박명시","Pub. 249 Vol. 1"],"cat":11,"catName":"위치선 결정","section":"8.2.1 [1]","pages":"165–168","figures":"그림 8.4(작도 예)","scenes":[11]},{"order":94,"title":"위치선의 교점과 전위","en":"Fix, Running fix","aliases":["선위","격시 관측","전위"],"cat":11,"catName":"위치선 결정","section":"8.1.2, 8.2.1","pages":"155, 168","figures":"","scenes":[11]}],"content":[{"title":"천구","easy":["맑은 밤 갑판에 서서 하늘을 올려다보면, 달도 별도 모두 같은 거리의 둥근 천장에 박혀 있는 것처럼 보인다. 실제 거리는 제각각이지만 눈으로는 그 차이를 알 수 없기 때문이다. 이 둥근 천장을 발아래까지 이어 커다란 공 하나로 만든 것이 **천구**(Celestial sphere)다.","천구는 반지름이 무한히 큰 가상의 공이라고 생각한다. 그러면 천체의 위치는 거리를 빼고 ‘어느 방향에 있는가’만으로 정할 수 있다. 천측에 필요한 것도 바로 이 방향이다.[2]","천구 위 두 점이 얼마나 떨어져 있는지는 km가 아니라 각도로 말한다. 공의 중심에서 두 점을 바라본 각을 **각거리**(Angular distance)라 한다. 예를 들어 지평선에서 머리 바로 위까지의 각거리는 90°다."],"definition":"관측자의 눈을 중심으로 하고 무한대의 반지름을 가진 가상의 구를 천구(Celestial sphere)라 하며, 모든 천체가 이 구의 안쪽 면에 붙어 있다고 가정한다. 실제로는 지구의 반지름이 천구의 반지름에 비해 무시할 만큼 작으므로 천구의 중심을 지구 중심에 두며, 이를 지심천구(Geocentric celestial sphere)라 한다. 천구 위 두 점 사이의 거리는 각거리(Angular distance)로 나타낸다.[1]","terms":[{"ko":"천구","en":"Celestial sphere","plain":"모든 천체가 안쪽 면에 붙어 있다고 보는 무한히 큰 가상의 공"},{"ko":"지심천구","en":"Geocentric celestial sphere","plain":"중심을 지구 중심에 둔 천구. 보통 ‘천구’는 이것"},{"ko":"각거리","en":"Angular distance","plain":"천구 중심에서 두 점을 바라본 각. 천구 위의 거리"},{"ko":"[[겉보기위치·진위치|겉보기위치]]","en":"Apparent place","plain":"지구 표면의 관측자가 실제로 보는 천체의 위치"}],"why":"천측은 ‘천체가 어느 방향에, 몇 도 높이로 보이는가’를 재서 배의 위치를 구한다. 거리는 쓰지 않으므로 모든 천체를 천구 한 장 위의 점으로 놓고 생각할 수 있다. [[천측력]]이 싣는 [[적위]]·[[본초시각]], 육분의로 재는 [[고도·고도의 거등권|고도]]가 모두 이 천구 위에서 잰 각이다.","body":["지구 위의 관측자는 천체까지의 거리를 눈으로 알 수 없다. 그래서 가까운 달이든 먼 별이든 하나의 커다란 구 안쪽에 붙어 있다고 보고, 천체의 위치를 거리 없이 방향만으로 정한다.[1] Bowditch도 천체 사이의 거리가 엄청나게 멀기 때문에 천구의 반지름을 무한대로 볼 수 있다고 설명한다.[2]","천구의 중심은 처음에는 관측자의 눈이다. 그러나 천구의 반지름에 비하면 지구의 반지름은 무시할 만큼 작다. 그래서 편의상 천구의 중심을 지구 중심에 둔다. 이런 천구를 **지심천구**(Geocentric celestial sphere)라 하며, 보통 천구라고 하면 지심천구를 뜻한다.[1]","반지름이 무한대이면 어느 점을 중심으로 삼아도 같은 천체는 같은 방향에 보인다. 다만 아주 정밀하게 따질 때는 지구 표면에서 본 위치와 지구 중심에서 본 위치를 구별한다. 달처럼 가까운 천체는 보는 자리에 따라 배경 별에 대해 조금 옮겨 보이기 때문이다.[3] 이 차이는 [[겉보기위치·진위치]]와 [[시차·수평시차]]에서 다룬다.","천구 위 두 점 사이의 거리는 길이가 아니라, 천구 중심에서 두 점이 이루는 각인 **각거리**(Angular distance)로 나타낸다.[1] 천구가 하루에 한 번 도는 것처럼 보이는 현상은 [[일주운동·주극성]]에서, 천구 위의 기준점과 기준선은 [[천의 극·천의 축]]과 [[천의 적도]]에서 이어진다. 3D 장면 1(천구 만들기)에서 천구를 직접 돌려 볼 수 있다."],"confusions":"천구의 중심은 ‘관측자의 눈’에서 출발했지만, 실제 계산에서는 지구 중심으로 옮겨 쓴다. 이 차이가 무시되지 않는 가까운 천체(달·태양·행성)는 [[겉보기위치·진위치]]와 [[시차·수평시차]]에서 따로 고친다.","key":["천구 = 관측자 중심, 반지름 무한대인 가상의 구","실제 계산은 지구 중심에 둔 지심천구로 한다","천구 위 거리 = 각거리(중심에서 본 각), 거리는 따지지 않고 방향만"],"footnotes":["교재 2쪽, 그림 1.1.","교재 밖 보충 설명. Bowditch 1301·1303절은 천체가 지구 중심의 거대한 구 안쪽 면에 있다고 상상하며, 천체 사이 거리가 매우 멀어 반지름을 무한대로 볼 수 있다고 쓴다. 참고: [Bowditch, The American Practical Navigator (2019), Chapter 13 Navigational Astronomy](https://thenauticalalmanac.com/2019_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2013-%20Navigational%20Astronomy.pdf).","교재 밖 보충 설명. 반지름이 무한대인 천구에서는 모든 관측자가 같은 천체를 같은 방향에 본다. 정밀한 계산에서는 지구 표면의 한 지점에서 본 위치(topocentric)와 지구 중심에서 본 위치(geocentric)를 나눈다. 참고: [Celestial sphere — Wikipedia](https://en.wikipedia.org/wiki/Celestial_sphere)."],"flags":[]},{"title":"일주운동·주극성","easy":["밤새 북쪽 하늘을 사진기로 오래 찍으면, 별들이 북극성 둘레로 동그란 줄무늬를 그린다. 지구가 서에서 동으로 자전하기 때문에, 하늘 전체가 거꾸로 동에서 서로 도는 것처럼 보이는 것이다. 이 겉보기 회전이 **일주운동**(Diurnal motion)이다.[2]","하늘은 하루에 한 바퀴, 곧 1시간에 약 15°씩 돈다. 별 하나가 이렇게 하루 동안 천구 위에 그리는 원을 **일주권**(Diurnal circle)이라 한다.[2]","북극성 가까이 있는 별은 원이 작아서 지평선 아래로 내려가지 않는다. 이렇게 하루 종일 지지 않는 별이 **주극성**(Circumpolar star)이다. 위도 35°N에서는 천의 북극에서 35° 안쪽에 있는 별, 곧 [[적위]]가 55°N보다 큰 별이 주극성이다.[3]"],"definition":"천체들이 동쪽에서 떠서 서쪽으로 지는 것은 지구가 서에서 동으로 자전하기 때문이며, 천구가 천체들을 실은 채 동에서 서로 하루에 한 번씩 회전하는 것처럼 보이는 이 겉보기운동을 일주운동(Diurnal motion)이라 한다. 일주운동으로 천체가 천구 위에 그리는 원을 일주권이라 하고, 일주권이 수평선 위에만 있는 천체를 주극성(週極星, Circumpolar star)이라 한다.[1]","terms":[{"ko":"일주운동","en":"Diurnal motion","plain":"하늘 전체가 하루에 한 번 동에서 서로 도는 것처럼 보이는 운동"},{"ko":"일주권","en":"Diurnal circle","plain":"천체 하나가 일주운동으로 하루 동안 그리는 원"},{"ko":"주극성","en":"Circumpolar star","plain":"일주권이 통째로 지평선 위에 있어 지지 않는 별"},{"ko":"[[천의 극·천의 축|천의 축]]","en":"Celestial axis","plain":"일주운동의 회전축. 지구 자전축을 늘인 선"},{"ko":"[[극거]]","en":"Polar distance","abbr":"p","plain":"동명극에서 천체까지의 각. 주극성 판별에 쓴다"}],"why":"일주운동 때문에 천체의 [[본초시각]](GHA)과 [[지방시각·자오선각|지방시각]](LHA)은 시간이 흐를수록 계속 커진다. 그래서 천측에서는 관측한 순간의 시각을 초 단위까지 적고, [[천측력]]에서 그 순간의 값을 찾는다. 주극성인 북극성은 늘 북쪽 하늘에 떠 있어서, 그 고도로 위도를 구하는 북극성위도법에 쓰인다.[4]","body":["천체가 동쪽에서 떠서 서쪽으로 지는 것은 지구가 서에서 동으로 자전하기 때문이다. 천구에서 보면 천구 전체가 천체를 실은 채 하루에 한 번 동에서 서로 회전하는 것처럼 보인다. 그 회전축은 지구의 자전축, 곧 [[천의 극·천의 축|천의 축]]과 일치한다.[1]","일주운동 때문에 천체는 천구 위에 원을 그리는데, 이 원이 **일주권**(Diurnal circle)이다.[1] 천체의 [[적위]]는 하루 동안 거의 변하지 않으므로, 일주권은 그 천체의 [[적위의 거등권]]과 같다. 그래서 천의 극에 가까운 별일수록 작은 원을 그리며 천천히 도는 것처럼 보인다.[2]","일주권이 모두 수평선 위에 있는 천체가 **주극성**이다.[1] 주극성은 하루 종일 지지 않고 천의 극 둘레를 돈다. 주극성인지는 관측자의 위도에 따라 달라지며, 다음 조건으로 가를 수 있다.[3]",{"list":["천체의 [[극거]] p가 관측자의 위도보다 작으면 주극성이다(극거 < 위도).","같은 말로, 북반구에서는 적위 > 90° − 위도이면 주극성이다.","대기 굴절은 무시한 기하학적 조건이다. 실제로는 굴절 때문에 경계 근처의 별이 조금 더 오래 보인다."]},{"table":{"head":["순서","계산","값"],"rows":[["① 관측자 위도","주어진 값","35°N"],["② 주극성 경계 적위","90° − 35°","55°N"],["③ 적위 60°N인 별의 극거","90° − 60°","30°"],["④ 판정","30° < 35°","주극성(지지 않음)"]]},"caption":"보충 예시 — 위도 35°N에서 주극성 가리기"},"3D 장면 1(천구 만들기)에서 위도를 바꾸면 주극성 영역이 넓어지고 좁아지는 것을 볼 수 있다."],"confusions":"주극성인지는 천체마다 정해진 게 아니라 관측자의 위도에 따라 달라진다. 같은 별도 북쪽으로 갈수록 주극성이 되기 쉽다. 극에서는 지평선 위의 모든 별이 주극성이고, 적도에서는 주극성이 하나도 없다.[3]","key":["일주운동: 하루 한 바퀴, 동→서 (지구 자전의 반영), 1시간에 약 15°","일주권 = 그 천체의 적위의 거등권","주극성 조건: 극거 < 관측자 위도 (예: 35°N에서 적위 55°N 초과)"],"footnotes":["교재 2–3쪽.","교재 밖 보충 설명. 일주운동은 지구 자전 때문에 천체가 천의 극 둘레를 하루에 한 바퀴 도는 겉보기 운동이고, 그 원을 diurnal circle이라 한다. 천의 적도 근처 별은 1시간에 15°씩 움직이고, 극에 가까울수록 느리다. 참고: [Diurnal motion — Wikipedia](https://en.wikipedia.org/wiki/Diurnal_motion), [Bowditch, The American Practical Navigator (2019), Chapter 13 Navigational Astronomy](https://thenauticalalmanac.com/2019_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2013-%20Navigational%20Astronomy.pdf)(1316절).","교재 밖 보충 설명. 대기 굴절은 무시한 조건이다. 북반구에서 위도 θ, 적위 δ일 때 θ + δ > 90°이면 주극성이다. 참고: [Circumpolar star — Wikipedia](https://en.wikipedia.org/wiki/Circumpolar_star).","교재 150쪽(북극성위도법). 교재 밖 보충 설명. 북극성은 천의 북극에서 1° 안에 있어, 그 고도가 거의 관측자의 위도와 같다. 참고: [Celestial pole — Wikipedia](https://en.wikipedia.org/wiki/Celestial_pole)."],"flags":[{"kind":"교재 밖","text":"주극성 판별 조건(극거 < 위도)과 예시(35°N에서 적위 55°N 초과)는 교재에 없는 보충 설명이다.","fn":3}]},{"title":"천의 극·천의 축","easy":["팽이가 돌 때 가운데 심은 제자리에 있고 나머지가 그 둘레를 돈다. 지구의 자전축을 하늘 끝까지 길게 늘이면 천구에 두 점이 생기고, 하늘도 이 두 점을 심으로 삼아 돈다. 이 두 점이 **천의 극**(Celestial pole), 늘인 축이 **천의 축**(Celestial axis)이다.","북쪽 점은 천의 북극(Pn), 남쪽 점은 천의 남극(Ps)이다. 지금은 천의 북극에서 1°도 안 되는 곳에 북극성이 있다. 그래서 북극성은 밤새 거의 움직이지 않는 것처럼 보인다.[2]","북반구 사람에게는 천의 북극만 지평선 위에 보인다. 내 위도와 이름(N·S)이 같은 이 극을 **동명극**(Elevated pole)이라 한다. 동명극의 높이는 내 위도와 같아서, 위도 35°N에서는 북극성이 지평선 위 약 35°에 떠 있다.[2]"],"definition":"지축을 무한히 연장하여 천구와 만난 점을 천의 극(Celestial pole)이라 하고, 이 무한히 연장한 가상의 선을 천의 축(Celestial axis)이라 한다. 천의 극 가운데 관측자의 위도와 동명(Same name)인 극, 곧 수평선 위쪽에 있는 극을 동명극(Elevated pole), 그 반대쪽 수평선 아래에 있는 극을 이명극(Depressed pole)이라 한다.[1]","terms":[{"ko":"천의 극","en":"Celestial pole","plain":"지구 자전축을 늘여 천구와 만난 두 점. 하늘이 도는 중심"},{"ko":"천의 축","en":"Celestial axis","plain":"두 천의 극을 잇는 선(PnPs). 지축을 늘인 것"},{"ko":"천의 북극·천의 남극","en":"North celestial pole, South celestial pole","abbr":"Pn, Ps","plain":"지구 북극 쪽 극이 Pn, 남극 쪽 극이 Ps"},{"ko":"동명극","en":"Elevated pole","plain":"내 위도와 같은 이름의 극. 지평선 위에 보인다"},{"ko":"이명극","en":"Depressed pole","plain":"내 위도와 반대 이름의 극. 지평선 아래에 있다"}],"why":"동명극은 [[항해삼각형]]의 세 꼭짓점(동명극·천정·천체) 가운데 하나다. 천체의 [[극거]]도 동명극에서 잰다. 또 동명극의 고도가 위도와 같으므로, 북극성의 고도를 재면 위도를 바로 얻는다. 교재 8장 도입의 북극성위도법이 이 원리를 쓴다.[3]","body":["지구 북극 쪽에 있는 극을 **천의 북극**(Pn), 남극 쪽에 있는 극을 **천의 남극**(Ps)이라 한다. 그림 1.2에서 Pn과 Ps는 천의 극, PnPs는 천의 축이다.[1]","관측자의 위도와 같은 이름(Same name)의 극, 곧 수평선 위에 있는 극을 **동명극**(Elevated pole), 반대쪽 수평선 아래에 있는 극을 **이명극**(Depressed pole)이라 한다. 북반구의 관측자에게는 천의 북극이 동명극이고 천의 남극이 이명극이다.[1]",{"table":{"head":["관측자","동명극(수평선 위)","이명극(수평선 아래)"],"rows":[["북반구 (위도 N)","천의 북극 Pn","천의 남극 Ps"],["남반구 (위도 S)","천의 남극 Ps","천의 북극 Pn"]]},"caption":"관측자 위치에 따른 동명극과 이명극"},"천의 극은 모든 [[천의 자오선·시권|천의 자오선]]이 모이는 점이고, [[천의 적도]]에서 어느 쪽으로든 90° 떨어져 있다. 하늘의 다른 모든 점은 천의 극 둘레를 돈다([[일주운동·주극성|일주운동]]).[2]","동명극의 고도는 관측자의 위도와 같다. 적도(위도 0°)에서는 천의 극이 지평선에 있고, 북극(위도 90°N)에서는 천의 북극이 머리 바로 위에 온다.[2] 3D 장면 1에서 위도를 바꾸며 천의 극의 높이가 따라 바뀌는 것을 볼 수 있다."],"confusions":"‘동명’의 기준은 천체가 아니라 관측자의 위도다. 북반구 관측자에게는 Pn, 남반구 관측자에게는 Ps가 동명극이다. 같은 별이라도 관측자가 적도를 건너면 동명극이 바뀐다.","key":["천의 북극 Pn, 천의 남극 Ps, 천의 축 PnPs","동명극 = 관측자 위도와 같은 이름의 극(수평선 위), 이명극 = 반대(수평선 아래)","동명극의 고도 = 관측자의 위도 (북극성위도법의 원리)"],"footnotes":["교재 3쪽, 그림 1.2.","교재 밖 보충 설명. 천의 극은 고정되어 있고 다른 모든 점이 그 둘레를 돈다. 북극성은 천의 북극에서 1° 안에 있으며, 그 고도는 거의 관측자의 위도와 같다. 8장 도입(150쪽)에 나오는 북극성위도법이 이 원리를 쓴다. 참고: [Celestial pole — Wikipedia](https://en.wikipedia.org/wiki/Celestial_pole).","교재 21쪽(항해삼각형의 꼭짓점), 150쪽(북극성위도법)."],"flags":[{"kind":"교재 밖","text":"‘동명극의 고도 = 관측자의 위도’는 이 쪽에 없는 보충 사실이다.","fn":2}]},{"title":"천의 적도","easy":["지구본의 적도를 따라 얇은 판을 끼우고, 그 판을 하늘 끝까지 넓혔다고 상상해 보자. 판이 천구와 만나는 큰 원이 **천의 적도**(Celestial equator)다. 하늘을 북쪽 반과 남쪽 반으로 똑같이 나누는 선이다.","천의 적도는 두 [[천의 극·천의 축|천의 극]]에서 어디나 똑같이 90° 떨어져 있다. 지구 적도 위에 선 사람에게는 이 원이 정동과 정서를 잇고 머리 바로 위를 지나간다.[2]","천의 적도처럼 구의 중심을 지나는 평면이 만든 원을 **대권**(Great circle)이라 한다. 구 위에서 그릴 수 있는 가장 큰 원이다. 중심을 지나지 않는 평면이 만든 더 작은 원은 **소권**(Small circle)이다.[3]"],"definition":"지구의 적도면을 무한히 연장하여 천구와 만나서 이루는 대권(Great circle)을 천의 적도(Celestial equator)라 한다. 따라서 천의 극에서 천의 적도까지의 각거리는 어디에서나 90°다.[1]","terms":[{"ko":"천의 적도","en":"Celestial equator","abbr":"QQ′","plain":"지구 적도면을 늘여 천구에 그린 큰 원. 하늘의 적도"},{"ko":"대권","en":"Great circle","plain":"구의 중심을 지나는 평면이 만드는 원. 가장 큰 원"},{"ko":"소권","en":"Small circle","plain":"구의 중심을 지나지 않는 평면이 만드는 원"},{"ko":"[[적위]]","en":"Declination","abbr":"Dec","plain":"천의 적도에서 남북으로 잰 각. 하늘의 위도"}],"why":"천의 적도는 [[적위]]를 재는 0°선이고, [[본초시각]](GHA)·[[항성시각]](SHA)도 이 원을 따라 잰다. [[천측력]]이 싣는 태양·달·별의 좌표는 모두 천의 적도를 기준으로 한다. 그래서 천의 적도를 그릴 줄 알아야 천측력의 숫자가 하늘의 어디를 뜻하는지 읽을 수 있다.","body":["천의 적도는 지구 적도면 위에 있으므로, [[천의 극·천의 축|천의 극]]에서 천의 적도까지의 각거리는 어디서나 90°다. 그림 1.3에서 QQ′가 천의 적도다.[1] Bowditch도 천의 적도를 ‘지구 적도면을 천구에 투영한 것’이라고 설명한다.[2]","천의 적도는 [[적도좌표계]]의 기준(주권)이다. 천체가 천의 적도에서 남북으로 얼마나 떨어져 있는지가 [[적위]]이고, 천의 적도와 나란한 작은 원이 [[적위의 거등권]]이다.","태양이 1년 동안 천구 위를 도는 길인 [[황도]]는 천의 적도와 약 23°27′ 기울어져 있다. 두 원이 만나는 두 점이 [[춘분점·추분점]]이다. 3D 장면 1(천구 만들기)에서 천의 적도와 천의 극의 관계를 볼 수 있다."],"confusions":"대권(Great circle)은 구의 중심을 지나는 평면이 만드는 원이고, 소권(Small circle)은 중심을 지나지 않는 평면이 만드는 원이다. 천의 적도는 대권이고, 적위의 거등권은 소권이다.[3]","key":["천의 적도 = 지구 적도면을 늘인 대권 (QQ′)","천의 극에서 천의 적도까지는 어디서나 90°","적도좌표계의 기준 대권 — 적위 0°선"],"footnotes":["교재 4쪽, 그림 1.3.","교재 밖 보충 설명. 천의 적도는 지구 적도와 같은 평면에 있는 천구의 대권이며, 지구 적도에 선 관측자에게는 천정을 지나는 반원으로 보인다. 참고: [Celestial equator — Wikipedia](https://en.wikipedia.org/wiki/Celestial_equator), [Bowditch, The American Practical Navigator (2019), Chapter 13 Navigational Astronomy](https://thenauticalalmanac.com/2019_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2013-%20Navigational%20Astronomy.pdf)(1325절).","교재 밖 보충 설명. 대권·소권은 구면기하의 기본 용어다."],"flags":[]},{"title":"지구의 궤도","easy":["지구는 제자리에서 팽이처럼 돌면서(자전), 1년에 한 바퀴씩 태양 둘레를 돈다(공전). 공전하면서 그리는 길이 **지구의 궤도**(Earth's orbit)다. 모양은 원에 아주 가까운 타원이다.","타원이 원에서 얼마나 찌그러졌는지를 나타내는 수가 **이심률**(Eccentricity)이다. 지구 궤도의 이심률은 0.0167, 약 1/60이라 종이에 그리면 원과 거의 구별되지 않는다. 태양과 가장 가까울 때와 가장 멀 때의 거리 차이도 약 3%뿐이다.","지구가 태양에 가장 가까운 **근일점**(Perihelion)은 1월, 가장 먼 **원일점**(Aphelion)은 7월이다. 북반구가 한겨울일 때 오히려 태양에 가장 가깝다. 계절은 거리가 아니라 지축이 약 23°27′ 기울어 있어서 생긴다.[4]"],"definition":"지구는 자전(Rotation)하면서 1년을 주기로 태양 둘레를 공전(Revolution)한다. 지구가 공전할 때 그리는 원에 가까운 타원형의 길을 지구의 궤도(Earth's orbit)라 하며, 궤도는 거의 한 평면을 이루고 지축은 이 평면에 대해 약 23°27′ 기울어 있다. 궤도의 이심률(Eccentricity)은 0.0167(약 1/60)이고, 태양과 지구의 평균거리 약 149,500,000 km가 1천문단위(Astronomical unit)다.[1][2]","terms":[{"ko":"지구의 궤도","en":"Earth's orbit","plain":"지구가 1년 동안 태양 둘레를 도는 거의 원인 타원 길"},{"ko":"자전·공전","en":"Rotation, Revolution","plain":"자기 축으로 도는 것이 자전, 태양 둘레를 도는 것이 공전"},{"ko":"이심률","en":"Eccentricity","plain":"타원이 원에서 찌그러진 정도. 지구는 0.0167"},{"ko":"근일점","en":"Perihelion","plain":"궤도에서 태양에 가장 가까운 점. 1월"},{"ko":"원일점","en":"Aphelion","plain":"궤도에서 태양에서 가장 먼 점. 7월"},{"ko":"천문단위","en":"Astronomical unit","abbr":"AU","plain":"태양과 지구의 평균거리. 약 1억 4,950만 km"}],"why":"지구의 궤도는 천구에서 보면 태양이 움직이는 길, 곧 [[황도]]로 나타난다. 태양이 황도를 따라 움직이므로 태양의 [[적위]]가 계절마다 바뀌고, [[천측력]]은 날마다 다른 값을 싣는다. 또 거리가 바뀌므로 고도개정에 쓰는 태양의 [[겉보기반지름]]도 1월 1일경 16′.30으로 가장 크고 7월 2일경 15′.75로 가장 작다.[5]","body":["지구는 자전하면서 1년 주기로 태양 둘레를 공전한다. 궤도는 거의 한 평면 위에 있고, 지축은 이 평면에 수직인 선에 대해 약 23°27′ 기울어져 있다.[1][2]","궤도의 이심률은 0.0167(약 1/60)로 원에 매우 가깝다. 태양과의 거리는 가장 멀 때 약 152,000,000 km, 가장 가까울 때 약 147,000,000 km다. 두 값의 평균인 약 149,500,000 km를 태양과 지구의 평균거리라 하며, 1천문단위에 해당한다.[1][3]",{"table":{"head":["순서","계산","값"],"rows":[["① 원일점 거리","교재 값","약 152,000,000 km"],["② 근일점 거리","교재 값","약 147,000,000 km"],["③ 평균거리(1천문단위)","(152,000,000 + 147,000,000) ÷ 2","149,500,000 km"],["④ 이심률 확인","(152 − 147) ÷ (152 + 147)","0.0167 (약 1/60)"]]},"caption":"교재 5쪽 수치로 평균거리와 이심률 다시 구하기"},"타원에서 이심률 e는 (가장 먼 거리 − 가장 가까운 거리) ÷ (두 거리의 합)으로 구할 수 있다. 교재의 두 거리로 계산하면 0.0167이 나와 교재의 이심률과 맞는다.[3]","그림 1.4처럼 지구는 1월에 태양에 가장 가까운 근일점을, 7월에 가장 먼 원일점을 지난다.[1] 이 그림에서 지구와 태양의 자리를 바꿔 놓으면 지구의 궤도가 곧 [[황도]]가 된다. 3D 장면 2(황도와 계절점)에서 공전과 계절의 관계를 볼 수 있다."],"confusions":"북반구가 겨울인 1월에 지구가 태양에 가장 가깝다. 계절은 태양과의 거리가 아니라 지축의 기울기 때문에 생긴다.[4] 또 교재 문장 ‘지축은 궤도면에 약 23°27′의 경사’는 지축이 궤도면에 수직인 선과 23°27′ 기울었다는 뜻이다. 지축과 궤도면 자체 사이의 각은 66°33′이다.[2]","key":["이심률 0.0167(약 1/60), 평균거리 약 149,500,000 km = 1천문단위","근일점 1월(약 147,000,000 km), 원일점 7월(약 152,000,000 km)","지축 기울기 약 23°27′ — 계절의 원인은 거리가 아니라 기울기"],"footnotes":["교재 4–5쪽, 그림 1.4.","교재 원문은 ‘지축은 이 평면에 약 23°27′의 경사를 이루고 있다’이다. 이는 지축이 궤도면에 수직인 선과 23°27′ 기울어 있다는 뜻이다. 지축과 궤도면 사이의 각은 90° − 23°27′ = 66°33′이다.","교재는 152,000,000 km를 ‘긴 반지름’, 147,000,000 km를 ‘짧은 반지름’이라고 썼지만, 두 값은 각각 원일점과 근일점의 거리다. 교재 밖 보충 설명. 근일점은 1월 초 약 147,100,000 km, 원일점은 7월 초 약 152,087,000 km다. 현재 1천문단위는 2012년 국제천문연맹이 정한 149,597,870.7 km다. 참고: [Perihelion and aphelion — Wikipedia](https://en.wikipedia.org/wiki/Perihelion_and_aphelion), [Astronomical unit — Wikipedia](https://en.wikipedia.org/wiki/Astronomical_unit).","교재 밖 보충 설명. 원일점에서 받는 햇빛은 근일점의 약 93.55%지만 계절은 지축의 기울기로 생긴다. Bowditch도 1년 동안 태양과의 거리가 약 1.7%만 변하며 계절 변화는 지축의 기울기 때문이라고 쓴다. 참고: [Perihelion and aphelion — Wikipedia](https://en.wikipedia.org/wiki/Perihelion_and_aphelion), [Bowditch, The American Practical Navigator (2019), Chapter 13 Navigational Astronomy](https://thenauticalalmanac.com/2019_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2013-%20Navigational%20Astronomy.pdf)(1307·1319절).","교재 61쪽(태양의 겉보기반지름)."],"flags":[{"kind":"교재 정정","text":"교재의 ‘긴 반지름 152,000,000 km, 짧은 반지름 147,000,000 km’를 원일점·근일점 거리로 바로잡았다.","fn":3},{"kind":"해석","text":"교재 4쪽 ‘지축은 이 평면(궤도면)에 약 23°27′의 경사’를 본문에서 ‘궤도면에 수직인 선과 23°27′’로 풀어 썼다. 지축과 궤도면 자체가 이루는 각은 66°33′이다.","fn":2},{"kind":"교재 밖","text":"1천문단위의 현재 정의값 149,597,870.7 km와 근일점·원일점의 현재 거리를 덧붙였다.","fn":3},{"kind":"계산 확인","text":"교재 5쪽 (152,000,000 + 147,000,000) ÷ 2 = 149,500,000 km, (152 − 147) ÷ (152 + 147) = 0.0167 재계산 일치."}]},{"title":"황도","easy":["회전목마를 타고 돌면서 가운데 기둥을 보면, 기둥 뒤로 보이는 풍경이 계속 바뀐다. 지구가 태양 둘레를 돌 때도 같아서, 지구에서 본 태양 뒤의 별자리가 날마다 조금씩 바뀐다.","그래서 태양은 별들 사이를 하루에 약 1°씩 동쪽으로 옮겨 가, 1년에 한 바퀴(360°)를 도는 것처럼 보인다. 이 움직임이 태양의 **연주운동**(Annual motion)이고, 태양이 지나는 길이 **황도**(Ecliptic)다.[2]","황도는 [[천의 적도]]와 약 23°27′ 기울어 있다. 이 기울기를 **황도의 경사**(Obliquity of the ecliptic)라 한다. 지구의 자전축이 기울어 있어서 생기는 각이다.[3]"],"definition":"지구의 공전으로 태양이 천구 위를 1년에 한 번 서에서 동으로 운행하는 것처럼 보이는 운동을 태양의 연주운동(年週運動, Annual motion)이라 하고, 그 겉보기 궤도를 황도(Ecliptic)라 한다. 황도와 천의 적도가 이루는 약 23°27′의 각을 황도의 경사(Obliquity of the ecliptic)라 한다.[1]","terms":[{"ko":"황도","en":"Ecliptic","abbr":"EE′","plain":"태양이 1년 동안 별들 사이를 지나가는 겉보기 길"},{"ko":"연주운동","en":"Annual motion","plain":"태양이 1년에 한 바퀴 서에서 동으로 도는 겉보기 운동"},{"ko":"황도의 경사","en":"Obliquity of the ecliptic","plain":"황도와 천의 적도 사이의 각. 교재 값 23°27′"},{"ko":"[[춘분점·추분점|분점]]","en":"Equinoctial points","plain":"황도와 천의 적도가 만나는 두 점"},{"ko":"[[일주운동·주극성|일주운동]]","en":"Diurnal motion","plain":"하루 한 바퀴 동→서. 연주운동과 방향이 반대"}],"why":"황도가 적도와 기울어 있기 때문에 태양의 [[적위]]는 1년 동안 약 23°27′N과 23°27′S 사이를 오르내린다. 그래서 [[천측력]]은 태양의 적위를 시간마다 싣고, 천측할 때는 관측 순간의 값을 골라 써야 한다([[태양의 GHA·Dec]]). 황도와 적도가 만나는 춘분점은 별의 좌표를 재는 출발점이 된다.","body":["지구가 태양 둘레를 공전하므로, 지구에서 보면 태양이 천구 위를 서에서 동으로 1년에 한 바퀴 움직이는 것처럼 보인다. 이 운동을 태양의 **연주운동**이라 하고, 그 겉보기 궤도를 황도라 한다.[1] 360°를 약 365일에 돌므로 하루에 1°가 조금 못 된다.[2]","황도는 [[천의 적도]]와 약 23°27′ 기울어져 있으며, 이 각을 **황도의 경사**라 한다.[1] 이 각은 지구 자전축의 기울기 때문에 생기며, 아주 천천히 줄고 있다.[3] 그림 1.5에서 EE′가 황도다. [[지구의 궤도]] 그림 1.4에서 지구와 태양의 자리를 바꾸면 지구의 궤도가 곧 황도다.[1]","황도와 천의 적도는 두 점에서 만나는데 이것이 [[춘분점·추분점]]이고, 천의 적도에서 가장 먼 두 점이 [[하지점·동지점]]이다. 황도 양쪽 9°씩의 띠는 [[황도대·황도 12궁|황도대]]다. 3D 장면 2(황도와 계절점)에서 황도와 적도의 기울기를 볼 수 있다."],"confusions":"[[일주운동·주극성|일주운동]]은 하루에 한 바퀴 동→서, 연주운동은 1년에 한 바퀴 서→동이다. 주기가 다르고 방향은 반대다. 태양은 매일 동에서 떠서 서로 지지만, 별자리 배경에 대해서는 하루 약 1°씩 동쪽으로 밀려난다.","key":["황도 = 태양의 연주운동 경로 (1년, 서→동, 하루 약 1°)","황도의 경사 약 23°27′ (지축 기울기 때문)","황도 × 천의 적도 = 분점 2개"],"footnotes":["교재 5쪽, 그림 1.5.","교재 밖 보충 설명. 태양은 황도를 따라 하루에 1°가 조금 못 되게 동쪽으로 움직인다. 참고: [Ecliptic — Wikipedia](https://en.wikipedia.org/wiki/Ecliptic).","교재 밖 보충 설명. 황도경사는 지구 자전축의 기울기 때문에 생기며(Bowditch 1319절), 100년에 약 0.013°씩 아주 천천히 줄고 있어 현재 값은 약 23.4°, 곧 약 23°26′이다. 교재는 23°27′을 쓴다. 참고: [Ecliptic — Wikipedia](https://en.wikipedia.org/wiki/Ecliptic), [Bowditch, The American Practical Navigator (2019), Chapter 13 Navigational Astronomy](https://thenauticalalmanac.com/2019_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2013-%20Navigational%20Astronomy.pdf)."],"flags":[{"kind":"교재 밖","text":"황도경사의 현재 값(약 23°26′)을 각주로 덧붙였다. 본문은 교재 값 23°27′.","fn":3}]},{"title":"춘분점·추분점","easy":["태양이 1년 동안 다니는 길([[황도]])은 하늘의 적도와 비스듬히 엇갈려 있다. 비스듬히 엇갈린 두 고리는 반드시 두 곳에서 만난다. 이 두 건널목을 **분점**(Equinoctial points)이라 한다.","3월 21일경 태양은 적도를 남쪽에서 북쪽으로 건너는데, 이 건널목이 **춘분점**(First point of Aries, ♈)이다. 9월 23일경 북에서 남으로 건너는 곳은 **추분점**(First point of Libra, ♎)이다.","춘분점은 하늘 지도의 ‘0번지’다. 지구의 경도를 그리니치에서 세듯, 별의 [[적경]]과 [[항성시각]](SHA)은 춘분점에서 센다.[2]"],"definition":"황도와 천의 적도는 서로 경사를 이루므로 천구 위의 두 점에서 만나며, 이 교점을 분점(Equinoctial points)이라 한다. 태양이 황도 위를 운행하며 적도를 남에서 북으로 가로지르는 점을 춘분점(First point of Aries, ♈), 북에서 남으로 가로지르는 점을 추분점(First point of Libra, ♎)이라 한다.[1]","terms":[{"ko":"분점","en":"Equinoctial points","plain":"황도와 천의 적도가 만나는 두 점"},{"ko":"춘분점","en":"First point of Aries","abbr":"♈","plain":"태양이 적도를 남→북으로 건너는 점. 하늘 좌표의 0점"},{"ko":"추분점","en":"First point of Libra","abbr":"♎","plain":"태양이 적도를 북→남으로 건너는 점"},{"ko":"춘분·추분","en":"Vernal equinox, Autumnal equinox","plain":"태양이 춘분점(3월 21일경)·추분점(9월 23일경)을 지나는 때"},{"ko":"세차","en":"Precession","plain":"춘분점이 황도를 따라 아주 천천히 서쪽으로 옮겨 가는 현상"}],"why":"[[천측력]]은 별 57개마다 시간별 GHA를 따로 싣지 않는다. 대신 춘분점의 GHA([[춘분점의 GHA|GHA♈]])를 시간마다 싣고, 별마다 춘분점에서 잰 SHA만 싣는다. 항해사는 두 값을 더해 별의 GHA를 구한다([[항성의 GHA·Dec]]). 춘분점이 별 관측 계산의 출발점인 셈이다.[4]","body":["황도와 천의 적도는 서로 기울어 있으므로 천구 위의 두 점에서 만난다. 이 교점을 **분점**(Equinoctial points)이라 한다. 그림 1.5에서 황도와 천의 적도가 교차하는 두 점 가운데 아래쪽이 춘분점, 위쪽이 추분점이다.[1]","태양이 춘분점을 지나는 때가 **춘분**(Vernal equinox)으로 매년 3월 21일경이고, 추분점을 지나는 때가 **추분**(Autumnal equinox)으로 매년 9월 23일경이다. 이때는 낮과 밤의 길이가 같다.[1] equinox라는 영어 낱말도 ‘같은 밤’이라는 뜻이다.[2]",{"table":{"head":["점","기호","태양이 지나는 때","태양이 적도를 건너는 방향"],"rows":[["춘분점","♈","3월 21일경 (춘분)","남 → 북"],["추분점","♎","9월 23일경 (추분)","북 → 남"]]},"caption":"교재 5쪽 분점 정리"},"춘분점은 천구 좌표를 재는 출발점이다. [[적경]]은 춘분점에서 동쪽으로, [[항성시각]]은 서쪽으로 잰다. 춘분점을 지나는 시권을 춘분시권이라 하며([[천의 자오선·시권]]), 천측력은 춘분점의 본초시각(GHA♈)을 따로 싣는다.[2][4] 3D 장면 2(황도와 계절점)에서 분점의 위치를 볼 수 있다."],"confusions":"이름은 ‘양자리의 첫 점’(First point of Aries)이지만, 세차운동 때문에 춘분점은 지금 물고기자리에 있다. 기호 ♈와 이름은 옛 위치를 따른 것이다.[3]","key":["춘분점 ♈: 태양이 적도를 남→북으로 건너는 점 (3월 21일경)","추분점 ♎: 북→남 (9월 23일경), 두 날 모두 낮과 밤의 길이가 같다","춘분점 = 적경(동쪽)·SHA(서쪽)의 기준점, 천측력은 GHA♈를 싣는다"],"footnotes":["교재 5쪽, 그림 1.5.","교재 밖 보충 설명. Bowditch 1319절은 춘분점(vernal equinox)을 first point of Aries라고도 부르며 항해사에게는 SHA를 재는 기준이라 중요하다고 쓴다. equinox는 ‘같은 밤’이라는 뜻이다. 춘분점은 적경을 재는 ‘하늘의 본초자오선’이다. 참고: [Bowditch, The American Practical Navigator (2019), Chapter 13 Navigational Astronomy](https://thenauticalalmanac.com/2019_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2013-%20Navigational%20Astronomy.pdf), [First point of Aries — Wikipedia](https://en.wikipedia.org/wiki/First_point_of_Aries).","교재 밖 보충 설명. 세차운동으로 춘분점은 황도를 따라 72년에 약 1°씩 서쪽으로 옮겨 가며, 이 빠르기면 한 바퀴에 약 26,000년이 걸린다. 그래서 춘분 때 태양은 지금 물고기자리에 있다. 그림 1.5에도 Precession(세차) 표시가 있다. 참고: [First point of Aries — Wikipedia](https://en.wikipedia.org/wiki/First_point_of_Aries).","교재 29쪽(STARS 란), 34–35쪽, 식 (1.5)."],"flags":[{"kind":"교재 밖","text":"세차운동으로 춘분점이 현재 물고기자리에 있다는 설명과 주기(약 26,000년)를 덧붙였다.","fn":3}]},{"title":"하지점·동지점","easy":["해가 뜨는 자리를 1년 동안 매일 기록하면, 봄부터 점점 북쪽으로 옮겨 가다가 6월 하순에 멈추고 되돌아온다. 12월 하순에는 가장 남쪽에서 멈췄다가 다시 북쪽으로 간다. 태양이 남북 방향으로 ‘멈춰 서는’ 두 곳이 **지점**(Solstitial points)이다.[2]","북쪽 끝이 **하지점**(♋), 남쪽 끝이 **동지점**(♑)이다. 태양이 하지점을 지나는 6월 22일경이 하지, 동지점을 지나는 12월 22일경이 동지다.","이때 태양은 [[천의 적도]]에서 가장 멀다. 그래서 태양의 [[적위]]는 하지에 약 23°27′N, 동지에 약 23°27′S로 1년 중 가장 크다.[3]"],"definition":"황도 위에서 천의 적도로부터 가장 멀리 떨어져 있는 두 점을 지점(Solstitial points)이라 하며, 적도의 북쪽에 있는 점을 하지점(Summer solstitial point, ♋), 남쪽에 있는 점을 동지점(Winter solstitial point, ♑)이라 한다. 태양이 하지점을 지날 때가 하지(Summer solstice), 동지점을 지날 때가 동지(Winter solstice)다.[1]","terms":[{"ko":"지점","en":"Solstitial points","plain":"황도에서 천의 적도와 가장 먼 두 점"},{"ko":"하지점","en":"Summer solstitial point","abbr":"♋","plain":"황도의 가장 북쪽 점. 태양 적위가 최대 N"},{"ko":"동지점","en":"Winter solstitial point","abbr":"♑","plain":"황도의 가장 남쪽 점. 태양 적위가 최대 S"},{"ko":"하지·동지","en":"Summer solstice, Winter solstice","plain":"태양이 하지점(6월 22일경)·동지점(12월 22일경)을 지나는 때"}],"why":"태양 관측으로 위치를 구할 때는 그 순간 태양의 [[적위]]가 계산에 그대로 들어간다. 적위는 1년 동안 지점의 값(±23°27′) 안에서만 오르내리므로, [[천측력]]에서 찾은 값이 맞는지 어림할 수 있다. 하지 무렵 태양 바로 아래 지점([[천체의 지위]])은 북회귀선, 동지 무렵은 남회귀선 위에 있다.[4]","body":["황도 위에서 [[천의 적도]]로부터 가장 멀리 떨어진 두 점이 지점이다. 적도 북쪽의 점이 하지점(♋), 남쪽의 점이 동지점(♑)이다.[1]","태양이 하지점을 지나는 때가 **하지**로 매년 6월 22일경이고, 동지점을 지나는 때가 **동지**로 매년 12월 22일경이다. 이때 낮과 밤의 길이 차이가 가장 크다.[1] solstice는 ‘태양이 멈춰 선다’는 라틴어에서 온 말로, 태양의 남북 움직임이 잠깐 멈췄다가 방향을 바꾸기 때문이다.[2]",{"table":{"head":["점","기호","태양이 지나는 때","그때 태양의 적위"],"rows":[["하지점","♋","6월 22일경 (하지)","약 23°27′N"],["동지점","♑","12월 22일경 (동지)","약 23°27′S"]]},"caption":"교재 5–6쪽 지점 정리 (적위 값은 보충)"},"지점은 황도에서 적도와 가장 먼 점이므로, 이때 태양의 적위는 황도경사와 같은 약 23°27′N(하지), 23°27′S(동지)가 된다.[3] 하지점과 동지점은 [[춘분점·추분점]]에서 각각 황도를 따라 90° 떨어져 있다.[3] 3D 장면 2(황도와 계절점)에서 네 계절점을 볼 수 있다."],"confusions":"‘하지’와 ‘동지’라는 이름은 북반구 기준이다. 남반구에서는 6월 하지 무렵이 겨울이다.[3]","key":["하지점 ♋(6월 22일경), 동지점 ♑(12월 22일경)","지점에서 태양 적위 = 황도경사(약 23°27′ N/S), 1년 중 최대","분점에서 황도를 따라 90° 떨어짐"],"footnotes":["교재 5–6쪽, 그림 1.5.","교재 밖 보충 설명. solstice는 라틴어 sol(태양)과 sistere(멈춰 서다)에서 왔다. 실제 날짜는 해마다 조금씩 달라 6월 20–22일, 12월 20–23일 사이다. 참고: [Solstice — Wikipedia](https://en.wikipedia.org/wiki/Solstice), [Bowditch, The American Practical Navigator (2019), Chapter 13 Navigational Astronomy](https://thenauticalalmanac.com/2019_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2013-%20Navigational%20Astronomy.pdf)(1319절).","교재 밖 보충 설명.","교재 밖 보충 설명. 6월 지점 때 태양 바로 아래 지점은 북위 약 23.44°(북회귀선), 12월 지점 때는 남위 약 23.44°(남회귀선)에 있다. 교재 값 23°27′보다 1′ 작은 현재 값이다. 참고: [Solstice — Wikipedia](https://en.wikipedia.org/wiki/Solstice)."],"flags":[{"kind":"판독 불확실","text":"그림 1.5에 지점의 적위가 숫자로 적혀 있으나 스캔이 흐려 읽을 수 없어 본문에서 인용하지 않았다. 원본 교재로 확인해 보자."}]},{"title":"겉보기위치·진위치","easy":["손가락 하나를 눈앞에 세우고 왼눈과 오른눈으로 번갈아 보면, 손가락이 뒤 배경에 대해 옆으로 뛴다. 보는 자리가 다르면 같은 물체도 다른 방향에 보이는 것이다. 가까운 물체일수록 많이 뛰고, 먼 산은 거의 그대로다.","천체도 마찬가지다. 배 위의 관측자가 본 방향이 천구와 만나는 점이 **겉보기위치**(Apparent place)이고, 지구 중심에서 본 방향이 만나는 점이 **진위치**(True place)다. 두 ‘눈’ 사이의 거리는 지구의 반지름, 약 6,400 km다.","별은 너무 멀어서 두 위치가 같다고 봐도 된다. 하지만 가장 가까운 달은 두 위치가 1° 넘게 벌어질 때도 있다. 이 차이를 [[시차·수평시차|시차]](Parallax)라 한다.[3]"],"definition":"관측자로부터 천체의 중심을 지나는 직선이 천구와 만나는 점을 천체의 겉보기위치(Apparent place)라 하고, 지구의 중심에서 천체의 중심에 이르는 직선이 천구와 만나는 점을 천체의 진위치(True place)라 한다. 항성처럼 거리가 무한대인 천체에서는 지구의 반지름이 문제되지 않으므로 겉보기위치와 진위치가 같다고 보아도 무방하다.[1]","terms":[{"ko":"겉보기위치","en":"Apparent place","plain":"지구 표면의 관측자가 본 방향으로 정한 천체의 위치"},{"ko":"진위치","en":"True place","plain":"지구 중심에서 본 방향으로 정한 천체의 위치"},{"ko":"[[시차·수평시차|시차]]","en":"Parallax","plain":"겉보기위치와 진위치의 차이 각. 가까운 천체일수록 크다"},{"ko":"[[천구|지심천구]]","en":"Geocentric celestial sphere","plain":"중심을 지구 중심에 둔 천구. 진위치는 이 천구 위의 점"}],"why":"[[천측력]]이 싣는 천체의 좌표는 지구 중심에서 본 값, 곧 진위치에 해당한다. 그런데 육분의로 잰 고도는 배 위에서 본 겉보기위치의 고도다. 그래서 [[태양의 고도개정|고도개정]] 때 시차 개정을 넣어 지구 중심 기준으로 바꾼 뒤에야 [[계산고도·계산방위각|계산고도]]와 비교할 수 있다.[4]","body":["[[천구]]의 중심은 지구 중심으로 정했지만 실제 관측자는 지구 표면에 있다. 그래서 같은 천체라도 관측자가 본 방향과 지구 중심에서 본 방향이 조금 다르다.[1][2]","항성처럼 거리가 사실상 무한대인 천체에서는 지구 반지름이 문제되지 않으므로 겉보기위치와 진위치가 같다고 봐도 된다.[1] 반면 달·태양·행성처럼 가까운 천체는 차이가 생기며, 이 각을 [[시차·수평시차|시차]]라 한다. 달은 가장 가까운 천체라서 이 차이가 가장 크고, 때로 1°를 넘는다.[3]",{"table":{"head":["천체","거리","겉보기위치와 진위치"],"rows":[["항성","사실상 무한대","같다고 본다"],["태양·행성","가깝다","조금 다르다 → 시차 개정"],["달","가장 가깝다","가장 많이 다르다(1° 넘을 때도)"]]},"caption":"천체 거리에 따른 두 위치의 차이"},"관측한 고도를 지구 중심 기준으로 고치는 시차 개정은 [[태양의 고도개정|고도개정]]의 한 단계다. 3D 장면 8(고도 개정)에서 관측자 위치와 지구 중심에서 본 방향의 차이를 볼 수 있다."],"confusions":"겉보기위치와 진위치의 차이는 ‘어디서 봤느냐’의 차이다. 대기가 빛을 굴절시켜 생기는 차이는 별개로, [[천문기차·평균기차|천문기차]]에서 다룬다. 또 영어 천문학 자료의 apparent place는 이 교재와 뜻이 다를 수 있다.[4]","key":["겉보기위치 = 관측자 기준, 진위치 = 지구 중심 기준","항성은 둘이 같다고 본다","차이(시차)는 가까운 천체일수록 크고(달 최대), 고도개정으로 보정"],"footnotes":["교재 6쪽, 그림 1.6.","교재 2쪽 제1장 도입은 ‘우리들이 바라보는 천체의 위치는 지구를 중심으로 한 위치 즉 겉보기위치’라고 적어, 6쪽 정의(관측자 기준 = 겉보기위치, 지구 중심 기준 = 진위치)와 어긋난다. 위키는 6쪽 정의를 따랐다.","교재 밖 보충 설명. 관측 위치에 따라 달라지는 이 차이를 diurnal parallax라 하며, 달은 가장 가까운 천체라서 최대 시차가 1°를 넘을 때도 있다. 참고: [Diurnal parallax — Wikipedia](https://en.wikipedia.org/wiki/Diurnal_parallax).","교재 밖 보충 설명. 천측력의 적위는 지구 중심에서 잰 값이다([Declination — Wikipedia](https://en.wikipedia.org/wiki/Declination)). 한편 영어 천문학 용어에서 apparent place는 ‘움직이는 지구의 중심에 있는 가상의 관측자’가 본 위치이고, 지구 표면의 실제 관측자가 본 위치는 topocentric position이라 한다([Apparent place — Wikipedia](https://en.wikipedia.org/wiki/Apparent_place)). 교재의 ‘겉보기위치’는 뒤의 것에 가깝다."],"flags":[{"kind":"해석","text":"교재 2쪽 장 도입의 ‘지구를 중심으로 한 위치 즉 겉보기위치’는 6쪽 정의와 어긋난다. 위키는 6쪽 정의(겉보기위치 = 관측자 기준)를 따랐다.","fn":2},{"kind":"해석","text":"영어 천문학 자료의 apparent place는 지구 중심 기준 위치를 뜻해 교재 정의(관측자 기준)와 다르다. 본문은 교재 정의를 따르고 차이를 각주에 적었다.","fn":4}]},{"title":"황도대·황도 12궁","easy":["태양·달·행성은 하늘 아무 데나 다니지 않는다. 모두 [[황도]] 가까이의 좁은 띠 안을 지나간다. 이 띠가 **황도대**(Zodiac)다.","교재는 황도 양쪽으로 9°씩, 폭 18°의 띠를 황도대로 정한다. 이 띠를 [[춘분점·추분점|춘분점]]에서 동쪽으로 30°씩 12칸으로 나눈 것이 **황도 12궁**(Zodiacal twelve signs)이다. 30° × 12칸 = 360°로 꼭 한 바퀴다.","각 칸에는 그 근처 별자리의 이름과 기호를 붙였다. 첫 칸이 양자리(♈)이므로, 그 칸이 시작하는 춘분점의 기호도 ♈이다."],"definition":"황도를 중심으로 양쪽으로 각각 9°씩, 곧 18°의 폭을 가진 띠 모양의 부분을 황도대(Zodiac)라 한다. 춘분점을 기점으로 동쪽으로 황도대를 30°씩 12구간으로 나누어, 황도를 따라 있는 12개 별자리와 같은 이름과 기호를 붙인 것을 황도 12궁(Zodiacal twelve signs)이라 한다.[1]","terms":[{"ko":"황도대","en":"Zodiac","plain":"황도 양쪽 9°씩, 폭 18°의 띠. 태양·달·행성의 길"},{"ko":"황도 12궁","en":"Zodiacal twelve signs","plain":"황도대를 춘분점부터 동쪽으로 30°씩 나눈 12구간"},{"ko":"궁","en":"Sign","plain":"12궁의 한 구간(30°). 별자리 자체와는 다르다"}],"why":"천측에 쓰는 달과 항해용 행성 4개(금성·화성·목성·토성)는 늘 황도대 안에 있다. 그래서 밤하늘에서 행성을 찾을 때는 태양이 지나는 길 근처를 보면 된다. 또 분점·지점의 기호가 12궁 기호에서 왔기 때문에, [[천측력]]의 ♈ 같은 표시를 읽으려면 이 기호를 알아야 한다.[5]","body":["태양과 달, 행성들은 대체로 황도대 안을 지나간다. 옛사람들은 여기에 착안해 황도대를 정했다.[1][2] 띠의 폭은 자료마다 조금씩 다르게 잡는다.[4] 춘분점에서 동쪽으로 30°씩 나눈 각 구간에는 황도를 따라 놓인 12개 별자리와 같은 이름과 기호를 붙였다.[1]",{"table":{"head":["학명","국문명","기호"],"rows":[["Aries","양","♈"],["Taurus","황소","♉"],["Gemini","쌍둥이","♊"],["Cancer","게","♋"],["Leo","사자","♌"],["Virgo","처녀","♍"],["Libra","저울","♎"],["Scorpius","전갈","♏"],["Sagittarius","사수","♐"],["Capricornus","염소","♑"],["Aquarius","물병","♒"],["Pisces","물고기","♓"]]},"caption":"표 1.1 황도 12궁"},"궁의 순서는 춘분점에서 동쪽으로, 곧 태양이 1년 동안 지나가는 순서다. 3D 장면 2(황도와 계절점)에서 황도대의 띠를 볼 수 있다."],"confusions":"춘분점(♈), 하지점(♋), 추분점(♎), 동지점(♑)의 기호는 모두 12궁 기호에서 왔다. 각각 12궁의 첫째, 넷째, 일곱째, 열째 구간이 시작하는 점이다. 다만 세차운동 때문에 지금은 궁(구간)과 실제 별자리가 약 한 칸씩 어긋나 있다.[3]","key":["황도대: 황도 양쪽 9°씩, 폭 18° (교재 값)","12궁: 춘분점에서 동쪽으로 30°씩 12구간","분점·지점 기호 = 12궁 기호(♈ ♋ ♎ ♑)"],"footnotes":["교재 7쪽, 그림 1.7, 표 1.1. 표의 ‘Gemni’는 Gemini의 오자다.","교재는 ‘명왕성은 제외’라고 적었다. 명왕성은 2006년 국제천문연맹 결정으로 왜행성으로 분류가 바뀌었다.","교재 밖 보충 설명. 세차운동 때문에 12궁(구간)과 실제 별자리의 위치는 지금 약 한 구간씩 어긋나 있다. 춘분 때 태양은 지금 물고기자리에 있다. 참고: [First point of Aries — Wikipedia](https://en.wikipedia.org/wiki/First_point_of_Aries).","교재 밖 보충 설명. 교재는 황도 양쪽 9°씩(폭 18°)으로 정하지만, Bowditch 1321절은 황도 양쪽 8°씩으로, 영문 위키백과는 폭 약 20°로 적는다. 본문은 교재 값을 따른다. 참고: [Bowditch, The American Practical Navigator (2019), Chapter 13 Navigational Astronomy](https://thenauticalalmanac.com/2019_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2013-%20Navigational%20Astronomy.pdf), [Ecliptic — Wikipedia](https://en.wikipedia.org/wiki/Ecliptic).","교재 29쪽(항해용 행성 4개)."],"flags":[{"kind":"교재 정정","text":"표 1.1의 ‘Gemni’를 Gemini로 바로잡았다.","fn":1},{"kind":"교재 밖","text":"명왕성이 2006년에 왜행성으로 분류가 바뀐 사실을 덧붙였다.","fn":2},{"kind":"교재 밖","text":"황도대의 폭은 자료마다 달라(Bowditch 양쪽 8°, 위키백과 폭 약 20°) 각주에 적었다. 본문은 교재 값(양쪽 9°, 폭 18°).","fn":4}]},{"title":"천의 자오선·시권","easy":["지구본에는 북극과 남극을 잇는 세로줄, 곧 경선이 그려져 있다. 이 세로줄을 하늘에 그대로 옮기면 천의 북극과 남극을 잇는 큰 원이 된다. 이것이 **천의 자오선**(Celestial meridian)이다.","이런 원은 무수히 많이 그릴 수 있다. 그중 어떤 별을 지나는 하나를 골라 ‘그 별의 **시권**(Hour circle)’이라 부른다. [[춘분점·추분점|춘분점]]을 지나는 것은 **춘분시권**이다.","하늘은 1시간에 15°씩 돌기 때문에, 시권 사이의 각 15°는 곧 1시간의 차이가 된다. 그래서 이름에 ‘시(時)’ 자가 붙었다.[2]"],"definition":"천의 양극을 지나는 대권을 천의 자오선(Celestial meridian)이라 하며, 어느 점이나 천체에 관련시켜 부를 때에는 시권(Hour circle)이라 한다. 특히 춘분점을 지나는 시권은 춘분시권(Hour circle of equinox)이라 한다. 천의 자오선을 천의 극에서 양분하여 관측자를 지나는 반원을 극상반원(Upper branch), 그 반대편 반원을 극하반원(Lower branch)이라 한다.[1]","terms":[{"ko":"천의 자오선","en":"Celestial meridian","plain":"천의 북극과 남극을 지나는 모든 대권. 하늘의 경선"},{"ko":"시권","en":"Hour circle","plain":"특정 천체(또는 점)를 지나는 천의 자오선"},{"ko":"춘분시권","en":"Hour circle of equinox","plain":"춘분점을 지나는 시권. 적경·SHA의 출발선"},{"ko":"극상반원","en":"Upper branch","plain":"천의 자오선 가운데 관측자(천정) 쪽 반원"},{"ko":"극하반원","en":"Lower branch","plain":"천의 자오선 가운데 관측자 반대편 반원"}],"why":"[[천측력]]에서 찾는 [[본초시각]](GHA)은 그리니치 자오선과 천체의 시권 사이의 각이다. 여기에 경도를 더하거나 빼면 내 자오선과 시권 사이의 각, 곧 [[지방시각·자오선각|지방시각]](LHA)이 된다. 이렇게 시권은 천체의 ‘동서 위치’를 재는 기준선이고, [[적위]]도 시권을 따라 잰다.","body":["천의 자오선은 [[천의 극·천의 축|천의 북극과 남극]]을 모두 지나는 대권이라 무수히 많다. 그중 특정 천체를 지나는 것을 그 천체의 **시권**, 춘분점을 지나는 것을 **춘분시권**이라 부른다.[1] Bowditch도 시권을 ‘천의 극을 지나는 천구의 대권’으로 정의한다.[3]","천의 자오선을 천의 극에서 둘로 나누었을 때, 관측자 쪽을 지나는 반원을 **극상반원**(Upper branch), 반대편 반원을 **극하반원**(Lower branch)이라 한다.[1] 천체가 극상반원을 지나는 순간이 극상정중, 극하반원을 지나는 순간이 극하정중이다([[관측자의 천의 자오선·자오선정중]]).",{"table":{"head":["이름","어떤 천의 자오선인가","쓰임"],"rows":[["천의 자오선","천의 양극을 지나는 모든 대권","일반 이름"],["시권","어떤 천체를 지나는 것","적위를 재는 선, 시각의 도착선"],["춘분시권","춘분점을 지나는 것","적경·SHA의 출발선"],["관측자의 천의 자오선","천정을 지나는 것","LHA의 출발선"]]},"caption":"천의 자오선의 여러 이름"},"시권은 [[적도좌표계]]에서 경선 역할을 한다. 시권을 따라 [[적위]]를 재고, 두 시권 사이의 각으로 [[적경]], [[항성시각]], 지방시각, 본초시각을 잰다. 3D 장면 3(적도좌표)에서 시권과 천의 적도를 볼 수 있다."],"confusions":"‘천의 자오선’은 극을 지나는 모든 대권의 일반 이름이고, ‘관측자의 천의 자오선’은 그중 관측자의 천정을 지나는 하나다. 이름에 ‘시(時)’가 붙은 것은 시권 사이의 각이 곧 시간을 나타내기 때문이다.[2]","key":["천의 자오선 = 천의 양극을 지나는 대권","천체 기준으로 부르면 시권, 춘분점을 지나면 춘분시권","극상반원(관측자 쪽) / 극하반원(반대쪽)"],"footnotes":["교재 7–8쪽, 그림 1.8.","교재 밖 보충 설명. 천구가 하루에 약 360° 돌기 때문에 시각(時角)은 시간 단위로도 나타내며, 24h = 360°, 곧 1h = 15°로 정한다. 참고: [Hour angle — Wikipedia](https://en.wikipedia.org/wiki/Hour_angle).","교재 밖 보충 설명. Bowditch 1325절: 시권(hour circle)은 천의 극을 지나는 천구 위의 대권이다. 참고: [Bowditch, The American Practical Navigator (2019), Chapter 13 Navigational Astronomy](https://thenauticalalmanac.com/2019_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2013-%20Navigational%20Astronomy.pdf)."],"flags":[]},{"title":"적위","easy":["지구 위의 위치를 위도로 말하듯, 하늘의 위치도 ‘[[천의 적도]]에서 북쪽이나 남쪽으로 몇 도’로 말할 수 있다. 이 각이 **적위**(Declination, Dec 또는 d)다. 한마디로 하늘의 위도다.[2]","천의 적도 위의 별은 적위 0°, 천의 북극은 90°N이다. 태양은 1년 동안 약 23°27′N과 23°27′S 사이를 오르내린다. 예를 들어 2019년 1월 2일 GMT 05-35-13에 태양의 적위는 S22°56′.2였다.[4]","어떤 별을 머리 바로 위에 보는 사람의 위도는 그 별의 적위와 같다. 그래서 적위는 별 바로 아래 지구 위의 점, 곧 [[천체의 지위]]의 위도가 된다.[3]"],"definition":"천체를 지나는 천의 자오선 위에서 천의 적도로부터 천체까지의 호를 그 천체의 적위(Declination: Dec. 또는 d)라 하며, 지구상의 위도에 대응한다. 적도 위의 0°에서 남북으로 각각 90°까지 재고, 천체가 적도 북쪽에 있으면 N, 남쪽에 있으면 S를 붙인다.[1]","terms":[{"ko":"적위","en":"Declination","abbr":"Dec, d","plain":"천의 적도에서 남북으로 잰 각. 하늘의 위도, 0°~90° N/S"},{"ko":"[[천의 자오선·시권|시권]]","en":"Hour circle","plain":"적위를 재는 선. 천의 극과 천체를 지나는 대권"},{"ko":"동명·이명","en":"Same name, Contrary name","plain":"적위와 위도의 N·S가 같으면 동명, 다르면 이명"},{"ko":"[[천체의 지위|지위]]","en":"Geographical position","abbr":"GP","plain":"천체 바로 아래 지구 위의 점. 그 위도 = 적위"}],"why":"천측할 때 [[천측력]]에서 찾는 두 값이 GHA와 적위다. 적위는 [[천체의 지위]]의 위도가 되고, 고도를 계산하는 식 (8.4) sin Hc = sin L·sin d + cos L·cos d·cos t에 그대로 들어간다([[구면삼각형의 계산]]). 그래서 적위의 N·S를 잘못 붙이면 위치선 전체가 틀어진다.[6]","body":["적위는 천의 적도를 0°로 하여 남북으로 각각 90°까지 잰다. 천체가 적도 북쪽에 있으면 N, 남쪽에 있으면 S를 붙인다.[1] 예컨대 교재 예제에서 2019년 1월 2일 GMT 05-35-13의 태양 적위는 S22°56′.2다.[4]","Bowditch는 적위를 ‘천의 적도에서 시권을 따라 잰 각거리’라고 정의한다.[2] 적위가 같은 점들을 이은 원이 [[적위의 거등권]]이고, 동명극에서 천체까지 잰 값이 [[극거]]다.",{"table":{"head":["하늘","적위","지구에서 대응하는 것"],"rows":[["천의 적도","0°","적도(위도 0°)"],["천의 북극","90°N","북극(위도 90°N)"],["천의 남극","90°S","남극(위도 90°S)"],["교재 예제의 태양","S22°56′.2","그 순간 태양 지위의 위도 22°56′.2S"]]},"caption":"적위와 지구 위도의 대응"},"항성의 적위는 몇 달 동안 1′ 정도밖에 변하지 않는다. 반면 태양·달·행성은 적위가 계속 변하므로 천측력에서 관측 시각의 값을 구해야 한다([[태양의 GHA·Dec]]).[5]","적위는 위치선 계산의 핵심 재료다. 천체 바로 아래에 있는 지구 위의 지점(천체의 지위)의 위도는 그 천체의 적위와 같고, 적위가 N이면 지위의 위도도 N이다.[3] 3D 장면 3(적도좌표)에서 적위를 바꾸며 천체를 움직여 볼 수 있다."],"confusions":"적위의 부호는 N·S로 붙이고, [[황위]]는 +·−로 붙인다. 천문학 자료에서는 적위도 북쪽 +, 남쪽 −로 쓰는 일이 많다.[2] 또 계산에서는 적위가 관측자 위도와 ‘동명’(같은 N·S)인지 ‘이명’인지가 자주 갈림길이 된다.","key":["적위(Dec, d) = 하늘의 위도, 0°~90° N/S","항성 적위는 거의 불변, 태양·달·행성은 천측력에서 관측 시각 값을 구함","지위의 위도 = 적위 (이름 N·S도 같다)"],"footnotes":["교재 8쪽, 그림 1.9.","교재 밖 보충 설명. 적위는 천의 적도에서 잰 각거리로, 지구의 위도를 천구에 옮긴 것과 같다. 천문학에서는 북쪽을 +, 남쪽을 −로 쓴다. Bowditch 1325절은 시권을 따라 잰다고 쓴다. 참고: [Declination — Wikipedia](https://en.wikipedia.org/wiki/Declination), [Bowditch, The American Practical Navigator (2019), Chapter 13 Navigational Astronomy](https://thenauticalalmanac.com/2019_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2013-%20Navigational%20Astronomy.pdf).","교재 151–152쪽, 식 (8.1).","교재 32쪽 예제.","교재 32–34쪽.","교재 157쪽, 식 (8.4). 교재는 위도를 L, 고도를 h로 적는다."],"flags":[]},{"title":"적위의 거등권","easy":["지구본의 가로줄, 곧 위도선을 하늘로 옮기면 하늘의 위도선이 된다. [[적위]]가 같은 점을 모두 이은 원이며, 이것이 **적위의 거등권**(Parallel of declination)이다.","거등권(距等圈)은 ‘거리가 같은 원’이라는 뜻이다. 이 원 위의 모든 점은 [[천의 적도]]에서 같은 각만큼 떨어져 있다. 예를 들어 적위 30°N의 거등권은 적도에서 북쪽으로 30° 떨어진 점들이 이루는 원이다.","별의 적위는 하루 동안 거의 변하지 않는다. 그래서 별이 하루 동안 그리는 원([[일주운동·주극성|일주권]])이 곧 그 별의 적위의 거등권이다. 천의 극에 가까운 별일수록 원이 작다.[2]"],"definition":"천의 적도에 평행한 소권(Small circle)을 적위의 거등권 또는 등적위권(Parallel of declination)이라 하며, 지구상에서 위도의 거등권(Parallel of latitude)에 대응한다.[1]","terms":[{"ko":"적위의 거등권","en":"Parallel of declination","plain":"천의 적도와 나란한 소권. 같은 적위의 점들. 하늘의 위도선"},{"ko":"등적위권","en":"Parallel of declination","plain":"적위의 거등권의 다른 이름"},{"ko":"소권","en":"Small circle","plain":"구의 중심을 지나지 않는 평면이 만드는 원"},{"ko":"위도의 거등권","en":"Parallel of latitude","plain":"지구의 위도선. 적위의 거등권에 대응"},{"ko":"[[일주운동·주극성|일주권]]","en":"Diurnal circle","plain":"별이 하루에 그리는 원 = 그 별의 적위의 거등권"}],"why":"별의 [[천체의 지위|지위]]는 위도가 적위와 같으므로, 하루 동안 그 적위와 같은 위도선을 따라 서쪽으로 지구를 한 바퀴 돈다. 적위의 거등권은 이 움직임을 천구에서 본 모습이다. 그래서 같은 별을 몇 시간 간격으로 관측하면 지위는 남북으로는 그대로이고 동서로만 옮겨 간다.[3]","body":["거등권(距等圈)은 ‘같은 거리에 있는 원’이라는 뜻이다. 적위의 거등권 위의 모든 점은 천의 적도에서 같은 각거리, 곧 같은 [[적위]]만큼 떨어져 있다.[1] 등적위권이라고도 한다.[1]","천의 적도와 달리 구의 중심을 지나지 않는 소권이며, 적위가 클수록(극에 가까울수록) 작아진다. 적위 90°에서는 한 점, 곧 [[천의 극·천의 축|천의 극]]이 된다.[2]",{"table":{"head":["적위","거등권의 모습"],"rows":[["0°","천의 적도 자체(대권, 가장 큰 원)"],["30°N","적도에서 북쪽으로 30° 떨어진 소권"],["60°N","더 작은 소권(극에 가깝다)"],["90°N","한 점(천의 북극)"]]},"caption":"적위에 따른 거등권의 크기 (보충 예시)"},"천체의 적위는 하루 동안 거의 변하지 않으므로, 천체가 하루 동안 그리는 원(일주권)은 그 천체의 적위의 거등권과 같다.[2] 3D 장면 3(적도좌표)에서 거등권을 볼 수 있다."],"confusions":"수평좌표계에도 같은 모양의 원이 있다. 수평권과 평행한 소권은 [[고도·고도의 거등권|고도의 거등권]]이다. 기준이 되는 대권(천의 적도냐 수평권이냐)만 다르다. 또 적위 0°의 거등권은 소권이 아니라 천의 적도라는 대권 그 자체다.","key":["천의 적도에 평행한 소권 = 하늘의 위도선 (등적위권)","같은 적위의 점들, 극에 가까울수록 작아진다","별의 일주권과 같다"],"footnotes":["교재 8쪽, 그림 1.9.","교재 밖 보충 설명. 별이 일주운동으로 그리는 원을 diurnal circle이라 하며, 천의 극에 가까운 별일수록 천천히 움직이는 것처럼 보인다. 참고: [Diurnal motion — Wikipedia](https://en.wikipedia.org/wiki/Diurnal_motion), [Bowditch, The American Practical Navigator (2019), Chapter 13 Navigational Astronomy](https://thenauticalalmanac.com/2019_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2013-%20Navigational%20Astronomy.pdf)(1316절).","교재 151–152쪽, 식 (8.1). 교재 밖 보충 설명. 지위의 위도 = 적위, 지위의 경도는 GHA에서 정해지므로 GHA가 커질수록 서쪽으로 옮겨 간다."],"flags":[]},{"title":"극거","easy":["[[적위]]가 하늘의 적도에서 잰 각이라면, **극거**(Polar distance, p)는 하늘의 극에서 잰 각이다. 같은 시권 위에서 출발점만 적도에서 극으로 바꾼 셈이다.","다만 기준 극은 내 위도와 같은 이름의 극, 곧 **동명극**(Elevated pole)이다. 북반구에서는 천의 북극에서 잰다. 적도에서 극까지가 90°이므로, 적위 20°N인 별의 극거는 90° − 20° = 70°다.[2]","남쪽 하늘의 적위 20°S인 별이라면, 북극에서 적도까지 90°를 간 뒤 남쪽으로 20°를 더 가야 한다. 그래서 극거는 90° + 20° = 110°다.[2]"],"definition":"천체를 지나는 천의 자오선 위에서 관측자의 위도와 같은 이름의 극(동명극, Elevated pole)과 천체 사이에 낀 호를 그 천체의 극거 또는 극거리(Polar distance: p)라 한다. 극거 p와 적위 d 사이에는 p = 90° ± d의 관계가 있다(적위와 위도가 동명이면 −, 이명이면 +).[1]","terms":[{"ko":"극거","en":"Polar distance","abbr":"p","plain":"동명극에서 천체까지 시권을 따라 잰 각"},{"ko":"[[천의 극·천의 축|동명극]]","en":"Elevated pole","plain":"관측자 위도와 같은 이름의 극. 극거의 출발점"},{"ko":"동명·이명","en":"Same name, Contrary name","plain":"적위와 위도의 N·S가 같으면 동명, 다르면 이명"},{"ko":"여적위","en":"Codeclination","plain":"항해삼각형에서 극거를 부르는 다른 이름"}],"why":"극거는 [[항해삼각형]]의 한 변(동명극–천체)이다. 천측에서 고도를 계산하는 공식은 이 삼각형에서 나오므로, 극거를 알아야 공식의 cos p·sin p가 무엇인지 그림으로 이해할 수 있다([[구면삼각형의 계산]]). 또 극거가 내 위도보다 작으면 그 별은 [[일주운동·주극성|주극성]]이라 지지 않는다.[3]","body":["극거 p와 적위 d 사이에는 항상 다음 관계가 있다.[1]",{"formula":"p = 90° ± d","label":"식 (1.1)"},"p는 극거, d는 적위다. 90°는 천의 극에서 천의 적도까지의 각이다. 부호는 적위와 관측자 위도의 이름(N·S)으로 정한다.[1]",{"list":["적위와 위도가 동명(같은 N·S)이면 p = 90° − d — 천체가 동명극 쪽 반구에 있다.","적위와 위도가 이명이면 p = 90° + d — 천체가 적도 건너편 반구에 있다."]},{"table":{"head":["순서","계산","값"],"rows":[["① 관측자 위도","주어진 값","35°N"],["② 적위 20°N: 동명인가?","N과 N → 동명","부호 −"],["③ 극거","90° − 20°","70°"],["④ 적위 20°S: 동명인가?","N과 S → 이명","부호 +"],["⑤ 극거","90° + 20°","110°"]]},"caption":"보충 예시 — 위도 35°N 관측자의 극거"},"극거는 [[항해삼각형]]의 한 변이며, 이 삼각형에서는 여적위(Codeclination)라고도 부른다.[3] Bowditch도 극거를 ‘천의 극에서 잰 각거리’로, 적위의 여각(90°에서 뺀 값)이라고 설명한다.[4] 또 극거는 주극성을 가르는 기준이 된다. 극거가 관측자의 위도보다 작으면 그 천체는 지지 않는다."],"confusions":"극거는 ‘천의 북극’이 아니라 ‘관측자의 동명극’에서 잰다. 그래서 같은 천체라도 관측자가 북반구에 있느냐 남반구에 있느냐에 따라 값이 달라진다. 예컨대 적위 20°N인 별의 극거는 북반구 관측자에게 70°, 남반구 관측자에게 110°다.","key":["극거 p = 동명극에서 천체까지의 호","동명이면 p = 90° − d, 이명이면 p = 90° + d — 식 (1.1)","항해삼각형의 변(여적위), 극거 < 위도이면 주극성"],"footnotes":["교재 9–10쪽, 그림 1.10, 식 (1.1). 교재는 식을 p = 90° ± d로 적고, 부호는 단서로 정했다.","교재 밖 보충 예시.","교재 21쪽, 157쪽 식 (8.3).","교재 밖 보충 설명. Bowditch 1326절: 극거(polar distance)는 천의 극에서 잰 각거리다. 18–19세기 문헌에서 쓰던 북극거리(N.P.D.)는 90°에서 적위를 뺀 값이다. 참고: [Bowditch, The American Practical Navigator (2019), Chapter 13 Navigational Astronomy](https://thenauticalalmanac.com/2019_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2013-%20Navigational%20Astronomy.pdf), [Declination — Wikipedia](https://en.wikipedia.org/wiki/Declination)."],"flags":[]},{"title":"적경","easy":["지구의 경도는 그리니치를 0°로 삼는다. 그런데 하늘은 하루에 한 바퀴씩 돌기 때문에, 지구에 붙은 그리니치를 기준으로 하면 별의 좌표가 쉬지 않고 바뀐다. 그래서 하늘에 붙어 별과 함께 도는 [[춘분점·추분점|춘분점]]을 0으로 삼는다.","춘분점에서 [[천의 적도]]를 따라 동쪽으로 천체의 시권까지 잰 각이 **적경**(Right ascension, RA)이다. 하늘의 경도라고 생각하면 된다.[3]","적경은 보통 시간으로 쓴다. 한 바퀴 360°를 24h로 나누므로 1h = 15°다. 적경 6h인 별은 춘분점에서 동쪽으로 90° 떨어져 있다.[3]"],"definition":"춘분점을 지나는 시권과 천체를 지나는 시권이 극에서 이루는 각, 또는 그 사이 천의 적도의 호를 그 천체의 적경(Right ascension: RA)이라 하며, 춘분점을 기준으로 동쪽으로 0°에서 360°까지(0h에서 24h까지) 잰다.[1]","terms":[{"ko":"적경","en":"Right ascension","abbr":"RA","plain":"춘분점에서 동쪽으로 잰 각. 하늘의 경도, 0h~24h"},{"ko":"[[천의 자오선·시권|춘분시권]]","en":"Hour circle of equinox","plain":"춘분점을 지나는 시권. 적경의 출발선"},{"ko":"[[항성시각]]","en":"Sidereal hour angle","abbr":"SHA","plain":"같은 각을 서쪽으로 잰 값. SHA = 360° − RA"},{"ko":"시간 단위","en":"Hours (h)","plain":"각을 시간으로 나타낸 것. 1h = 15°"}],"why":"항해에서는 적경 대신 서쪽으로 재는 [[항성시각]](SHA)을 쓴다. [[본초시각]](GHA)과 LHA도 모두 서쪽으로 재므로, 방향을 맞춰 더하고 빼기만 하면 되기 때문이다. 그래도 천문학 자료나 성도에는 적경이 나오므로 SHA = 360° − RA로 바꿀 줄 알아야 한다.[1]","body":["적경은 천구에 붙어 있는 좌표다. 춘분점과 천체가 함께 [[일주운동·주극성|일주운동]]을 하므로, 하루가 지나도 항성의 적경은 거의 변하지 않는다. 그래서 [[적위]]와 적경으로 천체 위치를 나타내면 시간에 구애받지 않는다([[적도좌표계]]).[2]","적경은 보통 시간 단위로 쓰며 1h = 15°다. 예컨대 RA 6h는 90°다.[3]","천문학에서는 주로 적경을, 항해학에서는 주로 [[항성시각]](SHA)을 쓴다. 둘의 관계는 다음과 같다.[1]",{"formula":"SHA + RA = 360° = 24h","label":"식 (1.2)"},"SHA는 춘분점에서 서쪽으로, RA는 동쪽으로 같은 천체까지 잰 각이다. 같은 위치를 반대 방향에서 재었으므로 둘을 더하면 한 바퀴, 곧 360°(24h)가 된다.[1]",{"table":{"head":["순서","계산","값"],"rows":[["① 적경","주어진 값","RA 6h"],["② 도 단위로","6 × 15°","90°"],["③ SHA","360° − 90°","270°"]]},"caption":"보충 예시 — 적경을 SHA로 바꾸기"},"3D 장면 3(적도좌표)에서 춘분점에서 동쪽으로 재는 적경을 볼 수 있다."],"confusions":"적경은 동쪽으로, SHA는 서쪽으로 잰다. 같은 위치를 반대 방향에서 잰 값이라 둘을 더하면 360°가 된다. 예컨대 RA 90°인 천체의 SHA는 270°다. 또 적경의 ‘h’는 시계 시각이 아니라 각도의 단위다.","key":["적경(RA): 춘분점에서 동쪽으로 0°~360°(0h~24h)","SHA + RA = 360° = 24h — 식 (1.2)","1h = 15° (예: RA 6h = 90° → SHA 270°)"],"footnotes":["교재 10쪽, 그림 1.11, 식 (1.2).","교재 23쪽.","교재 밖 보충 설명. 적경은 3월 춘분점에서 천의 적도를 따라 동쪽으로 잰 각거리로, 지구 경도의 하늘판이다. 원의 1/24을 적경 1h, 곧 15°로 잰다. 참고: [Right ascension — Wikipedia](https://en.wikipedia.org/wiki/Right_ascension)."],"flags":[]},{"title":"항성시각","easy":["항해사는 별의 하늘 주소를 적을 때 [[춘분점·추분점|춘분점]]에서 **서쪽**으로 몇 도인지를 쓴다. 이 각이 **항성시각**(Sidereal Hour Angle, SHA)이다. 춘분점과 별은 함께 돌기 때문에 SHA는 거의 변하지 않는 고정 주소다.","그러면 지금 그 별이 그리니치에서 서쪽으로 몇 도에 있는지([[본초시각]], GHA)는 어떻게 알까? 춘분점이 그리니치에서 서쪽으로 몇 도에 있는지(GHA♈)에, 별이 춘분점에서 서쪽으로 몇 도에 있는지(SHA)를 더하면 된다.","예를 들어 GHA♈가 153°41′.9이고 Acamar의 SHA가 315°15′.2이면 합은 468°57′.1이다. 360°를 넘었으니 한 바퀴를 빼면 별의 GHA는 108°57′.1이다.[3]"],"definition":"춘분점을 지나는 시권과 천체를 지나는 시권이 극에서 이루는 각, 또는 그 사이 천의 적도의 호를 그 천체의 항성시각(Sidereal hour angle: SHA)이라 하며, 춘분점을 기준으로 서쪽으로 0°에서 360°까지(0h에서 24h까지) 잰다. 천문학에서는 주로 적경(Right ascension, RA)을, 항해학에서는 주로 항성시각을 쓴다.[1]","terms":[{"ko":"항성시각","en":"Sidereal hour angle","abbr":"SHA","plain":"춘분점에서 서쪽으로 잰 각. 별의 고정 주소"},{"ko":"[[춘분점의 GHA]]","en":"Greenwich hour angle of Aries","abbr":"GHA♈","plain":"그리니치에서 서쪽으로 춘분점까지 잰 각"},{"ko":"[[본초시각]]","en":"Greenwich hour angle","abbr":"GHA","plain":"그리니치 자오선에서 서쪽으로 천체까지 잰 각"},{"ko":"[[적경]]","en":"Right ascension","abbr":"RA","plain":"같은 각을 동쪽으로 잰 값. SHA + RA = 360°"},{"ko":"[[천측력]]","en":"Nautical Almanac","plain":"천체의 GHA·적위 등을 시간별로 실은 책"}],"why":"별을 관측하면 먼저 [[천측력]]에서 관측 시각의 GHA♈를 찾고, 그 별의 SHA를 더해 별의 GHA를 만든다. 여기에 경도를 더하거나 빼서 LHA를 구하고, 적위와 함께 [[계산고도·계산방위각|계산고도]]를 낸다. 천측력이 별 57개마다 시간별 GHA를 싣지 않아도 되는 것은 SHA 덕분이다.[3][4]","body":["항해학에서는 [[적경]] 대신 SHA를 주로 쓴다.[1] Bowditch도 춘분점이 항해사에게 중요한 까닭을 ‘SHA를 재는 기준이기 때문’이라고 쓴다.[4] 본초시각(GHA)과 [[지방시각·자오선각|지방시각]](LHA)도 모두 서쪽으로 재므로, 기준점(춘분점·그리니치·관측자 자오선)만 바꿔 가며 더하거나 빼서 서로 구할 수 있다. 경도를 더할지 뺄지는 동경·서경에 따라 정해진다(본초시각 문서의 식 (1.4)).[2]","항성의 SHA와 적위는 5~6일에 0′.1, 몇 달에 1′ 정도밖에 변하지 않는다. 그래서 천측력은 57개 항성의 SHA와 적위를 3일 공통으로 싣고, 관측 시각의 [[춘분점의 GHA|춘분점 본초시각(GHA♈)]]에 SHA를 더해 항성의 GHA를 구하게 한다.[3]",{"formula":"GHA = GHA♈ + SHA","label":"식 (1.5)"},"GHA는 구하려는 별의 본초시각, GHA♈는 같은 순간 춘분점의 본초시각, SHA는 그 별의 항성시각이다. 세 각이 모두 서쪽으로 재는 각이라서 그냥 더하면 된다. 합이 360°를 넘으면 360°를 뺀다.[3]",{"table":{"head":["순서","계산","값"],"rows":[["① GHA♈ (GMT 03-32-47)","천측력에서 찾음","153°41′.9"],["② SHA (Acamar)","천측력 STARS 란","315°15′.2"],["③ 합","153°41′.9 + 315°15′.2","468°57′.1"],["④ GHA","360°를 넘으므로 468°57′.1 − 360°","108°57′.1"]]},"caption":"교재 34쪽 예제 — 2019년 1월 1일 항성 Acamar"},"3D 장면 3(적도좌표)과 4(시각 실험실)에서 SHA·GHA♈·GHA의 관계를 볼 수 있다."],"confusions":"SHA는 춘분점에서, GHA는 그리니치 자오선에서, LHA는 관측자 자오선에서 서쪽으로 잰다. 기준만 다르고 방향은 모두 서쪽이다. 세 각의 관계는 [[적도평면도]](시각도) 한 장에서 볼 수 있다.[2] 또 ‘항성시각’의 ‘시각’은 시계의 시각(時刻)이 아니라 각도인 시각(時角)이다.","key":["SHA: 춘분점에서 서쪽으로 0°~360°, 항성은 거의 불변","항해학은 RA 대신 SHA (SHA + RA = 360°)","항성의 GHA = GHA♈ + SHA (360° 넘으면 뺌) — 식 (1.5)","예: 153°41′.9 + 315°15′.2 − 360° = 108°57′.1"],"footnotes":["교재 10쪽, 그림 1.12, 식 (1.2).","교재 밖 보충 설명. 시각도는 교재 27–28쪽, 그림 1.31. SHA는 3월 춘분점에서 서쪽으로 잰 각거리이며 천측에서 자주 쓴다. 참고: [Hour angle — Wikipedia](https://en.wikipedia.org/wiki/Hour_angle).","교재 29쪽(STARS 란, 3일 공통), 34–35쪽, 식 (1.5).","교재 밖 보충 설명. Bowditch 1319절: 춘분점은 SHA를 재는 기준이라 항해사에게 중요하다. 1325절: 춘분점을 지나는 시권에서 서쪽으로 잰 각거리가 SHA다. 참고: [Bowditch, The American Practical Navigator (2019), Chapter 13 Navigational Astronomy](https://thenauticalalmanac.com/2019_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2013-%20Navigational%20Astronomy.pdf)."],"flags":[{"kind":"계산 확인","text":"교재 34쪽 Acamar 예제: 153°41′.9 + 315°15′.2 = 468°57′.1 → 360°를 빼면 108°57′.1. 재계산 일치."}]},{"title":"황위의 권","easy":["[[천의 자오선·시권|시권]]은 천의 북극과 남극을 잇는 세로줄이다. 이번에는 기준 원을 [[천의 적도]] 대신 [[황도]]로 바꿔 보자. 그러면 황도에도 북극과 남극이 생긴다.","황도면에 수직인 축이 천구와 만나는 두 점이 **황도의 극**(Ecliptic pole)이다. 황도의 두 극을 지나는 큰 원이 **황위의 권**(Circle of celestial latitude)이다. 황도를 적도로 삼은 지구본의 경선이라고 보면 된다.","황도는 천의 적도와 23°27′ 기울어 있으므로, 황도의 극도 천의 극에서 23°27′ 떨어져 있다. 그래서 같은 별을 지나도 황위의 권과 시권은 대개 서로 다른 원이다.[2]"],"definition":"황도(Ecliptic)의 양극을 지나는 대권을 황위의 권(Circle of celestial latitude)이라 한다. 그림 1.13에서 E♈E′를 황도, C 및 C′를 황도의 극(Ecliptic pole)이라 하면 CMC′가 천체 M을 지나는 황위의 권이다.[1]","terms":[{"ko":"황위의 권","en":"Circle of celestial latitude","plain":"황도의 두 극을 지나는 대권. 황도좌표의 경선"},{"ko":"황도의 극","en":"Ecliptic pole","abbr":"C, C′","plain":"황도면에 수직인 축이 천구와 만나는 두 점"},{"ko":"[[황위]]","en":"Celestial latitude","plain":"황위의 권을 따라 황도에서 잰 각"},{"ko":"[[황경]]","en":"Celestial longitude","plain":"황도를 따라 춘분점에서 동쪽으로 잰 각"}],"why":"황위의 권과 황도좌표는 교재 8장의 천측 계산에 직접 쓰이지 않는다. [[천측력]]의 GHA와 적위는 모두 천의 적도를 기준으로 한다. 대신 태양·달·행성처럼 황도 근처를 움직이는 천체의 운동을 설명할 때 쓰이며, [[적도좌표계]]와 견주어 보면 좌표계의 원리를 이해하기 쉽다([[황도좌표계]]).","body":["황도의 극은 황도면에 수직인 축이 천구와 만나는 두 점이다. 그림 1.13에서 E♈E′가 황도, C와 C′가 황도의 극이며, CMC′가 천체 M을 지나는 황위의 권이다.[1] 황도의 극은 황위가 ±90°인 점이다.[2]",{"table":{"head":["적도좌표계","황도좌표계"],"rows":[["기준 대권: 천의 적도","기준 대권: 황도"],["천의 극 (Pn, Ps)","황도의 극 (C, C′)"],["시권 (천의 극을 지나는 대권)","황위의 권 (황도의 극을 지나는 대권)"],["적위 (시권을 따라 잼)","황위 (황위의 권을 따라 잼)"]]},"caption":"시권과 황위의 권 비교"},"황위의 권을 따라 [[황위]]를 재고, 황도를 따라 [[황경]]을 잰다. 이 둘로 위치를 나타내는 방식이 황도좌표계다."],"confusions":"황도의 극은 천의 극에서 황도경사만큼(약 23°27′) 떨어져 있다. 그래서 같은 천체를 지나더라도 황위의 권과 시권은 대개 서로 다른 원이다.[2]","key":["황위의 권 = 황도의 양극(C, C′)을 지나는 대권","황위는 이 원을 따라 잰다 (시권 ↔ 황위의 권)"],"footnotes":["교재 11쪽, 그림 1.13.","교재 밖 보충 설명. 황도좌표계에서 황도의 극은 황위 ±90°인 점이고, 황위는 황도에서 황도의 극 쪽으로 잰 각거리다. 참고: [Ecliptic coordinate system — Wikipedia](https://en.wikipedia.org/wiki/Ecliptic_coordinate_system)."],"flags":[]},{"title":"황위","easy":["[[적위]]가 하늘의 적도에서 위아래로 잰 각이라면, **황위**(Celestial latitude)는 [[황도]]에서 위아래로 잰 각이다. 천체가 태양이 다니는 길에서 얼마나 벗어나 있는지를 나타낸다.","황도 북쪽이면 +, 남쪽이면 −를 붙이고 각각 90°까지 잰다. 태양은 늘 황도 위에 있으므로 황위가 언제나 0°다.[2]","달과 행성은 황도 근처의 띠([[황도대·황도 12궁|황도대]]) 안을 다닌다. 그래서 황위가 대체로 ±9°를 넘지 않는다.[2]"],"definition":"천체를 지나는 황위의 권(Circle of celestial latitude) 위에서 황도와 천체 사이에 낀 호를 그 천체의 황위(Celestial latitude)라 한다. 황도를 0°로 하여 남북으로 각각 90°까지 재며, 천체가 황도 북쪽에 있으면 +, 남쪽에 있으면 −를 붙인다.[1]","terms":[{"ko":"황위","en":"Celestial latitude","plain":"황도에서 남북으로 잰 각. 북 +, 남 −, 0°~90°"},{"ko":"[[황위의 권]]","en":"Circle of celestial latitude","plain":"황위를 재는 선. 황도의 극을 지나는 대권"},{"ko":"[[황도]]","en":"Ecliptic","plain":"태양의 1년 길. 황위 0°선"}],"why":"황위는 교재 8장의 천측 계산에 직접 들어가지 않는다. 하지만 ‘태양의 황위는 늘 0°’, ‘달·행성은 황도 근처’라는 사실을 알면 밤하늘에서 행성이 어디쯤 있을지 짐작할 수 있다. 천측에 쓰는 좌표는 적도 기준의 [[적위]]이므로 둘을 헷갈리지 않아야 한다.","body":["황위는 황도를 0°로 하여 남북으로 각각 90°까지 잰다. 천체가 황도 북쪽에 있으면 +, 남쪽에 있으면 −를 붙인다. 그림 1.13에서 LM이 천체 M의 황위(+)다.[1]","태양은 항상 황도 위에 있으므로 태양의 황위는 늘 0°다. 달과 행성은 황도대 안을 움직이므로 황위가 대체로 ±9° 안쪽이다.[2]",{"table":{"head":["천체","황위"],"rows":[["태양","늘 0° (황도 위)"],["달·행성","대체로 ±9° 안쪽 (황도대 안)"],["황도의 극","±90°"]]},"caption":"천체별 황위 (보충)"}],"confusions":"[[적위]]는 천의 적도에서 N·S로, 황위는 황도에서 +·−로 잰다. 같은 ‘위도’ 계열이지만 기준 원과 부호 표기가 다르다. 태양의 적위는 1년 동안 ±23°27′ 사이로 변하지만, 태양의 황위는 늘 0°다.","key":["황위: 황도에서 남북으로 0°~90°, 북 +, 남 −","태양의 황위는 항상 0°, 달·행성은 대체로 ±9° 안"],"footnotes":["교재 11쪽, 그림 1.13.","교재 밖 보충 설명. 교재 7쪽 황도대의 정의에서 나온다. 황위는 황도에서 북쪽(+)·남쪽(−)으로 잰 각거리이며, 황도의 극은 ±90°다. 참고: [Ecliptic coordinate system — Wikipedia](https://en.wikipedia.org/wiki/Ecliptic_coordinate_system)."],"flags":[]},{"title":"황경","easy":["[[황도]]를 1년짜리 달리기 트랙이라고 생각하자. 출발선은 [[춘분점·추분점|춘분점]]이고, 태양은 이 트랙을 동쪽으로 1년에 한 바퀴 돈다. 출발선에서 동쪽으로 몇 도 왔는지가 **황경**(Celestial longitude)이다.","태양의 황경은 춘분에 0°, 하지에 90°, 추분에 180°, 동지에 270°다. 태양이 하루에 1°가 조금 못 되게 움직이므로 황경도 하루에 그만큼 늘어난다.[2]","별의 황경은 그 별을 지나는 [[황위의 권]]이 황도와 만나는 점까지 잰다. [[황도대·황도 12궁|황도 12궁]]은 이 황경을 30°씩 끊은 구간이다."],"definition":"춘분점과 천체를 지나는 황위의 권(Circle of celestial latitude) 사이에 낀 황도의 호, 또는 그들이 황도극에서 이루는 각을 황경(Celestial longitude)이라 하며, 춘분점을 0°로 하여 동쪽으로 360°까지 잰다.[1]","terms":[{"ko":"황경","en":"Celestial longitude","plain":"춘분점에서 황도를 따라 동쪽으로 잰 각, 0°~360°"},{"ko":"춘분점","en":"First point of Aries","abbr":"♈","plain":"황경 0°의 출발점"},{"ko":"[[황위의 권]]","en":"Circle of celestial latitude","plain":"황경의 도착선. 황도의 극과 천체를 지나는 대권"},{"ko":"[[황도좌표계]]","en":"Ecliptic coordinate","plain":"황경과 황위로 위치를 나타내는 좌표계"}],"why":"황경도 교재 8장의 천측 계산에는 직접 쓰이지 않는다. 그러나 태양의 황경은 계절과 정확히 맞물려 있어서, 황경을 알면 그날 태양이 황도의 어디쯤 있고 적위가 대략 얼마인지 그릴 수 있다. 예를 들어 황경 90°(하지)이면 태양의 적위는 최대 북쪽이다([[하지점·동지점]]).","body":["그림 1.13에서 ♈L이 천체 M의 황경이다.[1] 황경과 [[황위]]로 위치를 나타내는 방식이 황도좌표계다.","태양은 황도 위를 1년에 한 바퀴 돌므로, 태양의 황경은 춘분에 0°, 하지에 90°, 추분에 180°, 동지에 270°다.[2] 황도 12궁은 황경을 30°씩 나눈 구간이다.",{"table":{"head":["때","계절점","태양의 황경"],"rows":[["3월 21일경 (춘분)","춘분점 ♈","0°"],["6월 22일경 (하지)","하지점 ♋","90°"],["9월 23일경 (추분)","추분점 ♎","180°"],["12월 22일경 (동지)","동지점 ♑","270°"]]},"caption":"계절점에서 태양의 황경 (보충)"}],"confusions":"[[적경]]과 황경은 둘 다 춘분점에서 동쪽으로 잰다. 그러나 적경은 천의 적도를 따라, 황경은 황도를 따라 재므로, 분점·지점 같은 특별한 점이 아니면 두 값은 다르다.[2]","key":["황경: 춘분점에서 황도를 따라 동쪽으로 0°~360°","태양의 황경: 춘분 0°, 하지 90°, 추분 180°, 동지 270°"],"footnotes":["교재 12쪽, 그림 1.13. 교재의 ‘천구 M’은 ‘천체 M’의 오자다.","교재 밖 보충 설명. 황경은 3월 춘분 때 지구에서 태양을 보는 방향을 0°로 하여 황도를 따라 동쪽으로 0°~360° 잰다. 지점은 황경 90°와 270°에 있다. 태양은 황도를 따라 하루에 1°가 조금 못 되게 움직인다. 참고: [Ecliptic coordinate system — Wikipedia](https://en.wikipedia.org/wiki/Ecliptic_coordinate_system), [Ecliptic — Wikipedia](https://en.wikipedia.org/wiki/Ecliptic)."],"flags":[{"kind":"교재 정정","text":"12쪽 ‘천구 M의 황경’을 ‘천체 M의 황경’으로 바로잡았다.","fn":1}]},{"title":"천정·천저","easy":["갑판에 똑바로 서서 고개를 뒤로 젖히고 바로 머리 위를 본다. 그 점이 **천정**(Zenith, Z)이다. 반대로 발밑으로 지구를 뚫고 내려가 반대편 하늘에 닿는 점이 **천저**(Nadir, Na)다.","지구 중심에서 내 정수리를 지나 하늘까지 긴 막대를 꽂았다고 생각하면 된다. 막대의 위쪽 끝이 천정, 아래쪽 끝이 천저다. 그래서 내가 자리를 옮기면 천정도 함께 옮겨 간다.","천정이 하늘의 어디에 있는지 알면 배가 지구의 어디에 있는지도 안다. 예를 들어 위도 35°N에 있는 배의 천정은 하늘의 적도에서 북쪽으로 35° 떨어져 있다.[2] 그래서 천측으로 선위를 구하는 일은 곧 천정의 위치를 찾는 일이다."],"definition":"관측자와 지구 중심을 지나는 직선이 천구(Celestial sphere)와 만나는 두 점 가운데, 관측자의 머리 위쪽 점이 천정 또는 정점(Zenith, Z)이고, 발 아래쪽 점이 천저 또는 척점(Nadir, Na)이다.[1]","terms":[{"ko":"천정","en":"Zenith","abbr":"Z","plain":"관측자 바로 머리 위 천구의 점"},{"ko":"천저","en":"Nadir","abbr":"Na","plain":"관측자 바로 발 아래, 천정의 정반대 점"},{"ko":"[[천구]]","en":"Celestial sphere","plain":"관측자를 둘러싼 아주 큰 가상의 공"},{"ko":"[[수평의 종류|진수평]]","en":"Celestial horizon","plain":"천정·천저와 90° 떨어진 하늘의 바닥 원"},{"ko":"[[정거]]","en":"Zenith distance","abbr":"ZD","plain":"천정에서 천체까지 잰 각"},{"ko":"[[천체의 지위]]","en":"Geographical position","abbr":"GP","plain":"천체 바로 아래 지구 위의 점"}],"why":"천측의 목표는 결국 내 천정의 위치를 알아내는 것이다. 육분의로 천체의 고도를 재면 천정에서 천체까지의 각, 곧 [[정거]]를 알게 된다. 이 정거가 지구 위에서 천체 바로 아래 지점까지의 거리가 되고, 그 거리로 [[위치권]]을 그린다.[4]","body":["천정과 천저는 [[천구]] 위에서 서로 정반대에 있는 한 쌍의 점이다. 그림 1.14에서 Z가 천정, Na가 천저다. 천정은 정점(頂點), 천저는 척점이라고도 부른다.[1]","천정은 관측자마다 다르다. 서 있는 곳이 바뀌면 머리 위의 점도 바뀌기 때문이다. 교재는 천체를 관측하여 선위를 구하는 것이 곧 천정의 위치를 결정하는 것과 같은 의미라고 설명한다.[1]","그 까닭은 이렇다. 지구를 구로 보면 천정의 [[적위]]는 관측자의 위도와 같다. 또 천정을 지나는 [[천의 자오선·시권|천의 자오선]]이 곧 관측자의 자오선이므로, 천정의 위치는 관측자의 경도도 알려 준다.[2]","천정과 천저는 [[수평좌표계]]에서 ‘극’ 역할을 한다. 지구본의 북극·남극을 기준으로 경선과 위선을 긋듯, 이 두 점을 기준으로 수평좌표의 원들이 정해진다.[3]",{"list":["천정과 천저를 지나는 대권 → [[수직권·주수직권|수직권]]","천정과 천저를 잇는 직선에 수직이고 천구 중심을 지나는 대권 → [[수평의 종류|진수평]]","천정에서 천체까지 수직권을 따라 잰 호 → 정거"]},"천체 바로 아래 지구 위의 점이 [[천체의 지위]]다. 지위를 중심으로 정거를 반지름으로 그린 원이 위치권이며, 관측자는 이 원 위 어딘가에 있다.[4] 3D 장면 5(수평좌표)에서 천정·천저와 수평권의 관계를 볼 수 있다.","천문학 자료에서는 천정을 추를 매단 실의 방향, 곧 연직선(Plumb line, 중력 방향)으로 정하는 경우가 많다. 지구가 완전한 구가 아니어서 이 연직선은 지구 중심을 정확히 지나지 않는다. 교재처럼 지구 중심을 지나는 직선으로 정한 점은 ‘지심천정’이라 하여 구별하기도 한다.[5]"],"confusions":"교재는 천정의 기호 Z와 [[방위·방위각|방위각]]의 기호 Z를 같은 글자로 쓴다. 그림 속 점(천정)인지 각(방위각)인지 문맥으로 구별한다.","key":["천정 Z(정점) = 머리 위, 천저 Na(척점) = 발 아래","관측자와 지구 중심을 지나는 직선이 천구와 만나는 두 점","선위를 구하는 것 = 천정의 위치를 결정하는 것","천정의 적위 = 관측자의 위도"],"footnotes":["교재 12쪽, 그림 1.14.","교재 밖 보충 설명. 천정의 위치를 적도좌표로 나타내면 적위는 관측자의 위도와, 본초시각(GHA)은 관측자의 경도와 대응한다(서경이면 GHA = λ, 동경이면 GHA = 360° − λ). 천정의 지방시각(LHA)은 늘 0°다. 적위가 관측자의 위도와 같은 별은 천정을 지나며, 이를 이용해 위도를 구할 수 있다. 참고: [Zenith — Wikipedia](https://en.wikipedia.org/wiki/Zenith).","교재 13쪽, 15쪽, 24쪽 표 1.2.","교재 157쪽.","교재 밖 보충 설명. 바깥 자료는 천정을 관측자의 연직선(중력 방향)이 천구와 만나는 점으로 정의하고, 연직선은 지구 중심을 정확히 지나지 않으므로 지구 중심 기준의 점을 지심천정으로 구별한다. 항해에서 쓰는 정도의 설명에서는 둘을 같은 점으로 봐도 된다. 참고: [천정 — 위키백과](https://ko.wikipedia.org/wiki/천정), [Zenith — Wikipedia](https://en.wikipedia.org/wiki/Zenith)."],"flags":[{"kind":"교재 밖","text":"‘선위를 구하는 것 = 천정의 위치를 결정하는 것’의 근거로 ‘천정의 적위 = 관측자의 위도’를 보충 설명으로 덧붙였다.","fn":2},{"kind":"해석","text":"교재는 천정을 ‘관측자와 지구 중심을 지나는 직선’으로 정의하지만, 천문학 자료는 연직선(중력 방향) 기준으로 정의하고 지구 중심 기준은 지심천정으로 구별한다. 정의 문장은 교재를 따르고 차이를 각주로 적었다.","fn":5}]},{"title":"관측자의 천의 자오선·자오선정중","easy":["하늘의 북극에서 출발해 내 머리 꼭대기(천정)를 지나 하늘의 남극까지 이어지는 큰 원을 그려 본다. 이 원이 **관측자의 천의 자오선**(Observer's celestial meridian)이다. 하늘을 동쪽 절반과 서쪽 절반으로 나누는 ‘나만의 중앙선’이다.","해와 별은 동쪽에서 떠서 이 선을 넘어 서쪽으로 진다. 천체가 이 선 위에 오는 순간이 **자오선정중**(Meridian transit)이다. 이때 천체는 하루 중 가장 높이 뜨고, 태양이 정중하는 순간이 그 장소의 정오다.[2]","천체는 하루에 자오선을 두 번 지난다. 머리 위쪽 반원을 지날 때가 **극상정중**(Upper transit)이고, 약 12시간 뒤 발 아래쪽 반원을 지날 때가 **극하정중**(Lower transit)이다.[2]"],"definition":"천정(Zenith)을 지나는 천의 자오선(Celestial meridian)을 관측자의 천의 자오선(Observer's celestial meridian)이라 한다. 천체가 이 자오선 위에 있어 천체의 시권(Hour circle)과 관측자의 천의 자오선이 일치하는 순간을 자오선정중(Meridian transit), 자오선통과(Meridian passage) 또는 남중(Culmination)이라 한다.[1]","terms":[{"ko":"관측자의 천의 자오선","en":"Observer's celestial meridian","plain":"하늘의 양극과 내 천정을 지나는 큰 원"},{"ko":"자오선정중","en":"Meridian transit","plain":"천체가 내 자오선을 지나는 순간. 자오선통과·남중"},{"ko":"극상정중","en":"Upper transit","plain":"천정 쪽 반원에서 정중, 가장 높을 때"},{"ko":"극하정중","en":"Lower transit","plain":"천저 쪽 반원에서 정중, 가장 낮을 때"},{"ko":"[[천의 자오선·시권|시권]]","en":"Hour circle","plain":"하늘의 양극과 천체를 지나는 큰 원"},{"ko":"[[천정·천저|천정]]","en":"Zenith","abbr":"Z","plain":"관측자 바로 머리 위 천구의 점"}],"why":"자오선정중은 천측에서 가장 다루기 쉬운 순간이다. 이때 천체는 정북이나 정남에 있고, 고도는 ‘90° − 위도 + 적위’처럼 위도와 적위만으로 정해진다.[5] 또 극상정중은 [[지방시각·자오선각|지방시각]](LHA)이 0°인 순간이라, 하늘의 시각을 세는 출발점이 된다.[3]","body":["[[천의 자오선·시권|천의 자오선]]은 천의 양극을 지나는 대권이라서, 지구의 경선처럼 무수히 많다. 그중 관측자의 [[천정·천저|천정]]을 지나는 하나가 관측자의 천의 자오선이다. 그림 1.14에서 PnZPsNa가 관측자의 천의 자오선이다.[1]","천체가 관측자의 자오선 위에 오면 천체를 지나는 시권이 관측자의 천의 자오선과 겹친다. 이 순간을 **자오선정중**(Meridian transit), 자오선통과(Meridian passage) 또는 남중(Culmination)이라 부른다.[1]",{"list":["극상정중(Upper transit): 극상반원(천정이 있는 반원)에서 정중하는 것","극하정중(Lower transit): 극하반원(천저가 있는 반원)에서 정중하는 것"]},{"table":{"head":["구분","지나는 반원","천체의 LHA","그때의 높이"],"rows":[["극상정중","극상반원(천정 쪽)","0°","하루 중 가장 높다"],["극하정중","극하반원(천저 쪽)","180°","하루 중 가장 낮다"]]},"caption":"극상정중과 극하정중 비교"},"극상정중 때 천체의 LHA는 0°, 극하정중 때는 180°다.[3] 늘 수평선 위에 떠 있는 [[일주운동·주극성|주극성]]은 극상정중과 극하정중을 모두 수평선 위에서 한다.[3]","관측자의 천의 자오선은 북점과 남점을 지나므로 [[수직권·주수직권|주수직권]]이기도 하다.[4] 곧 이 원은 천의 극과 천정을 함께 지나는 원이다."],"confusions":"‘남중(南中)’은 글자 그대로 남쪽에서 정중한다는 뜻이다. 북반구 중위도에서는 대부분의 천체가 천정의 남쪽에서 정중하기 때문이다. 그러나 적위가 관측자의 위도보다 북쪽인 천체는 천정의 북쪽에서 정중한다.[5]","key":["관측자의 천의 자오선 = 천정을 지나는 천의 자오선 (PnZPsNa)","자오선정중 = 자오선통과 = 남중 (Meridian transit, Meridian passage, Culmination)","극상정중: 극상반원, LHA 0° / 극하정중: 극하반원, LHA 180°"],"footnotes":["교재 12–13쪽, 그림 1.14.","교재 밖 보충 설명. 극상정중 때 천체는 천정에 가장 가까워 하루 중 가장 높고, 태양의 극상정중이 그 장소의 정오(solar noon)다. 극하정중은 약 12시간 뒤에 온다. 영어 meridian은 ‘한낮’과 ‘남쪽’을 함께 뜻하는 라틴어 meridies에서 왔다. 참고: [Culmination — Wikipedia](https://en.wikipedia.org/wiki/Culmination), [Meridian (astronomy) — Wikipedia](https://en.wikipedia.org/wiki/Meridian_(astronomy)).","교재 밖 보충 설명. 교재 18쪽 지방시각의 정의와 3쪽 주극성의 정의에서 나온다.","교재 14–15쪽.","교재 밖 보충 설명. 극상정중 때의 고도는 90° − 위도 + 적위(위도와 같은 이름의 적위를 +)로 구한다. 값이 90°를 넘으면 천체가 천정 너머 반대쪽에서 정중한다는 뜻이다. 예컨대 위도 35°N의 관측자에게 적위 50°N인 천체는 90° − 35° + 50° = 105°, 곧 천정에서 북쪽으로 15° 떨어진 곳(북쪽 수평선에서 고도 75°)에서 정중한다. 참고: [Culmination — Wikipedia](https://en.wikipedia.org/wiki/Culmination)."],"flags":[{"kind":"교재 밖","text":"‘남중’이라도 천체가 천정의 북쪽에서 정중할 수 있다는 설명과 예시(위도 35°N, 적위 50°N → 북쪽 고도 75°)를 덧붙였다.","fn":5},{"kind":"교재 밖","text":"극상정중 때 고도 = 90° − 위도 + 적위라는 식을 바깥 자료(Culmination — Wikipedia)에서 가져와 덧붙였다. 교재 1장에는 없는 식이다.","fn":5}]},{"title":"수평의 종류","easy":["바다에서 ‘수평선’이라 하면 하늘과 바다가 맞닿은 선 하나를 떠올린다. 그런데 천문항해에서는 기준 높이에 따라 수평을 여러 개로 나눈다. 지구 중심 높이, 내 눈높이, 실제로 보이는 바다 끝이 조금씩 다르기 때문이다.","천구 중심을 지나는 기준 수평이 **진수평**(Celestial horizon)이다. 내 눈을 지나며 진수평과 나란한 수평은 **거소수평**(Sensible horizon)이다. 바다 끝에 실제로 보이는 선은 **시수평**(Visible horizon)이다.","눈이 높을수록 바다 끝은 멀어지고, 그만큼 눈높이보다 아래로 내려가 보인다. 눈높이 2 m에서는 수평선이 약 5 km 앞에 있고, 1,000 m 높이에서는 수평선이 눈높이 수평보다 약 1° 아래에 보인다.[5] 이렇게 내려간 각이 [[안고차]](Dip)다."],"definition":"천정과 천저를 지나는 직선에 수직이고 천구의 중심을 지나는 평면이 천구와 만나서 이루는 대권을 진수평(Celestial horizon 또는 Rational horizon)이라 하며, 보통 수평권이라 하면 이것을 뜻한다. 이 밖에 거소수평(Sensible horizon), 지오이드수평(Geoidal horizon), 시수평(Visible horizon), 기하학적 수평(Geometrical horizon)이 있다.[1]","terms":[{"ko":"진수평","en":"Celestial horizon","plain":"천구 중심을 지나는 기준 수평(대권)"},{"ko":"거소수평","en":"Sensible horizon","plain":"내 눈을 지나며 진수평과 나란한 수평"},{"ko":"지오이드수평","en":"Geoidal horizon","plain":"내가 선 수면에 접하는 수평"},{"ko":"시수평","en":"Visible horizon","plain":"실제로 눈에 보이는 바다 끝 수평선"},{"ko":"기하학적 수평","en":"Geometrical horizon","plain":"눈에서 지구에 그은 접선으로 정한 수평"},{"ko":"[[안고차]]","en":"Dip","abbr":"D","plain":"거소수평보다 시수평이 내려간 각"},{"ko":"안고","en":"Height of eye","abbr":"HE","plain":"해면에서 관측자 눈까지의 높이"}],"why":"[[육분의]]로 고도를 잴 때 기준선은 눈에 보이는 시수평이다. 하지만 위치선을 구하는 계산은 진수평에서 잰 고도를 쓴다. 그래서 잰 고도에서 수평의 차이를 고쳐 주는데, 이 과정이 고도개정이고 그 결과가 [[Sextant 고도·관측고도|관측고도]](Observed altitude, Ho)다.[4]","body":["**진수평**(Rational horizon이라고도 함)은 천정과 천저를 잇는 직선에 수직이고 천구 중심을 지나는 평면이 천구와 만나는 대권이다. 그림 1.15의 RR′이다.[1] [[천정·천저|천정과 천저]]는 진수평의 극에 해당한다.[2]","**거소수평** SS′는 관측자의 눈을 지나고 진수평과 평행한 소권이다. 관측자 위치에서 수면에 접하는 평면이 만드는 소권 HH′가 **지오이드수평**이며, 보통 둘은 구별하지 않는다. 항성은 매우 멀리 있어서, 실용상 거소수평을 진수평과 같다고 봐도 된다.[1]","**시수평** VV′는 관측자의 안고(Height of eye, H.E. 또는 h)에서 본 시선이 천구와 만나는 점을 지나고 진수평에 평행한 소권이다. 곧 실제로 보이는 수평선이다. 눈이 높을수록 시수평은 낮아지며, 거소수평보다 시수평이 낮아진 각을 안고차(Dip, D)라 한다.[1]","**기하학적 수평** GG′는 눈에서 지구 표면에 그은 접선이 천구와 만나는 점을 지나고 진수평에 평행한 소권이다. 대기의 기차(Refraction), 곧 공기 속에서 빛이 휘는 현상 때문에 시수평과 기하학적 수평은 일치하지 않는다.[1]","빛이 아래로 휘어 들어오므로 관측자는 접점보다 조금 먼 곳의 바다 끝을 보게 되고, 그 방향은 기하학적 수평보다 약간 높다. 그래서 실제 안고차는 기하학적 안고차보다 [[지상기차]]만큼 작다.[3][5]",{"table":{"head":["이름","영문","그림 1.15","모양·기준"],"rows":[["진수평","Celestial (Rational) horizon","RR′","대권, 천구 중심을 지남"],["거소수평","Sensible horizon","SS′","소권, 관측자의 눈을 지남"],["지오이드수평","Geoidal horizon","HH′","소권, 관측자 위치의 수면에 접함"],["기하학적 수평","Geometrical horizon","GG′"
