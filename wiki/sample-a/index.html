,"소권, 눈에서 지구에 그은 접선"],["시수평","Visible horizon","VV′","소권, 실제로 보이는 수평선"]]},"caption":"그림 1.15 수평의 종류 정리"},"육분의(Sextant)는 시수평을 기준으로 고도를 잰다. 시수평과 거소수평의 차이는 안고차로 고치고, 관측자와 지구 중심의 위치 차이는 [[시차·수평시차|시차]](Parallax)로 고쳐 진수평 기준 고도를 얻는다.[4] 3D 장면 8(고도 개정)과 함께 보면 이해하기 쉽다."],"confusions":"교재는 안고(눈의 높이)와 천체의 [[고도·고도의 거등권|고도]]를 둘 다 h로 쓴다. 또 ‘수평권’이라고만 하면 눈에 보이는 시수평이 아니라 진수평을 뜻한다.","key":["보통 ‘수평권’ = 진수평(천구 중심을 지나는 대권, RR′)","거소수평 SS′(눈높이) ≈ 지오이드수평 HH′, 항성에는 진수평과 같다고 봄","안고차(Dip, D) = 거소수평과 시수평 사이의 각, 눈이 높을수록 커짐","기차 때문에 시수평 ≠ 기하학적 수평 (실제 안고차는 기하학적 안고차보다 작음)"],"footnotes":["교재 13–14쪽, 그림 1.15.","교재 24쪽, 표 1.2.","교재 13쪽 원문은 ‘시수평이 기하학적 수평보다 약간 낮다’이고, 그림 1.15도 VV′를 GG′ 아래에 그렸다. 그러나 교재 56쪽(2.2.3, 그림 2.10)은 관측자가 접점 T보다 먼 B점을 광선 경로의 접선 OV 방향으로 보며, 실제 안고차가 기하학적 안고차보다 지상기차만큼 작다고 설명한다. 위키는 56쪽 설명을 따랐다.","교재 38쪽, 56쪽, 58–59쪽.","교재 밖 보충 설명. 기차가 없다고 할 때 수평선까지의 거리는 d ≈ 3.57√h(d는 km, h는 m)로, 눈높이 2 m에서 약 5 km다. 보통 대기에서는 빛이 아래로 휘어 실제 수평선은 기하학적으로 계산한 것보다 약 8% 더 멀다. 1,000 m 높이에서는 수평선이 눈높이 수평보다 약 1° 아래에 보인다. 참고: [Horizon — Wikipedia](https://en.wikipedia.org/wiki/Horizon)."],"flags":[{"kind":"교재 정정","text":"13쪽 ‘시수평이 기하학적 수평보다 약간 낮다’(그림 1.15도 같음)는 같은 교재 56쪽 안고차 설명(실제 안고차 = 기하학적 안고차 − 지상기차)과 맞지 않는다. 56쪽에 따라 ‘보이는 방향은 시수평이 약간 높다’로 고쳐 썼다. 시험에 13쪽 표현이 그대로 나올 수 있으니 원문도 함께 알아 두자.","fn":3},{"kind":"교재 밖","text":"수평선까지 거리 d ≈ 3.57√h(2 m → 약 5 km), 기차로 실제 수평선이 약 8% 더 멀다는 것, 1,000 m에서 약 1° 내려간다는 수치를 바깥 자료에서 덧붙였다. 이 바깥 자료도 교재 56쪽의 해석(시수평 방향이 기하학적 수평보다 약간 높음)과 맞는다.","fn":5}]},{"title":"방위의 기준점","easy":["나침반에는 N·E·S·W 네 글자가 찍혀 있다. 하늘에도 같은 네 점이 있는데, 수평선을 한 바퀴 두른 큰 원 위에 찍혀 있다. 이것이 방위의 기준점인 **북점·동점·남점·서점**이다.","북점과 남점은 내 머리 위를 지나는 남북선, 곧 관측자의 자오선이 수평선과 만나는 곳이다. 동점과 서점은 그 둘의 정확히 가운데, 북점·남점과 90°씩 떨어진 곳에 있다.","방위 숫자로 읽으면 북점 000°, 동점 090°, 남점 180°, 서점 270°다.[2][5] 앞으로 나오는 방위·방위각·출몰방위각은 모두 이 네 점에서부터 잰다."],"definition":"진수평(Celestial horizon)과 관측자의 천의 자오선(Observer's celestial meridian)이 만나는 두 점 가운데 북쪽 점이 북점(North point), 남쪽 점이 남점(South point)이다. 진수평 위에서 북점과 남점으로부터 같은 거리에 있는 두 점이 동점(East point)과 서점(West point)이다.[1]","terms":[{"ko":"북점","en":"North point","abbr":"N","plain":"진수평 위 정북의 점, 방위 000°"},{"ko":"동점","en":"East point","abbr":"E","plain":"진수평 위 정동의 점, 방위 090°"},{"ko":"남점","en":"South point","abbr":"S","plain":"진수평 위 정남의 점, 방위 180°"},{"ko":"서점","en":"West point","abbr":"W","plain":"진수평 위 정서의 점, 방위 270°"},{"ko":"[[수평의 종류|진수평]]","en":"Celestial horizon","plain":"천구 중심을 지나는 기준 수평"},{"ko":"[[방위·방위각|방위]]","en":"Azimuth","abbr":"Zn","plain":"북에서 시계방향으로 잰 천체의 방향"}],"why":"배에서 천체의 방향을 말할 때는 언제나 이 네 점이 출발점이다. 천측으로 구한 [[계산고도·계산방위각|계산방위각]]을 방위로 고쳐 위치선을 그을 때 북점·남점을 기준으로 쓴다. 해가 뜨고 지는 방향으로 컴퍼스 오차를 확인할 때는 동점·서점을 기준으로 쓴다.[6]","body":["북점(North point)과 남점(South point)은 [[수평의 종류|진수평]]과 [[관측자의 천의 자오선·자오선정중|관측자의 천의 자오선]]이 만나는 두 점이다. 동점(East point)과 서점(West point)은 진수평 위에서 북점·남점으로부터 같은 거리, 곧 90°씩 떨어진 점이다. 그림 1.16에 네 점이 표시되어 있다.[1]","네 점은 [[수평좌표계]]의 기준이다. [[방위·방위각|방위]]로 나타내면 북점 000°, 동점 090°, 남점 180°, 서점 270°다.[2]","북점과 남점을 지나는 수직권이 [[수직권·주수직권|주수직권]], 동점과 서점을 지나는 수직권이 [[동서권]]이다. 동점과 서점을 지나는 천의 자오선은 [[6시권]]이다.[3]","동점과 서점은 [[천의 적도]]가 진수평과 만나는 점이기도 하다.[4] 천체가 뜨고 지는 곳을 이 두 점에서 잰 각이 [[출몰방위각]]이다.",{"table":{"head":["기준점","영문","방위","이 점을 지나는 원"],"rows":[["북점","North point","000°","주수직권(관측자의 천의 자오선)"],["동점","East point","090°","동서권, 6시권, 천의 적도"],["남점","South point","180°","주수직권(관측자의 천의 자오선)"],["서점","West point","270°","동서권, 6시권, 천의 적도"]]},"caption":"방위의 기준점 한눈에 보기"}],"confusions":"북점은 [[천의 극·천의 축|천의 북극]] Pn과 다른 점이다. 북점은 수평권 위의 점이고, 북반구 관측자에게 Pn은 북점 바로 위 하늘에 있다.","key":["북점·남점 = 진수평 × 관측자의 천의 자오선","동점·서점 = 진수평 위에서 북점·남점과 90° 떨어진 점","방위로 북점 000°, 동점 090°, 남점 180°, 서점 270°"],"footnotes":["교재 14쪽, 그림 1.16.","교재 17쪽 방위의 정의에서 나온다.","교재 15쪽, 20쪽.","교재 밖 보충 설명. 천의 적도와 진수평은 둘 다 대권이므로 정반대의 두 점에서 만나며, 이 두 점은 관측자의 자오선에서 90° 떨어져 있다.","교재 밖 보충 설명. 진북에서 시계방향으로 재면 동쪽은 90°, 남쪽은 180°, 서쪽은 270°다. 참고: [Azimuth — Wikipedia](https://en.wikipedia.org/wiki/Azimuth).","교재 밖 보충 설명. 방위각(Azimuth)은 북에서, 출몰방위각(Amplitude)은 동 또는 서에서 잰다. 천체의 방위를 계산해 컴퍼스로 잰 값과 비교하면 그 차이가 컴퍼스 오차다. 참고: [Bowditch, American Practical Navigator (2019) Chapter 15 Azimuths and Amplitudes](https://thenauticalalmanac.com/2019_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2015-%20Azimuths%20And%20Amplitudes.pdf)."],"flags":[{"kind":"교재 밖","text":"동점·서점이 천의 적도와 진수평의 교점이라는 사실을 덧붙였다(6시권 설명의 근거).","fn":4}]},{"title":"수직권·주수직권","easy":["우산을 펴고 안쪽에서 올려다본다. 꼭대기 한 점에서 우산살이 사방으로 퍼져 내려온다. 천정에서 수평선까지 이렇게 내리그은 큰 원들이 **수직권**(Vertical circle)이다.","어떤 천체든 그 천체를 지나는 수직권이 하나씩 있다. 천체의 높이(고도)는 이 살을 따라 수평선에서 위로 재고, 천체의 방향(방위)은 살이 수평선에 닿는 자리로 읽는다.[4]","그 많은 살 가운데 정북과 정남을 지나는 살이 **주수직권**(Principal vertical circle)이다. 이것은 내 머리 위의 남북선, 곧 관측자의 자오선과 같은 원이다.[1]"],"definition":"천정(Zenith)과 천저(Nadir)를 지나는 대권을 수직권(Vertical circle)이라 하며, 방위를 재는 기준이 되므로 방위권(Azimuth circle)이라고도 한다. 특히 남점과 북점을 지나는 수직권을 주수직권(Principal vertical circle)이라 하며, 이것은 천의 자오선(Celestial meridian)이기도 하다.[1]","terms":[{"ko":"수직권","en":"Vertical circle","plain":"천정과 천저를 지나는 큰 원"},{"ko":"방위권","en":"Azimuth circle","plain":"수직권의 다른 이름, 방위를 재는 기준"},{"ko":"주수직권","en":"Principal vertical circle","plain":"북점·남점을 지나는 수직권 = 관측자의 자오선"},{"ko":"[[동서권]]","en":"Prime vertical","abbr":"PV","plain":"동점·서점을 지나는 수직권"},{"ko":"[[천정·천저|천정]]","en":"Zenith","abbr":"Z","plain":"모든 수직권이 모이는 머리 위의 점"}],"why":"천측에서 다루는 두 값, [[고도·고도의 거등권|고도]]와 [[방위·방위각|방위]]는 모두 천체의 수직권을 기준으로 정해진다. [[육분의]]로 재는 고도는 천체의 수직권을 따라 수평선에서 천체까지 잰 각이다. 그래서 수직권을 알면 고도와 방위가 하늘의 어느 선을 따라 잰 값인지 그림으로 떠올릴 수 있다.[4]","body":["모든 수직권은 [[천정·천저|천정과 천저]]에서 만나고 [[수평의 종류|진수평]]과 직각으로 교차한다.[2] 그림 1.17에서 ZMNa가 천체 M을 지나는 수직권이며, 이를 천체의 수직권이라고도 부른다.[1][3]","천체의 고도와 [[정거]]는 천체의 수직권을 따라 잰다. 방위는 관측자의 천의 자오선과 천체의 수직권이 천정에서 이루는 각, 곧 그 사이 수평권의 호로 잰다.[4]",{"table":{"head":["재는 값","어디를 따라 재나","어디서부터"],"rows":[["고도","천체의 수직권","진수평에서 위로"],["정거","천체의 수직권","천정에서 아래로"],["방위","수평권(진수평)","북점에서 시계방향으로"]]},"caption":"수직권과 수평권으로 재는 값"},"주수직권은 [[방위의 기준점|북점과 남점]]을 지나는 수직권이며 [[천의 자오선·시권|천의 자오선]]이기도 하다. 곧 주수직권은 [[관측자의 천의 자오선·자오선정중|관측자의 천의 자오선]]과 같은 원이다.[1] 동점과 서점을 지나는 수직권은 [[동서권]]이다."],"confusions":"수직권은 천정을 지나고, 시권은 천의 극을 지난다. 두 성질을 함께 가진 원은 관측자의 천의 자오선(주수직권) 하나뿐이다.[2]","key":["수직권(= 방위권) = 천정과 천저를 지나는 대권","주수직권 = 북점·남점을 지나는 수직권 = 관측자의 천의 자오선","고도·정거는 수직권을 따라, 방위는 수평권을 따라 잰다"],"footnotes":["교재 15쪽, 그림 1.17.","교재 밖 보충 설명. 천정과 천저를 지나는 대권은 모두 수직권이며, 관측자의 자오선은 천의 양극과 천정·천저를 함께 지나는 대권으로 수평과 천의 적도에 모두 수직이다. 참고: [Altazimuth Coordinates — LibreTexts (Tatum, Celestial Mechanics)](https://phys.libretexts.org/Bookshelves/Astronomy__Cosmology/Celestial_Mechanics_(Tatum)/06%3A_The_Celestial_Sphere/6.02%3A_Altazimuth_Coordinates), [Meridian (astronomy) — Wikipedia](https://en.wikipedia.org/wiki/Meridian_(astronomy)).","교재 16쪽.","교재 16–17쪽."],"flags":[]},{"title":"동서권","easy":["정동에서 출발해 내 머리 꼭대기를 지나 정서까지 이어지는 큰 아치를 그려 본다. 이 아치가 **동서권**(Prime vertical circle, PV)이다. 남북으로 지나는 관측자의 자오선과 천정에서 직각으로 엇갈린다.","이 아치 위에 있는 천체는 높이와 상관없이 정확히 정동이나 정서에 보인다. 방위로는 동쪽 반쪽 위가 090°, 서쪽 반쪽 위가 270°다.[2]","모든 천체가 이 아치를 지나는 것은 아니다. 수평선 위에서 정동·정서를 지나려면 천체의 적위가 관측자의 위도와 같은 이름(N 또는 S)이고 위도보다 작아야 한다.[5]"],"definition":"[[방위의 기준점|동점과 서점]](East point, West point)을 지나는 수직권(Vertical circle)을 동서권(Prime vertical circle, PV)이라 한다. 관측자의 자오선과 직교하므로 그 위에 있는 천체는 정동 또는 정서에 보인다.[1]","terms":[{"ko":"동서권","en":"Prime vertical circle","abbr":"PV","plain":"동점·천정·서점을 지나는 수직권"},{"ko":"[[수직권·주수직권|수직권]]","en":"Vertical circle","plain":"천정과 천저를 지나는 큰 원"},{"ko":"[[관측자의 천의 자오선·자오선정중|관측자의 자오선]]","en":"Observer's celestial meridian","plain":"천정과 하늘의 양극을 지나는 남북선"},{"ko":"[[6시권]]","en":"Six hour circle","plain":"동점·서점을 지나는 시권. 동서권과 다른 원"}],"why":"동서권은 [[방위·방위각|방위각]] 앞 글자 N·S를 가르는 경계선이다. 또 천체가 동서권 근처에 있을 때 관측하면, 추측위도가 조금 틀려도 경도를 구한 결과에는 거의 영향이 없다고 알려져 있다.[5] 그래서 예전 항해에서는 경도를 구하는 관측을 이때 하는 것이 좋다고 했다.[5]","body":["동서권은 관측자의 자오선과 직교한다. 그래서 그 위에 있는 천체는 정동 또는 정서에 보인다. 그림 1.18에서 대권 ZENaW가 동서권이다.[1]","방위로 말하면 동서권의 동쪽 반원 위 천체는 방위 090°, 서쪽 반원 위 천체는 방위 270°다.[2]","동서권은 방위각의 N·S를 가르는 경계이기도 하다. 교재는 방위각 앞의 N·S를 천체가 동서권의 북쪽에 있는지 남쪽에 있는지로 정한다고 설명한다.[3]","수평좌표계의 [[자오선평면도]]에서 동서권은 천정과 천저를 잇는 직선 ZNa로 그려진다.[4] 자오선 평면에 수직으로 서 있는 원이라, 옆에서 보면 선 하나로 보이기 때문이다.",{"table":{"head":["적위와 위도의 관계","동서권을 지나는가"],"rows":[["같은 이름, 적위 < 위도","수평선 위에서 정동·정서를 지난다"],["같은 이름, 적위 > 위도","정동·정서까지 오지 못한다. 뜬 뒤 한동안 지나서 동서권에 가장 가까워진다"],["다른 이름","뜨고 질 때 동서권에 가장 가깝고, 수평선 위에서는 지나지 않는다"]]},"caption":"천체가 동서권을 지나는 조건 (바깥 자료)"}],"confusions":"동서권과 [[6시권]]은 둘 다 동점·서점을 지나지만 다른 원이다. 동서권은 천정을 지나는 수직권이고, 6시권은 천의 극을 지나는 시권이다. 천체가 동서권 위에 있으면 방위가 090°·270°이고, 6시권 위에 있으면 자오선각이 90°다.","key":["동서권(PV) = 동점·서점을 지나는 수직권 (ZENaW)","관측자의 자오선과 직교 → 그 위의 천체는 정동(090°)·정서(270°)","6시권(천의 극을 지나는 시권)과 구별"],"footnotes":["교재 15–16쪽, 그림 1.18.","교재 밖 보충 설명.","교재 27쪽. 이 규칙은 가까운 쪽(N·S)을 기준으로 90°까지 나타낸 방위각에 맞는다. 동명극 기준으로 180°까지 나타낼 때는 앞 글자가 늘 동명극의 이름이다(예: 교재 163쪽 S146°.8E).","교재 26쪽, 그림 1.29.","교재 밖 보충 설명. 동서권은 천정과 동점·서점을 지나며 자오선과 직각인 수직권이고, 천체가 그 위에 있으면 정동 또는 정서에 있다. 천체가 정동·정서에 올 수 있는 것은 적위가 위도와 같은 이름이고 위도보다 작을 때뿐이다. 동서권 위의 천체를 관측하면 추측위도의 오차가 경도 결과에 거의 영향을 주지 않아, 경도 관측에 좋은 때로 꼽혔다. 참고: [Prime vertical — Wikipedia](https://en.wikipedia.org/wiki/Prime_vertical), [Altazimuth Coordinates — LibreTexts (Tatum, Celestial Mechanics)](https://phys.libretexts.org/Bookshelves/Astronomy__Cosmology/Celestial_Mechanics_(Tatum)/06%3A_The_Celestial_Sphere/6.02%3A_Altazimuth_Coordinates)."],"flags":[{"kind":"해석","text":"교재 27쪽 ‘방위각 앞 N·S는 천체가 동서권의 북쪽·남쪽인지로 정한다’를 90° 방식 방위각의 규칙으로 풀었다. 180° 방식(163쪽 S146°.8E, 천체는 동서권 북쪽)에서는 앞 글자가 동명극이다.","fn":3},{"kind":"교재 밖","text":"천체가 동서권을 지나는 조건(적위가 위도와 같은 이름이고 위도보다 작을 때)과, 동서권 근처 관측이 경도 결정에 유리하다는 내용을 바깥 자료에서 덧붙였다.","fn":5}]},{"title":"고도·고도의 거등권","easy":["수평선을 보다가 고개를 들어 별을 올려다본다. 이때 고개를 든 각도가 별의 **고도**(Altitude, h)다. 수평선에 걸린 별은 0°, 머리 꼭대기의 별은 90°다.[2]","머리 꼭대기에서 아래로 내려 잰 각은 [[정거]]라고 한다. 고도 30°인 별은 천정에서 60° 떨어져 있어서, 고도와 정거를 더하면 늘 90°가 된다.[7]","하늘에서 고도가 같은 점들을 이으면 천정을 중심으로 한 동그란 고리가 된다. 과녁의 동심원과 같은 모양이다. 이 고리가 **고도의 거등권**(Parallel of altitude)이다.[1]"],"definition":"천체를 지나는 수직권(Vertical circle) 위에서 천체와 진수평(Celestial horizon) 사이의 호를 그 천체의 고도(Altitude, Alt. 또는 h)라 한다. 천체를 지나고 수평권에 평행한 소권을 고도의 거등권 또는 등고도권(Parallel of altitude, Altitude circle)이라 한다.[1]","terms":[{"ko":"고도","en":"Altitude","abbr":"h","plain":"진수평에서 천체까지 올려다본 각"},{"ko":"고도의 거등권","en":"Parallel of altitude","plain":"고도가 같은 점을 이은 원, 등고도권"},{"ko":"수정고도","en":"Rectified altitude","abbr":"hr","plain":"거소수평에서 잰 고도"},{"ko":"겉보기고도","en":"Apparent altitude","abbr":"App. Alt.","plain":"거소수평 기준 고도, 고도개정표에 쓰는 값"},{"ko":"[[Sextant 고도·관측고도|관측고도]]","en":"Observed altitude","abbr":"Ho","plain":"잰 고도를 모두 고친 최종 고도"},{"ko":"[[계산고도·계산방위각|계산고도]]","en":"Computed altitude","abbr":"Hc","plain":"가정위치에서 계산으로 구한 고도"}],"why":"천측은 결국 고도를 재는 일이다. [[육분의]]로 잰 고도를 고쳐 관측고도(Ho)를 얻고, 가정위치에서 계산한 [[계산고도·계산방위각|계산고도(Hc)]]와 비교한다. 두 값의 차이로 위치선을 긋는 방법이 [[고도차법]]이다.[5]","body":["고도는 천체의 수직권(천체를 지나는 [[수직권·주수직권|수직권]])을 따라 [[수평의 종류|진수평]]에서 천체까지 잰다.[1] 수평 위의 천체는 0°, 천정의 천체는 90°다.[2] 천정에서 잰 정거와 더하면 90°가 된다.","천체의 수직권 위에서 천체와 거소수평(Sensible horizon) 사이의 호는 **수정고도**(Rectified altitude, hr) 또는 **겉보기고도**(Apparent altitude, App. Alt.)라 부르기도 한다.[1] 교재는 저고도 관측에서 [[Sextant 고도·관측고도|Sextant 고도]]에 [[육분의 오차·기차개정|기차개정]](Index correction, IC)과 [[안고차]](Dip, D)를 가감한 값을 고도개정표의 겉보기고도로 쓴다.[3]",{"table":{"head":["이름","영문","어디서부터 잰 고도"],"rows":[["고도","Altitude (Alt., h)","진수평"],["수정고도·겉보기고도","Rectified altitude (hr) · Apparent altitude (App. Alt.)","거소수평"]]},"caption":"기준 수평에 따른 고도의 이름"},"**고도의 거등권**(Parallel of altitude, Altitude circle) 위의 모든 점은 고도가 같다. 진수평과 나란한 소권이므로, [[적위의 거등권]]을 [[수평좌표계]]로 옮겨 놓은 것에 해당한다.[1][4]","고도와 방위는 관측자의 위치와 시간에 따라 변하므로, 천체의 위치를 기록해 두기에는 불편하다.[4] 대신 항해에서는 바로 이 성질을 이용한다. 관측한 고도를 가정위치에서 계산한 계산고도와 비교해 위치선을 긋는 것이다.[5]"],"confusions":"교재는 천구 위의 고도의 거등권(17쪽)과 지구 위의 [[위치권]](157쪽, Circle of equal altitude)을 모두 ‘등고도권’이라 부른다. 앞의 것은 천정을 중심으로 한 천구 위의 원이고, 뒤의 것은 [[천체의 지위]]를 중심으로 지구 위에 그린 원이다.[6] 또 교재는 안고(눈의 높이)도 h로 쓴다.","key":["고도 h = 천체의 수직권을 따라 진수평에서 천체까지 잰 호","수정고도(hr)·겉보기고도(App. Alt.) = 거소수평 기준 고도","고도의 거등권(등고도권) = 수평권에 평행한 소권, 같은 고도의 점들","고도 + 정거 = 90°"],"footnotes":["교재 16–17쪽, 그림 1.19.","교재 밖 보충 설명.","교재 66–67쪽. 일반 고도에서는 Sextant 고도를 그대로 겉보기고도로 보고 표를 찾는다.","교재 23–24쪽, 표 1.2.","교재 159–160쪽.","교재 157쪽.","교재 밖 보충 설명. 고도는 천체와 관측자의 수평 사이의 각이고, 천정에서 잰 각(zenith angle)과 서로 여각이라 둘의 합은 90°다. 예를 들어 고도 30°인 별의 천정각은 60°다. 참고: [Horizontal coordinate system — Wikipedia](https://en.wikipedia.org/wiki/Horizontal_coordinate_system), [Zenith — Wikipedia](https://en.wikipedia.org/wiki/Zenith)."],"flags":[]},{"title":"정거","easy":["고도는 수평선에서 위로 잰 각이다. 반대로 머리 꼭대기(천정)에서 아래로 내려 천체까지 잰 각이 **정거**(Zenith distance, ZD)다. 고도가 바닥에서 잰 높이라면, 정거는 천장에서 잰 거리다.","둘은 같은 선 위에서 양 끝에서 잰 값이라 더하면 늘 90°다. 그래서 고도 60°인 천체의 정거는 30°다.","정거는 지구 위의 거리로 곧장 바뀐다. 지구 중심에서 1′(1/60°)의 각은 지구 표면에서 1해리이므로, 정거 30°는 30 × 60 = 1,800해리다.[6] 관측자는 천체 바로 아래 지점에서 이만큼 떨어진 원 위에 있다."],"definition":"천정(Zenith)에서 천체까지 수직권(Vertical circle)을 따라 잰 호의 길이를 정거 또는 천정거리(Zenith distance, ZD 또는 z)라 하며, 고도(Altitude)의 여호다. 곧 z = 90° − h다.[1]","terms":[{"ko":"정거","en":"Zenith distance","abbr":"ZD","plain":"천정에서 천체까지 잰 각, 90° − 고도"},{"ko":"여고도","en":"Coaltitude","plain":"정거의 다른 이름, 항해삼각형의 한 변"},{"ko":"[[고도·고도의 거등권|고도]]","en":"Altitude","abbr":"h","plain":"진수평에서 천체까지 잰 각"},{"ko":"[[천체의 지위]]","en":"Geographical position","abbr":"GP","plain":"천체 바로 아래 지구 위의 점"},{"ko":"[[위치권]]","en":"Circle of equal altitude","plain":"지위를 중심, 정거를 반지름으로 한 원"},{"ko":"[[고도차법|고도차]]","en":"Intercept","abbr":"a","plain":"관측고도와 계산고도의 차, Ho − Hc"}],"why":"육분의로 고도를 재면 정거를 알게 되고, 정거는 [[천체의 지위]]를 중심으로 한 [[위치권]]의 반지름이 된다.[3] [[고도차법]]에서는 계산정거와 관측정거의 차가 곧 고도차(Ho − Hc)이며, 이 차만큼 위치선을 옮겨 긋는다.[4]","body":["정거와 [[고도·고도의 거등권|고도]]는 같은 수직권 위에서 반대쪽 끝(천정과 수평)에서 잰 값이라, 둘을 더하면 90°다. 그림 1.20에서 ZM이 천체 M의 정거다.[1]",{"formula":"z = 90° − h"},"z는 정거, h는 고도다. 고도가 높을수록 정거는 작아지고, 천체가 천정에 있으면 정거는 0°다.","정거는 [[항해삼각형]]의 한 변으로, 여고도(Coaltitude)라고도 부른다.[2] 또 위치권의 반지름이 된다. 교재는 고도 60°를 잰 경우 위치권의 반지름이 (90° − 60°) × 60해리 = 1,800해리라고 예를 든다.[3]",{"table":{"head":["순서","계산","값"],"rows":[["① 잰 고도 h","교재 예","60°"],["② 정거 z","90° − 60°","30°"],["③ 해리로 바꾸기","30 × 60해리 (1° = 60해리)","1,800해리"]]},"caption":"교재 158쪽 예 — 위치권의 반지름 구하기"},"고도차법은 가정위치에서의 계산정거와 관측위치에서의 관측정거의 차가 곧 Ho − Hc라는 점을 이용한다.[4] 아래 표에서 두 정거의 차와 두 고도의 차가 같다는 것을 확인할 수 있다.",{"table":{"head":["항목","고도","정거 (90° − 고도)"],"rows":[["관측고도 Ho","36°06′.7","53°53′.3"],["계산고도 Hc","35°51′.4","54°08′.6"],["차","15′.3","15′.3"]]},"caption":"교재 163쪽 Sun Sighting 예제 값으로 계산 — 정거의 차 = 고도차 a(15′.3T)"}],"confusions":"기호에 주의한다. 1장은 정거를 소문자 z, 방위각을 대문자 Z로 쓴다. 8장은 정거를 zd(Zd)로 쓰고, 157쪽 그림에서는 천정의 각(방위각)을 z로 적는다.[5]","key":["정거 z(ZD) = 천정에서 천체까지 수직권을 따라 잰 호","z = 90° − h (고도의 여호 = 여고도)","위치권의 반지름 = 정거, 1° = 60해리"],"footnotes":["교재 17쪽, 그림 1.20.","교재 21쪽.","교재 157–158쪽.","교재 160쪽, 163쪽.","교재 17쪽, 155–157쪽.","교재 밖 보충 설명. 정거 = 90° − 고도이고, 지구 중심에서 1′의 각은 지구 표면에서 1해리의 호가 되므로 정거 30°는 1,800해리다. 정거는 관측자에서 천체의 지위까지의 거리다. 참고: [The role of altitude, azimuth and zenith distance in astro navigation — Astro Navigation Demystified](https://astronavigationdemystified.com/the-role-of-altitude-azimuth-and-zenith-distance-in-astro-navigation/)."],"flags":[{"kind":"계산 확인","text":"교재 158쪽 (90° − 60°) × 60해리 = 1,800해리. 재계산 일치.","fn":3},{"kind":"계산 확인","text":"교재 163쪽 예제 값으로 90° − 36°06′.7 = 53°53′.3, 90° − 35°51′.4 = 54°08′.6을 구했다. 두 정거의 차 15′.3은 교재의 고도차 a 15′.3T와 일치한다.","fn":4}]},{"title":"방위·방위각","easy":["나침반 눈금처럼 북을 0°로 놓고 시계방향으로 한 바퀴 돌며 천체의 방향을 읽는다. 동쪽은 090°, 남쪽은 180°, 서쪽은 270°다. 이렇게 숫자 하나로 읽는 값이 **방위**(Azimuth, Zn)다.[5]","같은 방향을 ‘북에서 서쪽으로 37°’처럼 기준과 돌아간 쪽을 글자로 붙여 말할 수도 있다. 이렇게 쓴 값이 **방위각**(Azimuth angle, Z)이며 N37°W로 적는다. 방위로 고치면 360° − 37° = 323°다.[1]","앞 글자(N 또는 S)는 어디서부터 쟀는지, 뒤 글자(E 또는 W)는 어느 쪽으로 돌았는지를 뜻한다. 그래서 S30°E는 남쪽에서 동쪽으로 30°, 곧 방위 150°다.[5]"],"definition":"천체를 지나는 수직권(Vertical circle)과 관측자의 천의 자오선(Observer's celestial meridian)이 천정에서 이루는 각, 또는 그 사이 수평권의 호를 북을 000°로 하여 시계방향(Clockwise)으로 360°까지 잰 것이 방위(Azimuth, Zn)다. 같은 각을 동명극을 0°로 하여 동 또는 서쪽으로 180°까지, 또는 가까운 쪽을 기준으로 90°까지 잰 것을 방위각(Azimuth angle, Z 또는 Az)이라 한다.[1]","terms":[{"ko":"방위","en":"Azimuth","abbr":"Zn","plain":"북 000°에서 시계방향으로 360°까지 잰 방향"},{"ko":"방위각","en":"Azimuth angle","abbr":"Z","plain":"N·S에서 E·W로 잰 각, 예: N37°W"},{"ko":"[[천의 극·천의 축|동명극]]","en":"Elevated pole","abbr":"Pn/Ps","plain":"관측자 위도와 같은 이름의 천의 극"},{"ko":"[[수직권·주수직권|수직권]]","en":"Vertical circle","plain":"천정과 천저를 지나는 큰 원"},{"ko":"[[방위의 기준점|북점]]","en":"North point","plain":"방위 000°, 방위를 재는 출발점"}],"why":"[[천측계산표]]나 계산식으로 구한 방위각 Z는 N·S·E·W가 붙은 형태로 나온다. 그러나 [[위치기입도 작도|위치기입도]]에 위치선을 그리려면 방위 Zn으로 고쳐야 한다.[3] 가정위치에서 이 방위 방향으로 선을 긋고, 고도차만큼 떨어진 점에서 그 선에 수직으로 그은 선이 위치선이다.[6]","body":["방위각은 두 방식으로 쓴다. [[천의 극·천의 축|동명극]]을 0°로 하여 동 또는 서쪽으로 180°까지 재거나, 가까운 쪽(N 또는 S)을 기준으로 90°까지 잰다. 앞에는 기준이 되는 점에 따라 N 또는 S를, 뒤에는 잰 방향에 따라 E 또는 W를 붙인다.[1]","방위각을 방위로 바꾸는 규칙은 다음과 같다. Z는 방위각의 숫자 부분이다.[2]",{"table":{"head":["방위각","방위 Zn"],"rows":[["N Z° E","Z"],["N Z° W","360° − Z"],["S Z° E","180° − Z"],["S Z° W","180° + Z"]]},"caption":"방위각 → 방위"},"규칙을 외우기보다 그림으로 떠올리는 편이 쉽다. N에서 출발하면 0°, S에서 출발하면 180°에서 시작한다. 그다음 E 쪽(시계방향)으로 돌면 더하고, W 쪽으로 돌면 뺀다. 단 N에서 W로 돌 때는 360°에서 뺀다.",{"table":{"head":["출처","방위각","계산","방위"],"rows":[["교재 17쪽","N37°W","360° − 37°","323°"],["교재 26쪽","N70°W","360° − 70°","290°"],["교재 163쪽","S146°.8E","180° − 146°.8","033°.2"]]},"caption":"교재 예제로 확인"},"163쪽 예제는 관측자가 남위(aL 35°00′.0S)라서 동명극 S를 기준으로 180° 방식으로 적었다. 천측계산표에서 찾는 방위각 Z가 이 방식이며, 위치선을 그리려면 방위 Zn으로 고쳐야 한다.[3]","방위각 뒤의 E·W는 천체가 [[관측자의 천의 자오선·자오선정중|관측자의 자오선]] 동쪽에 있으면 E, 서쪽에 있으면 W이며, [[지방시각·자오선각|자오선각]]의 E·W와 같다.[4]"],"confusions":"방위(Zn)는 숫자 하나(000°~360°), 방위각(Z)은 글자가 붙은 값(N37°W)이다. 90° 방식의 앞 글자는 가까운 쪽(N·S), 180° 방식의 앞 글자는 늘 동명극이다. [[출몰방위각]]은 N·S가 아니라 동점·서점에서 잰다.","key":["방위 Zn: 북 000°에서 시계방향으로 360°까지","방위각 Z(Az): 동명극에서 E·W로 180°까지, 또는 가까운 쪽(N·S)에서 90°까지","앞 = N/S(기준), 뒤 = E/W(방향, 자오선각과 같은 이름)","N…W → 360° − Z, S…E → 180° − Z, S…W → 180° + Z"],"footnotes":["교재 17–18쪽, 그림 1.20. 교재는 90° 방식의 기준을 ‘가까운 쪽의 극’이라고 적었다. 수평권 위에서는 북점 또는 남점이 기준이 된다.","교재 밖 보충 설명. 교재는 바꾸는 규칙을 따로 싣지 않았다.","교재 162–163쪽.","교재 27쪽, 162쪽.","교재 밖 보충 설명. 항해에서 방위(azimuth)는 북을 기준으로 시계방향으로 잰 수평 각이다. 사분 방식에서는 앞 글자가 늘 N 또는 S(기준), 뒤 글자가 E 또는 W(돌아간 방향)이며, S30°E는 남에서 동으로 30°, 곧 시계방향 150°다. 참고: [Azimuth — Wikipedia](https://en.wikipedia.org/wiki/Azimuth).","교재 160쪽."],"flags":[{"kind":"계산 확인","text":"교재 17쪽 N37°W → 360° − 37° = 323°, 26쪽 방위 290° → N70°W, 163쪽 S146°.8E → 180° − 146°.8 = 033°.2. 모두 재계산 일치."},{"kind":"교재 밖","text":"방위각 → 방위 변환 규칙 표를 덧붙였다. 교재 예제 세 개로 확인했다.","fn":2}]},{"title":"출몰방위각","easy":["해 뜨는 자리는 날마다 조금씩 옮겨 간다. 정동에서 뜨는 날도 있고, 정동보다 북쪽이나 남쪽으로 비켜 뜨는 날도 있다. 해가 뜨거나 질 때 정동·정서에서 얼마나 비켜 있는지 잰 각이 **출몰방위각**(Amplitude, Amp.)이다.","읽는 법은 ‘뜰 때인지 질 때인지’, ‘몇 도’, ‘북쪽인지 남쪽인지’ 순서다. 예를 들어 E15°S는 정동에서 남쪽으로 15° 비켜 뜬 것이고, 방위로는 090° + 15° = 105°다.[1]","천문항해의 각 가운데 동점·서점에서부터 재는 것은 출몰방위각뿐이다.[4] 태양은 [[적위]]가 N인 춘분에서 추분 사이에는 정동보다 북쪽에서 떠서 정서보다 북쪽으로 진다.[3]"],"definition":"천체가 수평권상에 있을 때(뜨거나 질 때) 동점(East point) 또는 서점(West point)에서 천체까지의 수평권의 호를 90° 이내의 각으로 나타낸 것을 출몰방위각(Amplitude, Amp. 또는 A)이라 한다. 앞에는 출시에 E, 몰시에 W를 붙이고, 뒤에는 잰 방향에 따라 N 또는 S를 붙인다.[1]","terms":[{"ko":"출몰방위각","en":"Amplitude","abbr":"Amp.","plain":"뜨고 질 때 정동·정서에서 비켜 간 각"},{"ko":"[[방위의 기준점|동점·서점]]","en":"East point · West point","plain":"출몰방위각을 재는 출발점"},{"ko":"[[적위]]","en":"Declination","abbr":"Dec","plain":"하늘의 적도에서 천체까지 남북으로 잰 각"},{"ko":"컴퍼스 오차","en":"Compass error","plain":"컴퍼스 방위와 참방위의 차이"},{"ko":"[[방위·방위각|방위]]","en":"Azimuth","abbr":"Zn","plain":"북에서 시계방향으로 잰 방향"}],"why":"배에서는 해가 뜨거나 질 때 컴퍼스로 그 방위를 재고, 계산한 출몰방위각과 비교해 컴퍼스 오차를 찾는다.[4] 하늘은 컴퍼스와 상관없이 방향을 알려 주는 기준이기 때문이다. 해의 중심이 진수평에 오는 때는, 해의 아래 가장자리가 보이는 수평선 위로 지름의 약 2/3쯤 떠 있을 때다.[4]","body":["출몰방위각은 천체가 뜨고 지는 순간, 곧 수평권상에 있을 때만 쓴다. 기준은 북점·남점이 아니라 [[방위의 기준점|동점과 서점]]이다.[1]","앞에는 뜰 때(출시) E, 질 때(몰시) W를 붙이고, 뒤에는 잰 방향에 따라 N 또는 S를 붙인다. 교재 예제의 Amp. E15°S는 동점에서 남쪽으로 15° 떨어진 곳에서 뜬 천체이며, 방위로는 105°다.[1]","출몰방위각을 방위로 바꾸는 규칙은 다음과 같다.[2]",{"table":{"head":["출몰방위각","방위 Zn"],"rows":[["E A° N","090° − A"],["E A° S","090° + A"],["W A° S","270° − A"],["W A° N","270° + A"]]},"caption":"출몰방위각 → 방위 (A는 출몰방위각)"},"출몰방위각의 N·S는 그 천체의 적위 이름과 같다. 적위가 N인 천체는 정동보다 북쪽에서 떠서 정서보다 북쪽으로 진다.[3] 천체가 진수평에 있는 순간의 출몰방위각은 다음 식으로 구한다.[3]",{"formula":"sin Amp = sin d / cos L"},"d는 천체의 적위, L은 관측자의 위도다. 천체가 진수평에 있는 순간(진고도 0°)의 식이라 고도가 들어가지 않는다. 예를 들어 위도 35°N에서 적위 20°N인 천체는 sin Amp = sin 20° / cos 35° ≈ 0.418이므로 Amp ≈ 24°.7이다. 뜰 때라면 E24°.7N, 방위로는 090° − 24°.7 = 065°.3이다.","항해에서는 태양의 출몰 방위를 재어 컴퍼스 오차를 확인하는 데 쓴다.[3]"],"confusions":"[[방위·방위각|방위각]]은 북점·남점을 기준으로 앞에 N·S를 붙이고, 출몰방위각은 동점·서점을 기준으로 앞에 E·W를 붙인다. 글자 순서가 반대다.","key":["출몰방위각(Amp.) = 출몰 때 동점·서점에서 천체까지 90° 이내의 호","앞 = E(출시)/W(몰시), 뒤 = N/S(잰 방향)","E15°S ↔ 방위 105° (090° + 15°)","N·S는 그 천체의 적위 이름과 같다"],"footnotes":["교재 18쪽, 그림 1.21.","교재 밖 보충 설명.","교재 밖 보충 설명. 천체가 진수평상에 있을 때(진고도 0°) sin Amp = sin d / cos L (d는 적위, L은 위도)이므로, Amp의 N·S는 적위의 N·S와 같다. 같은 식(sin A = sin d sec L)과 이름 규칙은 [Bowditch, American Practical Navigator (2019) Chapter 15 Azimuths and Amplitudes](https://thenauticalalmanac.com/2019_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2015-%20Azimuths%20And%20Amplitudes.pdf)에도 있다.","교재 밖 보충 설명. 출몰방위각은 천문항해의 각 가운데 동 또는 서에서 재는 유일한 각이다. 계산한 값과 컴퍼스로 잰 값의 차가 컴퍼스 오차다. 태양은 아래 가장자리가 시수평 위로 지름의 약 2/3 높이에 있을 때 중심이 진수평에 있고(기차·안고차·겉보기반지름 때문), 항성·행성은 시수평 위로 태양 지름만큼 높이에 있을 때 진수평에 있다. 참고: [Bowditch, American Practical Navigator (2019) Chapter 15 Azimuths and Amplitudes](https://thenauticalalmanac.com/2019_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2015-%20Azimuths%20And%20Amplitudes.pdf)."],"flags":[{"kind":"계산 확인","text":"교재 18쪽 예제 Amp. E15°S → 090° + 15° = 105°. 재계산 일치.","fn":1},{"kind":"교재 밖","text":"출몰방위각 → 방위 변환 규칙, ‘N·S = 적위의 이름’, 공식 sin Amp = sin d / cos L, 컴퍼스 오차 확인 용도를 덧붙였다.","fn":3},{"kind":"교재 밖","text":"‘동·서에서 재는 유일한 각’, 태양 아래 가장자리가 시수평 위 지름 약 2/3일 때 중심이 진수평에 있다는 관측 요령을 Bowditch 15장에서 덧붙였다.","fn":4},{"kind":"계산 확인","text":"보충 예제(교재 밖): 위도 35°N, 적위 20°N → sin Amp = sin 20°/cos 35° = 0.4175, Amp = 24°.68 ≈ 24°.7, 출시 방위 090° − 24°.7 = 065°.3. python으로 계산했다.","fn":3}]},{"title":"지방시각·자오선각","easy":["별과 태양은 하루에 한 바퀴씩 동쪽에서 떠서 서쪽으로 진다. 그래서 천체가 지금 어디쯤 있는지를 ‘내 머리 위를 지나는 남북선에서 서쪽으로 얼마나 지나갔나’로 말할 수 있다. 이 각이 **지방시각**(Local Hour Angle, LHA)이다.","머리 위를 지나 정북과 정남을 잇는 하늘의 선을 [[관측자의 천의 자오선·자오선정중|관측자의 자오선]](Meridian)이라고 한다. 태양이 이 선을 지나는 순간이 그 장소의 정오이고, 그때 태양의 LHA는 0°다. 하늘은 1시간에 15°씩 도는 셈이므로, 정오 1시간 뒤 태양의 LHA는 약 15°, 6시간 뒤에는 약 90°가 된다.[2]","LHA는 언제나 서쪽으로만 0°에서 360°까지 센다. 그러면 아직 떠오르는 중인 천체는 300°처럼 큰 숫자가 되어 감이 잘 오지 않는다. 그래서 자오선에서 가까운 쪽으로 ‘동쪽으로 60°’, ‘서쪽으로 45°’처럼 180°까지만 읽기도 하는데, 이 값이 **자오선각**(Meridian Angle, t)이다."],"definition":"관측자의 천의 자오선과 천체의 시권(Hour circle)이 천의 극에서 이루는 각, 또는 그 사이 천의 적도의 호를 관측자의 자오선에서 서쪽으로 0°~360° 잰 것이 지방시각(Local Hour Angle, LHA)이다. 같은 각을 동쪽 또는 서쪽으로 0°~180° 잰 것이 자오선각(Meridian Angle, t)이다.[1]","terms":[{"ko":"지방시각","en":"Local Hour Angle","abbr":"LHA","plain":"내 자오선에서 천체까지 서쪽으로 잰 각, 0°~360°"},{"ko":"자오선각","en":"Meridian Angle","abbr":"t","plain":"같은 각을 가까운 쪽(E 또는 W)으로 잰 값, 0°~180°"},{"ko":"[[관측자의 천의 자오선·자오선정중|자오선]]","en":"Meridian","plain":"머리 위를 지나 정북과 정남을 잇는 하늘의 선. LHA를 재는 출발선"},{"ko":"[[천의 자오선·시권|시권]]","en":"Hour circle","plain":"천의 북극과 남극을 지나며 천체를 통과하는 큰 원. LHA를 재는 도착선"},{"ko":"시각(時角)","en":"Hour angle","plain":"자오선에서 서쪽으로 잰 각. 시계 시간(時刻)과 다른 말"}],"why":"천측으로 배의 위치를 구할 때는 관측한 천체의 높이를 계산값과 비교한다. 그 계산에 들어가는 세 값이 내 위도, 천체의 [[적위]], 그리고 LHA다. LHA는 [[천측력]]에서 찾은 [[본초시각]](GHA)에 내 경도를 더하거나 빼서 얻는다. 자오선각 t는 [[구면삼각형의 계산|고도 계산식]]에 cos t 꼴로 들어간다.[3]","body":["천구는 동에서 서로 돌기 때문에 시간이 지날수록 천체의 LHA는 커진다.[1] 천체가 하루 중 가장 높이 올라 자오선을 지나는 순간, 곧 [[관측자의 천의 자오선·자오선정중|극상정중]] 때 LHA는 0°다. 그 뒤 서쪽으로 갈수록 90°, 180°로 늘고, 지평선 아래를 돌아 다시 떠오를 즈음에는 270°를 넘는다.[2]","자오선각 t는 숫자 뒤에 잰 방향 E(동) 또는 W(서)를 붙인다. LHA와 t는 다음처럼 바꿔 쓸 수 있다.[1]",{"formula":"t(W) = LHA,  360° − t(E) = LHA","label":"식 (1.3)"},{"list":["LHA가 0°~180°이면 천체는 자오선 서쪽에 있다. 이때 t = LHA이고 W를 붙인다.","LHA가 180°~360°이면 천체는 자오선 동쪽에 있다. 이때 t = 360° − LHA이고 E를 붙인다.","같은 이유로, 천체의 [[방위·방위각|방위]]가 180°보다 작으면(동쪽 하늘) t는 E, 180°보다 크면(서쪽 하늘) W다.[4]"]},{"table":{"head":["순서","계산","값"],"rows":[["① LHA","교재 예제 값","333°00′.0"],["② 180°보다 큰가?","333° > 180° → 동쪽 하늘","t는 E"],["③ t = 360° − LHA","360° − 333°00′.0","27°00′.0E"]]},"caption":"교재 163쪽 Sun Sighting 예제로 LHA를 t로 바꾸기"},"그리니치 자오선에서 잰 같은 종류의 각이 [[본초시각]](Greenwich Hour Angle, GHA)이다. LHA·GHA·[[항성시각|SHA]]의 관계는 하늘을 북극 위에서 내려다본 [[적도평면도]](시각도)에서 한눈에 보인다. 3D 장면 4(시각 실험실)에서 시간을 흘려 보내며 LHA가 늘어나는 모습을 볼 수 있다."],"confusions":"‘지방시각’의 ‘시각’은 시계의 시각(時刻)이 아니라 각도인 시각(時角, Hour angle)이다. 단위도 시간이 아니라 도(°)다. LHA는 서쪽으로만 360°까지, t는 가까운 쪽으로 180°까지 재고 E·W를 붙인다.","key":["LHA: 내 자오선에서 서쪽으로 0°~360°, 시간이 지나면 커진다","t: 동 또는 서로 0°~180°, 뒤에 E/W","t(W) = LHA, 360° − t(E) = LHA — 식 (1.3)","예: LHA 333° → t 27°E"],"footnotes":["교재 18–19쪽, 그림 1.22, 식 (1.3).","교재 밖 보충 설명. 천구가 24시간에 360° 돌므로 1시간에 15°다. 정오에 태양의 LHA가 0°인 것은 교재 12–13쪽 자오선정중의 정의에서 나온다. 참고: [Hour angle — Wikipedia](https://en.wikipedia.org/wiki/Hour_angle).","교재 21쪽, 157쪽 식 (8.4).","교재 27쪽."],"flags":[{"kind":"계산 확인","text":"교재 163쪽 예제 LHA 333°00′.0 → t = 360° − 333°00′.0 = 27°00′.0E. 재계산 일치."}]},{"title":"본초시각","easy":["세계의 모든 배가 함께 보는 공용 하늘 시계가 있다고 생각해 본다. 이 시계는 영국 그리니치를 지나는 자오선을 0°로 놓고, 천체가 거기서 서쪽으로 얼마나 지나갔는지를 잰다.[5] 이 각이 **본초시각**(Greenwich Hour Angle, GHA)이다.","[[천측력]](Nautical Almanac)에는 태양·달·행성 등의 GHA가 매시 정각마다 실려 있다.[6] 그래서 관측한 시각만 알면 그 순간의 GHA를 찾을 수 있다.","내 자리에서 본 값인 [[지방시각·자오선각|지방시각]](LHA)은 GHA에 내 경도를 더하거나 빼서 얻는다. 동경 30°에 있으면 내 자오선이 그리니치보다 30° 동쪽에 있다. 그래서 GHA 50°인 천체의 LHA는 50° + 30° = 80°다.[2]"],"definition":"Greenwich 자오선(Prime meridian)에 대한 지방시각(Local Hour Angle, LHA)을 그리니치시각 또는 본초시각(Greenwich Hour Angle, GHA)이라 한다. 따라서 LHA = GHA ± λ이다(경도가 E이면 +, W이면 −).[1]","terms":[{"ko":"본초시각","en":"Greenwich Hour Angle","abbr":"GHA","plain":"그리니치 자오선에서 서쪽으로 잰 천체의 시각"},{"ko":"[[지방시각·자오선각|지방시각]]","en":"Local Hour Angle","abbr":"LHA","plain":"내 자오선에서 서쪽으로 잰 천체의 시각"},{"ko":"경도","en":"Longitude","abbr":"λ","plain":"그리니치에서 동·서로 잰 내 위치"},{"ko":"[[가정위치|가정경도]]","en":"Assumed longitude","abbr":"aλ","plain":"계산하기 좋게 골라 쓰는 경도"},{"ko":"[[항성시각]]","en":"Sidereal Hour Angle","abbr":"SHA","plain":"춘분점에서 서쪽으로 잰 항성의 시각"},{"ko":"[[춘분점의 GHA]]","en":"GHA Aries","abbr":"GHA♈","plain":"춘분점의 본초시각, 항성 GHA의 출발점"}],"why":"천측력은 관측자가 어디 있는지 모르므로 그리니치 기준의 GHA만 싣는다. 항해사는 관측 시각(GMT)으로 GHA를 찾고, [[가정위치]]의 경도를 더하거나 빼서 LHA를 만든 뒤 계산고도를 구한다.[3][4] 곧 GHA는 ‘모두의 하늘 시계’를 ‘내 하늘 시계’로 바꾸는 출발값이다.","body":["GHA는 그리니치 자오선을 기준으로 천체의 시권까지 서쪽으로 0°~360° 잰 각이다. 관측자의 지방시각(LHA)과는 다음 관계가 있다.[1]",{"formula":"LHA = GHA ± λ","label":"식 (1.4)"},"λ는 관측자의 경도다. 경도의 이름에 따라 부호가 정해진다.",{"list":["경도 λ가 동경(E)이면 +","경도 λ가 서경(W)이면 −"]},"더한 값이 360°를 넘으면 360°를 빼고, 뺀 값이 음수이면 360°를 더한다. 예컨대 GHA 50°, 경도 70°W이면 LHA = 50° − 70° + 360° = 340°다.[2]",{"table":{"head":["순서","계산","값"],"rows":[["① GHA (GMT 01-20-55)","천측력에서 찾음","200°39′.6"],["② aλ (가정경도)","동경이므로 +","132°20′.4E"],["③ LHA = GHA + aλ","200°39′.6 + 132°20′.4","333°00′.0"],["④ t","360° − 333°00′.0","27°00′.0E"]]},"caption":"교재 163쪽 Sun Sighting 예제 — 2019년 4월 24일"},"8장 예제에서는 LHA가 정수도가 되도록 가정경도 aλ를 고른다.[3] 위 예제도 LHA가 333°00′.0으로 딱 떨어지게 aλ를 골랐다. GHA는 천측력에서 관측 시각(GMT)에 맞춰 구하며, 항성은 [[춘분점의 GHA|GHA♈]]에 [[항성시각|SHA]]를 더해 구한다([[항성의 GHA·Dec]]).[4]"],"confusions":"경도 부호를 반대로 쓰기 쉽다. 관측자가 그리니치보다 동쪽에 있으면 관측자의 자오선도 그만큼 동쪽에 있으므로, 서쪽으로 잰 LHA는 GHA보다 크다(+). 서쪽에 있으면 작다(−).[2]","key":["GHA = 그리니치 자오선에서 서쪽으로 잰 지방시각 (0°~360°)","LHA = GHA ± λ — 식 (1.4): 동경 +, 서경 −","360°를 넘으면 빼고, 음수면 360°를 더한다","항성: GHA = GHA♈ + SHA"],"footnotes":["교재 19쪽, 식 (1.4).","교재 밖 보충 설명.","교재 163쪽 〈주1〉.","교재 34–35쪽, 식 (1.5).","교재 밖 보충 설명. 천문항해에서는 시각을 그리니치 자오선(prime meridian)에서 서쪽으로 도(°) 단위로 재며, 이것이 GHA다. 참고: [Hour angle — Wikipedia](https://en.wikipedia.org/wiki/Hour_angle).","교재 밖 보충 설명. 천측력은 태양·달·행성과 춘분점(First Point of Aries)에 대해, 그 천체가 머리 위에 있는 지구 위의 점을 적위와 GHA로 매시 정각마다 싣는다. 참고: [Nautical almanac — Wikipedia](https://en.wikipedia.org/wiki/Nautical_almanac)."],"flags":[{"kind":"계산 확인","text":"교재 163쪽 예제: GHA 200°39′.6 + aλ 132°20′.4(동경이므로 +) = LHA 333°00′.0. 재계산 일치."}]},{"title":"6시권","easy":["하늘의 북극을 시계 한가운데로 놓고, 내 머리 위를 지나는 자오선을 12시 바늘로 생각해 본다. 이 바늘에서 정확히 직각으로 꺾인 바늘이 그리는 원이 있다. 이 원이 **6시권**(Six hour circle)이다.","하늘은 1시간에 약 15°씩 도니까 90°를 돌려면 약 6시간이 걸린다.[2] 그래서 천체가 이 원 위에 오면 자오선에서 6시간만큼 떨어져 있는 셈이다. 이름의 ‘6시’가 바로 이 뜻이다.","6시권은 땅 쪽에서 보면 정동과 정서, 곧 동점·서점을 지난다. 동쪽 6시권 위 천체의 LHA는 270°, 서쪽 6시권 위 천체는 90°다.[2]"],"definition":"동점(East point)과 서점(West point)을 지나는 천의 자오선(Celestial meridian)을 6시권(Six hour circle)이라 한다. 천체가 이 위에 올 때에는 자오선각(Meridian angle, t)이 항상 6시, 곧 90°다.[1]","terms":[{"ko":"6시권","en":"Six hour circle","plain":"동점·서점을 지나는 시권, 자오선각 90°"},{"ko":"[[지방시각·자오선각|자오선각]]","en":"Meridian angle","abbr":"t","plain":"내 자오선에서 E·W로 180°까지 잰 각"},{"ko":"[[천의 자오선·시권|시권]]","en":"Hour circle","plain":"하늘의 양극을 지나는 큰 원"},{"ko":"[[방위의 기준점|동점·서점]]","en":"East point · West point","plain":"진수평 위 정동·정서의 점"},{"ko":"[[동서권]]","en":"Prime vertical","abbr":"PV","plain":"동점·천정·서점을 지나는 수직권"}],"why":"6시권은 계산식에 직접 들어가는 값이라기보다 하늘의 그림을 읽는 눈금 역할을 한다. 자오선각 t가 90°보다 작으면 천체는 6시권보다 자오선 쪽에, 크면 6시권 너머에 있다. [[적도평면도]]에 시각을 그릴 때도 6시권은 자오선과 직각인 기준선이 된다.","body":["6시권(Six hour circle)은 천의 극과 [[방위의 기준점|동점·서점]]을 지나는 대권이다.[1] 동점과 서점은 [[천의 적도]] 위에서 관측자의 자오선과 90° 떨어진 점이므로, 6시권 위 천체의 [[지방시각·자오선각|자오선각]]은 90°다.[2]","1시간이 15°이므로 6시간은 90°다. 식 (1.3)에 따라 서쪽 6시권 위 천체는 t = 90°W(LHA 90°), 동쪽 6시권 위 천체는 t = 90°E(LHA 270°)다.[2]",{"table":{"head":["위치","자오선각 t","LHA","정중과의 시간 차"],"rows":[["동쪽 6시권","90°E","270°","극상정중 약 6시간 전"],["관측자의 자오선(극상정중)","0°","0°","—"],["서쪽 6시권","90°W","90°","극상정중 약 6시간 뒤"]]},"caption":"6시권과 자오선각·LHA"},"천체는 극상정중 약 6시간 전에 동쪽 6시권을, 약 6시간 뒤에 서쪽 6시권을 지난다.[2] 이름에 ‘시(時)’가 붙은 것은 6시권이 시권(Hour circle)의 하나이기 때문이다."],"confusions":"6시권과 [[동서권]]은 둘 다 동점·서점을 지나지만 다른 원이다. 6시권은 천의 극을 지나는 시권이고, 동서권은 천정을 지나는 수직권이다.","key":["6시권 = 동점·서점을 지나는 천의 자오선(시권)","6시권 위 천체: 자오선각 t = 90°(6시)","서쪽 6시권 LHA 90°, 동쪽 6시권 LHA 270°","동서권(천정을 지나는 수직권)과 구별"],"footnotes":["교재 20쪽.","교재 밖 보충 설명. 시각은 시간(24시간에 한 바퀴)이나 도(360°에 한 바퀴)로 나타내므로 1시간은 15°다. 참고: [Hour angle — Wikipedia](https://en.wikipedia.org/wiki/Hour_angle)."],"flags":[{"kind":"교재 밖","text":"6시권 위 천체의 자오선각이 90°인 이유(동점·서점이 천의 적도 위에서 자오선과 90°)와 LHA 값(90°·270°)을 덧붙였다.","fn":2}]},{"title":"위치각","easy":["하늘에 큰 삼각형 하나를 그린다. 꼭짓점은 하늘의 극, 내 머리 위 천정, 그리고 관측하는 별이다. 이것이 [[항해삼각형]]이다.","이 삼각형의 세 각에는 각각 이름이 있다. 하늘의 극에 있는 각은 자오선각, 천정에 있는 각은 방위각, 별에 있는 각이 **위치각**(Parallactic angle, X)이다.","별 위에 서서 하늘의 극 쪽과 내 천정 쪽을 바라본다고 생각하면 된다. 두 방향 사이에 벌어진 각이 위치각이다. 천체가 자오선을 지날 때는 세 점이 한 원 위에 놓여 위치각이 0° 또는 180°가 된다.[4]"],"definition":"천체를 지나는 수직권(Vertical circle)과 천의 자오선(천체의 시권, Hour circle)이 천체에서 이루는 각을 그 천체의 위치각(Parallactic angle 또는 Position angle, X)이라 한다. 위치각은 일반적으로 항해 문제를 푸는 데 자주 쓰이지 않는다.[1]","terms":[{"ko":"위치각","en":"Parallactic angle","abbr":"X","plain":"천체에서 수직권과 시권이 이루는 각"},{"ko":"[[항해삼각형]]","en":"Navigational triangle","plain":"극·천정·천체를 꼭짓점으로 한 구면삼각형"},{"ko":"[[지방시각·자오선각|자오선각]]","en":"Meridian angle","abbr":"t","plain":"항해삼각형에서 극에 있는 각"},{"ko":"[[방위·방위각|방위각]]","en":"Azimuth angle","abbr":"Z","plain":"항해삼각형에서 천정에 있는 각"},{"ko":"여위도","en":"Colatitude","plain":"90° − 위도, 극과 천정 사이의 변"}],"why":"천측으로 위치선을 구할 때 필요한 것은 고도와 방위각이라, 위치각은 거의 쓰지 않는다.[1][2] 다만 항해삼각형의 세 각 중 하나이므로, 삼각형 전체를 이해하려면 이름과 자리를 알아 두어야 한다. 천문대에서는 망원경 속 별 영상이 돌아가는 정도나 대기에 의한 빛 번짐 방향을 맞출 때 이 각을 쓴다.[4]","body":["위치각 X는 항해삼각형 PnZM의 세 꼭짓점 가운데 천체 M에 있는 각이다. 교재는 이를 시권과 수직권이 천체의 중심에서 이루는 각 PnMZ로 적는다.[2]",{"table":{"head":["꼭짓점","각","이름","마주 보는 변"],"rows":[["동명극 Pn","∠ZPnM","자오선각 t","정거 ZM"],["천정 Z","∠PnZM","방위각 Z","극거 PnM"],["천체 M","∠PnMZ","위치각 X","여위도 PnZ"]]},"caption":"항해삼각형의 세 각과 마주 보는 변"},"항해삼각형에서 위치각과 마주 보는 변은 여위도(PnZ)다.[3] 3D 장면 7(항해삼각형)에서 삼각형의 세 꼭짓점을 볼 수 있다.","교재는 위치각이 일반적으로 항해 문제를 푸는 데 자주 쓰이지 않는다고 적었다.[1] 위치선 계산에서 구하는 것은 고도와 방위각이기 때문이다.[2]"],"confusions":"영어 이름 Parallactic angle 때문에 [[시차·수평시차|시차]](Parallax)와 같은 것으로 착각하기 쉽다. 위치각은 항해삼각형의 한 각이고, 시차는 관측 위치 차이로 생기는 고도 차이다. 바깥 자료도 위치각은 시차와 관계없다고 적는다.[4]","key":["위치각 X = 천체에서 수직권과 시권이 이루는 각 (∠PnMZ)","항해삼각형의 세 각: 자오선각 t(극) · 방위각 Z(천정) · 위치각 X(천체)","항해에서는 자주 쓰지 않는다"],"footnotes":["교재 20쪽.","교재 21쪽.","교재 밖 보충 설명. 교재 155쪽은 정거와 마주 보는 각이 자오선각, 극거와 마주 보는 각이 방위각이라고 설명한다. 남은 변인 여위도와 마주 보는 각이 위치각이다.","교재 밖 보충 설명. 위치각(parallactic angle)은 천체와 천정을 지나는 대권과 천체의 시권 사이의 각이며, 이름과 달리 시차(parallax)와 관계가 없다. 천체가 자오선을 지날 때 0° 또는 180°다. 천문 관측에서는 대기 분산 보정 장치를 맞추거나 경위대식 망원경의 영상 회전을 계산할 때 쓴다. 참고: [Parallactic angle — Wikipedia](https://en.wikipedia.org/wiki/Parallactic_angle)."],"flags":[]},{"title":"항해삼각형","easy":["갑판에서 하늘을 둥근 지붕처럼 올려다보며 세 점을 찍어 보자. 하늘의 북극, 내 머리 바로 위의 점인 [[천정·천저|천정]](Zenith), 그리고 지금 재려는 별이다. 이 세 점을 하늘의 큰 원 조각으로 이은 삼각형이 **항해삼각형**(Navigational triangle)이다.","세 변의 길이는 모두 ‘90°에서 뺀 값’이다. 극에서 천정까지는 90° − 내 위도, 극에서 별까지는 90° − 별의 [[적위]], 천정에서 별까지는 90° − 별의 고도다. 예를 들어 위도 35°N에서는 극–천정 변이 55°가 된다.","두 변과 그 사이의 각을 알면 나머지 변과 각을 계산할 수 있다. 그래서 내 위도·별의 적위·[[지방시각·자오선각|자오선각]]을 넣으면, 그 별이 지금 몇 도 높이에 어느 방향으로 보여야 하는지가 나온다. 천측은 결국 이 삼각형 하나를 푸는 일이다.[2]"],"definition":"구면 위에서 대권(Great circle)의 호로 이루어진 삼각형을 구면삼각형(Spherical triangle)이라 하고, 천구 위의 구면삼각형을 천의 삼각형(Celestial triangle) 또는 천문삼각형(Astronomical triangle)이라 한다. 특히 항해에 쓸 때 이를 항해삼각형(Navigational triangle)이라 부르며, [[천의 극·천의 축|동명극]](Elevated pole) Pn, 관측자의 천정(Zenith) Z, 천체 M을 꼭짓점으로 한다.[1]","terms":[{"ko":"항해삼각형","en":"Navigational triangle","plain":"동명극·천정·천체를 꼭짓점으로 하는 하늘의 삼각형"},{"ko":"여위도","en":"Colatitude","plain":"극–천정 변. 90° − 위도"},{"ko":"여적위","en":"Codeclination (Polar distance)","plain":"극–천체 변. 90° ± 적위, 곧 [[극거]]"},{"ko":"여고도","en":"Coaltitude (Zenith distance)","plain":"천정–천체 변. 90° − 고도, 곧 [[정거]]"},{"ko":"[[위치각]]","en":"Parallactic angle","abbr":"X","plain":"천체 꼭짓점의 각. 항해에서는 잘 쓰지 않는다"},{"ko":"구면삼각형","en":"Spherical triangle","plain":"구면 위에서 대권의 호 세 개로 만든 삼각형"}],"why":"천측으로 선위를 구하는 [[고도차법]]은 이 삼각형을 푸는 일에서 시작한다. [[가정위치]]의 위도, [[천측력]]에서 찾은 적위, LHA에서 얻은 자오선각을 넣으면 [[계산고도·계산방위각|계산고도(Hc)와 계산방위각(Z)]]이 나온다. 이 Hc를 육분의로 재어 고친 관측고도(Ho)와 비교한 차이가 고도차(Intercept)이고, 이것으로 [[위치선]](Line of position)을 긋는다.[3]","body":["구면삼각형은 공 표면 위에서 대권, 곧 공의 중심을 지나는 큰 원의 호 세 개로 만든 삼각형이다. 그림 1.25의 항해삼각형 PnZM은 세 대권으로 이루어진다. [[관측자의 천의 자오선·자오선정중|관측자의 천의 자오선]] PnZPs, 천체의 [[천의 자오선·시권|시권]](Hour circle) PnMPs, 천체의 [[수직권·주수직권|수직권]](Vertical circle) ZMNa다.[1]","세 변과 세 내각은 다음 표와 같다. 변은 모두 각도(°)로 잰 호의 길이다.[1]",{"table":{"head":["구분","기호","이름","크기"],"rows":[["변","PnZ","여위도(Colatitude) — 관측자 위도의 여각","90° − L"],["변","ZM","여고도(Coaltitude) — 천체의 정거","90° − h"],["변","PnM","여적위(Codeclination) — 천체의 극거","90° ± d"],["각(Pn)","∠ZPnM","자오선각(Meridian angle) t — 자오선과 시권이 동명극에서 이루는 각","0°~180°, E 또는 W"],["각(Z)","∠PnZM","[[방위·방위각|방위각]](Azimuth angle) Z — 자오선과 수직권이 천정에서 이루는 각","동명극 쪽에서 0°~180°, E 또는 W"],["각(M)","∠PnMZ","위치각(Parallactic angle) X — 시권과 수직권이 천체 중심에서 이루는 각","—"]]},"caption":"항해삼각형의 3변과 3내각 (교재 21쪽, 그림 1.25)"},"변이 모두 ‘여(餘, co-)’인 까닭은 재는 출발점이 다르기 때문이다. 위도·적위·고도는 적도나 수평권에서 재지만, 삼각형의 변은 극이나 천정에서 잰다. 그래서 90°에서 뺀 값이 된다. 영문 자료는 천체를 X로 써서 이 삼각형을 PZX 삼각형이라 부르기도 한다.[4]","교재 26–27쪽 [[자오선평면도]]의 예(위도 35°N, 적위 30°N, LHA 80°)를 이 삼각형으로 풀어 보자. 두 변과 그 끼인각을 알면 [[구면삼각형의 계산|구면 코사인법칙]]으로 나머지를 구할 수 있다.",{"table":{"head":["순서","계산","값"],"rows":[["① 여위도 PnZ","90° − 35°","55°"],["② 여적위 PnM (동명)","90° − 30°","60°"],["③ 자오선각 t","LHA 80° → t(W) = LHA","80°W"],["④ 고도 h","sin h = sin 35° sin 30° + cos 35° cos 30° cos 80°","24°12′.2"],["⑤ 여고도 ZM","90° − 24°12′.2","65°47′.8"],["⑥ 방위각 Z","cos Z = (sin d − sin L sin h) / (cos L cos h)","N69°14′.3W"],["⑦ 위치각 X","sin X = sin t cos L / cos h","62°11′.1"]]},"caption":"교재 26–27쪽 예를 항해삼각형으로 다시 계산 (위키 계산)[5]"},"④에 쓴 식은 교재 8장의 고도 공식이다. 구면 코사인법칙을 항해삼각형에 적용해 얻는다.[6]",{"formula":"sin h = sin L · sin d + cos L · cos d · cos t","label":"식 (8.4)"},"h는 천체의 고도, L은 관측자의 위도, d는 천체의 적위, t는 자오선각이다.","항해삼각형의 꼭짓점을 지구 중심과 이으면 지구 표면에 같은 모양의 [[지문삼각형]]이 생긴다. 이 삼각형으로 어떤 문제를 푸는지는 [[항해삼각형의 용도]]에 정리했다. 3D 장면 7에서 세 꼭짓점과 변·각을 볼 수 있다."],"confusions":"세 변은 모두 90°에서 뺀 값이다. 다만 여적위(극거)는 위도와 적위가 이명이면 90° + d가 되어 90°를 넘는다. 또 꼭짓점의 극은 늘 동명극이므로, 남반구 관측자에게는 Ps가 꼭짓점이 된다.","key":["꼭짓점: 동명극 Pn · 천정 Z · 천체 M","변: 여위도 PnZ = 90° − L, 여고도 ZM = 90° − h, 여적위 PnM = 90° ± d","각: 자오선각 t(Pn), 방위각 Z(Z), 위치각 X(M)","예: L 35°N, d 30°N, t 80°W → h 24°12′.2, Z N69°14′.3W"],"footnotes":["교재 20–22쪽, 그림 1.24, 1.25.","교재 밖 보충 설명. 위도와 적위로 정해지는 두 변과 그 끼인각(LHA)을 알면 세 번째 변(천체까지의 거리)과 방향을 구할 수 있다는 설명은 다음을 참고했다. [Theory @ Celestial Navigation — celestialnavigation.net](https://celestialnavigation.net/theory/).","교재 157쪽 식 (8.4), 159쪽.","교재 밖 보충 설명. 영문 자료는 극 P, 천정 Z, 천체 X를 꼭짓점으로 하는 PZX 삼각형이라 부르고, P에서의 각을 LHA로 설명한다. 참고: [Navigational triangle — Wikipedia](https://en.wikipedia.org/wiki/Navigational_triangle). 위치각(Parallactic angle)은 천체 꼭짓점의 각이다. 참고: [Parallactic angle — Wikipedia](https://en.wikipedia.org/wiki/Parallactic_angle).","교재 밖 보충 설명. 고도는 교재 157쪽 식 (8.4) sin h = sin L sin d + cos L cos d cos t로, 방위각은 cos Z = (sin d − sin L sin h) / (cos L cos h)로, 위치각은 사인 법칙 sin X = sin t cos L / cos h로 계산했다. 교재는 같은 예를 작도해 고도 25°, 방위각 N70°W를 얻었다.","교재 밖 보충 설명. 고도 공식이 항해삼각형에 변의 코사인법칙을 적용해 얻어진다는 설명은 다음에 있다. [A Short Guide to Celestial Navigation — Henning Umland (PDF)](https://www.alliedseawindii.org/kbase/operations/navigation/celestial/astro.pdf)."],"flags":[{"kind":"계산 확인","text":"교재 26–27쪽 예(L 35°N, d 30°N, LHA 80°)를 구면삼각형 공식으로 풀면 고도 24°12′.2, 방위각 N69°14′.3W, 위치각 62°11′.1이다. 교재 작도값(25°, N70°W)과는 약 0°.8씩 차이 나며, 작도로 읽은 근삿값으로 본다.","fn":5}]},{"title":"지문삼각형","easy":["하늘의 세 점, 곧 극·천정·별에서 지구 중심을 향해 실을 내린다고 생각해 보자. 실은 지구 표면의 세 점을 뚫고 지나간다. 이 세 점을 이은 땅 위의 삼각형이 **지문삼각형**(Terrestrial triangle)이다.","극에서 내린 실은 지구의 북극에, 천정에서 내린 실은 내 발밑에 닿는다. 별에서 내린 실은 그 별이 바로 머리 위에 보이는 땅의 점에 닿는다. 이 점을 [[천체의 지위]](Geographical position, GP)라 한다.[2]","지구 위에서는 대권의 각 1′이 거리 1해리(Nautical mile)다. 그래서 내 위치와 GP 사이가 30°라면 둘은 30 × 60 = 1,800해리 떨어져 있다. 이 각이 곧 별의 [[정거]]다.[3]"],"definition":"[[항해삼각형]]의 각 꼭짓점을 지구 중심과 연결하면 지구 표면에도 항해삼각형과 닮은 지문삼각형(Terrestrial triangle)이 생기며, 이것도 항해삼각형이라 부른다. 두 개의 자오선(Meridian)과 각 자오선 위의 두 점을 잇는 대권(Great circle)으로 이루어지고, 관측자의 동명극, 천정 직하의 관측자의 [[가정위치]](Assumed position, AP), 천체 직하의 천체의 지위(Geographical position, GP)를 꼭짓점으로 한다.[1]","terms":[{"ko":"지문삼각형","en":"Terrestrial triangle","plain":"극·AP·GP를 꼭짓점으로 하는 지구 위의 삼각형"},{"ko":"가정위치","en":"Assumed position","abbr":"AP","plain":"계산하려고 실제 위치 근처에 정한 점"},{"ko":"천체의 지위","en":"Geographical position","abbr":"GP","plain":"천체가 바로 머리 위에 보이는 지구 위의 점"},{"ko":"정거","en":"Zenith distance","plain":"천정에서 천체까지의 각. AP–GP 사이 거리와 같다"},{"ko":"대권","en":"Great circle","plain":"지구 중심을 지나는 평면이 지표와 만나는 원"},{"ko":"해리","en":"Nautical mile","plain":"대권 위 각 1′에 해당하는 거리"}],"why":"천측에서 구하려는 것은 결국 지구 위 내 위치다. 지문삼각형은 하늘의 각을 지구 위 거리로 바꿔 준다. AP–GP 사이의 정거를 해리로 읽으면, 나는 GP를 중심으로 그 반지름의 원, 곧 [[위치권]](Circle of equal altitude) 위 어딘가에 있다.[4] 교재 8장의 [[고도차법]]은 이 원을 AP 근처에서 직선으로 바꿔 [[위치선]]으로 쓴다.","body":["지문삼각형은 두 자오선과, 각 자오선 위에 있는 두 점을 잇는 대권으로 이루어진다. 천정 Z 바로 아래의 점이 관측자의 AP, 천체 M 바로 아래의 점이 천체의 GP다.[1]","GP의 위도는 천체의 [[적위]]와 같고, 서쪽으로 잰 GP의 경도는 천체의 [[본초시각|GHA]]와 같다.[5] 그래서 하늘의 삼각형과 땅의 삼각형은 변과 각이 하나씩 짝을 이룬다.[6]",{"table":{"head":["천구(항해삼각형)","지구(지문삼각형)","크기"],"rows":[["꼭짓점 Pn · Z · M","극 P · AP · GP","—"],["여위도 PnZ","P–AP","90° − L"],["여적위 PnM","P–GP","90° ± d"],["여고도 ZM","AP–GP","가정위치에서의 정거 90° − Hc"],["자오선각 ∠ZPnM","∠AP-P-GP","t (AP에 대한 자오선각)"],["방위각 ∠PnZM","AP에서의 각","Z"]]},"caption":"교재 159쪽, 그림 8.7의 대응"},"교재는 AP와 GP를 대권항법의 출발지와 도착지에 비유한다.[1] AP에서 GP까지 대권을 따라 간다고 생각하면, 그 항정이 정거이고 첫 침로가 천체의 방위다. 이 대응은 [[항해삼각형의 용도]]의 (4)와 같다.",{"table":{"head":["순서","계산","값"],"rows":[["① AP–GP 정거(예)","90° − Hc, Hc = 60°일 때","30°"],["② 분(′)으로 바꾸기","30 × 60","1,800′"],["③ 해리로 읽기","1′ = 1해리","1,800해리"]]},"caption":"정거를 거리로 바꾸기 (위키 예시 값)[3]"},"깃대에서 3해리 떨어져 있다는 것만 알면, 나는 깃대를 중심으로 반지름 3해리인 원 위 어딘가에 있다. 천측에서는 GP가 깃대, 정거가 반지름이다.[7] 3D 장면 7과 10에서 GP와 위치권을 볼 수 있다."],"confusions":"천정 바로 아래의 점은 원래 관측자의 실제 위치다. 그러나 실제 위치는 구하려는 값이므로, 계산에서는 그 근처에 정한 가정위치(AP)를 꼭짓점으로 쓴다. 이것이 [[고도차법]]의 출발점이다.[6]","key":["꼭짓점: 극 P · AP(천정 직하) · GP(천체 직하)","P–AP = 90° − L, P–GP = 90° ± d, AP–GP = 정거, ∠P = t","GP의 위도 = 적위, GP의 경도(W) = GHA","정거(′) = 거리(해리). 예: 30° → 1,800해리"],"footnotes":["교재 21쪽.","교재 밖 보충 설명. 천체는 지구 위 한 점의 바로 위에 있고, 그 점의 위도·경도를 천체의 GP라 한다. 참고: [Celestial navigation — Wikipedia](https://en.wikipedia.org/wiki/Celestial_navigation).","교재 밖 보충 설명. 지구 위 대권의 호 1′은 1해리다. 예컨대 정거 30°는 30 × 60 = 1,800해리다. 교재 158쪽도 위치권을 설명하며 고도 60°이면 반지름이 (90° − 60°) × 60해리 = 1,800해리라고 같은 예를 든다.","교재 154–155쪽.","교재 152쪽, 식 (8.1), (8.2).","교재 159쪽, 그림 8.7.","교재 밖 보충 설명. 깃대에서 일정 거리 떨어진 위치가 원을 이룬다는 비유는 다음에서 가져왔다. [Theory @ Celestial Navigation — celestialnavigation.net](https://celestialnavigation.net/theory/)."],"flags":[{"kind":"해석","text":"교재 21쪽은 천정 직하의 점을 ‘관측자의 가정위치(AP)’라 했다. 위키는 엄밀히는 실제 위치이고 계산에서 AP로 대신한다고 풀었다(교재 159쪽 그림 8.7은 관측자 위치 O와 AP를 구별한다).","fn":6},{"kind":"교재 밖","text":"대권 호 1′ = 1해리로 정거를 거리로 바꾸는 설명을 덧붙였다(교재 158쪽 위치권 설명에도 같은 계산이 있다).","fn":3},{"kind":"계산 확인","text":"정거 예 (90° − 60°) × 60 = 1,800해리. 교재 158쪽 예와 재계산 일치.","fn":3}]},{"title":"항해삼각형의 용도","easy":["[[항해삼각형]]은 하나지만 푸는 방향은 여러 가지다. 무엇을 알고 무엇을 모르느냐에 따라 다른 문제가 된다. 교재는 배에서 실제로 푸는 문제를 네 가지로 정리한다.","가장 흔한 것은 내 위치를 가정하고, 별이 몇 도 높이에 어느 방향으로 보여야 하는지 계산하는 일이다. 예컨대 위도 35°N에서 적위 30°N인 별의 자오선각이 80°W이면 고도는 약 24°, 방위각은 약 N69°W다. 이 계산값을 실제로 잰 고도와 비교하면 위치선이 나온다.","거꾸로 이름 모를 별의 고도와 방위를 재면 그 별의 적위와 자오선각이 나온다. 이 값을 [[천측력]]의 별 목록과 맞추면 어떤 별인지 알 수 있다. 같은 계산을 지구 위 두 항구에 쓰면 대권항법의 첫 침로와 거리가 나온다."],"definition":"항해학의 공식을 유도할 때 항해삼각형(Navigational triangle)은 매우 중요하며, 일반적으로 (1) 천측계산을 통한 위치선(Line of position) 산정, (2) 미지의 천체 식별, (3) 고도를 알고 방위선 산정, (4) 대권항법(Great-circle sailing)에서 출발침로(Initial course)와 대권항정(Great-circle distance)의 산정에 쓰인다.[1]","terms":[{"ko":"항해삼각형의 용도","en":"Uses of the navigational triangle","plain":"세 요소를 알고 나머지를 구하는 네 가지 문제"},{"ko":"[[천측계산]]","en":"Sight reduction","plain":"관측한 고도를 위치선으로 바꾸는 계산"},{"ko":"[[계산고도·계산방위각|계산고도]]","en":"Computed altitude","abbr":"Hc","plain":"가정위치에서 보일 천체의 고도를 계산한 값"},{"ko":"계산방위각","en":"Computed azimuth angle","abbr":"Z","plain":"가정위치에서 본 천체의 방향을 계산한 값"},{"ko":"출발침로","en":"Initial course","plain":"대권항로를 따라 떠날 때의 첫 침로"},{"ko":"대권항정","en":"Great-circle distance","plain":"두 지점 사이를 대권을 따라 잰 거리"}],"why":"교재 8장의 흐름은 관측 → 고도개정 → 계산고도 → 고도차 → 위치선이다. 이 가운데 ‘계산고도’가 용도 (1)이다. [[가정위치]]의 위도와 천측력의 적위·LHA로 Hc와 Z를 구하고, 관측고도(Ho)와 비교해 고도차(Intercept)를 얻는다.[2] 박명 때 구름 사이로 별 하나만 보이면 (2)로 그 별의 이름을 알아낸다.","body":["교재는 항해삼각형의 용도를 네 가지로 든다. 각 문제에서 아는 요소와 구하는 요소는 다음과 같다.[1]",{"table":{"head":["용도","아는 요소","구하는 요소"],"rows":[["(1) 천측계산을 통한 위치선 산정","위도, 적위, 자오선각","고도, 방위각"],["(2) 미지의 천체 식별","위도, 고도, 방위각","적위, 자오선각"],["(3) 고도를 알고 방위선 산정","자오선각, 적위, 고도","방위각"],["(4) 대권항법에서 출발침로와 대권항정의 산정","(1)과 같음 — 지구 표면의 항해삼각형","출발침로, 대권항정"]]},"caption":"교재 21쪽"},"고도·적위·자오선각·위도의 네 요소는 식 (8.4) 하나로 묶여 있다. 그래서 셋을 알면 나머지 하나를 계산할 수 있다.[2]",{"formula":"sin h = sin L · sin d + cos L · cos d · cos t","label":"식 (8.4)"},"h는 고도, L은 위도, d는 적위, t는 자오선각이다. (1)은 [[천측계산]]의 핵심으로, 가정위치의 위도와 천측력의 적위·자오선각을 넣어 계산고도와 계산방위각을 구한다.[2]","(2)는 (1)을 거꾸로 푸는 문제다. 잰 고도·방위각과 위도로 적위와 자오선각을 구하고, 이를 천측력의 항성 자료와 맞춰 어떤 별인지 알아낸다.[3]","(3)은 위도를 쓰지 않는다. 사인 법칙을 쓰면 자오선각·적위·고도만으로 방위각이 나오기 때문이다.[4]",{"formula":"sin Z = sin t · cos d / cos h"},"Z는 방위각, t는 자오선각, d는 적위, h는 고도다. 사인값 하나에는 각이 두 개(Z와 180° − Z) 대응하므로, 어느 쪽인지 따로 판단해야 한다.",{"table":{"head":["순서","계산","값"],"rows":[["① sin Z","sin 80° × cos 30° / cos 24°12′.2","0.9351"],["② 두 후보","Z 또는 180° − Z","69°14′.3 또는 110°45′.7"],["③ 고르기","방위각 공식 cos Z로 확인","69°14′.3 → N69°14′.3W"]]},"caption":"교재 26–27쪽 예(t 80°W, d 30°N, h 24°12′.2)로 (3) 풀기 (위키 계산)[4]"},"(4)는 지구 표면의 삼각형, 곧 [[지문삼각형]]과 같은 꼴(극·출발지·도착지)을 푼다. 출발지 위도를 L, 도착지 위도를 d, 경도차를 t 자리에 넣으면 (1)과 같은 계산이 된다. 이때 90°에서 ‘고도’를 뺀 값이 대권항정, ‘방위각’이 출발침로다.[5]"],"confusions":"(1)과 (2)는 아는 것과 구하는 것이 서로 뒤바뀐 관계다. 또 네 문제 가운데 (3)만 위도를 쓰지 않는다.","key":["(1) 위치선: 위도·적위·자오선각 → 고도·방위각","(2) 천체 식별: 위도·고도·방위각 → 적위·자오선각","(3) 방위: 자오선각·적위·고도 → 방위각 (위도 불필요)","(4) 대권항법: (1)과 같은 계산을 지구 표면 삼각형에"],"footnotes":["교재 21쪽.","교재 157쪽, 식 (8.4). 교재 159쪽.","교재 밖 보충 설명. 자오선각에서 LHA와 GHA를 거쳐 SHA(= GHA − GHA♈)를 구하면 천측력의 항성 SHA·적위와 비교할 수 있다.","교재 밖 보충 설명. 사인 법칙은 Z와 180° − Z 두 값을 주므로 어느 쪽인지 따로 판단해야 한다. 교재 26–27쪽 예(t 80°, d 30°N, h 24°12′.2)를 넣으면 sin Z = 0.9351로 Z = 69°14′.3 또는 110°45′.7이고, 앞의 값이 실제 방위각이다.","교재 밖 보충 설명. 대권항정은 각의 분(′)을 그대로 해리로 읽는다(1′ = 1해리)."],"flags":[{"kind":"교재 밖","text":"(3)이 위도 없이 풀리는 이유로 사인 법칙 sin Z = sin t · cos d / cos h를 덧붙였다.","fn":4},{"kind":"계산 확인","text":"사인 법칙으로 교재 26–27쪽 예를 다시 풀면 Z = 69°14′.3(또는 110°45′.7)으로, 방위각 공식의 결과 N69°14′.3W와 일치한다. 교재 작도값은 N70°W다.","fn":4},{"kind":"교재 밖","text":"(4)에서 출발지 위도·도착지 위도·경도차를 L·d·t 자리에 넣고, 90° − 고도를 대권항정, 방위각을 출발침로로 읽는 대응을 덧붙였다.","fn":5}]},{"title":"천구좌표","easy":["운동장 한가운데 서서 친구에게 하늘에 뜬 연의 자리를 알려 준다고 하자. ‘서쪽으로, 땅에서 30° 위’처럼 각 두 개만 말하면 된다. 연까지 몇 m인지는 몰라도 방향은 정확히 전해진다.","하늘의 별도 같다. [[천구]]는 거리를 따지지 않는 둥근 하늘이어서, 별의 자리를 독립된 각 두 개로 말할 수 있다. 이 두 각이 **천구좌표**(Celestial coordinate)다.","두 각을 재려면 기준이 둘 필요하다. 지구의 적도처럼 ‘위도’를 재는 기준 원을 **주권**(Primary great circle), 본초자오선처럼 ‘경도’를 재기 시작하는 점을 **기점**이라 한다. 무엇을 주권으로 삼느냐에 따라 적도·수평·황도·은하좌표로 나뉜다.[2]"],"definition":"3차원 공간에 있는 한 점의 위치는 3개의 좌표로 정해지지만, 천구 위에 있는 천체의 [[겉보기위치·진위치|겉보기위치]](Apparent position)는 독립된 2개의 각으로 나타낸다. 이 좌표를 천구좌표(Celestial coordinate)라 하며, 일반적으로 1개의 대권인 주권(Primary great circle)과 그 위의 1점인 기점을 기준으로 정의한다.[1]","terms":[{"ko":"천구좌표","en":"Celestial coordinate","plain":"천체의 겉보기위치를 나타내는 독립된 두 각"},{"ko":"주권","en":"Primary great circle","plain":"‘위도’를 재는 기준이 되는 대권"},{"ko":"기점","en":"Primary direction (origin)","plain":"주권 위에서 ‘경도’를 재기 시작하는 점"},{"ko":"[[적도좌표계|적도좌표]]","en":"Equatorial coordinate","plain":"천의 적도가 주권. 적위와 시각·적경"},{"ko":"[[수평좌표계|수평좌표]]","en":"Horizontal coordinate","plain":"수평권이 주권. 고도와 방위각"},{"ko":"대권","en":"Great circle","plain":"구의 중심을 지나는 평면이 구면과 만나는 원"}],"why":"배에서 쓰는 두 좌표계가 여기서 나온다. [[천측력]]은 항해용 천체의 위치를 적도좌표로 싣고, 육분의로 재는 고도와 나침의로 보는 방위는 수평좌표다.[3] 천측계산은 두 좌표계를 [[항해삼각형]]으로 이어서, 적도좌표로 주어진 별이 내 자리에서 어떤 수평좌표로 보일지 계산하는 일이다.","body":["3차원 공간에서 한 점의 위치는 좌표 세 개로 정해진다. 그러나 [[천구]] 위의 천체는 거리를 따지지 않으므로, 겉보기위치를 독립된 두 각만으로 나타낼 수 있다.[1]","기준이 되는 대권이 **주권**, 그 위의 한 점이 **기점**이다. 주권에서 남북으로 잰 각이 ‘위도’ 구실을, 기점에서 주권을 따라 잰 각이 ‘경도’ 구실을 한다. 주권과 기점을 무엇으로 정하느냐에 따라 적도좌표, 수평좌표, 황도좌표, 은하좌표로 나뉘며, 항해학에서는 주로 앞의 두 가지를 쓴다.[1]",{"table":{"head":["좌표계","주권","기점","두 좌표"],"rows":[["[[적도좌표계]]","천의 적도","Greenwich(또는 관측자)의 천의 자오선과의 교점 / 춘분점","적위 + 시각(자오선각) / 적위 + 적경"],["[[수평좌표계]]","수평권","북점 또는 남점","고도 + 방위각"],["[[황도좌표계]]","황도","춘분점","황위 + 황경"],["[[은하좌표계]]","은하적도","적도승교점","은위 + 은경"]]},"caption":"교재 22–24쪽 정리"},"예를 들어 적위 30°N, LHA 80°인 별은 위도 35°N인 관측자에게 고도 24°12′.2, 방위각 N69°14′.3W로 보인다. 같은 별을 두 좌표계로 다르게 말한 것이다. 이 변환은 [[자오선평면도]]와 [[항해삼각형]]에서 다룬다.","각 좌표계의 용어는 지구의 적도·극·위도·경도에 하나씩 대응한다. 이 대응을 모은 것이 [[좌표계 비교|표 1.2]]다.[4]"],"confusions":"주권은 ‘위도’를 재는 기준 원이고, 기점은 ‘경도’를 재기 시작하는 점이다. 예컨대 적도좌표계에서 적위는 주권인 천의 적도에서, 적경은 기점인 춘분점에서 잰다.","key":["천구좌표 = 겉보기위치를 나타내는 독립된 두 각","정의의 기준 = 주권(대권 하나) + 기점(그 위의 한 점)","적도·수평·황도·은하좌표 — 항해학은 주로 적도·수평좌표"],"footnotes":["교재 22쪽.","교재 밖 보충 설명. 영문 자료는 주권이 이루는 면을 기본면(Fundamental plane), 기점 방향을 기준 방향(Primary direction)이라 부르며, 천구좌표가 지구의 위도·경도와 같은 틀이라고 설명한다. 참고: [Celestial coordinate system — Wikipedia](https://en.wikipedia.org/wiki/Celestial_coordinate_system).","교재 22쪽, 28쪽.","교재 24쪽, 표 1.2."],"flags":[]},{"title":"적도좌표계","easy":["지구본의 위도·경도선을 그대로 부풀려 하늘에 비춘다고 생각해 보자. 지구의 적도는 하늘의 [[천의 적도]](Celestial equator)가 되고, 위도선은 하늘의 위도선이 된다. 이렇게 천의 적도를 기준으로 삼은 좌표가 **적도좌표계**(Equatorial coordinate)다.","하늘의 위도에 해당하는 것이 [[적위]](Declination, Dec)다. 별이 천의 적도에서 북쪽이나 남쪽으로 몇 도 떨어졌는지를 잰다. 예컨대 적위 30°N인 별은 위도 30°N인 땅의 바로 위를 지나간다.[2]","하늘의 경도는 어디서부터 재느냐에 따라 둘로 나뉜다. 내 자오선이나 그리니치 자오선에서 서쪽으로 재면 시각(Hour angle)이고, 하늘이 돌면서 1시간에 15°씩 커진다. [[춘분점·추분점|춘분점]]에서 재면 [[적경]](Right ascension, RA)이고, 별과 함께 돌기 때문에 거의 변하지 않는다.[2]"],"definition":"천의 적도(Celestial equator)를 주권으로 하여 천체의 위치를 나타내는 좌표방식을 적도좌표(Equatorial coordinate)라 한다. 기점을 정하는 방법에는 (1) 천의 적도와 Greenwich(또는 관측자)의 천의 자오선이 만나는 점을 기점으로 적위(Declination, Dec)와 시각(Hour angle)·자오선각(Meridian angle, t)으로 나타내는 방법, (2) 천의 적도와 춘분시권의 교점인 춘분점(Vernal equinox, ♈)을 기점으로 적위와 적경(Right ascension, RA)으로 나타내는 방법이 있다.[1]","terms":[{"ko":"적도좌표계","en":"Equatorial coordinate","plain":"천의 적도를 주권으로 하는 좌표"},{"ko":"적위","en":"Declination","abbr":"Dec","plain":"천의 적도에서 남북으로 잰 각. 하늘의 위도"},{"ko":"시각(時角)","en":"Hour angle","plain":"자오선에서 서쪽으로 잰 각. 시간이 지나면 커진다"},{"ko":"적경","en":"Right ascension","abbr":"RA","plain":"춘분점에서 동쪽으로 잰 각. 거의 변하지 않는다"},{"ko":"[[항성시각]]","en":"Sidereal hour angle","abbr":"SHA","plain":"춘분점에서 서쪽으로 잰 각. 항해에서 RA 대신 쓴다"},{"ko":"춘분점","en":"Vernal equinox (First point of Aries)","abbr":"♈","plain":"황도가 천의 적도를 남→북으로 건너는 점"}],"why":"[[천측력]]은 항해용 천체의 위치를 적도좌표로 싣는다.[3] 항해자는 관측 시각의 GHA와 적위를 찾고, 내 경도로 GHA를 LHA로 바꿔 [[항해삼각형]]에 넣는다. 별은 [[춘분점의 GHA|GHA♈]]에 SHA를 더해 GHA를 만든다.","body":["교재는 적도좌표의 기점을 정하는 방법을 두 가지로 든다.[1]",{"list":["(1) 천의 적도와 Greenwich(또는 관측자)의 천의 자오선이 만나는 점을 기점으로 하여, 적위와 시각(자오선각)으로 나타낸다.[1][4]","(2) 천의 적도와 춘분시권의 교점, 곧 춘분점을 기점으로 하여, 적위와 적경으로 나타낸다.[1]"]},"그림 1.26에서 A는 천체 M의 [[천의 자오선·시권|시권]](Hour circle)이 천의 적도와 만나는 점이다. 적위는 호 AM(d)이다. 이것을 자오선각 QA(t)와 함께 쓰면 (1)의 방법, 적경 ♈A(RA)와 함께 쓰면 (2)의 방법이다.[1]","(1)의 기준을 Greenwich 자오선으로 하면 [[본초시각]](Greenwich Hour Angle, GHA), 관측자의 자오선으로 하면 [[지방시각·자오선각|지방시각(Local Hour Angle, LHA)·자오선각(t)]]이 된다.[4] 이 값들은 천구의 [[일주운동·주극성|일주운동]] 때문에 시간이 지나면 계속 커진다.","(2)의 방법은 적위와 적경이 거의 변하지 않으므로 시간에 구애받지 않고 위치를 나타낼 수 있다는 이점이 있다.[1] 항해학에서는 적경 대신 서쪽으로 잰 항성시각(SHA)을 주로 쓴다. 둘은 같은 춘분시권에서 반대 방향으로 잰 값이다.[5]",{"formula":"SHA + RA = 360°"},"SHA는 춘분점에서 서쪽으로, RA는 동쪽으로 잰 각이다. 예컨대 RA 90°인 별의 SHA는 270°다. 3D 장면 3에서 적위·적경·시각을 천구 위에서 볼 수 있다."],"confusions":"여기서 ‘시각’은 시간(時刻)이 아니라 시각(時角, Hour angle)이다. 극에서 두 시권이 이루는 각이며, 천구가 1시간에 15°씩 돌기 때문에 시간 단위로도 나타낸다.[2]","key":["주권 = 천의 적도","(1) 적위 + 시각(GHA·LHA·t): 시간에 따라 변함","(2) 적위 + 적경(기점 = 춘분점): 거의 변하지 않음","항해학은 적경 대신 SHA를 주로 씀 (SHA + RA = 360°)"],"footnotes":["교재 23쪽, 그림 1.26.","교재 밖 보충 설명. 적위는 지구의 위도에 해당하고, 적경은 춘분점에서 동쪽으로 재며, 시각은 자오선에서 서쪽으로 재어 지구가 돌면서 계속 커진다. 적경·적위는 별들에 대해 거의 고정되어 있고, 시간 단위로는 1시간이 15°다. 참고: [Equatorial coordinate system — Wikipedia](https://en.wikipedia.org/wiki/Equatorial_coordinate_system).","교재 28쪽, 34–35쪽 식 (1.5).","교재는 (1)을 ‘관측자의 위치에는 관계없이 천의 적도와 Greenwich(또는 관측자)의 천의 자오선이 만난 점을 기점으로’라고 썼다. 위키는 Greenwich 자오선을 기준으로 하면 관측자와 무관한 GHA, 관측자의 자오선을 기준으로 하면 LHA·자오선각이 된다고 풀었다(교재 18–19쪽).","교재 10쪽."],"flags":[{"kind":"해석","text":"교재 23쪽 (1)의 ‘관측자의 위치에는 관계없이 … Greenwich(또는 관측자)의 천의 자오선’을, 기준 자오선에 따라 GHA 또는 LHA·t가 되는 것으로 풀어 썼다.","fn":4}]},{"title":"수평좌표계","easy":["갑판에서 별을 가리키며 ‘북서쪽, 수평선 위 25°’라고 말해 보자. 이렇게 내 자리에서 보이는 대로 높이와 방향을 말하는 것이 **수평좌표계**(Horizontal coordinate)다. 높이는 [[고도·고도의 거등권|고도]](Altitude, h), 방향은 [[방위·방위각|방위]](Azimuth, Zn) 또는 방위각(Azimuth angle, Z)이라 한다.","가장 직관적이지만 주소가 계속 바뀐다. 시간이 흐르면 별이 떠오르고 지므로 고도와 방위가 변한다. 같은 순간이라도 서울과 부산에서 본 같은 별의 고도는 서로 다르다.[2]","예를 들어 방위 290°는 북에서 시계방향으로 290° 돈 방향이다. 거꾸로 말하면 북에서 서쪽으로 70° 돈 방향이어서, 방위각으로는 N70°W라고 쓴다."],"definition":"관측자의 수평권(Celestial horizon)을 주권으로 하고 남점이나 북점을 기점으로 하여 천체의 위치를 나타내는 좌표방식을 수평좌표(Horizontal coordinate)라 한다. 천체의 위치는 고도(Altitude, h)와 방위각(Azimuth angle, Z)으로 나타낸다.[1]","terms":[{"ko":"수평좌표계","en":"Horizontal coordinate","plain":"수평권을 주권으로, 보이는 대로 말하는 좌표"},{"ko":"고도","en":"Altitude","abbr":"h","plain":"수평에서 천체까지 올려본 각"},{"ko":"방위","en":"Azimuth","abbr":"Zn","plain":"북을 000°로 시계방향 360°까지 잰 방향"},{"ko":"방위각","en":"Azimuth angle","abbr":"Z","plain":"N 또는 S에서 E·W 쪽으로 잰 방향"},{"ko":"[[수평의 종류|수평권]]","en":"Celestial horizon","plain":"천정에서 90° 떨어진 하늘의 큰 원"},{"ko":"[[수직권·주수직권|수직권]]","en":"Vertical circle","plain":"천정과 천체를 지나는 대권. 고도를 재는 선"}],"why":"육분의(Sextant)로 재는 것이 바로 수평좌표의 고도다. 잰 고도를 고쳐 관측고도(Ho)를 만들고, [[항해삼각형]]으로 계산한 계산고도(Hc)와 비교한다. 계산방위각 Z는 [[위치기입도 작도|위치기입도]](Plotting sheet)에서 가정위치로부터 천체 쪽으로 긋는 방위선이 된다.[3]","body":["그림 1.27에서 천체 M의 위치는 고도 BM(h)와 방위각 NB(Z)로 나타낸다. B는 천체를 지나는 수직권이 수평권과 만나는 점이다.[1]","고도는 천체의 수직권 위에서 진수평으로부터 천체까지 잰 호다. 방위각은 북점 또는 남점을 기준으로 동·서로 잰다.[4] 기준점은 [[방위의 기준점]], 기준이 되는 수평은 [[수평의 종류]]에서 다룬다.","이 방식에서는 관측자의 위치에 따라 연직선의 방향이 바뀐다. 또 시간이 지나면 천체의 고도와 방위가 바뀌므로 기록하기 불편하다.[1]","그러나 바로 이 성질이 천문항법의 바탕이다. 같은 순간 같은 천체라도 관측자 위치마다 고도가 다르다. 그래서 고도를 재면 관측자가 있을 수 있는 [[위치권]]이 정해진다.[5] 3D 장면 5에서 고도와 방위각을 볼 수 있다.",{"table":{"head":["순서","계산","값"],"rows":[["① 방위 Zn","북에서 시계방향","290°"],["② 서쪽 반원인가?","290° > 180° → 서쪽 하늘","끝 글자 W"],["③ 북에서 잰 각","360° − 290°","70°"],["④ 방위각 Z","N + 70° + W","N70°W"]]},"caption":"방위를 방위각으로 바꾸기 (교재 26쪽 예)[6]"}],"confusions":"방위(Zn)와 방위각(Z)은 같은 방향을 다르게 쓴 것이다. 방위는 북을 000°로 하여 시계방향으로 360°까지, 방위각은 N 또는 S를 기준으로 E·W 쪽으로 잰다. 예컨대 방위 290°는 방위각 N70°W다.[6]","key":["주권 = 수평권, 기점 = 북점 또는 남점","좌표 = 고도 h + 방위각 Z(또는 방위 Zn)","관측자 위치와 시간에 따라 변해 기록에는 불편 — 그래서 위치를 구하는 데 쓴다","예: 방위 290° = 방위각 N70°W"],"footnotes":["교재 23–24쪽, 그림 1.27. 교재 본문은 주권을 ‘수평선’으로 썼고, 표 1.2는 ‘수평권’으로 썼다.","교재 밖 보충 설명. 같은 천체라도 같은 시각 다른 장소에서 보면 고도와 방위가 다르고, 시간이 지나면 고도와 방위가 변한다. 참고: [Horizontal coordinate system — Wikipedia](https://en.wikipedia.org/wiki/Horizontal_coordinate_system).","교재 159쪽, 162–164쪽.","교재 16–18쪽.","교재 밖 보충 설명. 위치권은 교재 154–155쪽에서 다룬다.","교재 17–18쪽, 26쪽."],"flags":[]},{"title":"황도좌표계","easy":["1년 동안 태양이 별자리 사이를 지나가는 길을 하늘에 선으로 그어 보자. 이 길이 [[황도]](Ecliptic)다. 하늘의 적도 대신 이 황도를 기준선으로 삼은 좌표가 **황도좌표계**(Ecliptic coordinate)다.","황도에서 북쪽이나 남쪽으로 떨어진 각이 [[황위]](Celestial latitude), [[춘분점·추분점|춘분점]]에서 황도를 따라 동쪽으로 간 각이 [[황경]](Celestial longitude)이다. 태양은 늘 황도 위에 있으므로 황위가 0°이고, 위치를 황경 하나로 말할 수 있다. 춘분 때 태양의 황경은 0°다.[2]","행성의 궤도도 황도와 거의 같은 면에 있어서, 천문학에서는 태양계 천체를 다룰 때 이 좌표를 쓴다.[3] 그러나 항해에서는 거의 쓰지 않는다."],"definition":"적도좌표계의 천의 적도 대신 황도(Ecliptic)를 주권으로 정한 좌표방식을 황도좌표(Ecliptic coordinate)라 한다. 곧 황경(Celestial longitude)과 황위(Celestial latitude)로 천체의 겉보기위치를 나타낸다.[1]","terms":[{"ko":"황도좌표계","en":"Ecliptic coordinate","plain":"황도를 주권으로, 춘분점을 기점으로 하는 좌표"},{"ko":"황도","en":"Ecliptic","plain":"태양이 1년 동안 천구 위를 지나는 길"},{"ko":"황위","en":"Celestial latitude","plain":"황도에서 남북으로 잰 각. 북 +, 남 −"},{"ko":"황경","en":"Celestial longitude","plain":"춘분점에서 황도를 따라 동쪽으로 잰 각"},{"ko":"황극","en":"Ecliptic pole","plain":"황도에서 90° 떨어진 하늘의 두 점"},{"ko":"[[황위의 권]]","en":"Circle of latitude","plain":"황극을 지나는 대권. 황위를 재는 선"}],"why":"항해자는 황도좌표로 계산하지 않는다. 항해학은 적도좌표와 수평좌표를 쓰고, [[천측력]]도 천체 위치를 적도좌표로 싣기 때문이다.[4] 다만 태양·달·행성이 황도 근처에서 움직인다는 사실은 하늘에서 행성을 찾을 때 도움이 된다.","body":["황위는 천체를 지나는 황위의 권 위에서 황도로부터 잰 호로, 북쪽이면 +, 남쪽이면 −를 붙인다. 황경은 춘분점에서 황도를 따라 동쪽으로 360°까지 잰 호다.[5] 따라서 주권은 황도, 기점은 춘분점이다.","[[좌표계 비교|표 1.2]]에서 황도좌표계의 용어는 지구의 용어와 이렇게 대응한다.[1]",{"table":{"head":["지구","황도좌표계"],"rows":[["적도","황도"],["극","황극"],["자오선","황위의 권"],["본초자오선","춘분점의 황위의 권"],["거등권","황위의 거등권"],["위도","황위"],["여위도","황위의 여위도"],["경도","황경"]]},"caption":"교재 24쪽, 표 1.2의 황도좌표계 열"},"항해학에서는 적도좌표와 수평좌표를 주로 쓰므로 황도좌표는 거의 쓰지 않는다.[4] 태양은 늘 황도 위에 있어 황위가 0°이므로, 태양의 위치는 황경 하나로 나타낼 수 있다.[2]"],"confusions":"황도좌표계의 기점도 적도좌표계의 적경처럼 춘분점이다. 그러나 황경은 황도를 따라, [[적경]]은 천의 적도를 따라 재므로 같은 천체라도 두 값은 대개 다르다.","key":["주권 = 황도, 기점 = 춘분점, 극 = 황극","좌표 = 황경(동쪽 0°~360°) + 황위(북 +, 남 −)","태양의 황위는 늘 0° — 항해학에서는 거의 쓰지 않음"],"footnotes":["교재 24쪽, 표 1.2.","교재 밖 보충 설명. 황도는 태양의 겉보기 경로이므로 태양의 황위는 0°다. 황경 0°는 춘분 때 지구에서 태양 쪽을 가리키는 방향이다. 참고: [Ecliptic coordinate system — Wikipedia](https://en.wikipedia.org/wiki/Ecliptic_coordinate_system).","교재 밖 보충 설명. 대부분의 행성 궤도가 황도에 조금만 기울어 있어서 행성 궤도 계산에 황도좌표가 편리하다. 참고: [Ecliptic coordinate system — Wikipedia](https://en.wikipedia.org/wiki/Ecliptic_coordinate_system).","교재 22쪽, 28쪽.","교재 11–12쪽, 그림 1.13."],"flags":[]},{"title":"은하좌표계","easy":["불빛 없는 바다 한가운데에서는 밤하늘을 가로지르는 희뿌연 빛의 띠, 은하수가 보인다. 이 띠는 하늘을 거의 한 바퀴 빙 둘러 놓여 있다. 이 띠의 한가운데 선을 ‘적도’로 삼은 좌표가 **은하좌표계**(Galactic coordinate)다.","은하수의 중심선에서 남북으로 떨어진 각이 은위(Galactic latitude), 중심선을 따라 동쪽으로 간 각이 은경(Galactic longitude)이다. 은하수 띠 한가운데 있는 별은 은위가 0°에 가깝다.[2]","은하좌표는 천문학자가 우리 은하의 구조를 연구할 때 쓴다. 항해에는 쓰지 않지만, 교재는 좌표계를 비교하려고 함께 소개한다."],"definition":"은하의 평균중심선을 이루는 대권을 은하권 또는 은하적도(Galactic equator)라 하고 그 극을 은극(Galactic pole)이라 한다. 은하적도를 주권으로 하고 적도승교점을 기점으로 하여 은위(Galactic latitude)와 은경(Galactic longitude)으로 천체의 위치를 나타내는 좌표방식을 은하좌표(Galactic coordinate)라 한다.[1]","terms":[{"ko":"은하좌표계","en":"Galactic coordinate","plain":"은하수의 중심선을 ‘적도’로 삼은 좌표"},{"ko":"은하적도","en":"Galactic equator","plain":"은하수의 평균 중심선을 이루는 대권"},{"ko":"은극","en":"Galactic pole","plain":"은하적도에서 90° 떨어진 두 점"},{"ko":"은위","en":"Galactic latitude","abbr":"b","plain":"은하적도에서 남북으로 잰 각"},{"ko":"은경","en":"Galactic longitude","abbr":"l","plain":"기점에서 은하적도를 따라 동쪽으로 잰 각"},{"ko":"적도승교점","en":"Ascending node","plain":"은하적도가 천의 적도를 남→북으로 건너는 점"}],"why":"은하좌표는 천측에 쓰이지 않는다. 그래도 ‘주권 하나와 기점 하나로 두 각을 정한다’는 [[천구좌표]]의 원리가 어느 좌표계에서나 같다는 것을 보여 준다. 항해에 쓰는 [[적도좌표계|적도좌표]]·[[수평좌표계|수평좌표]]도 같은 틀로 이해하면 된다.[3]","body":["은하(은하수)는 천구 위에서 거의 하나의 대권을 따라 놓여 있다.[4] 그 평균 중심선을 이루는 대권을 **은하권** 또는 **은하적도**라 하고, 은하적도의 극을 **은극**이라 한다.[1]","**은위**는 은하적도를 기준으로 잰다. **은경**은 [[천의 적도]]와 은하적도의 두 교점 가운데, 은하적도가 남에서 북으로 동쪽을 향해 가로지르는 점을 기점으로 하여 동쪽으로 360°까지 잰다. 이 기점이 **적도승교점**이다.[1]","[[좌표계 비교|표 1.2]]에서 은하좌표계의 ‘본초자오선’은 은극과 적도승교점을 지나는 대권이고, ‘여위도’는 은위의 여위도다. ‘자오선’과 ‘거등권’ 칸은 비어 있다.[1]","현재 천문학에서 쓰는 은하좌표계는 1958년 국제천문연맹(International Astronomical Union, IAU)이 정한 것으로, 은하 중심 방향을 은경 0°로 삼는다. 이 체계에서 적도승교점은 은경 약 33°에 있다.[5]"],"confusions":"적도승교점은 은하적도가 천의 적도를 남에서 북으로 건너는 점이다. 황도가 천의 적도를 남에서 북으로 건너는 점이 [[춘분점·추분점|춘분점]]인 것과 같은 방식으로 정한 점이다.","key":["주권 = 은하적도, 극 = 은극","기점 = 적도승교점(은하적도가 천의 적도를 남→북으로 건너는 점)","은위(은하적도 기준) + 은경(동쪽으로 0°~360°)","현행 IAU(1958) 체계는 은하 중심이 은경 0°"],"footnotes":["교재 24쪽, 표 1.2.","교재 밖 보충 설명. 은위는 은하면 위로 얼마나 올라와 있는지를 나타낸다. 참고: [Galactic coordinate system — Wikipedia](https://en.wikipedia.org/wiki/Galactic_coordinate_system).","교재 22쪽, 24쪽.","교재는 ‘은하는 천구상의 대권을 따라 회전하고 있는데’라고 썼다. 위키는 지구에서 본 은하수의 띠가 거의 대권을 따라 놓여 있다는 뜻으로 풀었다.","교재 밖 보충 설명. IAU는 1958년 은하좌표계를 정하고 은하 중심 방향을 은경 0°로 삼았다. 그 전의 옛 체계(1932년 Lund 천문대)는 교재의 정의처럼 은하면과 적도면의 교점을 은경 0°로 삼았다. 참고: [Galactic coordinate system — Wikipedia](https://en.wikipedia.org/wiki/Galactic_coordinate_system). 현행 체계에서 은하면 승교점의 은경 33°는 다음 문서의 상수표에 있다. [LALSuite CelestialCoordinates 문서](https://lscsoft.docs.ligo.org/lalsuite/lal/group___celestial_coordinates__c.html)."],"flags":[{"kind":"해석","text":"교재의 ‘은하는 천구상의 대권을 따라 회전하고 있는데’를 은하수의 띠가 대권을 따라 놓여 있다는 뜻으로 풀어 썼다.","fn":4},{"kind":"교재 밖","text":"현행 IAU(1958) 은하좌표계는 은하 중심 방향을 은경 0°로 하며 적도승교점은 은경 약 33°라는 사실을 덧붙였다. 교재의 정의는 옛 방식이다.","fn":5}]},{"title":"좌표계 비교","easy":["네 가지 하늘 좌표계는 모두 지구의 위도·경도와 같은 틀로 만들어졌다. 다만 ‘적도’로 삼는 원이 서로 다르다. 표 1.2는 이 차이를 지구 지도 용어로 번역해 놓은 사전이다.","예를 들어 지구의 ‘적도’는 적도좌표계에서 [[천의 적도]], 수평좌표계에서 수평권, 황도좌표계에서 [[황도]], 은하좌표계에서 은하적도가 된다. 지구의 ‘위도’는 차례로 [[적위]], 고도, [[황위]], 은위가 된다.","‘적도’만 정하면 나머지는 저절로 따라온다. 적도에서 90° 떨어진 점이 ‘극’이 되고, 극을 지나는 원이 ‘자오선’이 된다. 그래서 수평좌표계의 극은 [[천정·천저|천정과 천저]]다.[2]"],"definition":"지구의 적도(Equator)·극(Pole)·자오선(Meridian)·위도(Latitude)·경도(Longitude) 같은 용어가 적도좌표(Equatorial coordinate)·수평좌표(Horizontal coordinate)·황도좌표(Ecliptic coordinate)·은하좌표(Galactic coordinate)에서 각각 무엇에 해당하는지 정리한 표가 표 1.2(각종 좌표계에 관련된 용어)다.[1]","terms":[{"ko":"좌표계 비교","en":"Comparison of coordinate systems","plain":"지구 용어와 네 좌표계 용어의 대응표"},{"ko":"[[극거]]","en":"Polar distance","plain":"천의 극에서 천체까지 잰 각. 90° ± 적위"},{"ko":"[[정거]]","en":"Zenith distance","plain":"천정에서 천체까지 잰 각. 90° − 고도"},{"ko":"[[적위의 거등권]]","en":"Parallel of declination","plain":"적위가 같은 점을 이은 작은 원"},{"ko":"[[고도·고도의 거등권|고도의 거등권]]","en":"Parallel of altitude","plain":"고도가 같은 점을 이은 작은 원"},{"ko":"[[동서권]]","en":"Prime vertical circle","plain":"동점·천정·서점을 지나는 수직권"}],"why":"천측계산은 늘 두 좌표계를 오간다. 천측력의 값은 적도좌표 열(적위·GHA·LHA)에, 육분의와 나침의로 재는 값은 수평좌표 열(고도·방위)에 있다. 표의 ‘여위도’ 줄에 있는 극거와 정거가 [[항해삼각형]]의 두 변이 되어 두 열을 잇는다.[1]","body":["표 1.2는 지구의 용어 여덟 가지를 기준으로, [[적도좌표계]]·[[수평좌표계]]·[[황도좌표계]]·[[은하좌표계]]에서 같은 역할을 하는 용어를 나란히 놓았다.[1]",{"table":{"head":["지구","적도좌표계","수평좌표계","황도좌표계","은하좌표계"],"rows":[["적도","천의 적도","수평권","황도","은하적도"],["극","천의 극","천정, 천저","황극","은극"],["자오선","시권, 천의 자오선","수직권","황위의 권","—"],["본초자오선","춘분시권, Greenwich의 천의 자오선, 관측자의 천의 자오선","동서권, 주수직권","춘분점의 황위의 권","은극 및 적도승교점을 지나는 대권"],["거등권","적위의 거등권","고도의 거등권","황위의 거등권","—"],["위도","적위","고도","황위","은위"],["여위도","극거","정거","황위의 여위도","은위의 여위도"],["경도","SHA, RA, GHA, LHA, t","방위, 방위각, 출몰 방위각","황경","은경"]]},"caption":"표 1.2 각종 좌표계에 관련된 용어 (교재 24쪽)"},"표는 줄 단위로 읽으면 쉽다. ‘위도’ 줄의 적위·[[고도·고도의 거등권|고도]]·황위·은위는 모두 주권에서 잰 각이다. ‘여위도’ 줄은 극(수평좌표계에서는 천정)에서 잰 각이어서, 같은 줄 위도 값을 90°에서 뺀 것과 같다.","적도좌표계의 ‘본초자오선’은 셋이다. 춘분시권에서 SHA·RA를, Greenwich의 천의 자오선에서 GHA를, 관측자의 천의 자오선에서 LHA·t를 잰다. 수평좌표계의 둘은 [[수직권·주수직권|주수직권]](북점·남점)이 방위·방위각의, 동서권(동점·서점)이 [[출몰방위각]]의 기준이라고 볼 수 있다.[3]","천문학 책에서는 수평좌표계를 지평좌표계라고도 부르고, 은하좌표계의 기점을 은하 중심 방향으로 잡는다. 이름이 달라도 ‘기본면 하나와 기준 방향 하나’라는 틀은 같다.[4]"],"confusions":"수평좌표계에서 ‘극’에 해당하는 것은 천의 극이 아니라 천정과 천저다. 그래서 ‘여위도’에 해당하는 것도 극거가 아니라 정거다.","key":["표 1.2 = 지구 용어 ↔ 적도·수평·황도·은하좌표계 용어","위도 ↔ 적위·고도·황위·은위, 여위도 ↔ 극거·정거·황위의 여위도·은위의 여위도","경도 ↔ SHA·RA·GHA·LHA·t / 방위·방위각·출몰방위각 / 황경 / 은경","수평좌표계의 극 = 천정·천저"],"footnotes":["교재 24쪽, 표 1.2. 교재 표의 빈칸은 —로 표시했다.","교재 밖 보충 설명. 어느 천구좌표계든 극은 기본면에서 ±90°에 있다. 참고: [Celestial coordinate system — Wikipedia](https://en.wikipedia.org/wiki/Celestial_coordinate_system).","교재 15쪽, 17–18쪽의 정의에 따른 풀이다. 주수직권은 북점과 남점을 지나는 수직권이고, 출몰방위각은 동점 또는 서점에서 잰다.","교재 밖 보충 설명. 한국어 천문학 용어로는 수평좌표계를 지평좌표계라 하고, 은하좌표계의 기준 방향을 은하중심으로 둔다. 참고: [천구 좌표계 — 위키백과](https://ko.wikipedia.org/wiki/%EC%B2%9C%EA%B5%AC_%EC%A2%8C%ED%91%9C%EA%B3%84)."],"flags":[{"kind":"해석","text":"표 1.2의 수평좌표계 ‘본초자오선’ 칸(동서권, 주수직권)을, 주수직권은 방위·방위각의 기준, 동서권은 출몰방위각의 기준으로 나누어 풀었다.","fn":3}]},{"title":"천구도법","easy":["둥근 지구본을 공책에 옮겨 그린다고 해 보자. 옆에서 보고 그리면 적도가 가로 직선이 되고, 북극 위에서 보고 그리면 적도가 동그라미가 된다. 둥근 [[천구]]도 같은 방법으로 종이에 옮기는데, 이것이 **천구도법**(Celestial diagrams)이다.","어느 면에 비추느냐에 따라 세 가지 그림이 나온다. 자오선 면에 비춘 [[자오선평면도]], 적도면에 비춘 [[적도평면도]], 수평면에 비춘 **수평평면도**다.","그림은 계산을 대신하지 않고 관계를 눈으로 확인하게 해 준다. 예를 들어 교재의 작도로는 고도 25°가 나오지만, 정확히 계산하면 24°12′.2다.[2]"],"definition":"천구를 평면으로 나타내어 천체, 그리고 관측자와 천체 사이의 관계를 쉽게 표현하려고 만든 도법을 천구도법(Celestial diagrams)이라 한다. 크게 자오선평면도(Diagram on the plane of celestial meridian), 적도평면도(Diagram on the plane of celestial equator), 수평평면도의 세 가지가 있다.[1]","terms":[{"ko":"천구도법","en":"Celestial diagrams","plain":"천구를 평면에 옮겨 그려 관계를 보는 방법"},{"ko":"자오선평면도","en":"Diagram on the plane of celestial meridian","plain":"천구를 관측자의 자오선 면에 비춘 그림"},{"ko":"적도평면도","en":"Time diagram","plain":"천구를 천의 적도면에 비춘 그림. 시각도"},{"ko":"수평평면도","en":"Diagram on the plane of the horizon","plain":"천구를 수평면에 비춘 그림. 중심이 천정"},{"ko":"투영","en":"Projection","plain":"입체를 평면에 비춰 옮겨 그리기"}],"why":"천측계산에서는 부호를 헷갈리기 쉽다. 경도를 더할지 뺄지, 방위각에 E를 붙일지 W를 붙일지는 간단한 그림을 그려 보면 바로 보인다. 옛 항해 교재도 시각도를 잘 익히면 시간 문제의 혼란이 사라진다고 권했다.[3]","body":["천구도법에는 크게 자오선평면도, 적도평면도, 수평평면도의 세 가지가 있다. 교재는 이 가운데 주로 쓰는 자오선평면도와 적도평면도를 설명한다.[1]",{"table":{"head":["도법","투영하는 면","바라보는 쪽","쓰임"],"rows":[["자오선평면도","관측자의 천의 자오선","천구 밖 서점 쪽","고도·방위와 적위·LHA 사이의 작도"],["적도평면도(시각도)","천의 적도면","천의 축 방향(천의 북극 쪽)","GHA·LHA·SHA 등 시각 사이의 관계"]]},"caption":"교재 25–28쪽 정리"},"수평평면도는 교재에서 이름만 나온다. 천정 쪽에서 수평면에 투영한 그림으로, 바깥 원이 수평권이고 중심이 천정이다.[4]","천구도법은 정밀한 계산을 대신하기보다 관계를 눈으로 확인하는 그림이다. 작도로 읽은 값은 근삿값이므로 정확한 값은 [[구면삼각형의 계산]]으로 구한다.[2] 3D 장면 6에서 천구를 각 평면에 투영하는 모습을 볼 수 있다."],"confusions":"‘평면도’의 이름은 투영하는 평면에서 왔다. 자오선평면도는 자오선 면, 적도평면도는 적도면, 수평평면도는 수평면에 천구를 비춘 그림이다.","key":["천구도법 = 천구를 평면에 나타내 관계를 쉽게 보는 도법","자오선평면도 · 적도평면도(시각도) · 수평평면도","교재는 자오선평면도와 적도평면도를 설명","작도값은 근삿값 — 정확한 값은 계산으로"],"footnotes":["교재 25쪽.","교재 밖 보충 설명. 예컨대 교재 26–27쪽의 작도값 고도 25°는 계산하면 24°12′.2다.","교재 밖 보충 설명. Bradford는 적도면을 북극 위에서 내려다본 시각도(Time Diagram)를 그리게 하고, 이것을 잘 익히면 시간 문제의 흐릿함이 사라진다고 썼다. 참고: [The Whys and Wherefores of Navigation — Gershom Bradford, 1918 (Project Gutenberg)](https://gutenberg.org/cache/epub/73652/pg73652-images.html).","교재 밖 보충 설명."],"flags":[{"kind":"교재 밖","text":"교재에 이름만 나오는 수평평면도의 모양(바깥 원 = 수평권, 중심 = 천정)을 덧붙였다.","fn":4}]},{"title":"자오선평면도","easy":["천구를 서쪽에서 아주 멀리 떨어져 바라본다고 해 보자. 그러면 둥근 하늘이 납작한 원으로 보이고, 그 테두리가 내 [[관측자의 천의 자오선·자오선정중|천의 자오선]]이 된다. 이렇게 그린 그림이 **자오선평면도**(Diagram on the plane of celestial meridian)다.","이 그림에서 [[천의 적도]]와 수평권은 원을 가로지르는 직선으로 보인다. 지구본을 옆에서 찍은 사진에서 적도가 가로줄로 보이는 것과 같다. 별은 이 원 안의 한 점으로 찍힌다.","교재는 위도 35°N에서 적위 30°N, LHA 80°인 별을 이 그림에 찍는다. 그림에서 재면 고도 약 25°, 방위각 약 N70°W다. 계산하면 24°12′.2, N69°14′.3W이므로 그림으로도 거의 맞는 값을 얻는다.[2]"],"definition":"관측자의 천의 자오선(Celestial meridian)에 천구를 투영한 그림을 자오선평면도(Diagram on the plane of celestial meridian)라 한다.[1]","terms":[{"ko":"자오선평면도","en":"Diagram on the plane of celestial meridian","plain":"천구를 관측자의 자오선 면에 비춘 그림"},{"ko":"천의 자오선","en":"Celestial meridian","plain":"천정과 두 천의 극을 지나는 대권. 그림의 테두리"},{"ko":"[[적위의 거등권]]","en":"Parallel of declination","plain":"적위가 같은 점을 이은 원. 그림에서 dd′"},{"ko":"[[고도·고도의 거등권|고도의 거등권]]","en":"Parallel of altitude","plain":"고도가 같은 점을 이은 원. 그림에서 hh′"},{"ko":"[[동서권]]","en":"Prime vertical circle","plain":"동점·천정·서점을 지나는 수직권. 그림에서 ZNa"},{"ko":"정사투영","en":"Orthographic projection","plain":"아주 먼 곳에서 평행한 빛으로 비춘 그림자"}],"why":"자오선평면도는 천측계산 결과가 그럴듯한지 확인할 때 쓴다. 계산고도가 25° 근처여야 할 문제에서 65°가 나왔다면 어딘가 틀린 것이다. 방위각 앞에 N과 S 중 무엇을, 끝에 E와 W 중 무엇을 붙일지도 이 그림에서 바로 보인다.[1]","body":["원 둘레가 관측자의 천의 자오선이다. 이 면에 수직인 천의 적도 QQ′와 수평권 NS는 원의 지름, 곧 직선으로 보인다.[3] LHA가 180° 이하인 천체는 지면 앞면에, 180°를 넘는 천체는 지면 뒷면에 있다고 생각한다.[1]",{"steps":["적도좌표계(그림 1.28, 적위 30°N, LHA 80°): 원의 위를 Pn, 아래를 Ps로 하고 지름 QQ′를 천의 적도로 잡는다.","Q′(또는 Q)에서 원을 따라 Pn 쪽으로 30°인 점 d′(또는 d)를 잡고 QQ′에 평행한 dd′를 긋는다. 천체는 이 적위의 거등권 위 어딘가에 있다.","아래쪽 보조 그림으로 천의 북극에서 내려다본 적도면을 그린다. 중심이 Pn이고, QPnQ′가 관측자의 천의 자오선이다(Q 쪽이 극상반원, Q′ 쪽이 극하반원).","[[지방시각·자오선각|LHA]]는 관측자의 자오선에서 서쪽으로 재므로, 시계방향을 서쪽으로 하여 Q에서 80°인 점 A를 잡는다. PnA가 천체의 시권이다.","A에서 위쪽 그림의 QQ′로 수선을 올린 점을 A′라 하고 Pn·A′·Ps를 지나는 시권을 그린다. 이 시권이 dd′와 만나는 점이 천체 M이다.[4]"]},{"steps":["수평좌표계(그림 1.29, 고도 25°, 방위 290°): 서점 쪽 천구 밖에서 바라본 정면도로, 위가 Z, 아래가 Na, 왼쪽이 N, 오른쪽이 S다. NS는 수평권, ZNa는 동서권이다.","S(또는 N)에서 Z 쪽으로 25°인 점 h(또는 h′)를 잡고 NS에 평행한 hh′를 긋는다. 이것이 고도의 거등권이다.","방위는 북을 기준으로 재며, 방위 290°는 [[방위·방위각|방위각]] N70°W다. 원 위에 NA = 70°인 점 A를 잡고, A에서 NS에 내린 수선의 발을 A′라 한다.","Z·A′·Na를 지나는 원을 그려 천체의 [[수직권·주수직권|수직권]]으로 한다. 이 수직권이 hh′와 만나는 점이 천체 M이다."]},"두 그림을 합친 것이 그림 1.30이다. Z를 위에 두고, 위도가 35°N이면 ZQ = 35°가 되게 Q를 잡는다. 그다음 적위 30°N·LHA 80°인 천체 M을 적도좌표계 방법으로 그린다.[1]","고도와 방위는 수평좌표계 작도를 거꾸로 하여 읽는다. M을 지나 NS에 평행한 hh′를 긋고 원의 중심에서 h까지 재면 고도 25°다. M을 지나는 호 ZA′Na를 그리고, A′에서 올린 수선이 원과 만나는 점 A로 NA를 재면 방위각 N70°W다.[1]",{"table":{"head":["항목","교재 작도값","구면삼각형 계산값"],"rows":[["고도 h","25°","24°12′.2"],["방위각 Z","N70°W","N69°14′.3W"],["방위 Zn","290°","290°45′.7"]]},"caption":"그림 1.30 예(L 35°N, d 30°N, LHA 80°) — 계산값은 위키 재계산[2]"},{"list":["방위각 앞의 N·S: 천체가 동서권(ZNa)의 북쪽에 있으면 N, 남쪽에 있으면 S.[5]","방위각 끝의 E·W: 지방시각(자오선각의 부호)에 따라, 천체가 관측자 자오선의 동쪽에 있으면 E, 서쪽에 있으면 W.","고도·방위가 주어져 같은 작도를 거꾸로 하면 적위와 LHA를 잴 수 있다. 이때 적위는 천체가 천의 적도 북쪽이면 N, 남쪽이면 S.","같은 경우 자오선각의 부호는 방위가 180° 미만이면 E, 180°를 넘으면 W.[1]"]}],"confusions":"방위각 앞 글자의 규칙에 주의한다. 이 쪽의 ‘동서권의 북쪽·남쪽’ 규칙은 가까운 쪽 극에서 90°까지 재는 방위각에 맞고, 동명극에서 180°까지 재는 방위각은 앞 글자가 늘 위도와 같은 이름이다. 이 예처럼 천체가 동서권 북쪽에 있으면 두 방식 모두 N70°W로 같다.[5]","key":["관측자의 천의 자오선 면에 투영 — 천의 적도 QQ′·수평권 NS는 지름","적도좌표: dd′(적위) × 시권(LHA) = M, 수평좌표: hh′(고도) × 수직권(방위) = M","방위각: 앞 N·S는 동서권 기준, 끝 E·W는 자오선의 동·서","예: L 35°N, d 30°N, LHA 80° → 작도 25°, N70°W (계산 24°12′.2, N69°14′.3W)"],"footnotes":["교재 25–27쪽, 그림 1.28–1.30.","교재 밖 보충 설명. 고도는 교재 157쪽 식 (8.4) sin h = sin L sin d + cos L cos d cos t로, 방위각은 cos Z = (sin d − sin L sin h) / (cos L cos h)로 계산했다. 작도값은 이를 어림한 근삿값이다.","교재 밖 보충 설명. 점을 지름에 수직으로 내려 옮기는 이 작도는 정사투영, 곧 무한히 먼 곳에서 평행한 선으로 비춘 그림이다. 참고: [Orthographic map projection — Wikipedia](https://en.wikipedia.org/wiki/Orthographic_map_projection). 정사투영에서 시권과 수직권은 엄밀히는 타원이 되므로, 교재처럼 세 점을 지나는 원으로 그리면 근사 작도가 된다.","교재 본문은 이 단계를 글로 설명하지 않는다. 그림 1.28의 점선(A에서 A′)과 Pn·A′·Ps를 지나는 곡선에서 읽었다.","교재 17–18쪽은 방위각을 ‘동명극을 0°로 하여 동 또는 서쪽으로 180°까지’ 재거나 ‘가까운 쪽의 극을 기준으로 90°까지’ 잰다고 정의한다."],"flags":[{"kind":"교재 밖","text":"자오선평면도 작도가 정사투영이며, 시권·수직권이 엄밀히는 타원이라는 설명을 덧붙였다.","fn":3},{"kind":"해석","text":"그림 1.28에서 A를 QQ′ 위의 A′로 옮겨 시권을 그리는 단계는 본문에 없어, 그림에서 읽어 작도 단계로 적었다.","fn":4},{"kind":"계산 확인","text":"그림 1.30 예(L 35°N, d 30°N, LHA 80°)를 식 (8.4)와 방위각 공식으로 계산하면 h = 24°12′.2, 방위각 N69°14′.3W(Zn 290°45′.7)이다. 교재 작도값 25°, N70°W(290°)와 각각 약 0°.8 차이로, 작도 근삿값이다. 그림 1.29의 방위 290° → 방위각 N70°W(360° − 290° = 70°) 환산은 일치한다.","fn":2},{"kind":"해석","text":"27쪽의 N·S 규칙(동서권 북쪽·남쪽)을 17–18쪽의 ‘가까운 쪽 극에서 90°까지’ 방식에 해당한다고 풀고, 동명극 기준 180° 방식과의 차이를 적었다.","fn":5}]},{"title":"적도평면도","easy":["천의 북극 바로 위에서 하늘을 내려다본다고 해 보자. [[천의 적도]]는 커다란 원으로 보이고, 원의 중심이 천의 북극이다. 여러 자오선은 중심에서 바깥으로 뻗은 시곗바늘처럼 보인다.","이 그림에서는 시계방향이 서쪽이다. 하늘은 동에서 서로 돌므로 별의 바늘도 시계방향으로 1시간에 15°씩 돈다. 이 그림을 **적도평면도**(Diagram on the plane of celestial equator) 또는 **시각도**(Time diagram)라 한다.[2]","바늘 사이의 각을 읽으면 시각 계산이 쉬워진다. 예를 들어 경도 30°W인 배에서는 그리니치 바늘 G가 내 바늘 M보다 동쪽 30°에 있다. 그래서 천체의 [[본초시각|GHA]]에서 30°를 빼면 [[지방시각·자오선각|LHA]]가 된다."],"definition":"천구 밖에서 천의 축(Celestial axis) 방향으로 본 관측자와 천체 사이의 관계를 천의 적도면에 투영한 그림을 적도평면도(Diagram on the plane of celestial equator) 또는 시각도(Time diagram)라 하며, 시각에 관한 사항을 계산할 때 편리하다.[1]","terms":[{"ko":"적도평면도","en":"Time diagram","plain":"천의 북극 쪽에서 내려다본 적도면 그림. 시각도"},{"ko":"극상반원","en":"Upper branch","plain":"자오선 가운데 천정 쪽 절반. 기호 M·G"},{"ko":"극하반원","en":"Lower branch","plain":"자오선 가운데 천저 쪽 절반. 기호 m·g"},{"ko":"본초시각","en":"Greenwich Hour Angle","abbr":"GHA","plain":"Greenwich 자오선에서 서쪽으로 잰 시각"},{"ko":"[[항성시각]]","en":"Sidereal Hour Angle","abbr":"SHA","plain":"춘분점에서 서쪽으로 잰 시각"},{"ko":"[[춘분점의 GHA]]","en":"GHA of Aries","abbr":"GHA♈","plain":"Greenwich 자오선에서 춘분점까지 서쪽으로 잰 각"}],"why":"천측계산의 첫 단계는 [[천측력]]에서 찾은 GHA로 LHA를 만드는 일이다. 별이라면 GHA♈에 SHA를 더해 GHA를 만들고, 다시 경도를 더하거나 뺀다. 경도가 E인지 W인지에 따라 더할지 뺄지 헷갈릴 때 시각도를 그려 보면 바로 보인다.[3]","body":["그림 1.31의 바깥 원은 천의 적도다. 시계방향을 서쪽, 반시계방향을 동쪽으로 정하면 이 그림은 천구를 천의 북극 쪽에서 투영한 것이 되고, 원의 중심은 천의 북극이다.[1] 3D 장면 4에서 시각 사이의 관계를 직접 움직여 볼 수 있다.",{"list":["M: 관측자 자오선의 [[천의 자오선·시권|극상반원]]. 원의 중앙 위쪽에 그린다.","m: 관측자 자오선의 극하반원. 점선으로 그린다.","G, g: 본초자오선의 극상반원과 극하반원. 경도가 30°W이면 Greenwich가 관측자보다 동쪽에 있으므로 G를 관측자 자오선의 동쪽 30°에 그린다.","천체의 시권, 춘분시권(♈) 등은 각각의 시각에 맞는 자리에 그려 넣는다.[1]"]},{"table":{"head":["각","시작","끝","방향·범위"],"rows":[["GHA","G","천체의 시권","서쪽(시계방향) 0°~360°"],["LHA","M","천체의 시권","서쪽(시계방향) 0°~360°"],["t","M","천체의 시권","가까운 쪽 E 또는 W, 0°~180°"],["SHA","♈","천체의 시권","서쪽(시계방향) 0°~360°"],["GHA♈","G","♈","서쪽(시계방향)"],["LHA♈","M","♈","서쪽(시계방향)"],["λ(경도)","G","M","W 경도면 서쪽, E 경도면 동쪽"]]},"caption":"시각도에서 각을 읽는 법[4]"},"그림 1.31에는 경도 W인 관측자에게 M의 서쪽에 있는 달과 동쪽에 있는 태양이 그려져 있다. 달은 t(W) = LHA로 바로 읽힌다. 태양은 t(E)를 반시계방향으로 재고, LHA·GHA·SHA는 서쪽으로 크게 도는 호(그림에서는 약 285°)가 된다(t(E) = 360° − LHA). 호를 이어 붙이면 다음 관계가 그림에서 바로 보인다.[4][3]",{"formula":"LHA = GHA ± λ (경도 E이면 +, W이면 −)","label":"식 (1.4)"},"λ는 관측자의 경도다. 동경이면 M이 G보다 동쪽에 있어 LHA가 GHA보다 크고, 서경이면 M이 G보다 서쪽에 있어 LHA가 GHA보다 작다.",{"formula":"GHA = GHA♈ + SHA","label":"식 (1.5)"},"별의 GHA는 G에서 ♈까지의 호(GHA♈)에 ♈에서 별까지의 호(SHA)를 이어 붙인 것이다. 360°를 넘으면 360°를 뺀다.",{"table":{"head":["순서","계산","값"],"rows":[["① 천체의 GHA(예)","천측력에서 찾은 값이라 하자","100°"],["② 경도 λ","30°W → 식 (1.4)에서 뺀다","− 30°"],["③ LHA","100° − 30°","70°"],["④ t","LHA가 180° 이하 → t(W) = LHA","70°W"]]},"caption":"경도 30°W 관측자의 시각도 읽기 (위키 예시 값)"}],"confusions":"이 그림의 M은 천체가 아니라 관측자 자오선의 극상반원이다. [[항해삼각형]]이나 [[자오선평면도]] 그림에서는 M이 천체를 뜻하므로 헷갈리지 않도록 한다.","key":["시각도: 천의 북극 쪽에서 본 적도면, 중심 = 천의 북극, 시계방향 = 서쪽","M/m = 관측자 자오선 극상/극하반원, G/g = 본초자오선 극상/극하반원","경도 30°W → G는 M의 동쪽 30°, LHA = GHA − 30°","GHA·LHA·SHA = G·M·♈에서 서쪽으로 잰 호"],"footnotes":["교재 27–28쪽, 그림 1.31.","교재 밖 보충 설명. 영문 항해 교재도 시각도를 ‘북극 위에서 내려다본 적도면’으로 그리고, 극을 중심으로 원을 그린 뒤 자오선을 바깥으로 뻗게 그리라고 설명한다. 참고: [The Whys and Wherefores of Navigation — Gershom Bradford, 1918 (Project Gutenberg)](https://gutenberg.org/cache/epub/73652/pg73652-images.html).","교재 19쪽, 식 (1.3), (1.4). 교재 34–35쪽, 식 (1.5).","교재 28쪽, 그림 1.31. 그림에는 LHA♈가 그려져 있고 GHA♈는 그려져 있지 않다. GHA♈는 GHA의 정의대로 G에서 ♈까지 서쪽으로 잰 호다."],"flags":[]},{"title":"천측력","easy":["배 위에서 육분의로 태양의 높이를 쟀다고 하자. 그 높이로 내 위치를 알려면, 바로 그 순간 태양이 하늘 어디에 있었는지 알아야 한다. 이것을 1년치 미리 계산해 한 권에 묶은 책이 **천측력**(Nautical Almanac)이다.","천측력은 하늘의 열차 시간표와 비슷하다. 시간표가 몇 시에 기차가 어느 역에 있는지 알려 주듯, 천측력은 그리니치 시각으로 매시 정각에 태양·달·행성·별이 어디에 있는지 적어 둔다.[2]","위치는 하늘의 경도와 위도에 해당하는 두 값으로 적는다. 그리니치에서 서쪽으로 잰 [[본초시각]](Greenwich Hour Angle, GHA)과, 하늘의 적도에서 남북으로 잰 [[적위]](Declination, Dec)다. 예를 들어 2019년 1월 2일 GMT 5시의 태양은 GHA 254°03′.4, Dec S22°56′.3에 있었다.[3]"],"definition":"천측력(天測曆, Nautical Almanac)은 해상에서 천체를 관측해 선위를 정할 때 필요한 항해용 천체들의 위치를 적도좌표(Equatorial coordinates)로 나타내고, 자차(Deviation)·정중시(Meridian passage)·출몰시(Sunrise, Sunset)·박명시(Twilight) 등을 계산하는 데 필요한 여러 자료와 약도를 실은 책자다. 매년 국립해양조사원에서 간행한다.[1]","terms":[{"ko":"천측력","en":"Nautical Almanac","plain":"천체 위치를 매시 정각마다 미리 계산해 둔 1년치 책"},{"ko":"[[본초시각]]","en":"Greenwich Hour Angle","abbr":"GHA","plain":"그리니치 자오선에서 서쪽으로 잰 천체의 각"},{"ko":"[[적위]]","en":"Declination","abbr":"Dec","plain":"천의 적도에서 남북으로 잰 각. 하늘의 위도"},{"ko":"세계시(그리니치 평균시)","en":"Universal Time (Greenwich Mean Time)","abbr":"UT (GMT)","plain":"천측력을 펼 때 쓰는 기준 시각"},{"ko":"[[주표]]","en":"Daily pages","plain":"사흘치 천체 위치를 매시 정각마다 적은 본문 표"},{"ko":"[[증분 및 개정표]]","en":"Increments and Corrections","plain":"정각 사이 분·초만큼의 변화를 더하는 표"}],"why":"천측으로 선위를 구하는 흐름은 관측 → 고도개정 → 계산고도 → 고도차 → 위치선이다. 이 가운데 계산고도를 구하려면 관측 순간 천체의 GHA와 Dec가 있어야 하고, 그 값을 주는 책이 천측력이다. GHA와 Dec는 천체 바로 아래 지점인 [[천체의 지위]]가 되고, [[천측계산]]을 시작하는 재료가 된다.[4]","body":["천측력에 실린 천체의 위치는 [[적도좌표계|적도좌표]], 곧 GHA와 Dec로 주어진다. 현재 우리나라 천측력은 한국천문연구원과 미국 해군 천문대(U.S. Naval Observatory, USNO)의 자료를 편집해 간행한 것이다.[1] 영국은 1767년부터, 미국은 1852년부터 천측력을 펴냈고, 1958년부터는 두 나라 기관이 함께 통합된 천측력을 만든다.[2]","천측력은 크게 [[주표]]와 [[증분 및 개정표]]로 나뉜다. 주표에서 정각 값을 찾고, 증분 및 개정표로 정각 사이 분·초만큼을 더하는 식으로 함께 쓴다. 그 밖에 다음 표와 그림이 실려 있다.[1]",{"list":["태양, 항성 및 행성의 고도개정표 — [[태양의 고도개정]], [[항성·행성의 고도개정]]에 쓴다","행성도, 성좌도","항성표 — 173개 항성의 매월 SHA와 Dec ([[항성의 GHA·Dec]])","북극성표, 호도시간환산표, 일·월출몰 개정표"]},"정의에 나오는 ‘자차’는 컴퍼스의 자차(自差, Deviation)를 말한다. 천체의 방위를 계산해 컴퍼스로 잰 방위와 비교하면 컴퍼스 오차를 알 수 있기 때문이다.[5]"],"confusions":"천측력은 UT(GMT)로 찾는다. 관측한 날짜와 시각도 먼저 GMT로 바꾼 뒤 표를 편다.[6] 또 천측력에 나오는 ‘시차’는 時差(Equation of time, 균시차)로, 고도개정의 [[시차·수평시차|시차(視差, Parallax)]]와 한자가 다른 별개의 말이다.","key":["천측력(Nautical Almanac): 매년 국립해양조사원 간행, 자료는 한국천문연구원 + 미국 해군 천문대(USNO)","천체 위치는 적도좌표(GHA, Dec)로, 매시 정각 값","구성: 주표 + 증분 및 개정표, 그 밖에 고도개정표·항성표·북극성표 등","찾는 기준 시각은 GMT"],"footnotes":["교재 28–29쪽.","교재 밖 보충 설명. 천측력은 태양·달·행성·춘분점이 머리 위에 오는 지구 위 지점을 1년 내내 매시 정각마다 Dec와 GHA로 적는다. 영국 HM Nautical Almanac Office는 1767년부터, 미국 해군 천문대는 1852년부터 천측력을 펴냈고 1958년부터 두 기관이 통합된 천측력을 함께 만든다. 참고: [Nautical almanac — Wikipedia](https://en.wikipedia.org/wiki/Nautical_almanac).","교재 32쪽 예제.","교재 152쪽, 식 (8.2) 및 160쪽.","교재 밖 보충 설명. 자차(Deviation)는 선체 자기(磁氣) 때문에 생기는 자기 컴퍼스의 오차다. 천체의 방위를 계산해 컴퍼스로 잰 방위와 비교하면 컴퍼스 오차(편차 + 자차)를 알 수 있고, 여기서 편차(Variation)를 가감해 자차를 구한다.","교재 32쪽."],"flags":[{"kind":"해석","text":"28쪽 정의의 ‘자차’를 컴퍼스의 자차(自差, Deviation)로 해석했다. 교재에 ‘자차’로 분명히 인쇄되어 있으며, 주표의 ‘시차(時差)’와는 다른 말이다.","fn":5}]},{"title":"주표","easy":["[[천측력]]을 펴면 왼쪽과 오른쪽 두 쪽이 한 묶음으로, 사흘치 자료가 들어 있다. 이 펼친 두 쪽이 **주표**(Daily pages)다. 1년치가 이렇게 사흘씩 이어진다.[5]","왼쪽 쪽에는 별 계산의 기준점인 춘분점과 행성 4개, 별 57개가 실린다. 오른쪽 쪽에는 태양과 달, 그리고 해·달이 뜨고 지는 시각과 박명(해 뜨기 전과 해 진 뒤의 어스름) 시각이 실린다.","표의 한 줄은 그리니치 시각(GMT)으로 매시 정각 하나다. 예를 들어 1월 1일 13시 줄에서 달의 GHA 67°36′.6을 읽는다. 13시 34분처럼 정각 사이의 값은 [[증분 및 개정표]]로 채운다.[3]"],"definition":"주표(Daily pages)는 [[천측력]]의 중심이 되는 표다. 찾기 편하도록 3일분의 각종 천체 요소를 좌우 두 페이지에 나누어 싣는다.[1]","terms":[{"ko":"주표","en":"Daily pages","plain":"사흘치 천체 자료를 펼친 두 쪽에 담은 표"},{"ko":"[[관측자의 천의 자오선·자오선정중|극상정중시]]","en":"Meridian Passage","abbr":"Mer. Pass.","plain":"천체가 자오선을 지나는 시각"},{"ko":"[[겉보기반지름]]","en":"Semidiameter","abbr":"SD","plain":"태양·달 원반의 반지름을 각도로 잰 값"},{"ko":"[[시차·수평시차|수평시차]]","en":"Horizontal Parallax","abbr":"HP","plain":"달 고도개정에 쓰는 시차 값"},{"ko":"균시차(시차, 時差)","en":"Equation of Time","abbr":"Eqn. of time","plain":"시태양시와 평균태양시의 차"},{"ko":"박명","en":"Twilight","plain":"해 뜨기 전·해 진 뒤 하늘이 밝은 시간"},{"ko":"지방평시","en":"Local Mean Time","abbr":"LMT","plain":"그 장소의 경도로 정한 평균태양시"}],"why":"천측 계산의 첫 단계는 관측 시각의 GHA와 Dec를 찾는 일이고, 그 출발점이 주표다. [[태양의 고도개정]]에 필요한 SD, [[달의 고도개정]]에 필요한 HP도 주표에서 읽는다. 별과 행성은 수평선과 별이 함께 보이는 박명 때 관측하므로, 주표의 박명시로 관측 시각을 미리 정한다.[6]","body":["왼쪽 페이지에는 다음이 실려 있다.[1]",{"list":["맨 왼쪽 란: UT(GMT), 일자, 요일","ARIES 란: 매시의 [[춘분점의 GHA|춘분점 GHA]]. 란 아래에 가운데 날의 춘분점 극상정중시(Mer. Pass.)를 GMT로 싣는다.","행성 4란(금성·화성·목성·토성): 매시의 GHA와 Dec. 행성 이름 옆 수치(예: +0.5)는 가운데 날의 등급(밝기)이고, 맨 아래에 [[v·d 값|v와 d]]가 있다.","STARS 란: 57개 항성의 [[항성시각|SHA]]와 Dec를 알파벳순으로, 3일 공통으로 싣는다.","항성란 아래: 행성의 극상정중시(Mer. Pass., GMT)와 SHA. Star finder를 쓰거나 항성과의 상대 위치를 알 때 도움이 된다."]},"오른쪽 페이지에는 태양과 달의 자료가 실려 있다.[2]",{"list":["맨 왼쪽 란: 일자, 요일, UT(GMT)","SUN 란: 매시의 GHA와 Dec. 맨 아래에 d와 가운데 날의 SD가 있다. 태양의 GHA는 1시간에 거의 15°씩 변해 v 개정이 필요 없으므로 v는 싣지 않는다.","MOON 란: 매시의 GHA, v, Dec, d, HP. HP는 달의 수평시차(Horizontal parallax)로 달의 고도개정에 필요하다. 맨 아래에는 날마다의 SD가 왼쪽부터 차례로 실려 있다. 달은 변화가 빨라 날마다 따로 싣는다.","나머지 절반: 위도 2°·5°·10° 간격으로 항해박명시(Nautical Twilight), 상용박명시(Civil Twilight), 일출몰시(Sunrise, Sunset), 날마다의 월출몰시(Moonrise, Moonset)를 지방평시(LMT)로 싣는다.","페이지 아래: 태양의 GMT 00h·12h의 시차(Eqn. of time)와 자오선정중시(Mer. Pass.), 달의 극상·극하정중시를 지방평시로 싣고, 월령(Age)과 위상(Phase)도 싣는다."]},"주표의 GHA와 Dec는 매시 정각(GMT)의 값이다. 분·초에 대한 값은 [[증분 및 개정표]]로 보간한다.[3]",{"table":{"head":["찾는 것","어느 쪽","어느 란"],"rows":[["별 계산용 GHA♈","왼쪽","ARIES"],["행성 GHA·Dec, v·d","왼쪽","VENUS·MARS·JUPITER·SATURN"],["항성 SHA·Dec","왼쪽","STARS"],["태양 GHA·Dec, d, SD","오른쪽","SUN"],["달 GHA·Dec, v·d, HP, SD","오른쪽","MOON"],["박명·일출몰·월출몰 시각(LMT)","오른쪽","나머지 절반"]]},"caption":"주표에서 무엇을 어디서 찾나 — 교재 29–30쪽 정리"}],"confusions":"오른쪽 페이지 아래의 ‘시차’는 時差(Equation of time), 곧 균시차다. 고도개정에 쓰는 視差(Parallax, 달은 HP로 주어짐)와는 한자가 다른 별개의 말이다.[4] 또 같은 Mer. Pass.라도 왼쪽 페이지(춘분점·행성)는 GMT, 오른쪽 페이지(태양·달)는 지방평시로 적혀 있다.","key":["주표(Daily pages) = 3일분, 좌우 두 페이지, 매시 정각 값","왼쪽: ARIES(GHA♈), 행성 4개(GHA·Dec·v·d·등급), 57개 항성(SHA·Dec)","오른쪽: SUN(GHA·Dec·d·SD), MOON(GHA·v·Dec·d·HP·SD), 박명·출몰시(LMT)","시차(時差, Eqn. of time) ≠ 시차(視差, Parallax)"],"footnotes":["교재 29쪽.","교재 30쪽.","교재 30–31쪽, 33쪽 예제.","교재 밖 보충 설명. 시차(時差)는 균시차라고도 하며, 시태양시(실제 태양으로 잰 시각)와 평균태양시의 차이다. 1년 동안 대략 −14분에서 +16분 사이를 오간다. 참고: [Equation of time — Wikipedia](https://en.wikipedia.org/wiki/Equation_of_time).","교재 밖 보충 설명. 미국 항해 교범 Bowditch도 천측력의 펼친 두 쪽에 연속된 사흘치 자료가 실리고, 책의 대부분이 GHA와 Dec의 매시 표라고 설명한다. 참고: [Bowditch, The American Practical Navigator (2017), Chapter 17 The Almanacs](https://thenauticalalmanac.com/2017_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2017-%20The%20Almanacs.pdf).","교재 밖 보충 설명. Bowditch는 별·행성 관측을 박명 때 하고, 관측 전에 고도와 방위를 미리 계산해 두라고 설명한다. 참고: [Bowditch, The American Practical Navigator (2017), Chapter 14 Instruments for Celestial Navigation](https://thenauticalalmanac.com/2017_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2014-%20Instruments%20For%20Celestial%20Navigation.pdf)."],"flags":[{"kind":"교재 밖","text":"Eqn. of time(시차, 時差)의 뜻(균시차: 시태양시와 평균태양시의 차)과 크기(약 −14분 ~ +16분)를 덧붙였다. 2장의 시차(視差, Parallax)와 다른 말이다.","fn":4}]},{"title":"증분 및 개정표","easy":["[[주표]]는 매시 정각 값만 준다. 그런데 실제 관측은 2시 56분 08초처럼 정각 사이에 한다. 정각 뒤 몇 분 몇 초 동안 천체가 더 움직인 각을 미리 계산해 둔 표가 **증분 및 개정표**(Increments and Corrections)다.","자동차가 시속 60 km로 달리면 30분 뒤에는 30 km를 더 간다. 태양도 1시간에 15°씩 서쪽으로 가므로, 56분 08초 동안에는 14°02′.0을 더 간다. 이 ‘더 간 각’이 **증분**(Increment)이다.[2]","천체마다 걷는 빠르기가 조금씩 달라서 표에는 태양·행성(SUN PLANETS), 춘분점(ARIES), 달(MOON) 세 칸이 따로 있다. 실제 빠르기가 기준과 조금 다른 몫은 같은 표 오른쪽 칸에서 [[v·d 값|v·d 개정]]으로 보탠다."],"definition":"증분 및 개정표(Increments and Corrections)는 주표의 정시 값에 분·초만큼의 GHA 증분(Increment)과, v·d에 대한 개정량(Correction)을 더할 때 쓰는 보간표(Interpolation table)다.[1]","terms":[{"ko":"증분 및 개정표","en":"Increments and Corrections","plain":"정각 이후 분·초만큼 더할 값을 모은 표"},{"ko":"증분","en":"Increment","plain":"정각 이후 분·초 동안 GHA가 늘어난 양"},{"ko":"보간","en":"Interpolation","plain":"두 표 값 사이의 값을 비례로 채우는 일"},{"ko":"v·d 개정량","en":"v or d Correction","abbr":"v or d Corr.","plain":"v·d에 대한 개정량. 표 오른쪽 칸"},{"ko":"기준 변화량","en":"Adopted hourly rate","plain":"표를 만들 때 정해 둔 1시간당 GHA 변화"}],"why":"주표의 정각 값에 이 표의 증분을 더해야 관측 순간의 GHA가 된다. 태양의 GHA는 4초에 1′씩 변하고, 각 1′은 적도에서 약 1해리이므로 초 단위까지 정확히 더해야 한다.[3] 이렇게 구한 GHA가 [[지방시각·자오선각|LHA]]를 거쳐 계산고도에 들어간다.","body":["표는 1분마다 하나씩 모두 60개이고, 각 표는 다시 왼쪽과 오른쪽 두 부분으로 나뉜다.[1]","왼쪽 부분에는 SUN PLANETS, ARIES, MOON 세 란이 있다. 세 란은 GHA가 1시간에 변하는 기준량이 서로 달라, 란마다 그 분·초에 해당하는 GHA 증분을 따로 싣는다. 기준량과 예는 아래 표와 같다.[2]",{"table":{"head":["란","기준 변화량","56m08s의 증분"],"rows":[["SUN PLANETS (태양 및 행성)","15° / hour","14°02′.0"],["ARIES (춘분점)","15°02′.46 / hour","14°04′.3"],["MOON (달)","14°19′.0 / hour","13°23′.6"]]},"caption":"교재 31쪽 — 기준량과 GMT 2시 56분 08초 관측의 증분"},"증분은 비례 계산으로 나온다. 예를 들어 태양 란이라면 아래와 같다.",{"formula":"증분 = 기준 변화량 × (분 + 초/60) ÷ 60"},"여기서 기준 변화량은 1시간에 변하는 각, (분 + 초/60)은 정각 이후 지난 시간을 분으로 나타낸 값이다. 56분 08초는 56.133분이므로 15° × 56.133 ÷ 60 = 14°02′.0이 된다.",{"table":{"head":["순서","계산","값"],"rows":[["① 정각 GHA","주표에서 그날 2시의 GHA를 찾는다","(주표 값)"],["② 증분","증분표 56분 표, 08초 줄, 알맞은 란","태양 14°02′.0"],["③ 관측 순간 GHA","① + ②","(합)"]]},"caption":"교재 31쪽 — GMT 2시 56분 08초에 태양이나 행성을 관측했을 때"},"오른쪽 부분(v or d Corr.)은 주표의 [[v·d 값|v와 d]]에 대한 개정량을 분(m) 단위로 주는 보간표다. 태양과 춘분점의 GHA는 1시간에 거의 정확히 기준량만큼 변하므로 v 개정이 필요 없고, 행성과 달은 v 개정을 한다. v·d 개정량은 작아서 관측 시각의 초(s)까지 따질 필요 없이 분(m)만으로 찾으면 충분하다.[2]"],"confusions":"증분은 같은 분·초라도 란마다 다르다. 56분 08초라면 SUN PLANETS 란은 14°02′.0, MOON 란은 13°23′.6으로 38′.4나 차이 나므로, 란을 잘못 고르면 큰 오차가 생긴다.","key":["60개 표(1분마다), 왼쪽 = 분·초 증분, 오른쪽 = v or d Corr.","기준량: 태양·행성 15°/h, 춘분점 15°02′.46/h, 달 14°19′.0/h","56m08s 증분: 태양 14°02′.0, 춘분점 14°04′.3, 달 13°23′.6","v·d 개정은 분 단위로만 찾는다"],"footnotes":["교재 30쪽.","교재 31쪽. 달의 기준량은 교재에 14°19′00″로 인쇄되어 있다(= 14°19′.0). v·d 개정에 대해 교재는 ‘초(″)에 대한 개정이 필요 없으므로 분(′)에 대한 개정만으로 충분’이라고 썼는데, 개정표가 관측 시각의 분(m)마다 하나씩이므로 여기서 초·분은 각도가 아니라 시각의 초·분이다.","교재 밖 보충 설명. 15°/h는 1분에 15′, 4초에 1′이다. 해리(Nautical mile)는 본래 위도 1′에 해당하는 자오선 길이로 정했고, 지금은 정확히 1852 m다. 참고: [Nautical mile — Wikipedia](https://en.wikipedia.org/wiki/Nautical_mile)."],"flags":[{"kind":"해석","text":"3
