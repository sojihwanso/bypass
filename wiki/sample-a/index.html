작은 [[시차·수평시차|시차]](P)도 더한다.","다행히 R·SD·P는 [[천측력]]의 태양 고도개정표가 한 숫자로 묶어 준다. 교재 예제에서는 표 값 +15′.2에 IC −2′.0과 D −6′.1을 더해, hs 51°28′.4가 Ho 51°35′.5가 된다."],"definition":"태양의 Sextant 고도(hs)에 기차개정(IC)·안고차(Dip, D)·천문기차(Refraction, R)·시차(Parallax, P)·겉보기반지름(Semidiameter, SD)을 개정하고, 상변이면 광삼(Irradiation, J)까지 개정해, 태양 중심의 진고도인 관측고도(Observed altitude, Ho)를 구하는 것이다.[1]","terms":[{"ko":"태양의 고도개정","en":"Sun altitude correction","plain":"태양의 hs를 Ho로 고치는 계산"},{"ko":"[[겉보기반지름|하변·상변]]","en":"Lower limb · Upper limb","plain":"태양 원판의 아래·위 가장자리"},{"ko":"고도개정표","en":"Altitude correction tables","plain":"천측력 A2·A3쪽. R·SD·P를 묶은 값"},{"ko":"겉보기고도","en":"Apparent altitude","abbr":"App. Alt.","plain":"고도개정표를 찾을 때 쓰는 고도"},{"ko":"개정고도","en":"Corrected sextant altitude","abbr":"hr","plain":"hs에 IC와 D를 먼저 고친 고도"},{"ko":"임계표","en":"Critical table","plain":"보간하지 않고 구간마다 한 값을 주는 표"}],"why":"태양은 낮에 언제나 볼 수 있어 가장 자주 쓰는 천체다. 오전 관측, 정오 위도, 오후 관측이 모두 이 개정에서 시작한다. 여기서 얻은 Ho를 계산고도 Hc와 비교해 고도차를 구하고 [[위치선]]을 그린다. 그 과정은 [[Sun Sighting]]에서 이어진다.","body":["그림 2.14에서 O는 안고 h인 관측자의 눈, C는 지구 중심, M·M′는 태양 중심의 진위치·겉보기위치, L·L′는 각각의 하변이다. ∠LOL′ = R([[천문기차·평균기차|천문기차]]), ∠H′Oh = D, ∠MOL = SD, ∠OMC = P다. 하변고도 hs = ∠L′Oh, 진고도 Ho = ∠MCH이다.[1]","상변을 관측하면 SD의 부호가 반대가 되고, [[광삼]] 개정(−J)이 추가된다.[1] 그래서 하변과 상변의 식이 따로 있다.",{"formula":"Ho = hs ± IC − D − R + SD + P","label":"식 (2.20) 하변"},{"formula":"Ho = hs ± IC − D − R − SD + P − J","label":"식 (2.21) 상변"},"식의 각 항은 이렇다. ± IC는 [[육분의 오차·기차개정|기차개정]], −D는 안고차, −R은 천문기차, ± SD는 [[겉보기반지름]], +P는 시차, −J는 광삼이다. 부호가 고정된 것은 D·R(−)과 P(+)이고, SD는 하변·상변에 따라 바뀐다.",{"table":{"head":["요소","태양 고도개정표에 쓰인 값"],"rows":[["기차(R)","STARS AND PLANETS표(A2·A3쪽)의 평균기차"],["시차(P)","평균적도수평시차 8″.80 → 고도 0°~70°07′은 0′.1, 그 이상은 0′.0"],["겉보기반지름(SD)","10월~3월 16′.15, 4월~9월 15′.9"],["광삼(J)","상변만: 수평광삼 (−)0′.6 + 상변 광삼 (−)0′.6 = (−)1′.2"],["하변·상변 개정치의 차","2·SD + 1′.2"],["표 읽기","임계표: 보간하지 않고, 경계값이면 위쪽 값을 택함"]]},"caption":"교재 65–66쪽 — A2쪽 ‘SUN’표는 고도 10°~90°, A3쪽 표는 0°~10°용이며 10월~3월은 왼쪽, 4월~9월은 오른쪽 표를 쓴다."},"영문 자료도 태양의 SD는 고도개정표에 이미 들어 있어 따로 넣지 않는다고 설명한다.[2] 곧 표 하나로 R·SD·P(상변은 J까지)를 한 번에 처리한다.",{"steps":["고도 측정에 쓴 Sextant의 기차개정(IC)을 구한다.","A2쪽 안고차표에서 관측 시 안고에 대한 안고차(D)를 구한다.","하변·상변에 따라 A2쪽이나 A3쪽 해당 란에서, Sextant 고도를 겉보기고도(App. Alt.)로 보고 개정치를 구한다.","겉보기고도가 50° 이하이고 대기가 평균상태와 다르면 A4쪽 기온·기압개정치(TB)를 구하거나, 항해표 제23표·제24표로 기온개정치(T)와 기압개정치(B)를 구한다.","①~④의 대수합을 부호에 따라 Sextant 고도에 가감해 관측고도(Ho)로 한다."]},{"table":{"head":["순서","항목","값"],"rows":[["①","IC","−2′.0"],["②","D (HE 12 m)","−6′.1"],["③","하변 개정치 (A2쪽 SUN표, 4월~9월)","+15′.2"],["④","sum (+ 쪽 / − 쪽)","+15′.2 / −8′.1"],["⑤","corr. = 15′.2 − 8′.1","(+) 7′.1"],["⑥","hs","51°28′.4"],["⑦","Ho = 51°28′.4 + 7′.1","51°35′.5"]]},"caption":"교재 67쪽 예제 — 2019년 6월 2일, HE 12 m, IC (−)2′.0인 Sextant로 잰 태양 하변고도 51°28′.4[3]"},"③의 +15′.2가 어떻게 나왔는지 풀어 보면 이해가 쉽다. 6월이므로 SD 15′.9, 시차 +0′.1, 고도 51.5°의 평균기차 −0′.8을 합하면 15′.9 + 0′.1 − 0′.8 = +15′.2다. 표 하나가 세 요소를 묶은 것이다.[4]"],"confusions":"표를 찾는 겉보기고도는 교재에서는 보통 hs를 그대로 쓴다. 그러나 5° 이하 저고도에서는 hs에 IC와 D를 먼저 가감한 개정고도(hr)를 겉보기고도로 보고 A3쪽 표를 찾는다. 그다음 A4쪽 추가고도개정표나 항해표 제23·24표로 기온·기압개정치를 구해, 표 값과 함께 hr에 가감한다.[5]","key":["하변: Ho = hs ± IC − D − R + SD + P (2.20)","상변: Ho = hs ± IC − D − R − SD + P − J (2.21)","천측력 태양표: 10월~3월 왼쪽 / 4월~9월 오른쪽, 하변·상변 차 = 2·SD + 1′.2","5° 이하: hs에 IC·D 먼저 → 개정고도 hr로 표 찾기"],"footnotes":["교재 63–65쪽, 그림 2.14, 식 (2.20), (2.21).","교재 밖 보충 설명. 참고: [Altitude Correction for Semi-Diameter — Astro Navigation Demystified](https://astronavigationdemystified.com/semi-diameter/).","교재 67쪽.","교재 밖 보충 설명. 교재 65–66쪽의 표 구성(SD 15′.9, 시차 0′.1)과 식 (2.7)의 평균기차로 다시 계산한 값이다.","교재 66–67쪽. 영문 자료는 고도와 관계없이 늘 Ha = hs ± IC − D를 먼저 구해 표를 찾는다. 참고: [Correction Tables for Sextant Altitudes — siranah.de](https://siranah.de/html/sail040h.htm)."],"flags":[{"kind":"계산 확인","text":"교재 67쪽 태양 하변 예제: (+15′.2) + (−2′.0 − 6′.1) = +7′.1, 51°28′.4 + 7′.1 = 51°35′.5. 재계산 일치. D는 식 (2.13)으로 12 m(39.4 ft) → 6′.09 ≈ 6′.1이고, 하변 개정치도 SD 15′.9 + P 0′.1 − R 0′.8(식 (2.7), 고도 51.5°) = 15′.2로 표 값과 맞는다."},{"kind":"해석","text":"영문 자료는 늘 Ha(= hs ± IC − D)로 표를 찾고, 교재는 5° 이하에서만 hr로 찾는다. 본문은 교재 방식을 따랐다. 이 예제에서 Ha로 찾으면 51°20′.3인데, 식 (2.7)의 평균기차는 51°20′.3에서 0′.777, 51°28′.4에서 0′.773으로 0′.004밖에 다르지 않다.","fn":5}]},{"title":"항성·행성의 고도개정","easy":["새벽이나 저녁 박명에 별을 Sextant로 수평선까지 끌어내려 잰다. 별은 점으로 보이니 ‘가장자리’가 없다. 그래서 태양처럼 반지름(SD)을 더하거나 뺄 일이 없다.","아주 먼 항성은 [[시차·수평시차|시차]]도 0이다. 그래서 영점(IC), 눈높이(D), 공기 굴절(R) 세 가지만 고치면 된다. 이것이 **항성의 고도개정**이다.","행성 가운데 지구에 가까운 금성·화성만 조금 더 챙긴다. 작은 시차와, 반쯤 빛나 중심이 비켜 보이는 [[위상]]이다. 교재 금성 예제에서 이 둘을 합친 값은 +0′.1이다."],"definition":"항성과 행성은 중심고도를 직접 잴 수 있으므로 겉보기반지름(Semidiameter, SD) 개정이 없다. 기차개정(IC)·안고차(Dip, D)·천문기차(Refraction, R)만 개정하고, 금성·화성은 시차(Parallax, P)와 위상(Phase, F)까지 개정해 관측고도(Observed altitude, Ho)를 구한다.[1]","terms":[{"ko":"항성·행성의 고도개정","en":"Star and planet altitude correction","plain":"별·행성의 hs를 Ho로 고치는 계산"},{"ko":"STARS AND PLANETS표","en":"Stars and Planets correction table","abbr":"☆−P","plain":"천측력 A2·A3쪽의 평균기차표"},{"ko":"추가개정","en":"Additional correction","abbr":"add′l","plain":"금성·화성의 시차와 위상을 묶은 값"},{"ko":"추가기차개정","en":"Additional refraction correction","abbr":"TB","plain":"기온·기압이 평균과 다를 때의 기차 개정"},{"ko":"[[천문기차·평균기차|평균기차]]","en":"Mean refraction","abbr":"Rm","plain":"표준 날씨(10℃, 1010 mb)의 천문기차"}],"why":"박명 때 별 3~5개를 연달아 재면, 여러 방향의 [[위치선]]이 한 점 가까이에서 만나 선위가 나온다. 각 별의 Ho는 이 개정으로 구한다. 식이 짧아서 계산이 빠르지만, 같은 시간에 여러 별을 다루므로 안고차와 기차를 별마다 정확히 찾아야 한다. 이어지는 계산은 [[Star Sighting]]에서 볼 수 있다.","body":["항성과 행성은 중심고도를 잴 수 있어 [[겉보기반지름]] 개정이 필요 없다. 그래서 [[태양의 고도개정|태양의 (2.20)식]]에 준해 (2.22)식을 얻으며, 이는 금성과 화성의 고도개정식이다. 항성과 목성·토성은 시차 P와 위상 F를 0으로 볼 수 있어 (2.23)식을 쓴다.[1]",{"formula":"Ho = hs ± IC − D − R + P ± F","label":"식 (2.22) 금성·화성"},{"formula":"Ho = hs ± IC − D − R","label":"식 (2.23) 항성·목성·토성"},"식에서 ± IC는 [[육분의 오차·기차개정|기차개정]], −D는 [[안고차]], −R은 천문기차다. 금성·화성에만 붙는 +P는 시차(항상 +), ± F는 위상 개정이다. 별은 점이라 SD 항이 없다.","천측력 A2·A3쪽의 ‘항성 및 행성의 고도개정표(STARS AND PLANETS)’는 평균기차를 구하는 표다. 태양표처럼 임계표라 경계값에서는 위쪽 값을 택한다. 금성·화성은 같은 표의 ‘추가개정(Additional Corr.)’란에서 시차와 위상 개정치를 함께 구한다.[2]",{"steps":["Sextant의 기차개정(IC)을 구한다.","A2쪽 안고차표(‘Dip’표)에서 관측 시 안고에 대한 안고차(D)를 구한다.","STARS AND PLANETS표에서 겉보기고도에 대한 개정치(기차)를 구한다. 5° 이하 저고도가 아니면 Sextant 고도를 겉보기고도로 본다.","금성이나 화성이면 추가개정표에서 추가개정치(add′l)를 구한다.","①~③ 또는 ①~④의 대수합을 부호에 따라 Sextant 고도에 가감한다.","대기가 평균상태와 다르거나 5° 이하 저고도이면, A4쪽 추가개정표나 항해표 제23·24표로 추가기차개정(TB)을 더한다."]},{"table":{"head":["순서","항목","값"],"rows":[["①","IC","0"],["②","D (HE 8.4 m)","−5′.1"],["③","☆−P (평균기차)","−1′.0"],["④","add′l (금성 추가개정)","+0′.1"],["⑤","sum (+ 쪽 / − 쪽)","+0′.1 / −6′.1"],["⑥","corr. = 0′.1 − 6′.1","(−) 6′.0"],["⑦","hs","44°21′.3"],["⑧","Ho = 44°21′.3 − 6′.0","44°15′.3"]]},"caption":"교재 68–69쪽 예제 — 2019년 5월 16일, IC 0인 Sextant, HE 8.4 m에서 잰 금성 고도 44°21′.3"},"영문 자료의 예도 같은 흐름이다. 고도 약 48°의 별에서 기차는 −0′.9이고, 안고차와 함께 빼서 Ho를 얻는다.[3] 별 관측은 박명 때 비슷한 밝기의 별을 여러 개 재는 것이 좋다.[3]"],"confusions":"풀이표의 ☆−P는 ‘항성·행성(Stars and Planets)’표에서 구한 값이라는 표시이지 ‘항성 빼기 시차’가 아니다. 이 값에는 기차만 들어 있고, 금성·화성의 시차·위상은 add′l로 따로 더한다.[4]","key":["금성·화성: Ho = hs ± IC − D − R + P ± F (2.22)","항성·목성·토성: Ho = hs ± IC − D − R (2.23)","SD 개정 없음(중심고도를 직접 잰다)","금성·화성의 추가개정(add′l) = 시차 + 위상"],"footnotes":["교재 67–68쪽, 식 (2.22), (2.23).","교재 68쪽.","교재 밖 보충 설명. 이 자료는 별 관측을 아침·저녁 박명에 비슷한 밝기의 별 다섯 개 이상으로 하라고 권한다. 참고: [The nautical sextant in celestial navigation — nauticalalmanac.it](https://www.nauticalalmanac.it/en/navigation-astronomy/marine-sextant-nautical-errors-corrections).","교재 68–69쪽. 교재는 ③에서 ‘개정치(기차: ☆−P)’라고만 적었다."],"flags":[{"kind":"계산 확인","text":"교재 69쪽 금성 예제: (+0′.1) + (−5′.1 − 1′.0) = −6′.0, 44°21′.3 − 6′.0 = 44°15′.3. 재계산 일치. D는 식 (2.13)으로 8.4 m(27.6 ft) → 5′.09 ≈ 5′.1, 기차는 식 (2.7)로 고도 44°21′에서 0′.99 ≈ 1′.0으로 표 값과 맞는다."},{"kind":"해석","text":"풀이표와 순서 ③의 ‘☆−P’를 STARS AND PLANETS표의 약호로 해석했다. 교재는 이 기호를 따로 설명하지 않는다.","fn":4}]},{"title":"달의 고도개정","easy":["달은 태양과 같이 원판으로 보이므로 하변이나 상변을 잰다. 계산의 뼈대도 태양과 같다. 다른 점은 달이 지구에 아주 가깝다는 것이다.","가까워서 두 가지가 커진다. 하나는 [[시차·수평시차|시차]]로, 거의 1°나 된다. 다른 하나는 높이 뜰수록 달이 조금 커 보이는 **증가율**(Augmentation, A)이다. 그래서 달의 개정치는 교재 예제처럼 +62′.0, 곧 1° 넘게 나오기도 한다.","[[천측력]] 맨 끝 두 쪽의 달 고도개정표는 위·아래 2단이다. 위 표는 고도로 찾고, 아래 표는 그 시각의 수평시차(HP)로 찾는다. 두 값을 더하면 R·SD·A·P가 한꺼번에 처리된다."],"definition":"달의 고도개정은 태양의 고도개정과 같되, 겉보기반지름 증가율(Augmentation, A)에 대한 개정이 추가되고, 상변을 재도 광삼(Irradiation, J)은 개정하지 않는다. 천측력 맨 끝 두 쪽의 ‘달의 고도개정표’로 구한다.[1][2]","terms":[{"ko":"달의 고도개정","en":"Moon altitude correction","plain":"달의 hs를 Ho로 고치는 계산"},{"ko":"[[시차·수평시차|수평시차]]","en":"Horizontal parallax","abbr":"HP","plain":"달이 수평선에 있을 때의 시차, 약 54′~61′"},{"ko":"증가율","en":"Augmentation","abbr":"A","plain":"높이 뜰수록 달의 SD가 커지는 양"},{"ko":"L란·U란","en":"L (lower limb) · U (upper limb) columns","plain":"아래 표에서 하변·상변용 열"},{"ko":"달 고도개정표","en":"Altitude correction tables for the Moon","plain":"천측력 맨 끝 두 쪽의 2단 표"}],"why":"달은 낮에도 보일 때가 있어, 태양과 동시에 재면 낮에도 두 [[위치선]]의 교점을 얻을 수 있다. 다만 개정치가 크고 HP가 시시각각 변하므로, [[주표]]에서 관측 시각의 HP를 정확히 찾는 것이 중요하다.","body":[{"formula":"Ho = hs ± IC − D − R + SD + A + P","label":"식 (2.24) 하변"},{"formula":"Ho = hs ± IC − D − R − SD − A + P","label":"식 (2.25) 상변"},"식의 IC·D·R·P는 태양과 같고, 하변이면 SD와 A를 더하고 상변이면 뺀다. A는 달에만 있는 [[겉보기반지름]] 증가율이다. 태양과 달리 −J가 없다. [[광삼]]은 태양에만 필요하기 때문이다.[1]","달 고도개정표는 위·아래 두 표로 되어 있다. 위 표는 겉보기고도로 찾으며, R은 [[천문기차·평균기차|평균기차]]를, SD·A·P는 각각 기준량을 써서 한꺼번에 개정한다. 아래 표는 겉보기고도와 주표의 수평시차(HP)로 찾아 기준량과의 차를 개정하는데, 하변은 ‘L’란, 상변은 ‘U’란을 쓴다.[2]",{"steps":["Sextant의 기차개정(IC)을 구한다.","A2쪽이나 달 고도개정표에 있는 안고차표(‘Dip’표)에서 안고차(D)를 구한다.","위 표에서 겉보기고도(Sextant 고도를 겉보기고도로 봄)에 대한 R·SD·A·P 종합개정치를 구한다.[3]","같은 열을 따라 아래 표로 내려와, 주표에서 구한 관측 시각의 HP에 대한 개정치를 하변이면 L란, 상변이면 U란에서 구한다.","상변을 관측했으면 (−)30′을 추가한다. U란 값은 부호를 늘 +로 하려고 30′을 더해 실었기 때문이다.","①~⑤의 대수합을 부호에 따라 Sextant 고도에 가감한다."]},"영문 자료도 같은 표 구조를 설명한다. 위 칸은 겉보기고도로, 아래 칸은 HP로 찾되 같은 열에서 읽고, 상변이면 30′을 뺀다. 표를 만들 때 상변 값을 늘 +로 두려고 30′을 더했기 때문이다.[4]",{"table":{"head":["순서","항목","값"],"rows":[["①","IC","+3′.2"],["②","D (HE 10 m)","−5′.6"],["③","위 표 개정치 (달 고도개정표)","+62′.5"],["④","아래 표 L란 (HP 55′.2, 주표 1월 3일 Moon 20h)","+1′.9"],["⑤","sum (+ 쪽 / − 쪽)","+67′.6 / −5′.6"],["⑥","corr. = 67′.6 − 5′.6","(+) 62′.0"],["⑦","hs","18°04′.6"],["⑧","Ho = 18°04′.6 + 1°02′.0","19°06′.6"]]},"caption":"교재 71쪽 예제 1 — 2019년 1월 3일 GMT 20h00m, HE 10 m, IC (+)3′.2인 Sextant로 잰 달 하변고도 18°04′.6[5]"},{"table":{"head":["순서","항목","값"],"rows":[["①","IC","+3′.2"],["②","D (HE 10 m)","−5′.6"],["③","위 표 개정치 (달 고도개정표)","+62′.5"],["④","아래 표 HP 개정치 (HP 55′.2, 교재 표기 L)","+1′.9"],["⑤","상변 추가개정","−30′"],["⑥","기온·기압 (A4쪽 추가고도개정표)","−0′.1"],["⑦","sum (+ 쪽 / − 쪽)","+67′.6 / −35′.7"],["⑧","corr. = 67′.6 − 35′.7","(+) 31′.9"],["⑨","hs","18°04′.6"],["⑩","Ho = 18°04′.6 + 31′.9","18°36′.5"]]},"caption":"교재 71쪽 예제 2 — 같은 조건에서 잰 달 상변고도 18°04′.6, 기온 −3℃, 기압 982 mb[6]"},"두 예제는 hs가 같다. 그런데 Ho는 하변 19°06′.6, 상변 18°36′.5로 30′.1 차이 난다. 같은 눈금이라도 상변을 쟀다면 달 중심은 하변을 잰 경우보다 달의 지름(2·SD)쯤 더 아래에 있기 때문이다. HP 55′.2일 때 달의 SD는 약 15′.0이어서 지름은 약 30′.1이다.[8]"],"confusions":"5° 이하 저고도에서는 hs에 IC와 D를 먼저 가감한 개정고도(hr)를 겉보기고도로 보고 위·아래 표를 찾는다. 상변이면 (−)30′을 더하고, 필요하면 A4쪽 추가개정표나 항해표 제23·24표의 기온·기압개정치를 더한다. 그 뒤 이 개정치들의 대수합을 hr에 가감한다.[7]","key":["하변: Ho = hs ± IC − D − R + SD + A + P (2.24)","상변: Ho = hs ± IC − D − R − SD − A + P (2.25)","위 표(겉보기고도) + 아래 표(HP: 하변 L란 / 상변 U란)","상변이면 −30′ 추가 (U란에 30′이 더해져 있음)"],"footnotes":["교재 69쪽, 식 (2.24), (2.25). 광삼 개정은 태양에만 필요하다(교재 63쪽).","교재 69–70쪽.","교재 70쪽. 교재 ③은 위 표의 기준량을 ‘기차(R), 겉보기반지름(SD), 겉보기반지름 증가율(A) 및 기차(P)’로 적었으나, P는 시차(Parallax)다.","교재 밖 보충 설명. 이 자료의 상변 예는 hs 33°15′.0, IC +1′.8, D −4′.1로 겉보기고도 33°12′.7을 먼저 구하고, 표 값 +57′.4와 HP 개정 +2′.1을 더한 뒤 30′을 빼 33°42′.2를 얻는다. 참고: [The Demystified Astro Navigation Course – Unit 3 Part 3](https://astronavigationdemystified.com/the-demystified-astro-navigation-course-unit-3-part-3/).","교재 71쪽.","교재 71쪽. 교재 풀이표는 상변 관측인데도 HP 개정치 행을 ‘L’로 적었다.","교재 70–71쪽.","교재 밖 보충 설명. 달의 SD는 HP의 약 0.2725배다(달 반지름 ÷ 지구 적도 반지름). 55′.2 × 0.2725 ≈ 15′.04이므로 2·SD ≈ 30′.1이다."],"flags":[{"kind":"계산 확인","text":"교재 71쪽 달 하변 예제: (+3′.2 + 62′.5 + 1′.9) − 5′.6 = +62′.0, 18°04′.6 + 62′.0 = 19°06′.6. 재계산 일치. D는 식 (2.13)으로 10 m(32.8 ft) → 5′.56 ≈ 5′.6."},{"kind":"계산 확인","text":"교재 71쪽 달 상변 예제: (+67′.6) − (5′.6 + 30′ + 0′.1) = +31′.9, 18°04′.6 + 31′.9 = 18°36′.5. 재계산 일치. 기온·기압개정은 식 (2.11)로 기온 −3℃(26.6°F)·기압 982 mb(29.00 inch)·고도 약 18°에서 −0′.06 ≈ −0′.1로 표 값과 맞는다."},{"kind":"해석","text":"상변 예제 풀이표의 HP 개정치가 ‘L’로 인쇄되어 있으나, 교재 70쪽 순서 ④대로라면 U란 값이어야 한다. 값 1′.9는 교재 그대로 두었고, U란 값이 실제로 같은지는 천측력 원표로 확인해 보자.","fn":6},{"kind":"교재 정정","text":"교재 70쪽 순서 ③의 ‘기차(P)’를 ‘시차(P)’로 바로잡았다.","fn":3},{"kind":"교재 밖","text":"달의 SD ≈ 0.2725 × HP 관계로 두 예제의 Ho 차 30′.1을 설명했다. 교재에는 없는 설명이며, 교재 상변 예제의 HP 개정치(L 표기) 문제와는 별개다.","fn":8},{"kind":"계산 확인","text":"영문 자료(각주 4)의 상변 예: 33°15′.0 + 1′.8 − 4′.1 = 33°12′.7, 33°12′.7 + 57′.4 + 2′.1 − 30′ = 33°42′.2. 재계산 일치. 교재와 같은 표 사용법이다.","fn":4}]},{"title":"위치선항법","easy":["흐린 날 바다에서 구름 사이로 나온 해를 딱 한 번 재었다고 하자. 이 한 번의 관측으로는 배가 있는 ‘점’을 알 수 없다. 대신 ‘배는 이 선 위 어딘가에 있다’는 선 하나를 얻는다.","이런 선을 [[위치선]](Line of position, LOP)이라 한다. 위치선을 둘 이상 그어 서로 만나는 곳에서 배의 위치를 찾는 방법이 **위치선항법**(Position line navigation)이다.","그 전에는 위도를 먼저 구하고, 그 위도를 믿고 경도를 계산해 점 하나를 찍었다. 이것을 **위치점항법**(Point navigation)이라 한다. 1837년 Sumner 선장은 위도를 세 가지로 바꿔 계산해 보았고, 세 점이 한 직선 위에 놓이는 것을 발견했다.[5]","오늘날 쓰는 방법은 1875년 Marcq St. Hilaire가 내놓은 [[고도차법]](Intercept method)이다. 위치선을 더 쉽고 정확하게 긋는 방법이어서 **신항법**(New navigation)이라고도 부른다.[1]"],"definition":"천체를 관측해 얻은 위치선(Line of position)으로 선위를 결정하는 방법(Position line navigation). 위도나 경도 하나만 계산해 거등권 위의 한 점을 구하던 위치점항법(Point navigation)과 구별된다.[1]","terms":[{"ko":"위치선항법","en":"Position line navigation","plain":"위치선 여러 개의 교점으로 선위를 정하는 방법"},{"ko":"위치점항법","en":"Point navigation","plain":"위도·경도 중 하나를 알고 다른 하나를 계산해 점 하나를 얻는 옛 방법"},{"ko":"[[위치선]]","en":"Line of position","abbr":"LOP","plain":"배가 그 위 어딘가에 있다는 선"},{"ko":"Sumner법","en":"Sumner line","plain":"Sumner가 1843년 발표한 첫 천측 위치선 방법"},{"ko":"[[고도차법]]","en":"Intercept method","plain":"고도차로 위치선을 긋는 오늘날의 표준 방법"},{"ko":"신항법","en":"New navigation","plain":"St. Hilaire의 고도차법을 부르는 다른 이름"}],"why":"오늘날 천측으로 배 위치를 구하는 방법은 모두 위치선항법이다. 해나 별을 하나 잴 때마다 위치선이 하나 생기고, 두세 개를 겹쳐 선위(Fix)를 얻는다. 교재 8장은 이 생각 위에서 관측 → 고도개정 → 계산고도 → 고도차 → 위치선 순서로 나아간다. 이 문서는 그 흐름이 왜 ‘점’이 아니라 ‘선’에서 출발하는지 알려 준다.","body":["7장의 위도법은 위도·경도 가운데 하나를 미리 알고 다른 하나를 계산한다. 그래서 일정한 위도의 거등권 위의 한 점을 구하는 데 그친다. 이런 방법을 위치점항법이라 한다.[1]","19세기 초까지는 북극성위도법, 자오선고도위도법, 근오고도위도법으로 위도를 재고, 그 위도로 경도를 구해 선위를 정했다.[1] 이 흐름을 바꾼 것이 Sumner 선장의 경험이다.[2]",{"table":{"head":["때","있었던 일"],"rows":[["1837년 11월 25일","Harvard 출신 Thomas H. Sumner 선장이 미국 South Carolina의 Charleston항을 출항해 영국 Greenock으로 향했다."],["1837년 12월 17일 오전 10시경","며칠 동안 날씨가 나빠 천측을 못 하다가, 구름 사이로 나온 태양을 관측해 곧바로 경도를 계산했다."],["같은 관측","위도에 자신이 없어 추측위도와, 그보다 10′·20′ 높은 위도로 각각 경도를 구해 해도에 찍었다. 세 위치가 모두 한 직선 위에 있었고, 그 직선은 Small Rock 등대를 지났다.[3]"],["1시간 이내","자기 위치가 그 직선 위에 있다고 보고 침로를 ENE로 잡았더니, 1시간이 채 안 되어 Small Rock 등대가 ENE ½ E에 보였다.[4]"],["1843년","천측위치선이 직선이 된다는 가정 아래 연구해 Sumner법을 발표했다. 이것이 위치선항법의 효시다."],["1875년","프랑스 해군 소장 Marcq St. Hilaire가 고도차법(Altitude difference method), 곧 수정차법(Intercept method)을 발표해 현대 항해학의 시대를 열었다."]]},"caption":"교재 150쪽 — 위치선항법의 시작"},"Sumner가 깨달은 것은 ‘위도를 조금씩 바꿔도 결과가 한 직선 위에 놓인다면, 배는 그 직선 위 어딘가에 있다’는 사실이다. 한 번의 관측이 점 대신 선을 준다는 이 생각이 위치선항법의 출발점이다.[5]","St. Hilaire의 고도차법을 신항법이라고도 한다.[1] 위치선이 무엇인지는 위치선에서, 그 출발점이 되는 원은 [[위치권]]에서 이어진다. 3D 장면 10에서 한 번의 관측이 지구 위에 원(위치권)을 만드는 모습을 볼 수 있다."],"confusions":"‘위치점’항법도 위치를 구하지만, 위도(또는 경도) 하나만 계산해 거등권 위의 한 점을 얻는다는 뜻이다. 위도를 미리 알아야 하므로 위도가 틀리면 점도 함께 틀린다. Sumner의 세 점이 한 직선에 놓인 것은 천체 하나의 관측이 점이 아니라 선을 준다는 증거다.","key":["위치점항법(Point navigation): 위도·경도 중 하나만 계산 → 거등권 위 1점","1837 Sumner의 태양 관측 → 1843 Sumner법 발표(위치선항법의 효시)","1875 Marcq St. Hilaire 고도차법(= 수정차법, Intercept method) = 신항법"],"footnotes":["교재 150–151쪽.","교재 150쪽. 교재는 선장 이름을 ‘Summer’, 출항지를 ‘Charlston’으로 인쇄했다. 각각 Sumner, Charleston이 맞다.","교재 밖 보충 설명. Sumner의 원래 기록에는 ‘Small's Light’로 나온다. 웨일스 Pembrokeshire 앞바다 Smalls 암초 위의 등대(Smalls Lighthouse)로, 당시 배는 St George's Channel 어귀로 다가가던 중이었다. Smalls 등대는 Pembrokeshire의 Marloes 반도 서쪽 약 20마일 바다의 암초 위에 있다. 참고: [Smalls Lighthouse — Wikipedia](https://en.wikipedia.org/wiki/Smalls_Lighthouse).","교재 밖 보충 설명. 32방위에서 1점은 11°15′이므로 ENE는 067°30′, ENE ½ E는 약 073°다. 참고: [Points of the compass — Wikipedia](https://en.wikipedia.org/wiki/Points_of_the_compass).","교재 밖 보충 설명. Sumner는 같은 태양 관측을 추측위도와 그보다 10′·20′ 높은 위도로 세 번 계산했고, 세 위치가 한 줄 위에 놓였다. 그는 이 방법을 1843년 Boston에서 『A New and Accurate Method of Finding a Ship's Position at Sea, by Projection on Mercator's Chart』라는 책으로 냈다. 참고: [Thomas Hubbard Sumner — Wikipedia](https://en.wikipedia.org/wiki/Thomas_Hubbard_Sumner)."],"flags":[{"kind":"교재 정정","text":"교재 150쪽의 ‘Summer 선장’, ‘Summer법’을 Sumner로, 출항지 ‘Charlston’을 Charleston으로 바로잡았다.","fn":2},{"kind":"교재 밖","text":"ENE ½ E를 각도(약 073°)로 바꾼 값은 교재에 없는 보충이다.","fn":4}]},{"title":"위치선","easy":["운동장에 지름이 몇 km나 되는 커다란 원을 그렸다고 하자. 그 원 위에 서서 발밑 몇 걸음만 보면 선은 거의 곧게 보인다. 천측으로 얻는 원은 이보다 훨씬 크다.","천체 하나를 재면 배가 있을 수 있는 곳은 반지름이 수천 해리인 원, 곧 [[위치권]](Circle of position)이 된다. 이 원에서 배 근처의 짧은 조각만 떼어 직선으로 그린 것이 **위치선**(Line of position, LOP)이다.[5]","위치선 하나는 ‘배가 이 선 위 어딘가에 있다’는 것만 알려 준다. 방향이 다른 위치선을 두 개 이상 그으면 만나는 점이 배의 위치, 곧 선위(Fix)다.[6]"],"definition":"넓은 의미로는 모양에 관계없이 선위의 자취를 이루는 선이고, 좁은 의미로는 그 가운데 직선으로 볼 수 있을 만큼 작은 부분을 직선으로 나타낸 것이다(Line of position, LOP; Position line). 천문항해학에서 위치선이라 하면 좁은 의미를 가리킨다.[1]","terms":[{"ko":"위치선","en":"Line of position","abbr":"LOP","plain":"위치권의 작은 조각을 직선으로 그린 것"},{"ko":"[[위치권]]","en":"Circle of position","plain":"천체가 같은 고도로 보이는 지점들의 큰 원"},{"ko":"[[천체의 지위|지위]]","en":"Geographical position","abbr":"GP","plain":"천체 바로 아래 지구 위의 점"},{"ko":"접선","en":"Tangent","plain":"수정점에서 위치권에 닿게 그은 직선 = 위치선"},{"ko":"추측위치","en":"Dead reckoning position","abbr":"DR","plain":"침로·속력으로 추정한 배의 위치"},{"ko":"선위","en":"Fix","plain":"위치선 두 개 이상이 만나는 점"}],"why":"천측의 마지막 결과물은 해도 위의 위치선이다. 관측고도를 고치고, 계산고도와 비교해 고도차를 얻고, 그 값으로 위치선을 긋는다. 위치선이 2~3개 모이면 선위가 된다. 그래서 위치선을 언제 직선으로 써도 되는지(고도 약 75° 이하) 알아야 고고도 관측에서 실수하지 않는다.","body":["천체 하나를 관측하면 배가 있을 수 있는 자리는 위치권이라는 소권이 된다. 위치권은 반지름이 보통 수천 해리이고, 점장도(Mercator chart)에 그리면 특수한 곡선이 되어 일일이 작도하기 어렵다.[2]","실제로 필요한 것은 추측위치 부근의 아주 작은 부분뿐이다. 그 부분을 직선으로 나타내도 실용상 지장이 없으며, 이 직선이 위치선이다.[2]","보통은 [[천체의 지위|지위]]와 가정위치(또는 추측위치)를 잇는 대권이 위치권과 만나는 점을 **수정점**이라 한다. 이 점에서 위치권에 그은 접선(Tangent)을 위치선으로 쓴다.[2] 수정점을 구하는 실제 방법이 [[고도차법]]이며, 3D 장면 11에서 그 작도를 볼 수 있다.","위치선은 원을 직선으로 바꾼 것이므로, 수정점에서 멀어질수록 위치권과 간격이 생긴다. 이 간격은 위치권이 많이 휠수록(곡률이 클수록), 곧 천체의 고도가 높을수록 커진다. 그래서 고고도 천체를 관측했을 때는 위치권을 직접 작도하는 것이 좋다.[3]",{"table":{"head":["순서","계산","값"],"rows":[["① 접점에서 실제 선위까지 거리 s","실용상 넘는 일이 드문 값","40해리"],["② 고도 75°의 정거 z","90° − 75°","15°"],["③ 위치선과 위치권의 간격","s² × cot z ÷ (2 × 3,438)","약 0.87해리"],["④ 판단","1해리 이내","위치선으로 대신해도 됨"]]},"caption":"교재 155쪽 ‘고도 약 75° 이하면 간격 1해리 이내’를 근사식으로 확인[4]"},"실용상 접점에서 실제 선위까지의 거리가 40해리를 넘는 일은 드물다. 따라서 천체의 고도가 약 75° 이하이면 위치선과 위치권의 간격이 1해리 이내여서 위치권 대신 위치선을 써도 된다.[3] 서로 평행하지 않은 위치선을 2개 이상 구하면 그 교점이 선위다([[위치선의 교점과 전위]]).[3]"],"confusions":"수정점은 위치선을 긋기 위한 기준점일 뿐 배의 위치가 아니다. 위치선 하나로는 ‘배가 이 선 위 어딘가에 있다’는 것만 알 수 있고, 선위를 정하려면 위치선이 둘 이상 필요하다.","key":["천문항해의 위치선 = 위치권의 작은 부분을 직선으로 나타낸 것(좁은 의미)","수정점: 지위–가정위치 대권이 위치권과 만나는 점, 위치선은 그 점의 접선","고도 약 75° 이하·거리 40해리 이내 → 위치권과의 간격 1해리 이내","평행하지 않은 위치선 2개 이상의 교점 = 선위"],"footnotes":["교재 151쪽.","교재 154쪽.","교재 155쪽, 그림 8.3. 교재는 앞 문장에서 ‘천측위치와 수정점의 거리’, 뒤 문장에서 ‘접점에서 진위치까지의 거리’라고 썼다. 위키는 둘 다 ‘수정점에서 실제 선위까지의 거리’로 읽었다.","교재 밖 보충 설명. 정거가 z인 위치권에서 접점으로부터 s해리 떨어진 곳의 간격은 약 s² × cot z ÷ (2 × 3,438)해리다(3,438해리는 1′ = 1해리로 잰 지구 반지름). s = 40, z = 15°(고도 75°)이면 약 0.87해리다.","교재 밖 보충 설명. 영어 자료도 위치선을 ‘천체의 지위를 둘러싼 아주 큰 원의 짧은 조각’으로 설명하고, 관측자는 그 선 위 어딘가에 있다고 한다. 참고: [Celestial navigation — Wikipedia](https://en.wikipedia.org/wiki/Celestial_navigation).","교재 밖 보충 설명. 위치선 두 개 이상이 만나는 점을 선위(Fix)라 한다. 참고: [Position line — Wikipedia](https://en.wikipedia.org/wiki/Position_line)."],"flags":[{"kind":"계산 확인","text":"교재 155쪽 ‘고도 약 75° 이하, 40해리 → 간격 1해리 이내’를 구면 근사식으로 확인했다. 40² × cot 15° ÷ (2 × 3,438) ≈ 0.87해리로 교재 서술과 맞는다.","fn":4},{"kind":"해석","text":"‘천측위치와 수정점의 거리’와 ‘접점에서 진위치까지의 거리’를 모두 ‘수정점에서 실제 선위까지의 거리’로 해석했다.","fn":3}]},{"title":"천체의 지위","easy":["한낮에 해가 머리 바로 위에 떠서 그림자가 생기지 않는 곳이 지구 어딘가에 한 군데 있다. 그 지점이 바로 그 순간 태양의 **지위**(Geographical position, GP)다.[4]","별이나 달도 마찬가지다. 천체에서 지구 중심으로 곧은 선을 그으면, 그 선이 지표면과 만나는 점이 지위다. 그 점에 선 사람에게 천체는 [[천정·천저|천정]](Zenith), 곧 머리 바로 위에 보인다.","지위는 숫자로 쉽게 나타낼 수 있다. 위도는 천체의 [[적위]](Declination, Dec)와 같고, 경도는 [[본초시각]](Greenwich Hour Angle, GHA)으로 정해진다. 예컨대 GHA가 49°이면 지위는 서경 49°이고, 지구가 돌기 때문에 지위는 1시간에 경도 15°씩 서쪽으로 옮겨 간다.[4]"],"definition":"천체를 천정에 보는 지구 위의 지점, 곧 그 시각에 천체 바로 아래에 있는 지점. 천체의 지상위치 또는 줄여서 지위(Geographical position, GP)라 한다.[1]","terms":[{"ko":"지위","en":"Geographical position","abbr":"GP","plain":"그 순간 천체 바로 아래 지구 위의 점"},{"ko":"[[적위]]","en":"Declination","abbr":"Dec","plain":"천체의 하늘 위도. 지위의 위도와 같다"},{"ko":"[[본초시각]]","en":"Greenwich Hour Angle","abbr":"GHA","plain":"그리니치에서 서쪽으로 잰 천체의 각. 지위의 경도"},{"ko":"[[천정·천저|천정]]","en":"Zenith","plain":"관측자 머리 바로 위 하늘의 점"},{"ko":"지위의 위도·경도","en":"Latitude and longitude of the GP","abbr":"L_GP, λ_GP","plain":"L_GP = d, λ_GP = GHA(서쪽으로 잼)"}],"why":"천체 하나를 재면 배는 지위를 중심으로 한 원, 곧 [[위치권]] 위에 있다. 그래서 천측 계산은 언제나 ‘관측 순간 지위가 어디인가’에서 시작한다. 실제로는 지위를 해도에 찍지 않고, 지위의 위도·경도에 해당하는 적위와 GHA를 [[천측력]]에서 찾아 계산에 넣는다.","body":["그림 8.1에서 지위의 위도를 L_GP, 천체의 적위를 d라 하면 L_GP = d + ε이다. ε는 지구와 천체 사이의 거리에 따라 변하지만 아주 작아서, 가장 가까운 달의 경우에도 0′.2를 넘지 않는다. 그래서 실용상 ε를 무시하고 다음과 같이 쓴다.[1]",{"formula":"L_GP = d","label":"식 (8.1)"},"L_GP는 지위의 위도, d는 천체의 적위다. 곧 지위의 위도는 적위와 같다.","그러면 지위를 ‘천체의 중심과 지구의 중심을 잇는 직선이 지구 표면과 만나는 점’으로 다시 정의할 수 있다. 이는 지구를 진구(완전한 구)로 본다는 뜻이다.[1] 그림 8.2에서 Q₁M = Q₁′M′이므로 지위의 위도는 적위와 같고, 이름(N·S)도 같다.[2]","지위의 경도를 서쪽으로 잰 값을 λ_GP라 하자. 그림 8.2에서 ∠GPₙM = ∠G′PM′이므로 천체의 GHA가 곧 지위의 경도다.[2]",{"formula":"GHA = λ_GP (서쪽으로 잰 경도)","label":"식 (8.2)"},"GHA는 그리니치에서 서쪽으로 0°~360°를 재고, 경도는 동·서로 180°까지만 쓴다. 그래서 다음처럼 바꾼다.",{"list":["GHA가 180° 이내 → 지위의 경도 = GHA, 서경(W)[2]","GHA가 180° 이상 → 지위의 경도 = 360° − GHA, 동경(E)[2]","천체의 [[방위·방위각|방위각]](Azimuth angle) = 지위의 방위각(∠PₙZM = ∠POM′). 천체의 방위가 N120°E이면 지위의 방위도 N120°E다.[3]"]},{"table":{"head":["순서","계산","값"],"rows":[["① GHA","교재 154쪽 예제 2","242°13′.9"],["② 180°보다 큰가?","242° > 180°","동경으로 바꿈"],["③ λ_GP","360° − 242°13′.9","117°46′.1E"]]},"caption":"GHA를 지위의 경도로 바꾸기 (예제 2, [[지위 구하기]])"}],"confusions":"GHA는 그리니치에서 서쪽으로 0°~360°를 재지만 경도는 동·서로 180°까지만 쓴다. 그래서 GHA가 180°를 넘으면 360°에서 빼서 동경으로 바꾼다. 지위는 관측자가 어디 있든 시각만으로 정해진다는 점도 기억해 두자.","key":["지위(GP) = 천체 바로 아래 지점(천체 중심–지구 중심 직선 위)","L_GP = d (식 8.1), 이름(N·S)도 같다","GHA = λ_GP (식 8.2): 180° 이내면 W, 넘으면 360° − GHA로 E","천체의 방위각 = 지위의 방위각"],"footnotes":["교재 151–152쪽, 그림 8.1, 식 (8.1).","교재 152–153쪽, 그림 8.2, 식 (8.2).","교재 154쪽.","교재 밖 보충 설명. 태양의 지위는 태양빛이 지면에 수직으로 내리꽂혀 그림자가 생기지 않는 곳이며, 하루에 한 바퀴씩 서쪽으로 움직인다. 참고: [Subsolar point — Wikipedia](https://en.wikipedia.org/wiki/Subsolar_point)."],"flags":[]},{"title":"지위 구하기","easy":["[[천측력]](Nautical Almanac)은 ‘몇 시 몇 분에 태양·달·별이 지구 어디 바로 위에 있는가’를 적어 둔 시간표와 같다. 시각만 정확히 알면 지위의 위도와 경도를 읽어 낼 수 있다.","순서는 늘 같다. 배의 시계(Chronometer)를 그리니치 시각(GMT)으로 고치고, 천측력에서 그 시각의 GHA와 적위(Dec)를 찾는다. 적위가 지위의 위도, GHA가 지위의 경도다.","예를 들어 6월 1일 GMT 15-14-15에 태양의 GHA는 49°06′.4, 적위는 N22°04′.1이다. 그래서 그 순간 태양은 22°04′.1N, 49°06′.4W 바로 위에 있다. 배가 어디에 있든 이 답은 같다.[1]"],"definition":"관측 시각(GMT)의 천체 본초시각(Greenwich Hour Angle, GHA)과 적위(Declination, Dec)를 천측력에서 구하고, 식 (8.1)·(8.2)로 지위(Geographical position, GP)의 위도와 경도로 바꾸는 계산.[1]","terms":[{"ko":"지위 구하기","en":"Finding the geographical position","plain":"시각 → 천측력 → GHA·Dec → 지위의 위도·경도"},{"ko":"그리니치 평시","en":"Greenwich Mean Time","abbr":"GMT","plain":"천측력을 찾는 기준 시각"},{"ko":"Chronometer 오차","en":"Chronometer error","abbr":"CE","plain":"배 시계가 GMT보다 늦으면 (+)"},{"ko":"[[주표]]","en":"Daily pages","plain":"정시(h)마다 GHA·Dec가 실린 천측력 본문"},{"ko":"[[증분 및 개정표]]","en":"Increments and Corrections","plain":"분·초만큼의 GHA 증가와 v·d 개정을 찾는 표"},{"ko":"[[v·d 값|v·d 개정]]","en":"v and d corrections","plain":"GHA(v)와 적위(d)의 시간당 변화를 비례로 보정"}],"why":"지위를 구하는 계산은 천측계산 6단계 가운데 ② ‘GHA 및 Dec.의 결정’과 같다. 여기서 얻은 GHA에 경도를 더하거나 빼면 LHA가 되고, 적위와 함께 [[계산고도·계산방위각|계산고도]] 계산에 들어간다. 천구는 1시간에 15° 돌므로 시각을 4초 틀리면 GHA가 1′ 틀린다. 그래서 시각을 정확히 고치는 일이 먼저다.","body":[{"steps":["Chronometer 시각(C)에 오차(CE)를 가감해 GMT를 구한다. Chronometer가 GMT보다 늦으면 CE는 (+)다.","[[주표]]에서 GMT 정시의 GHA와 적위(Dec)를 찾는다.","[[증분 및 개정표]]에서 분·초에 대한 GHA 증분을 더하고, [[v·d 값|v·d 개정]]을 한다.","지위의 위도 = Dec. 지위의 경도 = GHA(서경)이며, GHA가 180°를 넘으면 360° − GHA(동경)로 바꾼다([[천체의 지위]])."]},{"table":{"head":["순서","계산","값"],"rows":[["① GMT","주어진 시각","15-14-15 (6월 1일)"],["② GHA 15h","주표","45°32′.6"],["③ 증분 14m15s","증분표","3°33′.8"],["④ GHA","② + ③","49°06′.4"],["⑤ Dec 15h","주표 (d = +0′.3)","N22°04′.0"],["⑥ d 개정","개정표","(+)0′.1"],["⑦ Dec","⑤ + ⑥","N22°04′.1"],["⑧ GP L","= Dec","22°04′.1N"],["⑨ GP λ","GHA < 180° → 서경","49°06′.4W"]]},"caption":"교재 153쪽 예제 1 — 2019년 6월 1일 ZT 12-20경, DR 20°59′.2N, 50°07′.8W, 태양"},{"table":{"head":["순서","계산","값"],"rows":[["① C (Chronometer)","읽은 시각","14-31-42"],["② CE","GMT보다 1m12s 늦음 → (+)","(+)1-12"],["③ GMT","① + ②","14-32-54 (11월 10일)"],["④ GHA 14h","주표","234°14′.7"],["⑤ 증분 32m54s","증분표","7°51′.0"],["⑥ v 개정 (v = +15′.2)","개정표","8′.2"],["⑦ GHA","④ + ⑤ + ⑥","242°13′.9"],["⑧ Dec 14h","주표","N05°11′.6"],["⑨ d 개정 (d = +11′.7)","개정표","(+)6′.3"],["⑩ Dec","⑧ + ⑨","N05°17′.9"],["⑪ GP L","= Dec","05°17′.9N"],["⑫ GP λ","GHA > 180° → 360° − 242°13′.9","117°46′.1E"]]},"caption":"교재 154쪽 예제 2 — 2019년 11월 10일 ZT 06-30경, DR 34°18′.3S, 124°17′.6W, 달. Chronometer는 GMT보다 1m12s 늦다"},"예제 1은 GHA가 180°보다 작아 그대로 서경이고, 예제 2는 GHA가 180°를 넘어 360°에서 뺀 동경이 된다. 달은 GHA에도 v 개정이 붙는다([[달의 GHA·Dec]]).[1]"],"confusions":"문제에 주어진 DR(추측위치)은 지위 계산에 쓰이지 않는다. 지위는 관측자의 위치와 상관없이 시각만으로 정해진다.","key":["GMT → 천측력 정시값 + 증분(+ v·d 개정) → GHA·Dec","GP L = Dec, GP λ = GHA(W) 또는 360° − GHA(E)","Chronometer가 GMT보다 늦으면 CE (+)"],"footnotes":["교재 153–154쪽 예제 1, 2."],"flags":[{"kind":"계산 확인","text":"교재 153쪽 예제 1: 45°32′.6 + 3°33′.8 = 49°06′.4 재계산 일치. 증분 14m15s × 15′/m = 3°33′.75, d 개정 0′.3 × 14.25 ÷ 60 ≈ 0′.1, N22°04′.0 + 0′.1 = N22°04′.1도 일치."},{"kind":"계산 확인","text":"교재 154쪽 예제 2: 14-31-42 + 1-12 = 14-32-54, 234°14′.7 + 7°51′.0 + 8′.2 = 242°13′.9, 360° − 242°13′.9 = 117°46′.1, N05°11′.6 + 6′.3 = N05°17′.9 모두 일치. 단순 비례로는 v 개정 15′.2 × 32.9 ÷ 60 = 8′.3, d 개정 11′.7 × 32.9 ÷ 60 = 6′.4로, 교재 값과 0′.1씩 다르다. 천측력 개정표의 32m 행은 그 분의 가운데(32.5분) 값이라 15′.2 × 32.5 ÷ 60 = 8′.2, 11′.7 × 32.5 ÷ 60 = 6′.3이 되어 교재 값과 맞는다."}]},{"title":"위치권","easy":["운동장 한가운데 높은 깃대가 있다고 하자. 깃대 바로 밑에서는 꼭대기가 머리 위에 보이고, 멀어질수록 올려다보는 각이 낮아진다. 꼭대기가 똑같이 30° 높이로 보이는 자리를 모두 이으면 깃대를 중심으로 한 원이 된다.","천체도 같다. 깃대 밑자리가 [[천체의 지위|지위]](Geographical position, GP)이고, 같은 고도로 보이는 자리를 이은 원이 **위치권**(Circle of position)이다. 같은 높이로 보이는 원이라 **등고도권**(Circle of equal altitude)이라고도 한다.[5]","이 원은 아주 크다. 반지름은 [[정거]](Zenith distance, 90° − 고도)를 해리로 바꾼 값이어서, 고도 60°로 보이면 반지름이 30° × 60 = 1,800해리다.[5] 그래서 배에서는 원 전체가 아니라 배 근처의 짧은 조각만 직선, 곧 [[위치선]]으로 그린다."],"definition":"같은 시각에 어떤 천체를 같은 고도로 보는 지점들이 이루는 지구 위의 소권(Circle of position, Position circle). 천체의 지위(GP)를 중심으로 하며, 반지름은 보통 수천 해리에 이른다.[1]","terms":[{"ko":"위치권","en":"Circle of position","plain":"천체가 같은 고도로 보이는 지점들의 원"},{"ko":"등고도권","en":"Circle of equal altitude","plain":"위치권의 다른 이름"},{"ko":"[[천체의 지위|지위]]","en":"Geographical position","abbr":"GP","plain":"위치권의 중심"},{"ko":"[[정거]]","en":"Zenith distance","abbr":"z","plain":"90° − 고도. 위치권의 반지름"},{"ko":"[[위치선]]","en":"Line of position","abbr":"LOP","plain":"위치권의 작은 조각을 직선으로 그린 것"},{"ko":"점장도","en":"Mercator chart","plain":"항해용 해도의 투영법. 원이 찌그러져 보인다"}],"why":"천체의 고도를 한 번 재면 위치권 하나가 정해진다. 천측계산은 이 원을 직접 그리지 않고, 가정위치에서 원까지의 거리(고도차)만 계산해 위치선을 긋는다. 위치권을 머릿속에 그릴 수 있어야 [[고도차법]]의 Toward·Away가 왜 그런 방향인지 이해된다.","body":["천체의 고도를 재면 배는 ‘그 천체가 그 고도로 보이는 곳’ 어딘가에 있다. 그런 곳들은 지위를 중심으로 하는 원, 곧 위치권을 이룬다. 그림 8.3은 관측자의 천정, GP, 위치권의 관계를 보여 준다.[1]","위치권은 반지름이 보통 수천 해리인 소권이고, 점장도(Mercator chart)에 그리면 특수한 곡선이 된다. 그래서 위치권을 일일이 작도해 선위를 구하기는 어렵다.[2] 항해자에게 필요한 것은 추측위치 근처의 아주 작은 부분뿐이므로, 그 부분을 직선으로 바꾼 위치선을 쓴다.[2]",{"formula":"위치권의 반지름 = 정거 = 90° − h"},"h는 천체의 고도다. 고도가 높을수록 정거가 작아져 위치권이 작아지고, 많이 휘어서(곡률이 커서) 위치선으로 대신하기 어려워진다. 반지름의 크기와 점장도 위의 모양은 [[위치권의 모양]]에서 다룬다.[3]","3D 장면 10에서 지위를 중심으로 한 위치권과 그 위에 선 관측자를 함께 볼 수 있다."],"confusions":"위치권은 원 전체, 위치선은 그 일부를 직선으로 근사한 것이다. 또 교재에는 ‘그림 8.3’이 두 번 나온다. 155쪽은 이 문서의 ‘관측자의 위치권’이고, 164쪽은 Sun Sighting의 작도 예다.[4]","key":["위치권 = 지위(GP) 중심, 정거(90° − h) 반지름의 소권(등고도권)","반지름 수천 해리, 점장도에서는 특수한 곡선","실제로는 추측위치 근처의 일부만 직선(위치선)으로 쓴다"],"footnotes":["교재 154–155쪽, 157쪽, 그림 8.3.","교재 154쪽.","교재 155쪽, 157쪽.","교재 155쪽, 164쪽. 위키에서는 164쪽 그림을 ‘그림 8.3(작도 예)’로 구분한다.","교재 밖 보충 설명. 영어로는 Circle of equal altitude라고도 하며, 반지름(해리)은 60 × (90° − Ho)로 쓴다. 참고: [Circle of equal altitude — Wikipedia](https://en.wikipedia.org/wiki/Circle_of_equal_altitude)."],"flags":[]},{"title":"위치권의 모양","easy":["지구본 위에 컴퍼스로 원을 하나 그려 보자. 이 원을 평평한 항해용 해도, 곧 점장도(Mercator chart)에 옮기면 더 이상 동그랗지 않다. 점장도는 극 쪽으로 갈수록 늘려 그리기 때문에 극 쪽이 더 늘어난 찌그러진 고리가 된다.","위치권의 크기는 천체 고도로 정해진다. 반지름은 [[정거]](Zenith distance), 곧 90°에서 고도를 뺀 값이다. 1°는 60해리이므로 고도 60°면 반지름이 1,800해리, 고도 30°면 3,600해리다.[5]","연안에서 Radar로 잰 거리원은 반지름이 수십 해리지만, 위치권은 수천 해리다. 해도에 통째로 그리기 어려우므로 [[가정위치]] 근처의 짧은 위치선만 긋는다.[4]"],"definition":"위치권은 천체의 지위(Geographical position, GP)를 중심으로 하고 정거(Zenith distance), 곧 천체의 여고도(Coaltitude, 90° − h)를 반지름으로 하는 등고도권(Circle of equal altitude)이다. 지구 구면 위에서는 원이지만 점장도에서는 특수한 곡선으로 그려진다.[1]","terms":[{"ko":"등고도권","en":"Circle of equal altitude","plain":"같은 고도로 보이는 지점들의 원 = 위치권"},{"ko":"[[정거]]","en":"Zenith distance","abbr":"z","plain":"90° − 고도. 위치권의 반지름(각도)"},{"ko":"여고도","en":"Coaltitude","plain":"90° − 고도. 정거와 같은 값"},{"ko":"해리","en":"Nautical mile","abbr":"NM","plain":"위도 1′의 길이. 1° = 60해리"},{"ko":"점장도","en":"Mercator chart","plain":"극 쪽을 늘려 그린 항해용 해도"},{"ko":"등거리권","en":"Circle of equal distance","plain":"물표에서 같은 거리인 점들의 원. 연안항법에서 씀"}],"why":"고도가 높은 천체일수록 위치권이 작고 많이 휘어 있다. 그래서 고도가 아주 높은 천체(약 75° 이상)는 [[위치선]] 대신 위치권을 직접 그리는 편이 좋다. 보통 고도의 천체는 위치권이 매우 커서 짧은 위치선으로 대신해도 오차가 거의 없다.","body":["그림 8.5는 정거가 서로 다른 3가지 위치권을 지구 구면 위에 나타낸 것이다. 위치권은 연안항법에서 [[지상물표 측각|앙각거리]]로 얻는 등거리권이나 Radar 거리로 얻는 등거리권과 비슷한 개념이다.[1]","다만 연안항법의 등거리권은 반지름이 보통 수십 해리 이내인데, 천문항법의 위치권은 비교할 수 없을 만큼 크다. 반지름(해리)은 정거(°)에 60을 곱해 구하며, 고도가 낮아질수록 커진다.[2]",{"formula":"반지름(해리) = (90° − h) × 60"},"h는 천체의 고도(°), 90° − h는 정거(°), 60은 1°를 해리로 바꾸는 수다.",{"table":{"head":["고도 h","정거 90° − h","위치권의 반지름"],"rows":[["75°","15°","900해리"],["60° (교재 예)","30°","1,800해리"],["45°","45°","2,700해리"],["30°","60°","3,600해리"]]},"caption":"고도가 낮을수록 위치권이 커진다 (60° 외는 보충 예시[3])"},"그림 8.6은 그림 8.5의 위치권을 점장도법 해도에 옮긴 것이다. 점장도법의 투영 방식 때문에 구면 위의 원이 해도에서는 특수한 곡선이 되고, 큰 위치권일수록 모양이 크게 일그러진다.[2] 그래서 실제로는 가정위치 근처의 위치선만 작도한다([[고도차법]]).[4]"],"confusions":"고도가 높을수록 위치권은 작다. 반지름이 고도가 아니라 정거(90° − h)에 비례하기 때문이다. 고도가 90°이면 반지름이 0, 곧 관측자가 지위에 서 있는 것이다.[3]","key":["위치권 = GP 중심, 반지름 = 정거(90° − h)인 등고도권","반지름(해리) = (90° − h) × 60, 예: h 60° → 1,800해리","점장도에서는 원이 아니라 특수한 곡선"],"footnotes":["교재 157–158쪽, 그림 8.5.","교재 158쪽, 그림 8.6.","교재 밖 보충 예시.","교재 159쪽.","교재 밖 보충 설명. 1해리는 원래 위도 1′에 해당하는 자오선 호의 길이로 정의되었으므로 1° = 60해리다. 정거로 반지름을 구하는 식 zd[해리] = 60 × (90° − Ho)는 영어 자료에도 같다. 참고: [Circle of equal altitude — Wikipedia](https://en.wikipedia.org/wiki/Circle_of_equal_altitude), [Nautical mile — Wikipedia](https://en.wikipedia.org/wiki/Nautical_mile)."],"flags":[]},{"title":"구면삼각형의 계산","easy":["평평한 종이에 그린 삼각형은 세 각을 더하면 180°다. 그러나 공 표면에 그린 삼각형은 각의 합이 180°보다 크고, 변과 각의 관계식도 달라진다. 하늘과 지구는 둥글기 때문에 ‘공 위의 삼각형 공식’이 필요하다.","천측에서 쓰는 삼각형은 천의 극, 관측자의 천정, 천체를 잇는 [[항해삼각형]](Navigational triangle)이다. 이 삼각형을 푸는 기본 공식이 **구면 코사인법칙**(Spherical law of cosines)이다.[5]","공식에 내 위도 L, 천체의 [[적위]] d, [[지방시각·자오선각|자오선각]] t를 넣으면 천체의 고도 h가 나온다. 예컨대 교재 Sun Sighting 값(L 35°S, d 12°42′.8N, t 27°)을 넣으면 h ≈ 35°51′이다. 삼각형이 아주 작으면 이 공식은 평면의 코사인법칙과 거의 같아진다.[5]"],"definition":"천구 위의 천문삼각형(항해삼각형, Navigational triangle)을 구면삼각형의 코사인법칙(Spherical law of cosines)으로 풀어, 천체의 고도(h)·적위(d)·자오선각(t)·관측자의 위도(L) 가운데 셋을 알 때 나머지 하나를 구하는 계산.[1]","terms":[{"ko":"구면 코사인법칙","en":"Spherical law of cosines","plain":"공 위 삼각형의 변과 각 관계식"},{"ko":"[[항해삼각형]]","en":"Navigational triangle","plain":"천의 극·천정·천체를 잇는 구면삼각형"},{"ko":"[[극거]]","en":"Polar distance","abbr":"p","plain":"천의 극에서 천체까지. 90° − d"},{"ko":"[[정거]]","en":"Zenith distance","abbr":"Zd","plain":"천정에서 천체까지. 90° − h"},{"ko":"여위도","en":"Colatitude","abbr":"Δ","plain":"천의 극에서 천정까지. 90° − L"},{"ko":"자오선각","en":"Meridian angle","abbr":"t","plain":"극에서 잰 각, 정거의 대각"},{"ko":"방위각","en":"Azimuth angle","abbr":"Z","plain":"천정에서 잰 각, 극거의 대각"}],"why":"식 (8.4)는 [[계산고도·계산방위각|계산고도]] Hc를 구하는 공식이다. 가정위치의 위도, 천측력에서 찾은 적위, LHA에서 얻은 t를 넣으면 ‘그 자리에서 보여야 할 고도’가 나온다. [[천측계산표]]는 이 계산을 미리 해 둔 표이고, 계산기로 풀 때는 이 식을 직접 쓴다.","body":["그림 8.4의 구면삼각형에서 세 변은 극거 p = 90° − d, 정거 Zd = 90° − h, 여위도 Δ = 90° − L이다. 정거와 마주보는 각은 자오선각 t(180°W~180°E), 극거와 마주보는 각은 방위각 Z다.[2] 3D 장면 7에서 이 삼각형을 돌려 볼 수 있다.","자오선각 t는 GHA와 관측자의 경도로 다음처럼 구한다.",{"list":["t(E) = 360° − LHA = 360° − (GHA − 관측자의 경도(W)) = 360° − (GHA + 관측자의 경도(E))","t(W) = LHA = GHA − 관측자의 경도(W) = GHA + 관측자의 경도(E)"]},"평면삼각형에서는 a² = b² + c² − 2bc cos A를 쓴다. 구면삼각형에서는 cos a = cos b · cos c + sin b · sin c · cos A를 쓴다. 이 구면 코사인법칙을 그림 8.4의 삼각형에 대응시키면 식 (8.3)이 된다.[3]",{"formula":"cos Zd = cos Δ · cos p + sin Δ · sin p · cos t","label":"식 (8.3)"},"Zd는 정거, Δ는 여위도, p는 극거, t는 자오선각이다. 곧 ‘구하려는 변(Zd)’의 cos을 나머지 두 변과 그 사이 각(t)으로 나타낸 식이다.","여기에 Zd = 90° − h, Δ = 90° − L, p = 90° − d를 넣고 cos(90° − x) = sin x를 쓰면 식 (8.4)가 된다. 이 식으로 천체의 고도, 적위, 자오선각, 관측자의 위도 4요소 가운데 3개를 알면 나머지 1개를 계산할 수 있다.[3]",{"formula":"sin h = sin L · sin d + cos L · cos d · cos t","label":"식 (8.4)"},"h는 고도, L은 관측자(또는 가정위치)의 위도, d는 적위, t는 자오선각이다.",{"table":{"head":["순서","계산","값"],"rows":[["① 입력","L 35°S, d 12°42′.8N(이명 → 음수), t 27°","—"],["② sin L · sin d","sin 35° × sin(−12°42′.8)","−0.1262"],["③ cos L · cos d · cos t","cos 35° × cos 12°42′.8 × cos 27°","0.7120"],["④ sin h","② + ③","0.5857"],["⑤ h","sin⁻¹ 0.5860","35°51′.3"]]},"caption":"식 (8.4)를 Sun Sighting 값에 직접 적용(위키 계산[4])"}],"confusions":"교재의 유도는 p = 90° − d, 곧 위도와 적위가 동명일 때다. 이명이면 p = 90° + d이므로 식 (8.4)에 d를 음수로 넣는다.[4] 예컨대 [[Sun Sighting]](L 35°S, d 12°42′.8N, t 27°)은 이명이라 d를 음수로 넣으면 h = 35°51′.3이 나온다.","key":["변: p = 90° − d, Zd = 90° − h, Δ = 90° − L / 각: t(Zd의 대각), Z(p의 대각)","식 (8.3) cos Zd = cos Δ cos p + sin Δ sin p cos t","식 (8.4) sin h = sin L sin d + cos L cos d cos t","4요소(h, d, t, L) 중 3개 → 나머지 1개"],"footnotes":["교재 155–157쪽, 그림 8.4, 식 (8.3), (8.4).","교재 155–156쪽, 그림 8.4. 교재는 정거를 Zd, 방위각을 소문자 z로 적었다. 위키는 방위각을 다른 문서와 같이 Z로 쓴다. 167쪽의 Star Sighting 작도 예도 ‘그림 8.4’로 번호가 겹친다.","교재 156–157쪽.","교재 밖 보충 설명. 극거의 부호 규칙은 ‘극거’ 문서의 식 (1.1) 참고. 직접 계산한 값은 ‘Sun Sighting’ 문서의 검토 표시에 있다.","교재 밖 보충 설명. 구면 코사인법칙은 변 a, b, c와 c의 대각 C 사이의 관계식이며, 삼각형이 작을수록 평면의 코사인법칙과 거의 같아진다. 중세 이슬람 천문학자들도 태양의 방위각 같은 천문 문제를 이와 같은 식으로 풀었다. 참고: [Spherical law of cosines — Wikipedia](https://en.wikipedia.org/wiki/Spherical_law_of_cosines)."],"flags":[{"kind":"교재 밖","text":"교재는 식 (8.4)를 동명(p = 90° − d)으로만 유도했다. 이명일 때 d를 음수로 넣는 부호 규칙은 위키가 덧붙였다.","fn":4}]},{"title":"고도차법","easy":["멀리 있는 등대까지의 거리를 생각해 보자. 내가 있다고 ‘가정한 자리’에서 계산한 거리는 10해리인데, 실제로 재어 보니 8해리였다. 그러면 나는 가정한 자리보다 등대 쪽으로 2해리 더 가까이 있다.","천측도 똑같다. 등대 대신 천체의 [[천체의 지위|지위]](GP)를, 거리 대신 고도를 쓴다. [[가정위치]](Assumed position, AP)에서 계산한 고도 Hc와 실제로 잰 고도 Ho를 비교해, 그 차이 a = Ho − Hc를 **고도차**(Intercept)라 한다.[4]","고도 1′ 차이는 지구 위 거리 1해리와 같다. 그래서 AP에서 천체 방향으로 a해리만큼 옮기고, 거기서 직각으로 선을 그으면 [[위치선]]이 된다. 이 방법이 **고도차법**(Intercept method)이다.[4]"],"definition":"관측자 근처에 정한 가정위치(Assumed position, AP)에서 계산한 계산고도(Computed altitude, Hc)와 실제 관측고도(Observed altitude, Ho)의 차, 곧 고도차 a = Ho − Hc를 이용해 AP를 기점으로 위치선을 작도하는 방법(Altitude difference method). 1875년 Marcq St. Hilaire가 발표했으며 수정차법(Intercept method)이라고도 한다.[1]","terms":[{"ko":"고도차법","en":"Intercept method","plain":"AP에서 고도차만큼 옮겨 위치선을 긋는 방법"},{"ko":"고도차","en":"Altitude intercept","abbr":"a","plain":"Ho − Hc. 1′ = 1해리로 거리처럼 쓴다"},{"ko":"[[계산고도·계산방위각|계산고도]]","en":"Computed altitude","abbr":"Hc","plain":"AP에서 보여야 할 고도"},{"ko":"[[Sextant 고도·관측고도|관측고도]]","en":"Observed altitude","abbr":"Ho","plain":"육분의 고도를 모두 고친 실제 고도"},{"ko":"가정위치","en":"Assumed position","abbr":"AP","plain":"계산의 출발점으로 정한 자리"},{"ko":"방위선","en":"Azimuth line","plain":"AP에서 천체 방위 Zn 쪽으로 그은 선"}],"why":"고도차법은 오늘날 천측 위치선을 긋는 표준 방법이다. 육분의 고도를 고쳐 Ho를 얻고, AP에서 Hc와 방위 Zn을 계산한 뒤, a = Ho − Hc만큼 옮겨 위치선을 긋는다. 교재 8장 흐름(관측 → 고도개정 → 계산고도 → 고도차 → 위치선) 전체가 이 방법을 위한 것이다.","body":["지위를 중심으로 정거를 반지름으로 하는 등고도권은 반지름이 너무 크고, 점장도에서 특수한 곡선이 되어 그대로 기입하기 어렵다. 그래서 관측자 근처의 가정위치를 기점으로 위치선만 작도한다.[2] 그림 8.7에서 극을 P, 지위를 GP라 하면 지구 표면 위의 [[항해삼각형]] P-AP-GP는 다음과 같다.[2]",{"list":["P-AP = 90° − L(위도)","P-GP = 90° ± d(적위)","∠AP-P-GP = t (AP에 대한 자오선각)"]},"관측 시각으로 천측력에서 t와 적위를 구하고 AP의 위도를 쓰면, AP에 대한 정거 AP-GP와 방위각 Z를 계산할 수 있다. 이 정거에 대응하는 고도가 계산고도 Hc다.[2] 한편 관측고도 Ho의 여각은 실제 위치에서의 관측정거 E-GP다.[2]",{"formula":"계산정거 − 관측정거 = (90° − Hc) − (90° − Ho) = Ho − Hc = a"},"계산정거(90° − Hc)는 AP에서 지위까지의 거리, 관측정거(90° − Ho)는 실제 위치에서 지위까지의 거리다. 두 거리의 차가 고도차 a이고, 그림에서 AP-E가 바로 a다.","AP에서 방위각 Z 방향으로 선을 긋고 a만큼 떨어진 점에서 이 선에 수직인 선을 그으면 위치선이 되며, 배는 그 선 위 어딘가에 있다.[3] AP가 실제 위치보다 지위에서 멀 수도 가까울 수도 있으므로, 고도차에는 [[고도차 부호 T·A|부호 T·A]]를 붙여 구별한다.[3]",{"table":{"head":["순서","계산","값"],"rows":[["① Ho","Sun Sighting 관측고도","36°06′.7"],["② Hc","AP에서 계산","35°51′.4"],["③ a","① − ② (Ho가 큼 → T)","15′.3 T"],["④ 작도","AP에서 Zn 033°.2 쪽으로 15.3해리 → 수직선","위치선"]]},"caption":"교재 163–164쪽 예제로 본 고도차법 한 바퀴"},"3D 장면 11에서 이 작도를 단계별로 볼 수 있다. 실제 계산 순서는 [[△d 개정법]]에, 작도는 [[위치기입도 작도]]에 이어진다."],"confusions":"고도차는 각도(′)지만 지구 위에서 1′은 1해리이므로 그대로 거리로 쓴다. 또 a는 AP와 실제 선위 사이의 거리가 아니라 방위 방향으로 잰 거리일 뿐이다.","key":["a = Ho − Hc = 계산정거 − 관측정거","AP에서 방위 방향으로 a만큼 → 그 점에서 수직선 = 위치선","1875 Marcq St. Hilaire, 수정차법(Intercept method), 신항법"],"footnotes":["교재 150쪽, 159–160쪽.","교재 159쪽, 그림 8.7.","교재 160쪽.","교재 밖 보충 설명. 영어 자료도 Ho와 Hc의 차를 각의 분(′) 단위로 적은 값, 곧 해리 수를 Intercept라 하고, 방위선에 수직인 직선을 위치선으로 긋는다고 설명한다. 참고: [Intercept method — Wikipedia](https://en.wikipedia.org/wiki/Intercept_method)."],"flags":[]},{"title":"계산고도·계산방위각","easy":["‘내가 이 자리에 있다면, 지금 해는 몇 도 높이에, 어느 쪽에 보여야 할까?’ 이 질문에 계산으로 답한 값이 계산고도와 계산방위각이다. 여기서 ‘이 자리’는 실제 위치가 아니라 계산하기 좋게 정한 [[가정위치]](Assumed position, AP)다.","높이에 대한 답이 **계산고도**(Computed altitude, Hc), 방향에 대한 답이 **계산방위각**(Computed azimuth angle, Z)이다. 교재 Sun Sighting 예에서는 Hc 35°51′.4, 방향은 북동쪽인 033°.2가 나왔다.[3]","실제로 육분의로 재어 고친 [[Sextant 고도·관측고도|관측고도]](Observed altitude, Ho)는 36°06′.7이었다. 계산보다 15′.3 높게 보였으니 배는 AP보다 해 쪽으로 15.3해리 가까이 있다. 이렇게 비교하는 기준이 Hc다."],"definition":"가정위치(Assumed position, AP)에서 관측 시각에 천체를 보았다고 할 때의 고도와 방위각. 앞의 것을 계산고도(Computed altitude, Hc), 뒤의 것을 계산방위각(Computed azimuth angle, Z)이라 한다.[1]","terms":[{"ko":"계산고도","en":"Computed altitude","abbr":"Hc","plain":"AP에서 그 시각에 보여야 할 천체의 고도"},{"ko":"계산방위각","en":"Computed azimuth angle","abbr":"Z","plain":"AP에서 본 천체 방향. N·S에서 E·W로 잰 각"},{"ko":"방위","en":"True azimuth","abbr":"Zn","plain":"북에서 시계 방향으로 0°~360° 잰 방향"},{"ko":"표의 고도","en":"Tabulated altitude","abbr":"ht","plain":"천측계산표에서 바로 읽은 고도"},{"ko":"관측고도","en":"Observed altitude","abbr":"Ho","plain":"육분의 고도를 모두 고친 값"},{"ko":"[[가정위치]]","en":"Assumed position","abbr":"AP","plain":"계산의 출발점으로 정한 자리"}],"why":"천측계산 6단계 가운데 ④ ‘고도와 방위의 계산’의 결과가 Hc와 Z다. Hc는 ⑤에서 Ho와 비교되어 [[고도차법|고도차]]가 되고, Z를 고친 방위 Zn은 ⑥에서 위치선을 긋는 방향이 된다.","body":["AP의 위도 L, 관측 시각의 적위 d와 자오선각 t를 알면 항해삼각형을 풀어 AP에서의 정거와 방위각 Z를 얻는다. 정거를 90°에서 빼면 계산고도 Hc다.[1] 직접 풀 때는 [[구면삼각형의 계산]]의 식 (8.4)를 쓴다.[2]",{"formula":"sin Hc = sin L · sin d + cos L · cos d · cos t","label":"식 (8.4)"},"L은 AP의 위도, d는 적위, t는 자오선각이다. 위도와 적위의 이름(N·S)이 다르면 d를 음수로 넣는다.","실무에서는 [[천측계산표]]로 구한다. [[△d 개정법]]에서는 표에서 찾은 고도 ht에 △d 개정을 해서 Hc를 얻고, 방위각 Z도 함께 찾는다.[3] Z 앞에는 위도와 같은 이름(N·S), 뒤에는 자오선각과 같은 이름(E·W)을 붙인 뒤 다음처럼 방위(Zn)로 고친다.[4]",{"list":["N…E: Zn = Z","N…W: Zn = 360° − Z","S…E: Zn = 180° − Z (교재 예: S146°.8E → 033°.2)","S…W: Zn = 180° + Z"]},{"table":{"head":["순서","계산","값"],"rows":[["① 표의 고도 ht","Pub. 229 (t 27°, Dec 12°, aL 35°S)","36°29′.3"],["② △d 개정","−53′.2 × 42′.8 ÷ 60","(−)37′.9"],["③ Hc","① + ②","35°51′.4"],["④ Z","표값 146°.5 + 보간 0°.3, 이름 S…E","S146°.8E"],["⑤ Zn","180° − 146°.8","033°.2"]]},"caption":"교재 163–164쪽 Sun Sighting의 Hc와 Zn[3]"},"이 Hc를 관측고도 Ho와 비교하는 것이 고도차법이다."],"confusions":"1·2장에서는 계산고도를 H로, 8장에서는 Hc로 쓴다. 위키는 Hc로 통일한다.[5] 또 Pub. 229 표에는 표의 고도 ht 칸이 ‘Hc’로 인쇄되어 있으므로, 표값(ht)과 △d 개정을 마친 계산고도(Hc)를 구별해야 한다.[3]","key":["Hc = AP에서 계산한 고도, 비교 대상은 관측고도 Ho","계산방위각 Z: 앞은 위도 이름, 뒤는 자오선각 이름 → Zn으로 변환","1·2장의 H = 8장의 Hc","Pub. 229의 ‘Hc’ 칸 값은 표값 ht, △d 개정 후가 계산고도 Hc"],"footnotes":["교재 159쪽.","교재 157쪽, 식 (8.4).","교재 162–164쪽. 교재의 방위각 보간 0°.3은 0°.36을 반올림하면 0°.4이므로 S146°.9E, Zn 033°.1이 더 정확하다(‘Sun Sighting’ 문서의 검토 표시).","교재 밖 보충 설명. 교재는 예제에서 S146°.8E를 Zn 033°.2로 바꾼 것만 보여 준다. 방위와 방위각의 뜻은 ‘방위·방위각’ 문서 참고. 미국 항해서 Bowditch는 같은 규칙을 LHA로 적는다. 북위에서 LHA > 180°면 Zn = Z, LHA < 180°면 Zn = 360° − Z이고, 남위에서 LHA > 180°면 Zn = 180° − Z, LHA < 180°면 Zn = 180° + Z다. LHA > 180°는 천체가 동쪽(E)에 있다는 뜻이므로 위키의 네 규칙과 같다. 참고: [The American Practical Navigator, Chapter 20 Sight Reduction — Wikisource](https://en.wikisource.org/wiki/The_American_Practical_Navigator/Chapter_20).","교재 1·2장은 H, 8장은 Hc로 표기한다."],"flags":[{"kind":"교재 밖","text":"방위각 Z를 방위 Zn으로 바꾸는 네 가지 규칙은 이 쪽에 없는 보충이다. 교재에는 S146°.8E → 033°.2 예만 있다.","fn":4}]},{"title":"가정위치","easy":["정확한 내 위치를 모를 때, 근처의 계산하기 편한 자리에 임시 깃발을 꽂는다고 생각하자. 그 깃발 자리가 **가정위치**(Assumed position, AP)다. 배가 실제로 거기 있다는 뜻은 아니다.","왜 굳이 다른 자리를 고를까? [[천측계산표]]는 위도와 LHA가 정수 도(°)일 때의 값만 싣고 있다. 그래서 위도는 35°처럼 딱 떨어지게, 경도는 LHA가 333°처럼 딱 떨어지도록 골라 표를 바로 찾는다.[5]","예를 들어 추측위치(Dead reckoning position, DR)가 34°45′.0S, 132°12′.0E이면 가정위도는 가장 가까운 정수인 35°S다. 가정경도는 GHA 200°39′.6에 더해 333°가 되도록 132°20′.4E로 잡는다.[3]"],"definition":"위치선을 작도하는 기점으로, 관측자의 실제 위치 가까이에 계산하기 편하게 정한 위치(Assumed position, AP). [[△d 개정법]]에서는 추측위도에 가장 가까운 정수위도를 가정위도(Assumed latitude, aL)로, LHA가 정수도가 되는 경도를 가정경도(Assumed longitude, aλ)로 잡는다.[1]","terms":[{"ko":"가정위치","en":"Assumed position","abbr":"AP","plain":"계산하기 좋게 정한 위치선 작도의 기점"},{"ko":"가정위도","en":"Assumed latitude","abbr":"aL","plain":"DR 위도에 가장 가까운 정수 위도"},{"ko":"가정경도","en":"Assumed longitude","abbr":"aλ","plain":"LHA가 정수 도가 되게 고른 경도"},{"ko":"추측위치","en":"Dead reckoning position","abbr":"DR","plain":"침로·속력으로 추정한 배의 위치"},{"ko":"[[지방시각·자오선각|지방시각]]","en":"Local Hour Angle","abbr":"LHA","plain":"GHA ± 경도. 가정경도로 정수 도를 만든다"}],"why":"[[고도차법]]에서 계산고도와 방위는 모두 AP에서 계산하고, 위치선도 AP를 출발점으로 긋는다. AP를 잘 고르면 표를 바로 찾을 수 있어 계산 실수가 줄어든다. 대신 AP가 DR에서 조금 떨어지므로 고도차가 조금 커진다.","body":["고도차법에서는 관측자 부근의 가정위치를 기점으로 위치선을 그린다. AP에서 계산고도를 구하고, 관측고도와의 차만큼 옮겨 위치선을 긋는다.[2]",{"list":["가정위도 aL: 추측(또는 추정)위도에 가장 가까운 정수위도. 가정위치를 쓰는 방법에서는 언제나 이렇게 잡는다.[3]","가정경도 aλ: 동경이면 GHA + aλ, 서경이면 GHA − aλ가 정수도가 되게 하고, 추측(또는 추정)경도와 30′ 미만으로 차이 나는 경도를 고른다.[3]"]},{"table":{"head":["순서","계산","값"],"rows":[["① GHA","Sun Sighting 관측 시각","200°39′.6"],["② 목표 LHA","GHA + DR 경도(132°12′.0E) ≈ 332°51′.6 → 가장 가까운 정수","333°"],["③ aλ","333° − 200°39′.6 (동경)","132°20′.4E"],["④ DR과의 차","132°20′.4 − 132°12′.0","8′.4 (30′ 미만)"],["⑤ aL","DR 34°45′.0S에 가장 가까운 정수","35°00′.0S"]]},"caption":"교재 163쪽 Sun Sighting으로 가정위치 정하기"},{"table":{"head":["예제","DR","aL","aλ","LHA"],"rows":[["Sun Sighting","34°45′.0S, 132°12′.0E","35°00′.0S","132°20′.4E","200°39′.6 + 132°20′.4 = 333°"],["Star Sighting (박명시)","05°53′.0N, 080°43′.0E","06°00′.0N","80°40′.3E","LHA♈ = 29°19′.7 + 80°40′.3 = 110°"]]},"caption":"교재 163·165쪽 예제의 가정위치 (Star Sighting은 ③의 박명시 값이며, ⑥에서는 별마다 aλ를 다시 잡았다)"},"가정위치는 계산을 쉽게 해 주지만, 천체를 여러 개 관측하면 천체마다 aλ가 달라져 작도가 번거롭다. 또 고도차가 비교적 커져서 작도 오차가 들어갈 염려가 있다.[4] 두 방법의 비교는 [[가정위치법과 추측위치법]]에 있다."],"confusions":"가정위치는 배의 위치가 아니다. 계산을 편하게 하려고 고른 점이며, 실제 선위는 이 점을 기점으로 그은 위치선 위에 있다. 같은 시각 근처라도 천체마다 aλ가 다를 수 있다.","key":["AP = 위치선 작도의 기점, 배의 위치가 아님","aL = 추측위도에 가장 가까운 정수위도","aλ: LHA가 정수도가 되고 추측경도와 30′ 미만 차"],"footnotes":["교재 159쪽, 161쪽.","교재 159–160쪽.","교재 163쪽 〈주1〉, 〈주3〉.","교재 161쪽.","교재 밖 보충 설명. Bowditch도 가정위도는 DR 위도에 가장 가까운 정수 위도로, 가정경도는 LHA가 정수 도가 되는 경도 가운데 DR 경도에 가장 가까운 것으로 고르라고 한다. LHA가 정수가 되는 경도는 1° 간격으로 있으므로 가장 가까운 것은 언제나 DR 경도와 30′ 이내다. 참고: [The American Practical Navigator, Chapter 20 Sight Reduction — Wikisource](https://en.wikisource.org/wiki/The_American_Practical_Navigator/Chapter_20)."],"flags":[]},{"title":"천측계산","easy":["육분의로 잰 각도와 시계로 잰 시각은 그 자체로는 숫자 두 개일 뿐이다. 이 숫자를 해도에 그을 수 있는 선 하나로 바꾸는 계산 전체를 **천측계산**(Sight reduction)이라 한다.","요리로 치면 정해진 레시피가 있다. 잰 고도를 바로잡고, 천체가 어디 있는지 찾고, 내가 있다고 가정한 자리에서 보일 고도를 계산해 실제와 비교한 뒤, 그 차이로 선을 긋는다. 교재와 미국 항해서 Bowditch 모두 이 과정을 같은 6단계로 나눈다.[3]","표를 쓰면 계산은 거의 더하기와 빼기뿐이다.[4] 예를 들어 교재 [[Sun Sighting]]은 시각 01-18-43과 고도 35°57′.3 두 숫자로 시작해 ‘가정위치에서 033°.2 쪽으로 15′.3 T’라는 위치선으로 끝난다."],"definition":"천체를 관측하고 위치선(Line of position)을 결정하는 데 필요한 요소를 계산하는 과정(Sight reduction).[1]","terms":[{"ko":"천측계산","en":"Sight reduction","plain":"관측값을 위치선 요소로 바꾸는 계산 전체"},{"ko":"[[천측계산표]]","en":"Sight reduction tables","plain":"고도·방위를 미리 계산해 둔 표"},{"ko":"[[Sextant 고도·관측고도|Sextant 고도]]","en":"Sextant altitude","abbr":"hs","plain":"육분의 눈금에서 읽은 그대로의 고도"},{"ko":"관측고도","en":"Observed altitude","abbr":"Ho","plain":"hs를 모두 고친 실제 고도"},{"ko":"[[계산고도·계산방위각|계산고도]]","en":"Computed altitude","abbr":"Hc","plain":"가정위치에서 보여야 할 고도"},{"ko":"위치선","en":"Line of position","abbr":"LOP","plain":"천측계산의 최종 결과"}],"why":"배에서 해나 별을 잴 때마다 이 6단계를 한 번씩 돈다. 교재 8장의 흐름(관측 → 고도개정 → 계산고도 → 고도차 → 위치선)이 바로 천측계산의 순서다. 단계를 외워 두면 풀이표의 각 칸이 어느 단계인지 바로 알 수 있다.","body":["교재는 위치선을 결정하는 과정을 다음 6단계로 나눈다.[2]",{"steps":["Sextant 고도의 개정 — 육분의로 잰 고도 hs를 관측고도 Ho로 고친다.","GHA 및 Dec.의 결정 — 관측 시각의 GHA와 적위를 [[천측력]]에서 구한다.","자오선각의 결정 — GHA와 경도로 LHA와 [[지방시각·자오선각|자오선각]] t를 구한다.","고도와 방위의 계산 — 가정위치에서의 계산고도와 방위각을 구한다.","계산고도와 관측고도의 비교 — [[고도차법|고도차]] a와 그 부호를 정한다.","위치선의 기입 — 해도나 위치기입도에 위치선을 그린다([[위치기입도 작도]])."]},{"table":{"head":["단계","들어가는 값","나오는 값 (Sun Sighting)"],"rows":[["① 고도 개정","hs 35°57′.3, IC, HE","Ho 36°06′.7"],["② GHA·Dec","GMT 01-20-55","GHA 200°39′.6, Dec N12°42′.8"],["③ 자오선각","GHA, aλ 132°20′.4E","LHA 333°, t 27°E"],["④ 고도·방위","aL 35°S, Dec, t","Hc 35°51′.4, Zn 033°.2"],["⑤ 비교","Ho, Hc","a 15′.3 T"],["⑥ 기입","AP, a, Zn","1020 태양 위치선"]]},"caption":"6단계를 교재 162–164쪽 Sun Sighting 값으로 따라가기"},"넓게 보면 이 과정에서 쓰는 표를 모두 천측계산표(Sight reduction table)라 할 수 있다. 그러나 보통은 ④의 고도와 방위를 계산하는 표만 그렇게 부른다.[2]","실제 풀이는 Sun Sighting과 [[Star Sighting]] 예제에서 볼 수 있다. 두 풀이표에 이 6단계가 모두 들어 있다."],"confusions":"①의 고도 개정과 ④의 고도 계산은 다르다. ①은 실제로 잰 고도를 바로잡는 것이고, ④는 가정위치에서 보일 고도를 계산하는 것이다. 이 둘을 ⑤에서 비교한다.","key":["천측계산(Sight reduction) = 관측값 → 위치선 요소 계산","6단계: 고도 개정 → GHA·Dec → 자오선각 → 고도·방위 계산 → 비교 → 기입"],"footnotes":["교재 160쪽. 교재는 ‘Sighting reduction’으로 썼으나, 같은 쪽의 ‘Sight reduction table’처럼 Sight reduction이 맞는 용어다.","교재 160쪽.","교재 밖 보충 설명. 미국 항해서 Bowditch(The American Practical Navigator)도 Sight reduction을 같은 6단계로 적는다: hs를 Ho로 고치기, GHA와 적위 구하기, AP를 정하고 LHA 구하기, AP에서 고도와 방위 계산, 계산고도와 관측고도 비교, 위치선 기입. 참고: [The American Practical Navigator, Chapter 20 Sight Reduction — Wikisource](https://en.wikisource.org/wiki/The_American_Practical_Navigator/Chapter_20).","교재 밖 보충 설명. 천측계산표를 쓰면 필요한 계산은 더하기와 빼기뿐이다. 참고: [Celestial navigation — Wikipedia](https://en.wikipedia.org/wiki/Celestial_navigation)."],"flags":[{"kind":"교재 정정","text":"교재 160쪽의 ‘천측계산(Sighting reduction)’을 Sight reduction으로 바로잡았다.","fn":1}]},{"title":"천측계산표","easy":["구구단 표를 떠올려 보자. 7 × 8을 매번 계산하지 않고 표에서 56을 읽는다. **천측계산표**(Sight reduction tables)도 같은 생각으로, 위도·적위·LHA 조합마다 고도와 방위를 미리 계산해 실어 둔 책이다.","그래서 [[구면삼각형의 계산|식 (8.4)]] 같은 삼각함수 계산을 배에서 하지 않아도 된다. 정수 도로 맞춘 값으로 표를 찾고, 어중간한 부분만 비례로 보정하면 된다.","가장 많이 쓰는 표는 미국에서 낸 Pub. No. 229와 Pub. No. 249다. 229는 선박용(Marine)이라 0′.1까지 자세하고, 249는 항공용(Air)이라 1′ 단위로 빠르다. 교재는 태양에 229를, 별에 249 제1권을 쓴다.[4]"],"definition":"넓은 의미로는 천측계산(Sight reduction) 과정에서 쓰는 표 전부를 말하지만, 보통은 고도와 방위를 계산하는 데 쓰는 표(Sight reduction tables)만 가리킨다.[1]","terms":[{"ko":"천측계산표","en":"Sight reduction tables","plain":"고도·방위를 미리 계산해 둔 표"},{"ko":"Pub. No. 229","en":"Sight Reduction Tables for Marine Navigation","abbr":"Pub. 229","plain":"선박용 표. 위도 15°씩 6권, 0′.1 단위"},{"ko":"Pub. No. 249","en":"Sight Reduction Tables for Air Navigation","abbr":"Pub. 249","plain":"항공용 표. 3권, 1′ 단위"},{"ko":"선택 항성","en":"Selected Stars","abbr":"Vol. 1","plain":"Pub. 249 제1권. 관측하기 좋은 별을 골라 실음"},{"ko":"동명·이명","en":"Same name, Contrary name","plain":"위도와 적위의 N·S가 같은지 다른지"},{"ko":"표의 고도","en":"Tabulated altitude","abbr":"ht","plain":"표에서 바로 읽은 고도. 개정 전 값"}],"why":"천측계산 6단계 중 ④ ‘고도와 방위의 계산’을 이 표로 한다. 손으로 식 (8.4)를 풀면 시간이 걸리고 틀리기 쉽지만, 표를 쓰면 몇 분 만에 Hc와 Z를 얻는다. Pub. 229의 표값은 순수한 수학 결과라 해가 바뀌어도 계속 쓸 수 있고, 별의 위치가 들어간 Pub. 249 제1권만 주기적으로 새로 나온다.[5]","body":["현재 가장 널리 쓰이는 것은 미국 해군수로국(U.S. Navy Hydrographic Office, U.S.N.H.O.)이 간행한 두 표다.[2]",{"table":{"head":["항목","Pub. No. 229","Pub. No. 249"],"rows":[["정식 이름","Sight Reduction Tables for Marine Navigation","Sight Reduction Tables for Air Navigation"],["교재에서의 주 용도","Sun Sighting","Vol. 1 Selected Stars → Star Sighting"],["찾아 들어가는 값","aL, 적위, LHA","aL, LHA♈"],["얻는 값","표의 고도 ht, △d, 방위각 Z","선택된 항성의 Hc, Zn"],["예제 값의 자릿수","ht 36°29′.3, Z 146°.5 (0′.1, 0°.1 단위)","Hc 47°48′, Zn 079° (1′, 1° 단위)"]]},"caption":"교재 161–166쪽 내용 정리"},"Pub. 229는 위도와 적위가 동명(Same name, 둘 다 N 또는 둘 다 S)이면 왼쪽 페이지, 이명(Contrary name)이면 오른쪽 페이지에서 표값을 찾는다. 찾은 표값에 적위 차에 대한 개정을 하는 방법이 [[△d 개정법]]이다.[3]","Pub. 249 Vol. 1(Selected Stars)은 LHA♈와 aL만으로 관측하기 좋은 항성들의 Hc와 Zn을 바로 준다. 그래서 박명시 전에 관측할 별을 미리 고르는 데도 쓴다([[Star Sighting]]).[4]","Pub. 229는 위도 15°씩 나눈 6권, Pub. 249는 3권(제1권 선택 항성, 제2·3권 적위 0°~29° 천체용)으로 되어 있다. Pub. 229와 Pub. 249 제2·3권은 지금 미국 국가지리정보국(NGA)이 간행한다. 제1권은 별의 위치가 조금씩 변하므로 5년마다 기준 연도(Epoch)를 바꿔 새로 나오고, 그 앞뒤 2년씩 쓸 수 있다.[5]"],"confusions":"Pub. 249는 원래 항공용이지만, 선택 항성을 모은 Vol. 1 덕분에 선박의 Star Sighting에 주로 쓰인다. 예제 값의 자릿수에서 보듯 정밀도는 Pub. 229가 더 높다.[4]","key":["Pub. No. 229 = 선박용(Marine), Sun Sighting","Pub. No. 249 = 항공용(Air), Vol. 1 Selected Stars → Star Sighting","Pub. 229: 동명은 왼쪽 페이지, 이명은 오른쪽 페이지"],"footnotes":["교재 160쪽.","교재 160–161쪽.","교재 162쪽.","교재 161쪽, 163쪽, 165–166쪽.","교재 밖 보충 설명. NGA는 National Geospatial-Intelligence Agency의 약자다. Pub. 229는 위도 15°씩 6권(0°~15°, 15°~30°, …, 75°~90°)이고 남·북반구에 함께 쓴다. Pub. 249는 3권이며, 제2권은 위도 0°~40°, 제3권은 위도 39°~89°에서 적위 0°~29°의 천체를 다룬다. 제1권(선택 항성)은 5년마다 새 기준 연도(Epoch)로 나오고 그 앞뒤 2년씩 쓸 수 있다. Pub. 229의 표값은 순수한 수학 결과라 낡지 않는다. 참고: [Sight Reduction Tables — Starpath](https://www.starpath.com/catalog/books/1898.htm), [Pub. 229 Vol. 2 — American Nautical Services](https://www.amnautical.com/products/sight-reduction-tables-229-vol-2-latitudes-15-30-inclusive)."],"flags":[{"kind":"교재 밖","text":"두 표의 권 구성, Pub. 229와 Pub. 249 제2·3권의 현재 간행 기관(NGA), 제1권의 5년 주기 개정은 교재에 없는 보충이다.","fn":5},{"kind":"교재 밖","text":"Pub. 249 제1권을 기준 연도 앞뒤 2년씩 쓸 수 있다는 점과 제2·3권의 위도 범위(0°~40°, 39°~89°)는 Starpath 자료에서 가져온 보충이다.","fn":5}]},{"title":"가정위치법과 추측위치법","easy":["위치선을 계산할 출발점을 어디로 잡느냐에 따라 방법이 둘로 나뉜다. 하나는 계산하기 좋은 근처의 ‘둥근 숫자 자리’, 곧 [[가정위치]](Assumed position, AP)에서 출발한다. 다른 하나는 배가 있을 것 같은 바로 그 자리, 곧 추측위치(Dead reckoning position, DR)에서 출발한다.","둥근 숫자 자리에서 출발하면 표를 바로 찾을 수 있어 계산이 쉽다. 대신 출발점이 배에서 조금 떨어져 있어 고도차가 커지고, 천체마다 출발점이 달라 그림이 번거롭다.","DR에서 출발하면 그림은 정확하다. 하지만 위도·적위·자오선각이 모두 어중간한 값이라 셋 다 비례로 보정하는 **삼중보간**(Triple interpolation)을 해야 한다. 그래서 표를 쓸 때는 대부분 앞의 방법인 [[△d 개정법]]을 쓴다.[3]"],"definition":"위치선의 요소를 산출하는 두 방법. 하나는 가정위치(Assumed position, AP)를, 다른 하나는 추측위치(Dead reckoning position, DR) 또는 추정위치(Estimated position, EP)를 기점으로 고도와 방위각을 계산한다.[1]","terms":[{"ko":"가정위치","en":"Assumed position","abbr":"AP","plain":"계산하기 좋게 정한 정수 도의 자리"},{"ko":"추측위치","en":"Dead reckoning position","abbr":"DR","plain":"침로·속력으로 추정한 배의 위치"},{"ko":"추정위치","en":"Estimated position","abbr":"EP","plain":"DR에 해류 등 정보를 더해 고친 위치"},{"ko":"삼중보간","en":"Triple interpolation","plain":"위도·적위·자오선각 셋을 모두 비례 보정"},{"ko":"위치선의 요소","en":"Elements of a line of position","plain":"기점, 고도차 a, 방위 Zn"},{"ko":"고도차","en":"Altitude intercept","abbr":"a","plain":"Ho − Hc. 기점에서 옮기는 거리"}],"why":"위치선을 긋는 데 필요한 것은 기점, 고도차 a, 방위 Zn 세 가지다. 기점을 무엇으로 잡느냐에 따라 계산 분량과 작도 정확도가 달라진다. 교재 예제와 실무의 표 계산은 가정위치법을 쓴다.","body":["교재 예제에서 구하는 위치선의 요소는 기점(aL, aλ), 고도차 a, 방위 Zn이다. 이 값만 있으면 위치선을 그릴 수 있다.[2]",{"table":{"head":["비교","가정위치를 사용하는 방법","추측(추정)위치를 사용하는 방법"],"rows":[["계산","아주 간단해 짧은 시간에 고도와 방위각을 구한다","L, Dec., t를 모두 보간하는 삼중보간(Triple interpolation)이 필요해 오래 걸리고 틀리기 쉽다"],["작도","천체를 여러 개 관측하면 천체마다 가정경도를 정해야 해 번거롭다","특별한 경우가 아니면 아주 정확하게 작도할 수 있다"],["오차·정보","고도차(수정차)가 비교적 커서 수정점에서 실측위치까지의 거리도 커지고, 작도 오차가 들어갈 염려가 있다","위치선의 요소만 보고도 선위가 대략 어느 쪽으로 치우쳤는지 알 수 있다"]]},"caption":"교재 161쪽 두 방법의 특성"},"추측위치의 위도, 관측 시의 적위, 자오선각은 모두 표의 정수 도 사이에 있는 값이라 셋 다 보간해야 한다. 가정위치법은 위도와 LHA를 정수 도로 맞춰 두므로 적위 하나만 보간하면 된다.[3] 기점을 정하는 규칙은 가정위치에 있다.",{"table":{"head":["순서","가정위치법 (Sun Sighting)","추측위치법이었다면"],"rows":[["기점 위도","aL 35°00′.0S (정수)","DR 34°45′.0S (보간 필요)"],["기점 경도 → LHA","aλ 132°20′.4E → LHA 333° (정수)","DR 132°12′.0E → LHA 332°51′.6 (보간 필요)"],["적위","N12°42′.8 (보간 필요)","N12°42′.8 (보간 필요)"],["보간 횟수","1번 (적위)","3번 (삼중보간)"]]},"caption":"교재 163쪽 값으로 본 두 방법의 차이"}],"confusions":"추측위치법에서 치우침을 바로 알 수 있는 것은 기점이 추측위치 자체이기 때문이다. 고도차와 방위가 곧 추측위치에서 실제 선위 쪽으로 얼마나 어긋났는지를 보여 준다.[3]","key":["가정위치법: 계산 간단, 작도 번거로움, 고도차가 큼","추측위치법: 삼중보간(L, Dec., t), 작도 정확, 치우침 파악","△d 개정법 = 가정위치법의 하나"],"footnotes":["교재 161쪽.","교재 163쪽 Sun Sighting 예제.","교재 밖 보충 설명. 교재 162쪽은 △d 개정법이 ‘△d 개정만 하면 되므로 계산이 간단’하다고 쓴다."],"flags":[]},{"title":"△d 개정법","easy":["표에는 딱 떨어지는 값만 있다. 위도와 LHA는 [[가정위치]]를 잘 골라 딱 떨어지게 만들 수 있지만, 천체의 적위는 그 순간 정해져 있어서 12°42′.8처럼 어중간하다.","그래서 적위 12°와 13°의 표값을 보고 그 사이를 비례로 나눈다. 적위가 1°(60′) 늘 때 고도가 53′.2 줄었다면, 42′.8 늘 때는 53′.2 × 42′.8 ÷ 60 ≈ 37′.9 준다. 이 1° 사이의 고도 변화가 **△d**이고, 이렇게 고치는 방법이 **△d 개정법**이다.[3]","적위 하나만 보정하면 되므로 계산이 간단해서 가장 널리 쓰인다.[2] 미국 항해서 Bowditch도 Pub. 229를 적위의 정수 도로 찾고, 남은 분을 같은 비례식으로 고친다.[5]"],"definition":"가정위치(Assumed position)를 사용하는 방법의 하나. 추측위도에 가장 가까운 정수위도(aL)와 LHA가 정수도가 되는 가정경도(aλ)로 가정위치를 정하고, 천측계산표(Sight reduction tables)의 표값에 적위 차에 대한 △d 개정만 해서 고도와 방위각을 구한다.[1]","terms":[{"ko":"△d","en":"Tabulated altitude difference","abbr":"d","plain":"적위 1° 사이 표의 고도 변화. Pub. 229의 d 칸"},{"ko":"적위차","en":"Declination increment","abbr":"Dec. diff.","plain":"관측 적위 − 표를 찾은 정수 적위"},{"ko":"표의 고도","en":"Tabulated altitude","abbr":"ht","plain":"표에서 바로 읽은 고도"},{"ko":"보간표","en":"Interpolation Table","plain":"△d × Dec. diff. ÷ 60′을 찾아 주는 표"},{"ko":"[[계산고도·계산방위각|계산고도]]","en":"Computed altitude","abbr":"Hc","plain":"ht에 △d 개정을 한 최종 고도"},{"ko":"동명·이명","en":"Same name, Contrary name","plain":"위도와 적위의 N·S가 같은지 다른지"}],"why":"천측계산 6단계 중 ④에서 [[천측계산표]] Pub. 229로 Hc와 Z를 구하는 방법이다. 이 Hc가 ⑤에서 Ho와 비교되어 고도차가 된다. △d의 부호를 틀리면 Hc가 크게 틀어지므로, 적위가 커질 때 표의 고도가 커지는지 작아지는지 꼭 확인해야 한다.","body":["△d 개정만 하면 되므로 계산이 간단하여 가장 많이 쓰인다. 고도와 방위각은 다음 순서로 구한다.[2]",{"steps":["관측 시의 GMT에 대한 GHA와 Dec.를 [[천측력]]에서 구한다.","GHA에 가정경도 aλ를 가감(동경 +, 서경 −)해 LHA를 구하고 자오선각 t를 구한다.","가정위도 aL과 관측 시의 적위로 천측계산표(Pub. 229)의 해당 페이지를 찾는다. 위도와 적위가 동명이면 왼쪽, 이명이면 오른쪽 페이지다.","적위와 LHA에 대한 표의 고도(Tabular altitude: ht), △d, 방위각 Z를 찾는다. 표의 적위가 커질 때 고도가 증가하면 △d에 +, 감소하면 −를 붙인다. Z 앞에는 위도와 같은 이름, 뒤에는 자오선각과 같은 이름을 붙인다.","관측 적위와 표의 적위의 차(Dec. diff.)와 △d로 보간표(Interpolation Table)나 비례식에서 고도개정량을 구해 ht에 가감하면 계산고도 Hc다.","Sextant 고도 hs를 개정해 관측고도 Ho를 구하고, Hc와의 차를 고도차 a로 한다. Ho가 Hc보다 크면 T, 작으면 A를 붙인다.","방위각 Z를 방위 Zn으로 고친다.","위치기입도(Plotting sheet)에 가정위치를 찍고 T면 방위 쪽, A면 반대 방위 쪽으로 a만큼 옮긴다. 그 끝점(수정점)에서 방위선에 수직인 선을 그으면 위치선이다."]},{"formula":"고도개정량 = △d × Dec. diff. ÷ 60′"},"△d는 적위 1°(60′) 사이에서 표의 고도가 변한 양, Dec. diff.는 관측 적위가 표의 적위보다 더 나간 분(′)이다. 곧 ‘60′에 △d만큼 변하면 Dec. diff.만큼에는 얼마나 변하나’를 비례로 구하는 식이다.",{"table":{"head":["순서","계산","값"],"rows":[["① 표의 고도 (Dec 12°)","Pub. 229, t 27°, aL 35°S, 이명","ht 36°29′.3"],["② 표의 고도 (Dec 13°)","같은 줄 다음 적위","35°36′.1"],["③ △d","② − ① (줄었으므로 −)","−53′.2"],["④ Dec. diff.","12°42′.8 − 12°00′","42′.8"],["⑤ 고도개정량","−53′.2 × 42′.8 ÷ 60′","(−)37′.9"],["⑥ Hc","① + ⑤","35°51′.4"],["⑦ 방위각 보간","0°.5 × 42′.8 ÷ 60′ (교재 값)","(+)0°.3"]]},"caption":"교재 163–164쪽 〈주5〉, 〈주6〉 — Sun Sighting의 △d 개정[3]"},"Dec. diff.는 관측 시의 적위와 표를 찾을 때 쓴 적위의 차다. 예제에서는 관측 적위 12°42′.8N과 표의 적위 12°00′N의 차 42′.8이다.[3][4] 같은 계산 전체는 [[Sun Sighting]]에 있다."],"confusions":"④의 ‘관측시의 적위에 가장 가까운 적위’를 반올림으로 읽으면 12°42′.8은 13°가 된다. 그러나 교재 예제는 12°로 표를 찾고 42′.8을 Dec. diff.로 보간했다. 표의 적위는 관측 적위의 정수 도(°) 부분으로 잡는다고 이해하자.[4] Bowditch도 같은 방식(적위의 정수 도 값으로 표를 찾음)을 쓴다.[5]","key":["aL 정수위도, aλ로 LHA 정수도 → 적위만 보간","Pub. 229: 동명은 왼쪽, 이명은 오른쪽 페이지","Hc = ht ± △d × Dec. diff. ÷ 60′","Z: 앞은 위도 이름, 뒤는 자오선각 이름"],"footnotes":["교재 161쪽.","교재 162쪽.","교재 163–164쪽 〈주5〉, 〈주6〉.","교재 162쪽 ④, 163쪽 〈주2〉. ④는 ‘관측시의 적위에 가장 가까운 적위’라고 썼지만, 〈주2〉와 예제는 12°42′.8N에 대해 12°00′N을 썼다.","교재 밖 보충 설명. Bowditch도 Pub. 229를 LHA, 가정위도, 그리고 ‘참적위의 정수 도 값(whole degree value of the true declination)’으로 찾는다. 남은 분과 소수(예: 13°15′.6이면 15′.6)를 적위 증분(Declination increment)이라 하고, d × 적위 증분 ÷ 60′으로 개정한다. d의 부호는 적위가 커질 때 표의 고도가 커지면 +, 작아지면 −다. 참고: [The American Practical Navigator, Chapter 20 Sight Reduction — Wikisource](https://en.wikisource.org/wiki/The_American_Practical_Navigator/Chapter_20)."],"flags":[{"kind":"해석","text":"④의 ‘관측 적위에 가장 가까운 적위’와 달리 예제는 12°42′.8N에 12°00′N을 썼다. 위키는 예제대로 ‘관측 적위의 정수 도 부분’으로 표를 찾는다고 설명했다.","fn":4},{"kind":"계산 확인","text":"교재 164쪽: 36°29′.3 − 35°36′.1 = 53′.2, 53′.2 × 42′.8 ÷ 60 = 37′.95 → 37′.9 재계산 일치. 방위각 보간은 Sun Sighting 문서의 검토 표시 참고."}]},{"title":"고도차 부호 T·A","easy":["가로등에 가까이 갈수록 가로등은 더 높이 올려다보인다. 천체도 같아서, [[천체의 지위|지위]](GP)에 가까운 곳일수록 천체가 높게 보인다.","그러니 실제로 잰 고도 Ho가 계산고도 Hc보다 높으면, 배는 [[가정위치]]보다 천체 쪽에 더 가까이 있다. 이때 고도차에 **T**(Toward, 천체 쪽)를 붙인다. 반대로 Ho가 낮으면 **A**(Away, 천체 반대쪽)를 붙인다.","외우는 말은 HoMoTo, ‘Ho가 크면(More) Toward’다.[3] 예를 들어 Ho 36°06′.7, Hc 35°51′.4이면 Ho가 15′.3 크므로 15′.3 T다. 반대로 외우는 ‘Computed Greater Away(계산고도가 크면 Away)’도 같은 뜻이다.[5]"],"definition":"고도차(Altitude intercept, a)에 붙이는 부호. 관측고도(Observed altitude, Ho)가 계산고도(Computed altitude, Hc)보다 크면 T(Toward), 그렇지 않으면 A(Away)를 붙인다.[1]","terms":[{"ko":"Toward","en":"Toward","abbr":"T","plain":"천체(지위) 쪽으로 옮기라는 부호"},{"ko":"Away","en":"Away","abbr":"A","plain":"천체 반대쪽으로 옮기라는 부호"},{"ko":"[[고도차법|고도차]]","en":"Altitude intercept","abbr":"a","plain":"Ho와 Hc의 차. 1′ = 1해리"},{"ko":"HoMoTo","en":"Ho Mo To (Ho More Toward)","plain":"Ho가 크면 Toward라는 암기법"},{"ko":"방위","en":"True azimuth","abbr":"Zn","plain":"T일 때 옮기는 방향. A면 반대"}],"why":"고도차의 크기만 맞고 부호를 틀리면 위치선이 가정위치 반대쪽에 그려져 2a만큼 틀린다. 교재 8장 흐름에서 ‘고도차’ 단계의 마지막 확인이 이 부호다. 작도할 때 T는 방위 Zn 쪽, A는 Zn ± 180° 쪽으로 옮긴다.","body":["가정위치는 관측자의 실제 위치보다 지위에서 먼 곳에 있을 수도, 가까운 곳에 있을 수도 있다. 그래서 고도차에 부호를 붙여 명확히 구별한다.[2]",{"list":["Ho가 Hc보다 크다 → 관측정거가 계산정거보다 작다 → 실제 위치가 AP보다 지위에 가깝다 → T(Toward): AP에서 방위(Zn) 쪽으로 a만큼 옮긴다.","Ho가 Hc보다 작다 → 실제 위치가 AP보다 지위에서 멀다 → A(Away): AP에서 방위의 반대쪽으로 a만큼 옮긴다."]},"교재는 이를 HoMoTo(호모토)로 외우게 한다. ‘Ho가 크면(More) Toward’라는 뜻이다.[1][3] Sun Sighting과 Star Sighting 예제의 결과는 아래와 같다.",{"table":{"head":["예제","Ho","Hc","a"],"rows":[["Sun","36°06′.7","35°51′.4","15′.3 T"],["Regulus","47°54′.0","47°48′.0","6′.0 T"],["Canopus","29°58′.5","30°07′.0","8′.5 A"],["Capella","40°29′.1","40°39′.0","9′.9 A"]]},"caption":"교재 163·166–167쪽 예제의 고도차"},{"table":{"head":["순서","계산","값"],"rows":[["① Ho와 Hc 비교","Canopus: Ho 29°58′.5, Hc 30°07′.0","Ho가 작음"],["② 크기","30°07′.0 − 29°58′.5","8′.5"],["③ 부호","Ho < Hc → Away","8′.5 A"],["④ 옮기는 방향","Zn 190° − 180°","010° 쪽으로 8.5해리"]]},"caption":"교재 166–167쪽 Canopus로 본 Away 작도 방향"}],"confusions":"Toward는 가정위치에서 천체(지위) 쪽이라는 뜻이지, 배의 진행방향이나 북쪽이 아니다. A일 때는 Zn에 180°를 더하거나 뺀 방향으로 옮긴다.[4]","key":["HoMoTo: Ho가 Hc보다 크면 T(Toward), 아니면 A(Away)","T → 방위 쪽, A → 반대 방위 쪽으로 a해리","Ho가 크다 = 지위에 더 가깝다"],"footnotes":["교재 162쪽 ⑥, 164쪽 〈주7〉.","교재 160쪽, 그림 8.7(159쪽).","교재 밖 보충 설명. HoMoTo는 ‘Ho More Toward’의 머리글자를 딴 영어권 암기법이다. 미국 항해서 Bowditch도 ‘Ho Mo To for Ho More Toward’로 적는다. 참고: [The American Practical Navigator, Chapter 20 Sight Reduction — Wikisource](https://en.wikisource.org/wiki/The_American_Practical_Navigator/Chapter_20).","교재 162쪽 ⑧.","교재 밖 보충 설명. 영어권에는 반대로 ‘Computed Greater Away(계산고도가 크면 Away)’라는 암기법도 있다. 두 말은 같은 규칙이다. 참고: [Intercept method — Wikipedia](https://en.wikipedia.org/wiki/Intercept_method)."],"flags":[]},{"title":"위치기입도 작도","easy":["**위치기입도**(Plotting sheet)는 위도·경도 눈금만 있는 빈 해도 같은 종이다. 넓은 해도 대신 이 위에서 위치선을 크게 그린다.","그리는 법은 간단하다. 출발점인 [[가정위치]]에 점을 찍고, 천체 방향(Zn)으로 화살표를 긋는다. T면 화살표 쪽으로, A면 반대쪽으로 고도차만큼 간 뒤, 그 끝에서 화살표에 직각인 선을 긋는다. 그 선이 위치선이다.[5]","예를 들어 [[Sun Sighting]]은 35°S, 132°20′.4E에서 033°.2 방향으로 15′.3, 곧 15.3해리 가서 직각선을 긋는다. 위도 1′이 1해리이므로 거리는 옆의 위도 눈금으로 잰다.[4]"],"definition":"위치기입도(Plotting sheet)에 가정위치(Assumed position, AP)를 기입하고, 고도차의 부호에 따라 방위 쪽이나 반대 방위 쪽으로 고도차만큼 옮긴 점(수정점)에서 방위선(Azimuth line)에 수직인 선을 그어 위치선(Line of position)을 얻는 작도.[1]","terms":[{"ko":"위치기입도","en":"Plotting sheet","plain":"위도·경도 눈금만 있는 작도용 빈 해도"},{"ko":"방위선","en":"Azimuth line","plain":"AP에서 Zn 방향으로 그은 선"},{"ko":"위치선","en":"Line of position","abbr":"LOP","plain":"수정점에서 방위선에 수직으로 그은 선"},{"ko":"해리","en":"Nautical mile","abbr":"NM","plain":"위도 1′의 길이. 고도차 1′ = 1해리"}],"why":"천측계산의 마지막 ⑥단계가 이 작도다. 계산으로 얻은 기점·고도차·방위를 실제 선으로 바꿔야 선위를 읽을 수 있다. 작도한 위치선에는 시각과 천체 이름을 적어 두어야 나중에 전위할 때 헷갈리지 않는다.","body":[{"steps":["가정위치(aL, aλ)를 위치기입도에 찍는다.","가정위치를 지나는 방위선(Zn 방향)을 긋는다.","[[고도차 부호 T·A|고도차가 T]]이면 방위 쪽으로, A이면 반대 방위 쪽으로 a해리만큼 옮긴다.","옮긴 끝점(수정점)에서 방위선에 수직인 선을 긋는다. 이것이 위치선이며, 관측 시각과 천체 이름을 적어 둔다."]},{"table":{"head":["순서","계산","값"],"rows":[["① AP 기입","aL, aλ","35°00′.0S, 132°20′.4E"],["② 방위선","Zn","033°.2"],["③ 옮기기","a 15′.3 T → 방위 쪽","15.3해리"],["④ 위치선","끝점에서 방위선에 수직","033°.2 − 90° = 303°.2 / 123°.2 방향의 직선"]]},"caption":"그림 8.3(작도 예) — Sun Sighting 작도 순서[2]"},"그림 8.3(작도 예)은 Sun Sighting을 작도한 것이다. aL 35°S, aλ 132°20′.4E에서 Zn 033°.2 방향으로 15′.3 Toward 옮겨 1020 태양 위치선을 그었고, 1020 DR도 함께 표시했다.[2]","그림 8.4(작도 예)는 [[Star Sighting]]의 세 위치선을 한 장에 그린 것이다. 먼저 관측한 위치선을 1820까지 전위해 교점에서 선위를 얻었다([[위치선의 교점과 전위]]).[3]","위치기입도에서 고도차 1′은 1해리이며, 거리는 위도 눈금으로 잰다.[4]"],"confusions":"교재 ⑧은 가정위치에서 고도차만큼 옮기는 것도 ‘전위’라고 썼다. 위치선 자체를 배의 항주 거리만큼 평행이동하는 위치선의 전위와는 다른 동작이다.[1]","key":["AP 기입 → Zn 방위선 → T는 방위 쪽, A는 반대쪽으로 a해리 → 수직선","수정점 = 옮긴 끝점, 위치선은 방위선에 수직","1′ = 1해리, 거리는 위도 눈금으로"],"footnotes":["교재 162쪽 ⑧.","교재 164쪽, 그림 8.3(작도 예). 교재는 이 그림 번호를 155쪽 ‘관측자의 위치권’과 같은 8.3으로 붙였다.","교재 167–168쪽, 그림 8.4(작도 예). 이 번호도 156쪽 ‘구면삼각형의 기하학적 의미’와 겹친다.","교재 밖 보충 설명. 점장도 계열 해도에서는 경도 눈금의 간격이 위도에 따라 달라지므로 거리를 위도 눈금으로 잰다. 1해리는 원래 위도 1′에 해당하는 자오선 호의 길이로 정의되었다. 참고: [Nautical mile — Wikipedia](https://en.wikipedia.org/wiki/Nautical_mile).","교재 밖 보충 설명. 영어 자료도 위치선을 ‘천체 방위선에 수직인 직선’으로 긋고, 두 개 이상이 만나는 점을 Fix라 한다. 참고: [Intercept method — Wikipedia](https://en.wikipedia.org/wiki/Intercept_method)."],"flags":[{"kind":"교재 정정","text":"교재의 그림 번호 중복(8.3: 155·164쪽, 8.4: 156·167쪽)을 위키에서 ‘그림 8.3(작도 예)’, ‘그림 8.4(작도 예)’로 구분했다.","fn":2},{"kind":"교재 밖","text":"‘고도차 1′ = 1해리, 거리는 위도 눈금으로 잰다’는 작도 요령은 교재에 없는 보충이다.","fn":4}]},{"title":"Sun Sighting","easy":["남반구 바다, 오전 10시 20분쯤이다. 항해사가 육분의로 해의 아랫가장자리(하변, Lower limb)를 재니 35°57′.3이었다. 이 한 번의 관측에서 위치선 하나를 얻기까지의 전 과정을 따라가는 예제다.","먼저 시계를 GMT로 고쳐 해의 GHA와 적위를 찾는다. 다음으로 계산하기 좋은 [[가정위치]]를 잡고, Pub. 229에서 그 자리에서 보일 고도 Hc를 구한다. 잰 고도도 고쳐 관측고도 Ho로 만든다.","Ho 36°06′.7이 Hc 35°51′.4보다 15′.3 크다. 그래서 배는 가정위치에서 해 쪽(033°.2)으로 15.3해리 옮긴 선 위에 있다. 남반구의 오전이라 해가 북동쪽에 보이는 상황과도 맞는다.[3]"],"definition":"태양의 하변고도(Lower limb altitude)를 한 번 관측해 천측력과 [[천측계산표|Pub. 229]], [[△d 개정법]]으로 위치선의 요소(aL, aλ, a, Zn)를 구하는 교재 예제(Sun sight).[1]","terms":[{"ko":"Sun Sighting","en":"Sun sight","plain":"태양 한 번 관측으로 위치선 하나를 얻는 예제"},{"ko":"하변","en":"Lower limb","plain":"태양 원반의 아랫가장자리. 기호 ⊙"},{"ko":"Chronometer 오차","en":"Chronometer error","abbr":"CE","plain":"GMT보다 늦으면 (+)"},{"ko":"[[육분의 오차·기차개정|기차개정]]","en":"Index correction","abbr":"IC","plain":"육분의 기차(Index error)를 고치는 값"},{"ko":"안고(눈높이)","en":"Height of eye","abbr":"HE","plain":"수면에서 관측자 눈까지 높이"},{"ko":"고도차","en":"Altitude intercept","abbr":"a","plain":"Ho − Hc"}],"why":"실제 배에서 오전·오후에 태양으로 위치선을 구하는 표준 절차다. 천측계산 6단계가 한 장의 풀이표에 모두 들어 있어, 각 칸이 어느 단계인지 따라가며 익히기 좋다. 한 번의 태양 관측으로는 선위가 아니라 위치선 하나만 얻는다는 점을 기억해야 한다.","body":["2019년 4월 24일 ZT 10-20경, DR 34°45′.0S, 132°12′.0E에서 Chronometer 시각 01-18-43에 태양의 하변고도 35°57′.3을 측정했다. Chronometer는 GMT보다 2m12s 늦고, IC (+)1′.5, HE 15 m다.[1]","아래 세 표는 천측계산 6단계를 순서대로 보여 준다. 첫 표가 ②·③(시각·GHA·적위·자오선각), 둘째 표가 ④(Pub. 229와 △d 개정), 셋째 표가 ①(관측고도)이고, 마지막 문단이 ⑤·⑥이다.",{"table":{"head":["항목","값","비고"],"rows":[["C","01-18-43",""],["CE","(+)2-12","Chronometer가 GMT보다 늦음"],["GMT","01-20-55","4월 24일"],["GHA 01h","195°25′.8","[[태양의 GHA·Dec|천측력 주표]]"],["증분 20m55s","5°13′.8",""],["GHA","200°39′.6",""],["aλ","132°20′.4E","LHA가 정수도가 되게 고름"],["LHA","333°00′.0","GHA + aλ(동경)"],["t","27°00′.0E","360° − LHA"],["Dec 01h","N12°42′.5","d (+)0′.8"],["d 개정","(+)0′.3",""],["Dec","N12°42′.8",""],["aL","35°00′.0S","DR 위도에 가장 가까운 정수위도"]]},"caption":"교재 163쪽 풀이 (1) — 시각, GHA, 적위"},{"table":{"head":["항목","고도","방위각"],"rows":[["표값 (t 27°, Dec 12°, aL 35°S, 이명 → 오른쪽 페이지)","ht 36°29′.3","Z 146°.5"],["Dec 13°일 때 변화","35°36′.1로 53′.2 감소 → △d −53′.2","0°.5 증가"],["Dec. diff. 42′.8에 대한 개정","(−)37′.9 = −53′.2 × 42′.8 ÷ 60","(+)0°.3 = 0°.5 × 42′.8 ÷ 60[2]"],["결과","Hc 35°51′.4","Z S146°.8E → Zn 033°.2"]]},"caption":"교재 163–164쪽 풀이 (2) — Pub. 229와 △d 개정"},{"table":{"head":["개정 요소","+","−"],"rows":[["[[육분의 오차·기차개정|IC]]","1′.5",""],["[[안고차|D]] (HE 15 m)","","6′.8"],["⊙ 하변 개정 ([[태양의 고도개정]])","14′.7",""],["합계","16′.2","6′.8"],["개정량","(+)9′.4",""],["hs → Ho","35°57′.3 → 36°06′.7",""]]},"caption":"교재 163쪽 풀이 (3) — 관측고도"},"Ho 36°06′.7이 Hc 35°51′.4보다 크므로 고도차는 15′.3 T다([[고도차 부호 T·A]]). 위치선의 요소는 aL 35°00′.0S, aλ 132°20′.4E, a 15′.3 T, Zn 033°.2이며, 이를 작도한 것이 그림 8.3(작도 예)다([[위치기입도 작도]]).[3] 식 (8.4)로 Hc를 직접 계산해도 35°51′.3으로 거의 같다.[4]"],"confusions":"위도가 S, 적위가 N인 이명이라 Pub. 229의 오른쪽 페이지를 쓴다. Z는 남쪽(S)에서 동쪽(E)으로 잰 146°.8이므로 Zn = 180° − 146°.8 = 033°.2다. 남반구에서 오전에 태양이 북동쪽에 보이는 상황과 맞는다.","key":["GMT 01-20-55 → GHA 200°39′.6 + aλ 132°20′.4E → LHA 333°, t 27°E","ht 36°29′.3 − 37′.9 = Hc 35°51′.4","hs 35°57′.3 + 9′.4 = Ho 36°06′.7 → a 15′.3 T, Zn 033°.2"],"footnotes":["교재 162–163쪽.","교재 164쪽 〈주6〉. 0°.5 × 42′.8 ÷ 60′ = 0°.36이므로 반올림하면 0°.4다. 그러면 Z는 S146°.9E, Zn은 033°.1이 된다. 작도에는 영향이 없을 만큼 작은 차이다.","교재 163–164쪽, 그림 8.3(작도 예).","교재 밖 보충 계산. 식 (8.4)에 L = 35°S, d = 12°42′.8N(이명이므로 음수), t = 27°를 넣었다. 결과는 35°51′.35다."],"flags":[{"kind":"계산 확인","text":"교재 163쪽 시각·GHA·적위: 01-18-43 + 2-12 = 01-20-55, 195°25′.8 + 5°13′.8 = 200°39′.6, + 132°20′.4 = 333°00′.0, t = 27°00′.0E, N12°42′.5 + 0′.3 = N12°42′.8 재계산 일치(증분 20m55s × 15′/m = 5°13′.75)."},{"kind":"계산 확인","text":"관측고도: +1′.5 + 14′.7 − 6′.8 = +9′.4, 35°57′.3 + 9′.4 = 36°06′.7 일치(D 6′.8은 식 (2.13) D = 0.97√h로 15 m = 49.2 ft → 6′.80과 맞음). Hc: 53′.2 × 42′.8 ÷ 60 = 37′.95 → 37′.9, 36°29′.3 − 37′.9 = 35°51′.4, a = 36°06′.7 − 35°51′.4 = 15′.3 T 일치."},{"kind":"계산 확인","text":"방위각 보간: 0°.5 × 42′.8 ÷ 60′ = 0°.357로 0°.4가 맞고, 교재의 0°.3과 0°.1 차이 난다. 그 경우 Z S146°.9E, Zn 033°.1이다. 본문 표는 교재 값을 그대로 두었다.","fn":2},{"kind":"계산 확인","text":"식 (8.4)로 직접 계산: Hc 35°51′.35, Z S146°.88E(Zn 033°.1). 표 방법의 Hc 35°51′.4와 0′.05 차이로 사실상 일치하며, 고도차는 15′.35가 된다. 또 Dec 12°·13°에서 식으로 구한 고도 36°29′.3·35°36′.1과 방위각 146°.5·147°.0도 교재의 표값과 같다.","fn":4}]},{"title":"Star Sighting","easy":["해가 지고 얼마 지나지 않은 저녁 박명(Twilight) 때는 수평선이 아직 보이면서 밝은 별도 하나둘 보인다. 육분의로 별의 고도를 재려면 별과 수평선이 함께 보여야 하므로, 별 관측은 이 짧은 시간에 한다.[6]","이 예제에서는 서로 다른 방향의 별 세 개, Regulus(동쪽), Canopus(남쪽), Capella(북서쪽)를 잰다. 방향이 고르게 다르면 세 위치선이 넓은 각으로 만나 교점이 또렷해진다.[1]","[[천측계산표|Pub. 249]] 제1권(Selected Stars)은 LHA♈와 가정위도만 넣으면 별의 Hc와 방위를 바로 준다. 그래서 관측 전에 잴 별을 고르는 안내서로도 쓴다. 마지막으로 먼저 잰 두 별의 위치선을 배가 간 만큼 옮겨 1820의 선위를 얻는다.[5]"],"definition":"저녁 박명시(Twilight)에 항성 3개를 관측하고 Pub. 249 Vol. 1(Selected Stars)로 위치선을 구한 뒤, 먼저 관측한 위치선을 전위해 1820의 선위(Fix)를 얻는 교재 예제(Star sight).[1]","terms":[{"ko":"Star Sighting","en":"Star sight","plain":"박명시에 별 여러 개로 선위를 얻는 예제"},{"ko":"박명","en":"Twilight","plain":"해가 진 뒤(뜨기 전) 하늘이 아직 밝은 때"},{"ko":"상용박명","en":"Civil twilight","plain":"교재가 관측 시각 계산에 쓴 박명"},{"ko":"선택 항성","en":"Selected Stars","abbr":"Vol. 1","plain":"Pub. 249 제1권. LHA♈와 aL로 별을 고른다"},{"ko":"[[춘분점의 GHA|춘분점의 지방시각]]","en":"Local Hour Angle of Aries","abbr":"LHA♈","plain":"GHA♈ ± 경도. Pub. 249 제1권을 찾는 값"},{"ko":"선위","en":"Fix","plain":"위치선들이 만나는 점"}],"why":"아침·저녁 박명의 별 관측은 서로 다른 방향의 별 3개를 몇 분 사이에 재서 위치선 3개를 한꺼번에 얻는다. 그래서 하루 중 선위를 정하기 좋은 기회다. 이 예제는 박명시 계산 → 별 고르기 → 관측 → 천측계산 → 전위 → 선위까지 실제 순서를 그대로 보여 준다.","body":["2019년 4월 3일 ZT 16h00m에 DR 05°38′N, 080°02′E, 침로 070°, 속력 20 kts로 항해 중인 배가 저녁 박명시에 맞춰 관측했다. ZD는 −5, IC (+)0′.3, HE 15 m다.[1]",{"table":{"head":["단계","항목","값"],"rows":[["① 박명시","Civil twilight (0°N)","18h28m"],["","Tab. I (위도 개정)","(+)03m"],["","LMT","18h31m"],["","λ in T (075°E − 080°02′E)","(−)20m"],["","ZT","18h11m"],["② 박명시 DR","ZT 18h11m","05°53′.0N, 080°43′.0E"],["③ LHA♈","GMT (= ZT − 5h)","13h11m (4월 3일)"],["","GHA♈ 13h + 증분 11m00s","26°34′.2 + 02°45′.5 = 29°19′.7"],["","aλ","80°40′.3E"],["","LHA♈ / aL","110°00′.0 / 06°00′.0N"]]},"caption":"교재 165쪽 풀이 ①–③"},{"table":{"head":["항목","Regulus","Canopus","Capella"],"rows":[["④ Pub. 249의 Hc","47°48′","30°07′","42°06′"],["④ Pub. 249의 Zn","079°","190°","332°"],["⑤ 측정고도 hs","48°01′.4","30°06′.7","40°36′.7"],["⑤ 측정 시각 ZT","18h06m15s","18h08m00s","18h20m00s"]]},"caption":"교재 165쪽 풀이 ④–⑤ — LHA♈ 110°, aL 06°N에서 방위교각이 좋은 3개 항성(표에 * 표시)을 고르고 관측"},{"table":{"head":["항목","Regulus","Canopus","Capella"],"rows":[["GMT","13h06m15s","13h08m00s","13h20m00s"],["GHA♈ 13h","26°34′.2","26°34′.2","26°34′.2"],["증분","1°34′.0","2°00′.3","5°00′.8"],["GHA♈","28°08′.2","28°34′.5","31°35′.0"],["aλ","81°51′.8E","81°25′.5E","81°25′.0E"],["LHA♈ / aL","110° / 06°N","110° / 06°N","113° / 06°N"],["Hc / Zn","47°48′.0 / 079°","30°07′.0 / 190°","40°39′.0 / 330°"],["IC / D / ☆−P","+0′.3 / −6′.8 / −0′.9","+0′.3 / −6′.8 / −1′.7","+0′.3 / −6′.8 / −1′.1"],["개정량","(−)7′.4","(−)8′.2","(−)7′.6"],["hs → Ho","48°01′.4 → 47°54′.0","30°06′.7 → 29°58′.5","40°36′.7 → 40°29′.1"],["a","6′.0 Toward","8′.5 Away","9′.9 Away"]]},"caption":"교재 166–167쪽 풀이 ⑥ — 관측 시각으로 다시 계산[2]"},"⑥에서는 관측 시각마다 [[춘분점의 GHA|GHA♈]]를 다시 구하고, LHA♈가 정수도가 되도록 aλ를 다시 잡아 Pub. 249에서 Hc와 Zn을 찾는다.[3] Capella는 9분 늦게 관측해 GHA♈가 커졌고, 교재는 LHA♈ 113°로 표를 찾았으므로 Hc와 Zn이 ④의 값과 다르다. Ho는 [[항성·행성의 고도개정|항성의 고도개정]]으로 구한다.[4]","그림 8.4(작도 예)는 Regulus와 Canopus의 위치선을 침로 방향으로 1820까지 전위해, Capella 위치선과의 교점에서 1820 선위(1820 FIX)를 얻은 것이다([[위치선의 교점과 전위]]).[5] 마지막 관측 시각으로 모두 옮겨 선위를 적는 방식은 Bowditch와 같다.[7]"],"confusions":"④의 Hc·Zn은 박명시 DR 근처에서 미리 찾은 ‘관측 안내용’ 값이다. 실제 위치선은 ⑥에서 관측 시각으로 다시 계산한 값으로 구한다. 박명시에 관측하는 것은 별과 수평선이 함께 보여야 육분의로 고도를 잴 수 있기 때문이다.[6]","key":["박명시 ZT 18h11m = 18h28m + 03m − 20m","Pub. 249 Vol. 1: LHA♈ 110°, aL 06°N → Regulus·Canopus·Capella","Regulus 6′.0 T, Canopus 8′.5 A, Capella 9′.9 A","앞선 두 위치선을 1820까지 전위 → 1820 FIX"],"footnotes":["교재 165쪽.","교재 166–167쪽.","교재 166쪽 ⑥. 교재 163쪽 〈주1〉은 aλ를 추측경도와 30′ 미만으로 잡으라고 했다. 그러나 이 예제의 aλ는 박명시 DR 080°43′.0E와 Regulus 1°08′.8, Canopus 42′.5, Capella 42′.0 떨어져 있다. 규칙대로라면 LHA♈ 109°(aλ 80°51′.8E), 109°(80°25′.5E), 112°(80°25′.0E)로 표를 찾는다. 교재는 그 이유를 설명하지 않는다.","교재 68쪽은 항성·행성 고도개정표에서 구하는 개정치를 ‘기차: ☆−P’로 적는다. 곧 STARS AND PLANETS표의 평균기차다. 고도가 가장 낮은 Canopus(약 30°)의 값이 1′.7로 가장 크다.","교재 167–168쪽, 그림 8.4(작도 예). 그림에서 Regulus 위치선에 ‘1906’이라 적혀 있으나 관측 시각이 18h06m15s이므로 1806이 맞다. 또 그림의 ‘1810DR’은 6°N·81°E 부근에 찍혀 있어 본문의 박명시 DR(18h11m, 05°53′.0N, 080°43′.0E)과 다르다. 세 위치선(앞의 두 개는 1820으로 전위)의 교점을 계산하면 약 06°04′~06°09′N, 081°55′~082°02′E로 그림의 1820FIX와 대체로 맞는다. 그러나 본문의 1820 DR(05°54′.0N, 080°46′.1E)에서는 동쪽으로 약 70해리 떨어져 있다.","교재 밖 보충 설명. 상용박명(Civil twilight)은 태양 중심이 지평선 아래 0°~6°, 항해박명(Nautical twilight)은 6°~12°에 있는 때다. 항해박명이 끝난 뒤에는 수평선이 잘 보이지 않아 수평선을 기준으로 한 관측을 할 수 없다. 참고: [Twilight — Wikipedia](https://en.wikipedia.org/wiki/Twilight).","교재 밖 보충 설명. Bowditch도 저녁 박명에 여러 별을 관측해 선위를 구할 때, 앞서 얻은 위치선을 항적을 따라 마지막 관측 시각까지 전진시키고 그 시각으로 선위를 적는다. 참고: [The American Practical Navigator, Chapter 20 Sight Reduction — Wikisource](https://en.wikisource.org/wiki/The_American_Practical_Navigator/Chapter_20)."],"flags":[{"kind":"계산 확인","text":"교재 165쪽 박명시·DR: 18h28m + 03m = 18h31m, (80°02′ − 75°) × 4m = 20m.1 → 20m, ZT 18h11m, GMT 13h11m 일치. 16h00m부터 2h11m × 20 kts = 43.7해리를 070°로 가면 05°52′.9N, 080°43′.2E로 교재 DR과 0′.2 이내로 맞는다."},{"kind":"계산 확인","text":"GHA♈·LHA♈: 26°34′.2 + 2°45′.5 = 29°19′.7, + 80°40′.3 = 110°00′.0. Regulus 28°08′.2 + 81°51′.8, Canopus 28°34′.5 + 81°25′.5 = 110°, Capella 31°35′.0 + 81°25′.0 = 113° 일치(춘분점 증분 1°34′.0, 2°00′.3, 5°00′.8도 맞음). Ho 47°54′.0, 29°58′.5, 40°29′.1과 a 6′.0 T, 8′.5 A, 9′.9 A 모두 재계산 일치."},{"kind":"계산 확인","text":"교재 〈주1〉의 30′ 규칙대로 aλ를 잡으면 LHA♈ 109°·109°·112°가 된다. 교재의 aλ는 본문 DR과 42′~1°09′ 떨어져 규칙과 맞지 않는다. 표값과 고도차는 교재의 aλ를 기준으로 맞게 계산되어 있으므로 풀이는 교재대로 따라가면 된다.","fn":3},{"kind":"교재 정정","text":"그림 8.4(작도 예)의 Regulus 위치선 시각 ‘1906’을 1806으로 바로잡았다. Canopus의 고도차도 그림에는 ‘8′.6 Away’로 적혀 있으나 본문 계산은 8′.5 Away다. 그림의 1810DR 위치도 본문 DR과 다르므로 본문 값을 기준으로 삼자.","fn":5},{"kind":"계산 확인","text":"Pub. 249 표값을 2019년 4월의 항성 위치(SHA·적위)로 식 (8.4)를 풀어 확인했다. aL 6°N, LHA♈ 110°에서 Regulus 47°47′.8·079°, Canopus 30°07′.0·190°, Capella 42°06′.1·332°, LHA♈ 113°에서 Capella 40°38′.4·330°로 교재 값과 1′ 이내로 맞는다."},{"kind":"계산 확인","text":"세 위치선의 교점을 다시 구하면 약 06°06′N, 082°00′E로, 본문의 1820 DR보다 동쪽으로 약 70해리 떨어진다. 예제의 관측고도가 본문 DR과 맞지 않기 때문이므로, 직접 작도해서 선위가 DR에서 멀게 나와도 계산 실수가 아니다.","fn":5},{"kind":"교재 밖","text":"상용박명(태양 중심이 지평선 아래 0°~6°)과 항해박명(6°~12°)의 범위, 항해박명이 끝나면 수평선 관측이 어렵다는 내용은 교재에 없는 보충이다.","fn":6}]},{"title":"위치선의 교점과 전위","easy":["[[위치선]] 하나는 ‘배가 이 선 위 어딘가에 있다’는 것만 알려 준다. 방향이 다른 위치선 두 개가 만나면 배는 그 교점에 있다. 이 점이 **선위**(Fix)다.","문제는 배가 움직인다는 것이다. 18시 08분에 그은 선은 18시 20분이 되면 이미 배 뒤쪽에 남아 있다. 그래서 먼저 그은 위치선을 배가 간 방향으로 간 거리만큼 그대로 평행이동한다. 이것이 **전위**(Advancing a line of position)다.[6]","예를 들어 20노트로 12분 가면 4해리다. Canopus 위치선을 침로 070° 쪽으로 4해리 밀어 1820의 선으로 만든 뒤 Capella 위치선과 겹친다. 몇 시간 간격으로 태양을 두 번 재어 같은 방법으로 얻은 선위는 영어로 Running fix라 한다.[6]"],"definition":"서로 평행하지 않은 위치선(Line of position)이 2개 이상이면 그 교점이 선위(Fix)다. 시각을 달리해 관측한(격시 관측) 위치선은 그사이 배가 움직인 만큼 진행방향으로 옮겨(전위, Advancing) 같은 시각의 위치선으로 만든 뒤 교점을 구한다.[1]","terms":[{"ko":"선위","en":"Fix","plain":"평행하지 않은 위치선 2개 이상의 교점"},{"ko":"전위","en":"Advancing a line of position","plain":"위치선을 침로 방향으로 항주거리만큼 평행이동"},{"ko":"격시 관측 선위","en":"Running fix","plain":"시간차를 두고 얻은 위치선을 전위해 구한 선위"},{"ko":"침로","en":"Course","abbr":"C","plain":"배가 나아가는 방향"},{"ko":"항주거리","en":"Distance run","plain":"속력 × 경과 시간"},{"ko":"위치선","en":"Line of position","abbr":"LOP","plain":"배가 그 위 어딘가에 있다는 선"}],"why":"실제 항해에서 여러 천체를 같은 순간에 잴 수는 없다. 별은 박명의 몇 분 사이에, 태양은 몇 시간 간격으로 재므로 늘 전위가 필요하다. 천측계산이 끝난 위치선들을 하나의 시각으로 모아 선위를 정하는 것이 천측의 마지막 단계다.","body":["위치선 하나는 배가 그 선 위 어딘가에 있다는 것만 알려 준다. 서로 평행하지 않은 위치선을 2개 이상 결정하면 그 교점이 선위가 된다.[2]","항해 중에는 여러 천체를 같은 순간에 잴 수 없다. 그래서 먼저 관측한 위치선을 나중 시각까지 배가 항주한 방향과 거리만큼 평행이동한다. 이것이 위치선의 전위다.[1]","[[Star Sighting]] 예제에서는 먼저 잰 Regulus와 Canopus의 위치선을 침로 070° 방향으로 1820까지 옮겨, Capella 위치선과의 교점에서 1820 선위(1820 FIX)를 얻었다.[1] 마지막 관측 시각으로 모아 선위를 적는 방식은 Bowditch도 같다.[7]",{"table":{"head":["천체","관측 ZT","1820까지","전위 거리(20 kts)"],"rows":[["Regulus","18h06m15s","13m45s","약 4.6해리"],["Canopus","18h08m00s","12m00s","4.0해리"],["Capella","18h20m00s","0","전위 없음"]]},"caption":"Star Sighting의 전위 (거리는 위키 계산[3])"},{"formula":"전위 거리(해리) = 속력(kts) × 경과 시간(h)"},"kts(노트)는 1시간에 1해리를 가는 속력이다. 예: Canopus는 20 × (12 ÷ 60) = 4.0해리다.","그림 8.4(작도 예)에서 점선 화살표가 전위 방향이며, Regulus와 Canopus는 원래 위치선과 전위한 위치선이 나란히 두 줄로 그려져 있다.[4]"],"confusions":"교재 ⑧은 가정위치에서 고도차만큼 옮기는 것도 ‘전위’라고 불렀다. 여기서 말하는 전위는 배의 항주 거리만큼 위치선 전체를 평행이동하는 것으로, 다른 동작이다. 또 교재 〈주〉는 ‘3개의 위치선을 전위’했다고 썼지만 Capella는 1820에 관측했으므로 옮길 필요가 없다.[5]","key":["평행하지 않은 위치선 2개 이상의 교점 = 선위(Fix)","격시 관측: 앞선 위치선을 침로 방향으로 항주거리만큼 평행이동(전위)","Star Sighting: Regulus·Canopus 위치선을 1820까지 전위 → 1820 FIX"],"footnotes":["교재 167–168쪽.","교재 155쪽.","교재 밖 보충 계산. 전위 거리 = 20 kts × 경과 시간.","교재 167쪽, 그림 8.4(작도 예).","교재 162쪽 ⑧, 168쪽 〈주〉.","교재 밖 보충 설명. 먼저 얻은 위치선 위의 한 점에서 침로와 항주거리만큼 DR 항적을 긋고, 그 끝을 지나 원래 위치선과 평행한 선을 그으면 전위한 위치선이 된다. 몇 시간 간격으로 태양을 두 번 재어 이렇게 얻은 선위를 Running fix라 하며, 두 위치선의 교각은 25°~30° 이상이 좋다. 참고: [Running with the sun — Ocean Navigator](https://oceannavigator.com/running-with-the-sun/), [Intercept method — Wikipedia](https://en.wikipedia.org/wiki/Intercept_method).","교재 밖 보충 설명. 여러 별을 관측했을 때 앞선 위치선을 항적을 따라 마지막 관측 시각까지 전진시키고, 선위에는 그 마지막 시각을 적는다. 참고: [The American Practical Navigator, Chapter 20 Sight Reduction — Wikisource](https://en.wikisource.org/wiki/The_American_Practical_Navigator/Chapter_20)."],"flags":[{"kind":"해석","text":"교재 〈주〉의 ‘3개의 위치선을 전위’는 1820에 관측한 Capella를 뺀 두 위치선의 전위로 해석했다. 전위 거리(약 4.6해리, 4.0해리)는 교재에 없고 위키가 계산한 값이다.","fn":5}]}]}</script>
<script>
/* 천문항해 위키 — 3D 장면 공통 엔진 (three.js r128 UMD 전역 THREE 사용)
 *
 * 좌표 약속 (모든 장면 공통)
 *  - 천구 반지름 R = 10. three.js 의 y 축이 위.

      rows.push('일주운동: 1h에 15°, 24h에 360° (동 → 서)');
      return rows;
    }
  });
})();

/* 장면 3 — 적도좌표: 천의 자오선·시권 → 적위 → 적위의 거등권 → 극거 → 적경 → 항성시각 → 적도좌표계 */
(function () {
  const T_ARIES = 25;                         // 그림에서 ♈ 을 놓을 시각 t (cel: +t = 서쪽)
  const DEF = { sha: 315 + 15.2 / 60, dec: -(40 + 14.1 / 60) };   // 교재 34쪽 예제 항성 Acamar
  const D2R = Math.PI / 180;

  // 다시 그릴 때 이전 기하를 버리는 dyn (재생·슬라이더 조작 중 메모리가 쌓이지 않게)
  function dynD(api, name, parent, fn) {
    let prev = [];
    return api.dyn(name, parent, (g, p) => {
      prev.forEach((o) => o.traverse((c) => {
        if (c.geometry && !c.geometry.userData.keep) c.geometry.dispose();
        if (c.material && !c.material.userData.keep) c.material.dispose();
      }));
      fn(g, p);
      prev = g.children.slice();
    });
  }
  // 라벨 도우미: 좁은 무대(휴대폰)에서는 짧은 글자(short)·작은 오프셋(ndx, ndy)을 쓰고 보조 라벨(sec)을 숨긴다
  function labeler(api, s) {
    const recs = [];
    function apply(r) {
      const n = s.narrow, o = r.o;
      const dx = n && o.ndx != null ? o.ndx : (o.dx || 0), dy = n && o.ndy != null ? o.ndy : (o.dy || 0);

      { title: 'GHA = GHA♈ + SHA', text: '그리니치에서 천체까지 서쪽으로 잰 각이 천체의 본초시각(GHA)이다. 두 호를 이어 붙이면 된다. 360°를 넘으면 360°를 뺀다.', add: ['gha'] },

      { title: '자오선각 t와 6시권', text: 'LHA가 180°보다 크면 천체는 관측자 자오선의 동쪽에 있다. 이때 자오선각은 t(E) = 360° − LHA이다. 동점·서점을 지나는 시권이 6시권(t = 90°)이다.', add: ['tarc', 'six'] },
      { title: '북극 위에서 보면: 시각도', text: '천의 북극 위에서 내려다보면 교재 그림 1.31의 시각도(적도평면도)가 된다. 위쪽이 관측자 자오선 M, 시계방향이 서쪽이다.', cam: 'top' }
