    focus: { '본초시각': 5, '지방시각·자오선각': 6, '항성시각': 4, '춘분점의 GHA': 3, '항성의 GHA·Dec': 5, '태양의 GHA·Dec': 5, '6시권': 7, '적도평면도': 8 },
    explore: { cam: 'space' },
    build(api, p) {
      const { THREE, R, COLORS, eqHA } = api;
      const up = new THREE.Vector3(0, 1, 0);
      const C = { obs: COLORS.meridian, gw: COLORS.greenwich, aries: COLORS.aries, star: COLORS.star, lha: 0x7fe3ff, t: 0xff9f5a };

      // 0. 바탕
      const base = api.group('base');
      api.sphere({ opacity: 0.05 }, base);
      api.greatCircle(up, { color: COLORS.equator, opacity: 0.9 }, base);
      api.line(new THREE.Vector3(0, -R * 1.15, 0), new THREE.Vector3(0, R * 1.15, 0), { color: COLORS.axis, opacity: 0.6, dashed: true }, base);
      api.label('Pn', new THREE.Vector3(0, R * 1.2, 0), { cls: 'big', doc: '천의 극·천의 축' }, base);
      api.label('Ps', new THREE.Vector3(0, -R * 1.2, 0), { doc: '천의 극·천의 축' }, base);
      api.label('천의 적도', eqHA(-35, 0, R * 1.04), { color: COLORS.equator, doc: '천의 적도', cls: 'small' }, base);

      // 1. 관측자 자오선
      const obs = api.group('obs');
      api.curve((s) => eqHA(0, -90 + 180 * s), 0, 1, 90, { color: C.obs }, obs);
      api.curve((s) => eqHA(180, -90 + 180 * s), 0, 1, 90, { color: C.obs, dashed: true, opacity: 0.6 }, obs);
      api.label('M 관측자', eqHA(0, 8, R * 1.08), { color: C.obs, doc: '관측자의 천의 자오선·자오선정중' }, obs);
      api.label('m', eqHA(180, 8, R * 1.06), { color: C.obs, cls: 'small' }, obs);

      const hourCircle = (t, color, g, dashed) => api.curve((s) => eqHA(t, -90 + 180 * s), 0, 1, 90, { color, dashed, opacity: dashed ? 0.6 : 1 }, g);
      const eqArc = (t1, dt, r, color, g, dashed) => api.curve((s) => eqHA(t1 + dt * s, 0, r), 0, 1, Math.max(8, Math.ceil(Math.abs(dt) / 2)), { color, tube: dashed ? 0 : 0.07, dashed }, g);
      const mid = (t1, dt, r) => eqHA(t1 + dt / 2, 0, r);
      const fm = (v) => api.fmtDM(api.norm360(v));

      const calc = (p) => {
        const g = api.norm360(G0 + ARIES_RATE * p.ut);
        const gha = api.norm360(g + p.sha);
        const lha = api.norm360(gha + p.lon);
        return { g, gha, lha };
      };

      // 2. 그리니치
      api.dyn('gw', api.cel, (g, p) => {
        hourCircle(p.lon, C.gw, g);
        hourCircle(p.lon + 180, C.gw, g, true);
        api.label('G 그리니치', eqHA(p.lon, 20, R * 1.08), { color: C.gw }, g);
        if (Math.abs(p.lon) > 2) {
          eqArc(0, p.lon, R * 0.8, C.gw, g, true);
          api.label('λ ' + Math.abs(p.lon).toFixed(1) + '°' + (p.lon >= 0 ? 'E' : 'W'), mid(0, p.lon, R * 0.72), { color: C.gw, cls: 'small val' }, g);
        }
      });
      // 3. 춘분점
      api.dyn('aries', api.cel, (g, p) => {
        const c = calc(p), tA = p.lon + c.g;
        hourCircle(tA, C.aries, g);
        api.dot(eqHA(tA, 0), { color: C.aries, size: 0.28 }, g);
        api.label('♈ 춘분점', eqHA(tA, -10, R * 1.08), { color: C.aries, doc: '춘분점·추분점' }, g);
        eqArc(p.lon, c.g, R * 1.05, C.aries, g);
        api.label('GHA♈ ' + fm(c.g), mid(p.lon, c.g, R * 1.16), { color: C.aries, cls: 'val', doc: '춘분점의 GHA' }, g);
      });
      // 4. 천체 + SHA
      api.dyn('star', api.cel, (g, p) => {
        const c = calc(p), tS = c.lha;
        hourCircle(tS, C.star, g);
        api.dot(eqHA(tS, p.dec), { color: C.star, size: 0.34 }, g);
        api.label('★ 천체 (예: Acamar)', eqHA(tS, p.dec, R * 1.1), { color: C.star }, g);
        api.curve((s) => eqHA(tS, p.dec * s, R * 1.0), 0, 1, 40, { color: C.star, tube: 0.05 }, g);
      });
      api.dyn('sha', api.cel, (g, p) => {
        const c = calc(p), tA = p.lon + c.g;
        eqArc(tA, p.sha, R * 1.12, 0xff9fcf, g);
        api.label('SHA ' + fm(p.sha), mid(tA, p.sha, R * 1.24), { color: 0xff9fcf, cls: 'val', doc: '항성시각' }, g);
      });
      // 5. GHA
      api.dyn('gha', api.cel, (g, p) => {
        const c = calc(p);
        eqArc(p.lon, c.gha, R * 0.93, C.gw, g);
        api.label('GHA ' + fm(c.gha), mid(p.lon, c.gha, R * 0.84), { color: C.gw, cls: 'val', doc: '본초시각' }, g);
      });
      // 6. LHA
      api.dyn('lha', api.cel, (g, p) => {
        const c = calc(p);
        eqArc(0, c.lha, R * 0.86, C.lha, g);
        api.label('LHA ' + fm(c.lha), mid(0, c.lha, R * 0.66), { color: C.lha, cls: 'val big', doc: '지방시각·자오선각' }, g);
      });
      // 7. 자오선각 t, 6시권
      api.dyn('tarc', api.cel, (g, p) => {
        const c = calc(p), east = c.lha > 180, t = east ? 360 - c.lha : c.lha;
        eqArc(0, east ? -t : t, R * 0.6, C.t, g);
        api.label('t ' + api.fmtDM(t) + (east ? ' E' : ' W'), mid(0, east ? -t : t, R * 0.48), { color: C.t, cls: 'val', doc: '지방시각·자오선각' }, g);
      });
      const six = api.group('six');
      hourCircle(90, COLORS.muted, six, true); hourCircle(270, COLORS.muted, six, true);
      api.label('6시권 (W, t=90°)', eqHA(90, 30, R * 1.05), { color: 0x9fb3cc, cls: 'small', doc: '6시권' }, six);
      api.label('6시권 (E)', eqHA(270, 30, R * 1.05), { color: 0x9fb3cc, cls: 'small', doc: '6시권' }, six);
    },
    readout(p, api) {
      const g = api.norm360(G0 + ARIES_RATE * p.ut), gha = api.norm360(g + p.sha), lha = api.norm360(gha + p.lon);
      const east = lha > 180, t = east ? 360 - lha : lha;
      const lonS = api.fmtDM(Math.abs(p.lon)) + (p.lon >= 0 ? 'E' : 'W');
      return [
        ['GHA♈', api.fmtDM(g)], ['SHA', api.fmtDM(p.sha)], ['GHA', api.fmtDM(gha)], ['경도 λ', lonS],
        ['LHA', api.fmtDM(lha)], ['자오선각 t', api.fmtDM(t) + (east ? ' E' : ' W')],
        'GHA = GHA♈ + SHA = ' + api.fmtDM(g) + ' + ' + api.fmtDM(p.sha) + (g + p.sha >= 360 ? ' − 360°' : '') + ' = ' + api.fmtDM(gha),
        'LHA = GHA ' + (p.lon >= 0 ? '+' : '−') + ' λ = ' + api.fmtDM(gha) + (p.lon >= 0 ? ' + ' : ' − ') + api.fmtDM(Math.abs(p.lon)) + ' = ' + api.fmtDM(lha),
        east ? 't(E) = 360° − LHA = ' + api.fmtDM(t) : 't(W) = LHA = ' + api.fmtDM(t)
      ];
    }
  });
})();

/* 장면 5 — 수평좌표: 천정·천저, 진수평, 방위의 기준점, 수직권·동서권, 고도·정거, 방위·방위각, 출몰방위각, 자오선정중 */
(function () {
  const D = Math.PI / 180;

  const DEC_AMP = -Math.asin(Math.sin(15 * D) * Math.cos(35 * D)) / D;   // 35°N 에서 E15°S 로 뜨는 적위 (12°14′.4S)
  const T_RISE_AMP = 360 - Math.acos(-Math.tan(35 * D) * Math.tan(DEC_AMP * D)) / D;  // 그 천체가 뜨는 LHA (278°44′.2)

  // 출몰: cos t0 = −tan L·tan d, sin Amp = sin d / cos L (Amp + 는 북쪽)
  function riseSet(L, d) {

    if (c <= -1) return { kind: 'up' };

  const clean = (x) => (Math.abs(x) < 5e-4 ? 0 : x);

  const dot1 = (x) => { const s = Math.abs(x).toFixed(1).split('.'); return (x < -0.05 ? '−' : '') + s[0] + '°.' + s[1]; };   // 24°.2
  const znStr = (zn) => { let v = Math.round(zn * 10) / 10; if (v >= 360) v -= 360; const s = v.toFixed(1).split('.'); return s[0].padStart(3, '0') + '°.' + s[1]; };  // 290°.8
  // 천체가 자오선 서쪽(W)·동쪽(E)·자오선 위(M)
  const side = (t) => { const a = ((t % 360) + 360) % 360; return (a < 1e-6 || a > 360 - 1e-6 || Math.abs(a - 180) < 1e-6) ? 'M' : (a < 180 ? 'W' : 'E'); };
  // 방위각 Z: 동명극(위도와 같은 이름의 극) 쪽 N/S 에서 E/W 로 180° 까지

    return { z, east, str: (L >= 0 ? 'N' : 'S') + dot1(z) + (sd === 'M' ? '' : sd) };
  }
  const ampStr = (amp, rise) => (rise ? 'E' : 'W') + dot1(Math.abs(amp)) + (amp >= 0 ? 'N' : 'S');
  const latStr = (v) => Math.abs(v).toFixed(1) + '°' + (v >= 0 ? 'N' : 'S');
  // 원근 카메라 위치: 무대가 세로로 길면(휴대폰) 천구 양옆이 잘리지 않도록 뒤로 물린다
  function camAt(pos, label) {

  CN3D.register({

      { title: '진수평', text: '천정·천저를 잇는 직선에 수직이고 천구 중심을 지나는 평면이 천구와 만나는 대권이 <b>진수평</b>이다. 관측자의 눈을 지나 이와 평행한 소권은 <b>거소수평</b>이고, 실제로 보이는 <b>시수평</b>은 그보다 조금 낮다(지구 크기는 과장).', add: ['horizon', 'sensible'] },

      { title: '고도와 정거', text: '천체 M을 지나는 수직권을 따라 진수평에서 M까지 잰 호가 <b>고도 h</b>, 천정에서 M까지 잰 호가 <b>정거 z = 90° − h</b>이다. M을 지나고 수평권에 평행한 소권이 <b>고도의 거등권</b>이다.', add: ['star', 'alt'], remove: ['verticals'], cam: 'space', set: { lat: 35, dec: 30, t: 80 } },
      { title: '방위와 방위각', text: '진수평을 따라 북점에서 <b>시계방향</b>으로 천체의 수직권까지 잰 각이 <b>방위 Zn</b>(000°~360°)이다. 동명극 쪽 N(또는 S)에서 E·W로 180°까지 잰 것은 <b>방위각 Z</b>라 한다. 예: N70°W ↔ 290°.', add: ['azi'], cam: 'space', set: { lat: 35, dec: 30, t: 80 } },
      { title: '출몰방위각', text: '천체가 진수평 위에 있을 때 동점(출) 또는 서점(몰)에서 천체까지 잰 90° 이내의 호가 <b>출몰방위각</b>이다. 교재 예 <b>E15°S</b>(방위 105°)가 되도록 위도 35°N, 적위 12°.2S인 천체가 뜨는 순간을 골랐다.', add: ['amp'], remove: ['alt', 'azi'], cam: 'south', set: { lat: 35, dec: DEC_AMP, t: T_RISE_AMP } },

    ],
    focus: { '천정·천저': 0, '수평의 종류': 1, '방위의 기준점': 2, '수직권·주수직권': 3, '동서권': 3, '고도·고도의 거등권': 4, '정거': 4, '방위·방위각': 5, '수평좌표계': 5, '출몰방위각': 6, '관측자의 천의 자오선·자오선정중': 7 },
    explore: { show: ['base', 'baseCel', 'horizon', 'cardinal', 'cardinalCel', 'star', 'alt', 'azi', 'amp'], cam: 'space', view: 'horizon' },
    build(api, p) {

      const obsLab = api.group('obsLab', H);
      api.label('관측자', new THREE.Vector3(0, RE + 0.5, 0), { color: COLORS.accent, cls: 'small', dx: 8 }, obsLab);

      // 1. 진수평 + 거소수평
      const hzG = api.group('horizon', H);

      const hS = Math.asin(RE / R) / D;
      api.label('진수평', hz(-3, 235, R * 1.03), { color: COLORS.horizon, doc: '수평의 종류' }, hzG);
      const sens = api.group('sensible', H);   // 거소수평은 이 단계에서만

      api.label('거소수평 (관측자 눈을 지남)', hz(hS, 150, R * 1.02), { color: 0xa9e3b2, cls: 'small', doc: '수평의 종류' }, sens);

      // 2. 관측자의 자오선, 천의 극, 방위의 기준점
      const card = api.group('cardinal', H);

      api.label('관측자의 천의 자오선', hz(-35, 180, R * 1.05), { color: C.merid, cls: 'small', doc: '관측자의 천의 자오선·자오선정중' }, card);
      [['N 북점', 0, 'big'], ['E 동점', 90, ''], ['S 남점', 180, 'big'], ['W 서점', 270, '']].forEach(([t, zn, cls]) => {

      });
      const cardC = api.group('cardinalCel', Cg);   // 천의 축·천의 북극·천의 적도(흐리게): 북점을 정하는 기준
      api.line(new THREE.Vector3(0, -R * 1.12, 0), new THREE.Vector3(0, R * 1.12, 0), { color: COLORS.axis, opacity: 0.45, dashed: true }, cardC);
      api.dot(new THREE.Vector3(0, R, 0), { color: COLORS.equator, size: 0.2 }, cardC);
      api.label('Pn', new THREE.Vector3(0, R * 1.17, 0), { color: COLORS.equator, doc: '천의 극·천의 축' }, cardC);
      api.greatCircle(up, { color: COLORS.equator, opacity: 0.3 }, cardC);

      // 3. 수직권들
      const vert = api.group('verticals', H);
      [30, 60, 120, 150].forEach((zn) => api.greatCircle(new THREE.Vector3().crossVectors(up, hz(0, zn)), { color: COLORS.vertical, opacity: 0.32 }, vert));
      api.greatCircle(new THREE.Vector3(1, 0, 0), { color: COLORS.vertical, opacity: 0.95 }, vert);
      api.label('동서권 (PV)', hz(52, 270, R * 1.05), { color: COLORS.vertical, doc: '동서권' }, vert);
      api.label('주수직권 = 자오선', hz(62, 0, R * 1.06), { color: C.merid, cls: 'small', doc: '수직권·주수직권' }, vert);
      api.label('수직권', hz(40, 150, R * 1.04), { color: COLORS.vertical, cls: 'small', doc: '수직권·주수직권' }, vert);

      // 4. 천체와 일주권(적위의 거등권)
      api.dyn('star', Cg, (g, p) => {

      api.dyn('alt', H, (g, p) => {
        const a = altAz(p), h = a.h, zn = a.zn;
        api.curve((s) => hz(90 - 180 * s, zn), 0, 1, 90, { color: COLORS.vertical, opacity: 0.85 }, g);
        api.line(O, hz(0, zn), { color: COLORS.vertical, opacity: 0.45, dashed: true }, g);
        api.smallCircle(up, 90 - h, { color: COLORS.horizon, dashed: true, opacity: 0.7 }, g);

        if (90 - h > 0.3) api.curve((s) => hz(h + (90 - h) * s, zn, R * 1.0), 0, 1, 60, { color: C.z, tube: 0.055 }, g);
        api.label('h ' + api.fmtDM(h), hz(h / 2, zn, R * 1.12), { color: C.h, cls: 'val', doc: '고도·고도의 거등권', dx: 6 }, g);
        api.label('z = 90° − h = ' + api.fmtDM(90 - h), hz(h + (90 - h) * 0.55, zn, R * 1.1), { color: C.z, cls: 'val small', doc: '정거' }, g);
        const far = Math.abs(((zn - 150 + 540) % 360) - 180) > 35;
        if (Math.cos(h * D) > 0.25) api.label('고도의 거등권', hz(h, far ? 150 : 30, R), { color: 0xa9e3b2, cls: 'small', doc: '고도·고도의 거등권' }, g);
      });
      // 방위·방위각
      api.dyn('azi', H, (g, p) => {
        const a = altAz(p), zn = a.zn, az = azAngle(zn, p.lat, p.t);
        if (zn > 0.3) api.curve((s) => hz(0, zn * s, R * 0.8), 0, 1, Math.max(8, Math.ceil(zn / 3)), { color: C.zn, tube: 0.07 }, g);
        api.label('Zn ' + znStr(zn), hz(0, zn / 2, R * 0.66), { color: C.zn, cls: 'val big', doc: '방위·방위각' }, g);
        const z0 = p.lat >= 0 ? 0 : 180;
        const dir = (p.lat >= 0) === az.east ? 1 : -1;   // 북에서 E 쪽 = Zn 증가, 남에서 E 쪽 = Zn 감소
        if (az.z > 0.3) api.curve((s) => hz(0, z0 + dir * az.z * s, R * 0.5), 0, 1, Math.max(8, Math.ceil(az.z / 3)), { color: C.za, tube: 0.06 }, g);

      });
      // 출몰방위각
      api.dyn('amp', H, (g, p) => {
        const rs = riseSet(p.lat, p.dec);

        api.dot(hz(l.h, l.zn), { color: C.merid, size: 0.18 }, g);
        api.label('극하정중 (t 180°)', hz(l.h, l.zn, R * 1.12), { color: 0xb7c4d6, cls: 'small', doc: '관측자의 천의 자오선·자오선정중', dx: -50 }, g);
      });
    },
    readout(p, api) {
      const a = api.altAz(p.lat, p.dec, p.t), h = clean(a.h), zn = a.zn, az = azAngle(zn, p.lat, p.t);
      const sd = side(p.t), t = sd === 'E' ? 360 - p.t : p.t;
      const rs = riseSet(p.lat, p.dec);
      const L = Math.abs(p.lat), dS = p.lat >= 0 ? p.dec : -p.dec;   // 동명 +, 이명 −
      const rows = [
        ['위도 L', api.fmtDM(L) + (p.lat >= 0 ? 'N' : 'S')], ['적위 d', api.fmtDM(Math.abs(p.dec)) + (p.dec >= 0 ? 'N' : 'S')],
        ['LHA (자오선각 t)', api.fmtDM(p.t) + ' (' + api.fmtDM(t) + (sd === 'M' ? '' : sd) + ')'],
        ['고도 h', api.fmtDM(h) + (h < 0 ? ' (수평권 아래)' : '')], ['정거 z', api.fmtDM(90 - h)],
        ['방위 Zn', znStr(zn)], ['방위각 Z', az.str]
      ];
      if (rs.kind === 'rs') rows.push([Math.abs(h) < 0.5 ? '출몰방위각 (지금 수평권상)' : '출몰방위각', '출 ' + ampStr(rs.amp, true) + ' · 몰 ' + ampStr(rs.amp, false)]);
      else rows.push(['출몰방위각', rs.kind === 'up' ? '없음 (지지 않는 주극성)' : '없음 (뜨지 않음)']);
      rows.push('sin h = sin L·sin d + cos L·cos d·cos t = sin ' + nf(L) + '°·sin ' + nf(dS) + '° + cos ' + nf(L) + '°·cos ' + nf(dS) + '°·cos ' + nf(t) + '° → h = ' + api.fmtDM(h));
      rows.push('z = 90° − h = ' + api.fmtDM(90 - h));
      const zs = dot1(az.z);
      rows.push(p.lat >= 0 ? (az.east ? 'Zn = Z = ' + znStr(zn) : 'Zn = 360° − Z = 360° − ' + zs + ' = ' + znStr(zn))
        : (az.east ? 'Zn = 180° − Z = 180° − ' + zs + ' = ' + znStr(zn) : 'Zn = 180° + Z = 180° + ' + zs + ' = ' + znStr(zn)));
      if (rs.kind === 'rs') rows.push('sin Amp = sin d / cos L → Amp = ' + dot1(Math.abs(rs.amp)) + (rs.amp >= 0 ? 'N' : 'S'));
      return rows;
    }
  });
})();

/* 장면 6 — 천구도법: 입체 천구를 자오선 면에 투영한 자오선평면도(그림 1.28–1.30), 북극 위에서 본 적도평면도(그림 1.31) */
(function () {
  const D = Math.PI / 180;
  const nf = (x, n) => (x < -1e-9 ? '−' : '') + Math.abs(x).toFixed(n == null ? 1 : n);
  const dot1 = (x) => { const s = Math.abs(x).toFixed(1).split('.'); return (x < -0.05 ? '−' : '') + s[0] + '°.' + s[1]; };
  const znStr = (zn) => { let v = Math.round(zn * 10) / 10; if (v >= 360) v -= 360; const s = v.toFixed(1).split('.'); return s[0].padStart(3, '0') + '°.' + s[1]; };
  const side = (t) => { const a = ((t % 360) + 360) % 360; return (a < 1e-6 || a > 360 - 1e-6 || Math.abs(a - 180) < 1e-6) ? 'M' : (a < 180 ? 'W' : 'E'); };
  function azAngle(zn, L, t) {   // 동명극 기준 방위각 (N69°.2W 형식)
    const sd = side(t);
    let z = L >= 0 ? (zn <= 180 ? zn : 360 - zn) : (zn <= 180 ? 180 - zn : zn - 180);
    if (sd === 'M') z = Math.round(z);
    return { z, east: sd === 'E', str: (L >= 0 ? 'N' : 'S') + dot1(z) + (sd === 'M' ? '' : sd) };
  }
  const latStr = (v) => Math.abs(v).toFixed(1) + '°' + (v >= 0 ? 'N' : 'S');
  const isExample = (p) => Math.abs(p.lat - 35) < 0.05 && Math.abs(p.dec - 30) < 0.05 && Math.abs(p.lha - 80) < 0.05;

  // 원근 카메라: 무대가 세로로 길면(휴대폰) 뒤로 물린다
  function camAt(pos, label) {
    return { label, target: [0, 0, 0], get pos() {
      let k = 1;
      try { const st = document.querySelector('.s3d-stage'); const a = st.clientWidth / st.clientHeight; if (a > 0 && a < 1) k = Math.min(1.7, 1 / a); } catch (e) { k = 1; }
      return pos.map((v) => v * k);
    } };
  }
  // '천의 북극 위에서': 지금 보기(적도/천정이 위)와 위도에 맞춰 천의 북극 방향에서 내려다본다. 위쪽 = 관측자 자오선 극상반원
  let cur = null;
  const tiltNow = () => (cur && cur.view === 'horizon' ? (90 - cur.lat) * D : 0);

  CN3D.register({
    id: 6,
    name: '천구도법',
    concepts: ['천구도법', '자오선평면도', '적도평면도', '적도좌표계', '수평좌표계'],
    view: 'equator',
    lat: 35,
    orthoSize: 14.2,
    params: [
      { key: 'lat', label: '관측자 위도', min: -80, max: 80, step: 0.1, value: 35, fmt: latStr },
      { key: 'dec', label: '천체 적위', min: -80, max: 80, step: 0.1, value: 30, fmt: latStr },
      { key: 'lha', label: '지방시각 LHA', min: 0, max: 360, step: 0.1, value: 80, play: 10, fmt: (v) => v.toFixed(1) + '°' }
    ],
    cams: {
      space: camAt([8.3, 20.1, 31.1], '비스듬히'),
      spaceEq: camAt([32.4, 16.1, 11.8], '비스듬히'),
      west: { pos: [0, 0, 40], target: [0, 0, 0], ortho: true, label: '자오선평면도' },
      top: { label: '적도평면도', ortho: true, target: [0, 0, 0],
        get pos() { const a = tiltNow(); return [-Math.sin(a) * 40 + 0.001, Math.cos(a) * 40, 0]; },
        get up() { const a = tiltNow(); return [Math.cos(a), Math.sin(a), 0]; } }
    },
    camButtons: ['space', 'west', 'top'],
    steps: [
      { title: '입체 천구: 적도좌표계', text: '천의 북극 Pn을 위로 둔 천구다. 천체 M(적위 30°N, LHA 80°)은 관측자 자오선의 Q에서 적도를 따라 서쪽으로 <b>LHA</b>만큼, 다시 시권을 따라 적도에서 <b>d</b>만큼 떨어져 있다.',
        add: ['sph', 'mer', 'merLo', 'eqSys', 'eqLabPn', 'eqLabQ', 'eqLabPs', 'eqStar', 'eqArcs3d', 'eqLha3d', 'star'], view: 'equator', cam: 'spaceEq', set: { lat: 35, dec: 30, lha: 80 } },
      { title: '입체 천구: 수평좌표계', text: '천구를 위도 35°N만큼 기울이면 천정 Z가 위로 온다. 같은 M을 수평좌표로 나타내면 수직권을 따라 잰 <b>고도 h</b>와 북점에서 잰 <b>방위 Zn</b>이 된다.',
        add: ['horSys', 'horLab', 'horEW', 'horStar', 'horArcs3d'], view: 'horizon', cam: 'space' },

        add: ['eq2d', 'eq2dLabA'], remove: ['horSys', 'horLab', 'horStar', 'proj', 'projH'], view: 'equator', cam: 'west' },
      { title: '수평좌표계 자오선평면도 (그림 1.29)', text: 'Z를 위로 하면 NS가 수평권, ZNa가 동서권, hh′가 고도의 거등권이다. 수평권을 NS 둘레로 접어 N에서 <b>방위각</b>만큼 잰 점이 A, 그 수선의 발이 A′이다. Z–A′–Na 타원(수직권)이 hh′와 만나는 점이 M이다.',
        add: ['horSys', 'horLab', 'horStar', 'hor2dDown'], remove: ['eqSys', 'eqLabPn', 'eqLabQ', 'eqLabPs', 'eqStar', 'eq2d', 'eq2dLabA'], view: 'horizon', cam: 'west' },
      { title: '두 좌표계의 결합 (그림 1.30)', text: '두 그림을 겹치면 ZQ = 위도 35°이다. 적위·LHA로 찾은 M에서 거꾸로 고도와 방위를 읽는다. 정확한 계산값은 <b>h 24°12′.2, Zn 290°.8(N69°.2W)</b>이며, 교재 그림의 25°·N70°W는 작도로 읽은 근삿값이다.',
        add: ['eqSys', 'eqLabPn', 'eqLabQ', 'eqLabPs', 'eqStar', 'eq2d', 'eq2dLabB', 'hor2dUp'], remove: ['hor2dDown'], view: 'horizon', cam: 'west', set: { lat: 35, dec: 30, lha: 80 } },
      { title: '천의 북극 위에서: 적도평면도(시각도)', text: '천의 북극 위에서 내려다보면 적도가 바깥 원, Pn이 중심이 된다. 관측자 자오선의 극상반원 <b>M</b>을 위로, 극하반원 <b>m</b>을 점선으로 그리고, 시계방향을 서쪽으로 하여 LHA를 잰다(그림 1.31).',
        add: ['merLoD', 'eqLha3d', 'eqTop', 'starTop'], remove: ['horSys', 'horLab', 'horStar', 'hor2dUp', 'eq2d', 'eq2dLabB', 'eqLabQ', 'eqLabPs', 'merLo', 'oLab', 'star'], view: 'equator', cam: 'top' }
    ],
    focus: { '적도좌표계': 0, '수평좌표계': 1, '천구도법': 2, '자오선평면도': 5, '적도평면도': 6 },
    explore: { show: ['sph', 'mer', 'merLo', 'eqSys', 'eqLabPn', 'eqLabQ', 'eqLabPs', 'eqStar', 'star', 'horSys', 'horLab', 'horStar', 'eq2d', 'eq2dLabB', 'hor2dUp', 'proj', 'projH', 'oLab'], cam: 'west', view: 'horizon' },
    build(api, p) {
      cur = api;
      const { THREE, R, COLORS, eqHA, hz } = api;
      const Cg = api.cel, H = api.hor;
      const up = new THREE.Vector3(0, 1, 0), X = new THREE.Vector3(1, 0, 0), O = new THREE.Vector3(0, 0, 0);
      const C = { hc: 0x9fd0ff, dec: 0xffd36e, lha: 0x7fe3ff, h: COLORS.accent, zn: 0xffa94d, proj: 0xc9d6e8, fold: 0xb9c7da };
      const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
      const inPlane = (ang, r) => v3(Math.cos(ang * D) * r, Math.sin(ang * D) * r, 0);   // 자오선 면(z = 0) 위의 점
      const calc = (p) => { const a = api.altAz(p.lat, p.dec, p.lha); return { h: a.h, zn: a.zn, az: azAngle(a.zn, p.lat, p.lha) }; };

      // ── 바탕: 천구, 관측자 자오선(극상반원 / 극하반원)
      api.sphere({ opacity: 0.05 }, api.group('sph', H));
      const mer = api.group('mer', Cg);
      api.curve((s) => eqHA(0, -90 + 180 * s), 0, 1, 90, { color: COLORS.meridian }, mer);
      api.curve((s) => eqHA(180, -90 + 180 * s), 0, 1, 90, { color: COLORS.meridian }, api.group('merLo', Cg));
      api.curve((s) => eqHA(180, -90 + 180 * s), 0, 1, 90, { color: COLORS.meridian, dashed: true, opacity: 0.7 }, api.group('merLoD', Cg));

      // ── 적도좌표계
      const eqS = api.group('eqSys', Cg);
      api.greatCircle(up, { color: COLORS.equator }, eqS);
      api.line(v3(0, -R, 0), v3(0, R, 0), { color: COLORS.axis, opacity: 0.6, dashed: true }, eqS);
      [v3(0, R, 0), v3(0, -R, 0), eqHA(0, 0), eqHA(180, 0)].forEach((v) => api.dot(v, { color: COLORS.equator, size: 0.2 }, eqS));
      api.label('Pn', v3(0, R * 1.1, 0), { color: COLORS.equator, cls: 'big', doc: '천의 극·천의 축' }, api.group('eqLabPn', Cg));
      api.label('Ps', v3(0, -R * 1.1, 0), { color: COLORS.equator, doc: '천의 극·천의 축' }, api.group('eqLabPs', Cg));
      const eqLabQ = api.group('eqLabQ', Cg);
      api.label('Q', eqHA(0, 0, R * 1.09), { color: COLORS.equator, doc: '천의 적도' }, eqLabQ);
      api.label('Q′', eqHA(180, 0, R * 1.09), { color: COLORS.equator, doc: '천의 적도' }, eqLabQ);

      // 천체의 시권(반원)과 적위의 거등권
      api.dyn('eqStar', Cg, (g, p) => {
        api.curve((s) => eqHA(p.lha, -90 + 180 * s), 0, 1, 90, { color: C.hc, opacity: 0.95 }, g);
        api.smallCircle(up, 90 - p.dec, { color: COLORS.equator, dashed: true, opacity: 0.75 }, g);
      });
      // 입체에서 잰 d, LHA (투영하면 직선 위로 겹치므로 평면도 단계에서는 숨긴다)
      api.dyn('eqArcs3d', Cg, (g, p) => {
        if (Math.abs(p.dec) > 0.3) api.curve((s) => eqHA(p.lha, p.dec * s), 0, 1, 30, { color: C.dec, tube: 0.06 }, g);
        api.label('d ' + latStr(p.dec), eqHA(p.lha, p.dec / 2, R * 1.1), { color: C.dec, cls: 'val small', doc: '적위', dx: 26 }, g);
      });
      api.dyn('eqLha3d', Cg, (g, p) => {
        if (p.lha > 0.3) api.curve((s) => eqHA(p.lha * s, 0, R * 1.0), 0, 1, Math.max(8, Math.ceil(p.lha / 3)), { color: C.lha, tube: 0.07 }, g);
        api.dot(eqHA(p.lha, 0), { color: C.lha, size: 0.2 }, g);
        api.label('LHA ' + p.lha.toFixed(1) + '°', eqHA(p.lha / 2, 0, R * 1.14), { color: C.lha, cls: 'val', doc: '지방시각·자오선각' }, g);
      });
      api.dyn('star', Cg, (g, p) => {
        api.dot(eqHA(p.lha, p.dec), { color: COLORS.star, size: 0.32 }, g);
        api.label('M', eqHA(p.lha, p.dec), { color: COLORS.star, cls: 'big', dx: 16, dy: 12 }, g);
      });
      api.dyn('starTop', Cg, (g, p) => {
        api.dot(eqHA(p.lha, p.dec), { color: COLORS.star, size: 0.32 }, g);
        api.label('★ 천체', eqHA(p.lha, p.dec), { color: COLORS.star, dx: 30, dy: 10 }, g);
      });

      // ── 수평좌표계
      const hS = api.group('horSys', H);
      api.greatCircle(up, { color: COLORS.horizon }, hS);
      api.disk(up, { color: COLORS.horizon, opacity: 0.07 }, hS);
      api.greatCircle(X, { color: COLORS.vertical, opacity: 0.35 }, hS);   // 동서권 (투영하면 ZNa)
      api.line(v3(0, -R, 0), v3(0, R, 0), { color: COLORS.axis, opacity: 0.6 }, hS);
      [v3(0, R, 0), v3(0, -R, 0), hz(0, 0), hz(0, 180)].forEach((v) => api.dot(v, { color: COLORS.horizon, size: 0.2 }, hS));
      const hL = api.group('horLab', H);
      api.label('Z', v3(0, R * 1.09, 0), { cls: 'big', doc: '천정·천저' }, hL);
      api.label('Na', v3(0, -R * 1.09, 0), { doc: '천정·천저' }, hL);
      api.label('N', hz(0, 0, R * 1.1), { color: 0xc8f0cf, cls: 'big', doc: '방위의 기준점' }, hL);
      api.label('S', hz(0, 180, R * 1.1), { color: 0xc8f0cf, cls: 'big', doc: '방위의 기준점' }, hL);
      const hEW = api.group('horEW', H);
      api.label('E', hz(-8, 90, R * 1.1), { color: 0xc8f0cf, doc: '방위의 기준점' }, hEW);
      api.label('W', hz(-8, 270, R * 1.1), { color: 0xc8f0cf, doc: '방위의 기준점' }, hEW);

      // 천체의 수직권(반원)과 고도의 거등권
      api.dyn('horStar', H, (g, p) => {
        const c = calc(p);
        api.curve((s) => hz(90 - 180 * s, c.zn), 0, 1, 90, { color: COLORS.vertical, opacity: 0.95 }, g);
        api.smallCircle(up, 90 - c.h, { color: COLORS.horizon, dashed: true, opacity: 0.8 }, g);
      });
      api.dyn('horArcs3d', H, (g, p) => {
        const c = calc(p);
        if (Math.abs(c.h) > 0.3) api.curve((s) => hz(c.h * s, c.zn), 0, 1, 30, { color: C.h, tube: 0.07 }, g);
        if (c.zn > 0.3) api.curve((s) => hz(0, c.zn * s, R * 1.0), 0, 1, Math.max(8, Math.ceil(c.zn / 3)), { color: C.zn, tube: 0.06 }, g);
        api.label('h ' + dot1(c.h), hz(c.h / 2, c.zn, R * 1.1), { color: C.h, cls: 'val small', doc: '고도·고도의 거등권', dx: -30 }, g);
        api.label('Zn ' + znStr(c.zn), hz(0, c.zn / 2, R * 1.12), { color: C.zn, cls: 'val small', doc: '방위·방위각' }, g);
      });

      // ── 투영선 (자오선 면 z = 0 으로 수직)
      api.dyn('proj', Cg, (g, p) => {
        api.disk(v3(0, 0, 1), { color: COLORS.meridian, opacity: 0.05 }, g);
        const m = eqHA(p.lha, p.dec), a = eqHA(p.lha, 0);
        api.line(m, v3(m.x, m.y, 0), { color: C.proj, opacity: 0.6, dashed: true }, g);
        api.line(a, v3(a.x, 0, 0), { color: C.proj, opacity: 0.6, dashed: true }, g);
        for (let k = 1; k < 6; k++) {   // 거등권 위 몇 점의 투영선 → 현
          const q = eqHA(p.lha + k * 60, p.dec);
          api.line(q, v3(q.x, q.y, 0), { color: C.proj, opacity: 0.3, dashed: true }, g);
        }
        api.dot(v3(m.x, m.y, 0), { color: COLORS.star, size: 0.16 }, g);
      });
      api.dyn('projH', H, (g, p) => {
        const c = calc(p), f = hz(0, c.zn);
        api.line(f, v3(f.x, 0, 0), { color: C.proj, opacity: 0.6, dashed: true }, g);
        api.line(hz(0, 90), O, { color: C.proj, opacity: 0.45, dashed: true }, g);
        api.line(hz(0, 270), O, { color: C.proj, opacity: 0.45, dashed: true }, g);
        api.label('자오선 면', inPlane(-50, R * 0.62), { color: 0xb9c7da, cls: 'small', fade: false }, g);
      });
      api.label('O', O, { color: 0xb9c7da, cls: 'small', dx: -10, dy: 10, fade: false }, api.group('oLab', H));

      // ── 그림 1.28: 적도를 QQ′ 둘레로 접어 LHA 를 원 위에서 잰다
      const eqFold = (p) => { const a = eqHA(p.lha, 0); return { a3: a, af: v3(a.x, -a.z, 0), foot: v3(a.x, 0, 0) }; };
      api.dyn('eq2d', Cg, (g, p) => {
        const f = eqFold(p);
        if (Math.abs(p.dec) > 0.3) api.curve((s) => eqHA(180, p.dec * s), 0, 1, 24, { color: C.dec, tube: 0.07 }, g);   // Q′ 에서 d′ 까지
        api.label('d ' + latStr(p.dec), eqHA(180, p.dec / 2, R * 1.2), { color: C.dec, cls: 'val small', doc: '적위' }, g);
        api.label('d′', eqHA(180, p.dec, R * 1.08), { color: COLORS.equator, cls: 'small' }, g);
        if (p.lha > 0.3) api.curve((s) => inPlane(-p.lha * s, R), 0, 1, Math.max(8, Math.ceil(p.lha / 3)), { color: C.lha, tube: 0.07 }, g);
        api.label('LHA ' + p.lha.toFixed(1) + '°', inPlane(-p.lha / 2, R * 0.84), { color: C.lha, cls: 'val small', doc: '지방시각·자오선각' }, g);
        api.arcAround(X, f.a3, 90, { color: C.fold, dashed: true, opacity: 0.8 }, g);   // 접는 길 = 교재의 점선 A–A′
        api.dot(f.af, { color: C.lha, size: 0.2 }, g);
        api.dot(f.foot, { color: C.lha, size: 0.16 }, g);
      });
      api.dyn('eq2dLabA', Cg, (g, p) => {
        const f = eqFold(p);
        api.label('A', f.af.clone().multiplyScalar(1.09), { color: C.lha }, g);
        api.label('A′', f.foot, { color: C.lha, cls: 'small', dx: 12, dy: 12 }, g);
        api.label('d', eqHA(0, p.dec, R * 1.08), { color: COLORS.equator, cls: 'small' }, g);
      });
      api.dyn('eq2dLabB', Cg, (g, p) => {
        const f = eqFold(p);
        api.label('B', f.af.clone().multiplyScalar(1.09), { color: C.lha }, g);
        api.label('B′', f.foot, { color: C.lha, cls: 'small', dx: 12, dy: -12 }, g);
      });

      // ── 그림 1.29 / 1.30: 수평권을 NS 둘레로 접어 방위각을 원 위에서 잰다 (1.29 는 아래로, 1.30 은 위로)
      const horFold = (g, p, sgn) => {
        const c = calc(p), f3 = hz(0, c.zn), af = v3(f3.x, sgn * f3.z, 0), foot = v3(f3.x, 0, 0);
        // 고도: S(또는 N)에서 Z 쪽으로 h, 그리고 hh′
        if (Math.abs(c.h) > 0.3) api.curve((s) => hz(c.h * s, 180), 0, 1, 20, { color: C.h, tube: 0.07 }, g);
        api.line(O, hz(c.h, 180), { color: C.h, opacity: 0.7, dashed: true }, g);
        api.arcAround(new THREE.Vector3(0, 0, 1), hz(0, 180, R * 0.3), c.h, { color: C.h }, g);
        api.label('h ' + dot1(c.h), hz(c.h / 2, 180, R * 0.46), { color: C.h, cls: 'val small', doc: '고도·고도의 거등권' }, g);
        api.label('h', hz(c.h, 180, R * 1.08), { color: COLORS.horizon, cls: 'small' }, g);
        api.label('h′', hz(c.h, 0, R * 1.08), { color: COLORS.horizon, cls: 'small' }, g);
        // 방위각: N 에서 원을 따라 Z 만큼 → A, 수선의 발 A′
        const zAng = Math.atan2(af.y, -af.x) / D;   // N 에서 잰 각 (+ 위쪽)
        if (Math.abs(zAng) > 0.3) api.curve((s) => inPlane(180 - zAng * s, R), 0, 1, Math.max(8, Math.ceil(Math.abs(zAng) / 3)), { color: C.zn, tube: 0.07 }, g);
        api.arcAround(X, f3, sgn > 0 ? -90 : 90, { color: C.fold, dashed: true, opacity: 0.8 }, g);
        api.dot(af, { color: C.zn, size: 0.2 }, g);
        api.dot(foot, { color: C.zn, size: 0.16 }, g);
        api.label('A', af.clone().multiplyScalar(1.09), { color: C.zn }, g);
        api.label('A′', foot, { color: C.zn, cls: 'small', dx: -12, dy: sgn > 0 ? 12 : -12 }, g);
        api.label(calc(p).az.str, inPlane(180 - zAng / 2, R * 0.8), { color: C.zn, cls: 'val small', doc: '방위·방위각' }, g);
      };
      api.dyn('hor2dDown', H, (g, p) => horFold(g, p, -1));
      api.dyn('hor2dUp', H, (g, p) => horFold(g, p, 1));

      // ── 그림 1.31: 적도평면도(시각도) 표기
      api.dyn('eqTop', Cg, (g, p) => {
        api.label('M (극상반원)', eqHA(0, 0, R * 1.1), { color: COLORS.meridian, doc: '관측자의 천의 자오선·자오선정중' }, g);
        api.label('m (극하반원)', eqHA(180, 0, R * 1.1), { color: 0xb7c4d6, cls: 'small' }, g);
        api.label('시계방향 = 서쪽(W)', eqHA(135, 0, R * 1.14), { color: 0xc8f0cf, cls: 'small' }, g);
        api.label('동쪽(E)', eqHA(225, 0, R * 1.12), { color: 0xc8f0cf, cls: 'small' }, g);
        api.label('시권', eqHA(p.lha, 0, R * 0.55), { color: C.hc, cls: 'small', dx: 18 }, g);
      });
    },
    readout(p, api) {
      const a = api.altAz(p.lat, p.dec, p.lha), h = a.h, zn = a.zn, az = azAngle(zn, p.lat, p.lha);
      const L = Math.abs(p.lat), dS = p.lat >= 0 ? p.dec : -p.dec, sd = side(p.lha), t = sd === 'E' ? 360 - p.lha : p.lha;
      const rows = [
        ['위도 L', api.fmtDM(L) + (p.lat >= 0 ? 'N' : 'S')], ['적위 d', api.fmtDM(Math.abs(p.dec)) + (p.dec >= 0 ? 'N' : 'S')],
        ['LHA (t)', api.fmtDM(p.lha) + ' (' + api.fmtDM(t) + (sd === 'M' ? '' : sd) + ')'],
        ['고도 h (계산)', api.fmtDM(h)], ['방위 Zn (계산)', znStr(zn)], ['방위각 Z (계산)', az.str]
      ];
      if (isExample(p)) rows.push(['교재 작도값 (그림 1.29·1.30)', 'h 25°, N70°W = 290°']);
      rows.push('sin h = sin L·sin d + cos L·cos d·cos t = sin ' + nf(L) + '°·sin ' + nf(dS) + '° + cos ' + nf(L) + '°·cos ' + nf(dS) + '°·cos ' + nf(t) + '° → h = ' + api.fmtDM(h));
      rows.push('cos Z = (sin d − sin L·sin h) / (cos L·cos h) → Z = ' + az.str + ', Zn = ' + znStr(zn));
      if (isExample(p)) rows.push('교재의 h 25°·N70°W는 그림에서 읽은 근삿값이다. 계산값과 0°.8 차이가 난다.');
      return rows;
    }
  });
})();

/* 장면 7 — 항해삼각형: 꼭짓점 Pn·Z·M, 세 변(여위도·극거·정거), 세 각(t·Z·X), 식 (8.4)로 Hc·Zn 풀기, 지문삼각형(P·AP·GP) */
(function () {
  const D = Math.PI / 180;
  const RE = 5.4;                        // 지문삼각형용 지구 반지름 (보기 좋게 크게)
  const nf = (x, n) => (x < -1e-9 ? '−' : '') + Math.abs(x).toFixed(n == null ? 1 : n);
  const dot1 = (x) => { const s = Math.abs(x).toFixed(1).split('.'); return (x < -0.05 ? '−' : '') + s[0] + '°.' + s[1]; };
  const znStr = (zn) => { let v = Math.round(zn * 10) / 10; if (v >= 360) v -= 360; const s = v.toFixed(1).split('.'); return s[0].padStart(3, '0') + '°.' + s[1]; };
  const norm = (a) => ((a % 360) + 360) % 360;
  const side = (t) => { const a = norm(t); return (a < 1e-6 || a > 360 - 1e-6 || Math.abs(a - 180) < 1e-6) ? 'M' : (a < 180 ? 'W' : 'E'); };
  const latStr = (v) => Math.abs(v).toFixed(1) + '°' + (v >= 0 ? 'N' : 'S');
  const lonStr = (v) => Math.abs(v).toFixed(1) + '°' + (v >= 0 ? 'E' : 'W');

  // 항해삼각형 풀이 (위도 L, 적위 d, LHA) — 동명극 기준
  function solve(p) {
    const N = p.lat >= 0, L = Math.abs(p.lat), dS = N ? p.dec : -p.dec;     // dS: 동명 +, 이명 −
    const sd = side(p.lha), t = sd === 'E' ? 360 - norm(p.lha) : norm(p.lha);
    const sh = Math.sin(L * D) * Math.sin(dS * D) + Math.cos(L * D) * Math.cos(dS * D) * Math.cos(t * D);
    const hc = Math.asin(Math.max(-1, Math.min(1, sh))) / D;
    const ch = Math.cos(hc * D), flat = ch < 1e-9;                          // 천체가 천정·천저에 있으면 방위가 정해지지 않는다
    const cz = flat ? 1 : (Math.sin(dS * D) - Math.sin(L * D) * Math.sin(hc * D)) / (Math.cos(L * D) * ch);
    const z = Math.acos(Math.max(-1, Math.min(1, cz))) / D;                 // 동명극에서 잰 방위각 0~180
    const pole = N ? 'N' : 'S';
    let zn = sd === 'W' ? (N ? 360 - z : 180 + z) : (N ? z : 180 - z);
    zn = norm(zn);
    const cx = flat ? 1 : (Math.sin(L * D) - Math.sin(dS * D) * Math.sin(hc * D)) / (Math.cos(dS * D) * ch);
    const x = Math.acos(Math.max(-1, Math.min(1, cx))) / D;                 // 위치각
    return { N, L, dS, sd, t, hc, z, zn, x, zStr: pole + dot1(z) + (sd === 'M' ? '' : sd) };
  }
  function camAt(pos, label) {   // 무대가 세로로 길면(휴대폰) 카메라를 뒤로 물린다
    return { label, target: [0, 0, 0], get pos() {
      let k = 1;
      try { const st = document.querySelector('.s3d-stage'); const a = st.clientWidth / st.clientHeight; if (a > 0 && a < 1) k = Math.min(1.7, 1 / a); } catch (e) { k = 1; }
      return pos.map((v) => v * k);
    } };
  }

  CN3D.register({
    id: 7,
    name: '항해삼각형',
    concepts: ['항해삼각형', '위치각', '항해삼각형의 용도', '구면삼각형의 계산', '계산고도·계산방위각', '지문삼각형'],
    view: 'horizon',
    lat: 35,
    params: [
      { key: 'lat', label: '위도 L', min: -70, max: 70, step: 0.1, value: 35, fmt: latStr },
      { key: 'dec', label: '적위 d', min: -70, max: 70, step: 0.1, value: 30, fmt: latStr },
      { key: 'lha', label: 'LHA', min: 0, max: 360, step: 0.1, value: 80, play: 10,
        fmt: (v) => v.toFixed(1) + '°' },
      { key: 'lon', label: 'AP 경도 λ', min: -180, max: 180, step: 0.1, value: 126.4, fmt: lonStr }
    ],
    cams: {
      space: camAt([-8.5, 19, 31.8], '비스듬히'),
      earth: camAt([-15, 26, 11.2], '지구 가까이')   // 삼각형 무게중심 방향에서 (두 삼각형이 정면으로 보인다)
    },
    camButtons: ['space', 'earth'],
    steps: [
      { title: '세 꼭짓점: Pn · Z · M', text: '항해삼각형의 꼭짓점은 관측자의 동명극 <b>Pn</b>, 관측자의 천정 <b>Z</b>, 천체 <b>M</b>이다. 북반구 관측자에게는 천의 북극이 동명극이다.', add: ['base', 'baseCel', 'verts'], cam: 'space', set: { lat: 35, dec: 30, lha: 80, lon: 126.4 } },
      { title: '세 변: 여위도 · 극거 · 정거', text: '세 변은 관측자의 자오선 위의 <b>여위도</b> PnZ = 90° − L, 천체의 시권 위의 <b>극거(여적위)</b> PnM = 90° − d, 천체의 수직권 위의 <b>정거(여고도)</b> ZM = 90° − h이다. 모두 대권의 호다.', add: ['circles', 'sides'] },
      { title: '자오선각 t와 방위각 Z', text: 'Pn에서 관측자의 자오선과 천체의 시권이 이루는 각이 <b>자오선각 t</b>(LHA에서 구한다), Z에서 자오선과 수직권이 이루는 각이 <b>방위각 Z</b>이다.', add: ['angT', 'angZ'], remove: ['circles'] },
      { title: '위치각 X', text: 'M에서 천체의 시권과 수직권이 이루는 각이 <b>위치각 X</b>(parallactic angle)이다. 항해 문제를 풀 때는 잘 쓰이지 않는다.', add: ['angX'] },
      { title: '삼각형 풀기: Hc와 Zn', text: '위도 L, 적위 d, 자오선각 t를 알면 식 (8.4) <b>sin Hc = sin L·sin d + cos L·cos d·cos t</b>로 계산고도 Hc를, 방위각 공식으로 계산방위각 Z와 방위 Zn을 구한다. 천측계산(위치선 산정)이 바로 이 문제다.', add: ['solve'], cam: 'space' },
      { title: '지문삼각형: P · AP · GP', text: '세 꼭짓점을 지구 중심과 이으면 지구 표면에 닮은 <b>지문삼각형</b>이 생긴다. 꼭짓점은 지구의 극 P, 천정 바로 아래의 가정위치 <b>AP</b>, 천체 바로 아래의 지위 <b>GP</b>(위도 = 적위, 경도 = GHA)이다.', add: ['terr', 'skyThin'], remove: ['solve', 'sides', 'angT', 'angZ', 'angX', 'base'], cam: 'earth' }
    ],
    focus: { '항해삼각형': 1, '위치각': 3, '항해삼각형의 용도': 4, '구면삼각형의 계산': 4, '계산고도·계산방위각': 4, '지문삼각형': 5 },
    explore: { show: ['base', 'baseCel', 'verts', 'sides', 'angT', 'angZ', 'angX', 'solve'], cam: 'space', view: 'horizon' },
    build(api, p) {
      const { THREE, R, COLORS, eqHA, hz } = api;
      const Cg = api.cel, H = api.hor;
      const up = new THREE.Vector3(0, 1, 0), O = new THREE.Vector3(0, 0, 0);
      const C = { side1: COLORS.meridian, side2: 0x9fd0ff, side3: COLORS.vertical, t: 0xff9f5a, z: 0xffd6a3, x: 0xd59bff, h: COLORS.accent, zn: 0xffa94d, fill: COLORS.accent };
      // 꼭짓점 (cel 좌표): 동명극 Pe, 천정 Z = (t 0°, δ = L), 천체 M
      const V = (p) => ({ pe: new THREE.Vector3(0, p.lat >= 0 ? R : -R, 0), z: eqHA(0, p.lat), m: eqHA(p.lha, p.dec) });
      const degenerate = (p) => Math.abs(Math.sin(p.lha * D)) < 0.01;
      const tang = (v, a) => { const n = v.clone().normalize(), w = a.clone().normalize(); return w.sub(n.clone().multiplyScalar(w.dot(n))).normalize(); };
      // 각 표시 옆 라벨 위치: 두 변 방향의 이등분선 쪽
      const bis = (v, a, b, k) => v.clone().add(tang(v, a).add(tang(v, b)).normalize().multiplyScalar(k));
      const out = (a, b, k) => { const m = a.clone().normalize().add(b.clone().normalize()); return (m.lengthSq() < 1e-8 ? a.clone() : m).normalize().multiplyScalar(R * k); };
      // 두 점이 정반대(천체가 천저)이면 대권 호가 하나로 정해지지 않으므로 그리지 않는다
      const arc = (a, b, opts, g) => (a.angleTo(b) < Math.PI - 1e-4 ? api.arc(a, b, opts, g) : null);

      // 구면삼각형 면 (반투명). 엔진 밖에서 만든 기하는 다시 그릴 때 직접 정리한다
      const own = [];
      function triFill(A, B, Cc, r, color, opacity, parent) {
        const n = 16, pos = [], idx = [], id = (i, j) => i * (n + 1) - (i * (i - 1)) / 2 + j;
        for (let i = 0; i <= n; i++) for (let j = 0; j <= n - i; j++) {
          const k = n - i - j, v = A.clone().multiplyScalar(i).add(B.clone().multiplyScalar(j)).add(Cc.clone().multiplyScalar(k)).normalize().multiplyScalar(r);
          pos.push(v.x, v.y, v.z);
        }
        for (let i = 0; i < n; i++) for (let j = 0; j < n - i; j++) {
          idx.push(id(i, j), id(i + 1, j), id(i, j + 1));
          if (i + j < n - 1) idx.push(id(i + 1, j), id(i + 1, j + 1), id(i, j + 1));
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setIndex(idx);
        const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide, depthWrite: false });
        own.push(geo, mat);
        const mesh = new THREE.Mesh(geo, mat); parent.add(mesh); return mesh;
      }

      // ── 바탕: 천구, 수평권(흐리게), 천의 적도·천의 축(흐리게)
      const base = api.group('base', H);
      api.sphere({ opacity: 0.05 }, base);
      api.greatCircle(up, { color: COLORS.horizon, opacity: 0.55 }, base);
      api.disk(up, { color: COLORS.horizon, opacity: 0.05 }, base);
      [['N', 0], ['E', 90], ['S', 180], ['W', 270]].forEach(([t, zn]) => api.label(t, hz(-7, zn, R * 1.08), { color: 0xc8f0cf, cls: 'small', doc: '방위의 기준점' }, base));
      const bc = api.group('baseCel', Cg);
      api.greatCircle(up, { color: COLORS.equator, opacity: 0.35 }, bc);
      api.line(new THREE.Vector3(0, -R * 1.1, 0), new THREE.Vector3(0, R * 1.1, 0), { color: COLORS.axis, opacity: 0.4, dashed: true }, bc);
      api.label('천의 적도', eqHA(200, 0, R * 1.04), { color: COLORS.equator, cls: 'small', doc: '천의 적도' }, bc);

      // ── 꼭짓점
      api.dyn('verts', Cg, (g, p) => {
        const v = V(p), N = p.lat >= 0;
        api.dot(v.pe, { color: COLORS.equator, size: 0.3 }, g);
        api.dot(v.z, { color: COLORS.white, size: 0.3 }, g);
        api.dot(v.m, { color: COLORS.star, size: 0.36 }, g);
        api.label((N ? 'Pn' : 'Ps') + ' 동명극', v.pe.clone().multiplyScalar(1.1), { color: COLORS.equator, cls: 'big', doc: '천의 극·천의 축', dx: -30, dy: -16 }, g);
        api.label('Z 천정', v.z.clone().multiplyScalar(1.1), { cls: 'big', doc: '천정·천저', dy: -8 }, g);
        api.label('M 천체', v.m.clone().multiplyScalar(1.1), { color: COLORS.star, cls: 'big', dx: 26, dy: 18 }, g);
      });
      // ── 삼각형을 만드는 세 대권 (흐리게)
      api.dyn('circles', Cg, (g, p) => {
        const v = V(p);
        api.greatCircle(new THREE.Vector3(0, 0, 1), { color: C.side1, opacity: 0.35 }, g);
        if (!degenerate(p)) {
          api.greatCircle(new THREE.Vector3().crossVectors(up, v.m), { color: C.side2, opacity: 0.35 }, g);
          api.greatCircle(new THREE.Vector3().crossVectors(v.z, v.m), { color: C.side3, opacity: 0.35 }, g);
        }
        api.label('관측자의 자오선', eqHA(180, -20, R * 1.04), { color: C.side1, cls: 'small', doc: '관측자의 천의 자오선·자오선정중' }, g);
        api.label('천체의 시권', eqHA(p.lha, -35, R * 1.04), { color: C.side2, cls: 'small', doc: '천의 자오선·시권' }, g);
      });
      // ── 세 변
      api.dyn('sides', Cg, (g, p) => {
        const v = V(p), s = solve(p);
        if (!degenerate(p)) triFill(v.pe, v.z, v.m, R * 0.998, C.fill, 0.13, g);
        arc(v.pe, v.z, { color: C.side1, tube: 0.08 }, g);
        arc(v.pe, v.m, { color: C.side2, tube: 0.08 }, g);
        arc(v.z, v.m, { color: C.side3, tube: 0.08 }, g);
        api.label('여위도 ' + api.fmtDM(90 - s.L), out(v.pe, v.z, 1.1), { color: C.side1, cls: 'val small', doc: '항해삼각형', dx: -34, dy: -6 }, g);
        api.label('극거 ' + api.fmtDM(90 - s.dS), out(v.pe, v.m, 1.1), { color: C.side2, cls: 'val small', doc: '극거', dx: -50, dy: 4 }, g);
        api.label('정거 ' + api.fmtDM(90 - s.hc), out(v.z, v.m, 1.1), { color: C.side3, cls: 'val small', doc: '정거', dx: 56 }, g);
      });
      // 지문삼각형 단계에서는 하늘의 삼각형을 가는 선으로만
      api.dyn('skyThin', Cg, (g, p) => {
        const v = V(p);
        arc(v.pe, v.z, { color: C.side1, opacity: 0.6 }, g);
        arc(v.pe, v.m, { color: C.side2, opacity: 0.6 }, g);
        arc(v.z, v.m, { color: C.side3, opacity: 0.6 }, g);
      });
      // ── 세 각
      api.dyn('angT', Cg, (g, p) => {
        if (degenerate(p)) return;
        const v = V(p), s = solve(p);
        api.angleMark(v.pe, v.z, v.m, { color: C.t, size: 2.2, tube: 0.07 }, g);
        api.label('t ' + dot1(s.t) + s.sd, bis(v.pe, v.z, v.m, 3.6), { color: C.t, cls: 'val', doc: '지방시각·자오선각' }, g);
      });
      api.dyn('angZ', Cg, (g, p) => {
        if (degenerate(p)) return;
        const v = V(p), s = solve(p);
        api.angleMark(v.z, v.pe, v.m, { color: C.z, size: 1.8, tube: 0.07 }, g);
        api.label('Z ' + s.zStr, bis(v.z, v.pe, v.m, 3.1), { color: C.z, cls: 'val', doc: '방위·방위각' }, g);
      });
      api.dyn('angX', Cg, (g, p) => {
        if (degenerate(p)) return;
        const v = V(p), s = solve(p);
        api.angleMark(v.m, v.pe, v.z, { color: C.x, size: 1.8, tube: 0.07 }, g);
        api.label('X ' + dot1(s.x), bis(v.m, v.pe, v.z, 3.0), { color: C.x, cls: 'val', doc: '위치각' }, g);
      });
      // ── 풀이 결과: 계산고도 Hc, 방위 Zn (수평 좌표)
      api.dyn('solve', H, (g, p) => {
        const s = solve(p);
        api.curve((q) => hz(90 - 180 * q, s.zn), 0, 1, 90, { color: C.side3, opacity: 0.45 }, g);
        if (Math.abs(s.hc) > 0.3) api.curve((q) => hz(s.hc * q, s.zn), 0, 1, 30, { color: C.h, tube: 0.08 }, g);
        if (s.zn > 0.3) api.curve((q) => hz(0, s.zn * q, R * 0.9), 0, 1, Math.max(8, Math.ceil(s.zn / 3)), { color: C.zn, tube: 0.06 }, g);
        api.label('Hc ' + api.fmtDM(s.hc), hz(s.hc / 2, s.zn, R * 1.1), { color: C.h, cls: 'val big', doc: '계산고도·계산방위각', dx: -34 }, g);
        api.label('Zn ' + znStr(s.zn), hz(0, s.zn * 0.85, R * 0.78), { color: C.zn, cls: 'val big', doc: '계산고도·계산방위각' }, g);
      });
      // ── 지문삼각형: 지구 위의 P, AP, GP
      api.dyn('terr', Cg, (g, p) => {
        const v = V(p), s = solve(p), N = p.lat >= 0;
        const eg = new THREE.Group(); eg.rotation.y = -p.lon * D; g.add(eg);   // 그리니치 자오선이 관측자 자오선에서 서쪽으로 λ(동경) 만큼
        api.earth(RE, { opacity: 0.97 }, eg);
        api.curve((q) => eqHA(0, -90 + 180 * q, RE * 1.012), 0, 1, 60, { color: COLORS.greenwich, tube: 0.035 }, eg);
        api.label('G', eqHA(0, -12, RE * 1.06), { color: COLORS.greenwich, cls: 'small', fade: true }, eg);
        const P = v.pe.clone().setLength(RE), AP = v.z.clone().setLength(RE), GP = v.m.clone().setLength(RE);
        [[v.pe, P], [v.z, AP], [v.m, GP]].forEach(([sky, e]) => api.line(e, sky, { color: 0xc9d6e8, opacity: 0.55, dashed: true }, g));
        const r1 = RE * 1.015;
        arc(P, AP, { color: C.side1, tube: 0.06, r: r1 }, g);
        arc(P, GP, { color: C.side2, tube: 0.06, r: r1 }, g);
        arc(AP, GP, { color: C.side3, tube: 0.06, r: r1 }, g);
        if (!degenerate(p)) {
          triFill(P, AP, GP, RE * 1.01, C.fill, 0.22, g);
          api.angleMark(P.clone().setLength(r1), AP, GP, { color: C.t, size: 0.9, tube: 0.045 }, g);
          api.label('t', bis(P.clone().setLength(r1), AP, GP, 1.5), { color: C.t, cls: 'val small', doc: '지방시각·자오선각' }, g);
        }
        [[P, COLORS.equator], [AP, COLORS.white], [GP, COLORS.star]].forEach(([e, c]) => api.dot(e.clone().setLength(r1), { color: c, size: 0.17 }, g));
        const lab = (a, b, t, c, dx, dy) => api.label(t, a.clone().normalize().add(b.clone().normalize()).normalize().multiplyScalar(RE * 1.1), { color: c, cls: 'val small', dx, dy }, g);
        lab(P, AP, '90° − L', C.side1, -26, -4);
        lab(P, GP, '90° ∓ d', C.side2, 0, 12);
        lab(AP, GP, '90° − Hc', C.side3, 34, 0);
        const gha = norm(p.lha - p.lon), gpLon = gha <= 180 ? gha.toFixed(1) + '°W' : (360 - gha).toFixed(1) + '°E';
        api.label(N ? 'P 북극' : 'P 남극', P.clone().multiplyScalar(1.13), { color: COLORS.equator, cls: 'small', dx: -34 }, g);
        api.label('AP 가정위치 ' + latStr(p.lat) + ' ' + lonStr(p.lon), AP.clone().multiplyScalar(1.12), { color: COLORS.white, cls: 'small', doc: '가정위치', dx: 70 }, g);
        api.label('GP 지위 ' + latStr(p.dec) + ' ' + gpLon, GP.clone().multiplyScalar(1.12), { color: COLORS.star, cls: 'small', doc: '천체의 지위', dx: 76, dy: 14 }, g);
      });
      // 다시 그릴 때 이전 면 기하 정리
      const prevBuild = [];
      api.dyn('_gc', Cg, () => { while (prevBuild.length) { const o = prevBuild.pop(); o.dispose && o.dispose(); } prevBuild.push(...own.splice(0)); });
    },
    readout(p, api) {
      const s = solve(p);
      const gha = norm(p.lha - p.lon);
      const gpLon = gha <= 180 ? api.fmtDM(gha) + 'W' : api.fmtDM(360 - gha) + 'E';
      const rows = [
        ['위도 L · 적위 d', api.fmtDM(s.L) + (p.lat >= 0 ? 'N' : 'S') + ' · ' + api.fmtDM(Math.abs(p.dec)) + (p.dec >= 0 ? 'N' : 'S')],
        ['LHA → 자오선각 t', api.fmtDM(norm(p.lha)) + ' → ' + api.fmtDM(s.t) + (s.sd === 'M' ? '' : ' ' + s.sd)],
        ['여위도 90° − L', api.fmtDM(90 - s.L)], ['극거 p = 90° ∓ d', api.fmtDM(90 - s.dS)],
        ['계산고도 Hc', api.fmtDM(s.hc)], ['정거 90° − Hc', api.fmtDM(90 - s.hc)],
        ['계산방위각 Z', s.zStr], ['방위 Zn', znStr(s.zn)], ['위치각 X', dot1(s.x)],
        ['GHA = LHA ∓ λ', api.fmtDM(gha)], ['GP (지위)', api.fmtDM(Math.abs(p.dec)) + (p.dec >= 0 ? 'N' : 'S') + ' ' + gpLon],
        'sin Hc = sin L·sin d + cos L·cos d·cos t  (8.4)',
        '= sin ' + nf(s.L) + '°·sin ' + nf(s.dS) + '° + cos ' + nf(s.L) + '°·cos ' + nf(s.dS) + '°·cos ' + nf(s.t) + '° → Hc = ' + api.fmtDM(s.hc),
        'cos Z = (sin d − sin L·sin Hc) / (cos L·cos Hc) → Z = ' + s.zStr,
        s.sd === 'M' ? 'Zn = ' + znStr(s.zn) + ' (자오선 위)' : (s.N ? (s.sd === 'W' ? 'Zn = 360° − Z = ' : 'Zn = Z = ') : (s.sd === 'W' ? 'Zn = 180° + Z = ' : 'Zn = 180° − Z = ')) + znStr(s.zn)
      ];
      return rows;
    }
  });
})();

/* 장면 8 — 고도 개정: Sextant 고도 hs → ±IC → −D → −R → ±SD → +P → 관측고도 Ho
 * 교재 2장 그림 2.14(64쪽)·식 (2.20)–(2.25)(65–69쪽), 그림 1.15(14쪽), 그림 2.10(56쪽).
 * 지구 단면을 옆에서 본 그림이다(api.world 의 z = 0 평면, +y = 천정 쪽, 천체는 +x 쪽).
 * 개정각은 분(′) 단위라 실제 크기로는 보이지 않으므로 '과장 보기'에서는 각마다 다른 배율로 키워 그린다.
 */
(function () {
  'use strict';
  const BODY = ['태양 하변', '태양 상변', '항성', '달 하변'];
  const SUN_HP = 8.8 / 60;          // 태양 평균적도수평시차 8″.80 = 0′.147 (교재 59·65쪽)
  const SD_SUMMER = 15.9, SD_WINTER = 16.15; // 태양고도개정표 채택 SD (교재 65쪽)
  const J_UL = 1.2;                 // 상변 관측 광삼 개정 (−)1′.2 (교재 65–66쪽)
  const MOON_K = 0.2724;            // 달 SD ≈ 0.2724 × HP (교재 밖 보충: 달 반지름/지구 반지름)
  const AUG = [[0, 0], [10, 0.04], [20, 0.09], [30, 0.13], [40, 0.17], [50, 0.20], [60, 0.22], [70, 0.24], [80, 0.25], [90, 0.26]]; // 표 2.2 (61쪽)

  // ---- 그림 비율 (과장 보기) ----
  const ER = 3;                     // 그림의 지구 반지름
  const ATM = 1.4;                  // 그림의 대기 두께
  const KL = 0.35;                  // 지상기차로 휜 빛의 곡률 ÷ 지구 곡률 (과장). 실제는 약 0.17: √(1−0.17) ≈ 0.91 = 1.757/1.926 (실제/기하학적 안고차)
  const X = { dip: 2.5, ic: 1.5, r: 2.5, sd: 0.5 }; // 과장 배율: D·IC·SD 는 1′ 당 도(°), R 은 2.5°×√R′
  const DIST = [16, 16, 0, 9.5];    // 그림에서 지구 중심 ~ 천체 거리 (항성은 무한대)
  const COL = { hs: 0xff9f5a, ic: 0xe6edf7, dip: 0x7fd18b, r: 0x7fe3ff, sd: 0xffc94a, p: 0xb69cff, ho: 0xff5d8f, sea: 0x5fa8e6, atm: 0x6fb6ff, hz: 0x7fd18b, muted: 0x9fb3cc, light: 0xfff1b8 };
  const D2R = Math.PI / 180, R2D = 180 / Math.PI;

  const r1 = (x) => (x < 0 ? -1 : 1) * Math.round(Math.abs(x) * 10 + 1e-7) / 10;
  const fm = (x, plus) => (Math.abs(x) < 0.05 ? '' : x < 0 ? '−' : (plus ? '+' : '')) + Math.abs(x).toFixed(1).replace('.', '′.');   // 6′.1
  const fmIC = (v) => (Math.abs(v) < 0.05 ? '0′.0' : (v < 0 ? '(−)' : '(+)') + Math.abs(v).toFixed(1).replace('.', '′.'));
  function aug(h) {
    for (let i = 0; i < AUG.length - 1; i++) {
      const a = AUG[i], b = AUG[i + 1];
      if (h <= b[0]) return a[1] + (b[1] - a[1]) * Math.max(0, h - a[0]) / (b[0] - a[0]);
    }
    return 0.26;
  }
  const refr = (h) => { const t = Math.tan((90 - h) * D2R); return (58.294 * t - 0.067 * t * t * t) / 60; }; // 식 (2.7), ′

  // 교재 순서대로 개정치(0′.1로 반올림)와 누적 고도를 계산한다.
  function calc(p) {
    const b = Math.round(p.body), sun = b === 0 || b === 1;
    const hs = p.hs, ic = r1(p.ic);
    const dRaw = 0.97 * Math.sqrt(p.he / 0.3048), d = r1(dRaw);       // 식 (2.13), h 는 ft
    const ha = hs + (ic - d) / 60;                                      // 겉보기고도 (R 을 찾는 고도)
    const R = r1(refr(ha)), hR = ha - R / 60;
    let sdRaw = 0, a = 0, sd = 0, j = 0, hp = 0;
    if (sun) { sdRaw = p.sdw ? SD_WINTER : SD_SUMMER; sd = (b === 0 ? 1 : -1) * r1(sdRaw); if (b === 1) j = -J_UL; hp = SUN_HP; }
    else if (b === 3) { hp = p.hp; sdRaw = MOON_K * hp; a = aug(hR); sd = r1(sdRaw + a); }
    const hC = hR + sd / 60;                                            // 중심의 (기차 뺀) 겉보기고도
    const P = r1(hp * Math.cos(hC * D2R));                              // 식 (2.19)
    const h1 = hs + ic / 60, h2 = h1 - d / 60, h3 = h2 - R / 60, h4 = h3 + (sd + j) / 60, Ho = h4 + P / 60;
    return { b, sun, hs, ic, d, dRaw, ha, R, sd, sdRaw, a, j, hp, P, h1, h2, h3, h4, Ho, hC };
  }

  // 그림에 쓸 각(도)과 위치
  function geom(p, c, THREE) {
    const V = (x, y) => new THREE.Vector3(x, y, 0);
    const ex = !!p.exag, g = { ex };
    if (ex) {
      g.Dd = X.dip * c.d;
      const rho = ER / KL, D = g.Dd * D2R;
      g.h = rho * Math.cos(D) - Math.sqrt(Math.pow(rho - ER, 2) - Math.pow(rho * Math.sin(D), 2)) - ER;
      g.ic = X.ic * c.ic; g.R = X.r * Math.sqrt(c.R); g.sd = X.sd * Math.abs(c.sd);
      g.rho = rho;
    } else {
      g.Dd = c.d / 60; g.h = 0; g.ic = c.ic / 60; g.R = c.R / 60; g.sd = Math.abs(c.sd) / 60;
    }
    g.O = V(0, ER + g.h); g.A = V(0, ER); g.C = V(0, 0);
    g.tV = -g.Dd;                    // 시수평 방향
    g.tL1 = c.ha;                    // 겉보기 하변(또는 상변·항성) 방향 = 시선
    g.tRead = g.tL1 - g.ic;          // 눈금이 가리키는 방향 (IC 포함)
    g.tL = g.tL1 - g.R;              // 기차를 뺀 방향
    const s = c.b === 1 ? -1 : (c.b === 2 ? 0 : 1);
    g.s = s;
    g.tM = g.tL + s * g.sd;          // 중심 방향 (O 에서)
    g.tM1 = g.tL1 + s * g.sd;        // 겉보기 상 M′ 중심 방향
    const Oh = ER + g.h;
    if (!ex || c.b === 2) {
      g.far = true; g.P = ex ? 0 : c.P / 60; g.d = 14;
    } else {
      const DM = DIST[c.b], sn = Math.sin(g.tM * D2R);
      g.d = -Oh * sn + Math.sqrt(Oh * Oh * sn * sn - Oh * Oh + DM * DM);
      g.P = Math.asin(Oh * Math.cos(g.tM * D2R) / DM) * R2D;
    }
    g.tHo = g.tM + g.P;
    const u = (deg) => V(Math.cos(deg * D2R), Math.sin(deg * D2R));
    g.u = u; g.at = (o, deg, len) => o.clone().add(u(deg).multiplyScalar(len));
    g.M = g.at(g.O, g.tM, g.d); g.M1 = g.at(g.O, g.tM1, g.d);
    g.rad = g.far ? 0 : g.d * Math.sin(g.sd * D2R);
    const dl = g.far ? g.d : Math.sqrt(g.d * g.d - g.rad * g.rad);
    g.L = g.at(g.O, g.tL, dl); g.L1 = g.at(g.O, g.tL1, dl);
    // 기하학적 수평 접점 T, 실제 수평선 B (그림 2.10)
    g.Dg = Math.acos(ER / Oh) * R2D;
    g.T = V(ER * Math.sin(g.Dg * D2R), ER * Math.cos(g.Dg * D2R));
    if (ex) {
      const D = g.Dd * D2R;
      g.K = V(-g.rho * Math.sin(D), Oh - g.rho * Math.cos(D));
      const kc = g.K.length();
      g.B = g.K.clone().add(g.K.clone().multiplyScalar(-g.rho / kc));
      g.aO = Math.atan2(g.O.y - g.K.y, g.O.x - g.K.x); g.aB = Math.atan2(g.B.y - g.K.y, g.B.x - g.K.x);
    }
    return g;
  }

      '겉보기반지름': 5, '시차·수평시차': 6, '겉보기위치·진위치': 6, '태양의 고도개정': 6, '항성·행성의 고도개정': 7, '달의 고도개정': 8

    build(api, p) {
      const { THREE, COLORS } = api;
      const W = api.world;
      const V = (x, y, z) => new THREE.Vector3(x, y, z || 0);
      const S = { fine: { hz: [], dip: [] }, eye: { hs: [], hz: [], dip: [] }, coarse: [], O: V(0, ER) };
      // 눈 근처 세부 라벨(T, B, HE …)은 카메라가 가까울 때만, hs 호처럼 큰 표시는 아주 가까우면 숨긴다
      api.scene.onBeforeRender = (r, s, cam) => {
        const dist = cam.position.distanceTo(S.O), near = dist < 16, veryNear = dist < 7;
        S.fine.hz.concat(S.fine.dip).forEach((l) => { l.visible = near; });
        S.coarse.forEach((o) => { o.visible = !veryNear; });
        S.eye.hs.concat(S.eye.hz, S.eye.dip).forEach((l) => { l.visible = veryNear; });
      };
      const G = (p) => { const c = calc(p); return { c, g: geom(p, c, THREE) }; };
      const wedge = (o, a0, a1, rad, color, g, tube) =>
        api.curve((s) => o.clone().add(V(Math.cos((a0 + (a1 - a0) * s) * api.D2R), Math.sin((a0 + (a1 - a0) * s) * api.D2R)).multiplyScalar(rad)),
          0, 1, Math.max(10, Math.ceil(Math.abs(a1 - a0) * 1.5)), { color, tube: tube == null ? 0.05 : tube }, g);
      const circle = (c, r, opts, g) => api.curve((s) => V(c.x + r * Math.cos(s), c.y + r * Math.sin(s), c.z || 0), 0, Math.PI * 2, 96, opts, g);
      const arrow = (pos, deg, size, color, g) => {
        [150, -150].forEach((da) => {
          const a = (deg + da) * api.D2R;
          api.line(pos, V(pos.x + size * Math.cos(a), pos.y + size * Math.sin(a)), { color }, g);
        });
      };
      const lab = (t, pos, o, g) => api.label(t, pos, Object.assign({ fade: false }, o), g);

      // 0. 바탕: 지구 단면, 중심 C, 천정 방향
      api.dyn('base', W, (g, p) => {
        const { g: q } = G(p);
        const earth = api.disk(V(0, 0, 1), { r: ER, color: COLORS.earth, opacity: 0.45 }, g); earth.renderOrder = -1;
        circle(V(0, 0), ER, { color: COL.sea, opacity: 0.9 }, g);
        api.dot(q.C, { color: COLORS.white, size: 0.09 }, g);
        lab('C 지구 중심', V(0, 0), { cls: 'small', color: 0xdbe6f5, dy: 16 }, g);
        api.line(V(0, ER + q.h), V(0, 10.5), { color: COLORS.muted, dashed: true, opacity: 0.7 }, g);
        lab('Z 천정', V(0, 10.9), { cls: 'small', color: 0x9fb3cc, doc: '천정·천저' }, g);
        api.dot(q.O, { color: COLORS.white, size: 0.06 }, g);
        lab('O 눈', q.O, { color: 0xffffff, dx: -24, dy: -16 }, g);
        lab('해면', V(-2.55, 1.15), { cls: 'small', color: COL.sea }, g);
      });

      // 1. 시수평·거소수평, 시선, 보이는 상 M′, hs 호
      api.dyn('hs', W, (g, p) => {
        const { c, g: q } = G(p);
        const O = q.O;
        api.line(V(-3.6, O.y), V(q.ex ? 14.5 : 18, O.y), { color: COL.hz, opacity: 0.85 }, g);

        // 시선 (O → 겉보기 하변 L′)
        api.line(O, q.ex && !q.far ? q.L1 : q.at(O, q.tL1, 20), { color: COLORS.white, opacity: 0.9 }, g);

        }

        S.coarse = [];

        S.coarse.push(lab('hs ' + api.fmtDM(c.hs), q.at(O, mid, 3.2), { cls: 'val', color: COL.hs, doc: 'Sextant 고도·관측고도' }, g));
      });

      // 2. IC: 눈금 방향 → 실제 시선
      api.dyn('ic', W, (g, p) => {
        const { c, g: q } = G(p);

        api.line(O, q.at(O, q.tRead, rr + 1.2), { color: COL.ic, dashed: true, opacity: 0.8 }, g);
        if (q.ex && Math.abs(c.ic) > 0.05) {

          lab('IC ' + fmIC(c.ic), q.at(O, Math.max(q.tRead, q.tL1) + 6, rr + 0.2), { cls: 'small val', color: COL.ic, doc: '육분의 오차·기차개정' }, g);
        } else {
          lab(Math.abs(c.ic) > 0.05 ? 'IC ' + fmIC(c.ic) + ' (눈금 방향)' : 'IC 0 (눈금 = 시선)', q.at(O, q.tRead + 5, rr + 0.3), { cls: 'small val', color: COL.ic, doc: '육분의 오차·기차개정' }, g);
        }
      });

      // 3. 진수평 (C 를 지남)
      api.dyn('trueH', W, (g, p) => {
        const { g: q } = G(p);
        api.line(V(-3.6, 0), V(q.ex ? 14.5 : 18, 0), { color: COL.hz, opacity: 0.85 }, g);

      });

      api.dyn('note', W, (g, p) => {
        if (p.exag) return;
        lab('실제 크기: 개정각이 모두 1°보다 작아 O에서 나간 선들이 겹친다', V(9.5, 1.5), { cls: 'small', color: 0xffe28a }, g);
      });
    },

    readout(p, api) {
      const c = calc(p);
      const to = (x, h) => fm(x, true) + ' → ' + api.fmtDM(h);
      const rows = [
        ['hs Sextant 고도 (' + BODY[c.b] + ')', api.fmtDM(c.hs)],

  });

(function () {

  const EYE_X = 3.1;                // 망원경 접안부 x

  // ---- 반사 계산 (2차원 벡터) ----
  const v2 = (x, y) => [x, y];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
  const mul = (a, k) => [a[0] * k, a[1] * k];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
  const nrm = (a) => { const l = Math.hypot(a[0], a[1]); return [a[0] / l, a[1] / l]; };
  const rot = (a, deg) => { const c = Math.cos(deg * D2R), s = Math.sin(deg * D2R); return [a[0] * c - a[1] * s, a[0] * s + a[1] * c]; };

      { title: 'θ 돌리면 2θ', text: '시표간과 동경을 θ만큼 돌리면 두 번 반사한 빛의 방향은 <b>2θ</b>만큼 바뀐다. 그래서 수평선과 천체 사이의 각(측정각)은 두 거울이 이루는 각 θ의 2배다. 반사 법칙으로 계산한 편향각을 수치 패널에서 확인할 수 있다.',
        add: ['angles'], remove: ['parallel'], set: { alt: 50 }, cam: 'front' },
      { title: '호의 눈금은 2배 값', text: '호의 실제 각은 약 70°지만 눈금은 그 2배인 140°까지 매겨져 있다. 본호의 <b>2°</b>가 실각 <b>1°</b>다. 0의 오른쪽으로 몇 도 더 새긴 부분이 여호(Off the arc)다.',
        add: ['arcinfo'], remove: ['parallel', 'angles'], set: { alt: 50 }, cam: 'front' },
      { title: '도수 읽기: 29°42′.5', text: '시표간 화살표가 29와 30 사이에 있으므로 본호에서 <b>29°</b>를 읽는다. Micrometer에서 Vernier의 0이 42′과 43′ 사이에 있고 Vernier 5가 Micrometer 눈금과 일치하므로 <b>42′.5</b>다. 도수는 29°42′.5다(그림 2.3).',
        add: ['dial', 'dialdyn'], remove: ['arcinfo'], set: { alt: 29 + 42.5 / 60 }, cam: 'dial' }
    ],
    focus: { '육분의': 0, '육분의 구조': 0, '측각원리': 3, '도수 읽는 법': 5 },
    explore: { cam: 'front', show: ['frame', 'arm', 'armTick', 'optics', 'names', 'armnames', 'ray', 'direct', 'angles', 'arcinfo', 'dial', 'dialdyn'] },

    build(api, p) {
      const { THREE } = api;
      const W = api.world;
      const V = (x, y, z) => new THREE.Vector3(x, y, z || 0);
      const V2 = (a, z) => V(a[0], a[1], z || 0);
      const lab = (t, pos, o, g) => api.label(t, pos, Object.assign({ fade: false }, o), g);
      const mat = (color, o) => {
        o = o || {};
        const m = new THREE.MeshLambertMaterial({ color, transparent: o.opacity != null && o.opacity < 1, opacity: o.opacity == null ? 1 : o.opacity, side: THREE.DoubleSide, depthWrite: o.opacity == null || o.opacity >= 1 });
        if (o.emissive) m.emissive = new THREE.Color(o.emissive);
        return m;
      };
      const mesh = (geo, color, o, parent) => { const m = new THREE.Mesh(geo, mat(color, o)); parent.add(m); return m; };
      const box = (w, h, d, color, o, parent) => mesh(new THREE.BoxGeometry(w, h, d), color, o, parent);
      const arcPts = (cx, cy, r, a0, a1, z, n) => { const pts = []; n = n || 64; for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * i / n) * D2R; pts.push(V(cx + r * Math.cos(a), cy + r * Math.sin(a), z || 0)); } return pts; };
      const armAt = (rd) => PHI0 - rd / 2;                  // 눈금 rd 일 때 시표간 각
      const onArc = (rd, r, z) => V(I[0] + r * Math.cos(armAt(rd) * D2R), I[1] + r * Math.sin(armAt(rd) * D2R), z || 0);

      // ---------- Frame 과 호 ----------
      const frame = api.group('frame', W);
      {
        const sh = new THREE.Shape();
        const a0 = -55 * D2R, a1 = -137 * D2R, R1 = RA + 0.55;
        sh.moveTo(I[0] + 0.9 * Math.cos(a0 + Math.PI / 2), I[1] + 0.9 * Math.sin(a0 + Math.PI / 2));
        sh.lineTo(I[0] + R1 * Math.cos(a0), I[1] + R1 * Math.sin(a0));
        sh.absarc(I[0], I[1], R1, a0, a1, true);
        sh.lineTo(I[0] + 0.9 * Math.cos(a1 - Math.PI / 2), I[1] + 0.9 * Math.sin(a1 - Math.PI / 2));
        sh.absarc(I[0], I[1], 0.9, a1 - Math.PI / 2, a0 + Math.PI / 2, true);
        [[-66, -93], [-99, -126]].forEach(([b0, b1]) => {
          const hole = new THREE.Path();
          const r0 = 2.6, r1 = RA - 1.0;
          hole.moveTo(I[0] + r0 * Math.cos(b0 * D2R), I[1] + r0 * Math.sin(b0 * D2R));
          hole.absarc(I[0], I[1], r1, b0 * D2R, b1 * D2R, true);
          hole.absarc(I[0], I[1], r0, b1 * D2R, b0 * D2R, false);
          sh.holes.push(hole);
        });
        const fm = mesh(new THREE.ShapeGeometry(sh, 32), COL.frame, { opacity: 0.55 }, frame);
        fm.position.z = -0.02; fm.renderOrder = -1;
        // 호(Arc) 띠
        const ring = mesh(new THREE.RingGeometry(RA - 0.32, RA + 0.32, 120, 1, armAt(141) * D2R, (armAt(-5.5) - armAt(141)) * D2R), COL.arc, { opacity: 0.9 }, frame);
        ring.position.set(I[0], I[1], 0.01);
        // 눈금: 5 마다 짧게, 10 마다 길게, 20 마다 숫자
        for (let rd = -5; rd <= 140; rd += 5) {
          const long = rd % 10 === 0;
          api.line(onArc(rd, RA - (long ? 0.3 : 0.05), 0.03), onArc(rd, RA + 0.3, 0.03), { color: 0x1d2a3d }, frame);
          if (rd % 20 === 0) lab(String(rd), onArc(rd, RA + 0.95), { cls: 'small val', color: COL.ink }, frame);
        }
        // 손잡이(뒷면)와 다리 표시
        api.poly(arcPts(I[0], I[1], RA + 0.55, -55, -137, 0, 80), { color: COL.edge, opacity: 0.8 }, frame);
      }

      // ---------- 시표간 (회전) ----------
      const arm = api.group('arm', W);
      const armRot = new THREE.Group(); armRot.position.set(I[0], I[1], 0); arm.add(armRot);
      {
        const L = RA + 0.75;
        const bar = box(L - 0.7, 0.42, 0.1, COL.arm, {}, armRot); bar.position.set(0.7 + (L - 0.7) / 2, 0, 0.08);
        // 화살표(지표)
        const tri = new THREE.Shape(); tri.moveTo(RA - 0.36, 0); tri.lineTo(RA - 0.62, 0.13); tri.lineTo(RA - 0.62, -0.13); tri.lineTo(RA - 0.36, 0);
        const tm = mesh(new THREE.ShapeGeometry(tri), COL.hi, {}, armRot); tm.position.z = 0.15;
        // Micrometer drum (축이 호의 접선 방향)
        const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.3, 24), mat(0x8fa3b8)); drum.position.set(RA - 1.25, 0, 0.45); armRot.add(drum);
        // 회전축
        const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.2, 24), mat(0x9fb3cc)); hub.rotation.x = Math.PI / 2; hub.position.z = 0.1; armRot.add(hub);
        // 동경 (Index mirror): 시표간 위에 서 있는 평면경
        const mg = new THREE.Group(); mg.rotation.z = ARM_MIRROR * D2R; armRot.add(mg);
        const back = box(1.7, 0.1, 1.4, 0x6c8099, {}, mg); back.position.set(0, -0.06, 0.75);
        const face = box(1.62, 0.03, 1.32, COL.mirror, { emissive: 0x1f4f6b }, mg); face.position.set(0, 0.0, 0.75);
      }
      api.dyn('armTick', W, (g, p) => { armRot.rotation.z = (PHI0 - p.alt / 2) * D2R; });

      // ---------- 수평경·망원경 (Frame 에 고정) ----------
      const optics = api.group('optics', W);
      {
        const hg = new THREE.Group(); hg.position.set(H[0], H[1], 0); hg.rotation.z = MIRROR_LINE * D2R; optics.add(hg);
        const silver = box(1.1, 0.05, 0.62, COL.mirror, { emissive: 0x1f4f6b }, hg); silver.position.z = 0.36;
        const clear = box(1.1, 0.05, 0.62, COL.glass, { opacity: 0.28 }, hg); clear.position.z = 1.02;
        const frameH = box(1.2, 0.08, 0.1, 0x34465e, {}, hg); frameH.position.z = 0.02;
        // 망원경: x 축 방향 원통
        const tel = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.36, EYE_X - (-0.9), 24, 1, true), mat(COL.scope, { opacity: 0.85 }));
        tel.rotation.z = Math.PI / 2; tel.position.set((EYE_X - 0.9) / 2, H[1], Z_TEL); optics.add(tel);
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.33, 0.04, 8, 24), mat(0xc9d6e8)); ring.rotation.y = Math.PI / 2; ring.position.set(EYE_X, H[1], Z_TEL); optics.add(ring);
        // 망원경 받침
        const post = box(0.25, 0.25, Z_TEL, 0x51657d, {}, optics); post.position.set(1.1, H[1], Z_TEL / 2);
        lab('눈 (접안부)', V(EYE_X, H[1] + 0.35, Z_TEL), { cls: 'small', color: COL.ink, dy: -12 }, optics);
      }

      // ---------- 부품 이름 ----------
      const parts = api.group('parts', W);
      lab('Frame', V(-1.2, -1.6, 0), { color: COL.edge, doc: '육분의 구조' }, parts);
      lab('호 (Arc)', onArc(128, RA - 1.2), { color: COL.arc, doc: '육분의 구조' }, parts);
      lab('수평경 (Horizon glass)', V(H[0], H[1], 0), { color: COL.glass, doc: '육분의 구조', dx: -30, dy: 26 }, parts);
      lab('망원경 (Telescope)', V(-0.9, H[1], Z_TEL + 0.3), { color: 0xc9d6e8, dx: -20, dy: -16 }, parts);
      const armparts = api.group('armparts', armRot);
      lab('동경 (Index mirror)', V(0, 0, 1.5), { color: COL.mirror, doc: '육분의 구조', dx: 40, dy: -12 }, armparts);
      lab('시표간 (Index arm)', V(RA * 0.62, 0, 0.2), { color: COL.arm, doc: '육분의 구조', dx: 64 }, armparts);
      lab('Micrometer drum', V(RA - 1.25, 0, 0.7), { cls: 'small', color: COL.ink, dx: 66, dy: 6 }, armparts);
      // 짧은 이름 (2단계부터)
      const names = api.group('names', W);
      lab('수평경', V(H[0], H[1], 1.4), { cls: 'small', color: COL.glass, doc: '육분의 구조', dx: -30, dy: -16 }, names);
      const armnames = api.group('armnames', armRot);
      lab('동경', V(0, 0, 1.5), { cls: 'small', color: COL.mirror, doc: '육분의 구조', dx: 22, dy: -14 }, armnames);
      lab('시표간', V(RA * 0.55, 0, 0.2), { cls: 'small', color: COL.arm, doc: '육분의 구조', dx: 30 }, armnames);

      // ---------- 빛의 경로 ----------
      const arrowAt = (a, b, f, color, z, g) => {
        const pa = V(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, z), dir = ang([b[0] - a[0], b[1] - a[1]]);
        [150, -150].forEach((da) => api.line(pa, V(pa.x + 0.32 * Math.cos((dir + da) * D2R), pa.y + 0.32 * Math.sin((dir + da) * D2R), z), { color }, g));
      };
      api.dyn('ray', W, (g, p) => {
        const tr = trace(p.alt);
        const S0 = add(I, mul(tr.s, p.alt <= 55 ? 6.5 : 5.2)), E = [EYE_X, tr.hit[1]];
        const col = p.alt < 0.05 ? COL.hor : COL.star;
        api.poly([V2(S0, Z_STAR), V2(I, Z_STAR), V2(tr.hit, Z_STAR), V2(E, Z_STAR)], { color: col, tube: 0.05 }, g);
        arrowAt(S0, I, 0.55, col, Z_STAR, g); arrowAt(I, tr.hit, 0.5, col, Z_STAR, g);
        if (p.alt < 0.05) lab('수평선의 빛 (이중반사)', V2(add(S0, [0.6, 0]), Z_STAR), { cls: 'small', color: COL.hor, dy: -14 }, g);
        else {
          api.dot(V2(S0, Z_STAR), { color: COL.star, size: 0.2 }, g);
          lab('★ 천체', V2(S0, Z_STAR), { color: COL.star, dx: -30, dy: -12 }, g);
        }
      });
      api.dyn('direct', W, (g, p) => {
        const E = [EYE_X, H[1]];
        api.line(V(-7.6, H[1], Z_HOR), V(E[0], H[1], Z_HOR), { color: COL.hor }, g);
        arrowAt([-7.6, H[1]], H, 0.55, COL.hor, Z_HOR, g);
        api.line(V(-7.9, H[1] - 0.25, 0), V(-5.6, H[1] - 0.25, 0), { color: 0x5fa8e6 }, g);
        lab('수평선', V(-6.7, H[1] - 0.25, 0), { color: COL.hor, dy: 13 }, g);
      });

      // ---------- 평행 (0°) ----------
      api.dyn('parallel', W, (g, p) => {
        const t = [Math.cos(MIRROR_LINE * D2R), Math.sin(MIRROR_LINE * D2R)];
        const draw = (c, color, dashed, len) => api.line(V2(add(c, mul(t, -len)), 1.45), V2(add(c, mul(t, len)), 1.45), { color, dashed, opacity: 0.9 }, g);
        draw(H, COL.muted, true, 2.4); draw(I, COL.muted, true, 2.4);
        lab(p.alt < 0.05 ? '두 거울이 평행 (눈금 0)' : '0 일 때 동경 위치 (점선)', V2(add(I, mul(t, 2.4)), 1.45), { cls: 'small', color: COL.ink, dx: 80 }, g);
      });

      // ---------- θ 와 2θ ----------
      api.dyn('angles', W, (g, p) => {
        const tr = trace(p.alt), th = tr.th;
        const t0 = MIRROR_LINE, t1 = MIRROR_LINE - th;
        // 동경 면: 0 위치(점선)와 현재 위치
        const seg = (deg, len, color, dashed, z) => api.line(V(I[0] - len * Math.cos(deg * D2R), I[1] - len * Math.sin(deg * D2R), z), V(I[0] + len * Math.cos(deg * D2R), I[1] + len * Math.sin(deg * D2R), z), { color, dashed }, g);
        seg(t0, 1.9, COL.muted, true, 1.5);
        seg(t1, 1.9, COL.mirror, false, 1.5);
        if (th > 0.3) {
          api.poly(arcPts(I[0], I[1], 1.6, t1, t0, 1.5, 24), { color: COL.theta, tube: 0.04 }, g);
          lab('θ ' + api.fmtDM(th), V(I[0] + 2.0 * Math.cos((t0 - th / 2) * D2R), I[1] + 2.0 * Math.sin((t0 - th / 2) * D2R), 1.5), { cls: 'small val', color: COL.theta, dx: 34 }, g);
          // 2θ: 수평선 방향(왼쪽)과 천체 방향 사이
          api.line(V(I[0], I[1], Z_STAR), V(I[0] - 4.2, I[1], Z_STAR), { color: COL.hor, dashed: true }, g);
          lab('수평선 방향', V(I[0] - 4.2, I[1], Z_STAR), { cls: 'small', color: COL.hor, dx: -36 }, g);
          api.poly(arcPts(I[0], I[1], 3.3, 180 - p.alt, 180, Z_STAR, 48), { color: COL.two, tube: 0.05 }, g);
          lab('2θ = ' + api.fmtDM(p.alt), V(I[0] + 3.9 * Math.cos((180 - p.alt / 2) * D2R), I[1] + 3.9 * Math.sin((180 - p.alt / 2) * D2R), Z_STAR), { cls: 'val', color: COL.two, dx: -30 }, g);
          // 시표간: 0 위치 P 와 현재 위치 F
          api.line(V(I[0], I[1], 0.2), onArc(0, RA, 0.2), { color: COL.muted, dashed: true }, g);
          lab('P (거울 평행)', onArc(0, RA - 0.5, 0.2), { cls: 'small', color: COL.muted, dx: 46, dy: -10 }, g);
          api.poly(arcPts(I[0], I[1], RA - 2.2, armAt(p.alt), armAt(0), 0.2, 32), { color: COL.theta, tube: 0.05 }, g);
          lab('θ', V(I[0] + (RA - 2.7) * Math.cos(armAt(p.alt / 2) * D2R), I[1] + (RA - 2.7) * Math.sin(armAt(p.alt / 2) * D2R), 0.2), { cls: 'small val', color: COL.theta }, g);
        }
      });

      // ---------- 호의 실각과 눈금 ----------
      api.dyn('arcinfo', W, (g, p) => {
        const th = p.alt / 2;
        if (th > 0.3) {
          api.poly(arcPts(I[0], I[1], RA, armAt(p.alt), armAt(0), 0.12, 48), { color: COL.theta, tube: 0.07 }, g);
          lab('실각 θ = ' + api.fmtDM(th), onArc(p.alt / 2, RA - 1.5, 0.2), { cls: 'small val', color: COL.theta }, g);
        }
        api.line(V(I[0], I[1], 0.2), onArc(0, RA, 0.2), { color: COL.muted, dashed: true }, g);
        lab('눈금 2θ = ' + api.fmtDM(p.alt), onArc(p.alt, RA + 1.75, 0.2), { cls: 'val', color: COL.two, dx: p.alt < 30 ? 40 : 0 }, g);
        lab('여호 (Off the arc)', onArc(-4, RA + 1.7, 0.1), { cls: 'small', color: COL.muted, doc: '도수 읽는 법', dx: 20 }, g);
        lab('본호 (On the arc)', onArc(p.alt > 85 ? 30 : 118, RA + 1.9, 0.1), { cls: 'small', color: COL.ink, doc: '도수 읽는 법', dx: p.alt > 85 ? 10 : -20 }, g);
      });

      // ---------- 도수 읽기 확대 (그림 2.3) ----------
      const dial = api.group('dial', W);
      const drumRot = new THREE.Group(); drumRot.position.set(DIAL.dc[0], DIAL.dc[1], 0.05);
      {
        const panel = new THREE.Mesh(new THREE.PlaneGeometry(7.4, 10.4), new THREE.MeshBasicMaterial({ color: 0x13233b, transparent: true, opacity: 0.92 }));
        panel.position.set(DIAL.x, -0.2, -0.1); dial.add(panel);
        api.poly([V(9.3, -5.4, -0.05), V(16.7, -5.4, -0.05), V(16.7, 5.0, -0.05), V(9.3, 5.0, -0.05), V(9.3, -5.4, -0.05)], { color: COL.edge, opacity: 0.6 }, dial);
        // 본호 띠
        const strip = new THREE.Mesh(new THREE.PlaneGeometry(6.2, 0.75), new THREE.MeshBasicMaterial({ color: COL.arc }));
        strip.position.set(DIAL.x, DIAL.strip + 0.12, 0); dial.add(strip);
        const tri = new THREE.Shape(); tri.moveTo(0, 0); tri.lineTo(-0.16, -0.32); tri.lineTo(0.16, -0.32); tri.lineTo(0, 0);
        const tm = new THREE.Mesh(new THREE.ShapeGeometry(tri), new THREE.MeshBasicMaterial({ color: COL.hi }));
        tm.position.set(DIAL.x, DIAL.strip - 0.28, 0.02); dial.add(tm);
        lab('시표간 화살표', V(DIAL.x, DIAL.strip - 0.6, 0), { cls: 'small', color: COL.hi }, dial);
        lab('본호 확대 (1° 눈금, 왼쪽으로 커진다)', V(DIAL.x, DIAL.strip + 1.55, 0), { cls: 'small', color: COL.ink, doc: '도수 읽는 법' }, dial);
        // Micrometer drum: 60 눈금, 1 회전 = 1°
        const face = api.disk(V(0, 0, 1), { r: DIAL.rd + 0.05, color: COL.drum, opacity: 1, center: V(DIAL.dc[0], DIAL.dc[1], 0.02) }, dial);
        face.renderOrder = 1;
        api.poly(arcPts(DIAL.dc[0], DIAL.dc[1], DIAL.rd, 0, 360, 0.06, 120), { color: COL.edge }, dial);
        dial.add(drumRot);
        for (let j = 0; j < 60; j++) {
          const a = j * 6 * D2R, l = j % 5 === 0 ? 0.42 : 0.24;
          api.line(V((DIAL.rd - l) * Math.cos(a), (DIAL.rd - l) * Math.sin(a), 0.03), V(DIAL.rd * Math.cos(a), DIAL.rd * Math.sin(a), 0.03), { color: COL.ink }, drumRot);
          if (j % 5 === 0) lab(String(j), V((DIAL.rd - 0.75) * Math.cos(a), (DIAL.rd - 0.75) * Math.sin(a), 0.03), { cls: 'small val', color: COL.ink }, drumRot);
        }
        lab('Micrometer drum (60눈금 = 1°)', V(DIAL.dc[0], DIAL.dc[1] - DIAL.rd - 0.45, 0), { cls: 'small', color: COL.ink }, dial);
        // Vernier: 10 칸이 drum 9 칸 (0′.1 읽기)
        for (let k = 0; k <= 10; k++) {
          const a = k * 5.4 * D2R, l = k % 5 === 0 ? 0.45 : 0.28;
          api.line(V(DIAL.dc[0] + (DIAL.rd + 0.04) * Math.cos(a), DIAL.dc[1] + (DIAL.rd + 0.04) * Math.sin(a), 0.05), V(DIAL.dc[0] + (DIAL.rd + 0.04 + l) * Math.cos(a), DIAL.dc[1] + (DIAL.rd + 0.04 + l) * Math.sin(a), 0.05), { color: 0xffd36b }, dial);
          if (k % 5 === 0) lab(String(k), V(DIAL.dc[0] + (DIAL.rd + 0.8) * Math.cos(a), DIAL.dc[1] + (DIAL.rd + 0.8) * Math.sin(a), 0.05), { cls: 'small val', color: 0xffd36b }, dial);
        }
        lab('Vernier', V(DIAL.dc[0] + DIAL.rd + 0.9, DIAL.dc[1] - 0.55, 0.05), { cls: 'small', color: 0xffd36b }, dial);
      }
      api.dyn('dialdyn', W, (g, p) => {
        const r = reading(p.alt);
        drumRot.rotation.z = -r.m * 6 * D2R;
        // 본호 띠의 1° 눈금 (시표간 화살표는 고정, 숫자는 왼쪽으로 커진다)
        const pos = r.d + r.m / 60;
