1쪽 ‘초(″)에 대한 개정이 필요 없으므로 분(′)에 대한 개정만으로 충분’의 초·분을 각도가 아닌 관측 시각의 초(s)·분(m)으로 풀어 썼다. 개정량 자체는 0′.1 단위로 읽는다.","fn":2},{"kind":"계산 확인","text":"교재 31쪽 56분 08초(= 56.133분)의 증분: 15°×56.133/60 = 14°02′.00, 15°02′.46×56.133/60 = 14°04′.30, 14°19′.0×56.133/60 = 13°23′.64 → 13°23′.6. 세 값 모두 재계산 일치."}]},{"title":"v·d 값","easy":["[[증분 및 개정표]]는 천체마다 정해 둔 ‘기준 빠르기’로 만든 표다. 태양·행성은 1시간에 15°, 달은 14°19′.0이 기준이다. 그런데 실제 천체는 기준보다 조금 더 빨리 돌 때가 많다.","그 ‘1시간에 기준보다 더 간 각’이 **v**다. 또 천체는 남북으로도 조금씩 움직이는데, 1시간에 적위가 바뀌는 양이 **d**다. 둘 다 분(′) 단위로 적는다.","예를 들어 2019년 1월 1일 13시의 달은 v가 12′.1이었다. 34분 뒤에 관측했다면 기준표로 구한 GHA에 7′.0을 더 보태야 한다. 이것을 빼먹으면 위치가 몇 해리나 어긋난다.[4]"],"definition":"v는 천체의 GHA가 1시간에 변하는 양이 증분표의 기준량보다 얼마나 많은지(과잉량)를, d는 1시간 동안 적위(Declination)가 변하는 평균량을 분(′) 단위로 나타낸 값이다(v, d).[1]","terms":[{"ko":"v","en":"v","plain":"GHA의 시간당 변화가 기준보다 많은 몫"},{"ko":"d","en":"d","plain":"적위의 시간당 평균 변화량"},{"ko":"v·d 개정량","en":"v or d Correction","abbr":"v or d Corr.","plain":"v·d를 관측 분(m)에 맞게 비례로 줄인 값"},{"ko":"[[증분 및 개정표]]","en":"Increments and Corrections","plain":"v·d 개정량을 찾는 표"}],"why":"행성과 달은 v를 빼면 GHA가 수 분씩 틀리고, d를 빼면 Dec가 틀린다. 두 값은 그대로 [[계산고도·계산방위각|계산고도]]에 들어가므로, 빠뜨리면 위치선이 그만큼 밀려난다. 그래서 천측력을 찾을 때 v·d를 함께 적어 두는 것이 습관이 되어야 한다.","body":["증분 및 개정표는 천체마다 정해 둔 기준량(태양·행성 15°/h, 달 14°19′.0/h)으로 만들어졌다. 실제 GHA의 변화량은 기준량과 조금씩 다르므로, 그 차이를 v로 주고 개정표에서 개정량을 찾아 더한다.[1][2] 달의 기준량 14°19′.0은 달의 GHA가 가장 느리게 늘 때의 값이어서, 달의 v는 언제나 +가 된다.[7]",{"list":["행성: [[주표]] 왼쪽 페이지 각 행성 란 맨 아래에 v와 d","태양: SUN 란 맨 아래에 d만 있다. GHA가 거의 정확히 15°/h로 변해 v가 필요 없다.","달: 겉보기운동이 빨라 매시간마다 v와 d가 있다.","춘분점: v 개정이 필요 없다."]},"부호 규칙은 다음과 같다.[1][3]",{"list":["v: 특별히 ‘−’ 부호가 붙은 경우를 빼고는 항상 +다. −는 금성에서만 생기며, 이때는 v 개정량을 GHA에서 뺀다.","d: 시간이 지나며 적위가 증가하고 있으면 +, 감소하고 있으면 −를 붙인다. 표에는 d의 부호가 인쇄되어 있지 않으므로, 앞뒤 시각의 Dec를 비교해 관측자가 정한다.[7]"]},"개정량은 증분 및 개정표 오른쪽 ‘v or d Corr.’에서 관측한 분(m)의 표를 펴고 v·d 값으로 찾는다. 이 개정량은 아래 식을 반올림한 값과 같다.[5]",{"formula":"개정량 = v(또는 d) × (분 + 0.5) ÷ 60"},"여기서 v(또는 d)는 주표의 1시간당 값이고, (분 + 0.5)는 그 분(m)의 표가 대표하는 시간이다. 1시간 변화량을 지난 시간의 비율만큼 줄이는 셈이다.",{"table":{"head":["순서","계산","값"],"rows":[["① 주표 값","13h 행의 v, d","v 12′.1, d 9′.6"],["② 개정표","34m 표를 편다","—"],["③ v 개정량","12′.1 × 34.5 ÷ 60 = 6′.96","7′.0"],["④ d 개정량","9′.6 × 34.5 ÷ 60 = 5′.52","5′.5"]]},"caption":"교재 33쪽 달 예제(GMT 13-34-42)의 v·d 개정량"}],"confusions":"이 d는 적위 자체를 나타내는 기호 d(예: [[극거]] p = 90° ± d)와 다르다. 또 ‘적위 증가·감소’는 N·S와 관계없이 적위의 크기가 커지느냐 작아지느냐다. 교재 태양 예제에서 S22°56′.3에 d (−)0′.2를 적용해 S22°56′.2가 된다.[6]","key":["v = GHA 시간당 변화량 − 기준량 (과잉량, ′)","d = 적위의 시간당 평균변화량 (′)","v는 금성만 − 가능, 나머지는 항상 +","d 부호: 적위가 커지면 +, 작아지면 −"],"footnotes":["교재 29쪽.","교재 30–31쪽.","교재 31–33쪽.","교재 33쪽 예제.","교재 밖 보충 설명. 교재 32–33쪽 세 예제의 v·d 개정량(0′.1, 7′.0, 5′.5, 0′.3)을 이 식으로 다시 계산하면 모두 일치한다. 금성의 v가 −가 될 수 있는 것은 금성이 천구 위를 동쪽으로 태양보다 빨리 움직이는 때가 있어 GHA의 시간당 변화량이 15°보다 작아지기 때문이다.","교재 32쪽 예제.","교재 밖 보충 설명. Bowditch는 v를 ‘1시간 동안 실제 GHA 변화와 일정한 값의 차’로, d를 ‘1시간 동안의 적위 변화’로 정의한다. 달의 GHA 표는 달의 GHA가 가장 느리게 느는 빠르기 14°19′.0/h를 바탕으로 하고, 목록 천체 가운데 v가 −가 되는 것은 금성뿐이며, d에는 부호가 인쇄되지 않아 표를 살펴 가감을 정한다고 설명한다. 참고: [Bowditch, The American Practical Navigator (2017), Chapter 17 The Almanacs](https://thenauticalalmanac.com/2017_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2017-%20The%20Almanacs.pdf)."],"flags":[{"kind":"교재 밖","text":"개정량이 v(d)×(분+0.5)÷60의 반올림과 같다는 점(교재 예제로 확인)과, 금성의 v가 −가 되는 이유를 덧붙였다.","fn":5},{"kind":"해석","text":"‘적위가 증가/감소’를 N·S와 무관한 적위 크기의 증감으로 해석했다. 교재 32쪽 태양 예제(S22°56′.3, d −0′.2 → S22°56′.2)와 33쪽 달·금성 예제가 모두 이 해석과 맞는다.","fn":6},{"kind":"교재 밖","text":"Bowditch를 근거로, 달의 기준량 14°19′.0/h가 달의 최소 GHA 변화율이라 v가 늘 +라는 점과, 천측력 표에는 d의 부호가 인쇄되지 않아 앞뒤 Dec를 비교해 정한다는 점을 덧붙였다. 교재의 부호 규칙(증가 +, 감소 −)과 어긋나지 않는다.","fn":7}]},{"title":"주표의 정밀도","easy":["자로 길이를 재면 마지막 눈금 아래는 버리게 된다. 천측력의 값도 0′.1 단위로 끊어 적기 때문에 아주 작은 오차가 있다. 이 오차가 얼마나 되는지 정리한 것이 **주표의 정밀도**(Accuracy of the daily pages)다.","정각 값 하나의 오차는 대개 0′.1 이하다. 하지만 정각 사이 시각의 값은 증분과 개정량을 더해 만들므로 오차가 조금 쌓인다. 그래서 0′.2, 달은 0′.3까지 커질 수 있다.","각 1′은 지구 위에서 약 1해리(1852 m)다. 그러니 0′.3의 오차는 위치로 많아야 550 m쯤이다. 숙련자가 육분의로 잴 때의 오차 0′.5보다 작다.[2][3]"],"definition":"천측력에 실린 표 값은 대개 0′.1 이하의 오차를 갖지만, 정시 사이 시각의 본초시각(GHA)과 적위(Dec)는 보간(Interpolation) 과정 때문에 정확도(Accuracy)가 더 떨어진다.[1]","terms":[{"ko":"주표의 정밀도","en":"Accuracy of the daily pages","plain":"천측력 값에 들어 있는 오차의 크기"},{"ko":"보간","en":"Interpolation","plain":"정각 값 사이를 비례로 채우는 일"},{"ko":"해리","en":"Nautical mile","abbr":"NM","plain":"각 1′에 해당하는 거리, 1852 m"},{"ko":"[[안고차]]","en":"Dip","plain":"눈높이 때문에 수평선이 내려 보이는 각"},{"ko":"[[천문기차·평균기차|굴절]]","en":"Refraction","plain":"대기에서 빛이 꺾여 천체가 높아 보이는 양"}],"why":"천측 위치는 여러 오차가 겹친 결과다. 천측력의 오차는 0′.1~0′.3 정도로, 관측 오차(숙련자 0′.5)보다 작다. 그래서 천측력을 더 정밀하게 만들어도 위치가 그만큼 정확해지지는 않는다.[4] 위치선이 크게 어긋나면 표보다 관측과 시각부터 의심한다.","body":["정시 사이 시각의 값이 덜 정확한 이유는 두 가지다. 내삽 과정에서 두 개의 값이 더해지고, v와 d의 개정이 분 단위로 주어진 표의 평균값에 기초하기 때문이다.[1]",{"table":{"head":["구분","최대오차"],"rows":[["표 값 자체","대개 0′.1 이하"],["보간한 GHA·Dec (태양·달 제외)","0′.2 이하"],["태양의 GHA","0′.25까지"],["달의 GHA","0′.3까지"]]},"caption":"교재 31쪽"},"실제로 천측력 자료 중 약 1/3이 0′.05 이상의 오차를 갖고, 0′.1 이상의 오차를 갖는 자료는 약 1/10 이하로 본다.[1]","고도개정도 0′.1까지 계산한 표 값 몇 개를 더해 얻으므로 오차의 크기가 GHA·Dec와 비슷하다. 다만 저고도에서는 극단적인 대기 상태일 때 [[안고차]]와 굴절([[천문기차·평균기차]])의 실제 값이 표의 평균치와 다를 수 있다.[1]",{"table":{"head":["순서","계산","값"],"rows":[["① 가장 큰 표 오차","달의 GHA","0′.3"],["② 거리로 바꾸기","0′.3 × 1해리","약 0.3해리"],["③ 미터로","0.3 × 1852 m","약 556 m"],["④ 비교","숙련자 관측 정밀도","0′.5 ≈ 0.5해리"]]},"caption":"오차를 거리로 가늠하기"}],"confusions":"각의 1′은 지구 표면에서 약 1해리에 해당하므로, 0′.3의 오차는 위치로 많아야 약 0.3해리다(GHA의 오차는 적위가 클수록 실제 거리가 줄어든다).[2] 숙련자의 고도 측정 정밀도가 0′.5 정도이므로([[고도측정법]]), 이와 견주어 크기를 가늠할 수 있다.[3]","key":["표 값 오차: 대개 0′.1 이하","보간 GHA·Dec 최대오차 0′.2 (태양 GHA 0′.25, 달 GHA 0′.3)","약 1/3이 0′.05 이상, 0′.1 이상은 약 1/10 이하","저고도: 극단적 대기에서 안고차·굴절이 표와 다를 수 있다"],"footnotes":["교재 31쪽.","교재 밖 보충 설명. 1해리는 지구 위 대권의 각 1′에 해당하는 길이로, 지금은 정확히 1852 m로 정한다. 참고: [Nautical mile — Wikipedia](https://en.wikipedia.org/wiki/Nautical_mile).","교재 43쪽.","교재 밖 보충 설명. Bowditch는 천측력 값이 0′.1 단위로 실려 있으며, 천측력을 더 정밀하게 만들어도 그만큼 더 정확한 선위가 나오지는 않는다고 설명한다. 참고: [Bowditch, The American Practical Navigator (2017), Chapter 17 The Almanacs](https://thenauticalalmanac.com/2017_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2017-%20The%20Almanacs.pdf)."],"flags":[{"kind":"교재 밖","text":"각 1′ ≈ 1해리(1852 m)라는 환산을 덧붙여 오차 크기를 거리로 풀었다.","fn":2}]},{"title":"태양의 GHA·Dec","easy":["태양은 하루에 한 바퀴, 곧 1시간에 15°씩 서쪽으로 간다. 그래서 정각의 위치만 알면 몇 분 뒤의 위치도 쉽게 구한다. 관측 순간 태양의 [[본초시각]](Greenwich Hour Angle, GHA)과 [[적위]](Declination, Dec)를 구하는 방법이 이 문서의 내용이다.","순서는 세 단계다. [[주표]]에서 관측 시(時)의 정각 값을 읽고, [[증분 및 개정표]]에서 분·초만큼 더 간 각을 더한다. 마지막으로 Dec는 1시간당 적위 변화 d를 지난 시간만큼 비례로 고친다.","예를 들어 2019년 1월 2일 GMT 05-35-13이라면, 5시 GHA 254°03′.4에 35분 13초의 증분 8°48′.3을 더해 262°51′.7을 얻는다.[1]"],"definition":"관측 순간의 태양 본초시각(GHA)과 적위(Dec)는 주표(Daily pages) SUN 란에서 관측 시(h)의 값을 찾고, 증분 및 개정표(Increments and Corrections)에서 분·초의 GHA 증분(Increment)과 분에 대한 d 개정량을 구해 가감하여 얻는다. 관측 일자와 시각은 GMT를 기준으로 한다.[1]","terms":[{"ko":"태양의 GHA·Dec","en":"Sun's GHA and Dec","plain":"관측 순간 태양의 하늘 경도·위도"},{"ko":"증분","en":"Increment","plain":"정각 이후 분·초 동안 GHA가 늘어난 양"},{"ko":"[[v·d 값|d]]","en":"d","plain":"적위의 1시간당 변화량. 태양은 d만 고친다"},{"ko":"[[천체의 지위|지위]]","en":"Geographical Position","abbr":"GP","plain":"천체 바로 아래 지구 위 지점"},{"ko":"그리니치 평균시","en":"Greenwich Mean Time","abbr":"GMT","plain":"천측력을 찾는 기준 시각"}],"why":"[[Sun Sighting]]에서 계산고도를 구하려면 관측 순간 태양의 GHA와 Dec가 필요하다. GHA에 내 경도를 가감하면 [[지방시각·자오선각|LHA]]가 되고, Dec와 함께 계산식에 들어간다. 낮 동안 가장 흔히 하는 천측 계산이다.","body":[{"steps":["주표 오른쪽 페이지 SUN 란에서 관측 일자·관측 시(h)의 GHA, Dec, d를 찾는다. d에는 시간이 지나며 태양의 Dec가 증가하고 있으면 +, 감소하고 있으면 −를 붙인다.","증분 및 개정표의 SUN PLANETS 란에서 분·초에 대한 GHA 증분을 찾아 ①의 GHA에 더한다.","같은 분(m)의 개정표(v or d Corr.)에서 d에 대한 개정량을 찾아 ①의 Dec에 부호대로 가감한다."]},"①에서는 관측 시각 바로 앞의 정각 줄을 편다. 05-35-13이면 5시 줄이다.[4] 태양은 v 개정이 없다. GHA가 1시간에 거의 정확히 15°씩 변하기 때문이다([[v·d 값]]).[2]",{"table":{"head":["순서","계산","GHA","Dec"],"rows":[["① 주표 5h (Jan. 2)","SUN 란","254°03′.4","S22°56′.3 (d −0′.2)"],["② 35m13s 증분","15° × 35.217 ÷ 60 = 8°48′.25","+8°48′.3","—"],["③ d 개정","0′.2 × 35.5 ÷ 60 = 0′.12","—","−0′.1"],["④ GMT 05-35-13","① + ② / ① + ③","262°51′.7","S22°56′.2"]]},"caption":"교재 32쪽 예제 — 2019년 1월 2일 GMT 05-35-13의 태양"},"d가 −인 것은 1월 초 태양의 남위가 줄어드는 중이기 때문이다. 그래서 S22°56′.3에서 0′.1을 빼 S22°56′.2가 된다.","이렇게 구한 GHA와 Dec는 태양의 [[천체의 지위|지위]]의 경도와 위도가 된다. GHA가 180° 이내면 지위의 경도는 서경이고, 180°를 넘으면 360° − GHA로서 동경이다.[3] 이 예제라면 지위는 S22°56′.2, 97°08′.3E다.","3D 장면 4에서 시각을 바꾸며 GHA가 커지는 모습을 확인할 수 있다."],"confusions":"태양은 v 개정만 없을 뿐 d 개정은 해야 한다. 또 증분은 SUN PLANETS 란에서 찾으며, 같은 분·초라도 ARIES나 MOON 란의 값과 다르다.","key":["시(h)는 주표 SUN 란, 분·초는 증분표 SUN PLANETS 란","태양은 v 개정 없음, d 개정만","예: GMT 05-35-13 → GHA 262°51′.7, Dec S22°56′.2"],"footnotes":["교재 32쪽.","교재 30–31쪽.","교재 152쪽, 식 (8.2).","교재 밖 보충 설명. Bowditch도 주어진 GMT 바로 앞의 정각으로 주표를 펴고, 분·초의 증분을 더하라고 설명한다. 참고: [Bowditch, The American Practical Navigator (2017), Chapter 17 The Almanacs](https://thenauticalalmanac.com/2017_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2017-%20The%20Almanacs.pdf)."],"flags":[{"kind":"계산 확인","text":"교재 32쪽 예제: 증분 15°×35m13s = 8°48′.25 → 8°48′.3, 254°03′.4 + 8°48′.3 = 262°51′.7. d 개정 0′.2×35.5/60 = 0′.12 → 0′.1, S22°56′.3 − 0′.1 = S22°56′.2. 재계산 일치."}]},{"title":"달의 GHA·Dec","easy":["달은 별들 사이를 동쪽으로 빠르게 옮겨 가고, 남북으로도 빨리 움직인다. 그래서 하늘에서 서쪽으로 도는 빠르기가 태양보다 느리고, 시간마다 들쭉날쭉하다.[3]","그래서 [[증분 및 개정표]]의 MOON 칸은 달이 가장 느릴 때의 빠르기 14°19′.0/h로 만든다. 실제로 더 간 몫은 매시간 다른 [[v·d 값|v]]로, 남북 이동은 d로 따로 고친다.[3]","예를 들어 2019년 1월 1일 GMT 13-34-42라면, 13시 GHA 67°36′.6에 증분 8°16′.8과 v 개정 7′.0을 더해 76°00′.4를 얻는다.[1]"],"definition":"관측 순간의 달 본초시각(GHA)과 적위(Dec)는 주표(Daily pages) MOON 란의 정시 값에, 증분 및 개정표(Increments and Corrections) MOON 란의 분·초 증분(Increment)과 v·d 개정량을 가감하여 얻는다.[1]","terms":[{"ko":"달의 GHA·Dec","en":"Moon's GHA and Dec","plain":"관측 순간 달의 하늘 경도·위도"},{"ko":"v","en":"v","plain":"GHA 시간당 변화가 14°19′.0보다 많은 몫, 매시간 다름"},{"ko":"d","en":"d","plain":"적위의 1시간당 변화량, 매시간 다름"},{"ko":"[[시차·수평시차|수평시차]]","en":"Horizontal Parallax","abbr":"HP","plain":"같은 행에 실린 달 고도개정용 값"},{"ko":"MOON 란","en":"Moon column","plain":"증분표에서 달만 쓰는 칸. 기준 14°19′.0/h"}],"why":"달은 밝아서 낮에도 보이므로, 상현·하현 전후에는 태양과 동시에 관측해 낮에 선위를 구할 수 있다.[4] 그때 계산고도에 들어가는 달의 GHA와 Dec를 이 방법으로 구한다. 달은 움직임이 빨라 몇 분만 틀려도 값이 크게 달라지므로 시각과 v·d를 꼼꼼히 확인한다.","body":[{"steps":["[[주표]] 오른쪽 페이지 MOON 란에서 관측 시(h)의 GHA, v, Dec, d를 찾는다. v에는 항상 +를 붙이고, d에는 달의 Dec가 증가하고 있으면 +, 감소하고 있으면 −를 붙인다.","증분 및 개정표의 MOON 란에서 분·초에 대한 증분을 찾고, 개정표(v or d Corr.)에서 v에 대한 개정량을 찾아 ①의 GHA에 함께 더한다.","같은 분(m)의 개정표에서 d에 대한 개정량을 찾아 ①의 Dec에 부호대로 가감한다."]},"달은 겉보기운동이 빨라 주표에 v와 d가 매시간 따로 실려 있다. 같은 행의 HP(수평시차)는 [[달의 고도개정]]에 쓰인다.[2]",{"table":{"head":["순서","계산","GHA","Dec"],"rows":[["① 주표 13h (Jan. 1)","MOON 란","67°36′.6 (v +12′.1)","S12°52′.7 (d +9′.6)"],["② 34m42s 증분","14°19′.0 × 34.7 ÷ 60 = 8°16′.79","+8°16′.8","—"],["③ v 개정 / d 개정","12′.1 × 34.5 ÷ 60 / 9′.6 × 34.5 ÷ 60","+7′.0","+5′.5"],["④ GMT 13-34-42","① + ② + ③","76°00′.4","S12°58′.2"]]},"caption":"교재 33쪽 예제 — 2019년 1월 1일 GMT 13-34-42의 달"},"GHA의 합 67°36′.6 + 8°16′.8 + 7′.0은 75°60′.4이고, 60′을 1°로 올려 76°00′.4로 적는다.[1] Dec는 남위가 커지는 중이라 d가 +이고, S12°52′.7에 5′.5를 더해 S12°58′.2가 된다."],"confusions":"달의 증분은 SUN PLANETS가 아니라 MOON 란에서 찾는다. 또 달의 v·d는 매시간 다르므로 반드시 관측 시(h) 행의 값을 쓴다.","key":["증분은 MOON 란 (기준 14°19′.0/h)","v·d는 매시간 주표에, v는 항상 +","GHA = 정시 GHA + 증분 + v 개정","예: GMT 13-34-42 → GHA 76°00′.4, Dec S12°58′.2"],"footnotes":["교재 32–33쪽.","교재 30쪽.","교재 밖 보충 설명. Bowditch는 달의 적위 변화가 빠르고 태양에 대해 동쪽으로 빨리 움직인다고 설명하며, 천측력의 달 GHA 증분표는 달의 GHA가 가장 느리게 느는 빠르기 14°19′.0/h를 바탕으로 한다고 적는다. 참고: [Bowditch, The American Practical Navigator (2017), Chapter 17 The Almanacs](https://thenauticalalmanac.com/2017_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2017-%20The%20Almanacs.pdf).","교재 44쪽."],"flags":[{"kind":"계산 확인","text":"교재 33쪽 예제: 증분 14°19′.0×34m42s = 8°16′.79 → 8°16′.8, v 개정 12′.1×34.5/60 = 6′.96 → 7′.0, 67°36′.6 + 8°16′.8 + 7′.0 = 76°00′.4. d 개정 9′.6×34.5/60 = 5′.52 → 5′.5, S12°52′.7 + 5′.5 = S12°58′.2. 재계산 일치."}]},{"title":"행성의 GHA·Dec","easy":["행성(Planet)은 ‘떠돌이별’이라는 이름처럼 별들 사이를 천천히 옮겨 다닌다. 천측력에는 항해에 쓰는 밝은 행성 4개, 금성·화성·목성·토성이 실려 있다.[2]","행성은 태양과 같은 기준 빠르기 15°/h의 칸(SUN PLANETS)을 함께 쓴다. 행성마다 기준과 다른 몫은 [[v·d 값|v]]로, 남북 이동은 d로 따로 고친다. 이 v·d는 각 행성 칸 맨 아래에 한 번만 적혀 있다.","금성만은 v가 −일 때가 있다. 이때는 v 개정량을 더하지 않고 뺀다. 예를 들어 2019년 1월 1일 GMT 05-33-17의 금성은 GHA 311°40′.6, Dec S15°21′.9다.[1]"],"definition":"관측 순간의 행성 본초시각(GHA)과 적위(Dec)는 주표(Daily pages) 왼쪽 페이지 행성 란의 정시 값에, 증분 및 개정표(Increments and Corrections) SUN PLANETS 란의 분·초 증분과 v·d 개정량을 가감하여 얻는다.[1]","terms":[{"ko":"행성의 GHA·Dec","en":"Planets' GHA and Dec","plain":"관측 순간 행성의 하늘 경도·위도"},{"ko":"항해용 행성","en":"Navigational planets (Venus, Mars, Jupiter, Saturn)","plain":"천측력에 실린 금성·화성·목성·토성"},{"ko":"v","en":"v","plain":"15°/h보다 더 간 몫. 금성만 − 가능"},{"ko":"d","en":"d","plain":"적위의 1시간당 변화량"},{"ko":"SUN PLANETS 란","en":"Sun Planets column","plain":"태양과 행성이 함께 쓰는 증분 칸, 15°/h"}],"why":"행성은 별처럼 박명 때 관측해 위치선을 얻는다. 특히 금성은 밝아서 태양과 멀리 떨어져 있을 때는 낮에 태양과 함께 관측해 좋은 결과를 얻는다([[고도측정법]]).[3] 그때 계산고도에 넣을 GHA와 Dec를 이 방법으로 구한다.","body":["천측력에는 항해용 행성 4개(금성·화성·목성·토성)가 실려 있다.[2]",{"steps":["[[주표]] 왼쪽 페이지 해당 행성 란에서 관측 시(h)의 GHA, Dec와 란 맨 아래의 v, d를 찾는다. v는 금성을 관측할 때만 −가 되는 경우가 있고 그 밖에는 항상 +다. d는 Dec가 증가하고 있으면 +, 감소하고 있으면 −다.","[[증분 및 개정표]]의 SUN PLANETS 란에서 분·초에 대한 증분을, 개정표(v or d Corr.)에서 v 개정량을 구해 ①의 GHA에 더한다. 단 v가 −이면 v 개정량을 뺀다.","같은 분(m)의 개정표에서 d 개정량을 구해 ①의 Dec에 부호대로 가감한다."]},{"table":{"head":["순서","계산","GHA","Dec"],"rows":[["① 주표 05h (Jan. 1)","VENUS 란","303°21′.3 (v 0′.0)","S15°21′.6 (d +0′.6)"],["② 33m17s 증분","15° × 33.283 ÷ 60 = 8°19′.25","+8°19′.3","—"],["③ v 개정 / d 개정","0′.0 / 0′.6 × 33.5 ÷ 60 = 0′.34","0′.0","+0′.3"],["④ GMT 05-33-17","① + ② + ③","311°40′.6","S15°21′.9"]]},"caption":"교재 33쪽 예제 — 2019년 1월 1일 GMT 05-33-17의 금성(Venus)"},"이 예제는 v가 0′.0이어서 v 개정량도 0′.0이다. 미국 항해 교범 Bowditch도 천측력 천체 가운데 v가 −가 되는 것은 금성뿐이라고 적는다.[4]","금성은 밝아서 조건이 맞으면 낮에도 태양과 함께 관측할 수 있다.[3]"],"confusions":"행성의 [[v·d 값|v·d]]는 달처럼 매시간 있는 것이 아니라 란 맨 아래에 있다.[2] 또 v의 − 부호는 금성에서만 나오므로, 금성을 계산할 때는 v의 부호를 꼭 확인한다.","key":["주표 왼쪽 페이지 행성 란 + 증분표 SUN PLANETS 란","v는 금성만 − 가능 → 그때는 v 개정량을 뺀다","예: 금성 GMT 05-33-17 → GHA 311°40′.6, Dec S15°21′.9"],"footnotes":["교재 33쪽.","교재 29쪽.","교재 44쪽.","교재 밖 보충 설명. 참고: [Bowditch, The American Practical Navigator (2017), Chapter 17 The Almanacs](https://thenauticalalmanac.com/2017_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2017-%20The%20Almanacs.pdf)."],"flags":[{"kind":"계산 확인","text":"교재 33쪽 예제: 증분 15°×33m17s = 8°19′.25 → 8°19′.3, 303°21′.3 + 8°19′.3 + 0′.0 = 311°40′.6. d 개정 0′.6×33.5/60 = 0′.34 → 0′.3, S15°21′.6 + 0′.3 = S15°21′.9. 재계산 일치."}]},{"title":"항성의 GHA·Dec","easy":["별들은 서로의 자리를 거의 바꾸지 않고, 하늘 전체가 한 덩어리로 돈다. 회전목마에 고정된 말들과 같다. 그래서 회전판의 기준점 하나가 얼마나 돌았는지만 알면, 각 별은 기준점에서 떨어진 자리만 더하면 된다.","그 기준점이 [[춘분점·추분점|춘분점]](First Point of Aries, ♈)이다. 춘분점이 그리니치에서 서쪽으로 돈 각이 [[춘분점의 GHA|GHA♈]]이고, 별이 춘분점에서 서쪽으로 떨어진 각이 [[항성시각]](Sidereal Hour Angle, SHA)이다.[4] 그래서 별의 GHA = GHA♈ + SHA다.","예를 들어 별 Acamar는 GHA♈ 153°41′.9에 SHA 315°15′.2를 더해 468°57′.1이 되고, 360°를 빼면 GHA 108°57′.1이다. 별의 Dec는 거의 변하지 않아 주표 값을 그대로 쓴다.[1]"],"definition":"항성의 본초시각(GHA)은 관측 시각의 [[춘분점의 GHA|춘분점 GHA(GHA♈)]]에 그 항성의 항성시각(Sidereal Hour Angle, SHA)을 더해 구하고, 적위(Dec)는 주표의 값을 개정 없이 쓴다.[1]","terms":[{"ko":"항성의 GHA·Dec","en":"Stars' GHA and Dec","plain":"관측 순간 별의 하늘 경도·위도"},{"ko":"춘분점","en":"First Point of Aries","abbr":"♈","plain":"별 위치를 재는 하늘의 기준점"},{"ko":"춘분점의 GHA","en":"GHA of Aries","abbr":"GHA♈","plain":"그리니치에서 춘분점까지 서쪽으로 잰 각"},{"ko":"항성시각","en":"Sidereal Hour Angle","abbr":"SHA","plain":"춘분점에서 별까지 서쪽으로 잰 각"},{"ko":"항성표","en":"Stars (monthly star table)","plain":"173개 별의 매월 SHA·Dec를 실은 표"}],"why":"[[Star Sighting]]에서는 박명 때 여러 별을 잇달아 잰다. 별마다 GHA를 따로 찾지 않고 GHA♈ 하나에 각 별의 SHA만 더하면 되므로 계산이 빠르다. 여러 별의 위치선을 얻으면 [[위치선의 교점과 전위|교점]]으로 선위를 정한다.","body":["항성의 SHA와 Dec는 5~6일에 0′.1, 몇 달에 겨우 1′ 정도 변한다. 그래서 천측력은 항성마다 GHA를 싣는 대신 GHA♈와 항성의 SHA·Dec(3일 공통)를 [[주표]] 왼쪽 페이지에 싣는다.[1]",{"formula":"GHA = GHA♈ + SHA","label":"식 (1.5)"},"GHA는 그리니치에서 별까지 서쪽으로 잰 각, GHA♈는 그리니치에서 춘분점까지 서쪽으로 잰 각, SHA는 춘분점에서 별까지 서쪽으로 잰 각이다. 세 각이 모두 같은 방향으로 재는 각이라서 이어 붙여 더한다.",{"steps":["주표 왼쪽 페이지 ARIES 란에서 관측 시(h)의 GHA♈를 찾는다.","주표 왼쪽 페이지 STARS 란에서 그 항성의 SHA와 Dec를 찾는다.","[[증분 및 개정표]]의 ARIES 란에서 분·초에 대한 증분을 찾아 ①의 GHA♈, ②의 SHA와 함께 더한다. 합이 360°를 넘으면 360°를 뺀다. Dec는 개정할 필요가 없다."]},{"table":{"head":["순서","계산","값"],"rows":[["① 03h GHA♈","주표 ARIES 란","145°28′.8"],["② 32m47s 증분","15°02′.46 × 32.783 ÷ 60 = 8°13′.09 (ARIES 란)","+8°13′.1"],["③ 관측 순간 GHA♈","① + ②","153°41′.9"],["④ SHA","STARS 란","+315°15′.2"],["⑤ 합","③ + ④","468°57′.1"],["⑥ GHA","360°를 넘으므로 360°를 뺀다","108°57′.1"],["⑦ Dec","STARS 란, 개정 없음","S40°14′.1"]]},"caption":"교재 34쪽 예제 — 2019년 1월 1일 GMT 03-32-47의 항성 Acamar"},"천측력의 항성표에는 주표의 57개 항성과 북극성을 포함한 173개 항성의 매월 중간 날 SHA와 Dec가 실려 있다. 보통 보간하지 않고 표 값을 쓰며, 필요하면 눈짐작으로 보간한다.[2] 예컨대 2019년 3월 1일 α Librae(Zubenelgenubi)의 값은 눈짐작 보간으로 SHA 137°01′.0, Dec S16°07′.2다.[3]","3D 장면 4에서 춘분점과 항성이 함께 도는 모습으로 GHA♈와 SHA의 관계를 볼 수 있다."],"confusions":"SHA는 빼는 것이 아니라 더한다. SHA와 GHA가 모두 서쪽으로 재는 각이기 때문이다([[적도평면도]]의 시각도). 또 항성 계산의 증분은 SUN PLANETS가 아니라 ARIES 란에서 찾는다.","key":["항성 GHA = GHA♈ + SHA (식 1.5), 360° 넘으면 뺀다","증분은 ARIES 란, Dec는 개정 없음","주표 57개 항성(3일 공통) / 항성표 173개(매월)","예: Acamar GMT 03-32-47 → GHA 108°57′.1, Dec S40°14′.1"],"footnotes":["교재 34쪽, 식 (1.5).","교재 34–35쪽.","교재 35쪽. 교재는 이 별을 ‘α Lyrae(Vega)’로 적었지만, SHA 137°01′.0, Dec S16°07′.2는 천칭자리 α Librae(Zubenelgenubi)의 값이다. 거문고자리 Vega는 2019년경 SHA 약 80°36′, Dec 약 N38°48′이다.","교재 밖 보충 설명. 영문 자료도 GHA는 본초자오선에서, SHA는 춘분점(March equinox)에서 서쪽으로 잰 각으로 정의한다. 참고: [Hour angle — Wikipedia](https://en.wikipedia.org/wiki/Hour_angle)."],"flags":[{"kind":"계산 확인","text":"교재 34쪽 Acamar 예제: ARIES 증분 15°02′.46×32m47s = 8°13′.09 → 8°13′.1, 145°28′.8 + 8°13′.1 = 153°41′.9, + 315°15′.2 = 468°57′.1 → 360°를 빼면 108°57′.1. 재계산 일치."},{"kind":"교재 정정","text":"35쪽 보간 예의 별 이름 ‘α Lyrae(Vega)’를 값에 맞게 ‘α Librae(Zubenelgenubi)’로 바로잡았다. 2000년 좌표를 2019년으로 세차 계산하면 Zubenelgenubi는 SHA 137°00′.8, Dec S16°07′.2로 교재 값과 맞고, Vega(SHA 약 80°36′, N38°48′)와는 전혀 다르다.","fn":3}]},{"title":"춘분점의 GHA","easy":["[[춘분점·추분점|춘분점]]은 하늘의 적도와 태양이 1년 동안 지나는 길([[황도]])이 만나는 점 가운데 하나다. 눈에 보이는 별은 아니지만, 별의 위치를 재는 ‘하늘의 0번지’로 쓰인다.","이 점도 다른 천체처럼 하늘과 함께 서쪽으로 돈다. 그리니치 자오선에서 서쪽으로 얼마나 돌아갔는지가 **춘분점의 GHA**(GHA of Aries, GHA♈)다.","춘분점은 1시간에 15°02′.46, 하루에 약 360°59′를 돌아 태양보다 하루 약 59′ 더 돈다. 그래서 별은 매일 약 4분씩 일찍 같은 자리에 온다.[5]"],"definition":"춘분점(First Point of Aries)의 [[본초시각]](Greenwich Hour Angle), 곧 그리니치의 천의 자오선에서 춘분시권(Hour circle of Aries)까지 서쪽으로 잰 각(GHA♈). 항성의 GHA를 구하는 기준이 된다.[1]","terms":[{"ko":"춘분점의 GHA","en":"GHA of Aries","abbr":"GHA♈","plain":"그리니치에서 춘분점까지 서쪽으로 잰 각"},{"ko":"춘분점","en":"First Point of Aries","abbr":"♈","plain":"천의 적도와 황도가 만나는 기준점"},{"ko":"ARIES 란","en":"Aries column","plain":"주표·증분표에서 춘분점 값을 싣는 칸"},{"ko":"[[지방시각·자오선각|LHA♈]]","en":"Local Hour Angle of Aries","abbr":"LHA♈","plain":"GHA♈에 내 경도를 가감한 값"},{"ko":"[[항성시각]]","en":"Sidereal Hour Angle","abbr":"SHA","plain":"춘분점에서 별까지 서쪽으로 잰 각"}],"why":"별 관측에서 모든 별의 GHA는 GHA♈에서 출발한다(GHA = GHA♈ + SHA). 또 GHA♈에 경도를 가감한 LHA♈는 [[Star Sighting]]에서 Pub. 249 Vol. 1을 찾는 인수가 된다.[4] 별 계산은 언제나 이 값을 구하는 데서 시작한다.","body":["GHA♈를 구하는 법은 [[항성의 GHA·Dec|항성의 GHA]]를 구하는 과정에서 SHA를 더하는 단계만 뺀 것이다. [[주표]] 왼쪽 페이지 ARIES 란에서 관측 시(h)의 GHA♈를 찾고, [[증분 및 개정표]]의 ARIES 란에서 분·초의 증분을 찾아 더한다.[1]",{"table":{"head":["순서","계산","값"],"rows":[["① 03h GHA♈ (Jan. 1)","주표 ARIES 란","145°28′.8"],["② 35m33s 증분","15°02′.46 × 35.55 ÷ 60 = 8°54′.71 (ARIES 란)","+8°54′.7"],["③ GHA♈ (GMT 03-35-33)","① + ②","154°23′.5"]]},"caption":"교재 35쪽 예제 — 2019년 1월 1일 GMT 03-35-33의 춘분점"},"앞의 Acamar 예제(GMT 03-32-47)에서도 GHA♈ = 145°28′.8 + 8°13′.1 = 153°41′.9였다.[1] 춘분점은 v 개정이 필요 없다. GHA♈가 1시간에 거의 정확히 기준량 15°02′.46만큼 변하기 때문이다.[2]","기준량 15°02′.46/h를 24시간으로 곱하면 360°59′이다. 즉 춘분점은 하루에 태양보다 약 59′ 더 돈다. 태양이 황도를 따라 하루 약 1°씩 동쪽으로 움직이기 때문이다.[3]","GHA♈에 경도를 가감한 LHA♈는 Star Sighting에서 Pub. 249 Vol. 1을 찾는 인수로 쓰인다.[4] 3D 장면 4에서 춘분점의 시권이 그리니치 자오선에서 서쪽으로 멀어지는 모습을 볼 수 있다."],"confusions":"GHA♈는 ‘춘분점이라는 하늘의 점’의 GHA로, 태양의 GHA와 다르다. 태양이 춘분점에 있는 춘분(3월 21일경)에만 두 값이 거의 같다.[3]","key":["GHA♈ = 춘분점의 GHA (주표 ARIES 란)","증분은 ARIES 란 (기준 15°02′.46/h), v 개정 없음","항성 GHA = GHA♈ + SHA","예: GMT 03-35-33 → GHA♈ 154°23′.5"],"footnotes":["교재 34–35쪽.","교재 31쪽.","교재 밖 보충 설명.","교재 165쪽.","교재 밖 보충 설명. 별을 기준으로 한 하루(항성일)는 약 23시간 56분 4초여서, 항성시는 날마다 평균태양시보다 약 4분씩 앞선다. 항성시는 관측자의 자오선에서 춘분점까지 잰 각으로 정의된다. 참고: [Sidereal time — Wikipedia](https://en.wikipedia.org/wiki/Sidereal_time)."],"flags":[{"kind":"계산 확인","text":"교재 35쪽 예제: ARIES 증분 15°02′.46×35m33s = 8°54′.71 → 8°54′.7, 145°28′.8 + 8°54′.7 = 154°23′.5. 재계산 일치."}]},{"title":"육분의","easy":["갑판에서 수평선 위에 떠 있는 태양을 본다. 수평선에서 태양까지 올려다본 각이 태양의 고도다. 배 위에서 이 각을 재는, 손에 드는 도구가 **육분의**(Sextant)다.","육분의에는 거울이 두 장 있다. 한 거울에 비친 태양을 수평선까지 끌어내리고, 그때 거울을 얼마나 돌렸는지로 각을 읽는다. 수평선과 태양을 한 시야에서 겹쳐 보며 재는 셈이다.","이름은 몸통의 호가 원의 1/6(60°)이라서 붙었다. 거울 원리 덕분에 그 두 배인 120°까지 잰다. 지금 쓰는 것은 호가 원의 1/5이라 140°까지 재므로, 엄밀히는 오분의(Quintant)다.[1][5]"],"definition":"육분의(六分儀, Sextant)는 해상에서 천체의 고도(Altitude)를 측정하는 유일한 기구다. 때로는 지상 두 물표 사이의 협각(Horizontal angle)을 재는 데도 쓴다.[1]","terms":[{"ko":"육분의","en":"Sextant","plain":"거울 두 장으로 천체 고도를 재는 기구"},{"ko":"오분의","en":"Quintant","plain":"호가 원의 1/5이라 약 140°까지 재는 것"},{"ko":"[[Sextant 고도·관측고도|Sextant 고도]]","en":"Sextant altitude","abbr":"hs","plain":"육분의로 시수평을 기준으로 잰 고도"},{"ko":"관측고도","en":"Observed altitude","abbr":"Ho","plain":"hs에 모든 개정을 마친 고도"},{"ko":"Micrometer식 육분의","en":"Micrometer drum sextant","plain":"눈금 북으로 분(′)을 읽는 육분의"},{"ko":"기포육분의","en":"Bubble sextant","plain":"수평선 대신 기포를 기준으로 재는 육분의"},{"ko":"전륜육분의","en":"Gyro sextant","plain":"자이로를 기준으로 재는 육분의"}],"why":"천측의 흐름은 관측 → 고도개정 → 계산고도 → 고도차 → 위치선이고, 그 첫 단계가 육분의 관측이다. 육분의로 잰 hs에 여러 개정을 해 Ho를 만들고, 이것을 계산고도(Hc)와 비교해 고도차와 위치선을 얻는다.[4] 그래서 교재는 관측이 부정확하면 계산을 아무리 잘해도 정확한 선위를 얻을 수 없다고 강조한다.[1]","body":["옛날 육분의는 호(弧, Arc)가 원주의 1/6(실각 60°)이었기 때문에 육분의라는 이름이 붙었다. [[측각원리|이중반사]]의 원리로 그 두 배인 120°까지 잴 수 있었다.[1]","현재 쓰는 육분의는 호가 원주의 1/5(교재 표기 실각 70°)이고 140°까지 잴 수 있다. 그래서 오분의(五分儀)라고 하는 것이 타당하다.[1][2] 영문 자료도 눈금이 90°까지인 것을 octant, 120°는 sextant, 140°는 quintant로 부르면서 모두 흔히 sextant라고 한다.[5]","육분의는 시진의(Chronometer)와 함께 천측에 없어서는 안 될 계기다. 천측계산에 아무리 숙달해도 고도 관측이 부정확하면 정확한 선위를 구할 수 없으므로, 항해자는 육분의 사용법에 숙달해야 한다.[1]",{"table":{"head":["분류 기준","종류"],"rows":[["측도형식(測度型式)","Vernier식 육분의, Micrometer식 육분의"],["고도관측의 기준","직시식 육분의(直視式, 수평선을 바로 보고 관측), 기포육분의(氣泡, Bubble sextant), 전륜육분의(轉輪, Gyro sextant)"]]},"caption":"육분의의 종류 (교재 38–39쪽)"},"현재 일반 선박에서 쓰는 육분의는 거의 직시식 Micrometer식 육분의다.[3] 육분의로 시수평을 기준으로 잰 고도가 Sextant 고도(hs)이고, 여러 개정을 거쳐 관측고도(Ho)가 된다([[Sextant 고도·관측고도]]).[4]","각 부분의 이름과 역할은 [[육분의 구조]]에서, 3D 장면 9에서는 육분의로 고도를 재는 과정을 볼 수 있다."],"confusions":"‘육분의’라는 이름은 호의 크기(원주의 1/6)에서 왔고, 잴 수 있는 각(120°)은 그 두 배다. 호의 실각과 눈금 값은 언제나 1 : 2다([[도수 읽는 법]]).","key":["천체 고도를 재는 유일한 기구 (지상 두 물표의 협각도 잰다)","옛 호 = 원주 1/6(실각 60°) → 120° / 현재 1/5(약 70°) → 약 140° (오분의)","종류: Vernier식·Micrometer식 / 직시식·기포·전륜(Gyro)","일반 선박: 직시식 Micrometer식"],"footnotes":["교재 38쪽.","원주의 1/5은 정확히 72°이고 그 두 배는 144°다. 교재 39쪽에도 눈금이 120°~144°까지 새겨져 있다고 적혀 있으므로, 교재의 ‘실각 70°, 140°’는 어림값으로 보인다(41쪽은 ‘실각 약 70°’로 적었다).","교재 38–39쪽.","교재 38쪽, 2장 도입.","교재 밖 보충 설명. Sextant라는 이름은 라틴어 ‘6분의 1’에서 왔고, 몸통이 원의 약 1/6(60°)인 부채꼴이지만 눈금은 120°까지 있다. octant·sextant·quintant·quadrant의 눈금은 각각 90°·120°·140°·180°까지다. 참고: [Sextant — Wikipedia](https://en.wikipedia.org/wiki/Sextant)."],"flags":[{"kind":"해석","text":"38쪽 ‘원주의 1/5(실각 70°), 측각 140°’는 1/5 = 72°(측각 144°)와 맞지 않는다. 본문은 교재 값을 따르고, 어림값으로 보아 각주에 정확한 값을 적었다.","fn":2}]},{"title":"육분의 구조","easy":["육분의를 카메라에 견주면 이해가 쉽다. 금속 몸통(Frame)이 있고, 렌즈 자리에 망원경이, 초점 다이얼 자리에 눈금 북(Micrometer drum)이 달려 있다.","핵심은 거울 두 장이다. 팔(**시표간**, Index arm)에 붙어 함께 도는 거울이 **동경**(Index mirror), 몸통에 고정된 거울이 **수평경**(Horizon glass)이다. 팔을 밀어 동경을 돌리면 태양의 영상이 수평경 속에서 오르내린다.","부채꼴 아래 가장자리의 눈금 띠가 호(Arc)다. 반지름은 보통 162 mm이고, 팔 끝 화살표가 이 눈금을 가리켜 도(°)를 읽는다. 태양이 눈부시면 거울 앞의 색유리(Shade glass)를 내린다.[1]"],"definition":"육분의는 골격인 Frame에 호(Arc), 시표간(Index arm), 동경(Index mirror), 수평경(Horizon glass), Shade glass, 망원경(Telescope) 등 여러 부분품이 달린 구조다.[1]","terms":[{"ko":"육분의 구조","en":"Structure of the sextant","plain":"몸통에 거울·팔·눈금·망원경이 달린 짜임"},{"ko":"동경","en":"Index mirror","plain":"시표간과 함께 도는 거울. 천체 빛을 받는다"},{"ko":"수평경","en":"Horizon glass","plain":"몸통에 고정된 거울. 반은 거울, 반은 투명"},{"ko":"시표간","en":"Index arm","plain":"호의 중심을 축으로 도는 팔"},{"ko":"호","en":"Arc","plain":"도(°) 눈금이 새겨진 부채꼴 가장자리"},{"ko":"Micrometer drum","en":"Micrometer drum","plain":"분(′)을 읽는 둥근 눈금 북. 1회전 = 1°"},{"ko":"Shade glass","en":"Shade glasses","plain":"눈부심을 줄이는 색유리"}],"why":"고도를 정확히 재려면 각 부품이 어디 있고 무엇을 하는지 알아야 한다. 두 거울이 기면에 수직이 아니면 [[육분의 오차·기차개정|Sextant 오차]]가 생기므로, 관측 전에 거울 뒤의 조정 나사로 오차를 점검하고 바로잡는다.[4]","body":["그림 2.1의 기호는 A Frame, B 호(Arc), C 시표간(Index arm), D 동경(Index mirror), E 고정기(Release clutch), F Micrometer drum, G Vernier, H Tangent screw, I 수평경(Horizon glass), J 성경(Star telescope), K 승강나사(Up and down screw), L 손잡이(Handle), M Shade glass, N 다리(Leg)다.[1]",{"table":{"head":["부분","구조와 역할"],"rows":[["1) Frame","육분의의 골격. 놋쇠로 된 것도 있으나 최근에는 경합금으로 만든다. 각 부분품이 여기에 달린다."],["2) 호(Arc)","상질의 것은 백금이나 은으로 만들며 반경은 보통 162 mm. 기면 오른쪽 0°에서 왼쪽으로 120°~144°까지 눈금이 있는 부분이 본호(本弧, On the arc), 0°에서 오른쪽으로 5° 정도까지가 여호(餘弧, Off the arc)다."],["3) 시표간(示標桿, Index arm)","호의 중심을 회전축으로 돈다. 위쪽 끝에 동경이 붙어 있고, 아래쪽은 호를 따라 자유롭게 움직인다."],["4) 동경(動鏡, Index mirror)","시표간 상단, 회전축 위에 기면과 수직으로 붙은 평면경. 천체의 빛을 반사해 수평경으로 보낸다. 뒷면 상부에 동경을 기면에 수직하게 맞추는 조정용 나사가 있다."],["5) 고정기(固定器, Release clutch)·Tangent screw","고정기는 시표간 선단에 있으며, 시표간을 크게 돌려 원하는 위치에 고정할 때 쓴다. Tangent screw는 시표간을 본호 위에서 미동(微動)시킬 때 쓴다."],["6) Micrometer drum·Vernier","Micrometer는 Worm spindle에 붙은 60등분 눈금판으로, 본호 1° 이하를 1′까지 읽는다(spindle 1회전 = 1°).[2] Vernier식은 시표간 하단의 Vernier를 본호 눈금과 겹쳐 보아 10′ 이하를 10″까지 읽는다."],["7) 수평경(水平鏡, Horizon glass)","기면과 수직인 평면경 1매. 기면에 가까운 반쪽은 수은을 칠한 거울이라 동경에 비친 천체의 영상이 비친다. 투명한 유리 부분 없이 쓰는 것도 있다. 뒷면에 조정용 나사가 있다."],["8) Shade glass","동경과 수평경 앞에 붙은 농담이 다른 여러 색유리. 보통 동경 쪽 4장, 수평경 쪽 3장이다."],["9) Collar·승강나사(Up and down screw)","Collar에 망원경을 끼워 지지하고, 승강나사로 Collar를 올리고 내려 기면에서 망원경의 위치를 조정한다."],["10) 망원경(Telescope)","성경(星鏡, Star telescope, 배율 약 3배)은 일반 관측용으로 물체가 바로 보인다. 장망원경(Long telescope, 배율 8~12배)은 정밀관측과 육분의 오차 검출·조정용으로 물체가 거꾸로 보인다. 렌즈에는 십자선이 있다."],["11) 기타 부속품","암경(暗鏡, Dark eye-piece: 장망원경의 접안렌즈에 끼워 Shade glass와 같은 목적으로 씀), 손잡이(Handle), 다리(Leg), 조명장치, 눈금확대경."]]},"caption":"교재 39–41쪽, 1)~11)"},"부품들은 하나의 흐름으로 이어진다. 천체 빛이 동경에 반사되어 수평경의 거울 쪽으로 가고, 다시 반사되어 망원경으로 들어온다. 수평선은 수평경의 투명 쪽을 그대로 지나 보인다. 시표간을 돌리면 동경의 각이 바뀌고, 그 각이 호의 눈금과 Micrometer drum에 나타난다.","호의 바깥 가장자리에는 톱니가 1° 간격으로 나 있고, Tangent screw 끝에 붙은 Micrometer drum이 이 톱니를 따라 돈다. 그래서 drum 한 바퀴가 1°다.[5] 요즘은 수평경 전체를 반투명 거울로 만들어 수평선이 시야 전체에 보이게 한 것(Whole-horizon)도 있다. 교재의 ‘투명 부분 없이 쓰는 것’이 이런 형태로 보인다.[6]","Shade glass는 태양처럼 밝은 천체를 볼 때 동경 쪽 것을 쓰고, 수평선이 햇빛 반사로 눈부실 때 수평경 쪽 것을 쓴다.[3]","동경과 수평경은 기면에 수직이어야 한다. 뒷면의 조정용 나사는 이를 바로잡는 데 쓰며, 맞지 않으면 Sextant 오차가 생긴다.[4] 3D 장면 9에서 동경과 수평경의 배치를 볼 수 있다."],"confusions":"동경(動鏡)은 ‘움직이는 거울’로 시표간과 함께 돈다. 수평경은 Frame에 고정된 거울로, 반은 거울이고 반은 투명하다. 성경(星鏡)은 이름과 달리 거울이 아니라 배율 약 3배의 망원경이다.","key":["동경(Index mirror) = 시표간과 함께 도는 거울 / 수평경(Horizon glass) = 고정, 반은 거울","호 반경 약 162 mm, 본호 0°→왼쪽 120°~144°, 여호 0°→오른쪽 약 5°","Shade glass: 동경 쪽 4장, 수평경 쪽 3장","성경 약 3배(바로 보임), 장망원경 8~12배(거꾸로 보임)"],"footnotes":["교재 39–41쪽, 그림 2.1.","교재 40쪽. 교재는 ‘Warm spindle’로 적었으나, 톱니와 맞물려 도는 나사인 Worm(웜)의 오자다.","교재 40쪽, 43쪽.","교재 40쪽, 46쪽.","교재 밖 보충 설명. Bowditch는 호(limb) 바깥 가장자리의 톱니 하나가 고도 1°이고, Tangent screw 끝에 분 눈금의 Micrometer drum이, 그 옆에 분의 소수를 읽는 Vernier가 있다고 설명한다. 수평경은 몸통에 가까운 절반만 은도금한 유리라고 적는다. 참고: [Bowditch, The American Practical Navigator (2017), Chapter 14 Instruments for Celestial Navigation](https://thenauticalalmanac.com/2017_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2014-%20Instruments%20For%20Celestial%20Navigation.pdf).","교재 밖 보충 설명. 전통적인 육분의는 시야를 반으로 나누는 반쪽 거울(half-horizon mirror)을, Whole-horizon 육분의는 반투명 거울을 써서 수평선 전체를 보여 준다. 참고: [Sextant — Wikipedia](https://en.wikipedia.org/wiki/Sextant)."],"flags":[{"kind":"교재 정정","text":"40쪽 ‘Warm spindle’을 Worm spindle(웜 나사)로 바로잡았다.","fn":2},{"kind":"해석","text":"40쪽 ‘투명의 유리부분이 없이 사용하도록 되어 있는 것’을 영문 자료의 Whole-horizon(반투명 거울) 수평경으로 보았다. 교재는 형태를 자세히 설명하지 않는다.","fn":6}]},{"title":"측각원리","easy":["손거울로 벽에 햇빛 점을 비추고 거울을 살짝 돌려 보자. 거울을 조금만 돌려도 빛 점은 그보다 크게 움직인다. 거울을 1° 돌리면 반사된 빛은 2° 돌기 때문이다.","육분의는 이 성질을 거울 두 장에 쓴다. 빛이 두 거울에서 한 번씩, 모두 두 번 반사되면, 처음 빛과 마지막 빛 사이 각은 두 거울 사이 각의 2배가 된다. 이것이 **이중반사**(Double reflection)의 원리다.","그래서 시표간을 실제로 20° 돌리면 눈금은 40°를 가리키도록 2배로 새겨 둔다. 실각 약 70°인 호로 약 140°까지 잴 수 있는 까닭이다.[5]"],"definition":"‘광선이 같은 평면에서 2개의 반사경에 의해 2회 반사되면, 최초의 입사광선과 최후의 반사광선이 이루는 각은 두 거울이 이루는 각(양경교각)의 2배다’라는 광학 법칙을 이용한 육분의의 원리(Principle of the sextant).[1]","terms":[{"ko":"측각원리","en":"Principle of the sextant","plain":"잰 각 = 두 거울 사이 각의 2배"},{"ko":"이중반사","en":"Double reflection","plain":"빛이 두 거울에서 한 번씩 반사되는 것"},{"ko":"양경교각","en":"Angle between the mirrors","plain":"동경과 수평경이 이루는 각"},{"ko":"[[육분의 구조|동경]]","en":"Index mirror","plain":"시표간과 함께 도는 거울"},{"ko":"수평경","en":"Horizon glass","plain":"고정된 거울. 반쪽으로 수평선을 직접 본다"},{"ko":"Sextant 기차","en":"Index error","plain":"두 거울이 평행할 때 눈금이 0에서 벗어난 양"}],"why":"이 원리 덕분에 육분의 눈금은 고도를 바로 읽도록 되어 있다. 두 거울이 평행할 때 눈금이 0을 가리켜야 하는데, 어긋난 만큼이 기차(Index error)이고 고도개정의 첫 단계에서 고친다([[육분의 오차·기차개정]]).[4] 이것이 관측 → 고도개정으로 넘어가는 연결점이다.","body":["그림 2.2에서 천체의 빛은 동경(I)에서 반사되고 다시 수평경(H)에서 반사되어 관측자의 눈에 들어간다. 동시에 수평선의 직시광선은 수평경의 투명 부분을 지나 눈에 들어온다. 그래서 관측자는 천체와 수평선이 겹친 영상을 보게 된다.[1]",{"list":["AB: 육분의의 호","I: 동경, H: 수평경","C: 두 거울(양경)의 교점","F: 시표간의 위치","P: 동경과 수평경이 평행할 때의 시표간 위치"]},{"formula":"측각(고도) = 2 × 양경교각"},"여기서 측각은 천체와 수평선 사이의 각, 곧 고도다. 양경교각은 동경과 수평경이 이루는 각이다. 두 거울이 평행하면 양경교각이 0°이고 측각도 0°다.","동경은 시표간과 함께 돌므로, 두 거울이 이루는 각은 시표간이 평행 위치 P에서 F까지 돈 각과 같다. 따라서 잰 고도는 호 PF의 실각의 2배다.[2]",{"table":{"head":["순서","계산","값"],"rows":[["① 평행 위치 P","양경교각 0°","눈금 0°"],["② 시표간을 P에서 F까지 돌림","호 PF의 실각","예: 20°"],["③ 측각","2 × 20°","40°"],["④ 호 전체","실각 약 70° × 2","약 140°"]]},"caption":"실각과 눈금의 관계"},"그래서 호의 눈금은 실각의 2배로 새겨져 있다. 본호 위의 2°는 실각 1°에 해당하며, 실각 약 70°인 호로 약 140°까지 잴 수 있다.[3] 미국 항해 교범 Bowditch도 잰 각이 두 반사면이 이루는 각의 2배라고 설명한다.[6]","3D 장면 9에서 두 번 반사되는 빛의 경로와 시표간의 회전을 볼 수 있다."],"confusions":"‘2배’는 두 거울 사이 각의 2배다. 동경 하나에서의 입사각과 혼동하지 않는다. 또 두 거울이 평행할 때(P) 눈금 0이 맞지 않으면 그 차가 Sextant 기차(Index error)다([[육분의 오차·기차개정]]).[4] 이 기차는 대기의 굴절인 기차(Refraction)와 다른 말이다.","key":["측각 = 양경교각 × 2 (이중반사의 원리)","본호 2° = 실각 1° → 실각 약 70°의 호로 약 140°까지","두 거울이 평행할 때(P)가 눈금 0"],"footnotes":["교재 41–42쪽, 그림 2.2.","교재 밖 보충 설명. 그림 2.2의 기호(P, F)로 법칙과 눈금의 관계를 이어 설명했다.","교재 41쪽.","교재 46쪽.","교재 밖 보충 설명. 시표간을 20° 움직이면 두 광선 사이 각은 40° 바뀌므로, 눈금은 시표간이 돈 각의 2배를 나타내도록 새긴다. 참고: [Sextant — Wikipedia](https://en.wikipedia.org/wiki/Sextant).","교재 밖 보충 설명. 참고: [Bowditch, The American Practical Navigator (2017), Chapter 14 Instruments for Celestial Navigation](https://thenauticalalmanac.com/2017_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2014-%20Instruments%20For%20Celestial%20Navigation.pdf)."],"flags":[]},{"title":"도수 읽는 법","easy":["육분의 눈금은 시계처럼 큰 눈금과 작은 눈금을 합쳐 읽는다. 시표간 끝 화살표가 호 위에서 가리키는 큰 눈금이 ‘도(°)’다.","시표간 옆 둥근 북(Micrometer drum)은 한 바퀴가 1°이고 60칸으로 나뉜다. 그래서 한 칸이 1′(분)이다. 북 옆의 작은 자(**Vernier**, 버니어)는 1′을 다시 10칸으로 나눠 0′.1까지 읽게 한다.","교재 그림 2.3이라면 화살표 29°, 북 42′, Vernier 0′.5를 합쳐 29°42′.5다. 미국 항해 교범 Bowditch도 같은 29°42′.5를 읽기 예로 든다.[4]"],"definition":"Micrometer식 육분의는 시표간(Index arm) 화살표가 가리키는 본호(On the arc)의 눈금으로 도(°)를 읽고, Micrometer drum의 눈금과 drum에 붙은 Vernier의 0 위치로 분(′)을 읽는다(Reading the sextant).[1]","terms":[{"ko":"도수 읽는 법","en":"Reading the sextant","plain":"도 + 분 + 0.1분을 차례로 읽어 합치기"},{"ko":"본호","en":"On the arc","plain":"0°에서 왼쪽으로 120°~144°까지의 눈금"},{"ko":"여호","en":"Off the arc","plain":"0°에서 오른쪽으로 약 5°까지의 눈금"},{"ko":"Micrometer drum","en":"Micrometer drum","plain":"1회전 = 1°, 60칸 = 60′"},{"ko":"Vernier","en":"Vernier","plain":"1′을 10등분해 0′.1을 읽는 작은 자"},{"ko":"Tangent screw","en":"Tangent screw","plain":"시표간을 조금씩 움직이는 나사"}],"why":"읽은 눈금이 곧 [[Sextant 고도·관측고도|Sextant 고도]](hs)다. 고도가 1′ 틀리면 위치선도 약 1해리 밀리므로, 0′.1 자리까지 정확히 읽어야 한다.[5] 읽은 값은 관측 시각과 함께 적어 두고 고도개정으로 넘긴다.","body":["Micrometer식은 Tangent screw를 1회전하면 시표간이 본호 위에서 1° 간격만큼 움직인다. drum 한 바퀴의 60눈금이 곧 1°의 60′이다.[1][2]",{"table":{"head":["순서","어디를 보나","값"],"rows":[["① 도","시표간 화살표가 본호의 29°와 30° 사이","29°"],["② 분","drum 옆 Vernier의 0이 drum의 42′과 43′ 사이","42′"],["③ 0′.1 자리","Vernier 눈금 5가 drum 눈금과 일치","0′.5"],["④ 합","29° + 42′ + 0′.5","29°42′.5"]]},"caption":"교재 43쪽, 그림 2.3 읽기"},"drum 옆의 Vernier는 1′을 10등분해 0′.1까지 읽게 한다.[3] 분은 Vernier의 0이 drum의 어느 눈금 사이에 있는지로, 소수는 Vernier의 어느 눈금이 drum 눈금과 딱 맞는지로 읽는다.[4]","Vernier식 육분의는 본호에 10′마다 눈금이 있고, 시표간 하단의 Vernier를 본호 눈금과 겹쳐 보아 10″까지 읽는다.[2]","눈금은 [[측각원리]]에 따라 실각의 2배로 새겨져 있다. 0°에서 왼쪽으로 120°~144°까지가 본호(On the arc), 0°에서 오른쪽으로 5° 정도까지가 여호(Off the arc)다.[2] 3D 장면 9에서 시표간을 움직이며 눈금을 읽어 볼 수 있다."],"confusions":"Vernier의 ‘0’ 위치로는 분의 정수 부분(42′)만 읽는다. 소수(0′.5)는 Vernier 눈금 중 drum 눈금과 딱 맞는 것으로 읽으며, 0의 위치를 눈짐작한 값이 아니다.","key":["도: 시표간 화살표 → 본호","분: Micrometer drum (1회전 = 1°, 60눈금)","0′.1 자리: drum 옆 Vernier의 일치 눈금","그림 2.3 예: 29°42′.5"],"footnotes":["교재 42–43쪽, 그림 2.3.","교재 39–40쪽.","교재 밖 보충 설명. 그림 2.3의 Vernier에는 0·5·10이 적혀 있고, 눈금 5의 일치를 0′.5로 읽는다.","교재 밖 보충 설명. Bowditch는 Vernier의 0 위치로 분을 읽고, 10등분된 Vernier로 0′.1까지 읽는다고 설명하며, 그림 1408a의 읽기 예가 29°42′.5다. 참고: [Bowditch, The American Practical Navigator (2017), Chapter 14 Instruments for Celestial Navigation](https://thenauticalalmanac.com/2017_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2014-%20Instruments%20For%20Celestial%20Navigation.pdf).","교재 밖 보충 설명. 관측고도와 계산고도의 차이를 분(′) 단위로 나타내면 위치선이 가정위치에서 떨어진 거리를 해리로 바로 준다. 참고: [Nautical almanac — Wikipedia](https://en.wikipedia.org/wiki/Nautical_almanac)."],"flags":[{"kind":"해석","text":"그림 2.3과 예제(Vernier 눈금 5 → 0′.5)를 근거로, Micrometer drum 옆 Vernier가 0′.1 단위라고 풀어 썼다. 교재 본문에는 단위가 따로 적혀 있지 않다. Bowditch(14장)도 10등분 Vernier로 0′.1까지 읽는다고 적어 이 해석과 맞는다.","fn":3}]},{"title":"고도측정법","easy":["육분의로 태양을 잴 때는 거울 속 태양을 천천히 끌어내려 수평선 위에 살짝 ‘앉힌다’. 태양 아래 끝(**하변**, Lower limb)이 수평선에 딱 닿는 순간의 눈금이 고도다.","이때 육분의를 시계추처럼 좌우로 살짝 흔든다. 태양이 수평선 위에서 작은 호를 그리는데, 그 호의 가장 낮은 점이 수평선에 닿을 때가 육분의를 똑바로 세운 상태다.[6]","별은 빛이 약해 거울 속에서 놓치기 쉽다. 그래서 눈금을 0° 근처에 두고 별을 먼저 잡은 뒤, 별과 함께 시선을 수평선까지 내린다. 숙련자는 이렇게 0′.5 정도의 정밀도로 잰다.[1]"],"definition":"육분의(Sextant)로 천체의 영상을 수평선까지 내려, 천체(태양·달은 하변(Lower limb) 또는 상변(Upper limb), 항성·행성은 중심)가 바로 아래 수평선에 접할 때의 수직고도를 재는 방법(Measuring altitude).[1]","terms":[{"ko":"고도측정법","en":"Measuring altitude","plain":"천체를 수평선에 접하게 해 고도를 재는 법"},{"ko":"하변","en":"Lower limb","plain":"태양·달 원반의 아래 끝"},{"ko":"상변","en":"Upper limb","plain":"태양·달 원반의 위 끝"},{"ko":"시진의","en":"Chronometer","plain":"관측 순간의 GMT를 재는 정밀 시계"},{"ko":"[[겉보기반지름]]","en":"Semidiameter","abbr":"SD","plain":"하변·상변에서 중심까지의 각"},{"ko":"흔들어 수직 확인","en":"Rocking the sextant (swinging the arc)","plain":"좌우로 흔들어 가장 낮은 점을 잡는 동작"}],"why":"이렇게 잰 값이 Sextant 고도(hs)이고, 그 순간 시진의의 시각이 [[천측력]]을 찾는 GMT가 된다. 하변·상변 중 무엇을 쟀는지에 따라 고도개정에서 SD를 더하거나 빼므로 반드시 기록한다.[5] 관측 → 고도개정 → 계산고도 → 고도차 → 위치선의 맨 앞 단계다.","body":[{"steps":["단망원경을 끼우고 동경 앞에 적당한 Shade glass를 넣는다.","육분의를 오른손으로 수직으로 잡고 태양 바로 아래의 수평선을 본다.","왼손으로 시표간을 천천히 앞으로 밀면 태양의 영상이 망원경 시야에 들어와 점점 내려온다.","영상이 수평선에 거의 닿으면 고정기(Release clutch)를 놓고 Tangent screw로 보통은 하변, 때에 따라 상변을 수평선에 정확히 접하게 한다.","육분의를 좌우로 약간 흔들어, 하변이 그리는 원호가 수평선에 정확히 접하는 곳에서 고도를 재고 그 순간의 시진의 시각을 읽는다."]},"흔드는 까닭은 육분의가 기운 채 재면 고도가 틀리기 때문이다. 흔들어서 가장 낮은 점을 잡아야 육분의가 수직인 순간의 값이 된다. 초보자는 태양을 너무 많이 끌어내리는 실수를 자주 한다.[6]","수평선이 햇빛 반사로 눈부시면 수평경 쪽 Shade glass를 쓴다. 흔들리는 선상이나, 고도 변화가 큰 오전·오후, 고도 70° 이상일 때는 측정이 어려우므로 20초 안팎 간격으로 여러 번(보통 3회) 연속 관측해 평균을 쓴다. 숙련자는 0′.5 정도의 정밀도로 잰다.[1]","달도 대체로 태양처럼 재지만, 하늘에서의 위치 변화가 크고 월령에 따라 모양(신월→만월→신월)이 바뀐다. 언제나 하변만 잴 수는 없으므로 상변 측정에도 익숙해야 한다(그림 2.4: 태양의 하변고도, 달의 상변고도). 상현·하현 전후 며칠은 낮에 태양과 동시 관측해 선위를 구할 수 있다.[2] 밤에는 달빛이 비친 바다가 가짜 수평선처럼 보일 수 있어 주의한다.[6]","항성·행성은 빛이 약해 Shade glass가 거의 필요 없지만, 태양·달처럼 시야 안에서 수평선까지 내리기 어렵다. 그래서 시표간을 0° 근처에 두고 망원경으로 별을 직접 시야에 잡은 뒤, 시표간을 천천히 앞으로 밀면서 시선도 함께 아래로 내려 별이 시야에서 달아나지 않게 한다. 시선이 수평선에 닿으면 육분의를 좌우로 흔들며 Tangent screw로 별의 중심이 바로 아래 수평선에 정확히 접할 때의 고도를 잰다.[3]","금성은 밝아서, 태양과 가장 떨어져 있을 때(동쪽이나 서쪽으로 약 40°)는 낮에도 태양과 동시 관측해 좋은 결과를 얻는다.[3][4] 낮에는 찾기 어려우므로 관측 시각의 고도와 방위각을 미리 계산해 시표간을 그 고도에 맞추고, 계산한 방향의 수평선 근처를 찾으면 흰 점처럼 보인다. 목성도 때때로 낮에 관측할 수 있다.[3]",{"table":{"head":["천체","무엇을 수평선에 접하게","요령"],"rows":[["태양","보통 하변, 때로 상변","동경 쪽 Shade glass, 좌우로 흔들기"],["달","하변 또는 상변(모양에 따라)","상변 측정에도 익숙해야"],["항성·행성","중심","시표간 0° 근처에서 별을 잡고 함께 내리기"],["금성(낮)","중심","고도·방위를 미리 계산해 찾기"]]},"caption":"교재 43–44쪽 정리"}],"confusions":"하변을 재면 천체 중심은 그보다 반지름만큼 높고, 상변을 재면 반지름만큼 낮다. 그래서 고도개정에서 겉보기반지름(SD)을 하변이면 +, 상변이면 −로 개정한다([[태양의 고도개정]]).[5]","key":["태양: 보통 하변(때로 상변)을 수평선에 접하게, 좌우로 흔들어 수직 확인","20초 안팎 간격 3회 관측 평균, 숙련자 정밀도 0′.5","항성·행성: 시표간 0° 근처에서 별을 잡고 시선과 함께 내려 중심을 수평선에","금성: 태양과 약 40° 떨어질 때 낮에도 관측"],"footnotes":["교재 43쪽, 그림 2.4.","교재 43–44쪽, 그림 2.4.","교재 44쪽.","교재 밖 보충 설명. 금성이 태양에서 가장 멀리 떨어지는 각(최대이각)은 약 45°~47°다. 참고: [Elongation (astronomy) — Wikipedia](https://en.wikipedia.org/wiki/Elongation_(astronomy)).","교재 60쪽.","교재 밖 보충 설명. Bowditch는 육분의를 좌우로 흔들어 수직인지 확인하고, 초보자가 영상을 너무 많이 내리는 실수를 자주 한다고 설명한다. 달은 상변을 재는 일이 태양보다 잦고, 밤에는 달 아래에 가짜 수평선이 보일 수 있다고 적는다. 참고: [Bowditch, The American Practical Navigator (2017), Chapter 14 Instruments for Celestial Navigation](https://thenauticalalmanac.com/2017_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2014-%20Instruments%20For%20Celestial%20Navigation.pdf)."],"flags":[{"kind":"교재 밖","text":"금성의 최대이각(약 45°~47°)을 각주로 덧붙였다. 본문은 교재 표현 ‘약 40° 정도’를 따랐다.","fn":4},{"kind":"교재 밖","text":"Bowditch를 근거로, 좌우로 흔드는 까닭(육분의가 수직인지 확인)과 밤에 달 아래 가짜 수평선이 생길 수 있다는 주의를 덧붙였다.","fn":6}]},{"title":"지상물표 측각","easy":["육분의는 하늘만 재는 도구가 아니다. 세워 들면 산꼭대기의 높이 각을, 옆으로 눕히면 등대 두 개 사이의 좌우 각을 잴 수 있다.[5]","높이를 아는 산이나 등대 꼭대기의 올려본 각(앙각)을 재면 그 물표까지의 거리를 구할 수 있다. 이것이 **앙각거리법**이다. 세 물표 사이의 두 좌우 각을 재서 배의 위치를 구하는 것이 **수평협각법**이다.[4]","좌우 각을 잴 때는 흐린 물표를 눈으로 직접 보고, 선명한 물표를 거울로 끌어와 겹친다. 거울을 두 번 거친 영상은 흐려지기 때문이다.[3]"],"definition":"연안 항해 중 앙각거리법(仰角距離法, Vertical sextant angle)이나 수평협각법(水平夾角法, Horizontal sextant angle)으로 선위를 구할 때, 육분의로 지상 물표의 고도나 두 물표 사이의 수평협각을 재는 방법(Measuring terrestrial angles).[1]","terms":[{"ko":"지상물표 측각","en":"Measuring terrestrial angles","plain":"육분의로 육지 물표의 각을 재는 일"},{"ko":"앙각거리법","en":"Vertical sextant angle","plain":"높이 아는 물표의 앙각으로 거리 구하기"},{"ko":"수평협각법","en":"Horizontal sextant angle","plain":"세 물표 사이 두 협각으로 선위 구하기"},{"ko":"수평협각","en":"Horizontal angle","plain":"두 물표가 좌우로 벌어진 각"},{"ko":"기면","en":"Plane of the sextant (frame face)","plain":"육분의 몸통의 넓은 면"}],"why":"연안 항해에서 해도에 나온 물표로 선위를 구할 때 쓴다. 육분의는 각을 0′.1까지 읽으므로 맨눈이나 방위 측정보다 각을 정밀하게 잴 수 있다. 천측과 같은 도구로 연안 위치도 확인할 수 있다는 점이 장점이다.","body":["수평선 위 산정(山頂) 등의 고도는 천체의 고도와 같은 방법으로 잰다(그림 2.5 섬 등의 고도측정, [[고도측정법]]).[1]","두 물표의 수평협각은 다음과 같이 잰다.[2]",{"steps":["선명한 물표가 오른쪽에 있으면 기면을 위로, 왼쪽에 있으면 기면을 아래로 향하게 하여 육분의를 수평으로 쥔다.","두 물표 중 비교적 불선명한 물표를 직접 본다.","다른 선명한 물표의 반사영상을 직시한 물표에 합치시키고 그 각을 읽는다."]},"불선명한 물표를 직시하는 것은, 반사영상이 두 거울을 거치며 흐려지므로 선명한 물표를 반사시켜야 맞추기 쉽기 때문이다.[3]",{"table":{"head":["방법","재는 것","육분의 자세","구하는 것"],"rows":[["앙각거리법","높이 아는 물표의 앙각","세워서(천체 고도처럼)","물표까지의 거리"],["수평협각법","세 물표 사이 두 수평협각","눕혀서(수평으로)","선위"]]},"caption":"두 방법 비교"},"앙각거리법은 높이를 아는 물표의 앙각으로 그 물표까지의 거리를 구하는 방법이고, 수평협각법은 세 물표 사이의 두 수평협각으로 선위를 구하는 방법이다.[4]"],"confusions":"‘기면 위·아래’ 규칙은 반사시킬 선명한 물표가 어느 쪽에 있느냐로 정한다. 눈으로 직접 보는 것은 불선명한 물표다.","key":["산정 고도(앙각)는 천체 고도와 같은 방법으로","수평협각: 육분의를 수평으로, 불선명한 물표 직시 + 선명한 물표 반사영상 합치","선명한 물표가 오른쪽 → 기면 위, 왼쪽 → 기면 아래"],"footnotes":["교재 44쪽, 그림 2.5.","교재 44–45쪽.","교재 밖 보충 설명.","교재 밖 보충 설명. 두 방법의 자세한 내용은 지문항해에서 다룬다.","교재 밖 보충 설명. 육분의를 눕혀 쓰면 두 육상 물표 사이의 겉보기 각을 잴 수 있고, 물표 사이 거리를 알면 그 각으로 해안까지의 거리를 정할 수 있다. 참고: [Sextant — Wikipedia](https://en.wikipedia.org/wiki/Sextant)."],"flags":[{"kind":"교재 밖","text":"앙각거리법과 수평협각법이 각각 무엇을 구하는 방법인지, 불선명한 물표를 직시하는 이유를 교재 밖 설명으로 덧붙였다.","fn":4}]},{"title":"육분의 취급상 주의","easy":["육분의는 거울 각도가 조금만 틀어져도 잰 고도가 틀어지는 정밀 기계다. 비싼 카메라 렌즈를 다루듯 조심해서 다룬다.","잡을 때는 손잡이(Handle)나 몸통(Frame)만 잡고, 거울과 호는 만지지 않는다. 닦을 때는 부드러운 가죽이나 명주 천을 쓴다.[1]","보관할 때는 진동이 적은 곳에 상자째 고정하고, 옮길 때는 수평을 유지한다. 떨어뜨렸다면 겉보기에 멀쩡해도 수리점에서 점검을 받는 것이 좋다.[3]"],"definition":"육분의(Sextant)는 정밀한 광학기계여서 약간의 충격에도 오차가 생기기 쉬우므로, 쥐는 법·닦는 법·보관과 운반에 충분히 주의해야 한다(Care of the sextant).[1]","terms":[{"ko":"육분의 취급상 주의","en":"Care of the sextant","plain":"오차가 생기지 않게 다루는 법"},{"ko":"손잡이","en":"Handle","plain":"육분의를 쥐는 곳"},{"ko":"Frame","en":"Frame","plain":"육분의의 골격. 손잡이와 함께 잡아도 되는 곳"},{"ko":"새미 가죽","en":"Chamois (Shammy) leather","plain":"렌즈·거울을 닦는 부드러운 가죽"},{"ko":"활동부","en":"Moving parts","plain":"Tangent screw처럼 움직이는 부분"}],"why":"충격으로 거울이 기울면 [[육분의 오차·기차개정|Sextant 오차]]가 생기고, 그 뒤에 잰 모든 고도가 같은 방향으로 틀어진다.[2] 관측 전 오차 점검과 함께 평소의 취급이 정확한 천측의 바탕이다.","body":[{"steps":["쥘 때는 반드시 Handle이나 Frame을 쥐고, 거울이나 호에 손을 대지 않는다. 시표간의 회전축에 충격을 주지 않는 것이 중요하다.","사용 후에는 부드러운 새미(Shammy) 가죽이나 명주 같은 부드러운 헝겊으로 거울면·호면·렌즈·기타 유리면을 가볍게 닦는다. 오랜 시간 직사광선을 받지 않게 하고, 거울면에 습기가 남지 않게 한다.","본호나 Vernier는 거칠게 문질러 닦지 말고 소량의 올리브유 등으로 가볍게 닦는다. 눈금이 또렷이 보이고 보존에도 좋다.","Tangent screw, 본호, Vernier 등 뒷면의 활동부(滑動部)에 소량의 기름을 치는 것도 좋다.","두는 곳은 동요나 진동이 적은 곳으로 고르고, 상자에 넣을 때는 움직이지 않게 고정한다. 운반할 때는 수평을 유지하고 다른 물체에 부딪치지 않게 한다."]},"영문 교범도 같은 원칙을 강조한다. 호·시표간·망원경을 잡고 들지 말고 Frame이나 손잡이로만 들며, 쓸 때마다 거울과 호를 닦고, 열과 습기를 피해 튼튼하고 완충재가 든 상자에 보관하라고 한다. 상자에 실리카겔을 넣어 습기를 막기도 한다.[3] 온도 변화가 호를 휘게 해 오차를 만들 수도 있다.[4]",{"table":{"head":["상황","할 일","하지 말 일"],"rows":[["쥘 때","Handle·Frame을 쥔다","거울·호를 만지기, 회전축에 충격"],["닦을 때","새미 가죽·명주로 가볍게","눈금을 거칠게 문지르기"],["눈금·활동부","올리브유로 가볍게, 활동부에 소량 기름","—"],["보관","진동 적은 곳, 상자에 고정","직사광선, 습기"],["운반","수평 유지","다른 물체에 부딪치기"]]},"caption":"교재 45쪽 정리"},"충격으로 거울이 기울거나 축이 어긋나면 Sextant 오차가 생기고, 그만큼 잰 고도가 틀어진다.[2] 손대지 말아야 할 거울과 호의 위치는 [[육분의 구조]]에서 확인할 수 있다."],"confusions":"거울과 호는 ‘손대지 말 곳’, Handle과 Frame은 ‘잡을 곳’이다. 본호·Vernier는 기름으로 가볍게 닦고, 뒷면 활동부에는 기름을 친다.","key":["Handle·Frame만 잡기, 거울·호는 만지지 않기, 회전축 충격 금지","부드러운 가죽·명주로 닦고, 직사광선·습기 피하기","눈금은 올리브유로 가볍게, 활동부엔 소량의 기름","보관은 진동 적은 곳에 고정, 운반은 수평 유지"],"footnotes":["교재 45쪽.","교재 45–46쪽.","교재 밖 보충 설명. Bowditch는 Frame이나 손잡이로만 들고, 떨어뜨리면 수리점에서 시험·점검을 받으며, 쓸 때마다 거울과 호를 닦고, 열과 습기를 피해 완충재가 든 상자에 실리카겔과 함께 보관하라고 한다. 다만 Bowditch는 호를 암모니아로 닦고 연마제는 쓰지 말라고 적어, 올리브유로 닦으라는 교재와 방법이 다르다. 시험에는 교재 기준을 따른다. 참고: [Bowditch, The American Practical Navigator (2017), Chapter 14 Instruments for Celestial Navigation](https://thenauticalalmanac.com/2017_Bowditch-_American_Practical_Navigator/Volume-_1/05-%20Part%203-%20Celestial%20Navigation/Chapter%2014-%20Instruments%20For%20Celestial%20Navigation.pdf).","교재 밖 보충 설명. 참고: [Sextant — Wikipedia](https://en.wikipedia.org/wiki/Sextant)."],"flags":[{"kind":"교재 밖","text":"Bowditch의 취급 요령(떨어뜨리면 수리점 점검, 실리카겔 보관)과 Wikipedia의 온도 변화에 의한 호 변형을 덧붙였다. Bowditch는 호를 암모니아로 닦으라고 해 교재(올리브유)와 다르므로, 본문은 교재를 따르고 차이를 각주에 적었다.","fn":3}]},{"title":"Sextant 고도·관측고도","easy":["갑판에서 [[육분의]](Sextant)를 눈에 대고, 거울에 비친 태양을 바다의 수평선까지 끌어내려 맞춘다. 이때 눈금에서 읽은 각이 **Sextant 고도**(Sextant altitude, hs)다. 이 값은 아직 고치지 않은 ‘날것’이다.","날것에는 오차가 섞여 있다. 기계의 영점이 조금 어긋나 있고, 눈이 바다보다 높아서 수평선이 낮아 보이며, 공기가 빛을 굽혀 태양이 떠 보인다. 이것을 하나씩 고쳐 얻은 ‘진짜 높이’가 **관측고도**(Observed altitude, Ho)다.","영점이 어긋난 체중계에 외투를 입고 올라선 것과 같다. 눈금 값에서 영점 오차와 외투 무게를 빼야 진짜 몸무게가 나온다. 교재 예제에서 이 고침의 합은 태양 하변이 +7′.1, 달 하변이 +62′.0이다.[2]"],"definition":"Sextant로 시수평(Visible horizon)을 기준으로 잰 천체의 고도가 Sextant 고도(Sextant altitude, hs)다. 여기에 모든 개정을 실시해, 지구 중심에 있는 관측자가 진수평(Celestial horizon)으로부터 잰 천체 중심의 고도로 고친 것이 관측고도(Observed altitude, Ho)다.[1]","terms":[{"ko":"Sextant 고도","en":"Sextant altitude","abbr":"hs","plain":"육분의 눈금에서 바로 읽은, 고치기 전 고도"},{"ko":"관측고도","en":"Observed altitude","abbr":"Ho","plain":"모든 개정을 마친 천체 중심의 진짜 고도"},{"ko":"겉보기고도","en":"Apparent altitude","abbr":"Ha","plain":"고도개정표를 찾을 때 쓰는 고도(App. Alt.)"},{"ko":"[[수평의 종류|시수평]]","en":"Visible horizon","plain":"눈에 실제로 보이는 바다와 하늘의 경계선"},{"ko":"[[계산고도·계산방위각|계산고도]]","en":"Computed altitude","abbr":"Hc","plain":"가정위치에서 계산으로 구한 고도"},{"ko":"고도차","en":"Altitude difference (Intercept)","abbr":"a","plain":"Ho와 Hc의 차. 위치선을 옮길 거리"}],"why":"천측으로 선위를 구하는 흐름은 ‘관측 → 고도개정 → 계산고도 → 고도차 → 위치선’이다. hs는 첫 단계인 관측의 결과이고, Ho는 둘째 단계인 고도개정의 결과다. Ho를 계산고도 Hc와 비교해 그 차(고도차)만큼 [[위치선]]을 옮긴다. 그래서 고도개정에서 1′을 틀리면 위치선이 약 1해리 어긋난다.[3]","body":["[[고도·고도의 거등권|고도]]는 수평권에서 천체 중심까지 수직권을 따라 잰 호다. 그런데 관측자는 진수평권을 볼 수 없고 지구 중심에 있지도 않다. 그래서 진고도를 직접 잴 수 없다.[1] 기준이 되는 여러 수평은 [[수평의 종류]]에서 볼 수 있다.","그래서 먼저 Sextant로 시수평 기준의 고도 hs를 잰다. 그다음 이 값을 ‘지구 중심의 관측자가 진수평권에서 잰 천체 중심의 고도’로 고친다.[1] 고칠 요소는 Sextant 자체의 오차와, [[천측력]] 고도개정표에 들어 있는 요소들이다.[4]",{"table":{"head":["요소","기호","부호","왜 고치나"],"rows":[["[[육분의 오차·기차개정|기차개정]](Index correction)","IC","±","기계의 영점이 어긋나 있어서. 개정하면 기차가 없어지도록 부호를 정한다"],["[[안고차]](Dip)","D","항상 −","눈이 바다보다 높아 수평선이 낮아 보여서"],["[[천문기차·평균기차|천문기차]](Refraction)","R","항상 −","공기가 빛을 굽혀 천체가 떠 보여서"],["[[시차·수평시차|시차]](Parallax)","P","항상 +","지표에서 본 방향을 지구 중심에서 본 방향으로 바꾸려고"],["[[겉보기반지름]](Semidiameter)","SD","하변 +, 상변 −","태양·달은 가장자리를 재므로 중심까지 옮기려고. 달은 증가율 A도 같은 방향"],["[[광삼]](Irradiation)","J","태양 상변만 −1′.2","밝은 태양이 부풀어 보이고 수평선이 낮아 보여서"],["[[위상]](Phase)","F","금성·화성만 ±","행성이 일부만 빛나 중심이 비켜 보여서"]]},"caption":"hs를 Ho로 고치는 요소 (교재 38쪽, 45쪽)"},"Ho는 [[항해삼각형]]을 계산으로 풀어 얻은 계산고도(Hc)와 비교한다. 둘의 차가 고도차(Altitude difference, a)이고, 이것으로 위치선을 정한다([[고도차법]]).[1][5]","천체마다 넣는 요소가 다르다. 실제 계산은 [[태양의 고도개정]], [[항성·행성의 고도개정]], [[달의 고도개정]]에서 이어진다. 3D 장면 8에서 hs가 개정 요소를 거쳐 Ho로 바뀌는 과정을 볼 수 있다.","영문 항해 자료는 hs에 IC와 D를 먼저 고친 값을 겉보기고도(Apparent altitude, Ha)라 부르고, 이 Ha로 기차·시차 표를 찾는다.[6] 교재는 보통 hs를 그대로 겉보기고도로 보고, 5° 이하 저고도에서만 IC와 D를 먼저 고친 개정고도(hr)를 쓴다.[7]"],"confusions":"고도개정표는 ‘겉보기고도(App. Alt.)’로 찾는다. 교재는 보통 hs를 그대로 겉보기고도로 보지만, 5° 이하 저고도에서는 hs에 IC와 D를 먼저 개정한 개정고도(hr)로 표를 찾는다.[7] 또 Ho(관측고도)는 ‘관측한 값’이 아니라 ‘관측값을 다 고친 값’이다. 눈금에서 바로 읽은 값은 hs다.","key":["hs(Sextant 고도) → 모든 개정 → Ho(관측고도)","Ho와 Hc를 비교해 고도차 a → 위치선","부호 고정: D −, R −, P + / SD는 하변 +, 상변 −"],"footnotes":["교재 38쪽.","교재 67쪽(태양 예제), 71쪽(달 예제).","교재 밖 보충 설명. 1해리는 지구 중심각 1′에 대한 호의 길이이므로, 고도차 1′은 위치선 1해리에 해당한다. siranah.de 자료도 안고(눈높이)를 2 m 틀리면 위치선이 약 1해리 어긋난다고 설명한다. 참고: [Correction Tables for Sextant Altitudes — siranah.de](https://siranah.de/html/sail040h.htm).","교재 45쪽, 2.2절 도입.","교재 38쪽 스캔에는 계산고도가 Hc(아래첨자 c)로 인쇄되어 있다. 교재는 곳에 따라 계산고도를 H로도 적으며, 위키에서는 Hc로 통일한다.","교재 밖 보충 설명. 영문 자료의 개정 순서는 Hs ± IE − Dip = Ha, 그다음 Ha로 기차(−)·시차(+)·반지름(±)을 찾아 Ho를 얻는다. 참고: [Correction Tables for Sextant Altitudes — siranah.de](https://siranah.de/html/sail040h.htm), [The Demystified Astro Navigation Course – Unit 3 Part 3](https://astronavigationdemystified.com/the-demystified-astro-navigation-course-unit-3-part-3/).","교재 66–67쪽, 70쪽. 고도가 높으면 기차·시차가 고도에 따라 천천히 변하므로, 표를 hs로 찾든 hr로 찾든 값이 거의 같다. 저고도에서는 기차가 빨리 변하므로 hr로 찾아야 한다."],"flags":[{"kind":"해석","text":"영문 자료는 항상 Ha = hs ± IC − D로 표를 찾고, 교재는 5° 이하에서만 hr(= hs ± IC − D)로 찾는다. 본문은 교재 방식을 따르고 영문 방식을 함께 적었다. 고도가 높으면 두 방식의 표 값 차이가 거의 없다.","fn":7}]},{"title":"육분의 오차·기차개정","easy":["빈 저울이 이미 +2 g을 가리킨다면, 무엇을 올려도 2 g을 빼야 맞는다. Sextant도 같다. 거울 두 개가 딱 평행일 때 눈금이 0을 가리켜야 하는데, 조금 비켜 있는 경우가 많다.","이 영점 어긋남이 **Sextant 기차**(Index error, IE)이고, 그만큼 더하거나 빼 주는 값이 **기차개정**(Index correction, IC)이다. 예를 들어 영점이 +2′.0만큼 어긋나 있으면, 모든 관측값에서 2′.0을 뺀다. 이때 IC는 (−)2′.0이다.","영점은 관측 전에 바다의 수평선을 보며 확인한다. 눈금을 0 근처에 두고, 직접 보이는 수평선과 거울에 비친 수평선이 한 줄이 되도록 맞춘 뒤 눈금을 읽는다. 그 읽은 값이 곧 영점 어긋남이다.[2]"],"definition":"Sextant의 오차에는 항해자가 수정할 수 있는 오차(Adjustable error) 4가지와 수정할 수 없는 오차(Nonadjustable error) 3가지가 있다. 수정한 뒤에도 주로 남는 오차가 Sextant 기차(Index error)이고, 이에 대한 개정이 Sextant 기차개정(Index correction, IC)이다.[1]","terms":[{"ko":"Sextant 기차","en":"Index error","abbr":"IE","plain":"거울이 평행일 때 눈금이 0이 아닌 만큼의 오차"},{"ko":"기차개정","en":"Index correction","abbr":"IC","plain":"기차를 없애려고 고도에 더하거나 빼는 값"},{"ko":"기계차개정","en":"Instrument correction","abbr":"I","plain":"제작자가 만든 오차표에 따른 개정. 보통 무시"},{"ko":"수정 가능한 오차","en":"Adjustable error","plain":"항해자가 나사를 돌려 직접 줄이는 오차 4가지"},{"ko":"수정 불가능한 오차","en":"Nonadjustable error","plain":"제작 단계의 오차 3가지. 제작자가 처리"},{"ko":"[[육분의 구조|동경·수평경]]","en":"Index mirror · Horizon glass","plain":"Sextant의 움직이는 거울과 고정된 거울"}],"why":"IC는 고도개정의 맨 첫 줄이다. 태양·달·항성 어느 것을 재든 hs에 IC를 먼저 가감한다. IC를 잘못 넣으면 그 오차가 Ho에 그대로 남고, 1′마다 [[위치선]]이 약 1해리 어긋난다. 그래서 관측 직전이나 직후에 기차를 확인해 기록해 두는 습관이 중요하다.[3]","body":[{"table":{"head":["구분","오차","원인"],"rows":[["수정 가능","① The error of perpendicularity","동경(Index mirror)이 기면과 수직이 아님"],["수정 가능","② Side error","수평경(Horizon glass)이 기면과 수직이 아님"],["수정 가능","③ Index error","기준간(Index bar)을 0에 맞췄을 때 동경과 수평경이 평행이 아님"],["수정 가능","④ Collimation error","망원경의 중심선이 기면과 평행이 아님"],["수정 불가능","① Centering error","시표간의 받침점이 본호의 중심에 있지 않음"],["수정 불가능","② Prismatic error","Shade glass나 동경·수평경의 양면이 평행이 아님"],["수정 불가능","③ Graduation error","본호·Micrometer drum·Vernier의 눈금이 부정확함"]]},"caption":"교재 45–46쪽 Sextant 오차[4]"},"앞의 4가지는 항해자가 직접 수정해 오차를 아주 작게 줄일 수 있다. 뒤의 3가지는 제작자가 수정한다. 4가지 가운데 ③의 원인이 가장 크고, 수정한 뒤에도 주로 ③ 때문에 오차가 남는다. 이 남은 오차를 **Sextant 기차**(Index error)라 한다.[1]","영문 자료는 수정 가능한 오차를 ① 수직 오차 → ② Side error → ③ Index error 순서로 고치라고 한다. 앞 단계를 고치면 뒤 단계가 다시 틀어질 수 있기 때문이다. 또 요즘 Sextant는 망원경을 조정하지 않게 만든 것이 많아, ④ Collimation error는 대개 따로 고치지 않는다.[2]","기차가 있으면 동경과 수평경이 평행인 위치에서 본호(Arc)의 0과 Vernier의 0이 일치하지 않는다. 그만큼 고도를 높게 또는 낮게 잰다. 그래서 기차개정 IC는 ‘Sextant 고도에 개정했을 때 기차가 포함되지 않은 고도가 되도록’ 부호를 정한다.[1]",{"list":["영점에서 눈금이 0보다 크게 읽히면(본호 쪽, on the arc) 모든 고도가 그만큼 크게 나온다. 그래서 IC는 (−)다.","0보다 작게 읽히면(본호 밖, off the arc) 고도가 그만큼 작게 나온다. 그래서 IC는 (+)다.","예: 태양으로 잰 두 값 +18′.5와 −13′.5의 대수합을 2로 나누면 기차 +2′.5이고, 개정치는 −2′.5다.[5]"]},"수정 불가능한 오차는 제작자가 오차표를 만들어 Sextant 상자 뚜껑 안쪽에 붙여 둔다. 이에 대한 개정이 **기계차개정**(Instrument correction, I)이다. 잘 만든 Sextant라면 아주 작아서, 특별한 경우가 아니면 무시한다.[1]",{"table":{"head":["교재 예제","IC","hs에 하는 일"],"rows":[["태양 하변 (67쪽)","(−)2′.0","2′.0을 뺀다"],["달 하변·상변 (71쪽)","(+)3′.2","3′.2를 더한다"]]},"caption":"교재 예제의 IC[6]"},"부품의 위치는 [[육분의 구조]]와 3D 장면 9에서, 눈금 읽기는 [[도수 읽는 법]]에서 볼 수 있다."],"confusions":"‘기차’는 동음이의어다. Sextant 기차(Index error, 器差)는 기계의 0점 오차이고, 2.2.2절의 기차(氣差, Refraction)는 대기가 빛을 굽혀 생기는 [[천문기차·평균기차|천문기차]]다.[7] 개정식에서는 IC와 R로 구분한다. 또 ‘기차(IE)’와 ‘기차개정(IC)’은 크기가 같고 부호가 반대다.","key":["수정 가능 4: perpendicularity·Side·Index·Collimation / 불가능 3: Centering·Prismatic·Graduation","남는 오차 = Sextant 기차(Index error) → 기차개정 IC(±)","IC 부호: 개정하면 기차가 사라지도록 (on the arc −, off the arc +)","기계차개정 I는 보통 무시"],"footnotes":["교재 45–46쪽.","교재 밖 보충 설명. 영점은 0에 맞춘 상태에서 수평선(밤에는 별이나 달)의 직접상과 반사상이 겹치는지로 확인한다. 수정 순서와 Collimation error에 관한 설명도 같은 자료에 있다. 참고: [Sextant — Wikipedia](https://en.wikipedia.org/wiki/Sextant).","교재 밖 보충 설명. 1해리는 지구 중심각 1′에 대한 호의 길이이므로, 고도차 1′은 위치선 1해리에 해당한다.","교재 46쪽은 ③의 부품을 ‘기준간(Index bar)’이라 적었다. 2.1.2절(교재 39–41쪽)의 시표간(Index arm)과 같은 부품으로 보았다.","교재 밖 보충 설명. 이 자료는 기차가 ±3′.0을 넘으면 수평경 나사로 고치라고 하며, 태양을 써서 기차를 구하는 예(+18′.5, −13′.5 → 기차 +2′.5, 개정치 −2′.5)를 든다. 참고: [The nautical sextant in celestial navigation — nauticalalmanac.it](https://www.nauticalalmanac.it/en/navigation-astronomy/marine-sextant-nautical-errors-corrections).","교재 67쪽, 71쪽 예제.","교재 밖 보충 설명. 교재는 Sextant 기차의 한자를 적지 않았다. 器差는 ‘기계(器)의 차’라는 뜻이다."],"flags":[{"kind":"해석","text":"교재 46쪽 수정 가능한 오차 ③의 ‘기준간(Index bar)’을 2.1.2절의 시표간(Index arm)과 같은 부품으로 보았다.","fn":4},{"kind":"교재 밖","text":"기차를 확인하는 방법(수평선 직접상·반사상 맞추기)과 on the arc → IC (−), off the arc → IC (+) 규칙, 태양을 이용한 예를 영문 자료에서 덧붙였다. 교재의 부호 원칙(개정하면 기차가 사라지도록)과 같은 내용이다.","fn":5}]},{"title":"굴절·Snell의 법칙","easy":["물컵에 빨대를 비스듬히 꽂으면 물 표면에서 빨대가 꺾여 보인다. 빛이 공기에서 물로 들어가며 방향을 틀기 때문이다. 이렇게 빛이 다른 물질로 넘어가며 꺾이는 것을 **굴절**(Refraction)이라 한다.","포장도로에서 잔디밭으로 비스듬히 굴러 들어가는 수레를 떠올리자. 잔디에 먼저 닿은 바퀴가 먼저 느려지면서 수레 전체가 방향을 튼다. 빛도 느려지는 쪽으로, 곧 경계면에 세운 수직선(법선) 쪽으로 꺾인다.","얼마나 꺾이는지는 규칙이 있다. 들어오는 각과 꺾인 각의 사인 값의 비가 늘 같다. 이것이 **Snell의 법칙**(Snell's law)이다. 공기층도 아래로 갈수록 빽빽하므로, 별빛은 공기를 지나며 조금씩 아래로 휜다."],"definition":"빛이 밀도나 종류가 다른 두 매질의 경계면을 지날 때 속도가 변해 진행 방향이 꺾이는 현상이 굴절(Refraction)이다. 입사각(Angle of incidence)과 굴절각(Angle of refraction)의 사인 비가 두 매질에 대해 일정하다는 것이 Snell의 법칙(Snell's law)이다.[1]","terms":[{"ko":"굴절","en":"Refraction","plain":"빛이 다른 매질로 넘어가며 방향이 꺾이는 것"},{"ko":"Snell의 법칙","en":"Snell's law","plain":"sin(입사각)/sin(굴절각)이 일정하다는 규칙"},{"ko":"입사각","en":"Angle of incidence","abbr":"Φ","plain":"들어오는 빛과 법선 사이의 각"},{"ko":"굴절각","en":"Angle of refraction","abbr":"θ","plain":"꺾여 나간 빛과 법선 사이의 각"},{"ko":"절대굴절률","en":"Absolute index of refraction","abbr":"μ","plain":"진공에 대한 굴절률. 항상 1보다 크다"},{"ko":"대기차(기차)","en":"Atmospheric refraction","abbr":"R","plain":"공기층 때문에 빛이 휘는 것"}],"why":"이 문서는 고도개정 가운데 ‘기차’ 두 가지의 바탕이다. 별빛이 공기에서 휘는 [[천문기차·평균기차|천문기차]]는 고도개정식의 R로 들어간다. 수평선에서 오는 빛이 휘는 [[지상기차]]는 [[안고차]] 속에 들어 있다. 둘 다 Snell의 법칙으로 ‘공기가 빽빽할수록 빛이 더 휜다’는 원리를 설명한다.","body":["빛은 아주 작은 부분을 보면 파(Wave)를 이루며 나아간다. 경계면의 법선(NN′)에 비스듬히, 밀도가 작은 매질에서 큰 매질로 들어간다고 하자. 그러면 파의 각 부분이 경계면에 닿는 시간이 달라 방향이 바뀐다. 법선과 같은 방향(경계면에 수직)으로 들어오면 모든 부분이 동시에 들어가므로 굴절하지 않는다.[1]","그림 2.6에서 제1매질의 입사각 NOS를 Φ, 제2매질의 굴절각 N′OS′를 θ라 하자. 두 매질의 절대굴절률을 μ1, μ2라 하면, 네덜란드의 수학자 Snell의 법칙에 따라 다음이 성립한다.[1][2]",{"formula":"sin Φ / sin θ = μ2 / μ1 = n = 일정","label":"식 (2.1)"},"식의 Φ는 들어오는 빛이 법선과 이루는 각, θ는 꺾인 빛이 법선과 이루는 각이다. μ1, μ2는 각 매질의 절대굴절률이고, n은 그 비다. μ2가 μ1보다 크면 n > 1이어서 θ가 Φ보다 작다. 곧 빽빽한 쪽으로 들어간 빛은 법선 쪽으로 꺾인다.","n을 제1매질에 대한 제2매질의 굴절률이라 한다. 진공에 대한 어떤 매질의 굴절률이 **절대굴절률**(Absolute index of refraction)이며 항상 1보다 크다. 두 매질 중 굴절률이 큰 쪽을 광학밀도(Optical density)가 크다고 한다.[3] 굴절률은 빛이 그 매질에서 진공보다 얼마나 느려지는지를 나타내는 값이다.[4]","굴절률이 점점 변하는 매질을 지나는 빛은 조금씩 굴절해, 밀도가 큰 쪽으로 굽은 곡선을 그린다. 대기 속의 빛도 마찬가지이며, 이를 **대기차** 또는 **기차**(Atmospheric refraction, R)라 한다.[5]",{"list":["[[지상기차]](Terrestrial refraction): 지표 부근의 점(수평선·섬·등대)에서 오는 빛의 굴절","[[천문기차·평균기차|천문기차]](Astronomical refraction): 대기권 밖 천체에서 들어오는 빛의 굴절","보통 ‘기차’라 하면 천문기차를 뜻한다.[5]"]}],"confusions":"교재는 n을 ‘굴절량’, 절대굴절률을 ‘절대굴절량’이라고도 적는데 같은 말이다.[3] 또 대기의 기차(氣差, Refraction)는 Sextant의 [[육분의 오차·기차개정|기차(Index error)]]와 소리만 같은 다른 개념이다.","key":["Snell의 법칙: sin Φ / sin θ = μ2/μ1 = n (일정)","법선 방향으로 들어온 빛은 굴절하지 않는다","절대굴절률은 항상 1보다 크다","지상기차(지표 물체) / 천문기차(대기권 밖 천체), 보통 ‘기차’ = 천문기차"],"footnotes":["교재 47쪽, 그림 2.6, 식 (2.1).","교재는 Snell의 생몰년을 ‘1591~1626’으로 적었다. Willebrord Snell(Snellius)은 일반적으로 1580년에 태어나 1626년에 죽은 것으로 알려져 있다. 참고: [Snell's law — Wikipedia](https://en.wikipedia.org/wiki/Snell%27s_law).","교재 48쪽.","교재 밖 보충 설명. Snell의 법칙의 사인 비는 두 매질의 굴절률 비이자 빛의 속도 비와 같다. 참고: [Snell's law — Wikipedia](https://en.wikipedia.org/wiki/Snell%27s_law).","교재 46–47쪽."],"flags":[{"kind":"교재 정정","text":"교재 47쪽의 Snell 생몰년 ‘1591~1626’ 가운데 출생 연도를 일반적으로 알려진 1580년으로 각주에서 바로잡았다.","fn":2}]},{"title":"지상기차","easy":["맑은 날 멀리 있는 섬이나 등대가 실제보다 살짝 떠 보일 때가 있다. 공기는 바다 가까이일수록 빽빽해서, 그 물체에서 오는 빛이 아래로 볼록하게 휘어 들어오기 때문이다.","눈은 빛이 마지막으로 들어온 방향에 물체가 있다고 느낀다. 그래서 물체가 휜 빛의 접선 방향, 곧 실제보다 조금 위에 보인다. 이 어긋난 각이 **지상기차**(Terrestrial refraction, Rt)다.","크기는 거리에 비례한다. 교재의 어림식으로는 13해리 떨어진 물표의 지상기차가 약 1′이다. 수평선에서 오는 빛도 이렇게 휘므로, 지상기차는 [[안고차]]를 조금 줄인다."],"definition":"지구 표면이나 그 가까이에 있는 점에서 관측자의 눈에 들어오는 빛이 대기 중에서 굴절하는 현상이다. 그 굴절 각을 지상기차(Terrestrial refraction, Rt)라 한다.[1]","terms":[{"ko":"지상기차","en":"Terrestrial refraction","abbr":"Rt","plain":"지표 부근 물체에서 오는 빛이 휘어 생기는 각"},{"ko":"[[천정·천저|천정]]","en":"Zenith","abbr":"Z","plain":"관측자 머리 바로 위의 천구 위 점"},{"ko":"굴절계수","en":"Coefficient of refraction","abbr":"α","plain":"지상기차와 중심각의 비. 날씨에 따라 변함"},{"ko":"[[안고차]]","en":"Dip","abbr":"D","plain":"눈높이 때문에 수평선이 내려가 보이는 각"}],"why":"지상기차는 고도개정식에 따로 나오지 않는다. 대신 [[안고차]] D 속에 들어 있다. 수평선에서 오는 빛이 휘어 수평선이 조금 들려 보이므로, 실제 안고차는 지구 곡률만으로 계산한 값보다 작다. 연안 항해에서 산·등대의 고도로 거리를 구할 때도 이 효과를 생각해야 한다.","body":["대기의 밀도는 지표면에 가까울수록 크고 멀수록 작다. 그래서 물체에서 나온 빛은 [[굴절·Snell의 법칙|굴절]]하며 곡선을 그린다. 관측자와 목표가 너무 멀지 않으면 그 곡선을 원호의 일부로 볼 수 있다.[1]","그림 2.7에서 A, B를 두 목표, 점선 호 APB를 빛의 통로, AT와 BT를 통로의 접선이라 하자. A에서 보면 B가 AT 방향에, B에서 보면 A가 BT 방향에 보인다. 이때 ∠TAB(= ∠TBA)가 지상기차다.[1]","A, B의 천정을 Z1, Z2라 하고 ∠Z1AT = z1, ∠Z2BT = z2, 지구 중심에서 A, B가 이루는 각을 C라 하면 다음 관계가 성립한다.[1]",{"formula":"2Rt + z1 + z2 = 180° + C  →  Rt = (180° + C − z1 − z2) / 2","label":"식 (2.2)"},"z1, z2는 각 지점에서 상대를 본 겉보기 정거(천정에서 잰 각)다. 이 둘은 관측으로 얻는다. C는 A, B 사이의 거리와 지구 반지름으로 구한다. 그래서 Rt를 정할 수 있다.[1]",{"formula":"Rt = αC","label":"식 (2.3)"},{"formula":"α = (180° + C − z1 − z2) / 2C","label":"식 (2.4)"},"Biot는 지상기차가 중심각 C에 비례한다고 보았다. α는 대기 상태에 따라 변하는 계수다. 그는 실험으로 기압 762 mm(29.83 inch)·기온 10℃(50°F)에서 α의 평균값이 1/13(0.0769)임을 밝혔다.[2]",{"table":{"head":["순서","내용","결과"],"rows":[["① Biot","Rt = αC, α ≈ 1/13","Rt ≈ C/13"],["② C를 분(′)으로","중심각 1′ = 대권 호 1해리","C(′) = A, B 사이 거리(마일)"],["③ 어림식","①에 ②를 넣는다","지상기차(′) ≈ 거리(마일) / 13"],["예","거리 13마일 / 26마일","약 1′ / 약 2′"]]},"caption":"교재 49쪽 지상기차 어림식[2][3]"},"지상기차는 [[안고차]]에도 들어 있다. 수평선에서 오는 빛도 굴절하므로, 실제 안고차는 기하학적 안고차보다 지상기차만큼 작다.[4]","지상기차는 바다와 공기의 온도 차에 아주 민감하다. 바닷물이 공기보다 따뜻하면 수면 가까이에 아래 신기루가 생기고 안고차가 커진다. 반대로 위쪽 공기가 더 따뜻한 역전층에서는 빛이 더 휘어 안고차가 작아진다.[5]"],"confusions":"지상기차는 지표의 물체(수평선·섬·등대)를 볼 때의 굴절이고, [[천문기차·평균기차|천문기차]]는 대기권 밖 천체를 볼 때의 굴절이다. 고도개정식의 R은 천문기차이며, 지상기차는 안고차 속에 들어 있다.","key":["지상기차 = 지표 부근 물체에서 오는 빛의 굴절(∠TAB)","2Rt + z1 + z2 = 180° + C (식 2.2)","Biot: α ≈ 1/13 → 지상기차(′) ≈ 거리(마일) / 13","실제 안고차 = 기하학적 안고차 − 지상기차"],"footnotes":["교재 48쪽, 그림 2.7, 식 (2.2).","교재 49쪽, 식 (2.3), (2.4). 762 mm는 30.00 inch이고 29.83 inch는 약 757.7 mm여서, 교재에 함께 적힌 두 기압 값은 정확히 같지 않다.","교재 밖 보충 설명. 1해리(마일)는 지구 중심각 1′에 대한 대권 호의 길이이므로, 분(′)으로 나타낸 C가 곧 거리(마일)다.","교재 56쪽.","교재 밖 보충 설명. 안고차는 눈높이의 공기와 수평선 부근 공기의 온도 차에 주로 좌우된다. 수온이 높아 아래 신기루가 보일 때는 안고차가 커지고, 역전층에서는 작아지며 음수가 되기도 한다. 참고: [Dip of the Horizon — A. T. Young, SDSU](https://aty.sdsu.edu/explain/atmos_refr/dip.html)."],"flags":[{"kind":"계산 확인","text":"교재 49쪽 Biot 조건 ‘기압 762 mm (29.83 inch)’를 환산하면 762 mm = 30.00 inch, 29.83 inch ≈ 757.7 mm로 서로 맞지 않는다. 본문은 교재 표기를 그대로 두고 각주로 알렸다. 1/13 = 0.0769는 재계산 일치.","fn":2}]},{"title":"천문기차·평균기차","easy":["별빛은 우주에서 곧게 오다가 공기층에 들어오면서 조금씩 아래로 휜다. 아래로 갈수록 공기가 빽빽하기 때문이다. 눈은 마지막으로 들어온 방향을 보므로, 별은 실제보다 조금 높이 떠 보인다. 이 차이가 **천문기차**(Astronomical refraction, R)다.","머리 바로 위의 별은 공기를 수직으로 짧게 지나 거의 휘지 않는다. 수평선 근처의 별은 공기층을 비스듬히 길게 지나 많이 휜다. 교재 값으로 고도 20°에서 2′.6, 5°에서 9′.9, 수평선에서는 34′.5나 된다.","34′.5는 태양 지름(약 32′)보다 크다. 그래서 해가 수평선에 걸려 보이는 순간, 실제 태양은 이미 수평선 아래에 있다.[2] 기차는 날씨에 따라서도 변한다. 평균적인 날씨(10℃, 1010 mb)를 기준으로 정한 값이 **평균기차**(Mean refraction, Rm)다."],"definition":"대기권 밖의 천체에서 오는 빛이 대기를 지나며 굴절해, 천체가 보이는 방향과 실제 방향 사이에 생기는 각이 천문기차(Astronomical refraction, R)다. 기온 10℃(50°F), 기압 1010 mb(29.83 inch)인 대기의 평균상태에 대한 천문기차를 평균기차(Mean refraction, Rm)라 한다.[1]","terms":[{"ko":"천문기차","en":"Astronomical refraction","abbr":"R","plain":"공기 때문에 천체가 실제보다 떠 보이는 각"},{"ko":"평균기차","en":"Mean refraction","abbr":"Rm","plain":"10℃, 1010 mb 표준 날씨에서의 천문기차"},{"ko":"수평기차","en":"Horizontal refraction","plain":"고도 0°에서의 천문기차. 가장 크다(34′.5)"},{"ko":"겉보기정거","en":"Apparent zenith distance","abbr":"z","plain":"천정에서 보이는 천체까지의 각. 90° − 겉보기고도"},{"ko":"추가기차개정","en":"Additional refraction correction","abbr":"T, B","plain":"기온(T)·기압(B)이 평균과 다를 때 더하는 개정"}],"why":"천문기차 R은 모든 천체의 고도개정식에 −R로 들어간다. 실무에서는 [[천측력]] 고도개정표가 R을 다른 요소와 묶어 한 번에 준다. 저고도 관측은 R이 크고 불확실해 위치선이 잘 틀리므로, 보통 15° 이상의 천체를 고른다. 날씨가 아주 춥거나 기압이 크게 다르면 추가개정을 한다.","body":["천체의 빛은 밀도가 큰 지표 쪽으로 굽은 곡선을 따라 관측자의 눈에 들어온다. 관측자는 곡선의 접선 방향(OS′)에 천체가 있다고 본다. 그래서 천체는 실제보다 ∠SOS′만큼 높아 보인다. 따라서 천문기차 개정의 부호는 모든 천체에 대해 항상 −다.[3]","천문기차는 겉보기정거 z와 함께 변한다. 천정(z = 0°)에서는 0이고, 낮은 고도에서 급격히 커진다. 고도 0°의 천문기차를 **수평기차**(Horizontal refraction)라 한다. 수평선 방향에 보이는 천체는 사실 수평선 아래의 천체가 떠올라 보이는 것이다.[4]",{"table":{"head":["겉보기고도","90°","20°","10°","5°","0°"],"rows":[["천문기차","0","2′.6","5′.3","9′.9","34′.5 (수평기차)"]]},"caption":"교재 51쪽 고도별 천문기차[4][5]"},"저고도의 천문기차는 불확실하므로 보통 15° 이하의 관측은 피한다. 5° 이하를 관측했다면 기온·기압 추가개정을 해야 하고, 2° 이하는 추가개정을 해도 오차가 크다.[6] 천측력 A2쪽 ‘STARS AND PLANETS’란이 평균기차표다. 대기가 평균상태와 크게 다르거나 5° 이하일 때는 항해표 제23표(기온)·제24표(기압)나 천측력 A4쪽 추가개정표로 고친다.[7]",{"table":{"head":["식","공식","내용·부호"],"rows":[["(2.5)","R ≈ (1 − 1/μ0) tan Φ","대기를 고른 한 층으로 본 단순 모형. μ0 = 1.0002918(0℃, 1기압). 실제 값은 이 식으로 구할 수 없음"],["(2.6)","R = A tan z − B tan³z","천문기차의 일반식. A, B는 기온·기압으로 정하는 상수"],["(2.7)","Rm = 58″.294 tan z − 0″.067 tan³z","Cassini의 평균기차. 계수비 ≈ 1/870이라 z ≤ 70°면 제2항 무시, z ≥ 80°면 이 식도 부정확[8]"],["(2.8)","corr. = Rm(1 − 510/(460 + T))","기온개정 T(T: °F). 50°F 미만 −, 초과 +"],["(2.9)","corr. = Rm(1 − P/29.83)","기압개정 B(P: inch). 29.83 inch 미만 +, 초과 −"],["(2.10)","R = (P/29.83)·(510/(460 + T))·Rm","기온과 기압이 모두 평균상태와 다를 때의 기차"],["(2.11)","corr. = Rm(1 − 17.1P/(460 + T))","기온·기압 종합개정. 천측력 A4쪽 추가기차개정표의 바탕"]]},"caption":"교재 50–55쪽 천문기차 관련 식 (z: 겉보기정거)"},"식 (2.7)의 tan z는 천체가 낮을수록(z가 90°에 가까울수록) 급하게 커진다. 그래서 기차도 저고도에서 급하게 커진다. 고도 45°(z = 45°)이면 tan z = 1이어서 Rm ≈ 58″, 곧 약 1′이다.[9]","식 (2.10)은 Boyle-Charles의 법칙에서 나온다. 기차가 공기의 부피에 반비례(밀도에 비례)한다고 보고, 평균상태 Rm·29.83 inch·50°F를 기준으로 놓은 것이다.[10] 기온이 낮거나 기압이 높으면 공기가 조밀해져 기차가 커진다. 그래서 개정치가 −이고, 반대면 +가 된다.[11]",{"table":{"head":["고도","(1) 천측력","(2) Radau","(3) Admiralty","(4) Papar","(5) Bessel","(6) Doolittle","(7) Chamber","(8) Bowditch","(9) Young"],"rows":[["0°","34′.5","34′.4","35′.4","34′.3","34′.9","35′.2","33′.0","36′.5","34′.8"],["1°","24′.3","24′.3","24′.8","24′.4","24′.4","24′.7","24′.5","24′.9","24′.4"],["2°","18′.3","18′.2","18′.4","18′.3","18′.2","18′.3","18′.6","18′.4","18′.1"],["3°","14′.4","14′.3","14′.4","14′.4","14′.3","14′.4","14′.6","14′.4","14′.2"],["4°","11′.8","11′.7","11′.7","11′.8","11′.7","11′.8","11′.9","11′.7","11′.6"],["5°","9′.9","9′.8","9′.9","9′.9","9′.8","9′.9","9′.9","9′.9","9′.8"],["6°","8′.5","8′.4","8′.5","8′.5","8′.4","8′.5","8′.5","8′.5","8′.4"]]},"caption":"표 2.1 저고도에 대한 각종 평균기차표 — 수평기차는 2′~3′ 정도 차이가 나지만 6°에서는 거의 같다[12]"},"수평선 근처에서 기차가 위아래로 다르게 걸리면 해가 납작해 보인다. 아래 가장자리가 위 가장자리보다 더 많이 들리기 때문이다. 이 모양 변화는 [[겉보기반지름]]에서 다룬다."],"confusions":"천문기차는 고도를 실제보다 **높게** 보이게 하므로 R은 언제나 뺀다. 반대로 [[시차·수평시차|시차]]는 고도를 낮게 보이게 하므로 언제나 더한다. 이름이 비슷한 수평기차(고도 0°의 천문기차)와 수평시차(고도 0°의 시차)도 구분하자.","key":["천문기차 R: 항상 −, 천정 0 → 수평에서 최대(수평기차 34′.5)","평균기차 Rm = 58″.294 tan z − 0″.067 tan³z (10℃, 1010 mb)","15° 이하 관측은 피하고, 5° 이하는 기온·기압 추가개정","기온 50°F 미만 −/초과 +, 기압 29.83 inch 미만 +/초과 −"],"footnotes":["교재 49–55쪽, 그림 2.8, 2.9, 표 2.1, 식 (2.5)–(2.11).","교재 밖 보충 설명. 해의 아래 가장자리가 수평선에 닿아 보일 때 실제 고도는 음수다. 천문학에서는 해가 뜨고 지는 순간을 실제 고도 −50′(기차 34′ + 반지름 16′)으로 정한다. 참고: [Atmospheric refraction — Wikipedia](https://en.wikipedia.org/wiki/Atmospheric_refraction).","교재 49쪽, 그림 2.8.","교재 50–51쪽, 그림 2.9, 식 (2.5).","교재 밖 보충 설명. 영문 자료는 10℃, 1013.25 hPa 조건에서 고도 10°에 5′.3, 5°에 9′.9, 수평선에 35′.4를 든다. 수평선 값이 교재(34′.5)와 다른 것은 표 2.1처럼 쓰는 기차표와 기준 기압이 달라서다. 참고: [Atmospheric refraction — Wikipedia](https://en.wikipedia.org/wiki/Atmospheric_refraction).","교재 52쪽.","교재 52쪽, 54–55쪽. 교재 54쪽은 기온개정의 적용 조건을 ‘5° 이하인 저온도 천체관측’이라 적었으나 ‘저고도’의 오자로 보고 바로잡았다. 또 54–55쪽은 추가개정표가 실린 쪽을 ‘Aᵢ페이지’로 인쇄했으나, 55쪽 끝과 66–68쪽의 표기에 따라 A4쪽으로 적었다.","교재 52쪽 주. 다른 평균기차식: R′esal Rm = 60″.567 tan z − 0″.067 tan³z, Bradley Rm = 57″.036 tan(z − 3Rm), Bessel Rm = 57″.538 tan(z − 3Rm). 교재는 Bradley를 ‘Bradly’, ‘Brabdly’로 적었다.","교재 밖 보충 설명. 영문 자료도 고도 45°에서 기차가 1′ 미만이라고 적는다. 기압이 약 0.9 kPa 오르거나 기온이 약 3℃ 내려가면 기차가 약 1% 커진다. 참고: [Atmospheric refraction — Wikipedia](https://en.wikipedia.org/wiki/Atmospheric_refraction).","교재 55쪽. 교재는 ‘Boyle-Charies의 법칙’으로 인쇄했으나 Boyle-Charles(보일-샤를)의 법칙이다.","교재 54–55쪽.","교재 53쪽, 표 2.1. 출전: (1) 천측력 (2) Radau (3) Admiralty Manual of Navigation(1928) (4) Papar: Practice of Navigation(1898) (5) Bessel: Fundamental Astronomy(1817) (6) Doolittle: Practical Astronomy (7) Chamber: Practical Mathematics (8) Bowditch: American Practical Navigator(1938) (9) Young: General Astronomy(1904). (4)의 ‘Papar’는 Henry Raper의 The Practice of Navigation을 가리키는 것으로 보인다."],"flags":[{"kind":"교재 정정","text":"교재 54쪽 ‘5° 이하인 저온도 천체관측’을 ‘저고도’로 바로잡았다. 54–55쪽의 ‘Aᵢ페이지’도 A4쪽(추가개정표)으로 적었다.","fn":7},{"kind":"교재 정정","text":"교재 52쪽 주의 ‘Bradly’, ‘Brabdly’를 Bradley로 바로잡았다.","fn":8},{"kind":"교재 정정","text":"교재 55쪽 ‘Boyle-Charies의 법칙’을 Boyle-Charles의 법칙으로 바로잡았다.","fn":10},{"kind":"해석","text":"표 2.1 출전 (4) ‘Papar: Practice of Navigation(1898)’을 Henry Raper의 책으로 보았다. 표 머리에는 교재 표기 Papar를 그대로 두었다.","fn":12},{"kind":"계산 확인","text":"식 (2.7)로 다시 계산하면 고도 20°에서 2′.65, 10°에서 5′.31로 교재 51쪽 값(2′.6, 5′.3)과 일치한다. 고도 5°에서는 9′.44로 표 값 9′.9보다 작은데, z가 80°를 넘으면 식이 부정확하다는 교재 설명과 맞는다. 계수비 58.294/0.067 = 870.1, 510/29.83 = 17.10도 교재와 일치. 고도 45°에서는 0′.97."},{"kind":"교재 밖","text":"영문 자료의 수평기차 35′.4(10℃, 1013.25 hPa)를 각주로 덧붙였다. 본문은 교재 값 34′.5를 그대로 두었다. 표 2.1의 Admiralty 값(35′.4)과 같다.","fn":5}]},{"title":"안고차","easy":["해변에 서서 수평선을 보다가 높은 언덕에 올라가면, 수평선이 눈높이보다 아래로 내려가 보인다. 눈이 높아질수록 둥근 지구의 더 먼 곳을 내려다보게 되기 때문이다. 이 ‘내려간 각’이 **안고차**(Dip, D)다.","Sextant는 이 내려간 수평선을 기준으로 고도를 잰다. 그러면 천체가 그만큼 높게 재진다. 그래서 안고차는 언제나 뺀다. 교재 식으로 눈높이 10 m이면 약 5′.6, 2.25 m이면 약 2′.7이다.","눈높이를 **안고**(Height of eye, HE)라 한다. 갑판 높이에 사람 키를 더한 값이다. 선교가 높은 큰 배에서 안고가 20 m라면 안고차는 약 7′.9다."],"definition":"시수평면과 거소수평면이 관측자의 눈에서 이루는 각을 안고차(Dip of horizon, Dip 또는 D)라 한다.[1]","terms":[{"ko":"안고차","en":"Dip (of the horizon)","abbr":"D","plain":"눈높이 때문에 수평선이 내려가 보이는 각"},{"ko":"안고","en":"Height of eye","abbr":"HE, h","plain":"해면에서 관측자 눈까지의 높이"},{"ko":"기하학적 안고차","en":"Geometrical dip","abbr":"Dg","plain":"공기 없이 지구 곡률만으로 계산한 안고차"},{"ko":"[[수평의 종류|거소수평]]","en":"Sensible horizon","plain":"눈을 지나며 진수평과 평행한 면"},{"ko":"[[수평의 종류|시수평]]","en":"Visible horizon","plain":"눈에 보이는 바다와 하늘의 경계"},{"ko":"온도차개정","en":"Air–sea temperature correction","plain":"수온과 기온 차로 안고차가 변하는 만큼의 개정"}],"why":"안고차 D는 모든 천체의 고도개정에서 IC 다음으로 넣는 값이다. [[천측력]] A2쪽 안고차표에서 안고로 찾는다. 안고를 잘못 잡으면 Ho가 틀어지는데, 영문 자료는 안고를 2 m 틀리면 위치선이 약 1해리 어긋난다고 설명한다.[2] 그래서 관측한 자리의 안고를 미리 알아 둔다.","body":["대기가 없다면 안고차는 지구의 곡률 때문에만 생긴다. 그림 2.10에서 거소수평 OH와 지구 접선 OT가 이루는 ∠HOT이다. 이 각은 안고(Height of eye, HE 또는 h)만으로 기하학적으로 구할 수 있어 **기하학적 안고차**(Geometrical dip of horizon, Dg)라 한다.[1]","실제로는 대기의 [[지상기차]] 때문에, 관측자는 T보다 먼 B점을 빛의 경로 BO의 접선 OV 방향에서 본다. 그래서 실제 안고차는 ∠HOV이며, 기하학적 안고차보다 지상기차(∠TOV)만큼 작다.[1][3] 곧 시수평은 기하학적 수평(접선 OT 방향)보다 약간 높게 보인다([[수평의 종류]]).[4]","시수평을 기준으로 고도를 재면 진수평(거소수평) 기준보다 안고차만큼 높게 잰다. 그래서 안고차 개정의 부호는 모든 천체에 대해 항상 −다. 안고가 높을수록 커지고, 안고가 0이면 안고차도 0이다.[1]",{"table":{"head":["식","단위","내용"],"rows":[["D = 1.776√h","h: m","안고차 표준식 (2.12)"],["D = 0.98√h","h: ft","안고차 표준식 (2.12)"],["D = 0.97√h","h: ft","천측력 A2쪽 안고차표 (2.13)"],["corr. = K(tw − ta)","tw 수온, ta 기온","온도차개정 (2.14)"],["corr. = 0′.16(tw − ta)","°F","K의 중간값 채택 (2.15)"],["corr. = 0′.28(tw − ta)","℃","K의 중간값 채택 (2.15)"]]},"caption":"교재 56–57쪽 안고차 관련 식. D는 분(′) 단위이며, 교재는 m 식과 ft 식에 같은 번호 (2.12)를 붙였다."},"식에서 h는 안고, D는 분(′) 단위의 안고차다. √h가 들어가므로 안고를 4배로 높여야 안고차가 2배가 된다. 영문 자료도 같은 꼴의 식을 쓰며, 계수만 1.75~1.77로 조금씩 다르다.[5]",{"table":{"head":["안고","계산 (식 2.13)","D"],"rows":[["8.4 m (27.6 ft)","0.97 × √27.6","(−)5′.1"],["10 m (32.8 ft)","0.97 × √32.8","(−)5′.6"],["12 m (39.4 ft)","0.97 × √39.4","(−)6′.1"],["45 ft","0.97 × √45","(−)6′.5"]]},"caption":"교재 예제에 나온 안고차 (교재 66–71쪽)"},"표준식은 수온과 기온이 같으면 기온·기압과 관계없이 대체로 잘 맞는다. 수온이 기온보다 높으면 지상기차가 줄어 안고차가 커지고, 낮으면 지상기차가 늘어 안고차가 작아진다. K는 1°F당 0′.11~0′.21(1℃당 0′.20~0′.37)로 10여 종의 실험값이 있어 아직 확정되지 않았다.[6]","온도차가 심하면 개정량 자체가 부정확하므로, 확신 없이 함부로 개정하지 않는다. 대신 안고를 낮추고 15° 이상의 천체를 관측하며, 대기가 불규칙한 시기를 피한다.[7] 천측력 안고차표는 임계표라, 안고가 경계값이면 위쪽 값을 택한다(45 ft → (−)6′.5).[8]"],"confusions":"안고(HE)는 눈의 높이(길이)이고 안고차(D)는 그 때문에 생기는 각이다. 온도차개정 식의 corr.은 안고차가 늘어나는 양으로 읽는다. 수온이 높으면(tw > ta) corr.이 +라서 안고차가 커지고, 고도에서는 그만큼 더 뺀다.[9]","key":["안고차 D: 항상 −, 안고가 높을수록 큼","D = 1.776√h(m) = 0.98√h(ft) / 천측력 표는 D = 0.97√h(ft)","실제 안고차 = 기하학적 안고차 − 지상기차","온도차개정: 0′.16/°F, 0′.28/℃ × (tw − ta)"],"footnotes":["교재 56쪽, 그림 2.10.","교재 밖 보충 설명. 참고: [Correction Tables for Sextant Altitudes — siranah.de](https://siranah.de/html/sail040h.htm).","교재 56쪽은 이 문단에서 ‘지구기차’라고 두 번 적고 문단 끝에서는 ‘지상기차’라 했다. 같은 것을 가리키는 것으로 보고 지상기차로 통일했다.","교재 56쪽, 그림 2.10에 따른 설명이다. 교재 13쪽은 ‘시수평이 기하학적 수평보다 약간 낮다’고 적어(그림 1.15도 같음) 56쪽 설명과 어긋난다. 위키는 56쪽을 따랐다.","교재 밖 보충 설명. siranah.de는 1.760√h, nauticalalmanac.it는 1.7725√h, A. T. Young은 Explanatory Supplement의 1.75√h를 든다(h: m). 안고 12 m에서 1.776√h는 6′.15, 1.76√h는 6′.10이어서 차이는 0′.1 이하다. 참고: [Correction Tables for Sextant Altitudes — siranah.de](https://siranah.de/html/sail040h.htm), [The nautical sextant in celestial navigation — nauticalalmanac.it](https://www.nauticalalmanac.it/en/navigation-astronomy/marine-sextant-nautical-errors-corrections), [Dip of the Horizon — A. T. Young, SDSU](https://aty.sdsu.edu/explain/atmos_refr/dip.html).","교재 57쪽, 식 (2.14), (2.15).","교재 58쪽.","교재 66쪽.","교재는 corr.의 부호 규칙을 따로 적지 않았다. 교재 57쪽 설명(수온이 높으면 안고차가 커짐)에 맞춰 풀이했다."],"flags":[{"kind":"해석","text":"교재 56쪽의 ‘지구기차’를 같은 문단의 ‘지상기차’와 같은 것으로 보고 지상기차로 통일했다.","fn":3},{"kind":"해석","text":"식 (2.14)·(2.15)의 corr.을 ‘안고차의 증가량’으로 해석했다. tw > ta이면 안고차가 커진다는 교재 설명과 맞춘 것이다.","fn":9},{"kind":"해석","text":"교재 13쪽(시수평이 기하학적 수평보다 약간 낮다)과 56쪽(실제 안고차 = 기하학적 안고차 − 지상기차)이 엇갈린다. 56쪽을 따라 시수평이 약간 높게 보인다고 썼다. ‘수평의 종류’ 문서와 같은 판단이며, 13쪽 원문 표현도 함께 알아 두자.","fn":4},{"kind":"계산 확인","text":"식 (2.13)으로 다시 계산: 안고 12 m(39.4 ft) 6′.09, 8.4 m 5′.09, 10 m 5′.56, 45 ft 6′.51. 교재의 6′.1, 5′.1, 5′.6, 6′.5와 일치한다. 1.776/√3.2808 = 0.98로 m 식과 ft 식도 서로 맞는다. 쉬운 설명의 예 2.25 m → 2′.66, 20 m → 7′.94도 식 (2.12)로 계산했다."},{"kind":"교재 밖","text":"영문 자료의 안고차 계수(1.75~1.77)를 각주로 비교했다. 본문 식은 교재 값 1.776을 그대로 두었다.","fn":5}]},{"title":"시차·수평시차","easy":["팔을 뻗어 엄지를 세우고, 왼눈과 오른눈을 번갈아 감아 보자. 엄지가 배경에 대해 옆으로 옮겨 보인다. 보는 위치가 다르면 가까운 물체의 방향이 달라지는 것이다. 이 방향 차이가 **시차**(Parallax, P)다.","천측에서 두 ‘눈’은 지표의 관측자와 지구 중심이다. 계산은 지구 중심에서 본 방향으로 하는데, 관측자는 지구 반지름만큼 떨어진 지표에 있다. 그래서 가까운 천체는 지표에서 보면 조금 낮게 보이고, 시차는 늘 더한다.","시차는 천체가 수평선에 있을 때 가장 크고, 이 값이 **수평시차**(Horizontal parallax, HP)다. 가장 가까운 달은 HP가 약 57′로 거의 1°다. 태양은 8″.8쯤이고, 아주 먼 항성은 0으로 본다."],"definition":"지구 중심과 천체 중심을 잇는 직선과, 관측자와 천체 중심을 잇는 직선이 천체 중심에서 이루는 각을 지심시차(Geocentric parallax) 또는 시차(Parallax, P)라 한다. 천체가 거소수평 위(고도 0°)에 있을 때의 시차를 수평시차(Horizontal parallax, HP)라 한다.[1][2]","terms":[{"ko":"시차(視差)","en":"Parallax","abbr":"P","plain":"지표와 지구 중심에서 본 천체 방향의 차"},{"ko":"수평시차","en":"Horizontal parallax","abbr":"HP","plain":"고도 0°일 때의 시차. 시차의 최댓값"},{"ko":"지심시차","en":"Geocentric parallax","plain":"지구 중심 기준의 시차. 이 문서의 시차와 같음"},{"ko":"지심거리","en":"Geocentric distance","abbr":"D","plain":"지구 중심에서 천체 중심까지의 거리"},{"ko":"평균적도수평시차","en":"Solar parallax","plain":"평균 거리의 태양이 적도에서 갖는 HP, 8″.79"}],"why":"[[천측력]]의 천체 위치(GHA·Dec)는 지구 중심에서 본 값이다. 그래서 지표에서 잰 고도를 지구 중심 기준으로 바꿔야 [[계산고도·계산방위각|계산고도]] Hc와 비교할 수 있다. 태양·금성·화성은 작은 값이 표에 들어 있지만, 달은 시차가 거의 1°라 [[주표]]의 HP로 따로 개정한다. 달의 시차를 빼먹으면 Ho가 1° 가까이, 곧 위치선이 수십 해리 틀릴 수 있다.","body":["항성은 아주 멀어서 지구 중심과 관측자에서 보는 방향이 거의 같다. 그러나 태양·달·행성은 비교적 가까워 방향 차이가 생긴다. 그래서 측정한 고도에 시차를 개정해야 한다.[1] 이것은 [[겉보기위치·진위치]]의 차이를 고도에서 바로잡는 일이다.","그림 2.11에서 O는 관측자, C는 지구 중심, M과 M′는 고도가 h와 0°일 때의 천체다. D를 지심거리, r을 지구 반지름, z를 겉보기정거라 하자. △OCM에 sin 법칙을 쓰면 sin P = (r/D) sin z를 얻는다. P가 아주 작으므로 다음 식들이 나온다.[2]",{"table":{"head":["식","공식","뜻"],"rows":[["(2.16)","P = (r/D) sin z csc 1′","겉보기정거로 나타낸 시차"],["(2.17)","P = (r/D) cos h csc 1′","겉보기고도 h로 나타낸 시차"],["(2.18)","HP = (r/D) csc 1′","(2.17)에서 h = 0 → 수평시차"]]},"caption":"교재 58–59쪽 시차 식. csc 1′은 라디안 값을 분(′)으로 바꾸는 인수다.[3]"},{"formula":"P = HP cos h","label":"식 (2.19)"},"식 (2.19)에서 HP는 그 천체의 수평시차, h는 겉보기고도다. cos h는 h = 0°에서 1, 90°에서 0이다. 그래서 시차는 수평선에서 HP 그대로이고, 머리 위에서는 0이 된다. 예를 들어 HP 57′인 달이 고도 30°에 있으면 P = 57′ × cos 30° ≈ 49′.4다.","시차는 지심거리 D에 반비례해 가까운 달에서 가장 크다. 그림 2.11에서 진고도 ∠MCH는 겉보기고도 ∠MOM′보다 시차만큼 크다. 그래서 시차 개정의 부호는 항상 +다.[4]",{"table":{"head":["천체","시차","고도개정에서"],"rows":[["태양","평균적도수평시차 8″.79 (거리 변화로 생기는 차는 0″.15 정도)","8″.80으로 보고 태양 고도개정표(A2·A3쪽)에 포함"],["달","평균거리에서 57′02″.52, 범위 53′54″~61′30″","주표의 HP로 달 고도개정표 아래 표에서 개정"],["금성","5″~32″","STARS AND PLANETS표의 추가개정(Additional Corr.)"],["화성","3″~24″","추가개정(Additional Corr.)"],["목성","1″~2″","0으로 봄"],["토성","0″.8~1″.0","0으로 봄"],["항성","가까운 항성도 0″.00003","무시"]]},"caption":"항해용 천체의 시차[5]"},"영문 항해 자료도 시차는 주로 달에서 문제가 되며 1°를 넘을 수도 있다고 설명한다. 금성·화성에도 작게 적용하고, 달의 HP는 [[천측력]] 일일 면에서 관측 시각에 가장 가까운 시의 값을 보간 없이 써도 된다고 한다.[6]"],"confusions":"‘시차’는 동음이의어다. 이 문서의 시차(視差, Parallax)는 보는 위치에 따른 방향 차이이고, 천측력의 시차(時差, Equation of time)는 시각의 차이다.[7] 또 수평시차(HP)와 수평기차(고도 0°의 [[천문기차·평균기차|천문기차]])는 이름만 비슷하다. 기차는 고도를 높여 보이게 해서 빼고, 시차는 낮춰 보이게 해서 더한다.","key":["P = HP cos h (식 2.19): 고도 0°에서 최대(HP), 90°에서 0","시차 개정 부호: 항상 +","달 HP 평균 57′02″.52 (53′54″~61′30″) / 태양 8″.79(표는 8″.80)","금성 5″~32″, 화성 3″~24″ → 추가개정 / 항성·목성·토성은 0으로 봄"],"footnotes":["교재 58쪽.","교재 58–59쪽, 그림 2.11, 식 (2.16)–(2.19). 교재 59쪽은 ‘수평시차를 구하기 위하여 (2.22)식에서 h=0으로 놓으면’이라 적었으나, h = 0을 넣는 식은 (2.17)이다.","교재 밖 보충 설명. P가 작으면 sin P ≈ P(라디안)이고, csc 1′ = 1/sin 1′ ≈ 3437.7을 곱하면 분(′) 단위가 된다.","교재 59쪽.","교재 59–60쪽, 67쪽, 69–70쪽.","교재 밖 보충 설명. 참고: [Correction Tables for Sextant Altitudes — siranah.de](https://siranah.de/html/sail040h.htm). 고도별 시차 표가 HP × cos(고도)와 맞는다는 점은 [Altitude correction tables (CN corr) — siranah.de](https://www.siranah.de/manuals/CN_corr.pdf)의 표(예: HP 54′.0, 고도 30° → 46′.8)로 확인할 수 있다.","교재 밖 보충 설명. 時差(균시차)는 시태양시와 평균태양시의 차이다."],"flags":[{"kind":"교재 정정","text":"교재 59쪽 ‘(2.22)식에서 h=0으로 놓으면’을 (2.17)식으로 바로잡았다. (2.22)는 2.3.2절의 행성 고도개정식이다.","fn":2},{"kind":"계산 확인","text":"본문 예 HP 57′, 고도 30° → P = 57′ × cos 30° = 49′.36 ≈ 49′.4. siranah.de 표의 HP 54′.0, 고도 30° → 46′.8도 54 × cos 30° = 46′.77로 식 (2.19)와 일치한다.","fn":6}]},{"title":"겉보기반지름","easy":["태양이나 달은 점이 아니라 둥근 원판으로 보인다. 그래서 Sextant로는 보통 원판의 아래 가장자리(하변)를 수평선에 살짝 얹어서 잰다. 가장자리가 선명해서 맞추기 쉽기 때문이다.","그런데 계산에 필요한 것은 원판 중심의 고도다. 하변을 쟀으면 반지름만큼 더하고, 위 가장자리(상변)를 쟀으면 반지름만큼 뺀다. 이 반지름을 각으로 나타낸 것이 **겉보기반지름**(Semidiameter, SD)이다.","태양의 SD는 약 16′로, 1월에 조금 크고 7월에 조금 작다. 지구가 1월에 태양에 더 가깝기 때문이다. 점처럼 보이는 항성·행성은 가장자리가 없으니 SD를 고치지 않는다.[2]"],"definition":"천체의 실제 반지름이 관측자의 눈에서 이루는 각을 겉보기반지름(Apparent semidiameter, SD)이라 한다. 태양과 달은 하변(Lower limb)이나 상변(Upper limb)의 고도를 재므로, 이 값을 더하거나 빼서 중심고도로 고친다.[1]","terms":[{"ko":"겉보기반지름","en":"Semidiameter","abbr":"SD","plain":"천체 반지름이 눈에서 이루는 각"},{"ko":"하변","en":"Lower limb","abbr":"L","plain":"태양·달 원판의 아래 가장자리"},{"ko":"상변","en":"Upper limb","abbr":"U","plain":"태양·달 원판의 위 가장자리"},{"ko":"증가율","en":"Augmentation","abbr":"A","plain":"달이 높이 뜰수록 SD가 커지는 양"},{"ko":"지심겉보기반지름","en":"Geocentric semidiameter","plain":"지구 중심에서 본다고 가정한 SD. 천측력 값"},{"ko":"실시겉보기반지름","en":"Observer's apparent semidiameter","plain":"지표의 관측자가 실제로 보는 SD"}],"why":"태양 하변 관측에서 SD는 약 +16′로, 고도개정 요소 가운데 가장 크다. 태양은 [[천측력]] 고도개정표에 SD가 이미 들어 있어 표 값만 쓰면 된다. 달은 SD가 빠르게 변해 [[주표]]의 그날 값과 증가율까지 고려한 별도 표를 쓴다. 하변·상변을 바꿔 적으면 Ho가 약 32′, 곧 위치선이 약 32해리 틀린다.","body":["항성·행성은 중심고도를 잴 수 있지만 태양과 달은 어렵다. 그래서 보통 하변(Lower limb)이나 상변(Upper limb)의 고도를 잰다. 하변이면 SD를 +, 상변이면 −해서 중심고도로 고친다.[1]","영문 항해 자료는 하변이 보이면 하변을 재는 것이 보통이고, 상변은 하변이 보이지 않을 때 쓴다고 설명한다. 달은 위상과 태양과의 위치에 따라 어느 쪽 가장자리가 밝게 보이는지가 달라진다.[3]","겉보기반지름에는 지표의 관측자가 보는 **실시겉보기반지름**(Observer's apparent semidiameter)과, 지구 중심에서 본다고 가정한 **지심겉보기반지름**(Geocentric apparent semidiameter)이 있다. [[천측력]]에 실린 값은 GMT 12h의 지심겉보기반지름이다.[1][4]","겉보기반지름은 거리에 반비례한다. 태양은 1월 1일경 근일점에서 16′.30, 7월 2일경 원일점에서 15′.75로, 연평균 약 16′이다.[4][5] 1년 변화가 33″뿐이라 천측력은 가운데 날 GMT 12h 값을 3일 동안 함께 쓰고, 태양의 증가율은 최대 1/24″라 무시한다.[4]","달은 궤도 이심률이 더 커 SD가 14′.7~16′.8로 빠르게 변한다. 그래서 [[주표]]에 매일 GMT 12h 값을 싣는다.[4][6]","달은 가까워서, 수평선에 있을 때보다 천정에 있을 때 관측자에게 지구 반지름만큼 더 가깝다. 그래서 고도가 높을수록 겉보기반지름이 커진다. 이 **증가율**(Augmentation, A)은 최대 약 0′.3이며, 근지점에서 약 2″ 크고 원지점에서 약 2″ 작다.[4]",{"table":{"head":["겉보기고도","10°","20°","30°","40°","50°","60°","70°","80°","90°"],"rows":[["증가율","0′.04","0′.09","0′.13","0′.17","0′.20","0′.22","0′.24","0′.25","0′.26"]]},"caption":"표 2.2 달의 겉보기반지름 증가율의 변화 (교재 61쪽). 천측력의 달 고도개정표에 이미 들어 있다."},"기차도 모양을 바꾼다. 정거가 클수록 기차가 커서 하변이 상변보다 더 많이 떠오른다. 그래서 수평선 근처의 태양·달은 세로 지름이 5′~6′쯤 줄어든 타원으로 보이고, 위쪽 반지름이 아래쪽보다 다소 크다. 가로 지름도 약간 줄어드는데, 정거 85° 이하에서는 고도와 관계없이 약 0″.25로 거의 일정하다.[7]"],"confusions":"증가율 A는 달에만 쓴다. 고도가 높을수록 달이 커 보이는 효과라서, 하변 관측이면 +A, 상변 관측이면 −A로 SD와 같은 방향으로 붙는다([[달의 고도개정]]).[8] 또 SD는 ‘지름’이 아니라 ‘반지름’이다. 태양의 겉보기 지름은 약 32′이다.","key":["SD: 하변 +, 상변 −","천측력 값 = GMT 12h의 지심겉보기반지름","태양 16′.30(1월)~15′.75(7월), 평균 약 16′ / 달 14′.7~16′.8","달만 증가율 A 개정(최대 약 0′.3)"],"footnotes":["교재 60쪽, 그림 2.12.","교재 밖 보충 설명. 항성과 행성은 점으로 보이므로 SD 개정이 필요 없다. 태양 SD는 천측력에도 실려 있지만, 고도개정표에 이미 들어 있어 따로 넣지 않는다. 참고: [Altitude Correction for Semi-Diameter — Astro Navigation Demystified](https://astronavigationdemystified.com/semi-diameter/).","교재 밖 보충 설명. 참고: [Altitude Correction for Semi-Diameter — Astro Navigation Demystified](https://astronavigationdemystified.com/semi-diameter/).","교재 61쪽, 표 2.2.","교재 밖 보충 설명. 실제 근일점 통과는 매년 1월 초(대개 1월 2~5일), 원일점 통과는 7월 초(대개 7월 3~6일)다. 교재의 ‘1월 1일경’, ‘7월 2일경’은 대략적인 날짜다.","교재 밖 보충 설명. 영문 자료는 지구에서 본 달의 겉보기 지름을 29′.33~34′.1로 적는다. 최댓값 34′.1의 절반(17′.05)이 교재 최댓값 16′.8보다 큰 것은, 영문 값이 지표에서 높이 뜬 달처럼 증가율이 더해진 경우까지 포함하기 때문으로 보인다. 지구 중심에서 본 근지점(약 356,400 km)의 SD는 약 16′.8이다. 태양의 겉보기 지름은 31′.45~32′.53이다. 참고: [Angular diameter — Wikipedia](https://en.wikipedia.org/wiki/Angular_diameter).","교재 62쪽.","교재 69쪽, 식 (2.24), (2.25)."],"flags":[{"kind":"교재 밖","text":"근일점·원일점의 실제 통과 시기(1월 2~5일, 7월 3~6일 무렵)를 각주로 덧붙였다. 본문은 교재의 ‘1월 1일경’, ‘7월 2일경’을 그대로 두었다.","fn":5},{"kind":"해석","text":"영문 자료의 달 겉보기 지름 최댓값 34′.1(반지름 17′.05)이 교재의 SD 최댓값 16′.8과 다르다. 지심 SD를 직접 계산하면(달 반지름 1737.4 km, 근지점 356,400 km) 16′.76이어서 교재 값을 본문에 두고, 차이는 증가율이 포함된 값으로 해석했다.","fn":6}]},{"title":"광삼","easy":["어두운 방에서 켜진 전구를 보면 실제보다 번져서 커 보인다. 밝은 것이 어두운 배경 앞에 있으면 눈에서 빛이 퍼져 부풀어 보이기 때문이다. 이 현상을 **광삼**(Irradiation, J)이라 한다.[2]","태양은 하늘에서 가장 밝아서 늘 조금 부풀어 보인다. 반대로 밝은 하늘 아래의 어두운 바다는 그만큼 깎여서, 수평선이 조금 낮아 보인다.","태양 하변을 재면 태양 아래쪽이 내려온 만큼 수평선도 내려가서 두 효과가 지워진다. 상변을 재면 태양 위쪽은 올라가고 수평선은 내려가 효과가 더해진다. 그래서 태양 상변을 잴 때만 1′.2를 뺀다."],"definition":"밝은 물체가 어두운 배경 앞에 있을 때 실제보다 약간 크게 보이는 현상을 광삼(Irradiation, J) 효과라 한다.[1]","terms":[{"ko":"광삼","en":"Irradiation","abbr":"J","plain":"밝은 물체가 어두운 배경에서 부풀어 보이는 것"},{"ko":"태양광삼","en":"Irradiation of the Sun","plain":"태양 원판이 커 보이는 효과, −0′.6"},{"ko":"수평광삼","en":"Irradiation of the horizon","plain":"수평선이 낮아 보이는 효과, −0′.6"},{"ko":"[[겉보기반지름|상변·하변]]","en":"Upper limb · Lower limb","plain":"태양 원판의 위·아래 가장자리"}],"why":"광삼은 태양 상변을 관측할 때만 고도개정식에 −J로 들어간다. 실무에서는 [[천측력]] 태양 고도개정표의 상변(Upper Limb)란에 −1′.2가 이미 들어 있어 따로 넣을 일이 없다. 다만 상변란과 하변란의 차가 왜 2·SD보다 1′.2 더 큰지를 이해하는 데 필요하다.","body":["광삼 때문에 수평선이 어둡고 하늘이 밝으면 수평선은 실제보다 약간 낮게 보인다. 밝은 태양은 항상 실제보다 다소 크게 보인다. 그림 2.13에서 점선은 실제 태양과 수평선, 실선은 겉보기 태양과 수평선이다.[1]","태양의 **하변**을 관측하면, 태양 아래쪽이 커져 내려온 만큼 수평선도 낮아 보여 두 광삼차가 서로 상쇄된다(그림 2.13(a)). 그래서 개정할 필요가 없다.[1]","태양의 **상변**을 관측하면, 태양 위쪽은 커져 높아 보이고 수평선은 낮아 보여 두 효과가 합해진다(그림 2.13(b)). 그래서 반드시 개정해야 한다.[1]",{"table":{"head":["항목","개정치"],"rows":[["태양광삼","−0′.6"],["수평광삼","−0′.6"],["태양 상변 관측의 광삼 J (합)","−1′.2"],["태양 하변 관측","0 (상쇄)"],["태양 이외의 천체","개정 불필요"]]},"caption":"교재 63쪽, 65–66쪽 광삼 개정치"},"천측력 태양 고도개정표의 상변 개정치에는 이 −1′.2가 이미 들어 있다. 그래서 같은 고도에서 하변 개정치와 상변 개정치는 2·SD + 1′.2만큼 다르다([[태양의 고도개정]]).[3]","이 착시는 오래전부터 알려져 있었다. 갈릴레이가 1632년 책에서 설명했고, 1867년 무렵 헬름홀츠가 이름을 붙였다. 눈 속에서 빛이 퍼져 밝은 부분의 상이 커지는 것이 원인의 하나다.[2]"],"confusions":"광삼은 태양에만, 그것도 상변 관측에만 개정한다. 하변 관측에서 J를 빼면 오히려 틀린다. ‘수평광삼’은 수평선이 낮아 보이는 효과로, 눈높이 때문에 생기는 [[안고차]]와는 원인이 다르다.","key":["광삼 J: 밝은 물체가 어두운 배경에서 크게 보임","태양 상변: J = (−0′.6) + (−0′.6) = −1′.2","태양 하변은 상쇄되어 0, 태양 외 천체는 불필요"],"footnotes":["교재 62–63쪽, 그림 2.13.","교재 밖 보충 설명. 참고: [Irradiation illusion — Wikipedia](https://en.wikipedia.org/wiki/Irradiation_illusion).","교재 63쪽, 65–66쪽."],"flags":[]},{"title":"위상","easy":["달은 스스로 빛나지 않고 햇빛을 받아 빛난다. 그래서 태양과의 위치에 따라 초승달, 반달, 보름달로 모양이 바뀐다. 이 모양을 그 천체의 **위상**(Phase, F)이라 한다.","한쪽만 밝게 비춘 공을 멀리서 보면 밝은 부분만 보인다. 그러면 공의 ‘가운데’가 실제 중심에서 비켜나 보인다. 이 비켜난 만큼을 고치는 것이 위상 개정이다.","금성도 지구 안쪽 궤도를 돌아서 달처럼 차고 이지러진다.[2] 행성은 너무 작아 가장자리를 맞출 수 없고 밝은 빛점의 가운데를 잰다. 그래서 가까운 금성·화성은 위상 개정이 필요하다."],"definition":"달이나 행성은 태양빛을 반사해 빛나므로, 태양과의 상대위치에 따라 지구에서 보이는 모양이 달라진다. 이것을 그 천체의 위상(Phase, F)이라 한다.[1]","terms":[{"ko":"위상","en":"Phase","abbr":"F","plain":"햇빛 받는 부분만 보여 모양이 바뀌는 것"},{"ko":"추가개정","en":"Additional correction","abbr":"add′l","plain":"금성·화성의 시차와 위상을 묶은 개정치"},{"ko":"중심고도","en":"Altitude of the centre","plain":"천체 원판 중심의 고도"}],"why":"위상 개정은 금성·화성을 관측할 때만 고도개정식에 ± F로 들어간다. 실무에서는 [[천측력]] A2쪽 STARS AND PLANETS표 옆의 ‘추가개정(Additional Corr.)’란에서 찾는다. 값은 작지만 금성·화성을 관측했다면 빠뜨리지 않는다. 교재 금성 예제에서는 시차와 합쳐 +0′.1이다.","body":["위상 때문에 천체의 실제 중심과 관측자가 보는 중심이 달라진다. 그래서 태양·달의 상변이나 하변을 잰 뒤 [[겉보기반지름]]을 개정하듯, 위상 변화에 따른 개정이 필요하다.[1]","태양과 달은 가깝고 크게 보여 상변이나 하변을 관측하면 된다. 그래서 위상 개정은 사실상 필요 없다.[1]","항해용 행성은 작게 보여 상변·하변을 잴 수 없고, 중심고도를 직접 잰다. 그래서 위상 개정이 필요하며, 특히 지구에 가까운 금성과 화성은 개정량이 비교적 크다. 천측력 A2쪽 고도개정표의 ‘추가개정(Additional Corr.)’란에 이 개정치가 실려 있다.[1]","금성은 지구보다 안쪽에서 태양을 돌아, 태양 건너편에 있을 때는 둥글고 작게, 지구 쪽으로 올 때는 가는 초승달 모양으로 크게 보인다. 겉보기 지름은 약 9″.9에서 68″까지 변한다.[2]","개정식에서는 F로 쓰며, [[항성·행성의 고도개정]]의 식 (2.22)에 ± F로 들어간다. 항성과 목성·토성은 위상 개정치를 0으로 본다.[3]"],"confusions":"금성·화성의 추가개정(add′l)에는 위상 F만이 아니라 [[시차·수평시차|시차]] P에 대한 개정도 함께 들어 있다.[4] 교재 69쪽 금성 예제의 add′l +0′.1이 이 둘을 합한 값이다.","key":["위상 F: 달·행성의 모양 변화로 보이는 중심이 어긋남","태양·달은 상·하변 관측이라 사실상 불필요","금성·화성만 추가개정(Additional Corr.)으로 개정, 식에서는 ± F"],"footnotes":["교재 63쪽.","교재 밖 보충 설명. 금성은 지구 궤도 안쪽을 돌아 달과 비슷한 위상 변화를 보이며, 겉보기 지름은 태양 건너편(외합)에서 약 9″.9, 지구 쪽(내합)에서 최대 약 68″다. 참고: [Phases of Venus — Wikipedia](https://en.wikipedia.org/wiki/Phases_of_Venus).","교재 67쪽, 식 (2.22).","교재 60쪽, 68–69쪽."],"flags":[{"kind":"교재 밖","text":"금성의 위상 변화와 겉보기 지름 범위(약 9″.9~68″)를 영문 자료에서 덧붙였다.","fn":2}]},{"title":"태양의 고도개정","easy":["정오 무렵 갑판에서 태양의 아래 가장자리(하변)를 수평선에 살짝 얹어 고도를 잰다. 이 날것의 값 hs를 태양 중심의 진짜 고도 Ho로 바꾸는 계산이 **태양의 고도개정**(Sun altitude correction)이다.","할 일은 네 가지다. 기계의 영점 오차(IC)를 고치고, 눈높이 때문에 생긴 [[안고차]](D)를 빼고, 공기가 띄운 만큼(R)을 빼고, 태양 반지름(SD)만큼 올린다. 아주
