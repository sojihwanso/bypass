    s += `<rect x="0" y="0" width="680" height="${top-26}" fill="var(--panel)"/>`;
    s += T(110, 20, '육지', {s:15, c:'var(--ink-2)'});
    s += T(244, 20, '내수', {s:big ? 18 : 16, w:700});
    s += T(311, 20, '영해', {s:big ? 18 : 16, w:700});
    s += T(395, 20, '접속수역', {s:big ? 18 : 16, w:700});
    s += T(510, 20, 'EEZ', {s:big ? 18 : 16, w:700});
    s += T(635, 20, '공해', {s:big ? 18 : 16, w:700});
    s += T(272, 362, '직선기선', {s:12, c:'var(--ink)', a:'start'});
    return s;
  }

  let big = false;
  function draw(){
    big = (el.clientWidth || 800) < 560;
    const it = ITEMS[sel];
    let s = base();
    ITEMS.forEach((m, i) => {
      const on = i === sel, judged = on || showAll;
      const col = judged ? (m.ok ? 'var(--ok)' : 'var(--bad)') : 'var(--panel)';
      s += `<g data-i="${i}" style="cursor:pointer" role="button" tabindex="0" aria-label="${m.k} ${m.name}">`;
      if(on) s += `<circle cx="${m.x}" cy="${m.y}" r="${big ? 25 : 20}" fill="none" stroke="var(--link)" stroke-width="3"/>`;
      s += `<circle cx="${m.x}" cy="${m.y}" r="${big ? 19 : 14.5}" fill="${col}" stroke="${judged ? col : 'var(--ink)'}" stroke-width="1.6"/>`;
      s += T(m.x, m.y + (big ? 7 : 5), m.k, {s:big ? 20 : 15, w:700, c: judged ? 'var(--panel)' : 'var(--ink)'});
      if(judged) s += T(m.x + (big ? 22 : 18), m.y - (big ? 15 : 12), m.ok ? 'O' : 'X', {s:big ? 20 : 15, w:800, c: m.ok ? 'var(--ok)' : 'var(--bad)', a:'start', mono:true});
      s += `</g>`;
    });
    svg.innerHTML = s;
    svg.querySelectorAll('g[data-i]').forEach(g => {
      const go = () => { sel = +g.dataset.i; draw(); };
      g.addEventListener('click', go);
      g.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } });
    });
    btns.forEach((b, i) => b.classList.toggle('on', i === sel));

    const connTxt = it.conn === true ? Y : it.conn === false ? N : '공해';
    sConn(connTxt); sNav(it.nav ? Y : N); sRes(it.ok ? '적용 O' : '적용 X');
    desc.innerHTML = '';
    desc.append(W.h('b', { text:`${it.k}. ${it.name}`, style:{ fontSize:'16px' } }),
      it.star ? W.h('span', { text:' ★ 많이 틀림', style:{ color:'var(--magenta)', fontSize:'13px', fontWeight:'600' } }) : '',
      W.h('p', { text:it.why, style:{ margin:'4px 0 0' } }));
    const reason = it.ok
      ? (it.conn === '공해' ? '공해에 있는 선박' : '공해와 연결 + 해양항행선 항행 가능')
      : (it.conn === false ? '공해와 연결되어 있지 않음' : '연결은 되어 있지만 해양항행선이 항행할 수 없음');
    ui.setVerdict(`${it.ok ? 'COLREG 적용 O' : 'COLREG 적용 X'} — ${reason} (제1조(a))${it.sp ? ' · 특별규칙이 있으면 그것이 먼저 (제1조(b))' : ''}`, it.ok);
  }
  draw();
  if(typeof ResizeObserver !== 'undefined'){ let w0 = 0; new ResizeObserver(() => { const b = (el.clientWidth || 800) < 560; if(b !== big) draw(); }).observe(el); }
});

}catch(e){console.error("[load] src/sims/sea-zones.js", e)}
</script>
<script>/* src/sims/sound-signals.js */
try{
/* 조종·경고 신호 재생기 + 듣고 맞히기 (제32조·제34조·제9조) */
W.sim('sound-signals', (el) => {
  const ui = W.ui.box(el, { title:'조종·경고 신호 듣기', kind:'연습',
    caption:'<b style="color:var(--magenta)">★</b> 단음(short blast) = 약 1초, 장음은 <b>prolonged blast</b>(long blast 아님) = 4~6초(제32조). 여기서는 장음을 4초로 냈다. 제34조(a)의 조종신호는 서로 시계 안에서 항행 중인 동력선이 조종할 때 울린다. 소리는 버튼을 누른 뒤에만 난다. 출처: 6주차 슬라이드 13·16~21, 정리본 9장.' });

  const SIGS = [
    { id:'s1',    bars:'S',     name:'단음 1회', mean:'침로를 우현으로 변경하고 있다', en:'I am altering my course to starboard', rule:'제34조(a)(i)' },
    { id:'s2',    bars:'SS',    name:'단음 2회', mean:'침로를 좌현으로 변경하고 있다', en:'I am altering my course to port', rule:'제34조(a)(ii)' },
    { id:'s3',    bars:'SSS',   name:'단음 3회', mean:'기관을 후진하고 있다', en:'I am operating astern propulsion', rule:'제34조(a)(iii)' },
    { id:'lls',   bars:'LLS',   name:'장음 2·단음 1', mean:'귀선의 우현 쪽으로 추월하겠다', en:'I intend to overtake you on your starboard side', rule:'제34조(c)(i)·제9조(e)' },
    { id:'llss',  bars:'LLSS',  name:'장음 2·단음 2', mean:'귀선의 좌현 쪽으로 추월하겠다', en:'I intend to overtake you on your port side', rule:'제34조(c)(i)·제9조(e)' },
    { id:'lsls',  bars:'LSLS',  name:'장음·단음·장음·단음', mean:'추월에 동의한다', en:'agreement (vessel about to be overtaken)', rule:'제34조(c)(ii)' },
    { id:'doubt', bars:'RRRRR', name:'단음 5회 이상 (짧고 빠르게)', mean:'의문·경고: 상대의 의도를 모르거나 충분한 동작을 하는지 의심스럽다', en:'at least five short and rapid blasts', rule:'제34조(d)' },
    { id:'bend',  bars:'L',     name:'장음 1회', mean:'장애물로 가려진 만곡부에 접근 중 (건너편 선박도 장음 1회로 응답)', en:'nearing a bend or obscured area', rule:'제34조(e)·제9조(f)' }
  ];
  const MEMO = '암기: 단음 1 = 우현(<span lang="en">starboard</span>, "원 스타"), 단음 2 = 좌현, 단음 3 = 후진. 추월 신호에서도 우현이 단음 1, 좌현이 단음 2.';

  /* 시간표: real = 장음 4초·단음 1초·간격 1초, fast = 절반 */
  let fast = false;
  function timeline(sig){
    const k = fast ? .5 : 1, out = []; let t = 0;
    for(const c of sig.bars){
      const d = (c === 'L' ? 4 : c === 'S' ? 1 : .8)*k;
      out.push({ t0:t, dur:d, kind:c });
      t += d + (c === 'R' ? .4 : 1)*k;
    }
    const last = out[out.length-1];
    return { list:out, total:last.t0 + last.dur };
  }

  /* ---------- 소리 ---------- */
  const A = { ctx:null, nodes:[], failed:false };
  function ctx(){
    if(A.failed) return null;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC){ A.failed = true; return null; }
      if(!A.ctx) A.ctx = new AC();
      if(A.ctx.state === 'suspended') A.ctx.resume();
      return A.ctx;
    }catch(e){ A.failed = true; return null; }
  }
  function schedule(tl){
    const c = ctx(); if(!c) return false;
    try{
      const base = c.currentTime + .06;
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1100; f.connect(c.destination);
      tl.list.forEach(b => {
        const g = c.createGain(), t = base + b.t0, e = t + b.dur;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.14, t + .05); g.gain.setValueAtTime(.14, Math.max(t + .05, e - .08)); g.gain.linearRampToValueAtTime(0, e);
        g.connect(f);
        [[220,'sawtooth'],[330,'sawtooth'],[221.5,'triangle']].forEach(([hz, type]) => { const o = c.createOscillator(); o.type = type; o.frequency.value = hz; o.connect(g); o.start(t); o.stop(e + .02); A.nodes.push(o); });
      });
      return true;
    }catch(e){ return false; }
  }
  function hush(){ A.nodes.forEach(o => { try{ o.stop(); }catch(e){} }); A.nodes = []; }

  /* ---------- 화면 ---------- */
  const svg = W.svg('svg', { viewBox:'0 0 680 190', role:'img', 'aria-label':'신호의 장음·단음 막대와 시간 눈금' });
  ui.stage.append(svg);
  const list = W.h('div', { style:{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))', gap:'8px', padding:'12px 14px', borderTop:'1px solid var(--rule)', background:'var(--panel)' } });
  const quizBox = W.h('div', { style:{ display:'none', padding:'12px 14px', borderTop:'1px solid var(--rule)', background:'var(--panel)' } });
  ui.stage.after(list, quizBox);

  let mode = 'play', sel = 3, playing = null, raf = 0;
  const q = { cur:-1, answered:false, right:0, total:0, reveal:false };

  const modeSeg = W.ui.seg(ui.controls, [{value:'play',label:'재생기'},{value:'quiz',label:'듣고 맞히기'}], mode, v => { mode = v; stop(); syncMode(); }, '모드');
  W.ui.seg(ui.controls, [{value:false,label:'실제 길이'},{value:true,label:'½ 빠르게 (연습용)'}], false, v => { fast = v; stop(); draw(); }, '속도');
  const playBtn = W.ui.btn(ui.controls, '▶ 재생', () => { if(playing) stop(); else if(mode === 'quiz' && q.cur < 0) newQ(); else play(mode === 'quiz' ? q.cur : sel); }, 'primary');
  const sState = W.ui.stat(ui.readout, '상태');
  const sScore = W.ui.stat(ui.readout, '점수');

  const T = (x, y, t, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.a||'start'}" font-size="${o.s||13}" font-weight="${o.w||500}" font-family="${o.mono ? 'var(--f-mono)' : 'var(--f-body)'}" fill="${o.c||'var(--ink)'}">${t}</text>`;

  function barsSvg(sig, w = 150, h = 18){
    const tl = timeline(sig);
    const k = (w - 4) / (fast ? 7 : 14);
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true" style="display:block">` +
      tl.list.map(b => `<rect x="${2 + b.t0*k}" y="${h/2-5}" width="${Math.max(3, b.dur*k)}" height="10" rx="3" fill="var(--ink)"/>`).join('') + `</svg>`;
  }

  function draw(progress = -1){
    const showIdx = mode === 'quiz' ? q.cur : sel;
    const hide = mode === 'quiz' && !q.answered && !q.reveal && !A.failed;
    const span = fast ? 7 : 14, x0 = 30, k = 620 / span;
    let s = `<rect width="680" height="190" fill="var(--panel)" opacity=".55"/>`;
    /* 눈금 */
    for(let t = 0; t <= span; t += (fast ? .5 : 1)){
      const x = x0 + t*k, major = Number.isInteger(t) && (fast || t % 2 === 0);
      s += `<line x1="${x}" y1="128" x2="${x}" y2="${major ? 138 : 133}" stroke="var(--ink-3)"/>`;
      if(major) s += T(x, 156, t + '초', {s:14, a:'middle', mono:true, c:'var(--ink-2)'});
    }
    s += `<line x1="${x0}" y1="128" x2="${x0 + span*k}" y2="128" stroke="var(--ink-3)"/>`;
    if(showIdx < 0){
      s += T(340, 80, '「새 문제」를 누르면 신호가 울린다', {s:20, w:700, a:'middle', c:'var(--ink-2)'});
    } else {
      const sig = SIGS[showIdx], tl = timeline(sig);
      s += T(x0, 30, hide ? '이 신호의 뜻은?' : `${sig.name}`, {s:20, w:700});
      if(!hide) s += T(x0, 54, `${sig.rule}`, {s:15, c:'var(--ink-2)'});
      if(hide){
        const on = tl.list.some(b => progress >= b.t0 && progress < b.t0 + b.dur);
        s += `<circle cx="340" cy="97" r="${on ? 22 : 16}" fill="${on ? 'var(--magenta)' : 'var(--ink-3)'}" opacity="${on ? 1 : .4}"/>`;
        s += T(340, 102, on ? '삐—' : '', {s:14, w:700, a:'middle', c:'var(--panel)'});
      }
      if(!hide) tl.list.forEach(b => {
        const x = x0 + b.t0*k, w = Math.max(4, b.dur*k);
        const on = progress >= b.t0 && progress < b.t0 + b.dur;
        s += `<rect x="${x}" y="82" width="${w}" height="30" rx="7" fill="${on ? 'var(--magenta)' : 'var(--ink)'}"/>`;
        if(!hide && w > 20) s += T(x + w/2, 76, b.kind === 'L' ? '장음' : '단음', {s:13, a:'middle', c:'var(--ink-2)'});
      });
      if(hide) s += T(x0, 56, '귀로만 듣고 맞혀 보자 (막대는 답한 뒤 공개)', {s:14, c:'var(--ink-3)'});
      if(progress >= 0) s += `<line x1="${x0 + progress*k}" y1="64" x2="${x0 + progress*k}" y2="132" stroke="var(--link)" stroke-width="2"/>`;
    }
    s += T(x0, 180, fast ? '연습용 ½ 속도: 장음 2초·단음 0.5초 (실제 길이 아님)' : '실제 길이: 장음 4초·단음 1초·간격 약 1초', {s:14, w:600, c: fast ? 'var(--magenta)' : 'var(--ink-2)'});
    svg.innerHTML = s;
  }

  /* 카드 목록 */
  function buildList(){
    list.innerHTML = '';
    SIGS.forEach((sig, i) => {
      const on = mode === 'play' && i === sel;
      const card = W.h('button', { type:'button', onclick:() => { if(mode === 'play'){ sel = i; stop(); buildList(); play(i); } },
        style:{ width:'100%', minWidth:'0', display:'flex', flexDirection:'column', justifyContent:'flex-start', textAlign:'left', border:'1px solid ' + (on ? 'var(--link)' : 'var(--rule)'), background:on ? 'var(--shoal)' : 'var(--panel)', borderRadius:'10px', padding:'9px 11px', cursor:'pointer', color:'var(--ink)', font:'inherit' } });
      card.innerHTML = barsSvg(sig) +
        `<div style="font-weight:700;font-size:14px;margin-top:5px">${sig.name}</div>` +
        `<div style="font-size:13.5px;line-height:1.45;color:var(--ink-2)">${sig.mean}</div>` +
        `<div style="font-size:12px;color:var(--ink-3);margin-top:2px"><span lang="en" style="font-family:var(--f-mono)">${sig.en}</span> · ${sig.rule}</div>`;
      list.append(card);
    });
    list.append(W.h('div', { html:MEMO, style:{ gridColumn:'1/-1', fontSize:'13.5px', color:'var(--ink-2)', padding:'4px 2px 0' } }));
  }

  /* 퀴즈 */
  let order = [];
  function buildQuiz(){
    quizBox.innerHTML = '';
    const row = W.h('div', { style:{ display:'flex', flexWrap:'wrap', gap:'8px', marginBottom:'10px' } });
    W.ui.btn(row, '새 문제', newQ, 'primary');
    W.ui.btn(row, '한 번 더 듣기', () => { if(q.cur >= 0){ stop(); play(q.cur); } });
    W.ui.btn(row, q.reveal ? '막대 숨기기' : '막대 보기 (힌트)', () => { q.reveal = !q.reveal; buildQuiz(); draw(); });
    quizBox.append(row);
    const grid = W.h('div', { style:{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))', gap:'6px' } });
    order.forEach(i => {
      const sig = SIGS[i];
      const right = q.answered && i === q.cur, wrong = q.answered && i === q.picked && i !== q.cur;
      const b = W.h('button', { type:'button', disabled:q.cur < 0 || q.answered ? true : null, onclick:() => answer(i),
        style:{ width:'100%', textAlign:'left', padding:'8px 10px', borderRadius:'8px', cursor:'pointer', font:'inherit', fontSize:'14px', lineHeight:'1.4', color:'var(--ink)',
          border:'1.5px solid ' + (right ? 'var(--ok)' : wrong ? 'var(--bad)' : 'var(--rule)'), background:'var(--panel)', opacity: q.cur < 0 ? '.6' : '1' } },
        W.h('span', { text:sig.mean }),
        q.answered ? W.h('span', { text:` — ${sig.name}`, style:{ color:'var(--ink-3)', fontSize:'12.5px' } }) : '');
      grid.append(b);
    });
    quizBox.append(grid);
    if(A.failed) quizBox.append(W.h('div', { text:'이 브라우저에서는 소리를 낼 수 없어 막대를 보고 맞히는 방식으로 진행한다.', style:{ fontSize:'13px', color:'var(--ink-3)', marginTop:'8px' } }));
  }
  function newQ(){
    stop();
    let n; do{ n = Math.floor(Math.random()*SIGS.length); } while(n === q.cur && SIGS.length > 1);
    q.cur = n; q.answered = false; q.picked = -1;
    order = SIGS.map((_, i) => i).sort(() => Math.random() - .5);
    ui.setVerdict('들은 신호의 뜻을 고르세요', null);
    buildQuiz(); play(n);
  }
  function answer(i){
    if(q.answered || q.cur < 0) return;
    q.answered = true; q.picked = i; q.total++;
    const sig = SIGS[q.cur], ok = i === q.cur;
    if(ok) q.right++;
    sScore(`${q.right} / ${q.total}`);
    ui.setVerdict(ok ? `정답 — ${sig.name}: ${sig.mean} (${sig.rule})` : `오답 — 정답은 ${sig.name}: ${sig.mean} (${sig.rule})`, ok);
    buildQuiz(); draw();
  }

  /* 재생 */
  function play(i){
    stop();
    const tl = timeline(SIGS[i]);
    const sound = schedule(tl);
    sState(sound ? '재생 중' : '소리 없이 표시 중 (이 브라우저는 소리 미지원)');
    if(A.failed && mode === 'quiz') q.reveal = true;
    const start = performance.now() + (sound ? 60 : 0);
    playing = { i, tl };
    playBtn.textContent = '■ 정지';
    const tick = now => {
      const p = (now - start)/1000;
      draw(Math.max(0, p));
      if(p > tl.total + .3){ stop(); return; }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }
  function stop(){
    if(raf) cancelAnimationFrame(raf); raf = 0;
    hush(); playing = null;
    playBtn.textContent = mode === 'quiz' && q.cur < 0 ? '▶ 문제 듣기' : '▶ 재생';
    sState(A.failed ? '소리 미지원 — 막대로 확인' : '대기');
    draw();
  }
  function syncMode(){
    list.style.display = mode === 'play' ? 'grid' : 'none';
    quizBox.style.display = mode === 'quiz' ? '' : 'none';
    sScore(`${q.right} / ${q.total}`);
    if(mode === 'quiz'){ if(!order.length) order = SIGS.map((_, i) => i); buildQuiz(); ui.setVerdict(q.cur < 0 ? '「새 문제」를 눌러 신호를 듣고 뜻을 고르세요' : (q.answered ? ui.verdict.textContent : '들은 신호의 뜻을 고르세요'), q.answered ? null : null); }
    else { buildList(); ui.setVerdict(`${SIGS[sel].name} = ${SIGS[sel].mean} (${SIGS[sel].rule})`, null); }
    stop();
  }
  /* 재생기 모드에서 카드 선택 시 판정줄 갱신 */
  const _play = play;
  play = function(i){ if(mode === 'play') ui.setVerdict(`${SIGS[i].name} = ${SIGS[i].mean} (${SIGS[i].rule})`, null); _play(i); };

  syncMode();
});

}catch(e){console.error("[load] src/sims/sound-signals.js", e)}
</script>
<script>/* src/sims/special-law.js */
try{
/* 특별법 우선의 원칙: 항구 앞 수역에서 선박을 옮기며 먼저 적용되는 법 확인 (제1조(b)) */
W.sim('special-law', (el) => {
  const ui = W.ui.box(el, { title:'어느 법이 먼저? 특별법 우선의 원칙', kind:'해보기',
    caption:'배를 끌거나 버튼으로 옮겨 보자. 그림은 부산항 오륙도·조도 방파제 같은 무역항 입구를 단순하게 새로 그린 것이고 축척이 아니다. 출처: 2주차 슬라이드(2_1) 8~9, (2_3) 7~8·13, 정리본 1~2장.' });

  const svg = W.svg('svg', { viewBox:'0 0 680 360', role:'img', 'aria-label':'무역항 방파제, 항계, 영해 한계를 그린 모식도와 선박' });
  ui.stage.append(svg);
  const lawBox = W.h('div', { style:{ borderTop:'1px solid var(--rule)', background:'var(--panel)', padding:'10px 14px 12px' } });
  const caseBox = W.h('div', { style:{ borderTop:'1px solid var(--rule)', background:'var(--magenta-tint)', borderLeft:'4px solid var(--magenta)', padding:'10px 14px', fontSize:'14.5px', lineHeight:'1.6' } });
  ui.stage.after(lawBox, caseBox);

  /* ---------- 지형 ---------- */
  const TOP = [[680,38],[600,43],[520,48],[440,55],[380,61],[330,64],[280,66],[0,66]];
  const BOT = [[0,294],[200,294],[240,300],[270,315],[290,335],[300,360]];
  const PL  = [[372,62],[402,112],[412,172],[398,238],[362,296],[312,340]];   // 무역항 수상구역 경계(모식)
  const ENTR = { x:212, y:176 };
  const smooth = pts => { let d = `M${pts[0][0]} ${pts[0][1]}`; for(let i = 1; i < pts.length-1; i++){ const mx = (pts[i][0]+pts[i+1][0])/2, my = (pts[i][1]+pts[i+1][1])/2; d += ` Q${pts[i][0]} ${pts[i][1]} ${mx} ${my}`; } const l = pts[pts.length-1]; return d + ` L${l[0]} ${l[1]}`; };
  const inPoly = (x, y, poly) => { let c = false; for(let i = 0, j = poly.length-1; i < poly.length; j = i++){ const [xi, yi] = poly[i], [xj, yj] = poly[j]; if(((yi > y) !== (yj > y)) && (x < (xj-xi)*(y-yi)/(yj-yi) + xi)) c = !c; } return c; };
  const topY = x => { for(let i = 0; i < TOP.length-1; i++){ const [x1,y1] = TOP[i], [x2,y2] = TOP[i+1]; if(x <= x1 && x >= x2) return y1 + (y2-y1)*(x-x1)/(x2-x1); } return 66; };
  const portPoly = [[200,66], ...PL, [270,315], [240,300], [200,294]];
  const isLand = (x, y) => y < topY(x) + 8 || inPoly(x, y, [...BOT, [0,360]]) || (x < 44 && y > 118 && y < 242) || (Math.abs(x-206) < 10 && (y < 154 || y > 198) && y > 66 && y < 294);
  const zoneOf = (x, y) => {
    if(x < 206 && y > 66 && y < 294) return 'harbor';
    if(inPoly(x, y, portPoly)) return 'port';
    if(x < 560) return 'coast';
    return 'open';
  };

  const ZONES = {
    harbor: { name:'방파제 안 (내항)', area:'무역항의 수상구역' },
    port:   { name:'방파제 밖, 항계 안', area:'무역항의 수상구역' },
    coast:  { name:'연안 (영해 안, 항계 밖)', area:'대한민국 영해' },
    open:   { name:'영해 밖 (EEZ·공해)', area:'영해 밖' }
  };
  /* 각 수역에서 세 법의 위치 */
  const LAWS = [
    { k:'ip',  name:'선박입출항법', full:'선박의 입항 및 출항 등에 관한 법률 (구 개항질서법)', kind:'특별법' },
    { k:'mt',  name:'해상교통안전법', full:'COLREG을 국내법으로 받아들인 법 (구 해사안전법)', kind:'일반법(국내)' },
    { k:'col', name:'COLREG', full:'1972년 국제해상충돌예방규칙', kind:'일반법(국제)' }
  ];
  const RANK = {
    harbor: { ip:[1,'먼저 적용 — 무역항의 수상구역등 안의 특별법'], mt:[2,'특별법이 정하지 않은 사항에 적용'], col:[2,'국내에서는 해상교통안전법으로 같은 내용이 적용'] },
    port:   { ip:[1,'먼저 적용 — 방파제 밖이라도 항계 안이면 수상구역'], mt:[2,'특별법이 정하지 않은 사항에 적용'], col:[2,'국내에서는 해상교통안전법으로 같은 내용이 적용'] },
    coast:  { ip:[0,'적용 안 됨 — 무역항의 수상구역 밖'], mt:[1,'먼저 적용 — 대한민국 영해·내수의 선박'], col:[2,'같은 내용 (해상교통안전법이 COLREG을 수용)'] },
    open:   { ip:[0,'적용 안 됨'], mt:[2,'대한민국 선박에만 적용 (영해 밖의 대한민국 선박)'], col:[1,'적용 — 공해와 이어진 바다의 모든 선박'] }
  };

  /* ---------- 정류 지점 ---------- */
  const ST = [
    { name:'내항',        in:{x:112,y:186,h:270}, out:{x:96,y:186,h:90} },
    { name:'방파제 입구',  in:{x:264,y:216,h:320}, out:{x:186,y:166,h:90} },
    { name:'연안(영해)',   in:{x:458,y:204,h:290}, out:{x:458,y:204,h:110} },
    { name:'영해 밖',      in:{x:622,y:214,h:280}, out:{x:622,y:214,h:100} }
  ];
  let dir = 'in', st = 1, pos = { ...ST[1].in }, dragging = false;

  const rowBtns = W.h('div', { style:{ display:'flex', gap:'6px', flexWrap:'wrap' } });
  ui.controls.append(rowBtns);
  W.ui.btn(rowBtns, '◀ 항구 쪽으로', () => go(Math.max(0, st-1)));
  W.ui.btn(rowBtns, '바다 쪽으로 ▶', () => go(Math.min(ST.length-1, st+1)));
  W.ui.seg(ui.controls, [{value:'in',label:'입항선'},{value:'out',label:'출항선'}], dir, v => { dir = v; go(st); }, '내 배');
  const sZone = W.ui.stat(ui.readout, '위치');
  const sArea = W.ui.stat(ui.readout, '수역');

  function go(i){ st = i; pos = { ...ST[i][dir] }; draw(); }

  let fs = 1;
  const T = (x, y, t, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.a||'middle'}" font-size="${(o.s||13)*fs}" font-weight="${o.w||500}" font-family="var(--f-body)" fill="${o.c||'var(--ink)'}">${t}</text>`;

  function scene(){
    fs = (el.clientWidth || 800) < 560 ? 1.3 : 1;
    let s = W.parts.arrowDefs('slA', 'var(--ink-2)');
    s += `<rect width="680" height="360" fill="var(--sea)"/>`;
    s += `<rect x="560" y="0" width="120" height="360" fill="var(--sea-deep)"/>`;
    /* 항계 안 수역 살짝 강조 */
    s += `<path d="M200 66 L372 62 ${smooth(PL).replace(/^M[^Q]*/, 'L372 62 ')} L270 315 L240 300 L200 294 Z" fill="var(--link)" opacity=".07"/>`;
    s += `<path d="M0 0 H680 V38 ${smooth(TOP).replace(/^M\S+ \S+/, '')} Z" fill="var(--land)" stroke="var(--ink-3)"/>`;
    s += `<path d="${smooth(BOT)} L0 360 Z" fill="var(--land)" stroke="var(--ink-3)"/>`;
    /* 부두 */
    s += `<rect x="0" y="118" width="44" height="124" fill="var(--land)" stroke="var(--ink-3)"/>`;
    s += T(22, 184, '부두', {s:13, c:'var(--ink-2)'});
    /* 방파제 */
    s += `<path d="M200 66 L210 154 M200 294 L210 198" stroke="var(--ink-2)" stroke-width="7" stroke-linecap="round"/>`;
    s += T(190, 88, '방파제', {s:13, c:'var(--ink-2)', a:'end'});
    s += T(194, 262, '방파제', {s:13, c:'var(--ink-2)', a:'end'});
    s += T(84, 96, '내항', {s:15, w:700});
    /* 항계 */
    s += `<path d="${smooth(PL)}" fill="none" stroke="var(--link)" stroke-width="2.2" stroke-dasharray="8 5"/>`;
    s += T(300, 98, '무역항의 수상구역', {s:14, w:700, c:'var(--link)'});
    s += T(300, 115, '(항계 안)', {s:12.5, c:'var(--link)'});
    /* 영해 한계 */
    s += `<line x1="560" y1="47" x2="560" y2="360" stroke="var(--ink-2)" stroke-width="1.6" stroke-dasharray="6 5"/>`;
    s += T(480, 300, '연안 (영해)', {s:15, w:700});
    s += T(480, 318, '항계 밖', {s:12, c:'var(--ink-2)'});
    s += T(620, 72, '영해 밖', {s:15, w:700});
    s += T(620, 90, '(EEZ·공해)', {s:12, c:'var(--ink-2)'});
    s += T(556, 345, '12해리 ≈', {s:12, c:'var(--ink-2)', a:'end'});
    /* 다른 선박: 방파제 법칙 */
    const z = zoneOf(pos.x, pos.y);
    const showCase = st === 1 && !dragging;
    if(showCase){
      const other = dir === 'in' ? ST[1].out : ST[1].in;
      const otherRole = dir === 'in' ? 'standon' : 'giveway';
      s += `<g transform="translate(${other.x} ${other.y}) rotate(${other.h})">${W.parts.ship({len:34, role:otherRole})}</g>`;
      s += T(other.x + (dir === 'in' ? -30 : 34), other.y + (dir === 'in' ? -26 : 30), dir === 'in' ? '출항선' : '입항선', {s:13, w:700, c: dir === 'in' ? 'var(--standon)' : 'var(--giveway)'});
      /* 입항선 대기 표시: 방파제 밖에서 진로를 비킴 */
      s += T(300, 262, '입항선: 방파제 밖에서 피함', {s:13, w:700, c:'var(--giveway)', a:'start'});
      s += `<path d="M298 256 L278 232" stroke="var(--giveway)" stroke-width="1.4" marker-end="url(#slA)"/>`;
    }
    /* 내 배 */
    const ownRole = showCase ? (dir === 'in' ? 'giveway' : 'standon') : null;
    s += `<g id="own" style="cursor:grab;touch-action:none" transform="translate(${pos.x} ${pos.y}) rotate(${pos.h})">` +
         `<circle r="26" fill="var(--link)" opacity=".12"/>` + W.parts.ship({len:36, role:ownRole, fill:'var(--panel)'}) + `</g>`;
    const lx = Math.min(640, Math.max(40, pos.x)), ly = pos.y > 120 ? pos.y - 32 : pos.y + 44;
    s += T(lx, ly, '내 배' + (showCase ? (dir === 'in' ? ' (입항)' : ' (출항)') : ''), {s:13.5, w:700, c:'var(--link)'});
    svg.innerHTML = s;
    return z;
  }

  function draw(){
    const z = scene();
    sZone(ZONES[z].name); sArea(ZONES[z].area);
    /* 법 순위표 */
    lawBox.innerHTML = '';
    lawBox.append(W.h('div', { text:'이 위치에서 적용 순서', style:{ fontSize:'12px', fontWeight:'600', letterSpacing:'.05em', color:'var(--ink-3)', marginBottom:'6px' } }));
    LAWS.forEach(L => {
      const [r, note] = RANK[z][L.k];
      const first = r === 1, none = r === 0;
      lawBox.append(W.h('div', { style:{ display:'flex', gap:'10px', alignItems:'flex-start', padding:'7px 10px', margin:'4px 0', borderRadius:'8px',
          border:'1px solid ' + (first ? 'var(--link)' : 'var(--rule)'), background: first ? 'var(--shoal)' : 'transparent', opacity: none ? '.55' : '1' } },
        W.h('span', { text: first ? '①' : none ? '–' : '②', style:{ fontFamily:'var(--f-mono)', fontWeight:'700', fontSize:'16px', color: first ? 'var(--link)' : 'var(--ink-3)', minWidth:'18px' } }),
        W.h('div', null,
          W.h('div', null, W.h('b', { text:L.name }), W.h('span', { text:'  ' + L.kind, style:{ fontSize:'12px', color:'var(--ink-3)' } })),
          W.h('div', { text:note, style:{ fontSize:'13.5px', color:'var(--ink-2)', lineHeight:'1.5' } }))));
    });
    /* 방파제 법칙 사례 */
    if(st === 1 && !dragging){
      caseBox.hidden = false;
      caseBox.innerHTML = `<b style="color:var(--magenta)">★ 방파제 입구에서 입항선과 출항선이 마주칠 우려</b><br>` +
        `<b>COLREG만 보면:</b> 출항선이 입항선을 자기 <b>우현</b>에 두고 횡단하므로 출항선이 피항선이다(제15조).<br>` +
        `<b>선박입출항법 제13조:</b> 입항하는 선박은 방파제 입구 등에서 출항하는 선박과 마주칠 우려가 있으면 <b>방파제 밖에서 출항선의 진로를 피하여야 한다</b>.<br>` +
        `<b>결론:</b> 무역항의 수상구역이므로 특별법인 선박입출항법이 먼저 → <b>입항선이 피한다</b>(${dir === 'in' ? '내 배가 피항' : '내 배는 출항선 — 입항선이 피해 줌'}).`;
      ui.setVerdict(`먼저 적용: 선박입출항법 → 입항선이 방파제 밖에서 출항선을 피함 (특별법 우선의 원칙, 제1조(b))`, true);
    } else {
      caseBox.hidden = false;
      caseBox.innerHTML = `<b style="color:var(--magenta)">★ 특별법 우선의 원칙</b> — 같은 일을 일반법과 특별법이 다르게 정하면 <b>특별법이 먼저</b> 적용된다. 항법에서는 COLREG(국내법은 해상교통안전법)이 일반법, 선박입출항법이 특별법이다. COLREG 제1조(b)도 항만·하천 등에 대한 관할 당국의 특별규칙 시행을 방해하지 않는다고 정한다(단, 특별규칙은 가능한 한 COLREG에 가깝게). 답안에는 "선박이 어디에 있는가"를 먼저 보고 "특별법 우선의 원칙"을 쓴다.`;
      const first = LAWS.find(L => RANK[z][L.k][0] === 1);
      const why = z === 'coast' ? '영해 안, 무역항 수상구역 밖 — 해상교통안전법(COLREG 수용)'
        : z === 'open' ? '영해 밖 — 국제규칙 COLREG (대한민국 선박에는 해상교통안전법도)'
        : '무역항의 수상구역 — 특별법 우선의 원칙';
      ui.setVerdict(`먼저 적용: ${first.name} (${why})`, true);
    }
    hookDrag();
  }

  /* ---------- 끌기 ---------- */
  function toSvg(e){ const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
  function headingFor(x, y){
    let b;
    if(x < 206) b = 270;                                   // 항내: 부두 쪽
    else b = W.nav.norm(W.nav.deg(Math.atan2(ENTR.x - x, -(ENTR.y - y))));   // 입구 쪽 방위
    return dir === 'in' ? b : W.nav.norm(b + 180);
  }
  function hookDrag(){
    const g = svg.querySelector('#own');
    g.addEventListener('pointerdown', e => {
      dragging = true; e.preventDefault();
      const move = ev => {
        const p = toSvg(ev);
        const x = Math.max(20, Math.min(668, p.x)), y = Math.max(20, Math.min(350, p.y));
        if(isLand(x, y)) return;
        pos = { x, y, h: headingFor(x, y) };
        st = { harbor:0, port:1, coast:2, open:3 }[zoneOf(x, y)];
        draw();
      };
      const up = () => {
        dragging = false;
        window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
        const z = zoneOf(pos.x, pos.y);
        go({ harbor:0, port:1, coast:2, open:3 }[z]);
      };
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
    });
  }
  draw();
  if(typeof ResizeObserver !== 'undefined') new ResizeObserver(() => { const f = (el.clientWidth || 800) < 560 ? 1.3 : 1; if(f !== fs && !dragging) draw(); }).observe(el);
});

}catch(e){console.error("[load] src/sims/special-law.js", e)}
</script>
<script>/* src/sims/standon-stages.js */
try{
/* 제17조 유지선 의무 3단계 (제16조·제34조(d) 포함): 피항선이 피하지 않는 횡단 상황에서 TCPA가 줄어들 때 유지선이 할 일 */
W.sim('standon-stages', (el) => {
  const ui = W.ui.box(el, {
    title: '유지선의 3단계 — 피항선이 안 피할 때 (제17조)',
    kind: '해보기',
    caption: '횡단하는 상태에서 피항선(보라)이 아무 동작도 하지 않는다. 시간을 앞으로 돌리며 유지선(남색 = 내 배)이 단계마다 무엇을 <b>해야 하는지/해도 되는지</b> 보자. ' +
      'TCPA 15분·10분, 6L·9L 기준은 조문이 아니라 <b>교수님이 수업에서 제시한 실무 기준</b>이다(10주차). 계산: TCPA(분) = n×L(m) ÷ 1,852 ÷ 속력(kn) × 60.'
  });
  const N = W.nav;
  const VW = 600, SCN = 300, LEG = 80, VH = SCN + LEG + 92;
  const svg = W.svg('svg', { viewBox: `0 0 ${VW} ${VH}`, role: 'img', 'aria-label': '유지선과 피항선의 횡단 상황 평면도와 단계 시간축' });
  ui.stage.append(svg);
  const panel = W.h('div', { style: { background: 'var(--panel)', borderTop: '1px solid var(--rule)', padding: '10px 14px', fontSize: '13.5px', lineHeight: '1.6', color: 'var(--ink)' } });
  ui.stage.append(panel);

  const TMAX = 20, GW = { c: 80, s: 14 };
  let elapsed = 6, L = 200, v1 = 12, view = null;

  const tcpaOf = n => n*L/1852/v1*60;        // 분
  const T15 = 15, T10 = 10;

  const tSl = W.ui.range(ui.controls, { label: '시간 진행', min: 0, max: TMAX - .5, step: .1, value: elapsed, fmt: v => `TCPA ${(TMAX - v).toFixed(1)}분`, oninput: v => { elapsed = v; draw(); } });
  const lSl = W.ui.range(ui.controls, { label: '내 배 길이 L', min: 100, max: 300, step: 10, value: L, unit: ' m', oninput: v => { L = v; draw(); } });
  const sSl = W.ui.range(ui.controls, { label: '내 배 속력', min: 10, max: 20, step: 1, value: v1, unit: ' kn', oninput: v => { v1 = v; draw(); } });
  const playBtn = W.ui.btn(ui.controls, '재생', () => { if(loop.playing){ loop.pause(); playBtn.textContent = '재생'; } else { if(elapsed >= TMAX - .5) elapsed = 0; loop.play(); playBtn.textContent = '일시정지'; } }, 'primary');
  W.ui.btn(ui.controls, '경고신호 듣기', () => blasts());
  const setT = W.ui.stat(ui.readout, 'TCPA');
  const setR = W.ui.stat(ui.readout, '거리');
  const setB = W.ui.stat(ui.readout, '컴퍼스 방위');
  const set9 = W.ui.stat(ui.readout, '9L TCPA');
  const set6 = W.ui.stat(ui.readout, '6L TCPA');

  /* 단음 5회 (Web Audio) */
  let actx = null;
  function blasts(){
    try{
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = actx.currentTime + .05;
      for(let i = 0; i < 5; i++){
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sawtooth'; o.frequency.value = 220;
        const a = t0 + i*1.2;
        g.gain.setValueAtTime(0, a); g.gain.linearRampToValueAtTime(.12, a + .04); g.gain.setValueAtTime(.12, a + .8); g.gain.linearRampToValueAtTime(0, a + .9);
        o.connect(g).connect(actx.destination); o.start(a); o.stop(a + .95);
      }
    }catch(e){}
  }

  /* 위치: 충돌 지점 C = 원점. 남은 시간 t(분) */
  const ownAt = t => ({ x: 0, y: -v1*t/60 });
  const gwAt = t => { const v = N.vel(GW.c, GW.s); return { x: -v.x*t/60, y: -v.y*t/60 }; };
  // 현재 두 선박과 충돌 지점이 늘 크게 보이도록 화면을 맞춘다(글자 자리 여백 포함)
  function fit(t = TMAX - elapsed){
    const pts = [ownAt(t), gwAt(t), { x: 0, y: 0 }];
    const x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x));
    const y0 = Math.min(...pts.map(p => p.y)), y1 = Math.max(...pts.map(p => p.y));
    const xs = Math.max(x1 - x0, .9), ys = Math.max(y1 - y0, .9);
    const PL = 150, PR = 190, PT = 40, PB = 64;
    const scale = Math.min((VW - PL - PR)/xs, (SCN - PT - PB)/ys);
    view = { cx: PL + (VW - PL - PR)/2, cy: PT + (SCN - PT - PB)/2, scale, ox: (x0 + x1)/2, oy: (y0 + y1)/2 };
  }
  const S = p => N.toScreen(p, view);
  const txt = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.size || 13}" font-weight="${o.w || 400}" text-anchor="${o.a || 'start'}" font-family="var(--f-body)" fill="${o.fill || 'var(--ink)'}">${s}</text>`;

  const STAGES = [
    { key: 0, short: '관계 성립 전', title: '항법 관계 성립 전 — 위험성 평가', rule: '제7조',
      body: '아직 TCPA 15분보다 멀다. 레이더와 컴퍼스 방위로 상대가 계속 접근하는지(방위 변화가 없는지) 평가한다. 방위가 변하지 않고 거리가 줄면 충돌의 위험이 있다.',
      easy: '“저 배, 우리랑 부딪히는 길인가?”를 지켜보는 단계.' },
    { key: 1, short: '① 유지', title: '① 침로와 속력을 유지 — 제17조(a)(i)', rule: '17(a)(i)',
      body: '두 선박 중 한 척이 피해야 하면, 다른 선박(유지선)은 <b>침로와 속력을 유지해야 한다</b>(shall keep her course and speed). 교수님 실무: <b>TCPA 15분 전</b>쯤 항법 관계가 성립하고, 피항선은 이때 <b>미리 크게</b> 피해야 한다(제16조). 유지선은 방위 변화를 계속 확인한다.',
      easy: '우선권이 있는 쪽은 “예측 가능하게” 가만히 가 주는 것이 의무다. 내가 먼저 움직이면 상대가 헷갈린다.' },
    { key: 2, short: '② 단독 동작 가능', title: '② 단독으로 피해도 됨 — 제17조(a)(ii)', rule: '17(a)(ii)·17(c)·34(d)',
      body: '피항선이 적절한 동작을 하지 않는 것이 <b>분명해지는 즉시</b>, 유지선은 <b>자선의 조종만으로</b> 충돌을 피하는 동작을 <b>할 수 있다</b>(may). 교수님 실무: 불안하면 <b>TCPA 10분 전</b>쯤 미리 피해 CPA를 넓혀도 된다.' +
        '<ul style="margin:6px 0 0 18px;padding:0">' +
        '<li><b style="color:var(--magenta)">좌현 변침 금지</b>(제17조(c)): 횡단 상태에서 이 단계의 동력선은 사정이 허락하는 한 자선의 좌현 쪽 선박을 향해 좌현 변침하지 않는다. 피항선이 뒤늦게 우현 변침하면 마주 달려들기 때문이다.</li>' +

        '<li>판단이 안 서면 <b>선장 호출</b>(call the captain).</li></ul>',

    { key: 3, short: '③ 협력동작 의무', title: '③ 최선의 협력동작 의무 — 제17조(b)', rule: '17(b)·17(d)',

        '<div style="margin-top:6px;padding:6px 10px;border-left:3px solid var(--magenta);background:var(--paper)"><b>언제까지? — 협력동작의 마지노선</b><br>' +

        '· <b>6L TCPA</b>(학과 다른 교수님 견해, 도선사 시험 출제위원): IMO 기준 전진거리 최대 4.5L + 90° 회두 후 여유 1.5L. <b>관련 시험 문제는 6L TCPA로 쓸 것.</b></div>' +
        '유지선이 막판에 피해도 <b>피항선이 되는 것은 아니다</b>. 피항선의 피항 의무는 그대로다(제17조(d)).',

  ];
  const stageOf = t => t > T15 ? 0 : t > T10 ? 1 : t > tcpaOf(9) ? 2 : 3;

  function draw(){
    fit();
    const t = TMAX - elapsed, st = stageOf(t), t9 = tcpaOf(9), t6 = tcpaOf(6);
    const O = S(ownAt(t)), G = S(gwAt(t)), C = S({ x: 0, y: 0 });
    const narrow = (ui.stage.clientWidth || 600) < 520, FS = narrow ? 19 : 13, SL = narrow ? 40 : 34;
    const LF = narrow ? 18 : 13; let leg = '';
    let s = W.parts.arrowDefs('ss-ok', 'var(--link)') + W.parts.arrowDefs('ss-no', 'var(--magenta)');

    const O0 = S(ownAt(TMAX)), G0 = S(gwAt(TMAX));

    s += `<line x1="${O.x}" y1="${O.y}" x2="${G.x}" y2="${G.y}" stroke="var(--link)" stroke-width="1.6" opacity=".8"/>`;

      const p = S({ x: 0, y: -n*L/1852 });

    s += `<circle cx="${C.x}" cy="${C.y}" r="7" fill="none" stroke="var(--magenta)" stroke-width="1.6"/>` + txt(C.x + 12, C.y - 8, '그대로 가면 충돌', { size: FS - 1, fill: 'var(--magenta)' });

    if(st >= 2){

      s += `<path d="M${O.x} ${O.y - SL*.6} Q ${O.x - 6} ${O.y - SL*1.7}, ${O.x - SL*1.3} ${O.y - SL*1.8}" fill="none" stroke="var(--magenta)" stroke-width="2" stroke-dasharray="4 3"/>`;
      const X = { x: O.x - SL*1.3, y: O.y - SL*1.8 };
      s += `<path d="M${X.x - 7} ${X.y - 7} L${X.x + 7} ${X.y + 7} M${X.x + 7} ${X.y - 7} L${X.x - 7} ${X.y + 7}" stroke="var(--magenta)" stroke-width="3" stroke-linecap="round"/>`;

      leg += `<path d="M20 ${ly(1) - LF*.75} l10 10 m0 -10 l-10 10" stroke="var(--magenta)" stroke-width="2.6" stroke-linecap="round"/>` + txt(42, ly(1), '좌현 변침 금지 — 제17조(c)', { size: LF, fill: 'var(--magenta)', w: 700 });
      leg += txt(18, ly(2), big ? '유지선이어도 이제는 반드시 동작한다(shall)' : '• • • • •  경고신호 단음 5회 이상 — 제34조(d)', { size: LF, w: 700 });
    }
    if(st === 2){
      for(let i = 1; i <= 3; i++) s += `<path d="M${O.x + 14 + i*8} ${O.y - 10 - i*5} A ${10 + i*8} ${10 + i*8} 0 0 1 ${O.x + 14 + i*8} ${O.y + 10 + i*5}" fill="none" stroke="var(--ink-2)" stroke-width="1.6"/>`;
    }
    // 선박
    s += `<g transform="translate(${G.x} ${G.y}) rotate(${GW.c})">${W.parts.ship({ type: 'power', len: SL, role: 'giveway' })}</g>`;

    s += txt(Math.max(90, G.x), G.y - SL*.6 - 4, '피항선 · 동작 없음', { size: FS, fill: 'var(--giveway)', w: 700, a: 'middle' });
    s += txt(O.x - SL*.4, O.y + SL*.5 + FS, '내 배 · 유지선', { size: FS, fill: 'var(--standon)', w: 700, a: 'end' });

    // 시간축
    const X0 = 22, X1 = VW - 22, Y = SCN + LEG + 26, H = 30;
    const tx = tt => X0 + (TMAX - tt)/TMAX*(X1 - X0);
    s += `<rect x="0" y="${SCN}" width="${VW}" height="${VH - SCN}" fill="var(--panel)"/>` + leg;
    if(st < 2) s += txt(18, SCN + 6 + LF*1.25, st === 0 ? '방위가 변하지 않고 거리가 줄어든다 → 충돌의 위험' : '유지선: 침로와 속력을 그대로 — 17(a)(i)', { size: LF, fill: 'var(--ink-2)', w: 700 });
    const zones = [[TMAX, T15, 'var(--ink-3)', '관계 전'], [T15, T10, 'var(--standon)', '① 유지'], [T10, t9, 'var(--link)', '② 단독 가능'], [t9, 0, 'var(--magenta)', '③ 협력 의무']];
    zones.forEach(([a, b, c, label], i) => {
      const x1 = tx(a), x2 = tx(b);
      s += `<rect x="${x1}" y="${Y}" width="${x2 - x1}" height="${H}" fill="${c}" opacity="${i === st ? .32 : .12}"/>`;
      s += txt((x1 + x2)/2, Y + H/2 + 5, label, { size: narrow ? 17 : 12.5, a: 'middle', w: i === st ? 700 : 400 });
    });
    [[T15, '15분'], [T10, '10분'], [t9, '9L'], [t6, '6L'], [0, '충돌']].forEach(([tt, lab]) => {
      const x = tx(tt), c = lab === '6L' ? 'var(--magenta)' : 'var(--ink-2)';

      s += txt(x, Y + H + 18, lab, { size: narrow ? 16 : 12, a: lab === '충돌' ? 'end' : 'middle', fill: c, w: lab.includes('L') ? 700 : 400 });
    });
    const xm = tx(t);
    s += `<path d="M${xm} ${Y - 2} l-7 -12 h14 z" fill="var(--ink)"/>`;
    s += txt(X0, Y - 8, 'TCPA(충돌까지 남은 시간) →', { size: narrow ? 16 : 12, fill: 'var(--ink-2)' });
    svg.innerHTML = s;

    // 읽기값
    const ownP = ownAt(t), gwP = gwAt(t);
    setT(`${t.toFixed(1)}분`); setR(N.fmtNM(N.dist(ownP, gwP))); setB(N.fmtDeg(N.bearing(ownP, gwP)) + ' (변화 없음)');
    set9(`${t9.toFixed(1)}분`); set6(`${t6.toFixed(1)}분`);
    // 패널
    const S_ = STAGES[st];
    const steps = STAGES.map((x, i) => `<span style="display:inline-block;padding:2px 9px;margin:0 4px 4px 0;border-radius:999px;font-size:12.5px;border:1px solid ${i === st ? 'var(--ink)' : 'var(--rule)'};${i === st ? 'background:var(--ink);color:var(--paper);font-weight:700' : 'color:var(--ink-2)'}">${x.short}</span>`).join('');
    panel.innerHTML = `<div>${steps}</div><div style="font-weight:700;font-size:14.5px;margin:4px 0">${S_.title}</div><div>${S_.body}</div>` +
      (st === 3 && t <= t6 ? `<div style="margin-top:6px;color:var(--magenta);font-weight:700">6L TCPA(${t6.toFixed(1)}분)도 지났다 — 마지노선을 넘은 상태.</div>` : '') +
      `<div style="margin-top:8px;padding:6px 10px;background:var(--paper);border-radius:6px"><b>쉽게 말하면</b> ${S_.easy}</div>`;
    const V = [
      '유지선: 아직 항법 관계 전 — 방위 변화를 관찰 (제7조)',
      '유지선: 침로·속력 유지 의무 (제17조(a)(i))',
      '유지선: 단독 동작 가능(may) — 좌현 변침은 금지 (제17조(a)(ii)·(c)), 경고신호 단음 5회 이상 (제34조(d))',
      '유지선: 충돌을 피하는 데 가장 도움이 되는 동작 의무(shall) (제17조(b))'
    ];
    ui.setVerdict(V[st], st === 3 ? false : st === 0 ? null : true);
  }

  const loop = W.ui.loop(ui.stage, (dt) => {
    elapsed = Math.min(TMAX - .5, elapsed + dt*1.0);
    tSl.set(elapsed); draw();
    if(elapsed >= TMAX - .5){ loop.pause(); playBtn.textContent = '재생'; }
  }, false);

  draw();
});

}catch(e){console.error("[load] src/sims/standon-stages.js", e)}
</script>

    if(r === 'open' || r === 'port') return { v:'TSS를 이용하지 않는 선박은 가능한 한 넓은 여유를 두고 TSS에서 떨어진다 (제10조(h))', ok:true,
      d:'TSS 바깥에서는 일반 항법을 따른다. TSS에 가까이 다가가야 한다면 종단부나 소각도 합류 규정을 지킨다.' };
    if(r === 'laneW' || r === 'laneE'){
      const dir = r === 'laneW' ? 270 : 90, a = Math.abs(nv.signed(h - dir));
      if(type === 'fishing') extra.push('어로종사선은 통항로를 따라 항행하는 <b>모든 선박</b>의 통항을 방해하지 않아야 한다(제10조(i)).');
      if(type === 'small') extra.push('범선·길이 20m 미만 선박은 통항로를 따라 항행하는 <b>동력선</b>의 안전한 통항을 방해하지 않아야 한다(제10조(j)).');
      if(a <= 20){
        const nearSep = (r === 'laneW' && ship.y > Yw1 - 14) || (r === 'laneE' && ship.y < Ys1 + 14);
        if(nearSep) return { v:'분리대에 너무 붙음 — 실행 가능한 한 분리선·분리대에서 떨어져 항행 (제10조(b)(ii))', ok:false, d:'흐름 방향은 맞지만, 분리대 가까이는 마주 오는 통항로와 가깝다. 결과적으로 우측 통항이 된다(좁은 수로와 같음). ' + extra.join(' ') };
        return { v:`통항로의 일반적인 교통 흐름 방향으로 진행 (제10조(b)(i))${a > 3 ? ' · 옆에서 합류·이탈 중이면 이처럼 가능한 한 작은 각도로 (제10조(b)(iii))' : ''}`, ok:true,
          d:`흐름 방향과 ${Math.round(a)}° 차이. 원칙적으로 통항로에는 끝단에서 들어가고 나오며, 옆에서 합류·이탈할 때는 가능한 한 작은 각도(실무상 10° 내외)로 한다. 통항로 안에서도 다른 선박과 충돌 위험이 생기면 일반 항법이 그대로 적용된다(제10조(a)). ` + extra.join(' ') };
      }
      if(a >= 70 && a <= 110) return { v:`통항로 횡단: 선수 방향이 교통 흐름에 거의 직각 (${Math.round(a)}°) — 적합 (제10조(c))`, ok:true,
        d:'통항로 횡단은 가능한 한 피하되, 부득이하면 선수 방향을 교통 흐름에 가능한 한 직각으로 한다. 횡단선과 통항로를 따라가는 선박 사이에서는 횡단 항법(제15조) 등 일반 항법이 그대로 적용된다 — 통항로 선박에 우선권이 없다(제10조(a)). ' + extra.join(' ') };
      if(a >= 160) return { v:'역방향 항행 — 통항로의 일반적인 교통 흐름 방향으로 진행해야 한다 (제10조(b)(i)) — 위반', ok:false,
        d:`이 통항로의 흐름은 ${nv.fmtDeg(dir)}이다. 반대 방향으로 가려면 반대편 통항로를 이용한다. ` + extra.join(' ') };
      if(a < 70) return { v:`비스듬한 각도 (흐름과 ${Math.round(a)}°) — 합류라면 "가능한 한 작은 각도"(제10조(b)(iii)), 횡단이라면 "선수 방향을 직각에 가깝게"(제10조(c)) — 어느 쪽에도 맞지 않음`, ok:false,
        d:'어중간한 각도는 다른 선박이 이 배가 통항로를 따라가는지 횡단하는지 알 수 없게 만든다. 합류는 작은 각도로, 횡단은 직각에 가깝게. ' + extra.join(' ') };
      return { v:`교통 흐름을 거슬러 비스듬히 진행 (흐름과 ${Math.round(a)}°) — 위반 (제10조(b)(i)·(c))`, ok:false, d:extra.join(' ') };
    }
    if(r === 'sep'){
      if(axis >= 70) return { v:'횡단 중: 횡단하는 선박은 분리대를 지나갈 수 있다 (제10조(e)) · 선수 방향 직각에 가깝게 (제10조(c))', ok:true, d:'분리대 진입 금지의 예외: 횡단·합류·이탈하는 선박. ' + extra.join(' ') };
      if(type === 'fishing') return { v:'분리대 안에서 어로에 종사 — 허용 (제10조(e)(ii))', ok:true, d:'단, 통항로를 따라 항행하는 모든 선박의 통항을 방해하지 않아야 한다(제10조(i)). ' + extra.join(' ') };
      return { v:'분리대에 들어가면 안 된다 (제10조(e)) — 위반', ok:false,
        d:'예외는 ① 횡단·합류·이탈하는 선박 ② 급박한 위험을 피하기 위한 비상시 ③ 분리대 안에서 어로에 종사하는 경우뿐이다. ' + extra.join(' ') };
    }
    if(r === 'itz'){
      if(type !== 'power') return { v:`${tName}는 연안통항대를 이용할 수 있다 (제10조(d)(i))`, ok:true, d:'길이 20m 미만 선박, 범선, 어로종사선은 연안통항대를 쓸 수 있다. ' + extra.join(' ') };
      const bP = nv.norm(nv.deg(Math.atan2(PORT.x - ship.x, -(PORT.y - ship.y)))), dP = Math.hypot(PORT.x - ship.x, PORT.y - ship.y);
      const toPort = dP < 130 && Math.abs(nv.signed(bP - h)) <= 25;
      const fromPort = dP < 130 && Math.abs(nv.signed(bP + 180 - h)) <= 25;
      if(toPort || fromPort) return { v:'연안통항대 안의 항구로 출입 — 동력선도 이용 가능 (제10조(d)(ii))', ok:true,
        d:'연안통항대 안의 항구·해양구조물·도선 장소 등을 오가거나 급박한 위험을 피할 때는 어떤 선박이든 연안통항대를 쓸 수 있다. ' + extra.join(' ') };
      return { v:'인접 통항로를 안전하게 쓸 수 있는 동력선은 연안통항대를 이용하지 않는다 (제10조(d)(i)) — 위반', ok:false,
        d:'예외: 길이 20m 미만 선박·범선·어로종사선(제10조(d)(i)), 연안통항대 안의 항구 등을 출입하거나 급박한 위험을 피하는 선박(제10조(d)(ii)). 「선박」을 바꾸거나 「연안 항구로 입항」 예시를 눌러 보자. ' + extra.join(' ') };
    }
    /* 종단부 */
    const inE = ship.y >= Ys1 && ship.y < Ye1, inW = ship.y >= Yw0 && ship.y < Yw1;
    const aE = Math.abs(nv.signed(h - 90)), aW = Math.abs(nv.signed(h - 270));
    const tail = ' 종단부 부근은 선박이 모이고 흩어지는 곳이라 특별히 주의하고(제10조(f)), 정박을 피한다(제10조(g)).';
    if(inE && aE <= 30) return { v:'통항로 끝단에서 진입 — 원칙적인 진입 방법 (제10조(b)(iii)) · 종단부 부근 특별한 주의 (제10조(f))', ok:true, d:'동행 통항로에 흐름 방향으로 끝단에서 들어간다.' + tail };
    if(inW && aW <= 30) return { v:'통항로 끝단에서 이탈 — 원칙적인 이탈 방법 (제10조(b)(iii)) · 종단부 부근 특별한 주의 (제10조(f))', ok:true, d:'서행 통항로를 흐름 방향으로 끝단에서 빠져나온다.' + tail };
    if((inE && aW <= 30) || (inW && aE <= 30)) return { v:'이 방향으로 들어가면 통항로를 거꾸로 가게 된다 — 위반 (제10조(b)(i))', ok:false, d:'동쪽으로 가는 선박은 동행 통항로(아래), 서쪽으로 가는 선박은 서행 통항로(위)를 쓴다.' + tail };
    return { v:'종단부(출입구) 부근 — 특별한 주의를 하며 항행 (제10조(f))', ok:null, d:'TSS 안보다 출입구에서 사고 위험이 높다.' + tail };
  }

  /* ---------- 그리기 ---------- */
  let fs = 1;
  const T = (x, y, t, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.a||'middle'}" font-size="${(o.s||13)*fs}" font-weight="${o.w||500}" font-family="${o.mono ? 'var(--f-mono)' : 'var(--f-body)'}" fill="${o.c||'var(--ink)'}">${t}</text>`;
  const laneArrow = (x, y, dir) => { const k = dir === 90 ? 1 : -1; return `<path d="M${x - 40*k} ${y - 7} L${x + 14*k} ${y - 7} L${x + 14*k} ${y - 16} L${x + 40*k} ${y} L${x + 14*k} ${y + 16} L${x + 14*k} ${y + 7} L${x - 40*k} ${y + 7} Z" fill="none" stroke="var(--ink-2)" stroke-width="1.6" stroke-linejoin="round"/>`; };
  let bgFs = 0, bgS = '';
  const bg = () => { if(bgFs === fs) return bgS; bgFs = fs; bgS = (() => {
    const id = W.ui.uid('hatch');
    let s = `<defs><pattern id="${id}" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="var(--magenta)" stroke-width="2" opacity=".45"/></pattern></defs>`;
    s += W.parts.arrowDefs('tssH', 'var(--link)') + W.parts.arrowDefs('tssT', 'var(--ink-2)');
    s += `<rect width="680" height="400" fill="var(--sea-deep)"/>`;
    s += `<rect x="${TX}" y="${Yw0}" width="${680-TX}" height="${Ye1-Yw0}" fill="var(--sea)"/>`;
    s += `<rect x="${TX}" y="${Ye1}" width="${680-TX}" height="${Yc-Ye1}" fill="var(--sea)" opacity=".6"/>`;
    s += `<rect x="${TX}" y="${Yw1}" width="${680-TX}" height="${Ys1-Yw1}" fill="url(#${id})"/>`;
    s += `<rect x="${TX}" y="${Yw1}" width="${680-TX}" height="${Ys1-Yw1}" fill="var(--magenta)" opacity=".1"/>`;
    /* 경계선 */
    s += `<path d="M${TX} ${Yw0} H680 M${TX} ${Ye1} H680 M${TX} ${Yw0} V${Ye1}" stroke="var(--magenta)" stroke-width="1.6" stroke-dasharray="9 5" fill="none"/>`;
    /* 육지 + 항구 */
    s += `<path d="M0 ${Yc} H450 V362 H490 V${Yc} H680 V400 H0 Z" fill="var(--land)" stroke="var(--ink-3)"/>`;
    s += `<path d="M446 ${Yc} l-8 -10 M494 ${Yc} l8 -10" stroke="var(--ink-2)" stroke-width="4" stroke-linecap="round"/>`;
    s += T(470, 388, '항구', {s:15, w:600, c:'var(--ink-2)'});
    /* 흐름 화살표 */
    [260, 470].forEach(x => { s += laneArrow(x, (Yw0+Yw1)/2, 270); s += laneArrow(x, (Ys1+Ye1)/2, 90); });
    /* 이름 */
    s += T(598, 94, '서행 통항로', {s:16, w:700}); s += T(598, 114, '흐름 270°', {s:14, mono:true, c:'var(--ink-2)'});
    s += T(598, 214, '동행 통항로', {s:16, w:700}); s += T(598, 234, '흐름 090°', {s:14, mono:true, c:'var(--ink-2)'});
    s += T(598, 166, '분리대', {s:16, w:700, c:'var(--magenta)'});
    s += T(598, 300, '연안통항대', {s:16, w:700}); s += T(598, 320, '(ITZ)', {s:13, c:'var(--ink-2)'});
    s += T(70, 44, '종단부', {s:16, w:700}); s += T(70, 274, '(출입구) 부근', {s:13, c:'var(--ink-2)'});
    s += T(270, 36, 'TSS 바깥', {s:14, c:'var(--ink-2)'});
    s += `<ellipse cx="${TX}" cy="${(Yw0+Ye1)/2}" rx="92" ry="132" fill="none" stroke="var(--ink-3)" stroke-dasharray="3 5"/>`;
    return s;
  })(); return bgS; };

  function draw(){
    fs = (el.clientWidth || 800) < 560 ? 1.25 : 1;
    const r = region(ship.x, ship.y);
    let s = bg();
    if(current){
      for(let y = 80; y < 330; y += 60) for(let x = 180; x < 560; x += 120) s += `<path d="M${x} ${y} h22" stroke="var(--ink-3)" stroke-width="1.4" marker-end="url(#tssT)" opacity=".7"/>`;
    }
    /* 선수 방향·항적 벡터 */
    const hv = nv.vel(ship.h, 10), cv = current ? { x:3, y:0 } : { x:0, y:0 };
    const tv = { x:hv.x + cv.x, y:hv.y + cv.y }, tl = Math.hypot(tv.x, tv.y), track = nv.norm(nv.deg(Math.atan2(tv.x, tv.y)));
    const hx = ship.x + hv.x/10*62, hy = ship.y - hv.y/10*62;
    if(current) s += `<line x1="${ship.x}" y1="${ship.y}" x2="${ship.x + tv.x/tl*62}" y2="${ship.y - tv.y/tl*62}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#tssT)"/>`;
    s += `<line x1="${ship.x}" y1="${ship.y}" x2="${hx}" y2="${hy}" stroke="var(--link)" stroke-width="2.4" marker-end="url(#tssH)"/>`;
    const j = judge();
    const col = j.ok === true ? 'var(--ok)' : j.ok === false ? 'var(--bad)' : 'var(--ink-3)';
    s += `<g id="tssShip" style="cursor:grab;touch-action:none" transform="translate(${ship.x} ${ship.y}) rotate(${ship.h})"><circle r="24" fill="${col}" opacity=".16"/>` +
         W.parts.ship({ type: type === 'small' ? 'sail' : type === 'fishing' ? 'fishing' : 'power', len:34, fill:'var(--panel)' }) + `</g>`;
    s += `<g id="tssRot" style="cursor:grab;touch-action:none"><circle cx="${hx}" cy="${hy}" r="13" fill="var(--panel)" stroke="var(--link)" stroke-width="2"/><path d="M${hx-5} ${hy+2} a6 6 0 1 1 6 4" fill="none" stroke="var(--link)" stroke-width="1.6"/></g>`;
    svg.innerHTML = s;
    sReg(RNAME[r]); sHead(nv.fmtDeg(ship.h)); sTrack(current ? nv.fmtDeg(track) + ' (조류로 밀림)' : nv.fmtDeg(ship.h));
    ui.setVerdict(j.v, j.ok);
    detail.innerHTML = j.d; detail.hidden = !j.d;
    hook();
  }

  /* ---------- 끌기 ---------- */
  function pt(e){ const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
  function start(e, mode){
    e.preventDefault();
    const p0 = pt(e), off = { x:ship.x - p0.x, y:ship.y - p0.y };
    const move = ev => {
      const p = pt(ev);
      if(mode === 'move'){ ship.x = Math.max(16, Math.min(664, p.x + off.x)); ship.y = Math.max(16, Math.min(384, p.y + off.y)); }
      else { const a = nv.norm(nv.deg(Math.atan2(p.x - ship.x, -(p.y - ship.y)))); ship.h = Math.round(a/5)*5 % 360; hdg.set(ship.h); }
      draw();
    };
    const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  }
  function hook(){
    svg.querySelector('#tssShip').addEventListener('pointerdown', e => start(e, 'move'));
    svg.querySelector('#tssRot').addEventListener('pointerdown', e => start(e, 'rot'));
  }
  draw();
  if(typeof ResizeObserver !== 'undefined') new ResizeObserver(() => { const f = (el.clientWidth || 800) < 560 ? 1.25 : 1; if(f !== fs) draw(); }).observe(el);
});

}catch(e){console.error("[load] src/sims/tss-sim.js", e)}
</script>

    { t: '항로에서 준설 작업 중인 준설선', a: 'ram', why: '배는 멀쩡하지만 <b>작업의 성질상</b> 조종이 제한된다 → 조종제한선(제3조(g)(ii) 준설·측량·수중작업).' },
    { t: '항행 중 다른 선박에 연료·식량을 보급(replenishment) 중', a: 'ram', why: '항행 중 보급, 사람·화물의 이송 작업 → 조종제한선(제3조(g)(iii)).' },
    { t: '잠수부의 수중작업을 지원하고 있는 작업선', a: 'ram', why: '수중작업(underwater operations) 중에 움직이면 잠수부가 다친다 → 조종제한선(제3조(g)(ii)).' },
    { t: '기뢰 제거(소해) 작업 중인 소해정', a: 'ram', why: '기뢰 제거 작업(mine clearance) → 조종제한선(제3조(g)(v)).' },
    { t: '무거운 부선을 끌어 진로에서 벗어나는 능력이 크게 제한된 예인선', a: 'ram', why: '진로 이탈 능력이 크게 제한되는 예인 작업 → 조종제한선(제3조(g)(vi)). 아무것도 끌지 않는 예인선은 그냥 동력선이다.' },
    { t: '해저 케이블을 부설하고 있는 선박', a: 'ram', why: '항로표지·해저전선·파이프라인의 부설·보수·인양 → 조종제한선(제3조(g)(i)).' },
    { t: '흘수 때문에 가항수역의 수심·폭에 여유가 적어 침로를 벗어나기 극히 어려운 대형 유조선', a: 'cbd', why: '흘수와 가항수역의 수심·폭 관계로 현재 침로에서 벗어나는 능력이 극히 제한된 <b>동력선</b> → 흘수제약선(제3조(h)).' },
    { t: '트롤망을 끌며 조업 중인 트롤어선', a: 'fish', why: '트롤망은 조종 성능을 제한하는 어구다 → 어로에 종사하고 있는 선박(제3조(d)).' },
    { t: '유자망(그물)을 펼쳐 놓고 조업 중인 어선', a: 'fish', why: '그물(nets)로 어로 중 → 어로에 종사하고 있는 선박(제3조(d)).' },
    { t: '끌낚시(트롤링 낚시줄)로 고기를 잡는 어선', a: 'none', why: '끌낚시(trolling lines)는 조종 성능을 제한하지 않는 어구라서 정의에서 <b>제외</b>된다(제3조(d)) → 그냥 동력선. 트롤망(trawl)과 헷갈리지 말 것.' },
    { t: '어장으로 이동 중인 어선(어구를 거둔 상태)', a: 'none', why: '"어선"이 아니라 "어로에 <b>종사하고 있는</b>" 선박이어야 한다. 이동 중이면 그냥 동력선이다.' },
    { t: '아무것도 끌지 않고 항해 중인 예인선', a: 'none', why: '예인 작업을 하지 않는 예인선은 그냥 동력선이다. 끄는 물체 때문에 진로 이탈 능력이 크게 제한될 때만 RAM.' },
    { t: '닻을 내리고 정박(묘박) 중인 선박', a: 'none', why: '정박 중이면 항행 중(underway)이 아니다(제3조(i)). NUC·RAM·CBD 어느 것도 아니다.' },
    { t: '하역을 마쳐 흘수가 줄고 수심에 여유가 생긴 유조선', a: 'none', why: '흘수에 여유가 생기면 더 이상 흘수제약선이 아니다 → 그냥 동력선.' }
  ];
  const binOf = id => BINS.find(b => b.id === id);

  const css = `
  .vs-wrap{padding:12px;display:flex;flex-direction:column;gap:12px;background:var(--sea)}
  .vs-pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
  .vs-card{font:inherit;font-size:13.5px;line-height:1.35;text-align:left;color:var(--ink);background:var(--panel);border:1.5px solid var(--rule);border-radius:9px;padding:8px 10px;cursor:grab;max-width:100%;flex:1 1 200px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
  .vs-card:hover{border-color:var(--link)}
  .vs-card.sel{border-color:var(--link);box-shadow:0 0 0 3px color-mix(in srgb, var(--link) 30%, transparent)}
  .vs-card.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;box-shadow:0 6px 18px rgba(0,0,0,.25);flex:none;width:220px}
  .vs-bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
  .vs-bin{font:inherit;color:var(--ink);background:var(--panel);border:1.5px dashed var(--ink-3);border-radius:10px;padding:8px;min-height:84px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
  .vs-bin.armed{border-color:var(--link);border-style:solid}
  .vs-bin.hot{background:color-mix(in srgb, var(--link) 12%, var(--panel))}
  .vs-bin .bt{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px}
  .vs-bin .bt b{font-size:14px}
  .vs-bin .bt span{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
  .vs-bin .bh{font-size:12px;color:var(--ink-3)}
  .vs-mini{font-size:12px;line-height:1.3;border-radius:6px;padding:4px 6px;border:1px solid var(--ok);color:var(--ink);background:var(--paper)}
  .vs-mini.x{border:1.5px solid var(--bad)}
  .vs-fb{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--ink-3);border-radius:8px;padding:10px 12px;font-size:13.5px;line-height:1.55;color:var(--ink)}
  .vs-fb.ok{border-left-color:var(--ok)} .vs-fb.bad{border-left-color:var(--bad)}
  .vs-fb b.r{color:var(--ok)} .vs-fb b.w{color:var(--bad)}
  .vs-done{font-size:14px;color:var(--ink)}
  `;
  el.prepend(W.h('style', { text: css }));

  const wrap = W.h('div', { class: 'vs-wrap' });
  const prompt = W.h('div', { class: 'vs-fb', html: '테두리가 강조된 카드를 알맞은 상자에 넣으세요(다른 카드를 눌러 바꿀 수 있음). <b>NUC</b>는 고장, <b>RAM</b>은 작업, <b>CBD</b>는 흘수, <b>어로종사선</b>은 조종을 제한하는 어구가 열쇠입니다.' });
  const pool = W.h('div', { class: 'vs-pool', 'aria-label': '분류할 카드' });
  const binsEl = W.h('div', { class: 'vs-bins' });
  const handNote = W.h('div', { style: { fontSize: '12.5px', color: 'var(--ink-2)' } });
  wrap.append(prompt, handNote, pool, binsEl);
  ui.stage.append(wrap);

  const setScore = W.ui.stat(ui.readout, '정답');
  const setLeft = W.ui.stat(ui.readout, '남은 카드');
  W.ui.btn(ui.controls, '다시 섞기', () => reset());

  let deck = [], selected = null, right = 0, tried = 0;
  const binEls = {};
  BINS.forEach(b => {
    const list = W.h('div', { style: { display: 'flex', flexDirection: 'column', gap: '4px' } });
    const count = W.h('span');
    const node = W.h('button', { type: 'button', class: 'vs-bin', 'data-bin': b.id, onclick: () => { if(selected) place(selected, b.id); } },
      W.h('div', { class: 'bt' }, W.h('b', { text: b.ko }), W.h('span', { text: b.en })),
      W.h('div', { class: 'bh', text: b.hint }), list);
    node._list = list; node._count = count;
    binEls[b.id] = node;
    binsEl.append(node);
  });

  function shuffle(a){ for(let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function reset(){
    deck = shuffle(CARDS.map((c, i) => ({ ...c, i })));
    selected = null; right = 0; tried = 0;
    pool.innerHTML = '';
    BINS.forEach(b => { binEls[b.id]._list.innerHTML = ''; });
    refill();
    prompt.className = 'vs-fb';
    prompt.innerHTML = '테두리가 강조된 카드를 알맞은 상자에 넣으세요(다른 카드를 눌러 바꿀 수 있음). <b>NUC</b>는 고장, <b>RAM</b>은 작업, <b>CBD</b>는 흘수, <b>어로종사선</b>은 조종을 제한하는 어구가 열쇠입니다.';
    ui.setVerdict('', null); ui.verdict.hidden = true;
    stats(); armBins();
  }
  const HAND = 4;
  // 손패: 한 번에 4장만 보여 주고, 한 장을 분류하면 덱에서 한 장 채움. 첫 카드는 자동 선택.
  function refill(){
    while(pool.querySelectorAll('.vs-card').length < HAND && deck.length){ pool.append(makeCard(deck.shift())); }
    if(!selected){ const first = pool.querySelector('.vs-card'); if(first) select(first._card, true); }
    handNote.textContent = deck.length ? `손에 든 카드 (덱에 ${deck.length}장 더 있음)` : (pool.childElementCount ? '마지막 카드들입니다' : '');
  }
  function stats(){ setScore(`${right} / ${tried}`); setLeft(String(pool.querySelectorAll('.vs-card').length + deck.length)); }
  function armBins(){ BINS.forEach(b => binEls[b.id].classList.toggle('armed', !!selected)); }

  function select(card, quiet){
    if(selected) selected.node.classList.remove('sel');
    selected = card;
    if(selected){ selected.node.classList.add('sel'); if(quiet) return armBins(); prompt.className = 'vs-fb'; prompt.innerHTML = `<b>“${W.esc(card.t)}”</b> — 어느 상자에 넣을까요? 상자를 누르세요.`; }
    armBins();
  }

  function makeCard(c){
    const node = W.h('button', { type: 'button', class: 'vs-card', text: c.t });
    const card = { ...c, node }; node._card = card;
    // 누르기(선택) + 끌어다 놓기
    let start = null, ghost = null, hot = null;
    node.addEventListener('pointerdown', e => {
      if(e.button !== 0) return;
      start = { x: e.clientX, y: e.clientY, id: e.pointerId };
    });
    node.addEventListener('pointermove', e => {
      if(!start || e.pointerId !== start.id) return;
      if(!ghost && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 8){
        try{ node.setPointerCapture(e.pointerId); }catch(err){}
        ghost = node.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('sel');
        document.body.append(ghost);
        node.style.opacity = '.35';
      }
      if(ghost){
        ghost.style.left = (e.clientX - 110) + 'px'; ghost.style.top = (e.clientY - 20) + 'px';
        const t = document.elementFromPoint(e.clientX, e.clientY);
        const b = t && t.closest && t.closest('.vs-bin');
        if(hot && hot !== b) hot.classList.remove('hot');
        hot = b && binsEl.contains(b) ? b : null;
        if(hot) hot.classList.add('hot');
      }
    });
    const end = (e, cancel) => {
      if(!start) return;
      const wasDrag = !!ghost;
      if(ghost){ ghost.remove(); ghost = null; node.style.opacity = ''; }
      if(hot){ hot.classList.remove('hot'); }
      const target = hot; hot = null; start = null;
      if(cancel) return;
      if(wasDrag){
        node._skipClick = true;
        if(target) place(card, target.getAttribute('data-bin'));
      }
    };
    node.addEventListener('pointerup', e => end(e, false));
    node.addEventListener('pointercancel', e => end(e, true));
    node.addEventListener('click', () => { if(node._skipClick){ node._skipClick = false; return; } select(card); });
    return node;
  }

  function place(card, binId){
    const ok = card.a === binId;
    tried++; if(ok) right++;
    card.node.remove();
    if(selected && selected.node === card.node) selected = null;
    const mini = W.h('div', { class: 'vs-mini' + (ok ? '' : ' x'), text: card.t });
    binEls[card.a]._list.append(mini);
    const put = binOf(binId), ans = binOf(card.a);
    prompt.className = 'vs-fb ' + (ok ? 'ok' : 'bad');
    prompt.innerHTML = (ok
      ? `<b class="r">정답 — ${ans.ko}${ans.en ? ' (' + ans.en + ')' : ''}.</b> `
      : `<b class="w">아니에요 — “${put.ko}”${/[음]$/.test(put.ko) ? '이' : '가'} 아니라 <u>${ans.ko}</u>.</b> `) + card.why;
    refill(); armBins(); stats();
    const left = pool.querySelectorAll('.vs-card').length;
    if(!left){
      const perfect = right === tried;
      ui.setVerdict(`${tried}장 중 ${right}장 정답${perfect ? ' — 완벽합니다!' : ' — 빨간 테두리 카드를 다시 확인하세요.'} 핵심: NUC는 고장(제3조(f)), RAM은 작업의 성질(제3조(g)).`, perfect);
    }
  }

  reset();
});

}catch(e){console.error("[load] src/sims/vessel-sort.js", e)}
</script>
<script>W.boot();</script>

</body></html>
