  body: `
<h3>특별 항법 3개</h3>
<p>COLREG 안에도 일반 항법보다 먼저 적용되는 <strong>특별한 항법</strong>이 셋 있다. 제9조 좁은 수로(협수로), 제10조 통항분리제도, 제13조 추월이다. [[rule-18]]의 첫머리가 "제9조, 제10조 및 제13조에서 달리 규정하는 경우를 제외하고"인 것도 이 때문이다.{{fn:6주차 슬라이드 10~11 / 정리본 9장 "특별 항법 3개"}}</p>
<div class="star" data-note="도선사 시험 단골 — 50% 이상이 이 세 조문에서 출제">
<p><strong>특별 항법 3개 = 제9조 좁은 수로(Narrow channels), 제10조 통항분리제도(Traffic separation schemes), 제13조 추월(Overtaking).</strong> 이 세 조문은 일반 항법보다 우선한다. 그래서 제18조(선박 사이의 책무)는 "제9조, 제10조 및 제13조에서 달리 규정하는 경우를 제외하고" 적용된다. 예: 넓은 바다에서는 동력선이 범선을 피하지만, 좁은 수로에서는 범선이 수로 안에서만 안전하게 항행할 수 있는 동력선의 통항을 방해하면 안 된다.</p>
</div>
<p>해기사 시험은 이런 식으로 묻는다: "해질 무렵 시정 7마일인 동해 해상에서 컨테이너선과 산적화물선이 약 3마일 거리에서 조우하였다. 피해야 하는 선박은?" 3마일에서 보이므로 <strong>서로 시계 안</strong>([[rule-11]])이고, 둘 다 일반 동력선이므로 [[rule-15|횡단 항법]]을 적용한다. 그런데 똑같은 조우가 좁은 수로나 TSS 안에서 일어나면 항법 관계가 달라진다. 이것이 제9조·제10조를 따로 배우는 이유다.{{fn:6주차 슬라이드 3·4·22 "두 동력선 중 피해야 되는 선박은?"}}</p>
<p>제9조는 Part B 제1절(모든 시계)에 속한다. 따라서 <strong>보이든 안 보이든</strong> 적용된다([[rule-04]]).</p>

<h3>좁은 수로와 항로(fairway)</h3>
<ul>
<li><strong>좁은 수로의 폭은 COLREG에 정의되어 있지 않다.</strong> 선박의 길이·흘수·조종 성능에 따라 달라져야 하기 때문이다. 길이 200m 이상 선박의 무중신호 가청거리인 2해리 이하로 보자는 의견 등이 있다.</li>
<li>판례: 미국은 약 610m(2,000ft)를 좁은 수로로 본 예가 있고, 우리나라는 2해리 가까운 폭을 인정한 예가 있다. <strong>2해리를 넘는 곳을 좁은 수로로 본 판례는 영·미·한 어디에도 없다.</strong></li>
<li>미국 NTSB가 해안경비대에 좁은 수로를 정의해 달라고 요청했지만, 2년 검토 끝에 "정할 수 없다"는 답이 나왔다. 교수님은 자율운항선박을 위해 수치 기준이 필요하다고 보고 연구를 계획 중이다.</li>
<li><span class="en">fairway</span>(항로): 개방된 가항 통항로 또는 <strong>항만 당국이 준설·관리하는 수로</strong>. 대형선이 쓰도록 해도에 <strong>파선(pecked line)</strong>으로 표시된 깊은 수로로 여겨 왔고, 부표가 줄지어 있다. 골프장의 잘 관리된 페어웨이에서 온 말이다. 예: 독일 엘베강의 함부르크 항로, 목포대교 지나 부표 사이로 이어지는 항로.</li>
<li><span class="en">narrow channel</span>(좁은 수로)은 부표 사이의 모든 가항수역에 적용된다고 본다.{{fn:6주차 슬라이드 5·6 / 정리본 9장 "우측 통항"}}</li>
</ul>

<h3>우측 통항 — 제9조(a)</h3>
<p>좁은 수로나 항로를 따라 항행하는 선박은 안전하고 실행 가능한 한 <strong>자선의 우현 쪽 수로·항로의 바깥 한계에 붙어서</strong> 항행한다. 가운데로 다니지 않아야 마주오는 선박과 거리를 둘 수 있다.</p>
<p>슬라이드의 설명은 <strong>Risk = Probability × Consequence</strong>다. 좁은 곳 가운데에서 마주치면(head-on) 충돌 확률과 피해가 모두 커진다. 통항로를 둘로 나누는 방법이 가장 효과적이었기 때문에 오른쪽 통항 규칙을 도입했고, 이 생각을 넓은 해역에 적용한 것이 [[rule-10|TSS]]다.{{fn:6주차 슬라이드 5·7·8}}</p>
<p>아래 애니메이션은 우측 통항과, 뒤에서 설명할 추월 신호 교환을 함께 보여 준다.</p>
<div data-sim="narrow-channel"></div>

<h3>통항 방해 금지 선박 — 제9조(b)(c)(d)</h3>
<table>
<thead><tr><th>선박</th><th>의무</th><th>조항</th></tr></thead>
<tbody>
<tr><td>[[term-length|길이 20m 미만]] 선박, [[term-power-sail|범선]]</td><td>좁은 수로 안에서만 안전하게 항행할 수 있는 선박의 통항을 방해하지 않아야 함</td><td>(b)</td></tr>
<tr><td>[[term-fishing|어로종사선]]</td><td>좁은 수로 안을 항행하는 <strong>다른 선박</strong>의 통항을 방해하지 않아야 함</td><td>(c)</td></tr>
<tr><td>횡단하려는 선박</td><td>그 횡단이 좁은 수로 안에서만 안전하게 항행할 수 있는 선박의 통항을 방해하면 횡단하지 않아야 함</td><td>(d)</td></tr>
</tbody>
</table>
<ul>
<li>[[rule-18]]에서는 동력선이 범선·어로종사선을 피한다. 그러나 제18조는 제9조·제10조·제13조에서 달리 정한 경우를 제외하고 적용되므로, <strong>좁은 수로에서는 범선·어로종사선이 제18조에 따라 가지던 특별한 지위(privileged status)가 사라진다.</strong></li>
<li>상대가 아직 가까이 없어도 <strong>미리</strong> 길을 비켜 줘야 하는 이 의무를 <strong>통항 방해 금지</strong>(<span class="en">not impede</span>)라고 한다. 충돌의 위험이 생긴 뒤의 피항선 의무와는 조금 다른 개념이다. 방해하지 말아야 할 선박은 상대가 안전하게 지나갈 수역을 남기도록 <strong>조기에</strong> 동작해야 한다([[rule-08|제8조]] (f)).</li>
<li>횡단을 무조건 금지하는 것이 아니다. 수로를 따라가는 선박이 없거나 지나간 뒤면 횡단할 수 있다.{{fn:6주차 슬라이드 9·12·14 / 정리본 9장 "좁은 수로의 통항 방해 금지 선박"}}</li>
</ul>
<h4>횡단 금지가 성립하는 세 조건 — 제9조(d) 해석</h4>
<ol>
<li>해당 수역이 좁은 수로(또는 항로)에 해당할 것</li>
<li>좁은 수로를 횡단하는 것이 다른 선박의 통항을 방해할 것</li>
<li>그 다른 선박이 좁은 수로 안에서만 안전하게 항행할 수 있는 선박일 것</li>
</ol>
<p>세 조건이 다 갖춰지지 않으면 제9조(d)의 횡단 금지가 아니라 일반 항법으로 돌아간다. 슬라이드는 "<strong>제15조(횡단하는 상태)는 좁은 수로에서 적용하지 않는다는 것은 일반적인 오해</strong>"라고 짚는다. 예를 들어 수로를 따라가는 상대가 수로 밖에서도 안전하게 다닐 수 있는 소형선이라면 [[rule-15]]가 그대로 적용된다.{{fn:6주차 슬라이드 15}}</p>

<h3>의문신호 — 제34조(d)</h3>
<p>상대선의 의도나 동작이 의심스러우면 <strong>단음 5회 이상</strong>을 짧고 빠르게 울린다(● ● ● ● ●). "What's your intention?"이라는 뜻이다. 내가 이 신호를 들었다면 누군가 내 행동을 의심하고 있다는 뜻이다. 제9조(d)는 수로를 따라가는 선박이 횡단선의 의도가 의심스러울 때 이 신호를 쓸 수 있다고 정한다.</p>
<p>슬라이드의 영어 설명(<span class="en">danger signal</span>, at least 5 short and rapid blasts)에 따르면 다음 경우에 울린다.</p>
<ul>
<li>상대가 제안한 동작(예: 추월)에 동의하지 않을 때</li>
<li>상대선의 의도를 이해하지 못할 때</li>
<li>상대가 충돌을 피하기 위한 충분한 동작을 취하고 있는지 의심스러울 때</li>
</ul>
<p>이 신호는 적어도 5회의 짧고 급속한 섬광(발광신호)으로 보충할 수 있다. 자세한 신호 목록은 [[term-sound-signals]] 참고.{{fn:6주차 슬라이드 12·13·17 / 정리본 9장 "의문신호"}}</p>

<h3>좁은 수로에서의 추월 신호 — 제9조(e)</h3>
<p>대양에서는 멀찍이 돌아 추월하면 신호가 필요 없다. 좁은 수로에서는 앞 배가 비켜 줘야만 추월할 수 있는 경우가 생기므로, <strong>추월당하는 선박의 동의</strong>를 받아야 추월할 수 있다.</p>
<div class="star" data-note="좁은 수로 추월 신호 — 기적 신호 순서까지 정확히">
<p><strong>좁은 수로·항로에서 피추월선이 비켜 줘야만 추월할 수 있을 때(제9조(e), 제34조(c)):</strong></p>
<table>
<thead><tr><th>신호</th><th>누가</th><th>의미</th></tr></thead>
<tbody>
<tr><td>장음 2 + 단음 1 (━ ━ ●)</td><td>추월선</td><td>귀선의 <strong>우현</strong> 쪽으로 추월하겠다 (I intend to overtake you on your starboard side)</td></tr>
<tr><td>장음 2 + 단음 2 (━ ━ ● ●)</td><td>추월선</td><td>귀선의 <strong>좌현</strong> 쪽으로 추월하겠다 (I intend to overtake you on your port side)</td></tr>
<tr><td>장음·단음·장음·단음 (━ ● ━ ●)</td><td>피추월선</td><td>동의한다 (I agree)</td></tr>
<tr><td>단음 5회 이상 (● ● ● ● ●)</td><td>피추월선</td><td>의문 — 동의하지 않거나 의도가 의심스럽다</td></tr>
</tbody>
</table>
<p>동의 신호가 없으면 추월할 수 없다. 동의한 피추월선은 안전한 통과를 위한 조치를 취한다. 한 번 추월 관계가 성립하면 완전히 추월하고 충분히 멀어질 때까지 <strong>추월선이 피항선</strong>이다(제9조(e)(ii) — 제13조 의무는 면제되지 않는다).</p>
</div>
<div class="fix"><p>정리본에는 "동의 후 피추월선은 유지선이므로 침로·속력을 그대로 유지한다"고 되어 있다. 원문 제9조(e)(i)은 동의한 피추월선이 "안전한 통과를 할 수 있도록 조치를 취하여야 한다(take steps to permit safe passing)"고 정한다. 즉 피추월선은 동의한 뒤 한쪽으로 붙거나 속력을 조정하는 등 필요한 조치를 하고, 그 밖에는 추월선을 헷갈리게 하는 동작을 하지 않는다. 추월선이 끝까지 피항선이라는 점([[rule-13]])은 그대로다.</p></div>
<div class="tip"><p><strong>조종신호 암기법 "원 스타"</strong>: 단음 1회 = 우현(starboard) 변침, 단음 2회 = 좌현(port) 변침, 단음 3회 = 기관 후진. 추월 신호도 마찬가지로 끝의 단음이 1이면 우현, 2면 좌현이다. 출항 때 울리는 단음 3회는 배가 실제로 뒤로 간다기보다 프로펠러를 역회전한다는 뜻이다.</p></div>
<div class="star" data-note="대부분이 틀리게 씀">
<p><strong>장음은 영어로 prolonged blast다.</strong> long blast라고 쓰면 틀린다. 단음은 short blast다. 장음은 4~6초, 단음은 약 1초 동안 울리는 소리다. 예: 좌현 추월 신호 = two prolonged blasts followed by two short blasts.</p>
</div>
<p>아래에서 신호를 직접 들어 보고, 듣고 맞히기로 연습한다.{{fn:6주차 슬라이드 16~20 / 정리본 9장 "좁은 수로에서의 추월 신호"}}</p>
<div data-sim="sound-signals"></div>

<h3>만곡부·장애물 뒤 수역 — 제9조(f)</h3>
<p>장애물 때문에 다른 선박이 보이지 않을 수 있는 <strong>만곡부</strong>(<span class="en">bend</span>)나 수역에 접근하는 선박은 특별히 경계하고 주의하며 <strong>장음 1회</strong>를 울린다(제34조(e)). 반대편에서 이 소리를 들은 선박도 <strong>장음 1회</strong>로 응답한다. 실습선이 목포대교 근처 좁은 수로에서 장음 1회를 울리는 것이 바로 이것이다.{{fn:6주차 슬라이드 20·21 / 정리본 9장 "만곡부·장애물 뒤 수역"}}</p>

<h3>정박 회피 — 제9조(g)</h3>
<p>사정이 허락하는 한 모든 선박은 좁은 수로 안에서 <strong>정박(묘박)을 피한다.</strong> 좁은 길에 차를 세워 두면 다른 차가 지나갈 수 없는 것과 같다.</p>

<details class="story"><summary>수업 영상: 추월 신호</summary><div>
<p>추월선은 상대선 <strong>정횡 후 22.5도를 넘는 후방</strong>에서 따라잡는 선박이다. 야간에는 상대의 선미등만 보이고 현등은 보이지 않는다([[term-light-arcs]]). 추월선이 피항선, 피추월선이 유지선이다. 장음은 4~6초, 단음은 약 1초.</p>
<p>영상 퀴즈: 상대선의 <strong>좌현</strong> 쪽으로 추월하면서 장음 2 + 단음 1을 울린 것이 잘못이다. 장음 2 + 단음 2를 울렸어야 한다.</p>
</div></details>

<h3>국내법과의 관계</h3>
<p>국내법(구 해사안전법 제67조 "좁은 수로등", 현 해상교통안전법)도 같은 내용을 둔다. 좁은 수로나 항로를 "좁은 수로등"이라 부르며, 오른편 끝 쪽 항행·20m 미만 선박과 범선의 통항 방해 금지·어로종사선의 통항 방해 금지·횡단 금지를 정한다. 다만 해양수산부장관이 특별히 지정한 수역이나 통항분리제도가 적용되는 수역에서는 오른편 끝 쪽으로 항행하지 않아도 된다. 국내법과 COLREG의 관계는 [[rule-01]]의 특별법 우선 원칙을 따른다.{{fn:6주차 슬라이드 5·9·12 노트(해사안전법 제67조)}}</p>

<h3>좁은 수로와 TSS는 무엇이 다른가</h3>
<p>좁은 수로에서는 수로를 따라가는 선박이 사실상 절대적으로 우선하지만, TSS에서는 통항로를 따라가는 선박에게 우선권이 없다. 도선사 시험 단골이므로 [[rule-10]]의 비교표를 꼭 볼 것.</p>

    { ko: '(f) 통항분리제도의 종점 부근을 항해하는 선박은 특별한 주의를 기울여 항행하여야 한다.',
      en: '(f) A vessel navigating in areas near the terminations of traffic separation schemes shall do so with particular caution.' },
    { ko: '(g) 선박은 가능한 한 통항분리제도의 안 혹은 그 종점 부근의 해역에서 묘박하는 것을 피하여야 한다.',
      en: '(g) A vessel shall so far as practicable avoid anchoring in a traffic separation scheme or in areas near its terminations.' },
    { ko: '(h) 통항분리제도를 이용하지 아니하는 선박은 실행 가능한 한 넓은 여지를 두고 통항분리수역에서 떨어져야 한다.',
      en: '(h) A vessel not using a traffic separation scheme shall avoid it by as wide a margin as is practicable.' },
    { ko: '(i) 어로에 종사 중인 선박은 항로를 따라 진행하는 모든 선박의 통행을 방해하여서는 아니 된다.',
      en: '(i) A vessel engaged in fishing shall not impede the passage of any vessel following a traffic lane.' },
    { ko: '(j) 길이 20미터 미만의 선박이나 범선은 항로를 따라 진행하는 동력선의 안전한 통행을 방해하여서는 아니 된다.',
      en: '(j) A vessel of less than 20 metres in length or a sailing vessel shall not impede the safe passage of a power-driven vessel following a traffic lane.' },
    { ko: '(k) 통항분리제도 안에서 항해 안전설비의 보수 작업에 종사 중이기 때문에 조종성능이 제한되어 있는 선박은 그 작업을 수행하는 데 필요한 범위 내에서 이 규칙의 준수가 면제된다.',
      en: '(k) A vessel restricted in her ability to manoeuvre when engaged in an operation for the maintenance of safety of navigation in a traffic separation scheme is exempted from complying with this Rule to the extent necessary to carry out the operation.' },
    { ko: '(l) 통항분리제도 안에서 해저전선의 부설, 보수 또는 인양 작업에 종사 중이기 때문에 조종성능이 제한되어 있는 선박은 그 작업을 수행하는 데 필요한 범위 내에서 이 규칙의 준수가 면제된다.',
      en: '(l) A vessel restricted in her ability to manoeuvre when engaged in an operation for the laying, servicing or picking up of a submarine cable, within a traffic separation scheme, is exempted from complying with this Rule to the extent necessary to carry out the operation.' }

  body: `
<h3>TSS란</h3>
<p>좁은 수로·항로의 가운데는 마주치는 선박이 많아 충돌 위험이 가장 크다. 그래서 바다 위에 중앙분리대를 긋고 방향별 통항로를 만든 것이 <strong>통항분리제도</strong>(<span class="en">traffic separation scheme</span>, TSS)다. Part B 제1절(모든 시계)의 마지막 조문이므로 [[rule-09]]처럼 <strong>보이든 안 보이든</strong> 적용된다. 통항로·분리대·연안통항대 같은 용어는 [[term-tss]]에 정리했다.</p>
<ul>
<li>대표 사례: 영국–프랑스 사이 <strong>도버 해협</strong>(세계에서 가장 바쁜 해역 중 하나 — 북동행은 프랑스 쪽, 남서행은 영국 쪽), <strong>싱가포르 해협</strong>. 유럽에는 도버에서 독일 엘베강까지 TSS가 이어진다.</li>
<li>싱가포르 해협에는 TSS 바로 옆에 수심 1패덤(사람 키 정도)의 암초가 있는 좁은 구간이 있다. 그래도 사고가 잘 나지 않는 것은 싱가포르가 관제를 철저히 하기 때문이다.</li>
<li>나라와 나라 사이의 TSS는 <strong>IMO 승인</strong>을 받아야 한다([[rule-01|제1조]] (d)).{{fn:6주차 슬라이드 3 "Ships' routeing in the Singapore Strait" / 정리본 10장 도입}}</li>
</ul>

<h3>(a) 적용 범위 — 그리고 "다른 의무를 면제하지 않는다"</h3>
<p>제10조는 <strong>IMO가 채택한</strong> TSS에 적용한다. 뒷부분 "어떤 선박에게도 다른 규정에 의한 의무를 면제하지 않는다(does not relieve any vessel of her obligation under any other rule)"가 이 조문의 핵심이다. 슬라이드 메모: "우선권 없음 — 항법 관계가 발생하면 이 조에서 따로 정하지 않은 경우 다른 규정이 적용된다." 자세한 뜻은 아래 "좁은 수로 vs TSS"에서 다룬다.{{fn:6주차 슬라이드 4·14}}</p>

<h3>(b) 통항로 이용 방법</h3>
<ul>
<li>적합한 통항로 안에서 그 통항로의 <strong>일반적인 교통 흐름 방향</strong>으로 진행한다. 역주행 금지.</li>
<li>실행 가능한 한 <strong>분리선·분리대에서 떨어져</strong> 항행한다. 결과적으로 통항로 안에서도 오른쪽으로 다니게 되어 좁은 수로의 우측 통항과 같아진다.</li>
<li>통항로에는 <strong>원칙적으로 끝단(termination)에서</strong> 들어가고 나온다. 옆에서 합류·이탈할 때는 교통 흐름에 대해 <strong>가능한 한 작은 각도</strong>로 한다. 실무상 10도 내외다. 고속도로 진입로에서 비스듬히 합류하는 것과 같다.{{fn:6주차 슬라이드 5 / 정리본 10장 (b)}}</li>
</ul>

<h3>(c) 횡단 — 선수 방향을 직각으로</h3>
<p><strong>통항로 횡단은 가능한 한 피한다.</strong> 부득이 횡단하면 교통 흐름 방향에 대해 <strong>선수 방향(heading)</strong>이 가능한 한 직각이 되도록 한다.</p>
<div class="tip"><p><strong>항적(track)이 아니라 선수 방향(heading)이다.</strong> 조류에 밀려 항적이 비스듬해지더라도 선수는 직각으로 맞춘다. 조류를 보정하려고 선수를 비스듬히 틀면, 다른 선박이 볼 때 통항로를 따라가는 배인지 횡단하는 배인지 헷갈린다. 이 혼란을 없애려고 조문에 "on a heading"을 명시했다. 직각 횡단은 통항로에 머무는 시간도 가장 짧다.</p></div>
<p>아래 모식도에서 선박을 끌어 진입 각도와 횡단 각도를 판정해 본다.{{fn:6주차 슬라이드 7 / 정리본 10장 (c)}}</p>
<div data-sim="tss-sim"></div>

<h3>(d) 연안통항대</h3>
<p><strong>연안통항대</strong>(<span class="en">inshore traffic zone</span>, ITZ)는 TSS와 육지 사이의 수역이다.</p>
<ul>
<li>인접 TSS의 통항로를 안전하게 이용할 수 있는 선박은 연안통항대를 이용하지 않는다. 통과 교통은 통항로로 가라는 뜻이다.</li>
<li>단, <strong>길이 20m 미만 선박, 범선, 어로종사선</strong>은 이용할 수 있다.</li>
<li>연안통항대 안의 <strong>항구·해양구조물·도선사 승하선 장소(pilot station)</strong> 등을 오가는 선박, <strong>급박한 위험을 피하려는</strong> 선박은 어떤 선박이든 이용할 수 있다.</li>
<li>연안통항대를 쓰지 않을 거면 가까이 붙지도 말고 멀리 떨어진다.{{fn:6주차 슬라이드 8·9 / 정리본 10장 (d)}}</li>
</ul>

<h3>(e) 분리대·분리선</h3>
<p>횡단·합류·이탈하는 선박이 아니면 <strong>분리대에 들어가거나 분리선을 넘지 않는다.</strong> 예외는 두 가지다.</p>
<ol>
<li>급박한 위험을 피하기 위한 비상시</li>
<li><strong>분리대 안에서 어로에 종사하려는 경우</strong></li>
</ol>
<p>분리대는 도로의 중앙분리대와 같지만, 어선은 그 안에서 조업할 수 있다는 점이 다르다.{{fn:6주차 슬라이드 10}}</p>

<h3>(f)(g)(h) 종단부 주의, 정박 회피, 넓은 여유</h3>
<ul>
<li>(f) TSS <strong>종단부(출입구)</strong> 부근에서는 특별히 주의한다. TSS 안에서는 모두 같은 방향으로 가므로 사고가 거의 없고, 선박이 모이고 흩어지는 <strong>출입구에서 사고 위험이 높다</strong>.</li>
<li>(g) TSS 안이나 종단부 부근에서는 가능한 한 <strong>정박을 피한다</strong>.</li>
<li>(h) TSS를 이용하지 않는 선박은 가능한 한 <strong>넓은 여유</strong>를 두고 TSS에서 떨어진다.{{fn:6주차 슬라이드 11·12}}</li>
</ul>

<h3>(i)(j) 통항 방해 금지 — 좁은 수로와 비교</h3>
<p>누가 누구를 방해하지 말아야 하는지가 제9조와 미묘하게 다르다. 보호받는 대상을 정확히 구분해 둔다.</p>
<table>
<thead><tr><th>방해하지 말아야 할 선박</th><th>좁은 수로(제9조)에서 보호받는 선박</th><th>TSS(제10조)에서 보호받는 선박</th></tr></thead>
<tbody>
<tr><td>[[term-fishing|어로종사선]]</td><td>수로 안을 항행하는 <strong>다른 모든 선박</strong> (c)</td><td>통항로를 따라가는 <strong>모든 선박</strong> (i)</td></tr>
<tr><td>길이 20m 미만 선박, 범선</td><td>수로 안에서만 안전하게 항행할 수 있는 선박 (b)</td><td>통항로를 따라가는 <strong>동력선</strong> (j)</td></tr>
<tr><td>횡단선</td><td>수로 안에서만 안전하게 항행할 수 있는 선박의 통항을 방해하면 횡단 금지 (d)</td><td>횡단을 가능한 한 피하되, 하면 직각으로 (c). 만나면 일반 항법</td></tr>
</tbody>
</table>
<p>통항 방해 금지 의무가 있는 선박은 상대가 안전하게 지나갈 수역을 남기도록 일찍 동작해야 한다([[rule-08|제8조]] (f)).{{fn:6주차 슬라이드 12 / 정리본 10장 (i)(j)}}</p>

<h3>(k)(l) 작업 중인 조종제한선의 면제</h3>
<p>TSS 안에서 <strong>항행 안전 설비의 보수</strong>(k), <strong>해저전선의 부설·보수·인양</strong>(l) 작업을 하고 있는 [[term-ram|조종제한선(RAM)]]은 작업에 필요한 범위에서 제10조의 준수가 면제된다. 예: 등부표를 고치는 배는 통항로를 직각으로 횡단하거나 소각도로 합류하는 규정을 지킬 수 없다.{{fn:6주차 슬라이드 13}}</p>

<h3>좁은 수로 vs TSS</h3>
<p>제10조(a)의 "다른 규정상 의무를 면제하지 않는다"가 이 차이를 만든다.</p>
<div class="star" data-note="도선사 시험 단골">
<p><strong>TSS에서 통항로를 따라가는 선박은 횡단선에 대해 진로 우선권이 없다.</strong> 제10조(a)는 어떤 선박에게도 다른 규정에 의한 의무를 면제하지 않으므로, 충돌의 위험이 생기면 제15조(횡단) 등 일반 항법이 그대로 적용된다. 통항로 선박도 횡단선을 우현에 두면 피항선이다. 반면 좁은 수로(제9조)에서는 수로를 따라가는(수로 안에서만 안전하게 항행할 수 있는) 선박이 우선하고, 횡단선·20m 미만 선박·범선·어로종사선이 그 통항을 방해하지 않아야 한다.</p>
<table>
<thead><tr><th>구분</th><th>좁은 수로(제9조)</th><th>TSS(제10조)</th></tr></thead>
<tbody>
<tr><td>수로·통항로를 따라가는 선박</td><td><strong>절대적 우선</strong>. 상대가 범선·어로종사선이어도, 우현에서 와도 수로를 따라가는 선박이 우선</td><td><strong>특권 없음</strong></td></tr>
<tr><td>횡단선과 충돌 위험이 생기면</td><td>횡단선이 끝까지 진로를 피함(통항 방해 금지)</td><td><strong>횡단 관계 항법(제15조) 등 일반 항법이 그대로 적용</strong>. 통항로 선박도 상대를 우현에 두면 피항선</td></tr>
<tr><td>근거</td><td>제9조(b)(c)(d), 제18조 첫머리</td><td>제10조(a) "does not relieve any vessel of her obligation under any other rule"</td></tr>
</tbody>
</table>
</div>
<ul>
<li>TSS를 횡단한 선박은 "가능한 한 횡단을 피하라"는 제10조(c)를 어긴 잘못은 있다. 그러나 충돌 위험이 생기면 통항로 선박도 [[rule-15]]·[[rule-16]]에 따른 피항선 의무를 다해야 한다.</li>
<li>나라마다 해석이 달라 혼란이 있었다. 한국·일본은 통항로 선박이 우선이라고 해석하기도 했다.</li>
<li>TSS를 처음 만든 영국 해사청(MCA)의 지침(도버 해협 항행과 Rule 10 적용에 관한 Marine Guidance Note): 선원은 <strong>조타·항해 규칙(Part B)이 TSS 안에서도 다른 곳과 똑같이 적용되며, TSS를 따라 항행하는 선박이 횡단 선박에 대해 우선권을 갖지 않는다</strong>는 점을 기억해야 한다.</li>
<li>MGN은 법적 구속력이 있는 법규가 아니라 행정지침이다. 그러나 법원이 주의의무 이행 여부를 판단할 때 참고하는 준거기준이 되므로 선장이 무시할 수 없다.</li>
<li>예외: 일본 세토내해처럼 그 나라가 <strong>특별규칙</strong>으로 통항로 선박에 우선권을 준 수역에서는 그 규칙이 적용된다([[rule-01|제1조]] (b)).{{fn:6주차 슬라이드 15·16(MGN 노트)·19 퀴즈 / 정리본 10장 "좁은 수로 vs TSS"}}</li>
</ul>

<h3>국내법과의 관계</h3>
<p>국내법(구 해사안전법 제68조 "통항분리제도", 현 해상교통안전법)은 IMO가 채택한 TSS뿐 아니라 <strong>해양수산부령으로 정하는 교통량이 많은 수역</strong>에도 통항분리제도를 적용한다. 내용은 제10조와 거의 같고, 연안통항대를 이용할 수 있는 선박에 "인접한 항구로 입출항하는 선박, 해양시설·도선사 승하선 장소에 출입하는 선박, 급박한 위험을 피하기 위한 선박"을 열거한다. 정박은 COLREG보다 강하게 "정박하여서는 아니 된다"(해양사고를 피하거나 인명·선박 구조를 위한 부득이한 경우 제외)로 정한다.{{fn:6주차 슬라이드 5 노트(해사안전법 제68조)}}</p>

<details class="story"><summary>수업 영상: 해사안전법(현 해상교통안전법) 위반 충돌 사례</summary><div>
<p>시운전 중이던 화물선 A와 케미컬 운반선 B가 충돌해 화재가 났다. 두 선박 모두 다음을 지키지 않았다.</p>
<table>
<thead><tr><th>해상교통안전법(구 해사안전법)</th><th>대응 COLREG</th><th>위반 내용</th></tr></thead>
<tbody>
<tr><td>경계</td><td>[[rule-05|제5조]]</td><td>B가 제3 선박을 피한 뒤 경계를 소홀히 해 A를 늦게 발견</td></tr>

  body: `
<h3>범선의 발달 (배경)</h3>
<ul>
<li>사각돛 범선은 바람을 등지고만 잘 간다. 노를 젓는 갤리선, 강에서 배를 들고 옮기기도 한 바이킹선(롱쉽)을 거쳐, 원양 항해는 포르투갈 <strong>엔히크 왕자(항해왕)</strong> 시대의 <strong>캐러벨선</strong>에서 시작됐다. 이후 캐럭, 갤리온으로 이어진다.</li>
<li>지중해는 사방이 육지라 조난해도 살아남을 확률이 높아 항해술이 축적됐다. 다만 내해에 가까워 바람 방향이 변덕스러워 사각돛 배가 불리했고, 그래서 라틴 돛(삼각돛) 배가 나왔다.</li>

<h3>택(tack)과 풍상·풍하</h3>
<p>제12조를 읽으려면 두 쌍의 말을 먼저 알아야 한다. 자세한 정의는 [[term-tack]].</p>
<ul>
<li><strong>우현택</strong>(<span class="en">starboard tack</span>): 우현으로 바람을 받는다. 돛(붐)은 좌현 쪽으로 나가 있다. <strong>좌현택</strong>(<span class="en">port tack</span>): 좌현으로 바람을 받는다. 돛은 우현 쪽에 있다.</li>
<li><strong>풍상</strong>(<span class="en">windward</span>, weather side): 바람이 불어오는 쪽. <strong>풍하</strong>(<span class="en">leeward</span>, lee side): 바람이 불어가는 쪽으로, 상대적으로 잔잔하다. 도선사에게 "lee side에 도선사 사다리를 놓으라"고 하는 것도 이 개념이다.</li>
<li>제12조(b): 어느 쪽이 풍상인지 다툼이 없도록, <strong>주범(mainsail)이 펼쳐진 쪽의 반대쪽</strong>을 풍상 측으로 본다. 횡범선(square-rigged)은 <strong>가장 큰 종범(fore-and-aft sail)</strong>이 펼쳐진 쪽의 반대쪽이다. 돛은 바람에 밀려 바람 반대편으로 나가 있기 때문이다.{{fn:9주차 슬라이드 7·9·13 / 정리본 11장 "택과 풍상·풍하"}}</li>
</ul>

<h3>제12조 범선 항법</h3>
<p>두 범선이 충돌의 위험이 있을 정도로 접근할 때:</p>
<ol>
<li><strong>서로 다른 쪽 현에 바람을 받으면, 좌현에 바람을 받는 범선(port tack)이 피한다.</strong> — Port gives way to starboard.</li>
<li><strong>같은 쪽 현에 바람을 받으면, 풍상(windward) 쪽 범선이 풍하(leeward) 쪽 범선을 피한다.</strong> — Windward gives way to leeward.</li>
<li><strong>좌현에 바람을 받는 범선이 풍상 쪽에서 다른 범선을 보았는데, 그 범선이 어느 쪽에 바람을 받는지 확실히 알 수 없으면, 좌현에 바람을 받는 범선이 피한다.</strong> — Unsure, port gives way. 애매하면 내가 피한다.</li>
</ol>
<ul>
<li>이는 옛 범선의 <strong>전통적인 관습 세 가지</strong>가 그대로 성문화된 것이다.</li>
<li>왜 ③이 필요할까? 풍상 쪽 범선은 돛이 이쪽을 가려 택을 판단하기 어렵다. 그 범선이 우현택이면 ①에 따라 내가 피하고, 좌현택이면 같은 택이므로 ②에 따라 풍상 쪽인 상대가 피한다. 택에 따라 결론이 갈리므로, 확신이 없으면 좌현택인 내가 피하도록 정해 둔 것이다.</li>
<li>좌현택 범선이 우현 쪽으로 피하면 두 배는 좌현 대 좌현, <strong>포트투포트</strong>로 지나간다. 동력선 항법의 포트투포트([[intro-colreg]], [[rule-14]])가 범선 관습에서 왔다.</li>
<li><strong>피항선</strong>(<span class="en">give-way vessel</span>)은 길을 내주는 선박, <strong>유지선</strong>(<span class="en">stand-on vessel</span>)은 침로·속력을 유지하는 선박이다([[rule-16]]·[[rule-17]]).{{fn:9주차 슬라이드 10~12 / 정리본 11장 "제12조 범선 항법"}}</li>
</ul>
<p>아래에서 바람 방향을 돌려 가며 두 범선의 택과 풍상·풍하, 피항선을 판정해 본다.</p>
<div data-sim="sail-judge"></div>

<h4>슬라이드 예제</h4>
<p><strong>예제 1</strong> (범선 ①②③): 바람을 좌측에서 받는 범선 ①은 좌현택(port tack)이므로, 바람을 우측에서 받는 우현택 범선 ②와 ③의 진로를 피해야 한다. 범선 ②와 ③은 모두 우현택이지만 풍상 측에 있는 ②가 풍하 측에 있는 ③의 진로를 피해야 한다.</p>
<p><strong>예제 2</strong> (택이 불확실한 경우): 좌현택 범선이 풍상 측에서 다른 범선을 발견했으나 그 범선이 어느 쪽에서 바람을 받는지 확실하지 않으면, 좌현택 범선이 그 범선의 진로를 피한다.{{fn:9주차 슬라이드 14·15}}</p>

<h3>제12조가 적용되지 않는 경우</h3>
<ul>
<li>제12조는 <strong>범선과 범선 사이</strong>에만 적용된다. 범선과 동력선 사이는 [[rule-18]](동력선이 범선을 피함)이 정한다. 기관을 함께 쓰는 범선은 [[term-power-sail|동력선]]이다.</li>
<li>추월은 제13조가 "다른 규정에도 불구하고" 우선한다. 범선이 다른 선박을 추월하면 범선이 피항선이다([[rule-13]]).</li>
<li>좁은 수로와 TSS에서는 범선이 수로·통항로를 따라가는 선박의 통항을 방해하지 않아야 한다([[rule-09|제9조]] (b), [[rule-10|제10조]] (j)).</li>
<li>서로 보이지 않으면 제2절 자체가 적용되지 않는다([[rule-11]]).</li>
</ul>

<h3>범선 사이의 항법 관계는 언제 성립하나</h3>
<p><strong>항법 관계</strong>란 누가 피항선이고 누가 유지선인지의 관계다. 채무 관계가 누가 채권자이고 누가 채무자인지를 묻는 것과 같다.</p>
<div class="star" data-note="퀴즈 출제 — '보일 때'만 쓰면 도선사 시험에서는 틀림">

</div>

<h3>조우 형태 세 가지</h3>
<p>서로 시계 안([[rule-11]])에서 두 선박이 만나는 모양은 세 가지다. 어떤 형태인지가 정해지면 누가 피할지도 정해진다.{{fn:9주차 정리본 12장 「조우 형태 개요」}}</p>

<p>상대선의 선미 쪽 추월 범위 안에서 접근하면 상대가 좌측이든 우측이든 횡단이 아니라 추월이다. 그래서 판정할 때 추월 여부를 먼저 따진다([[review-decision]]).</p>

<h3>추월선의 범위 — 정횡 후 22.5°</h3>
<p>COLREG은 "135도"라고 쓰지 않고 "<span class="en">22.5 degrees abaft the beam</span>(정횡 후 22.5도)"처럼 쓴다. 22.5°는 옛 단위인 <strong>2포인트(11.25° × 2)</strong>를 도수로 바꾼 것이다. 이 각도는 등화의 조사각과 정확히 맞물려 있다.{{fn:9주차 「제13조 추월」 슬라이드 4·6 (Rule 21 등화의 정의)}}</p>
<ul>
<li><strong>현등</strong>(<span class="en">sidelights</span>): 정선수에서 각 현 정횡 후 22.5°까지, 각 112.5°.</li>
<li><strong>선미등</strong>(<span class="en">sternlight</span>): 정선미에서 양현 각각 67.5°, 합계 135°. 즉 각 현 정횡 후 22.5°부터 정선미까지.</li>
<li>따라서 정횡 후 22.5°보다 뒤에서 다가오면 상대의 <strong>선미등만 보이고 현등은 하나도 안 보인다.</strong> 밤에는 이것이 추월 판정 기준이 된다.</li>
</ul>
<p>조사각 전체 표와 마스트등 배치는 [[term-light-arcs]]에 정리했다. 아래에서 상대선을 끌어 돌려 보면, 22.5° 경계를 넘는 순간 현등이 사라지고 선미등만 남으며 추월로 판정되는 것을 볼 수 있다.</p>

<div class="star" data-note="추월선 정의 — 22.5°와 선미등"><p><strong>추월선</strong>이란 다른 선박의 <strong>정횡으로부터 22.5도를 넘는 뒤쪽</strong>(<span class="en">more than 22.5 degrees abaft her beam</span>)에서 그 선박을 따라잡는 선박이다. 밤에는 그 선박의 <strong>선미등만 보이고 어느 쪽 현등도 보이지 않는 위치</strong>가 여기에 해당한다(제13조(b)). 22.5°는 2포인트(1포인트 = 11.25°)다.</p></div>

<h3>(a) 다른 규정에도 불구하고 — 특별 항법</h3>
<p>(a)항은 "제1절·제2절의 <strong>다른 규정에도 불구하고</strong>"로 시작한다. 그래서 제13조는 [[rule-09]], [[rule-10]]과 함께 <strong>특별 항법</strong>으로 묶이며, [[rule-18]]의 선박 종류에 따른 우선순위보다도 앞선다. 제18조 첫머리가 "제9조·제10조·제13조에서 달리 정한 경우를 제외하고"인 이유가 이것이다.</p>
<ul>
<li>조문은 <span class="en">any vessel</span> overtaking any other라고 쓴다. <strong>어떤 종류의 선박이든</strong> 추월하면 피항선이다. 요트(범선)라도 동력선을 추월하면 그 동력선을 피해야 한다.{{fn:9주차 「제13조 추월」 슬라이드 9 영문 해설}}</li>
<li>어로에 종사하고 있는 선박([[term-fishing]])이 동력선을 추월해도 추월선인 어로종사선이 피한다.</li>
</ul>
<div class="star" data-note="도선사 시험 단골(50% 이상)"><p><strong>특별 항법 3개</strong>는 제9조 좁은 수로, 제10조 통항분리제도(TSS), 제13조 추월이다. 제13조(a)는 "제1절·제2절의 다른 규정에도 불구하고" 추월선이 피하도록 정하므로, 추월은 선박의 종류(제18조)나 횡단·마주침 항법보다 먼저 적용된다.</p></div>

<h3>(c) 의심스러우면 추월선으로 본다</h3>
<p>내가 추월하는 중인지 확실하지 않으면 <strong>추월선이라고 가정</strong>하고 피한다. COLREG은 늘 <strong>더 불리한(위험한) 상황을 가정</strong>하게 한다.</p>
<ul>
<li>야간 예: 앞에 백등 하나가 30~40분째 비슷한 거리로 보인다. 내가 추월 중인지 같이 가는 중인지 헷갈려도 추월선으로 간주한다.</li>
<li>주간 예: 의심은 오히려 낮에 더 생긴다. 상대 우현 110° 방향에서 다가가면 횡단이지만, 115° 방향이면 추월이다(경계 112.5°). 밤에는 선미등이 차이를 분명히 보여 주지만 낮에는 정확히 판단하기 어렵다.{{fn:9주차 「제13조 추월」 슬라이드 10 영문 해설(green 110° / green 115°)}}</li>
</ul>

<h3>(d) 방위가 변해도 추월 관계는 끝까지</h3>
<p>한 번 추월 관계가 성립하면 이후 두 선박 사이의 <strong>방위가 어떻게 바뀌어도</strong> 추월선이 횡단선이 되지 않고, 피항 의무도 사라지지 않는다.</p>
<ul>
<li>추월하다가 옆으로 나란히 가게 되어 상대가 내 좌현 정횡 근처에 오더라도 횡단 관계가 되지 않는다.</li>
<li>상대 선수를 지나 앞질러도 내가 피추월선(유지선)이 되는 것이 아니다.</li>
<li><strong>충분히 멀어져서, 내가 변침해도 상대에게 영향이 없을 거리</strong>가 되어야 의무가 끝난다.</li>
</ul>
<div class="star" data-note="퀴즈 출제"><p><strong>추월선의 의무가 끝나는 때</strong>는 상대 선박을 <strong>완전히 추월하고 충분히 멀어질 때</strong>(<span class="en">finally past and clear</span>)다. 나란히 항행할 때, 상대 선수를 지나 앞서갈 때, 앞지른 때는 모두 오답이다. 추월 중 방위가 변해 나란히 가거나 앞서도 횡단 관계가 되지 않으며 추월선은 계속 피항선이다(제13조(d)).</p></div>

<h3>추월할 때의 실무 주의</h3>
<ul>
<li>추월하고 나서 상대 선수 앞을 가로지르려면 그 전에 <strong>충분한 여유 공간</strong>을 확보한다. 가능하면 상대의 선수를 횡단하기보다 상대가 먼저 지나가게 하고 <strong>그 선미 뒤로</strong> 통과하는 편이 낫다.{{fn:9주차 「제13조 추월」 슬라이드 11}}</li>
<li>가까이 붙어 추월하면 선체 주위 압력 변화로 작은 배가 빨려 들어올 수 있다([[term-interaction]]). 추월선은 충분히 떨어져 지나가고, 추월당하는 선박은 가능하면 감속해 추월 시간을 줄인다.</li>
<li>좁은 수로에서 피추월선의 협력이 필요하면 추월 신호(장음 2회 + 단음 1~2회)와 동의 신호를 주고받는다([[rule-09]], [[term-sound-signals]]). 그래도 추월선의 피항 의무는 그대로다.</li>
</ul>

<h3>수업 영상과 사례</h3>
<details class="story"><summary>수업 영상: 등화를 켜지 않은 어선</summary><div>
<p>파고가 높아 레이더 간섭으로 소형선이 잘 잡히지 않는 야간, 등화를 켜지 않은 어선이 다가와 대각도 우현 변침으로 겨우 피한 장면이다. 실제 사례로, 통영 인근에서 조업 중 등화를 켜지 않고 경계도 하지 않은 근해통발어선과, 레이더로 어선을 발견하고 VHF 호출에 응답이 없었는데도 별다른 조치 없이 항해한 화물선이 충돌했다.</p>
<ul>
<li>상황에 맞게 레이더를 조정·이용한다.</li>
<li>어로종사선도 늘 경계([[rule-05]])를 유지한다.</li>
<li>야간 항해 선박은 규정된 등화를 반드시 켠다. 어선은 상황별 등화·형상물을 표시한다([[review-lights]]).</li>
<li>경고신호·주의환기신호는 효과적인 시기에 확실히 전달되도록 한다.</li>
</ul>
</div></details>

<p>일본 항로에서 컨테이너선이 앞서가는 예인선의 속력이 느리다며 기적 신호 없이 그 진로 전방으로 바짝 추월하다 충돌했다. 추월선은 완전히 추월하고 충분히 멀어질 때까지 피추월선의 진로를 피해야 한다.{{fn:9주차 정리본 13장 「영상: 서로 시계 안의 항법 사례」}}</p>

<h3>(b) 마주치는 상태의 판단 기준</h3>
<p>상대를 <strong>정선수 또는 거의 정선수</strong>에서 보고 있으면서 다음에 해당하면 마주치는 상태다.</p>
<table>
<thead><tr><th>때</th><th>보이는 모습</th></tr></thead>
<tbody>
<tr><td>야간</td><td>상대의 <strong>마스트등 두 개가 일직선</strong> 또는 거의 일직선으로 보이거나, <strong>양 현등</strong>(홍·녹)이 모두 보인다 (<span class="en">and/or</span>)</td></tr>
<tr><td>주간</td><td>그에 대응하는 모습, 즉 상대 선박의 <strong>마스트가 선수에서 선미까지 일직선</strong>이 되어 보인다</td></tr>
</tbody>
</table>
<p>길이 50m 이상 선박은 후부 마스트등을 전부 마스트등보다 높게 달기 때문에, 정면에서 보면 두 백등이 위아래 일직선으로 겹쳐 보인다([[term-light-arcs]]). 아래 장면에서 야간에 정면 선박이 어떻게 보이는지, 두 선박이 어떻게 피하는지 확인할 수 있다.</p>

<div class="tip">좌현 홍등 기억법: "<strong>좌익(左翼)은 빨강</strong>". 좌현 = 홍(port, red), 우현 = 녹(starboard, green). 마주 오는 배의 우현 녹등은 내 왼쪽에, 좌현 홍등은 내 오른쪽에 보인다.</div>

<h3>현등이 번갈아 보이는 경우</h3>
<p>현실에서는 정면 근처에서 홍등과 녹등이 번갈아 보이기도 한다.{{fn:9주차 「제14조 마주치는 상태」 슬라이드 5·6·8}}</p>
<ul>
<li>등은 레이저가 아니라 일정 크기의 전구에서 나오므로 경계각이 칼같이 끊기지 않는다. 기술 기준상 현등의 빛은 정선수선을 <strong>약 1~3도</strong> 넘어선 곳까지 비춘다(차광 한계).</li>
<li>여기에 롤링·피칭·요잉(선체 6자유도 운동)이 더해지면 홍·녹이 번갈아 보일 수 있다.</li>
<li>영국 판례에는 정선수 양쪽으로 <strong>1/2포인트(약 5.6°)</strong>까지 어긋나도 마주치는 상태로 본 사례가 있다(1포인트 = 360 ÷ 32 = 11.25°).</li>

</ul>

<h3>(c) 의심스러우면 마주치는 상태로 본다</h3>
<p>정면의 선박이 양 현등을 보이다가 홍등이 자꾸 사라지고 주로 녹등만 보인다면, 상대는 아마 요잉 중이다. 녹등만 보면 내 우현 쪽으로 지나갈 것 같지만 홍등이 다시 나타나는 것은 너무 가깝다는 신호다. 이런 <strong>의심스러운 경우에는 마주치는 상태로 보고</strong> 일찍 우현 변침해서 상대에게 <strong>홍등 하나만 확실히</strong> 보여 준다.</p>

<h3>우현 변침 신호</h3>
<p>조종신호로 <strong>단음 1회</strong>는 "나는 우현으로 변침하고 있다"(<span class="en">I am altering my course to starboard</span>)는 뜻이다. 마주치는 두 선박이 각각 단음 1회를 울리고 우현 변침하면 포트투포트로 지나간다([[term-sound-signals]]).</p>

<h3>서로 시계 안의 기준</h3>
<p>제14조는 서로 시계 안([[rule-11]])에서만 적용된다. 길이 50m 이상 선박의 현등 가시거리가 <strong>3해리</strong>이므로, 시정 3해리 이상이면 서로 시계 안으로 본다.{{fn:9주차 정리본 13장 「영상: 서로 시계 안의 항법 사례」}}</p>

<h3>수업 영상: 서로 시계 안의 항법 사례</h3>
<details class="story"><summary>추월 사례: 기적 신호 없이 바짝 추월한 컨테이너선</summary><div>
<p>일본 항로에서 컨테이너선이 예인선의 속력이 느리다며 기적 신호 없이 진로 전방으로 바짝 추월하다 충돌했다. 추월선은 완전히 추월하고 충분히 멀어질 때까지 피추월선의 진로를 피해야 한다([[rule-13]]).</p>
</div></details>
<details class="story"><summary>마주침 사례(2013): VHF만 부르던 케미컬 탱커</summary><div>
<p>마주치는 두 케미컬 탱커 중 하나는 소각도로만 변침했고, 다른 하나는 충돌 2분 전까지 아무 동작도 하지 않고 VHF 호출만 했다. 양 현등을 확인했으므로 <strong>둘 다 우현 변침</strong>했어야 한다. "먼저 변침하면 나만 손해"라는 생각이 충돌을 부른다.</p>
</div></details>
<details class="story"><summary>횡단 사례(2011, 광양항 부근): 합의하고도 소각도 변침</summary><div>
<p>피항선인 컨테이너선이 근접할 때까지 동작하지 않다가, 유지선 화물선의 VHF 요청(선미 통과)에 합의하고도 상황을 잘못 판단해 소각도 우현 변침만 했다. 유지선도 상대가 피하기만 기대하고 협력동작을 하지 않아 책임이 인정됐다([[rule-15]], [[rule-17]]).</p>
</div></details>

    { ko: '2척의 동력선이 상대의 진로를 횡단하는 경우로서 충돌의 위험성이 있을 때에는 다른 선박을 우현 쪽에 두고 있는 선박이 그 다른 선박의 진로를 피하여야 한다. 이 경우 다른 선박의 진로를 피하여야 하는 선박은 부득이한 경우 외에는 그 다른 선박의 선수 방향을 횡단하여서는 아니 된다.',

<h3>조문 핵심: 좌고우피</h3>
<p>상대선이 내 <strong>우현</strong> 쪽에 있으면 내가 <strong>피항선</strong>(<span class="en">give-way vessel</span>), <strong>좌현</strong> 쪽에 있으면 내가 <strong>유지선</strong>(<span class="en">stand-on vessel</span>)이다. "좌(左)에 두면 고(固, 유지), 우(右)에 두면 피(避)" — [[term-jwagowoopi]]로 외운다.{{fn:10주차 「제15조 횡단상태」 슬라이드 3~5 / 정리본 14장}}</p>
<ul>
<li>피항선은 진로를 피하고, <strong>사정이 허락하면</strong>(<span class="en">if the circumstances of the case admit</span>) 상대선의 <strong>선수 앞을 가로지르지 않는다.</strong></li>

</ul>
<div class="star" data-note="퀴즈 출제"><p><strong>횡단하는 상태</strong>(<span class="en">crossing situation</span>)에서는 <strong>다른 선박을 자선의 우현 쪽에 두고 있는 선박이 피항선</strong>이다. 피항선은 사정이 허락하는 한 상대선의 <strong>선수 앞을 횡단하지 않아야</strong> 하므로, <strong>우현 변침해 상대의 선미 쪽으로</strong> 통과하거나 감속해 상대가 먼저 지나가게 한다. 상대 선수를 가로지르는 변침, 침로·속력 유지, 가속은 모두 틀린 동작이다.</p></div>

<h3>적용 범위</h3>
<ul>
<li><strong>서로 시계 안</strong>(육안으로 보일 때)에서만 적용한다. 레이더로만 보이면 적용하지 않는다(그때는 제19조, 기말 범위). [[rule-11]] 참고.</li>
<li><strong>두 동력선</strong> 사이에만 적용한다. 종류가 다르면 [[rule-18]], 범선끼리는 [[rule-12]].</li>
<li>범위: 정선수 부근(마주치는 상태, [[rule-14]])과 정횡 후 22.5° 이후(추월, [[rule-13]])를 뺀 <strong>나머지 전부</strong>. 물리적으로는 상대선의 정선수 좌우 약 3°부터 정횡 후 22.5°까지의 사이에서 접근하는 경우다. 조우 중 <strong>가장 넓은 범위이자 가장 흔한 경우</strong>다.{{fn:10주차 「제15조 횡단상태」 슬라이드 4}}</li>

<p>아래에서 무작위로 만들어지는 조우를 보고 피항선을 골라 보자. 추월·마주침·횡단 중 무엇인지 먼저 판단해야 한다.</p>

<h3>피항선의 피항 방법</h3>
<p>횡단 상태에서 피항선이 쓸 수 있는 방법을 우선순위대로 정리하면 다음과 같다.{{fn:10주차 「제16·17조」 슬라이드 3 「횡단하는 상태에서 피항선의 피항방법」}}</p>
<ol>
<li>가능한 한 상대 선박의 <strong>선수를 횡단하지 않는다.</strong></li>
<li><strong>우현 쪽으로 변침</strong>해 상대 선박의 <strong>선미 쪽으로 통과</strong>한다(<span class="en">pass astern</span>).</li>
<li>(필요하면) <strong>조기에 좌현 쪽으로</strong> 변침해 유지선으로부터 멀리 벗어난다.</li>
<li>(시간이 필요하면) 기관을 사용해 <strong>감속</strong>한다. 감속은 상대가 눈과 레이더로 바로 알아챌 만큼 적극적으로 한다([[rule-08]]).</li>
</ol>
<p>그 밖에 후진 기관과 긴급 투묘로 전진력을 줄이는 방법도 있다([[rule-16]]). 후진할 때는 단음 3회를 울린다.</p>

<h3>좌현 변침도 될 수 있다</h3>
<p>우현 변침의 목적은 "상대선의 선수 앞을 가로지르지 않기 위한 것"이고, 그것도 "사정이 허락하는 경우"로 한정된다. 그러니 충돌을 피하는 데 필요하다면 규칙은 <strong>좌현 변침을 금지하지 않는다.</strong> 오늘날에는 선박의 종류·속력·조종 성능이 매우 다양해서, 예전보다 좌현 변침이 정당화되기 쉬울 수도 있다.{{fn:10주차 「제15조 횡단상태」 슬라이드 6·9}}</p>
<ul>
<li>우현에 장애물이나 어선단이 있어 우현 변침이 어려우면 좌현 변침할 수 있다. 이때는 반드시 <strong>조기에, 대각도로</strong> 해서 상대가 알게 한다.</li>
<li>변침이 충분히 크면 상대선이 결국 내 <strong>선미 뒤</strong>로 오게 된다. 상대와 비슷한 침로로 가면 접근 속도가 줄고, 상대가 오히려 추월선이 되어 나를 피해야 한다.</li>
<li>같은 방향으로 나란히 가게 되어 계속 피할 수 없으면 타를 계속 잡아 <strong>한 바퀴 선회(round turn)</strong>하는 것도 정상적인 피항 방법이다. 그동안 상대는 지나가 있다. 충돌보다 낫다.</li>
</ul>
<div class="tip">좌현 변침이 "허용"되는 것은 <strong>피항선</strong>의 이야기다. <strong>유지선</strong>이 단독으로 동작할 때 자선 좌현 쪽 선박을 향해 좌현 변침하는 것은 제17조(c)가 막는다([[rule-17]]).</div>

<h3>다중 조우: 모두 우현 변침</h3>
<p>COLREG은 항상 <strong>두 척</strong> 사이의 관계만 정한다. 여러 척을 동시에 만나면 각 선박과의 관계를 하나씩 따지면 되는데, 원칙적으로 <strong>모두 우현 변침하면 대부분 해결된다.</strong>{{fn:10주차 「제15조 횡단상태」 슬라이드 7·8}}</p>

<h3>수업 영상: 어선 침몰 사례</h3>
<details class="story"><summary>"알아서 피하겠지" — 좌현 변침한 화물선</summary><div>
<p>화물선(2,116톤)이 시간을 줄이려고 연안 섬 사이로 직선 항로를 잡아 어선이 많은 해역을 지났다. 2등항해사가 혼자 당직(조타수는 화장실)을 서며 우현 쪽 어선을 보고도 "알아서 피하겠지" 하고 탐조등만 비추다, 마지막 순간 <strong>좌현 변침</strong>해 충돌했다. 어선은 전복돼 9명 중 기관장만 구조됐다.{{fn:10주차 정리본 14장 「영상: 어선 침몰 사례」}}</p>
<ul>
<li>피항선(화물선): 경계 소홀, 소극적 피항, <strong>우현 변침했어야 할 상황에서 좌현 변침</strong>.</li>
<li>선장: 통항분리 항로를 따르지 않고, 사고 해역에서 직접 지휘하지 않은 책임.</li>
<li>유지선(어선): 충분한 협력동작을 하지 않은 책임([[rule-17]]).</li>
</ul>
</div></details>

<h4>감속</h4>

<h3>유지선 의무의 세 단계</h3>
<p>유지선(<span class="en">stand-on vessel</span>)은 "가만히 있으면 되는 배"가 아니다. 거리가 줄어듦에 따라 의무가 바뀐다. 조동사 <span class="en">shall</span>(해야 한다)과 <span class="en">may</span>(할 수 있다)를 구별하는 것이 핵심이다.{{fn:10주차 「제16·17조」 슬라이드 5~7 / 정리본 15장}}</p>
<table>
<thead><tr><th>단계</th><th>조항</th><th>조동사</th><th>유지선이 할 일</th></tr></thead>
<tbody>

<tr><td>2. 단독 동작 허용</td><td>(a)(ii)</td><td><span class="en">may</span></td><td>피항선이 적절한 동작을 하지 않는 것이 <strong>분명해지는 즉시</strong>, <strong>자선의 조종만으로</strong> 충돌을 피하는 동작을 할 수 있다</td></tr>
<tr><td>3. 협력동작 의무</td><td>(b)</td><td><span class="en">shall</span></td><td>이유를 불문하고 너무 가까워져 <strong>피항선의 동작만으로는 충돌을 피할 수 없으면</strong>, 충돌을 피하는 데 <strong>가장 도움이 되는 동작</strong>을 해야 한다</td></tr>
</tbody>
</table>
<p>아래에서 거리를 줄여 가며 어느 단계에 있는지, 그 단계에서 무엇을 해야 하는지 확인해 보자.</p>
<div data-sim="standon-stages"></div>

<h3>(a)(ii) 유지선의 단독 동작 — 할 수 있다</h3>
<ul>
<li>시점: 피항선이 이 규칙에 따른 적절한 동작을 하지 않고 있음이 <strong>분명해지는 즉시</strong>(<span class="en">as soon as it becomes apparent</span>).</li>
<li>방법: <strong>자선의 조종만으로</strong>(<span class="en">by her manoeuvre alone</span>). 상대의 협조를 전제하지 않는다.</li>
<li>실무에서는 유지선이라도 불안하면 <strong>TCPA 10분 전쯤</strong> 미리 피해 CPA를 넓혀도 된다. 단 좌현 변침은 피한다((c)항).</li>
<li>이 단계에서 동작할지 말지는 유지선의 판단이다(may). 그러나 동작하기로 했다면 피항선과 마찬가지로 분명하게 한다.</li>
</ul>

<h3>(b) 최선의 협력동작 — 해야 한다</h3>
<p>"<span class="en">from any cause</span>" — 피항선이 늦었든, 유지선이 경계를 소홀히 했든 이유를 묻지 않는다. 피항선 혼자서는 충돌을 피할 수 없을 만큼 가까워지면 유지선도 <strong>반드시</strong> 움직여야 한다. 상대선이 고장이라 피할 수 없는데 "내가 유지선이니 네가 피하라"고 할 수 없는 것과 같은 이치다.</p>
<div class="tip"><strong>영어 해설</strong> — <span class="en">she shall take such action as will best aid to avoid collision</span>.<br>
<span class="en">such … as …</span>는 상관 구조다. 선행사에 such, as, the same이 붙으면 which·that 대신 <strong>as가 관계대명사 역할</strong>(유사 관계대명사)을 한다. "충돌을 피하는 데 가장 도움이 될 <strong>그러한</strong> 동작"이라는 뜻으로, as는 구체적 대상(which)이 아니라 동작의 <strong>성격·유형</strong>을 규정한다. 법령 영어에서 자주 쓰인다. <span class="en">aid to avoid</span>는 지금은 잘 쓰지 않는 옛 표현이 조문에 그대로 남은 것이다. 교수님은 COLREG에서 가장 어려운 영어 문장으로 꼽았다.{{fn:10주차 「제16·17조」 슬라이드 6 및 노트(상관 관계대명사 구조)}}</div>

<h3>(c) 횡단 상태의 유지선은 좌현 변침하지 않는다</h3>
<p>횡단 상태에서 (a)(ii)에 따라 단독 동작하는 동력선은 사정이 허락하는 한 <strong>자선의 좌현 쪽에 있는 선박을 향해 좌현 변침하지 않는다.</strong></p>
<p>이유: 유지선 입장에서 피항선은 거의 항상 <strong>좌현 쪽</strong>에 있다. 피항선이 뒤늦게라도 스스로 움직이면 원칙대로 <strong>우현</strong> 변침할 것이다. 이때 유지선이 좌현 변침하면 두 선박이 <strong>서로의 진로로 마주 달려들게</strong> 된다.{{fn:10주차 「제16·17조」 슬라이드 13·14}}</p>

<h3>(d) 피항선의 의무는 그대로</h3>
<ul>
<li>유지선이 막판에 피해도 <strong>유지선이 피항선이 되는 것은 아니다.</strong> 피항선으로서가 아니라 <strong>협력동작</strong>으로 피하는 것이다.</li>

</tbody>

<h3>협력동작의 마지노선: 6L TCPA vs 9L TCPA</h3>
<p>유지선이 <strong>반드시</strong> 동작해야 하는 마지막 시점에 대해 학자마다 견해가 다르다. 여기서 L은 선박 길이(m)다.</p>
<h4>근거: IMO 조종성 기준 (MSC.137(76))</h4>
<ul>
<li>선회 성능: 선회권 시험에서 <strong>전진거리(advance) 4.5L 이하</strong>, 선회지름(tactical diameter) 5L 이하([[term-turning-circle]]).</li>
<li>초기 선회 성능: 타각 10°를 썼을 때 선수가 10° 돌기까지 2.5L 이하로 진행.</li>
<li>정지 성능: 전속 후진 정지 시험의 진출거리 15L 이하(대형선은 최대 20L).{{fn:10주차 「제16·17조」 슬라이드 11 (IMO Resolution MSC.137(76) Standards for Ship Manoeuvrability 5.3)}}</li>
</ul>
<h4>두 견해</h4>
<ul>
<li><strong>6L TCPA</strong>(학과 다른 교수님): 충돌 지점까지 <strong>선박 길이의 6배</strong>가 남은 지점에 도달하는 시간. 전진거리가 최대 4.5L이므로, 6L에서 전타하면 90° 회두할 때까지 1.5L의 여유가 남는다.</li>
<li><strong>9L TCPA</strong>(김인철 교수님): 상대선도 막판에 조치하면 그 선박도 4.5L이 필요하고, 첫 조치가 잘못돼 다시 조치할 여유도 있어야 하므로 4.5L × 2 = 9L. 200m 선박이면 약 1,800m(약 1해리) 전에는 반드시 조치한다.</li>
</ul>
<div class="star" data-note="6L 견해의 교수님이 이번 도선사 시험 출제위원 — 관련 문제는 6L로"><p>유지선이 최선의 협력동작(제17조(b))을 반드시 해야 하는 마지노선은 <strong>6L TCPA</strong>로 답한다. 6L TCPA는 충돌 지점까지 <strong>선박 길이의 6배</strong>가 남은 지점에 도달하는 시간이며, IMO 기준 최대 전진거리 4.5L에 1.5L의 여유를 더한 값이다. 계산식: <strong>TCPA(분) = 6 × L(m) ÷ 1,852 ÷ 속력(kn) × 60</strong>. (김인철 교수님 견해는 4.5L × 2 = 9L TCPA.)</p></div>
<h4>계산 예시</h4>
<p>TCPA(분) = 6 × L(m) ÷ 1,852 ÷ 속력(kn) × 60. 순서대로 남은 거리(m) → 해리 → 시간(h) → 분으로 바꾼 것이다.{{fn:10주차 「제16·17조」 슬라이드 9}}</p>
<table>

<p>숫자보다 중요한 것: 유지선이라도 막판에 몰리면 <strong>반드시 동작해야</strong> 한다.</p>

<h3>사례</h3>
<details class="story"><summary>사례 1: 횡단 충돌과 BRM — 2004년 홍콩 근해</summary><div>
<p>2004년 12월 7일 홍콩 근해. 중국 Yantian을 출항해 싱가포르로 19노트로 항해하던 A호와, Chiwan을 출항해 상하이로 가던 상대선이 횡단 상태가 되었고, 피항 동작이 미흡해 충돌했다. 인천해양안전심판원은 [[rule-15]] 횡단 항법을 적용해, 피항선 입장의 A호 측이 적기에 피항하지 못한 것이 원인이나 상대선 측의 협력동작 미흡도 한 원인이라고 재결했다. 손실 비용은 2,550만 달러였다.{{fn:10주차 「제16·17조」 슬라이드 15~20 / 정리본 15장 「사례 1」. 정리본은 징계 대상을 유지선 3등항해사로 적었으나, 슬라이드의 재결서 요약만으로는 3항사·선장이 어느 선박 소속인지 명시되어 있지 않다.}}</p>
<ul>
<li><strong>징계</strong>: 3등항해사 <strong>업무정지 1개월</strong>(지속적인 상대선 동태 파악 소홀, 적기 충돌회피 실패), 선장 <strong>견책</strong>.</li>
<li><strong>선장 책임</strong>: 선박 통항이 빈번한 곳에서 <strong>직접 지휘하지 않음</strong>(직접 지휘 의무는 COLREG이 아니라 <strong>선원법</strong>에 있다), 항해사 지도·감독 소홀. 사고가 나면 평소 아무리 잘했어도 면하기 어렵다.</li>
<li><strong>문제점</strong>: 출항 후 항해계획 <strong>브리핑 미실시</strong>, 선장의 <strong>상시명령</strong>(<span class="en">Master's standing orders</span>)과 <strong>야간명령</strong>(<span class="en">night orders</span>) 미준수, 조기 피항 동작 없음, <strong>ARPA의 CPA 과신</strong>으로 경계 소홀, 당직 조타수를 갑판 작업에 보내 경계 인원 부족(STCW: 수동 조타 중인 조타수는 경계원으로 인정되지 않음), 불안전한 항해 관행.</li>
<li><strong>팀워크</strong>: 선장과 당직항해사(OOW) 사이에 <strong>공유된 상황 인식</strong>(<span class="en">No shared concept between Master and OOW</span>)이 없었고, 서로의 판단에 대한 <strong>합리적 교차 검증</strong>(<span class="en">No reasonable verification</span>)도 없었다. 선장의 지시라도 위험하다고 판단되면 말해야 한다. 이를 4학년 <strong>선교자원관리(BRM, Bridge Resource Management)</strong>에서 배운다.</li>
<li>COLREG 외에도 STCW·선원법에 당직·항법 관련 규정이 있다.</li>
</ul>
</div></details>
<details class="story"><summary>사례 2: 예인선열 사이로 들어간 근해통발어선</summary><div>
<p>예인선(287톤)이 트랜스포터를 실은 부선(5,102톤)을 끌고 가던 중, 같은 방향으로 따라오던 근해통발어선이 예인선과 부선 <strong>사이로</strong> 들어가 부선 선수와 충돌해 전복됐다. 선원 11명 중 6명이 사망했다.</p>
<ul>

<li>예인선: 항해사가 어선을 보고도 추월하겠거니 하고 <strong>침로·속력만 유지</strong>하다 늦게 대응. 해당 2등항해사 <strong>업무정지 3개월</strong>. "운이 없었던 게 아니라 부주의했다."</li>
<li>예방: 예인선을 만나면 <strong>뒤에 부선이 있는지 확인</strong>한다. 나란히 가는 선박과는 안전거리를 둔다. 충돌 위험이 있으면 미리 피하거나 기적으로 경고한다.</li>
</ul>
</div></details>

<h3>우선순위 암기법 (pecking order)</h3>
<p>닭장에서 서열대로 쪼는 순서(<span class="en">pecking order</span>)에 빗대어 부른다.{{fn:4주차 「제3조·제18조」 슬라이드 3·8 / 10주차 「제18조」 슬라이드 6·16}}</p>
<table>
<thead><tr><th>순위</th><th>선박</th><th>Navigation Rules Can…</th><th>New Reels Catch…</th></tr></thead>
<tbody>
<tr><td>1</td><td>조종불능선 NUC</td><td>Navigation</td><td>New</td></tr>
<tr><td>2</td><td>조종제한선 RAM</td><td>Rules</td><td>Reels</td></tr>
<tr><td>3</td><td>흘수제약선 CBD</td><td>Can</td><td>Catch</td></tr>
<tr><td>4</td><td>어로종사선 Fishing</td><td>Frustrate</td><td>Fish</td></tr>
<tr><td>5</td><td>범선 Sailing</td><td>Some</td><td>So</td></tr>
<tr><td>6</td><td>동력선 Power</td><td>People,</td><td>Purchase</td></tr>

<p>미국 해양대학 학생들은 "Rules Can Frustrate Some People Say"(규칙은 몇몇 사람을 좌절시킨다)로, 수산계열에서는 "New Fish So …" 식으로 외우기도 한다. 어떻게 외워도 무방하다.</p>
<div class="star" data-note="해기사 시험 출제 — 구별 못 해 감점된 답안이 많음"><p><strong>조종불능선(NUC, <span class="en">vessel not under command</span>)</strong>은 기관·타 고장 등 <strong>예외적인 사정</strong>으로 규칙대로 조종할 수 없는 <strong>고장난 배</strong>다. <strong>조종제한선(RAM, <span class="en">vessel restricted in her ability to manoeuvre</span>)</strong>은 선박 자체는 멀쩡하지만 준설·측량·부설·항행 중 보급 같은 <strong>작업의 성질상</strong> 조종이 제한된 <strong>작업선</strong>이다. 동력선·범선·어로종사선은 둘 다 피해야 하고, NUC와 RAM이 만나면 그나마 조종이 되는 <strong>RAM이 피한다.</strong></p></div>

<h3>조항별로 읽기</h3>
<h4>(a)~(c) 진로를 피한다 (keep out of the way)</h4>
<ul>
<li><strong>동력선끼리</strong> 만나면 우선순위가 같으므로 조우 형태 — 마주침([[rule-14]]), 횡단([[rule-15]]), 추월([[rule-13]]) — 에 따른 항법으로 정한다. 실제로는 <strong>95% 이상이 동력선과 동력선의 조우</strong>다.</li>
<li>같은 종류(어로종사선끼리, 범선끼리)가 만나도 항법에 따른다. 범선끼리는 별도의 범선 항법([[rule-12]])이 있다.</li>
<li>어로종사선의 의무에는 "<strong>가능한 한</strong>"(<span class="en">so far as possible</span>)이 붙는다. 어구를 끌고 있어 완전히 피하기 어려울 수 있기 때문이다.</li>
<li>NUC와 RAM이 만나면 RAM이 피한다. 제18조에 명문 규정은 없지만 "조종 성능이 좋은 쪽이 피한다"는 원칙에 따른 것이다.{{fn:3주차 정리본 3장 「조종제한선」. 제18조는 NUC와 RAM 사이의 관계를 직접 정하지 않는다.}}</li>
<li>예인선 예시: 아무것도 끌지 않는 예인선은 그냥 동력선이다. 서쪽으로 가는 A와 북쪽으로 가는 예인선 B가 만나 B가 A를 우현에 두면 B가 피항선이다. 그러나 B가 모래 바지선이나 선박 블록을 끌어 조종이 제한되면 RAM이 되어 A가 피항선이 된다. 그 B도 앞에 NUC가 있으면 NUC를 피해야 한다.</li>
<li>상대선이 고장이라 피할 수 없는데 "내가 유지선이니 네가 피하라"고 할 수는 없다.</li>
</ul>
<h4>(d) 흘수제약선 — 방해하지 않는다 (avoid impeding)</h4>
<ul>
<li>CBD에 대해서는 "피한다"가 아니라 "<strong>안전한 통항을 방해하지 않는다</strong>"(<span class="en">avoid impeding the safe passage</span>)고 쓴다. NUC·RAM을 뺀 모든 선박(어로종사선·범선 포함)이 대상이다.</li>
<li>대상은 <strong>제28조의 신호</strong>(홍등 3개 / 원통형 형상물)를 표시하고 있는 CBD다.</li>
<li>CBD 자신도 특수한 조건을 충분히 고려해 <strong>특별히 조심해</strong> 운항해야 한다((d)(ii)). 예: 여수항의 대형 유조선은 깊은 수심 항로로만 다닌다. 하역 후 흘수가 줄면 더 이상 CBD가 아니다.</li>
</ul>
<h4>(e)·(f) 수상항공기와 WIG선</h4>
<ul>
<li>수상항공기는 원칙적으로 모든 선박을 충분히 피하되, 충돌의 위험이 있으면 항법 규정을 따른다.</li>
<li>WIG선은 이착륙·저공비행 중에는 모든 선박을 충분히 피하고, <strong>수면 위에서 운항할 때는 동력선</strong>으로서 항법을 따른다.{{fn:(f)항은 2001년 개정(결의 A.910(22), 2003년 11월 29일 발효)으로 WIG선 규정과 함께 추가된 조항이다. 슬라이드에 (f)항 한글 번역이 없어 해상교통안전법 제76조 ⑦(10주차 「제18조」 슬라이드 10 노트)과 영문을 바탕으로 옮겼다.}}</li>
<li>WIG선이 피할 때는 좌우가 아니라 위로 급상승할 수도 있지만, 고도를 높이면 지면효과가 사라져 연료가 많이 든다.</li>
</ul>
<div class="tip">퀴즈 단골: <strong>어로종사선과 범선이 만나면 피항선은 범선</strong>이다((b)(iii)). <strong>동력선은 어로종사선을 방향과 관계없이 피한다</strong> — 어로종사선이 내 좌현에서 와도 나는 유지선이 아니다. 단 "어로에 종사하고 있는" 선박이어야 한다. 어장으로 이동 중인 어선은 그냥 동력선이다.</div>

<h3>제18조 밖: 정박선</h3>
<p>제18조는 <strong>항행 중</strong>인 선박 사이의 관계다. 정박 중인 선박은 움직일 수 없으므로, 항행 중인 동력선은 정박선의 진로를 피해야 한다. 이는 제18조가 아니라 [[rule-02]]의 선원의 상무(통상의 주의의무, [[term-seamanship]])에서 나오는 의무다.{{fn:10주차 「제18조」 슬라이드 5 「피항선의 범위」}}</p>

<h3>등화로 알아보기</h3>
<p>종류를 알아야 제18조를 쓸 수 있다. 야간에는 수직 전주등으로 구별한다: NUC 홍·홍, RAM 홍·백·홍, CBD 홍·홍·홍, 트롤 어로종사선 녹·백, 그 밖의 어로종사선 홍·백. 주간 형상물과 그림은 [[review-lights]]에 있다.</p>

<h3>교수님 일화와 수업 영상</h3>
<details class="story"><summary>교수님 일화: 범선인지 동력선인지 불확실할 때</summary><div>
<p>3등항해사 시절 부산항 입항 중 좌측에서 기범선이 접근했다. 주간이라 기관 사용 여부를 알 수 없었고 형상물도 없었다(실제로 형상물을 안 다는 배가 많다). "좌측이니 내가 유지선"이라며 계속 가다가, 대형선 선수 앞의 <strong>사각지대(blind sector, 최대 500m 정도)</strong>로 범선이 들어가 버렸다. 결국 우현 15도를 써서 겨우 피했고 기관실에서는 경보가 울렸다.</p>
<ul>
<li>상태가 불확실하면 <strong>더 위험한 상태를 가정</strong>해야 한다. 범선인지 모르면 범선으로 간주하고 피한다.</li>
<li>주니어 항해사는 규정대로 하려 하지만, 선장은 <strong>안전하게 항해하는 것</strong>을 우선한다.</li>
<li>컨테이너선은 회사 지침상 평소 타각을 7도 정도로 제한하기도 하지만, 위험하면 하드 스타보드(35도)까지 써야 한다.</li>
<li>COLREG의 지상 목적은 <strong>어떻게든 충돌하지 않는 것</strong>이다. 충돌을 피하기 위해 규정에서 벗어날 수 있다는 내용이 [[rule-02]]에 있다.</li>
</ul>
</div></details>
<details class="story"><summary>수업 영상: 선원의 상무와 선박 상호간의 책무</summary><div>

</ul>
</div></details>

  <li>선저여유수심(<span class="en">UKC</span>, under keel clearance)이 작으면 뱅크 효과 등으로 조종이 어려워진다([[term-interaction]]).</li>

<div class="star" data-note="영어 표기 주의, s 빠뜨리면 틀림">
<p>근접상태는 <strong>close-quarters situation</strong>이라고 쓴다. "close-quarter situation"처럼 quarters의 <strong>s</strong>를 빠뜨리면 틀린다. headquarters가 늘 s로 끝나는 것과 같다.</p>

<h3>뜻</h3>

<li>순서로 보면 <strong>충돌의 위험</strong>([[rule-07]])이 먼저 생기고, 그대로 두면 <strong>근접상태</strong>가 되며, 더 가까워지면 피항선의 동작만으로는 충돌을 피할 수 없는 상태([[rule-17]](b))에 이른다. 피항 동작은 근접상태가 되기 <strong>전에</strong> 해야 한다.</li>

<h3>조문에 나오는 곳</h3>

<script>/* src/docs/term-compass-bearing.js */
try{
W.doc({
  id: 'term-compass-bearing',
  group: 'terms',
  order: 50,
  week: '5주차',
  star: true,
  title: '컴퍼스 방위와 상대방위',
  short: '컴퍼스 방위·상대방위',
  en: 'Compass bearing · Relative bearing · Points',
  tags: ['compass bearing', 'relative bearing', '포인트', '11.25°'],
  summary: '<strong>컴퍼스(나침) 방위</strong>는 북을 기준으로, <strong>상대방위</strong>는 자선의 선수를 기준으로 시계방향으로 잰 방위다. [[rule-07|제7조]]의 충돌 위험 판단 기준은 <strong>컴퍼스 방위</strong>다.',
  body: `
<h3>정의</h3>
<table>
<thead><tr><th>구분</th><th>기준</th><th>뜻</th></tr></thead>
<tbody>
<tr><td><strong>컴퍼스 방위</strong> <span class="en">compass bearing</span><br>(나침방위, 진방위)</td><td>북</td><td>컴퍼스의 북(자이로컴퍼스면 진북)을 000°로 하여 시계방향으로 360°까지 잰 상대선의 방향</td></tr>
<tr><td><strong>상대방위</strong> <span class="en">relative bearing</span></td><td>선수</td><td>선수를 000°로 하여 시계방향으로 잰 상대선의 방향. 정횡은 090°/270°</td></tr>
</tbody>
</table>
<p>관계: <strong>컴퍼스 방위 = 자선의 선수방위 + 상대방위</strong> (360°를 넘으면 360°를 뺀다).</p>
<svg viewBox="130 0 410 300" role="img" aria-label="선수방위 030도인 자선에서 본 상대선: 컴퍼스 방위 075도, 상대방위 045도" style="display:block;max-width:480px;margin:14px auto">

    <line x1="300" y1="190" x2="300" y2="26" stroke="var(--ink-3)" stroke-dasharray="5 5"/>

    <polygon points="0,-20 8,-6 8,16 -8,16 -8,-6" transform="translate(493 138.3) rotate(250)" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5"/>

    <rect x="140" y="270" width="18" height="5" fill="var(--ink-2)"/>

<h3>왜 컴퍼스 방위인가</h3>
<div class="star" data-note="도선사 응시자도 착각">
<p>[[rule-07|제7조(d)(i)]]의 판단 기준은 <strong>상대방위가 아니라 컴퍼스 방위</strong>다: "such risk shall be deemed to exist if the <strong>compass bearing</strong> of an approaching vessel does not appreciably change". 자선이 변침 중이면 상대방위가 135° → 90° → 60° → 45°로 계속 바뀌어도 컴퍼스 방위가 045°로 그대로이면 충돌한다.</p>
</div>
<table>
<thead><tr><th>자선 선수방위</th><th>상대방위</th><th>컴퍼스 방위</th></tr></thead>
<tbody>
<tr><td>270°</td><td>135°</td><td>045°</td></tr>
<tr><td>315°</td><td>090°</td><td>045°</td></tr>
<tr><td>345°</td><td>060°</td><td>045°</td></tr>
<tr><td>000°</td><td>045°</td><td>045°</td></tr>
</tbody>
</table>
<p>자선이 침로를 그대로 유지하고 있으면 두 방위의 변화량이 같으므로 어느 쪽으로 봐도 결과가 같다. 차이는 자선이 <strong>변침하거나 선수가 흔들릴 때</strong> 생긴다. 방위는 자이로 리피터의 섀도우 핀·방위환, 레이더 EBL로 잰다([[rule-07]]).{{fn:5주차 강의자료 ①(제7조) 슬라이드 8 「Relative and True(compass) bearings — 방위변화는 무엇으로 관측하여야 하는가?」 / 정리본 7장}}</p>

<h3>포인트(point)와 방위 이름</h3>
<ul>
<li>360°를 <strong>32방위</strong>로 나누면 한 칸이 <strong>11.25° (11°15′) = 1포인트</strong>다. 옛 선장들은 "우현으로 2점(two points)"처럼 말했다.{{fn:5주차 강의자료 ②(제8조 1/2) 슬라이드 5·6 「컴퍼스 카드 판독 방법」 / 정리본 8장 「방위와 포인트」}}</li>
<li>나누는 순서: <strong>4방점</strong>(N, E, S, W) + <strong>4우점</strong>(NE, SE, SW, NW) = 8주요점 → 16점 → 32점.</li>
<li>이름 붙이는 법: NE = N + E, NNE = N + NE, ENE = E + NE, NE/E(<span class="en">northeast by east</span>) = NE에서 E 쪽으로 1포인트.</li>
<li>등화 조문의 <strong>22.5° = 2포인트</strong>다. "정횡 후 22.5°"는 원래 "정횡 후 2포인트(two points abaft the beam)"였다([[term-light-arcs]], [[rule-13]]).</li>
</ul>
`,
  easy: '"내 오른쪽 45도"(상대방위)는 내가 고개를 돌리면 바뀌지만, "북동쪽"(컴퍼스 방위)은 내가 어디를 보든 그대로다. 부딪힐지 판단할 때는 고개 기준이 아니라 지도 기준 방향을 본다.',

});

<h3>쓰는 곳</h3>

<div class="tip"><p>슬라이드 질문 "CPA 1마일을 유지하기 위한 변침각은 거리별로 얼마일까?" — 상대선이 <strong>멀리 있을 때</strong> 돌리면 작은 각도로도 CPA 1마일을 만들 수 있지만, <strong>가까이 와서</strong> 돌리면 같은 CPA를 얻는 데 훨씬 큰 각도가 필요하다. 그래서 [[rule-08]]은 "충분한 시간 여유(ample time)"를 요구한다. "수역에 따른 CPA의 차이는?" — 넓은 대양에서는 CPA를 넉넉히 잡을 수 있지만 좁은 연안·항만에서는 확보할 수 있는 CPA가 작아진다. 안전한 거리는 정해진 숫자가 아니라 당시 사정에 따른다.{{fn:5주차 강의자료 ②(제8조 1/2) 슬라이드 9·13의 질문. 답은 강의 내용과 상대운동의 기하로 정리한 것이다.}}</p></div>

  tags: ['제3조(d)', '트롤', '끌낚시 제외', '장구형'],

<h3>정의</h3>
<p>제3조(d): 어망, 낚싯줄, 트롤망 또는 그 밖의 <strong>조종 성능을 제한하는 어구</strong>로 어로하고 있는 선박. 조종 성능을 제한하지 않는 끌낚시(<span class="en">trolling lines</span>) 등으로 어로하는 선박은 포함하지 않는다.{{fn:3주차 슬라이드 7 / 정리본 3장}}</p>

<ul>

  <li>바다낚시 배는 이동해도 조종에 문제가 없으므로 해당하지 않는다.</li>

  <li>등화: 트롤 = <strong>녹·백</strong>(길이 50m 이상은 그 뒤 더 높이 마스트등), 트롤 외 = <strong>홍·백</strong>. 형상물: 꼭짓점을 맞댄 원뿔 2개(<strong>장구형</strong>). 어구가 수평 150m 넘게 뻗으면 그 방향에 백색 전주등 / 꼭짓점이 위인 원뿔 1개.</li>

<div class="tip">퀴즈: 어로종사선과 범선이 만나면 피항선은? → <strong>범선</strong>.</div>

<h3>정의</h3>
<p>선박 간 상호작용(<span class="en">interaction</span>)은 두 선박이 가까이 지날 때 선체 주위의 압력 변화(압력파)가 서로의 선체에 힘을 미치는 현상이다. 원리는 유체의 속도가 빠른 곳에서 압력이 낮아진다는 <strong>베르누이 정리</strong>다.{{fn:9주차 「제13조 추월」 슬라이드 12~15 / 정리본 12장 「추월 시 선박 간 상호작용」}}</p>
<div style="max-width:460px;margin:12px auto">
<svg viewBox="0 0 460 170" role="img" aria-label="항주 선박 주위의 압력 분포: 선수와 선미는 고압, 현측 중앙은 저압">
<rect x="0" y="0" width="460" height="170" rx="10" fill="var(--sea)" opacity=".18"/>

<h3>핵심</h3>
<ul>
<li>선수 쪽은 물을 밀어내 <strong>고압부</strong>, 현측 중앙은 <strong>저압부</strong>(흡인), 선미 쪽(프로펠러 배출류)은 다시 <strong>고압부</strong>가 생긴다.</li>
<li>대형선이 소형선 옆을 가까이 추월하면: ① 대형선 선수의 고압이 소형선 선미를 밀어 소형선 선수가 대형선 쪽으로 돌아 들어오고, ② 중앙 저압부가 소형선을 빨아들이며, ③ 대형선 선미 고압이 다시 밀어낸다. 소형선은 몇 차례 휘청이며 충돌할 수 있다.</li>
<li><strong>좁은 수로나 얕은 수역</strong>에서 특히 심하다([[rule-09]]).</li>

<li>고속도로에서 대형 트럭이 옆을 지나갈 때 승용차가 휘청이는 것과 같은 원리다.</li>

  <li>피할 때는 우현 변침해 상대선 뒤로 돌아간다. 결과적으로 포트투포트가 된다([[intro-colreg]]).</li>

<script>/* src/docs/term-light-arcs.js */
try{
W.doc({
  id: 'term-light-arcs',
  group: 'terms',
  order: 40,
  week: '9주차',
  star: false,
  title: '등화의 조사각',
  en: 'Arcs of visibility · masthead light, sidelights, sternlight',
  tags: ['마스트등 225°', '현등 112.5°', '선미등 135°', '정횡 후 22.5°'],
  summary: '등화가 비추는 수평 범위. 마스트등 225°, 현등 각 112.5°, 선미등 135°이며, 그 경계가 모두 <strong>정횡 후 22.5°</strong>(2포인트)다. 이 경계가 곧 추월과 횡단을 가르는 선이다.',
  body: `
<h3>정의</h3>
<p>조사각(<span class="en">arc of the horizon</span>)은 등화가 수평으로 빛을 보이는 각도 범위다. COLREG(제21조)은 "135도"처럼 숫자로 쓰지 않고 "<span class="en">from right ahead to 22.5 degrees abaft the beam</span>(정선수에서 정횡 후 22.5도까지)"처럼 방향으로 쓴다. 22.5°는 옛 단위 <strong>2포인트</strong>(1포인트 = 360° ÷ 32 = 11.25°)를 도수로 바꾼 것이다.{{fn:9주차 「제13조 추월」 슬라이드 4·6 / 정리본 12장 「등화의 조사각」}}</p>
<table>
<thead><tr><th>등화</th><th>색</th><th>조사각</th><th>조문 표현</th></tr></thead>
<tbody>
<tr><td>마스트등 (<span class="en">masthead light</span>)</td><td>백</td><td><strong>225°</strong></td><td>정선수에서 양현 각각 정횡 후 22.5°까지</td></tr>
<tr><td>현등 (<span class="en">sidelights</span>)</td><td>좌현 홍, 우현 녹</td><td>각 <strong>112.5°</strong></td><td>정선수에서 각 현 정횡 후 22.5°까지</td></tr>
<tr><td>선미등 (<span class="en">sternlight</span>)</td><td>백</td><td><strong>135°</strong></td><td>정선미에서 양현 각각 67.5° (= 각 현 정횡 후 22.5°부터 정선미까지)</td></tr>
<tr><td>예선등 (<span class="en">towing light</span>)</td><td>황</td><td>135°</td><td>선미등과 같은 각도, 선미등 바로 위</td></tr>
<tr><td>전주등 (<span class="en">all-round light</span>)</td><td>각각</td><td>360°</td><td>NUC·RAM·CBD·어로종사선 표시 등 ([[review-lights]])</td></tr>
</tbody>
</table>

<h3>핵심</h3>
<ul>
<li>마스트등 225° = 360° − 선미등 135°. 이를 반으로 나눈 것이 각 현등 112.5°. 그래서 어느 방향에서 보든 마스트등·현등 쪽과 선미등 쪽이 정확히 나뉜다.</li>
<li>정횡 후 22.5°보다 뒤에서는 <strong>선미등만</strong> 보인다 → 그 위치에서 따라잡으면 추월선([[rule-13]]). 조사각을 직접 돌려 보는 그림은 [[rule-13]]에 있다.</li>
<li>정면에서는 마스트등 두 개가 일직선, 양 현등이 함께 보인다 → 마주치는 상태([[rule-14]]). 현등의 빛은 정선수선을 약 1~3도 넘어서까지 비춘다(차광 한계).</li>
<li>길이 50m 이상 선박은 후부 마스트등을 추가로 달며, 전부 마스트등보다 <strong>4.5m 이상 높게</strong> 단다. 측면에서 보면 <strong>높은 백등(후부) → 낮은 백등(전부) 쪽이 진행 방향</strong>이다.</li>
<li>선미등 위에 황색 예선등이 보이면 무언가를 끌고 있다. 예인선과 피예인물 사이 줄은 200m 이상인 경우가 많아, 그 사이를 가로지르던 어선 사고가 많다.</li>
<li>항공기도 좌측 홍등, 우측 녹등을 단다. 등화 판독은 처음엔 어렵지만 익숙해지면 항법 관계가 바로 보인다. 첫 승선 때 반드시 익혀야 한다.</li>
</ul>
`,
  easy: '배의 등은 손전등처럼 정해진 방향만 비춘다. 앞쪽 5/8은 빨강(왼쪽)·초록(오른쪽), 뒤쪽 3/8은 하얀 선미등이 맡아서, 어떤 색이 보이느냐로 내가 그 배의 어느 쪽에 있는지 안다.',
  quiz: [
    { q: '현등(sidelight) 한 개의 조사각은?', choices: ['112.5°', '135°', '225°', '67.5°'], answer: 0, why: '정선수에서 그 현의 정횡 후 22.5°까지 = 90° + 22.5° = 112.5°.' },
    { q: '선미등(sternlight)의 조사각과 조문 표현으로 옳은 것은?', choices: ['225°, 정선미에서 양현 각각 112.5°', '135°, 정선미에서 양현 각각 67.5°', '112.5°, 정횡에서 정선미까지', '180°, 정횡 뒤 전부'], answer: 1, why: 'Rule 21(c): 135°, 67.5 degrees from right aft on each side = 각 현 정횡 후 22.5°부터 정선미까지.' },
    { q: '길이 50m 이상 선박을 측면에서 보니 왼쪽 백등이 높고 오른쪽 백등이 낮다. 이 선박의 진행 방향은?', choices: ['왼쪽', '알 수 없다', '오른쪽', '나를 향해 정면으로'], answer: 2, why: '후부 마스트등이 전부 마스트등보다 높다. 높은 등(후부) → 낮은 등(전부) 쪽이 진행 방향이므로 오른쪽.' }
  ],
  related: ['rule-13', 'rule-14', 'review-lights']
});

W.term({ en: 'masthead light', ko: '마스트등', note: '백색 225°. 50m 이상은 후부 마스트등 추가', doc: 'term-light-arcs' });

<script>/* src/docs/term-power-sail.js */

  body: `
<h3>정의</h3>
<ul>
  <li>(b) <span class="en">power-driven vessel</span>(PDV): 기계를 사용하여 추진하는 모든 선박.</li>
  <li>(c) <span class="en">sailing vessel</span>: 추진기계를 갖추었더라도(if fitted) 그것을 사용하지 않고 돛으로 항행하는 선박.</li>
</ul>
<h3>핵심</h3>
<ul>
  <li><strong>기범선</strong>(요즘 범선 대부분): 돛만 쓰면 범선, 기관을 쓰면 동력선.</li>
  <li>돛과 기관을 함께 쓰는 범선은 주간에 <strong>꼭짓점을 아래로 한 원뿔</strong>을 단다(제25조(e)). 동력선이라는 표시다.</li>
  <li>범선의 선택 등화: 마스트 꼭대기에 <strong>홍등 위·녹등 아래</strong> 전주등(태극기 빨강 위·파랑 아래). 길이 20m 미만 범선은 홍·녹·백 3색등 하나로 대신할 수 있다.</li>
  <li>동력선은 범선을 피한다. 범선은 NUC·RAM·어로종사선을 피한다([[rule-18]]). 범선끼리는 [[rule-12]].</li>
  <li>동력선끼리는 우선순위가 같아 조우 형태(마주침·횡단·추월)로 정한다. 실제 조우의 95% 이상이 동력선끼리다.</li>

<h3>정의</h3>
<table>

<h3>핵심</h3>
<ul>
<li>돛은 바람에 밀려 <strong>바람 반대편</strong>으로 나간다. 그래서 붐이 좌현에 있으면 우현택이다(슬라이드: "Boom carried on port side — Starboard Tack").</li>
<li>[[rule-12|제12조]] (b): 풍상 측 = <strong>주범(mainsail)이 펼쳐진 쪽의 반대쪽</strong>. 횡범선(square-rigged vessel)은 가장 큰 종범(fore-and-aft sail)이 펼쳐진 쪽의 반대쪽.</li>
<li>범선 항법: 택이 다르면 <strong>좌현택이 피하고</strong>, 같으면 <strong>풍상 쪽이 피하며</strong>, 좌현택 범선이 풍상 쪽 범선의 택을 모르면 <strong>좌현택이 피한다</strong>.</li>

      answer: 0, why: 'windward = 풍상(바람이 불어오는 쪽), leeward = 풍하(바람이 불어가는 쪽). 같은 택이면 windward 쪽 범선이 피한다(제12조(a)(ii)).' }

W.term({ en:'square-rigged vessel', ko:'횡범선', note:'가장 큰 종범(fore-and-aft sail)의 반대쪽이 풍상', doc:'rule-12' });

<script>/* src/docs/term-tss.js */

  en: 'Traffic separation scheme · traffic lane · separation zone · inshore traffic zone',
  tags: ['TSS', '통항로', '분리대', '연안통항대'],
  summary: '통항분리제도(TSS)는 반대 방향 교통을 <strong>분리대·분리선</strong>으로 갈라 <strong>통항로</strong>를 만든 제도이고, TSS와 육지 사이 수역이 <strong>연안통항대</strong>다. 항법은 [[rule-10]].',
  body: `
<h3>정의</h3>
<table>
<thead><tr><th>용어</th><th>영어</th><th>뜻</th></tr></thead>
<tbody>
<tr><td>통항분리제도(통항분리방식)</td><td><span class="en">traffic separation scheme</span> (TSS)</td><td>통항로를 설정하는 등의 방법으로 반대 방향 교통 흐름을 분리하는 항로지정 제도. 국제 수역은 IMO 채택·승인을 받는다.</td></tr>
<tr><td>통항로</td><td><span class="en">traffic lane</span></td><td>한 방향 교통만 다니도록 경계를 정한 수역. 슬라이드 번역에서는 "항로"라고도 쓴다.</td></tr>
<tr><td>분리대</td><td><span class="en">separation zone</span></td><td>반대 방향 통항로 사이를 나누는 수역(바다의 중앙분리대)</td></tr>
<tr><td>분리선</td><td><span class="en">separation line</span></td><td>통항로 사이를 나누는 선(분리대 대신 쓰는 경우)</td></tr>
<tr><td>연안통항대</td><td><span class="en">inshore traffic zone</span> (ITZ)</td><td>TSS의 육지 쪽 경계와 해안 사이의 수역</td></tr>
<tr><td>종단부</td><td><span class="en">termination</span></td><td>통항로·TSS의 끝(출입구). 원칙적으로 여기서 출입한다.</td></tr>
</tbody>
</table>

<h3>핵심</h3>
<ul>
<li>통항로 안에서는 교통 흐름 방향으로, 분리대에서 떨어져 간다. 출입은 종단부에서, 옆으로 들고 날 때는 <strong>소각도</strong>로 한다.</li>
<li>횡단은 가능한 한 피하고, 부득이하면 <strong>선수 방향(heading)</strong>을 직각으로.</li>
<li>분리대에는 들어가지 않는다. 예외: 횡단·합류·이탈, 급박한 위험 회피, <strong>분리대 안에서 어로</strong>.</li>
<li>연안통항대는 20m 미만 선박·범선·어로종사선, 그리고 그 안의 항구·구조물·도선 장소를 오가거나 급박한 위험을 피하는 선박이 쓴다.</li>
<li>TSS에서 통항로를 따라가는 선박에게 <strong>우선권은 없다</strong>(제10조(a)). [[rule-09|좁은 수로]]와 다른 점이다.{{fn:6주차 슬라이드 4~13 / 정리본 10장}}</li>
</ul>
`,
  easy: '통항로는 일방통행 차선, 분리대는 중앙분리대, 연안통항대는 고속도로 옆 지방도로다. 큰 배는 고속도로로, 작은 배·범선·어선은 지방도로를 써도 된다.',
  quiz: [
    { q: 'TSS와 해안 사이의 수역을 뜻하는 영어 용어는?',

      answer: 3, why: 'inshore traffic zone(연안통항대). separation zone은 반대 방향 통항로 사이의 분리대, traffic lane은 통항로다.' },
    { q: '분리대(separation zone)에 들어갈 수 있는 경우가 <strong>아닌</strong> 것은?',
      choices: ['통항로를 횡단하는 경우', '분리대 안에서 어로에 종사하려는 경우', '통항로가 혼잡해 앞지르려는 경우', '급박한 위험을 피하기 위한 비상시'],
      answer: 2, why: '제10조(e): 횡단·합류·이탈하는 선박 외에는 급박한 위험 회피와 분리대 안 어로의 경우에만 분리대에 들어갈 수 있다.' }

});

W.term({ en:'separation zone', ko:'분리대', note:'예외: 급박한 위험 회피, 분리대 안 어로', doc:'term-tss' });

W.term({ en:'inshore traffic zone (ITZ)', ko:'연안통항대', note:'20m 미만·범선·어로종사선은 이용 가능', doc:'term-tss' });

}catch(e){console.error("[load] src/docs/term-tss.js", e)}
</script>
<script>/* src/docs/term-turning-circle.js */
try{
W.doc({
  id: 'term-turning-circle',
  group: 'terms',
  order: 54,
  week: '4~5주차',
  title: '선회권 (turning circle)',
  short: '선회권',
  en: 'Turning circle · Advance · Transfer · Tactical diameter',
  tags: ['advance', 'transfer', 'tactical diameter', 'IMO 조종성능 기준'],
  summary: '최대 타각으로 선회할 때 선박이 그리는 궤적. <strong>전진거리(advance) 4.5L 이하, 전술직경(tactical diameter) 5.0L 이하, 정지거리 15L 이하</strong>가 IMO 조종성능 기준이다. [[rule-06|제6조]] 안전한 속력의 고려요소인 조종 성능의 핵심이다.',
  body: `
<h3>용어</h3>
<table>
<thead><tr><th>용어</th><th>정의</th><th>IMO 기준</th></tr></thead>
<tbody>
<tr><td>전진거리(종거) <span class="en">advance</span></td><td>최대 타각으로 선회할 때 <strong>전타한 위치부터 침로가 90도 변할 때까지</strong> 원침로 방향으로 전진한 거리</td><td><strong>4.5L 이하</strong></td></tr>
<tr><td>횡거 <span class="en">transfer</span></td><td>침로가 90도 변했을 때 원침로에서 <strong>옆 방향</strong>으로 이동한 거리</td><td>—</td></tr>
<tr><td>전술직경 <span class="en">tactical diameter</span></td><td>침로가 <strong>180도</strong> 변했을 때 원침로에서 옆 방향으로 이동한 거리(최대횡거와 거의 같다)</td><td><strong>5.0L 이하</strong></td></tr>
<tr><td>정지거리</td><td>전속 전진 중 전속 후진을 걸어 정지할 때까지의 거리</td><td><strong>15L 이하</strong></td></tr>
</tbody>
</table>
<p>L = 선박 길이. "전술(tactical)"이라는 말은 범선 해전에서 얼마나 짧게 돌아 반대 현으로 포격하느냐가 승패를 갈랐던 데서 왔다.{{fn:4주차 강의자료 ③(제4~6조 계속) 슬라이드 7·8·14(퀴즈) / 정리본 6장 「조종 성능과 선회권」}}</p>
<div class="fix"><p>슬라이드 퀴즈 답의 괄호에 "Max Transfer 5.0L"이라고 적혀 있으나, IMO 조종성능 기준의 5.0L은 <strong>전술직경(tactical diameter)</strong>에 대한 기준이다. 정리본 표도 전술직경 5.0L로 적었다.</p></div>

<h3>IMO 조종성능 기준</h3>
<ul>
<li>1993년 IMO가 「선박 조종성능 잠정기준(Interim Standards for Ship Manoeuvrability)」을 채택했다. 1994년 7월 1일 이후 건조된 길이 100m 이상 선박과 모든 케미컬 탱커·가스 운반선에 적용되었다.</li>
<li>2002년 「선박 조종성능 기준(Standards for Ship Manoeuvrability)」으로 대체되었다.</li>
<li>시험 항목: 선회 시험(선회 성능), 지그재그 시험(변침 성능), 정지 시험(정지 성능), 나선 시험(침로 안정성).</li>
<li>신조선은 시운전(sea trial)에서 공선·만재 상태로 좌·우 선회를 측정해 조종성능표를 만들고, <strong>선회권 그림을 선교에 게시</strong>한다. 도선사가 승선하면 가장 먼저 보는 것이다.</li>
</ul>

<h3>실제 예: 실습선 세계로호</h3>
<table>
<thead><tr><th>항목</th><th>값</th><th>L 배수</th></tr></thead>
<tbody>
<tr><td>전진거리</td><td>약 354m</td><td>LOA 133m 기준 2.7L, LBP 120m 기준 <strong>2.9L</strong></td></tr>
<tr><td>전술직경</td><td>약 454m</td><td>LBP 120m 기준 3.7L</td></tr>
</tbody>
</table>
<p>둘 다 IMO 기준(4.5L, 5.0L)보다 훨씬 좋다. 슬라이드의 다른 선박 예(전진거리 603m, 길이 232m/222m)도 약 2.6~2.7L이다.{{fn:4주차 강의자료 ③(제4~6조 계속) 슬라이드 9·10}} 2등항해사가 되면 선장이 "우리 배 advance가 몇이냐"고 묻는다. 200m 선박이면 "대략 800~900m 가야 90도 돈다" 정도는 알고 있어야 한다.</p>

<h3>선회할 때 생기는 일</h3>
<ul>
<li><strong>피벗 포인트</strong>(<span class="en">pivoting point</span>): 선박이 도는 회전 중심. 선미는 바깥으로 밀려난다.</li>
<li><strong>킥</strong>(<span class="en">kick</span>): 전타 초기 선미가 원침로에서 바깥으로 밀려난 폭. 사람이 현측에서 떨어지면 즉시 떨어진 쪽으로 전타해 선미를 벌려 프로펠러에 빨려들지 않게 한다.</li>
<li><strong>내방경사 후 외방경사</strong>: 선회 초기에는 타압이 만드는 경사우력이 커서 안쪽으로 기울고, 시간이 지나 원심력이 만드는 경사우력이 커지면 바깥쪽으로 기운다. 갑판 적재가 많은 컨테이너선·자동차운반선은 외방경사가 크다.</li>
<li>전진거리 4.5L은 협력동작 시점(6L TCPA, 9L TCPA)의 근거로도 쓰인다([[rule-17]]).</li>
</ul>
`,
