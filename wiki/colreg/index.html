<script>/* src/sims/avoid-compare.js */
try{
/* 제8조 충돌을 피하기 위한 동작 — 작고 늦은 변침 vs 크고 이른 변침 (S1) */
W.sim('avoid-compare', (el) => {
  const N = W.nav, ID = W.ui.uid('ac');
  const DT = 5/3600, ROT = 30*60, TEND = 32/60;          // 5초 간격, 선회율 30°/분, 32분
  const OWN0 = { x:0, y:0, c:0, s:12 };
  const B0 = 45, R0 = 6;
  const TGT0 = { x:R0*Math.sin(N.rad(B0)), y:R0*Math.cos(N.rad(B0)), c:270, s:12 };   // 방위 045° 불변 → 충돌 코스

  const ui = W.ui.box(el, { title:'작고 늦은 변침 vs 크고 이른 변침', kind:'해보기',
    caption:'같은 횡단 상황(상대선이 내 우현 045°, 6 NM, 충돌 코스)을 두 번 재생한다. 내 배가 피항선이고 상대선은 침로·속력을 유지한다. '+
      '판정 기준값(변침 30° 이상이면 뚜렷함, 변침 시 TCPA 10분 이상이면 충분, CPA 1 NM 이상이면 안전)은 이 시뮬레이터의 가정이다 — 제8조에는 숫자가 없고 "상대가 알아볼 수 있는가"가 기준이다. 원침로 복귀는 생략했다.' });

  /* ---------- 계산 ---------- */
  const A_OPTS = {
    late10: { label:'늦은 10°', alts:[{ at:1.5, deg:10 }] },
    steps5: { label:'5°씩 세 번', alts:[{ at:2.5, deg:5 }, { at:2.0, deg:5 }, { at:1.5, deg:5 }] }
  };
  let aKey = 'late10', bDeg = 60, bAt = 5;

  function simulate(alts){
    const o = { ...OWN0, ord:OWN0.c }, g = { ...TGT0 };
    const left = alts.map(a => ({ ...a })), frames = [], events = [];
    let t = 0;
    const push = () => frames.push({ t, o:{ x:o.x, y:o.y, c:o.c }, g:{ x:g.x, y:g.y }, r:N.dist(o, g) });
    push();
    while(t < TEND - 1e-9){
      const r = N.dist(o, g);
      for(const a of left) if(!a.done && r <= a.at + 1e-9){
        a.done = true;
        const c = N.cpa(o, o.c, o.s, g, g.c, g.s);
        const lights = N.lightsSeen(g, { x:o.x, y:o.y, heading:o.ord });
        o.ord = N.norm(o.ord + a.deg);
        events.push({ t, r, tcpa:c.tcpa, deg:a.deg, p:{ x:o.x, y:o.y }, before:lights });
      }
      const d = N.signed(o.ord - o.c);
      if(Math.abs(d) > 1e-9){ const m = ROT*DT; o.c = Math.abs(d) <= m ? o.ord : N.norm(o.c + Math.sign(d)*m); }
      Object.assign(o, N.step(o, o.c, o.s, DT)); Object.assign(g, N.step(g, g.c, g.s, DT));
      t += DT; push();
    }
    let mi = 0; frames.forEach((f, i) => { if(f.r < frames[mi].r) mi = i; });
    // 변침을 마친 뒤 상대선이 보는 내 현등
    if(events.length){
      const last = events[events.length-1];
      const f = frames.find(fr => fr.t >= last.t + (last.deg/30 + 0.25)/60) || frames[frames.length-1];   // 선회를 마친 직후
      last.after = N.lightsSeen(f.g, { x:f.o.x, y:f.o.y, heading:f.o.c });
      events[0].afterAll = last.after;
    }
    return { frames, events, cpa:frames[mi].r, cpaI:mi, total:alts.reduce((s, a) => s + a.deg, 0) };
  }

  /* ---------- 화면 ---------- */
  const wrap = W.h('div', { style:{ display:'flex', flexWrap:'wrap' } });
  ui.stage.append(wrap);
  const mk = () => {
    const col = W.h('div', { style:{ flex:'1 1 300px', minWidth:'0', borderLeft:'1px solid var(--rule)', display:'flex', flexDirection:'column' } });
    const head = W.h('div', { style:{ padding:'8px 12px', fontWeight:'700', fontSize:'14px', background:'var(--panel)', borderBottom:'1px solid var(--rule)' } });
    const svg = W.svg('svg', { viewBox:'0 0 400 360', role:'img', 'aria-label':'두 선박의 항적과 최근접거리' });
    const tags = W.h('div', { style:{ flex:'1', padding:'8px 12px 10px', background:'var(--panel)', fontSize:'13px', lineHeight:'1.55', borderTop:'1px solid var(--rule)' } });
    col.append(head, svg, tags); wrap.append(col);
    return { head, svg, tags };
  };
  const PA = mk(), PB = mk();
  PA.svg.parentNode.style.borderLeft = '0';

  const rowA = W.h('div', { style:{ display:'flex', flexWrap:'wrap', gap:'8px 14px', width:'100%', alignItems:'center' } });
  const rowB = W.h('div', { style:{ display:'flex', flexWrap:'wrap', gap:'8px 18px', width:'100%' } });
  ui.controls.append(rowA, rowB);
  const playBtn = W.ui.btn(rowA, '재생', () => togglePlay(), 'primary');
  W.ui.btn(rowA, '처음부터', () => { tNow = 0; loop.pause(); playBtn.textContent = '재생'; draw(); });
  W.ui.seg(rowA, Object.keys(A_OPTS).map(k => ({ value:k, label:A_OPTS[k].label })), aKey, v => { aKey = v; recompute(); }, 'A 예시');
  W.ui.range(rowB, { label:'B 변침 각도', min:5, max:90, step:5, value:bDeg, unit:'°', oninput:v => { bDeg = v; recompute(); } });
  W.ui.range(rowB, { label:'B 변침 시점(상대 거리)', min:0.5, max:6, step:0.5, value:bAt, fmt:v => v.toFixed(1)+' NM', oninput:v => { bAt = v; recompute(); } });
  const sT = W.ui.stat(ui.readout, '경과'), sA = W.ui.stat(ui.readout, 'A 최근접거리'), sB = W.ui.stat(ui.readout, 'B 최근접거리');

  let runA, runB, view, tNow = TEND;
  function recompute(){
    runA = simulate(A_OPTS[aKey].alts);
    runB = simulate([{ at:bAt, deg:bDeg }]);
    // 두 패널 같은 축척
    const pts = [...runA.frames, ...runB.frames].flatMap(f => [f.o, f.g]);
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    x0 = Math.max(x0, -4); x1 = Math.min(x1, 9); y0 = Math.max(y0, -1); y1 = Math.min(y1, 9);
    const scale = Math.min(360/(x1 - x0 + 0.8), 300/(y1 - y0 + 0.8));
    view = { cx:200, cy:198, scale, ox:(x0 + x1)/2, oy:(y0 + y1)/2 };
    draw();
  }

  const f1 = v => v.toFixed(1);
  const T = (x, y, s, o = {}) => `<text x="${f1(x)}" y="${f1(y)}" font-size="${o.size||12.5}" font-family="var(${o.mono?'--f-mono':'--f-body'})" fill="${o.fill||'var(--ink)'}" text-anchor="${o.anchor||'start'}"${o.weight?` font-weight="${o.weight}"`:''}>${s}</text>`;
  const sideName = l => !l ? '' : (l.stbd && l.port) ? '양현등' : l.stbd ? '녹등(우현)' : l.port ? '홍등(좌현)' : '선미등';

  function idxAt(run){ return Math.min(run.frames.length-1, Math.round(tNow/DT)); }

  function drawPanel(P, run, name){
    const S = p => N.toScreen(p, view);
    const k = idxAt(run), f = run.frames[k];
    let s = W.parts.arrowDefs(`${ID}${name}`, 'var(--ink-2)');
    s += `<defs><clipPath id="${ID}${name}c"><rect x="0" y="0" width="400" height="360"/></clipPath></defs><g clip-path="url(#${ID}${name}c)">`;
    // 북쪽 표시
    s += `<line x1="378" y1="40" x2="378" y2="14" stroke="var(--ink-2)" stroke-width="1.4" marker-end="url(#${ID}${name})"/>` + T(378, 54, 'N', { size:12, anchor:'middle', fill:'var(--ink-2)', weight:600 });
    const path = (key, from, to) => run.frames.slice(from, to + 1).filter((_, i, a) => i % 6 === 0 || i === a.length-1).map((fr, i) => { const q = S(fr[key]); return (i ? 'L' : 'M') + f1(q.x) + ' ' + f1(q.y); }).join(' ');
    // 예정 항적(흐리게) + 지나온 항적
    s += `<path d="${path('o', k, run.frames.length-1)}" fill="none" stroke="var(--giveway)" stroke-width="1.2" stroke-dasharray="3 4" opacity=".45"/>`;
    s += `<path d="${path('g', k, run.frames.length-1)}" fill="none" stroke="var(--standon)" stroke-width="1.2" stroke-dasharray="3 4" opacity=".45"/>`;
    s += `<path d="${path('o', 0, k)}" fill="none" stroke="var(--giveway)" stroke-width="2.2"/>`;
    s += `<path d="${path('g', 0, k)}" fill="none" stroke="var(--standon)" stroke-width="2.2"/>`;
    // 3분 간격 점
    for(let i = 36; i <= k; i += 36){ const a = S(run.frames[i].o), b = S(run.frames[i].g);
      s += `<circle cx="${f1(a.x)}" cy="${f1(a.y)}" r="2.6" fill="var(--giveway)"/><circle cx="${f1(b.x)}" cy="${f1(b.y)}" r="2.6" fill="var(--standon)"/>`; }
    // 변침 지점
    run.events.forEach((e, i) => {
      if(e.t > tNow + 1e-9) return;
      const q = S(e.p);
      s += `<circle cx="${f1(q.x)}" cy="${f1(q.y)}" r="5.5" fill="var(--panel)" stroke="var(--giveway)" stroke-width="2"/>`;
      if(i === 0) s += T(q.x - 10, q.y + 4, run.events.length > 1 ? `우현 ${e.deg}°×${run.events.length}` : `우현 ${e.deg}°`, { size:12, anchor:'end', fill:'var(--giveway)', weight:700 });
    });
    // CPA
    if(k >= run.cpaI){
      const fc = run.frames[run.cpaI], a = S(fc.o), b = S(fc.g);
      s += `<line x1="${f1(a.x)}" y1="${f1(a.y)}" x2="${f1(b.x)}" y2="${f1(b.y)}" stroke="var(--magenta)" stroke-width="2" stroke-dasharray="4 3"/>`;
      const mx = (a.x + b.x)/2, my = Math.min(a.y, b.y) - 12;
      const lbl = `CPA ${run.cpa.toFixed(2)} NM`, w = lbl.length*7.3 + 12;
      const lx = Math.max(4, Math.min(396 - w, mx - w/2));
      s += `<rect x="${f1(lx)}" y="${f1(my - 14)}" width="${f1(w)}" height="20" rx="4" fill="var(--panel)" stroke="var(--magenta)"/>` + T(lx + w/2, my + 1, lbl, { size:12.5, anchor:'middle', fill:'var(--magenta)', weight:700, mono:true });
    }
    // 선박
    const so = S(f.o), sg = S(f.g);
    s += `<g transform="translate(${f1(sg.x)} ${f1(sg.y)}) rotate(270)">${W.parts.ship({ type:'power', len:24, role:'standon' })}</g>`;
    s += `<g transform="translate(${f1(so.x)} ${f1(so.y)}) rotate(${f1(f.o.c)})">${W.parts.ship({ type:'power', len:24, role:'giveway' })}</g>`;
    const rightEdge = so.x > 340;
    s += T(rightEdge ? so.x - 14 : so.x + 14, rightEdge ? so.y - 16 : so.y + 18, '내 배', { size:12.5, weight:700, fill:'var(--giveway)', anchor: rightEdge ? 'end' : 'start' });
    s += T(Math.max(24, Math.min(376, sg.x)), sg.y - 16, '상대선', { size:12.5, anchor:'middle', weight:700, fill:'var(--standon)' });
    s += `</g>`;
    s += `<rect x="0" y="0" width="150" height="24" fill="var(--panel)" opacity=".85"/>` + T(8, 17, `${(f.t*60).toFixed(1)}분 · ${f.r.toFixed(2)} NM`, { size:12.5, mono:true });
    P.svg.innerHTML = s;
  }

  function judge(run){
    const e0 = run.events[0];
    const maxStep = Math.max(0, ...run.events.map(e => e.deg));
    const small = run.events.length > 1 && maxStep < 15;
    const res = [];
    // 8(b) 쉽게 알아챔
    let lv;
    if(!e0) lv = ['bad', '변침하지 않음'];
    else if(small) lv = ['bad', `소폭 연속 변경(${run.events.map(e => e.deg + '°').join('+')}) — 알아채기 어려움`];
    else if(maxStep >= 30) lv = ['ok', `${maxStep}° 한 번에 — 뚜렷함`];
    else if(maxStep >= 15) lv = ['mid', `${maxStep}° — 알아채기 애매`];
    else lv = ['bad', `${maxStep}° — 너무 작음`];
    res.push(['적극적·쉽게 알아챔 (b)', ...lv]);
    // 상대선이 보는 내 현등 변화
    if(e0 && e0.afterAll){
      const b = sideName(e0.before), a = sideName(e0.afterAll);
      res.push(['상대선이 보는 내 등화', b !== a ? 'ok' : 'bad', b !== a ? `${b} → ${a} (눈에 띔)` : `${b} 그대로 (변화 없음)`]);
    }
    // 8(a) 충분한 시간
    if(e0){ const m = e0.tcpa*60; res.push(['충분한 시간 (a)', m >= 10 ? 'ok' : m >= 6 ? 'mid' : 'bad', `변침 때 TCPA ${m.toFixed(1)}분 · 거리 ${e0.r.toFixed(1)} NM`]); }
    // 8(d) 안전한 거리
    res.push(['안전한 거리 (d)', run.cpa >= 1 ? 'ok' : run.cpa >= 0.5 ? 'mid' : 'bad', `CPA ${run.cpa.toFixed(2)} NM${run.cpa < 0.5 ? ' — 근접상태' : ''}`]);
    return res;
  }
  const COL = { ok:'var(--ok)', mid:'var(--magenta)', bad:'var(--bad)' }, WORD = { ok:'충족', mid:'애매', bad:'부족' };
  function tagsHtml(res){
    return res.map(([k, lv, txt]) => `<div style="display:flex;gap:8px;align-items:baseline"><b style="flex:none;min-width:34px;color:${COL[lv]}">${WORD[lv]}</b><span><span style="color:var(--ink-3)">${k}</span> · ${txt}</span></div>`).join('');
  }

  function draw(){
    drawPanel(PA, runA, 'a'); drawPanel(PB, runB, 'b');
    PA.head.innerHTML = `<span style="color:var(--ink-3)">A</span> 작고 늦은 변침 · ${A_OPTS[aKey].label}`;
    PB.head.innerHTML = `<span style="color:var(--ink-3)">B</span> 실험 · ${bDeg}°를 ${bAt.toFixed(1)} NM에서`;
    const jA = judge(runA), jB = judge(runB);
    PA.tags.innerHTML = tagsHtml(jA); PB.tags.innerHTML = tagsHtml(jB);
    sT((tNow*60).toFixed(1) + ' 분');
    const done = tNow >= TEND - 1e-9;
    sA(idxAt(runA) >= runA.cpaI ? N.fmtNM(runA.cpa) : '진행 중'); sB(idxAt(runB) >= runB.cpaI ? N.fmtNM(runB.cpa) : '진행 중');
    const badB = jB.filter(j => j[1] !== 'ok').map(j => j[0].replace(/ \(.\)$/, ''));
    if(!badB.length) ui.setVerdict(`B: 적극적으로, 충분한 시간을 두고 크게 — CPA ${runB.cpa.toFixed(2)} NM (A는 ${runA.cpa.toFixed(2)} NM). 제8조(a)(b)(d) 충족`, true);
    else ui.setVerdict(`B 부족: ${badB.join(' · ')} — CPA ${runB.cpa.toFixed(2)} NM. 더 일찍, 더 크게 (제8조(a)(b)(d))`, false);
    if(done && loop && loop.playing){ loop.pause(); playBtn.textContent = '다시 재생'; }
  }

  function togglePlay(){
    if(loop.playing){ loop.pause(); playBtn.textContent = '재생'; return; }
    if(tNow >= TEND - 1e-9) tNow = 0;
    loop.play(); playBtn.textContent = '일시정지';
  }
  const loop = W.ui.loop(ui.stage, (dt) => { tNow = Math.min(TEND, tNow + dt*2/60); draw(); }, false);
  recompute();
});

}catch(e){console.error("[load] src/sims/avoid-compare.js", e)}
</script>
<script>/* src/sims/bearing-sim.js */
try{
/* 제7조 충돌의 위험 — 컴퍼스 방위 변화로 위험 판단하기 (S1) */
W.sim('bearing-sim', (el) => {
  const N = W.nav, ID = W.ui.uid('bs');
  const DT = 5/3600;              // 적분 간격 5초 (h)
  const ROT = 30*60;              // 선회율 30°/분 (°/h)
  const VEC = 0.1;                // 속력 벡터 길이 = 6분 동안 가는 거리
  const STEP6 = 0.1;              // 방위 변화 판단 구간 6분 (h)
  const APPR = 3;                 // 6분간 3° 미만 = "뚜렷한 변화 없음" (이 시뮬레이터의 가정)
  const HIT = 0.05;               // 0.05 NM(약 90 m) 이내 = 충돌로 표시
  const TYPES = {
    normal: { label:'일반선', pts:[0] },
    big:    { label:'거대선 400 m', pts:[-0.108,-0.054,0,0.054,0.108] },
    tow:    { label:'예인선열', pts:[0,-0.05,-0.1,-0.15,-0.2,-0.25,-0.3,-0.33] }
  };

  /* ---------- 틀 ---------- */
  const ui = W.ui.box(el, { title:'방위 변화로 충돌의 위험 판단하기', kind:'해보기',
    caption:'상대선을 끌어 위치를, 화살표 끝(○)을 끌어 침로·속력을 바꾼다. 재생 중에 <b>내 침로</b>를 바꾸면 그 자리에서 변침한다(선회율 30°/분). '+
      '판단 기준은 <b>상대방위가 아니라 컴퍼스 방위</b>다. 이 시뮬레이터는 "6분 동안 3° 미만"(CPA가 가까우면 더 짧은 구간에 비례)을 뚜렷한 변화가 없는 것으로 본다 — 조문에 숫자 기준은 없다. '+
      '의심스러우면 위험이 있는 것으로 본다(제7조(a)).' });
  const wrap = W.h('div', { style:{ display:'flex', flexWrap:'wrap', gap:'0', alignItems:'stretch' } });
  const p1 = W.h('div', { style:{ flex:'1 1 320px', minWidth:'0' } });
  const p2 = W.h('div', { style:{ flex:'1 1 320px', minWidth:'0', background:'var(--panel)', borderLeft:'1px solid var(--rule)' } });
  wrap.append(p1, p2); ui.stage.append(wrap);
  const plan = W.svg('svg', { viewBox:'0 0 420 480', role:'img', 'aria-label':'내 배와 상대선의 평면도. 컴퍼스 방위선과 상대방위 표시', style:'touch-action:pan-y' });
  const chart = W.svg('svg', { viewBox:'0 0 420 360', role:'img', 'aria-label':'시간에 따른 컴퍼스 방위와 상대방위, 거리 그래프' });
  p1.append(plan); p2.append(chart);
  p2.append(W.h('div', { style:{ padding:'4px 14px 12px', fontSize:'13px', lineHeight:'1.6', color:'var(--ink-2)' }, html:
    '<b style="color:var(--ink)">판단 순서 (제7조)</b><br>'+
    '① 컴퍼스 방위가 뚜렷하게 변하지 않고 거리가 줄면 → <b style="color:var(--bad)">위험 있음</b> (d)(i)<br>'+
    '② 방위가 변해도 거대선·예인선열·근거리 접근이면 → <b style="color:var(--bad)">위험할 수 있음</b> (d)(ii)<br>'+
    '③ 의심스러우면 → 위험이 있는 것으로 본다 (a)<br>'+
    '<span style="color:var(--ink-3)">점선 = 지금 침로·속력을 유지할 때의 예상</span>' }));

  const rowP = W.h('div', { style:{ display:'flex', flexWrap:'wrap', gap:'6px', width:'100%' } });
  const rowA = W.h('div', { style:{ display:'flex', flexWrap:'wrap', gap:'8px', width:'100%', alignItems:'center' } });
  const rowT = W.h('div', { style:{ display:'flex', flexWrap:'wrap', gap:'8px 18px', width:'100%' } });
  const rowO = W.h('div', { style:{ display:'flex', flexWrap:'wrap', gap:'8px 18px', width:'100%' } });
  ui.controls.append(rowP, rowA, rowT, rowO);

  /* ---------- 상태 ---------- */
  let setup, run, scale = 30, xMax = 30, presetName = '';

  const u = b => ({ x:Math.sin(N.rad(b)), y:Math.cos(N.rad(b)) });
  /** 내 배(속력벡터 vo)에 대해 방위 b 에 있는 상대선이 속력 st 로 충돌 코스가 되는 침로 */
  function collisionCourse(b, oc, os, st){
    const vo = N.vel(oc, os), e = u(b), d = vo.x*e.x + vo.y*e.y;
    const disc = d*d - (os*os - st*st);
    if(disc < 0) return null;
    const k = d + Math.sqrt(disc);
    const vt = { x:vo.x - k*e.x, y:vo.y - k*e.y };
    return N.norm(N.deg(Math.atan2(vt.x, vt.y)));
  }

  function makeRun(s){
    const e = u(s.brg);
    const r = { t:0, own:{ x:0, y:0, c:s.oc, s:s.os, ord:s.oc }, tgt:{ x:e.x*s.rng, y:e.y*s.rng, c:s.tc, s:s.ts },
      hist:[], script:(s.script||[]).map(o => ({...o})), hit:false, done:false, cb0:s.brg };
    record(r); return r;
  }
  function stepRun(r){
    const o = r.own;
    const diff = N.signed(o.ord - o.c);
    if(Math.abs(diff) > 1e-9){ const m = ROT*DT; o.c = Math.abs(diff) <= m ? o.ord : N.norm(o.c + Math.sign(diff)*m); }
    Object.assign(o, N.step(o, o.c, o.s, DT));
    Object.assign(r.tgt, N.step(r.tgt, r.tgt.c, r.tgt.s, DT));
    r.t += DT;
    for(const sc of r.script) if(!sc.done && r.t >= sc.t - 1e-9){ sc.done = true; o.ord = sc.c; }
  }
  function unwrapNear(v, ref){ while(v - ref > 180) v -= 360; while(v - ref < -180) v += 360; return v; }
  function record(r){
    const cb = N.bearing(r.own, r.tgt), rb = N.rel(cb, r.own.c), rg = N.dist(r.own, r.tgt);
    const last = r.hist[r.hist.length-1];
    const cbu = last ? unwrapNear(cb, last.cb) : cb;
    const rbu = last ? unwrapNear(rb, last.rb) : unwrapNear(rb, cbu);
    r.hist.push({ t:r.t, cb:cbu, rb:rbu, r:rg, o:{ x:r.own.x, y:r.own.y }, g:{ x:r.tgt.x, y:r.tgt.y } });
  }
  const tgtPoints = (tgt, type) => TYPES[type].pts.map(d => ({ x: tgt.x + d*Math.sin(N.rad(tgt.c)), y: tgt.y + d*Math.cos(N.rad(tgt.c)) }));
  function analyse(r){
    const o = r.own, g = r.tgt;
    const c = N.cpa(o, o.c, o.s, g, g.c, g.s);
    let hullCpa = Infinity, hullRange = Infinity;
    for(const p of tgtPoints(g, setup.type)){
      const cc = N.cpa(o, o.c, o.s, p, g.c, g.s);
      hullCpa = Math.min(hullCpa, cc.tcpa > 0 ? cc.cpa : cc.range); hullRange = Math.min(hullRange, cc.range);
    }
    const cbNow = N.bearing(o, g);
    // 앞으로 6분(CPA가 가까우면 TCPA의 절반) 동안의 컴퍼스 방위 변화 — 현재 침로·속력 유지 가정
    const win = c.tcpa > 0 ? Math.min(STEP6, c.tcpa*0.5) : STEP6;
    const o6 = N.step(o, o.c, o.s, win), g6 = N.step(g, g.c, g.s, win);
    const d6 = N.signed(N.bearing(o6, g6) - cbNow), winMin = Math.round(win*120)/2, appr = APPR*win/STEP6;
    // 지난 6분 동안 관측된 변화
    let obsCb = null, obsRb = null;
    if(r.t >= STEP6 - 1e-9){
      const h0 = r.hist.find(h => h.t >= r.t - STEP6 - 1e-9), h1 = r.hist[r.hist.length-1];
      obsCb = h1.cb - h0.cb; obsRb = h1.rb - h0.rb;
    }
    return { ...c, hullCpa, hullRange, cb:cbNow, rb:N.rel(cbNow, o.c), d6, winMin, appr, obsCb, obsRb };
  }

  /* ---------- 프리셋 ---------- */
  function presetCollision(){
    const s = { brg:50, rng:6, oc:0, os:12, ts:14, type:'normal' };
    s.tc = collisionCourse(s.brg, s.oc, s.os, s.ts); return s;
  }
  const PRESETS = [
    { id:'col',  label:'방위 불변 접근(충돌 코스)', make: presetCollision },
    { id:'safe', label:'방위 변화 있음(안전)', make: () => ({ brg:50, rng:6, oc:0, os:12, tc:225, ts:14, type:'normal' }) },
    { id:'big',  label:'거대선·근거리 — 방위가 변해도 위험', make: () => ({ brg:46, rng:3.5, oc:0, os:12, tc:270, ts:16, type:'big' }) },
    { id:'trap', label:'내 배 변침 시 상대방위만 변함(함정)', make: presetTrap }
  ];
  /* 함정: 내 배 270° → 4분 뒤 000°로 우현 90° 변침(선회율 30°/분).
     변침 전에는 정확히 충돌 코스, 변침이 끝난 뒤에도 충돌 코스가 되는 처음 방위를 찾는다(상대 접근속력 10 kn 고정) */
  function presetTrap(){
    const base = { rng:6, oc:270, os:10, type:'normal', script:[{ t:4/60, c:0 }], xMax:20 };
    const K = 10, vo = N.vel(base.oc, base.os);
    const mk = B => { const e = u(B), vt = { x:vo.x - K*e.x, y:vo.y - K*e.y };
      return { ...base, brg:B, tc:N.norm(N.deg(Math.atan2(vt.x, vt.y))), ts:Math.hypot(vt.x, vt.y) }; };
    const miss = B => {
      const r = makeRun(mk(B));
      while(r.t < 8/60) stepRun(r);
      const o = r.own, g = r.tgt, v1 = N.vel(o.c, o.s), v2 = N.vel(g.c, g.s);
      const dx = g.x-o.x, dy = g.y-o.y, vx = v2.x-v1.x, vy = v2.y-v1.y;
      return (dx*vy - dy*vx)/Math.hypot(vx, vy);
    };
    let a = 38, b = 52, fa = miss(a);
    if(Math.sign(fa) === Math.sign(miss(b))) return mk(45);
    for(let i = 0; i < 40; i++){ const m = (a+b)/2, fm = miss(m); if(Math.sign(fm) === Math.sign(fa)){ a = m; fa = fm; } else b = m; }
    return mk((a+b)/2);
  }

  /* ---------- 컨트롤 ---------- */
  const presetBtns = PRESETS.map(p => W.ui.btn(rowP, p.label, () => applyPreset(p.id)));
  const playBtn = W.ui.btn(rowA, '재생', () => togglePlay(), 'primary');
  W.ui.btn(rowA, '처음부터', () => { reset(); loop.pause(); playBtn.textContent = '재생'; draw(); });
  const typeSeg = W.ui.seg(rowA, Object.keys(TYPES).map(k => ({ value:k, label:TYPES[k].label })), 'normal', v => { setup.type = v; markCustom(); reset(); draw(); }, '상대선');
  const fmtD = v => String(Math.round(v)%360).padStart(3,'0') + '°';
  const sB  = W.ui.range(rowT, { label:'상대선 방위', min:0, max:359, step:1, value:50, fmt:fmtD, oninput:v => { setup.brg = v; markCustom(); reset(); draw(); } });
  const sR  = W.ui.range(rowT, { label:'거리', min:1, max:10, step:0.1, value:6, fmt:v => v.toFixed(1)+' NM', oninput:v => { setup.rng = v; markCustom(); reset(); draw(); } });
  const sTC = W.ui.range(rowT, { label:'상대 침로', min:0, max:359, step:1, value:0, fmt:fmtD, oninput:v => { setup.tc = v; markCustom(); reset(); draw(); } });
  const sTS = W.ui.range(rowT, { label:'상대 속력', min:0, max:30, step:0.5, value:14, unit:' kn', oninput:v => { setup.ts = v; markCustom(); reset(); draw(); } });
  const sOC = W.ui.range(rowO, { label:'내 침로', min:0, max:359, step:1, value:0, fmt:fmtD, oninput:v => ownCourse(v) });
  const sOS = W.ui.range(rowO, { label:'내 속력', min:0, max:25, step:0.5, value:12, unit:' kn', oninput:v => ownSpeed(v) });

  const st = {
    t: W.ui.stat(ui.readout, '경과'), cb: W.ui.stat(ui.readout, '컴퍼스 방위'), rb: W.ui.stat(ui.readout, '상대방위'),
    r: W.ui.stat(ui.readout, '거리'), cpa: W.ui.stat(ui.readout, 'CPA'), tcpa: W.ui.stat(ui.readout, 'TCPA'), d6: W.ui.stat(ui.readout, '앞으로의 방위 변화')
  };

  function syncSliders(){
    sB.set(Math.round(setup.brg)%360); sR.set(+setup.rng.toFixed(1)); sTC.set(Math.round(setup.tc)%360); sTS.set(Math.round(setup.ts*2)/2);
    sOC.set(Math.round(run ? run.own.ord : setup.oc)%360); sOS.set(setup.os); typeSeg.set(setup.type);
  }
  function markCustom(){ presetName = ''; presetBtns.forEach(b => b.classList.remove('on')); delete setup.script; delete setup.xMax; }
  function applyPreset(id){
    const p = PRESETS.find(q => q.id === id);
    setup = p.make(); presetName = id;
    presetBtns.forEach((b, i) => b.classList.toggle('on', PRESETS[i].id === id));
    reset(); syncSliders(); loop.pause(); playBtn.textContent = '재생'; draw();
  }
  function reset(){
    run = makeRun(setup);
    const c = N.cpa(run.own, run.own.c, run.own.s, run.tgt, run.tgt.c, run.tgt.s);
    scale = 174 / Math.max(setup.rng*1.06, 2.2);
    const tc = c.tcpa > 0 ? c.tcpa*60 : 15;
    xMax = Math.min(60, Math.max(10, Math.ceil((tc*1.15 + 3)/5)*5));
    if(setup.xMax) xMax = setup.xMax;
  }
  function ownCourse(v){
    if(run.t > 0){ run.own.ord = v; draw(); return; }
    setup.oc = v; markCustom(); reset(); draw();
  }
  function ownSpeed(v){
    setup.os = v;
    if(run.t > 0){ run.own.s = v; draw(); return; }
    markCustom(); reset(); draw();
  }
  function togglePlay(){
    if(loop.playing){ loop.pause(); playBtn.textContent = '재생'; return; }
    if(run.done || run.hit) reset();
    loop.play(); playBtn.textContent = '일시정지';
  }

  /* ---------- 애니메이션 ---------- */
  let acc = 0;
  const SIM_PER_SEC = 60;           // 실제 1초 = 1분
  const loop = W.ui.loop(ui.stage, (dt) => {
    if(run.done || run.hit) return;
    acc += dt*SIM_PER_SEC/3600;
    let n = 0;
    while(acc >= DT && n < 200){
      acc -= DT; n++; stepRun(run); record(run);
      if(run.script.some(s => s.done && !s.shown)){ run.script.forEach(s => { if(s.done) s.shown = true; }); sOC.set(Math.round(run.own.ord)%360); }
      const pts = tgtPoints(run.tgt, setup.type);
      if(Math.min(...pts.map(p => N.dist(run.own, p))) < HIT){ run.hit = true; break; }
      const a = analyse(run);
      if((a.tcpa < -4/60 && a.range > Math.min(setup.rng, 3)) || run.t > 2){ run.done = true; break; }
    }
    if(run.t*60 > xMax) xMax = Math.min(120, Math.ceil(run.t*60/5)*5 + 5);
    if(run.done || run.hit){ loop.pause(); playBtn.textContent = '다시 재생'; }
    draw();
  }, false);

  /* ---------- 드래그 ---------- */
  let drag = null;
  const svgPt = e => { const p = plan.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(plan.getScreenCTM().inverse()); };
  const toWorld = p => ({ x: run.own.x + (p.x - 210)/scale, y: run.own.y - (p.y - 252)/scale });
  plan.addEventListener('pointerdown', e => {
    const h = e.target.closest && e.target.closest('[data-drag]');
    if(!h) return;
    drag = h.getAttribute('data-drag'); plan.setPointerCapture(e.pointerId); e.preventDefault();
    if(drag !== 'own') { loop.pause(); playBtn.textContent = '재생'; }
  });
  plan.addEventListener('pointermove', e => {
    if(!drag) return;
    const w = toWorld(svgPt(e));
    if(drag === 'tgt'){
      const rel = { x:w.x - run.own.x, y:w.y - run.own.y };
      setup.brg = Math.round(N.norm(N.deg(Math.atan2(rel.x, rel.y))));
      setup.rng = Math.round(Math.min(10, Math.max(0.5, Math.hypot(rel.x, rel.y)))*10)/10;
      setup.oc = run.t > 0 ? run.own.ord : setup.oc;
      markCustom(); reset(); syncSliders();
    } else if(drag === 'tvec'){
      const d = { x:w.x - run.tgt.x, y:w.y - run.tgt.y };
      setup.tc = Math.round(N.norm(N.deg(Math.atan2(d.x, d.y))));
      setup.ts = Math.round(Math.min(30, Math.hypot(d.x, d.y)/VEC)*2)/2;
      if(run.t > 0){ run.tgt.c = setup.tc; run.tgt.s = setup.ts; } else { markCustom(); reset(); }
      syncSliders();
    } else if(drag === 'own'){
      const d = { x:w.x - run.own.x, y:w.y - run.own.y };
      const c = Math.round(N.norm(N.deg(Math.atan2(d.x, d.y))));
      const s = Math.round(Math.min(25, Math.hypot(d.x, d.y)/VEC)*2)/2;
      setup.os = s;
      if(run.t > 0){ run.own.ord = c; run.own.s = s; } else { setup.oc = c; markCustom(); reset(); }
      syncSliders();
    }
    draw();
  });
  const endDrag = () => { drag = null; };
  plan.addEventListener('pointerup', endDrag); plan.addEventListener('pointercancel', endDrag);

  /* ---------- 그리기 ---------- */
  const f1 = v => v.toFixed(1);
  const T = (x, y, s, o = {}) => `<text x="${f1(x)}" y="${f1(y)}" font-size="${o.size||12}" font-family="var(${o.mono?'--f-mono':'--f-body'})" fill="${o.fill||'var(--ink)'}" text-anchor="${o.anchor||'start'}"${o.weight?` font-weight="${o.weight}"`:''}>${s}</text>`;
  const tag = (x, y, s, color, anchor = 'middle') => {
    const w = s.length*7.4 + 10, x0 = anchor === 'middle' ? x - w/2 : anchor === 'end' ? x - w : x;
    return `<rect x="${f1(x0)}" y="${f1(y-13)}" width="${f1(w)}" height="18" rx="4" fill="var(--panel)" stroke="${color}" stroke-width="1.2"/>`+
      T(x0 + w/2, y, s, { anchor:'middle', mono:true, fill:color, weight:600 });
  };

  function draw(){
    const a = analyse(run);
    drawPlan(a); drawChart(a); readout(a); verdict(a);
  }

  function drawPlan(a){
    const cx = 210, cy = 252, R = 192;
    const o = run.own, g = run.tgt;
    const S = p => ({ x: cx + (p.x - o.x)*scale, y: cy - (p.y - o.y)*scale });
    const pol = (b, r) => ({ x: cx + Math.sin(N.rad(b))*r, y: cy - Math.cos(N.rad(b))*r });
    let s = W.parts.arrowDefs(ID+'-ao', 'var(--ink)') + W.parts.arrowDefs(ID+'-at', 'var(--ink-2)');
    s += `<defs><clipPath id="${ID}-clip"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath></defs>`;
    // 거리환
    const ringStep = setup.rng > 6 ? 2 : 1;
    s += `<g clip-path="url(#${ID}-clip)">`;
    for(let k = ringStep; k*scale < R; k += ringStep){
      s += `<circle cx="${cx}" cy="${cy}" r="${f1(k*scale)}" fill="none" stroke="var(--ink-3)" stroke-opacity=".35" stroke-width="1"/>`;
      const lp = pol(o.c + 135, k*scale);
      if(k*scale < R - 26 && k*scale > 44) s += T(lp.x, lp.y + 4, k+' NM', { size:11, fill:'var(--ink-3)', anchor:'middle' });
    }
    s += trackSvg(S) + `</g>`;
    // 처음 방위 EBL
    const e1 = pol(run.cb0, R - 2);
    s += `<line x1="${cx}" y1="${cy}" x2="${f1(e1.x)}" y2="${f1(e1.y)}" stroke="var(--ink-2)" stroke-width="1.2" stroke-dasharray="6 5"/>`;
    // 나침 눈금
    s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--ink-3)" stroke-width="1"/>`;
    for(let b = 0; b < 360; b += 10){
      const big = b % 30 === 0, p1 = pol(b, R), p2 = pol(b, R - (big ? 9 : 5));
      s += `<line x1="${f1(p1.x)}" y1="${f1(p1.y)}" x2="${f1(p2.x)}" y2="${f1(p2.y)}" stroke="var(--ink-3)" stroke-width="${big?1.3:.8}"/>`;
      if(big && b % 90 !== 0 && Math.abs(N.signed(b - a.cb)) > 12){ const q = pol(b, R - 20); s += T(q.x, q.y + 4, String(b).padStart(3,'0'), { size:11, mono:true, anchor:'middle', fill:'var(--ink-3)' }); }
    }
    s += T(cx, cy - R + 24, 'N 000', { size:12, anchor:'middle', fill:'var(--ink-2)', weight:600, mono:true });
    // 선수미선 (내 배 선수 방향)
    const hd = pol(o.c, R - 2);
    s += `<line x1="${cx}" y1="${cy}" x2="${f1(hd.x)}" y2="${f1(hd.y)}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="2 4" opacity=".7"/>`;
    // 상대방위 호
    const rbAng = N.signed(a.cb - o.c), ar = 38;
    if(Math.abs(rbAng) > 1){
      const pA = pol(o.c, ar), pB = pol(a.cb, ar), large = Math.abs(rbAng) > 180 ? 1 : 0, sweep = rbAng > 0 ? 1 : 0;
      s += `<path d="M${f1(pA.x)} ${f1(pA.y)} A${ar} ${ar} 0 ${large} ${sweep} ${f1(pB.x)} ${f1(pB.y)}" fill="none" stroke="var(--ink-2)" stroke-width="1.6"/>`;
    }
    // 예측 상대운동선 → CPA
    if(a.tcpa > 0 && !run.hit){
      const v1 = N.vel(o.c, o.s), v2 = N.vel(g.c, g.s);
      const relCpa = { x: g.x + (v2.x - v1.x)*a.tcpa, y: g.y + (v2.y - v1.y)*a.tcpa };   // 내 배 기준 CPA 위치
      const A = S(g), B = S(relCpa);
      s += `<line x1="${f1(A.x)}" y1="${f1(A.y)}" x2="${f1(B.x)}" y2="${f1(B.y)}" stroke="var(--magenta)" stroke-width="1.4" stroke-dasharray="4 4" clip-path="url(#${ID}-clip)"/>`;
      s += `<circle cx="${f1(B.x)}" cy="${f1(B.y)}" r="4" fill="none" stroke="var(--magenta)" stroke-width="1.6"/>`;
      if(a.cpa > 0.15) s += `<line x1="${cx}" y1="${cy}" x2="${f1(B.x)}" y2="${f1(B.y)}" stroke="var(--magenta)" stroke-width="1" opacity=".7"/>`;
      if(a.cpa*scale > 16) s += T(B.x + 7, B.y + 14, 'CPA', { size:11, fill:'var(--magenta)', weight:600 });
    }
    // 레이더 잔상 (내 배 기준 상대위치, 1분마다)
    let dots = '';
    for(let i = 0; i < run.hist.length; i += 12){
      const h = run.hist[i]; const p = pol(N.norm(h.cb), h.r*scale);
      dots += `<circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="2.4" fill="var(--link)" opacity=".55"/>`;
    }
    s += `<g clip-path="url(#${ID}-clip)">${dots}</g>`;
    // 현재 컴퍼스 방위선
    const bl = pol(a.cb, R - 2);
    s += `<line x1="${cx}" y1="${cy}" x2="${f1(bl.x)}" y2="${f1(bl.y)}" stroke="var(--link)" stroke-width="2"/>`;
    // 상대선
    const gp = S(g), inView = Math.hypot(gp.x - cx, gp.y - cy) < R - 6;
    const len = Math.max(28, setup.type === 'big' ? 0.216*scale : 28);
    if(inView){
      const tv = S(N.step(g, g.c, g.s, VEC));
      let shipSvg;
      if(setup.type === 'tow'){
        const L = 0.3*scale;
        shipSvg = W.parts.ship({ type:'power', len:20 }) +
          `<line x1="0" y1="8" x2="0" y2="${f1(L)}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="3 2"/>` +
          `<rect x="-6" y="${f1(L)}" width="12" height="${f1(Math.max(12, 0.05*scale))}" rx="2" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.4"/>`;
      } else shipSvg = W.parts.ship({ type: setup.type === 'big' ? 'big' : 'power', len });
      s += `<line x1="${f1(gp.x)}" y1="${f1(gp.y)}" x2="${f1(tv.x)}" y2="${f1(tv.y)}" stroke="var(--ink-2)" stroke-width="1.6" marker-end="url(#${ID}-at)"/>`;
      s += `<g data-drag="tgt" style="cursor:grab;touch-action:none" transform="translate(${f1(gp.x)} ${f1(gp.y)}) rotate(${f1(g.c)})"><circle r="${Math.max(18, len*.55)}" fill="transparent"/>${shipSvg}</g>`;
      s += `<circle data-drag="tvec" style="cursor:grab;touch-action:none" cx="${f1(tv.x)}" cy="${f1(tv.y)}" r="7" fill="var(--panel)" stroke="var(--ink-2)" stroke-width="1.6"/>`;
      s += `<circle data-drag="tvec" style="cursor:grab;touch-action:none" cx="${f1(tv.x)}" cy="${f1(tv.y)}" r="16" fill="transparent"/>`;
      const lx = gp.x + (gp.x > cx ? -14 : 14), ly = gp.y + (gp.y < cy ? -18 : 28);
      s += T(lx, ly, '상대선', { size:12.5, anchor: gp.x > cx ? 'end' : 'start', weight:600 });
    }
    // 방위 라벨 (링 바깥 쪽 안)
    const rT = a.range*scale, lb = pol(a.cb, rT < R - 80 ? R - 30 : Math.max(70, rT - 48));
    s += tag(lb.x, lb.y + 4, N.fmtDeg(a.cb), 'var(--link)');
    // 내 배
    const ov = S(N.step(o, o.c, o.s, VEC));
    s += `<line x1="${cx}" y1="${cy}" x2="${f1(ov.x)}" y2="${f1(ov.y)}" stroke="var(--ink)" stroke-width="1.8" marker-end="url(#${ID}-ao)"/>`;
    s += `<g transform="translate(${cx} ${cy}) rotate(${f1(o.c)})">${W.parts.ship({ type:'power', len:22, fill:'var(--link)', stroke:'var(--ink)' })}</g>`;
    s += `<circle data-drag="own" style="cursor:grab;touch-action:none" cx="${f1(ov.x)}" cy="${f1(ov.y)}" r="6" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.6"/>`;
    s += `<circle data-drag="own" style="cursor:grab;touch-action:none" cx="${f1(ov.x)}" cy="${f1(ov.y)}" r="15" fill="transparent"/>`;
    const ol = pol(o.c + 180, 26);
    s += T(ol.x, ol.y + 5, '내 배', { size:12.5, anchor:'middle', weight:600 });
    if(run.hit){
      s += `<circle cx="${cx}" cy="${cy}" r="30" fill="none" stroke="var(--bad)" stroke-width="3"/>`;
      s += tag(cx, cy + 56, '충돌', 'var(--bad)');
    }
    // 위쪽 숫자판
    s += `<rect x="0" y="0" width="420" height="46" fill="var(--panel)" opacity=".9"/><line x1="0" y1="46" x2="420" y2="46" stroke="var(--rule)"/>`;
    s += T(12, 17, '컴퍼스 방위', { size:11.5, fill:'var(--ink-2)' }) + T(12, 38, N.fmtDeg(a.cb), { size:17, mono:true, weight:700, fill:'var(--link)' });
    s += `<path d="M150 17 A10 10 0 0 1 160 7" fill="none" stroke="var(--ink-2)" stroke-width="1.6"/>` + T(164, 17, '상대방위', { size:11.5, fill:'var(--ink-2)' }) + T(150, 38, N.fmtDeg(a.rb), { size:17, mono:true, weight:700, fill:'var(--ink-2)' });
    s += T(286, 17, '내 침로(선수)', { size:11.5, fill:'var(--ink-2)' }) + T(286, 38, N.fmtDeg(o.c), { size:17, mono:true, weight:700 });
    // 범례
    const ly0 = 470;
    s += `<line x1="8" y1="${ly0-4}" x2="26" y2="${ly0-4}" stroke="var(--link)" stroke-width="2"/>` + T(30, ly0, '컴퍼스 방위선', { size:11, fill:'var(--ink-2)' }) +
      `<line x1="112" y1="${ly0-4}" x2="130" y2="${ly0-4}" stroke="var(--ink-2)" stroke-width="1.2" stroke-dasharray="6 5"/>` + T(134, ly0, '처음 방위', { size:11, fill:'var(--ink-2)' }) +
      `<circle cx="204" cy="${ly0-4}" r="2.6" fill="var(--link)" opacity=".6"/>` + T(211, ly0, '레이더 잔상(1분)', { size:11, fill:'var(--ink-2)' }) +
      `<line x1="310" y1="${ly0-4}" x2="328" y2="${ly0-4}" stroke="var(--magenta)" stroke-width="1.4" stroke-dasharray="4 4"/>` + T(332, ly0, '예상 접근선', { size:11, fill:'var(--ink-2)' });
    plan.innerHTML = s;
  }
  // 진운동 항적 (내 배를 화면 중심에 고정)
  function trackSvg(S){
    if(run.hist.length < 2) return '';
    const step = Math.max(1, Math.round(run.hist.length/200));
    const pts = run.hist.filter((_, i) => i % step === 0 || i === run.hist.length-1);
    const line = key => pts.map((h, i) => { const q = S(h[key]); return (i ? 'L' : 'M') + f1(q.x) + ' ' + f1(q.y); }).join(' ');
    return `<path d="${line('o')}" fill="none" stroke="var(--ink)" stroke-opacity=".45" stroke-width="1.4"/>` +
           `<path d="${line('g')}" fill="none" stroke="var(--ink-2)" stroke-opacity=".5" stroke-width="1.4"/>`;
  }

  function relSpeed(){ const v1 = N.vel(run.own.c, run.own.s), v2 = N.vel(run.tgt.c, run.tgt.s); return Math.hypot(v2.x - v1.x, v2.y - v1.y); }
  function niceStep(span, n){ for(const k of [1,2,5,10,15,30,45,90,180]) if(span/k <= n) return k; return 180; }
  function drawChart(a){
    const L = 54, R = 408, T1 = 40, B1 = 196, T2 = 248, B2 = 318;
    const X = m => L + (m/xMax)*(R - L);
    let s = T(12, 20, '방위 변화 그래프', { size:13.5, weight:600 });
    s += `<line x1="196" y1="16" x2="214" y2="16" stroke="var(--link)" stroke-width="2.6"/>` + T(218, 20, '컴퍼스', { size:12, fill:'var(--ink-2)' });
    s += `<line x1="276" y1="16" x2="294" y2="16" stroke="var(--ink-3)" stroke-width="1.8" stroke-dasharray="5 3"/>` + T(298, 20, '상대방위', { size:12, fill:'var(--ink-2)' });
    // 예측 컴퍼스 방위 (현재 침로·속력 유지 가정)
    const pred = [];
    if(!run.hit && !run.done){
      const lastCb = run.hist[run.hist.length-1].cb;
      // CPA 직전(거리 0.3 NM 이내)에서는 방위가 급변하므로 예측선은 그 전까지만
      const tEnd = Math.min(xMax/60, run.t + Math.max(0, a.tcpa > 0 ? a.tcpa - Math.sqrt(Math.max(0, 0.09 - a.cpa*a.cpa))/Math.max(1e-6, relSpeed()) : 0));
      let prev = lastCb;
      for(let k = 1; k <= 30; k++){
        const tt = run.t + (tEnd - run.t)*k/30; if(tEnd <= run.t) break;
        const dtt = tt - run.t;
        const v = unwrapNear(N.bearing(N.step(run.own, run.own.c, run.own.s, dtt), N.step(run.tgt, run.tgt.c, run.tgt.s, dtt)), prev);
        prev = v; pred.push({ m:tt*60, v });
      }
    }
    const vals = run.hist.flatMap(h => [h.cb, h.rb]).concat(pred.map(p => p.v));
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if(hi - lo < 24){ const m = (hi + lo)/2; lo = m - 12; hi = m + 12; }
    const tick = niceStep(hi - lo, 5);
    lo = Math.floor(lo/tick)*tick; hi = Math.ceil(hi/tick)*tick;
    const Y = v => B1 - (v - lo)/(hi - lo)*(B1 - T1);
    s += `<rect x="${L}" y="${T1}" width="${R-L}" height="${B1-T1}" fill="var(--paper)" stroke="var(--rule)"/>`;
    for(let v = lo; v <= hi + 1e-9; v += tick){
      s += `<line x1="${L}" y1="${f1(Y(v))}" x2="${R}" y2="${f1(Y(v))}" stroke="var(--rule)" stroke-width="1"/>`;
      s += T(L - 6, Y(v) + 4, String(Math.round(N.norm(v))).padStart(3,'0') + '°', { size:11.5, mono:true, anchor:'end', fill:'var(--ink-2)' });
    }
    const xt = xMax <= 20 ? 5 : xMax <= 60 ? 10 : 20;
    for(let m = 0; m <= xMax; m += xt){
      s += `<line x1="${f1(X(m))}" y1="${T1}" x2="${f1(X(m))}" y2="${B2}" stroke="var(--rule)" stroke-width="${m ? .6 : 1}" stroke-dasharray="${m ? '2 3' : ''}"/>`;
      s += T(X(m), B2 + 16, String(m), { size:11.5, mono:true, anchor:'middle', fill:'var(--ink-2)' });
    }
    s += T(R, B2 + 34, '경과 시간 (분)', { size:11.5, anchor:'end', fill:'var(--ink-3)' });
    // 변침 지점 표시
    for(const sc of run.script) if(sc.done){
      s += `<line x1="${f1(X(sc.t*60))}" y1="${T1}" x2="${f1(X(sc.t*60))}" y2="${B1}" stroke="var(--ink-2)" stroke-width="1"/>` + T(X(sc.t*60) + 4, T1 + 14, '변침', { size:11.5, fill:'var(--ink-2)' });
    }
    const step = Math.max(1, Math.round(run.hist.length/300));
    const path = (key, Yf) => run.hist.filter((_, i) => i % step === 0 || i === run.hist.length-1).map((h, i) => (i ? 'L' : 'M') + f1(X(h.t*60)) + ' ' + f1(Yf(h[key]))).join(' ');
    if(pred.length){
      const h = run.hist[run.hist.length-1];
      s += `<path d="M${f1(X(h.t*60))} ${f1(Y(h.cb))} ${pred.map(p => 'L' + f1(X(p.m)) + ' ' + f1(Y(p.v))).join(' ')}" fill="none" stroke="var(--link)" stroke-width="1.6" stroke-dasharray="2 4" opacity=".8"/>`;
    }
    s += `<path d="${path('rb', Y)}" fill="none" stroke="var(--ink-3)" stroke-width="1.8" stroke-dasharray="5 3"/>`;
    s += `<path d="${path('cb', Y)}" fill="none" stroke="var(--link)" stroke-width="2.6" stroke-linejoin="round"/>`;
    const hl = run.hist[run.hist.length-1];
    s += `<circle cx="${f1(X(hl.t*60))}" cy="${f1(Y(hl.cb))}" r="3.5" fill="var(--link)"/>`;
    if(pred.length && run.t === 0) s += T(X(pred[pred.length-1].m) - 2, Y(pred[pred.length-1].v) - 8, '예상', { size:11, anchor:'end', fill:'var(--link)' });
    // 거리 그래프
    s += T(12, T2 - 12, '거리 (NM)', { size:12.5, weight:600 });
    const rMax = Math.max(setup.rng, ...run.hist.map(h => h.r)) * 1.05;
    const rt = rMax > 6 ? 2 : 1;
    const RY = v => B2 - v/rMax*(B2 - T2);
    s += `<rect x="${L}" y="${T2}" width="${R-L}" height="${B2-T2}" fill="var(--paper)" stroke="var(--rule)"/>`;
    for(let v = 0; v <= rMax; v += rt) s += T(L - 6, RY(v) + 4, String(v), { size:11.5, mono:true, anchor:'end', fill:'var(--ink-2)' }) + (v ? `<line x1="${L}" y1="${f1(RY(v))}" x2="${R}" y2="${f1(RY(v))}" stroke="var(--rule)"/>` : '');
    if(!run.hit && !run.done && a.tcpa > 0){
      const m = (run.t + a.tcpa)*60;
      if(m <= xMax){
        s += `<path d="M${f1(X(run.t*60))} ${f1(RY(a.range))} L${f1(X(m))} ${f1(RY(a.cpa))}" fill="none" stroke="var(--magenta)" stroke-width="1.4" stroke-dasharray="2 4"/>`;
        s += `<circle cx="${f1(X(m))}" cy="${f1(RY(a.cpa))}" r="4" fill="none" stroke="var(--magenta)" stroke-width="1.6"/>`;
        s += T(Math.min(X(m) + 7, R - 30), RY(a.cpa) - 6, 'CPA', { size:11, fill:'var(--magenta)', weight:600 });
      }
    }
    s += `<path d="${path('r', RY)}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
    chart.innerHTML = s;
  }

  function readout(a){
    st.t((run.t*60).toFixed(1) + ' 분');
    st.cb(N.fmtDeg(a.cb)); st.rb(N.fmtDeg(a.rb)); st.r(N.fmtNM(a.range));
    st.cpa(run.hit ? '—' : a.tcpa > 0 ? N.fmtNM(a.cpa) : '지남');
    st.tcpa(run.hit || a.tcpa <= 0 ? '—' : N.fmtMin(a.tcpa));
    const d6 = Math.abs(a.d6) < 0.05 ? 0 : a.d6;
    st.d6(run.hit || a.tcpa <= 0 ? '—' : (d6 > 0 ? '+' : d6 < 0 ? '−' : '') + Math.abs(d6).toFixed(1) + `° (${a.winMin}분)`);
  }

  function verdict(a){
    const big = setup.type !== 'normal';
    const what = setup.type === 'big' ? '거대선' : setup.type === 'tow' ? '예인선열(끌려오는 부선)' : '';
    if(run.hit){ ui.setVerdict('충돌 — 컴퍼스 방위가 뚜렷하게 변하지 않은 채 거리가 줄어들었다 (제7조(d)(i))', false); return; }
    if(a.tcpa <= 0){ ui.setVerdict(`멀어지는 중 — 최근접점을 지났다(CPA ${N.fmtNM(big ? a.hullCpa : a.cpa)}). 완전히 멀어질 때까지 확인 (제8조(d))`, true); return; }
    if(Math.abs(N.signed(run.own.ord - run.own.c)) > 0.01){
      ui.setVerdict(`내 배 변침 중 (${N.fmtDeg(run.own.c)} → ${N.fmtDeg(run.own.ord)}) — 선수 방향이 돌아가니 상대방위는 저절로 변한다. 변침 후 컴퍼스 방위를 다시 확인할 것`, null);
      return;
    }
    const steady = Math.abs(a.d6) < a.appr;
    const trap = a.obsRb != null && Math.abs(a.obsRb) >= 15 && Math.abs(a.obsCb) < APPR;
    if(steady){
      ui.setVerdict(trap
        ? `상대방위는 ${Math.abs(a.obsRb).toFixed(0)}° 바뀌었지만 컴퍼스 방위는 그대로 — 여전히 충돌의 위험 있음 (제7조(d)(i))`
        : `충돌의 위험 있음 — 컴퍼스 방위가 뚜렷하게 변하지 않고(${a.winMin}분간 ${Math.abs(a.d6).toFixed(1)}°) 거리가 줄어든다 (제7조(d)(i))`, false);
      return;
    }
    const cpaUse = big ? a.hullCpa : a.cpa;
    if(big && cpaUse < 1.5 || a.range < 2 || cpaUse < 1){
      const why = big ? `${what}에 접근` : a.range < 2 ? '근거리로 접근' : `CPA ${N.fmtNM(cpaUse)}로 가까움`;
      ui.setVerdict(`방위는 변하지만(${a.winMin}분간 ${Math.abs(a.d6).toFixed(1)}°) 위험할 수 있음 — ${why}${big ? `, 선체·부선까지 CPA ${N.fmtNM(cpaUse)}` : ''} (제7조(d)(ii))`, false);
      return;
    }
    ui.setVerdict(`위험 낮음 — 컴퍼스 방위가 뚜렷하게 변함(${a.winMin}분간 ${Math.abs(a.d6).toFixed(1)}°), CPA ${N.fmtNM(cpaUse)}. 계속 관측할 것 (제7조(a)·(b))`, true);
  }

  applyPreset('col');
});

}catch(e){console.error("[load] src/sims/bearing-sim.js", e)}
</script>
