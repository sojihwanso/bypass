    CH_THEM: { who: 'impede-them', head: '상대가 내 통항을 방해하지 말아야 함 — 제9조(b)(c)', text: '20m 미만 선박·범선은 수로 안에서만 안전하게 항행할 수 있는 선박의, 어로종사선은 수로 안 모든 선박의 통항을 방해하지 않아야 한다. 다만 충돌의 위험이 생길 만큼 가까워지면 나도 항법 규정을 그대로 따라야 한다(제8조(f)).', links: [['rule-09', '제9조 좁은 수로'], ['rule-08', '제8조 충돌을 피하기 위한 동작']] },
    CH_THEMCROSS: { who: 'impede-them', head: '횡단선이 내 통항을 방해하지 말아야 함 — 제9조(d)', text: '좁은 수로에서는 수로를 따라가는 선박이 절대적으로 우선한다. 상대가 내 우현에서 오더라도 횡단선이 끝까지 진로를 피한다(TSS와 다른 점 ★).', links: [['rule-09', '제9조 좁은 수로'], ['rule-10', '제10조 TSS']] },
    TSS_SMALL: { who: 'impede-me', head: '내가 통항 방해 금지 — 제10조(j)', text: '길이 20m 미만 선박이나 범선은 통항로를 따라 항행하는 <b>동력선</b>의 안전한 통항을 방해하지 않아야 한다.', links: [['rule-10', '제10조 TSS']] },
    TSS_FISH: { who: 'impede-me', head: '내가 통항 방해 금지 — 제10조(i)', text: '어로종사선은 통항로를 따라 항행하는 <b>모든</b> 선박의 통항을 방해하지 않아야 한다.', links: [['rule-10', '제10조 TSS']] },
    TSS_THEM_SMALL: { who: 'impede-them', head: '상대가 내 통항을 방해하지 말아야 함 — 제10조(j)', text: '20m 미만 선박·범선은 통항로를 따라 항행하는 동력선의 안전한 통항을 방해하지 않아야 한다. 충돌의 위험이 생기면 나도 항법 규정을 따른다(제8조(f)).', links: [['rule-10', '제10조 TSS'], ['rule-08', '제8조 충돌을 피하기 위한 동작']] },
    TSS_THEM_FISH: { who: 'impede-them', head: '상대가 내 통항을 방해하지 말아야 함 — 제10조(i)', text: '어로종사선은 통항로를 따라 항행하는 모든 선박의 통항을 방해하지 않아야 한다. 충돌의 위험이 생기면 나도 항법 규정을 따른다(제8조(f)).', links: [['rule-10', '제10조 TSS'], ['rule-08', '제8조 충돌을 피하기 위한 동작']] },
    HEADON: { who: 'both', head: '둘 다 피항선 — 마주치는 상태 (제14조)', text: '두 선박 모두 <b>우현으로 변침</b>해 서로 상대의 좌현 쪽을 지나간다(포트투포트). 유지선은 없다. 조종신호는 단음 1회(“우현으로 변침하고 있다”).', links: [['rule-14', '제14조 마주치는 상태'], ['rule-16', '제16조 피항선의 동작']] },
    HEADON_DOUBT: { who: 'both', head: '마주치는 상태로 보고 행동 — 제14조(c)', text: '마주치는 상태인지 의심스러우면 마주치는 상태로 본다. 내가 피항선으로서 우현 변침한다. 더 위험한 상황을 가정하는 것이 COLREG의 원칙이다.', links: [['rule-14', '제14조 마주치는 상태']] },
    CROSS_ME: { who: 'me', head: '내가 피항선 — 상대를 우현에 둠 (제15조)', text: '좌고우피: 상대가 우측에서 오면 내가 피한다. <b>미리 크게</b>(제16조) 우현 변침해 상대 <b>선미 쪽</b>으로 지나가고, 사정이 허락하면 상대 선수를 횡단하지 않는다. 감속해 상대가 지나가길 기다려도 되지만 상대가 알 수 있을 만큼 적극적으로.', links: [['rule-15', '제15조 횡단하는 상태'], ['rule-16', '제16조 피항선의 동작']] },
    CROSS_THEM: { who: 'them', head: '상대가 피항선 — 상대가 나를 우현에 둠 (제15조)', text: KEEP_ON + ' 이때 좌현 쪽의 피항선을 향해 좌현 변침하지 않는다(17(c)).', links: [['rule-15', '제15조 횡단하는 상태'], ['rule-17', '제17조 유지선의 동작']] },
    SAIL_ME_PORT: { who: 'me', head: '내가 피항선 — 좌현에 바람을 받는 범선 (제12조(a)(i))', text: '서로 다른 현에 바람을 받으면 좌현에 바람을 받는 범선(좌현택)이 피한다.', links: [['rule-12', '제12조 범선']] },
    SAIL_THEM_PORT: { who: 'them', head: '상대가 피항선 — 상대가 좌현택 (제12조(a)(i))', text: '나는 우현에 바람을 받으므로 유지선이다. ' + KEEP_ON, links: [['rule-12', '제12조 범선'], ['rule-17', '제17조 유지선의 동작']] },
    SAIL_ME_WW: { who: 'me', head: '내가 피항선 — 풍상 쪽 범선 (제12조(a)(ii))', text: '같은 현에 바람을 받으면 바람이 불어오는 쪽(풍상) 범선이 풍하 쪽 범선을 피한다.', links: [['rule-12', '제12조 범선']] },
    SAIL_THEM_WW: { who: 'them', head: '상대가 피항선 — 상대가 풍상 (제12조(a)(ii))', text: '나는 풍하 쪽이므로 유지선이다. ' + KEEP_ON, links: [['rule-12', '제12조 범선']] },
    SAIL_UNKNOWN: { who: 'me', head: '내가 피항선 — 애매하면 내가 피한다 (제12조(a)(iii))', text: '좌현에 바람을 받는 범선이 풍상 쪽 범선을 보았는데 그 범선이 어느 현에 바람을 받는지 확실히 알 수 없으면, 좌현택인 내가 피한다.', links: [['rule-12', '제12조 범선']] },
    SAME_NUC: { who: 'none', head: '제18조에 규정 없음 — 서로 최선을 다해 피함', text: '같은 단계(조종불능선끼리·조종제한선끼리)는 제18조로 정해지지 않는다. 둘 다 조종이 어려우므로 선원의 상무(제2조)에 따라 할 수 있는 최선의 동작(제8조)으로 충돌을 피한다.', links: [['rule-18', '제18조 선박 사이의 책무'], ['rule-08', '제8조 충돌을 피하기 위한 동작']] }
  };

  function ladderEnd(me, them){
    const M = tOf(me), T = tOf(them), air = x => x === 'sea' || x === 'wig';
    const links = [['rule-18', '제18조 선박 사이의 책무'], ['review-giveway', '내가 피해야 하는 경우 총정리']];
    if(air(me) && air(them)) return { who: 'both', head: '둘 다 모든 선박을 충분히 피함 — 제18조(e)·(f)', text: '수상항공기와 WIG선은 모두 사다리 맨 아래 단계다. 각자 충분히 떨어지고, 충돌의 위험이 생기면 항법 규정(수면의 WIG선은 동력선으로서)을 따른다.', links };
    if(air(me)) return { who: 'me', head: `내가 피함 — ${M.s}은(는) 모든 선박을 충분히 피함 (제18조(${me === 'sea' ? 'e' : 'f'}))`, text: me === 'sea' ? '수면에 있는 수상항공기는 원칙적으로 모든 선박으로부터 충분히 떨어져 항행을 방해하지 않는다. 충돌의 위험이 있으면 항법 규정을 따른다.' : 'WIG선은 이륙·착륙·수면 근처 비행 중 모든 선박으로부터 충분히 떨어진다. 수면에서 운항할 때는 동력선으로서 항법을 따른다.', links };
    if(air(them)) return { who: 'them', head: `상대(${T.s})가 나를 충분히 피함 — 제18조(${them === 'sea' ? 'e' : 'f'})`, text: '수상항공기·WIG선은 모든 선박을 충분히 피해야 한다. 그래도 경계는 늦추지 않는다.', links };
    if(them === 'cbd' && ['fish', 'sail', 'pdv'].includes(me)) return { who: 'impede-me', head: '내가 흘수제약선의 통항을 방해하지 않음 — 제18조(d)(i)', text: '“피한다”가 아니라 <b>“안전한 통항을 방해하지 않는다”</b> — 미리 넓게 비켜 주는 의무다. 충돌의 위험이 생길 만큼 가까워지면 흘수제약선도 항법 규정을 따른다(제8조(f)).', links: links.concat([['term-cbd', '흘수제약선']]) };
    if(me === 'cbd' && ['fish', 'sail', 'pdv'].includes(them)) return { who: 'impede-them', head: `상대(${T.s})가 내 통항을 방해하지 않아야 함 — 제18조(d)(i)`, text: '흘수제약선인 나도 특별히 조심해서 항행해야 한다(18(d)(ii)). 충돌의 위험이 생길 만큼 가까워지면 나도 동력선으로서 항법 규정을 따라야 한다(제8조(f)(iii)).', links: links.concat([['term-cbd', '흘수제약선']]) };
    const iGive = M.lv > T.lv;
    const g = iGive ? M : T, o = iGive ? T : M;
    let para = '', extra = '';
    if(g.id === 'ram' && o.id === 'nuc'){ para = '명문 규정 없음 — 교수님 설명: RAM은 그나마 조종이 되므로 RAM이 피함'; }
    else if(g.id === 'cbd'){ para = '제18조(a) — 흘수제약선도 동력선'; }
    else if(g.id === 'fish'){ para = '제18조(c) — 가능한 한'; }
    else if(g.id === 'sail'){ para = '제18조(b)'; }
    else { para = '제18조(a)'; }
    if(iGive) extra = ` 상대가 내 좌현 쪽에서 와도 마찬가지다(좌고우피보다 제18조가 우선). 조종 성능이 좋은 내가 나쁜 ${o.s}을(를) 피한다.`;
    return iGive
      ? { who: 'me', head: `내가 피항선 — ${ga(g.s)} ${o.s}을(를) 피함 (${para})`, text: '선박 종류에 따른 책무다.' + extra, links: links.concat([['rule-16', '제16조 피항선의 동작']]) }
      : { who: 'them', head: `상대가 피항선 — ${ga(g.s)} ${o.s}인 나를 피함 (${para})`, text: KEEP_ON, links: links.concat([['rule-17', '제17조 유지선의 동작']]) };
  }

  /* ---- 화면 ---- */
  const css = `
  .df{padding:12px 14px;background:var(--sea);display:flex;flex-direction:column;gap:10px}
  .df-steps{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px}
  .df-steps span{padding:2px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-3);background:var(--panel)}
  .df-steps span.done{color:var(--ink);border-color:var(--ink-3)}
  .df-steps span.now{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
  .df-steps i{color:var(--ink-3);font-style:normal}
  .df-crumb{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
  .df-crumb button{font:inherit;font-size:12.5px;border:1px solid var(--rule);background:var(--panel);color:var(--ink-2);border-radius:6px;padding:3px 8px;cursor:pointer;text-align:left}
  .df-crumb button:hover{border-color:var(--link)}
  .df-card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:14px}
  .df-card h4{margin:0 0 4px;font-size:16px;color:var(--ink)}
  .df-card .hint{font-size:13px;color:var(--ink-2);line-height:1.55;margin-bottom:10px}
  .df-opts{display:flex;flex-direction:column;gap:8px}
  .df-opts button{font:inherit;font-size:14px;text-align:left;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:9px;padding:9px 12px;cursor:pointer;line-height:1.4}
  .df-opts button:hover{border-color:var(--link)}
  .df-opts.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .df-end{border-left-width:6px}
  .df-end .who{font-size:12.5px;font-weight:700;letter-spacing:.02em}
  .df-end p{margin:6px 0 0;font-size:14px;line-height:1.65;color:var(--ink)}
  .df-end .links{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13.5px}
  .df-end .links a{color:var(--link)}
  `;
  el.prepend(W.h('style', { text: css }));
  const wrap = W.h('div', { class: 'df' });
  const stepsEl = W.h('div', { class: 'df-steps', 'aria-label': '판정 순서' });
  const crumbEl = W.h('div', { class: 'df-crumb', 'aria-label': '지나온 답' });
  const cardEl = W.h('div');
  wrap.append(stepsEl, cardEl, crumbEl);
  ui.stage.append(wrap);
  ui.readout.style.display = 'none'; // 읽기값 칸을 쓰지 않음 (.sim-readout 의 display:flex 가 hidden 속성을 덮어씀)
  W.ui.btn(ui.controls, '한 단계 뒤로', () => { if(path.length){ path.pop(); render(); } });
  W.ui.btn(ui.controls, '처음부터', () => { path = []; render(); });

  // path: [{node, label, next, set}]
  let path = [];
  function state(){
    let node = 'vis', ctx = {};
    for(const p of path){ Object.assign(ctx, p.set || {}); node = p.next; }
    return { node, ctx };
  }
  function resolve(next, ctx){
    if(next === '?TYPE'){
      if(ctx.me !== ctx.them) return { end: ladderEnd(ctx.me, ctx.them) };
      if(ctx.me === 'sail') return { node: 'sail' };
      if(ctx.me === 'nuc' || ctx.me === 'ram') return { end: E.SAME_NUC };
      return { node: 'enc' };
    }
    if(next.startsWith('=')) return { end: E[next.slice(1)] };
    return { node: next };
  }
  function choose(nodeId, opt){
    const [label, next, set] = opt;
    const ctx = { ...state().ctx, ...(set || {}) };
    const r = resolve(next, ctx);
    path.push({ node: nodeId, label, next: r.node || '#END', set, end: r.end });
    render();
  }

  const WHO = {
    me: ['내가 피항선', 'var(--giveway)'], them: ['상대가 피항선 · 나는 유지선', 'var(--standon)'], both: ['둘 다 피항선', 'var(--giveway)'],
    'impede-me': ['내가 통항 방해 금지 선박', 'var(--giveway)'], 'impede-them': ['상대가 통항 방해 금지 선박', 'var(--standon)'], none: ['피항선·유지선 관계 아님', 'var(--ink-3)']
  };

  function render(){
    const last = path[path.length - 1];
    const ended = last && last.next === '#END';
    const { node, ctx } = state();
    const curStep = ended ? 6 : Q[node].step;
    const visited = new Set(path.map(p => Q[p.node].step));
    stepsEl.innerHTML = STEPS.map((s, i) => `<span class="${i === curStep ? 'now' : visited.has(i) ? 'done' : ''}">${s}</span>`).join('<i>›</i>');
    crumbEl.innerHTML = '';
    if(path.length){
      crumbEl.append(W.h('span', { style: { color: 'var(--ink-3)', alignSelf: 'center' }, text: '지나온 길:' }));
      path.forEach((p, i) => crumbEl.append(W.h('button', { type: 'button', title: Q[p.node].q + ' — 여기로 돌아가기', text: `${i + 1}. ${p.label}`, onclick: () => { path = path.slice(0, i); render(); } })));
    }
    cardEl.innerHTML = '';
    if(ended){
      const e = last.end, [wl, wc] = WHO[e.who];
      const card = W.h('div', { class: 'df-card df-end', style: { borderLeftColor: wc } },
        W.h('div', { class: 'who', style: { color: wc }, text: wl }),
        W.h('h4', { html: e.head }), W.h('p', { html: e.text }),
        W.h('div', { class: 'links', html: '근거 문서: ' + e.links.map(([id, lab]) => L(id, lab)).join(' · ') }));
      cardEl.append(card);
      ui.setVerdict(`결론: ${W.plain(e.head)}`, e.who === 'none' ? null : true);
      return;
    }
    const q = Q[node];
    const note = node === 'me' && path.some(p => p.node === 'tssThem') ? '<div style="color:var(--magenta);margin-bottom:6px">TSS 안이라도 통항로를 따라가는 선박에 특권이 없다 — 일반 항법이 그대로 적용된다(제10조(a), 좁은 수로와 다른 점 ★).</div>'
      : node === 'enc' && ctx.me && ctx.me !== 'pdv' ? `<div style="color:var(--ink-2);margin-bottom:6px">${tOf(ctx.me).s}끼리는 같은 단계이므로 조우 형태로 정한다.</div>` : '';
    const opts = W.h('div', { class: 'df-opts' + (q.opts.length > 5 ? ' grid' : '') });
    q.opts.forEach(o => opts.append(W.h('button', { type: 'button', text: o[0], onclick: () => choose(node, o) })));
    cardEl.append(W.h('div', { class: 'df-card' },
      W.h('div', { style: { fontSize: '12px', color: 'var(--ink-3)', marginBottom: '2px' }, text: `질문 ${path.length + 1}` }),
      W.h('h4', { text: q.q }), W.h('div', { class: 'hint', html: note + q.hint }), opts));
    ui.setVerdict('', null);
  }
  render();
});

}catch(e){console.error("[load] src/sims/decision-flow.js", e)}
</script>
<script>/* src/sims/encounter-gen.js */
try{
/* 무작위 조우 연습 (제13·14·15조): 두 동력선의 조우를 보고 피항선을 고른 뒤, 정답 피항 동작을 애니메이션으로 본다 */
W.sim('encounter-gen', (el) => {
  const ui = W.ui.box(el, {
    title: '무작위 조우 — 누가 피항선인가?',
    kind: '연습',
    caption: '서로 시계 안의 두 동력선, 컴퍼스 방위가 변하지 않고 접근 중(충돌의 위험 있음). 내 배는 선수가 위를 향한다. ' +
      '점선 원은 내 배 중심 1해리 간격, 화살표는 6분 동안 갈 거리, 분홍 원은 그대로 가면 만나는 지점.'
  });
  const N = W.nav;
  const VW = 600, VH = 380;
  const svg = W.svg('svg', { viewBox: `0 0 ${VW} ${VH}`, role: 'img', 'aria-label': '두 선박의 조우 평면도' });
  ui.stage.append(svg);
  const explain = W.h('div', { style: { background: 'var(--panel)', borderTop: '1px solid var(--rule)', padding: '10px 14px', fontSize: '13.5px', lineHeight: '1.6', color: 'var(--ink)' } });
  ui.stage.append(explain);
  const lightsSvg = W.svg('svg', { viewBox: '0 0 120 64', width: '120', height: '64', style: 'display:block;width:120px;height:64px;flex:none;border-radius:8px', 'aria-label': '밤이라면 보이는 상대 등화' });
  const lightsTxt = W.h('div', { style: { fontSize: '13px', color: 'var(--ink-2)' } });
  const lightsRow = W.h('div', { style: { display: 'flex', gap: '10px', alignItems: 'center', marginBottom: '8px' } }, lightsSvg, lightsTxt);
  const explainTxt = W.h('div');
  explain.append(lightsRow, explainTxt);

  const choiceWrap = W.h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '8px', width: '100%' } });
  ui.controls.append(choiceWrap);
  const CH = [{ v: 'own', t: '내 배가 피항선' }, { v: 'tgt', t: '상대가 피항선' }, { v: 'both', t: '둘 다 피항선' }];
  const chBtns = CH.map(c => W.ui.btn(choiceWrap, c.t, () => answer(c.v)));
  const nextBtn = W.ui.btn(ui.controls, '다음 문제', () => newProblem(), 'primary');
  const replayBtn = W.ui.btn(ui.controls, '다시 보기', () => { tSim = 0; loop.play(); });
  const setScore = W.ui.stat(ui.readout, '점수');
  const setStreak = W.ui.stat(ui.readout, '연속 정답');
  const setRB = W.ui.stat(ui.readout, '상대방위');
  const setRange = W.ui.stat(ui.readout, '거리');
  const setCPA = W.ui.stat(ui.readout, 'CPA / TCPA');

  let score = 0, total = 0, streak = 0;
  let S = null, answered = false, sim = null, tSim = 0;
  const rnd = (a, b) => a + Math.random()*(b - a);
  const KINDS = [['cross-stbd', .3], ['cross-port', .25], ['head-on', .2], ['overtake', .125], ['overtaken', .125]];
  let lastKind = null;

  function pickKind(){
    for(let k = 0; k < 5; k++){
      let r = Math.random(), acc = 0;
      for(const [kind, w] of KINDS){ acc += w; if(r <= acc){ if(kind !== lastKind || k === 4) return kind; break; } }
    }
    return 'cross-stbd';
  }

  /* 조우 만들기: 충돌 지점 C에 T시간 뒤 동시에 도착하도록 상대 위치를 역산 */
  function gen(kind){
    for(let tries = 0; tries < 600; tries++){
      let s1 = rnd(10, 16), T = rnd(14, 20)/60, ct, s2;
      if(kind === 'head-on'){ ct = 180 + rnd(-3, 3); s2 = rnd(10, 16); }
      else if(kind === 'cross-stbd'){ ct = rnd(215, 325); s2 = rnd(9, 17); }
      else if(kind === 'cross-port'){ ct = rnd(35, 145); s2 = rnd(9, 17); }
      else if(kind === 'overtake'){ ct = N.norm(rnd(-25, 25)); s2 = s1*rnd(.35, .6); T = rnd(20, 28)/60; }
      else { s1 = rnd(8, 11); ct = N.norm(rnd(-25, 25)); s2 = s1*rnd(1.7, 2.2); T = rnd(18, 26)/60; }
      const C = { x: 0, y: s1*T }, v2 = N.vel(ct, s2);
      const own = { x: 0, y: 0, heading: 0 }, tgt = { x: C.x - v2.x*T, y: C.y - v2.y*T, heading: N.norm(ct) };
      const sit = N.situation(own, tgt);
      const rbT = N.rel(N.bearing(own, tgt), 0), rbO = N.rel(N.bearing(tgt, own), tgt.heading);
      const range = N.dist(own, tgt);
      if(range < 2.4 || range > 6.5) continue;
      const near = (a, b, m) => Math.abs(N.signed(a - b)) < m;
      let ok = false;
      if(kind === 'head-on') ok = sit.type === 'head-on' && near(rbT, 0, 4) && near(rbO, 0, 4);
      if(kind === 'cross-stbd') ok = sit.type === 'crossing' && sit.giveWay === 'own' && !near(rbT, 0, 12) && !near(rbO, 0, 12) && !near(rbT, 112.5, 12) && !near(rbO, 247.5, 12) && !near(rbO, 112.5, 12);
      if(kind === 'cross-port') ok = sit.type === 'crossing' && sit.giveWay === 'tgt' && !near(rbT, 0, 12) && !near(rbO, 0, 12) && !near(rbT, 247.5, 12) && !near(rbO, 112.5, 12) && !near(rbO, 247.5, 12);
      if(kind === 'overtake') ok = sit.type === 'overtaking' && sit.giveWay === 'own' && rbO > 135 && rbO < 225;
      if(kind === 'overtaken') ok = sit.type === 'overtaking' && sit.giveWay === 'tgt' && rbT > 135 && rbT < 225;
      if(!ok) continue;
      return { kind, sit, s1, s2, T, C, own: { x: 0, y: 0, c: 0, s: s1 }, tgt: { x: tgt.x, y: tgt.y, c: tgt.heading, s: s2 }, rbT, rbO, range };
    }
    return null;
  }

  /* 궤적 시뮬레이션: 각 선박 {x,y,c,s}, 변침 계획 {at(h), to(침로)} ; 선회율 40°/분 */
  function simulate(a, b, pa, pb, Tend){
    const dt = 0.1/60, RATE = 40*60; // °/h
    let A = { ...a }, B = { ...b }; const out = [];
    for(let t = 0; t <= Tend + 1e-9; t += dt){
      out.push({ t, a: { x: A.x, y: A.y, c: A.c }, b: { x: B.x, y: B.y, c: B.c } });
      [[A, pa], [B, pb]].forEach(([S_, p]) => {
        if(p && t >= p.at){ const d = N.signed(p.to - S_.c); const m = Math.min(Math.abs(d), RATE*dt); S_.c = N.norm(S_.c + Math.sign(d)*m); }
        const n = N.step(S_, S_.c, S_.s, dt); S_.x = n.x; S_.y = n.y;
      });
    }
    let min = 1e9, at = 0;
    out.forEach((f, i) => { const d = Math.hypot(f.a.x - f.b.x, f.a.y - f.b.y); if(d < min){ min = d; at = i; } });
    return { frames: out, min, minAt: at, dt };
  }
  function plan(S){
    const Tend = S.T*(S.kind === 'overtake' || S.kind === 'overtaken' ? 1.25 : 1.45), at = 1/60;
    const astern = (r, gwKey) => { // 최근접 순간 피항선이 유지선 선미 쪽에 있는가
      const f = r.frames[r.minAt], g = f[gwKey], o = f[gwKey === 'a' ? 'b' : 'a'], v = N.vel(o.c, 1);
      return (g.x - o.x)*v.x + (g.y - o.y)*v.y < 0;
    };
    let best = null;
    const tryP = (pa, pb, cond) => { const r = simulate(S.own, S.tgt, pa, pb, Tend); if(!best || r.min > best.min) best = r; return cond(r) ? r : null; };
    const k = S.kind;
    if(k === 'head-on'){
      for(let d = 20; d <= 70; d += 5){ const r = tryP({ at, to: N.norm(S.own.c + d) }, { at, to: N.norm(S.tgt.c + d) }, r => r.min >= 1.0); if(r) return { ...r, alter: d }; }
    } else if(k === 'cross-stbd' || k === 'cross-port'){
      const gwA = k === 'cross-stbd', base = gwA ? S.own.c : S.tgt.c;
      for(let d = 25; d <= 120; d += 5){
        const p = { at, to: N.norm(base + d) };
        const r = tryP(gwA ? p : null, gwA ? null : p, r => r.min >= 1.0 && astern(r, gwA ? 'a' : 'b'));
        if(r) return { ...r, alter: d };
      }
    } else {
      const gwA = k === 'overtake', base = gwA ? S.own.c : S.tgt.c;
      for(let d = 15; d <= 70; d += 5){
        for(const sg of [1, -1]){
          const p = { at, to: N.norm(base + sg*d) };
          const r = tryP(gwA ? p : null, gwA ? null : p, r => r.min >= 0.8);
          if(r) return { ...r, alter: sg*d };
        }
      }
    }
    return { ...best, alter: 0 };
  }

  /* ---------- 그리기 ---------- */
  let view = null;
  function fit(S){
    const pts = [S.own, S.tgt, S.C];
    sim.frames.forEach((f, i) => { if(i % 10 === 0){ pts.push(f.a, f.b); } });
    let x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x)), y0 = Math.min(...pts.map(p => p.y)), y1 = Math.max(...pts.map(p => p.y));
    const pad = 0.6; x0 -= pad; x1 += pad; y0 -= pad; y1 += pad;
    const scale = Math.min((VW - 40)/(x1 - x0), (VH - 30)/(y1 - y0), 60);
    return { cx: VW/2, cy: VH/2 + 6, scale, ox: (x0 + x1)/2, oy: (y0 + y1)/2 };
  }
  const T_ = p => N.toScreen(p, view);
  const txt = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.size || 14}" font-weight="${o.w || 400}" text-anchor="${o.a || 'start'}" font-family="var(--f-body)" fill="${o.fill || 'var(--ink)'}">${s}</text>`;

  function lightsBox(){
    const ls = { ...N.lightsSeen({ x: S.own.x, y: S.own.y }, { x: S.tgt.x, y: S.tgt.y, heading: S.tgt.c }) };
    // 정선수 부근에서는 현등 빛이 경계를 조금 넘고 선체도 흔들려 양 현등이 함께(또는 번갈아) 보인다 → 제14조(b)
    if(S.kind === 'head-on'){ ls.port = ls.stbd = true; }
    const names = [], cx = 60;
    let g = `<rect width="120" height="64" rx="8" fill="var(--night)"/>`;
    if(ls.masthead){ g += W.parts.light('white', 4.5, cx, 20); names.push('마스트등(백)'); }
    if(ls.port && ls.stbd){ g += W.parts.light('stbd', 4.5, cx - 16, 44) + W.parts.light('port', 4.5, cx + 16, 44); names.push(S.kind === 'head-on' ? '양 현등(녹·홍) — 마스트등 일직선' : '양 현등(녹·홍)'); }
    else if(ls.port){ g += W.parts.light('port', 4.5, cx, 44); names.push('좌현 홍등'); }
    else if(ls.stbd){ g += W.parts.light('stbd', 4.5, cx, 44); names.push('우현 녹등'); }
    if(ls.stern){ g += W.parts.light('white', 4.5, cx, 32); names.push('선미등(백)만 — 현등 안 보임'); }
    lightsSvg.innerHTML = g;
    lightsTxt.innerHTML = `<b style="color:var(--ink)">밤이라면 내 배에서 보이는 상대 등화</b><br>${names.join(' + ')}`;
  }

  function draw(frame){
    const narrow = (ui.stage.clientWidth || 600) < 520, FS = narrow ? 21 : 14, SL = narrow ? 40 : 30;
    const roleOwn = !answered ? null : S.sit.giveWay === 'own' || S.sit.giveWay === 'both' ? 'giveway' : 'standon';
    const roleTgt = !answered ? null : S.sit.giveWay === 'tgt' || S.sit.giveWay === 'both' ? 'giveway' : 'standon';
    const colOf = r => r === 'giveway' ? 'var(--giveway)' : r === 'standon' ? 'var(--standon)' : 'var(--ink)';
    let s = W.parts.arrowDefs('eg-a1', 'var(--ink-2)');
    const o = T_({ x: frame ? frame.a.x : S.own.x, y: frame ? frame.a.y : S.own.y });
    // 거리환 (현재 내 배 중심)
    for(let r = 1; r <= 6; r++) s += `<circle cx="${o.x}" cy="${o.y}" r="${r*view.scale}" fill="none" stroke="var(--ink-3)" stroke-width=".8" stroke-dasharray="2 5" opacity=".7"/>`;
    // 북쪽 표시
    s += `<g transform="translate(${VW - 24} 30)"><path d="M0 -14 L6 6 L0 2 L-6 6Z" fill="var(--ink-2)"/>${txt(0, 22, 'N', { size: 12, a: 'middle', fill: 'var(--ink-2)' })}</g>`;
    if(!frame){
      // 충돌 지점까지 침로선(점선)과 6분 벡터
      const c = T_(S.C);
      s += `<circle cx="${c.x}" cy="${c.y}" r="6" fill="none" stroke="var(--magenta)" stroke-width="1.5"/>`;
      [[S.own, 0, S.s1], [S.tgt, S.tgt.c, S.s2]].forEach(([p, c_, sp]) => {
        const a = T_(p), b = T_(N.step(p, c_, sp, 0.1)), e = T_(S.C);
        s += `<line x1="${a.x}" y1="${a.y}" x2="${e.x}" y2="${e.y}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="4 5"/>`;
        s += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--ink-2)" stroke-width="2" marker-end="url(#eg-a1)"/>`;
      });
      // 방위선
      const t = T_(S.tgt);
      s += `<line x1="${o.x}" y1="${o.y}" x2="${t.x}" y2="${t.y}" stroke="var(--link)" stroke-width="1" opacity=".6"/>`;
    } else {
      // 항적
      const fr = sim.frames, upto = fr.indexOf(frame);
      let da = '', db = '';
      for(let i = 0; i <= upto; i += 3){ const a = T_(fr[i].a), b = T_(fr[i].b); da += (da ? 'L' : 'M') + a.x.toFixed(1) + ' ' + a.y.toFixed(1); db += (db ? 'L' : 'M') + b.x.toFixed(1) + ' ' + b.y.toFixed(1); }
      s += `<path d="${da}" fill="none" stroke="${colOf(roleOwn)}" stroke-width="1.8" stroke-dasharray="3 4"/><path d="${db}" fill="none" stroke="${colOf(roleTgt)}" stroke-width="1.8" stroke-dasharray="3 4"/>`;
      const c = T_(S.C);
      s += `<circle cx="${c.x}" cy="${c.y}" r="6" fill="none" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="2 2"/>`;
    }
    const pa = frame ? frame.a : { x: S.own.x, y: S.own.y, c: S.own.c }, pb = frame ? frame.b : { x: S.tgt.x, y: S.tgt.y, c: S.tgt.c };
    const A = T_(pa), B = T_(pb);
    s += `<g transform="translate(${A.x} ${A.y}) rotate(${pa.c})">${W.parts.ship({ type: 'power', len: SL, role: roleOwn || undefined })}</g>`;
    s += `<g transform="translate(${B.x} ${B.y}) rotate(${pb.c})">${W.parts.ship({ type: 'power', len: SL, role: roleTgt || undefined })}</g>`;
    const tag = (p, label, role, dy) => txt(Math.max(90, Math.min(VW - 90, p.x)), Math.max(16, Math.min(VH - 6, p.y + dy)), label + (role ? (role === 'giveway' ? ' · 피항선' : ' · 유지선') : ''), { a: 'middle', w: 700, size: FS, fill: colOf(role) });
    s += tag(A, '내 배', roleOwn, SL + 6);
    s += tag(B, '상대선', roleTgt, B.y < A.y ? -SL*.8 : SL + 6);
    if(frame){ s += txt(VW - 12, VH - 12, `+${(frame.t*60).toFixed(1)}분`, { a: 'end', size: FS, fill: 'var(--ink-2)' }); }
    svg.innerHTML = s;
  }

  function newProblem(){
    lastKind = S ? S.kind : null;
    S = gen(pickKind()) || gen('cross-stbd');
    answered = false; tSim = 0; loop.pause();
    sim = plan(S);
    view = fit(S);
    lightsBox();
    chBtns.forEach(b => { b.disabled = false; b.classList.remove('on'); b.style.outline = ''; });
    nextBtn.hidden = true; replayBtn.hidden = true;
    const cpa = N.cpa(S.own, S.own.c, S.own.s, S.tgt, S.tgt.c, S.tgt.s);
    setRB(N.fmtDeg(S.rbT)); setRange(N.fmtNM(S.range)); setCPA(`${N.fmtNM(cpa.cpa)} / ${N.fmtMin(cpa.tcpa)}`);
    explainTxt.innerHTML = `내 침로 <b>000°</b> ${S.s1.toFixed(0)}kn · 상대 침로 <b>${N.fmtDeg(S.tgt.c)}</b> ${S.s2.toFixed(0)}kn. 상대선은 내 선수 기준 <b>${N.fmtDeg(S.rbT)}</b>에 있고, 상대 선수 기준으로 나는 <b>${N.fmtDeg(S.rbO)}</b>에 있다. 누가 피항선일까?`;
    ui.setVerdict('', null);
    draw(null);
  }

  const RB = r => N.fmtDeg(r);
  function explanation(){
    const k = S.kind;
    if(k === 'cross-stbd') return `<b>횡단하는 상태(제15조)</b> — 상대선이 내 <b>우현</b> 쪽(상대방위 ${RB(S.rbT)})에 있다. 좌고우피: 상대를 우현에 둔 내가 피항선이다. 밤이라면 상대의 <span style="color:var(--port)">홍등(좌현등)</span>이 보인다. 피항선은 <b>미리 크게</b>(제16조) <b>우현 변침해 상대 선미 쪽</b>으로 지나가고, 사정이 허락하면 상대 선수를 횡단하지 않는다. 상대(유지선)는 침로·속력을 유지한다(제17조(a)(i)).`;
    if(k === 'cross-port') return `<b>횡단하는 상태(제15조)</b> — 상대선이 내 <b>좌현</b> 쪽(상대방위 ${RB(S.rbT)})에 있다. 상대가 나를 우현에 두므로 상대가 피항선, 나는 유지선. 밤이라면 상대의 <span style="color:var(--stbd)">녹등(우현등)</span>이 보인다. 나는 <b>침로와 속력을 유지</b>한다(제17조(a)(i)). 상대가 피하지 않으면 제17조(a)(ii)·(b) 단계로 가며, 이때도 좌현 쪽 선박을 향한 좌현 변침은 하지 않는다(제17조(c)).`;
    if(k === 'head-on') return `<b>마주치는 상태(제14조)</b> — 거의 정반대 침로로 정선수 부근에서 만난다. 밤이라면 마스트등이 일직선으로, <b>양 현등</b>이 함께 보인다. <b>둘 다 피항선</b>(유지선 없음): 각각 우현 변침해 서로의 좌현 쪽으로 지나간다(포트투포트). 마주치는 상태인지 의심스러우면 마주치는 상태로 본다(14(c)).`;
    if(k === 'overtake') return `<b>추월(제13조)</b> — 나는 상대 선수 기준 ${RB(S.rbO)}, 즉 상대의 <b>정횡 후 22.5°를 넘는 후방</b>에서 따라잡고 있다(13(b)). 밤이라면 상대의 <b>선미등만</b> 보이고 현등은 안 보인다. 추월선인 내가 <b>완전히 추월해 충분히 멀어질 때까지</b> 피한다(13(a)). 이후 방위가 바뀌어도 횡단 관계가 되지 않는다(13(d)). 추월선은 어느 쪽으로든 넉넉히 비켜 지나가면 된다.`;
    return `<b>추월(제13조)</b> — 상대선이 내 선수 기준 ${RB(S.rbT)}, 즉 내 <b>정횡 후 22.5°를 넘는 후방</b>에서 더 빠르게 따라오고 있다. 상대가 추월선이므로 상대가 피항선, 나는 유지선으로 침로·속력을 유지한다. 상대는 밤에 내 선미등만 본다. (위 상자의 등화는 내가 보는 상대의 등화다)`;
  }
  const correctLabel = () => ({ own: '내 배가 피항선', tgt: '상대가 피항선', both: '둘 다 피항선' })[S.sit.giveWay];
  const ruleOf = () => ({ 'cross-stbd': '상대를 우현에 둠 (제15조)', 'cross-port': '상대가 나를 우현에 둠 (제15조)', 'head-on': '마주치는 상태 (제14조)', 'overtake': '내가 추월선 (제13조)', 'overtaken': '상대가 추월선 (제13조)' })[S.kind];

  function answer(v){
    if(answered) return;
    answered = true; total++;
    const ok = v === S.sit.giveWay;
    if(ok){ score++; streak++; } else streak = 0;
    setScore(`${score} / ${total}`); setStreak(String(streak));
    chBtns.forEach((b, i) => { b.disabled = true; if(CH[i].v === S.sit.giveWay) b.classList.add('on'); if(CH[i].v === v && !ok) b.style.outline = '2px solid var(--bad)'; });
    ui.setVerdict(`${ok ? '정답' : '오답'} — ${correctLabel()}: ${ruleOf()}`, ok);
    const alt = sim.alter, who = S.sit.giveWay === 'own' ? '내 배' : S.sit.giveWay === 'tgt' ? '상대선' : '두 선박';
    const act = alt === 0 ? '' : `${who}가 ${Math.abs(alt)}° ${alt > 0 ? '우현' : '좌현'} 변침 → 최근접 거리 ${N.fmtNM(sim.min)}.`;
    explainTxt.innerHTML = explanation() + (act ? `<div style="margin-top:6px;color:var(--ink-2)">애니메이션: ${act}</div>` : '');
    nextBtn.hidden = false; replayBtn.hidden = false;
    tSim = 0; loop.play();
  }

  const loop = W.ui.loop(ui.stage, (dt) => {
    if(!sim || !answered){ return; }
    const Tend = sim.frames[sim.frames.length - 1].t;
    tSim = Math.min(Tend, tSim + dt*Tend/9);
    const i = Math.min(sim.frames.length - 1, Math.round(tSim/sim.dt));
    draw(sim.frames[i]);
    if(tSim >= Tend) loop.pause();
  }, false);

  setScore('0 / 0'); setStreak('0');
  newProblem();
});

}catch(e){console.error("[load] src/sims/encounter-gen.js", e)}
</script>
<script>/* src/sims/headon-night.js */
try{
/* 제14조 마주치는 상태 — 야간 선교에서 본 상대선(마스트등 일직선 + 양현등) → 두 선박 모두 우현 변침, 좌현 대 좌현 통과 */
W.sim('headon-night', (el) => {
  const N = W.nav;
  const ui = W.ui.box(el, {
    title: '밤에 정면에서 마주칠 때: 둘 다 우현 변침', kind: '애니메이션', night: true,
    caption: '제14조(b): 상대선을 정선수 또는 거의 정선수에서 보고, <b>야간</b>에는 두 마스트등이 일직선(또는 거의 일직선)이거나 양 현등이 보일 때, ' +
      '<b>주간</b>에는 그에 대응하는 모습(마스트가 겹쳐 보이는 정면 모습)일 때 마주치는 상태다. 둘 다 피항선이며 각각 우현 변침해 좌현 대 좌현으로 지나간다(제14조(a)). ' +
      '우현으로 변침할 때 단음 1회(“나는 우현으로 변침하고 있다”). (c) 의심스러우면 마주치는 상태로 보고 행동한다. ' +
      '<span style="color:var(--ink-3)">왼쪽 선교 그림은 거리감을 위해 상대선 크기를 과장했다.</span>'
  });

  const wrap = W.h('div', { style: { display: 'flex', flexWrap: 'wrap' } });
  const bBox = W.h('div', { style: { flex: '1.6 1 340px', minWidth: '0' } });
  const pBox = W.h('div', { style: { flex: '1 1 220px', minWidth: '0', borderLeft: '1px solid var(--rule)' } });
  wrap.append(bBox, pBox); ui.stage.append(wrap);
  const bridge = W.svg('svg', { viewBox: '0 0 360 250', role: 'img', 'aria-label': '내 배 선교에서 본 전방' });
  const plan = W.svg('svg', { viewBox: '0 0 300 300', role: 'img', 'aria-label': '위에서 본 두 선박의 움직임' });
  bBox.append(bridge); pBox.append(plan);

  const st = { t: 0, night: true, doubt: false };
  const TEND = 10, TACT = 2.5, TURN = 35, RATE = 25, SPD = 12;

  /* ---------- 항적 미리 계산 (분 단위) ---------- */
  function track(doubt){
    const own = { x: 0, y: 0, h: 0 }, tgt = doubt ? { x: 0.12, y: 3.0, h: 184 } : { x: 0, y: 3.0, h: 180 };
    const h0o = own.h, h0t = tgt.h, out = [];
    const dt = 0.02;
    for(let t = 0; t <= TEND + 1e-9; t += dt){
      out.push({ t, own: { ...own }, tgt: { ...tgt } });
      if(t >= TACT){ own.h = Math.min(h0o + TURN, own.h + RATE*dt); tgt.h = Math.min(h0t + TURN, tgt.h + RATE*dt); }
      Object.assign(own, N.step(own, own.h, SPD, dt/60));
      Object.assign(tgt, N.step(tgt, tgt.h, SPD, dt/60));
    }
    return out;
  }
  const TR = { false: track(false), true: track(true) };
  const at = t => { const a = TR[st.doubt]; return a[Math.max(0, Math.min(a.length - 1, Math.round(t/0.02)))]; };

  /* ---------- 상대선 3D 모형 (x=우현, y=선수, z=위, m) ---------- */
  const LT = { mastF: { x: 0, y: 25, z: 22 }, mastA: { x: 0, y: -15, z: 30 }, port: { x: -8, y: -8, z: 15 }, stbd: { x: 8, y: -8, z: 15 }, stern: { x: 0, y: -49, z: 8 } };
  const HULL = [[0,50],[6,38],[8,20],[8,-40],[6,-50],[-6,-50],[-8,-40],[-8,20],[-6,38]];

  function seenBy(own, tgt, yawH){
    const rbs = N.signed(N.bearing(tgt, own) - yawH);          // 상대선 선수 기준 내 배의 방위
    const OV = 2;                                               // 현등 선수 쪽 겹침 허용(약 1~3°)
    return { rbs, masthead: Math.abs(rbs) <= 112.5, stbd: rbs >= -OV && rbs <= 112.5, port: rbs <= OV && rbs >= -112.5, stern: Math.abs(rbs) > 112.5 };
  }

  const ink = () => st.night ? 'var(--night-ink)' : 'var(--ink)';
  const txt = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.fs||13}" font-weight="${o.w||500}" font-family="${o.mono?'var(--f-mono)':'var(--f-body)'}" text-anchor="${o.a||'start'}" fill="${o.fill||ink()}"${o.op?` fill-opacity="${o.op}"`:''}>${s}</text>`;

  function drawBridge(f, seen, yawH){
    const { own, tgt } = f, hz = 118, CX = 180, FOV = 105;   // 선교 창 파노라마: 좌우 ±105° (선형 배치)
    let s = '';
    if(!st.night) s += `<rect width="360" height="${hz}" fill="var(--panel)" fill-opacity=".55"/>`;
    s += `<rect y="${hz}" width="360" height="${250 - hz}" fill="${st.night ? 'var(--night-2)' : 'var(--sea-deep)'}" fill-opacity="${st.night ? .6 : .6}"/>`;
    if(st.night) [[30,30],[92,58],[150,22],[238,44],[300,26],[332,74],[60,88],[270,92]].forEach(([x, y]) => { s += `<circle cx="${x}" cy="${y}" r=".9" fill="var(--night-ink)" fill-opacity=".5"/>`; });
    const D = N.dist(own, tgt), rel = N.signed(N.bearing(own, tgt) - own.h);
    if(Math.abs(rel) < FOV){
      const bx = CX + rel/FOV*172;
      const k = Math.min(3.2, 1.5/Math.sqrt(Math.max(D, 0.05)));
      const fx = (tgt.x - own.x)/D, fy = (tgt.y - own.y)/D, rx = fy, ry = -fx;   // 시선의 오른쪽
      const H = N.rad(yawH), fw = { x: Math.sin(H), y: Math.cos(H) }, sb = { x: Math.cos(H), y: -Math.sin(H) };
      const lat = p => (p.x*sb.x + p.y*fw.x)*rx + (p.x*sb.y + p.y*fw.y)*ry;
      const P = p => ({ x: bx + lat(p)*k, y: hz - p.z*k });
      // 선체 (밤: 희미, 낮: 진하게)
      const xs = HULL.map(([x, y]) => lat({ x, y })), x0 = bx + Math.min(...xs)*k, x1 = bx + Math.max(...xs)*k;
      const sup = [[-7,-22],[7,-22],[-7,-42],[7,-42]].map(([x, y]) => lat({ x, y }));
      const s0 = bx + Math.min(...sup)*k, s1 = bx + Math.max(...sup)*k;
      const op = st.night ? .14 : .9, col = st.night ? 'var(--night-ink)' : 'var(--ink-2)';
      s += `<g fill="${col}" fill-opacity="${op}" stroke="${col}" stroke-opacity="${st.night ? .25 : .9}">` +
           `<path d="M${x0} ${hz - 7*k} L${x1} ${hz - 7*k} L${x1 - 2*k} ${hz + 2} L${x0 + 2*k} ${hz + 2} Z"/>` +
           `<rect x="${s0}" y="${hz - 18*k}" width="${Math.max(2, s1 - s0)}" height="${11*k}"/></g>`;
      const mf = P(LT.mastF), ma = P(LT.mastA);
      s += `<g stroke="${col}" stroke-opacity="${st.night ? .25 : .9}" stroke-width="${st.night ? 1 : 1.6}"><line x1="${mf.x}" y1="${mf.y}" x2="${mf.x}" y2="${hz - 7*k}"/><line x1="${ma.x}" y1="${ma.y}" x2="${ma.x}" y2="${hz - 18*k}"/></g>`;
      if(st.night){
        const r = Math.max(2.4, Math.min(4.2, 1.8*k));
        if(seen.masthead){ s += W.parts.light('white', r, mf.x, mf.y) + W.parts.light('white', r, ma.x, ma.y); }
        if(seen.port){ const q = P(LT.port); s += W.parts.light('port', r, q.x, q.y); }
        if(seen.stbd){ const q = P(LT.stbd); s += W.parts.light('stbd', r, q.x, q.y); }
        if(seen.stern){ const q = P(LT.stern); s += W.parts.light('white', r, q.x, q.y); }
      }
    } else {
      const left = rel < 0;
      s += txt(left ? 8 : 352, hz - 8, left ? '◀ 상대선' : '상대선 ▶', { a: left ? 'start' : 'end', fs: 12.5, w: 600 });
    }
    // 방위 눈금 (정횡)
    [-90, -45, 45, 90].forEach(a => {
      const x = CX + a/FOV*172;
      s += `<line x1="${x}" y1="${hz + 2}" x2="${x}" y2="${hz + 9}" stroke="${ink()}" stroke-opacity=".5"/>`;
      if(Math.abs(a) === 90) s += txt(x, hz + 22, a < 0 ? '좌현 정횡' : '우현 정횡', { a: 'middle', fs: 11, op: .7 });
    });
    // 내 배 선수
    const bowF = st.night ? 'var(--night)' : 'var(--ink-3)';
    s += `<path d="M96 250 L170 176 Q180 164 190 176 L264 250 Z" fill="${bowF}" stroke="${ink()}" stroke-opacity=".45"/>`;
    s += `<line x1="180" y1="168" x2="180" y2="146" stroke="${ink()}" stroke-opacity=".6" stroke-width="1.5"/>`;
    s += txt(10, 20, `내 배 선교에서 본 전방 · ${st.night ? '야간' : '주간'}`, { fs: 13, w: 600 });
    s += txt(10, 38, `침로 ${N.fmtDeg(own.h)} · 거리 ${D.toFixed(2)} NM`, { fs: 12, mono: true, op: .85 });
    // 단음 1회 표시
    if(st.t >= TACT && st.t < TACT + 0.7){
      s += `<g><rect x="232" y="8" width="120" height="30" rx="6" fill="${st.night ? 'var(--night)' : 'var(--panel)'}" stroke="var(--magenta)"/>` +
           `<rect x="244" y="20" width="16" height="6" rx="3" fill="var(--magenta)"/>` + txt(268, 28, '단음 1회', { fs: 13, w: 700, fill: 'var(--magenta)' }) + `</g>`;
    }
    bridge.innerHTML = s;
  }

  function drawPlan(f){
    const V = { cx: 150, cy: 150, scale: 72, ox: 0, oy: 1.5 }, S = p => N.toScreen(p, V);
    let s = '';
    if(!st.night) s += `<rect width="300" height="300" fill="var(--sea)"/>`;
    s += txt(10, 20, '위에서 본 모습', { fs: 13, w: 600 });
    const arr = TR[st.doubt], idx = arr.indexOf(f);
    ['own', 'tgt'].forEach(k => {
      const all = arr.filter((_, i) => i % 5 === 0).map(q => S(q[k])), past = arr.slice(0, idx + 1).filter((_, i) => i % 5 === 0).map(q => S(q[k]));
      s += `<polyline points="${all.map(p => p.x + ',' + p.y).join(' ')}" fill="none" stroke="${ink()}" stroke-opacity=".22" stroke-dasharray="3 4"/>`;
      if(past.length > 1) s += `<polyline points="${past.map(p => p.x + ',' + p.y).join(' ')}" fill="none" stroke="var(--giveway)" stroke-width="1.6"/>`;
    });
    const ship = (p, h, label) => {
      const q = S(p);
      return `<g transform="translate(${q.x} ${q.y}) rotate(${h})">${W.parts.ship({ type: 'power', len: 26, role: 'giveway' })}${W.parts.light('port', 1.8, -3.5, -4)}${W.parts.light('stbd', 1.8, 3.5, -4)}</g>` +
        txt(q.x + 16, q.y + 4, label, { fs: 12.5, w: 600 });
    };
    s += ship(f.own, f.own.h, '내 배') + ship(f.tgt, f.tgt.h, '상대선');
    if(st.t > 6.2) s += txt(150, 288, '좌현 대 좌현 통과', { a: 'middle', fs: 13, w: 700, fill: 'var(--port)' });
    else s += txt(150, 288, '둘 다 피항선', { a: 'middle', fs: 12.5, w: 600, fill: 'var(--giveway)' });
    plan.innerHTML = s;
  }

  function draw(){
    const f = at(st.t);
    const yawAmp = st.doubt ? 3 : 0.6, yawH = f.tgt.h + yawAmp*Math.sin(st.t*2*Math.PI/0.55);
    const seen = seenBy(f.own, f.tgt, yawH);
    ui.stage.classList.toggle('night', st.night);
    drawBridge(f, seen, yawH); drawPlan(f);
    const c = N.cpa(f.own, f.own.h, SPD, f.tgt, f.tgt.h, SPD);
    setD(N.fmtNM(c.range)); setCpa(c.tcpa > 0 ? N.fmtNM(c.cpa) : '통과함');
    const nm = []; if(seen.masthead) nm.push('마스트등 2'); if(seen.port) nm.push('홍'); if(seen.stbd) nm.push('녹'); if(seen.stern) nm.push('선미등');
    setSeen(st.night ? nm.join('·') : '(주간)');
    if(st.t < TACT){
      if(!st.night) ui.setVerdict('주간: 상대선이 선수 방향 정면(또는 거의 정면)에 있고 두 마스트가 겹쳐 보인다 → 마주치는 상태. 두 선박 모두 피항선 (제14조(a)(b)).');
      else if(st.doubt) ui.setVerdict('홍등과 녹등이 번갈아 보인다(요잉·차광 한계 겹침). 마주치는 상태인지 의심스러우면 마주치는 상태로 보고 우현 변침한다 (제14조(c)).');
      else ui.setVerdict('마주치는 상태: 정선수에 마스트등 2개가 일직선 + 양 현등(홍·녹) → 두 선박 모두 피항선 (제14조(a)(b)).');
    } else if(st.t < TACT + 1.6){
      ui.setVerdict('단음 1회 = “나는 우현으로 변침하고 있다”. 두 선박이 각각 우현으로 변침한다 (제14조(a)).');
    } else {
      ui.setVerdict(st.night ? '이제 상대선의 홍등(좌현)만 보인다 → 서로 좌현 대 좌현(포트 투 포트)으로 안전하게 통과 (제14조(a)).'
                             : '상대선의 좌현이 보인다 → 서로 좌현 대 좌현(포트 투 포트)으로 안전하게 통과 (제14조(a)).', true);
    }
  }

  /* ---------- 컨트롤 ---------- */
  let hold = 0;
  const loop = W.ui.loop(ui.stage, dt => {
    if(st.t >= TEND){ hold += dt; if(hold > 1.6){ hold = 0; st.t = 0; } }
    else st.t = Math.min(TEND, st.t + dt*0.7);
    sT.set(st.t); draw();
  }, false);
  const playBtn = W.ui.btn(ui.controls, '재생', () => {
    if(loop.playing){ loop.pause(); playBtn.textContent = '재생'; }
    else { if(st.t >= TEND) st.t = 0; loop.play(); playBtn.textContent = '일시정지'; }
  }, 'primary');
  W.ui.btn(ui.controls, '처음으로', () => { st.t = 0; sT.set(0); draw(); });
  const sT = W.ui.range(ui.controls, { label: '시간', min: 0, max: TEND, step: 0.1, value: 0, fmt: v => `${v.toFixed(1)}분`, oninput: v => { st.t = v; draw(); } });
  W.ui.seg(ui.controls, [{ value: true, label: '야간' }, { value: false, label: '주간' }], true, v => { st.night = v; draw(); }, '시간대');
  W.ui.seg(ui.controls, [{ value: false, label: '정면' }, { value: true, label: '거의 정면(의심)' }], false, v => { st.doubt = v; draw(); }, '상대선');
  const setD = W.ui.stat(ui.readout, '거리');
  const setCpa = W.ui.stat(ui.readout, '예상 CPA');
  const setSeen = W.ui.stat(ui.readout, '보이는 등');

  draw();
});

}catch(e){console.error("[load] src/sims/headon-night.js", e)}
</script>
<script>/* src/sims/history-timeline.js */
try{
/* COLREG 역사 연표 — 연도를 누르면 설명. 넓은 화면은 가로 연표(SVG), 좁은 화면은 세로 목록 */
W.sim('history-timeline', (el) => {
  const ui = W.ui.box(el, { title:'COLREG 역사 연표', kind:'그림',
    caption:'연도를 누르면 설명이 나온다. 출처: 2주차 슬라이드 10~13, 정리본 1장 「COLREG의 역사」.' });

  const ERAS = [
    { key:'nat',   label:'각국 규칙' },
    { key:'intl',  label:'국제 통일 규칙' },
    { key:'solas', label:'SOLAS 시대' },
    { key:'c72',   label:'COLREG 72' },
    { key:'amd',   label:'개정' }
  ];
  const EV = [
    { y:'1838', era:'nat', t:'미국, 증기선 등화 규정',
      d:'미국 연방의회가 일몰부터 일출 사이에 운항하는 증기선은 등화를 하나 이상 표시하도록 정했다. 나라마다 따로 만든 개별 통항규칙의 예다.', src:'2주차 슬라이드 10' },
    { y:'1840', era:'nat', t:'트리니티 하우스 항행규칙',
      d:'런던의 트리니티 하우스(Trinity House)가 동력선과 범선의 항행 관행을 정리해 항행규칙을 마련했고, 이것이 입법되었다. 서로 좌현을 마주하며 지나가는 포트투포트 관행이 규칙으로 자리 잡았다.', src:'2주차 슬라이드 10' },
    { y:'1846', era:'nat', t:'영국 기선항해법',
      d:'영국 의회가 기선항해법(Steam Navigation Act)을 제정했다. 범선들 사이의 관습을 법으로 만든 최초의 성문 항법이다.', src:'정리본 1장 / 2주차 슬라이드 10' },
    { y:'1848', era:'nat', t:'현등·마스트등 규정',
      d:'기선은 현등을 홍등(좌현)과 녹등(우현)으로 하고 백색 마스트등을 달도록 정했다.', src:'2주차 슬라이드 10' },

  const prev = W.ui.btn(ui.controls, '이전', () => pick(Math.max(0, sel-1)));

  function pick(i){ sel = i; render(); }

  /* ---------- 가로 연표 (SVG) ---------- */
  function horizontal(){
    const svg = W.svg('svg', { viewBox:'0 0 720 236', role:'img', 'aria-label':'COLREG 역사 가로 연표' });
    const gap = 26, eraGap = 18;
    let x = 34, lastEra = EV[0].era;
    const xs = EV.map(e => { if(e.era !== lastEra){ x += eraGap; lastEra = e.era; } const v = x; x += gap; return v; });
    const axisY = 122;
    let s = `<line x1="16" y1="${axisY}" x2="704" y2="${axisY}" stroke="var(--ink-3)" stroke-width="2"/>`;
    /* 시기 띠 */
    ERAS.forEach((er, k) => {
      const idx = EV.map((e,i) => e.era === er.key ? i : -1).filter(i => i >= 0);
      const x1 = xs[idx[0]] - 11, x2 = xs[idx[idx.length-1]] + 11;
      const on = EV[sel].era === er.key;
      s += `<rect x="${x1}" y="196" width="${x2-x1}" height="28" rx="6" fill="${on ? 'var(--link)' : 'var(--panel)'}" opacity="${on ? .16 : .85}" stroke="${on ? 'var(--link)' : 'var(--rule)'}"/>`;
      s += `<text x="${(x1+x2)/2}" y="215" text-anchor="middle" font-size="12.5" font-family="var(--f-body)" font-weight="${on?700:500}" fill="${on ? 'var(--ink)' : 'var(--ink-2)'}">${er.label}</text>`;
    });
    svg.innerHTML = s;
    EV.forEach((e, i) => {
      const up = i % 2 === 0, on = i === sel;
      const ty = up ? axisY - 34 : axisY + 46;
      const g = W.svg('g', { tabindex:'0', role:'button', 'aria-label':`${e.y}년 ${e.t}`, style:'cursor:pointer',
        onclick:() => pick(i), onkeydown:ev => { if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); pick(i); } } });
      g.innerHTML =
        `<rect x="${xs[i]-13}" y="${up ? axisY-58 : axisY-12}" width="26" height="72" fill="transparent"/>` +
        `<line x1="${xs[i]}" y1="${axisY}" x2="${xs[i]}" y2="${up ? ty+6 : ty-16}" stroke="${on ? 'var(--link)' : 'var(--ink-3)'}" stroke-width="${on?2:1}"/>` +
        `<circle cx="${xs[i]}" cy="${axisY}" r="${on ? 9 : e.key ? 7 : 5.5}" fill="${on ? 'var(--link)' : e.key ? 'var(--ink)' : 'var(--panel)'}" stroke="${on ? 'var(--link)' : 'var(--ink-2)'}" stroke-width="2"/>` +
        `<text x="${xs[i]}" y="${ty}" text-anchor="middle" font-size="${on ? 14 : 12.5}" font-weight="${on || e.key ? 700 : 500}" font-family="var(--f-mono)" fill="${on ? 'var(--link)' : 'var(--ink)'}">${e.y}</text>`;
      svg.append(g);
    });
    /* 선택 연도 짧은 제목 */
    const tx = Math.min(600, Math.max(120, xs[sel]));
    svg.append(W.svg('text', { x:tx, y:30, 'text-anchor':'middle', 'font-size':16, 'font-weight':700, 'font-family':'var(--f-body)', fill:'var(--ink)', text:`${EV[sel].y} · ${EV[sel].t}` }));
    return svg;
  }

  /* ---------- 세로 목록 (좁은 화면) ---------- */
  function vertical(){
    const wrap = W.h('div', { style:{ padding:'10px 12px 12px 14px', background:'var(--paper)' } });
    let lastEra = '';
    EV.forEach((e, i) => {
      if(e.era !== lastEra){
        lastEra = e.era;
        wrap.append(W.h('div', { text:ERAS.find(r => r.key === e.era).label,
          style:{ fontSize:'12px', fontWeight:'600', letterSpacing:'.05em', color:'var(--ink-3)', margin:'10px 0 2px 26px' } }));
      }
      const on = i === sel;
      const row = W.h('button', { type:'button', 'aria-expanded':on ? 'true' : 'false', onclick:() => pick(i),
        style:{ display:'flex', alignItems:'baseline', gap:'10px', width:'100%', textAlign:'left', background:'transparent', border:'0',
          borderLeft:'2px solid ' + (on ? 'var(--link)' : 'var(--rule)'), padding:'6px 4px 6px 14px', marginLeft:'8px', cursor:'pointer',
          color:'var(--ink)', font:'inherit', position:'relative' } },
        W.h('span', { style:{ position:'absolute', left:'-7px', top:'13px', width:'12px', height:'12px', borderRadius:'50%',
          background:on ? 'var(--link)' : e.key ? 'var(--ink)' : 'var(--panel)', border:'2px solid ' + (on ? 'var(--link)' : 'var(--ink-2)'), boxSizing:'border-box' } }),
        W.h('span', { text:e.y, style:{ fontFamily:'var(--f-mono)', fontWeight:'700', fontSize:'14px', color:on ? 'var(--link)' : 'var(--ink)', minWidth:'40px' } }),
        W.h('span', { text:e.t, style:{ fontSize:'14.5px', fontWeight:on ? '700' : '500' } }));
      wrap.append(row);
      if(on){ desc.style.margin = '4px 0 8px 10px'; desc.style.border = '1px solid var(--rule)'; desc.style.borderRadius = '8px'; wrap.append(desc); }
    });
    return wrap;
  }

  function render(){
    ui.stage.innerHTML = '';
    if(mode !== 'v'){ Object.assign(desc.style, { margin:'0', border:'0', borderTop:'1px solid var(--rule)', borderRadius:'0' }); ui.stage.after(desc); }
    ui.stage.append(mode === 'v' ? vertical() : horizontal());
    const e = EV[sel];
    desc.innerHTML = '';
    desc.append(
      W.h('div', { style:{ display:'flex', gap:'10px', alignItems:'baseline', flexWrap:'wrap' } },
        W.h('span', { text:e.y, style:{ fontFamily:'var(--f-mono)', fontSize:'22px', fontWeight:'700', color:'var(--link)' } }),
        W.h('b', { text:e.t, style:{ fontSize:'16px' } })),
      W.h('p', { text:e.d, style:{ margin:'6px 0 4px', fontSize:'15px', lineHeight:'1.65' } }),
      W.h('div', { text:'출처: ' + e.src, style:{ fontSize:'12px', color:'var(--ink-3)' } })
    );
    showYear(e.y + '년');
    showEra(ERAS.find(r => r.key === e.era).label);
    prev.disabled = sel === 0; next.disabled = sel === EV.length - 1;
  }

  function fit(){
    const w = el.clientWidth || 800;
    const m = w < 560 ? 'v' : 'h';
    if(m !== mode){ mode = m; render(); }
  }
  fit();
  if(typeof ResizeObserver !== 'undefined') new ResizeObserver(fit).observe(el);
});

}catch(e){console.error("[load] src/sims/history-timeline.js", e)}
</script>
<script>/* src/sims/light-arcs.js */

W.sim('light-arcs', (el) => {
  const N = W.nav;
  const ui = W.ui.box(el, {
    title: '등화의 조사각: 어디서 보면 어떤 등이 보이나', kind: '해보기',
    caption: '대상선(가운데, 길이 50m 이상 동력선, 선수 = 위)의 등화: 마스트등 225°(백), 현등 각 112.5°(좌현 홍·우현 녹), 선미등 135°(백). ' +
      '경계선은 모두 <b>정횡 후 22.5°</b>(= 112.5°, 247.5°). 관측선(내 배)을 끌어 돌려 보고, 오른쪽 야경에서 실제로 보이는 모습을 확인하세요. ' +
      '제13조(b): 정횡 후 22.5°를 넘는 뒤쪽 — 밤에 <b>선미등만 보이고 현등은 안 보이는 위치</b> — 에서 따라잡으면 추월선. (c) 의심스러우면 추월선으로 보고 행동한다.'
  });

  /* ---------- 무대: 평면도 + 야경 (좁은 화면에서는 위아래로 쌓임) ---------- */
  const wrap = W.h('div', { style: { display: 'flex', flexWrap: 'wrap', alignItems: 'stretch' } });
  const planBox = W.h('div', { style: { flex: '1 1 340px', minWidth: '0' } });
  const nightBox = W.h('div', { style: { flex: '1 1 280px', minWidth: '0', background: 'var(--night)', display: 'flex', alignItems: 'center' } });
  wrap.append(planBox, nightBox); ui.stage.append(wrap);
  const plan = W.svg('svg', { viewBox: '0 0 420 420', role: 'img', 'aria-label': '대상선 등화 조사각 평면도', style: 'touch-action:none' });
  const night = W.svg('svg', { viewBox: '0 0 320 260', role: 'img', 'aria-label': '관측선에서 본 대상선 야경' });
  planBox.append(plan); nightBox.append(night);

  const C = { x: 210, y: 214 }, RMIN = 78, RMAX = 190;
  const st = { rb: 225, r: 160, approach: true, hull: true };

  const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.fs||12.5}" font-family="${o.mono?'var(--f-mono)':'var(--f-body)'}" font-weight="${o.w||500}" text-anchor="${o.a||'middle'}" fill="${o.fill||'var(--ink)'}"${o.halo===false?'':' stroke="var(--sea)" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round"'}>${s}</text>`;
  const pol = (deg, r) => ({ x: C.x + Math.sin(N.rad(deg))*r, y: C.y - Math.cos(N.rad(deg))*r });
  const wedge = (from, to, r, attrs) => {
    const a = pol(from, r), b = pol(to, r), large = N.norm(to - from) > 180 ? 1 : 0;
    return `<path d="M${C.x} ${C.y} L${a.x} ${a.y} A${r} ${r} 0 ${large} 1 ${b.x} ${b.y} Z" ${attrs}/>`;
  };

  /* ---------- 대상선 3D 모형 (x=우현, y=선수, z=위, 단위 m, 길이 100m) ---------- */
  const LIGHTS = {
    mastF: { x: 0, y: 25, z: 22 },  mastA: { x: 0, y: -15, z: 30 },   // 후부 마스트등이 4.5m 이상 높음
    port:  { x: -8, y: -8, z: 15 },  stbd:  { x: 8, y: -8, z: 15 },
    stern: { x: 0, y: -49, z: 8 }
  };
  const HULL = [[0,50],[6,38],[8,20],[8,-40],[6,-50],[-6,-50],[-8,-40],[-8,20],[-6,38]];

  function view(){
    // 관측선 쪽에서 대상선을 바라봄: 시선의 오른쪽 벡터 = (-cos rb, sin rb) (대상선 좌표)
    const rb = st.rb, rx = -Math.cos(N.rad(rb)), ry = Math.sin(N.rad(rb));
    return p => p.x*rx + p.y*ry;
  }

  function drawPlan(seen){
    let s = '';
    // 조사각 부채꼴
    s += wedge(112.5, 247.5, 176, `fill="var(--ink-3)" fill-opacity=".16" stroke="var(--magenta)" stroke-width="1.6" stroke-dasharray="6 5"`);
    s += wedge(247.5, 112.5 + 360, 190, `fill="var(--light-white)" fill-opacity=".32" stroke="var(--ink-3)" stroke-dasharray="3 4"`);
    s += wedge(0, 112.5, 150, `fill="var(--stbd)" fill-opacity=".24"`);
    s += wedge(247.5, 360, 150, `fill="var(--port)" fill-opacity=".24"`);
    // 정횡선, 경계선
    [90, 270].forEach(d => { const p = pol(d, 196); s += `<line x1="${C.x}" y1="${C.y}" x2="${p.x}" y2="${p.y}" stroke="var(--ink-3)" stroke-dasharray="1 4"/>`; });
    [112.5, 247.5].forEach(d => { const p = pol(d, 200); s += `<line x1="${C.x}" y1="${C.y}" x2="${p.x}" y2="${p.y}" stroke="var(--magenta)" stroke-width="1.6"/>`; });
    // 라벨
    const lab = (d, r, t, o) => { const p = pol(d, r); return T(p.x, p.y + 4, t, o); };
    const near = d => Math.abs(N.signed(st.rb - d)) < 22;
    if(!near(0)) s += lab(0, 172, '마스트등 225°', { fs: 12.5, w: 600 });
    s += lab(50, 100, '우현등(녹)', { fs: 12.5, fill: 'var(--stbd)', w: 600 }) + lab(50, 100, '112.5°', { fs: 12, mono: true, fill: 'var(--stbd)' }).replace(/y="([\d.]+)"/, (m, v) => `y="${+v + 16}"`);
    s += lab(310, 100, '좌현등(홍)', { fs: 12.5, fill: 'var(--port)', w: 600 }) + lab(310, 100, '112.5°', { fs: 12, mono: true, fill: 'var(--port)' }).replace(/y="([\d.]+)"/, (m, v) => `y="${+v + 16}"`);
    s += lab(180, 120, '선미등 135°', { fs: 12.5, w: 600 }) + lab(180, 137, '추월 구역', { fs: 12, fill: 'var(--magenta)', w: 600 });
    if(!near(90)) s += T(C.x + 178, C.y - 6, '정횡', { fs: 11.5, fill: 'var(--ink-2)' });
    if(!near(270)) s += T(C.x - 178, C.y - 6, '정횡', { fs: 11.5, fill: 'var(--ink-2)' });
    s += T(414, 312, '정횡 후 22.5°', { fs: 11.5, fill: 'var(--magenta)', a: 'end' });
    s += T(6, 312, '정횡 후 22.5°', { fs: 11.5, fill: 'var(--magenta)', a: 'start' });
    // 대상선
    s += `<g transform="translate(${C.x} ${C.y})">${W.parts.ship({ type: 'power', len: 46, role: seen.zone === 'stern' && st.approach ? 'standon' : null })}` +
         `${W.parts.light('white', 2.6, 0, -9)}${W.parts.light('port', 2.4, -6, 2)}${W.parts.light('stbd', 2.4, 6, 2)}${W.parts.light('white', 2.4, 0, 22)}</g>`;
    s += T(C.x + 30, C.y + 4, '대상선', { fs: 12, a: 'start', fill: 'var(--ink-2)' });
    // 관측선
    const o = pol(st.rb, st.r), hd = st.approach ? N.norm(st.rb + 180) : st.rb;
    const giveway = seen.zone === 'stern' && st.approach;
    s += `<line x1="${C.x}" y1="${C.y}" x2="${o.x}" y2="${o.y}" stroke="var(--link)" stroke-width="1.2" stroke-dasharray="2 3"/>`;
    s += `<g transform="translate(${o.x} ${o.y}) rotate(${hd})" style="cursor:grab" data-drag="obs"><circle r="26" fill="transparent"/>` +
         `<circle r="22" fill="var(--link)" fill-opacity=".10" stroke="var(--link)" stroke-dasharray="3 3"/>` +
         `${W.parts.ship({ type: 'power', len: 30, role: giveway ? 'giveway' : null, stroke: 'var(--link)' })}</g>`;
    const ly = o.y > C.y ? o.y + 38 : o.y - 30;
    s += T(o.x, ly, '내 배(관측선)', { fs: 12.5, w: 600, fill: giveway ? 'var(--giveway)' : 'var(--link)' });
    s += T(o.x, ly + 15, `상대방위 ${st.rb.toFixed(1)}°`, { fs: 11.5, mono: true, fill: 'var(--ink-2)' });
    s += T(8, 16, '내 배를 끌어서 돌려 보기', { fs: 11.5, a: 'start', fill: 'var(--ink-2)' });
    plan.innerHTML = s;
  }

  function drawNight(seen){
    const proj = view(), cx = 160, hz = 168, k = 2.1;   // k: px/m
    const P = p => ({ x: cx + proj(p)*k, y: hz - p.z*k });
    let s = `<rect width="320" height="260" fill="var(--night)"/>`;
    s += `<text x="12" y="22" font-size="13" font-weight="600" font-family="var(--f-body)" fill="var(--night-ink)">내 배에서 본 대상선 (야간)</text>`;
    s += `<line x1="0" y1="${hz + 6}" x2="320" y2="${hz + 6}" stroke="var(--night-ink)" stroke-opacity=".18"/>`;
    if(st.hull){
      // 희미한 선체 윤곽 (실제 밤에는 거의 안 보임)
      const xs = HULL.map(([x, y]) => proj({ x, y }));
      const x0 = cx + Math.min(...xs)*k, x1 = cx + Math.max(...xs)*k;
      const bow = proj({ x: 0, y: 50 }), stern = proj({ x: 0, y: -50 });
      const bx = cx + bow*k, sx = cx + stern*k, dk = hz - 7*k, wl = hz + 4;
      const tip = Math.abs(bow - stern) > 30 ? bx : null;
      let hull = tip == null ? `M${x0} ${dk} L${x1} ${dk} L${x1 - 3} ${wl} L${x0 + 3} ${wl} Z`
        : `M${bx} ${dk - 4} L${sx} ${dk} L${sx} ${wl} L${bx + (sx - bx)*.1} ${wl} Z`;
      const sup = [{ x: -7, y: -22 }, { x: 7, y: -22 }, { x: -7, y: -42 }, { x: 7, y: -42 }].map(p => proj(p));
      const s0 = cx + Math.min(...sup)*k, s1 = cx + Math.max(...sup)*k;
      s += `<g fill="var(--night-ink)" fill-opacity=".13" stroke="var(--night-ink)" stroke-opacity=".3" stroke-width="1">` +
           `<path d="${hull}"/><rect x="${s0}" y="${hz - 18*k}" width="${Math.max(4, s1 - s0)}" height="${11*k}"/>` +
           `</g>`;
      const mf = P(LIGHTS.mastF), ma = P(LIGHTS.mastA);
      s += `<g stroke="var(--night-ink)" stroke-opacity=".3" stroke-width="1.4"><line x1="${mf.x}" y1="${mf.y}" x2="${mf.x}" y2="${dk}"/><line x1="${ma.x}" y1="${ma.y}" x2="${ma.x}" y2="${hz - 18*k}"/></g>`;
    }
    // 등화 (먼 쪽을 먼저)
    const on = [];
    if(seen.masthead){ on.push(['white', LIGHTS.mastF]); on.push(['white', LIGHTS.mastA]); }
    if(seen.port) on.push(['port', LIGHTS.port]);
    if(seen.stbd) on.push(['stbd', LIGHTS.stbd]);
    if(seen.stern) on.push(['white', LIGHTS.stern]);
    on.forEach(([c, p]) => { const q = P(p); s += W.parts.light(c, 4.2, q.x, q.y); });
    // 아래 설명
    const names = [];
    if(seen.masthead) names.push('마스트등 2(백)');
    if(seen.port) names.push('좌현등(홍)');
    if(seen.stbd) names.push('우현등(녹)');
    if(seen.stern) names.push('선미등(백)');
    s += `<text x="12" y="212" font-size="13" font-family="var(--f-body)" fill="var(--night-ink)">보이는 등: <tspan font-weight="600">${names.join(' · ')}</tspan></text>`;
    s += `<text x="12" y="236" font-size="12.5" font-family="var(--f-body)" fill="var(--night-ink)" fill-opacity=".8">${aspect()}</text>`;
    night.innerHTML = s;
  }

  function aspect(){
    const rb = st.rb, bowRight = Math.sin(N.rad(rb));
    if(rb < 3 || rb > 357) return '대상선이 나를 향해 정면으로 온다';
    if(Math.abs(rb - 180) < 3) return '대상선의 정선미를 보고 있다';
    const side = rb < 180 ? '우현' : '좌현';
    const dir = bowRight > 0 ? '오른쪽' : '왼쪽';
    const toward = Math.cos(N.rad(rb)) > 0 ? '다가오며' : '멀어지며';
    return `${side}을 보고 있다 · 선수는 내 ${dir}(${toward})`;
  }

  function where(rb){
    const s = N.signed(rb), side = s >= 0 ? '우현' : '좌현', a = Math.abs(s);
    if(a < 0.5) return '정선수';
    if(a > 179.5) return '정선미';
    if(Math.abs(a - 90) < 0.25) return `${side} 정횡`;
    if(a < 90) return `선수에서 ${side} ${a.toFixed(1)}°`;
    return `${side} 정횡 후 ${(a - 90).toFixed(1)}°`;
  }

  function draw(){
    const L = N.lightsSeen(pol2nav(), { x: 0, y: 0, heading: 0 });
    if(L.rb < 0.25 || L.rb > 359.75){ L.port = true; L.stbd = true; }   // 정선수: 양 현등이 함께 보임 (W.nav.lightsSeen 은 rb=0 에서 녹등만 줌)
    const rb = L.rb;
    const zone = L.stern ? 'stern' : 'fwd';
    const seen = Object.assign({}, L, { zone });
    drawPlan(seen); drawNight(seen);
    setRb(`${rb.toFixed(1)}° (${where(rb)})`);
    const nm = [];
    if(L.masthead) nm.push('마스트등'); if(L.port) nm.push('홍'); if(L.stbd) nm.push('녹'); if(L.stern) nm.push('선미등');
    setSeen(nm.join('·'));
    const nearEdge = Math.min(Math.abs(rb - 112.5), Math.abs(rb - 247.5)) < 4;
    if(nearEdge && st.approach){
      ui.setVerdict(`경계(정횡 후 22.5°) 부근: 현등과 선미등이 번갈아 보일 수 있다 → 추월선인지 의심스러우면 추월선으로 보고 피한다 (제13조(c)).`, false);
    } else if(zone === 'stern' && st.approach){
      ui.setVerdict(`추월선: 내 배 — 정횡 후 22.5°보다 뒤에서 따라잡는 중, 선미등만 보인다. 완전히 추월해 충분히 멀어질 때까지 피한다 (제13조(a)(b)). 이후 방위가 바뀌어도 횡단 관계가 되지 않는다 (제13조(d)).`, false);
    } else if(zone === 'stern'){
      ui.setVerdict('선미등만 보이지만 멀어지는 중 — 따라잡는 것이 아니므로 추월 관계가 아니다.');
    } else {
      ui.setVerdict(`추월 아님: 현등이 보이는 위치 (정횡 후 22.5°보다 앞). 침로에 따라 마주침(제14조)·횡단(제15조)으로 판단한다.`);
    }
  }
  // 관측선 위치(해리 단위는 상관없음, 방향만 중요): 대상선(0,0) 침로 000
  function pol2nav(){ return { x: Math.sin(N.rad(st.rb))*st.r, y: Math.cos(N.rad(st.rb))*st.r }; }

  /* ---------- 컨트롤 ---------- */
  const sRb = W.ui.range(ui.controls, { label: '내 배 위치(대상선 기준 상대방위)', min: 0, max: 359.5, step: 0.5, value: st.rb, fmt: v => v.toFixed(1) + '°', oninput: v => { st.rb = v; draw(); } });
  W.ui.seg(ui.controls, [{ value: true, label: '대상선 쪽으로 접근' }, { value: false, label: '멀어짐' }], true, v => { st.approach = v; draw(); }, '내 배 움직임');
  W.ui.seg(ui.controls, [{ value: true, label: '보기' }, { value: false, label: '숨기기' }], true, v => { st.hull = v; draw(); }, '선체 윤곽');
  const quick = W.h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '6px' } });
  ui.controls.append(quick);
  [[0, '정선수'], [60, '우현 60°'], [112.5, '112.5°'], [150, '추월 위치'], [180, '정선미'], [270, '좌현 정횡']].forEach(([v, t]) =>
    W.ui.btn(quick, t, () => { st.rb = v; sRb.set(v); draw(); }));
  const setRb = W.ui.stat(ui.readout, '상대방위(대상선 선수 기준)');
  const setSeen = W.ui.stat(ui.readout, '보이는 등');

  /* ---------- 드래그 ---------- */
  let drag = false;
  const pt = e => { const p = plan.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(plan.getScreenCTM().inverse()); };
  plan.addEventListener('pointerdown', e => {
    const p = pt(e);
    if(!e.target.closest('[data-drag]') && Math.hypot(p.x - C.x, p.y - C.y) < RMIN - 20) return;
    drag = true; plan.setPointerCapture(e.pointerId); e.preventDefault(); move(e);
  });
  const move = e => {
    if(!drag) return;
    const p = pt(e);
    let rb = N.norm(N.deg(Math.atan2(p.x - C.x, -(p.y - C.y))));
    rb = Math.round(rb*2)/2 % 360;
    if(rb < 1.5 || rb > 358.5) rb = 0;                     // 정선수 근처는 양현등이 함께 보이는 위치로 맞춤
    st.rb = rb; st.r = Math.max(RMIN, Math.min(RMAX, Math.hypot(p.x - C.x, p.y - C.y)));
    sRb.set(rb); draw();
  };
  plan.addEventListener('pointermove', move);
  const stop = () => { drag = false; };
  plan.addEventListener('pointerup', stop); plan.addEventListener('pointercancel', stop);

  draw();
});

}catch(e){console.error("[load] src/sims/light-arcs.js", e)}
</script>
<script>/* src/sims/lights-cards.js */

      '측면에서 동력선의 두 마스트등은 <b>낮은 쪽(전부)이 선수</b>. 자세한 조문(제20조 이하)은 중간고사 후 범위 — 여기서는 요약만 익힌다.'

    const f = bow === 'l' ? -1 : 1, X = d => 180 + f*d;
    return { X, fwdMast: X(60), aftMast: X(-30), sl: X(15), stern: X(-108), bow: X(110) };

  /* ---------- 카드 ----------
     view: head | stern | side-l | side-r (선수 방향), lights or shapes, opts 4개(첫 번째가 정답), why, rule */
  const PD50 = '항행 중인 동력선(길이 50m 이상)', PD = '항행 중인 동력선(길이 50m 미만)', SV = '항행 중인 범선';
  const NUCW = '조종불능선(대수속력 있음)', NUC0 = '조종불능선(대수속력 없음)', RAM0 = '조종제한선(대수속력 없음)';

  const ANC = '정박선(길이 50m 이상)', TOW = '예인 중인 동력선', PILOT = '도선 업무 중인 도선선';
  const s1 = side('l'), s2 = side('r');
  const CARDS = [
    { id: 'pd-head', kind: 'night', view: 'head', aspect: '정선수 방향에서 봄',
      lights: [L('white', 180, 104, '전부 마스트등', 'l'), L('white', 180, 78, '후부 마스트등(더 높음)', 'l'), L('port', 204, 132, '좌현등', 'r'), L('stbd', 156, 132, '우현등', 'l')],
      opts: [PD50, SV, ANC, NUCW], rule: '제23조(a)·제14조',

    { id: 'stern', kind: 'night', view: 'stern', aspect: '선미 방향에서 봄',
      lights: [L('white', 180, 150, '선미등(135°)', 'r')],
      opts: ['항행 중인 선박의 선미 쪽(선미등)', TOW, NUC0, CBD], rule: '제21조(c)·제13조(b)',
      why: '선미등(백, 135°)만 보이면 상대의 정횡 후 22.5°보다 뒤쪽에 있는 것 → 내가 따라잡고 있다면 추월선(제13조). 예인선이라면 선미등 위에 황색 예선등이 함께 보인다. (정박한 50m 미만 선박의 백색 전주등도 백등 하나로 보이므로 실제로는 방위 변화로 확인한다.)' },

    { id: 'sail-green', kind: 'night', view: 'side-r', hull: 'sail', aspect: '측면에서 봄',

      opts: [SV, PD, TRW, NUCW], rule: '제25조(a)',
      why: '녹등 하나만 보인다 → 마스트등이 없는 범선의 우현 현등. 내가 동력선이면 범선을 피해야 한다(제18조). 꼭 우현 변침일 필요는 없고, 범선이 내 앞을 지나갈 방향이면 범선 뒤로 돌아가도 된다.' },
    { id: 'sail-rg', kind: 'night', view: 'side-l', hull: 'sail', aspect: '측면에서 봄',
      lights: [...stack(['port', 'stbd'], 180, 40, 18, '홍 위 녹 전주등', 'r'), L('port', 140, 140, '좌현등(홍)', 'r')],
      opts: [SV, TRW, FSH0, NUCW], rule: '제25조(c)',
      why: '마스트 꼭대기의 홍색 위 녹색 전주등(선택 사항) + 현등 → 범선. 녹색 위 백색은 트롤, 홍색 위 백색은 트롤 외 어로, 홍·홍은 조종불능선.' },
    { id: 'nuc0', kind: 'night', view: 'head', aspect: '방향 불명',
      lights: stack(['port', 'port'], 180, 92, 20, '홍색 전주등 2개', 'r'),
      opts: [NUC0, NUCW, CBD, RAM0], rule: '제27조(a)',
      why: '홍색 전주등 2개를 수직으로 → 조종불능선. 현등·선미등이 안 보이면 대수속력이 없다. 마스트등은 켜지 않는다. 주간 형상물은 흑구 2개.' },
    { id: 'nucw', kind: 'night', view: 'head', aspect: '정선수 방향에서 봄',
      lights: [...stack(['port', 'port'], 180, 84, 20, '홍색 전주등 2개', 'r'), L('port', 204, 136, '좌현등', 'r'), L('stbd', 156, 136, '우현등', 'l')],
      opts: [NUCW, NUC0, CBD, SV], rule: '제27조(a)',
      why: '홍·홍 전주등 + 현등 → 대수속력이 있는 조종불능선(대수속력이 있으면 현등·선미등을 추가). 마스트등이 없다는 점에 주의.' },
    { id: 'ram0', kind: 'night', view: 'head', aspect: '방향 불명',
      lights: stack(['port', 'white', 'port'], 180, 82, 20, '홍·백·홍 전주등', 'r'),
      opts: [RAM0, NUC0, FSH0, PILOT], rule: '제27조(b)',
      why: '홍·백·홍 수직 → 조종제한선(준설·측량·수중작업 등). 대수속력이 있으면 마스트등·현등·선미등을 추가한다. 주간 형상물은 흑구·마름모·흑구.' },
    { id: 'cbd', kind: 'night', view: 'side-r', aspect: '측면에서 봄',
      lights: [L('white', s2.fwdMast, 108, '전부 마스트등', 'r'), L('white', s2.aftMast, 76, '후부 마스트등', 'l'), ...stack(['port', 'port', 'port'], s2.aftMast, 100, 16, '홍색 전주등 3개', 'l'), L('stbd', 205, 140, '우현등', 'r')],
      opts: [CBD, NUCW, '조종제한선(대수속력 있음)', '트롤 외 어로 중인 선박(대수속력 있음)'], rule: '제28조',
      why: '동력선 등화(마스트등 2·현등) + 홍색 전주등 3개 수직 → 흘수제약선(표시할 수 있다). 주간 형상물은 원통형 1개.' },
    { id: 'trawl', kind: 'night', view: 'head', aspect: '정선수 방향에서 봄',
      lights: [...stack(['stbd', 'white'], 180, 86, 20, '녹 위 백 전주등', 'r'), L('port', 204, 136, '좌현등', 'r'), L('stbd', 156, 136, '우현등', 'l')],
      opts: [TRW, '트롤 외 어로 중인 선박(대수속력 있음)', SV, PILOT], rule: '제26조(b)',
      why: '녹색 위 백색 전주등 → 트롤 어로 중(“Green over white, trawling tonight”). 대수속력이 있으면 현등·선미등 추가. 길이 50m 이상이면 녹등보다 뒤쪽·더 높이 마스트등도 단다.' },
    { id: 'fish0', kind: 'night', view: 'head', aspect: '방향 불명',
      lights: stack(['port', 'white'], 180, 96, 20, '홍 위 백 전주등', 'r'),
      opts: [FSH0, TRW0, PILOT, RAM0], rule: '제26조(c)',
      why: '홍색 위 백색 → 트롤 외 어로 중(“Red over white, fishing at night”). 현등이 없으면 대수속력이 없다. 위아래가 바뀐 백색 위 홍색은 도선선, 녹색 위 백색은 트롤.' },
    { id: 'anchor', kind: 'night', view: 'side-l', aspect: '측면에서 봄',
      lights: [Object.assign(L('white', s1.bow + 18, 92, '앞쪽 백색 전주등(높음)', 'r'), { pole: true }), Object.assign(L('white', s1.stern - 6, 128, '뒤쪽 백색 전주등(낮음)', 'l'), { pole: true })],
      opts: [ANC, PD50, TOW, NUC0], rule: '제30조(a)',
      why: '선수부에 백색 전주등, 선미 쪽에 그보다 낮은 백색 전주등 → 정박선(50m 이상). 항행 중인 동력선은 반대로 뒤쪽(후부 마스트등)이 더 높고 현등이 보인다. 주간 형상물은 선수부 흑구 1개.' },
    { id: 'tow-stern', kind: 'night', view: 'stern', aspect: '선미 방향에서 봄',
      lights: [L('yellow', 180, 130, '예선등(황)', 'r'), L('white', 180, 150, '선미등', 'r')],
      opts: [TOW, '항행 중인 선박의 선미 쪽(선미등)', FSH0, RAM0], rule: '제24조(a)',
      why: '선미등 위에 황색 예선등(선미등과 같은 135°) → 무언가를 끌고 있는 예인선. 예인선과 피예인물 사이 줄은 수백 m일 수 있으니 그 사이를 가로지르지 말 것.' },
    { id: 'tow-side', kind: 'night', view: 'side-r', aspect: '측면에서 봄',
      oneMast: true, lights: [...stack(['white', 'white'], s2.fwdMast, 88, 18, '한 마스트에 마스트등 2개', 'l'), L('stbd', 205, 136, '우현등', 'l')],
      opts: ['예인 중인 동력선(예인 길이 200m 이하)', PD50, ANC, NUCW], rule: '제24조(a)',
      why: '한 마스트에 마스트등 2개를 수직으로 → 예인 중(예인 길이가 200m를 넘으면 3개). 50m 이상 동력선의 두 마스트등은 앞뒤로 떨어져 있고 뒤쪽이 높다.' },
    // ---- 주간 형상물 ----
    { id: 'd-nuc', kind: 'day', mast: 240, shapes: ['ball', 'ball'], aspect: '주간',
      opts: ['조종불능선', '조종제한선', '정박선', '어로에 종사하고 있는 선박'], rule: '제27조(a)',
      why: '흑구 2개를 수직으로 → 조종불능선(야간에는 홍·홍). 흑구 1개는 정박선, 흑구·마름모·흑구는 조종제한선.' },
    { id: 'd-ram', kind: 'day', mast: 240, shapes: ['ball', 'diamond', 'ball'], aspect: '주간',
      opts: ['조종제한선', '조종불능선', '흘수제약선', '예인 중(예인 길이 200m 초과)'], rule: '제27조(b)',
      why: '흑구·마름모·흑구 → 조종제한선(야간에는 홍·백·홍). 마름모 하나만이면 예인 길이 200m 초과 예인.' },
    { id: 'd-cbd', kind: 'day', mast: 240, shapes: ['cylinder'], aspect: '주간',
      opts: ['흘수제약선', '정박선', '조종불능선', '기관을 함께 사용하는 범선'], rule: '제28조',
      why: '원통형(실린더) 1개 → 흘수제약선(야간에는 홍색 전주등 3개).' },
    { id: 'd-fish', kind: 'day', mast: 240, shapes: ['cones-apex'], aspect: '주간',
      opts: ['어로에 종사하고 있는 선박', '기관을 함께 사용하는 범선', '조종제한선', '흘수제약선'], rule: '제26조',
      why: '원뿔 2개를 꼭짓점끼리 맞댄 장구형 → 어로에 종사하고 있는 선박(트롤·트롤 외 공통). 야간에는 트롤 녹·백, 트롤 외 홍·백.' },
    { id: 'd-anchor', kind: 'day', mast: 120, shapes: ['ball'], aspect: '주간', bow: 'l',
      opts: ['정박선', '조종불능선', '흘수제약선', '어로에 종사하고 있는 선박'], rule: '제30조(a)',
      why: '선수부에 흑구 1개 → 정박선(야간에는 백색 전주등). 흑구 2개는 조종불능선.' },
    { id: 'd-motorsail', kind: 'day', mast: 112, shapes: ['cone-down'], aspect: '주간', bow: 'l', hull: 'sail',
      opts: ['기관을 함께 사용하는 범선', '어로에 종사하고 있는 선박', '정박선', '예인 중(예인 길이 200m 초과)'], rule: '제25조(e)',
      why: '꼭짓점이 아래인 원뿔 1개(앞쪽) → 돛과 기관을 함께 쓰는 범선. 규칙상 동력선으로 취급된다. 〔정정〕 “역삼각형 원뿔 = 범선”이 아니라 “기관을 쓰는 범선”이다.' },
    { id: 'd-tow', kind: 'day', mast: 240, shapes: ['diamond'], aspect: '주간',
      opts: ['예인 중(예인 길이 200m 초과)', '조종제한선', '흘수제약선', '정박선'], rule: '제24조(a)',
      why: '마름모 1개 → 예인 길이(예인선 선미~피예인물 후단)가 200m를 넘는 예인선(피예인물도 마름모). 흑구·마름모·흑구는 조종제한선.' }
  ];

  /* ---------- 그리기 ---------- */
  const st = { deck: [], i: 0, picked: null, score: 0, n: 0, filter: 'all', order: [] };
  const inkC = night => night ? 'var(--night-ink)' : 'var(--ink)';
  const tx = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.fs||12.5}" font-weight="${o.w||500}" font-family="var(--f-body)" text-anchor="${o.a||'start'}" fill="${o.fill}"${o.op?` fill-opacity="${o.op}"`:''}${o.halo?` stroke="${o.halo}" stroke-width="4" paint-order="stroke" stroke-linejoin="round"`:''}>${s}</text>`;

  function hullSide(bow, sail, col, op, oneMast){
    const f = bow === 'l' ? -1 : 1, X = d => 180 + f*d;
    if(sail) return `<g fill="${col}" fill-opacity="${op}" stroke="${col}" stroke-opacity="${Math.min(1, op*2)}">` +
      `<path d="M${X(-80)} ${WL - 14} L${X(90)} ${WL - 14} L${X(70)} ${WL + 2} L${X(-70)} ${WL + 2} Z"/>` +
      `<line x1="180" y1="${WL - 14}" x2="180" y2="40" stroke-width="2"/><path d="M180 48 L180 ${WL - 22} L${X(-70)} ${WL - 22} Z" fill-opacity="${op*.6}"/></g>`;
    return `<g fill="${col}" fill-opacity="${op}" stroke="${col}" stroke-opacity="${Math.min(1, op*2)}">` +
      `<path d="M${X(-110)} ${WL - 16} L${X(112)} ${WL - 22} L${X(98)} ${WL + 2} L${X(-106)} ${WL + 2} Z"/>` +
      `<rect x="${X(-30) - 22}" y="${WL - 46}" width="44" height="28"/>` +
      `<line x1="${X(60)}" y1="${WL - 22}" x2="${X(60)}" y2="100" stroke-width="2"/>` +
      (oneMast ? '' : `<line x1="${X(-30)}" y1="${WL - 46}" x2="${X(-30)}" y2="72" stroke-width="2"/>`) + `</g>`;
  }
  function hullHead(sail, col, op){
    let s = `<g fill="${col}" fill-opacity="${op}" stroke="${col}" stroke-opacity="${Math.min(1, op*2)}">` +
      `<path d="M150 ${WL - 18} L210 ${WL - 18} L198 ${WL + 2} L162 ${WL + 2} Z"/>`;
    s += sail ? `<line x1="180" y1="${WL - 18}" x2="180" y2="44" stroke-width="2"/>` : `<rect x="160" y="${WL - 44}" width="40" height="26"/><line x1="180" y1="${WL - 44}" x2="180" y2="70" stroke-width="2"/>`;
    return s + '</g>';
  }

  function drawCard(){
    const c = st.deck[st.i];
    const night = c.kind === 'night', done = st.picked != null;
    ui.stage.classList.toggle('night', night);
    const ink = inkC(night);
    let s = '';
    if(night){
      s += `<rect width="360" height="230" fill="var(--night)"/>`;
      s += `<line x1="0" y1="${WL + 4}" x2="360" y2="${WL + 4}" stroke="var(--night-ink)" stroke-opacity=".15"/>`;
      // 정답 공개 후 희미한 선체
      if(done){
        const sail = c.hull === 'sail';
        if(c.view === 'head' || c.view === 'stern') s += hullHead(sail, 'var(--night-ink)', .16);
        else s += hullSide(c.view === 'side-l' ? 'l' : 'r', sail, 'var(--night-ink)', .16, c.oneMast);
        c.lights.forEach(l => { if(l.pole) s += `<line x1="${l.x}" y1="${l.y}" x2="${l.x}" y2="${WL - 18}" stroke="var(--night-ink)" stroke-opacity=".32" stroke-width="2"/>`; });
        if(c.id === 'tow-side') s += `<line x1="${s2.stern}" y1="${WL - 8}" x2="0" y2="${WL - 4}" stroke="var(--night-ink)" stroke-opacity=".4" stroke-dasharray="4 4"/>`;
      }
      c.lights.forEach(l => { s += W.parts.light(l.c, 4.6, l.x, l.y); });
      if(done) c.lights.forEach(l => { if(l.t) s += tx(l.a === 'l' ? l.x - 14 : l.x + 14, l.y + 4, l.t, { fill: ink, fs: 12, a: l.a === 'l' ? 'end' : 'start', halo: 'var(--night)' }); });
    } else {
      // 낮 하늘은 두 테마 모두 밝게(흑구가 검게 보이도록)
      s += `<rect width="360" height="${WL}" fill="var(--light-white)"/><rect y="${WL}" width="360" height="${230 - WL}" fill="var(--sea)"/>`;
      s += hullSide(c.bow || 'r', c.hull === 'sail', 'var(--ink-3)', .6);
      // 형상물 마스트(또는 앞 마스트)에 수직으로
      const n = c.shapes.length, gap = 28, top = 44;
      s += `<line x1="${c.mast}" y1="${top - 14}" x2="${c.mast}" y2="${WL - 20}" stroke="var(--ink-2)" stroke-width="${c.hull === 'sail' ? 1 : 2}"/>`;
      c.shapes.forEach((k, i) => { s += W.parts.shape(k, c.mast, top + 10 + i*gap, 18, 'var(--night)'); });
      if(done){
        const names = { ball: '흑구', diamond: '마름모', cylinder: '원통형', 'cones-apex': '장구형(원뿔 2개)', 'cone-down': '원뿔(꼭짓점 아래)' };
        const lf = c.mast > 180;
        s += tx(lf ? c.mast - 18 : c.mast + 18, top + 14, c.shapes.map(k => names[k]).join(' · '), { fill: 'var(--night)', fs: 12.5, w: 600, a: lf ? 'end' : 'start' });
      }
    }
    const hd = night ? ink : 'var(--night)';
    s += tx(10, 20, `${st.i + 1} / ${st.deck.length}`, { fill: hd, fs: 12, op: .7 });
    s += tx(350, 20, night ? `야간 · ${c.aspect}` : '주간 형상물', { fill: hd, fs: 12.5, w: 600, a: 'end' });
    svg.innerHTML = s;

    // 보기 버튼
    opts.innerHTML = '';
    st.order.forEach(o => {
      const right = o === c.opts[0];
      const mark = done ? (right ? 'ok' : (o === st.picked ? 'bad' : '')) : '';
      const b = W.h('button', { type: 'button', class: 'btn', text: (mark === 'ok' ? '✓ ' : mark === 'bad' ? '✗ ' : '') + o, style: { textAlign: 'left', width: '100%', opacity: done && !mark ? '.55' : '1',
        borderColor: mark ? `var(--${mark})` : null, color: mark ? `var(--${mark})` : null, fontWeight: mark ? '600' : null, borderWidth: mark ? '2px' : null }, onclick: () => pick(o) });
      if(done) b.disabled = true;
      opts.append(b);
    });
    nextBtn.hidden = !done;
    setScore(st.n ? `${st.score} / ${st.n}` : '0 / 0');
    if(!done) ui.setVerdict(night ? '어떤 선박일까? (등의 색·개수·위아래 순서를 보세요)' : '어떤 선박일까? (형상물의 모양과 순서를 보세요)');
    else {
      const ok = st.picked === c.opts[0];
      ui.setVerdict(`${ok ? '정답' : '오답'} — ${c.opts[0]}. ${c.why} (${c.rule})`, ok);
    }
  }

  function pick(o){
    if(st.picked != null) return;
    st.picked = o; st.n++; if(o === st.deck[st.i].opts[0]) st.score++;
    drawCard();
  }
  const shuffle = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function deal(first){
    const pool = CARDS.filter(c => st.filter === 'all' || c.kind === st.filter);
    // 첫 화면은 정면 동력선 카드로 고정(의미 있는 첫 장면), 이후는 무작위
    st.deck = first ? [pool[0], ...shuffle(pool.slice(1))] : shuffle(pool);
    st.i = 0; setCard();
  }
  function setCard(){ st.picked = null; st.order = shuffle(st.deck[st.i].opts); drawCard(); }

  /* ---------- 컨트롤 ---------- */
  const opts = W.h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '8px', width: '100%' } });
  ui.controls.append(opts);
  const nextBtn = W.ui.btn(ui.controls, '다음 카드 →', () => { st.i = (st.i + 1) % st.deck.length; if(st.i === 0) st.deck = shuffle(st.deck); setCard(); }, 'primary');
  W.ui.seg(ui.controls, [{ value: 'all', label: '전체' }, { value: 'night', label: '야간 등화' }, { value: 'day', label: '주간 형상물' }], 'all', v => { st.filter = v; deal(false); }, '범위');
  W.ui.btn(ui.controls, '점수 초기화', () => { st.score = 0; st.n = 0; drawCard(); });
  const setScore = W.ui.stat(ui.readout, '맞힌 수');

  deal(true);
});

}catch(e){console.error("[load] src/sims/lights-cards.js", e)}
</script>
<script>/* src/sims/lookout-layers.js */
try{
/* 제5조 경계 — 모든 유효한 수단으로 정보를 쌓아 충돌의 위험성을 평가하기 (S1) */
W.sim('lookout-layers', (el) => {
  const N = W.nav, ID = W.ui.uid('lk');
  const ui = W.ui.box(el, { title:'경계 = 모든 수단으로 정보를 모아 위험성을 평가하기', kind:'애니메이션',
    caption:'제5조는 <b>시각·청각</b>은 물론 <b>당시의 사정과 조건에 적합한 모든 유효한 수단</b>으로 경계하라고 한다. 수단마다 얻는 정보가 다르고, 모은 정보는 <b>충돌의 위험성 평가</b>로 이어져야 한다. 장면은 설명용 예시다.' });

  /* ---------- 장면 기하 (NM, x=동 y=북) ---------- */
  const OWN = { x:0, y:0, c:0, s:12 };
  const B = 45, R0 = 5, TC = 265;
  const TS = -OWN.s*Math.sin(N.rad(B)) / Math.sin(N.rad(TC - B));        // 방위 045° 불변이 되는 상대 속력(약 13.2 kn)
  const TGT = { x:R0*Math.sin(N.rad(B)), y:R0*Math.cos(N.rad(B)), c:TC, s:TS };
  const rel = N.cpa(OWN, OWN.c, OWN.s, TGT, TGT.c, TGT.s);
  const vRel = (() => { const a = N.vel(OWN.c, OWN.s), b = N.vel(TC, TS); return { x:b.x - a.x, y:b.y - a.y }; })();
  const past = m => ({ x: TGT.x - vRel.x*m/60, y: TGT.y - vRel.y*m/60 });   // m분 전 상대 위치 (내 배 기준)
  const obs = [6, 3, 0].map(m => { const p = past(m); return { m, r:Math.hypot(p.x, p.y), b:N.bearing({x:0,y:0}, p), p }; });
  const seen = N.lightsSeen(OWN, { x:TGT.x, y:TGT.y, heading:TC });          // 내가 보는 상대 등화

  /* ---------- 화면 ---------- */
  const VW = 400, VH = 430, V = { cx:120, cy:388, scale:46 };
  const S = p => N.toScreen(p, V);
  const wrap = W.h('div', { style:{ display:'flex', flexWrap:'wrap' } });
  const left = W.h('div', { style:{ flex:'1 1 300px', minWidth:'0', background:'var(--night)' } });
  const right = W.h('div', { style:{ flex:'1 1 300px', minWidth:'0', background:'var(--panel)', padding:'12px 14px', fontSize:'14px', lineHeight:'1.6', color:'var(--ink)', borderLeft:'1px solid var(--rule)' } });
  wrap.append(left, right); ui.stage.append(wrap);
  ui.readout.style.display = 'none';
  const svg = W.svg('svg', { viewBox:`0 0 ${VW} ${VH}`, role:'img', 'aria-label':'야간 바다에서 내 배와 다가오는 상대선. 단계마다 경계 수단이 하나씩 더해진다' });
  left.append(svg);
  const chips = W.h('div', { style:{ display:'flex', flexWrap:'wrap', gap:'4px', marginBottom:'10px' } });
  const head = W.h('div', { style:{ fontWeight:'700', fontSize:'15px' } });
  const means = W.h('div', { style:{ color:'var(--ink-2)', fontSize:'13px', marginBottom:'8px' } });
  const list = W.h('div');
  right.append(chips, head, means, list);

  const f1 = v => v.toFixed(1);
  const NI = 'var(--night-ink)';
  const T = (x, y, s, o = {}) => `<text x="${f1(x)}" y="${f1(y)}" font-size="${o.size||13}" font-family="var(${o.mono?'--f-mono':'--f-body'})" fill="${o.fill||NI}" text-anchor="${o.anchor||'start'}"${o.weight?` font-weight="${o.weight}"`:''}${o.op?` opacity="${o.op}"`:''}>${s}</text>`;

  const tcpaMin = rel.tcpa*60;
  const STEPS = [
    { k:'상황', title:'상황 — 야간 당직', means:'00:40, 맑은 밤. 내 배는 침로 000°, 12노트. 아직 아무것도 확인하지 않았다.',
      info:'경계는 <b>항상(at all times)</b> 유지한다. 지금부터 수단을 하나씩 더해 본다.' },
    { k:'시각', got:'50 m 이상 동력선이 우현 선수에서 횡단 중', title:'① 시각 — 육안·쌍안경', means:'sight: 가장 정확한 정보는 눈으로 보는 것이다.',
      info:`우현 선수 쪽(약 ${N.fmtDeg(B)})에 <b>백등 2개 + 홍등</b>이 보인다.<br>→ 마스트등 2개: 길이 50 m 이상 동력선<br>→ 홍등(좌현등): 상대의 왼쪽 옆구리가 보인다 = 내 앞을 <b>오른쪽에서 왼쪽으로</b> 가로지르는 중` },
    { k:'청각', got:'조종신호 없음', title:'② 청각 — 기적·신호 듣기', means:'hearing: 보는 것뿐 아니라 듣는 것까지가 경계다(그래서 "견시"가 아니라 "경계").',
      info:'기적·조종신호는 <b>들리지 않는다</b> → 상대가 변침한다고 알리는 신호는 없다.<br>시정이 나빠지면 무중신호가 상대의 존재를 가장 먼저 알려 준다.' },
    { k:'레이더', got:`방위 ${N.fmtDeg(B)} 불변 · 거리 감소`, title:'③ 레이더·ARPA — 거리와 방위의 변화', means:'all available means: 레이더 플로팅 또는 ARPA로 체계적으로 관측한다(제7조(b)).',
      info:`3분 간격 관측<br>${obs.map(o => `<span style="font-family:var(--f-mono)">${o.m ? o.m+'분 전' : '지금'} · ${N.fmtDeg(o.b)} · ${o.r.toFixed(1)} NM</span>`).join('<br>')}<br>→ <b>방위는 그대로, 거리만 줄어든다</b>. ARPA: CPA ${N.fmtNM(rel.cpa)}, TCPA 약 ${Math.round(tcpaMin)}분` },
    { k:'AIS', got:`${N.fmtDeg(TC)} · ${TS.toFixed(1)} kn · 길이 180 m`, title:'④ AIS — 상대가 보내는 정보', means:'AIS: 선명·침로·속력·크기를 알려 준다. 단, 상대가 입력·송신한 값이다.',
      info:`AIS: 침로 ${N.fmtDeg(TC)} · 속력 ${TS.toFixed(1)} kn · 길이 180 m<br>→ 레이더·육안 정보와 <b>맞는지 교차 확인</b>. 불충분한 정보(scanty information)로 추정하지 않는다(제7조(c)).` },
    { k:'VHF', got:'필요하면 의도 확인', title:'⑤ VHF — 의도 확인', means:'VHF 무선전화로 상대를 불러 의도를 물을 수 있다.',
      info:'교신은 의도를 확인하는 보조 수단이다. <b>교신하느라 동작이 늦어지면 안 되고</b>, 교신으로 항법을 바꿀 수는 없다.' },
    { k:'평가', title:'⑥ 평가 — 경계의 목적', means:'모은 정보를 하나로 묶어 충돌의 위험성을 평가하고 동작을 미리 계획한다.',
      info:'<ol style="margin:0 0 8px;padding-left:20px">'+
        '<li><b>발견·인식</b>: 50 m 이상 동력선, 우현 선수</li>'+
        `<li><b>상황 이해</b>: 컴퍼스 방위 ${N.fmtDeg(B)} 불변 + 거리 감소 → 충돌의 위험 있음(제7조)</li>`+
        '<li><b>내 역할 판단</b>: 상대가 내 우현 → 내 배가 피항선(제15조)</li>'+
        '<li><b>동작 계획(pre-plan)</b>: 일찍, 크게 우현 변침해 상대 선미 쪽으로(제8조·제16조)</li></ol>'+
        '<div style="border:1.5px solid var(--magenta);border-radius:8px;padding:8px 10px;background:var(--magenta-tint)"><b style="color:var(--magenta)">★ 경계의 목적 = 충돌의 위험성 평가</b><br>"충돌을 방지한다"가 아니다. 보기만 하고 상황을 이해하지 못하면 경계가 아니다.</div>' }
  ];
  let step = 0;

  /* ---------- 그리기 ---------- */
  const chipBtns = STEPS.map((s, i) => {
    const b = W.h('button', { type:'button', text:s.k, onclick(){ go(i); stopAuto(); },
      style:{ border:'1px solid var(--rule)', borderRadius:'999px', padding:'2px 10px', fontSize:'12.5px', cursor:'pointer', background:'var(--panel)', color:'var(--ink-2)' } });
    chips.append(b); return b;
  });

  function draw(){
    const st = STEPS[step];
    chipBtns.forEach((b, i) => {
      b.style.background = i === step ? 'var(--ink)' : i < step ? 'var(--shoal)' : 'var(--panel)';
      b.style.color = i === step ? 'var(--paper)' : i < step ? 'var(--ink)' : 'var(--ink-3)';
    });
    head.textContent = `${st.title}  (${step}/${STEPS.length-1})`;
    means.textContent = st.means;
    // 지금까지 모은 정보 (이전 단계는 접어서 한 줄)
    list.innerHTML = '';
    list.append(W.h('div', { style:{ borderLeft:'3px solid var(--link)', paddingLeft:'8px' }, html:st.info }));
    if(step > 1 && step < STEPS.length-1){
      const box = W.h('div', { style:{ marginTop:'10px', fontSize:'12.5px', color:'var(--ink-2)', background:'var(--paper)', borderRadius:'8px', padding:'6px 10px' } }, W.h('b', { text:'지금까지 모은 정보' }));
      STEPS.slice(1, step).forEach(p => box.append(W.h('div', { html:`<span style="color:var(--ink-3)">${p.k}</span> · ${p.got}` })));
      list.append(box);
    }
    drawScene();
    if(step === STEPS.length-1) ui.setVerdict('충돌의 위험 있음 → 내 배 피항선, 조기에 크게 우현 변침 계획 (제5조 → 제7조·제15조·제16조)', false);
    else if(step >= 3) ui.setVerdict('위험 신호 포착 — 방위 불변·거리 감소. 다른 수단으로 확인하며 평가를 완성한다 (제5조·제7조)', null);
    else ui.setVerdict('정보 수집 중 — 아직 평가 전 (제5조: 시각·청각 및 모든 유효한 수단)', null);
    prevBtn.disabled = step === 0; nextBtn.disabled = step === STEPS.length-1;
  }

  function drawScene(){
    const o = S(OWN), t = S(TGT);
    let s = W.parts.arrowDefs(ID+'-a', 'var(--night-ink)') + W.parts.arrowDefs(ID+'-m', 'var(--magenta)');
    s += `<defs><clipPath id="${ID}-c"><rect width="${VW}" height="${VH}"/></clipPath></defs>`;
    s += `<rect width="${VW}" height="${VH}" fill="var(--night)"/>`;
    s += T(12, 22, '00:40 · 맑은 밤', { size:12.5, op:.8 }) + T(VW-12, 22, `내 배 ${N.fmtDeg(OWN.c)} · ${OWN.s} kn`, { size:12.5, anchor:'end', mono:true, op:.8 });
    // 레이더 이상: 거리환·EBL·잔상
    if(step >= 3){
      s += `<g clip-path="url(#${ID}-c)" fill="none" stroke="var(--night-ink)" stroke-opacity=".22">`;
      for(let k = 2; k <= 8; k += 2) s += `<circle cx="${o.x}" cy="${o.y}" r="${k*V.scale}"/>`;
      s += `</g>`;
      for(let k = 2; k <= 6; k += 2) s += T(o.x - 6, o.y - k*V.scale + 14, k+' NM', { size:11, anchor:'end', op:.55 });
      const e = S({ x:Math.sin(N.rad(B))*8, y:Math.cos(N.rad(B))*8 });
      s += `<line x1="${o.x}" y1="${o.y}" x2="${f1(e.x)}" y2="${f1(e.y)}" stroke="var(--night-ink)" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="7 5" clip-path="url(#${ID}-c)"/>`;
