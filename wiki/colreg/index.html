<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>COLREG 학습 위키</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 배치: 상단 바 + 왼쪽 문서 레일 + 본문 한 단. 천문항해 위키와 같은 디자인 언어. 등화색(홍·녹·백·황)은 의미로만 쓴다 */
:root{
  /* 천문항해 위키와 같은 팔레트: 해도 종이 같은 차가운 흰색 + 남색 잉크 + 해도 자홍색 강조 */
  --paper:#f4f7f8; --panel:#ffffff; --shoal:#eaf0f3; --shoal-2:#d7e2e8; --land:#ece3cf;
  --ink:#14213a; --ink-2:#44546b; --ink-3:#74829a; --rule:#d3dce3; --link:#1b5d93;
  --magenta:#a3246f; --magenta-tint:#f6e6ef; --scroll:#b7c3cd; --shadow:0 6px 24px rgba(20,33,58,.12);
  --port:#d2302c; --stbd:#16924a; --light-white:#ffffff; --light-yellow:#f2b705;
  --standon:#1d4f91; --giveway:#7b3fb0;
  --ok:#2e7d4f; --bad:#b3261e; --warn:#9a5a00; --warn-bg:#fff3d6; --warn-rule:#e9c46a;
  --night:#0b1526; --night-2:#13263a; --night-ink:#dbe6f5;
  --sea:#dbe9f0; --sea-deep:#bfd6e2;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --f-law:"Hahmlet", "Noto Serif KR", "Apple SD Gothic Neo", serif;
  --f-display:"Hahmlet", "Noto Serif KR", "Apple SD Gothic Neo", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --side:272px; --measure:46rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0d1520; --panel:#131e2c; --shoal:#172536; --shoal-2:#1f3247; --land:#2b2a22;
  --ink:#e2e9f2; --ink-2:#a8b6c8; --ink-3:#7b8aa0; --rule:#273649; --link:#7db6ea;
  --magenta:#e570b4; --magenta-tint:#3a1d30; --scroll:#3a4d64; --shadow:0 8px 28px rgba(0,0,0,.45);
  --ok:#6fcf97; --bad:#f08a80; --warn:#f2bd60; --warn-bg:#2c2312; --warn-rule:#6d5420;
  --standon:#6fa6ef; --giveway:#b88ae6; --sea:#142838; --sea-deep:#1b3448; --port:#ff4a44; --stbd:#2fd27a;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0d1520; --panel:#131e2c; --shoal:#172536; --shoal-2:#1f3247; --land:#2b2a22;
  --ink:#e2e9f2; --ink-2:#a8b6c8; --ink-3:#7b8aa0; --rule:#273649; --link:#7db6ea;
  --magenta:#e570b4; --magenta-tint:#3a1d30; --scroll:#3a4d64; --shadow:0 8px 28px rgba(0,0,0,.45);
  --ok:#6fcf97; --bad:#f08a80; --warn:#f2bd60; --warn-bg:#2c2312; --warn-rule:#6d5420;
  --standon:#6fa6ef; --giveway:#b88ae6; --sea:#142838; --sea-deep:#1b3448; --port:#ff4a44; --stbd:#2fd27a;
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--panel)}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--panel);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:12px;height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:8px;color:var(--ink);white-space:nowrap}
.brand b{font-family:var(--f-law);font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand span{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);letter-spacing:.06em}
.brand:hover{text-decoration:none}
.menu-btn{display:none;border:1px solid var(--rule);background:transparent;border-radius:8px;width:38px;height:38px;cursor:pointer}
.search{position:relative;flex:1;max-width:420px;margin-left:auto}
.search input{width:100%;height:38px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:0 12px 0 34px;font:inherit;font-size:14px}
.search svg{position:absolute;left:10px;top:11px;width:16px;height:16px;stroke:var(--ink-3)}
.results{position:absolute;top:44px;left:0;right:0;background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 30px rgba(10,30,40,.14);max-height:60vh;overflow:auto;padding:6px}
.results a{display:block;padding:8px 10px;border-radius:7px;color:var(--ink)}
.results a:hover,.results a.on{background:var(--shoal);text-decoration:none}
.results small{display:block;color:var(--ink-2);font-size:12.5px;line-height:1.5}
.results mark{background:var(--magenta-tint);color:inherit;border-radius:2px}
.top-links{display:flex;gap:4px}
.top-links a{padding:7px 10px;border-radius:8px;color:var(--ink-2);font-size:14px;white-space:nowrap}
.top-links a:hover,.top-links a.on{background:var(--shoal);color:var(--ink);text-decoration:none}
.top-links a.tl-star{color:var(--magenta);font-weight:600}

/* ---------- frame ---------- */
.frame{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:calc(100% - 56px)}
.rail{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));height:calc(100vh - 56px - env(safe-area-inset-top,0px));overflow:auto;overscroll-behavior:contain;
  border-right:1px solid var(--rule);background:var(--panel);padding:14px 12px 28px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
/* 목록 위치 표시: 구분선 위에 겹친 얇은 막대. 평소엔 흐리게, 목록에 마우스를 올리거나 굴리면 진하게. 끌어서 옮길 수 있다 */
.rail-thumb{position:fixed;z-index:46;width:13px;margin-left:-7px;display:flex;justify-content:center;touch-action:none}
.rail-thumb i{display:block;width:2px;height:100%;border-radius:2px;background:var(--ink-3);opacity:.28;transition:width .15s ease,opacity .2s ease}
.rail-thumb.live i{opacity:.55;width:4px}
.rail-thumb:hover i,.rail-thumb.drag i{opacity:.75;width:5px}
.rail-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.rail-head h2{font:600 13px var(--f-body);margin:0;color:var(--ink-2);letter-spacing:.04em}
.rail-head select{font:inherit;font-size:12.5px;border:1px solid var(--rule);border-radius:6px;padding:3px 6px;background:var(--paper);color:var(--ink);max-width:150px;cursor:pointer}
.rail .progress{display:grid;gap:5px;margin:6px 0 12px;font-size:12px;line-height:1.5;color:var(--ink-3)}
.rail .bar{height:5px;background:var(--shoal);border-radius:3px;overflow:hidden}
.rail .bar i{display:block;height:100%;background:var(--magenta);border-radius:3px}
.rail-tools{display:flex;justify-content:flex-end;margin:-4px 0 -6px}
.rail-foldall{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;font:500 12px var(--f-body);color:var(--ink-3);padding:3px 6px;border-radius:6px}
.rail-foldall:hover{color:var(--ink);background:var(--shoal)}
.chev2{position:relative;width:8px;height:10px;flex:none}
.chev2::before,.chev2::after{content:"";position:absolute;left:1px;width:5px;height:5px;border-left:1.5px solid currentColor;border-top:1.5px solid currentColor;transform:rotate(45deg)}
.chev2::before{top:1px}.chev2::after{top:5px}
.chev2.down::before,.chev2.down::after{transform:rotate(225deg)}
.chev2.down::before{top:0}.chev2.down::after{top:4px}
.rail-cat{width:100%;display:flex;align-items:center;gap:7px;border:0;background:transparent;cursor:pointer;text-align:left;font:600 11.5px/1.4 var(--f-body);color:var(--ink-3);letter-spacing:.05em;margin:10px 0 2px;padding:5px 6px;border-radius:6px}
.rail-cat:hover{color:var(--ink);background:var(--shoal)}
.rail-cat .ct{flex:1;min-width:0}
.rail-cat .n{font:500 10.5px var(--f-mono);letter-spacing:0;opacity:.7;font-variant-numeric:tabular-nums}
.rail-cat .chev{width:6px;height:6px;flex:none;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .2s ease}
.rail-cat[aria-expanded="false"] .chev{transform:translateX(-1px) rotate(-45deg)}
.rail-cat.has-cur[aria-expanded="false"]{color:var(--magenta)}
.rail-grp{display:grid;grid-template-rows:1fr;transition:grid-template-rows .22s ease}
.rail-grp.shut{grid-template-rows:0fr}
.rail-grp-in{overflow:hidden;min-height:0}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.rail li a{display:flex;align-items:baseline;gap:6px;padding:4px 6px;border-radius:6px;font-size:13.5px;line-height:1.45;color:var(--ink)}
.rail li a:hover{background:var(--shoal);text-decoration:none}
.rail li a[aria-current="page"]{background:var(--magenta-tint);font-weight:600}
.rail li a:focus-visible,.rail-cat:focus-visible,.rail-foldall:focus-visible{outline-offset:-2px}
.rail .rn{font:500 11px var(--f-mono);color:var(--ink-3);min-width:2.2em;font-variant-numeric:tabular-nums}
.rail .t{flex:1;min-width:0}
.rail .t small{font-size:11px;color:var(--ink-3);margin-left:5px;font-weight:400}
.rail .st{color:var(--magenta);font-size:10px;align-self:center}
.vc{font:500 10.5px var(--f-mono);color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:1.4em;text-align:right}
.vc.zero{opacity:.45}
.vc.hot{color:var(--magenta)}
.rail-nav{display:none;flex-wrap:wrap;gap:6px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.rail-nav a{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink)}
.rail-nav a:hover{text-decoration:none;border-color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){.rail-grp,.rail-cat .chev{transition:none}}

main{min-width:0;padding-block:32px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:780px;margin:0 auto}

/* ---------- doc ---------- */
.crumb{font-size:12.5px;color:var(--ink-3);letter-spacing:.02em;display:flex;gap:6px;flex-wrap:wrap}
.doc-title{font-family:var(--f-law);font-weight:800;font-size:clamp(28px,4.4vw,38px);line-height:1.25;margin:8px 0 2px;text-wrap:balance;letter-spacing:-.01em}
.doc-en{font-family:var(--f-mono);font-size:13px;color:var(--ink-3);letter-spacing:.03em}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;margin:14px 0 0}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2);background:var(--panel)}
.chip.chip-star{border-color:var(--magenta);color:var(--magenta);background:var(--magenta-tint)}
.summary{margin:22px 0 8px;padding:16px 18px;background:var(--shoal);border-radius:10px;font-size:17px;line-height:1.65;font-weight:500}
.summary::before{content:"한 줄 요약";display:block;font-size:11.5px;font-weight:600;letter-spacing:.08em;color:var(--ink-3);margin-bottom:4px}

.law{margin:24px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:14px 0}
.law-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.law-head h2{margin:0;font-size:13px;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--paper)}
.law-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:8px 0}
.law-row+.law-row{border-top:1px dashed var(--rule)}
.law-row p{margin:0;font-family:var(--f-law);font-size:15.5px;line-height:1.8}
.law-row .en{font-size:14.5px;color:var(--ink-2)}
.law[data-mode="ko"] .law-row{grid-template-columns:1fr}.law[data-mode="ko"] .en{display:none}
.law[data-mode="en"] .law-row{grid-template-columns:1fr}.law[data-mode="en"] .ko{display:none}

.body h3{font-size:20px;margin:40px 0 10px;line-height:1.4;text-wrap:balance}
.body h4{font-size:16.5px;margin:26px 0 6px}
.body p{margin:10px 0}
.body ul,.body ol{padding-left:22px;margin:10px 0}
.body li{margin:4px 0}
.body strong{font-weight:700}
.body table{border-collapse:collapse;width:100%;font-size:14.5px;margin:14px 0}
.tbl{overflow-x:auto;margin:14px 0}
.body th,.body td{border-bottom:1px solid var(--rule);padding:8px 10px;text-align:left;vertical-align:top}
.body th{font-size:12.5px;color:var(--ink-3);font-weight:600;letter-spacing:.03em;background:var(--paper)}
.en-term,.body .en{font-family:var(--f-mono);font-size:.88em;background:var(--shoal);padding:1px 6px;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
a.wl{border-bottom:1px dotted var(--link)}
a.wl:hover{text-decoration:none;border-bottom-style:solid}
a.wl.missing{color:var(--ink-3);border-bottom-color:var(--ink-3);cursor:default}
.star{position:relative;margin:18px 0;padding:12px 16px 12px 18px;border:1px solid var(--magenta);border-radius:10px;background:var(--magenta-tint)}
.star .star-tag{display:flex;gap:8px;align-items:baseline;font-size:12px;font-weight:700;color:var(--magenta);letter-spacing:.04em;margin-bottom:2px}
.star .star-tag em{font-style:normal;font-weight:500;color:var(--ink-2);letter-spacing:0}
.star>:last-child{margin-bottom:0}
.fix{margin:16px 0;padding:10px 14px;border-left:3px solid var(--light-yellow);background:color-mix(in srgb,var(--light-yellow) 12%,transparent);border-radius:0 8px 8px 0;font-size:15px}
.fix::before{content:"〔정정〕 ";font-weight:700}
.tip{margin:16px 0;padding:10px 14px;border-left:3px solid var(--link);background:var(--shoal);border-radius:0 8px 8px 0;font-size:15px}
details.story{margin:16px 0;border:1px solid var(--rule);border-radius:10px;background:var(--panel)}
details.story summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:15px;list-style:none;display:flex;gap:8px;align-items:center}
details.story summary::-webkit-details-marker{display:none}
details.story summary::before{content:"+";font-family:var(--f-mono);color:var(--ink-3);width:14px}
details.story[open] summary::before{content:"−"}
details.story>div{padding:0 16px 12px 36px;font-size:15px}
sup.fn a{font-family:var(--f-mono);font-size:11px;padding:0 2px}
.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--rule);font-size:13px;color:var(--ink-2)}
.foot ol{padding-left:20px}
.easy{margin:18px 0;padding:12px 16px;border-radius:10px;border:1px dashed var(--ink-3);font-size:15px}
.easy::before{content:"쉽게 말하면";display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-3)}

.section-label{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-3);margin:48px 0 10px;display:flex;align-items:center;gap:10px}
.section-label::after{content:"";flex:1;height:1px;background:var(--rule)}
.rel{display:flex;flex-wrap:wrap;gap:8px}
.rel a{padding:6px 12px;border:1px solid var(--rule);border-radius:8px;font-size:14px;background:var(--panel);color:var(--ink)}
.rel a:hover{border-color:var(--link);text-decoration:none}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px}
.pager a{padding:12px 14px;border:1px solid var(--rule);border-radius:10px;color:var(--ink);background:var(--panel)}
.pager a:hover{border-color:var(--link);text-decoration:none}
.pager small{display:block;font-size:12px;color:var(--ink-3)}
.pager .next{text-align:right}

/* ---------- sim boxes (shared by simulators) ---------- */
.sim{margin:24px 0}
.sim-box{border:1px solid var(--rule);border-radius:12px;background:var(--panel);overflow:hidden}
.sim-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 14px;border-bottom:1px solid var(--rule)}
.sim-head b{font-size:14.5px}
.sim-head span{font-size:12px;color:var(--ink-3);letter-spacing:.04em;white-space:nowrap}
.sim-stage{position:relative;background:var(--sea);overflow:hidden}
.sim-stage.night{background:var(--night)}
.sim-stage svg{display:block;width:100%;height:auto}
.sim-controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 14px;border-top:1px solid var(--rule)}
.sim-readout{display:flex;flex-wrap:wrap;gap:8px 18px;padding:10px 14px;border-top:1px solid var(--rule);font-size:14px;background:var(--paper)}
.sim-readout .k{color:var(--ink-3);font-size:12px;margin-right:4px}
.sim-readout .v{font-family:var(--f-mono);font-weight:600}
.sim-caption{padding:10px 14px;font-size:13.5px;color:var(--ink-2);border-top:1px solid var(--rule)}
.ctl{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.ctl output{font-family:var(--f-mono);color:var(--ink);min-width:52px;font-size:13px}
input[type=range]{accent-color:var(--link);width:140px}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:13.5px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--link)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.on{background:var(--link);border-color:var(--link);color:var(--paper)}
.verdict{padding:10px 14px;font-weight:600;border-top:1px solid var(--rule)}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.sim-error{padding:14px;border:1px dashed var(--bad);border-radius:10px;color:var(--bad);font-size:13px}

/* ---------- quiz ---------- */
.quiz{display:grid;gap:14px}
.q{border:1px solid var(--rule);border-radius:12px;background:var(--panel);padding:14px 16px}
.q-top{display:flex;gap:8px;align-items:baseline}
.q-no{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.q-text{font-weight:600;line-height:1.6}
.q-star{color:var(--magenta);font-size:12px;font-weight:700;margin-left:auto;white-space:nowrap}
.q-ch{display:grid;gap:6px;margin-top:10px}
.q-ch button{text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:15px;line-height:1.5}
.q-ch button:hover:not(:disabled){border-color:var(--link)}
.q-ch button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.q-ch button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.q-ch button:disabled{cursor:default}
.q-why{margin-top:10px;font-size:14.5px;color:var(--ink-2);padding-top:8px;border-top:1px dashed var(--rule)}
.q-why b{color:var(--ink)}
.q-src{font-size:12.5px;margin-top:6px}

/* ---------- home / lists ---------- */
.hero{padding:8px 0 24px;border-bottom:1px solid var(--rule)}
.hero h1{font-family:var(--f-law);font-weight:800;font-size:clamp(30px,5vw,44px);line-height:1.2;margin:6px 0 10px;text-wrap:balance}
.hero p{color:var(--ink-2);max-width:60ch;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{display:block;border:1px solid var(--rule);border-radius:12px;background:var(--panel);padding:14px;color:var(--ink)}
.card:hover{border-color:var(--link);text-decoration:none}
.card .no{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.card b{display:block;font-size:16px;margin:2px 0 4px}
.card p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.card .st{color:var(--magenta);font-size:12px;font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:24px;margin:20px 0}
.stat b{display:block;font-family:var(--f-mono);font-size:26px;font-weight:600}
.stat span{font-size:12.5px;color:var(--ink-3)}
.list-row{display:grid;grid-template-columns:70px minmax(0,1fr) 70px;gap:12px;padding:10px 4px;border-bottom:1px solid var(--rule);align-items:baseline;color:var(--ink)}
.list-row:hover{background:var(--shoal);text-decoration:none}
.list-row .no{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.list-row .cnt{font-family:var(--f-mono);font-size:13px;text-align:right;color:var(--ink-2)}
.list-row small{display:block;color:var(--ink-3);font-size:13px}
.tip-pop{position:fixed;z-index:80;max-width:320px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;box-shadow:0 10px 30px rgba(10,30,40,.18);font-size:13.5px;line-height:1.55;pointer-events:none}
.tip-pop b{display:block;font-size:14px;margin-bottom:2px}
.empty{padding:30px;text-align:center;color:var(--ink-3);border:1px dashed var(--rule);border-radius:12px}

@media (max-width:900px){
  .frame{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;top:calc(56px + env(safe-area-inset-top,0px));height:auto;bottom:0;width:min(320px,86vw);z-index:45;transform:translateX(-104%);transition:transform .25s ease;box-shadow:var(--shadow);scrollbar-width:thin;scrollbar-color:var(--scroll) transparent;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .rail-thumb{display:none}
  .rail-nav{display:flex}
  body.menu-open .rail{transform:none}
  .menu-btn{display:inline-grid;place-items:center}
  .top-links{display:none}
  .brand span{display:none}
  .law-row{grid-template-columns:1fr;gap:6px}
  main{padding-block:20px 80px}
}
@media (max-width:560px){ .list-row{grid-template-columns:52px minmax(0,1fr) 44px} .pager{grid-template-columns:1fr} input[type=range]{width:110px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>/* src/core.js */
try{
/* ===== COLREG 위키 공통 코어: 등록 API, 저장소, DOM/SVG 헬퍼, 항해 계산, 그림 부품, 시뮬레이터 UI ===== */
(function(){
const W = window.W = { docs:{}, sims:{}, terms:[], _order:[] };

/* ---------- 등록 ---------- */
W.doc  = d => { if(!d || !d.id) return; W.docs[d.id] = d; W._order.push(d.id); };
W.sim  = (id, fn) => { W.sims[id] = fn; };
W.term = t => { W.terms.push(t); };

/* ---------- 저장소 (실패해도 동작) ---------- */
W.store = {
  get(k, def){ try{ const v = localStorage.getItem('colreg:'+k); return v==null ? def : JSON.parse(v); }catch(e){ return def; } },
  set(k, v){ try{ localStorage.setItem('colreg:'+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- DOM 헬퍼 ---------- */
W.h = function(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(v==null || v===false) continue;
    if(k==='class') el.className = v;
    else if(k==='html') el.innerHTML = v;
    else if(k==='text') el.textContent = v;
    else if(k.startsWith('on') && typeof v==='function') el.addEventListener(k.slice(2), v);
    else if(k==='style' && typeof v==='object') Object.assign(el.style, v);
    else el.setAttribute(k, v===true ? '' : v);
  }
  for(const c of kids.flat()){ if(c==null || c===false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
};
const SVGNS = 'http://www.w3.org/2000/svg';
W.svg = function(tag, attrs, ...kids){
  const el = document.createElementNS(SVGNS, tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(v==null || v===false) continue;
    if(k==='html') el.innerHTML = v;
    else if(k==='text') el.textContent = v;
    else if(k.startsWith('on') && typeof v==='function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for(const c of kids.flat()){ if(c==null || c===false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
};
W.esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 색 (CSS 변수; SVG 속성에도 그대로 사용 가능) ---------- */
W.C = {
  port:'var(--port)', stbd:'var(--stbd)', white:'var(--light-white)', yellow:'var(--light-yellow)',
  standon:'var(--standon)', giveway:'var(--giveway)', ink:'var(--ink)', ink2:'var(--ink-2)', ink3:'var(--ink-3)',
  rule:'var(--rule)', sea:'var(--sea)', seaDeep:'var(--sea-deep)', land:'var(--land)', panel:'var(--panel)',
  magenta:'var(--magenta)', link:'var(--link)', night:'var(--night)', ok:'var(--ok)', bad:'var(--bad)'
};

/* ---------- 항해 계산 ----------
   좌표: x = 동(+), y = 북(+), 단위 해리(NM). 침로/방위: 진북 기준 0~360°, 시계방향. 속력: 노트(kn). 시간: 시간(h).
   화면에 그릴 때는 W.nav.toScreen(p, view) 로 y를 뒤집는다. */
const rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;
const norm = a => ((a%360)+360)%360;
W.nav = {
  rad, deg, norm,
  /** -180~180 로 정규화 */
  signed: a => { a = norm(a); return a>180 ? a-360 : a; },
  vel: (course, speed) => ({ x: speed*Math.sin(rad(course)), y: speed*Math.cos(rad(course)) }),
  step: (p, course, speed, dtH) => ({ x: p.x + speed*Math.sin(rad(course))*dtH, y: p.y + speed*Math.cos(rad(course))*dtH }),
  dist: (a, b) => Math.hypot(b.x-a.x, b.y-a.y),
  /** a에서 본 b의 진방위(컴퍼스 방위) */
  bearing: (a, b) => norm(deg(Math.atan2(b.x-a.x, b.y-a.y))),
  /** 진방위 → 상대방위(선수 기준, 0~360) */
  rel: (trueBrg, heading) => norm(trueBrg - heading),
  /** 두 선박(위치 p, 침로 c, 속력 s)의 CPA(NM)와 TCPA(h). TCPA<0 이면 이미 지나침 */
  cpa(p1, c1, s1, p2, c2, s2){
    const v1 = W.nav.vel(c1,s1), v2 = W.nav.vel(c2,s2);
    const dx = p2.x-p1.x, dy = p2.y-p1.y, dvx = v2.x-v1.x, dvy = v2.y-v1.y;
    const dv2 = dvx*dvx + dvy*dvy;
    const t = dv2 < 1e-9 ? 0 : -(dx*dvx + dy*dvy)/dv2;
    return { cpa: Math.hypot(dx+dvx*t, dy+dvy*t), tcpa: t, range: Math.hypot(dx,dy) };
  },
  /** observer 가 target 을 볼 때 보이는 등화 (COLREG 제21조 조사각)
      target: {x,y,heading}. 반환 {masthead, stbd, port, stern, rb} — rb는 target 선수 기준 observer의 상대방위 */
  lightsSeen(observer, target){
    const rb = norm(W.nav.bearing(target, observer) - target.heading);
    const fwd = rb <= 112.5 || rb >= 247.5;
    const ahead = rb < 0.5 || rb > 359.5;   // 정선수: 양현등 모두 보임
    return { rb, masthead: fwd, stbd: rb <= 112.5 || ahead, port: rb >= 247.5 || ahead, stern: !fwd };
  },
  /** 두 동력선의 조우 관계 (상호 시계, 제13~15조 단순 판정)
      own/tgt: {x,y,heading}. 반환 {type:'overtaking'|'head-on'|'crossing'|'none', giveWay:'own'|'tgt'|'both', standOn} */
  situation(own, tgt, headOnTol = 6){
    const rbTgtFromOwn = norm(W.nav.bearing(own, tgt) - own.heading);   // 내가 본 상대
    const rbOwnFromTgt = norm(W.nav.bearing(tgt, own) - tgt.heading);   // 상대가 본 나
    const abaft = rb => rb > 112.5 && rb < 247.5;                        // 정횡 후 22.5° 넘는 쪽
    if(abaft(rbOwnFromTgt)) return { type:'overtaking', giveWay:'own', standOn:'tgt' };
    if(abaft(rbTgtFromOwn)) return { type:'overtaking', giveWay:'tgt', standOn:'own' };
    const recip = Math.abs(W.nav.signed(own.heading - tgt.heading + 180));
    const nearAhead = rb => rb <= headOnTol || rb >= 360-headOnTol;
    if(recip <= headOnTol*2 && nearAhead(rbTgtFromOwn) && nearAhead(rbOwnFromTgt)) return { type:'head-on', giveWay:'both', standOn:null };
    if(rbTgtFromOwn < 180) return { type:'crossing', giveWay:'own', standOn:'tgt' };   // 상대가 내 우현
    return { type:'crossing', giveWay:'tgt', standOn:'own' };
  },
  fmtDeg: a => String(Math.round(norm(a))%360).padStart(3,'0')+'°',
  fmtNM: d => d.toFixed(d < 10 ? 2 : 1)+' NM',
  fmtMin: h => (h*60).toFixed(1)+' 분'
};
W.nav.toScreen = (p, v) => ({ x: v.cx + (p.x - (v.ox||0))*v.scale, y: v.cy - (p.y - (v.oy||0))*v.scale });

/* ---------- 그림 부품 (SVG 문자열; 선수가 위(북)를 향하고 원점 중심) ----------
   사용: g.innerHTML = W.parts.ship({type:'power'}); g.setAttribute('transform', `translate(x y) rotate(heading)`) */
W.parts = {
  /** 위에서 본 선체. type: power|sail|fishing|tow|big|small, len: 픽셀 길이, fill/stroke 지정 가능, role: standon|giveway 테두리 색 */
  ship(o = {}){
    const L = o.len || 40, B = L*(o.type==='sail' ? .3 : o.type==='big' ? .2 : .26);
    const fill = o.fill || 'var(--panel)';
    const stroke = o.role==='standon' ? 'var(--standon)' : o.role==='giveway' ? 'var(--giveway)' : (o.stroke || 'var(--ink)');
    const sw = o.role ? 2.4 : 1.4;
    const h = L/2, b = B/2;
    const hull = `M0 ${-h} C ${b*.9} ${-h*.55}, ${b} ${-h*.1}, ${b} ${h*.35} L ${b*.8} ${h} L ${-b*.8} ${h} L ${-b} ${h*.35} C ${-b} ${-h*.1}, ${-b*.9} ${-h*.55}, 0 ${-h} Z`;
    let extra = '';
    if(o.type==='sail'){
      extra = `<line x1="0" y1="${-h*.15}" x2="${b*.2}" y2="${h*.75}" stroke="${stroke}" stroke-width="2.2" stroke-linecap="round"/>`;
      if(o.boom!=null){ const a = o.boom; extra = `<line x1="0" y1="${-h*.15}" x2="${Math.sin(rad(a))*L*.55}" y2="${-h*.15+Math.cos(rad(a))*L*.55}" stroke="${stroke}" stroke-width="2.4" stroke-linecap="round"/>`; }
    } else if(o.type==='fishing'){
      extra = `<rect x="${-b*.55}" y="${h*.05}" width="${b*1.1}" height="${h*.35}" rx="2" fill="none" stroke="${stroke}" stroke-width="1"/>`+
              (o.gear ? `<path d="M0 ${h} L 0 ${h+L*1.2}" stroke="${stroke}" stroke-dasharray="3 3" stroke-width="1.2" fill="none"/>` : '');
    } else if(o.type==='tow'){
      extra = `<line x1="0" y1="${h}" x2="0" y2="${h+L*1.4}" stroke="${stroke}" stroke-width="1.2"/><rect x="${-b*1.1}" y="${h+L*1.4}" width="${b*2.2}" height="${L*.9}" rx="3" fill="${fill}" stroke="${stroke}" stroke-width="1.2"/>`;
    } else {
      extra = `<rect x="${-b*.55}" y="${h*.35}" width="${b*1.1}" height="${h*.3}" rx="2" fill="none" stroke="${stroke}" stroke-width="1"/>`;
    }
    return `<path d="${hull}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>${extra}`;
  },
  /** 등화 하나 (빛 번짐 포함). color: port|stbd|white|yellow 또는 CSS 색 */
  light(color, r = 4, x = 0, y = 0){
    const c = W.C[color] || color;
    return `<circle cx="${x}" cy="${y}" r="${r*2.6}" fill="${c}" opacity=".22"/><circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
  },
  /** 수직으로 단 전주등 묶음 (위→아래). list 예: ['port','port'] = 홍·홍 (NUC) */
  lightStack(list, x = 0, y = 0, gap = 16, r = 5){
    return list.map((c, i) => W.parts.light(c, r, x, y + i*gap)).join('');
  },
  /** 형상물. kind: ball|diamond|cylinder|cone-up|cone-down|cones-apex|cones-base, s=크기 */
  shape(kind, x = 0, y = 0, s = 14, fill = 'var(--ink)'){
    const k = s/2;
    switch(kind){
      case 'ball': return `<circle cx="${x}" cy="${y}" r="${k}" fill="${fill}"/>`;
      case 'diamond': return `<path d="M${x} ${y-s*.9} L${x+k} ${y} L${x} ${y+s*.9} L${x-k} ${y}Z" fill="${fill}"/>`;
      case 'cylinder': return `<rect x="${x-k*.75}" y="${y-s*.9}" width="${k*1.5}" height="${s*1.8}" rx="2" fill="${fill}"/>`;
      case 'cone-up': return `<path d="M${x} ${y-k} L${x+k} ${y+k} L${x-k} ${y+k}Z" fill="${fill}"/>`;
      case 'cone-down': return `<path d="M${x} ${y+k} L${x+k} ${y-k} L${x-k} ${y-k}Z" fill="${fill}"/>`;
      case 'cones-apex': return `<path d="M${x-k} ${y-s} L${x+k} ${y-s} L${x} ${y}Z M${x} ${y} L${x+k} ${y+s} L${x-k} ${y+s}Z" fill="${fill}"/>`;
      case 'cones-base': return `<path d="M${x} ${y-s} L${x+k} ${y} L${x-k} ${y}Z M${x-k} ${y} L${x+k} ${y} L${x} ${y+s}Z" fill="${fill}"/>`;
    }
    return '';
  },
  /** 등화 조사각 부채꼴 (선수 위 방향 기준). r=반지름. which: ['masthead','side','stern'] */
  sectors(r = 120, which = ['masthead','side','stern'], opacity = .22){
    const arc = (from, to, color, rr) => {
      const a1 = rad(from), a2 = rad(to);
      const x1 = Math.sin(a1)*rr, y1 = -Math.cos(a1)*rr, x2 = Math.sin(a2)*rr, y2 = -Math.cos(a2)*rr;
      const large = ((to-from+360)%360) > 180 ? 1 : 0;
      return `<path d="M0 0 L${x1} ${y1} A${rr} ${rr} 0 ${large} 1 ${x2} ${y2} Z" fill="${color}" opacity="${opacity}"/>`;
    };
    let s = '';
    if(which.includes('stern'))    s += arc(112.5, 247.5, 'var(--ink-3)', r*.8);
    if(which.includes('side'))     s += arc(0, 112.5, 'var(--stbd)', r*.9) + arc(247.5, 360, 'var(--port)', r*.9);
    if(which.includes('masthead')) s += arc(247.5, 112.5+360, 'var(--light-white)', r).replace(`opacity="${opacity}"`, `opacity="${opacity*.9}" stroke="var(--ink-3)" stroke-dasharray="3 4" fill-opacity="${opacity*.5}"`);
    return s;
  },
  /** 나침반 눈금 링 (중심 원점) */
  compass(r = 100, step = 10){
    let s = `<circle r="${r}" fill="none" stroke="var(--ink-3)" stroke-width="1"/>`;
    for(let a = 0; a < 360; a += step){
      const big = a % 30 === 0, rr = big ? r-9 : r-5, x1 = Math.sin(rad(a))*r, y1 = -Math.cos(rad(a))*r;
      s += `<line x1="${x1}" y1="${y1}" x2="${Math.sin(rad(a))*rr}" y2="${-Math.cos(rad(a))*rr}" stroke="var(--ink-3)" stroke-width="${big?1.2:.7}"/>`;
      if(big) s += `<text x="${Math.sin(rad(a))*(r-20)}" y="${-Math.cos(rad(a))*(r-20)+4}" text-anchor="middle" font-size="10" font-family="var(--f-mono)" fill="var(--ink-2)">${String(a).padStart(3,'0')}</text>`;
    }
    return s;
  },
  /** 화살표 마커 defs. id 이름으로 marker-end="url(#id)" */
  arrowDefs(id = 'arr', color = 'var(--ink-2)'){

  /** 세그먼트 선택. options: [{value,label}] */
  seg(parent, options, value, onchange, label){
    const wrap = W.h('div', {class:'seg', role:'group'});

  /** 읽기값 칸. 반환 setter(text) */
  stat(parent, label){

  }
};

/* ---------- 방문 수 / 오답 ---------- */
const visits = () => store.get('visits', {});

/* ---------- 왼쪽 문서 레일 (천문항해 위키와 같은 구조) ---------- */
const backCount = id => ORDER.filter(x => x.id !== id && (String(x.body)+String(x.summary)).includes('[['+id)).length;
const railName = d => d.rule!=null ? (d.short || d.title.replace(/^제\d+조(의\d+)?\s*/,'')) : label(d);
const enKey = d => (d.en || d.title).replace(/^Rule\s+\d+\s*·\s*/i,'');
const SORTS = {
  order:  ['목차순'],
  ko:     ['가나다', (a,b) => railName(a).localeCompare(railName(b),'ko')],
  en:     ['ABC', (a,b) => enKey(a).localeCompare(enKey(b),'en')],
  many:   ['방문 많은 순', (a,b,v) => (v[b.id]||0)-(v[a.id]||0)],

  const v = visits(), l = store.get('lastVisit', {}), idx = new Map(ORDER.map((d,i) => [d.id,i]));
  const bc = {}; if(key === 'links') list.forEach(d => bc[d.id] = backCount(d.id));

  return list.slice().sort((a,b) => (f ? f(a,b,v,l,bc) : 0) || idx.get(a.id)-idx.get(b.id));
}
const vcHtml = n => h('span', {class:'vc' + (n===0 ? ' zero' : n>=5 ? ' hot' : ''), title:`${n}회 방문`, text:String(n)});
function railItem(d, cur, v, flat){

    d.rule!=null ? h('span', {class:'rn', text:d.rule+'조'}) : null,
    h('span', {class:'t'}, railName(d), flat && d.rule==null ? h('small', {text:groupOf(d.group).name.replace(/^Part [AB] /,'').split(' ')[0]}) : null),

function foldLabel(rail){

  btn.innerHTML = ''; btn.append(h('span', {class:'chev2' + (anyOpen ? '' : ' down'), 'aria-hidden':'true'}), anyOpen ? '모두 접기' : '모두 펼치기');

}

  const rail = document.getElementById('side');

  const v = visits(); const docs = ORDER.filter(d => d.group !== 'terms');
  const seen = ORDER.filter(d => v[d.id]).length;

/* 레일 위치 막대: 구분선 위 얇은 막대, 끌어서 스크롤 */
function setupRailThumb(){

/* ---------- 페이지 ---------- */
const page = () => document.getElementById('page');

function renderDoc(d){

  renderSide(id);

/* ---------- 검색 ---------- */
function setupSearch(){
  const q = document.getElementById('q'), res = document.getElementById('results');
  const idx = ORDER.map(d => ({ d, text: [d.title, d.en, d.short, (d.tags||[]).join(' '), W.plain(d.summary), W.plain(d.body), (d.original||[]).map(o => W.plain(o.ko)+' '+W.plain(o.en)).join(' ')].join(' ').toLowerCase() }));
  const termIdx = W.terms.map(t => ({ t, text:(t.en+' '+t.ko+' '+(t.note||'')).toLowerCase() }));
  let sel = -1;
  const run = () => {
    const s = q.value.trim().toLowerCase();
    if(!s){ res.hidden = true; return; }
    const ruleNo = (s.match(/^(?:제\s*)?(\d{1,2})\s*조$/) || s.match(/^rule\s*(\d{1,2})$/) || [])[1];
    let hits = [];
    if(ruleNo) hits = idx.filter(x => String(x.d.rule) === ruleNo).map(x => ({x, score:100}));
    const words = s.split(/\s+/);
    idx.forEach(x => {
      if(!words.every(w => x.text.includes(w))) return;
      let score = 1; const t = x.d.title.toLowerCase();
      if(t.includes(s)) score += 20; if((x.d.tags||[]).join(' ').toLowerCase().includes(s)) score += 8;
      if(!hits.find(hh => hh.x === x)) hits.push({x, score});
    });
    hits.sort((a,b) => b.score-a.score);
    const tHits = termIdx.filter(x => words.every(w => x.text.includes(w))).slice(0, 4);
    res.innerHTML = ''; sel = -1;
    const snip = (text) => { const i = text.indexOf(words[0]); if(i < 0) return ''; const a = Math.max(0, i-30); return (a?'…':'') + esc(text.slice(a, i+60)).replace(new RegExp(words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g'), m => `<mark>${m}</mark>`) + '…'; };
    hits.slice(0, 8).forEach(({x}) => res.append(h('a', {href:'#'+x.d.id, html:`<b>${esc(x.d.title)}</b><small>${snip(x.text)}</small>`})));
    tHits.forEach(({t}) => res.append(h('a', {href: t.doc ? '#'+t.doc : '#glossary', html:`<b>${esc(t.en)} · ${esc(t.ko)}</b><small>영어 용어장</small>`})));
    if(!res.childNodes.length) res.append(h('div', {class:'empty', style:{padding:'14px'}, text:'검색 결과가 없습니다.'}));
    res.hidden = false;
  };
  q.addEventListener('input', run);
  q.addEventListener('focus', run);
  q.addEventListener('keydown', e => {
    const items = [...res.querySelectorAll('a')];
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); sel = Math.max(0, Math.min(items.length-1, sel + (e.key==='ArrowDown'?1:-1))); items.forEach((a,i) => a.classList.toggle('on', i===sel)); }
    if(e.key === 'Enter'){ const a = items[Math.max(0, sel)]; if(a){ location.hash = a.getAttribute('href'); res.hidden = true; q.blur(); } }
    if(e.key === 'Escape'){ res.hidden = true; q.blur(); }
  });
  document.addEventListener('click', e => { if(!e.target.closest('.search')) res.hidden = true; });
  res.addEventListener('click', e => { if(e.target.closest('a')){ res.hidden = true; q.value = ''; } });
}

/* ---------- 링크 미리보기 ---------- */
function setupTips(){
  const pop = document.getElementById('tipPop');
  document.addEventListener('mouseover', e => {
    const a = e.target.closest('a.wl[data-doc]'); if(!a){ pop.hidden = true; return; }
    const d = W.docs[a.dataset.doc]; if(!d) return;
    pop.innerHTML = `<b>${esc(d.title)}</b>${esc(W.plain(d.summary||'').slice(0,140))}`;
    pop.hidden = false;
    const r = a.getBoundingClientRect();
    const x = Math.min(window.innerWidth - 336, Math.max(8, r.left));
    pop.style.left = x+'px';
    pop.style.top = (r.bottom + 8 + 120 > window.innerHeight ? r.top - pop.offsetHeight - 8 : r.bottom + 8)+'px';
  });
  document.addEventListener('scroll', () => pop.hidden = true, {passive:true});
}

W.boot = function(){
  buildOrder();
  setupSearch(); setupTips(); setupRailThumb();
  document.getElementById('menuBtn').addEventListener('click', () => document.body.classList.toggle('menu-open'));
  window.addEventListener('hashchange', route);
  route();
};
W.renderQuestion = renderQuestion;
W.processBody = processBody;
})();

}catch(e){console.error("[load] src/engine.js", e)}
</script>
<script>/* src/docs/intro-colreg.js */
try{
W.doc({
  id: 'intro-colreg',
  group: 'start',
  order: 1,
  week: '2주차',
  star: false,
  title: 'COLREG란',
  short: 'COLREG란',
  en: 'International Regulations for Preventing Collisions at Sea, 1972',
  tags: ['포트투포트', '좌현·우현', '국제규칙·지역규칙', '항법 미리보기'],
  summary: '바다의 교통법규. 다른 배를 만나면 서로 우현으로 돌아 <strong>좌현과 좌현이 비켜 지나가는(port to port)</strong> 것이 도로의 중앙선만큼 중요한 기본 원칙이다.',
  body: `
<h3>바다의 교통법규</h3>
<p>COLREG의 정식 이름은 <em>Convention on the International Regulations for Preventing Collisions at Sea, 1972</em>(1972년 국제해상충돌예방규칙협약)이다. 영어권에서는 흔히 <span class="en">Rules of the Road</span> 또는 <span class="en">Navigation rules</span>라고 부른다. 목적은 둘 이상의 선박 사이의 충돌을 막는 것이고, 넓게는 해저·암초·부두 등 그 무엇과도 부딪히지 않게 하는 것이다.{{fn:2주차 슬라이드 「COLREG 개요」 4·6}}</p>
<p>도로교통법에는 "중앙선 우측 통행, 제한속도 준수, 안전거리 확보, 앞지르기는 앞차의 좌측으로, 난폭운전 금지" 같은 규칙이 있다. 바다는 사정이 다르다.</p>
<ul>
  <li>도로처럼 통로를 공간적으로 확정할 수 없다(중앙선을 그을 수 없다).</li>
  <li>국제 해상 수송로는 여러 나라의 영해와 이어져 있다. 그래서 <strong>국제적으로 통일된 항법</strong>이 필요하다.</li>
  <li>선박은 다른 교통수단보다 훨씬 크고, 조종에 오랜 경험과 기술이 필요하다.</li>
  <li>충돌·좌초·전복이 나면 인명·재산·환경 피해가 대형으로 생긴다.</li>
</ul>
<p>적용 범위도 정치적 경계와 이어진다. 내륙 수로(inland waterways)는 각국의 국내 항행규칙을, 연안 수로(coastal waterways)와 그 바깥은 국제 항행규칙인 COLREG을 따른다. 정확히 어디까지 적용되는지는 [[rule-01]]에서 다룬다.{{fn:2주차 슬라이드 「COLREG 개요」 5–6}}</p>

<h3>포트투포트(Port to Port)</h3>
<p>도로의 "중앙선"에 해당하는 원칙이 <strong>포트투포트</strong>다. 다른 배를 만나면 서로 우현으로 변침해 <strong>좌현과 좌현이 마주 보며 비켜 지나가도록</strong> 한다.</p>
<ul>
  <li>좌현 현등은 홍등이므로 <span class="en">red to red</span>(레드투레드)라고도 한다. 서로 상대의 빨간 등을 보며 지나간다는 뜻이다.</li>
  <li>좁은 곳에서 VHF로 통항 방법을 합의할 때 실제로 "port to port" 또는 "red to red"라고 말한다.</li>
  <li>상대선이 눈에 보일 때의 이야기다. 보이지 않으면 상대의 좌현·우현을 알 수 없다(그때의 항법은 제19조, 중간고사 범위 밖).</li>
</ul>
<p>1840년 런던의 트리니티 하우스(Trinity House)가 동력선과 범선의 항행 관행을 정리해 만든 항행규칙도 이 포트투포트를 담고 있었다. 자세한 흐름은 [[intro-history]] 참고.{{fn:2주차 슬라이드 「COLREG 개요」 10 / 정리본 1장 "포트투포트"}}</p>

<h3>좌현·우현이라는 말의 유래</h3>
<p>배에서는 left/right를 쓰지 않는다. 지시하는 사람이 어느 쪽을 보고 있느냐에 따라 방향이 바뀌기 때문이다. 그래서 선수미선을 기준으로 한 절대적인 방향인 <span class="en">port</span>(좌현)와 <span class="en">starboard</span>(우현)를 쓴다.</p>
<div style="max-width:620px;margin:16px auto">

<ul>
  <li>옛 범선은 조타용 노(<span class="en">steering board</span>)가 선체 오른쪽에 있었다. steer-board가 발음하기 쉽게 변해 <strong>starboard(우현)</strong>가 되었다.</li>
  <li>노가 오른쪽에 있으니 부두에는 노가 다치지 않게 항상 왼쪽을 붙였다. 그래서 부두(port) 쪽인 왼쪽이 <strong>port(좌현)</strong>가 되었다.</li>
</ul>
<div class="tip">색으로 기억하기: 좌현 = 홍등(port 와인은 붉다), 우현 = 녹등. 등화의 정확한 조사각은 [[term-light-arcs]] 참고.</div>

<h3>기본 항법 미리보기</h3>
<table>
  <thead><tr><th>조우 형태</th><th>기본 동작</th><th>자세히</th></tr></thead>
  <tbody>
    <tr><td>마주칠 때(head-on)</td><td>둘 다 우현 변침 → 포트투포트</td><td>[[rule-14]]</td></tr>
    <tr><td>추월할 때(overtaking)</td><td>뒤에서 추월하는 배의 책임. 앞 배는 그대로 간다. 좁은 수로에서는 앞 배의 동의(기적 신호)를 받아야 추월할 수 있다</td><td>[[rule-13]], [[rule-09]]</td></tr>
    <tr><td>횡단할 때(crossing)</td><td>상대가 좌측에서 접근하면 그대로 가고, 우측에서 접근하면 내가 우현 변침해 피한다. 헷갈리면 무조건 우현 변침</td><td>[[rule-15]], [[term-jwagowoopi]]</td></tr>
  </tbody>
</table>
<p>야간에는 상대선의 좌현 홍등, 우현 녹등, 선미 백등을 보고 진행 방향을 판단한다. 이 판별법을 교수님은 [[term-jwagowoopi|좌고우피]]로 외우게 했다.{{fn:정리본 1장 "기본 항법 미리보기"}}</p>

<h3>국제규칙과 지역 규칙</h3>
<p>COLREG은 전 세계에 적용되지만, 각국은 자국 수역에 별도 규칙을 둘 수 있다([[rule-01]] (b)·(c)). 예를 들어 우리나라 무역항의 방파제 입구에서는 <strong>출항선이 우선</strong>한다. 입항선이 방파제 밖에서 출항선의 진로를 피해야 한다.</p>
<p>COLREG만 보면 입항선이 유지선인 상황이라도, 국내법인 <strong>「선박의 입항 및 출항 등에 관한 법률」</strong>(약칭 선박입출항법, 구 개항질서법)이 먼저 적용된다. 이것이 [[rule-01]]에서 다루는 <strong>특별법 우선의 원칙</strong>이다.{{fn:2주차 슬라이드 「COLREG 개요」 8–9 (부산 내항 오륙도·조도 방파제 그림) / 정리본 1장 "국제규칙과 지역 규칙"}}</p>

<h3>범선 시대의 관습 세 가지</h3>
<p>최초의 성문 항법은 범선들 사이에서 내려오던 관습을 법으로 옮긴 것이었다. 이 관습이 오늘날 범선 항법([[rule-12]])의 뿌리다.</p>
<ol>
  <li>좌현으로 바람을 받는 범선이 피한다.</li>
  <li>같은 쪽에서 바람을 받으면 바람이 불어오는 쪽(풍상) 범선이 피한다.</li>
  <li>상대가 어느 쪽으로 바람을 받는지 모르면 내가 피한다.</li>
</ol>
<p>좌현택·풍상 같은 용어는 [[term-tack]]에서 정리한다.</p>

<h3>타령(helm order)의 변화</h3>
<p>초기에는 타령이 틸러(<span class="en">tiller</span>, 방향타 손잡이)를 움직이는 방향을 기준으로 했다. "스타보드" 구령은 틸러를 우현 쪽으로 밀라는 뜻이었고, 그러면 타판은 반대인 좌현 쪽으로 꺾여 선수가 <strong>왼쪽으로</strong> 돌았다.{{fn:슬라이드 11에는 "우현 조타 명령이 틸러를 좌현으로 돌리라는 뜻으로 쓰였다"고 적혀 있다. 틸러를 좌현으로 밀면 선수는 우현으로 돌므로, 정리본의 "스타보드 구령에 선수가 왼쪽으로 돌았다"와 맞추려면 틸러를 우현 쪽으로 미는 것이 맞다. 시험에서는 핵심인 "구령과 실제 회두 방향이 반대였다 → 일치시키도록 바꿨다"를 쓰면 된다.}} 구령과 실제 회두 방향이 반대라 사고가 나자, 1929년 SOLAS 개정을 계기로 구령 방향과 타(선수 회두) 방향을 일치시키도록 바꿨다(1930년대 초 정착).{{fn:2주차 슬라이드 「COLREG 개요」 11 / 정리본 1장 "타령의 변화"}}</p>
<div class="tip">그래서 1912년이 배경인 영화 「타이타닉」에서 "하드 스타보드(Hard a-starboard)" 구령에 조타수가 타륜을 왼쪽으로 돌리는 장면은 고증이 맞다. 당시 구령은 틸러 기준이었다.</div>

<script>/* src/docs/review-giveway.js */

  summary: '항법 관계는 유지선·피항선만 있는 것이 아니다. 마주침은 <strong>둘 다 피항선</strong>, 좁은 수로·TSS·흘수제약선에는 <strong>통항 방해 금지</strong>가 있다. 제9·10·12·13·14·15·18조에서 내가 피하거나 방해하지 말아야 하는 경우를 한 표로 모았다.',
  body: `
<h3>항법 관계의 종류</h3>
<p>항법 관계란 누가 피하고 누가 유지하는지의 관계다. 채무관계에서 누가 채권자·채무자인지 묻는 것과 같다. 서로 멀어지고 있으면(충돌의 위험이 없으면, [[rule-07]]) 항법 관계는 생기지 않는다.{{fn:10주차 정리본 16장 「종합 정리」 / 9주차 정리본 11장}}</p>
<table>
<thead><tr><th>관계</th><th>뜻</th><th>예</th></tr></thead>
<tbody>
<tr><td>피항선 ↔ 유지선</td><td>한쪽이 진로를 피하고(<span class="en">keep out of the way</span>), 다른 쪽은 침로·속력 유지(<span class="en">keep her course and speed</span>)</td><td>추월, 횡단, 범선끼리, 선박 종류</td></tr>
<tr><td>둘 다 피항선</td><td>유지선이 없다. 각자 피한다</td><td>마주치는 상태</td></tr>
<tr><td>방해 금지</td><td>상대의 안전한 통항을 방해하지 않는다(<span class="en">not impede</span>). 엄밀히는 피항선·유지선 관계가 아니다</td><td>좁은 수로, TSS, 흘수제약선</td></tr>
</tbody>
</table>

<h3>내가 피해야(방해하지 말아야) 하는 경우</h3>
<table>
<thead><tr><th>상황</th><th>피항선·방해 금지 선박</th><th>근거</th></tr></thead>

<tr><td>좁은 수로</td><td>길이 20m 미만 선박·범선, 어로종사선, 횡단선 → 수로 안에서만 안전하게 항행할 수 있는 선박의 통항 방해 금지</td><td>[[rule-09]]</td></tr>
<tr><td>TSS</td><td>20m 미만·범선(통항로를 따르는 동력선 방해 금지), 어로종사선(통항로를 따르는 모든 선박 방해 금지). 횡단선은 가능한 한 횡단을 피하되, 만나면 일반 항법 적용</td><td>[[rule-10]]</td></tr>
<tr><td>범선끼리</td><td>좌현에 바람을 받는 범선(좌현택) / 같은 쪽이면 풍상 범선 / 애매하면 좌현택 범선</td><td>[[rule-12]]</td></tr>
<tr><td>추월</td><td>추월선 (완전히 추월하고 충분히 멀어질 때까지)</td><td>[[rule-13]]</td></tr>
<tr><td>마주침</td><td>두 선박 모두 (각각 우현 변침)</td><td>[[rule-14]]</td></tr>
<tr><td>횡단</td><td>상대선을 우현에 둔 선박. 사정이 허락하면 선수 횡단 금지</td><td>[[rule-15]]</td></tr>
<tr><td>선박 종류</td><td>조종 성능이 좋은 선박이 나쁜 선박을 피함 (NUC &gt; RAM &gt; CBD &gt; 어로종사선 &gt; 범선 &gt; 동력선 &gt; 수상항공기·WIG)</td><td>[[rule-18]]</td></tr>
</tbody>
</table>
<div class="star" data-note="퀴즈 출제 — 추월 종료, 마주침"><p><strong>추월선</strong>은 상대를 <strong>완전히 추월하고 충분히 멀어질 때까지</strong> 피항선이다(제13조). 나란히 가거나 앞질러도 의무가 끝나지 않는다. <strong>마주치는 상태</strong>에서는 <strong>두 선박 모두 피항선</strong>이며 각각 우현 변침해 좌현 대 좌현으로 지나간다(제14조). <strong>횡단</strong>에서는 상대선을 <strong>우현</strong>에 둔 선박이 피항선이다(제15조).</p></div>

<h3>자주 틀리는 포인트</h3>

<li><strong>범선은 NUC·RAM·어로종사선을 피한다.</strong> 어로종사선과 범선이 만나면 범선이 피항선이다.</li>

<h3>(b) 특별규칙: "방해하지 않는다"</h3>
<p>관할 당국이 정박지(묘박지)·항만·하천·호수·내륙수로에 대해 만든 <strong>특별규칙</strong>의 시행을 COLREG이 방해하지 않는다. 대상 수역도 (a)와 똑같이 "공해와 연결되어 있고 해양항행선이 항행할 수 있는" 곳이다.</p>

</ul>

<h3>(c) 추가 등화·형상물·기적신호</h3>
<p>각국 정부는 <strong>군함과 호송 선단</strong>에 추가 위치등·신호등·형상물·기적신호를, <strong>선단을 지어 어로하는 어선</strong>에 추가 위치등·신호등·형상물을 정할 수 있다. 조건은 COLREG의 다른 등화·형상물·신호와 <strong>오인되지 않아야</strong> 한다는 것이다(<span class="en">elsewhere</span> = "이 규칙의 다른 곳에서").</p>
<ul>
  <li>예: 일본 어선단이 자기들끼리 같은 등·기를 달고 움직이는 경우, 잠수부 작업 중 국제신호기 A기.</li>
  <li>강의 예시: 호주 시드니항에는 노란색 섬광등을 단 고속 여객선을 무조건 피해야 하는 지역 규칙이 있다.</li>
</ul>
<div class="fix">강의에서는 "COLREG에는 노란 섬광등이 없다"고 했으나, COLREG 제23조에 비배수량 상태로 항행하는 공기부양선의 <strong>황색 섬광등</strong>이 있다.{{fn:정리본 2장 〔정정〕. COLREG 제23조(b)(비배수량 상태로 운항하는 공기부양선의 황색 섬광 전주등)}}</div>

<h3>(d) 통항분리제도</h3>
<p>IMO(조문의 <span class="en">the Organization</span>)는 통항분리제도(TSS)를 채택할 수 있다. 도버해협 같은 국제해협의 TSS는 관계국(영국·프랑스)이 만들어 IMO의 승인을 받는다. 호르무즈 해협 TSS처럼 국제 승인을 받은 제도를 한 나라가 일방적으로 바꾸면 국제 질서가 흔들린다. TSS에서의 항법은 [[rule-10]], 용어는 [[term-tss]] 참고.{{fn:2주차 슬라이드 「Part A 제1조」 11 / 정리본 2장 (d)}}</p>

<h3>(e) 특수 구조·목적의 선박</h3>
<p>특수한 구조나 목적의 선박(예: 항공모함, 잠수함)이 등화·형상물의 수·위치·시인거리·조사각, 음향신호기구의 배치·특성을 COLREG대로 갖출 수 없으면, 그 정부가 정한 <strong>가능한 한 가까운</strong> 규정을 따른다. 음향신호기구 부분은 1987년 개정(1989년 발효)으로 더해진 문구다.{{fn:2주차 슬라이드 「Part A 제1조」 12 / 「COLREG 개요」 13 개정 연혁}}</p>

<h3>국내법과의 관계: 특별법 우선의 원칙</h3>
<p>우리나라에서 항법을 정하는 법은 셋이다.</p>
<table>
  <thead><tr><th>법</th><th>성격</th><th>비고</th></tr></thead>
  <tbody>
    <tr><td>COLREG</td><td>국제협약(일반법)</td><td>공해와 연결된 항행 가능 수역 전체</td></tr>
    <tr><td>해상교통안전법(구 해사안전법)</td><td>COLREG을 국내법으로 수용한 일반법</td><td>영해·내수 + 영해 밖의 한국 선박</td></tr>
    <tr><td>선박의 입항 및 출항 등에 관한 법률(선박입출항법, 구 개항질서법)</td><td><strong>특별법</strong></td><td>무역항의 수상구역 등</td></tr>
  </tbody>
</table>
<p>여기에 정부가 연안과 그 접속 수역에 지정한 특별항행규칙, 항만 내 출입항·정박지 운영·항만시설 관리를 위한 국내규칙이 더해진다.{{fn:2주차 슬라이드 「COLREG 개요」 9 (COLREG와 국내법과의 관계)}}</p>
<h4>방파제 입구 예 (부산 내항)</h4>
<p>오륙도 방파제와 조도 방파제 사이 입구에서 입항선과 출항선이 마주칠 우려가 있다. 슬라이드 그림의 상황은 COLREG만 보면 출항선이 상대(입항선)를 우현에 두는 횡단 관계라 출항선이 피항선이다. 그러나 선박입출항법 제13조(방파제 부근에서의 항법)는 "무역항의 수상구역등에 입항하는 선박이 방파제 입구 등에서 출항하는 선박과 마주칠 우려가 있는 경우에는 <strong>방파제 밖에서 출항하는 선박의 진로를 피하여야 한다</strong>"고 정한다(일명 방파제 법칙). 이때는 특별법인 선박입출항법이 먼저 적용되어 <strong>입항선이 피한다</strong>.{{fn:2주차 슬라이드 「Part A 제1조」 8 (부산내항 그림, 선박입출항법 제13조 노트) / 「COLREG 개요」 8}}</p>
<div class="star" data-note="퀴즈로 출제">
<p>해상교통안전법·선박입출항법·COLREG이 서로 다르게 정하면 <strong>특별법 우선의 원칙</strong>에 따라 특별법(선박입출항법)을 먼저 적용한다. 항법에서는 COLREG(국내법으로는 해상교통안전법)이 일반법, 선박입출항법이 특별법이다.</p>
<p>엄밀히는 먼저 "선박이 <strong>어디에</strong> 있는가(무역항의 수상구역인가)"를 따져야 하지만, 답안에는 "특별법 우선의 원칙"이라고 쓰면 된다.</p>
</div>

<h3>선원의 상무 = 통상의 주의의무</h3>

<p><span class="en">ordinary practice of seamen</span>(선원의 상무)은 <strong>선원에게 요구되는 통상의 주의의무</strong>, 즉 선원이라면 누구나 기울일 보통의 주의를 말한다. 선원에게만 있는 특별한 의무가 아니다.</p>
<p>제8조의 <span class="en">good seamanship</span>은 <strong>선박 조종 기술(선박운용술)</strong>이고, 제2조의 ordinary practice of seamen은 <strong>주의의무</strong>다. 둘을 구분해서 쓴다.</p>
</div>
<ul>
  <li>"선원의 상무"라는 번역은 일본어 "해원의 상무(海員の常務)"를 들여와 "선원의 상무"로 바꾼 것이다. 선원에게만 있는 특별한 의무처럼 오해되므로, 교수님은 해양안전 관련 회의에서 "<strong>주의의무</strong>"로 바꾸자고 제안했다.</li>
  <li>seamanship은 기사도 같은 정신이 아니라 기술이다. craftsmanship(장인의 기술)과 같은 구조의 단어다. 자세히는 [[term-seamanship]].</li>
</ul>

<h3>주의의무의 법적 의미</h3>
<p>주의의무를 게을리했을 때 법이 어떻게 책임을 묻는지 정리하면 다음과 같다.{{fn:정리본 8장 "주의의무의 법적 의미"}}</p>
<table>
  <thead><tr><th>구분</th><th>내용</th></tr></thead>
  <tbody>
    <tr><td>민법 제750조</td><td>고의 또는 과실로 위법하게 타인에게 손해를 가하면 <strong>손해배상 책임</strong>. 결과에 대해 돈으로 책임진다</td></tr>
    <tr><td>선량한 관리자의 주의의무(선관주의의무)</td><td>평균적인 보통 사람(표준인)에게 요구되는 주의. 이를 어기면 <strong>추상적 과실</strong></td></tr>
    <tr><td>구체적 과실</td><td>자기 재산에 대한 것과 같은 정도의 주의를 게을리함. 자기 휴대폰을 떨어뜨려 깨진 것은 자기 책임</td></tr>
    <tr><td>형법</td><td>정상적으로 기울여야 할 주의를 게을리한 행위(과실)는 <strong>법률에 특별한 규정이 있는 경우에만 처벌</strong>. 신체의 자유를 제한하므로 엄격히 적용한다</td></tr>
  </tbody>
</table>
<ul>
  <li><strong>추상적 과실의 예</strong>: 친구의 고양이를 맡았다가 밥을 주지 않아 굶겼다면, "밥 주라는 말은 없었다"고 해도 손해배상 책임을 진다. 보통 사람이라면 생물에게 밥을 줄 것이기 때문이다. 선원의 상무도 같다. 규칙에 적혀 있지 않아도 보통의 선원이라면 했을 주의를 하지 않으면 책임이 생긴다.</li>
  <li><strong>인과관계 vs 상관관계</strong>: 해운대에서 아이스크림 판매량과 익사 사고는 상관관계가 있지만, 아이스크림 판매를 금지해도 익사는 줄지 않는다. 책임을 물으려면 과실과 결과 사이에 <strong>인과관계</strong>가 있어야 한다. 기관 고장을 선장 탓으로 할 수 없는 것도 같다.</li>
</ul>

<h3>해양사고 심판과 징계</h3>
<p>「해양사고의 조사 및 심판에 관한 법률」에 따라 해양사고가 해기사·도선사의 <strong>직무상 고의 또는 과실</strong>로 발생하면 재결로 징계한다. 형사처벌이 아니라 다음 세 가지다.</p>
<ul>
  <li><strong>면허 취소</strong> — 매우 드물다(교수님은 세월호 선장 사례 정도만 봤다).</li>
  <li><strong>업무정지</strong>(1개월 이상 1년 이하) — 큰 사고도 대개 3개월 안팎이다.</li>
  <li><strong>견책</strong></li>
</ul>
<p>형사 책임(업무상 과실 등)은 별도의 형사 절차에서 다룬다.</p>

<h3>(b) 절박한 위험을 피하기 위한 이탈</h3>
<p>규칙을 해석하고 지킬 때는 항행·충돌의 모든 위험과, 관련 선박의 성능상 한계를 포함한 특수한 사정을 충분히 고려해야 한다. 그런 사정 때문에 <strong>절박한 위험(immediate danger)을 피하는 데 필요하면 규칙에서 벗어날 수 있다</strong>(<span class="en">departure from these Rules</span>). COLREG의 지상 목적은 <strong>어떻게든 충돌하지 않는 것</strong>이기 때문이다.{{fn:4주차 강의 일화 / 정리본 4장 "교수님 일화", 8장 "제2조 책임". (b)항 한글 원문은 슬라이드에 없어 국내 번역 관례에 따라 정리}}</p>
<ul>
  <li>상대선이 고장이라 피할 수 없는데 "내가 유지선이니 네가 피하라"고 버틸 수는 없다.</li>
  <li>상태가 불확실하면 더 위험한 상태를 가정한다. 범선인지 동력선인지 모르면 범선으로 보고 피한다.</li>
  <li>평소 타각을 작게 쓰라는 회사 지침이 있어도, 위험하면 하드 스타보드(35도)까지 써야 한다.</li>
</ul>
<details class="story"><summary>교수님 일화: 범선인지 동력선인지 모를 때</summary><div>
<p>3등항해사 시절 부산항 입항 중 좌측에서 기범선이 접근했다. 낮이라 기관을 쓰는지 알 수 없었고 형상물도 없었다. "좌측이니 내가 유지선"이라며 계속 가다가, 대형선 선수 앞의 사각지대(blind sector, 최대 500m 정도)로 범선이 들어가 버렸다. 결국 우현 15도를 써서 겨우 피했고 기관실에서는 경보가 울렸다.</p>
<p>주니어 항해사는 규정대로 하려 하지만, 선장은 <strong>안전하게 항해하는 것</strong>을 우선한다. 자세한 맥락은 [[rule-18]].</p>
</div></details>

  <thead><tr><th>법</th><th>나누는 기준</th><th>예</th></tr></thead>
  <tbody>
    <tr><td>선박법</td><td>추진 방식</td><td>기선·범선·부선</td></tr>
    <tr><td>상법</td><td>상행위 여부</td><td>실습선은 상법상 선박이 아님</td></tr>
    <tr><td><strong>COLREG</strong></td><td><strong>조종 성능</strong></td><td>NUC·RAM·CBD·어로종사선·범선·동력선</td></tr>
  </tbody>
</table>
<p>원칙은 하나다. <strong>조종 성능이 나쁠수록 항법상 우선권을 갖고, 조종 성능이 좋은 선박이 나쁜 선박을 피한다</strong>([[rule-18]]). 그래서 이 정의들이 뒤의 모든 항법의 출발점이 된다.{{fn:3주차 강의 / 정리본 3장 도입}}</p>

<h3>(a) 선박 (vessel)</h3>
<p>선박은 <strong>수상의 교통수단으로 사용되거나 사용될 수 있는</strong> 모든 종류의 배다. 무배수량선·WIG선·수상항공기를 포함한다. <span class="en">every description</span> = 어떻게 불리든 수상 교통수단이면 모두 선박이다. 자세히는 [[term-vessel]].</p>
<ul>
  <li><strong>무배수량선</strong>(<span class="en">non-displacement craft</span>): 항주 중 선체가 수면 위로 떠 물을 밀어내지 않는 배. 공기부양선(호버크래프트, 해경 보유), 수중익선(날개만 물속에 두고 선체가 뜬다. 부산–후쿠오카 고속선).</li>
  <li><strong>WIG선</strong>(수면비행선박): 날개와 수면 사이 공기가 쿠션 역할(지면효과)을 해 연료가 적게 든다. 고도를 높이면 효과가 사라진다. 정의는 (m).</li>
  <li><strong>수상항공기</strong>(<span class="en">seaplane</span>, (e)): 수상에서 조종할 수 있도록 설계된 항공기. 수면 가까이 내려오면 높은 선박(수면 위 50m급)과 충돌 위험이 생기므로 선박으로 본다.</li>
</ul>

<h3>(b)·(c) 동력선과 범선</h3>
<ul>
  <li><strong>동력선</strong>(<span class="en">power-driven vessel</span>, PDV): 기관으로 추진되는 모든 선박.</li>
  <li><strong>범선</strong>(<span class="en">sailing vessel</span>): 돛으로 항행하는 선박. 기관이 있어도 <strong>사용하지 않으면</strong> 범선이다.</li>
  <li><strong>기범선</strong>(요즘 범선 대부분): 돛만 쓰면 범선, 기관을 쓰면(돛을 함께 펴고 있어도) 동력선이다.</li>
  <li>범선 등화: 마스트 꼭대기에 <strong>홍등 위·녹등 아래</strong> 전주등을 달 수 있다(태극기의 빨강 위·파랑 아래로 기억).</li>
</ul>
<div class="fix">강의에서 "역삼각형 원뿔을 달면 범선"이라고 했으나, 규칙상 꼭짓점을 아래로 한 원뿔 형상물은 <strong>돛과 기관을 함께 쓰는 범선</strong>, 즉 동력선으로 취급되는 선박의 표시다(제25조(e)).{{fn:정리본 3장 〔정정〕 / 3주차 슬라이드 6 "범선이 기관을 함께 사용할 때 주간 형상물"}}</div>
<p>자세히는 [[term-power-sail]]. 범선끼리의 항법은 [[rule-12]].</p>

<h3>(d) 어로에 종사하고 있는 선박</h3>
<p>그물(어망)·낚싯줄(밧줄)·트롤망 등 <strong>조종 성능을 제한하는 어구</strong>로 어로 중인 선박이다. 조종 성능을 제한하지 않는 끌낚시(<span class="en">trolling lines</span>) 등으로 어로하는 선박은 포함하지 않는다.</p>
<ul>
  <li>그냥 어선(<span class="en">fishing vessel</span>)이 아니라 <strong>어로에 종사하고 있는</strong>(<span class="en">engaged in fishing</span>) 선박이다. 어장으로 이동 중인 어선은 그냥 동력선이다.</li>
  <li>바다낚시 배는 이동해도 조종에 문제가 없으므로 해당하지 않는다.</li>
  <li>트롤선은 길이 30m여도 500m~1km의 그물을 끌어 조종이 어렵다.</li>
  <li>주간 형상물은 원뿔 두 개를 꼭짓점끼리 맞댄 <strong>장구형</strong>. 야간에 트롤 어선은 <strong>녹등 위·백등 아래</strong>, 그 밖의 어선은 <strong>홍등 위·백등 아래</strong>(범선은 홍·녹 둘 다, 어선은 그중 하나 + 백등).</li>
</ul>
<p>자세히는 [[term-fishing]].{{fn:3주차 슬라이드 7 / 4주차 슬라이드 「제3조·제18조」 6 / 정리본 3장}}</p>

<h3>(f) 조종불능선 (NUC, not under command)</h3>
<p>어떤 <strong>예외적인 사정</strong>(<span class="en">exceptional circumstance</span>)으로 이 규칙이 요구하는 대로 조종할 수 없어 다른 선박의 진로를 피할 수 없는 선박이다. 쉽게 말해 <strong>고장난 배</strong>(기관 고장, 타 고장 등)다. 서 있을 수도, 움직이고 있을 수도 있다.</p>
<ul>
  <li>상대선이 NUC면 조우 자세와 관계없이 내가 피한다. 항법상 <strong>최우선권</strong>이다.</li>
  <li>등화: <strong>홍등 2개</strong>(수직), 대수속력이 있으면 현등·선미등 추가. 형상물: <strong>흑구 2개</strong>.</li>
</ul>
<p>자세히는 [[term-nuc]].</p>

<h3>(g) 조종제한선 (RAM, restricted in her ability to manoeuvre)</h3>
<p>선박 자체는 멀쩡하지만 <strong>작업의 성질상</strong>(<span class="en">from the nature of her work</span>) 규칙대로 조종할 수 없어 진로를 피할 수 없는 선박이다. 조문은 다음 여섯 가지를 "포함하되 이에 한정하지 않는다"(<span class="en">include but not be limited to</span>).</p>
<table>
  <thead><tr><th></th><th>작업</th><th>예</th></tr></thead>
  <tbody>
    <tr><td>(i)</td><td>항로표지·해저전선·파이프라인의 부설·보수·인양</td><td>부표 설치선, 케이블 부설선</td></tr>
    <tr><td>(ii)</td><td>준설·측량·수중작업</td><td>잠수부 작업 중 움직이면 잠수부가 다친다</td></tr>
    <tr><td>(iii)</td><td>항행 중 보급, 사람·식량·화물의 이송</td><td>싱가포르 해협에서 항행 중 보급, 선원 교대</td></tr>
    <tr><td>(iv)</td><td>항공기 발착 작업</td><td>항공모함</td></tr>
    <tr><td>(v)</td><td>기뢰 제거 작업</td><td>소해함</td></tr>
    <tr><td>(vi)</td><td>진로에서 벗어나는 능력이 크게 제한되는 예인 작업</td><td>무거운 부선·선박 블록을 끄는 예인선열</td></tr>
  </tbody>
</table>
<ul>
  <li>등화: <strong>홍·백·홍</strong>(수직). 형상물: <strong>흑구·마름모·흑구</strong>.</li>
  <li><span class="en">manoeuvre</span>는 영국식 철자다. COLREG이 영국에서 시작돼 <span class="en">draught</span> 등 영국식 철자를 쓴다.</li>
</ul>
<p>자세히는 [[term-ram]].{{fn:3주차 슬라이드 9–11 (해상교통안전법 정의 노트 포함) / 정리본 3장 "조종제한선"}}</p>

<div class="star" data-note="해기사 시험 출제, 구별 못 해 감점된 답안 많음">
<p><strong>NUC와 RAM의 구별</strong>: 조종불능선(NUC)은 <strong>예외적인 사정(기관·타 고장 등)으로 조종할 수 없는 고장난 배</strong>, 조종제한선(RAM)은 <strong>배는 멀쩡하지만 하고 있는 작업의 성질상 조종이 제한된 작업선</strong>(준설·측량·케이블 부설·항행 중 보급·항공기 발착·기뢰 제거·예인 작업 등)이다. 둘 다 다른 선박의 진로를 피할 수 없다.</p>
<p>등화로도 구별된다. NUC = 홍·홍 / 흑구 2개, RAM = 홍·백·홍 / 흑구·마름모·흑구.</p>
<p><strong>NUC와 RAM이 만나면 RAM이 피한다.</strong> RAM은 그나마 조종이 되기 때문이다.</p>
</div>
<p>NUC와 RAM 사이의 관계는 제18조에 직접 적혀 있지 않다. 위 판단은 우선순위(아래 암기법)와 "조금이라도 조종이 되는 쪽이 피한다"는 원칙에 따른 교수님 설명이다.{{fn:정리본 3장 "NUC와 RAM이 만나면?" · "출제 사례". 제18조는 동력선·범선·어로종사선이 NUC·RAM을 피하도록 정할 뿐 NUC–RAM 관계는 정하지 않는다}}</p>

<h4>예인선은 언제 RAM인가</h4>
<p>아무것도 끌지 않는 예인선은 그냥 동력선이다. 서쪽으로 가는 선박 A와 북쪽으로 가는 예인선 B가 만나 B가 A를 우현에 두면 B가 피항선이다([[rule-15]]). 그러나 B가 모래 바지선이나 선박 블록을 끌어 진로를 벗어나는 능력이 크게 제한되면 RAM이 되어 <strong>A가 피항선</strong>이 된다. 그런 B도 앞에 NUC가 있으면 NUC를 피해야 한다.{{fn:3주차 슬라이드 12 "누가 피해야 하나요? 소형 모래바지·예인선·커다란 동력선" / 정리본 3장 "예인선 예시"}}</p>

<h3>(h) 흘수제약선 (CBD, constrained by her draught)</h3>
<p>흘수 때문에 가항수역의 수심과 폭에 여유가 적어 <strong>현재 따르고 있는 침로에서 벗어나는 능력이 극히 제한된 동력선</strong>이다. 정의상 <strong>동력선만</strong> CBD가 될 수 있다. 1987년 개정으로 정의가 다듬어졌다.</p>
<ul>
  <li>예: 여수항의 대형 유조선은 깊은 수심 항로로만 다닌다. 조금만 벗어나도 좌초 위험이 있다.</li>
  <li>흘수(<span class="en">draught</span>)와 선저여유수심(<span class="en">UKC</span>, under keel clearance): UKC가 작으면 뱅크 효과 등으로 조종이 어려워진다.</li>
  <li>하역 후 흘수가 줄어 여유가 생기면 더 이상 CBD가 아니다.</li>
  <li>등화: <strong>홍등 3개</strong>(수직, 동력선 등화에 추가). 형상물: <strong>원통형(실린더)</strong> 1개.</li>
  <li>다른 선박은 CBD의 진로를 "피하는" 것이 아니라 CBD의 안전한 통항을 <strong>방해하지 않아야</strong> 한다(NUC·RAM은 예외). [[rule-18]] (d)</li>
</ul>
<p>자세히는 [[term-cbd]].{{fn:3주차 슬라이드 13 / 정리본 3장 "흘수제약선". 1987년 개정은 2주차 슬라이드 「COLREG 개요」 13}}</p>

<div data-sim="vessel-sort"></div>

<p>RAM이 대수속력이 있으면 마스트등·현등·선미등을 더하고, CBD의 홍등 3개·원통형은 동력선 등화에 더하여 표시할 수 있다. 자세한 등화·형상물은 중간고사 후(제20조 이하)에 배우며, 지금은 [[review-lights]]에서 요약을 보면 된다.{{fn:정리본 16장 "등화·형상물 요약". RAM 항행 등화 추가는 COLREG 제27조(b)(iii), CBD는 제28조}}</p>

<h3>우선순위 암기법 (pecking order)</h3>
<p>조종 성능이 나쁜 순서, 즉 다른 선박이 피해 줘야 하는 순서다.</p>
<p style="text-align:center;font-family:var(--f-mono);font-size:15px"><strong>NUC → RAM → CBD → 어로종사선 → 범선 → 동력선 → 수상항공기 → WIG</strong></p>
<table>
  <thead><tr><th>암기 문장</th><th>N</th><th>R</th><th>C</th><th>F</th><th>S</th><th>P</th><th>S</th><th>W</th></tr></thead>
  <tbody>
    <tr><td>슬라이드 1</td><td>Navigation</td><td>Rules</td><td>Can</td><td>Frustrate</td><td>Some</td><td>People,</td><td>Say</td><td>What!</td></tr>
    <tr><td>슬라이드 2</td><td>New</td><td>Reels</td><td>Catch</td><td>Fish</td><td>So</td><td>Purchase</td><td>Some</td><td>Weekly.</td></tr>
    <tr><td>뜻</td><td>NUC</td><td>RAM</td><td>CBD</td><td>Fishing</td><td>Sailing</td><td>Power</td><td>Seaplane</td><td>WIG</td></tr>
  </tbody>
</table>
<p>미국 해양대학 학생들은 "(Navigation) Rules Can Frustrate Some People, Say (What)"(규칙은 몇몇 사람을 좌절시킨다)로, 수산계열에서는 "New Fish So…" 식으로 외우기도 한다. 어떻게 외워도 무방하다. 단 CBD에 대해서는 "피한다"가 아니라 "통항을 방해하지 않는다"이고, 동력선끼리는 우선순위가 같아 조우 형태로 정한다. 누가 누구를 피하는지는 [[rule-18]]에서 다룬다.{{fn:3주차 슬라이드 4·15 (퀴즈: N, R, C, F, S, P, S, W) / 4주차 슬라이드 「제3조·제18조」 3·8 / 정리본 3장 "우선순위 암기법"}}</p>

<h3>(i) 항행 중 (underway)</h3>
<p><strong>정박(묘박)하고 있지 않고, 육지에 계류되어 있지 않고, 얹혀 있지(좌초) 않은 상태</strong>다. 이 세 가지가 아니면 모두 항행 중이다. 엔진을 쓰지 않아도, 움직이지 않아도 어디에 매여 있지 않으면 항행 중이다. 제18조의 "항행 중인 동력선은…"처럼 항법 조문 대부분이 항행 중인 선박을 대상으로 한다. 자세히는 [[term-underway]].</p>

<h3>(j) 길이와 폭</h3>
<p>COLREG의 <strong>길이 = 전장</strong>(LOA, <span class="en">length overall</span>), <strong>폭 = 최대폭</strong>(<span class="en">greatest breadth</span>)이다. 충돌하면 가장 끝부분이 먼저 닿기 때문이다. 등록장·수선간장(LBP) 등 다른 길이와 구분한다. 자세히는 [[term-length]].{{fn:3주차 슬라이드 13 / 정리본 3장 "항행 중", "길이와 폭"}}</p>

<li><strong>내 역할 판단</strong> — 내가 유지선인지 피항선인지 판단한다. 동력선끼리라면 정면이면 둘 다 피항선([[rule-14]]), 상대가 좌측이면 유지선, 우측이면 피항선([[rule-15]], [[term-jwagowoopi|좌고우피]]). 선박 종류가 다르면 [[rule-18]]의 책무 순서도 본다.</li>
<li><strong>미리 계획(pre-plan)</strong> — 어떤 조치를 할지 머릿속에 미리 세운다.</li>
</ol>
<p>슬라이드는 같은 내용을 "경계를 훌륭히 수행할 수 있는 조건" 세 가지로 정리했다.</p>

</ul>

<h3>안전한 속력의 두 조건</h3>
<div class="star" data-note="시험에 100% 나옴(변형 출제)">
<p><strong>안전한 속력(safe speed)</strong>이란 충돌을 피하기 위하여 <strong>① 적절하고 유효한 동작을 취할 수 있고</strong>(<em>take proper and effective action</em>), <strong>② 당시의 사정과 조건에 알맞은 거리에서 정지할 수 있는</strong>(<em>be stopped within a distance appropriate</em>) 속력이다. 두 조건을 모두 써야 한다.</p>
<p>안전한 속력을 정할 때 <strong>모든 선박</strong>이 고려할 요소 6가지는 ① 시정의 상태 ② 어선 등의 집결을 포함한 교통 밀도 ③ 정지거리와 선회 능력을 포함한 조종 성능 ④ 야간의 배경 불빛(육상 불빛, 자선 등화의 역산란) ⑤ 바람·해면·조류의 상태와 항행 장애물의 근접 상태 ⑥ 가용 수심과 흘수의 관계다.</p>
</div>
<p>슬라이드 퀴즈는 특히 정지 조건을 묻는다. "안전한 속력이란? → 그 당시의 사정과 상태에 알맞은 거리에서 정선(<em>be stopped within a distance appropriate to the prevailing circumstances and conditions</em>)."{{fn:4주차 강의자료 ②(제4~6조) 슬라이드 9·15 / 정리본 6장}}</p>
<div class="tip"><p>주의: 슬라이드 노트의 국내법(해상교통안전법) 문장은 "적절하고 효과적인 동작을 취하<strong>거나</strong> … 멈출 수 있도록"이라고 "또는"으로 이어져 있다. 그러나 COLREG 원문은 "take proper and effective action … <strong>and</strong> be stopped"로 두 조건을 <strong>모두</strong> 요구한다. COLREG 답안에는 두 조건을 다 쓴다.{{fn:4주차 강의자료 ③(제4~6조 계속) 슬라이드 11 노트(국내법 안전한 속력 조항). 노트의 조번호(제64조)는 개정 전 해사안전법 기준이다.}}</p></div>

<h3>안전한 속력은 "몇 노트"가 아니다</h3>
<ul>
<li>안전한 속력은 숫자로 정해져 있지 않다. 넓은 바다에서는 빠른 속력이 안전할 수 있고, 좁은 해협·안개 속에서는 천천히 가는 것이 안전하다.</li>
<li><strong>경제속력</strong>(연료 효율이 좋은 속력)과는 전혀 다른 개념이다.</li>
<li>비유: 무게중심이 낮은 스포츠카와 무게중심이 높은 경승합차(다마스)는 같은 코너에서도 안전하게 돌 수 있는 속도가 다르다. 경주차가 코너에서 튕겨 나갔다면 그 속도는 그 차에 안전한 속도가 아니었던 것이다. 배도 마찬가지로 <strong>그 배, 그 상황</strong>에 따라 안전한 속력이 다르다.</li>
<li>"항상(<span class="en">at all times</span>)" 지켜야 하고, 제1절 조문이므로 어떠한 시계에서도 적용된다([[rule-04|제4조]]).</li>
</ul>

<h3>(b) 레이더 사용 선박의 추가 고려요소</h3>
<p>레이더를 쓰는 배는 위 6가지에 더해 다음 6가지를 고려한다. 요지는 "레이더를 쓰려면 <strong>레이더의 특성과 한계를 알고</strong> 잘 쓰라"는 것이다.{{fn:4주차 강의자료 ②(제4~6조) 슬라이드 12 / 정리본 6장 「레이더 사용 선박의 추가 고려요소」}}</p>
<ol>
<li>레이더 장비의 특성·효율·한계</li>
<li>사용 중인 거리 범위(<span class="en">range scale</span>)에서 오는 제약</li>
<li>해면 상태·기상·기타 간섭이 탐지에 미치는 영향</li>
<li>소형선·빙산(유빙)·부유물이 적당한 거리에서 탐지되지 않을 수 있음</li>
<li>레이더로 탐지한 선박의 수·위치·움직임</li>
<li>레이더로 근처 선박·물체의 거리를 재면 시정을 더 정확히 추정할 수 있음</li>
</ol>
<h4>레이더의 특성 — 보충 설명</h4>
<ul>
<li>선박에는 <strong>X밴드</strong> 레이더(파장이 S밴드의 약 1/3, 정밀한 거리 측정)와 <strong>S밴드</strong> 레이더(비·악천후에 강함)가 있다. 전자레인지·휴대전화와 같은 계열의 전파지만 출력이 약해 인체에 해가 없다.</li>
<li>레이더는 <strong>거리 분해능은 좋지만 방위 정확도는 떨어진다.</strong> 45도로 나와도 실제로는 43도일 수 있다. 그래서 방위 변화는 컴퍼스로도 확인한다([[term-compass-bearing]]).</li>
<li>파도가 높으면 해면반사(<span class="en">sea clutter</span>)가 화면을 덮는다. 억제 노브를 돌리면 화면은 깨끗해지지만 <strong>작은 선박도 함께 사라질 수 있다</strong> — (b)(iii)·(iv)의 이유다.</li>
<li>전파가 두 번 반사되어 실제로 없는 물체가 보이는 <strong>허상</strong>이 생긴다. 세월호 사고 당시의 "잠수함 충돌설"은 레이더의 이런 특성을 모르고 나온 이야기였다.</li>
</ul>

<h3>조종 성능과 선회권</h3>
<p>(a)(iii)의 조종 성능은 "<strong>정지거리와 선회 능력</strong>"을 특히 참작하라고 한다. 선회 능력은 선회권(<span class="en">turning circle</span>)으로 나타낸다. 용어 정의와 IMO 기준은 [[term-turning-circle]]에 정리했다.{{fn:4주차 강의자료 ③(제4~6조 계속) 슬라이드 7~10 / 정리본 6장 「조종 성능과 선회권」}}</p>
<ul>
<li>전타하면 선박은 회전 중심(<span class="en">pivoting point</span>)을 기준으로 돌고, 선미가 바깥으로 밀려난다. 원침로에서 밀려난 폭이 <strong>킥(kick)</strong>이다. 사람이 현측에서 떨어지면 즉시 떨어진 쪽으로 전타해 선미를 벌려 프로펠러에 빨려들지 않게 한다.</li>
<li>전타하면 처음에는 타압 때문에 <strong>안쪽으로 기울었다가(내방경사)</strong>, 시간이 지나 원심력이 커지면 <strong>바깥쪽으로 기운다(외방경사)</strong>. 갑판 적재가 많은 컨테이너선·자동차운반선은 외방경사가 크다.</li>
</ul>
<table>
<thead><tr><th>용어</th><th>정의</th><th>IMO 기준</th></tr></thead>
<tbody>
<tr><td>전진거리 <span class="en">advance</span></td><td>전타 시작부터 선수방위가 90도 바뀔 때까지 원침로 방향으로 전진한 거리</td><td><strong>4.5L 이하</strong></td></tr>
<tr><td>횡거 <span class="en">transfer</span></td><td>90도 회두했을 때 원침로에서 옆으로 이동한 거리</td><td>—</td></tr>

<tr><td>정지거리</td><td>전속 전진 중 전속 후진을 걸어 정지할 때까지의 거리</td><td><strong>15L 이하</strong></td></tr>

<ul>
<li>신조선은 시운전에서 공선·만재 상태로 좌·우 선회를 측정해 조종성능표를 만들고 <strong>선회권 그림을 선교에 게시</strong>한다. 도선사가 승선하면 가장 먼저 보는 것이다.</li>
<li>실습선 세계로호(LBP 120m)의 전진거리는 약 354m, 즉 약 2.9L로 기준(4.5L)보다 훨씬 좋다.</li>
<li>2등항해사가 되면 선장이 "우리 배 advance가 몇이냐"고 묻는다. 200m 선박이면 "대략 800~900m 가야 90도 돈다" 정도는 머리에 있어야 한다.</li>
</ul>

<h3>STCW: 주저하지 말고 쓰라</h3>
<p>STCW는 당직항해사(OOW)가 <strong>타(helm), 기관(engines), 음향신호장치(sound signalling apparatus)를 사용하는 데 주저해서는 안 된다</strong>고 요구한다(<span class="en">must not hesitate to use</span>).{{fn:4주차 강의자료 ③(제4~6조 계속) 슬라이드 11 / 정리본 6장 「STCW: 주저하지 말고 쓰라」}}</p>
<ul>
<li><strong>타</strong>: 회사 지침이 "평소 타각 7도"여도 위험하면 35도까지 쓴다.</li>
<li><strong>기관</strong>: 항해사들이 가장 안 쓰는 수단이다. 벙커C유는 정지 후 15~20분이면 굳어 재가동이 번거롭기 때문이다. 그래도 필요하면 감속·정지·후진해야 한다([[rule-08]] (e)).</li>
<li><strong>음향신호</strong>: 무중신호(2분을 넘지 않는 간격으로 장음)도 시끄럽다고 생략하면 안 된다. 사고가 나면 반드시 책임을 묻는다.</li>
</ul>

<h3>수업 영상: 안전한 속력과 무중 항법</h3>
<p>안개가 끼면 감속하고, 기관을 즉시 사용할 수 있게 준비하며, <strong>2분을 넘지 않는 간격으로 장음</strong> 무중신호를 울린다. 경계원을 늘린다. 변침만으로 피할 때는 정횡 전방 선박에 대해 좌현 변침을 하지 않고(추월당하는 경우 제외), 정횡 또는 정횡 후방 선박 쪽으로 변침하지 않는다(제19조 내용).{{fn:정리본 6장 「영상: 안전한 속력과 무중 항법」}}</p>

  body: `
<h3>COLREG에서 가장 핵심적인 조문</h3>
<p>COLREG의 목적은 <strong>무슨 수를 쓰더라도 충돌하지 않는 것</strong>이다. 제7조는 그 출발점인 "충돌의 위험이 있는가"를 판단하는 조문이라 COLREG에서 가장 핵심적이다. 교수님은 이 조까지 배우면 항해사에게 필요한 내용의 90~95%를 배운 셈이라고 했다.{{fn:정리본 7장 도입}}</p>
<p>[[rule-05|제5조 경계]]가 "평가하라"고 했다면, 제7조는 "<strong>어떻게 평가하는가</strong>"를 정한다. 평가 결과 위험이 있으면 [[rule-08|제8조]]의 동작과 제2절의 항법([[rule-13]]~[[rule-17]])으로 넘어간다.</p>

<h3>위험(danger)과 위험성(risk)의 구분</h3>
<table>
<thead><tr><th>구분</th><th>뜻</th><th>예</th></tr></thead>
<tbody>
<tr><td><span class="en">danger</span> 위험</td><td>실제로 위험한 상황. 무조건 피한다(<span class="en">avoid</span>). "내 권리"를 주장할 일이 아니다</td><td>칼 든 강도, 파란불인데 돌진해 오는 차</td></tr>
<tr><td><span class="en">risk</span> 위험성·위험도</td><td>얼마나 위험해질지를 <strong>평가하는</strong> 개념. 단위 시간당 사고 가능성처럼 평가·계산한다(<span class="en">risk assessment</span>, <span class="en">risk evaluation</span>)</td><td>"High risk, high return"의 risk</td></tr>
</tbody>
</table>
<p>그래서 제7조의 <span class="en">risk of collision</span>은 "충돌의 위험"보다 <strong>충돌의 위험성(위험도)</strong>으로 이해해야 한다. <strong>항해사가 하는 일 = 충돌 위험성 평가</strong>다. 슬라이드 제목도 "충돌의 위험성"이다.{{fn:5주차 강의자료 ①(제7조) 슬라이드 4 / 정리본 7장 「위험과 위험성의 구분」}}</p>

<h3>(a) 모든 유효한 수단, 의심스러우면 위험</h3>
<ul>
<li>당시 사정과 조건에 적합한 <strong>모든 유효한 수단</strong>(<span class="en">all available means</span>)을 쓴다. [[rule-05]]의 표현과 같다.</li>
<li><strong>의심스러우면 위험이 있는 것으로 본다</strong> — <em>If there is any doubt such risk shall be deemed to exist.</em> "아마 괜찮겠지"는 허용되지 않는다.</li>
</ul>

<h3>(b) 레이더의 적절한 사용</h3>
<p>레이더가 설치되어 작동 중이면 적절히 사용해야 한다. 조문이 콕 집은 것은 두 가지다.</p>
<ul>
<li><strong>장거리 주사</strong>(<span class="en">long-range scanning</span>) — 충돌 위험의 조기 경고를 얻기 위해서다. 12마일 레인지만 계속 보지 말고 24마일 등으로 바꿔 가며 본다.</li>
<li><strong>레이더 플로팅</strong>(<span class="en">radar plotting</span>) 또는 이에 상응하는 체계적 관측 — 과거에는 화면에 시간별로 점을 찍어 상대선의 움직임을 구했다. 지금은 <strong>ARPA</strong>(자동 레이더 플로팅 장치)로 물표를 클릭(acquire)하면 침로·속력과 [[term-cpa|CPA·TCPA]]가 자동으로 나온다.</li>
</ul>

<h3>(c) 불충분한 정보로 추정하지 않는다</h3>
<p><strong>불충분한 정보</strong>(<span class="en">scanty information</span>), 특히 불충분한 레이더 정보에 근거해 추정하면 안 된다. 레이더 한 번 본 것, 방위 한 번 잰 것으로 "비켜 가겠지"라고 결론 내리지 말라는 뜻이다. 가장 정확한 정보는 <strong>눈으로 보는 것</strong>이다.</p>

<h3>(d) 방위 변화로 판단한다</h3>
<ol>
<li>접근하는 선박의 <strong>컴퍼스 방위가 뚜렷하게 변하지 않으면</strong>(<em>does not appreciably change</em>) 위험이 있는 것으로 본다.</li>
<li>방위가 뚜렷하게 변하더라도 위험이 있을 수 있다. 특히 <strong>거대선</strong>(<span class="en">a very large vessel</span>), <strong>예인선열</strong>(<span class="en">a tow</span>)에 접근하거나 <strong>근거리</strong>(<span class="en">at close range</span>)로 접근할 때다.
<ul><li>예: 예인선 본체는 방위가 변해 비켜 가도, 뒤에 길게 끌려오는 부선과 부딪힐 수 있다. 거대선도 선교(방위를 잰 점)는 비켜 가도 선수·선미가 수백 m 뻗어 있다.</li></ul></li>
</ol>
<p>방위 변화 없이 <strong>멀어지면</strong> 위험하지 않다. 방위 변화 없이 <strong>가까워지면</strong> 충돌한다.</p>

<h3>충돌의 위험이 있다고 판단되는 경우</h3>
<div class="star" data-note="매년 출제. 도선사 시험에서도 상당수 틀림">
<p><strong>충돌의 위험이 있다고 판단되는 경우</strong>는 다음과 같다.</p>
<ol>
<li>접근하는 선박의 <strong>컴퍼스 방위가 뚜렷하게 변하지 않을 때</strong>(방위 변화 없이 거리가 가까워질 때)</li>
<li>방위가 뚜렷하게 변하더라도 <strong>거대선이나 예인선열에 접근</strong>할 때</li>
<li>방위가 뚜렷하게 변하더라도 <strong>근거리에서 다른 선박에 접근</strong>할 때</li>
<li>충돌의 위험이 있는지 <strong>의심스러울 때</strong> — 위험이 있는 것으로 본다(<em>If there is any doubt such risk shall be deemed to exist</em>)</li>
</ol>
<p>마지막 "의심스러우면 위험이 있는 것으로 본다"를 빠뜨리는 답안이 많다.</p>
</div>
<p>슬라이드 퀴즈는 1~3번을 쓰게 한 뒤 "4. 그 이외의 경우는?"이라고 묻는다. 답이 바로 "의심스러울 때"다.{{fn:5주차 강의자료 ①(제7조) 슬라이드 17(퀴즈 1) / 정리본 7장 「충돌의 위험이 있다고 판단되는 경우」}}</p>

<h3>상대방위가 아니라 컴퍼스 방위</h3>
<div class="star" data-note="도선사 응시자도 착각">
<p>방위 변화는 <strong>상대방위(relative bearing)가 아니라 컴퍼스 방위(compass bearing, 나침방위·진방위)</strong>로 판단한다. 조문도 "<em>the compass bearing of an approaching vessel</em>"이라고 쓴다.</p>
<p>자선이 변침 중이면 상대방위는 135° → 90° → 60° → 45°처럼 계속 바뀌어도, 상대선의 <strong>컴퍼스 방위가 045°로 변하지 않으면 충돌</strong>한다. 상대방위가 변한다고 안심하면 안 된다.</p>
</div>
<ul>
<li>흔히 "우리 배 기준으로 방위가 안 변하면 충돌"이라고 알고 있다. 자선이 침로를 똑바로 유지하고 있을 때는 상대방위 변화와 컴퍼스 방위 변화가 같으므로 맞는 말이다. 그러나 <strong>자선이 변침하거나 선수가 흔들리면 상대방위는 저절로 바뀐다.</strong> 그래서 기준은 컴퍼스 방위다.</li>
<li>두 방위의 정의와 그림은 [[term-compass-bearing]]에 있다.</li>
</ul>
<div data-sim="bearing-sim"></div>

<h3>방위를 확인하는 도구</h3>
<p>선수방위를 재는 가장 중요한 항해장비는 <strong>자이로컴퍼스</strong>(gyro compass)다. 고속으로 도는 로터의 각운동량 보존(팽이가 축 방향을 유지하려는 성질)과 지구 자전을 이용해 진북을 찾는다. 그 위에 다음 부속구를 얹어 상대선의 컴퍼스 방위를 읽는다.{{fn:5주차 강의자료 ①(제7조) 슬라이드 8·11~14 / 정리본 7장 「방위 확인 도구」}}</p>
<table>
<thead><tr><th>도구</th><th>쓰는 법</th></tr></thead>
<tbody>
<tr><td><strong>섀도우 핀</strong> <span class="en">shadow pin</span></td><td>자이로 리피터 중앙에 꽂아 상대선을 겨누고 방위를 읽는다. 일정 간격으로 다시 보며 방위 변화를 확인한다. 핀 하나면 충분하다</td></tr>
<tr><td><strong>방위환</strong> <span class="en">azimuth circle</span></td><td>같은 역할이지만 더 정밀하다. 실제로는 붙였다 떼기 번거로워 잘 안 쓴다</td></tr>
<tr><td><strong>레이더 EBL</strong> <span class="en">Electronic Bearing Line</span></td><td>전자방위선을 물표에 맞춰 두고, 물표가 선을 따라 그대로 다가오면 충돌 코스다</td></tr>
</tbody>
</table>
<p>좌측에서 방위 변화 없이 접근하는데 상대(피항선)가 피하지 않으면 VHF로 불러 의도를 묻는다. 끝까지 응답이 없으면 나라도 조치한다([[rule-17]]).</p>

<h3>당직항해사의 가장 중요한 임무</h3>
<div class="star" data-note="매년 출제, 매년 반만 맞힘">

<p><strong>답</strong>: 당직항해사(watch officer)의 가장 중요한 임무는 <strong>경계(look-out)</strong>이고, 경계의 목적은 <strong>상황과 충돌의 위험성을 충분히 평가</strong>(<em>a full appraisal of the situation and of the risk of collision</em>)하는 것이다. 수행 방법은 접근하는 선박의 <strong>컴퍼스 방위 변화를 확인</strong>하는 것이다. 방위 변화 없이 접근하면 충돌의 위험이 있고, 거대선·예인선열·근거리 접근은 방위가 변해도 위험할 수 있으며, 의심스러우면 위험이 있는 것으로 본다.</p>
<p>"경계(look-out)입니다"만 쓰면 10점 중 2점 정도다.</p>
</div>

<h3>들어가기 전에: 방위와 포인트, CPA·TCPA·BCR</h3>
<p>항해사는 북쪽 기준으로 방위를 말한다(북동 NE, 남동 SE). 360도를 32방위로 나누면 한 칸이 <strong>11.25도 = 1포인트(point)</strong>다. 옛 선장들은 "우현으로 2점(two points)"처럼 말했다. 등화 조문에 나오는 22.5도는 원래 "정횡 후 2포인트"를 도수로 바꾼 것이다([[term-light-arcs]]). 자세한 것은 [[term-compass-bearing]].{{fn:5주차 강의자료 ②(제8조 1/2) 슬라이드 5·6 / 정리본 8장 「방위와 포인트」}}</p>
<p>피항 동작의 결과는 다음 숫자로 확인한다. AIS·ARPA 화면에 모두 표시된다. 자세한 것은 [[term-cpa]].</p>
<table>
<thead><tr><th>용어</th><th>뜻</th></tr></thead>
<tbody>
<tr><td><span class="en">CPA</span> closest point of approach</td><td>두 선박이 가장 가까워졌을 때의 거리(최근접거리)</td></tr>
<tr><td><span class="en">TCPA</span> time to CPA</td><td>CPA에 이를 때까지 걸리는 시간</td></tr>
<tr><td><span class="en">BCR</span> bow crossing range</td><td>상대선이 자선의 선수를 횡단할 때의 거리(선수횡단거리)</td></tr>
</tbody>
</table>
<p>CPA는 다들 알지만 BCR은 소홀히 하기 쉽다. 상대가 내 선수 앞을 얼마나 떨어져 지나가는지도 중요하다.</p>

<h3>(a) 적극적으로, 충분한 시간 여유를 두고, 적절한 선박운용술로</h3>
<div class="star" data-note="반복 강조 · 빈칸 채우기 퀴즈 출제">
<p>제8조(a): 충돌을 피하기 위한 동작은 이 Part의 규칙에 따라, 사정이 허락하는 한 <strong>적극적으로(be positive)</strong>, <strong>충분한 시간 여유를 두고(made in ample time)</strong>, <strong>적절한 선박운용술(good seamanship)</strong>을 지키도록 충분히 유의하여 해야 한다.</p>
<p>원문: "Any action to avoid collision shall be taken in accordance with the Rules of this Part and shall, if the circumstances of the case admit, be <strong>positive</strong>, made in <strong>ample</strong> time and with due regard to the observance of <strong>good seamanship</strong>." 키워드는 <strong>조기에, 적극적으로</strong>.</p>
</div>
<p>슬라이드는 이 조문에 세 가지 질문을 던진다.{{fn:5주차 강의자료 ②(제8조 1/2) 슬라이드 7·8·18(퀴즈) / 정리본 8장 「제8조 조문 요지」}}</p>
<table>
<thead><tr><th>질문</th><th>답</th></tr></thead>
<tbody>
<tr><td>구체적으로 <strong>몇 도</strong> 돌려야 할까? (positive)</td><td>정해져 있지 않다. 기준은 <strong>상대선이 알아볼 수 있는가</strong>다. 학교에서는 최소 15도를 가르친다</td></tr>
<tr><td>충분히 여유 있는 시간은 <strong>몇 분 전</strong>일까? (ample time)</td><td>정량화되어 있지 않다. 첫 피항이 실패해도 <strong>한 번 더 피항할 수 있는 시간</strong>이 있어야 한다</td></tr>
<tr><td>적절한 선박운용술은 무엇인가? (good seamanship)</td><td>경험·훈련으로 쌓은 <strong>선박 조종 기술</strong>. 기사도 같은 정신이 아니다([[term-seamanship]])</td></tr>
</tbody>
</table>
<p>(a)의 "이 Part의 규칙에 따라(<em>in accordance with the Rules of this Part</em>)"는 2001년 개정(2003년 발효)으로 들어간 문구다. 피항 동작은 아무렇게나가 아니라 [[rule-14]]·[[rule-15]]·제19조 같은 항법에 맞는 동작이어야 한다는 뜻이다.{{fn:IMO 결의 A.910(22)(2001년 채택, 2003년 11월 29일 발효)에 의한 개정. 국내법(해상교통안전법)도 "이 장 제1절부터 제3절까지 … 에 따른 항법에 따라 … 충돌을 피하기 위한 동작을 취하되"라고 쓴다(5주차 강의자료 ②(제8조 1/2) 슬라이드 8).}}</p>

<h3>(b) 크게 바꾸고, 조금씩 연속해서 바꾸지 않는다</h3>
<ul>
<li>침로·속력 변경은 다른 선박이 <strong>눈이나 레이더로 쉽게 알아챌 수 있을 만큼 크게</strong>(<em>large enough to be readily apparent</em>) 한다.</li>
<li><strong>소폭으로 연속해서</strong>(<em>a succession of small alterations</em>) 바꾸지 않는다. 5도·5도·5도로 나눠 15도를 돌리면 상대는 변침을 인식하지 못한다. 한 번에 크게 돌려야 한다.</li>
<li>슬라이드 질문 "상대 선박은 본선의 변침을 무엇으로 판단할까?" — 눈으로 보이는 선체 방향·등화(현등이 바뀌어 보임)와 레이더·ARPA의 침로 벡터다. 소폭 변경은 둘 다에서 잘 드러나지 않는다.</li>
<li>주의: 경력이 쌓일수록 변침 각도가 작아지는 경향이 있다.</li>
</ul>
<div data-sim="avoid-compare"></div>

<h3>(c) 침로 변경만으로 근접상태 피하기</h3>
<p>수역(<span class="en">sea-room</span>)이 충분하면 <strong>침로 변경만으로도</strong> 근접상태를 피하는 가장 효과적인 동작이 될 수 있다. 실제로 항해사의 99%는 변침으로 피한다. 단 세 조건이 붙는다.{{fn:5주차 강의자료 ②(제8조 1/2) 슬라이드 12 / 정리본 8장}}</p>
<ol>
<li>적시에(<span class="en">made in good time</span>)</li>
<li>상당한 크기로, 즉 대각도로(<span class="en">substantial</span>)</li>
<li>또 다른 근접상태를 만들지 않을 것(<em>does not result in another close-quarters situation</em>)</li>
</ol>
<div class="star" data-note="영어 표기 주의">
<p>근접상태의 영어 표기는 <strong>close-quarters situation</strong>이다. quarters의 <strong>s</strong>를 빼고 "close-quarter situation"이라고 쓰면 틀린다(headquarters처럼 늘 s가 붙는다).</p>
</div>
<p>근접상태의 뜻과 다른 조문에서의 쓰임은 [[term-close-quarters]]에 있다.</p>

<h3>(d) 안전한 거리로 통과하고, 끝까지 확인한다</h3>
<ul>
<li>피항 동작은 <strong>안전한 거리</strong>(<span class="en">at a safe distance</span>)를 두고 통과하도록 해야 한다.</li>
<li>상대선이 <strong>완전히 지나 멀어질 때까지</strong>(<span class="en">finally past and clear</span>) 동작의 효과를 주의 깊게 확인한다. 변침해 놓고 끝이 아니다. 상대도 동시에 움직일 수 있다.</li>
<li>슬라이드 질문 "수역에 따른 CPA의 차이는?" — 안전한 거리는 정해진 숫자가 아니다. 넓은 대양과 좁은 연안·항만 접근 수역에서 확보할 수 있는(또 확보해야 하는) CPA가 다르다. [[term-cpa]]</li>
</ul>

<h3>(e) 필요하면 감속·정지·후진</h3>
<p>충돌을 피하거나 <strong>상황을 판단할 시간을 벌기 위해</strong> 필요하면 <strong>감속</strong>(<span class="en">slacken her speed</span>)하거나, <strong>기관을 정지·후진</strong>해 진행을 완전히 멈춘다(<span class="en">take all way off</span>). 평생 한 번도 안 쓰는 항해사도 있지만, COLREG과 STCW 모두 필요하면 기관을 쓰라고 한다([[rule-06]]의 STCW 부분).</p>

<h3>(f) 통항을 방해하지 말아야 할 선박</h3>
<p>어떤 규칙에 의해 다른 선박의 통항을 <strong>방해하지 말아야 할</strong>(<span class="en">not to impede</span>) 선박이 있다. 예: 좁은 수로에서 길이 20m 미만 선박·범선·어로종사선([[rule-09]]), 통항로에서의 같은 선박들([[rule-10]]), 흘수제약선에 대한 다른 선박([[rule-18]]).</p>
<ol>
<li><strong>(i)</strong> 방해하지 말아야 할 선박은 상대가 안전하게 통항할 충분한 수역을 확보할 수 있도록 <strong>조기에</strong>(<span class="en">early action</span>) 동작해야 한다.</li>
<li><strong>(ii)</strong> 충돌 위험을 안고 접근하게 되었다고 해서 그 의무가 <strong>면제되지 않는다</strong>. 동작할 때는 이 Part의 규칙이 요구하는 동작을 충분히 고려해야 한다.</li>
<li><strong>(iii)</strong> 방해받지 않을 권리가 있는 선박도, 두 선박이 충돌 위험을 안고 접근하면 이 Part의 규칙을 <strong>완전히 따를 의무</strong>가 있다. "나는 방해받지 않을 배"라고 버티면 안 된다.</li>
</ol>
<p>즉 "방해하지 말라"는 위험이 생기기 <strong>전</strong> 단계의 의무이고, 위험이 생긴 <strong>뒤</strong>에는 두 배 모두 일반 항법(제2절 등)을 따른다.{{fn:5주차 강의자료 ②(제8조 1/2) 슬라이드 14·15}}</p>

<h3>수업 영상: 충돌을 피하기 위한 동작의 3원칙</h3>
<p>자동조타로 조금씩 돌리다 상대선과 가까워진 2등항해사를 선장이 꾸짖는 장면이다.{{fn:정리본 8장 「영상: 충돌을 피하기 위한 동작의 3원칙」}}</p>
<ol>
<li><strong>적극적으로</strong>: 대각도로 크게 돌려 상대선이 본선의 의도를 알게 한다.</li>
<li><strong>충분한 시간을 두고</strong>: 정량화되어 있지 않다. 첫 피항이 실패해도 한 번 더 피항할 수 있는 시간이 있어야 한다.</li>
<li><strong>적절한 선박운용술</strong>: 경험·훈련으로 쌓은 기량으로 항법을 지키고 장비를 잘 쓰는 것.</li>
</ol>
<p>흔한 실수: 상대가 피하길 기다리다 급하게 피함, 언제든 피할 수 있다는 과신, 소각도 변침.</p>

<details class="story"><summary>사고 사례: 여수항 VDR 영상 — 스타보드 5도의 결과</summary><div>
<p>여수항 통항분리수역 인근에서 일어난 사고다. 항해기록장치(VDR, Voyage Data Recorder)에 기록된 대형선이 여수항을 나와 좌회전한 뒤, <strong>우측에서 오는 선박</strong>을 만났다. 상대가 우현 쪽에 있으므로 <strong>본선이 피항선</strong>이다([[rule-15]]).</p>
<p>그런데 본선은 <strong>스타보드 5도</strong>를 썼다가 미드십, 또 스타보드 5도를 쓰는 식으로 조금씩만 돌렸고, 심지어 상대선에 "돌리지 마라"고 하기도 했다. 적극적으로 변침하지 않아 <strong>방위 변화 없이</strong> 접근했고 결국 충돌했다.</p>
<p>교훈: 제8조(a)·(b) 위반의 전형이다. 상대선 선수를 지날 때까지 <strong>과감하게, 크게</strong> 돌렸어야 했다.</p>
<p>덧붙여 통계상 <strong>1등항해사 당직(04–08시)</strong>에 사고가 많다. 3등항해사는 겁이 나 선장을 일찍 부르지만, 1등항해사는 경험을 과신해 가까이 붙인다. 또 일출 무렵 박명시에는 등화도 선체도 잘 보이지 않는다.{{fn:5주차 강의자료 ③(제8조 2/2) 슬라이드 3 / 정리본 8장 「사례: 여수항 VDR 영상」}}</p>
</div></details>

<h3>good seamanship과 선원의 상무는 다르다</h3>
<p>(a)의 <strong>good seamanship(선박운용술)</strong>은 선박을 조종하는 <strong>기술·능력</strong>이다. craftsmanship(장인의 기술)과 같은 구조의 단어다. 반면 [[rule-02|제2조]]의 <strong>선원의 상무(ordinary practice of seamen)</strong>는 선원에게 요구되는 통상의 <strong>주의의무</strong>다. 둘은 자주 혼동되지만 구분해야 한다. 자세한 비교는 [[term-seamanship]], 주의의무의 법적 의미는 [[rule-02]].{{fn:5주차 강의자료 ③(제8조 2/2) 슬라이드 7·8. 제2조는 기말고사 범위.}}</p>
