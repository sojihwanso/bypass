      const el = S({ x:Math.sin(N.rad(B))*3.0, y:Math.cos(N.rad(B))*3.0 });
      s += T(el.x + 12, el.y + 12, `EBL ${N.fmtDeg(B)}`, { size:12.5, mono:true, weight:600 });
      obs.forEach(ob => { const p = S(ob.p); s += ob.m ? `<circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="4.5" fill="var(--night-ink)" opacity=".55"/>` + T(p.x + 10, p.y + 4, ob.m+'분 전', { size:11.5, op:.75 }) : `<circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="11" fill="none" stroke="var(--night-ink)" stroke-width="1.4" opacity=".8"/>`; });
      const v6 = S({ x:TGT.x + vRel.x*0.1, y:TGT.y + vRel.y*0.1 });
      s += `<line x1="${f1(t.x)}" y1="${f1(t.y)}" x2="${f1(v6.x)}" y2="${f1(v6.y)}" stroke="var(--night-ink)" stroke-width="1.8" marker-end="url(#${ID}-a)"/>`;
    }
    // 평가: 예상 상대운동선 + 우현 변침 계획
    if(step >= 6){
      s += `<line x1="${f1(t.x)}" y1="${f1(t.y)}" x2="${o.x}" y2="${o.y}" stroke="var(--magenta)" stroke-width="2" stroke-dasharray="6 5"/>`;
      const mid = S({ x:TGT.x*.6, y:TGT.y*.6 });
      s += `<rect x="${f1(mid.x - 102)}" y="${f1(mid.y - 8)}" width="88" height="22" rx="4" fill="var(--night)" stroke="var(--magenta)"/>` + T(mid.x - 58, mid.y + 8, '충돌 코스', { size:12.5, anchor:'middle', fill:'var(--magenta)', weight:700 });
      s += `<path d="M${o.x + 2} ${o.y - 18} Q ${o.x + 12} ${o.y - 34}, ${o.x + 60} ${o.y - 26}" fill="none" stroke="var(--giveway)" stroke-width="2.4" stroke-dasharray="5 4"/>`;
      s += `<path d="M${o.x + 66} ${o.y - 25} l-10 -6 l0 11 z" fill="var(--giveway)"/>`;
      s += T(o.x + 72, o.y - 20, '계획: 우현 대각도 변침', { size:12.5, weight:600 });
    }
    // 시각: 상대 등화
    if(step >= 1){
      const lights = (seen.masthead ? W.parts.light('white', 3.6, -7, -6) + W.parts.light('white', 3.6, 7, -12) : '') +
        (seen.port ? W.parts.light('port', 3.6, -7, 4) : '') + (seen.stbd ? W.parts.light('stbd', 3.6, 7, 4) : '');
      s += `<g transform="translate(${f1(t.x)} ${f1(t.y)})">${lights}</g>`;
      if(step === 1){
        s += `<line x1="${o.x}" y1="${o.y - 14}" x2="${f1(t.x - 8)}" y2="${f1(t.y + 10)}" stroke="var(--light-white)" stroke-opacity=".35" stroke-width="1.2" stroke-dasharray="2 5"/>`;
        s += T(t.x - 16, t.y - 22, '백등 2 + 홍등', { size:13, anchor:'end', weight:600 });
      }
    }
    // AIS 심볼
    if(step >= 4){
      const tri = `<path d="M0 -13 L8 9 L-8 9 Z" fill="none" stroke="var(--night-ink)" stroke-width="1.8"/><line x1="0" y1="-13" x2="0" y2="-40" stroke="var(--night-ink)" stroke-width="1.4"/>`;
      s += `<g transform="translate(${f1(t.x)} ${f1(t.y)}) rotate(${TC})">${tri}</g>`;
      s += `<rect x="${f1(t.x - 150)}" y="${f1(t.y - 64)}" width="140" height="40" rx="5" fill="var(--night-2)" stroke="var(--night-ink)" stroke-opacity=".6"/>`;
      s += T(t.x - 142, t.y - 48, 'AIS', { size:11.5, weight:700 }) + T(t.x - 142, t.y - 31, `${N.fmtDeg(TC)} · ${TS.toFixed(1)} kn · 180 m`, { size:12, mono:true });
    }
    // VHF
    if(step >= 5){
      const m = { x:t.x - 56, y:t.y + 14 };
      s += `<g transform="translate(${f1(m.x)} ${f1(m.y)})" fill="none" stroke="var(--night-ink)" stroke-width="1.6" stroke-linecap="round">` +
        `<path d="M-6 -8 A10 10 0 0 0 -6 8"/><path d="M-11 -13 A17 17 0 0 0 -11 13"/><path d="M6 -8 A10 10 0 0 1 6 8"/><path d="M11 -13 A17 17 0 0 1 11 13"/></g>`;
      s += T(m.x - 20, m.y + 5, 'VHF', { size:12.5, anchor:'end', weight:700 });
    }
    // 내 배
    s += `<g transform="translate(${o.x} ${o.y})">${W.parts.ship({ type:'power', len:30, fill:'var(--night-2)', stroke:'var(--night-ink)', role: step >= 6 ? 'giveway' : null })}</g>`;
    s += T(o.x - 18, o.y + 6, step >= 6 ? '내 배(피항선)' : '내 배', { size:13, anchor:'end', weight:600, fill: step >= 6 ? 'var(--giveway)' : NI });
    if(step === 0) s += T(t.x, t.y, '?', { size:30, anchor:'middle', op:.35, weight:700 });
    s += `<g id="${ID}-dyn"></g>`;
    svg.innerHTML = s;
    dyn = svg.querySelector(`#${CSS.escape(ID)}-dyn`);
    tick(0, tLast);
  }

  /* ---------- 움직이는 부분: 레이더 소인선, 소리 듣기 물결 ---------- */
  let dyn = null, tLast = 0, autoT = 0, auto = false;
  function tick(dt, t){
    tLast = t;
    if(!dyn) return;
    const o = S(OWN);
    let s = '';
    if(step === 2){
      for(let i = 0; i < 3; i++){
        const ph = ((t*0.6 + i/3) % 1), r = 20 + ph*120;
        s += `<circle cx="${o.x}" cy="${o.y}" r="${f1(r)}" fill="none" stroke="var(--night-ink)" stroke-width="1.5" opacity="${f1((1-ph)*0.6)}"/>`;
      }
      s += T(o.x + 34, o.y - 40, '귀 기울이기: 신호 없음', { size:12.5 });
    }
    if(step >= 3 && step <= 5){
      const a = (t*90) % 360, r = 8*V.scale;
      const e = { x:o.x + Math.sin(N.rad(a))*r, y:o.y - Math.cos(N.rad(a))*r };
      s += `<line x1="${o.x}" y1="${o.y}" x2="${f1(e.x)}" y2="${f1(e.y)}" stroke="var(--night-ink)" stroke-width="2" opacity=".35"/>`;
    }
    dyn.innerHTML = s;
    if(auto){ autoT += dt; if(autoT > 4.5){ autoT = 0; if(step < STEPS.length-1) go(step+1); else stopAuto(); } }
  }

  function go(i){ step = Math.max(0, Math.min(STEPS.length-1, i)); draw(); }
  function stopAuto(){ auto = false; autoBtn.textContent = '자동 진행'; autoBtn.classList.remove('on'); }
  const prevBtn = W.ui.btn(ui.controls, '이전', () => { stopAuto(); go(step-1); });
  const nextBtn = W.ui.btn(ui.controls, '다음', () => { stopAuto(); go(step+1); }, 'primary');
  const autoBtn = W.ui.btn(ui.controls, '자동 진행', () => {
    if(auto){ stopAuto(); return; }
    auto = true; autoT = 0; autoBtn.textContent = '멈춤'; autoBtn.classList.add('on');
    if(step === STEPS.length-1) go(0);
    loop.play();
  });
  W.ui.btn(ui.controls, '처음으로', () => { stopAuto(); go(0); });
  const loop = W.ui.loop(ui.stage, tick, true);
  draw();
});

}catch(e){console.error("[load] src/sims/lookout-layers.js", e)}
</script>
<script>/* src/sims/narrow-channel.js */
try{
/* 제9조 좁은 수로: 우측 통항, 추월 신호 교환, 만곡부 장음 */
W.sim('narrow-channel', (el) => {
  const ui = W.ui.box(el, { title:'좁은 수로: 우측 통항과 추월 신호', kind:'애니메이션',
    caption:'애니메이션에서는 신호 길이를 줄였다(장음 2초·단음 0.6초). 실제는 <b>장음 4~6초, 단음 약 1초</b>(제32조) — 실제 길이는 아래 「조종·경고 신호」 재생기에서 들어 보자. 소리는 「소리 켜기」를 누른 뒤에만 난다. 출처: 6주차 슬라이드 16~21, 정리본 9장.' });

  /* ---------- 수로 기하 (화면 좌표, 침로는 진북 시계방향) ---------- */
  const X0 = -20, Y0 = 300, L1 = 400, R = 150, ARC = R*Math.PI/2, L3 = 320, HALF = 58;
  const CX = X0 + L1, CY = Y0 - R;                         // 만곡부 중심 (왼쪽으로 90° 굽음)
  const rad = W.nav.rad;
  function center(s){
    if(s <= L1) return { x:X0 + s, y:Y0, h:90 };
    if(s <= L1 + ARC){ const h = 90 - (s - L1)/R*180/Math.PI; return { x:CX + R*Math.cos(rad(h)), y:CY + R*Math.sin(rad(h)), h }; }
    return { x:CX + R, y:CY - (s - L1 - ARC), h:0 };
  }
  /** s: 수로를 따른 거리, d: 동행(東行) 기준 우현 쪽 횡거리(+ = 동행선의 우현), back: 반대 방향 진행 */
  function at(s, d, back){ const c = center(s); return { x:c.x + d*Math.cos(rad(c.h)), y:c.y + d*Math.sin(rad(c.h)), h: back ? W.nav.norm(c.h + 180) : c.h }; }
  const TOTAL = L1 + ARC + L3;
  const CL = []; for(let s = -60; s <= TOTAL + 60; s += 4) CL.push(center(s));
  const line = d => { let p = ''; for(let s = -60; s <= TOTAL + 60; s += 6){ const q = at(s, d); p += (p ? ' L' : 'M') + q.x.toFixed(1) + ' ' + q.y.toFixed(1); } return p; };
  function inChannel(x, y){ let m = 1e9; for(const c of CL){ const dd = Math.hypot(x - c.x, y - c.y); if(dd < m) m = dd; } return m <= HALF; }

  /* ---------- 신호 ---------- */
  const P = 2.0, S = 0.6, G = 0.5, SR = 0.4, GR = 0.25;
  const SIG = {
    LLS:  { bars:'LLS',   txt:'장음 2·단음 1', mean:'귀선의 우현 쪽으로 추월하겠다', rule:'제34조(c)(i)' },
    LLSS: { bars:'LLSS',  txt:'장음 2·단음 2', mean:'귀선의 좌현 쪽으로 추월하겠다', rule:'제34조(c)(i)' },
    LSLS: { bars:'LSLS',  txt:'장음·단음·장음·단음', mean:'동의함', rule:'제34조(c)(ii)' },
    DOUBT:{ bars:'RRRRR', txt:'단음 5회 이상 (짧고 빠르게)', mean:'의문 — 동의하지 않음', rule:'제34조(d)' },
    BEND: { bars:'L',     txt:'장음 1회', mean:'만곡부에 접근 중', rule:'제9조(f)·제34조(e)' },
    BENDR:{ bars:'L',     txt:'장음 1회', mean:'응답 (만곡부 건너편 선박)', rule:'제34조(e)' }
  };
  function blasts(code, t0){
    const out = []; let t = t0;
    for(const c of SIG[code].bars){ const d = c === 'L' ? P : c === 'S' ? S : SR; out.push({ t0:t, dur:d, kind:c }); t += d + (c === 'R' ? GR : G); }
    return { list:out, end:t - (SIG[code].bars.endsWith('R') ? GR : G) };
  }

  /* ---------- 소리 (사용자가 켠 뒤에만) ---------- */
  const audio = { ctx:null, on:false, nodes:[] };
  function ensureAudio(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      if(!audio.ctx) audio.ctx = new AC();
      if(audio.ctx.state === 'suspended') audio.ctx.resume();
      return audio.ctx;
    }catch(e){ return null; }
  }
  function tone(dur){
    const ctx = audio.ctx; if(!ctx || !audio.on) return;
    try{
      const t = ctx.currentTime + .02, g = ctx.createGain(), f = ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 1100;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.13, t + .05); g.gain.setValueAtTime(.13, t + dur - .08); g.gain.linearRampToValueAtTime(0, t + dur);
      f.connect(g); g.connect(ctx.destination);
      [[220,'sawtooth'],[330,'sawtooth'],[221.5,'triangle']].forEach(([hz, type]) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = hz; o.connect(f); o.start(t); o.stop(t + dur + .02); audio.nodes.push(o); });
    }catch(e){}
  }
  function hush(){ audio.nodes.forEach(o => { try{ o.stop(); }catch(e){} }); audio.nodes = []; }

  /* ---------- 장면 ---------- */
  let scene = 'over', side = 'port', reply = 'agree', T = 0, lastT = -1, plan = null;
  const lerp = (a, b, k) => a + (b - a)*Math.max(0, Math.min(1, k));
  const ease = k => { k = Math.max(0, Math.min(1, k)); return k*k*(3 - 2*k); };

  function build(){
    const p = { ships:[], sigs:[], end:0, phases:[] };
    if(scene === 'keep'){
      const v = 40;
      p.end = (TOTAL - 20) / v;
      p.ships = [
        { id:'E', label:'선박 1', role:null, pos:t => at(20 + v*t, 36, false) },
        { id:'W', label:'선박 2', role:null, pos:t => at(TOTAL - v*t, -36, true) }
      ];
      p.phases = [[0, '두 선박 모두 자선의 우현 쪽 수로 바깥 한계에 붙어 항행한다 (제9조(a))'], [p.end*0.45, '가운데를 비워 두었으므로 좌현 대 좌현(포트투포트)으로 안전하게 지나간다']];
      p.verdict = ['우측 통항: 안전하고 실행 가능한 한 우현 쪽 바깥 한계에 붙어 항행 (제9조(a))', true];
    }
    if(scene === 'over'){
      const vA = 6, A0 = 150, B0 = 52, gap = 80, vRel = 26;
      const A = t => A0 + vA*t;
      const tS1 = 4.4, s1 = blasts(side === 'stbd' ? 'LLS' : 'LLSS', tS1);
      const tS2 = s1.end + 0.8, s2 = blasts(reply === 'agree' ? 'LSLS' : 'DOUBT', tS2);
      const tD = s2.end + 0.4, tP0 = tD + 0.8, tPass = 170/vRel;
      const aOff = side === 'port' ? 47 : 10, bOff = side === 'port' ? 6 : 48;
      p.sigs = [
        { who:'B', whoName:'B 추월선', code:side === 'stbd' ? 'LLS' : 'LLSS', ...s1 },
        { who:'A', whoName:'A 피추월선', code:reply === 'agree' ? 'LSLS' : 'DOUBT', ...s2 }
      ];
      const Bs = t => {
        if(t < 4) return lerp(B0, A(4) - gap, t/4);
        if(reply === 'doubt') return A(t) - gap - lerp(0, 24, (t - tD)/2);
        if(t < tP0) return A(t) - gap;
        return A(t) - gap + vRel*Math.min(t - tP0, tPass) + (t > tP0 + tPass ? (t - tP0 - tPass)*10 : 0);
      };
      const Ad = t => reply === 'agree' ? lerp(36, aOff, ease((t - tD)/1.5)) + (t > tP0 + 5.6 ? lerp(0, 36 - aOff, ease((t - tP0 - 5.6)/1.5)) : 0) : 36;
      const Bd = t => reply === 'agree' ? lerp(36, bOff, ease((t - tP0)/1.5)) + (t > tP0 + tPass - .2 ? lerp(0, 36 - bOff, ease((t - tP0 - tPass + .2)/1.6)) : 0) : 36;
      p.end = reply === 'agree' ? tP0 + tPass + 2.2 : tD + 3;
      p.lane = { t0:tS1, t1:reply === 'agree' ? tP0 + 1 : tS2, A, d:bOff };
      p.ships = [
        { id:'A', label:'A', role:'standon', pos:t => at(A(t), Ad(t), false) },
        { id:'B', label:'B', role:'giveway', pos:t => at(Bs(t), Bd(t), false) }
      ];
      p.phases = [
        [0, 'B가 A를 뒤따라 접근한다. 좁은 수로라서 A가 비켜 주어야만 추월할 수 있다.'],
        [tS1, `B: ${SIG[p.sigs[0].code].txt} = "${SIG[p.sigs[0].code].mean}" (${SIG[p.sigs[0].code].rule})`],
        [tS2, reply === 'agree' ? `A: 장음·단음·장음·단음 = "동의함" (제34조(c)(ii))` : `A: 단음 5회 이상 = 의문, 동의하지 않음 (제34조(d))`],
        [tD, reply === 'agree'
          ? `A는 안전한 통과를 위해 ${side === 'port' ? '우현 쪽(수로 가장자리)' : '좌현 쪽(수로 가운데)'}으로 비켜 주고, B는 A의 ${side === 'port' ? '좌현' : '우현'} 쪽으로 추월한다. B는 끝까지 피항선이다(제9조(e)(ii)·제13조).`
          : '동의 신호가 없으므로 B는 추월하지 않고 거리를 두고 뒤따른다.']
      ];
      p.verdict = reply === 'agree'
        ? [`추월 완료: 신호(${SIG[p.sigs[0].code].txt}) → 동의(장음·단음·장음·단음) → 추월. 추월선이 끝까지 피항 (제9조(e), 제13조)`, true]
        : ['추월 불가: 피추월선이 의문신호(단음 5회 이상)를 울림 — 동의 없이는 추월하지 않는다 (제9조(e)(i), 제34조(d))', false];
    }
    if(scene === 'bend'){
      const v = 30, E0 = 60, W0 = 830;
      const tB = 7, s1 = blasts('BEND', tB), tR = s1.end + 0.8, s2 = blasts('BENDR', tR);
      p.sigs = [ { who:'E', whoName:'접근선', code:'BEND', ...s1 }, { who:'W', whoName:'건너편', code:'BENDR', ...s2 } ];
      p.end = 15.5;
      p.ships = [
        { id:'E', label:'접근선', role:null, pos:t => at(E0 + v*t, 36, false) },
        { id:'W', label:'건너편 선박', role:null, pos:t => at(W0 - v*t, -36, true) }
      ];
      p.phases = [
        [0, '곶(장애물) 때문에 만곡부 건너편의 선박이 보이지 않는다.'],
        [tB, '접근선: 장애물 때문에 건너편이 안 보이는 만곡부에 접근하며 장음 1회 (제9조(f)·제34조(e))'],
        [tR, '건너편 선박: 신호를 들었으므로 장음 1회로 응답 (제34조(e))'],
        [s2.end + 0.5, '두 선박 모두 특별한 경계와 주의를 하며 우측으로 붙어 지나간다. 좁은 수로에서는 사정이 허락하는 한 정박도 피한다(제9조(g)).']
      ];
      p.verdict = ['만곡부: 장음 1회, 건너편 선박도 장음 1회로 응답 — 특별한 경계와 주의 (제9조(f), 제34조(e))', true];
    }
    return p;
  }

  /* ---------- 그리기 ---------- */
  const svg = W.svg('svg', { viewBox:'0 0 680 380', role:'img', 'aria-label':'만곡부가 있는 좁은 수로 평면도와 선박' });
  ui.stage.append(svg);
  const Tx = (x, y, t, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.a||'start'}" font-size="${o.s||13}" font-weight="${o.w||500}" font-family="${o.mono ? 'var(--f-mono)' : 'var(--f-body)'}" fill="${o.c||'var(--ink)'}">${t}</text>`;
  const bg = (() => {
    let s = `<rect width="680" height="380" fill="var(--land)"/>`;
    s += `<path d="${line(0)}" fill="none" stroke="var(--sea)" stroke-width="${HALF*2}" stroke-linejoin="round"/>`;
    s += `<path d="${line(HALF)}" fill="none" stroke="var(--ink-3)" stroke-width="1.4"/><path d="${line(-HALF)}" fill="none" stroke="var(--ink-3)" stroke-width="1.4"/>`;
    s += `<path d="${line(0)}" fill="none" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="10 8" opacity=".8"/>`;
    s += Tx(342, 204, '곶', {s:15, w:700, c:'var(--ink-2)'});
    s += Tx(342, 222, '(건너편을 가림)', {s:12, c:'var(--ink-2)'});
    s += Tx(566, 300, '만곡부', {s:13, w:600, c:'var(--ink-2)'});
    return s;
  })();
  function bars(code, x, y, t, sig){
    let s = '', bx = x;
    SIG[code].bars.split('').forEach((c, i) => {
      const w = c === 'L' ? 30 : c === 'S' ? 10 : 8;
      const b = sig ? sig.list[i] : null;
      const state = !b ? 0 : t >= b.t0 + b.dur ? 2 : t >= b.t0 ? 1 : 0;
      s += `<rect x="${bx}" y="${y-5}" width="${w}" height="10" rx="3" fill="${state === 1 ? 'var(--magenta)' : state === 2 ? 'var(--ink)' : 'var(--ink-3)'}" opacity="${state ? 1 : .45}"/>`;
      bx += w + 5;
    });
    return { s, w:bx - x };
  }
  function render(){
    const p = plan;
    let s = bg;
    /* 시야선 (만곡부) */
    if(scene === 'bend'){
      const a = p.ships[0].pos(T), b = p.ships[1].pos(T);
      let vis = true; for(let k = 0; k <= 30; k++){ const x = a.x + (b.x - a.x)*k/30, y = a.y + (b.y - a.y)*k/30; if(!inChannel(x, y)){ vis = false; break; } }
      s += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${vis ? 'var(--ok)' : 'var(--bad)'}" stroke-width="1.6" stroke-dasharray="5 5"/>`;
      const mx = Math.min(600, Math.max(20, (a.x + b.x)/2 + 8)), my = Math.min(360, Math.max(20, (a.y + b.y)/2 - 8));
      s += Tx(mx, my, vis ? '서로 보임' : '서로 보이지 않음', {s:13, w:700, c: vis ? 'var(--ok)' : 'var(--bad)'});
    }
    /* 추월 예정 항로 */
    if(p.lane && T >= p.lane.t0 && T < p.lane.t1){
      const a0 = p.lane.A(T);
      let d = ''; for(let k = a0 - 70; k <= a0 + 110; k += 10){ const q = at(k, p.lane.d); d += (d ? ' L' : 'M') + q.x.toFixed(1) + ' ' + q.y.toFixed(1); }
      s += W.parts.arrowDefs('ncA', 'var(--giveway)') + `<path d="${d}" fill="none" stroke="var(--giveway)" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ncA)" opacity=".8"/>`;
    }
    /* 선박 + 음파 */
    p.ships.forEach(sh => {
      const q = sh.pos(T);
      const sounding = p.sigs.find(g => g.who === sh.id && g.list.some(b => T >= b.t0 && T < b.t0 + b.dur));
      if(sounding){ for(let k = 0; k < 3; k++){ const r = 24 + ((T*40 + k*14) % 42); s += `<circle cx="${q.x}" cy="${q.y}" r="${r}" fill="none" stroke="var(--magenta)" stroke-width="1.6" opacity="${(1 - (r-24)/42).toFixed(2)}"/>`; } }
      s += `<g transform="translate(${q.x.toFixed(1)} ${q.y.toFixed(1)}) rotate(${q.h.toFixed(1)})">${W.parts.ship({ len:34, role:sh.role })}</g>`;
      const ly = q.y > 330 ? q.y - 16 : q.y + 32;
      if(q.x > -10 && q.x < 690 && q.y > -10) s += Tx(Math.min(640, Math.max(14, q.x)), ly, sh.label, {s:sh.label.length < 2 ? 16 : 13.5, w:700, a:'middle', c: sh.role === 'giveway' ? 'var(--giveway)' : sh.role === 'standon' ? 'var(--standon)' : 'var(--ink)'});
    });
    /* 신호 판 (왼쪽 위 육지) */
    if(p.sigs.length){
      const h = 32 + p.sigs.length*44;
      s += `<rect x="10" y="10" width="390" height="${h}" rx="8" fill="var(--panel)" stroke="var(--rule)"/>`;
      s += Tx(22, 30, '기적 신호', {s:12, w:700, c:'var(--ink-3)'});
      p.sigs.forEach((g, i) => {
        const y = 52 + i*44, started = T >= g.list[0].t0;
        s += Tx(22, y + 5, g.whoName, {s:14, w:700, c: started ? 'var(--ink)' : 'var(--ink-3)'});
        const b = bars(g.code, 124, y, T, g); s += b.s;
        s += Tx(22, y + 27, `${SIG[g.code].mean} (${SIG[g.code].rule})`, {s:14, c: started ? 'var(--ink-2)' : 'var(--ink-3)'});
      });
    }
    svg.innerHTML = s;
    /* 단계 문구 */
    let ph = p.phases[0][1]; p.phases.forEach(([t0, txt]) => { if(T >= t0) ph = txt; });
    sPhase(ph);
    if(T >= p.end - 0.05) ui.setVerdict(p.verdict[0], p.verdict[1]);
    else if(T === 0 && !loop.playing) ui.setVerdict('「재생」을 눌러 보자 — ' + (scene === 'over' ? '좁은 수로에서의 추월 신호 (제9조(e), 제34조(c))' : scene === 'bend' ? '만곡부 접근 신호 (제9조(f))' : '우측 통항 (제9조(a))'), null);
    else ui.setVerdict(scene === 'over' ? '추월 신호 교환 중… (제9조(e))' : scene === 'bend' ? '만곡부 접근 중… (제9조(f))' : p.verdict[0], null);
  }

  /* ---------- 진행 ---------- */
  const loop = W.ui.loop(ui.stage, dt => {
    const prev = T; T = Math.min(plan.end, T + dt);
    plan.sigs.forEach(g => g.list.forEach(b => { if(b.t0 > prev && b.t0 <= T) tone(b.dur); }));
    render();
    if(T >= plan.end){ if(scene === 'keep'){ T = 0; } else { loop.pause(); playBtn.textContent = '다시 재생'; } }
  }, false);

  function reset(){ hush(); plan = build(); T = 0; render(); }
  function play(){
    if(T >= plan.end - 0.01) T = 0;
    if(T === 0) plan.sigs.forEach(g => g.list.forEach(b => { if(b.t0 === 0) tone(b.dur); }));
    loop.play(); playBtn.textContent = '일시정지';
  }

  const sceneSeg = W.ui.seg(ui.controls, [{value:'keep',label:'(a) 우측 통항'},{value:'over',label:'(b) 추월 신호'},{value:'bend',label:'(c) 만곡부'}], scene, v => { scene = v; syncOpts(); stop(); reset(); }, '장면');
  const sideSeg = W.ui.seg(ui.controls, [{value:'stbd',label:'A의 우현 쪽'},{value:'port',label:'A의 좌현 쪽'}], side, v => { side = v; stop(); reset(); }, '추월 방향');
  const replySeg = W.ui.seg(ui.controls, [{value:'agree',label:'동의'},{value:'doubt',label:'의문'}], reply, v => { reply = v; stop(); reset(); }, 'A의 응답');
  const playBtn = W.ui.btn(ui.controls, '재생', () => { if(loop.playing){ stop(); } else play(); }, 'primary');
  W.ui.btn(ui.controls, '처음부터', () => { stop(); reset(); });
  const sndBtn = W.ui.btn(ui.controls, '소리 켜기', () => {
    if(audio.on){ audio.on = false; hush(); sndBtn.classList.remove('on'); sndBtn.textContent = '소리 켜기'; return; }
    const ctx = ensureAudio();
    if(!ctx){ sndBtn.textContent = '이 브라우저는 소리 미지원'; sndBtn.disabled = true; return; }
    audio.on = true; sndBtn.classList.add('on'); sndBtn.textContent = '소리 끄기';
  });
  function stop(){ loop.pause(); hush(); playBtn.textContent = '재생'; }
  function syncOpts(){ const show = scene === 'over'; sideSeg.el.parentNode.style.display = show ? '' : 'none'; replySeg.el.parentNode.style.display = show ? '' : 'none'; }
  const phaseEl = W.h('div', { style:{ fontSize:'14.5px', lineHeight:'1.55' } });
  ui.readout.append(phaseEl);
  const sPhase = t => { phaseEl.innerHTML = '<span style="color:var(--ink-3);font-size:12px;margin-right:6px">지금</span>' + W.esc(t); };

  syncOpts(); reset();
});

}catch(e){console.error("[load] src/sims/narrow-channel.js", e)}
</script>
<script>/* src/sims/priority-ladder.js */
try{
/* 제18조 우선순위 사다리: 두 선박을 고르면 누가 누구의 진로를 피하는지(또는 방해하지 않아야 하는지) 보여 준다 */
W.sim('priority-ladder', (el) => {
  const ui = W.ui.box(el, {
    title: '우선순위 사다리 — 누가 누구를 피하나? (제18조)',
    kind: '해보기',
    caption: '사다리 위쪽일수록 조종 성능이 나빠 우선권이 크다. 아래쪽 선박이 위쪽 선박을 피한다(조종 성능이 좋은 배가 나쁜 배를 피함). ' +
      '단 제18조는 <b>“제9조·제10조·제13조에서 달리 정한 경우를 제외하고”</b>로 시작하므로, 추월(제13조)과 좁은 수로·TSS(제9·10조)가 먼저다. ' +
      '다른 암기 문장: <i>New Reels Catch Fish So Purchase Some Weekly.</i>'
  });

  const T = [
    { id:'nuc',  lv:0, ko:'조종불능선', en:'NUC',      w:'Navigation' },
    { id:'ram',  lv:1, ko:'조종제한선', en:'RAM',      w:'Rules' },
    { id:'cbd',  lv:2, ko:'흘수제약선', en:'CBD',      w:'Can' },
    { id:'fish', lv:3, ko:'어로종사선', en:'Fishing',  w:'Frustrate' },
    { id:'sail', lv:4, ko:'범선',       en:'Sailing',  w:'Some' },
    { id:'pdv',  lv:5, ko:'동력선',     en:'Power',    w:'People,' },
    { id:'sea',  lv:6, ko:'수상항공기', en:'Seaplane', w:'Say' },
    { id:'wig',  lv:6, ko:'WIG선',      en:'WIG',      w:'What!' }
  ];
  const byId = id => T.find(t => t.id === id);
  const nm = id => byId(id).ko;

  /* ---- 제18조 관계 판정 (일반) ---- */
  const P18 = {
    a: { ko:'(a) 항행 중인 동력선은 다음 선박의 진로를 피하여야 한다: (i) 조종불능선 (ii) 조종제한선 (iii) 어로에 종사하고 있는 선박 (iv) 범선',
         en:'(a) A power-driven vessel underway shall keep out of the way of: (i) a vessel not under command; (ii) a vessel restricted in her ability to manoeuvre; (iii) a vessel engaged in fishing; (iv) a sailing vessel.' },
    b: { ko:'(b) 항행 중인 범선은 다음 선박의 진로를 피하여야 한다: (i) 조종불능선 (ii) 조종제한선 (iii) 어로에 종사하고 있는 선박',
         en:'(b) A sailing vessel underway shall keep out of the way of: (i) a vessel not under command; (ii) a vessel restricted in her ability to manoeuvre; (iii) a vessel engaged in fishing.' },
    c: { ko:'(c) 어로에 종사하고 있는 선박이 항행 중일 때에는 가능한 한 다음 선박의 진로를 피하여야 한다: (i) 조종불능선 (ii) 조종제한선',
         en:'(c) A vessel engaged in fishing when underway shall, so far as possible, keep out of the way of: (i) a vessel not under command; (ii) a vessel restricted in her ability to manoeuvre.' },
    d: { ko:'(d)(i) 조종불능선 또는 조종제한선 이외의 선박은 상황이 허락하는 한 제28조의 신호를 표시하고 있는 흘수제약선의 안전한 통항을 방해하지 않아야 한다. (ii) 흘수제약선은 자선의 특수한 조건을 충분히 고려하여 특별히 조심하여 항행하여야 한다.',
         en:'(d)(i) Any vessel other than a vessel not under command or a vessel restricted in her ability to manoeuvre shall, if the circumstances of the case admit, avoid impeding the safe passage of a vessel constrained by her draught, exhibiting the signals in Rule 28. (ii) A vessel constrained by her draught shall navigate with particular caution having full regard to her special condition.' },
    e: { ko:'(e) 수면에 있는 수상항공기는 원칙적으로 모든 선박으로부터 충분히 떨어져서 그 항행을 방해하지 않아야 한다. 다만 충돌의 위험이 있는 경우에는 이 장의 규정을 따라야 한다.',
         en:'(e) A seaplane on the water shall, in general, keep well clear of all vessels and avoid impeding their navigation. In circumstances, however, where risk of collision exists, she shall comply with the Rules of this Part.' },
    f: { ko:'(f)(i) WIG선은 이륙·착륙 및 수면 근처 비행 중 다른 모든 선박으로부터 충분히 떨어져서 그 항행을 방해하지 않아야 한다. (ii) 수면에서 운항하는 WIG선은 동력선으로서 이 장의 규정을 따라야 한다.',
         en:'(f)(i) A WIG craft shall, when taking off, landing and in flight near the surface, keep well clear of all other vessels and avoid impeding their navigation; (ii) a WIG craft operating on the water surface shall comply with the Rules of this Part as a power-driven vessel.' }
  };
  const ROMAN = { nuc:'(i)', ram:'(ii)', fish:'(iii)', sail:'(iv)' };

  function rel18(a, b){
    if(a === b){
      if(a === 'sail') return { g:null, kind:'same', ref:'제12조', head:'범선끼리 → 제12조 범선 항법',
        text:'같은 단계라 제18조로는 정해지지 않는다. 범선끼리는 바람을 받는 현으로 정한다: 좌현에 바람을 받는 범선이 피하고, 같은 쪽이면 풍상 쪽 범선이 피한다(제12조).' };
      if(a === 'nuc' || a === 'ram') return { g:null, kind:'same', ref:'제2조·제8조', head:`${nm(a)}끼리 → 제18조에 규정 없음`,
        text:'둘 다 조종이 어려운 선박이라 제18조에 정해 둔 것이 없다. 서로 선원의 상무(제2조)에 따라 할 수 있는 최선의 동작(제8조)으로 충돌을 피한다.' };
      return { g:null, kind:'same', ref:'제13~15조', head:`${nm(a)}끼리 → 조우 형태로 결정`,
        text:`같은 단계끼리는 우선순위가 같으므로 조우 형태로 정한다: 추월은 추월선(제13조), 마주침은 둘 다 우현 변침(제14조), 횡단은 상대를 우현에 둔 선박(제15조)이 피한다.${a === 'wig' ? ' (수면에서 운항하는 WIG선은 동력선으로 본다 — 18(f)(ii))' : ''}${a === 'sea' ? ' (충돌의 위험이 있으면 수상항공기도 이 장의 항법 규정을 따른다 — 18(e))' : ''}` };
    }
    const air = x => x === 'sea' || x === 'wig';
    if(air(a) && air(b)) return { g:'both', kind:'clear', ref:'18(e)·18(f)', para:['e','f'], head:'수상항공기와 WIG선 → 둘 다 모든 선박을 충분히 피함',
      text:'둘 다 사다리 맨 아래 단계다. 각자 모든 선박으로부터 충분히 떨어져야 하고, 충돌의 위험이 생기면 항법 규정(수면의 WIG선은 동력선으로서)을 따른다.' };
    if(air(a) || air(b)){
      const g = air(a) ? a : b, o = g === a ? b : a;
      return g === 'sea'
        ? { g, kind:'clear', ref:'제18조(e)', para:['e'], head:`수상항공기가 ${nm(o)}을(를) 충분히 피함`, text:'수상항공기는 원칙적으로 모든 선박으로부터 충분히 떨어져 항행을 방해하지 않아야 한다. 다만 충돌의 위험이 있으면 이 장의 항법 규정을 따른다.' }
        : { g, kind:'clear', ref:'제18조(f)', para:['f'], head:`WIG선이 ${nm(o)}을(를) 충분히 피함`, text:'WIG선은 이륙·착륙·수면 근처 비행 중 모든 선박으로부터 충분히 떨어져야 한다. 수면에서 운항할 때는 동력선으로서 항법을 따른다(동력선보다 위 단계인 선박은 어차피 피해야 한다).' };
    }
    const A = byId(a), B = byId(b);
    const g = A.lv > B.lv ? a : b, o = g === a ? b : a;
    if(o === 'cbd') return { g, kind:'impede', ref:'제18조(d)(i)', para:['d'], head:`${nm(g)}은(는) 흘수제약선의 통항을 방해하지 않음`,
      text:'“피한다(keep out of the way)”가 아니라 <b>“안전한 통항을 방해하지 않는다(avoid impeding)”</b>이다. 충돌의 위험이 생기기 전에 미리 넓게 비켜 주는 의무다. 흘수제약선도 특별히 조심해서 항행해야 하며(18(d)(ii)), 충돌의 위험이 생길 만큼 가까워지면 흘수제약선도 항법 규정을 그대로 따라야 한다(제8조(f)(iii)).' };
    if(g === 'cbd') return { g, kind:'keep', ref:`제18조(a)${ROMAN[o]}`, para:['a','d'], head:`흘수제약선이 ${nm(o)}의 진로를 피함`,
      text:`흘수제약선은 동력선이므로 제18조(a)에 따라 ${nm(o)}을(를) 피한다. 18(d)(i)의 “방해 금지” 대상에서 조종불능선·조종제한선은 빠져 있다.` };
    if(g === 'ram' && o === 'nuc') return { g, kind:'interp', ref:'명문 규정 없음(교수님 설명)', para:[], head:'조종제한선이 조종불능선을 피함 (해석)',
      text:'제18조에는 NUC와 RAM 사이 규정이 없다. 교수님 설명: <b>RAM은 그나마 조종이 되므로 RAM이 피한다.</b> 실제로는 둘 다 선원의 상무에 따라 최선을 다해야 한다.' };
    if(g === 'fish') return { g, kind:'keep', ref:`제18조(c)${ROMAN[o]}`, para:['c'], head:`어로종사선이 ${nm(o)}의 진로를 피함 (가능한 한)`,
      text:'어로종사선도 어구 때문에 조종이 쉽지 않으므로 “가능한 한(so far as possible)” 피한다.' };
    if(g === 'sail') return { g, kind:'keep', ref:`제18조(b)${ROMAN[o]}`, para:['b'], head:`범선이 ${nm(o)}의 진로를 피함`,
      text:'범선은 조종불능선·조종제한선·어로종사선을 피한다. (교수님 퀴즈: 어로종사선과 범선이 만나면 피항선은 범선)' };
    return { g, kind:'keep', ref:`제18조(a)${ROMAN[o]}`, para:['a'], head:`동력선이 ${nm(o)}의 진로를 피함`,
      text:`동력선은 ${nm(o)}을(를) 만나면 방향(좌고우피)과 관계없이 피한다. 상대가 내 좌현 쪽에서 와도 나는 유지선이 아니다.` };
  }

  /* ---- 특별 항법 반영 ---- */
  function relation(a, b, mode){
    const base = rel18(a, b);
    if(mode === 'over'){
      return { g:a, kind:'keep', over:true, ref:'제13조(a)', para:[], head:`추월하는 ${nm(a)}(A)이(가) 피항선`,
        text:`추월선은 선박의 종류와 관계없이 추월당하는 선박을 <b>완전히 추월하여 충분히 멀어질 때까지</b> 그 진로를 피한다. 제13조(a)는 “제1절·제2절의 다른 규정에도 불구하고”라고 하므로 제18조보다 먼저다.` +
          (base.g === b || base.g === 'both' || base.kind === 'same' ? '' : ` <span style="color:var(--magenta)">추월이 아니었다면 제18조로는 반대(${nm(b)}이(가) 피함)였을 조합이다.</span>`) };
    }
    if(mode === 'chan'){
      const has = x => a === x || b === x, other = x => a === x ? b : a;
      if(has('fish') && ['pdv','cbd','sail'].includes(other('fish')))
        return { g:'fish', kind:'impede', chan:true, ref:'제9조(c)·제10조(i)', para:[], head:'어로종사선이 통항을 방해하지 않음',
          text:`어로종사선은 좁은 수로 안을 항행하는 다른 선박(9(c)), 통항로를 따라 항행하는 모든 선박(10(i))의 통항을 방해하지 않아야 한다. 제18조의 우선권이 여기서는 사라진다.` };
      if(has('sail') && ['pdv','cbd'].includes(other('sail')))
        return { g:'sail', kind:'impede', chan:true, ref:'제9조(b)·제10조(j)', para:[], head:'범선이 동력선의 통항을 방해하지 않음',
          text:'범선(과 길이 20m 미만 선박)은 좁은 수로 안에서만 안전하게 항행할 수 있는 선박(9(b)), 통항로를 따라 항행하는 동력선(10(j))의 통항을 방해하지 않아야 한다. 일반 해역의 제18조(a)와 반대가 된다.' };
      return { ...base, text: base.text + ' <span style="color:var(--ink-2)">(이 조합은 제9·10조에 별도 규정이 없어 위와 같다. 단 TSS에서는 통항로를 따라가는 선박에 특권이 없고 일반 항법이 그대로 적용되며, 수로를 가로지르는 선박은 제9조(d)·제10조(c)를 따로 지킨다.)</span>' };
    }
    return base;
  }

  /* ---- 화면 구성 ---- */
  const css = `
  .pl-flex{display:flex;flex-wrap:wrap;gap:0;align-items:stretch}
  .pl-flex>svg{flex:1 1 300px;min-width:0}
  .pl-mn{padding:8px 12px 0;font-size:14px;color:var(--ink);line-height:1.5}
  .pl-mn b{color:var(--magenta)}
  .pl-pick{display:flex;flex-direction:column;gap:6px;width:100%}
  .pl-pick .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .pl-pick .row>span{font-size:13px;color:var(--ink-2);min-width:58px}
  .pl-pick .btn{padding:4px 9px;font-size:13px}
  .pl-res{background:var(--panel);border-top:1px solid var(--rule);padding:10px 14px;font-size:13.5px;line-height:1.6;color:var(--ink)}
  .pl-res .law{margin-top:6px;padding:6px 10px;border-left:3px solid var(--ink-3);background:var(--paper);font-family:var(--f-law);font-size:13.5px}
  .pl-res .law i{display:block;font-family:var(--f-body);font-size:12.5px;color:var(--ink-2);margin-top:3px}
  `;
  el.prepend(W.h('style', { text: css }));
  const mn = W.h('div', { class:'pl-mn', html:'<b>N</b>avigation <b>R</b>ules <b>C</b>an <b>F</b>rustrate <b>S</b>ome <b>P</b>eople, <b>S</b>ay <b>W</b>hat! <span style="color:var(--ink-3);font-size:12.5px">= NUC · RAM · CBD · Fishing · Sailing · Power · Seaplane · WIG</span>' });
  const flex = W.h('div', { class:'pl-flex' });
  const lad = W.svg('svg', { viewBox:'0 0 340 432', role:'img', 'aria-label':'제18조 우선순위 사다리' });
  const scn = W.svg('svg', { viewBox:'0 0 320 300', role:'img', 'aria-label':'피항 동작 그림' });
  flex.append(lad, scn);
  const res = W.h('div', { class:'pl-res' });
  ui.stage.append(mn, flex, res);

  ui.readout.style.display = 'none'; // 읽기값 칸을 쓰지 않음 (.sim-readout 의 display:flex 가 hidden 속성을 덮어씀)
  let A = 'pdv', B = 'fish', mode = 'norm';
  const pick = W.h('div', { class:'pl-pick' });
  const chipRow = (label, get, set) => {
    const row = W.h('div', { class:'row' }, W.h('span', { text: label }));
    const btns = T.map(t => W.h('button', { type:'button', class:'btn', text:t.ko, onclick(){ set(t.id); sync(); update(); } }));
    row.append(...btns);
    const sync = () => btns.forEach((x, i) => x.classList.toggle('on', T[i].id === get()));
    sync(); return { row, sync };
  };
  const rA = chipRow('A (내 배)', () => A, v => A = v);
  const rB = chipRow('B (상대)', () => B, v => B = v);
  pick.append(rA.row, rB.row);
  ui.controls.append(pick);
  W.ui.seg(ui.controls, [{ value:'norm', label:'일반 해역' }, { value:'over', label:'A가 B를 추월 중' }, { value:'chan', label:'좁은 수로·TSS' }], mode, v => { mode = v; update(); }, '상황');
  W.ui.btn(ui.controls, 'A↔B 바꾸기', () => { [A, B] = [B, A]; rA.sync(); rB.sync(); update(); });

  /* 사다리 위치 */
  const RX = 44, RW = 284, RH = 42, R0 = 34, GAP = 54;
  const box = id => { const t = byId(id); if(t.lv < 6) return { x:RX, y:R0 + t.lv*GAP, w:RW, h:RH };
    return t.id === 'sea' ? { x:RX, y:R0 + 6*GAP, w:RW/2 - 4, h:RH } : { x:RX + RW/2 + 4, y:R0 + 6*GAP, w:RW/2 - 4, h:RH }; };

  let R = null, arrowEl = null;
  function drawLadder(){
    const roleOf = id => !R || R.kind === 'same' ? null : (R.g === 'both' ? 'giveway' : (R.g === id ? 'giveway' : (id === A || id === B) ? 'standon' : null));
    let s = W.parts.arrowDefs('pl-arr', 'var(--giveway)');
    s += `<text x="${RX}" y="20" font-size="12.5" fill="var(--ink-2)" font-family="var(--f-body)">위로 갈수록 조종 성능 나쁨 = 우선권 큼</text>`;
    s += `<line x1="${RX-6}" y1="${R0-6}" x2="${RX-6}" y2="${R0+6*GAP+RH+6}" stroke="var(--ink-3)" stroke-width="3" stroke-linecap="round"/>`;
    s += `<line x1="${RX+RW+6}" y1="${R0-6}" x2="${RX+RW+6}" y2="${R0+6*GAP+RH+6}" stroke="var(--ink-3)" stroke-width="3" stroke-linecap="round"/>`;
    T.forEach(t => {
      const b = box(t.id), role = (t.id === A || t.id === B) ? roleOf(t.id) : null;
      const sel = t.id === A || t.id === B;
      const stroke = role === 'giveway' ? 'var(--giveway)' : role === 'standon' ? 'var(--standon)' : sel ? 'var(--link)' : 'var(--rule)';
      const half = t.lv === 6;
      s += `<g class="pl-rung" data-id="${t.id}" style="cursor:pointer">`;
      s += `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="8" fill="var(--panel)" stroke="${stroke}" stroke-width="${sel ? 2.6 : 1.2}"/>`;
      s += `<text x="${b.x+10}" y="${b.y+17}" font-size="12" font-family="var(--f-mono)" fill="var(--magenta)"><tspan font-weight="700">${t.w[0]}</tspan>${t.w.slice(1)}</text>`;
      s += `<text x="${b.x+10}" y="${b.y+35}" font-size="14" font-weight="700" font-family="var(--f-body)" fill="var(--ink)">${t.ko}</text>`;
      if(!half) s += `<text x="${b.x+120}" y="${b.y+35}" font-size="12" font-family="var(--f-mono)" fill="var(--ink-2)">${t.en}</text>`;
      if(!half) s += `<text x="${b.x+b.w-48}" y="${b.y+26}" font-size="12" font-family="var(--f-mono)" fill="var(--ink-3)" text-anchor="end">${t.lv+1}</text>`;
      const tags = [t.id === A ? 'A' : null, t.id === B ? 'B' : null].filter(Boolean);
      tags.forEach((tg, i) => {
        const cx = b.x + b.w - 16 - i*24, cy = b.y + b.h/2;
        s += `<circle cx="${cx}" cy="${cy}" r="10" fill="${stroke === 'var(--rule)' ? 'var(--link)' : stroke}"/><text x="${cx}" y="${cy+4.5}" text-anchor="middle" font-size="13" font-weight="700" font-family="var(--f-body)" fill="var(--panel)">${tg}</text>`;
      });
      s += `</g>`;
    });
    // 피항 화살표: 피항선 칸 → 유지선 칸 (사다리 왼쪽)
    if(R && R.g && R.g !== 'both' && R.kind !== 'same'){
      const o = R.g === A ? B : A, bg = box(R.g), bo = box(o);
      const y1 = bg.y + bg.h/2, y2 = bo.y + bo.h/2, x = RX - 6;
      const bulge = Math.max(6, x - 4 - Math.abs(y1 - y2) * 0.12);
      const dash = R.kind === 'impede' || R.kind === 'clear' ? '6 5' : '10 6';
      s += `<path id="pl-arrow" d="M${x} ${y1} C ${bulge-36} ${y1}, ${bulge-36} ${y2}, ${x-2} ${y2}" fill="none" stroke="var(--giveway)" stroke-width="3" stroke-dasharray="${dash}" marker-end="url(#pl-arr)"/>`;
    }
    lad.innerHTML = s;
    arrowEl = lad.querySelector('#pl-arrow');
    lad.querySelectorAll('.pl-rung').forEach(g => g.addEventListener('click', () => {
      // 사다리를 누르면 B(상대)로 지정. 이미 B면 A로.
      const id = g.getAttribute('data-id');
      if(id === B && id !== A){ A = id; } else { B = id; }
      rA.sync(); rB.sync(); update();
    }));
  }

  /* ---- 장면 (피항 동작 애니메이션) ---- */
  function shipArt(id, role){
    const t = id;
    if(t === 'sea' || t === 'wig'){
      const c = role === 'giveway' ? 'var(--giveway)' : role === 'standon' ? 'var(--standon)' : 'var(--ink)';
      const span = t === 'wig' ? 18 : 26;
      return `<path d="M0 -16 C 3 -12, 3 8, 2 14 L -2 14 C -3 8, -3 -12, 0 -16 Z" fill="var(--panel)" stroke="${c}" stroke-width="2.2"/>` +
             `<path d="M${-span} -1 L ${span} -1 L ${span} 4 L ${-span} 4 Z" fill="var(--panel)" stroke="${c}" stroke-width="2"/>` +
             `<path d="M-8 11 L 8 11" stroke="${c}" stroke-width="2.4"/>` +
             (t === 'sea' ? `<path d="M-9 -6 L -9 10 M 9 -6 L 9 10" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/>` : '');
    }
    const type = { cbd:'big', fish:'fishing', sail:'sail' }[t] || 'power';
    return W.parts.ship({ type, len: t === 'cbd' ? 54 : 38, role, gear: t === 'fish', boom: t === 'sail' ? 25 : undefined });
  }
  function dayShape(id, x, y){
    const k = { nuc:['ball','ball'], ram:['ball','diamond','ball'], cbd:['cylinder'], fish:['cones-apex'] }[id];
    if(!k) return '';
    const gap = 15;
    return `<g>${k.map((s, i) => W.parts.shape(s, x, y + i*gap, 9, 'var(--ink)')).join('')}</g>`;
  }

  // 경로 미리 계산: 시작점, 속력(px/단위), 침로 함수 h(u)
  function path(x0, y0, spd, hf){
    const pts = [], N = 240; let x = x0, y = y0;
    for(let i = 0; i <= N; i++){ const u = i/N, h = hf(u); pts.push({ x, y, h }); x += Math.sin(h*Math.PI/180)*spd/N; y -= Math.cos(h*Math.PI/180)*spd/N; }
    return u => pts[Math.max(0, Math.min(N, Math.round(u*N)))];
  }
  const ease = (u, a, b, from, to) => u <= a ? from : u >= b ? to : from + (to - from) * (u - a)/(b - a);
  let paths = null;
  function buildPaths(){
    if(!R) return;
    if(R.over){ // 둘 다 북쪽, A가 뒤에서 좌현 쪽으로 넉넉히 비켜 추월
      paths = { g: path(160, 290, 300, u => ease(u, .08, .18, 0, -28) + ease(u, .45, .6, 0, 28)), o: path(160, 175, 110, () => 0) };
    } else if(R.kind === 'same'){
      paths = null;
    } else {
      const early = R.kind === 'impede' || R.kind === 'clear';
      paths = {
        g: path(150, 292, 330, u => ease(u, early ? .04 : .14, early ? .14 : .27, 0, early ? 70 : 55)),
        o: path(296, 118, 270, u => R.g === 'both' ? ease(u, .14, .27, 270, 320) : 270)
      };
    }
  }

  let U = 0;
  function drawScene(){
    let s = '';
    s += `<text x="12" y="22" font-size="13" font-weight="700" font-family="var(--f-body)" fill="var(--ink)">${R.kind === 'same' ? '같은 단계: 조우 형태로 결정' : R.kind === 'impede' ? '미리 비켜 주기(방해 금지)' : R.kind === 'clear' ? '충분히 떨어지기' : '진로 피하기'}</text>`;
    if(!paths){
      // 같은 종류: 정지 그림 두 척
      s += `<g transform="translate(110 170) rotate(45)">${shipArt(A, null)}</g><g transform="translate(220 150) rotate(270)">${shipArt(B, null)}</g>`;
      s += `<text x="160" y="250" text-anchor="middle" font-size="13" font-family="var(--f-body)" fill="var(--ink)">${R.ref}</text>`;
      s += `<text x="100" y="205" text-anchor="middle" font-size="13" font-weight="700" font-family="var(--f-body)" fill="var(--ink)">A</text><text x="232" y="185" text-anchor="middle" font-size="13" font-weight="700" font-family="var(--f-body)" fill="var(--ink)">B</text>`;
      scn.innerHTML = s; return;
    }
    const gId = R.g === 'both' ? A : R.g, oId = R.g === 'both' ? B : (R.g === A ? B : A);
    const gRole = 'giveway', oRole = R.g === 'both' ? 'giveway' : 'standon';
    // 지나간 항적
    const trail = (pf) => { let d = ''; for(let u = 0; u <= U; u += .02){ const p = pf(u); d += (d ? ' L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1); } return d; };
    s += `<path d="${trail(paths.o)}" fill="none" stroke="${oRole === 'standon' ? 'var(--standon)' : 'var(--giveway)'}" stroke-width="1.5" stroke-dasharray="2 4" opacity=".8"/>`;
    s += `<path d="${trail(paths.g)}" fill="none" stroke="var(--giveway)" stroke-width="1.5" stroke-dasharray="2 4" opacity=".8"/>`;
    // 원래 침로를 유지했다면 (회색 점선)
    if(!R.over){ s += `<line x1="150" y1="292" x2="150" y2="118" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="4 4"/><circle cx="150" cy="118" r="4" fill="none" stroke="var(--ink-3)"/>`; }
    const P = paths.o(U), Q = paths.g(U);
    const lbl = (p, id, role, tag, dy) => `<text x="${Math.min(250, Math.max(70, p.x))}" y="${p.y + dy}" text-anchor="middle" font-size="12.5" font-weight="700" font-family="var(--f-body)" fill="${role === 'standon' ? 'var(--standon)' : 'var(--giveway)'}">${tag} ${byId(id).ko}·${role === 'standon' ? (R.kind === 'impede' ? '통항 우선' : '유지') : (R.kind === 'impede' ? '방해 금지' : '피함')}</text>`;
    s += `<g transform="translate(${P.x} ${P.y}) rotate(${P.h})">${shipArt(oId, oRole)}</g>` + dayShape(oId, P.x + 34, P.y + 12);
    s += `<g transform="translate(${Q.x} ${Q.y}) rotate(${Q.h})">${shipArt(gId, gRole)}</g>` + dayShape(gId, Q.x - 34, Q.y - 6);
    const tagOf = id => id === A ? 'A' : 'B';
    s += lbl(P, oId, oRole, tagOf(oId), -30);
    s += lbl(Q, gId, gRole, tagOf(gId), 40);
    scn.innerHTML = s;
  }

  function update(){
    R = relation(A, B, mode);
    buildPaths(); U = 0.3;
    drawLadder(); drawScene();
    const who = R.kind === 'same' ? '' : R.g === 'both' ? '둘 다 ' : `${R.g === A ? 'A' : 'B'} `;
    ui.setVerdict(`${who}${R.head} (${R.ref})`, R.kind === 'same' ? null : true);
    const law = (R.para || []).map(p => `<div class="law">${P18[p].ko}<i>${P18[p].en}</i></div>`).join('');
    res.innerHTML = `<div>${R.text}</div>${law}` +
      (mode === 'norm' && R.kind !== 'same' ? `<div style="margin-top:6px;font-size:12.5px;color:var(--ink-2)">제18조 첫머리 “Except where Rules 9, 10 and 13 otherwise require” — 추월 중이거나 좁은 수로·TSS라면 위 상황 버튼으로 바꿔 보세요.</div>` : '');
  }

  const loop = W.ui.loop(ui.stage, (dt) => {
    if(arrowEl){ arrowEl.style.strokeDashoffset = String(-((performance.now()/40) % 32)); }
    if(paths){ U += dt / 6; if(U > 1.15) U = 0; drawScene(); }
  }, true);
  update();
  W.ui.btn(ui.controls, '일시정지', function(){ if(loop.playing){ loop.pause(); this.textContent = '재생'; } else { loop.play(); this.textContent = '일시정지'; } });
});

}catch(e){console.error("[load] src/sims/priority-ladder.js", e)}
</script>
<script>/* src/sims/safe-speed.js */
try{
/* 제6조 안전한 속력 — 속력·시정·교통 밀도에 따른 정지거리·선회권 비교 (S1) */
W.sim('safe-speed', (el) => {
  const N = W.nav, ID = W.ui.uid('ss');
  const ui = W.ui.box(el, { title:'안전한 속력: 이 속력이면 피할 수 있고, 멈출 수 있나?', kind:'해보기',
    caption:'<b>예시 모델</b>이다(값은 대략적). 세계로호의 전진거리 2.9L·선회지름 3.7L은 강의 슬라이드의 시운전 자료이고, 정지거리·대형선 값과 "판단·조작 30초"는 설명을 위한 가정이다. '+
      '선회권 크기는 속력에 따라 크게 변하지 않지만, <b>정지거리와 반응 중 달리는 거리는 속력이 클수록 길어진다</b>. '+
      '"혼잡"에서는 마주 오는 배도 다가오므로 시정의 절반 안에서 멈출 수 있어야 한다고 본다(판례의 half-distance 관행).' });

  const SHIPS = {
    sgr:  { label:'세계로호 (L 120 m)', L:120, adv:2.9, td:3.7, stopL:8,  vref:15 },
    big:  { label:'대형선 (L 300 m)',   L:300, adv:3.4, td:4.0, stopL:12, vref:20 }
  };
  const REACT = 30;   // 판단·조타·기관 명령까지 걸리는 시간(초) — 가정
  const M = 1852;
  let ship = 'sgr', V = 14, vis = 1.0, dense = false;

  function model(v, sh = SHIPS[ship]){
    const L = sh.L;
    const react = v*REACT/3600;                                          // NM
    const adv = sh.adv*L*(0.92 + 0.08*v/sh.vref)/M;                      // NM (속력 영향 작음)
    const td = sh.td*L*(0.94 + 0.06*v/sh.vref)/M;
    const tr = td/2;
    const stop = sh.stopL*L*Math.pow(Math.max(v, 0)/sh.vref, 1.5)/M;
    const avail = vis*(dense ? 0.5 : 1);
    const t90 = v > 0 ? (adv + Math.PI/4*td)/v*3600 : Infinity;          // 90° 회두 대략 시간(초)
    return { L, react, adv, td, tr, stop, avail, t90, needTurn: react + adv, needStop: react + stop };
  }
  const okTurn = m => m.needTurn <= vis;          // ① 변침으로 피하기: 시정 안에서 90° 회두
  const okStop = m => m.needStop <= m.avail;      // ② 쓸 수 있는 거리 안에서 정지
  function maxSafe(){
    let best = 0;
    for(let v = 0.5; v <= 25; v += 0.5){ const m = model(v); if(okStop(m)) best = v; else break; }
    return best;
  }

  /* ---------- 화면 ---------- */
  const wrap = W.h('div', { style:{ display:'flex', flexWrap:'wrap' } });
  const pA = W.h('div', { style:{ flex:'1 1 300px', minWidth:'0' } });
  const pB = W.h('div', { style:{ flex:'1 1 300px', minWidth:'0', background:'var(--panel)', borderLeft:'1px solid var(--rule)' } });
  wrap.append(pA, pB); ui.stage.append(wrap);
  const plan = W.svg('svg', { viewBox:'0 0 420 470', role:'img', 'aria-label':'안개 속 내 배 주변의 시정 원과 정지거리·선회권' });
  const diag = W.svg('svg', { viewBox:'0 0 420 470', role:'img', 'aria-label':'선회권 용어 도식과 필요 거리 비교 막대' });
  pA.append(plan); pB.append(diag);

  const shipSeg = W.ui.seg(ui.controls, Object.keys(SHIPS).map(k => ({ value:k, label:SHIPS[k].label })), ship, v => { ship = v; draw(); }, '선박');
  const trafficSeg = W.ui.seg(ui.controls, [{ value:false, label:'한산' }, { value:true, label:'혼잡' }], false, v => { dense = v; draw(); }, '교통 밀도');
  W.ui.range(ui.controls, { label:'내 속력', min:0, max:22, step:0.5, value:V, unit:' kn', oninput:v => { V = v; draw(); } });
  W.ui.range(ui.controls, { label:'시정', min:0.1, max:2, step:0.05, value:vis, fmt:v => v.toFixed(2)+' NM', oninput:v => { vis = v; draw(); } });
  const st = {
    stop: W.ui.stat(ui.readout, '정지거리(반응 포함)'), adv: W.ui.stat(ui.readout, '전진거리'), tr: W.ui.stat(ui.readout, '횡거리'),
    td: W.ui.stat(ui.readout, '선회지름'), tvis: W.ui.stat(ui.readout, '시정 끝까지'), max: W.ui.stat(ui.readout, '이 조건의 속력 상한(모델)')
  };

  const f1 = v => v.toFixed(1);
  const T = (x, y, s, o = {}) => `<text x="${f1(x)}" y="${f1(y)}" font-size="${o.size||12.5}" font-family="var(${o.mono?'--f-mono':'--f-body'})" fill="${o.fill||'var(--ink)'}" text-anchor="${o.anchor||'start'}"${o.weight?` font-weight="${o.weight}"`:''}>${s}</text>`;
  const m2 = nm => Math.round(nm*M) + ' m';

  /* 선회 궤적 점들 (원침로 = 위쪽, 우현 선회). 직진 구간 (adv - td/2) 뒤 지름 td 원 */
  function turnPath(m, ang = 180){
    const lead = Math.max(0, m.adv - m.td/2), R = m.td/2, pts = [{ x:0, y:0 }, { x:0, y:lead }];
    for(let a = 0; a <= ang; a += 6) pts.push({ x: R - R*Math.cos(N.rad(a)), y: lead + R*Math.sin(N.rad(a)) });
    return pts;
  }

  function drawPlan(m){
    const sc = 190, ox = 150, oy = 446;              // 1 NM = 190 px, 내 배 위치
    const P = p => ({ x: ox + p.x*sc, y: oy - p.y*sc });
    let s = `<defs><clipPath id="${ID}-c"><rect width="420" height="470"/></clipPath></defs>`;
    // 안개 (시정 원 밖)
    const r = vis*sc;
    s += `<path d="M0 0H420V470H0Z M${ox - r} ${oy} a${r} ${r} 0 1 0 ${2*r} 0 a${r} ${r} 0 1 0 ${-2*r} 0Z" fill-rule="evenodd" fill="var(--ink-3)" opacity=".42"/>`;
    s += `<circle cx="${ox}" cy="${oy}" r="${f1(r)}" fill="none" stroke="var(--ink-2)" stroke-width="1.4" stroke-dasharray="6 4"/>`;
    const lv = { x: ox + r*Math.sin(N.rad(25)), y: oy - r*Math.cos(N.rad(25)) };
    const lx = Math.min(lv.x + 6, 300), ly = Math.max(22, lv.y - 8);
    s += `<rect x="${f1(lx - 4)}" y="${f1(ly - 15)}" width="112" height="21" rx="4" fill="var(--panel)" opacity=".85"/>` + T(lx + 2, ly, `시정 ${vis.toFixed(2)} NM`, { size:12.5, weight:600, fill:'var(--ink-2)' });
    if(dense){
      const ra = m.avail*sc;
      s += `<circle cx="${ox}" cy="${oy}" r="${f1(ra)}" fill="none" stroke="var(--magenta)" stroke-width="1.4" stroke-dasharray="3 4"/>`;
      s += T(ox - ra*0.75 - 4, oy - ra*0.66 - 6, '시정의 1/2', { size:12, fill:'var(--magenta)', anchor:'end', weight:600 });
      // 주변 선박 (교통)
      [[0.55,1.25,200],[-0.62,0.62,110],[1.0,0.55,300],[-0.35,1.7,160],[0.95,1.75,240]].forEach(([x,y,c]) => {
        const q = P({ x, y }); s += `<g transform="translate(${f1(q.x)} ${f1(q.y)}) rotate(${c})" opacity=".8">${W.parts.ship({ type:'power', len:16 })}</g>`;
      });
    }
    // 반응 거리 + 정지거리 (직진)
    const a0 = P({ x:0, y:0 }), a1 = P({ x:0, y:m.react }), a2 = P({ x:0, y:m.needStop });
    const stopCol = okStop(m) ? 'var(--ok)' : 'var(--bad)';
    s += `<line x1="${ox}" y1="${a0.y}" x2="${ox}" y2="${f1(a1.y)}" stroke="var(--ink-2)" stroke-width="3" stroke-dasharray="3 3"/>`;
    s += `<line x1="${ox}" y1="${f1(a1.y)}" x2="${ox}" y2="${f1(Math.max(-20, a2.y))}" stroke="${stopCol}" stroke-width="4" clip-path="url(#${ID}-c)"/>`;
    if(a2.y > 0) s += `<line x1="${ox - 9}" y1="${f1(a2.y)}" x2="${ox + 9}" y2="${f1(a2.y)}" stroke="${stopCol}" stroke-width="3"/>` + T(ox - 14, a2.y + 5, '정지', { size:12.5, anchor:'end', fill:stopCol, weight:700 });
    // 선회권 (반응 거리 뒤 우현 전타)
    const tp = turnPath(m).map(p => P({ x:p.x, y:p.y + m.react }));
    const turnCol = okTurn(m) ? 'var(--ok)' : 'var(--bad)';
    s += `<path d="${tp.map((p, i) => (i ? 'L' : 'M') + f1(p.x) + ' ' + f1(p.y)).join(' ')}" fill="none" stroke="${turnCol}" stroke-width="2.4"/>`;
    const p90 = P({ x:m.tr, y:m.react + m.adv });
    s += `<circle cx="${f1(p90.x)}" cy="${f1(p90.y)}" r="4" fill="${turnCol}"/>` + T(p90.x + 10, p90.y + 4, '90° 회두', { size:12.5, fill:turnCol, weight:700 });
    // 내 배
    const shipLen = Math.max(14, m.L/M*sc);
    s += `<g transform="translate(${ox} ${oy})">${W.parts.ship({ type:'power', len:shipLen, fill:'var(--link)' })}</g>`;
    s += T(ox - 14, oy + 4, `내 배 ${V} kn`, { size:12.5, anchor:'end', weight:600 });
    // 축척
    s += `<line x1="300" y1="456" x2="${300 + 0.5*sc}" y2="456" stroke="var(--ink)" stroke-width="2"/>` + T(300 + 0.25*sc, 448, '0.5 NM', { size:11.5, anchor:'middle', mono:true });
    plan.innerHTML = s;
  }

  function drawDiag(m){
    let s = T(14, 24, '선회권 (최대 타각, 우현)', { size:13.5, weight:700 });
    // 선회권 도식: 전진거리·횡거리·선회지름
    const box = { x:70, y:46, w:300, h:190 };
    const sc = Math.min(box.h/(m.adv + 0.02), box.w/(m.td*1.15));
    const ox = box.x + 40, oy = box.y + box.h;
    const P = p => ({ x: ox + p.x*sc, y: oy - p.y*sc });
    const tp = turnPath(m).map(P);
    s += W.parts.arrowDefs(ID+'-d', 'var(--ink-2)');
    s += `<line x1="${ox}" y1="${oy + 10}" x2="${ox}" y2="${box.y - 4}" stroke="var(--ink-3)" stroke-dasharray="4 4"/>` + T(ox - 6, box.y + 4, '원침로', { size:11.5, anchor:'end', fill:'var(--ink-3)' });
    s += `<path d="${tp.map((p, i) => (i ? 'L' : 'M') + f1(p.x) + ' ' + f1(p.y)).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2.4"/>`;
    s += `<g transform="translate(${ox} ${oy})">${W.parts.ship({ type:'power', len:20, fill:'var(--panel)' })}</g>`;
    const p90 = P({ x:m.tr, y:m.adv }), p180 = P({ x:m.td, y:m.adv - m.td/2 });
    s += `<g transform="translate(${f1(p90.x)} ${f1(p90.y)}) rotate(90)">${W.parts.ship({ type:'power', len:18, fill:'var(--panel)' })}</g>`;
    s += `<g transform="translate(${f1(p180.x)} ${f1(p180.y)}) rotate(180)">${W.parts.ship({ type:'power', len:18, fill:'var(--panel)' })}</g>`;
    const dim = (x1, y1, x2, y2) => `<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="var(--ink-2)" stroke-width="1.3" marker-start="url(#${ID}-d)" marker-end="url(#${ID}-d)"/>`;
    // 전진거리 (세로, 왼쪽)
    s += dim(ox - 26, oy, ox - 26, p90.y) + `<line x1="${ox - 32}" y1="${f1(p90.y)}" x2="${f1(p90.x)}" y2="${f1(p90.y)}" stroke="var(--ink-3)" stroke-dasharray="2 3"/>`;
    s += T(ox - 32, (oy + p90.y)/2 - 6, '전진거리', { size:12.5, anchor:'end', weight:700 }) + T(ox - 32, (oy + p90.y)/2 + 10, `${(m.adv*M/m.L).toFixed(1)}L`, { size:12, anchor:'end', mono:true, fill:'var(--ink-2)' });
    // 횡거리 (90°)
    const yT = Math.min(oy - 18, p90.y + 30);
    s += dim(ox, yT, p90.x, yT) + T((ox + p90.x)/2, yT + 18, '횡거리', { size:12.5, anchor:'middle', weight:700 });
    // 선회지름 (180°)
    const yD = oy + 2;
    s += `<line x1="${f1(p180.x)}" y1="${f1(p180.y)}" x2="${f1(p180.x)}" y2="${yD + 6}" stroke="var(--ink-3)" stroke-dasharray="2 3"/>`;
    s += dim(ox, yD, p180.x, yD) + T((ox + p180.x)/2, yD + 18, `선회지름 ${(m.td*M/m.L).toFixed(1)}L`, { size:12.5, anchor:'middle', weight:700 });
    s += T(14, 274, 'IMO 조종성능 기준: 전진거리 ≤ 4.5L · 선회지름 ≤ 5.0L · 정지거리 ≤ 15L', { size:11.5, fill:'var(--ink-2)' });

    // 필요 거리 비교 막대
    const y0 = 304;
    s += T(14, y0, '필요한 거리 vs 시정', { size:13.5, weight:700 });
    const maxD = Math.max(vis, m.needStop, m.needTurn, 0.3)*1.1;
    const X0 = 104, X1 = 404, X = d => X0 + d/maxD*(X1 - X0);
    const bar = (y, label, react, rest, ok) => {
      const col = ok ? 'var(--ok)' : 'var(--bad)';
      return T(X0 - 8, y + 13, label, { size:12.5, anchor:'end' }) +
        `<rect x="${X0}" y="${y}" width="${f1(X(react) - X0)}" height="18" fill="var(--ink-3)" opacity=".55"/>` +
        `<rect x="${f1(X(react))}" y="${y}" width="${f1(X(react + rest) - X(react))}" height="18" fill="${col}" opacity=".85"/>` +
        (X(react + rest) + 40 > X1
          ? T(X(react + rest) - 5, y + 13, (react + rest).toFixed(2), { size:12, mono:true, anchor:'end', fill:'var(--paper)', weight:700 })
          : T(X(react + rest) + 5, y + 13, (react + rest).toFixed(2), { size:12, mono:true, weight:600 }));
    };
    const yb = y0 + 30;
    s += `<line x1="${f1(X(vis))}" y1="${yb - 8}" x2="${f1(X(vis))}" y2="${yb + 54}" stroke="var(--link)" stroke-width="2"/>` +
      T(X(vis), yb + 70, `시정 ${vis.toFixed(2)}`, { size:12, anchor: X(vis) > 340 ? 'end' : 'middle', fill:'var(--link)', weight:700, mono:true });
    if(dense) s += `<line x1="${f1(X(m.avail))}" y1="${yb - 8}" x2="${f1(X(m.avail))}" y2="${yb + 54}" stroke="var(--magenta)" stroke-width="2" stroke-dasharray="4 3"/>` +
      T(X(m.avail), yb - 12, `1/2 = ${m.avail.toFixed(2)}`, { size:12, anchor:'middle', fill:'var(--magenta)', weight:700, mono:true });
    s += bar(yb, '① 90° 회두', m.react, m.adv, okTurn(m));
    s += bar(yb + 28, '② 정지', m.react, m.stop, okStop(m));
    s += `<rect x="${X0}" y="${yb + 82}" width="14" height="10" fill="var(--ink-3)" opacity=".55"/>` + T(X0 + 20, yb + 91, `반응 거리(판단·조작 ${REACT}초)`, { size:11.5, fill:'var(--ink-2)' });
    s += T(X1, yb + 91, '단위 NM', { size:11.5, anchor:'end', fill:'var(--ink-3)' });
    s += T(14, yb + 114, '① 변침으로 피하기: 시정 안에서 90° 회두를 마칠 수 있나', { size:11.5, fill:'var(--ink-2)' });
    s += T(14, yb + 132, dense ? '② 정지: 시정의 1/2 안에서 (혼잡 — 상대도 다가온다)' : '② 정지: 시정 안에서 (한산 — 앞의 물체 기준)', { size:11.5, fill:'var(--ink-2)' });
    diag.innerHTML = s;
  }

  function draw(){
    const m = model(V);
    drawPlan(m); drawDiag(m);
    st.stop(V ? m2(m.needStop) : '—'); st.adv(m2(m.adv)); st.tr(m2(m.tr)); st.td(m2(m.td));
    st.tvis(V ? N.fmtMin(vis/V) : '—');
    const mx = maxSafe(); st.max(mx ? mx + ' kn' : '0.5 kn 미만');
    const t = okTurn(m), p = okStop(m);
    if(V < 3){ ui.setVerdict(`속력이 너무 낮아 타효(키가 듣는 힘)가 떨어진다 — 느리다고 무조건 안전한 것은 아니다. 유효한 동작이 가능한 최소 속력은 유지 (제6조)`, null); return; }
    if(t && p) ui.setVerdict(`안전한 속력: ① 시정 안에서 변침으로 피할 수 있고(${m2(m.needTurn)}) ② ${m2(m.avail)} 안에서 멈출 수 있다(${m2(m.needStop)}) (제6조)`, true);
    else if(p) ui.setVerdict(`멈출 수는 있다(${m2(m.needStop)}) — 그러나 시정이 선회에 필요한 거리(${m2(m.needTurn)})보다 짧아 변침만으로는 못 피한다. 기관을 바로 쓸 수 있게 준비 (제6조·제8조(e))`, null);
    else ui.setVerdict(`안전한 속력 아님: 멈추는 데 ${m2(m.needStop)} 필요 > 쓸 수 있는 거리 ${m2(m.avail)}${t ? '' : ', 변침할 거리도 부족'} → ${mx ? mx + ' kn 이하로 ' : ''}감속 (제6조)`, false);
  }
  draw();
});

}catch(e){console.error("[load] src/sims/safe-speed.js", e)}
</script>
<script>/* src/sims/sail-judge.js */
try{
/* 제12조 범선 — 바람 방향·침로를 바꿔 택(좌현택/우현택), 풍상·풍하, 피항선 판정 */
W.sim('sail-judge', (el) => {
  const N = W.nav;
  const ui = W.ui.box(el, {
    title: '범선 두 척: 누가 피해야 하나?', kind: '해보기',
    caption: '바람 다이얼(왼쪽 위)이나 배를 끌어 보세요. 붐(주범)은 바람을 받는 반대쪽, 즉 <b>풍하 쪽</b>에 펼쳐진다. ' +
      '제12조(b): <b>풍상 쪽 = 주범이 펼쳐진 쪽의 반대쪽</b>. 바람을 좌현에 받으면 좌현택, 우현에 받으면 우현택. ' +
      '두 범선이 충돌의 위험이 있을 정도로 접근한다고 가정한다(서로 보이고 + 충돌의 위험).'
  });
  const VW = 520, VH = 420;
  const svg = W.svg('svg', { viewBox: `0 0 ${VW} ${VH}`, role: 'img', 'aria-label': '두 범선과 바람 방향', style: 'touch-action:none;max-width:720px;margin:0 auto' });
  ui.stage.append(svg);

  const st = {
    wind: 0,
    boats: [
      { name: 'A', x: 165, y: 300, hdg: 45, boom: 'stbd' },
      { name: 'B', x: 360, y: 290, hdg: 315, boom: 'port' }
    ],
    unknown: false,     // A가 B의 택을 확인할 수 없음 (제12조(a)(iii))
    quiz: null          // {answer:'A'|'B', picked}
  };

  /* ---------- 계산 ---------- */
  const NOGO = 40, RUN = 165;
  function trim(b){
    const rw = N.signed(st.wind - b.hdg);          // + : 바람이 우현에서
    b.rw = rw;
    b.irons = Math.abs(rw) < NOGO;
    b.running = Math.abs(rw) >= RUN;
    if(!b.irons && !b.running) b.boom = rw > 0 ? 'port' : 'stbd';   // 주범은 바람 반대쪽
    // 택: 바람을 받는 현 = 주범 반대쪽 (제12조(b))
    b.tack = b.irons ? null : (b.boom === 'port' ? 'stbd' : 'port');
    const mag = b.irons ? 0 : Math.min(85, 22 + (Math.abs(rw) - NOGO) / (180 - NOGO) * 63);
    b.boomAng = b.boom === 'port' ? -mag : mag;     // ship 부품: + = 우현 쪽
  }
  const up = () => ({ x: Math.sin(N.rad(st.wind)), y: -Math.cos(N.rad(st.wind)) });  // 화면좌표에서 바람이 불어오는 쪽
  const upw = b => { const u = up(); return b.x*u.x + b.y*u.y; };

  function judge(){
    const [A, B] = st.boats;
    st.boats.forEach(trim);
    const tk = t => t === 'port' ? '좌현택' : '우현택';
    if(A.irons || B.irons){
      const who = [A, B].filter(b => b.irons).map(b => b.name).join('·');
      return { warn: true, text: `범선 ${who}가 바람을 거의 정면으로 받아 돛이 펄럭인다 — 범선은 바람 쪽으로 약 40~45°보다 가까이 갈 수 없다. 바람이나 침로를 바꿔 보세요.` };
    }
    const d = upw(A) - upw(B);
    const windward = Math.abs(d) < 6 ? null : (d > 0 ? 'A' : 'B');
    const leeward = windward ? (windward === 'A' ? 'B' : 'A') : null;
    if(st.unknown && A.tack === 'port' && windward === 'B'){
      return { giveway: 'A', windward, rule: '제12조(a)(iii)',
        text: `피항선: A — 좌현택 A가 풍상 쪽의 B를 보았으나 B의 택을 확인할 수 없으므로 A가 피한다 (제12조(a)(iii)). 실제 B는 ${tk(B.tack)}.` };
    }
    const note = st.unknown ? ' ※ (iii)은 좌현택 A가 풍상 쪽 B를 볼 때만 해당 — 지금은 실제 택으로 판정.' : '';
    if(A.tack !== B.tack){
      const g = A.tack === 'port' ? 'A' : 'B';
      return { giveway: g, windward, rule: '제12조(a)(i)',
        text: `피항선: ${g} — 서로 다른 현에 바람을 받으므로 좌현에 바람을 받는(좌현택) ${g}가 피한다 (제12조(a)(i)).${note}` };
    }
    if(!windward) return { warn: true, windward, text: `둘 다 ${tk(A.tack)}인데 풍상·풍하 위치가 거의 같다 — 배를 바람 방향으로 조금 옮겨 보세요.` };
    return { giveway: windward, windward, rule: '제12조(a)(ii)',
      text: `피항선: ${windward} — 둘 다 ${tk(A.tack)}(같은 현에 바람)이므로 풍상 쪽 ${windward}가 풍하 쪽 ${leeward}를 피한다 (제12조(a)(ii)).${note}` };
  }

  /* ---------- 그리기 ---------- */
  const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.fs||13}" font-family="${o.mono?'var(--f-mono)':'var(--f-body)'}" font-weight="${o.w||500}" text-anchor="${o.a||'middle'}" fill="${o.fill||'var(--ink)'}" stroke="var(--sea)" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">${s}</text>`;
  const DIAL = { x: 62, y: 78, r: 46 };

  function streaks(){
    // 바람 방향을 나타내는 잔물결 선 (바람이 불어가는 방향으로)
    let s = '';
    const a = N.rad(st.wind), dx = -Math.sin(a), dy = Math.cos(a);
    for(let i = 0; i < 8; i++) for(let j = 0; j < 7; j++){
      const x = 30 + i*68 + (j%2)*34, y = 30 + j*64;
      s += `<line x1="${x-dx*14}" y1="${y-dy*14}" x2="${x+dx*14}" y2="${y+dy*14}"  stroke="var(--ink-3)" stroke-opacity=".22" stroke-width="1.2" stroke-linecap="round"/>`;
    }
    return s;
  }

  function dial(){
    const { x, y, r } = DIAL, a = N.rad(st.wind);
    let s = `<g transform="translate(${x} ${y})" style="cursor:grab" data-drag="wind">`;
    s += `<circle r="${r}" fill="var(--panel)" fill-opacity=".85" stroke="var(--ink-3)"/>`;
    for(let d = 0; d < 360; d += 30){ const q = N.rad(d); s += `<line x1="${Math.sin(q)*r}" y1="${-Math.cos(q)*r}" x2="${Math.sin(q)*(r-6)}" y2="${-Math.cos(q)*(r-6)}" stroke="var(--ink-3)"/>`; }
    s += `<text x="0" y="${-r-5}" font-size="12" text-anchor="middle" font-family="var(--f-mono)" fill="var(--ink-2)">N</text>`;
    // 바람 화살: 불어오는 쪽 가장자리에서 중심 반대편으로
    const x1 = Math.sin(a)*(r-4), y1 = -Math.cos(a)*(r-4), x2 = -Math.sin(a)*(r-16), y2 = Math.cos(a)*(r-16);
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--link)" stroke-width="3" marker-end="url(#sjArr)"/>`;
    s += `<circle cx="${x1}" cy="${y1}" r="7" fill="var(--link)"/>`;
    s += `</g>`;
    s += T(x, y + r + 20, `바람 ${N.fmtDeg(st.wind)}에서`, { fs: 15, w: 700, mono: false });
    return s;
  }

  function sailPath(b, L){
    // 마스트(0,-L*.075)에서 붐 끝까지, 풍하 쪽으로 볼록한 돛
    const h = L/2, mx = 0, my = -h*.15, a = N.rad(b.boomAng), len = L*.55;
    const ex = Math.sin(a)*len, ey = my + Math.cos(a)*len;
    const nx = Math.cos(a), ny = -Math.sin(a);              // 붐에 수직
    const side = b.boomAng >= 0 ? 1 : -1, belly = b.irons ? 0 : len*.22;
    const cx = (mx+ex)/2 + nx*belly*side, cy = (my+ey)/2 + ny*belly*side;
    return `<path d="M${mx} ${my} Q ${cx} ${cy} ${ex} ${ey} Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/>`;
  }

  function boat(b, res, hideInfo){
    const L = 84;
    const role = res.giveway ? (res.giveway === b.name ? 'giveway' : 'standon') : null;
    const showRole = role && !hideInfo;
    const hidden = st.unknown && b.name === 'B';
    let s = '';
    // 진행 방향 점선
    const hx = Math.sin(N.rad(b.hdg)), hy = -Math.cos(N.rad(b.hdg));
    s += `<line x1="${b.x+hx*36}" y1="${b.y+hy*36}" x2="${b.x+hx*140}" y2="${b.y+hy*140}" stroke="var(--ink-3)" stroke-dasharray="4 5" stroke-width="1.3"/>`;
    s += `<g transform="translate(${b.x} ${b.y}) rotate(${b.hdg})" style="cursor:move" data-drag="${b.name}">`;
    s += `<circle r="${L*.62}" fill="transparent"/>`;
    s += W.parts.ship({ type: 'sail', len: L, role: showRole ? role : null, boom: b.boomAng });
    s += hidden ? `<g opacity=".25">${sailPath(b, L)}</g>` : sailPath(b, L);
    s += `</g>`;
    if(hidden) s += T(b.x, b.y + 5, '?', { fs: 22, w: 700, fill: 'var(--magenta)' });
    // 이름표 (회전하지 않음)
    const cands = hy > 0.3 ? [b.y - 66, b.y + 56] : [b.y + 56, b.y - 66];
    let lx = Math.max(90, Math.min(VW - 90, b.x)), ly = cands.find(v => v > 24 && v < VH - 34);
    if(ly == null){ ly = b.y; lx = b.x + (hx > 0 ? -1 : 1)*100; lx = Math.max(90, Math.min(VW - 90, lx)); }
    const col = showRole ? (role === 'giveway' ? 'var(--giveway)' : 'var(--standon)') : 'var(--ink)';
    s += T(lx, ly, b.name, { fs: 21, w: 700, fill: col });
    if(!hideInfo && b.tack){
      const tk = hidden ? 'A가 택 확인 불가' : (b.tack === 'port' ? '좌현택' : '우현택');
      const ww = res.windward ? (res.windward === b.name ? ' · 풍상' : ' · 풍하') : '';
      const rl = showRole ? (role === 'giveway' ? ' · 피항선' : ' · 유지선') : '';
      s += T(lx, ly + 20, tk + ww + rl, { fs: 15, w: 600, fill: col });
    }
    return s;
  }

  function windwardLines(res, hideInfo){
    // 같은 택일 때: 바람에 수직인 기준선으로 풍상·풍하 위치 보여 주기
    const [A, B] = st.boats;
    if(hideInfo || !res.windward || A.tack !== B.tack) return '';
    const a = N.rad(st.wind), px = Math.cos(a), py = Math.sin(a);   // 바람에 수직
    let s = '';
    st.boats.forEach(b => {
      const w = res.windward === b.name;
      s += `<line x1="${b.x-px*900}" y1="${b.y-py*900}" x2="${b.x+px*900}" y2="${b.y+py*900}" stroke="${w ? 'var(--magenta)' : 'var(--ink-3)'}" stroke-opacity=".55" stroke-dasharray="2 6" stroke-width="1.5"/>`;
    });
    return s;
  }

  function draw(){
    const res = judge();
    const hideInfo = st.quiz && !st.quiz.picked;
    svg.innerHTML = W.parts.arrowDefs('sjArr', 'var(--link)') + streaks() + windwardLines(res, hideInfo) +
      st.boats.map(b => boat(b, res, hideInfo)).join('') + dial() +
      T(VW - 10, VH - 10, '배를 끌어 옮기기 · 다이얼로 바람 바꾸기', { fs: 13, a: 'end', fill: 'var(--ink-2)' });
    const [A, B] = st.boats;
    const tk = b => b.irons ? '맞바람(범주 불가)' : (b.tack === 'port' ? '좌현택 — 바람을 좌현에' : '우현택 — 바람을 우현에') + (b.running ? ' (순풍: 주범 쪽으로 판정)' : '');
    setA(hideInfo ? '?' : tk(A)); setB(hideInfo ? '?' : (st.unknown ? '확인 불가 (실제: ' + tk(B) + ')' : tk(B)));
    setW(hideInfo ? '?' : (res.windward || '—'));
    gybeBtn.disabled = !(A.running || B.running);
    if(st.quiz && !st.quiz.picked){ ui.setVerdict('누가 피해야 할까? 붐(주범)이 어느 쪽에 있는지 보고 아래에서 고르세요.'); return; }
    if(st.quiz && st.quiz.picked){
      const ok = st.quiz.picked === res.giveway;
      ui.setVerdict((ok ? '정답! ' : '아쉽다. ') + res.text, ok);
      return;
    }
    ui.setVerdict(res.text, res.warn ? undefined : undefined);
  }

  /* ---------- 컨트롤 ---------- */
  const sWind = W.ui.range(ui.controls, { label: '바람(불어오는 방향)', min: 0, max: 355, step: 5, value: st.wind, fmt: v => N.fmtDeg(v), oninput: v => { st.wind = v; endQuiz(); draw(); } });
  const sA = W.ui.range(ui.controls, { label: 'A 침로', min: 0, max: 355, step: 5, value: st.boats[0].hdg, fmt: v => N.fmtDeg(v), oninput: v => { st.boats[0].hdg = v; endQuiz(); draw(); } });
  const sB = W.ui.range(ui.controls, { label: 'B 침로', min: 0, max: 355, step: 5, value: st.boats[1].hdg, fmt: v => N.fmtDeg(v), oninput: v => { st.boats[1].hdg = v; endQuiz(); draw(); } });
  const unk = W.ui.seg(ui.controls, [{ value: false, label: '확인 가능' }, { value: true, label: '확인 불가' }], false, v => { st.unknown = v; endQuiz(); draw(); }, 'A가 본 B의 택');
  const gybeBtn = W.ui.btn(ui.controls, '순풍일 때 붐 넘기기(자이브)', () => {
    st.boats.forEach(b => { if(b.running) b.boom = b.boom === 'port' ? 'stbd' : 'port'; });
    endQuiz(); draw();
  });
  W.ui.btn(ui.controls, '문제 만들기', makeQuiz, 'primary');
  const ansRow = W.h('div', { style: { display: 'none', gap: '8px', flexWrap: 'wrap', width: '100%' } });
  ui.controls.append(ansRow);
  ['A', 'B'].forEach(n => W.ui.btn(ansRow, `${n}가 피한다`, () => { if(st.quiz && !st.quiz.picked){ st.quiz.picked = n; ansRow.style.display = 'none'; draw(); } }));

  const setA = W.ui.stat(ui.readout, 'A');
  const setB = W.ui.stat(ui.readout, 'B');
  const setW = W.ui.stat(ui.readout, '풍상 쪽');

  function endQuiz(){ if(st.quiz){ st.quiz = null; ansRow.style.display = 'none'; } }
  function syncSliders(){ sWind.set(st.wind); sA.set(st.boats[0].hdg); sB.set(st.boats[1].hdg); unk.set(st.unknown); }

  function makeQuiz(){
    const rnd = (a, b) => a + Math.random()*(b - a);
    const wantSame = Math.random() < 0.5;   // 같은 택(풍상·풍하) 문제와 다른 택 문제를 반반
    for(let tries = 0; tries < 2000; tries++){
      st.wind = Math.round(rnd(0, 360)/15)*15 % 360;
      const P = { x: rnd(VW/2 - 30, VW/2 + 40), y: rnd(190, 240) };
      const ang1 = rnd(0, 360), ang2 = ang1 + rnd(70, 290);
      const d1 = rnd(130, 175), d2 = rnd(130, 175);
      const place = (ang, d) => ({ x: P.x + Math.sin(N.rad(ang))*d, y: P.y - Math.cos(N.rad(ang))*d });
      const p1 = place(ang1, d1), p2 = place(ang2, d2);
      const inside = p => p.x > 60 && p.x < VW - 60 && p.y > 95 && p.y < VH - 95 && !(p.x < 210 && p.y < 200);
      if(!inside(p1) || !inside(p2) || Math.hypot(p1.x-p2.x, p1.y-p2.y) < 140) continue;
      const toP = p => Math.round(N.norm(N.deg(Math.atan2(P.x - p.x, -(P.y - p.y))) + rnd(-8, 8))/5)*5 % 360;
      const h1 = toP(p1), h2 = toP(p2);
      const ok = h => { const r = Math.abs(N.signed(st.wind - h)); return r >= 55 && r <= 155; };
      if(!ok(h1) || !ok(h2)) continue;
      if((Math.sign(N.signed(st.wind - h1)) === Math.sign(N.signed(st.wind - h2))) !== wantSame && tries < 1500) continue;
      Object.assign(st.boats[0], p1, { hdg: h1 });
      Object.assign(st.boats[1], p2, { hdg: h2 });
      const d = upw(st.boats[0]) - upw(st.boats[1]);
      if(Math.abs(d) < 25) continue;   // 풍상·풍하가 분명하도록
      break;
    }
    st.unknown = false;
    st.quiz = { picked: null };
    ansRow.style.display = 'flex';
    syncSliders(); draw();
  }

  /* ---------- 드래그 ---------- */
  let drag = null;
  const pt = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  svg.addEventListener('pointerdown', e => {
    const t = e.target.closest('[data-drag]'); if(!t) return;
    const k = t.getAttribute('data-drag'), p = pt(e);
    if(k === 'wind') drag = { k };
    else { const b = st.boats.find(q => q.name === k); drag = { k, b, dx: b.x - p.x, dy: b.y - p.y }; }
    svg.setPointerCapture(e.pointerId); e.preventDefault(); if(k === 'wind') move(e);
  });
  const move = e => {
    if(!drag) return;
    const p = pt(e);
    if(drag.k === 'wind'){
      st.wind = Math.round(N.norm(N.deg(Math.atan2(p.x - DIAL.x, -(p.y - DIAL.y))))/5)*5 % 360;
    } else {
      drag.b.x = Math.max(30, Math.min(VW - 30, p.x + drag.dx));
      drag.b.y = Math.max(30, Math.min(VH - 30, p.y + drag.dy));
    }
    endQuiz(); syncSliders(); draw();
  };
  svg.addEventListener('pointermove', move);
  const stop = () => { drag = null; };
  svg.addEventListener('pointerup', stop); svg.addEventListener('pointercancel', stop);

  draw();
});

}catch(e){console.error("[load] src/sims/sail-judge.js", e)}
</script>

    { k:'B', name:'배타적 경제수역(EEZ)', x:478, y:262, conn:true, nav:true, ok:true,
      why:'EEZ(기선에서 200해리)는 어업 등 경제적 권리를 나누는 경계일 뿐 항법과는 관계없다. 공해와 이어져 있고 해양항행선이 다니므로 적용된다. (한·중, 한·일처럼 400해리가 안 되면 공해 없이 EEZ가 겹친다.)' },
    { k:'C', name:'접속수역', x:396, y:312, conn:true, nav:true, ok:true,
      why:'접속수역(기선에서 24해리)은 관세·출입국·위생 등 일부 국내법만 미치는 수역이다. 항법에는 영향이 없고, 공해와 이어져 해양항행선이 다니므로 적용된다.' },

    { k:'E', name:'항만 (방파제 안 무역항)', x:194, y:229, conn:true, nav:true, ok:true, sp:true,
      why:'기선 안쪽의 내수(영해가 아님)이지만 공해와 이어져 있고 해양항행선이 드나들므로 적용된다. 다만 관할 당국이 정한 특별규칙(우리나라는 선박입출항법)이 있으면 그 시행을 방해하지 않으므로 특별규칙이 먼저 적용된다(제1조(b)).' },
    { k:'F', name:'하천 하류 (수중보 아래)', x:196, y:146, conn:true, nav:true, ok:true,
      why:'하천이라도 해양항행선이 올라올 수 있는 곳까지는 적용된다. 한강은 수중보 아래까지 적용된다. (여의도까지 상선이 들어오게 하려던 계획이 실현됐다면 그곳까지 적용됐을 것이다.)' },
    { k:'G', name:'하천 상류 (수중보 위)', x:98, y:116, conn:true, nav:false, ok:false, star:true,

    { k:'J', name:'운하 (해양항행선 통항, 수에즈·파나마형)', x:120, y:342, conn:true, nav:true, ok:true, sp:true,
      why:'바다와 바다를 잇고 해양항행선이 통항하는 운하는 "공해와 연결되어 해양항행선이 항행할 수 있는 수역"이므로 적용된다. 운하 당국이 정한 통항 규칙 같은 특별규칙은 제1조(b)에 따라 그 시행이 보장된다(내수로 inland waterways).' }
  ];

  let sel = 6, showAll = false;

  /* 버튼 */
  const btnWrap = W.h('div', { style:{ display:'flex', flexWrap:'wrap', gap:'6px', width:'100%' } });
  ui.controls.append(btnWrap);
  const btns = ITEMS.map((it, i) => { const b = W.ui.btn(btnWrap, `${it.k} ${it.name}`, () => { sel = i; draw(); }); b.style.fontSize = '13px'; return b; });
  const allSeg = W.ui.seg(ui.controls, [{value:false,label:'선택한 곳만'},{value:true,label:'전체 판정 보기'}], false, v => { showAll = v; draw(); }, '그림 표시');

  const sConn = W.ui.stat(ui.readout, '① 공해이거나 공해와 연결');
  const sNav = W.ui.stat(ui.readout, '② 해양항행선이 항행 가능');

    s += `<rect x="262" y="${top}" width="98" height="${H-top}" fill="var(--sea-deep)" opacity=".35"/>`;
    s += `<rect x="360" y="${top}" width="70" height="${H-top}" fill="var(--sea-deep)" opacity=".6"/>`;
    s += `<rect x="430" y="${top}" width="160" height="${H-top}" fill="var(--sea-deep)" opacity=".85"/>`;
    s += `<rect x="590" y="${top}" width="90" height="${H-top}" fill="var(--sea-deep)"/>`;
    /* 육지 */
    s += `<path d="M0 ${top} L214 ${top} C232 92, 206 122, 226 152 C246 186, 214 214, 232 250 C250 292, 222 318, 238 ${H} L0 ${H} Z" fill="var(--land)" stroke="var(--ink-3)" stroke-width="1.2"/>`;
    /* 섬 + 직선기선 */
    s += `<path d="M254 78 q8 -12 18 -2 q6 10 -6 14 q-12 2 -12 -12z" fill="var(--land)" stroke="var(--ink-3)"/>`;
    s += `<path d="M250 318 q10 -10 18 0 q4 10 -8 12 q-12 0 -10 -12z" fill="var(--land)" stroke="var(--ink-3)"/>`;
    s += `<path d="M236 ${top} L262 84 L259 322 L246 ${H}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="7 4"/>`;
    /* 항만: 육지를 파낸 내항 + 방파제 */
    s += `<path d="M228 204 L176 204 L176 252 L234 252 Z" fill="var(--sea)" stroke="var(--ink-3)"/>`;
    s += `<path d="M226 200 L246 214 M236 256 L250 238" stroke="var(--ink-2)" stroke-width="4" stroke-linecap="round"/>`;
    s += T(158, 270, '항만', {s:12, c:'var(--ink-2)'});
    /* 하천 (하구 → 수중보 → 상류 → 댐 → 인공호) */
    s += `<path d="M230 152 C200 150, 182 138, 160 136 C138 134, 128 124, 104 118 C84 113, 70 100, 58 86" fill="none" stroke="var(--sea-deep)" stroke-width="12" stroke-linecap="round"/>`;
    s += `<path d="M230 152 C200 150, 182 138, 160 136 C138 134, 128 124, 104 118 C84 113, 70 100, 58 86" fill="none" stroke="var(--sea)" stroke-width="8" stroke-linecap="round"/>`;
    s += `<line x1="148" y1="125" x2="144" y2="146" stroke="var(--ink)" stroke-width="3.5"/>`;
    s += T(146, 166, '수중보', {s:12, c:'var(--ink-2)'});
    s += `<ellipse cx="40" cy="70" rx="30" ry="15" fill="var(--sea)" stroke="var(--ink-3)"/>`;

    /* 경계선 */
    [[360,'12해리'],[430,'24해리'],[590,'200해리']].forEach(([x, t]) => {
      s += `<line x1="${x}" y1="${top-8}" x2="${x}" y2="${H}" stroke="var(--ink-2)" stroke-width="1.2" stroke-dasharray="5 4"/>`;
