<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 | BYPASS</title>
<meta name="description" content="BYPASS 사이트 로그인.">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/bypass.css">
</head>
<body>

<a class="skip" href="#main">본문 바로가기</a>

<header class="site-head">
  <div class="wrap">
    <a class="brand" href="/" aria-label="BYPASS 처음으로">
      <svg class="brand-mark" viewBox="1 1 130 130" aria-hidden="true">
        <path d="M66 4 L128 66 L66 128 L4 66 Z" fill="#EE6A1F" stroke="#1C211E" stroke-width="5" stroke-linejoin="round"/>
        <path d="M66 15 L117 66 L66 117 L15 66 Z" fill="none" stroke="#1C211E" stroke-width="5" stroke-linejoin="round"/>
        <g transform="translate(34 32) scale(0.64)" fill="#1C211E">
        <ellipse cx="44" cy="60" rx="27" ry="23"/>
        <path d="M51 45 C55 37 58 31 61 25 L72 30 C68 36 66 44 64 53 Z"/>
        <circle cx="66" cy="26" r="10"/>
        <path d="M72 20 C83 19 93 24 95 32 C96 38 91 41 88 37 C86 34 82 33 74 33 Z"/>
        <path d="M19 52 C10 47 7 40 11 34 C14 43 20 46 23 46 Z"/>
        <path d="M37 80 L35 92 L27 95 L41 95 L42 81 Z"/>
        <path d="M51 80 L51 92 L44 95 L58 95 L56 81 Z"/>
        <circle cx="68" cy="23.5" r="2" fill="#EE6A1F"/>
        <path d="M32 55 C40 50 51 54 54 64" fill="none" stroke="#EE6A1F" stroke-width="2.6" stroke-linecap="round"/>
        </g>
      </svg>
      <span>
        <span class="brand-name">BYPASS</span>
        <span class="brand-sub">느린 시스템의 실용적 대안 마련국</span>
      </span>
    </a>
    <div class="head-actions">
      <a class="head-pill" href="/join/">회원가입</a>
    </div>
  </div>
</header>

<main id="main" class="auth-main">
  <div class="wrap">
    <section class="panel" aria-labelledby="page-title">
      <div class="panel-head on-green">
        <p class="panel-code">BYPASS 회원 안내</p>
        <h1 id="page-title">로그인</h1>
      </div>
      <div class="panel-body">
        <form id="login-form" novalidate>
          <label class="field-label" for="f-id" style="margin-top:4px">아이디</label>
          <input class="input" id="f-id" name="username" type="text" required maxlength="20"
                 autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">

          <label class="field-label" for="f-pw">비밀번호</label>
          <div class="pw">
            <input class="input" id="f-pw" name="password" type="password" required autocomplete="current-password">
            <button type="button" class="pw-toggle" data-pw-toggle aria-controls="f-pw" aria-pressed="false">보기</button>
          </div>

          <p class="form-error" role="alert" hidden></p>
          <div class="form-actions"><button type="submit" class="btn btn-primary">로그인</button></div>
          <p class="hint" style="margin-top:14px;text-align:center">비밀번호를 잊으셨다면 운영진에게 문의해 주세요.<br>비밀번호 찾기는 아직 지름길이 개통되지 않았습니다.</p>
        </form>
        <p class="panel-alt">아직 회원이 아니신가요? <a href="/join/">회원가입</a></p>
      </div>
    </section>
  </div>
</main>

<footer class="site-foot">
  <div class="wrap">
    <p class="foot-name"><strong>BYPASS</strong>느린 시스템의 실용적 대안 마련국</p>
    <p class="foot-note">본 사이트는 BYPASS 크루가 운영하며, 국립목포해양대학교 행정 부서 및 정부 기관과 무관합니다.</p>
  </div>
</footer>

<script src="/assets/vendor/supabase-js-2.117.2.js"></script>
<script src="/assets/auth.js"></script>
<script>
(async function () {
  const B = window.BYPASS;
  const form = document.getElementById('login-form');
  const idInput = document.getElementById('f-id');
  const pwInput = document.getElementById('f-pw');
  const errorBox = form.querySelector('.form-error');
  const submit = form.querySelector('[type="submit"]');
  const next = B.safeNext(new URLSearchParams(location.search).get('next'), '/community/');

  B.bindPasswordToggles(form);

  function showError(text, field) {
    errorBox.textContent = text;
    errorBox.hidden = false;
    if (field) { field.setAttribute('aria-invalid', 'true'); field.focus(); }
  }

  if (!B.sb) { showError(B.unavailableText); submit.disabled = true; return; }

  // 이미 로그인한 사람은 바로 이동
  const { data: { session } } = await B.sb.auth.getSession();
  if (session) { location.replace(next); return; }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errorBox.hidden = true;
    [idInput, pwInput].forEach(f => f.removeAttribute('aria-invalid'));

    const id = B.normalizeId(idInput.value);
    const pw = pwInput.value;
    if (!id && !pw) {
      idInput.setAttribute('aria-invalid', 'true');
      showError('필수 항목이 누락되었습니다. 본 국도 이 문구를 쓰게 되어 유감입니다.', pwInput);
      idInput.focus();
      return;
    }
    if (!id) { showError('아이디를 입력해 주세요.', idInput); return; }
    if (!pw) { showError('비밀번호를 입력해 주세요.', pwInput); return; }

    B.setBusy(submit, true, '확인 중…');
    let result;
    try {
      result = await B.sb.auth.signInWithPassword({ email: B.idToEmail(id), password: pw });
    } catch (err) {
      result = { error: err };
    }
    if (result.error) {
      B.setBusy(submit, false);
      pwInput.value = '';
      showError(B.errorText(result.error, 'login'), result.error.code === 'invalid_credentials' ? pwInput : null);
      return;
    }
    location.replace(next);
  });
})();
</script>
<script src="/assets/track.js" defer></script>
</body>
</html>
